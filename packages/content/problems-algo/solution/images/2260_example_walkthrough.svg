<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：cards = [3, 4, 2, 3, 4, 7]</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">逐张扫描，查 last 表找同值上次下标，算跨度 i − last + 1 取最小</text>

  <!-- ===== Table header ===== -->
  <!-- columns: 步 | i | cards[i] | last 中同值下标 | 距离 i−last+1 | ans -->
  <!-- x: 50, 100, 155, 265, 380, 470 -->
  <rect x="36" y="54" width="488" height="28" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50" y="72" text-anchor="start" font-size="11" fill="#fff" font-weight="bold">步</text>
  <text x="100" y="72" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">i</text>
  <text x="155" y="72" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">cards[i]</text>
  <text x="265" y="72" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">last 中同值下标</text>
  <text x="380" y="72" text-anchor="middle" font-size="10.5" fill="#fff" font-weight="bold">距离 i−last+1</text>
  <text x="470" y="72" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">ans</text>

  <!-- column separators -->
  <line x1="78" y1="54" x2="78" y2="298" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="122" y1="54" x2="122" y2="298" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="190" y1="54" x2="190" y2="298" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="330" y1="54" x2="330" y2="298" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="430" y1="54" x2="430" y2="298" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 0: i=0, card=3, no -->
  <rect x="36" y="82" width="488" height="34" fill="#f4f7fb" stroke="none"/>
  <text x="50" y="104" font-size="12" fill="#333" font-weight="bold">0</text>
  <text x="100" y="104" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <text x="155" y="104" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
  <text x="265" y="104" text-anchor="middle" font-size="12" fill="#999">—（无）</text>
  <text x="380" y="104" text-anchor="middle" font-size="12" fill="#999">—</text>
  <text x="470" y="104" text-anchor="middle" font-size="12" fill="#999">∞</text>

  <!-- row 1: i=1, card=4, no -->
  <rect x="36" y="116" width="488" height="34" fill="#fff" stroke="none"/>
  <text x="50" y="138" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="100" y="138" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="155" y="138" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">4</text>
  <text x="265" y="138" text-anchor="middle" font-size="12" fill="#999">—（无）</text>
  <text x="380" y="138" text-anchor="middle" font-size="12" fill="#999">—</text>
  <text x="470" y="138" text-anchor="middle" font-size="12" fill="#999">∞</text>

  <!-- row 2: i=2, card=2, no -->
  <rect x="36" y="150" width="488" height="34" fill="#f4f7fb" stroke="none"/>
  <text x="50" y="172" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="100" y="172" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="155" y="172" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <text x="265" y="172" text-anchor="middle" font-size="12" fill="#999">—（无）</text>
  <text x="380" y="172" text-anchor="middle" font-size="12" fill="#999">—</text>
  <text x="470" y="172" text-anchor="middle" font-size="12" fill="#999">∞</text>

  <!-- row 3: i=3, card=3, last[3]=0, dist=4, HIGHLIGHTED -->
  <rect x="36" y="184" width="488" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="50" y="206" font-size="12" fill="#d6a040" font-weight="bold">3</text>
  <text x="100" y="206" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
  <text x="155" y="206" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <text x="265" y="206" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <text x="380" y="206" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3−0+1 = 4</text>
  <text x="470" y="206" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">4</text>

  <!-- row 4: i=4, card=4, last[4]=1, dist=4 -->
  <rect x="36" y="218" width="488" height="34" fill="#f4f7fb" stroke="none"/>
  <text x="50" y="240" font-size="12" fill="#333" font-weight="bold">4</text>
  <text x="100" y="240" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <text x="155" y="240" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">4</text>
  <text x="265" y="240" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <text x="380" y="240" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">4−1+1 = 4</text>
  <text x="470" y="240" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4（不变）</text>

  <!-- row 5: i=5, card=7, no -->
  <rect x="36" y="252" width="488" height="34" fill="#fff" stroke="none"/>
  <text x="50" y="274" font-size="12" fill="#333" font-weight="bold">5</text>
  <text x="100" y="274" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <text x="155" y="274" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">7</text>
  <text x="265" y="274" text-anchor="middle" font-size="12" fill="#999">—（无）</text>
  <text x="380" y="274" text-anchor="middle" font-size="12" fill="#999">—</text>
  <text x="470" y="274" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4</text>

  <!-- table outer border -->
  <rect x="36" y="54" width="488" height="244" fill="none" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- annotation for step 3 -->
  <path d="M 500 200 Q 524 200 524 184" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="524" y="180" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">首次命中</text>
  <text x="524" y="166" text-anchor="middle" font-size="9.5" fill="#888">ans 4</text>

  <!-- ===== Key recurrence box ===== -->
  <rect x="40" y="310" width="480" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="332" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">命中即更新 ans = min(ans, i − last[cards[i]] + 1)；随后覆盖 last[cards[i]] = i</text>

  <!-- ===== last map evolution ===== -->
  <text x="40" y="366" font-size="11" fill="#444" font-weight="bold">last 映射演化（覆盖更新，每值只留最近下标）：</text>

  <!-- step0 -->
  <rect x="40" y="374" width="76" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="78" y="388" text-anchor="middle" font-size="9" fill="#888">步0 后</text>
  <text x="78" y="400" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">{3:0}</text>

  <!-- step1 -->
  <rect x="124" y="374" width="92" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="388" text-anchor="middle" font-size="9" fill="#888">步1 后</text>
  <text x="170" y="400" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">{3:0, 4:1}</text>

  <!-- step2 -->
  <rect x="224" y="374" width="108" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="278" y="388" text-anchor="middle" font-size="9" fill="#888">步2 后</text>
  <text x="278" y="400" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">{3:0,4:1,2:2}</text>

  <!-- step3: 3 overwritten -->
  <rect x="340" y="374" width="108" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="394" y="388" text-anchor="middle" font-size="9" fill="#888">步3 后（3 覆盖）</text>
  <text x="394" y="400" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">{3:3,4:1,2:2}</text>

  <!-- step4: 4 overwritten -->
  <rect x="40" y="412" width="108" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="94" y="426" text-anchor="middle" font-size="9" fill="#888">步4 后（4 覆盖）</text>
  <text x="94" y="438" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">{3:3,4:4,2:2}</text>

  <!-- step5 -->
  <rect x="156" y="412" width="124" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="426" text-anchor="middle" font-size="9" fill="#888">步5 后</text>
  <text x="218" y="438" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">{3:3,4:4,2:2,7:5}</text>

  <!-- footer note -->
  <text x="300" y="426" font-size="10.5" fill="#666">→ 同值出现只留最近下标，</text>
  <text x="300" y="440" font-size="10.5" fill="#666">覆盖不丢更优解（见正文 2.2）</text>

  <!-- footer answer -->
  <text x="280" y="455" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">答案 = 4（拿起 [3,4,2,3] 或 [4,2,3,4] 均含一对匹配）</text>
</svg>
