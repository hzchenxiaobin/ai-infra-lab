<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">所有路径都到终点 = 没有坏死胡同 + 没有可绕无穷圈的环</text>

  <!-- ===== Left panel: dead-end failure ===== -->
  <rect x="24" y="48" width="250" height="170" fill="none" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" rx="8" filter="url(#rough2)"/>
  <text x="149" y="66" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">失败①：坏死胡同</text>

  <!-- edges 0->1, 0->2 -->
  <path d="M 78 138 L 196 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 78 158 L 196 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- node 0 source -->
  <circle cx="60" cy="148" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="60" y="153" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <text x="60" y="184" text-anchor="middle" font-size="9" fill="#446688">source</text>

  <!-- node 1 dead-end (bad) -->
  <circle cx="218" cy="90" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="218" y="95" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="246" y="76" font-size="9" fill="#b85450" font-weight="bold">无出边</text>
  <text x="246" y="88" font-size="9" fill="#b85450" font-weight="bold">≠ dest</text>

  <!-- node 2 destination -->
  <circle cx="218" cy="202" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="218" y="207" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="246" y="206" font-size="9" fill="#4a7a3a" font-weight="bold">dest ✓</text>

  <text x="149" y="206" text-anchor="middle" font-size="10" fill="#b85450">路径 0→1 走到死胡同却不是终点</text>

  <!-- ===== Right panel: cycle failure ===== -->
  <rect x="286" y="48" width="250" height="170" fill="none" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" rx="8" filter="url(#rough2)"/>
  <text x="411" y="66" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">失败②：可绕无穷圈的环</text>

  <!-- edges 0->1, 1->2, 2->1 (cycle in red) -->
  <path d="M 340 148 L 466 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 486 110 L 486 184" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 466 196 L 340 158" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <circle cx="322" cy="148" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="322" y="153" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <text x="322" y="184" text-anchor="middle" font-size="9" fill="#446688">source</text>

  <circle cx="478" cy="100" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="478" y="105" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <circle cx="478" cy="198" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="478" y="203" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <text x="411" y="206" text-anchor="middle" font-size="10" fill="#b85450">1→2→1→… 永远到不了 dest=3</text>

  <!-- ===== Bottom: three-color legend ===== -->
  <rect x="40" y="244" width="480" height="118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="266" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">DFS 三色标记：一次遍历同时抓两种失败</text>

  <!-- color samples -->
  <circle cx="92" cy="296" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="92" y="300" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">白</text>
  <text x="112" y="294" font-size="10" fill="#444" font-weight="bold">未访问</text>
  <text x="112" y="307" font-size="9" fill="#777">尚未进入</text>

  <circle cx="92" cy="334" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="92" y="338" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">灰</text>
  <text x="112" y="332" font-size="10" fill="#444" font-weight="bold">访问中</text>
  <text x="112" y="345" font-size="9" fill="#777">在递归栈上</text>

  <circle cx="232" cy="296" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="232" y="300" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">黑</text>
  <text x="252" y="294" font-size="10" fill="#444" font-weight="bold">已完成</text>
  <text x="252" y="307" font-size="9" fill="#777">子树全通向 dest</text>

  <!-- arrows of logic -->
  <text x="232" y="336" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">遇灰 = 回边 → 环！</text>
  <text x="232" y="350" text-anchor="middle" font-size="9" fill="#777">(失败②)</text>

  <text x="412" y="294" font-size="10" fill="#4a7a3a" font-weight="bold">走到无出边节点：</text>
  <text x="412" y="310" font-size="10" fill="#4a7a3a">  · 是 dest → 该路径成功</text>
  <text x="412" y="326" font-size="10" fill="#b85450">  · 不是 dest → 坏死胡同！</text>
  <text x="412" y="340" font-size="9" fill="#777">  (失败①)</text>
</svg>
