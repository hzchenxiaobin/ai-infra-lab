<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">K 次串联：示例演算</text>

  <!-- ===== Example 1 ===== -->
  <text x="30" y="56" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">示例 1：arr = [1, 2]，k = 3，sum = 3 &gt; 0</text>
  <!-- 6 cells: 1 2 1 2 1 2 (all selected = whole array) -->
  <rect x="110" y="66" width="40" height="30" fill="#fff3c4" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="154" y="66" width="40" height="30" fill="#fff3c4" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="198" y="66" width="40" height="30" fill="#fff3c4" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="242" y="66" width="40" height="30" fill="#fff3c4" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="286" y="66" width="40" height="30" fill="#fff3c4" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="330" y="66" width="40" height="30" fill="#fff3c4" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="130" y="86" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="174" y="86" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="218" y="86" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="262" y="86" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="306" y="86" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="350" y="86" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="400" y="86" font-size="10" fill="#888" filter="url(#rough2)">← 整段全取</text>
  <text x="30" y="112" font-size="11" fill="#333" filter="url(#rough2)">kadane₂([1,2,1,2]) = 6  →  ans = 6 + (3−2)×3 = </text>
  <text x="372" y="112" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">9</text>

  <!-- divider -->
  <path d="M 30 128 L 530 128" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- ===== Example 2 ===== -->
  <text x="30" y="150" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 2：arr = [1, −2, 1]，k = 5，sum = 0</text>
  <!-- show 1 -2 1 1 -2 1, highlight the boundary [1,1] (idx 2,3) -->
  <rect x="90"  y="160" width="40" height="30" fill="#f4f8fd" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="134" y="160" width="40" height="30" fill="#f4f8fd" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="178" y="160" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <rect x="222" y="160" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <rect x="266" y="160" width="40" height="30" fill="#f4f8fd" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="310" y="160" width="40" height="30" fill="#f4f8fd" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="180" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="154" y="180" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">−2</text>
  <text x="198" y="180" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="242" y="180" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="286" y="180" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">−2</text>
  <text x="330" y="180" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="362" y="180" font-size="11" fill="#888" filter="url(#rough2)">⋯（共 5 份）</text>
  <text x="90" y="210" font-size="10" fill="#446688" filter="url(#rough2)">↑ 跨界 [1,1]</text>
  <text x="30" y="230" font-size="11" fill="#333" filter="url(#rough2)">kadane₂ = 2（跨界 [1,1]）→ sum ≤ 0 不叠加 → ans = </text>
  <text x="412" y="230" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- divider -->
  <path d="M 30 246 L 530 246" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- ===== Example 3 ===== -->
  <text x="30" y="268" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">示例 3：arr = [−1, −2]，k = 7，sum = −3</text>
  <rect x="90"  y="278" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="134" y="278" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="178" y="278" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="222" y="278" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="298" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">−1</text>
  <text x="154" y="298" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">−2</text>
  <text x="198" y="298" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">−1</text>
  <text x="242" y="298" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">−2</text>
  <text x="278" y="298" font-size="11" fill="#888" filter="url(#rough2)">⋯（全负）</text>
  <!-- empty subarray marker -->
  <rect x="350" y="278" width="60" height="30" fill="#fafafa" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,2" rx="4" filter="url(#rough2)"/>
  <text x="380" y="298" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">∅ 空段</text>
  <text x="30" y="328" font-size="11" fill="#333" filter="url(#rough2)">全负 → Kadane 初值 0 允许空段 → ans = </text>
  <text x="328" y="328" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>

  <!-- Footer -->
  <rect x="30" y="346" width="500" height="40" fill="#f4f8fd" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="364" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">判定口诀：k=1 走单份；k≥2 看 sum</text>
  <text x="280" y="380" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">sum&gt;0 叠 (k−2)·sum，sum≤0 只取 kadane₂，全负归 0</text>
</svg>
