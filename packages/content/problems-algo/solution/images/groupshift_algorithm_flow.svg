<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="340" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：规范化签名 + 哈希成组</text>

  <!-- init -->
  <rect x="185" y="40" width="170" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="17" filter="url(#rough2)"/>
  <text x="270" y="62" text-anchor="middle" font-size="12" fill="#333">初始化 map：key → 列表</text>

  <!-- arrow down -->
  <path d="M 270 74 L 270 88" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- loop header -->
  <rect x="145" y="92" width="250" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" rx="8" filter="url(#rough2)"/>
  <text x="270" y="116" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">对每个字符串 s ∈ strings</text>

  <!-- arrow down -->
  <path d="M 270 130 L 270 144" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- key compute -->
  <rect x="110" y="148" width="320" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="168" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">key = normalize(s)</text>
  <text x="270" y="186" text-anchor="middle" font-size="11" fill="#555">(c − s[0]) mod 26 + 'a'，代价 O(L)</text>

  <!-- arrow down -->
  <path d="M 270 196 L 270 210" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- append -->
  <rect x="145" y="214" width="250" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="8" filter="url(#rough2)"/>
  <text x="270" y="234" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">map[key].push_back(s)</text>
  <text x="270" y="250" text-anchor="middle" font-size="10.5" fill="#4a7a3a">key 不存在则先新建空桶</text>

  <!-- loop back arrow: from append right up to loop header right -->
  <path d="M 395 235 L 440 235 L 440 111 L 397 111" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="452" y="176" text-anchor="middle" font-size="10.5" fill="#4a7a3a" transform="rotate(-90 452 176)">继续下一个 s</text>

  <!-- exit arrow down -->
  <path d="M 270 256 L 270 276" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="290" y="270" font-size="10.5" fill="#888">遍历结束</text>

  <!-- return -->
  <rect x="185" y="280" width="170" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="17" filter="url(#rough2)"/>
  <text x="270" y="302" text-anchor="middle" font-size="12" fill="#333">返回 map.values()</text>

  <!-- side note -->
  <rect x="30" y="148" width="68" height="80" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)" stroke-dasharray="3 2"/>
  <text x="64" y="166" text-anchor="middle" font-size="9.5" fill="#888">normalize</text>
  <text x="64" y="180" text-anchor="middle" font-size="9.5" fill="#888">只与首字母</text>
  <text x="64" y="194" text-anchor="middle" font-size="9.5" fill="#888">相对距离</text>
  <text x="64" y="208" text-anchor="middle" font-size="9.5" fill="#888">有关，对</text>
  <text x="64" y="222" text-anchor="middle" font-size="9.5" fill="#888">移位不变</text>
</svg>
