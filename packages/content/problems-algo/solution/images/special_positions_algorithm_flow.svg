<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：预处理行列和 → 扫描判定</text>

  <!-- ===== Step 1: Start ===== -->
  <ellipse cx="260" cy="58" rx="60" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="63" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始</text>

  <!-- arrow -->
  <line x1="260" y1="78" x2="260" y2="98" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: precompute rowSum ===== -->
  <rect x="130" y="100" width="260" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="118" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">预处理：rowSum[i] = Σ mat[i][j]（逐行求和）</text>
  <text x="260" y="134" text-anchor="middle" font-size="10" fill="#888">colSum[j] = Σ mat[i][j]（逐列求和）</text>

  <!-- arrow -->
  <line x1="260" y1="144" x2="260" y2="164" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: init count ===== -->
  <rect x="180" y="166" width="160" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="188" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">count = 0</text>

  <!-- arrow -->
  <line x1="260" y1="200" x2="260" y2="220" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 4: loop ===== -->
  <rect x="140" y="222" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="244" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">遍历每个 (i, j)</text>

  <!-- arrow down to first diamond -->
  <line x1="260" y1="256" x2="260" y2="276" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Diamond 1: mat[i][j] == 1? ===== -->
  <polygon points="260,278 360,318 260,358 160,318" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="314" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">mat[i][j] == 1 ?</text>

  <!-- No branch (left) → back to loop -->
  <line x1="160" y1="318" x2="100" y2="318" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="130" y="312" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">否</text>
  <rect x="40" y="300" width="60" height="36" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="70" y="322" text-anchor="middle" font-size="10" fill="#888">跳过</text>
  <!-- arrow back up to loop -->
  <path d="M 70 300 L 70 239 L 138 239" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Yes branch (down) to diamond 2 -->
  <line x1="260" y1="358" x2="260" y2="378" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="372" font-size="10" fill="#888" font-weight="bold">是</text>

  <!-- ===== Diamond 2: rowSum[i]==1 && colSum[j]==1? ===== -->
  <polygon points="260,380 380,416 260,452 140,416" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="412" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">rowSum[i]==1</text>
  <text x="260" y="426" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">&amp;&amp; colSum[j]==1 ?</text>

  <!-- No branch (right) → back to loop -->
  <line x1="380" y1="416" x2="440" y2="416" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="410" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">否</text>
  <rect x="420" y="398" width="70" height="36" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="455" y="420" text-anchor="middle" font-size="10" fill="#888">跳过</text>
  <!-- arrow back up to loop -->
  <path d="M 455 398 L 455 239 L 382 239" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Yes branch (left) → count++ -->
  <line x1="140" y1="416" x2="80" y2="416" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="110" y="410" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="14" y="398" width="66" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="47" y="420" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">count++</text>
  <!-- arrow back up to loop -->
  <path d="M 47 398 L 47 239 L 138 239" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Right side note ===== -->
  <rect x="350" y="270" width="160" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="430" y="290" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">两道过滤闸门</text>
  <text x="430" y="306" text-anchor="middle" font-size="9.5" fill="#555">闸1：单元本身是 1</text>
  <text x="430" y="320" text-anchor="middle" font-size="9.5" fill="#555">闸2：行列和均恰为 1</text>
</svg>
