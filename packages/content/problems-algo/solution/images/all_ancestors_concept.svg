<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">祖先传播：处理 u 时，把 u 及其祖先并给后继 v</text>

  <!-- Edges (gray = normal, red highlight = path to node 6) -->
  <!-- 0 -> 3 (highlight, on path to 6) -->
  <path d="M 102 88 L 138 158" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <!-- 0 -> 4 (highlight, on path to 6) -->
  <path d="M 102 88 L 290 158" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <!-- 1 -> 3 (highlight) -->
  <path d="M 200 88 L 158 158" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <!-- 2 -> 4 (highlight) -->
  <path d="M 310 88 L 305 158" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <!-- 2 -> 7 (normal) -->
  <path d="M 322 88 L 470 268" stroke="#999" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- 3 -> 5 (normal) -->
  <path d="M 140 188 L 102 258" stroke="#999" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- 3 -> 6 (highlight) -->
  <path d="M 158 188 L 192 258" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <!-- 3 -> 7 (normal) -->
  <path d="M 165 188 L 300 258" stroke="#999" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- 4 -> 6 (highlight) -->
  <path d="M 295 188 L 215 258" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Layer labels -->
  <text x="36" y="92" text-anchor="middle" font-size="10" fill="#aaa">源点</text>
  <text x="36" y="192" text-anchor="middle" font-size="10" fill="#aaa">中间</text>
  <text x="36" y="292" text-anchor="middle" font-size="10" fill="#aaa">终点</text>

  <!-- Nodes row 1: 0, 1, 2 (ancestors of 6 -> highlighted) -->
  <circle cx="90" cy="74" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="90" y="78" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>

  <circle cx="200" cy="74" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="78" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <circle cx="310" cy="74" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="310" y="78" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <!-- Nodes row 2: 3, 4 (ancestors of 6 -> highlighted) -->
  <circle cx="148" cy="174" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="148" y="178" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <circle cx="300" cy="174" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="178" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>

  <!-- Nodes row 3: 5 (normal), 6 (target, red), 7 (normal) -->
  <circle cx="90" cy="274" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="278" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>

  <circle cx="205" cy="274" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="205" y="279" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>

  <circle cx="310" cy="274" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="278" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>

  <!-- Callout: ancestors of 6 -->
  <rect x="380" y="250" width="170" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="465" y="270" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">ancestors[6] =</text>
  <text x="465" y="288" text-anchor="middle" font-size="11" fill="#444">{0,1,2,3,4}</text>
  <text x="465" y="300" text-anchor="middle" font-size="10" fill="#888">= ancestors[3]∪ancestors[4]∪{3,4}</text>

  <!-- Bottom note -->
  <rect x="40" y="338" width="480" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="358" text-anchor="middle" font-size="11" fill="#444">按拓扑序处理 u：ancestors[u] 已最终确定</text>
  <text x="280" y="374" text-anchor="middle" font-size="11" fill="#666">对每条边 u→v：ancestors[v] ← ancestors[v] ∪ ancestors[u] ∪ {u}</text>
</svg>
