<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">
    计数排序优化：值域 [1,100] → 桶计数重建 expected
  </text>

  <!-- ===== Section 1: heights 输入 + 频次统计 ===== -->
  <text x="40" y="60" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① 统计频次</text>

  <text x="40" y="84" font-size="10.5" fill="#888" filter="url(#rough2)">heights =</text>
  <!-- heights cells: [1,1,4,2,1,3] -->
  <rect x="110" y="68" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="129" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="152" y="68" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="171" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="194" y="68" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="213" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="236" y="68" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="255" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="278" y="68" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="297" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="320" y="68" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="339" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- 箭头向下 -->
  <path d="M 230 104 L 230 120" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 频次桶 -->
  <text x="40" y="138" font-size="10.5" fill="#888" filter="url(#rough2)">freq =</text>
  <!-- bucket 1: freq=3 -->
  <rect x="110" y="124" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="129" y="138" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">1</text>
  <text x="129" y="150" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <!-- bucket 2: freq=1 -->
  <rect x="152" y="124" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="171" y="138" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">2</text>
  <text x="171" y="150" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <!-- bucket 3: freq=1 -->
  <rect x="194" y="124" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="213" y="138" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">3</text>
  <text x="213" y="150" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <!-- bucket 4: freq=1 -->
  <rect x="236" y="124" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="255" y="138" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">4</text>
  <text x="255" y="150" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="290" y="143" font-size="10.5" fill="#888" filter="url(#rough2)">→ 值 h 出现 freq[h] 次</text>

  <!-- 分隔线 -->
  <path d="M 30 170 L 530 170" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- ===== Section 2: 逐位重建 + 比较 ===== -->
  <text x="40" y="192" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 逐位重建 expected 并比较</text>

  <!-- 表头 -->
  <text x="170" y="214" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="250" y="214" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold" filter="url(#rough2)">heights[i]</text>
  <text x="350" y="214" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold" filter="url(#rough2)">expected[i]</text>
  <text x="460" y="214" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold" filter="url(#rough2)">匹配?</text>

  <!-- 行 i=0 -->
  <text x="170" y="236" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="250" y="236" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="350" y="236" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="460" y="236" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="380" y="236" font-size="9" fill="#aaa" filter="url(#rough2)">← freq[1] 剩 2</text>

  <!-- 行 i=1 -->
  <text x="170" y="256" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="250" y="256" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="350" y="256" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="460" y="256" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="380" y="256" font-size="9" fill="#aaa" filter="url(#rough2)">← freq[1] 剩 1</text>

  <!-- 行 i=2 不匹配 -->
  <rect x="120" y="244" width="400" height="20" fill="#fce4ec" opacity="0.4" rx="3" filter="url(#rough2)"/>
  <text x="170" y="276" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="250" y="276" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="350" y="276" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="460" y="276" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ count=1</text>
  <text x="380" y="276" font-size="9" fill="#aaa" filter="url(#rough2)">← freq[1] 剩 0</text>

  <!-- 行 i=3 -->
  <text x="170" y="296" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="250" y="296" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="350" y="296" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="460" y="296" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="380" y="296" font-size="9" fill="#aaa" filter="url(#rough2)">← freq[2] 剩 0</text>

  <!-- 行 i=4 不匹配 -->
  <rect x="120" y="284" width="400" height="20" fill="#fce4ec" opacity="0.4" rx="3" filter="url(#rough2)"/>
  <text x="170" y="316" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="250" y="316" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="350" y="316" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="460" y="316" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ count=2</text>
  <text x="380" y="316" font-size="9" fill="#aaa" filter="url(#rough2)">← freq[3] 剩 0</text>

  <!-- 行 i=5 不匹配 -->
  <rect x="120" y="324" width="400" height="20" fill="#fce4ec" opacity="0.4" rx="3" filter="url(#rough2)"/>
  <text x="170" y="336" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="250" y="336" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="350" y="336" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="460" y="336" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ count=3</text>
  <text x="380" y="336" font-size="9" fill="#aaa" filter="url(#rough2)">← freq[4] 剩 0</text>

  <!-- 分隔线 -->
  <path d="M 30 356 L 530 356" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- ===== 结果 ===== -->
  <rect x="110" y="368" width="340" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="390" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">
    返回 count = 3
  </text>

  <!-- 底部说明 -->
  <rect x="30" y="410" width="500" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="426" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">
    桶计数 O(n+k) 免排序，按值域递增逐位「弹出」即为 expected[i]
  </text>
</svg>
