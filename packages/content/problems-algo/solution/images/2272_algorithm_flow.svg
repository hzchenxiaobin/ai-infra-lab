<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：统计频次 → 枚举字符对 (X,Y) → 双状态 Kadane → ans</text>
  <text x="270" y="42" text-anchor="middle" font-size="10.5" fill="#888">外层 26×26 枚举对，内层一次 O(n) 扫描，整体 O(|Σ|²·n)</text>

  <!-- Step 1: freq -->
  <rect x="150" y="54" width="240" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="78" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① freq[26] = 统计 s 各字符出现次数</text>
  <text x="398" y="78" font-size="9.5" fill="#888">O(n)</text>

  <line x1="270" y1="92" x2="270" y2="108" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: for X,Y -->
  <rect x="120" y="112" width="300" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="134" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② for X ∈[0,25], Y ∈[0,25], X≠Y &amp; freq&gt;0：</text>

  <line x1="270" y1="146" x2="270" y2="162" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: init f,g,ans -->
  <rect x="130" y="166" width="280" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="188" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">③ f=0；g=NEG（哨兵）；（ans 在外层保持）</text>

  <line x1="270" y1="200" x2="270" y2="214" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: for c in s -->
  <rect x="160" y="218" width="220" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="240" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">④ for c ∈ s：</text>

  <line x1="270" y1="252" x2="270" y2="266" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: branch -->
  <!-- diamond -->
  <path d="M 270 270 L 360 300 L 270 330 L 180 300 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="297" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">c 是哪类？</text>
  <text x="270" y="311" text-anchor="middle" font-size="9.5" fill="#888">X(+1) / Y(−1) / 其余(0)</text>

  <!-- three branches -->
  <!-- left: X (+1) -->
  <path d="M 180 300 L 90 300 L 90 340" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="110" y="294" font-size="9.5" fill="#4a7a3a" font-weight="bold">X (+1)</text>
  <rect x="20" y="344" width="140" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="90" y="362" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">f=max(f+1,1)</text>
  <text x="90" y="378" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">g=g+1</text>

  <!-- middle: Y (-1) -->
  <path d="M 270 330 L 270 344" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="340" font-size="9.5" fill="#b85450" font-weight="bold">Y (−1)</text>
  <rect x="180" y="348" width="180" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="366" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">g=max(g−1, f−1, −1)</text>
  <text x="270" y="382" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">f=max(f−1, −1)</text>
  <text x="270" y="394" text-anchor="middle" font-size="8.5" fill="#888">“提升” f 合法化</text>

  <!-- right: other (0) -->
  <path d="M 360 300 L 450 300 L 450 340" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="294" font-size="9.5" fill="#888" font-weight="bold">其余(0)</text>
  <rect x="380" y="344" width="140" height="46" fill="#eeeeee" stroke="#999999" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="450" y="362" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">f=max(f,0)</text>
  <text x="450" y="378" text-anchor="middle" font-size="10" fill="#999" font-weight="bold">g 不变</text>

  <!-- converge: ans = max(ans, g) -->
  <path d="M 90 390 L 90 410 L 450 410 L 450 390" fill="none" stroke="#666" stroke-width="1.6" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <line x1="270" y1="410" x2="270" y2="424" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="428" width="300" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="270" y="448" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">⑤ ans = max(ans, g)（本对贡献的最大含 Y 子数组和）</text>

  <!-- loop-back annotations -->
  <text x="470" y="235" font-size="9.5" fill="#888">下一字符 c</text>
  <text x="470" y="135" font-size="9.5" fill="#888">下一对 (X,Y)</text>
</svg>
