<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">保证图可完全遍历：三类边 + 两个并查集</text>

  <!-- ===== Three edge types legend ===== -->
  <text x="280" y="52" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">三类边（按「服务对象」分类）</text>

  <!-- type 3 : both -->
  <rect x="40" y="64" width="150" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="115" y="82" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">类型 3</text>
  <text x="115" y="100" text-anchor="middle" font-size="10" fill="#555">Alice + Bob 都能用</text>

  <!-- type 1 : Alice -->
  <rect x="205" y="64" width="150" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="82" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">类型 1</text>
  <text x="280" y="100" text-anchor="middle" font-size="10" fill="#555">仅 Alice 能用</text>

  <!-- type 2 : Bob -->
  <rect x="370" y="64" width="150" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="445" y="82" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">类型 2</text>
  <text x="445" y="100" text-anchor="middle" font-size="10" fill="#555">仅 Bob 能用</text>

  <!-- ===== Two DSU panels ===== -->
  <text x="280" y="134" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">两个独立并查集（各自要求连通）</text>

  <!-- Alice DSU -->
  <rect x="40" y="146" width="235" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="157" y="166" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">Alice 的并查集</text>
  <!-- nodes -->
  <circle cx="80" cy="200" r="13" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="204" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <circle cx="145" cy="190" r="13" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145" y="194" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
  <circle cx="210" cy="200" r="13" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="204" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <circle cx="157" cy="246" r="13" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="157" y="250" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">4</text>
  <!-- alice edges : type3 (green) + type1 (blue) -->
  <line x1="80" y1="200" x2="145" y2="190" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <line x1="145" y1="190" x2="210" y2="200" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <line x1="145" y1="190" x2="157" y2="246" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="70" y="186" font-size="9" fill="#4a7a3a">3</text>
  <text x="180" y="186" font-size="9" fill="#4a7a3a">3</text>
  <text x="168" y="222" font-size="9" fill="#446688">1</text>

  <!-- Bob DSU -->
  <rect x="285" y="146" width="235" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="402" y="166" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">Bob 的并查集</text>
  <circle cx="325" cy="200" r="13" fill="#fff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="325" y="204" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <circle cx="390" cy="190" r="13" fill="#fff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="390" y="194" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
  <circle cx="455" cy="200" r="13" fill="#fff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="455" y="204" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <circle cx="402" cy="246" r="13" fill="#fff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="402" y="250" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">4</text>
  <!-- bob edges : type3 (green) + type2 (orange) -->
  <line x1="325" y1="200" x2="390" y2="190" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <line x1="390" y1="190" x2="455" y2="200" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <line x1="455" y1="200" x2="402" y2="246" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="315" y="186" font-size="9" fill="#4a7a3a">3</text>
  <text x="425" y="186" font-size="9" fill="#4a7a3a">3</text>
  <text x="430" y="226" font-size="9" fill="#d6a040">2</text>

  <!-- ===== Greedy key insight ===== -->
  <rect x="40" y="282" width="480" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="304" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">贪心关键：先处理类型 3，搭建「共享骨架」</text>
  <text x="280" y="322" text-anchor="middle" font-size="11" fill="#555">类型 3 一条边同时连通两人的分量，性价比最高 → 优先 union</text>

  <!-- ===== Redundant counting ===== -->
  <rect x="40" y="344" width="480" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="366" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">union 时若两端已连通 → 该边冗余，可删除，removed++</text>
  <text x="280" y="382" text-anchor="middle" font-size="10" fill="#888">最后检查两个并查集各只剩 1 个连通分量，否则返回 −1</text>
</svg>
