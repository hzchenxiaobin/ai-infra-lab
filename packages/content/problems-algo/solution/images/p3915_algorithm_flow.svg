<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：离散化 → 延迟入树扫描 → 两态转移 → 记答案</text>

  <!-- 左侧注释框 -->
  <rect x="18" y="38" width="112" height="84" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="74" y="56" text-anchor="middle" font-size="10" font-weight="bold" fill="#444" filter="url(#rough2)">三步降维</text>
  <text x="74" y="72" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">① 只看上一选中值</text>
  <text x="74" y="87" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">② 延迟 k 步入树</text>
  <text x="74" y="102" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">③ 值域 chmax 合并</text>
  <text x="74" y="116" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">⟹ O(n log n)</text>

  <!-- 预处理 -->
  <rect x="135" y="38" width="250" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">预处理：离散化 vals，建 A/B 两棵 max 线段树</text>
  <path d="M260,74 L260,82" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 主循环 -->
  <rect x="200" y="84" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="102" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">for i ＝ 0 … n−1</text>
  <path d="M260,112 L260,120" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 延迟入树 -->
  <rect x="140" y="122" width="240" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="141" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">入树 pend[i−k]：chmax 到叶 pos[nums[i−k]]</text>
  <text x="260" y="159" text-anchor="middle" font-size="9" fill="#667" filter="url(#rough2)">树上只有 j ≤ i−k ⟹ 距离 ≥ k 自动满足</text>
  <path d="M260,172 L260,180" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 查询 -->
  <rect x="165" y="182" width="190" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="201" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">bestA＝max A[v]，v＞x</text>
  <text x="260" y="217" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">bestB＝max B[v]，v＜x</text>
  <path d="M260,228 L260,236" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 转移 -->
  <rect x="155" y="238" width="210" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="256" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">newA＝max(x, bestB＋x)</text>
  <text x="260" y="272" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">newB＝max(x, bestA＋x)</text>
  <text x="260" y="287" text-anchor="middle" font-size="10" font-weight="bold" fill="#333" filter="url(#rough2)">ans＝max(ans, newA, newB)</text>
  <path d="M260,292 L260,300" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形：是否需要延迟 -->
  <polygon points="260,302 356,324 260,346 164,324" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="321" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i＋k＜n？</text>
  <text x="260" y="336" text-anchor="middle" font-size="8.5" fill="#667" filter="url(#rough2)">（更新要延迟吗）</text>

  <!-- 是 → 存 pend -->
  <text x="366" y="316" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M356,324 L380,324" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="384" y="310" width="112" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="440" y="328" text-anchor="middle" font-size="9" fill="#2d5a24" filter="url(#rough2)">pend[i]＝(newA,newB)</text>

  <!-- pend 延迟 k 步回到主循环 -->
  <path d="M440,308 L440,96 L328,96" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="432" y="205" text-anchor="end" font-size="9" fill="#446688" filter="url(#rough2)">延迟 k 步才可见</text>

  <!-- 否：直接回到主循环 -->
  <path d="M260,346 L260,353 L508,353 L508,108 L328,108" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="348" text-anchor="start" font-size="9" fill="#b85450" filter="url(#rough2)">否（永不可见）</text>
</svg>
