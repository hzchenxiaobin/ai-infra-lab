<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心：排序后「最小未配对元素」必为原值，与 2v 配对</text>
  <text x="300" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">changed 打乱 → 排序 → 贪心配对（原值绿 / 双倍橙）</text>

  <!-- Row 1: changed (shuffled) -->
  <text x="44" y="82" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">changed</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="120" y="64" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="140" y="85" fill="#446688" font-weight="bold">1</text>
    <rect x="162" y="64" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="182" y="85" fill="#446688" font-weight="bold">3</text>
    <rect x="204" y="64" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="224" y="85" fill="#446688" font-weight="bold">4</text>
    <rect x="246" y="64" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="266" y="85" fill="#446688" font-weight="bold">2</text>
    <rect x="288" y="64" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="308" y="85" fill="#446688" font-weight="bold">6</text>
    <rect x="330" y="64" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="350" y="85" fill="#446688" font-weight="bold">8</text>
  </g>
  <text x="400" y="85" font-size="10.5" fill="#888" filter="url(#rough2)">（打乱顺序）</text>

  <!-- Arrow: sort -->
  <path d="M 300 108 L 300 128" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="312" y="124" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">排序</text>

  <!-- Row 2: sorted -->
  <text x="44" y="156" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">排序后</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="120" y="138" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="140" y="159" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="162" y="138" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="182" y="159" fill="#d6a040" font-weight="bold">2</text>
    <rect x="204" y="138" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="224" y="159" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="246" y="138" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="266" y="159" fill="#4a7a3a" font-weight="bold">4</text>
    <rect x="288" y="138" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="308" y="159" fill="#d6a040" font-weight="bold">6</text>
    <rect x="330" y="138" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="350" y="159" fill="#d6a040" font-weight="bold">8</text>
  </g>

  <!-- Legend -->
  <g filter="url(#rough2)" font-size="10" fill="#555">
    <rect x="410" y="142" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
    <text x="430" y="153">原值 v</text>
    <rect x="410" y="162" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <text x="430" y="173">双倍 2v</text>
  </g>

  <!-- Divider -->
  <line x1="60" y1="190" x2="540" y2="190" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Pairing section -->
  <text x="300" y="210" text-anchor="middle" font-size="11" fill="#444" font-weight="bold" filter="url(#rough2)">最小未配对 → 原值；其双倍 2v 必须存在</text>

  <!-- Pair 1: 1 -> 2 -->
  <g filter="url(#rough2)">
    <text x="60" y="248" font-size="10.5" fill="#555" font-weight="bold">第 1 步</text>
    <rect x="120" y="232" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="140" y="253" font-size="13" fill="#4a7a3a" font-weight="bold" text-anchor="middle">1</text>
    <path d="M 164 248 L 196 248" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)"/>
    <text x="180" y="240" font-size="9.5" fill="#4a7a3a" text-anchor="middle">×2</text>
    <rect x="200" y="232" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="220" y="253" font-size="13" fill="#d6a040" font-weight="bold" text-anchor="middle">2</text>
    <text x="256" y="253" font-size="10.5" fill="#888">取 1 为原值，消耗 2</text>
  </g>

  <!-- Pair 2: 3 -> 6 -->
  <g filter="url(#rough2)">
    <text x="60" y="296" font-size="10.5" fill="#555" font-weight="bold">第 2 步</text>
    <rect x="120" y="280" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="140" y="301" font-size="13" fill="#4a7a3a" font-weight="bold" text-anchor="middle">3</text>
    <path d="M 164 296 L 196 296" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)"/>
    <text x="180" y="288" font-size="9.5" fill="#4a7a3a" text-anchor="middle">×2</text>
    <rect x="200" y="280" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="220" y="301" font-size="13" fill="#d6a040" font-weight="bold" text-anchor="middle">6</text>
    <text x="256" y="301" font-size="10.5" fill="#888">2 已耗尽，下一个未配对是 3</text>
  </g>

  <!-- Pair 3: 4 -> 8 -->
  <g filter="url(#rough2)">
    <text x="60" y="344" font-size="10.5" fill="#555" font-weight="bold">第 3 步</text>
    <rect x="120" y="328" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="140" y="349" font-size="13" fill="#4a7a3a" font-weight="bold" text-anchor="middle">4</text>
    <path d="M 164 344 L 196 344" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)"/>
    <text x="180" y="336" font-size="9.5" fill="#4a7a3a" text-anchor="middle">×2</text>
    <rect x="200" y="328" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="220" y="349" font-size="13" fill="#d6a040" font-weight="bold" text-anchor="middle">8</text>
    <text x="256" y="349" font-size="10.5" fill="#888">取 4 为原值，消耗 8</text>
  </g>

  <!-- Result -->
  <rect x="120" y="384" width="360" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="404" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">original = [1, 3, 4]</text>
  <text x="300" y="420" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">每对 (v, 2v) 取走 v，2v 被消耗</text>

  <!-- Note -->
  <rect x="40" y="438" width="520" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="456" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">为何最小必为原值？更小的都已配对，没人能再产生它作双倍</text>
</svg>
