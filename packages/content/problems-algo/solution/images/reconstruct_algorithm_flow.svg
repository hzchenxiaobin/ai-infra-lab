<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">排序后逐人插入到位置 k 的流程</text>

  <!-- Init -->
  <rect x="80" y="38" width="360" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">初始化</text>
  <text x="260" y="78" text-anchor="middle" font-size="11" fill="#555">排序：(h 降序, h 相同时 k 升序)</text>
  <text x="260" y="94" text-anchor="middle" font-size="11" fill="#555">res = [ ]，i = 0</text>

  <path d="M 260 102 L 260 118" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Loop diamond: i < n ? -->
  <polygon points="260,122 372,162 260,202 148,162" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="158" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i &lt; n ?</text>
  <text x="260" y="175" text-anchor="middle" font-size="10.5" fill="#777">还有人未处理？</text>

  <!-- No -> return -->
  <path d="M 372 162 L 444 162 L 444 216" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="394" y="154" font-size="11" fill="#b85450" font-weight="bold">No</text>
  <rect x="374" y="220" width="140" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="444" y="239" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">处理结束</text>
  <text x="444" y="256" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">return res</text>

  <!-- Yes down -->
  <path d="M 260 202 L 260 220" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="276" y="216" font-size="11" fill="#82b366" font-weight="bold">Yes</text>

  <!-- take person p = (h, k) -->
  <rect x="120" y="224" width="280" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="244" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">取出 p = (h, k) = people[i]</text>
  <text x="260" y="262" text-anchor="middle" font-size="11" fill="#d6a040">此时 res 中的人身高都 ≥ h</text>

  <path d="M 260 276 L 260 292" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- insert at k -->
  <rect x="80" y="296" width="360" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">res.insert(p.k, p)</text>
  <text x="260" y="336" text-anchor="middle" font-size="11" fill="#4a7a3a">插入到第 k 位，前面恰有 k 个 ≥ h 的人</text>
  <text x="260" y="350" text-anchor="middle" font-size="11" fill="#4a7a3a">i += 1</text>

  <!-- loop-back -->
  <path d="M 80 327 L 16 327 L 16 162 L 148 162" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <text x="26" y="246" font-size="10.5" fill="#888" font-style="italic" transform="rotate(-90 26 246)">回到循环顶部</text>
</svg>
