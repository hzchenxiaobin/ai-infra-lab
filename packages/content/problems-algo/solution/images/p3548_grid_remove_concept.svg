<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#446688" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="260" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">移除哪一格？值由差值定，连通性由形状定</text>
  <text x="260" y="48" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">grid = [[1,2,4],[2,3,5]]，total = 17</text>

  <!-- ============ 左区：水平割示例 ============ -->
  <text x="28" y="76" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">① 水平割（r = 0）</text>

  <rect x="55" y="92" width="55" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="82" y="117" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="110" y="92" width="55" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="137" y="117" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="165" y="92" width="55" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="117" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="55" y="132" width="55" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="82" y="157" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="110" y="132" width="55" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="137" y="157" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="165" y="132" width="55" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="157" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>

  <!-- 水平红色虚线切割线 -->
  <path d="M 45 132 L 225 132" stroke="#b85450" stroke-width="2.5" stroke-dasharray="7 5" fill="none" filter="url(#rough2)"/>

  <text x="232" y="112" font-size="12" fill="#446688" filter="url(#rough2)">上=7</text>
  <text x="232" y="168" font-size="12" fill="#446688" filter="url(#rough2)">下=10</text>

  <!-- 在中间的 3 上打叉 -->
  <path d="M 120 140 L 155 164" stroke="#b85450" stroke-width="2.5" stroke-linecap="round" filter="url(#rough2)"/>
  <path d="M 155 140 L 120 164" stroke="#b85450" stroke-width="2.5" stroke-linecap="round" filter="url(#rough2)"/>

  <text x="30" y="204" font-size="11.5" fill="#333" filter="url(#rough2)">差 v = 3 → 只能从较大侧（下）移除 3</text>
  <text x="30" y="224" font-size="11.5" fill="#b85450" filter="url(#rough2)">但 3 在单行中间：挖掉后 [2]、[5] 断开 ✗</text>

  <rect x="30" y="240" width="215" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="137" y="262" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">有值但挖不得 → 此割线 ✗</text>

  <!-- ============ 右区：连通性规则 ============ -->
  <text x="280" y="76" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">② 移除后连通？只看形状</text>

  <text x="280" y="100" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">行≥2 且列≥2：挖任意格仍连通</text>

  <!-- 3×3 小网格，中心挖空 -->
  <rect x="295" y="108" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="325" y="108" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="355" y="108" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="295" y="134" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="355" y="134" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="295" y="160" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="325" y="160" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="355" y="160" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="325" y="152" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">挖</text>
  <path d="M 330 139 L 350 155" stroke="#b85450" stroke-width="2" stroke-linecap="round" filter="url(#rough2)"/>
  <path d="M 350 139 L 330 155" stroke="#b85450" stroke-width="2" stroke-linecap="round" filter="url(#rough2)"/>
  <text x="404" y="152" font-size="18" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <text x="280" y="212" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">单行 / 单列：只能挖端点格</text>

  <!-- 单行三格：中间挖空 -->
  <rect x="295" y="220" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="314" y="240" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="333" y="220" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="352" y="240" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="371" y="220" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="390" y="240" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <path d="M 340 226 L 364 244" stroke="#b85450" stroke-width="2" stroke-linecap="round" filter="url(#rough2)"/>
  <path d="M 364 226 L 340 244" stroke="#b85450" stroke-width="2" stroke-linecap="round" filter="url(#rough2)"/>

  <text x="314" y="266" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">端点✓</text>
  <text x="352" y="266" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">中间✗</text>
  <text x="390" y="266" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">端点✓</text>

  <!-- ============ 底部：判定速查 ============ -->
  <rect x="55" y="284" width="410" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="306" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">移除判定速查（每条割线 O(1)）</text>
  <text x="260" y="324" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">二维块（行≥2 且列≥2）→ 查哈希计数：块内存在值 v 即可</text>
  <text x="260" y="338" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">单行/单列 → 只能挖首/尾格：比两个端点值；1×1 → 无解</text>
</svg>
