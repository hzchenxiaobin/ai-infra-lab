<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：分界线 arr1 一画定，arr2 只是影子</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">每列 = nums[i] 的柱子：蓝（arr1）从底垫起，橙（arr2）盖在顶上，蓝橙分界线高度 = arr1[i]</text>

  <!-- ============ 左：柱子拆分图 nums=[2,3,2], arr1=[0,1,2] ============ -->
  <text x="34" y="66" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">例：nums = [2, 3, 2]</text>
  <text x="34" y="82" font-size="10" fill="#666" filter="url(#rough2)">取一对拆分 arr1=[0,1,2]</text>

  <!-- nums 值标注（柱顶上方） -->
  <text x="70" y="242" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="114" y="218" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="158" y="242" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">2</text>

  <!-- 橙色 arr2 段 -->
  <rect x="52" y="248" width="36" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="276" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">2</text>
  <rect x="96" y="224" width="36" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="114" y="252" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">2</text>

  <!-- 蓝色 arr1 段 -->
  <rect x="96" y="272" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="114" y="289" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">1</text>
  <rect x="140" y="248" width="36" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="158" y="276" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">2</text>

  <!-- arr2[2]=0 / arr1[0]=0 的旁注 -->
  <text x="158" y="243" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">(0)</text>
  <text x="70" y="310" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">(0)</text>

  <!-- 分界线（红虚线楼梯） -->
  <path d="M 50 296 L 92 296 L 92 272 L 136 272 L 136 248 L 180 248" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <path d="M 168 240 L 178 247" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="182" y="230" font-size="9.5" fill="#b85450" filter="url(#rough2)">分界线</text>
  <text x="182" y="242" font-size="9.5" fill="#b85450" filter="url(#rough2)">只升不降</text>

  <!-- 地面线 -->
  <path d="M 42 296 L 190 296" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 图例 -->
  <text x="34" y="330" font-size="9.5" fill="#a07830" filter="url(#rough2)">■ 橙上 = arr2（非增）</text>
  <text x="34" y="344" font-size="9.5" fill="#33506b" filter="url(#rough2)">■ 蓝下 = arr1（非减）</text>

  <!-- ============ 右：约束合并推导 ============ -->
  <text x="214" y="62" font-size="10" fill="#666" filter="url(#rough2)">记 s = arr1[i]，t = arr1[i−1]，Δ = nums[i] − nums[i−1]</text>

  <rect x="214" y="70" width="278" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="353" y="87" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">① 逐位和锁定：arr2[i] = nums[i] − arr1[i]</text>
  <text x="353" y="103" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">arr1 定 ⇔ 整对定，只需给 arr1 计数</text>

  <rect x="214" y="116" width="278" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="353" y="136" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">② arr1 非减 ⇒ t ≤ s</text>

  <rect x="214" y="152" width="278" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="353" y="169" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">③ arr2 非增 ⇒ nums[i] − s ≤ nums[i−1] − t</text>
  <text x="353" y="185" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">⇔ t ≤ s − Δ</text>

  <rect x="214" y="198" width="278" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="353" y="219" text-anchor="middle" font-size="11" fill="#8c3a36" font-weight="bold" filter="url(#rough2)">合并 ⇒ t ≤ min(s, s − Δ)：单侧上界！</text>

  <rect x="214" y="238" width="278" height="58" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="353" y="257" text-anchor="middle" font-size="10" fill="#8c3a36" filter="url(#rough2)">Δ &gt; 0（nums 抬升）时 ③ 更紧：</text>
  <text x="353" y="272" text-anchor="middle" font-size="10" fill="#8c3a36" filter="url(#rough2)">分界线爬升速度 ≥ nums 的爬升速度，</text>
  <text x="353" y="287" text-anchor="middle" font-size="10" fill="#8c3a36" filter="url(#rough2)">可行带被上升的 nums 挤压</text>

  <!-- 底部结论条 -->
  <rect x="30" y="312" width="462" height="40" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="261" y="330" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">状态设计：dp[i][s] = 填好前 i+1 位且 arr1[i] = s 的方案数</text>
  <text x="261" y="346" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">转移是上一层的前缀求和 —— nums[i] ≤ 50，值域 DP 甜区</text>
</svg>
