<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：镜像 → 自连接 → 反连接 → 排序</text>

  <!-- 主流程 -->
  <rect x="40" y="46" width="258" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="169" y="66" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">Friends 表</text>
  <text x="169" y="84" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">每对朋友一行（单向存储，共 n 行）</text>

  <path d="M 169 94 L 169 108" stroke="#446688" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="40" y="112" width="258" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="169" y="132" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">① UNION ALL 反转镜像 → T</text>
  <text x="169" y="150" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">2n 行，每对朋友两个方向都有</text>

  <path d="M 169 160 L 169 174" stroke="#446688" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="40" y="178" width="258" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="169" y="198" text-anchor="middle" font-size="10.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">② T ⋈ T ON t1.user_id2 = t2.user_id2</text>
  <text x="169" y="216" text-anchor="middle" font-size="9.5" fill="#7a5a10" filter="url(#rough2)">→「有共同朋友对」清单 (a, b)</text>
  <text x="169" y="230" text-anchor="middle" font-size="9" fill="#7a5a10" filter="url(#rough2)">（每行附带共同朋友 z = user_id2）</text>

  <path d="M 169 234 L 169 248" stroke="#446688" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="40" y="252" width="258" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="169" y="272" text-anchor="middle" font-size="10.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">③ 反连接：NOT IN 清单</text>
  <text x="169" y="290" text-anchor="middle" font-size="9.5" fill="#8f3a36" filter="url(#rough2)">保留 Friends 中不在清单里的行</text>

  <path d="M 169 300 L 169 314" stroke="#446688" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="40" y="318" width="258" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="169" y="342" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">④ ORDER BY user_id1, user_id2</text>

  <!-- 侧注 1 -->
  <rect x="318" y="112" width="184" height="48" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="410" y="132" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">谓词统一</text>
  <text x="410" y="150" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">「z 是 x 的朋友」⇔ (x,z) ∈ T</text>

  <!-- 侧注 2 -->
  <rect x="318" y="182" width="184" height="48" fill="#ffffff" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="410" y="202" text-anchor="middle" font-size="9.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">规模提醒</text>
  <text x="410" y="220" text-anchor="middle" font-size="9" fill="#7a5a10" filter="url(#rough2)">输出 Σd(z)² 行，星形图最坏 O(n²)</text>

  <!-- 侧注 3 -->
  <rect x="318" y="252" width="184" height="48" fill="#ffffff" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="410" y="272" text-anchor="middle" font-size="9.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">为什么 NOT IN 安全？</text>
  <text x="410" y="290" text-anchor="middle" font-size="9" fill="#8f3a36" filter="url(#rough2)">两列是主键，永不为 NULL</text>

  <!-- 侧注 4 -->
  <rect x="318" y="314" width="184" height="42" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="410" y="333" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">图论一句话</text>
  <text x="410" y="350" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">留下载不进任何三角形的边</text>
</svg>
