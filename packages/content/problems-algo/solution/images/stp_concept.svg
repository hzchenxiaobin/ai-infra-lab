<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：不搬数据，只排下标 — idx 按 heights[idx] 降序排好后，按下标取 names</text>

  <!-- ===== Left: parallel arrays (read-only) ===== -->
  <text x="40" y="58" font-size="12" fill="#888" font-weight="bold">原始平行数组（全程只读）</text>

  <!-- index labels column -->
  <g filter="url(#rough2)">
    <text x="50" y="92" text-anchor="middle" font-size="11" fill="#999">0</text>
    <text x="50" y="120" text-anchor="middle" font-size="11" fill="#999">1</text>
    <text x="50" y="148" text-anchor="middle" font-size="11" fill="#999">2</text>
    <text x="40" y="134" font-size="10" fill="#bbb" transform="rotate(-90 40 134)">下标 i</text>
  </g>

  <!-- names column -->
  <g filter="url(#rough2)">
    <rect x="68" y="78" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="113" y="96" text-anchor="middle" font-size="12" fill="#333">Mary</text>
    <rect x="68" y="106" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="113" y="124" text-anchor="middle" font-size="12" fill="#333">John</text>
    <rect x="68" y="134" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="113" y="152" text-anchor="middle" font-size="12" fill="#333">Emma</text>
    <text x="113" y="174" text-anchor="middle" font-size="10" fill="#446688">names[]</text>
  </g>

  <!-- heights column -->
  <g filter="url(#rough2)">
    <rect x="166" y="78" width="70" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="201" y="96" text-anchor="middle" font-size="12" fill="#333">180</text>
    <rect x="166" y="106" width="70" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="201" y="124" text-anchor="middle" font-size="12" fill="#333">165</text>
    <rect x="166" y="134" width="70" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="201" y="152" text-anchor="middle" font-size="12" fill="#333">170</text>
    <text x="201" y="174" text-anchor="middle" font-size="10" fill="#d6a040">heights[]</text>
  </g>

  <!-- arrow: idx sorts using heights as key -->
  <path d="M 244 118 L 282 118" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="263" y="110" text-anchor="middle" font-size="9" fill="#888">排 idx</text>

  <!-- ===== Middle: idx array (gets permuted) ===== -->
  <text x="300" y="58" font-size="12" fill="#888" font-weight="bold">只换位它</text>

  <g filter="url(#rough2)">
    <!-- before sort, small label -->
    <text x="320" y="78" text-anchor="middle" font-size="10" fill="#999">排序前</text>
    <rect x="290" y="84" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="307" y="102" text-anchor="middle" font-size="12" fill="#333">0</text>
    <rect x="324" y="84" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="341" y="102" text-anchor="middle" font-size="12" fill="#333">1</text>
    <rect x="358" y="84" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="375" y="102" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="341" y="126" text-anchor="middle" font-size="10" fill="#4a7a3a">idx（初始 0..n-1）</text>
  </g>

  <!-- vertical sort arrow -->
  <path d="M 341 134 L 341 152" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="376" y="146" font-size="10" fill="#b85450" font-weight="bold">按 heights[idx] 降序</text>

  <g filter="url(#rough2)">
    <!-- after sort -->
    <text x="320" y="166" text-anchor="middle" font-size="10" fill="#999">排序后</text>
    <rect x="290" y="172" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="307" y="190" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
    <rect x="324" y="172" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="341" y="190" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>
    <rect x="358" y="172" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="375" y="190" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
    <text x="341" y="214" text-anchor="middle" font-size="10" fill="#b85450">idx = [0,2,1]</text>
  </g>

  <!-- arrow: gather names via idx -->
  <path d="M 396 188 L 432 188" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="414" y="180" text-anchor="middle" font-size="9" fill="#888">取名字</text>

  <!-- ===== Right: result ===== -->
  <text x="490" y="58" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">答案（按下标取）</text>

  <g filter="url(#rough2)">
    <rect x="438" y="84" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <text x="488" y="102" text-anchor="middle" font-size="12" fill="#333">Mary</text>
    <rect x="438" y="112" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <text x="488" y="130" text-anchor="middle" font-size="12" fill="#333">Emma</text>
    <rect x="438" y="140" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <text x="488" y="158" text-anchor="middle" font-size="12" fill="#333">John</text>
    <text x="488" y="174" text-anchor="middle" font-size="10" fill="#446688">ans = names[idx]</text>
  </g>

  <!-- divider -->
  <line x1="40" y1="226" x2="520" y2="226" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <!-- ===== Bottom: takeaway ===== -->
  <rect x="40" y="240" width="480" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="262" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">排序时只有整数下标被换位</text>
  <text x="280" y="280" text-anchor="middle" font-size="11" fill="#4a7a3a">names / heights 全程只读 → 字符串不参与换位、常数更优</text>

  <!-- contrast box -->
  <rect x="40" y="300" width="480" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">对照：捆绑 (height, name) 排序</text>
  <text x="280" y="342" text-anchor="middle" font-size="11" fill="#555">渐近同为 O(n log n)，但换位时触及字符串对象</text>
  <text x="280" y="360" text-anchor="middle" font-size="11" fill="#555">索引数组把「排序键」与「被取值对象」解耦，是 argsort 范式</text>
  <text x="280" y="376" text-anchor="middle" font-size="10" fill="#d6a040">一次 idx 排序 → 后续按下标取值全 O(1)</text>
</svg>
