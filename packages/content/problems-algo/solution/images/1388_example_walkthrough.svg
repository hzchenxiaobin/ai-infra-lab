<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：slices = [1,2,3,4,5,6]，n=2</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888">两条线性 DP 表，−∞ 记作 −∞，红色为答案格</text>

  <!-- ===== Left table: Case A array [1,2,3,4,5] ===== -->
  <text x="150" y="76" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">情况 A：去尾 → [1,2,3,4,5]</text>

  <!-- col headers -->
  <g font-size="9" fill="#888">
    <text x="92" y="100" text-anchor="middle">i\j</text>
    <text x="130" y="100" text-anchor="middle">0</text>
    <text x="172" y="100" text-anchor="middle">1</text>
    <text x="214" y="100" text-anchor="middle">2</text>
    <text x="252" y="100" text-anchor="middle">arr</text>
  </g>

  <!-- row 0 -->
  <text x="92" y="124" text-anchor="middle" font-size="9" fill="#888">0</text>
  <rect x="114" y="110" width="32" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130" y="126" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="156" y="110" width="32" height="24" rx="3" fill="#f5f5f5" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="172" y="126" text-anchor="middle" font-size="9" fill="#bbb">−∞</text>
  <rect x="198" y="110" width="32" height="24" rx="3" fill="#f5f5f5" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="214" y="126" text-anchor="middle" font-size="9" fill="#bbb">−∞</text>
  <text x="252" y="126" text-anchor="middle" font-size="9" fill="#aaa">—</text>

  <!-- row 1 (arr=1) -->
  <text x="92" y="152" text-anchor="middle" font-size="9" fill="#888">1</text>
  <rect x="114" y="138" width="32" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130" y="154" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="156" y="138" width="32" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="172" y="154" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">1</text>
  <rect x="198" y="138" width="32" height="24" rx="3" fill="#f5f5f5" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="214" y="154" text-anchor="middle" font-size="9" fill="#bbb">−∞</text>
  <text x="252" y="154" text-anchor="middle" font-size="10" fill="#666">1</text>

  <!-- row 2 (arr=2) -->
  <text x="92" y="180" text-anchor="middle" font-size="9" fill="#888">2</text>
  <rect x="114" y="166" width="32" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130" y="182" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="156" y="166" width="32" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="172" y="182" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">2</text>
  <rect x="198" y="166" width="32" height="24" rx="3" fill="#f5f5f5" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="214" y="182" text-anchor="middle" font-size="9" fill="#bbb">−∞</text>
  <text x="252" y="182" text-anchor="middle" font-size="10" fill="#666">2</text>

  <!-- row 3 (arr=3) -->
  <text x="92" y="208" text-anchor="middle" font-size="9" fill="#888">3</text>
  <rect x="114" y="194" width="32" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130" y="210" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="156" y="194" width="32" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="172" y="210" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">3</text>
  <rect x="198" y="194" width="32" height="24" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="214" y="210" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">4</text>
  <text x="252" y="210" text-anchor="middle" font-size="10" fill="#666">3</text>

  <!-- row 4 (arr=4) -->
  <text x="92" y="236" text-anchor="middle" font-size="9" fill="#888">4</text>
  <rect x="114" y="222" width="32" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130" y="238" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="156" y="222" width="32" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="172" y="238" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">4</text>
  <rect x="198" y="222" width="32" height="24" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="214" y="238" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">6</text>
  <text x="252" y="238" text-anchor="middle" font-size="10" fill="#666">4</text>

  <!-- row 5 (arr=5) answer -->
  <text x="92" y="264" text-anchor="middle" font-size="9" fill="#888">5</text>
  <rect x="114" y="250" width="32" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130" y="266" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="156" y="250" width="32" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="172" y="266" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">5</text>
  <rect x="198" y="250" width="32" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="214" y="266" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">8</text>
  <text x="252" y="266" text-anchor="middle" font-size="10" fill="#666">5</text>

  <text x="170" y="296" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">A = dp[5][2] = 8</text>
  <text x="170" y="312" text-anchor="middle" font-size="10" fill="#888">挑 3 和 5（原下标 2、4）</text>

  <!-- ===== Right table: Case B array [2,3,4,5,6] ===== -->
  <text x="470" y="76" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">情况 B：去头 → [2,3,4,5,6]</text>

  <g font-size="9" fill="#888">
    <text x="412" y="100" text-anchor="middle">i\j</text>
    <text x="450" y="100" text-anchor="middle">0</text>
    <text x="492" y="100" text-anchor="middle">1</text>
    <text x="534" y="100" text-anchor="middle">2</text>
    <text x="572" y="100" text-anchor="middle">arr</text>
  </g>

  <!-- row 0 -->
  <text x="412" y="124" text-anchor="middle" font-size="9" fill="#888">0</text>
  <rect x="434" y="110" width="32" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="450" y="126" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="476" y="110" width="32" height="24" rx="3" fill="#f5f5f5" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="492" y="126" text-anchor="middle" font-size="9" fill="#bbb">−∞</text>
  <rect x="518" y="110" width="32" height="24" rx="3" fill="#f5f5f5" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="534" y="126" text-anchor="middle" font-size="9" fill="#bbb">−∞</text>
  <text x="572" y="126" text-anchor="middle" font-size="9" fill="#aaa">—</text>

  <!-- row 1 (arr=2) -->
  <text x="412" y="152" text-anchor="middle" font-size="9" fill="#888">1</text>
  <rect x="434" y="138" width="32" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="450" y="154" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="476" y="138" width="32" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="492" y="154" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">2</text>
  <rect x="518" y="138" width="32" height="24" rx="3" fill="#f5f5f5" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="534" y="154" text-anchor="middle" font-size="9" fill="#bbb">−∞</text>
  <text x="572" y="154" text-anchor="middle" font-size="10" fill="#666">2</text>

  <!-- row 2 (arr=3) -->
  <text x="412" y="180" text-anchor="middle" font-size="9" fill="#888">2</text>
  <rect x="434" y="166" width="32" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="450" y="182" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="476" y="166" width="32" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="492" y="182" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">3</text>
  <rect x="518" y="166" width="32" height="24" rx="3" fill="#f5f5f5" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="534" y="182" text-anchor="middle" font-size="9" fill="#bbb">−∞</text>
  <text x="572" y="182" text-anchor="middle" font-size="10" fill="#666">3</text>

  <!-- row 3 (arr=4) -->
  <text x="412" y="208" text-anchor="middle" font-size="9" fill="#888">3</text>
  <rect x="434" y="194" width="32" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="450" y="210" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="476" y="194" width="32" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="492" y="210" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">4</text>
  <rect x="518" y="194" width="32" height="24" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="534" y="210" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">6</text>
  <text x="572" y="210" text-anchor="middle" font-size="10" fill="#666">4</text>

  <!-- row 4 (arr=5) -->
  <text x="412" y="236" text-anchor="middle" font-size="9" fill="#888">4</text>
  <rect x="434" y="222" width="32" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="450" y="238" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="476" y="222" width="32" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="492" y="238" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">5</text>
  <rect x="518" y="222" width="32" height="24" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="534" y="238" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">8</text>
  <text x="572" y="238" text-anchor="middle" font-size="10" fill="#666">5</text>

  <!-- row 5 (arr=6) answer -->
  <text x="412" y="264" text-anchor="middle" font-size="9" fill="#888">5</text>
  <rect x="434" y="250" width="32" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="450" y="266" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="476" y="250" width="32" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="492" y="266" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">6</text>
  <rect x="518" y="250" width="32" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="534" y="266" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">10</text>
  <text x="572" y="266" text-anchor="middle" font-size="10" fill="#666">6</text>

  <text x="490" y="296" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">B = dp[5][2] = 10</text>
  <text x="490" y="312" text-anchor="middle" font-size="10" fill="#888">挑 4 和 6（原下标 3、5）</text>

  <!-- ===== bottom: answer ===== -->
  <rect x="120" y="340" width="380" height="56" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="310" y="364" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">答案 = max(A, B) = max(8, 10) = 10 ✓</text>
  <text x="310" y="384" text-anchor="middle" font-size="10" fill="#888">B 中挑原下标 3、5（值 4、6）：环上不相邻，首尾(0,5)未同时挑</text>

  <!-- footer hint: key fill step -->
  <rect x="40" y="412" width="540" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="432" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">关键填法：dp[5][2] = max(dp[4][2], dp[3][1] + arr[4])</text>
  <text x="310" y="450" text-anchor="middle" font-size="10" fill="#888">B 表：max(8, 4 + 6) = 10（挑第 5 个值 6，禁选第 4 个，前 3 个挑 1 个最大 = 4）</text>
</svg>
