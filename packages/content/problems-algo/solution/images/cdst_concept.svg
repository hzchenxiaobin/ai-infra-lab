<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：日期 → 年内天数轴 → 两闭区间求交</text>

  <!-- Stage 1: raw date intervals -->
  <text x="38" y="60" font-size="11.5" fill="#888">Alice</text>
  <rect x="105" y="50" width="180" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="105" y="44" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">08-15</text>
  <text x="285" y="44" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">08-18</text>

  <text x="38" y="92" font-size="11.5" fill="#888">Bob</text>
  <rect x="145" y="82" width="200" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="145" y="76" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">08-16</text>
  <text x="345" y="76" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">08-19</text>

  <!-- Arrow 1 -->
  <path d="M 270 108 L 270 126" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="280" y="121" font-size="10.5" fill="#446688">① 日期 → 年内天数 cum[m] + d</text>
  <text x="445" y="92" font-size="9.5" fill="#888">cum={0,31,59,90,</text>
  <text x="445" y="104" font-size="9.5" fill="#888">120,151,181,212,...}</text>

  <!-- Stage 2: number line with intervals -->
  <!-- overlap highlight band (behind): [228,230] -->
  <rect x="190" y="150" width="80" height="74" fill="#fff8e1" stroke="none" opacity="0.7" filter="url(#rough2)"/>

  <!-- Alice bar on axis: [227,230] -->
  <rect x="150" y="158" width="120" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="160" y="170" font-size="10.5" fill="#4a7a3a" font-weight="bold">227</text>
  <text x="270" y="170" text-anchor="end" font-size="10.5" fill="#4a7a3a" font-weight="bold">230</text>

  <!-- Bob bar on axis: [228,231] -->
  <rect x="190" y="182" width="120" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="200" y="194" font-size="10.5" fill="#446688" font-weight="bold">228</text>
  <text x="310" y="194" text-anchor="end" font-size="10.5" fill="#446688" font-weight="bold">231</text>

  <!-- number line -->
  <path d="M 90 214 L 420 214" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <!-- ticks 226..232 -->
  <g font-size="10" fill="#888">
    <path d="M 110 210 L 110 218" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/><text x="110" y="232" text-anchor="middle">226</text>
    <path d="M 150 210 L 150 218" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/><text x="150" y="232" text-anchor="middle">227</text>
    <path d="M 190 210 L 190 218" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/><text x="190" y="232" text-anchor="middle">228</text>
    <path d="M 230 210 L 230 218" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/><text x="230" y="232" text-anchor="middle">229</text>
    <path d="M 270 210 L 270 218" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/><text x="270" y="232" text-anchor="middle">230</text>
    <path d="M 310 210 L 310 218" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/><text x="310" y="232" text-anchor="middle">231</text>
    <path d="M 350 210 L 350 218" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/><text x="350" y="232" text-anchor="middle">232</text>
  </g>
  <text x="230" y="252" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">↑ 黄色带 = 重叠区间 [228, 230]</text>

  <!-- Arrow 2 -->
  <path d="M 270 262 L 270 280" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="280" y="275" font-size="10.5" fill="#d6a040">② 闭区间交 = min(end) − max(start) + 1</text>

  <!-- Stage 3: formula result -->
  <text x="110" y="302" font-size="11" fill="#333">max(start) = max(227, 228) = <tspan fill="#b85450" font-weight="bold">228</tspan></text>
  <text x="110" y="318" font-size="11" fill="#333">min(end)&#160;&#160;= min(230, 231) = <tspan fill="#b85450" font-weight="bold">230</tspan></text>
  <rect x="340" y="288" width="150" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="415" y="316" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">230−228+1 = 3</text>

  <!-- Note -->
  <text x="38" y="348" font-size="9.5" fill="#888">同一年非闰年 → (月,日) 与年内天数严格单调对应，二维日期可压成一维坐标</text>
</svg>
