<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 396"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="396" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：s = "abcac"，k = 2</text>

  <!-- 原串 -->
  <rect x="125" y="42" width="42" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="175" y="42" width="42" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="225" y="42" width="42" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="275" y="42" width="42" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="325" y="42" width="42" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>

  <text x="146" y="67" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <text x="196" y="67" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <text x="246" y="67" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>
  <text x="296" y="67" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <text x="346" y="67" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>

  <text x="146" y="96" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">0</text>
  <text x="196" y="96" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1</text>
  <text x="246" y="96" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">2</text>
  <text x="296" y="96" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">3</text>
  <text x="346" y="96" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">4</text>

  <!-- 候选 A：ab | cac（最优） -->
  <rect x="36" y="112" width="204" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="138" y="137" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"ab"：d=1，a≠b → 改 1 处</text>
  <rect x="248" y="112" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="338" y="137" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"cac"：d=1 已是回文</text>
  <text x="470" y="137" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">= 1 ✓</text>

  <!-- 候选 B：abc | ac -->
  <rect x="36" y="160" width="204" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="138" y="185" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"abc"：d=1，a≠c → 改 1 处</text>
  <rect x="248" y="160" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="338" y="185" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"ac"：d=1，a≠c → 改 1 处</text>
  <text x="470" y="185" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">= 2</text>

  <!-- 候选 C：abca | c（不可行） -->
  <rect x="36" y="208" width="204" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5,4" rx="6" filter="url(#rough2)"/>
  <text x="138" y="233" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">"abca"：v = 1</text>
  <rect x="248" y="208" width="180" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5,4" rx="6" filter="url(#rough2)"/>
  <text x="338" y="233" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">"c"：长度 1，无合法 d ✗</text>
  <text x="470" y="233" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">不可行</text>

  <!-- dp 推导 -->
  <rect x="36" y="262" width="448" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="284" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">dp[2][0] = min( v("ab") + dp[1][2], v("abc") + dp[1][3] )</text>
  <text x="260" y="304" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">= min( 1 + 0 , 1 + 1 ) = 1</text>

  <!-- 结论 -->
  <rect x="36" y="326" width="448" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="353" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">最优划分 "ab" | "cac"：把 "ab" 改成 "aa"，共 1 次修改 ✓</text>

  <text x="260" y="388" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">dp[1][2] = v("cac") = 0；dp[1][3] = v("ac") = 1</text>
</svg>
