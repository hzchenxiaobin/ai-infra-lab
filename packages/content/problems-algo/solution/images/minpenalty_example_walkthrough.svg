<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：customers = "YYNY"，枚举关门时刻 j = 0…4</text>

  <!-- top string cells -->
  <g font-size="18">
    <rect x="178" y="48" width="54" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="205" y="76" text-anchor="middle" fill="#333" font-weight="bold">Y</text>
    <rect x="234" y="48" width="54" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="261" y="76" text-anchor="middle" fill="#333" font-weight="bold">Y</text>
    <rect x="290" y="48" width="54" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="317" y="76" text-anchor="middle" fill="#333" font-weight="bold">N</text>
    <rect x="346" y="48" width="54" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="373" y="76" text-anchor="middle" fill="#333" font-weight="bold">Y</text>
  </g>
  <g font-size="8.5" fill="#888">
    <text x="205" y="100" text-anchor="middle">0 时</text>
    <text x="261" y="100" text-anchor="middle">1 时</text>
    <text x="317" y="100" text-anchor="middle">2 时</text>
    <text x="373" y="100" text-anchor="middle">3 时</text>
  </g>

  <!-- column headers -->
  <text x="150" y="118" text-anchor="end" font-size="10" fill="#888">关门 j</text>
  <text x="435" y="118" text-anchor="middle" font-size="10" fill="#888">cost(j)</text>
  <text x="515" y="118" text-anchor="middle" font-size="10" fill="#888">Δ (较上一行)</text>

  <!-- row j=0 : all closed -->
  <text x="150" y="141" text-anchor="end" font-size="12" fill="#333" font-weight="bold">0</text>
  <g font-size="11">
    <rect x="178" y="128" width="54" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <rect x="234" y="128" width="54" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <rect x="290" y="128" width="54" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <rect x="346" y="128" width="54" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  </g>
  <text x="435" y="145" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="515" y="145" text-anchor="middle" font-size="10" fill="#888">初始 = totalY</text>

  <!-- row j=1 : open closed closed closed -->
  <text x="150" y="175" text-anchor="end" font-size="12" fill="#333" font-weight="bold">1</text>
  <g font-size="11">
    <rect x="178" y="162" width="54" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <rect x="234" y="162" width="54" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <rect x="290" y="162" width="54" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <rect x="346" y="162" width="54" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  </g>
  <text x="435" y="179" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="515" y="179" text-anchor="middle" font-size="10" fill="#4a7a3a">−1 (Y)</text>

  <!-- row j=2 : open open closed closed  ★ min -->
  <rect x="142" y="194" width="262" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)" opacity="0.55"/>
  <text x="150" y="209" text-anchor="end" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <g font-size="11">
    <rect x="178" y="196" width="54" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <rect x="234" y="196" width="54" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <rect x="290" y="196" width="54" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <rect x="346" y="196" width="54" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  </g>
  <text x="435" y="213" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="515" y="213" text-anchor="middle" font-size="10" fill="#4a7a3a">−1 (Y)</text>
  <rect x="452" y="198" width="44" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="474" y="210" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">★ 最小</text>

  <!-- row j=3 : open open open closed -->
  <text x="150" y="243" text-anchor="end" font-size="12" fill="#333" font-weight="bold">3</text>
  <g font-size="11">
    <rect x="178" y="230" width="54" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <rect x="234" y="230" width="54" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <rect x="290" y="230" width="54" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <rect x="346" y="230" width="54" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  </g>
  <text x="435" y="247" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="515" y="247" text-anchor="middle" font-size="10" fill="#b85450">+1 (N)</text>

  <!-- row j=4 : all open -->
  <text x="150" y="277" text-anchor="end" font-size="12" fill="#333" font-weight="bold">4</text>
  <g font-size="11">
    <rect x="178" y="264" width="54" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <rect x="234" y="264" width="54" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <rect x="290" y="264" width="54" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <rect x="346" y="264" width="54" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  </g>
  <text x="435" y="281" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="515" y="281" text-anchor="middle" font-size="10" fill="#4a7a3a">−1 (Y)</text>

  <!-- legend -->
  <rect x="178" y="306" width="16" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="200" y="316" font-size="10" fill="#888">开门（Y 免费 / N 计代价）</text>
  <rect x="356" y="306" width="16" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="378" y="316" font-size="10" fill="#888">关门（Y 计代价 / N 免费）</text>

  <!-- summary box -->
  <rect x="60" y="338" width="460" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="290" y="360" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">cost 序列：3 → 2 → 1 → 2 → 1</text>
  <text x="290" y="378" text-anchor="middle" font-size="11" fill="#333">最小值 1 首次出现在 j = 2（j = 4 虽并列但更晚）→ 返回 2 ✓</text>
</svg>
