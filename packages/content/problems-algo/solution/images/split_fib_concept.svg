<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">核心观察：前两个数锁定整条序列，且每个数 &lt; 2³¹−1</text>

  <!-- input string -->
  <text x="40" y="62" font-size="11" fill="#888">输入串：</text>
  <text x="100" y="62" font-size="13" fill="#333" font-weight="bold">"1101111"</text>

  <!-- number boxes row: 11, 0, 11, 11 -->
  <rect x="80" y="80" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="112" y="106" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">11</text>
  <rect x="150" y="80" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="172" y="106" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">0</text>

  <rect x="200" y="80" width="64" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="232" y="106" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">11</text>
  <rect x="270" y="80" width="64" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="302" y="106" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">11</text>

  <!-- bracket: freely chosen -->
  <path d="M 80 130 L 80 138 L 194 138 L 194 130" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="137" y="156" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">自由选择（枚举长度 i, j）</text>

  <!-- bracket: determined -->
  <path d="M 200 130 L 200 138 L 334 138 L 334 130" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="267" y="156" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">被加法链锁定（贪心匹配）</text>

  <!-- addition arrows: 11+0=11 -->
  <path d="M 112 124 L 112 176" stroke="#d6a040" stroke-width="1.2" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <path d="M 172 124 L 172 176" stroke="#d6a040" stroke-width="1.2" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="142" y="196" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">11 + 0 = 11</text>
  <path d="M 142 200 L 232 200 L 232 78" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- addition: 0+11=11 -->
  <text x="216" y="196" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">0 + 11 = 11</text>
  <path d="M 216 200 L 302 200 L 302 78" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- right note box: enumeration bounds -->
  <rect x="352" y="80" width="196" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="450" y="104" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">枚举维度（关键收紧）</text>
  <text x="450" y="126" text-anchor="middle" font-size="11" fill="#666">i = 第一个数长度</text>
  <text x="450" y="144" text-anchor="middle" font-size="11" fill="#666">j = 第二个数长度</text>
  <text x="450" y="166" text-anchor="middle" font-size="10" fill="#b85450">每个数 &lt; 2³¹−1 → i, j ≤ 10</text>

  <!-- bottom note: vs 306 -->
  <rect x="40" y="224" width="510" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="295" y="248" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">与 306 累加数同骨架：枚举前两数 + 贪心验证</text>
  <text x="295" y="270" text-anchor="middle" font-size="11" fill="#666">区别①判定向构造升级（return path）；②数 &lt; 2³¹ 可用 long long，无需字符串加法</text>
  <text x="295" y="288" text-anchor="middle" font-size="10" fill="#888">n ≤ 200，但 i, j ≤ 10 使搜索空间压缩到 O(10²) 组，每组 O(n) 验证</text>

  <!-- upper bound box -->
  <rect x="40" y="312" width="510" height="72" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="295" y="336" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">溢出剪枝：z &gt; 2³¹−1 立即终止该组</text>
  <text x="295" y="358" text-anchor="middle" font-size="11" fill="#666">C++ 用 long long 暂存和，超 INT_MAX 即剪；Python 直接比较，原生不溢出</text>
  <text x="295" y="376" text-anchor="middle" font-size="10" fill="#888">这是 842 相对 306 的核心约束：值域有界 → 加法退化为普通整数运算</text>
</svg>
