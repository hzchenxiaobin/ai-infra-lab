<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="340" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：匹配到的合法时间与计数</text>

  <!-- table frame: 3 cols -->
  <!-- col x: pattern 30-160 (w130), matched 160-520 (w360), count 520-600 (w80) -->
  <g filter="url(#rough2)">
    <!-- header bg -->
    <rect x="30" y="50" width="130" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="160" y="50" width="360" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="520" y="50" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <!-- row1 bg -->
    <rect x="30" y="92" width="130" height="50" fill="#fafafa" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="160" y="92" width="360" height="50" fill="#fafafa" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="520" y="92" width="80" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <!-- row2 bg -->
    <rect x="30" y="150" width="130" height="50" fill="#fafafa" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="160" y="150" width="360" height="50" fill="#fafafa" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="520" y="150" width="80" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <!-- row3 bg -->
    <rect x="30" y="208" width="130" height="50" fill="#fafafa" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="160" y="208" width="360" height="50" fill="#fafafa" stroke="#999" stroke-width="1.3" rx="4"/>
    <rect x="520" y="208" width="80" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
  </g>

  <!-- header text -->
  <g font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">
    <text x="95" y="71" text-anchor="middle">time</text>
    <text x="340" y="71" text-anchor="middle">匹配的合法时间（抽样）</text>
    <text x="560" y="71" text-anchor="middle">数量</text>
  </g>

  <!-- row1: ?5:00 -->
  <text x="95" y="122" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">?5:00</text>
  <g font-size="13" fill="#333" filter="url(#rough2)">
    <text x="180" y="115">05:00</text>
    <text x="240" y="115" fill="#4a7a3a" font-weight="bold">✓</text>
    <text x="270" y="115">15:00</text>
    <text x="330" y="115" fill="#4a7a3a" font-weight="bold">✓</text>
    <text x="180" y="133" fill="#b85450" font-size="11">25:00 … 95:00 非法，本就不在枚举集</text>
  </g>
  <text x="560" y="123" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- row2: 0?:0? -->
  <text x="95" y="180" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">0?:0?</text>
  <text x="180" y="178" font-size="13" fill="#333" filter="url(#rough2)">00:00, 01:09, 03:07, …, 09:09</text>
  <text x="180" y="194" font-size="11" fill="#888" filter="url(#rough2)">0?×0?：10 × 10 = 100 个，全合法</text>
  <text x="560" y="181" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold" filter="url(#rough2)">100</text>

  <!-- row3: ??:?? -->
  <text x="95" y="238" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">??:??</text>
  <text x="180" y="236" font-size="13" fill="#333" filter="url(#rough2)">全部 1440 个合法时间</text>
  <text x="180" y="252" font-size="11" fill="#888" filter="url(#rough2)">24 × 60 = 1440</text>
  <text x="560" y="239" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1440</text>

  <!-- note box -->
  <rect x="30" y="272" width="570" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="315" y="293" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">每个合法时间天然合法，只需逐字符匹配 pattern；非法时间不在枚举集中、无需排除</text>
  <text x="315" y="311" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">"?5:00" 仅 05:00、15:00 命中 → 2 ；枚举集已无 25:00</text>
</svg>
