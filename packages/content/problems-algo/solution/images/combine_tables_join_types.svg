<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">四种 JOIN 对比：为何选 LEFT JOIN？</text>

  <!-- Two circles representing tables -->
  <!-- Person circle (blue) -->
  <ellipse cx="180" cy="120" rx="70" ry="55" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)" opacity="0.85"/>
  <text x="180" y="110" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">Person</text>
  <text x="180" y="128" text-anchor="middle" font-size="10" fill="#666">全部人员</text>
  <text x="180" y="142" text-anchor="middle" font-size="10" fill="#666">（含无地址者）</text>

  <!-- Address circle (green) -->
  <ellipse cx="380" cy="120" rx="70" ry="55" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)" opacity="0.85"/>
  <text x="380" y="110" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">Address</text>
  <text x="380" y="128" text-anchor="middle" font-size="10" fill="#666">地址记录</text>
  <text x="380" y="142" text-anchor="middle" font-size="10" fill="#666">（含无主人者）</text>

  <!-- Intersection -->
  <text x="280" y="116" text-anchor="middle" font-size="9.5" fill="#888">交集</text>
  <text x="280" y="130" text-anchor="middle" font-size="9.5" fill="#888">有地址的人</text>

  <!-- Four JOIN panels -->
  <!-- INNER JOIN -->
  <rect x="30" y="200" width="120" height="90" fill="#fff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <ellipse cx="60" cy="225" rx="16" ry="12" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <ellipse cx="84" cy="225" rx="16" ry="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="72" y="228" text-anchor="middle" font-size="8" fill="#333">∩</text>
  <text x="90" y="258" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">INNER JOIN</text>
  <text x="90" y="274" text-anchor="middle" font-size="9.5" fill="#888">仅保留交集</text>
  <text x="90" y="286" text-anchor="middle" font-size="9" fill="#b85450">✗ 漏无地址者</text>

  <!-- LEFT JOIN (highlighted) -->
  <rect x="160" y="196" width="120" height="98" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <ellipse cx="190" cy="225" rx="16" ry="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <ellipse cx="214" cy="225" rx="16" ry="12" fill="none" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <path d="M198 225 a16 12 0 0 1 16 -12" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <text x="220" y="258" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">LEFT JOIN</text>
  <text x="220" y="274" text-anchor="middle" font-size="9.5" fill="#333">左表全保留</text>
  <text x="220" y="286" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">✓ 本题答案</text>

  <!-- RIGHT JOIN -->
  <rect x="290" y="200" width="120" height="90" fill="#fff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <ellipse cx="320" cy="225" rx="16" ry="12" fill="none" stroke="#446688" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <ellipse cx="344" cy="225" rx="16" ry="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="350" y="258" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">RIGHT JOIN</text>
  <text x="350" y="274" text-anchor="middle" font-size="9.5" fill="#888">右表全保留</text>
  <text x="350" y="286" text-anchor="middle" font-size="9" fill="#b85450">✗ 漏无地址者</text>

  <!-- FULL JOIN -->
  <rect x="420" y="200" width="120" height="90" fill="#fff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <ellipse cx="450" cy="225" rx="16" ry="12" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <ellipse cx="474" cy="225" rx="16" ry="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="480" y="258" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">FULL JOIN</text>
  <text x="480" y="274" text-anchor="middle" font-size="9.5" fill="#888">两侧全保留</text>
  <text x="480" y="286" text-anchor="middle" font-size="9" fill="#d6a040">✗ 多余行</text>

  <!-- Bottom explanation -->
  <rect x="40" y="320" width="480" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="342" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">题目要求：报告每个人的 firstName / lastName / city / state</text>
  <text x="280" y="362" text-anchor="middle" font-size="10.5" fill="#666">→ 必须保留 Person 全部行（左表），即使无地址</text>
  <text x="280" y="378" text-anchor="middle" font-size="10.5" fill="#666">→ 无匹配地址时 city / state 填 NULL</text>
  <text x="280" y="394" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">→ Person 为左表，LEFT JOIN Address</text>
</svg>
