<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：筛表 + 单向累加扫描</text>

  <!-- 埃氏筛 -->
  <rect x="180" y="42" width="170" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="265" y="64" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">埃氏筛建表 comp[0..n]</text>
  <path d="M 265 76 L 265 92" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="180" y="94" width="170" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="265" y="114" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">s = 0，ans = 0，i = 0</text>
  <path d="M 265 124 L 265 140" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 累加 -->
  <rect x="180" y="142" width="170" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="265" y="162" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">s += primes[i]，++i</text>
  <path d="M 265 172 L 265 188" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 判定 s ≤ n ？ -->
  <path d="M 265 188 L 345 222 L 265 256 L 185 222 z" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="265" y="227" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">s ≤ n ？</text>

  <!-- 否 → 返回 -->
  <path d="M 345 222 L 452 222 L 452 314" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="394" y="214" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否（越界）</text>
  <rect x="382" y="316" width="140" height="34" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="452" y="338" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">返回 ans ✓</text>

  <!-- 是 ↓ 判素 -->
  <path d="M 265 256 L 265 272" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="273" y="268" text-anchor="start" font-size="11" fill="#446688" filter="url(#rough2)">是</text>
  <path d="M 265 272 L 345 306 L 265 340 L 185 306 z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="265" y="303" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">s 是质数？</text>
  <text x="265" y="319" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">查筛表 O(1)</text>

  <!-- 是 → ans = s，回累加 -->
  <path d="M 345 306 L 382 306" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="362" y="298" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="384" y="292" width="86" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="427" y="311" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">ans = s</text>
  <path d="M 427 292 L 427 157 L 354 157" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 否 → 回累加 -->
  <path d="M 185 306 L 112 306 L 112 157 L 176 157" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="152" y="298" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">否</text>

  <!-- 底部备注 -->
  <text x="26" y="352" text-anchor="start" font-size="10.5" fill="#666" filter="url(#rough2)">单向扫描无回溯：S 严格递增，ans 只会被更大的质数和覆盖</text>
</svg>
