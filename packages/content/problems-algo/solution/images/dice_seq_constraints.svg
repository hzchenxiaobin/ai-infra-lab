<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#b85450" stroke-width="1.5"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#4a7a3a" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">两条约束：相邻互质 + 同值拉开 (|i-j| &gt; 2)</text>

  <!-- Constraint 1: adjacent gcd -->
  <rect x="30" y="44" width="220" height="130" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="140" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 相邻互质 gcd=1</text>

  <!-- bad pair 3,6 -->
  <circle cx="78" cy="108" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="78" y="113" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">3</text>
  <circle cx="118" cy="108" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="118" y="113" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">6</text>
  <text x="98" y="148" text-anchor="middle" font-size="11" fill="#b85450">gcd=3 ✗</text>

  <text x="160" y="100" font-size="16" fill="#888">|</text>

  <!-- good pair 2,3 -->
  <circle cx="186" cy="108" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="186" y="113" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">2</text>
  <circle cx="226" cy="108" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="226" y="113" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="206" y="148" text-anchor="middle" font-size="11" fill="#4a7a3a">gcd=1 ✓</text>

  <!-- Constraint 2: same value distance -->
  <rect x="270" y="44" width="220" height="130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="380" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 同值需 |i-j| &gt; 2</text>

  <!-- positions 1 2 3 4 -->
  <text x="292" y="96" font-size="10" fill="#888">位置:</text>
  <text x="324" y="96" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="360" y="96" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="396" y="96" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="432" y="96" text-anchor="middle" font-size="10" fill="#888">4</text>
  <text x="468" y="96" text-anchor="middle" font-size="10" fill="#888">5</text>

  <!-- value 1 at pos1 -->
  <circle cx="324" cy="120" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="324" y="125" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <!-- pos2 other -->
  <circle cx="360" cy="120" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="125" text-anchor="middle" font-size="13" fill="#333">2</text>
  <!-- pos3 forbidden 1 -->
  <circle cx="396" cy="120" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="396" y="125" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <!-- pos4 allowed 1 -->
  <circle cx="432" cy="120" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="432" y="125" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <!-- pos5 other -->
  <circle cx="468" cy="120" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="468" y="125" text-anchor="middle" font-size="13" fill="#333">3</text>

  <!-- bracket forbid pos1->pos3 -->
  <path d="M324 140 Q360 156 396 140" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="4,2" filter="url(#rough2)"/>
  <text x="360" y="166" text-anchor="middle" font-size="10" fill="#b85450">距离2 ✗</text>
  <!-- bracket allow pos1->pos4 -->
  <path d="M324 176 Q378 192 432 176" stroke="#4a7a3a" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="378" y="186" text-anchor="middle" font-size="10" fill="#4a7a3a">距离3 ✓</text>

  <!-- bottom takeaway -->
  <rect x="30" y="200" width="460" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="224" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">推论：放新值 x 只需看回前 2 位</text>
  <text x="260" y="244" text-anchor="middle" font-size="11" fill="#555">x ≠ seq[p-1]（距1） 且 x ≠ seq[p-2]（距2） 且 gcd(x, seq[p-1])=1</text>

  <!-- arrow to state idea -->
  <path d="M260 266 L260 296" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="80" y="304" width="360" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="329" text-anchor="middle" font-size="12" fill="#333">状态 = 尾部两位 (a, b)，共 6×6 = 36 个</text>
</svg>
