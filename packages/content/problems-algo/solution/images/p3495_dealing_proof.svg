<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14.5" fill="#333" font-weight="bold" filter="url(#rough2)">发牌法：S 个任务格发进 2T 个槽，第 i 槽配第 i+T 槽</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">示例 [2,6]：nums=[2,3,4,5,6]，depth=[1,1,2,2,2]，S=8=2T，D=2，T=max(4,2)=4</text>

  <!-- 分组标签 -->
  <text x="78" y="58" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">depth 1</text>
  <text x="130" y="58" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">depth 1</text>
  <text x="208" y="58" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">depth 2</text>
  <text x="312" y="58" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">depth 2</text>
  <text x="416" y="58" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">depth 2</text>

  <!-- 8 个任务格：按元素顺序排成一列 -->
  <rect x="58" y="64" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="78" y="89" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="110" y="64" width="40" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="130" y="89" text-anchor="middle" font-size="13" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="162" y="64" width="40" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="182" y="89" text-anchor="middle" font-size="13" fill="#8a6d3a" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="214" y="64" width="40" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="234" y="89" text-anchor="middle" font-size="13" fill="#8a6d3a" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="266" y="64" width="40" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="286" y="89" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="318" y="64" width="40" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="338" y="89" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="370" y="64" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="89" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="422" y="64" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="442" y="89" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">6</text>

  <!-- 槽编号 -->
  <text x="78" y="120" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">槽1</text>
  <text x="130" y="120" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">槽2</text>
  <text x="182" y="120" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">槽3</text>
  <text x="234" y="120" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">槽4</text>
  <text x="286" y="120" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">槽5</text>
  <text x="338" y="120" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">槽6</text>
  <text x="390" y="120" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">槽7</text>
  <text x="442" y="120" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">槽8</text>

  <!-- 配对弧线：槽 i ↔ 槽 i+4 -->
  <path d="M 78 126 C 78 196, 286 196, 286 126" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 130 126 C 130 176, 338 176, 338 126" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 182 126 C 182 156, 390 156, 390 126" fill="none" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 234 126 C 234 142, 442 142, 442 126" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- 操作结果（颜色与弧线一一对应） -->
  <rect x="16" y="214" width="112" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="231" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">操作1 = (2, 5)</text>
  <rect x="148" y="214" width="112" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="204" y="231" text-anchor="middle" font-size="11" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">操作2 = (3, 5)</text>
  <rect x="280" y="214" width="112" height="26" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="336" y="231" text-anchor="middle" font-size="11" fill="#8a6d3a" font-weight="bold" filter="url(#rough2)">操作3 = (4, 6)</text>
  <rect x="412" y="214" width="112" height="26" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="468" y="231" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">操作4 = (4, 6)</text>

  <!-- 逐步执行校验 -->
  <rect x="36" y="252" width="470" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="271" y="270" text-anchor="middle" font-size="10.5" fill="#2a5a2a" filter="url(#rough2)">逐步执行：op1 → [0,3,4,1,6]    op2 → [0,0,4,0,6]</text>
  <text x="271" y="288" text-anchor="middle" font-size="10.5" fill="#2a5a2a" filter="url(#rough2)">op3 → [0,0,1,0,1]    op4 → [0,0,0,0,0] ✓ 4 次全归零</text>

  <!-- 正确性说明 -->
  <rect x="36" y="308" width="470" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="271" y="328" text-anchor="middle" font-size="11" fill="#8a6d3a" filter="url(#rough2)">为何永不撞车：同一元素的任务格连续排布、块长 ≤ D ≤ T，</text>
  <text x="271" y="344" text-anchor="middle" font-size="11" fill="#8a6d3a" filter="url(#rough2)">而配成一对的两个槽恰好相距 T ⟹ 同一元素的两格不可能同槽</text>
  <text x="271" y="360" text-anchor="middle" font-size="10" fill="#8a6d3a" filter="url(#rough2)">（S 为奇数时留一个空槽：抓已归零的元素凑位，0÷4=0 不亏）</text>
</svg>
