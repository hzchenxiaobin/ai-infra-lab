<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：coins = [1,1,1,4]，排序后逐枚扩展</text>

  <!-- Table header -->
  <rect x="40" y="44" width="500" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="62" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">步骤</text>
  <text x="130" y="62" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">硬币 c</text>
  <text x="210" y="62" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">判定 c≤x+1</text>
  <text x="320" y="62" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">更新 x</text>
  <text x="470" y="62" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">可达区间</text>

  <!-- Row 0: init -->
  <rect x="40" y="74" width="500" height="28" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="92" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">初始</text>
  <text x="130" y="92" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">—</text>
  <text x="210" y="92" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">—</text>
  <text x="320" y="92" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">x = 0</text>
  <rect x="420" y="78" width="100" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="470" y="92" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">[0, 0]</text>

  <!-- Row 1: c=1, x 0->1 -->
  <rect x="40" y="104" width="500" height="28" fill="#f6fdf7" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="122" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">①</text>
  <text x="130" y="122" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="210" y="122" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">1 ≤ 1 ✓</text>
  <text x="320" y="122" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">x = 1</text>
  <rect x="420" y="108" width="100" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="470" y="122" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">[0, 1]</text>

  <!-- Row 2: c=1, x 1->2 -->
  <rect x="40" y="134" width="500" height="28" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="152" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">②</text>
  <text x="130" y="152" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="210" y="152" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">1 ≤ 2 ✓</text>
  <text x="320" y="152" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">x = 2</text>
  <rect x="420" y="138" width="100" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="470" y="152" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">[0, 2]</text>

  <!-- Row 3: c=1, x 2->3 -->
  <rect x="40" y="164" width="500" height="28" fill="#f6fdf7" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="182" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">③</text>
  <text x="130" y="182" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="210" y="182" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">1 ≤ 3 ✓</text>
  <text x="320" y="182" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">x = 3</text>
  <rect x="420" y="168" width="100" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="470" y="182" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">[0, 3]</text>

  <!-- Row 4: c=4, x 3->7 -->
  <rect x="40" y="194" width="500" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="212" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">④</text>
  <text x="130" y="212" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="210" y="212" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">4 ≤ 4 ✓</text>
  <text x="320" y="212" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">x = 7</text>
  <rect x="420" y="198" width="100" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="470" y="212" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">[0, 7]</text>

  <!-- Range growth bar visualization -->
  <text x="40" y="248" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">可达区间增长（0 ~ 7，共 8 个连续整数）：</text>

  <!-- baseline -->
  <path d="M 60 268 L 540 268" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="548" y="272" font-size="10" fill="#888" filter="url(#rough2)">值</text>

  <!-- tick labels 0..7 -->
  <g font-size="9.5" fill="#888" text-anchor="middle">
    <text x="80" y="284" filter="url(#rough2)">0</text>
    <text x="140" y="284" filter="url(#rough2)">1</text>
    <text x="200" y="284" filter="url(#rough2)">2</text>
    <text x="260" y="284" filter="url(#rough2)">3</text>
    <text x="320" y="284" filter="url(#rough2)">4</text>
    <text x="380" y="284" filter="url(#rough2)">5</text>
    <text x="440" y="284" filter="url(#rough2)">6</text>
    <text x="500" y="284" filter="url(#rough2)">7</text>
  </g>

  <!-- stacked bars showing growth -->
  <!-- step0: [0,0] -->
  <rect x="78" y="296" width="4" height="14" fill="#446688" filter="url(#rough2)"/>
  <!-- step1: [0,1] -->
  <rect x="78" y="312" width="64" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <!-- step2: [0,2] -->
  <rect x="78" y="328" width="124" height="14" fill="#cfe8d8" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <!-- step3: [0,3] -->
  <rect x="78" y="344" width="184" height="14" fill="#bfe0cc" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <!-- step4: [0,7] -->
  <rect x="78" y="360" width="424" height="18" fill="#a8d4b4" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>

  <!-- step labels on left -->
  <text x="50" y="306" text-anchor="end" font-size="8.5" fill="#888" filter="url(#rough2)">初始</text>
  <text x="50" y="322" text-anchor="end" font-size="8.5" fill="#888" filter="url(#rough2)">+1</text>
  <text x="50" y="338" text-anchor="end" font-size="8.5" fill="#888" filter="url(#rough2)">+1</text>
  <text x="50" y="354" text-anchor="end" font-size="8.5" fill="#888" filter="url(#rough2)">+1</text>
  <text x="50" y="372" text-anchor="end" font-size="8.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">+4</text>

  <!-- result -->
  <path d="M 40 392 L 540 392" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="180" y="398" width="220" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="411" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = x + 1 = 7 + 1 = 8</text>
</svg>
