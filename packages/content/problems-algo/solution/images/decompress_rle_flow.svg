<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="500" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="250" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：步长 2 遍历，每对展开 freq 个 val 追加到 res</text>

  <!-- 1. res = [] -->
  <rect x="170" y="46" width="160" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="250" y="70" text-anchor="middle" font-size="12" fill="#333">① res = [ ]</text>

  <path d="M 250 84 L 250 100" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. i = 0 -->
  <rect x="180" y="100" width="140" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="250" y="124" text-anchor="middle" font-size="12" fill="#333">② i = 0</text>

  <path d="M 250 138 L 250 154" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. diamond: i < n ? -->
  <polygon points="250,154 350,196 250,238 150,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="194" text-anchor="middle" font-size="12" fill="#333">③ i &lt; n ?</text>
  <text x="250" y="210" text-anchor="middle" font-size="10" fill="#888">(还有未处理的对)</text>

  <!-- 否 → return res -->
  <path d="M 350 196 L 430 196" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="418" y="182" width="78" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="457" y="201" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return res</text>

  <!-- 是 ↓ -->
  <path d="M 250 238 L 250 256" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="262" y="252" font-size="10.5" fill="#4a7a3a">是 ↓</text>

  <!-- 4. freq, val -->
  <rect x="130" y="256" width="240" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="250" y="280" text-anchor="middle" font-size="12" fill="#333">④ freq=nums[i]，val=nums[i+1]</text>

  <path d="M 250 294 L 250 310" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 5. append val freq times -->
  <rect x="120" y="310" width="260" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="250" y="334" text-anchor="middle" font-size="12" fill="#333">⑤ res 末尾追加 freq 个 val</text>

  <path d="M 250 348 L 250 364" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 6. i += 2 -->
  <rect x="180" y="364" width="140" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="250" y="384" text-anchor="middle" font-size="12" fill="#333">⑥ i += 2</text>

  <!-- loop back to ③ -->
  <path d="M 180 379 L 70 379 L 70 196 L 148 196" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="40" y="290" font-size="10.5" fill="#666" font-weight="bold">回到 ③</text>
  <text x="40" y="304" font-size="10" fill="#888">处理下一对</text>
</svg>
