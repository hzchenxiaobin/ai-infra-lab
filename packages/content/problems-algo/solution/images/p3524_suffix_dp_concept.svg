<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">移除前后缀 = 保留一段非空子数组；余数按右端点滚动</text>

  <!-- 数组：前缀/保留/后缀 -->
  <text x="82" y="80" text-anchor="end" font-size="12" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">nums</text>

  <text x="146" y="44" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">删前缀</text>
  <text x="258" y="44" text-anchor="middle" font-size="10" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">保留 ✓</text>
  <text x="342" y="44" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">删后缀</text>

  <rect x="92" y="52" width="52" height="44" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="118" y="70" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">#0</text>
  <text x="118" y="89" text-anchor="middle" font-size="15" font-weight="bold" fill="#999" filter="url(#rough2)">1</text>

  <rect x="148" y="52" width="52" height="44" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="174" y="70" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">#1</text>
  <text x="174" y="89" text-anchor="middle" font-size="15" font-weight="bold" fill="#999" filter="url(#rough2)">2</text>

  <rect x="204" y="52" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="230" y="70" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">#2</text>
  <text x="230" y="89" text-anchor="middle" font-size="15" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">3</text>

  <rect x="260" y="52" width="52" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="286" y="70" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">#3</text>
  <text x="286" y="89" text-anchor="middle" font-size="15" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">4</text>

  <rect x="316" y="52" width="52" height="44" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="342" y="70" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">#4</text>
  <text x="342" y="89" text-anchor="middle" font-size="15" font-weight="bold" fill="#999" filter="url(#rough2)">5</text>

  <rect x="384" y="54" width="116" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="442" y="71" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">操作 ↔ 子数组</text>
  <text x="442" y="88" text-anchor="middle" font-size="10" fill="#8a6d3a" filter="url(#rough2)">共 n(n+1)/2 = 15</text>

  <text x="260" y="132" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">每个 (l, r) 唯一对应一组（前缀, 后缀）⇒ 统计所有非空子数组的乘积 mod k</text>

  <!-- 桶迁移 -->
  <text x="260" y="160" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">k = 3，处理 i = 4：v = nums[4] mod 3 = 2</text>

  <rect x="36" y="170" width="160" height="88" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="116" y="189" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">cnt：以 #3 结尾</text>

  <rect x="52" y="198" width="42" height="44" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="73" y="212" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">r=0</text>
  <text x="73" y="234" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">3</text>

  <rect x="98" y="198" width="42" height="44" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="119" y="212" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">r=1</text>
  <text x="119" y="234" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>

  <rect x="144" y="198" width="42" height="44" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="165" y="212" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">r=2</text>
  <text x="165" y="234" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688" filter="url(#rough2)">0</text>

  <rect x="324" y="170" width="160" height="88" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="404" y="189" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">new_cnt：以 #4 结尾</text>

  <rect x="340" y="198" width="42" height="44" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="361" y="212" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">r=0</text>
  <text x="361" y="234" text-anchor="middle" font-size="15" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">3</text>

  <rect x="386" y="198" width="42" height="44" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="407" y="212" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">r=1</text>
  <text x="407" y="234" text-anchor="middle" font-size="15" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">0</text>

  <rect x="432" y="198" width="42" height="44" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="453" y="212" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">r=2</text>
  <text x="453" y="234" text-anchor="middle" font-size="15" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">2</text>

  <path d="M 200 197 C 240 187, 284 187, 320 197" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="260" y="180" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">延伸：r → r·v mod k</text>
  <text x="260" y="214" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">0×2≡0（3 个）</text>
  <text x="260" y="228" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">1×2≡2（1 个）</text>

  <text x="226" y="258" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">+1：新段 [4..4]，余 v = 2</text>
  <path d="M 312 258 C 356 270, 424 268, 449 246" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- 关键公式 -->
  <rect x="56" y="288" width="408" height="54" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">(a·b) mod k = ((a mod k)·(b mod k)) mod k</text>
  <text x="260" y="330" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">乘法同余：只存余数，乘积永远 ≤ (k−1)²，10⁹ 的元素也炸不了</text>

  <text x="260" y="366" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">k ≤ 5 ⇒ 每步只搬 5 个桶；每个子数组恰在自己的右端点被数一次</text>
</svg>
