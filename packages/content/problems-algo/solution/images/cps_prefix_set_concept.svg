<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：s 的前缀只有 |s| 个，预计算成集合</text>

  <!-- s label -->
  <text x="44" y="72" font-size="12" fill="#888">s =</text>

  <!-- s cells: a b c -->
  <rect x="80" y="56" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="104" y="78" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="128" y="56" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="78" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
  <rect x="176" y="56" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="78" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">c</text>

  <!-- index header -->
  <text x="104" y="48" text-anchor="middle" font-size="10" fill="#888">长度1</text>
  <text x="152" y="48" text-anchor="middle" font-size="10" fill="#888">长度2</text>
  <text x="200" y="48" text-anchor="middle" font-size="10" fill="#888">长度3</text>

  <!-- arrows from s to prefix set -->
  <path d="M 104 94 L 104 120 L 300 120 L 300 150" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 152 94 L 152 134 L 320 134 L 320 168" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 200 94 L 200 148 L 340 148 L 340 186" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="210" y="116" font-size="10" fill="#4a7a3a">取前 i 个字符</text>

  <!-- Prefix set box -->
  <rect x="270" y="150" width="240" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="390" y="170" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">前缀集合 P</text>
  <line x1="284" y1="178" x2="496" y2="178" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="300" y="196" font-size="13" fill="#333">"a"</text>
  <text x="300" y="216" font-size="13" fill="#333">"ab"</text>
  <text x="300" y="236" font-size="13" fill="#333">"abc"</text>
  <text x="360" y="196" font-size="10" fill="#888">← s[:1]</text>
  <text x="360" y="216" font-size="10" fill="#888">← s[:2]</text>
  <text x="360" y="236" font-size="10" fill="#888">← s[:3]</text>

  <!-- word examples -->
  <text x="44" y="160" font-size="12" fill="#888" font-weight="bold">逐词查表：</text>

  <!-- word: ab -> hit -->
  <rect x="80" y="266" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="105" y="286" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">"ab"</text>
  <path d="M 132 281 L 268 200" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="178" y="246" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 命中 → 计数</text>

  <!-- word: bc -> miss -->
  <rect x="80" y="312" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="105" y="332" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">"bc"</text>
  <path d="M 132 327 L 268 232" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="178" y="300" font-size="11" fill="#b85450" font-weight="bold">✗ 不在 P → 跳过</text>

  <!-- Core idea box -->
  <rect x="40" y="350" width="480" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="367" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">word 是 s 前缀 ⇔ word ∈ P；|P| = |s| ≤ 10，建表 O(|s|²)，查表 O(|word|)</text>
</svg>
