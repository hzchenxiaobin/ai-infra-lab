<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrY" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="16" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">单查询流程：分层区间交求 S + 双下界取 max</text>

  <!-- 开始 -->
  <rect x="85" y="34" width="190" height="32" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="54" text-anchor="middle" font-size="12" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">取下一查询 [l, r]</text>

  <!-- 初始化 -->
  <rect x="85" y="86" width="190" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="105" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">S=0；k=1；p=1（p=4^(k−1)）</text>

  <!-- 分层统计 -->
  <rect x="85" y="134" width="190" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="153" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">cnt = [l,r] ∩ [p, 4p−1] 元素个数</text>
  <text x="180" y="171" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">S += k × cnt</text>

  <!-- 判断 p <= r -->
  <polygon points="180,190 244,214 180,238 116,214" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="218" text-anchor="middle" font-size="12" fill="#8a6d3a" font-weight="bold" filter="url(#rough2)">p ≤ r ?</text>

  <!-- 循环回边 -->
  <path d="M 244 214 L 320 214 L 320 157 L 279 157" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrY)" filter="url(#rough2)"/>
  <text x="326" y="190" font-size="10.5" fill="#8a6d3a" filter="url(#rough2)">是：p ← 4p；k ← k+1</text>

  <!-- 求 D -->
  <rect x="85" y="252" width="190" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="271" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">D = r 连除 4 的次数</text>

  <!-- 累加答案 -->
  <rect x="85" y="300" width="190" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="319" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans += max(⌈S/2⌉, D)</text>

  <!-- 判断还有查询 -->
  <polygon points="180,338 238,362 180,386 122,362" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="366" text-anchor="middle" font-size="11.5" fill="#8a6d3a" font-weight="bold" filter="url(#rough2)">还有查询?</text>

  <!-- 是：回到开头 -->
  <path d="M 122 362 L 48 362 L 48 50 L 81 50" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="104" y="380" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="54" y="40" font-size="10" fill="#4a7a3a" filter="url(#rough2)">下一查询</text>

  <!-- 否：返回 -->
  <path d="M 238 362 L 300 362" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="258" y="354" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="304" y="346" width="110" height="32" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="359" y="366" text-anchor="middle" font-size="12" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <!-- 主干箭头 -->
  <path d="M 180 66 L 180 86" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 180 116 L 180 134" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 180 180 L 180 190" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 180 238 L 180 252" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 180 282 L 180 300" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 180 330 L 180 338" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="188" y="248" font-size="10.5" fill="#8a6d3a" filter="url(#rough2)">否</text>

  <!-- 右侧备注 -->
  <rect x="356" y="240" width="150" height="86" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.2" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="431" y="260" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">r ≤ 10⁹ &lt; 4¹⁵</text>
  <text x="431" y="277" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">⟹ 每查询至多 15 层</text>
  <text x="431" y="294" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">S ≤ 1.5×10¹⁰</text>
  <text x="431" y="313" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">C++ 用 long long</text>
</svg>
