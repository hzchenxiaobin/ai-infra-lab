<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：4 个账户分类计数</text>

  <!-- Step 1: Original data -->
  <text x="40" y="54" font-size="11" fill="#555" font-weight="bold">① 原始数据 Accounts 表</text>

  <!-- Header row -->
  <rect x="40" y="62" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="85" y="78" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">account_id</text>
  <rect x="130" y="62" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="78" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">income</text>

  <!-- Data rows -->
  <rect x="40" y="88" width="90" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="85" y="103" text-anchor="middle" font-size="10" fill="#333">3</text>
  <rect x="130" y="88" width="80" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="170" y="103" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">108939</text>

  <rect x="40" y="112" width="90" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="85" y="127" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="130" y="112" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="170" y="127" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">12747</text>

  <rect x="40" y="136" width="90" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="85" y="151" text-anchor="middle" font-size="10" fill="#333">8</text>
  <rect x="130" y="136" width="80" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="170" y="151" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">87709</text>

  <rect x="40" y="160" width="90" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="85" y="175" text-anchor="middle" font-size="10" fill="#333">6</text>
  <rect x="130" y="160" width="80" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="170" y="175" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">91796</text>

  <!-- Step 2: Classification -->
  <path d="M 230 124 L 270 124" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="290" y="54" font-size="11" fill="#555" font-weight="bold">② 逐行分类</text>

  <!-- Classification cards -->
  <rect x="280" y="62" width="120" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="340" y="80" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">108939 &gt; 50000 → High</text>

  <rect x="280" y="94" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="340" y="112" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">12747 &lt; 20000 → Low</text>

  <rect x="280" y="126" width="120" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="340" y="144" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">87709 &gt; 50000 → High</text>

  <rect x="280" y="158" width="120" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="340" y="176" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">91796 &gt; 50000 → High</text>

  <!-- Step 3: Count per category -->
  <path d="M 410 124 L 450 124" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="470" y="54" font-size="11" fill="#555" font-weight="bold">③ 分类计数</text>

  <rect x="450" y="62" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="505" y="80" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">Low: 1 个</text>

  <rect x="450" y="94" width="110" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="505" y="112" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">Average: 0 个</text>

  <rect x="450" y="126" width="110" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="505" y="144" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">High: 3 个</text>

  <!-- Arrow down to final output -->
  <path d="M 290 200 L 290 222" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Final output table -->
  <text x="40" y="244" font-size="11" fill="#555" font-weight="bold">④ 最终输出（恒定 3 行，Average 为 0 也保留）</text>

  <rect x="80" y="254" width="180" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="100" y="271" font-size="10" fill="#446688" font-weight="bold">category</text>
  <text x="220" y="271" font-size="10" fill="#446688" font-weight="bold">accounts_count</text>

  <rect x="80" y="282" width="180" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="298" font-size="10" fill="#4a7a3a">Low Salary</text>
  <text x="240" y="298" text-anchor="end" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>

  <rect x="80" y="308" width="180" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="324" font-size="10" fill="#446688">Average Salary</text>
  <text x="240" y="324" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold">0</text>

  <rect x="80" y="334" width="180" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="350" font-size="10" fill="#d6a040">High Salary</text>
  <text x="240" y="350" text-anchor="end" font-size="10" fill="#d6a040" font-weight="bold">3</text>

  <!-- Bottom summary -->
  <rect x="40" y="378" width="500" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="398" font-size="10.5" fill="#b85450" font-weight="bold">⚠️ Average Salary = 0 的行必须保留！</text>
  <text x="60" y="414" font-size="9.5" fill="#666">4 个账户中无 income ∈ [20000, 50000] 的 → COUNT(*) 在空结果集上返回 0</text>
  <text x="60" y="426" font-size="9.5" fill="#4a7a3a">无 GROUP BY 聚合恒返回 1 行 → UNION ALL 天然补零，无需额外处理</text>
</svg>
