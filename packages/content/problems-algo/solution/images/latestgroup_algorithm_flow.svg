<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：端点长度追踪 + cnt 计数</text>

  <!-- Init -->
  <rect x="120" y="42" width="300" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="63" text-anchor="middle" font-size="12" fill="#333">初始化 len[0..n+1]=0, cnt[0..n+1]=0, ans=−1</text>

  <!-- arrow -->
  <path d="M 270 74 L 270 92" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop header -->
  <rect x="120" y="96" width="300" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="117" text-anchor="middle" font-size="12" fill="#333">for i = 1 to n:   p = arr[i]</text>

  <!-- arrow -->
  <path d="M 270 128 L 270 146" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Read lengths -->
  <rect x="80" y="150" width="380" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="171" text-anchor="middle" font-size="12" fill="#333">L = len[p−1],  R = len[p+1],  new = L + 1 + R</text>

  <!-- arrow -->
  <path d="M 270 182 L 270 200" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Update cnt: decrement old, increment new -->
  <rect x="80" y="204" width="380" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="225" text-anchor="middle" font-size="12" fill="#333">cnt[L]−−,  cnt[R]−−   （旧段消失）</text>

  <!-- arrow -->
  <path d="M 270 236 L 270 254" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Update endpoints + cnt new -->
  <rect x="80" y="258" width="380" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="275" text-anchor="middle" font-size="12" fill="#333">len[p−L] = len[p+R] = len[p] = new</text>
  <text x="270" y="292" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">cnt[new]++   （新段出现）</text>

  <!-- arrow -->
  <path d="M 270 298 L 270 316" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: cnt[m] > 0? -->
  <polygon points="270,320 380,356 270,392 160,356" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="352" text-anchor="middle" font-size="12" fill="#333">cnt[m] &gt; 0 ?</text>
  <text x="270" y="368" text-anchor="middle" font-size="11" fill="#666">(存在长 m 的段)</text>

  <!-- Yes branch: ans = i, loop back -->
  <path d="M 160 356 L 70 356 L 70 112 L 120 112" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="62" y="240" text-anchor="middle" font-size="10" fill="#4a7a3a" transform="rotate(-90 62 240)">是 → ans = i → 下一轮</text>

  <!-- No branch: loop back -->
  <path d="M 380 356 L 470 356 L 470 112 L 420 112" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="478" y="240" text-anchor="middle" font-size="10" fill="#888" transform="rotate(90 478 240)">否 → 下一轮</text>

  <!-- End: return ans -->
  <path d="M 270 392 L 270 410" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="406" font-size="11" fill="#888">循环结束</text>
  <ellipse cx="270" cy="430" rx="70" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="435" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">返回 ans</text>
</svg>
