<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums=[3,1,3,4,3], k=6（排序+双指针）</text>

  <!-- Sorted array header -->
  <text x="30" y="56" font-size="12" fill="#888">排序后：</text>

  <!-- Sorted array boxes (shared, repeated per step with pointer annotations) -->
  <!-- Step 1 -->
  <text x="30" y="82" font-size="11" fill="#444" font-weight="bold">步骤 1</text>
  <rect x="100" y="68" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="146" y="68" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="168" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="192" y="68" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="214" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="238" y="68" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="284" y="68" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="306" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <!-- pointers -->
  <text x="168" y="112" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">↑left</text>
  <text x="306" y="112" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">↑right</text>
  <text x="380" y="88" font-size="11" fill="#333">sum = 1+4 = 5 &lt; 6</text>
  <text x="380" y="104" font-size="11" fill="#d6a040" font-weight="bold">→ left++</text>
  <text x="380" y="120" font-size="10" fill="#888">和太小，左指针右移</text>

  <!-- Step 2 -->
  <line x1="20" y1="130" x2="580" y2="130" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="30" y="152" font-size="11" fill="#444" font-weight="bold">步骤 2</text>
  <rect x="100" y="138" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="158" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="146" y="138" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="168" y="158" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="192" y="138" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="214" y="158" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="238" y="138" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="158" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="284" y="138" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="306" y="158" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <text x="168" y="182" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">↑left</text>
  <text x="306" y="182" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">↑right</text>
  <text x="380" y="158" font-size="11" fill="#333">sum = 3+4 = 7 &gt; 6</text>
  <text x="380" y="174" font-size="11" fill="#b85450" font-weight="bold">→ right−−</text>
  <text x="380" y="190" font-size="10" fill="#888">和太大，右指针左移</text>

  <!-- Step 3 -->
  <line x1="20" y1="200" x2="580" y2="200" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="30" y="222" font-size="11" fill="#444" font-weight="bold">步骤 3</text>
  <rect x="100" y="208" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="228" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="146" y="208" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="168" y="228" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="192" y="208" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="214" y="228" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="238" y="208" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="228" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="284" y="208" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="306" y="228" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <text x="168" y="252" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">↑left</text>
  <text x="260" y="252" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">↑right</text>
  <text x="380" y="222" font-size="11" fill="#333">sum = 3+3 = 6 = k ✓</text>
  <text x="380" y="238" font-size="11" fill="#4a7a3a" font-weight="bold">→ ans=1, left++, right−−</text>
  <text x="380" y="254" font-size="10" fill="#888">命中！配对成功</text>

  <!-- Step 4 -->
  <line x1="20" y1="264" x2="580" y2="264" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="30" y="286" font-size="11" fill="#444" font-weight="bold">步骤 4</text>
  <rect x="100" y="272" width="44" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="122" y="292" text-anchor="middle" font-size="13" fill="#aaa" font-weight="bold">1</text>
  <rect x="146" y="272" width="44" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="168" y="292" text-anchor="middle" font-size="13" fill="#aaa" font-weight="bold">3</text>
  <rect x="192" y="272" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="214" y="292" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="238" y="272" width="44" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="260" y="292" text-anchor="middle" font-size="13" fill="#aaa" font-weight="bold">3</text>
  <rect x="284" y="272" width="44" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="306" y="292" text-anchor="middle" font-size="13" fill="#aaa" font-weight="bold">4</text>
  <text x="214" y="316" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">↑left=right</text>
  <text x="380" y="286" font-size="11" fill="#333">left == right，剩余 &lt; 2 个</text>
  <text x="380" y="302" font-size="11" fill="#b85450" font-weight="bold">→ 循环结束，返回 ans=1</text>
  <text x="380" y="318" font-size="10" fill="#888">灰底=已配对移除</text>

  <!-- Summary -->
  <rect x="30" y="336" width="540" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="50" y="358" font-size="11" fill="#555" font-weight="bold">结果：3 个 3 中两两配对成 1 组（k/2=3 自配），剩余 1 个 3 和 1、4 均无法凑 6</text>
  <text x="50" y="376" font-size="11" fill="#555">对照哈希表法：freq[3]=3, v==k−v → 3//2=1 对，结果一致 ✓</text>
</svg>
