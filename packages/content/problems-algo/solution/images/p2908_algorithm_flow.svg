<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="430" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一遍预处理后缀最小 + 一遍枚举山峰，O(n) 时间</text>

  <!-- start box -->
  <rect x="200" y="44" width="220" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="67" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">读入 nums，ans ← +∞</text>

  <path d="M 310 80 L 310 100" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- pass 1 box -->
  <rect x="85" y="102" width="450" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="126" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">第一遍 · 从右往左（建后缀最小 suf）</text>
  <text x="310" y="150" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">suf[n] ← +∞ ；  for k = n−1 downto 0:</text>
  <text x="310" y="172" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">suf[k] ← min( nums[k], suf[k+1] )</text>
  <text x="548" y="126" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">⟲</text>

  <path d="M 310 188 L 310 208" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- pass 2 box -->
  <rect x="85" y="210" width="450" height="110" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="234" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">第二遍 · 从左往右（枚举山峰 j，滚动 preMin）</text>
  <text x="310" y="258" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">preMin ← +∞ ；  for j = 0 to n−1:</text>
  <text x="310" y="280" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">若 preMin &lt; nums[j] 且 suf[j+1] &lt; nums[j]：ans ← min(ans, 三项和)</text>
  <text x="310" y="302" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">preMin ← min( preMin, nums[j] )</text>
  <text x="548" y="234" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">⟲</text>

  <path d="M 310 320 L 310 340" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="180,378 310,342 440,378 310,414" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="382" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ans 仍是 +∞ ？</text>

  <!-- branches -->
  <path d="M 180 378 L 132 378" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="20" y="360" width="108" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="74" y="382" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 −1</text>

  <path d="M 440 378 L 490 378" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="492" y="360" width="108" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="546" y="382" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <text x="310" y="426" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">⚠️ 严格比较 &lt;（等高不算更矮）；suf 多开一位 +∞ 哨兵，右边界免特判</text>
</svg>
