<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：扫描线 + 大根堆，缺券就取「伸得最远」的查询</text>

  <!-- A 初始化 -->
  <rect x="120" y="40" width="280" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="58" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">查询按 l 升序排序</text>
  <text x="260" y="75" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">pool ← 大根堆；expire ← 0；cur = used = j = 0</text>
  <path d="M 260 84 L 260 100" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B 扫描 -->
  <rect x="160" y="102" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="122" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">扫描下标 i = 0 … n−1</text>
  <path d="M 260 134 L 260 150" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- C 进场 -->
  <rect x="125" y="152" width="270" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="172" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">所有 l ≤ i 的查询：r 压入 pool</text>
  <path d="M 260 184 L 260 200" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D 退役 -->
  <rect x="105" y="202" width="310" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="222" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">cur −= expire[i]：r &lt; i 的已选查询退役</text>
  <path d="M 260 234 L 260 248" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- E 判定 cur < nums[i] -->
  <polygon points="175,282 260,252 345,282 260,312" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="286" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">cur &lt; nums[i] ?</text>
  <!-- E 否：下一位 -->
  <path d="M 345 282 L 470 282 L 470 119 L 366 119" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="404" y="273" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">否 · 转下一位 i</text>
  <!-- E 是 -->
  <path d="M 260 312 L 260 334" fill="none" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="270" y="328" font-size="9.5" fill="#a07830" filter="url(#rough2)">是</text>

  <!-- F 判定堆 -->
  <polygon points="160,372 260,340 360,372 260,404" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="369" text-anchor="middle" font-size="9.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">pool 空或堆顶 r &lt; i ?</text>
  <!-- F 是 → -1 -->
  <path d="M 260 404 L 260 426" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="419" font-size="9.5" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="200" y="428" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="447" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 −1</text>
  <!-- F 否 → H 选中堆顶 -->
  <path d="M 360 372 L 392 372" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="376" y="363" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">否</text>
  <rect x="394" y="344" width="122" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="455" y="362" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">弹出堆顶 r* 选中</text>
  <text x="455" y="378" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">cur+1，used+1</text>
  <text x="455" y="393" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">expire[r*+1] += 1</text>
  <!-- H 回到 E 再判定 -->
  <path d="M 455 344 L 455 232 L 272 232" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="362" y="225" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">选中后再判定</text>

  <!-- 循环结束出口 -->
  <path d="M 160 118 L 95 118 L 95 443 L 196 443" fill="none" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="22" y="428" width="174" height="30" fill="#f7fbf7" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="5 4" rx="8" filter="url(#rough2)"/>
  <text x="109" y="447" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">i 扫完 → 返回 q − used</text>
  <text x="84" y="290" font-size="9" fill="#7a9a7a" filter="url(#rough2)" transform="rotate(-90 84 290)">i 用尽</text>
</svg>
