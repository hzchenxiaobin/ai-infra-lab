<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <!-- 老鼠1 -->
  <ellipse cx="90" cy="80" rx="34" ry="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="116" cy="74" r="4" fill="#446688" filter="url(#rough2)"/>
  <circle cx="78" cy="62" r="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="120" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">老鼠1 (吃 k 块)</text>

  <!-- 老鼠2 -->
  <ellipse cx="450" cy="80" rx="34" ry="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <circle cx="424" cy="74" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="462" cy="62" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="450" y="120" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">老鼠2 (吃 n-k 块)</text>

  <!-- 初始：全给老鼠2 -->
  <text x="270" y="40" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)" font-weight="bold">初始：n 块全给老鼠2 → sum(reward2)</text>

  <!-- 奶酪块们 -->
  <g font-size="12" fill="#333">
    <rect x="120" y="160" width="48" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="144" y="182" text-anchor="middle" filter="url(#rough2)">i=0</text>
    <rect x="180" y="160" width="48" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="204" y="182" text-anchor="middle" filter="url(#rough2)">i=1</text>
    <rect x="240" y="160" width="48" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="264" y="182" text-anchor="middle" filter="url(#rough2)">i=2</text>
    <rect x="300" y="160" width="48" height="34" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="324" y="182" text-anchor="middle" filter="url(#rough2)">i=3</text>
    <text x="372" y="182" font-size="16" filter="url(#rough2)">...</text>
  </g>

  <!-- 转移箭头：把 k 块从老鼠2 转给老鼠1 -->
  <path d="M 360 100 C 300 70, 200 70, 150 100" fill="none" stroke="#b85450" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="255" y="92" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">转移 k 块给老鼠1</text>

  <!-- 增量说明框 -->
  <rect x="70" y="240" width="400" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="262" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">把第 i 块从老鼠2 转给老鼠1，得分变化：</text>
  <text x="270" y="282" text-anchor="middle" font-size="15" fill="#b85450" filter="url(#rough2)" font-weight="bold">gain(i) = reward1[i] − reward2[i]</text>

  <!-- 结论 -->
  <rect x="70" y="318" width="400" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="346" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">取 gain 最大的 k 块转移 → 答案最大</text>
</svg>
