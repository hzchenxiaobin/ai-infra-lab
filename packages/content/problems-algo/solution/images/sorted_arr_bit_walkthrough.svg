<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="460" fill="#fafafa"/>
  <text x="330" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：instructions=[1,5,6,2] → 总代价=1</text>

  <!-- Table header -->
  <g filter="url(#rough2)">
    <rect x="20" y="46" width="620" height="30" fill="#f0f7ff" stroke="#446688" stroke-width="1.3" rx="4"/>
    <line x1="58" y1="46" x2="58" y2="76" stroke="#446688" stroke-width="1"/>
    <line x1="108" y1="46" x2="108" y2="76" stroke="#446688" stroke-width="1"/>
    <line x1="250" y1="46" x2="250" y2="76" stroke="#446688" stroke-width="1"/>
    <line x1="370" y1="46" x2="370" y2="76" stroke="#446688" stroke-width="1"/>
    <line x1="490" y1="46" x2="490" y2="76" stroke="#446688" stroke-width="1"/>
  </g>
  <text x="39" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">步</text>
  <text x="83" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">x</text>
  <text x="179" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">nums（插入前）</text>
  <text x="310" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">less / greater</text>
  <text x="430" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">cost=min</text>
  <text x="575" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">nums（插入后）</text>

  <!-- Row 1: x=1 -->
  <g filter="url(#rough2)">
    <rect x="20" y="76" width="620" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <line x1="58" y1="76" x2="58" y2="136" stroke="#446688" stroke-width="1"/>
    <line x1="108" y1="76" x2="108" y2="136" stroke="#446688" stroke-width="1"/>
    <line x1="250" y1="76" x2="250" y2="136" stroke="#446688" stroke-width="1"/>
    <line x1="370" y1="76" x2="370" y2="136" stroke="#446688" stroke-width="1"/>
    <line x1="490" y1="76" x2="490" y2="136" stroke="#446688" stroke-width="1"/>
  </g>
  <text x="39" y="110" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">①</text>
  <text x="83" y="110" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <text x="179" y="110" text-anchor="middle" font-size="11" fill="#888">[]（空）</text>
  <text x="310" y="104" text-anchor="middle" font-size="10.5" fill="#4a7a3a">less=0</text>
  <text x="310" y="120" text-anchor="middle" font-size="10.5" fill="#b85450">greater=0</text>
  <text x="430" y="110" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="575" y="110" text-anchor="middle" font-size="11" fill="#333">[1]</text>

  <!-- Row 2: x=5 -->
  <g filter="url(#rough2)">
    <rect x="20" y="136" width="620" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <line x1="58" y1="136" x2="58" y2="196" stroke="#446688" stroke-width="1"/>
    <line x1="108" y1="136" x2="108" y2="196" stroke="#446688" stroke-width="1"/>
    <line x1="250" y1="136" x2="250" y2="196" stroke="#446688" stroke-width="1"/>
    <line x1="370" y1="136" x2="370" y2="196" stroke="#446688" stroke-width="1"/>
    <line x1="490" y1="136" x2="490" y2="196" stroke="#446688" stroke-width="1"/>
  </g>
  <text x="39" y="170" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">②</text>
  <text x="83" y="170" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">5</text>
  <text x="179" y="170" text-anchor="middle" font-size="11" fill="#333">[1]</text>
  <text x="310" y="164" text-anchor="middle" font-size="10.5" fill="#4a7a3a">less=query(4)=1</text>
  <text x="310" y="180" text-anchor="middle" font-size="10.5" fill="#b85450">greater=1−1=0</text>
  <text x="430" y="170" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="575" y="170" text-anchor="middle" font-size="11" fill="#333">[1,5]</text>

  <!-- Row 3: x=6 -->
  <g filter="url(#rough2)">
    <rect x="20" y="196" width="620" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <line x1="58" y1="196" x2="58" y2="256" stroke="#446688" stroke-width="1"/>
    <line x1="108" y1="196" x2="108" y2="256" stroke="#446688" stroke-width="1"/>
    <line x1="250" y1="196" x2="250" y2="256" stroke="#446688" stroke-width="1"/>
    <line x1="370" y1="196" x2="370" y2="256" stroke="#446688" stroke-width="1"/>
    <line x1="490" y1="196" x2="490" y2="256" stroke="#446688" stroke-width="1"/>
  </g>
  <text x="39" y="230" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">③</text>
  <text x="83" y="230" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">6</text>
  <text x="179" y="230" text-anchor="middle" font-size="11" fill="#333">[1,5]</text>
  <text x="310" y="224" text-anchor="middle" font-size="10.5" fill="#4a7a3a">less=query(5)=2</text>
  <text x="310" y="240" text-anchor="middle" font-size="10.5" fill="#b85450">greater=2−2=0</text>
  <text x="430" y="230" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="575" y="230" text-anchor="middle" font-size="11" fill="#333">[1,5,6]</text>

  <!-- Row 4: x=2 (key step, highlighted) -->
  <g filter="url(#rough2)">
    <rect x="20" y="256" width="620" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <line x1="58" y1="256" x2="58" y2="324" stroke="#d6a040" stroke-width="1"/>
    <line x1="108" y1="256" x2="108" y2="324" stroke="#d6a040" stroke-width="1"/>
    <line x1="250" y1="256" x2="250" y2="324" stroke="#d6a040" stroke-width="1"/>
    <line x1="370" y1="256" x2="370" y2="324" stroke="#d6a040" stroke-width="1"/>
    <line x1="490" y1="256" x2="490" y2="324" stroke="#d6a040" stroke-width="1"/>
  </g>
  <text x="39" y="294" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">④</text>
  <text x="83" y="294" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">2</text>
  <text x="179" y="290" text-anchor="middle" font-size="11" fill="#333">[1,5,6]</text>
  <text x="179" y="306" text-anchor="middle" font-size="9" fill="#888">total=3</text>
  <text x="310" y="288" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">less=query(1)=1</text>
  <text x="310" y="304" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">greater=3−1=2</text>
  <text x="430" y="294" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">min=1</text>
  <text x="575" y="294" text-anchor="middle" font-size="11" fill="#333">[1,2,5,6]</text>

  <!-- Result -->
  <g filter="url(#rough2)">
    <rect x="20" y="340" width="620" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
  </g>
  <text x="330" y="363" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">总代价 = 0+0+0+1 = 1  ✓  与示例 1 一致</text>

  <!-- Key insight -->
  <g filter="url(#rough2)">
    <rect x="20" y="388" width="620" height="58" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3" rx="6"/>
  </g>
  <text x="330" y="408" text-anchor="middle" font-size="10.5" fill="#444">关键：步④ 插入 2 时，less=query(1)=1（只有 1 比它小），greater=3−query(2)=2（5、6 比它大）</text>
  <text x="330" y="424" text-anchor="middle" font-size="10.5" fill="#444">取 min(1,2)=1：把 2 插到 1 之后（移动 1 个更大元素），比插到 5 之前（移动 2 个）更省</text>
  <text x="330" y="440" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">BIT 让 less / greater 的查询都降到 O(log V)</text>
</svg>
