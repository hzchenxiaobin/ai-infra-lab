<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">二维 DP：dp[i][j] = 让 word1[0..i-1] 与 word2[0..j-1] 相同的最小删除步数</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">匹配时走对角不增，不匹配时 1 + min(上,左)</text>

  <!-- ===== dp table grid (3x3 示意) ===== -->
  <g font-size="11" fill="#333">
    <!-- corner label -->
    <rect x="100" y="60" width="50" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
    <text x="125" y="79" text-anchor="middle" font-size="9" fill="#888">w2→</text>
    <text x="92" y="50" font-size="9" fill="#888" font-weight="bold">w1↓</text>

    <!-- column headers: "" a b c -->
    <rect x="150" y="60" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="175" y="79" text-anchor="middle" fill="#888">""</text>
    <rect x="200" y="60" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="225" y="79" text-anchor="middle" fill="#446688" font-weight="bold">a</text>
    <rect x="250" y="60" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="275" y="79" text-anchor="middle" fill="#446688" font-weight="bold">b</text>
    <rect x="300" y="60" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="325" y="79" text-anchor="middle" fill="#446688" font-weight="bold">c</text>

    <!-- row headers: "" a b -->
    <rect x="100" y="90" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="125" y="109" text-anchor="middle" fill="#888">""</text>
    <rect x="100" y="120" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="125" y="139" text-anchor="middle" fill="#446688" font-weight="bold">a</text>
    <rect x="100" y="150" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="125" y="169" text-anchor="middle" fill="#446688" font-weight="bold">b</text>

    <!-- row "" (边界 = 列号) -->
    <rect x="150" y="90" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="175" y="109" text-anchor="middle" fill="#b85450" font-weight="bold">0</text>
    <rect x="200" y="90" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="225" y="109" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="250" y="90" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="275" y="109" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <rect x="300" y="90" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="325" y="109" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>

    <!-- row a: 边界=1, 匹配格, 普通格, 普通格 -->
    <rect x="150" y="120" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="175" y="139" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="200" y="120" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="225" y="139" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="250" y="120" width="50" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="275" y="139" text-anchor="middle" fill="#555">2</text>
    <rect x="300" y="120" width="50" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="325" y="139" text-anchor="middle" fill="#555">3</text>

    <!-- row b: 边界=2, 普通格, 普通格, 普通格 -->
    <rect x="150" y="150" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="175" y="169" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <rect x="200" y="150" width="50" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="225" y="169" text-anchor="middle" fill="#555">2</text>
    <rect x="250" y="150" width="50" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="275" y="169" text-anchor="middle" fill="#555">2</text>
    <rect x="300" y="150" width="50" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="325" y="169" text-anchor="middle" fill="#555">3</text>
  </g>

  <!-- ===== transition arrows from dp[a][a]=1 (匹配格) ===== -->
  <!-- diagonal arrow (match) from dp[0][0] to dp[1][1] -->
  <path d="M 165 115 L 218 128" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="4,2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="150" y="100" font-size="9" fill="#4a7a3a" font-weight="bold">匹配 不增</text>

  <!-- ===== transition arrows from dp[a][b]=2 (不匹配格) ===== -->
  <!-- from上方 dp[0][2]=2 -->
  <path d="M 225 122 L 273 148" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <!-- from左方 dp[1][1]=1 -->
  <path d="M 248 135 L 270 148" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="258" y="118" font-size="9" fill="#d6a040" font-weight="bold">不匹配 +1</text>

  <!-- ===== transition legend ===== -->
  <rect x="380" y="90" width="180" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="470" y="110" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">状态转移</text>
  <text x="394" y="130" font-size="10" fill="#4a7a3a" font-weight="bold">匹配: dp[i-1][j-1]</text>
  <text x="394" y="144" font-size="9" fill="#888">→ 对角线，值不变</text>
  <text x="394" y="164" font-size="10" fill="#d6a040" font-weight="bold">不匹配: 1 + min(上,左)</text>
  <text x="394" y="178" font-size="9" fill="#888">→ 删其一，步数 +1</text>
  <text x="394" y="194" font-size="9" fill="#b85450" font-weight="bold">边界: dp[0][j]=j, dp[i][0]=i</text>

  <!-- ===== formulas ===== -->
  <rect x="40" y="210" width="500" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="60" y="232" font-family="monospace" font-size="11" fill="#4a7a3a">if word1[i-1] == word2[j-1]:  dp[i][j] = dp[i-1][j-1]</text>
  <text x="60" y="252" font-family="monospace" font-size="11" fill="#d6a040">else:                         dp[i][j] = 1 + min(dp[i-1][j], dp[i][j-1])</text>

  <!-- ===== boundary ===== -->
  <rect x="40" y="280" width="500" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="290" y="302" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">边界：dp[0][j] = j, dp[i][0] = i（空串需删光另一侧全部字符）</text>

  <!-- ===== answer ===== -->
  <rect x="40" y="328" width="500" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="290" y="350" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">答案：dp[m][n]（右下角，最小删除步数）</text>

  <!-- ===== key insight ===== -->
  <rect x="40" y="374" width="500" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="290" y="388" text-anchor="middle" font-size="10" fill="#555">填表顺序：从左到右、从上到下（依赖左上、上、左）</text>
</svg>
