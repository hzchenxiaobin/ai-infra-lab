<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：连续同向减法 = 一次除法取商与余数</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">num1 远大于 num2 时，逐次减 num2 可批量合并为 num1 / num2 与 num1 % num2</text>

  <!-- ===== Top: brute subtraction chain (num1=7, num2=3) ===== -->
  <text x="28" y="72" font-size="10.5" fill="#666">暴力逐次减</text>

  <!-- 7 -->
  <rect x="68" y="56" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="91" y="79" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">7</text>

  <!-- arrow -3 -->
  <path d="M 116 74 L 152 74" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="134" y="68" text-anchor="middle" font-size="9.5" fill="#b85450">−3</text>
  <text x="134" y="90" text-anchor="middle" font-size="8.5" fill="#b85450">ops+1</text>

  <!-- 4 -->
  <rect x="156" y="56" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="179" y="79" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>

  <!-- arrow -3 -->
  <path d="M 204 74 L 240 74" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="222" y="68" text-anchor="middle" font-size="9.5" fill="#b85450">−3</text>
  <text x="222" y="90" text-anchor="middle" font-size="8.5" fill="#b85450">ops+1</text>

  <!-- 1 -->
  <rect x="244" y="56" width="46" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="267" y="79" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <!-- note: 2 ops, now 1 < 3 -->
  <text x="318" y="70" font-size="10" fill="#888">共 2 次操作</text>
  <text x="318" y="84" font-size="10" fill="#888">num1=1 &lt; num2=3</text>
  <text x="318" y="98" font-size="10" fill="#888">→ 方向反转</text>

  <!-- ===== Middle: equivalent division ===== -->
  <text x="28" y="130" font-size="10.5" fill="#666">除法批量</text>

  <!-- big box: 7 // 3 = 2, 7 % 3 = 1 -->
  <rect x="68" y="114" width="220" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="178" y="134" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">7 / 3 = 2（商=操作数）</text>
  <text x="178" y="152" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">7 % 3 = 1（余数=新 num1）</text>

  <!-- big arrow from subtraction chain down to division (equivalence) -->
  <path d="M 179 96 L 179 112" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="232" y="108" font-size="10" fill="#4a7a3a" font-weight="bold">等价！</text>

  <!-- right side note on division -->
  <rect x="300" y="114" width="200" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="400" y="132" text-anchor="middle" font-size="10.5" fill="#333">2 次减法 → 1 次除法</text>
  <text x="400" y="148" text-anchor="middle" font-size="10.5" fill="#333">ops += 2，num1 = 1</text>
  <text x="400" y="160" text-anchor="middle" font-size="9.5" fill="#888">O(k) → O(1)</text>

  <!-- ===== Bottom: general formula ===== -->
  <rect x="40" y="186" width="440" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="206" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">一般情形：num1 ≥ num2 &gt; 0</text>
  <text x="260" y="226" text-anchor="middle" font-size="11" fill="#555">连续减到 num1 &lt; num2 共需 k = ⌊num1 / num2⌋ 次</text>
  <text x="260" y="244" text-anchor="middle" font-size="11" fill="#555">ops += k ；num1 = num1 % num2（即 num1 − k·num2）</text>

  <!-- ===== Footer: GCD tie-in ===== -->
  <text x="260" y="282" text-anchor="middle" font-size="10.5" fill="#888">结构与辗转相除求 GCD 同构：GCD 丢商留余，本题累加商</text>
  <text x="260" y="300" text-anchor="middle" font-size="10.5" fill="#888">每轮较大数严格减小 → 必终止，轮数 O(log max)</text>
  <text x="260" y="324" text-anchor="middle" font-size="10" fill="#aaa">对照：拉梅定理 — 最坏输入为相邻斐波那契数，每轮商均为 1</text>
  <text x="260" y="342" text-anchor="middle" font-size="10" fill="#aaa">→ 退化为辗转相减，此时除法版与暴力版步数相同</text>
</svg>
