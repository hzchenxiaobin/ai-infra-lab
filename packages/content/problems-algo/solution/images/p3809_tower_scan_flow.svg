<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="540" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">单次遍历：距离过滤 + 打擂台更新</text>

  <!-- 初始化 -->
  <g filter="url(#rough2)">
    <rect x="170" y="36" width="220" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="54" text-anchor="middle" font-size="12" fill="#33506b">best ← [−1,−1]，bestQ ← −1</text>
    <text x="280" y="71" text-anchor="middle" font-size="10.5" fill="#33506b">（哨兵：首个可达塔必然接管）</text>
  </g>
  <path d="M 280 82 L 280 100" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取塔 -->
  <g filter="url(#rough2)">
    <rect x="155" y="104" width="250" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="125" text-anchor="middle" font-size="12.5" fill="#33506b">取下一座塔 (x, y, q)</text>
  </g>
  <path d="M 280 136 L 280 154" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 距离计算 -->
  <g filter="url(#rough2)">
    <rect x="140" y="158" width="280" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="181" text-anchor="middle" font-size="12.5" fill="#33506b">d = |x−cx| + |y−cy|（不开方、不平方）</text>
  </g>
  <path d="M 280 194 L 280 210" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 1：可达？ -->
  <g filter="url(#rough2)">
    <polygon points="280,212 380,246 280,280 180,246" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="280" y="251" text-anchor="middle" font-size="12.5" fill="#33506b">d ≤ radius ?</text>
  </g>
  <text x="398" y="238" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 380 246 L 420 246" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="424" y="228" width="124" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="486" y="251" text-anchor="middle" font-size="11.5" fill="#b85450">不可到达 → 跳过</text>
  </g>
  <path d="M 486 264 L 486 412 L 400 412" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 是 → 打擂台 -->
  <path d="M 280 280 L 280 300" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="296" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 打擂台 -->
  <g filter="url(#rough2)">
    <rect x="105" y="304" width="350" height="58" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="280" y="322" text-anchor="middle" font-size="11.5" fill="#8a6d1a">打擂台：仅当 —— 才更换擂主</text>
    <text x="280" y="339" text-anchor="middle" font-size="11.5" fill="#8a6d1a">q &gt; bestQ</text>
    <text x="280" y="356" text-anchor="middle" font-size="11.5" fill="#8a6d1a">或 q = bestQ 且 [x,y] 字典序更小</text>
  </g>
  <path d="M 280 362 L 280 376" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 还有塔？ -->
  <g filter="url(#rough2)">
    <polygon points="280,378 392,412 280,446 168,412" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="280" y="417" text-anchor="middle" font-size="12.5" fill="#33506b">还有塔？</text>
  </g>

  <!-- 是 → 回到取塔 -->
  <path d="M 168 412 L 60 412 L 60 120 L 149 120" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="404" font-size="11.5" fill="#446688" filter="url(#rough2)">是 · 下一座</text>

  <!-- 否 → 返回 -->
  <path d="M 280 446 L 280 466" stroke="#7a8aa0" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="293" y="462" font-size="12" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- 返回 -->
  <g filter="url(#rough2)">
    <rect x="175" y="470" width="210" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="280" y="489" text-anchor="middle" font-size="13" fill="#2f5d24">返回 best</text>
    <text x="280" y="506" text-anchor="middle" font-size="10" fill="#2f5d24">（从未更换 → 恰为 [−1,−1]）</text>
  </g>

  <!-- 易错提示 -->
  <g filter="url(#rough2)">
    <text x="508" y="480" text-anchor="middle" font-size="10" fill="#b85450">易错：</text>
    <text x="508" y="494" text-anchor="middle" font-size="10" fill="#b85450">① &gt; 写成 ≥</text>
    <text x="508" y="508" text-anchor="middle" font-size="10" fill="#b85450">② 字典序只比 x</text>
  </g>
</svg>
