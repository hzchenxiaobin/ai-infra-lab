<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：从起点向 4 邻同色像素「漫灌」</text>

  <!-- left: before flood -->
  <text x="110" y="62" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① 起点 (1,1) = 颜色 1</text>

  <!-- grid 3x3, cell 64x64, x=46..238, y=72..264 -->
  <!-- row 0 -->
  <rect x="46" y="72" width="64" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="78" y="110" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold">1</text>
  <rect x="110" y="72" width="64" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="142" y="110" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold">1</text>
  <rect x="174" y="72" width="64" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="206" y="110" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold">1</text>
  <!-- row 1 -->
  <rect x="46" y="136" width="64" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="78" y="174" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold">1</text>
  <!-- start cell highlighted -->
  <rect x="110" y="136" width="64" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="2.6" rx="3" filter="url(#rough2)"/>
  <text x="142" y="174" text-anchor="middle" font-size="18" fill="#b85450" font-weight="bold">1</text>
  <rect x="174" y="136" width="64" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="206" y="174" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold">0</text>
  <!-- row 2 -->
  <rect x="46" y="200" width="64" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="78" y="238" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold">1</text>
  <rect x="110" y="200" width="64" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="142" y="238" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold">0</text>
  <rect x="174" y="200" width="64" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="206" y="238" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold">1</text>

  <!-- 4-direction arrows from start (1,1) -->
  <path d="M 142 132 L 142 102" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 142 204 L 142 234" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 106 168 L 84 168" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 178 168 L 200 168" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="142" y="286" text-anchor="middle" font-size="10.5" fill="#b85450">↑↓←→ 只漫灌「同色」邻格，遇 0 即停</text>

  <!-- middle arrow -->
  <text x="266" y="170" font-size="22" fill="#d6a040" font-weight="bold">→</text>

  <!-- right: after flood -->
  <text x="400" y="62" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">② 同色连通块全染成新色 2</text>

  <!-- grid 3x3 after -->
  <rect x="336" y="72" width="64" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="368" y="110" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="400" y="72" width="64" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="432" y="110" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="464" y="72" width="64" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="496" y="110" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="336" y="136" width="64" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="368" y="174" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="400" y="136" width="64" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.6" rx="3" filter="url(#rough2)"/>
  <text x="432" y="174" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="464" y="136" width="64" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="496" y="174" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold">0</text>
  <rect x="336" y="200" width="64" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="368" y="238" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="400" y="200" width="64" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="432" y="238" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold">0</text>
  <rect x="464" y="200" width="64" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="496" y="238" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold">1</text>

  <text x="432" y="286" text-anchor="middle" font-size="10.5" fill="#4a7a3a">起点连通块（值 1）→ 2；其余不动</text>

  <!-- legend -->
  <rect x="40" y="312" width="480" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <rect x="56" y="324" width="16" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
  <text x="78" y="336" font-size="11" fill="#b85450">起点</text>
  <rect x="120" y="324" width="16" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="142" y="336" font-size="11" fill="#446688">同色（待染）</text>
  <rect x="220" y="324" width="16" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="242" y="336" font-size="11" fill="#4a7a3a">已染新色</text>
  <rect x="312" y="324" width="16" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="334" y="336" font-size="11" fill="#d6a040">异色（阻断）</text>
  <text x="280" y="356" text-anchor="middle" font-size="11" fill="#555">Flood Fill = 在「同色 4-连通块」上做 DFS/BFS，统一改色</text>
</svg>
