<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="18" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：后缀 MEX 封顶 + 最短块留长尾</text>
  <text x="260" y="36" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">示例 nums = [0,1,1,2,2]：后缀 MEX x = 3 → 最短块集齐 {0,1,2}；剩 [2] 无 0 → 补 0</text>

  <text x="201" y="56" text-anchor="middle" font-size="9.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">块₁：最短前缀，恰好集齐 {0,1,2}</text>
  <path d="M 110 60 L 110 65 L 292 65 L 292 60" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <rect x="110" y="68" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="156" y="68" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="202" y="68" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="248" y="68" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="294" y="68" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>

  <text x="132" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="178" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="224" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="270" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="316" y="90" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">2</text>

  <text x="132" y="112" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">i</text>
  <text x="270" y="112" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">j</text>
  <text x="316" y="112" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">尾巴</text>

  <path d="M 201 118 C 201 130, 176 132, 172 142" fill="none" stroke="#888" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="196" y="132" font-size="9" fill="#666" filter="url(#rough2)">MEX(块₁) = 3</text>
  <path d="M 316 118 C 316 130, 292 132, 288 142" fill="none" stroke="#888" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="132" font-size="9" fill="#666" filter="url(#rough2)">剩 [2]：MEX = 0</text>

  <rect x="152" y="146" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="264" y="146" width="44" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="174" y="168" text-anchor="middle" font-size="12" fill="#3d6330" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="286" y="168" text-anchor="middle" font-size="12" fill="#3d6330" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="230" y="192" text-anchor="middle" font-size="10" fill="#3d6330" font-weight="bold" filter="url(#rough2)">result = [3, 0]（字典序最大）</text>

  <rect x="24" y="204" width="236" height="104" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="142" y="222" text-anchor="middle" font-size="10.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">① MEX 封顶：下一值最大就是 x</text>
  <text x="34" y="242" font-size="9.5" fill="#555" filter="url(#rough2)">块 ⊆ 剩余后缀 ⇒ MEX(块) ≤ MEX(后缀) = x</text>
  <text x="34" y="260" font-size="9.5" fill="#555" filter="url(#rough2)">取整段后缀恰好得到 x ⇒ 贪心下一值 = x</text>
  <text x="34" y="278" font-size="9.5" fill="#555" filter="url(#rough2)">块 MEX = x ⟺ 块内集齐 0..x−1</text>
  <text x="34" y="296" font-size="9.5" fill="#555" filter="url(#rough2)">（x 在整个后缀缺席，块里也不可能有小 x）</text>

  <rect x="272" y="204" width="228" height="104" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="386" y="222" text-anchor="middle" font-size="10.5" fill="#3d6330" font-weight="bold" filter="url(#rough2)">② 最短块留长尾（交换论证）</text>
  <text x="282" y="242" font-size="9.5" fill="#555" filter="url(#rough2)">若 A = C + B，则 best(A) ≥ best(B)：</text>
  <text x="282" y="260" font-size="9.5" fill="#555" filter="url(#rough2)">把 C 拼进 B 最优切分的第一块，首值</text>
  <text x="282" y="278" font-size="9.5" fill="#555" filter="url(#rough2)">MEX 只增不减 ⇒ 结果字典序不降</text>
  <text x="282" y="296" font-size="9.5" fill="#3d6330" filter="url(#rough2)">⇒ 块越短、剩得越多，后续只会更优</text>

  <rect x="24" y="316" width="476" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="34" y="332" font-size="9.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">③ x = 0：后缀里没有 0，怎么切每块 MEX 全是 0 → 逐个取（k=1），补满 n−i 个 0</text>
  <text x="34" y="348" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">前缀相同则更长者字典序更大；MEX 全程单调不增，上扫重算摊还 O(n)</text>
</svg>
