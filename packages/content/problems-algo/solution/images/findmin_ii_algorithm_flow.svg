<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">寻找旋转排序数组最小值 II · 三路流程</text>

  <!-- start box -->
  <rect x="190" y="44" width="180" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12" fill="#333">left = 0, right = n − 1</text>

  <path d="M280 82 L280 100" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop decision diamond -->
  <polygon points="280,104 370,150 280,196 190,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="146" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">left &lt; right ?</text>
  <text x="280" y="162" text-anchor="middle" font-size="10" fill="#888">（区间 &gt; 1 个元素？）</text>

  <!-- No branch -> return -->
  <path d="M370 150 L442 150" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="384" y="142" font-size="10.5" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="442" y="130" width="100" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="492" y="155" text-anchor="middle" font-size="11" fill="#333">return</text>
  <text x="492" y="168" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">nums[left]</text>

  <!-- Yes branch down -->
  <path d="M280 196 L280 216" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="210" font-size="10.5" fill="#b85450" font-weight="bold">是</text>

  <!-- mid box -->
  <rect x="160" y="220" width="240" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="244" text-anchor="middle" font-size="11.5" fill="#333">mid = left + (right − left) / 2</text>

  <path d="M280 258 L280 276" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- compare diamond (3-way) -->
  <polygon points="280,280 390,330 280,380 170,330" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">nums[mid] vs nums[right]</text>
  <text x="280" y="338" text-anchor="middle" font-size="10" fill="#888">三路判定</text>

  <!-- Branch 1 (left): nums[mid] < nums[right] -> right = mid -->
  <path d="M170 330 L120 330 L120 392" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="124" y="322" font-size="10" fill="#4a7a3a" font-weight="bold">&lt;</text>
  <rect x="56" y="392" width="128" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="120" y="410" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">右半升序</text>
  <text x="120" y="430" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">right = mid</text>

  <!-- Branch 2 (down): nums[mid] > nums[right] -> left = mid+1 -->
  <path d="M280 380 L280 392" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="288" y="388" font-size="10" fill="#b85450" font-weight="bold">&gt;</text>
  <rect x="216" y="392" width="128" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="410" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">右半下坠</text>
  <text x="280" y="430" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">left = mid + 1</text>

  <!-- Branch 3 (right): nums[mid] == nums[right] -> right-- -->
  <path d="M390 330 L440 330 L440 392" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="412" y="322" font-size="10" fill="#d6a040" font-weight="bold">==</text>
  <rect x="376" y="392" width="128" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="440" y="410" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">歧义退缩</text>
  <text x="440" y="430" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">right −−</text>

  <!-- loop-back arrows: all three branches return to the top loop diamond -->
  <path d="M56 416 L30 416 L30 150 L190 150" stroke="#4a7a3a" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M280 440 L280 450 L530 450 L530 150 L370 150" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M504 416 L530 416 L530 150 L370 150" stroke="#d6a040" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arrO)" filter="url(#rough2)"/>
</svg>
