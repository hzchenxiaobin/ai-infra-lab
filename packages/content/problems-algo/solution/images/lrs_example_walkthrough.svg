<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：s = "abbaba"，答案 = 2</text>

  <!-- ===== string header ===== -->
  <text x="20" y="54" font-size="10.5" fill="#888">s[i]：</text>
  <g font-size="11">
    <rect x="60" y="40" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="76" y="57" text-anchor="middle" fill="#333" font-weight="bold">a</text>
    <rect x="94" y="40" width="32" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="110" y="57" text-anchor="middle" fill="#333" font-weight="bold">b</text>
    <rect x="128" y="40" width="32" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="144" y="57" text-anchor="middle" fill="#333" font-weight="bold">b</text>
    <rect x="162" y="40" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="178" y="57" text-anchor="middle" fill="#333" font-weight="bold">a</text>
    <rect x="196" y="40" width="32" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="212" y="57" text-anchor="middle" fill="#333" font-weight="bold">b</text>
    <rect x="230" y="40" width="32" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="246" y="57" text-anchor="middle" fill="#333" font-weight="bold">a</text>
  </g>
  <g font-size="9" fill="#888">
    <text x="76" y="74" text-anchor="middle">i=0</text>
    <text x="110" y="74" text-anchor="middle">1</text>
    <text x="144" y="74" text-anchor="middle">2</text>
    <text x="178" y="74" text-anchor="middle">3</text>
    <text x="212" y="74" text-anchor="middle">4</text>
    <text x="246" y="74" text-anchor="middle">5</text>
  </g>

  <!-- ===== dp table ===== -->
  <text x="20" y="100" font-size="11" fill="#666" font-weight="bold">dp[i][j]：</text>

  <!-- column headers -->
  <g font-size="9.5" fill="#888">
    <text x="44" y="116" text-anchor="middle">j</text>
    <text x="76" y="116" text-anchor="middle">0</text>
    <text x="110" y="116" text-anchor="middle">1</text>
    <text x="144" y="116" text-anchor="middle">2</text>
    <text x="178" y="116" text-anchor="middle">3</text>
    <text x="212" y="116" text-anchor="middle">4</text>
    <text x="246" y="116" text-anchor="middle">5</text>
  </g>
  <!-- row headers -->
  <g font-size="9.5" fill="#888">
    <text x="44" y="136" text-anchor="middle">0</text>
    <text x="44" y="158" text-anchor="middle">1</text>
    <text x="44" y="180" text-anchor="middle">2</text>
    <text x="44" y="202" text-anchor="middle">3</text>
    <text x="44" y="224" text-anchor="middle">4</text>
    <text x="44" y="246" text-anchor="middle">5</text>
  </g>

  <!-- diagonal (excluded) -->
  <rect x="62" y="124" width="28" height="20" fill="#eee" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="76" y="138" text-anchor="middle" font-size="9.5" fill="#aaa">—</text>
  <rect x="96" y="146" width="28" height="20" fill="#eee" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="160" text-anchor="middle" font-size="9.5" fill="#aaa">—</text>
  <rect x="130" y="168" width="28" height="20" fill="#eee" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="144" y="182" text-anchor="middle" font-size="9.5" fill="#aaa">—</text>
  <rect x="164" y="190" width="28" height="20" fill="#eee" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="178" y="204" text-anchor="middle" font-size="9.5" fill="#aaa">—</text>
  <rect x="198" y="212" width="28" height="20" fill="#eee" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="212" y="226" text-anchor="middle" font-size="9.5" fill="#aaa">—</text>
  <rect x="232" y="234" width="28" height="20" fill="#eee" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="246" y="248" text-anchor="middle" font-size="9.5" fill="#aaa">—</text>

  <!-- row i=0 -->
  <g font-size="10">
    <rect x="96" y="124" width="28" height="20" fill="#fff" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="110" y="138" text-anchor="middle" fill="#ccc">0</text>
    <rect x="130" y="124" width="28" height="20" fill="#fff" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="144" y="138" text-anchor="middle" fill="#ccc">0</text>
    <rect x="164" y="124" width="28" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="178" y="138" text-anchor="middle" fill="#3a5a2a" font-weight="bold">1</text>
    <rect x="198" y="124" width="28" height="20" fill="#fff" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="212" y="138" text-anchor="middle" fill="#ccc">0</text>
    <rect x="232" y="124" width="28" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="246" y="138" text-anchor="middle" fill="#3a5a2a" font-weight="bold">1</text>
  </g>

  <!-- row i=1 -->
  <g font-size="10">
    <rect x="62" y="146" width="28" height="20" fill="#fff" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="76" y="160" text-anchor="middle" fill="#ccc">0</text>
    <rect x="130" y="146" width="28" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="144" y="160" text-anchor="middle" fill="#3a5a2a" font-weight="bold">1</text>
    <rect x="164" y="146" width="28" height="20" fill="#fff" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="178" y="160" text-anchor="middle" fill="#ccc">0</text>
    <rect x="198" y="146" width="28" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
    <text x="212" y="160" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <rect x="232" y="146" width="28" height="20" fill="#fff" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="246" y="160" text-anchor="middle" fill="#ccc">0</text>
  </g>

  <!-- row i=2 -->
  <g font-size="10">
    <rect x="62" y="168" width="28" height="20" fill="#fff" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="76" y="182" text-anchor="middle" fill="#ccc">0</text>
    <rect x="96" y="168" width="28" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="110" y="182" text-anchor="middle" fill="#3a5a2a" font-weight="bold">1</text>
    <rect x="164" y="168" width="28" height="20" fill="#fff" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="178" y="182" text-anchor="middle" fill="#ccc">0</text>
    <rect x="198" y="168" width="28" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="212" y="182" text-anchor="middle" fill="#3a5a2a" font-weight="bold">1</text>
    <rect x="232" y="168" width="28" height="20" fill="#fff" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="246" y="182" text-anchor="middle" fill="#ccc">0</text>
  </g>

  <!-- row i=3 -->
  <g font-size="10">
    <rect x="62" y="190" width="28" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="76" y="204" text-anchor="middle" fill="#3a5a2a" font-weight="bold">1</text>
    <rect x="96" y="190" width="28" height="20" fill="#fff" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="110" y="204" text-anchor="middle" fill="#ccc">0</text>
    <rect x="130" y="190" width="28" height="20" fill="#fff" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="144" y="204" text-anchor="middle" fill="#ccc">0</text>
    <rect x="198" y="190" width="28" height="20" fill="#fff" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="212" y="204" text-anchor="middle" fill="#ccc">0</text>
    <rect x="232" y="190" width="28" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
    <text x="246" y="204" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
  </g>

  <!-- row i=4 -->
  <g font-size="10">
    <rect x="62" y="212" width="28" height="20" fill="#fff" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="76" y="226" text-anchor="middle" fill="#ccc">0</text>
    <rect x="96" y="212" width="28" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="110" y="226" text-anchor="middle" fill="#3a5a2a" font-weight="bold">1</text>
    <rect x="130" y="212" width="28" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="144" y="226" text-anchor="middle" fill="#3a5a2a" font-weight="bold">1</text>
    <rect x="164" y="212" width="28" height="20" fill="#fff" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="178" y="226" text-anchor="middle" fill="#ccc">0</text>
    <rect x="232" y="212" width="28" height="20" fill="#fff" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="246" y="226" text-anchor="middle" fill="#ccc">0</text>
  </g>

  <!-- row i=5 -->
  <g font-size="10">
    <rect x="62" y="234" width="28" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="76" y="248" text-anchor="middle" fill="#3a5a2a" font-weight="bold">1</text>
    <rect x="96" y="234" width="28" height="20" fill="#fff" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="110" y="248" text-anchor="middle" fill="#ccc">0</text>
    <rect x="130" y="234" width="28" height="20" fill="#fff" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="144" y="248" text-anchor="middle" fill="#ccc">0</text>
    <rect x="164" y="234" width="28" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
    <text x="178" y="248" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <rect x="198" y="234" width="28" height="20" fill="#fff" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="212" y="248" text-anchor="middle" fill="#ccc">0</text>
  </g>

  <!-- dependency arrow: dp[0][3] -> dp[1][4] -->
  <path d="M 178 144 Q 195 142 205 146" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== explanation panels ===== -->
  <rect x="300" y="100" width="240" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="420" y="120" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">关键转移：dp[1][4] = 2</text>
  <text x="312" y="138" font-size="10" fill="#555">s[1]='b' == s[4]='b'，i≠j</text>
  <text x="312" y="152" font-size="10" fill="#555">→ dp[1][4] = dp[0][3] + 1 = 1+1 = 2</text>
  <text x="312" y="166" font-size="10" fill="#4a7a3a" font-weight="bold">含义：s[0..1]="ab" == s[3..4]="ab"</text>

  <rect x="300" y="182" width="240" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="420" y="202" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">对称性：dp[3][5] = 2</text>
  <text x="312" y="220" font-size="10" fill="#555">s[3]='a' == s[5]='a'</text>
  <text x="312" y="234" font-size="10" fill="#4a7a3a">→ s[2..3]="ba" == s[4..5]="ba"</text>

  <rect x="300" y="252" width="240" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="420" y="272" text-anchor="middle" font-size="11.5" fill="#7a5a20" font-weight="bold">全局最大 = 2</text>
  <text x="420" y="290" text-anchor="middle" font-size="10" fill="#555">最长重复子串长度 = 2（"ab" 或 "ba"）</text>

  <!-- ===== notes ===== -->
  <rect x="20" y="280" width="260" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="300" font-size="10" fill="#b85450" font-weight="bold">注意：</text>
  <text x="34" y="316" font-size="10" fill="#555">① 对角线 i=j 排除（同位置不算重复）</text>
  <text x="34" y="330" font-size="10" fill="#555">② 表关于对角线对称：dp[i][j] = dp[j][i]</text>

  <rect x="20" y="346" width="520" height="50" fill="#f4f6f8" stroke="#bbb" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="34" y="366" font-size="10" fill="#666" font-weight="bold">复杂度：</text>
  <text x="34" y="382" font-size="10" fill="#666">n ≤ 1500 → n² ≈ 2.25×10⁶，DP O(n²) 完全可行；n 更大时改用二分 + 滚动哈希（见 1044）</text>
</svg>
