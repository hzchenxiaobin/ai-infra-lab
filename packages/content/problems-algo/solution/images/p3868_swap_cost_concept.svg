<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：内部交换免费 ⇒ 只看计数；一次跨数组交换恰修 4 格 diff</text>

  <!-- Band 1: 位置坍缩 -->
  <text x="140" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">① 位置坍缩（示例 2）</text>

  <text x="34" y="74" font-size="10.5" fill="#33506b" filter="url(#rough2)">nums1</text>
  <rect x="82" y="58" width="44" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="104" y="74" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">10</text>
  <rect x="130" y="58" width="44" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="152" y="74" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">10</text>

  <text x="34" y="106" font-size="10.5" fill="#33506b" filter="url(#rough2)">nums2</text>
  <rect x="82" y="90" width="44" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="104" y="106" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">20</text>
  <rect x="130" y="90" width="44" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="152" y="106" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">20</text>

  <path d="M 94 55 Q 117 40 140 55" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="117" y="36" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">内部交换 ¥0</text>

  <path d="M 182 88 L 212 88" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="218" y="50" width="272" height="20" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="250" y="64" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">值 v</text>
  <text x="318" y="64" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">cnt1</text>
  <text x="386" y="64" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">cnt2</text>
  <text x="456" y="64" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">diff</text>

  <rect x="218" y="72" width="272" height="18" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="250" y="85" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">10</text>
  <text x="318" y="85" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="386" y="85" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="456" y="85" text-anchor="middle" font-size="10.5" fill="#a0433f" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="218" y="92" width="272" height="18" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="250" y="105" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">20</text>
  <text x="318" y="105" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="386" y="105" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="456" y="105" text-anchor="middle" font-size="10.5" fill="#a0433f" font-weight="bold" filter="url(#rough2)">2</text>

  <text x="354" y="126" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">Σdiff = 2 + 2 = 4</text>

  <!-- Band 2: 一次跨交换 -->
  <text x="260" y="146" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">② 一次跨数组交换 = 一出一进，两个 diff 各 −2</text>

  <text x="34" y="172" font-size="10.5" fill="#33506b" filter="url(#rough2)">nums1</text>
  <rect x="82" y="156" width="44" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="104" y="172" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">10</text>
  <rect x="130" y="156" width="44" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="152" y="172" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">10</text>

  <text x="34" y="212" font-size="10.5" fill="#33506b" filter="url(#rough2)">nums2</text>
  <rect x="82" y="196" width="44" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="104" y="212" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">20</text>
  <rect x="130" y="196" width="44" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="152" y="212" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">20</text>

  <path d="M 94 181 L 94 194" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <path d="M 114 194 L 114 181" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="230" y="190" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">跨数组交换 cost 1</text>

  <text x="330" y="172" text-anchor="start" font-size="10.5" fill="#333" filter="url(#rough2)">diff[10]: 2 → 0</text>
  <text x="330" y="194" text-anchor="start" font-size="10.5" fill="#333" filter="url(#rough2)">diff[20]: 2 → 0</text>
  <text x="330" y="216" text-anchor="start" font-size="11" fill="#a0433f" font-weight="bold" filter="url(#rough2)">Σdiff: 4 → 0 ✓</text>

  <text x="34" y="240" text-anchor="start" font-size="9" fill="#4a7a3a" filter="url(#rough2)">交换后 nums1=[20,10]，nums2=[10,20] —— 多重集已相等</text>

  <!-- Band 3: 结论 -->
  <rect x="90" y="252" width="340" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="272" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">答案 = Σdiff / 4 = 4 / 4 = 1</text>

  <text x="260" y="298" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">下界：一次交换牵动两个值，每值 diff 至多 −2 ⇒ Σdiff 至多 −4</text>
  <text x="260" y="316" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">上界：nums1 多余值 a 与 nums2 多余值 b 配对交换，恰达下界</text>

  <rect x="60" y="326" width="400" height="26" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="343" text-anchor="middle" font-size="10" fill="#a0433f" filter="url(#rough2)">⚠️ 任一值 cnt1[v]+cnt2[v] 为奇 ⇒ 无法平分 ⇒ 返回 −1（示例 3）</text>
</svg>
