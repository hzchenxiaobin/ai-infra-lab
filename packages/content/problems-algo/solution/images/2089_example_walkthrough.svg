<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">逐步演算：nums = [1, 2, 5, 2, 3]，target = 2</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888">每个元素三分类，累加 less / equal，最后生成下标区间</text>

  <!-- Table outer frame -->
  <rect x="40" y="58" width="440" height="206" fill="none" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- Column dividers -->
  <line x1="90" y1="58" x2="90" y2="264" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="150" y1="58" x2="150" y2="264" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="250" y1="58" x2="250" y2="264" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="340" y1="58" x2="340" y2="264" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="395" y1="58" x2="395" y2="264" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- Header row divider -->
  <line x1="40" y1="88" x2="480" y2="88" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- Header background -->
  <rect x="41" y="59" width="438" height="28" fill="#e8f0fe" stroke="none" filter="url(#rough2)"/>

  <!-- Header text -->
  <text x="65" y="77" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">步</text>
  <text x="120" y="77" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">nums[i]</text>
  <text x="200" y="77" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">与 target 比</text>
  <text x="295" y="77" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">分类</text>
  <text x="367" y="77" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">less</text>
  <text x="437" y="77" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">equal</text>

  <!-- Row 1: i=0, nums[0]=1 < 2, less -->
  <rect x="41" y="89" width="438" height="34" fill="#e8f0fe" stroke="none" filter="url(#rough2)"/>
  <line x1="40" y1="123" x2="480" y2="123" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="111" text-anchor="middle" font-size="11.5" fill="#555">1</text>
  <text x="120" y="111" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="200" y="111" text-anchor="middle" font-size="11.5" fill="#446688">1 &lt; 2</text>
  <text x="295" y="111" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">less</text>
  <text x="367" y="111" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <text x="437" y="111" text-anchor="middle" font-size="12" fill="#888">0</text>

  <!-- Row 2: i=1, nums[1]=2 == 2, equal -->
  <rect x="41" y="124" width="438" height="34" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <line x1="40" y1="158" x2="480" y2="158" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="146" text-anchor="middle" font-size="11.5" fill="#555">2</text>
  <text x="120" y="146" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="200" y="146" text-anchor="middle" font-size="11.5" fill="#4a7a3a">2 == 2</text>
  <text x="295" y="146" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">equal</text>
  <text x="367" y="146" text-anchor="middle" font-size="12" fill="#888">1</text>
  <text x="437" y="146" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- Row 3: i=2, nums[2]=5 > 2, greater -->
  <rect x="41" y="159" width="438" height="34" fill="#fff8e1" stroke="none" filter="url(#rough2)"/>
  <line x1="40" y1="193" x2="480" y2="193" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="181" text-anchor="middle" font-size="11.5" fill="#555">3</text>
  <text x="120" y="181" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <text x="200" y="181" text-anchor="middle" font-size="11.5" fill="#d6a040">5 &gt; 2</text>
  <text x="295" y="181" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">greater</text>
  <text x="367" y="181" text-anchor="middle" font-size="12" fill="#888">1</text>
  <text x="437" y="181" text-anchor="middle" font-size="12" fill="#888">1</text>

  <!-- Row 4: i=3, nums[3]=2 == 2, equal -->
  <rect x="41" y="194" width="438" height="34" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <line x1="40" y1="228" x2="480" y2="228" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="65" y="216" text-anchor="middle" font-size="11.5" fill="#555">4</text>
  <text x="120" y="216" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="200" y="216" text-anchor="middle" font-size="11.5" fill="#4a7a3a">2 == 2</text>
  <text x="295" y="216" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">equal</text>
  <text x="367" y="216" text-anchor="middle" font-size="12" fill="#888">1</text>
  <text x="437" y="216" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- Row 5: i=4, nums[4]=3 > 2, greater -->
  <rect x="41" y="229" width="438" height="34" fill="#fff8e1" stroke="none" filter="url(#rough2)"/>
  <text x="65" y="251" text-anchor="middle" font-size="11.5" fill="#555">5</text>
  <text x="120" y="251" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="200" y="251" text-anchor="middle" font-size="11.5" fill="#d6a040">3 &gt; 2</text>
  <text x="295" y="251" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">greater</text>
  <text x="367" y="251" text-anchor="middle" font-size="12" fill="#888">1</text>
  <text x="437" y="251" text-anchor="middle" font-size="12" fill="#888">2</text>

  <!-- Formula to result -->
  <path d="M 260 268 L 260 286" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Result computation box -->
  <rect x="60" y="288" width="400" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="307" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">区间 = [ less, less + equal − 1 ] = [ 1, 1 + 2 − 1 ]</text>
  <text x="260" y="324" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">答案 = [1, 2] ⭐</text>

  <!-- Footer note -->
  <rect x="60" y="340" width="400" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="358" text-anchor="middle" font-size="10" fill="#555">对比「先排序再扫描」：计数法不改变数组，O(n) 一趟搞定</text>
</svg>
