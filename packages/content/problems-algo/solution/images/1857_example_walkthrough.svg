<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    示例 1 演算：colors="abaca"
  </text>
  <text x="290" y="50" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">
    初始 deg=[0,1,1,1,1]，Q=[0]，count 全为 0
  </text>

  <!-- 表头 -->
  <rect x="30" y="66" width="60" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="60" y="86" text-anchor="middle" font-size="12" fill="#334" filter="url(#rough2)">步</text>
  <rect x="90" y="66" width="80" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="130" y="86" text-anchor="middle" font-size="12" fill="#334" filter="url(#rough2)">出队 u</text>
  <rect x="170" y="66" width="200" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="270" y="86" text-anchor="middle" font-size="12" fill="#334" filter="url(#rough2)">count[u]（自身色累加后）</text>
  <rect x="370" y="66" width="60" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="400" y="86" text-anchor="middle" font-size="12" fill="#334" filter="url(#rough2)">ans</text>
  <rect x="430" y="66" width="120" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="490" y="86" text-anchor="middle" font-size="12" fill="#334" filter="url(#rough2)">队列 Q（处理后）</text>

  <!-- 第 1 步 -->
  <rect x="30" y="100" width="60" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="125" text-anchor="middle" font-size="13" fill="#7a5a20" filter="url(#rough2)">①</text>
  <rect x="90" y="100" width="80" height="40" rx="4" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="130" y="125" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">0 (a)</text>
  <rect x="170" y="100" width="200" height="40" rx="4" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="270" y="125" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">a:1 → 传给 1,2</text>
  <rect x="370" y="100" width="60" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="400" y="125" text-anchor="middle" font-size="13" fill="#2a4a1a" filter="url(#rough2)">1</text>
  <rect x="430" y="100" width="120" height="40" rx="4" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="490" y="125" text-anchor="middle" font-size="12" fill="#334" filter="url(#rough2)">[1, 2]</text>

  <!-- 第 2 步 -->
  <rect x="30" y="142" width="60" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="167" text-anchor="middle" font-size="13" fill="#7a5a20" filter="url(#rough2)">②</text>
  <rect x="90" y="142" width="80" height="40" rx="4" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="130" y="167" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">1 (b)</text>
  <rect x="170" y="142" width="200" height="40" rx="4" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="270" y="167" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">a:1,b:1（无邻居）</text>
  <rect x="370" y="142" width="60" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="400" y="167" text-anchor="middle" font-size="13" fill="#2a4a1a" filter="url(#rough2)">1</text>
  <rect x="430" y="142" width="120" height="40" rx="4" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="490" y="167" text-anchor="middle" font-size="12" fill="#334" filter="url(#rough2)">[2]</text>

  <!-- 第 3 步 -->
  <rect x="30" y="184" width="60" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="209" text-anchor="middle" font-size="13" fill="#7a5a20" filter="url(#rough2)">③</text>
  <rect x="90" y="184" width="80" height="40" rx="4" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="130" y="209" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">2 (a)</text>
  <rect x="170" y="184" width="200" height="40" rx="4" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="270" y="209" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">a:2 → 传给 3</text>
  <rect x="370" y="184" width="60" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="400" y="209" text-anchor="middle" font-size="13" fill="#2a4a1a" filter="url(#rough2)">2</text>
  <rect x="430" y="184" width="120" height="40" rx="4" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="490" y="209" text-anchor="middle" font-size="12" fill="#334" filter="url(#rough2)">[3]</text>

  <!-- 第 4 步 -->
  <rect x="30" y="226" width="60" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="251" text-anchor="middle" font-size="13" fill="#7a5a20" filter="url(#rough2)">④</text>
  <rect x="90" y="226" width="80" height="40" rx="4" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="130" y="251" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">3 (c)</text>
  <rect x="170" y="226" width="200" height="40" rx="4" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="270" y="251" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">a:2,c:1 → 传给 4</text>
  <rect x="370" y="226" width="60" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="400" y="251" text-anchor="middle" font-size="13" fill="#2a4a1a" filter="url(#rough2)">2</text>
  <rect x="430" y="226" width="120" height="40" rx="4" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="490" y="251" text-anchor="middle" font-size="12" fill="#334" filter="url(#rough2)">[4]</text>

  <!-- 第 5 步 -->
  <rect x="30" y="268" width="60" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="293" text-anchor="middle" font-size="13" fill="#7a3030" filter="url(#rough2)">⑤</text>
  <rect x="90" y="268" width="80" height="40" rx="4" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="130" y="293" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">4 (a)</text>
  <rect x="170" y="268" width="200" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="270" y="293" text-anchor="middle" font-size="12" fill="#7a3030" filter="url(#rough2)">a:3, c:1 ★（终态）</text>
  <rect x="370" y="268" width="60" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="400" y="293" text-anchor="middle" font-size="14" fill="#7a3030" filter="url(#rough2)">3</text>
  <rect x="430" y="268" width="120" height="40" rx="4" fill="#fafafa" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="490" y="293" text-anchor="middle" font-size="12" fill="#334" filter="url(#rough2)">[] 空</text>

  <!-- 结论 -->
  <rect x="30" y="330" width="520" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="350" text-anchor="middle" font-size="13" fill="#2a4a1a" filter="url(#rough2)">
    processed = 5 = n（无环），路径 0→2→3→4 上颜色 a 出现 3 次
  </text>
  <text x="290" y="368" text-anchor="middle" font-size="13" fill="#2a4a1a" filter="url(#rough2)">
    返回 ans = 3
  </text>

  <!-- 自环说明 -->
  <rect x="30" y="384" width="520" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="290" y="402" text-anchor="middle" font-size="12" fill="#7a3030" filter="url(#rough2)">
    示例 2：edges=[[0,0]] 自环 → deg[0]=1 永远不为 0 → Q 一开始为空 → processed=0 ≠ 1 → 返回 -1
  </text>
</svg>
