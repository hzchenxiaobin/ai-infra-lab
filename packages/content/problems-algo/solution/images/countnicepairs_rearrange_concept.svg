<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">核心观察：移项把「二元耦合」拆成「单元素关键字」</text>

  <!-- Original equation (coupled, red/orange) -->
  <rect x="50" y="58" width="460" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="84" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">原条件：nums[i] + rev(nums[j])  ==  nums[j] + rev(nums[i])</text>
  <text x="280" y="104" text-anchor="middle" font-size="11" fill="#b85450">⚠ i 和 j 互相纠缠：左式含 i 本体 + j 翻转，右式相反</text>

  <!-- Arrow down: move terms -->
  <path d="M 280 124 L 280 158" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="232" y="128" width="96" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="144" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">移项（两边互换）</text>

  <!-- Rearranged equation (decoupled, green) -->
  <rect x="50" y="168" width="460" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="194" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">nums[i] − rev(nums[i])  ==  nums[j] − rev(nums[j])</text>
  <text x="280" y="214" text-anchor="middle" font-size="11" fill="#4a7a3a">✓ 两边各自只含一个下标：i 的归左、j 的归右，彻底解耦</text>

  <!-- d(x) definition highlight -->
  <rect x="120" y="246" width="320" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough)"/>
  <text x="280" y="274" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">定义 d(x) = x − rev(x)</text>

  <!-- Conclusion -->
  <path d="M 280 294 L 280 318" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="322" width="440" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough)"/>
  <text x="280" y="346" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">⇒ (i, j) 是好对子  ⟺  d(nums[i]) == d(nums[j])</text>
  <text x="280" y="368" text-anchor="middle" font-size="11" fill="#666">退化为「统计关键字相等的数对」→ 哈希表 O(n) 计数</text>
</svg>
