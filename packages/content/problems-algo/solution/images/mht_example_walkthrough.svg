<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrw" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    示例演算：n=6, 逐层剥离过程
  </text>

  <!-- ========= 阶段 1：初始 ========= -->
  <text x="100" y="58" text-anchor="middle" font-size="12.5" fill="#2a4a6a" filter="url(#rough2)">
    阶段 1 · 初始（度数标在节点旁）
  </text>
  <g filter="url(#rough2)">
    <line x1="50" y1="90" x2="100" y2="150" stroke="#888" stroke-width="1.5"/>
    <line x1="100" y1="90" x2="100" y2="150" stroke="#888" stroke-width="1.5"/>
    <line x1="150" y1="90" x2="100" y2="150" stroke="#888" stroke-width="1.5"/>
    <line x1="100" y1="150" x2="100" y2="210" stroke="#888" stroke-width="1.5"/>
    <line x1="100" y1="210" x2="100" y2="270" stroke="#888" stroke-width="1.5"/>

    <circle cx="50" cy="90" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="50" y="94" text-anchor="middle" font-size="11" fill="#b85450">0</text>
    <text x="50" y="76" font-size="10" fill="#888">d=1</text>

    <circle cx="100" cy="90" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="100" y="94" text-anchor="middle" font-size="11" fill="#b85450">1</text>
    <text x="100" y="76" font-size="10" fill="#888">d=1</text>

    <circle cx="150" cy="90" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="150" y="94" text-anchor="middle" font-size="11" fill="#b85450">2</text>
    <text x="150" y="76" font-size="10" fill="#888">d=1</text>

    <circle cx="100" cy="150" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="100" y="154" text-anchor="middle" font-size="11" fill="#2a4a6a">3</text>
    <text x="124" y="148" font-size="10" fill="#888">d=4</text>

    <circle cx="100" cy="210" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="100" y="214" text-anchor="middle" font-size="11" fill="#2a4a6a">4</text>
    <text x="124" y="208" font-size="10" fill="#888">d=2</text>

    <circle cx="100" cy="270" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="100" y="274" text-anchor="middle" font-size="11" fill="#b85450">5</text>
    <text x="100" y="294" font-size="10" fill="#888">d=1</text>
  </g>
  <text x="100" y="320" text-anchor="middle" font-size="11" fill="#7a5a20" filter="url(#rough2)">
    叶子(红): 0,1,2,5 全部入队
  </text>

  <!-- 剥离箭头 -->
  <path d="M 195 185 L 250 185" fill="none" stroke="#446688"
        stroke-width="1.8" marker-end="url(#arrw)" filter="url(#rough2)"/>
  <text x="222" y="178" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">
    剥第 1 层
  </text>
  <text x="222" y="200" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    sz=4
  </text>

  <!-- ========= 阶段 2：剥离后 ========= -->
  <text x="345" y="58" text-anchor="middle" font-size="12.5" fill="#2a4a6a" filter="url(#rough2)">
    阶段 2 · 剥掉 4 个叶子后
  </text>
  <g filter="url(#rough2)">
    <line x1="345" y1="155" x2="345" y2="215" stroke="#888" stroke-width="1.8"/>

    <circle cx="345" cy="150" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/>
    <text x="345" y="154" text-anchor="middle" font-size="11" fill="#2a5a2a">3</text>
    <text x="370" y="148" font-size="10" fill="#888">d=1</text>

    <circle cx="345" cy="215" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/>
    <text x="345" y="219" text-anchor="middle" font-size="11" fill="#2a5a2a">4</text>
    <text x="370" y="213" font-size="10" fill="#888">d=1</text>
  </g>
  <text x="345" y="270" text-anchor="middle" font-size="11" fill="#7a5a20" filter="url(#rough2)">
    3 的度: 4-3=1, 4 的度: 2-1=1
  </text>
  <text x="345" y="288" text-anchor="middle" font-size="11" fill="#7a5a20" filter="url(#rough2)">
    remaining = 6 - 4 = 2 ≤ 2 → 停止
  </text>

  <!-- ========= 阶段 3：答案 ========= -->
  <line x1="345" y1="310" x2="345" y2="330" stroke="#446688" stroke-width="1.5" marker-end="url(#arrw)"/>
  <rect x="240" y="335" width="210" height="50" rx="8" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="345" y="356" text-anchor="middle" font-size="13" fill="#2a5a2a">答案 = [3, 4]</text>
  <text x="345" y="374" text-anchor="middle" font-size="10.5" fill="#4a7a3a">
    直径 0-3-4-5 长度 3 (奇) → 两中点
  </text>

  <!-- 右下角：层数总结 -->
  <rect x="430" y="90" width="115" height="78" rx="6" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="487" y="110" text-anchor="middle" font-size="11" fill="#7a5a20" filter="url(#rough2)">剥离层数统计</text>
  <line x1="445" y1="118" x2="530" y2="118" stroke="#d6a040" stroke-width="0.8"/>
  <text x="445" y="134" font-size="10.5" fill="#555" filter="url(#rough2)">第 0 层: 4 叶子</text>
  <text x="445" y="150" font-size="10.5" fill="#555" filter="url(#rough2)">第 1 层: 停 (剩2)</text>
  <text x="445" y="164" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">答案: 3, 4</text>
</svg>
