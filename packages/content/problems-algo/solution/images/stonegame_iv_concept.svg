<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：存在性（OR）判定</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">找到一个让对手必败的 k² 即胜，全无则败</text>

  <!-- ===== 情况 A：存在 k² 使对手必败 → 我必胜 ===== -->
  <text x="40" y="74" font-size="11.5" fill="#4a7a3a" font-weight="bold">情况 A：存在 k² 使对手必败 → 我必胜</text>

  <!-- 状态 i（绿） -->
  <rect x="240" y="84" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="103" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">状态 i</text>
  <text x="280" y="118" text-anchor="middle" font-size="10.5" fill="#333">我的回合</text>

  <!-- 分支：取 1² → i−1（对手必胜 绿） -->
  <path d="M 258 124 L 130 170" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="170" y="138" font-size="10" fill="#888">取 1²</text>
  <rect x="70" y="170" width="100" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="120" y="189" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">i − 1</text>
  <text x="120" y="203" text-anchor="middle" font-size="10" fill="#333">对手必胜 ✓</text>

  <!-- 分支：取 2² → i−4（对手必败 红 ★ 制胜手） -->
  <path d="M 280 124 L 280 170" stroke="#b85450" stroke-width="2.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="300" y="148" font-size="10.5" fill="#b85450" font-weight="bold">取 2² ★</text>
  <rect x="230" y="170" width="100" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="6" filter="url(#rough2)"/>
  <text x="280" y="189" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">i − 4</text>
  <text x="280" y="203" text-anchor="middle" font-size="10" fill="#333">对手必败 ✗</text>

  <!-- 分支：取 3² → i−9（对手必胜 绿） -->
  <path d="M 302 124 L 430 170" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="138" font-size="10" fill="#888">取 3²</text>
  <rect x="390" y="170" width="100" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="440" y="189" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">i − 9</text>
  <text x="440" y="203" text-anchor="middle" font-size="10" fill="#333">对手必胜 ✓</text>

  <!-- 判定 A -->
  <path d="M 280 210 L 280 236" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="290" y="227" font-size="9.5" fill="#4a7a3a">↑ 存在红色子态</text>
  <rect x="210" y="236" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="258" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">dp[i] = true ✓</text>

  <!-- ===== 情况 B：所有 k² 都使对手必胜 → 我必败 ===== -->
  <text x="40" y="300" font-size="11.5" fill="#b85450" font-weight="bold">情况 B：所有 k² 都使对手必胜 → 我必败</text>

  <!-- 状态 i（红） -->
  <rect x="240" y="310" width="80" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="328" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">状态 i</text>
  <text x="280" y="341" text-anchor="middle" font-size="10" fill="#333">我的回合</text>

  <!-- 三分支全绿 -->
  <path d="M 258 346 L 130 372" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="70" y="372" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="120" y="392" text-anchor="middle" font-size="10.5" fill="#4a7a3a">i−1 必胜 ✓</text>

  <path d="M 280 346 L 280 372" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="230" y="372" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="392" text-anchor="middle" font-size="10.5" fill="#4a7a3a">i−4 必胜 ✓</text>

  <path d="M 302 346 L 430 372" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="390" y="372" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="440" y="392" text-anchor="middle" font-size="10.5" fill="#4a7a3a">i−9 必胜 ✓</text>

  <!-- 判定 B -->
  <path d="M 280 404 L 280 422" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="294" y="416" font-size="9.5" fill="#b85450">↑ 三路皆绿</text>
  <rect x="205" y="422" width="150" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="442" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">dp[i] = false ✗</text>
</svg>
