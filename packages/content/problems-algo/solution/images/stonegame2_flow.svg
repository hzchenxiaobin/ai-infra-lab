<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">记忆化搜索流程：dp(i, m) 的决策</text>

  <!-- side note -->
  <text x="22" y="56" font-size="10" fill="#888">入口</text>
  <text x="22" y="72" font-size="10" fill="#888">dp(0, 1)</text>
  <text x="22" y="88" font-size="10" fill="#888">M 初值 = 1</text>

  <!-- Start: dp(i, m) -->
  <rect x="200" y="42" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">dp(i, m)</text>

  <!-- arrow down to diamond -->
  <path d="M 260 76 L 260 92" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- Decision diamond: 2m >= n-i ? -->
  <polygon points="260,94 350,134 260,174 170,134" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="130" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">2m ≥ n − i ?</text>
  <text x="260" y="146" text-anchor="middle" font-size="10" fill="#888">能一次取完</text>

  <!-- Yes branch: right -->
  <path d="M 350 134 L 398 134" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="362" y="128" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="400" y="114" width="104" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="452" y="132" text-anchor="middle" font-size="10" fill="#333">一次取完</text>
  <text x="452" y="148" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return suffix[i]</text>

  <!-- No branch: down -->
  <path d="M 260 174 L 260 190" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="186" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <!-- Loop box: for X = 1..2m -->
  <rect x="70" y="192" width="380" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="214" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">枚举 X = 1 .. 2m</text>
  <text x="260" y="236" text-anchor="middle" font-size="11" fill="#444">gain = suffix[i] − dp(i + X, max(m, X))</text>
  <text x="260" y="256" text-anchor="middle" font-size="11" fill="#444">best = max(best, gain)</text>
  <text x="260" y="274" text-anchor="middle" font-size="10" fill="#888">对手成为剩余区间的先手 → 身份互换</text>

  <!-- arrow down to return -->
  <path d="M 260 284 L 260 298" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- Return best -->
  <rect x="190" y="300" width="140" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="10" fill="#333">返回最优</text>
  <text x="260" y="332" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">best</text>
</svg>
