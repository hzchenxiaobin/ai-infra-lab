<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="720" height="460" fill="#fafafa"/>

  <text x="360" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：原行 r 旋转后变为结果列 m−1−r，行内向右 = 列内向下</text>

  <!-- ===== Original box (2 x 4) ===== -->
  <text x="124" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">原矩阵 box（2×4）</text>
  <text x="124" y="74" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">高亮：第 0 行</text>

  <!-- highlight row 0 -->
  <rect x="56" y="86" width="136" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" fill-opacity="0.4" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <!-- row 0 : # . * . -->
    <rect x="60" y="90" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="76" y="111" text-anchor="middle" font-size="13" fill="#333">#</text>
    <rect x="92" y="90" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="108" y="111" text-anchor="middle" font-size="13" fill="#333">.</text>
    <rect x="124" y="90" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="140" y="111" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">*</text>
    <rect x="156" y="90" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="172" y="111" text-anchor="middle" font-size="13" fill="#333">.</text>
    <!-- row 1 : # # * . -->
    <rect x="60" y="122" width="32" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="76" y="143" text-anchor="middle" font-size="13" fill="#999">#</text>
    <rect x="92" y="122" width="32" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="108" y="143" text-anchor="middle" font-size="13" fill="#999">#</text>
    <rect x="124" y="122" width="32" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="140" y="143" text-anchor="middle" font-size="13" fill="#999">*</text>
    <rect x="156" y="122" width="32" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="172" y="143" text-anchor="middle" font-size="13" fill="#999">.</text>
    <!-- col index labels -->
    <text x="76" y="168" text-anchor="middle" font-size="8.5" fill="#888">j=0</text>
    <text x="108" y="168" text-anchor="middle" font-size="8.5" fill="#888">1</text>
    <text x="140" y="168" text-anchor="middle" font-size="8.5" fill="#888">2</text>
    <text x="172" y="168" text-anchor="middle" font-size="8.5" fill="#888">3</text>
  </g>

  <!-- rotate arrow -->
  <path d="M200 122 L292 122" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="246" y="116" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">顺时针 90°</text>
  <text x="246" y="138" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">result[i][m−1−r]</text>
  <text x="246" y="150" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">= box[r][i]</text>

  <!-- ===== Rotated (4 x 2) before gravity ===== -->
  <text x="332" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">旋转后（施加重力前）</text>
  <text x="332" y="74" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">高亮：列 1（来自原行 0）</text>

  <!-- highlight column 1 (right col) -->
  <rect x="324" y="86" width="40" height="136" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" fill-opacity="0.4" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <!-- row 0 : # # -->
    <rect x="292" y="90" width="32" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="308" y="111" text-anchor="middle" font-size="13" fill="#999">#</text>
    <rect x="328" y="90" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="344" y="111" text-anchor="middle" font-size="13" fill="#333">#</text>
    <!-- row 1 : # . -->
    <rect x="292" y="122" width="32" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="308" y="143" text-anchor="middle" font-size="13" fill="#999">#</text>
    <rect x="328" y="122" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="344" y="143" text-anchor="middle" font-size="13" fill="#333">.</text>
    <!-- row 2 : * * -->
    <rect x="292" y="154" width="32" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="308" y="175" text-anchor="middle" font-size="13" fill="#999">*</text>
    <rect x="328" y="154" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="344" y="175" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">*</text>
    <!-- row 3 : . . -->
    <rect x="292" y="186" width="32" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="308" y="207" text-anchor="middle" font-size="13" fill="#999">.</text>
    <rect x="328" y="186" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="344" y="207" text-anchor="middle" font-size="13" fill="#333">.</text>
    <text x="278" y="112" font-size="8.5" fill="#888">i=0</text>
    <text x="278" y="144" font-size="8.5" fill="#888">1</text>
    <text x="278" y="176" font-size="8.5" fill="#888">2</text>
    <text x="278" y="208" font-size="8.5" fill="#888">3</text>
  </g>

  <!-- gravity arrow -->
  <path d="M384 122 L462 122" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="423" y="116" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">重力 ↓</text>
  <text x="423" y="138" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">石头垂直下落</text>

  <!-- ===== Final result (4 x 2) ===== -->
  <text x="524" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">最终结果（4×2）</text>
  <text x="524" y="74" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">列 1 的 # 从 i=0 落到 i=1</text>

  <!-- highlight column 1 -->
  <rect x="516" y="86" width="40" height="136" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" fill-opacity="0.4" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <!-- row 0 : # . -->
    <rect x="484" y="90" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="500" y="111" text-anchor="middle" font-size="13" fill="#333">#</text>
    <rect x="520" y="90" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="536" y="111" text-anchor="middle" font-size="13" fill="#333">.</text>
    <!-- row 1 : # # -->
    <rect x="484" y="122" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="500" y="143" text-anchor="middle" font-size="13" fill="#333">#</text>
    <rect x="520" y="122" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="536" y="143" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">#</text>
    <!-- row 2 : * * -->
    <rect x="484" y="154" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="500" y="175" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">*</text>
    <rect x="520" y="154" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="536" y="175" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">*</text>
    <!-- row 3 : . . -->
    <rect x="484" y="186" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="500" y="207" text-anchor="middle" font-size="13" fill="#333">.</text>
    <rect x="520" y="186" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="536" y="207" text-anchor="middle" font-size="13" fill="#333">.</text>
  </g>

  <!-- fall arrow on col1 stone: from row0 to row1 -->
  <path d="M536 116 L536 132" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- mapping hint: original row0 -> result col1 -->
  <path d="M172 100 Q 230 40 344 90" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="4,3" filter="url(#rough2)" opacity="0.55"/>
  <text x="250" y="44" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">原行 0 → 结果列 1</text>

  <!-- ===== Insight box ===== -->
  <rect x="60" y="268" width="600" height="172" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="360" y="290" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">三个关键观察</text>
  <text x="80" y="312" font-size="10.5" fill="#333" filter="url(#rough2)">① 旋转映射：原行 r（左→右）变为结果列 m−1−r（上→下），即 result[i][m−1−r] = box[r][i]</text>
  <text x="80" y="332" font-size="10.5" fill="#333" filter="url(#rough2)">② 方向同构：新矩阵「向下」= 原行「向右」；故对原行施加向右重力等价于对结果列施加向下重力</text>
  <text x="80" y="352" font-size="10.5" fill="#333" filter="url(#rough2)">③ 就地合并：用 bottom 指针从右向左扫原行，石头落到 bottom、遇 * 重置 bottom，一趟完成旋转+重力</text>
  <text x="80" y="378" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">图中示例：原行 0 = # . * . → 结果列 1；# 向右落到 * 左侧 → . # * .</text>
  <text x="80" y="398" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">每格仅一次判断、一次写入 → 整体 O(mn) 时间、O(1) 额外空间</text>
  <text x="80" y="424" font-size="9.5" fill="#888" filter="url(#rough2)">对照两步法（先旋转再逐列重力）：本解法省去中间矩阵，常数更优</text>
</svg>
