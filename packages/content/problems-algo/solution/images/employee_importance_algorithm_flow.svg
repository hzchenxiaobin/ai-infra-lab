<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="410" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold">算法流程：建表 → 入栈 id → 弹栈累加 → 压入下属</text>

  <!-- Step 1 -->
  <rect x="40" y="48" width="460" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <circle cx="62" cy="76" r="13" fill="#446688" filter="url(#rough2)"/>
  <text x="62" y="81" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">1</text>
  <text x="86" y="72" font-size="12" fill="#446688" font-weight="bold">建立哈希表 emp_map</text>
  <text x="86" y="90" font-size="10.5" fill="#555">遍历 employees：emp_map[ e.id ] = e（存 importance 与 subordinates）；O(n) 一趟建完</text>

  <path d="M 270 106 L 270 124" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="40" y="128" width="460" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <circle cx="62" cy="156" r="13" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="62" y="161" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">2</text>
  <text x="86" y="152" font-size="12" fill="#4a7a3a" font-weight="bold">初始化</text>
  <text x="86" y="170" font-size="10.5" fill="#555">total = 0；stack = [id]（DFS 用栈；BFS 把 stack 换成 queue 即可，因只求和顺序无关）</text>

  <path d="M 270 186 L 270 204" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: loop diamond -->
  <polygon points="270,210 380,258 270,306 160,258" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="252" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">stack 非空？</text>
  <text x="270" y="270" text-anchor="middle" font-size="10.5" fill="#888">while (!stack.empty())</text>

  <!-- Yes branch: down -->
  <text x="282" y="324" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 270 308 L 270 326" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4 -->
  <rect x="40" y="330" width="460" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <circle cx="62" cy="359" r="13" fill="#b85450" filter="url(#rough2)"/>
  <text x="62" y="364" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">4</text>
  <text x="86" y="352" font-size="12" fill="#b85450" font-weight="bold">cur = stack.pop()；total += emp_map[cur].importance</text>
  <text x="86" y="370" font-size="10.5" fill="#555">把 emp_map[cur].subordinates 中每个下属 id 压入 stack（每个节点入栈 1 次）</text>

  <!-- loop back arrow -->
  <path d="M 500 359 Q 524 359 524 258 Q 524 258 500 258" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="510" y="312" font-size="9.5" fill="#666" font-style="italic">回到 ③</text>

  <!-- No branch: right -->
  <text x="394" y="252" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M 380 258 L 432 258" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: return -->
  <rect x="432" y="240" width="88" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="476" y="258" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回 total</text>
  <text x="476" y="272" text-anchor="middle" font-size="9.5" fill="#888">子树重要度和</text>
</svg>
