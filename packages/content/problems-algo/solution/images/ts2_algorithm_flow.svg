<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：左右双指针夹逼</text>

  <!-- Step 1: init -->
  <rect x="200" y="50" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="75" text-anchor="middle" font-size="12" fill="#223">初始化 left=0, right=n−1</text>

  <path d="M 280 90 L 280 112" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: while condition -->
  <polygon points="280,116 400,160 280,204 160,160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="156" text-anchor="middle" font-size="12" fill="#7a5a10" font-weight="bold">while left &lt; right ?</text>
  <text x="280" y="172" text-anchor="middle" font-size="10" fill="#9a7a30">否则结束</text>

  <path d="M 160 160 L 110 160 L 110 240" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="92" y="150" font-size="10" fill="#888">否</text>

  <path d="M 280 204 L 280 226" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="220" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Step 3: compute sum -->
  <rect x="200" y="230" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="255" text-anchor="middle" font-size="12" fill="#223">sum = nums[l] + nums[r]</text>

  <path d="M 280 270 L 280 292" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: compare decision -->
  <polygon points="280,296 440,336 280,376 120,336" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="332" text-anchor="middle" font-size="11" fill="#7a3a38" font-weight="bold">sum 与 target 比较</text>
  <text x="280" y="348" text-anchor="middle" font-size="10" fill="#9a5a58">三选一</text>

  <!-- Three branches -->
  <!-- left: sum == target -->
  <path d="M 120 336 L 70 336 L 70 96 L 200 96" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="36" y="328" font-size="10" fill="#4a7a3a" font-weight="bold">==</text>
  <rect x="20" y="96" width="150" height="0" fill="none"/>

  <!-- right: sum < target -> left++ -->
  <path d="M 440 336 L 500 336" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="450" y="328" font-size="10" fill="#446688" font-weight="bold">&lt; tgt</text>
  <rect x="500" y="316" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="524" y="332" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">left++</text>
  <text x="524" y="348" text-anchor="middle" font-size="9" fill="#6688aa">和太小</text>

  <!-- bottom branch: sum > target, move right pointer left -->
  <path d="M 280 376 L 280 398" stroke="#b85450" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="392" font-size="10" fill="#b85450" font-weight="bold">&gt; tgt</text>
  <rect x="240" y="400" width="80" height="0" fill="none"/>

  <!-- return box (reached via == branch) -->
  <rect x="6" y="62" width="138" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="75" y="80" text-anchor="middle" font-size="11" fill="#2a5a2a" font-weight="bold">返回</text>
  <text x="75" y="95" text-anchor="middle" font-size="11" fill="#2a5a2a" font-weight="bold">[left+1, right+1]</text>

  <!-- right pointer box -->
  <rect x="240" y="402" width="80" height="14" fill="none"/>

  <path d="M 524 356 L 524 384 L 75 384 L 75 102" stroke="none"/>
  <path d="M 318 408 L 318 416" stroke="none"/>

  <!-- loop back arrows: left++ and right move back to while -->
  <path d="M 524 356 Q 524 410 460 410 L 110 410 Q 70 410 70 380 L 70 200 Q 70 160 110 160" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="424" text-anchor="middle" font-size="9" fill="#999">移动后回到 while 判断</text>
</svg>
