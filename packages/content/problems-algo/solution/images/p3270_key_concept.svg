<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="255" y="30" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">key 的第 i 位 = 三个数（补 0 对齐到 4 位）第 i 位的最小值</text>

  <!-- 行标签：原值 -->
  <text x="52" y="72" text-anchor="end" font-size="12" fill="#446688" filter="url(#rough2)">num1</text>
  <text x="52" y="86" text-anchor="end" font-size="9" fill="#999" filter="url(#rough2)">= 987</text>
  <text x="52" y="122" text-anchor="end" font-size="12" fill="#446688" filter="url(#rough2)">num2</text>
  <text x="52" y="136" text-anchor="end" font-size="9" fill="#999" filter="url(#rough2)">= 879</text>
  <text x="52" y="172" text-anchor="end" font-size="12" fill="#446688" filter="url(#rough2)">num3</text>
  <text x="52" y="186" text-anchor="end" font-size="9" fill="#999" filter="url(#rough2)">= 798</text>

  <!-- num1 = 0987（第 4 位的 7 是该列最小，橙框高亮） -->
  <rect x="60" y="58" width="54" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="87" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="118" y="58" width="54" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <rect x="176" y="58" width="54" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="203" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>
  <rect x="234" y="58" width="54" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="261" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a10" filter="url(#rough2)">7</text>

  <!-- num2 = 0879（第 3 位的 7 是该列最小） -->
  <rect x="60" y="104" width="54" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="87" y="126" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="118" y="104" width="54" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145" y="126" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>
  <rect x="176" y="104" width="54" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="203" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a10" filter="url(#rough2)">7</text>
  <rect x="234" y="104" width="54" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="261" y="126" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>

  <!-- num3 = 0798（第 2 位的 7 是该列最小） -->
  <rect x="60" y="150" width="54" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="87" y="172" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="118" y="150" width="54" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="145" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#a06a10" filter="url(#rough2)">7</text>
  <rect x="176" y="150" width="54" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="203" y="172" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <rect x="234" y="150" width="54" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="261" y="172" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>

  <!-- 每列向下汇聚取 min 的箭头 -->
  <path d="M87,188 L87,250" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M145,188 L145,250" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M203,188 L203,250" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M261,188 L261,250" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="96" y="222" font-size="9" fill="#888" filter="url(#rough2)">min(0,0,0)</text>
  <text x="154" y="222" font-size="9" fill="#888" filter="url(#rough2)">min(9,8,7)</text>
  <text x="212" y="222" font-size="9" fill="#888" filter="url(#rough2)">min(8,7,9)</text>
  <text x="270" y="222" font-size="9" fill="#888" filter="url(#rough2)">min(7,9,8)</text>

  <!-- key = 0777 -->
  <rect x="60" y="254" width="54" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="87" y="276" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="118" y="254" width="54" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="145" y="276" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">7</text>
  <rect x="176" y="254" width="54" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="203" y="276" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">7</text>
  <rect x="234" y="254" width="54" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="261" y="276" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">7</text>

  <text x="60" y="248" font-size="12" fill="#4a7a3a" filter="url(#rough2)">key =</text>
  <text x="160" y="312" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">key = "0777" → 返回整型 777</text>

  <!-- 框 A：补前导 0 -->
  <rect x="330" y="52" width="175" height="80" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="417" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">不足 4 位补前导 0</text>
  <text x="417" y="96" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">987 → "0987"，879 → "0879"</text>
  <text x="417" y="118" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（缺失的高位本来就是 0）</text>

  <!-- 框 B：逐位独立 -->
  <rect x="330" y="148" width="175" height="80" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="417" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">逐位独立取 min</text>
  <text x="417" y="192" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4 个数位互不干扰、不进位</text>
  <text x="417" y="214" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（每位一个 min，拼回 4 位数）</text>

  <!-- 框 C：无前导 0 -->
  <rect x="330" y="244" width="175" height="80" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="417" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">返回无前导 0</text>
  <text x="417" y="288" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">按整型累计：777 而非 "0777"</text>
  <text x="417" y="310" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（"0000" 自然就是 0）</text>
</svg>
