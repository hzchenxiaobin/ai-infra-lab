<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">回文对称性：只改前半即可破回文</text>
  <text x="270" y="46" text-anchor="middle" font-size="11" fill="#888">s[i] = s[n−1−i]，改前半 i 后对称位仍原值 → 失配</text>

  <!-- ===== Case 1: abccba, 前半首个非 'a' 改 'a' ===== -->
  <text x="40" y="84" font-size="13" fill="#446688" font-weight="bold">分支 1：前半首个非 'a' → 改 'a'</text>

  <!-- original string cells, 6 chars: a b c c b a -->
  <g font-size="14">
    <!-- index labels -->
    <g font-size="9" fill="#888">
      <text x="84" y="108" text-anchor="middle">0</text>
      <text x="116" y="108" text-anchor="middle">1</text>
      <text x="148" y="108" text-anchor="middle">2</text>
      <text x="180" y="108" text-anchor="middle">3</text>
      <text x="212" y="108" text-anchor="middle">4</text>
      <text x="244" y="108" text-anchor="middle">5</text>
    </g>
    <!-- row: original a b c c b a -->
    <rect x="68" y="114" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="84" y="135" text-anchor="middle" fill="#333">a</text>
    <rect x="100" y="114" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="116" y="135" text-anchor="middle" fill="#d6a040" font-weight="bold">b</text>
    <rect x="132" y="114" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="148" y="135" text-anchor="middle" fill="#333">c</text>
    <rect x="164" y="114" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="180" y="135" text-anchor="middle" fill="#333">c</text>
    <rect x="196" y="114" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="212" y="135" text-anchor="middle" fill="#333">b</text>
    <rect x="228" y="114" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="244" y="135" text-anchor="middle" fill="#333">a</text>
  </g>

  <!-- half bracket: front half [0,3) -->
  <path d="M 68 152 L 68 158 L 164 158 L 164 152" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="116" y="172" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">前半 half = n/2 = 3</text>

  <!-- mirror arrow between index 1 and index 4 -->
  <path d="M 116 100 C 116 86, 212 86, 212 100" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3 2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="164" y="82" text-anchor="middle" font-size="9" fill="#b85450">镜像 n−1−i</text>

  <!-- change arrow: b -> a at index 1 -->
  <rect x="296" y="118" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="316" y="137" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">→ a</text>
  <path d="M 134 130 L 292 130" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="158" font-size="10" fill="#4a7a3a">降为 'a'：靠前最优</text>

  <!-- result row -->
  <g font-size="14">
    <rect x="68" y="190" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="84" y="211" text-anchor="middle" fill="#333">a</text>
    <rect x="100" y="190" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
    <text x="116" y="211" text-anchor="middle" fill="#4a7a3a" font-weight="bold">a</text>
    <rect x="132" y="190" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="148" y="211" text-anchor="middle" fill="#333">c</text>
    <rect x="164" y="190" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="180" y="211" text-anchor="middle" fill="#333">c</text>
    <rect x="196" y="190" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="212" y="211" text-anchor="middle" fill="#d6a040" font-weight="bold">b</text>
    <rect x="228" y="190" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="244" y="211" text-anchor="middle" fill="#333">a</text>
  </g>
  <text x="270" y="238" font-size="11" fill="#444">结果 <tspan font-weight="bold">"aaccba"</tspan>：位置1='a' ≠ 位置4='b' → 非回文 ✓</text>

  <!-- divider -->
  <path d="M 30 256 L 510 256" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Case 2: aaa, 前半全 'a' → 末位改 'b' ===== -->
  <text x="40" y="280" font-size="13" fill="#b85450" font-weight="bold">分支 2：前半全 'a' → 末位改 'b'</text>

  <!-- original aaa, 3 chars -->
  <g font-size="14">
    <g font-size="9" fill="#888">
      <text x="84" y="304" text-anchor="middle">0</text>
      <text x="116" y="304" text-anchor="middle">1</text>
      <text x="148" y="304" text-anchor="middle">2</text>
    </g>
    <rect x="68" y="310" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="84" y="331" text-anchor="middle" fill="#333">a</text>
    <rect x="100" y="310" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="116" y="331" text-anchor="middle" fill="#333">a</text>
    <rect x="132" y="310" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="148" y="331" text-anchor="middle" fill="#333">a</text>
  </g>

  <!-- half bracket [0, 1) -->
  <path d="M 68 348 L 68 354 L 100 354 L 100 348" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="84" y="368" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">前半全 'a'</text>

  <!-- middle marker for odd length -->
  <text x="116" y="368" text-anchor="middle" font-size="9" fill="#888">正中位(奇数)</text>
  <text x="116" y="380" text-anchor="middle" font-size="8" fill="#888">改它不破</text>

  <!-- change last to b -->
  <rect x="296" y="314" width="48" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="320" y="333" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">→ 'b'</text>
  <path d="M 166 326 L 292 326" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="300" y="354" font-size="10" fill="#b85450">末位升 'b'：靠后最优</text>

  <!-- result aab -->
  <g font-size="14">
    <rect x="68" y="396" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="84" y="417" text-anchor="middle" fill="#333">a</text>
    <rect x="100" y="396" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="116" y="417" text-anchor="middle" fill="#333">a</text>
    <rect x="132" y="396" width="32" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
    <text x="148" y="417" text-anchor="middle" fill="#b85450" font-weight="bold">b</text>
  </g>
  <text x="190" y="417" font-size="11" fill="#444">结果 <tspan font-weight="bold">"aab"</tspan>：位置0='a' ≠ 位置2='b' → 非回文 ✓</text>

  <!-- bottom summary box -->
  <rect x="300" y="280" width="220" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="410" y="302" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">贪心两原则</text>
  <text x="310" y="322" font-size="10" fill="#333">① 降为 'a'：靠前最优</text>
  <text x="310" y="338" font-size="10" fill="#333">　 前半从左扫首个非 'a'</text>
  <text x="310" y="360" font-size="10" fill="#333">② 升为 'b'：靠后最优</text>
  <text x="310" y="376" font-size="10" fill="#333">　 前半全 'a' → 末位改 'b'</text>
  <text x="310" y="394" font-size="9" fill="#888">两分支覆盖全部情况</text>
</svg>
