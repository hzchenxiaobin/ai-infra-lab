<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">任意二叉树：dummy 哨兵串起下一层</text>

  <!-- ===== 上半：树结构（第1层 next 链已建好） ===== -->
  <text x="40" y="56" font-size="11" fill="#888">第 1 轮后：第1层 next 已建好</text>

  <!-- 第0层 -->
  <circle cx="290" cy="80" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="290" y="84" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <!-- 第1层 -->
  <circle cx="200" cy="150" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="154" text-anchor="middle" font-size="11" fill="#333">2</text>
  <circle cx="380" cy="150" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="154" text-anchor="middle" font-size="11" fill="#333">3</text>
  <line x1="278" y1="92" x2="210" y2="138" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="302" y1="92" x2="370" y2="138" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>

  <!-- next 箭头 2->3 -->
  <path d="M 216 150 L 364 150" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,3" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="290" y="143" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">next</text>

  <!-- 第2层 -->
  <circle cx="150" cy="225" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="150" y="229" text-anchor="middle" font-size="10" fill="#333">4</text>
  <circle cx="250" cy="225" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="250" y="229" text-anchor="middle" font-size="10" fill="#333">5</text>
  <!-- 3 的左孩子为 null -->
  <text x="350" y="229" text-anchor="middle" font-size="10" fill="#999" font-style="italic">null</text>
  <circle cx="430" cy="225" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="430" y="229" text-anchor="middle" font-size="10" fill="#333">7</text>
  <line x1="190" y1="162" x2="156" y2="215" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="210" y1="162" x2="246" y2="215" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="392" y1="162" x2="424" y2="215" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <!-- 3->null 的虚线 -->
  <line x1="372" y1="162" x2="352" y2="215" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- 分隔线 -->
  <line x1="30" y1="260" x2="550" y2="260" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <!-- ===== 下半：第 2 轮——处理第1层，用 dummy 串第2层 ===== -->
  <text x="40" y="282" font-size="11" fill="#888">第 2 轮：cur 沿第1层 next 横向走，把非空孩子接到 tail</text>

  <!-- cur 标注第1层 -->
  <text x="200" y="312" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">cur=2</text>
  <text x="380" y="312" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">cur=3</text>
  <path d="M 214 305 L 366 305" stroke="#446688" stroke-width="1.4" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- dummy 哨兵 -->
  <rect x="44" y="330" width="46" height="26" fill="#eee" stroke="#999" stroke-width="1.3" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="67" y="347" text-anchor="middle" font-size="9" fill="#777">dummy</text>

  <!-- 第2层链：dummy -> 4 -> 5 -> 7 -->
  <circle cx="150" cy="343" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="347" text-anchor="middle" font-size="10" fill="#333">4</text>
  <circle cx="250" cy="343" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250" y="347" text-anchor="middle" font-size="10" fill="#333">5</text>
  <circle cx="430" cy="343" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="430" y="347" text-anchor="middle" font-size="10" fill="#333">7</text>

  <!-- 哨兵→4 -->
  <path d="M 90 343 L 138 343" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <!-- 4→5 -->
  <path d="M 162 343 L 238 343" stroke="#b85450" stroke-width="1.7" stroke-dasharray="5,3" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <!-- 5→7（跨过 null 位置） -->
  <path d="M 262 343 Q 340 333 418 343" stroke="#b85450" stroke-width="1.7" stroke-dasharray="5,3" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="340" y="328" text-anchor="middle" font-size="9" fill="#b85450">跳过 null</text>

  <!-- tail 标注 -->
  <text x="430" y="372" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">tail</text>
  <path d="M 430 358 L 430 362" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <!-- 说明框 -->
  <rect x="40" y="386" width="500" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="406" font-size="11" fill="#333">① cur=2：左 4 接 tail、右 5 接 tail  →  dummy → 4 → 5</text>
  <text x="56" y="422" font-size="11" fill="#333">② cur=3：左 null 跳过、右 7 接 tail  →  dummy → 4 → 5 → 7</text>
</svg>
