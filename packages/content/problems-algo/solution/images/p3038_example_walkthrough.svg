<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：首对定锚之后逐对校验</text>

  <!-- table header -->
  <rect x="36" y="44" width="448" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="126" y="64" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">nums</text>
  <text x="250" y="64" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">首对分数 s</text>
  <text x="368" y="64" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">逐对校验</text>
  <text x="458" y="64" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">答案</text>

  <!-- row 1 -->
  <rect x="36" y="76" width="448" height="56" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="126" y="108" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[3, 2, 1, 4, 5]</text>
  <text x="250" y="108" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">3+2 = 5</text>
  <text x="368" y="99" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">(1,4) = 5 ✓ 继续删</text>
  <text x="368" y="117" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">剩 [5] 落单，不足一对</text>
  <text x="458" y="109" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- row 2 -->
  <rect x="36" y="134" width="448" height="56" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="126" y="166" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[3, 2, 6, 1, 4]</text>
  <text x="250" y="166" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">3+2 = 5</text>
  <text x="368" y="157" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">(6,1) = 7 ≠ 5 ✗</text>
  <text x="368" y="175" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">第一个 ✗ 即终点</text>
  <text x="458" y="167" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- row 3 -->
  <rect x="36" y="192" width="448" height="56" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="126" y="218" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1,5,3,3,4,1,</text>
  <text x="126" y="234" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3,2,2,3]</text>
  <text x="250" y="224" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">1+5 = 6</text>
  <text x="368" y="215" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">(3,3) = 6 ✓ 继续删</text>
  <text x="368" y="233" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">(4,1) = 5 ≠ 6 ✗ 即停</text>
  <text x="458" y="225" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- summary box -->
  <rect x="48" y="264" width="424" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="286" text-anchor="middle" font-size="11.5" fill="#3a5a2e" font-weight="bold" filter="url(#rough2)">三种终止殊途同归：校验失败立即 break；元素不足一对循环自然耗尽。</text>
  <text x="260" y="304" text-anchor="middle" font-size="11.5" fill="#3a5a2e" filter="url(#rough2)">无论哪种，ans 里装的都是「分数全等于 s 的连续对数」。</text>

  <!-- bottom note -->
  <rect x="48" y="332" width="424" height="30" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="351" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">首对 (nums[0], nums[1]) 的和一旦确定，整个答案就被写死 —— 这就是「锚点」的含义。</text>
</svg>
