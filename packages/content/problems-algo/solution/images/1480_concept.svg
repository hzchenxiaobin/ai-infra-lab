<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrGray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#999"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：前缀和递推 res[i] = res[i−1] + nums[i]</text>

  <!-- nums label -->
  <text x="35" y="80" font-size="11.5" fill="#446688" font-weight="bold">nums</text>
  <text x="35" y="94" font-size="10" fill="#888">原始数组</text>

  <!-- nums cells: 1, 2, 3, 4 -->
  <rect x="100" y="58" width="70" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="135" y="83" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold">1</text>
  <text x="135" y="52" text-anchor="middle" font-size="10" fill="#446688">nums[0]</text>

  <rect x="195" y="58" width="70" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="230" y="83" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold">2</text>
  <text x="230" y="52" text-anchor="middle" font-size="10" fill="#446688">nums[1]</text>

  <rect x="290" y="58" width="70" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="325" y="83" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold">3</text>
  <text x="325" y="52" text-anchor="middle" font-size="10" fill="#446688">nums[2]</text>

  <rect x="385" y="58" width="70" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="420" y="83" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold">4</text>
  <text x="420" y="52" text-anchor="middle" font-size="10" fill="#446688">nums[3]</text>

  <!-- res label -->
  <text x="35" y="232" font-size="11.5" fill="#4a7a3a" font-weight="bold">res</text>
  <text x="35" y="246" font-size="10" fill="#888">动态和</text>

  <!-- res cells: 1, 3, 6, 10 -->
  <rect x="100" y="210" width="70" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="135" y="235" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold">1</text>
  <text x="135" y="204" text-anchor="middle" font-size="10" fill="#4a7a3a">res[0]</text>

  <rect x="195" y="210" width="70" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="230" y="235" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold">3</text>
  <text x="230" y="204" text-anchor="middle" font-size="10" fill="#4a7a3a">res[1]</text>

  <rect x="290" y="210" width="70" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="325" y="235" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold">6</text>
  <text x="325" y="204" text-anchor="middle" font-size="10" fill="#4a7a3a">res[2]</text>

  <rect x="385" y="210" width="70" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="420" y="235" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold">10</text>
  <text x="420" y="204" text-anchor="middle" font-size="10" fill="#4a7a3a">res[3]</text>

  <!-- i=0: vertical arrow nums[0] -> res[0] (solid, boundary) -->
  <path d="M 135 98 L 135 210" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="80" y="158" font-size="10.5" fill="#446688" font-weight="bold">= nums[0]</text>
  <text x="80" y="172" font-size="9.5" fill="#888">（边界）</text>

  <!-- i=1,2,3: vertical dashed arrows nums[i] feeds into res[i] -->
  <path d="M 230 98 L 230 210" stroke="#999" stroke-width="1.2" fill="none" stroke-dasharray="3,3" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <path d="M 325 98 L 325 210" stroke="#999" stroke-width="1.2" fill="none" stroke-dasharray="3,3" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <path d="M 420 98 L 420 210" stroke="#999" stroke-width="1.2" fill="none" stroke-dasharray="3,3" marker-end="url(#arrGray)" filter="url(#rough2)"/>

  <!-- i=1: horizontal arrow res[0] -> res[1], curved below -->
  <path d="M 170 250 Q 182 282 195 250" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="182" y="298" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">+nums[1]=2</text>

  <!-- i=2: horizontal arrow res[1] -> res[2] -->
  <path d="M 265 250 Q 277 282 290 250" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="277" y="298" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">+nums[2]=3</text>

  <!-- i=3: horizontal arrow res[2] -> res[3] -->
  <path d="M 360 250 Q 372 282 385 250" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="372" y="298" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">+nums[3]=4</text>

  <!-- formula note box -->
  <rect x="60" y="316" width="480" height="86" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300" y="340" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">前缀和递推公式（一趟遍历 i = 1..n−1）</text>
  <text x="300" y="362" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">res[0] = nums[0]   （边界）</text>
  <text x="300" y="382" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">res[i] = res[i−1] + nums[i]</text>
  <text x="300" y="397" text-anchor="middle" font-size="10" fill="#888">复用前一次结果 → 每位置 O(1)，整体 O(n)</text>
</svg>
