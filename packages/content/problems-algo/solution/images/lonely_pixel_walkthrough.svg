<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold">示例演算：picture = [[B,W,W],[W,B,W],[B,W,W]]</text>

  <!-- ===== 上半：矩阵 + 行列计数 ===== -->
  <text x="140" y="54" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">第一遍后：rowCount / colCount</text>

  <!-- 列标 -->
  <text x="218" y="72" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="254" y="72" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="290" y="72" text-anchor="middle" font-size="10" fill="#888">2</text>
  <!-- 行标 -->
  <text x="188" y="101" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="188" y="137" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="188" y="173" text-anchor="middle" font-size="10" fill="#888">2</text>

  <!-- 矩阵格子 origin (200,84), cell 36x36 -->
  <!-- row 0: B W W -->
  <rect x="200" y="84" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="218" y="107" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">B</text>
  <rect x="236" y="84" width="36" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="254" y="107" text-anchor="middle" font-size="12" fill="#ccc">W</text>
  <rect x="272" y="84" width="36" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="290" y="107" text-anchor="middle" font-size="12" fill="#ccc">W</text>
  <!-- row 1: W B W -->
  <rect x="200" y="120" width="36" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="218" y="143" text-anchor="middle" font-size="12" fill="#ccc">W</text>
  <rect x="236" y="120" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="254" y="143" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">B</text>
  <rect x="272" y="120" width="36" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="290" y="143" text-anchor="middle" font-size="12" fill="#ccc">W</text>
  <!-- row 2: B W W -->
  <rect x="200" y="156" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="218" y="179" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">B</text>
  <rect x="236" y="156" width="36" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="254" y="179" text-anchor="middle" font-size="12" fill="#ccc">W</text>
  <rect x="272" y="156" width="36" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="290" y="179" text-anchor="middle" font-size="12" fill="#ccc">W</text>

  <!-- rowCount（右侧） -->
  <text x="338" y="72" text-anchor="middle" font-size="9" fill="#888">rowCount</text>
  <rect x="324" y="88" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="338" y="103" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <rect x="324" y="124" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="338" y="139" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <rect x="324" y="160" width="28" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="338" y="175" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>

  <!-- colCount（下方） -->
  <text x="176" y="204" text-anchor="middle" font-size="9" fill="#888">colCount</text>
  <rect x="206" y="196" width="24" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="218" y="211" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <rect x="242" y="196" width="24" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="254" y="211" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="278" y="196" width="24" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="290" y="211" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- 列0双B标注 -->
  <text x="218" y="232" text-anchor="middle" font-size="9.5" fill="#b85450">↑ 列0 有 2 个 B</text>

  <!-- ===== 下半：第二遍判定表 ===== -->
  <text x="70" y="260" font-size="12" fill="#444" font-weight="bold">第二遍：逐个 B 检查 rowCount[i]==1 &amp;&amp; colCount[j]==1</text>

  <!-- 表头 -->
  <rect x="70" y="270" width="70" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="105" y="288" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">B 位置</text>
  <rect x="140" y="270" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="180" y="288" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">rowCount[i]</text>
  <rect x="220" y="270" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="260" y="288" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">colCount[j]</text>
  <rect x="300" y="270" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="350" y="288" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">判定</text>
  <rect x="400" y="270" width="110" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="455" y="288" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">结果</text>

  <!-- 第1行 (0,0) -->
  <rect x="70" y="298" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="105" y="317" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">(0,0)</text>
  <rect x="140" y="298" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="180" y="317" text-anchor="middle" font-size="11" fill="#446688">1 ✓</text>
  <rect x="220" y="298" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="260" y="317" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2 ✗</text>
  <rect x="300" y="298" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="350" y="317" text-anchor="middle" font-size="10.5" fill="#b85450">列 ≠ 1</text>
  <rect x="400" y="298" width="110" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="455" y="317" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">不孤独</text>

  <!-- 第2行 (1,1) -->
  <rect x="70" y="328" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="105" y="347" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">(1,1)</text>
  <rect x="140" y="328" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="180" y="347" text-anchor="middle" font-size="11" fill="#4a7a3a">1 ✓</text>
  <rect x="220" y="328" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="260" y="347" text-anchor="middle" font-size="11" fill="#4a7a3a">1 ✓</text>
  <rect x="300" y="328" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="350" y="347" text-anchor="middle" font-size="10.5" fill="#4a7a3a">行=1 且 列=1</text>
  <rect x="400" y="328" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="455" y="347" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">孤独 ✓ ans=1</text>

  <!-- 第3行 (2,0) -->
  <rect x="70" y="358" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="105" y="377" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">(2,0)</text>
  <rect x="140" y="358" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="180" y="377" text-anchor="middle" font-size="11" fill="#446688">1 ✓</text>
  <rect x="220" y="358" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="260" y="377" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2 ✗</text>
  <rect x="300" y="358" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="350" y="377" text-anchor="middle" font-size="10.5" fill="#b85450">列 ≠ 1</text>
  <rect x="400" y="358" width="110" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="455" y="377" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">不孤独</text>

  <!-- 结论框 -->
  <rect x="36" y="394" width="488" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="280" y="408" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">结论：仅 (1,1) 满足行=1 且 列=1，最终 ans = 1</text>
</svg>
