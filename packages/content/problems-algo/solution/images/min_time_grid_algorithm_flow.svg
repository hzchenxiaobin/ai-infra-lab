<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="520" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">网格最少时间 算法流程</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">堆优化 Dijkstra；松弛时用奇偶公式算到达时刻</text>

  <!-- ===== 0. start check ===== -->
  <rect x="60" y="58" width="290" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="205" y="78" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">① 起点特判</text>
  <text x="205" y="95" text-anchor="middle" font-size="9" fill="#555">grid[0][1]&gt;1 且 grid[1][0]&gt;1 → 返回 −1</text>

  <path d="M 205 108 L 205 130" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 1. init ===== -->
  <rect x="70" y="132" width="270" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="205" y="152" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">② 初始化</text>
  <text x="205" y="168" text-anchor="middle" font-size="9" fill="#555">dist[0][0]=0，其余=∞；堆=[(0,0,0)]</text>

  <path d="M 205 178 L 205 200" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== diamond: heap empty ===== -->
  <polygon points="205,202 270,238 205,274 140,238" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="205" y="234" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">堆为空?</text>
  <text x="205" y="250" text-anchor="middle" font-size="9" fill="#888">是 → 终点不可达 → −1</text>

  <!-- yes -> end -->
  <path d="M 270 238 L 372 238" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="318" y="230" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">是</text>
  <rect x="374" y="220" width="120" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="434" y="238" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">返回 −1</text>
  <text x="434" y="252" text-anchor="middle" font-size="9" fill="#888">Dijkstra 结束</text>

  <!-- no -->
  <path d="M 205 274 L 205 296" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="216" y="288" font-size="10" fill="#446688" font-weight="bold">否</text>

  <!-- ===== 3. pop ===== -->
  <rect x="110" y="298" width="190" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="205" y="322" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">③ 弹出堆顶 (d, r, c)</text>

  <path d="M 205 336 L 205 356" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== diamond: stale? ===== -->
  <polygon points="205,358 275,394 205,430 135,394" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="205" y="390" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">d &gt; dist[r][c]?</text>
  <text x="205" y="406" text-anchor="middle" font-size="9" fill="#888">过期记录?</text>

  <!-- yes skip -->
  <path d="M 275 394 L 372 394" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="318" y="386" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="374" y="376" width="120" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="434" y="392" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">懒删除 continue</text>
  <text x="434" y="406" text-anchor="middle" font-size="9" fill="#888">回 ② 循环</text>

  <!-- no -->
  <path d="M 205 430 L 205 450" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="216" y="444" font-size="10" fill="#446688" font-weight="bold">否</text>

  <!-- ===== 4. relax with parity ===== -->
  <rect x="70" y="452" width="270" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="205" y="470" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">④ 遍历邻居 (nr,nc) 阈值 g</text>
  <text x="205" y="485" text-anchor="middle" font-size="9" fill="#555">nd=max(d+1,g)；(nd−d) 偶则 nd++；更优则入堆</text>

  <!-- loop back -->
  <path d="M 205 492 L 205 510" stroke="#888" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="506" text-anchor="middle" font-size="9" fill="#888">（终点首次出队时直接返回 d）</text>
</svg>
