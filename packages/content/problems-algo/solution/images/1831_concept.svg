<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：DATE() 提取日期 → 按天分组 → 组内取 MAX(amount)</text>

  <!-- ===== Left: Transactions table (raw datetime) ===== -->
  <text x="100" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Transactions（原始 datetime）</text>
  <rect x="30" y="62" width="200" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="42" y="77" font-size="9" fill="#333">trans_id</text>
  <text x="110" y="77" font-size="9" fill="#333">day（datetime）</text>
  <text x="195" y="77" font-size="9" fill="#333">amount</text>
  <line x1="80" y1="62" x2="80" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="175" y1="62" x2="175" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- row 8: 2021-4-3, 57 -->
  <rect x="30" y="84" width="200" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="42" y="98" font-size="9" fill="#333">8</text>
  <text x="88" y="98" font-size="8" fill="#4a7a3a">2021-4-3 15:57:28</text>
  <text x="200" y="98" font-size="9" fill="#333">57</text>
  <!-- row 9: 2021-4-28, 21 -->
  <rect x="30" y="104" width="200" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="42" y="118" font-size="9" fill="#333">9</text>
  <text x="88" y="118" font-size="8" fill="#d6a040">2021-4-28 08:47:25</text>
  <text x="200" y="118" font-size="9" fill="#888">21</text>
  <!-- row 1: 2021-4-29, 58 -->
  <rect x="30" y="124" width="200" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="42" y="138" font-size="9" fill="#333">1</text>
  <text x="88" y="138" font-size="8" fill="#b85450">2021-4-29 13:28:30</text>
  <text x="200" y="138" font-size="9" fill="#333">58</text>
  <!-- row 5: 2021-4-28, 40 -->
  <rect x="30" y="144" width="200" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="42" y="158" font-size="9" fill="#333">5</text>
  <text x="88" y="158" font-size="8" fill="#d6a040">2021-4-28 16:39:59</text>
  <text x="200" y="158" font-size="9" fill="#d6a040" font-weight="bold">40</text>
  <!-- row 6: 2021-4-29, 58 -->
  <rect x="30" y="164" width="200" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="42" y="178" font-size="9" fill="#333">6</text>
  <text x="88" y="178" font-size="8" fill="#b85450">2021-4-29 23:39:28</text>
  <text x="200" y="178" font-size="9" fill="#b85450" font-weight="bold">58</text>
  <line x1="80" y1="84" x2="80" y2="184" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="175" y1="84" x2="175" y2="184" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Arrow: DATE() extraction -->
  <path d="M230 124 L268 124" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="249" y="116" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">DATE()</text>
  <text x="249" y="140" text-anchor="middle" font-size="8" fill="#888">截取日期</text>

  <!-- ===== Middle: extract DATE column ===== -->
  <text x="350" y="56" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">提取 DATE(day) 分组键</text>
  <rect x="270" y="62" width="160" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="282" y="77" font-size="9" fill="#333">trans_id</text>
  <text x="350" y="77" font-size="9" fill="#333">date</text>
  <text x="408" y="77" font-size="9" fill="#333">amount</text>
  <line x1="320" y1="62" x2="320" y2="84" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="390" y1="62" x2="390" y2="84" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="270" y="84" width="160" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="282" y="98" font-size="9" fill="#333">8</text>
  <text x="350" y="98" font-size="9" fill="#4a7a3a">2021-4-3</text>
  <text x="408" y="98" font-size="9" fill="#333">57</text>
  <rect x="270" y="104" width="160" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="282" y="118" font-size="9" fill="#333">9</text>
  <text x="350" y="118" font-size="9" fill="#d6a040">2021-4-28</text>
  <text x="408" y="118" font-size="9" fill="#888">21</text>
  <rect x="270" y="124" width="160" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="282" y="138" font-size="9" fill="#333">1</text>
  <text x="350" y="138" font-size="9" fill="#b85450">2021-4-29</text>
  <text x="408" y="138" font-size="9" fill="#333">58</text>
  <rect x="270" y="144" width="160" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="282" y="158" font-size="9" fill="#333">5</text>
  <text x="350" y="158" font-size="9" fill="#d6a040">2021-4-28</text>
  <text x="408" y="158" font-size="9" fill="#d6a040" font-weight="bold">40</text>
  <rect x="270" y="164" width="160" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="282" y="178" font-size="9" fill="#333">6</text>
  <text x="350" y="178" font-size="9" fill="#b85450">2021-4-29</text>
  <text x="408" y="178" font-size="9" fill="#b85450" font-weight="bold">58</text>
  <line x1="320" y1="84" x2="320" y2="184" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="390" y1="84" x2="390" y2="184" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Arrow: GROUP BY date -->
  <path d="M430 124 L468 124" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="449" y="116" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">GROUP BY</text>
  <text x="449" y="140" text-anchor="middle" font-size="8" fill="#888">按天分组</text>

  <!-- ===== Right: grouped result ===== -->
  <text x="545" y="56" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">每天 MAX(amount)</text>

  <!-- group 4-3 -->
  <rect x="476" y="72" width="130" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="488" y="88" font-size="9" fill="#4a7a3a" font-weight="bold">2021-4-3</text>
  <text x="488" y="104" font-size="9" fill="#333">max=57 → id 8</text>

  <!-- group 4-28 -->
  <rect x="476" y="120" width="130" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="488" y="136" font-size="9" fill="#d6a040" font-weight="bold">2021-4-28</text>
  <text x="488" y="152" font-size="9" fill="#333">max=40 → id 5</text>

  <!-- group 4-29 (tie!) -->
  <rect x="476" y="168" width="130" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="488" y="184" font-size="9" fill="#b85450" font-weight="bold">2021-4-29</text>
  <text x="488" y="200" font-size="9" fill="#333">max=58</text>
  <text x="488" y="214" font-size="9" fill="#b85450" font-weight="bold">→ id 1, 6（并列）</text>

  <!-- ===== Bottom note ===== -->
  <rect x="30" y="240" width="576" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="318" y="260" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">⚠️ day 是 datetime，同一天不同时刻的行必须归为一组</text>
  <text x="318" y="278" text-anchor="middle" font-size="10" fill="#666">DATE(day) 截断时间部分 → 2021-4-28 08:47:25 与 16:39:59 同属"4-28"组</text>
  <text x="318" y="292" text-anchor="middle" font-size="10" fill="#666">4-29 组 amount 并列 58 → 两行都返回（RANK / 元组 IN 天然保并列）</text>

  <!-- ===== Wrong approach warning ===== -->
  <rect x="30" y="312" width="576" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" rx="8" filter="url(#rough2)"/>
  <text x="318" y="332" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⚠️ 常见错误：PARTITION BY DAY(day) 只取"日"(1-31)</text>
  <text x="318" y="350" text-anchor="middle" font-size="10" fill="#b85450">4-3 与 5-3 的 DAY() 都是 3 → 误并一组！必须用 DATE(day) 或 DATE_FORMAT(day,'%Y-%m-%d')</text>

  <!-- ===== Bottom: final result ===== -->
  <path d="M541 222 Q541 360 350 370" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="180" y="386" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">最终输出（ORDER BY transaction_id）</text>
  <rect x="100" y="392" width="160" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="407" text-anchor="middle" font-size="9" fill="#333">transaction_id</text>
  <rect x="100" y="414" width="160" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="180" y="428" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="100" y="434" width="53" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="126" y="448" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">5</text>
  <rect x="153" y="434" width="53" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="179" y="448" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">6</text>
  <rect x="206" y="434" width="54" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="233" y="448" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">8</text>
</svg>
