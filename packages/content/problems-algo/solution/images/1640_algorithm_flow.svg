<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：建表 → 按 arr 顺序查表取货 → 整段核对</text>

  <!-- Start -->
  <ellipse cx="280" cy="54" rx="80" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="58" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">开始</text>

  <path d="M 280 72 L 280 88" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Build hash map -->
  <rect x="140" y="90" width="280" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="110" text-anchor="middle" font-size="11" fill="#333">建表：first_to_piece[p[0]] = p（遍历 pieces）</text>

  <path d="M 280 122 L 280 138" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init i -->
  <rect x="220" y="140" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="160" text-anchor="middle" font-size="11" fill="#333">i = 0</text>

  <path d="M 280 170 L 280 188" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: i < n? -->
  <polygon points="280,190 390,228 280,266 170,228" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="225" text-anchor="middle" font-size="11" fill="#333">i &lt; n ?</text>
  <text x="280" y="240" text-anchor="middle" font-size="10" fill="#888">还有未匹配段</text>

  <!-- No branch -> return true -->
  <path d="M 390 228 L 440 228" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="402" y="220" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="440" y="212" width="110" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="495" y="232" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return true ✓</text>

  <!-- Yes branch -->
  <path d="M 280 266 L 280 284" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="280" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Lookup box -->
  <rect x="170" y="286" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="306" text-anchor="middle" font-size="11" fill="#333">piece = first_to_piece[ arr[i] ]</text>

  <path d="M 280 316 L 280 334" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: found? -->
  <polygon points="280,336 390,374 280,412 170,374" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="371" text-anchor="middle" font-size="11" fill="#333">查到 piece ?</text>
  <text x="280" y="386" text-anchor="middle" font-size="10" fill="#888">arr[i] 是某 piece 首元素</text>

  <!-- No branch -> return false -->
  <path d="M 390 374 L 440 374" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="402" y="366" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="440" y="358" width="110" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="495" y="378" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return false ✗</text>

  <!-- Yes branch -->
  <path d="M 280 412 L 280 430" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="426" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Decision: match segment? -->
  <polygon points="280,432 400,466 280,500 160,466" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="463" text-anchor="middle" font-size="11" fill="#333">arr[i..i+len] == piece ?</text>
  <text x="280" y="478" text-anchor="middle" font-size="10" fill="#888">整段逐位核对</text>

  <!-- No branch -> return false -->
  <path d="M 400 466 L 440 466" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="412" y="458" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="440" y="450" width="110" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="495" y="470" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return false ✗</text>

  <!-- Yes branch -> i += len -->
  <path d="M 280 500 L 280 516" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="512" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="220" y="518" width="120" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="531" text-anchor="middle" font-size="10" fill="#333">i += len(piece)</text>

  <!-- loop back: i += len -> i < n? diamond (left side up) -->
  <path d="M 220 527 L 110 527 L 110 228 L 170 228" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="80" y="378" font-size="9" fill="#4a7a3a" font-weight="bold">循环</text>

  <!-- Legend -->
  <rect x="20" y="518" width="80" height="20" fill="#fff" stroke="#eee" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="30" y="531" font-size="9" fill="#888" font-weight="bold">图例：</text>
  <line x1="58" y1="528" x2="74" y2="528" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="78" y="531" font-size="8" fill="#555">回边</text>
</svg>
