<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：数偶数，攒够两个就赢</text>

  <!-- 示例 1 -->
  <text x="30" y="50" font-size="12.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">示例 1：nums = [1, 2, 3, 4, 5]</text>

  <rect x="40" y="60" width="52" height="32" fill="#f5f5f5" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="66" y="81" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="98" y="60" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="124" y="81" text-anchor="middle" font-size="14" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="156" y="60" width="52" height="32" fill="#f5f5f5" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="182" y="81" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="214" y="60" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="240" y="81" text-anchor="middle" font-size="14" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="272" y="60" width="52" height="32" fill="#f5f5f5" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="298" y="81" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>

  <text x="66" y="108" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">0001</text>
  <text x="124" y="108" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">0010</text>
  <text x="182" y="108" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">0011</text>
  <text x="240" y="108" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">0100</text>
  <text x="298" y="108" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">0101</text>

  <text x="30" y="130" font-size="11" fill="#555" filter="url(#rough2)">cnt →</text>
  <text x="66" y="130" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="124" y="130" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">1</text>
  <text x="182" y="130" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="240" y="130" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="298" y="130" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <text x="332" y="130" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">← cnt 达到 2，提前返回</text>

  <rect x="40" y="146" width="452" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="266" y="168" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">true：偶数 2 和 4 → 2 | 4 = 6 = 110₂，尾随一个 0 ✓</text>

  <!-- 示例 3 -->
  <text x="30" y="214" font-size="12.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">示例 3：nums = [1, 3, 5, 7, 9]</text>

  <rect x="40" y="226" width="52" height="32" fill="#f5f5f5" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="66" y="247" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="98" y="226" width="52" height="32" fill="#f5f5f5" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="124" y="247" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="156" y="226" width="52" height="32" fill="#f5f5f5" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="182" y="247" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <rect x="214" y="226" width="52" height="32" fill="#f5f5f5" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="240" y="247" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>
  <rect x="272" y="226" width="52" height="32" fill="#f5f5f5" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="298" y="247" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">9</text>

  <text x="66" y="274" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">0001</text>
  <text x="124" y="274" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">0011</text>
  <text x="182" y="274" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">0101</text>
  <text x="240" y="274" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">0111</text>
  <text x="298" y="274" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">1001</text>

  <text x="30" y="296" font-size="11" fill="#555" filter="url(#rough2)">cnt →</text>
  <text x="66" y="296" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <text x="124" y="296" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <text x="182" y="296" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <text x="240" y="296" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <text x="298" y="296" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <text x="332" y="296" font-size="10.5" fill="#8f3a36" filter="url(#rough2)">← 偶数一个也没有</text>

  <rect x="40" y="312" width="452" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="266" y="334" text-anchor="middle" font-size="12" fill="#8f3a36" filter="url(#rough2)">false：全奇数，OR 的最低位必有 1，永无尾随零 ✗</text>
</svg>
