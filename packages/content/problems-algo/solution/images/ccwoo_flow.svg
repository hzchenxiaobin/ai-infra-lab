<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：计数 ×2 + 取交集</text>

  <!-- ① Pass A 区块标题 -->
  <rect x="40" y="52" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="12" filter="url(#rough2)"/>
  <text x="95" y="70" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">① Pass A：计数</text>

  <rect x="190" y="52" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="280" y="74" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">freq1 = {} , i = 0</text>
  <line x1="280" y1="86" x2="280" y2="106" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="180" y="108" width="200" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="130" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">w = words1[i] ; freq1[w] += 1</text>
  <line x1="280" y1="142" x2="280" y2="162" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="190" y="164" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="280" y="186" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">i++ ; i &lt; n ? 回上</text>
  <path d="M 190 181 Q 110 181 110 125 Q 110 69 190 69" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="280" y1="198" x2="280" y2="220" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="214" font-size="10" fill="#666" filter="url(#rough2)">Pass A 结束</text>

  <!-- ② Pass B 区块标题 -->
  <rect x="40" y="218" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="12" filter="url(#rough2)"/>
  <text x="95" y="236" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">② Pass B：计数</text>

  <rect x="190" y="218" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="280" y="240" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">freq2 = {} , j = 0</text>
  <line x1="280" y1="252" x2="280" y2="272" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="180" y="274" width="200" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="296" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">w = words2[j] ; freq2[w] += 1</text>
  <line x1="280" y1="308" x2="280" y2="328" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="190" y="330" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="280" y="352" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">j++ ; j &lt; m ? 回上</text>
  <path d="M 190 347 Q 110 347 110 291 Q 110 235 190 235" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="280" y1="364" x2="280" y2="386" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="380" font-size="10" fill="#666" filter="url(#rough2)">Pass B 结束</text>

  <!-- ③ 取交集 -->
  <rect x="40" y="384" width="110" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="12" filter="url(#rough2)"/>
  <text x="95" y="402" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">③ 取交集</text>

  <!-- 判定 1: freq1[w]==1? -->
  <polygon points="280,388 380,420 280,452 180,420" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="416" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">遍历 freq1 键 w</text>
  <text x="280" y="434" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">freq1[w]==1 ?</text>

  <!-- 否 → 跳过 -->
  <line x1="380" y1="420" x2="450" y2="420" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="415" y="414" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="450" y="404" width="86" height="34" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="493" y="426" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">跳过该 w</text>

  <!-- 是 → 判定 2 -->
  <line x1="280" y1="452" x2="280" y2="472" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="466" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="170" y="474" width="220" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="492" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">freq2[w]==1 ? 是 → ans++ : 否则跳过</text>
</svg>
