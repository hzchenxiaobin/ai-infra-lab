<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="340" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例 1 演算：nums = [2, 9, 15, 50]，divisors 去重升序 = [2,3,5,7]</text>

  <!-- column x edges: d 40..110 | 2 110..180 | 9 180..250 | 15 250..320 | 50 320..390 | 得分 390..480 -->
  <!-- header row y 50..92 -->
  <rect x="40" y="50" width="70" height="42" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="75" y="76" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">d</text>
  <rect x="110" y="50" width="70" height="42" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145" y="76" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="180" y="50" width="70" height="42" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="215" y="76" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">9</text>
  <rect x="250" y="50" width="70" height="42" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="285" y="76" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">15</text>
  <rect x="320" y="50" width="70" height="42" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="355" y="76" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">50</text>
  <rect x="390" y="50" width="90" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="435" y="76" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">得分</text>

  <!-- row d=2 (winner) y 92..134, green highlight -->
  <rect x="40" y="92" width="70" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="75" y="118" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="110" y="92" width="70" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145" y="120" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <rect x="180" y="92" width="70" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="215" y="120" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <rect x="250" y="92" width="70" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="285" y="120" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <rect x="320" y="92" width="70" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="355" y="120" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <rect x="390" y="92" width="90" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="435" y="118" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- row d=3 y 134..176 -->
  <rect x="40" y="134" width="70" height="42" fill="#fff" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="75" y="160" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="110" y="134" width="70" height="42" fill="#fff" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145" y="162" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <rect x="180" y="134" width="70" height="42" fill="#fff" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="215" y="162" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <rect x="250" y="134" width="70" height="42" fill="#fff" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="285" y="162" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <rect x="320" y="134" width="70" height="42" fill="#fff" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="355" y="162" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <rect x="390" y="134" width="90" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="435" y="160" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>

  <!-- row d=5 y 176..218 -->
  <rect x="40" y="176" width="70" height="42" fill="#fff" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="75" y="202" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="110" y="176" width="70" height="42" fill="#fff" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145" y="204" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <rect x="180" y="176" width="70" height="42" fill="#fff" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="215" y="204" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <rect x="250" y="176" width="70" height="42" fill="#fff" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="285" y="204" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <rect x="320" y="176" width="70" height="42" fill="#fff" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="355" y="204" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <rect x="390" y="176" width="90" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="435" y="202" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>

  <!-- row d=7 y 218..260 -->
  <rect x="40" y="218" width="70" height="42" fill="#fff" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="75" y="244" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <rect x="110" y="218" width="70" height="42" fill="#fff" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145" y="246" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <rect x="180" y="218" width="70" height="42" fill="#fff" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="215" y="246" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <rect x="250" y="218" width="70" height="42" fill="#fff" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="285" y="246" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <rect x="320" y="218" width="70" height="42" fill="#fff" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="355" y="246" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <rect x="390" y="218" width="90" height="42" fill="#fff" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="435" y="244" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>

  <!-- annotation: arrow to winner row -->
  <path d="M 510 113 L 486 113" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="524" y="116" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">最</text>
  <text x="524" y="128" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">小</text>

  <!-- bottom note -->
  <rect x="40" y="276" width="440" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="296" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">最大得分 = 2，2 / 3 / 5 三者并列</text>
  <text x="260" y="314" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">取数值最小 → 返回 2</text>
</svg>
