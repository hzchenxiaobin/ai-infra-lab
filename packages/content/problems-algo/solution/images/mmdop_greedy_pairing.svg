<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">贪心配对：相邻差值 ≤ mid 就配对并跳 2 格，否则跳 1 格</text>

  <!-- ===== Case A: mid = 1, count = 2 ===== -->
  <text x="30" y="56" font-size="12" fill="#888">A. mid = 1（可行，count = 2 ≥ p = 2 ✓）</text>

  <!-- row of value chips -->
  <g font-size="12" font-weight="bold" fill="#333">
    <rect x="40" y="68" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="65" y="85" text-anchor="middle">1</text>
    <rect x="92" y="68" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="117" y="85" text-anchor="middle">1</text>
    <rect x="144" y="68" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="169" y="85" text-anchor="middle">2</text>
    <rect x="196" y="68" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="221" y="85" text-anchor="middle">3</text>
    <rect x="248" y="68" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="273" y="85" text-anchor="middle">7</text>
    <rect x="300" y="68" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="325" y="85" text-anchor="middle">10</text>
  </g>

  <!-- pairing bracket 1: idx0-1 diff0 -->
  <path d="M 65 96 Q 65 110 91 110 Q 117 110 117 96" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="91" y="124" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">差0 ≤1 配对 ✓</text>
  <!-- skip note -->
  <text x="91" y="138" text-anchor="middle" font-size="9" fill="#999">i 跳到 2</text>

  <!-- pairing bracket 2: idx2-3 diff1 -->
  <path d="M 169 96 Q 169 110 195 110 Q 221 110 221 96" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="195" y="124" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">差1 ≤1 配对 ✓</text>
  <text x="195" y="138" text-anchor="middle" font-size="9" fill="#999">i 跳到 4</text>

  <!-- idx4-5 diff3 > 1, skip -->
  <path d="M 273 96 Q 273 110 299 110 Q 325 110 325 96" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>
  <text x="299" y="124" text-anchor="middle" font-size="10" fill="#999">差3 &gt; 1 跳过</text>
  <text x="299" y="138" text-anchor="middle" font-size="9" fill="#999">i 跳到 5（越界停）</text>

  <!-- result -->
  <text x="370" y="100" font-size="11" fill="#4a7a3a" font-weight="bold">共配 2 对</text>
  <text x="370" y="116" font-size="11" fill="#4a7a3a" font-weight="bold">最大差 = 1</text>

  <!-- divider -->
  <line x1="40" y1="158" x2="420" y2="158" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- ===== Case B: mid = 0, count = 1 ===== -->
  <text x="30" y="182" font-size="12" fill="#888">B. mid = 0（不可行，count = 1 &lt; p = 2 ✗）</text>

  <g font-size="12" font-weight="bold" fill="#333">
    <rect x="40" y="194" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="65" y="211" text-anchor="middle">1</text>
    <rect x="92" y="194" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="117" y="211" text-anchor="middle">1</text>
    <rect x="144" y="194" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="169" y="211" text-anchor="middle">2</text>
    <rect x="196" y="194" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="221" y="211" text-anchor="middle">3</text>
    <rect x="248" y="194" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="273" y="211" text-anchor="middle">7</text>
    <rect x="300" y="194" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="325" y="211" text-anchor="middle">10</text>
  </g>

  <path d="M 65 222 Q 65 236 91 236 Q 117 236 117 222" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="91" y="250" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">差0 ≤0 配对 ✓</text>
  <text x="91" y="264" text-anchor="middle" font-size="9" fill="#999">i 跳到 2</text>

  <!-- remaining diffs all > 0, skip -->
  <path d="M 169 222 Q 169 236 195 236 Q 221 236 221 222" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>
  <text x="195" y="250" text-anchor="middle" font-size="10" fill="#999">差1 &gt; 0 跳过</text>
  <text x="299" y="250" text-anchor="middle" font-size="10" fill="#999">后续差值均 &gt; 0，逐格跳过</text>

  <text x="370" y="226" font-size="11" fill="#b85450" font-weight="bold">共配 1 对</text>
  <text x="370" y="242" font-size="11" fill="#b85450" font-weight="bold">不够 p = 2</text>

  <!-- ===== Why adjacent? exchange argument box ===== -->
  <rect x="40" y="284" width="500" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="56" y="306" font-size="12" fill="#444" font-weight="bold">为什么只看相邻对就够了？（交换论证）</text>
  <text x="56" y="326" font-size="11" fill="#666">若最优解含非相邻对 (i, j)，j &gt; i+1，因数组有序：</text>
  <text x="56" y="344" font-size="11" fill="#666">nums[i+1] − nums[i] ≤ nums[j] − nums[i]，用 (i, i+1) 替换 (i, j)</text>
  <text x="56" y="362" font-size="11" fill="#666">差值不增、对数不变、还腾出下标 j → 存在「全相邻」的最优解 ⇒ 贪心扫相邻即可</text>
  <text x="420" y="362" font-size="11" fill="#d6a040" font-weight="bold">⇒ O(n) 计数</text>
</svg>
