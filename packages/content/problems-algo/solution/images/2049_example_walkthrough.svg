<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算：parents = [-1,2,0,2,0]，n = 5</text>

  <!-- 表头 -->
  <rect x="30" y="48" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="60" y="67" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">节点</text>
  <rect x="92" y="48" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="167" y="67" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">删除后各部分（大小）</text>
  <rect x="244" y="48" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="304" y="67" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">乘积计算</text>
  <rect x="366" y="48" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="401" y="67" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">score</text>
  <rect x="438" y="48" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="493" y="67" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">是否最大</text>

  <!-- 行 0 -->
  <rect x="30" y="80" width="60" height="34" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="102" text-anchor="middle" font-size="11" fill="#333">0（根）</text>
  <rect x="92" y="80" width="150" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="167" y="102" text-anchor="middle" font-size="11" fill="#4a7a3a">子树2(3), 子树4(1)</text>
  <rect x="244" y="80" width="120" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="304" y="102" text-anchor="middle" font-size="11" fill="#555">3 × 1</text>
  <rect x="366" y="80" width="70" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="401" y="102" text-anchor="middle" font-size="11" fill="#555">3</text>
  <rect x="438" y="80" width="110" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="493" y="102" text-anchor="middle" font-size="10" fill="#999">—</text>

  <!-- 行 1 -->
  <rect x="30" y="116" width="60" height="34" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="138" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="92" y="116" width="150" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="167" y="138" text-anchor="middle" font-size="11" fill="#d6a040">上方剩余(4)</text>
  <rect x="244" y="116" width="120" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="304" y="138" text-anchor="middle" font-size="11" fill="#555">4</text>
  <rect x="366" y="116" width="70" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="401" y="138" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">4</text>
  <rect x="438" y="116" width="110" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="493" y="138" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✓ 最大</text>

  <!-- 行 2 -->
  <rect x="30" y="152" width="60" height="34" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="174" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="92" y="152" width="150" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="167" y="174" text-anchor="middle" font-size="10" fill="#555">子1(1), 子3(1), 上(2)</text>
  <rect x="244" y="152" width="120" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="304" y="174" text-anchor="middle" font-size="11" fill="#555">1 × 1 × 2</text>
  <rect x="366" y="152" width="70" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="401" y="174" text-anchor="middle" font-size="11" fill="#555">2</text>
  <rect x="438" y="152" width="110" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="493" y="174" text-anchor="middle" font-size="10" fill="#999">—</text>

  <!-- 行 3 -->
  <rect x="30" y="188" width="60" height="34" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="210" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="92" y="188" width="150" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="167" y="210" text-anchor="middle" font-size="11" fill="#d6a040">上方剩余(4)</text>
  <rect x="244" y="188" width="120" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="304" y="210" text-anchor="middle" font-size="11" fill="#555">4</text>
  <rect x="366" y="188" width="70" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="401" y="210" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">4</text>
  <rect x="438" y="188" width="110" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="493" y="210" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✓ 最大</text>

  <!-- 行 4 -->
  <rect x="30" y="224" width="60" height="34" fill="#eeeeee" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="246" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="92" y="224" width="150" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="167" y="246" text-anchor="middle" font-size="11" fill="#d6a040">上方剩余(4)</text>
  <rect x="244" y="224" width="120" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="304" y="246" text-anchor="middle" font-size="11" fill="#555">4</text>
  <rect x="366" y="224" width="70" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="401" y="246" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">4</text>
  <rect x="438" y="224" width="110" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="493" y="246" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✓ 最大</text>

  <!-- 结论框 -->
  <rect x="30" y="282" width="520" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="290" y="306" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">结论</text>
  <text x="48" y="328" font-size="11" fill="#555">• 叶子节点（1/3/4）：删后只剩「上方剩余」一个部分 = n − 1 = 4，score = 4</text>
  <text x="48" y="348" font-size="11" fill="#555">• 根节点 0：无「上方部分」，score = 各子树大小乘积 = 3 × 1 = 3</text>
  <text x="48" y="368" font-size="11" fill="#b85450" font-weight="bold">• 最高分 = 4，达此分数的节点数 = 3 → 返回 3</text>
</svg>
