<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：nums = [1, 13, 10, 12, 31]</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">逐元素加入 num 与 rev(num)，观察集合增长</text>

  <!-- Table: columns i(34) num(50) rev(60) 集合(240) |set|(56), start x=40 -->
  <!-- Header row: y=54, h=28 -->
  <rect x="40" y="54" width="440" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <line x1="74" y1="54" x2="74" y2="82" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="124" y1="54" x2="124" y2="82" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="184" y1="54" x2="184" y2="82" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="424" y1="54" x2="424" y2="82" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="57" y="72" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">i</text>
  <text x="99" y="72" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">num</text>
  <text x="154" y="72" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">rev(num)</text>
  <text x="304" y="72" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">加入后集合</text>
  <text x="452" y="72" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">|set|</text>

  <!-- Row 0: i=0, num=1, rev=1, set={1}, size=1 -->
  <rect x="40" y="82" width="440" height="28" fill="#fafafa" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <line x1="74" y1="82" x2="74" y2="110" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="124" y1="82" x2="124" y2="110" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="184" y1="82" x2="184" y2="110" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="424" y1="82" x2="424" y2="110" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="57" y="100" text-anchor="middle" font-size="10.5" fill="#333">0</text>
  <text x="99" y="100" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <text x="154" y="100" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <text x="194" y="100" font-size="10" fill="#333" font-weight="bold">{1}</text>
  <text x="452" y="100" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- Row 1: i=1, num=13, rev=31, set={1,13,31}, size=3 -->
  <rect x="40" y="110" width="440" height="28" fill="#fafafa" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <line x1="74" y1="110" x2="74" y2="138" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="124" y1="110" x2="124" y2="138" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="184" y1="110" x2="184" y2="138" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="424" y1="110" x2="424" y2="138" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="57" y="128" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <text x="99" y="128" text-anchor="middle" font-size="10.5" fill="#333">13</text>
  <text x="154" y="128" text-anchor="middle" font-size="10.5" fill="#333">31</text>
  <text x="194" y="128" font-size="10" fill="#333" font-weight="bold">{1, 13, 31}</text>
  <text x="452" y="128" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">3</text>

  <!-- Row 2: i=2, num=10, rev=1, set={1,10,13,31}, size=4 (1 already in) -->
  <rect x="40" y="138" width="440" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <line x1="74" y1="138" x2="74" y2="166" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="124" y1="138" x2="124" y2="166" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="184" y1="138" x2="184" y2="166" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="424" y1="138" x2="424" y2="166" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="57" y="156" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <text x="99" y="156" text-anchor="middle" font-size="10.5" fill="#333">10</text>
  <text x="154" y="156" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">1</text>
  <text x="194" y="156" font-size="10" fill="#333" font-weight="bold">{1, 10, 13, 31}</text>
  <text x="452" y="156" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">4</text>

  <!-- Row 3: i=3, num=12, rev=21, set={1,10,12,13,21,31}, size=6 -->
  <rect x="40" y="166" width="440" height="28" fill="#fafafa" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <line x1="74" y1="166" x2="74" y2="194" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="124" y1="166" x2="124" y2="194" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="184" y1="166" x2="184" y2="194" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="424" y1="166" x2="424" y2="194" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="57" y="184" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <text x="99" y="184" text-anchor="middle" font-size="10.5" fill="#333">12</text>
  <text x="154" y="184" text-anchor="middle" font-size="10.5" fill="#333">21</text>
  <text x="194" y="184" font-size="10" fill="#333" font-weight="bold">{1, 10, 12, 13, 21, 31}</text>
  <text x="452" y="184" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">6</text>

  <!-- Row 4: i=4, num=31, rev=13, set unchanged, size=6 (both already in) -->
  <rect x="40" y="194" width="440" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <line x1="74" y1="194" x2="74" y2="222" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="124" y1="194" x2="124" y2="222" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="184" y1="194" x2="184" y2="222" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="424" y1="194" x2="424" y2="222" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="57" y="212" text-anchor="middle" font-size="10.5" fill="#333">4</text>
  <text x="99" y="212" text-anchor="middle" font-size="10.5" fill="#333">31</text>
  <text x="154" y="212" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">13</text>
  <text x="194" y="212" font-size="10" fill="#888">（不变，31 与 13 均已存在）</text>
  <text x="452" y="212" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">6</text>

  <!-- Result -->
  <path d="M 260 226 L 260 244" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="248" width="220" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="271" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">答案 = 6</text>

  <!-- Notes -->
  <text x="260" y="306" text-anchor="middle" font-size="10" fill="#b85450">第 2 行：rev(10) = 01 = 1，前导零丢弃，1 已在集合中</text>
  <text x="260" y="324" text-anchor="middle" font-size="10" fill="#b85450">第 4 行：rev(31) = 13 与 31 本身均已在集合中，集合不变</text>
  <text x="260" y="344" text-anchor="middle" font-size="10" fill="#aaa">最终集合 {1, 10, 12, 13, 21, 31} 共 6 个不同整数</text>
</svg>
