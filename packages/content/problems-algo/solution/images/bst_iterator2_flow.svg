<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">进阶解法：栈（前进）+ 列表（回退）</text>

  <!-- 左侧：栈（受控中序） -->
  <text x="80" y="60" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">栈 stack</text>
  <text x="80" y="76" text-anchor="middle" font-size="9" fill="#888">待访问节点</text>

  <rect x="46" y="92" width="68" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="109" text-anchor="middle" font-size="10" fill="#999">栈顶</text>

  <rect x="46" y="120" width="68" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="137" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">15</text>
  <rect x="46" y="148" width="68" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="165" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">20</text>

  <rect x="46" y="176" width="68" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="191" text-anchor="middle" font-size="10" fill="#999">栈底</text>

  <text x="80" y="218" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">O(h) 空间</text>

  <!-- 中间：已访问列表 -->
  <text x="290" y="60" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">已访问列表 list</text>
  <text x="290" y="76" text-anchor="middle" font-size="9" fill="#888">走过的节点值</text>

  <rect x="230" y="92" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="252" y="112" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="274" y="92" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="296" y="112" text-anchor="middle" font-size="11" fill="#333">7</text>
  <rect x="318" y="92" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="340" y="112" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">9</text>
  <rect x="362" y="92" width="44" height="30" fill="#f5f5f5" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="384" y="112" text-anchor="middle" font-size="10" fill="#bbb">?</text>

  <!-- 下标 -->
  <text x="252" y="138" text-anchor="middle" font-size="9" fill="#999">0</text>
  <text x="296" y="138" text-anchor="middle" font-size="9" fill="#999">1</text>
  <text x="340" y="138" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">2←i</text>

  <!-- 指针 -->
  <path d="M 340 72 L 340 88" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <text x="290" y="160" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">list[i] = 当前指针所指</text>

  <!-- 右侧：next 逻辑 -->
  <rect x="420" y="60" width="140" height="130" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="490" y="82" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">next()</text>
  <text x="430" y="102" font-size="9" fill="#555">if i &lt; len-1:</text>
  <text x="438" y="116" font-size="9" fill="#555">i++; 返回 list[i]</text>
  <text x="430" y="132" font-size="9" fill="#555">else (i == len-1):</text>
  <text x="438" y="146" font-size="9" fill="#555">node = stack.pop()</text>
  <text x="438" y="160" font-size="9" fill="#555">pushLeft(node.right)</text>
  <text x="438" y="174" font-size="9" fill="#555">list.append(node)</text>
  <text x="438" y="184" font-size="9" fill="#555">i++; 返回 node.val</text>

  <!-- 箭头：栈 → list（next 越界时） -->
  <path d="M 130 133 Q 180 100 225 107" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="165" y="95" font-size="9" fill="#4a7a3a">弹栈补充</text>

  <!-- prev 逻辑 -->
  <rect x="420" y="200" width="140" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="490" y="222" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">prev()</text>
  <text x="430" y="240" font-size="9" fill="#555">i--; 返回 list[i]（纯回退）</text>

  <!-- 箭头：prev 左移 -->
  <path d="M 415 225 L 370 225" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <!-- 判断逻辑 -->
  <rect x="46" y="248" width="160" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="126" y="268" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">hasNext()</text>
  <text x="56" y="284" font-size="9" fill="#555">i &lt; len-1 || 栈非空</text>
  <text x="56" y="296" font-size="9" fill="#888">（已访问右侧 || 栈有新节点）</text>

  <rect x="230" y="248" width="140" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="268" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">hasPrev()</text>
  <text x="240" y="284" font-size="9" fill="#555">i &gt; 0</text>
  <text x="240" y="296" font-size="9" fill="#888">（已访问列表有左侧）</text>

  <!-- 说明框 -->
  <rect x="40" y="330" width="500" height="114" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="60" y="352" font-size="12" fill="#333" font-weight="bold">进阶：不预先遍历整棵树</text>
  <text x="60" y="370" font-size="10" fill="#555">• 栈负责「向前生成」新节点（受控中序，同 173）</text>
  <text x="60" y="386" font-size="10" fill="#555">• 列表负责「记住来路」，prev() 直接 i-- 回退，无需栈参与</text>
  <text x="60" y="402" font-size="10" fill="#555">• next() 先看 list 是否已有右侧（回退后再前进），无则从栈弹出新节点</text>
  <text x="60" y="418" font-size="10" fill="#555">• 空间 O(h + k)，k 为已访问节点数；不预遍历即满足进阶要求</text>
  <text x="60" y="434" font-size="10" fill="#b85450">• next() 均摊 O(1)（每节点入栈出栈各一次），prev()/hasNext()/hasPrev() 均 O(1)</text>
</svg>
