<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="410" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：record 追加维护 / totalScore 二分求差</text>

  <!-- 左列：record -->
  <rect x="35" y="42" width="210" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="61" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">record(time, score)</text>

  <path d="M 140 72 L 140 88" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="35" y="92" width="210" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="140" y="112" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">times 末尾追加 time</text>
  <text x="140" y="130" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">time 严格递增 ⇒ 天然有序</text>

  <path d="M 140 140 L 140 156" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="35" y="160" width="210" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="140" y="180" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">prefix 末尾追加 prefix.back() + score</text>
  <text x="140" y="198" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">prefix[i] = 前 i 场考试分数之和</text>

  <path d="M 140 208 L 140 224" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="50" y="228" width="180" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="247" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">完成（均摊 O(1)）</text>

  <!-- 右列：totalScore -->
  <rect x="265" y="42" width="230" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="61" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">totalScore(startTime, endTime)</text>

  <path d="M 380 72 L 380 88" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="265" y="92" width="230" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="380" y="110" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">l = lower_bound(times, startTime)</text>
  <text x="380" y="128" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">第一个 ≥ startTime 的下标</text>

  <path d="M 380 136 L 380 152" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="265" y="156" width="230" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="380" y="174" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">r = upper_bound(times, endTime) − 1</text>
  <text x="380" y="192" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">最后一个 ≤ endTime 的下标</text>

  <path d="M 380 200 L 380 216" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="305,248 380,218 455,248 380,278" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="253" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">l &gt; r ?</text>

  <!-- 是 → return 0 -->
  <text x="390" y="294" font-size="11" fill="#b85450" filter="url(#rough2)">是（窗口内无考试）</text>
  <path d="M 380 278 L 380 300" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="290" y="304" width="180" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="380" y="325" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">return 0</text>

  <!-- 否 → return 差值 -->
  <text x="463" y="240" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <path d="M 455 248 L 478 248 L 478 365 L 454 365" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="265" y="348" width="189" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="359" y="369" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">return prefix[r+1] − prefix[l]</text>

  <text x="380" y="400" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">两次二分，每次查询 O(log n)</text>
</svg>
