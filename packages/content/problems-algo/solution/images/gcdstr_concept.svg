<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">字符串的最大公因子：除尽关系 + 拼接等价</text>

  <!-- Panel A: divisibility -->
  <rect x="24" y="44" width="512" height="128" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">观察①：公共因子 x = 重复单元</text>

  <!-- str1 row -->
  <text x="70" y="104" font-size="11" fill="#888">str1</text>
  <rect x="130" y="88" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="106" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ABC</text>
  <rect x="182" y="88" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="206" y="106" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ABC</text>
  <text x="240" y="106" font-size="11" fill="#888">len = 6</text>

  <!-- str2 row -->
  <text x="70" y="140" font-size="11" fill="#888">str2</text>
  <rect x="130" y="124" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="154" y="142" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ABC</text>
  <text x="190" y="142" font-size="11" fill="#888">len = 3</text>

  <!-- unit highlight: brace under first block -->
  <path d="M 130 150 q 24 8 48 0" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="154" y1="158" x2="154" y2="164" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="166" font-size="11" fill="#b85450" font-weight="bold">基本单元 x = "ABC"</text>
  <text x="330" y="166" font-size="11" fill="#4a7a3a">|x| = gcd(6, 3) = 3</text>

  <!-- Panel B: concat equivalence -->
  <rect x="24" y="186" width="512" height="128" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="208" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">观察②：判据 str1 + str2 == str2 + str1</text>

  <!-- row1: str1 + str2 -->
  <text x="58" y="240" font-size="11" fill="#888">str1+str2</text>
  <rect x="130" y="224" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="242" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ABC</text>
  <rect x="182" y="224" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="206" y="242" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ABC</text>
  <rect x="234" y="224" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="258" y="242" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ABC</text>

  <!-- row2: str2 + str1 -->
  <text x="58" y="276" font-size="11" fill="#888">str2+str1</text>
  <rect x="130" y="260" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="278" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ABC</text>
  <rect x="182" y="260" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="206" y="278" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ABC</text>
  <rect x="234" y="260" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="258" y="278" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ABC</text>

  <!-- == sign -->
  <text x="305" y="254" font-size="20" fill="#4a7a3a" font-weight="bold">==</text>
  <text x="345" y="246" font-size="11" fill="#555">拼接顺序无关</text>
  <text x="345" y="262" font-size="11" fill="#4a7a3a" font-weight="bold">相等 ⇔ 存在公共因子</text>

  <!-- Insight box -->
  <rect x="24" y="326" width="512" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="344" font-size="11" fill="#555">两步：</text>
  <text x="80" y="344" font-size="11" fill="#b85450" font-weight="bold">① 判 str1+str2 == str2+str1</text>
  <text x="252" y="344" font-size="11" fill="#555">（有无）</text>
  <text x="300" y="344" font-size="11" fill="#4a7a3a" font-weight="bold">② 取 str1[0 : gcd(len1,len2)]</text>
  <text x="478" y="344" font-size="11" fill="#555">（是什么）</text>
</svg>
