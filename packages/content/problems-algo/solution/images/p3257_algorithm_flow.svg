<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrBlue" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">算法流程：双重筛选 → 排序 → 锚点枚举 → 前 6 配对</text>

  <!-- 上排：预处理（左→右） -->
  <rect x="22" y="40" width="150" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="97" y="62" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">① 每行取前 3 大</text>
  <text x="97" y="80" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">按 (值, 列号) 字典序</text>

  <line x1="172" y1="68" x2="183" y2="68" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="185" y="40" width="150" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">② 每列取前 3 大</text>
  <text x="260" y="80" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">候选 = 交集（≤ min(3m, 3n)）</text>

  <line x1="335" y1="68" x2="346" y2="68" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="348" y="40" width="150" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="423" y="62" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">③ 候选降序排序</text>
  <text x="423" y="80" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">平局按下标定序</text>

  <!-- 竖直箭头 ③→④ -->
  <line x1="423" y1="96" x2="423" y2="126" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 下排：主循环（右→左） -->
  <rect x="348" y="130" width="150" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="423" y="152" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">④ 枚举锚点</text>
  <text x="423" y="170" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">(v₁, r₁, c₁) = 三辆车之一</text>

  <line x1="348" y1="158" x2="337" y2="158" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="185" y="130" width="150" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">⑤ 收集前 6 个兼容候选</text>
  <text x="260" y="166" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">跳过与锚点同行/同列者</text>
  <text x="260" y="180" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">（至多 4 个 → 扫描 O(1)）</text>

  <line x1="185" y1="158" x2="174" y2="158" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="22" y="130" width="150" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="97" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">⑥ 15 对配对取最大</text>
  <text x="97" y="166" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">检查互不攻击</text>
  <text x="97" y="180" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">更新 ans（long long）</text>

  <!-- 循环回路：⑥ → 菱形 → ④ -->
  <path d="M 97 186 L 97 216 L 200 216" fill="none" stroke="#888" stroke-width="1.8" filter="url(#rough2)"/>
  <polygon points="260,196 320,216 260,236 200,216" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="213" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">还有锚点？</text>
  <path d="M 320 216 L 486 216 L 486 190" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="404" y="210" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <line x1="260" y1="236" x2="260" y2="262" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="254" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- 返回 -->
  <rect x="170" y="266" width="180" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="284" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">返回 ans</text>
  <text x="260" y="300" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">最大 3 × 10⁹，必须 long long</text>

  <text x="260" y="330" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">预处理 O(mn) + 排序 O(min(m,n)·log) + 主循环 O(min(m,n))</text>
  <text x="260" y="348" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">总复杂度 O(mn)，500 × 500 毫秒级</text>
</svg>
