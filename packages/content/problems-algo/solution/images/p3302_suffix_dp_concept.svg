<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">suf[i]：word2 的最长后缀，使其是 word1[i:] 的子序列</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">以 word1 = "bacdc"、word2 = "abc"（m = 3）为例</text>

  <!-- word1 行 -->
  <text x="52" y="78" text-anchor="end" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">word1</text>
  <rect x="70" y="56" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="116" y="56" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="162" y="56" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="208" y="56" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="254" y="56" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="300" y="56" width="40" height="34" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="90" y="78" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="136" y="78" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">a</text>
  <text x="182" y="78" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">c</text>
  <text x="228" y="78" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">d</text>
  <text x="274" y="78" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="320" y="78" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">∅</text>
  <text x="90" y="104" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="136" y="104" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="182" y="104" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="228" y="104" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="274" y="104" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="320" y="104" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">5 (n)</text>

  <!-- word2 行 -->
  <text x="52" y="145" text-anchor="end" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">word2</text>
  <rect x="70" y="124" width="40" height="32" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="116" y="124" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="162" y="124" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="90" y="145" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">a</text>
  <text x="136" y="145" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="182" y="145" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">c</text>

  <!-- 匹配箭头：b→word1[0]，c→word1[4]，a 失败 -->
  <path d="M 136 122 C 118 108, 102 100, 93 93" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 182 122 C 222 104, 252 96, 271 93" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 94 122 C 108 110, 122 102, 133 94" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="112" y="107" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <text x="222" y="138" font-size="10" fill="#8a3833" filter="url(#rough2)">'a' 只能对到 word1[1]，其后没有 'b'</text>
  <text x="222" y="152" font-size="10" fill="#8a3833" filter="url(#rough2)">→ 整段 "abc" 塞不进，最长后缀停在 "bc"</text>

  <!-- 后缀括号 -->
  <path d="M 114 162 L 114 166 L 156 166 L 156 170 M 202 166 L 202 162" fill="none" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 156 170 L 160 170" fill="none" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="158" y="177" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">后缀 "bc" = word2[m−2:]，b→0、c→4 落进 word1[0:]</text>

  <!-- suf 行 -->
  <text x="52" y="201" text-anchor="end" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">suf</text>
  <rect x="70" y="182" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="116" y="182" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="162" y="182" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="208" y="182" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="254" y="182" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="300" y="182" width="40" height="30" fill="#f0f0f0" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="90" y="202" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="136" y="202" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="182" y="202" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="228" y="202" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="274" y="202" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="320" y="202" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="90" y="222" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">i=0</text>
  <text x="136" y="222" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">i=1</text>
  <text x="182" y="222" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">i=2</text>
  <text x="228" y="222" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">i=3</text>
  <text x="274" y="222" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">i=4</text>
  <text x="320" y="222" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">i=5</text>

  <!-- 递推方向箭头 -->
  <path d="M 332 246 L 88 246" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="210" y="240" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">递推方向：从右往左，suf[i] 只依赖 suf[i+1]</text>

  <!-- 递推公式框 -->
  <rect x="36" y="262" width="290" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="181" y="282" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">递推（记 k = suf[i+1]）</text>
  <text x="181" y="299" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">k &lt; m 且 word1[i] == word2[m−k−1]</text>
  <text x="181" y="313" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">→ suf[i] = k+1（word1[i] 接上后缀首位）</text>
  <text x="181" y="327" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">否则 suf[i] = k（接不上，原样传递）</text>

  <!-- O(1) 判定框 -->
  <rect x="342" y="262" width="146" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="415" y="282" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">O(1) 可行性判定</text>
  <text x="415" y="299" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">word2[j:] ⊂ word1[i:]</text>
  <text x="415" y="313" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">⟺ suf[i] ≥ m − j</text>
  <text x="415" y="327" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">（长后缀匹配 ⟹ 短后缀也匹配）</text>

  <text x="260" y="352" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">贪心从左往右问「现在敢不敢动刀」，答案却藏在右边的后缀 —— 预处理必须反向一趟</text>
</svg>
