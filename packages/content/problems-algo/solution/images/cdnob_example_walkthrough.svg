<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：每日新增、收敛到稳定集 {2,…,n}</text>

  <!-- ===================== Example 1: n=5 ===================== -->
  <text x="30" y="54" font-size="13" fill="#4a7a3a" font-weight="bold">示例 1：n = 5</text>

  <rect x="30" y="62" width="62" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="61" y="84" text-anchor="middle" font-size="11" fill="#888">第 0 天</text>
  <text x="92" y="84" font-size="12.5" fill="#333" font-weight="bold">{5}</text>

  <path d="M 150 79 L 178 79" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="164" y="72" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">5%2,4=1</text>
  <text x="164" y="92" text-anchor="middle" font-size="9" fill="#888">+2 +4</text>

  <rect x="180" y="62" width="92" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="226" y="84" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">{2,4,5}</text>

  <path d="M 278 79 L 306 79" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="72" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">4%3=1</text>
  <text x="292" y="92" text-anchor="middle" font-size="9" fill="#888">+3</text>

  <rect x="308" y="62" width="110" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="363" y="84" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">{2,3,4,5}</text>

  <text x="432" y="76" font-size="10" fill="#888">稳定</text>
  <path d="M 428 79 L 448 79" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <rect x="450" y="62" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="490" y="84" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">返回 4</text>

  <!-- divider -->
  <path d="M 30 108 L 510 108" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>

  <!-- ===================== Example 2: n=3 ===================== -->
  <text x="30" y="132" font-size="13" fill="#d6a040" font-weight="bold">示例 2：n = 3</text>

  <rect x="30" y="140" width="62" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="61" y="162" text-anchor="middle" font-size="11" fill="#888">第 0 天</text>
  <text x="92" y="162" font-size="12.5" fill="#333" font-weight="bold">{3}</text>

  <path d="M 150 157 L 178 157" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="164" y="150" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">3%2=1</text>
  <text x="164" y="170" text-anchor="middle" font-size="9" fill="#888">+2</text>

  <rect x="180" y="140" width="92" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="226" y="162" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">{2,3}</text>

  <text x="292" y="154" text-anchor="middle" font-size="10" fill="#888">2 无新增</text>
  <text x="292" y="168" text-anchor="middle" font-size="9.5" fill="#888">（2%i≠1）</text>
  <path d="M 278 157 L 306 157" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <rect x="308" y="140" width="110" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="363" y="162" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">{2,3}（稳定）</text>

  <rect x="450" y="140" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="490" y="162" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">返回 2</text>

  <!-- divider -->
  <path d="M 30 188 L 510 188" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>

  <!-- ===================== Example 3: n=1 ===================== -->
  <text x="30" y="212" font-size="13" fill="#446688" font-weight="bold">示例 3：n = 1</text>

  <rect x="30" y="220" width="62" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="61" y="242" text-anchor="middle" font-size="11" fill="#888">第 0 天</text>
  <text x="92" y="242" font-size="12.5" fill="#333" font-weight="bold">{1}</text>

  <path d="M 150 237 L 178 237" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="164" y="230" text-anchor="middle" font-size="9.5" fill="#888">1%1=0</text>
  <text x="164" y="250" text-anchor="middle" font-size="9" fill="#888">无新增</text>

  <rect x="180" y="220" width="92" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="226" y="242" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">{1}</text>

  <rect x="308" y="220" width="110" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="363" y="242" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">{1}（稳定）</text>

  <rect x="450" y="220" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="490" y="242" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">返回 1</text>

  <!-- ===================== bottom summary ===================== -->
  <rect x="30" y="276" width="480" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="296" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">规律：n≥2 时桌面终态恒为 {2,3,…,n}，元素数 = n−1</text>
  <text x="270" y="314" text-anchor="middle" font-size="10.5" fill="#888">驱动力：x%(x−1)=1（x≥3）逐日把 x−1 拉上桌面；到 2 停</text>
  <text x="270" y="332" text-anchor="middle" font-size="10.5" fill="#888">n=1 时 1%1=0 无法新增 → 桌面保持 {1}，答案 1</text>
</svg>
