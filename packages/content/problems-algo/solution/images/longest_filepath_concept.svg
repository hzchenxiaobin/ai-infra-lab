<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：\t 编码层级 → 树结构 → 路径拼接</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">每个 \t 缩进一级，\n 分隔条目；文件含「.」，路径用 / 连接</text>

  <!-- ===== Left: raw string ===== -->
  <text x="130" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">原始字符串</text>
  <rect x="20" y="82" width="220" height="130" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="32" y="104" font-size="11" fill="#333" font-family="'Comic Sans MS', monospace">dir</text>
  <text x="32" y="124" font-size="11" fill="#b85450" font-family="'Comic Sans MS', monospace">\t</text>
  <text x="50" y="124" font-size="11" fill="#333" font-family="'Comic Sans MS', monospace">subdir1</text>
  <text x="32" y="144" font-size="11" fill="#b85450" font-family="'Comic Sans MS', monospace">\t</text>
  <text x="50" y="144" font-size="11" fill="#333" font-family="'Comic Sans MS', monospace">subdir2</text>
  <text x="32" y="164" font-size="11" fill="#b85450" font-family="'Comic Sans MS', monospace">\t\t</text>
  <text x="68" y="164" font-size="11" fill="#4a7a3a" font-family="'Comic Sans MS', monospace" font-weight="bold">file.ext</text>
  <text x="32" y="192" font-size="9" fill="#888">\n 分隔行，\t 个数 = 深度</text>
  <text x="32" y="206" font-size="9" fill="#888">含 . 的为文件</text>

  <!-- arrow from left to right -->
  <path d="M 245 147 L 275 147" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="260" y="140" text-anchor="middle" font-size="9" fill="#b85450">解析</text>

  <!-- ===== Right: tree ===== -->
  <text x="420" y="74" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">文件系统树</text>
  <rect x="290" y="82" width="240" height="130" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>

  <!-- tree nodes -->
  <rect x="320" y="98" width="50" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="345" y="115" text-anchor="middle" font-size="11" fill="#333">dir</text>

  <rect x="370" y="126" width="70" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="405" y="143" text-anchor="middle" font-size="10" fill="#333">subdir1</text>

  <rect x="370" y="156" width="70" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="405" y="173" text-anchor="middle" font-size="10" fill="#333">subdir2</text>

  <rect x="445" y="180" width="62" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="476" y="197" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">file.ext</text>

  <!-- tree edges -->
  <path d="M 345 122 L 345 126 L 370 138" stroke="#666" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 345 122 L 345 156 L 370 168" stroke="#666" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 405 180 L 405 184 L 445 192" stroke="#666" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- depth labels on right -->
  <text x="510" y="115" font-size="9" fill="#888">depth=0</text>
  <text x="510" y="143" font-size="9" fill="#888">depth=1</text>
  <text x="510" y="173" font-size="9" fill="#888">depth=1</text>
  <text x="510" y="197" font-size="9" fill="#888">depth=2</text>

  <!-- ===== Bottom: path formula ===== -->
  <line x1="20" y1="230" x2="540" y2="230" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <rect x="40" y="246" width="480" height="118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="268" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">最长绝对路径 = 各层名长度 + (depth) 个 /</text>

  <!-- path breakdown -->
  <rect x="60" y="282" width="36" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="78" y="298" text-anchor="middle" font-size="10" fill="#333">dir</text>
  <text x="102" y="298" font-size="12" fill="#888">/</text>

  <rect x="112" y="282" width="58" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="141" y="298" text-anchor="middle" font-size="9" fill="#333">subdir2</text>
  <text x="176" y="298" font-size="12" fill="#888">/</text>

  <rect x="186" y="282" width="56" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="214" y="298" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">file.ext</text>

  <!-- length annotation -->
  <text x="260" y="298" font-size="11" fill="#b85450" font-weight="bold">= 3 + 1 + 7 + 1 + 8 = 20</text>

  <text x="280" y="328" text-anchor="middle" font-size="10" fill="#555">cur_len[d] = cur_len[d-1] + 1(斜杠) + len(name)</text>
  <text x="280" y="350" text-anchor="middle" font-size="10" fill="#555">遇到文件（含 .）时更新全局最大值</text>
</svg>
