<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold">核心观察：路径 = 树上逐层下沉；目录是分支节点，文件是叶子</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">/a/b/c/d → 从 root 依次吃下 a → b → c → d 四段，与 Trie 按字符下沉同构</text>

  <!-- ===== Left: tree ===== -->
  <text x="30" y="72" font-size="11" fill="#446688" font-weight="bold">文件系统树</text>

  <g font-size="12">
    <!-- root -->
    <circle cx="170" cy="100" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="170" y="105" text-anchor="middle" fill="#446688" font-weight="bold">/</text>
    <text x="170" y="84" text-anchor="middle" font-size="9.5" fill="#888">root</text>

    <!-- a (dir) -->
    <circle cx="130" cy="160" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="130" y="165" text-anchor="middle" fill="#446688" font-weight="bold">a</text>
    <line x1="158" y1="112" x2="138" y2="146" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>

    <!-- b (dir) -->
    <circle cx="110" cy="220" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="110" y="225" text-anchor="middle" fill="#446688" font-weight="bold">b</text>
    <line x1="122" y1="174" x2="114" y2="206" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>

    <!-- c (dir) -->
    <circle cx="100" cy="280" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="100" y="285" text-anchor="middle" fill="#446688" font-weight="bold">c</text>
    <line x1="104" y1="234" x2="104" y2="266" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>

    <!-- d (file) -->
    <rect x="48" y="332" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
    <text x="76" y="348" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">d</text>
    <text x="76" y="361" text-anchor="middle" font-size="9" fill="#888">"hello"</text>
    <line x1="92" y1="294" x2="80" y2="332" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>

    <!-- notes.txt (file, sibling of d) -->
    <rect x="170" y="332" width="70" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
    <text x="205" y="348" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">notes.txt</text>
    <text x="205" y="361" text-anchor="middle" font-size="9" fill="#888">"hi"</text>
    <line x1="116" y1="290" x2="186" y2="332" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

    <!-- legend -->
    <circle cx="280" cy="100" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="295" y="104" font-size="10" fill="#555">目录（有 children）</text>
    <rect x="272" y="118" width="16" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="295" y="128" font-size="10" fill="#555">文件（有 content）</text>
    <line x1="272" y1="146" x2="290" y2="146" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
    <text x="295" y="150" font-size="10" fill="#555">高亮路径 /a/b/c/d</text>
  </g>

  <!-- ===== Right: Node struct ===== -->
  <text x="370" y="72" font-size="11" fill="#446688" font-weight="bold">Node 结构（目录/文件统一）</text>

  <rect x="360" y="84" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="370" y="101" font-size="11" fill="#446688" font-weight="bold">name : string</text>
  <text x="370" y="117" font-size="9.5" fill="#555">节点名，如 "d"（root 为空串）</text>

  <rect x="360" y="132" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="370" y="149" font-size="11" fill="#4a7a3a" font-weight="bold">isFile : bool</text>
  <text x="370" y="165" font-size="9.5" fill="#555">false=目录，true=文件</text>

  <rect x="360" y="180" width="200" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="370" y="197" font-size="11" fill="#d6a040" font-weight="bold">content : string</text>
  <text x="370" y="213" font-size="9.5" fill="#555">仅文件用；addContent 用 += 幂等追加</text>

  <rect x="360" y="228" width="200" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="370" y="245" font-size="11" fill="#b85450" font-weight="bold">children : map&lt;name,Node*&gt;</text>
  <text x="370" y="261" font-size="9.5" fill="#555">仅目录用；map 天然字典序 → ls 即序</text>

  <!-- bottom note -->
  <rect x="30" y="376" width="530" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="295" y="390" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">四操作同一骨架：split(path) → 从 root 逐段下沉 → 按操作收尾</text>
</svg>
