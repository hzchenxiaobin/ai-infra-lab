<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="340" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心概念：山脉 = 峰顶 + 严格递增左臂 + 严格递减右臂</text>

  <!-- index labels -->
  <text x="114" y="52" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="166" y="52" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="218" y="52" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="270" y="52" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">3</text>
  <text x="322" y="52" text-anchor="middle" font-size="10" fill="#888">4</text>
  <text x="374" y="52" text-anchor="middle" font-size="10" fill="#888">5</text>
  <text x="426" y="52" text-anchor="middle" font-size="10" fill="#888">6</text>

  <!-- bars: val 2,1,4,7,3,2,5 ; baseline y=240, scale=20/unit -->
  <!-- idx0 val2 -->
  <rect x="92" y="200" width="44" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="114" y="226" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">2</text>
  <!-- idx1 val1 (mountain) -->
  <rect x="144" y="220" width="44" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="166" y="236" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <!-- idx2 val4 (mountain) -->
  <rect x="196" y="160" width="44" height="80" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="218" y="200" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">4</text>
  <!-- idx3 val7 PEAK -->
  <rect x="248" y="100" width="44" height="140" fill="#b85450" stroke="#7a2f2c" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="270" y="176" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">7</text>
  <!-- idx4 val3 (mountain) -->
  <rect x="300" y="180" width="44" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="322" y="216" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3</text>
  <!-- idx5 val2 (mountain) -->
  <rect x="352" y="200" width="44" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="374" y="226" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2</text>
  <!-- idx6 val5 -->
  <rect x="404" y="140" width="44" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="426" y="196" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">5</text>

  <!-- baseline -->
  <path d="M 80 242 L 460 242" stroke="#bbb" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- peak callout -->
  <path d="M 270 96 L 270 76 L 350 76" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="356" y="74" font-size="11.5" fill="#b85450" font-weight="bold">峰顶 arr[3]=7</text>
  <text x="356" y="88" font-size="10.5" fill="#b85450">arr[2]&lt;arr[3]&gt;arr[4]</text>

  <!-- left arm arrow (ascending) -->
  <path d="M 168 256 L 256 256" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="212" y="252" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">左臂 ↗ 严格递增</text>

  <!-- right arm arrow (descending) -->
  <path d="M 284 256 L 372 256" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="328" y="270" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">右臂 ↘ 严格递减</text>

  <!-- result callout box -->
  <rect x="70" y="290" width="400" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="270" y="312" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">最长山脉 [1,4,7,3,2] = 下标 1..5，长度 = 5</text>
  <text x="270" y="326" text-anchor="middle" font-size="10.5" fill="#4a7a3a">长度 = 左臂长 + 1（峰） + 右臂长 = 2 + 1 + 2</text>
</svg>
