<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：一遍扫描求 max / min</text>

  <!-- 开始 -->
  <rect x="185" y="40" width="150" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="61" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">输入 nums（长度 n）, k</text>

  <path d="M 260 72 L 260 84" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="165" y="88" width="190" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="109" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">mx = mn = nums[0]，i = 1</text>

  <path d="M 260 120 L 260 134" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环菱形 -->
  <polygon points="200,138 285,172 200,206 115,172" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="177" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">i &lt; n ?</text>

  <!-- 是：更新框 -->
  <path d="M 285 172 L 316 172" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="162" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="320" y="150" width="180" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="168" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">mx = max(mx, nums[i])</text>
  <text x="410" y="184" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">mn = min(mn, nums[i])，i++</text>

  <!-- 回边 -->
  <path d="M 410 150 L 410 124 L 200 124" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 200 124 L 200 136" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 否：向下 -->
  <path d="M 200 206 L 200 222" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="212" y="220" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- 极差 -->
  <rect x="165" y="226" width="190" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="247" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">极差 d = mx − mn</text>

  <path d="M 260 258 L 260 272" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 返回 -->
  <rect x="140" y="276" width="240" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="293" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">返回 k × d</text>
  <text x="260" y="307" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（用 64 位整数承接）</text>

  <text x="260" y="338" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">💡 溢出是唯一陷阱：k·d ≤ 10⁵ × 10⁹ = 10¹⁴，32 位 int 存不下</text>
  <text x="260" y="354" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">n = 1 时 mx = mn，d = 0，答案自然为 0</text>
</svg>
