<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：groupSizes = [3,3,3,3,3,1,3]</text>

  <!-- Column headers -->
  <text x="40" y="52" font-size="11" fill="#888" font-weight="bold">i</text>
  <text x="90" y="52" font-size="11" fill="#888" font-weight="bold">size</text>
  <text x="170" y="52" font-size="11" fill="#888" font-weight="bold">桶 size=3</text>
  <text x="360" y="52" font-size="11" fill="#888" font-weight="bold">桶 size=1</text>
  <text x="480" y="52" font-size="11" fill="#888" font-weight="bold">动作</text>

  <!-- Separator -->
  <path d="M 30 58 L 540 58" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 0: i=0, size=3 -->
  <text x="44" y="80" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="92" y="80" font-size="11" fill="#446688" font-weight="bold">3</text>
  <rect x="150" y="68" width="28" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="164" y="82" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">0</text>
  <text x="340" y="80" font-size="10" fill="#aaa">（空）</text>
  <text x="478" y="80" font-size="10" fill="#888">入桶3</text>

  <!-- Row 1: i=1, size=3 -->
  <text x="44" y="108" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="92" y="108" font-size="11" fill="#446688" font-weight="bold">3</text>
  <rect x="150" y="96" width="28" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="164" y="110" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">0</text>
  <rect x="180" y="96" width="28" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="194" y="110" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <text x="340" y="108" font-size="10" fill="#aaa">（空）</text>
  <text x="478" y="108" font-size="10" fill="#888">入桶3</text>

  <!-- Row 2: i=2, size=3 → full! emit [0,1,2] -->
  <rect x="30" y="120" width="510" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="44" y="136" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="92" y="136" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="150" y="124" width="28" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="164" y="138" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="180" y="124" width="28" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="194" y="138" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="210" y="124" width="28" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="224" y="138" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="340" y="136" font-size="10" fill="#aaa">（空）</text>
  <text x="470" y="136" font-size="10" fill="#4a7a3a" font-weight="bold">满3→出组!</text>

  <!-- Row 3: i=3, size=3 (bucket cleared) -->
  <text x="44" y="164" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="92" y="164" font-size="11" fill="#446688" font-weight="bold">3</text>
  <rect x="150" y="152" width="28" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="164" y="166" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <text x="340" y="164" font-size="10" fill="#aaa">（空）</text>
  <text x="478" y="164" font-size="10" fill="#888">入桶3</text>

  <!-- Row 4: i=4, size=3 -->
  <text x="44" y="192" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="92" y="192" font-size="11" fill="#446688" font-weight="bold">3</text>
  <rect x="150" y="180" width="28" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="164" y="194" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <rect x="180" y="180" width="28" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="194" y="194" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">4</text>
  <text x="340" y="192" font-size="10" fill="#aaa">（空）</text>
  <text x="478" y="192" font-size="10" fill="#888">入桶3</text>

  <!-- Row 5: i=5, size=1 → full! emit [5] -->
  <rect x="30" y="204" width="510" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="44" y="220" font-size="11" fill="#d6a040" font-weight="bold">5</text>
  <text x="92" y="220" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <text x="248" y="220" font-size="10" fill="#aaa">（3,4 在桶3）</text>
  <rect x="340" y="208" width="28" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="354" y="222" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">5</text>
  <text x="470" y="220" font-size="10" fill="#d6a040" font-weight="bold">满1→出组!</text>

  <!-- Row 6: i=6, size=3 → full! emit [3,4,6] -->
  <rect x="30" y="236" width="510" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="44" y="252" font-size="11" fill="#4a7a3a" font-weight="bold">6</text>
  <text x="92" y="252" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="150" y="240" width="28" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="164" y="254" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="180" y="240" width="28" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="194" y="254" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">4</text>
  <rect x="210" y="240" width="28" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="224" y="254" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">6</text>
  <text x="340" y="252" font-size="10" fill="#aaa">（空）</text>
  <text x="470" y="252" font-size="10" fill="#4a7a3a" font-weight="bold">满3→出组!</text>

  <!-- Separator -->
  <path d="M 30 272 L 540 272" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Result section -->
  <text x="40" y="298" font-size="12" fill="#4a7a3a" font-weight="bold">最终输出 result：</text>

  <!-- result groups timeline -->
  <rect x="60" y="312" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="110" y="331" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">[0,1,2]</text>
  <text x="110" y="354" text-anchor="middle" font-size="9" fill="#888">i=2 时出组</text>

  <path d="M 170 326 L 196 326" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="200" y="312" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="240" y="331" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">[5]</text>
  <text x="240" y="354" text-anchor="middle" font-size="9" fill="#888">i=5 时出组</text>

  <path d="M 290 326 L 316 326" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="320" y="312" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="370" y="331" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">[3,4,6]</text>
  <text x="370" y="354" text-anchor="middle" font-size="9" fill="#888">i=6 时出组</text>

  <!-- Key observations -->
  <rect x="40" y="376" width="480" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="396" font-size="11" fill="#b85450" font-weight="bold">观察要点：</text>
  <text x="56" y="412" font-size="10" fill="#666">1. i=2 时桶3装满 [0,1,2]，立即出组并清空</text>
  <text x="56" y="426" font-size="10" fill="#666">2. i=5 入桶1，size=1 立即满，即时出组 [5]</text>
  <text x="300" y="412" font-size="10" fill="#666">3. i=6 入桶3，已有 [3,4] 加上 [6]</text>
  <text x="300" y="426" font-size="10" fill="#666">   凑满3 → 出组 [3,4,6]</text>

  <!-- Correctness note -->
  <text x="280" y="468" text-anchor="middle" font-size="10" fill="#888">每组人数 = 对应 size，每人恰好属于一组 ✓</text>
  <text x="280" y="486" text-anchor="middle" font-size="10" fill="#888">顺序不重要：[0,1,2] 或 [0,3,6] 都合法，任选一种即可</text>
  <text x="280" y="508" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">关键洞察：同 size 的人完全可互换 → 贪心分组必然可行</text>
</svg>
