<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="760" height="600" fill="#fdfcf7"/>

  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：栈模拟 + 贪心左合并</text>
  <path d="M 200 40 Q 380 48 560 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== 初始化 ===== -->
  <g filter="url(#sk)"><rect x="240" y="58" width="280" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/></g>
  <text x="380" y="80" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold">初始化</text>
  <text x="380" y="98" text-anchor="middle" font-size="11" fill="#444">stack = []（空栈）</text>

  <path d="M 380 108 L 380 130" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== 遍历 nums ===== -->
  <g filter="url(#sk)"><path d="M 380 132 L 470 172 L 380 212 L 290 172 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="380" y="170" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">还有下一个 x ?</text>
  <text x="380" y="186" text-anchor="middle" font-size="10" fill="#7a5415">（遍历 nums）</text>

  <!-- 否 → 返回 -->
  <path d="M 290 172 L 150 172 L 150 232" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="220" y="164" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <g filter="url(#sk)"><rect x="80" y="234" width="140" height="50" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="150" y="258" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">返回 stack</text>
  <text x="150" y="274" text-anchor="middle" font-size="10" fill="#2e6e2e">（最终数组）</text>

  <!-- 是 → 取 x -->
  <path d="M 380 212 L 380 240" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="392" y="230" font-size="11" fill="#2e6e2e" font-weight="bold">是</text>

  <g filter="url(#sk)"><rect x="280" y="242" width="200" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="380" y="266" text-anchor="middle" font-size="12" fill="#2b2b2b">取下一个元素 x = nums[i]</text>

  <path d="M 380 282 L 380 304" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ===== while 循环判断 ===== -->
  <g filter="url(#sk)"><path d="M 380 306 L 500 352 L 380 398 L 260 352 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="380" y="348" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">stack 非空 且</text>
  <text x="380" y="364" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">GCD(top, x) &gt; 1 ?</text>
  <text x="380" y="380" text-anchor="middle" font-size="10" fill="#7a5415">（栈顶与 x 非互质？）</text>

  <!-- 是 → 合并 -->
  <path d="M 380 398 L 380 426" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="392" y="416" font-size="11" fill="#2e6e2e" font-weight="bold">是</text>

  <g filter="url(#sk)"><rect x="250" y="428" width="260" height="56" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="380" y="450" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">top = stack.pop()</text>
  <text x="380" y="468" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">x = LCM(top, x) = top / GCD * x</text>
  <text x="380" y="480" text-anchor="middle" font-size="10" fill="#b85450">（弹出栈顶，x 更新为 LCM，继续级联）</text>

  <!-- 回到 while 判断 -->
  <path d="M 510 456 L 600 456 L 600 352 L 500 352" stroke="#4a8edb" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="612" y="408" font-size="10" fill="#4a8edb" font-weight="bold">回 while</text>
  <text x="612" y="422" font-size="10" fill="#4a8edb">（级联）</text>

  <!-- 否 → 压入 x -->
  <path d="M 260 352 L 150 352 L 150 428" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="200" y="344" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <g filter="url(#sk)"><rect x="80" y="430" width="140" height="50" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/></g>
  <text x="150" y="454" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">stack.push(x)</text>
  <text x="150" y="470" text-anchor="middle" font-size="10" fill="#666">（压入合并后的 x）</text>

  <!-- 回到遍历 -->
  <path d="M 150 480 L 150 540 L 700 540 L 700 172 L 470 172" stroke="#4a8edb" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="710" y="360" font-size="10" fill="#4a8edb" font-weight="bold">回遍历</text>
  <text x="710" y="374" font-size="10" fill="#4a8edb">下一个 x</text>

  <!-- 底部提示 -->
  <rect x="40" y="556" width="680" height="32" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#sk)"/>
  <text x="380" y="576" text-anchor="middle" font-size="11" fill="#7a5415">关键：每个 x 通过 while 循环贪心合并所有非互质栈顶，遇到互质边界即停——级联合并保证最终相邻元素两两互质</text>
</svg>
