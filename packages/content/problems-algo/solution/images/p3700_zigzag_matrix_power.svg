<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：整层转移 = 一次矩阵乘法 v(i+1) = T·v(i)</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">转移线性且不随 i 变 ⇒ n−2 次连乘坍缩成 T^(n−2)，30 轮矩阵乘法接管 10⁹</text>

  <!-- v(i) -->
  <text x="100" y="72" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">v(i)</text>
  <rect x="55" y="78" width="90" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="100" y="101" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">up</text>
  <text x="100" y="118" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">（升结尾）</text>
  <rect x="55" y="134" width="90" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="100" y="157" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">dn</text>
  <text x="100" y="174" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">（降结尾）</text>

  <path d="M 148 130 L 178 130" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- T 矩阵 -->
  <text x="230" y="78" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">T</text>
  <rect x="185" y="85" width="45" height="45" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="207" y="113" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">0</text>
  <rect x="230" y="85" width="45" height="45" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="252" y="113" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">P</text>
  <rect x="185" y="130" width="45" height="45" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="207" y="158" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">S</text>
  <rect x="230" y="130" width="45" height="45" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="252" y="158" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">0</text>

  <path d="M 278 130 L 308 130" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- v(i+1) -->
  <text x="360" y="72" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">v(i+1)</text>
  <rect x="315" y="78" width="90" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="360" y="101" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">up</text>
  <text x="360" y="118" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">（升结尾）</text>
  <rect x="315" y="134" width="90" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="360" y="157" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">dn</text>
  <text x="360" y="174" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">（降结尾）</text>

  <!-- 右侧注释 -->
  <text x="418" y="92" font-size="9.5" fill="#446688" filter="url(#rough2)">P[y][x] = [x&lt;y]：</text>
  <text x="418" y="106" font-size="9.5" fill="#446688" filter="url(#rough2)">dn→up，升到更大</text>
  <text x="418" y="124" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">S[y][x] = [x&gt;y]：</text>
  <text x="418" y="138" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">up→dn，降到更小</text>
  <text x="418" y="158" font-size="9.5" fill="#333" filter="url(#rough2)">0/1 矩阵，2m ≤ 150 维</text>
  <text x="418" y="172" font-size="9.5" fill="#333" filter="url(#rough2)">对角块全 0：</text>
  <text x="418" y="186" font-size="9.5" fill="#333" filter="url(#rough2)">方向必须翻转的化身</text>

  <!-- 初始向量 -->
  <text x="260" y="207" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">初始向量 v₂ = (0,1,…,m−1; m−1,…,1,0)：up(x)=x，dn(x)=m−1−x，即 I 版的「长度 2 层」</text>

  <!-- 快速幂链条 -->
  <text x="260" y="232" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">快速幂：按位平方，⌈log₂n⌉ ≈ 30 轮接管 n−2 次连乘</text>

  <rect x="90" y="244" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="110" y="263" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">T</text>
  <path d="M 132 258 L 161 258" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="165" y="244" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="185" y="263" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">T²</text>
  <path d="M 207 258 L 236 258" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="240" y="244" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="260" y="263" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">T⁴</text>
  <path d="M 282 258 L 311 258" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="315" y="244" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="335" y="263" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">T⁸</text>
  <path d="M 357 258 L 386 258" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="390" y="244" width="30" height="28" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="405" y="263" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">…</text>
  <path d="M 422 258 L 441 258" fill="none" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="445" y="244" width="52" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="471" y="263" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">Tⁿ⁻²</text>

  <text x="260" y="294" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">ans = 1ᵀ · Tⁿ⁻² · v₂（P 初值 = 单位阵，按 e = n−2 的二进制位累乘）</text>

  <!-- 底部说明 -->
  <text x="260" y="322" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">⚠️ 矩阵乘法无交换律，但连乘的都是 T 的幂 ⇒ 快速幂任意次序累乘仍得 Tⁿ⁻²</text>
  <text x="260" y="344" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">💡 单次乘法 (2m)³ ≤ 3.4×10⁶ 次乘加取模，约 60 次共 2×10⁸——C++ 实测 0.1s</text>
</svg>
