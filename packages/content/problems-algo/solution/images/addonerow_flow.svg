<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：BFS 到 depth−1 层后插入新行</text>

  <!-- Start -->
  <rect x="210" y="48" width="140" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">开始 (root, val, depth)</text>

  <line x1="280" y1="78" x2="280" y2="94" stroke="#888" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: depth == 1? -->
  <polygon points="280,96 380,136 280,176 180,136" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="134" text-anchor="middle" font-size="12" fill="#7a5a20" font-weight="bold">depth == 1 ?</text>
  <text x="280" y="150" text-anchor="middle" font-size="10" fill="#7a5a20">（根上方插新根）</text>

  <!-- Yes branch (left) -->
  <text x="155" y="132" font-size="11" fill="#4a7a3a" font-weight="bold">Yes</text>
  <line x1="180" y1="136" x2="120" y2="136" stroke="#888" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="20" y="120" width="100" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="70" y="133" text-anchor="middle" font-size="10" fill="#3a5a2a" font-weight="bold">newRoot = TreeNode(val)</text>
  <text x="70" y="146" text-anchor="middle" font-size="10" fill="#3a5a2a">newRoot.left = root</text>

  <line x1="70" y1="152" x2="70" y2="430" stroke="#888" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4 2"/>

  <rect x="20" y="418" width="100" height="30" rx="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="438" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">返回 newRoot</text>

  <!-- No branch (down) -->
  <text x="290" y="196" font-size="11" fill="#b85450" font-weight="bold">No</text>
  <line x1="280" y1="176" x2="280" y2="194" stroke="#888" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- BFS box -->
  <rect x="160" y="196" width="240" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="214" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">BFS 逐层遍历，cur_depth 从 1 起</text>
  <text x="280" y="230" text-anchor="middle" font-size="10" fill="#446688">每层：弹出 size 个节点，子节点入队</text>

  <line x1="280" y1="240" x2="280" y2="256" stroke="#888" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: cur_depth == depth-1? -->
  <polygon points="280,258 400,298 280,338 160,298" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="296" text-anchor="middle" font-size="12" fill="#7a5a20" font-weight="bold">cur_depth == depth−1 ?</text>
  <text x="280" y="312" text-anchor="middle" font-size="10" fill="#7a5a20">（到达目标层的上一层）</text>

  <!-- No: loop back -->
  <text x="415" y="294" font-size="11" fill="#b85450" font-weight="bold">No</text>
  <path d="M 400 298 L 440 298 L 440 218 L 400 218" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="448" y="262" font-size="9" fill="#888">cur_depth++</text>
  <text x="448" y="274" font-size="9" fill="#888">继续 BFS</text>

  <!-- Yes: insert -->
  <text x="290" y="358" font-size="11" fill="#4a7a3a" font-weight="bold">Yes</text>
  <line x1="280" y1="338" x2="280" y2="356" stroke="#888" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="358" width="360" height="62" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="376" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">对该层每个节点 cur 执行插入：</text>
  <text x="120" y="392" font-size="10" fill="#3a5a2a">• newL = TreeNode(val)　newL.left = cur.left　cur.left = newL</text>
  <text x="120" y="408" font-size="10" fill="#3a5a2a">• newR = TreeNode(val)　newR.right = cur.right　cur.right = newR</text>

  <line x1="280" y1="420" x2="280" y2="436" stroke="#888" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="210" y="438" width="140" height="30" rx="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="458" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">返回 root</text>

  <!-- note -->
  <rect x="100" y="466" width="360" height="10" fill="none"/>
</svg>
