<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：按员工分组，取 MAX(salary) 即当前薪水</text>

  <!-- ===== Left: Salary 表（含历史薪水记录） ===== -->
  <text x="100" y="52" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">Salary 表（历史记录，多行/员工）</text>

  <!-- header -->
  <rect x="30" y="60" width="50" height="26" fill="#446688" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="55" y="78" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">emp_id</text>
  <rect x="80" y="60" width="90" height="26" fill="#446688" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="125" y="78" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">salary</text>

  <!-- row: emp 1, 110000 (max -> green) -->
  <rect x="30" y="86" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="55" y="104" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="80" y="86" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="125" y="104" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">110000</text>

  <!-- row: emp 1, 106119 (drop -> gray) -->
  <rect x="30" y="112" width="50" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="55" y="130" text-anchor="middle" font-size="11" fill="#999">1</text>
  <rect x="80" y="112" width="90" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="125" y="130" text-anchor="middle" font-size="11" fill="#999">106119</text>

  <!-- row: emp 2, 128922 (drop -> gray) -->
  <rect x="30" y="138" width="50" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="55" y="156" text-anchor="middle" font-size="11" fill="#999">2</text>
  <rect x="80" y="138" width="90" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="125" y="156" text-anchor="middle" font-size="11" fill="#999">128922</text>

  <!-- row: emp 2, 130000 (max -> green) -->
  <rect x="30" y="164" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="55" y="182" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="80" y="164" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="125" y="182" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">130000</text>

  <!-- row: emp 3, 42689 (single -> green) -->
  <rect x="30" y="190" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="55" y="208" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="80" y="190" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="125" y="208" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">42689</text>

  <!-- row: emp 4, 162825 (drop -> gray) -->
  <rect x="30" y="216" width="50" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="55" y="234" text-anchor="middle" font-size="11" fill="#999">4</text>
  <rect x="80" y="216" width="90" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="125" y="234" text-anchor="middle" font-size="11" fill="#999">162825</text>

  <!-- row: emp 4, 170000 (max -> green) -->
  <rect x="30" y="242" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="55" y="260" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>
  <rect x="80" y="242" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="125" y="260" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">170000</text>

  <!-- arrow: GROUP BY emp_id, MAX(salary) -->
  <path d="M 185 160 L 360 160" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="200" y="124" width="145" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="272" y="144" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">GROUP BY emp_id</text>
  <rect x="200" y="170" width="145" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="272" y="188" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">MAX(salary)</text>

  <!-- ===== Right: 结果（当前薪水） ===== -->
  <text x="460" y="52" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">结果（每位员工当前薪水）</text>

  <rect x="370" y="60" width="50" height="26" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="395" y="78" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">emp_id</text>
  <rect x="420" y="60" width="90" height="26" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="465" y="78" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">salary</text>

  <rect x="370" y="86" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="395" y="104" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="420" y="86" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="465" y="104" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">110000</text>

  <rect x="370" y="112" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="395" y="130" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="420" y="112" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="465" y="130" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">130000</text>

  <rect x="370" y="138" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="395" y="156" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="420" y="138" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="465" y="156" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">42689</text>

  <rect x="370" y="164" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="395" y="182" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>
  <rect x="420" y="164" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="465" y="182" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">170000</text>

  <!-- Bottom note -->
  <rect x="40" y="300" width="480" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="318" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">薪水随时间增长 → 当前薪水 = 每员工最大 salary</text>
  <text x="280" y="336" text-anchor="middle" font-size="10" fill="#666">绿色行保留并取 MAX；灰色行丢弃；单行员工直接保留</text>
</svg>
