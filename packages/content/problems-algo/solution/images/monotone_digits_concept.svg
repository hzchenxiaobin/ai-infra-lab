<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：从右向左找违例，前位减1、后续全置9</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">以 N = 332 为例，两次违例、mark 不断左移</text>

  <!-- Row 1: N = 332 -->
  <text x="40" y="82" font-size="12" fill="#666" font-weight="bold">N =</text>
  <rect x="90" y="62" width="46" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="113" y="90" text-anchor="middle" font-size="17" fill="#333">3</text>
  <rect x="142" y="62" width="46" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="165" y="90" text-anchor="middle" font-size="17" fill="#333">3</text>
  <rect x="194" y="62" width="46" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="217" y="90" text-anchor="middle" font-size="17" fill="#333">2</text>
  <text x="113" y="118" text-anchor="middle" font-size="9" fill="#888">[0]</text>
  <text x="165" y="118" text-anchor="middle" font-size="9" fill="#888">[1]</text>
  <text x="217" y="118" text-anchor="middle" font-size="9" fill="#888">[2]</text>

  <!-- scan arrow -->
  <path d="M 220 132 Q 165 146 113 132" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="165" y="152" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">从右向左扫描</text>

  <!-- Row 2: violation [1] > [2] -->
  <path d="M 165 162 L 165 178" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="300" y="62" width="46" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="323" y="90" text-anchor="middle" font-size="17" fill="#333">3</text>
  <rect x="352" y="62" width="46" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="375" y="90" text-anchor="middle" font-size="17" fill="#b85450">3</text>
  <rect x="404" y="62" width="46" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="427" y="90" text-anchor="middle" font-size="17" fill="#b85450">2</text>
  <text x="391" y="52" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">[1] &gt; [2] 违例！</text>
  <text x="391" y="118" text-anchor="middle" font-size="10" fill="#888">digits[1]−1 → 2,  mark = 2</text>

  <!-- Row 3: after step 1, continue scan finds [0] > [1] -->
  <path d="M 391 132 L 391 178" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="300" y="184" width="46" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="323" y="212" text-anchor="middle" font-size="17" fill="#b85450">3</text>
  <rect x="352" y="184" width="46" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="375" y="212" text-anchor="middle" font-size="17" fill="#d6a040">2</text>
  <rect x="404" y="184" width="46" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="427" y="212" text-anchor="middle" font-size="14" fill="#aaa">9?</text>
  <text x="391" y="244" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">[0] &gt; [1] 又违例！</text>
  <text x="391" y="258" text-anchor="middle" font-size="10" fill="#888">digits[0]−1 → 2,  mark = 1（左移）</text>

  <!-- Row 4: final set mark..end = 9 -->
  <path d="M 391 268 L 391 284" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="40" y="320" font-size="12" fill="#666" font-weight="bold">mark 起全置 9：</text>
  <rect x="150" y="300" width="46" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="173" y="328" text-anchor="middle" font-size="17" fill="#4a7a3a">2</text>
  <rect x="202" y="300" width="46" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="225" y="328" text-anchor="middle" font-size="17" fill="#4a7a3a">9</text>
  <rect x="254" y="300" width="46" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="277" y="328" text-anchor="middle" font-size="17" fill="#4a7a3a">9</text>
  <text x="320" y="328" font-size="14" fill="#4a7a3a" font-weight="bold">= 299  ✓</text>

  <!-- note box -->
  <rect x="20" y="350" width="520" height="42" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="280" y="370" text-anchor="middle" font-size="11" fill="#666">减1可能引入新违例 → 必须右→左扫完所有位置，mark 记最左违例</text>
  <text x="280" y="385" text-anchor="middle" font-size="10" fill="#888">低位全置9 = 在保证 ≤ N 且单调递增的前提下最大化数值</text>
</svg>
