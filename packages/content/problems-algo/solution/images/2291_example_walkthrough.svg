<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="300" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例 1：dp 演算（budget=10）</text>

  <!-- col center x = 147 + 34*k : 147,181,215,249,283,317,351,385,419,453,487 -->
  <!-- table region x 10..504, y 50..260, row height 30 -->

  <!-- grid lines -->
  <g stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)">
    <!-- outer border -->
    <rect x="10" y="50" width="494" height="210" rx="4"/>
    <!-- label/data boundary -->
    <line x1="130" y1="50" x2="130" y2="260"/>
    <!-- internal row separators -->
    <line x1="10" y1="80" x2="504" y2="80"/>
    <line x1="10" y1="110" x2="504" y2="110"/>
    <line x1="10" y1="140" x2="504" y2="140"/>
    <line x1="10" y1="170" x2="504" y2="170"/>
    <line x1="10" y1="200" x2="504" y2="200"/>
    <line x1="10" y1="230" x2="504" y2="230"/>
    <!-- light column separators -->
    <line x1="164" y1="50" x2="164" y2="260" stroke-width="0.7" stroke="#aac"/>
    <line x1="198" y1="50" x2="198" y2="260" stroke-width="0.7" stroke="#aac"/>
    <line x1="232" y1="50" x2="232" y2="260" stroke-width="0.7" stroke="#aac"/>
    <line x1="266" y1="50" x2="266" y2="260" stroke-width="0.7" stroke="#aac"/>
    <line x1="300" y1="50" x2="300" y2="260" stroke-width="0.7" stroke="#aac"/>
    <line x1="334" y1="50" x2="334" y2="260" stroke-width="0.7" stroke="#aac"/>
    <line x1="368" y1="50" x2="368" y2="260" stroke-width="0.7" stroke="#aac"/>
    <line x1="402" y1="50" x2="402" y2="260" stroke-width="0.7" stroke="#aac"/>
    <line x1="436" y1="50" x2="436" y2="260" stroke-width="0.7" stroke="#aac"/>
    <line x1="470" y1="50" x2="470" y2="260" stroke-width="0.7" stroke="#aac"/>
  </g>

  <!-- header -->
  <text x="70" y="70" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">处理股票后</text>
  <text y="70" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">
    <tspan x="147">0</tspan><tspan x="181">1</tspan><tspan x="215">2</tspan><tspan x="249">3</tspan><tspan x="283">4</tspan><tspan x="317">5</tspan><tspan x="351">6</tspan><tspan x="385">7</tspan><tspan x="419">8</tspan><tspan x="453">9</tspan><tspan x="487">10</tspan>
  </text>

  <!-- 初始 -->
  <text x="70" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">初始</text>
  <text y="100" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    <tspan x="147">0</tspan><tspan x="181">0</tspan><tspan x="215">0</tspan><tspan x="249">0</tspan><tspan x="283">0</tspan><tspan x="317">0</tspan><tspan x="351">0</tspan><tspan x="385">0</tspan><tspan x="419">0</tspan><tspan x="453">0</tspan><tspan x="487">0</tspan>
  </text>

  <!-- 股票0  w5 v3  changed: 5,6,7,8,9,10 -->
  <text x="70" y="130" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">股票0 w5 v3</text>
  <text y="130" text-anchor="middle" font-size="13" filter="url(#rough2)">
    <tspan x="147" fill="#333">0</tspan><tspan x="181" fill="#333">0</tspan><tspan x="215" fill="#333">0</tspan><tspan x="249" fill="#333">0</tspan><tspan x="283" fill="#333">0</tspan><tspan x="317" fill="#4a7a3a">3</tspan><tspan x="351" fill="#4a7a3a">3</tspan><tspan x="385" fill="#4a7a3a">3</tspan><tspan x="419" fill="#4a7a3a">3</tspan><tspan x="453" fill="#4a7a3a">3</tspan><tspan x="487" fill="#4a7a3a">3</tspan>
  </text>

  <!-- 股票1  w4 v1  changed: 4(1),9(4),10(4) -->
  <text x="70" y="160" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">股票1 w4 v1</text>
  <text y="160" text-anchor="middle" font-size="13" filter="url(#rough2)">
    <tspan x="147" fill="#333">0</tspan><tspan x="181" fill="#333">0</tspan><tspan x="215" fill="#333">0</tspan><tspan x="249" fill="#333">0</tspan><tspan x="283" fill="#4a7a3a">1</tspan><tspan x="317" fill="#333">3</tspan><tspan x="351" fill="#333">3</tspan><tspan x="385" fill="#333">3</tspan><tspan x="419" fill="#333">3</tspan><tspan x="453" fill="#4a7a3a">4</tspan><tspan x="487" fill="#4a7a3a">4</tspan>
  </text>

  <!-- 股票2  w6 v=−2 跳过  unchanged -->
  <text x="70" y="190" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">股票2 v&lt;0 跳过</text>
  <text y="190" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">
    <tspan x="147">0</tspan><tspan x="181">0</tspan><tspan x="215">0</tspan><tspan x="249">0</tspan><tspan x="283">1</tspan><tspan x="317">3</tspan><tspan x="351">3</tspan><tspan x="385">3</tspan><tspan x="419">3</tspan><tspan x="453">4</tspan><tspan x="487">4</tspan>
  </text>

  <!-- 股票3  w2 v1  changed: 2(1),3(1),7(4),8(4) -->
  <text x="70" y="220" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">股票3 w2 v1</text>
  <text y="220" text-anchor="middle" font-size="13" filter="url(#rough2)">
    <tspan x="147" fill="#333">0</tspan><tspan x="181" fill="#333">0</tspan><tspan x="215" fill="#4a7a3a">1</tspan><tspan x="249" fill="#4a7a3a">1</tspan><tspan x="283" fill="#333">1</tspan><tspan x="317" fill="#333">3</tspan><tspan x="351" fill="#333">3</tspan><tspan x="385" fill="#4a7a3a">4</tspan><tspan x="419" fill="#4a7a3a">4</tspan><tspan x="453" fill="#333">4</tspan><tspan x="487" fill="#333">4</tspan>
  </text>

  <!-- 股票4  w3 v2  changed: 3(2),4(2),8(5),9(5),10(6 answer) -->
  <text x="70" y="250" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">股票4 w3 v2</text>
  <text y="250" text-anchor="middle" font-size="13" filter="url(#rough2)">
    <tspan x="147" fill="#333">0</tspan><tspan x="181" fill="#333">0</tspan><tspan x="215" fill="#333">1</tspan><tspan x="249" fill="#4a7a3a">2</tspan><tspan x="283" fill="#4a7a3a">2</tspan><tspan x="317" fill="#333">3</tspan><tspan x="351" fill="#333">3</tspan><tspan x="385" fill="#333">4</tspan><tspan x="419" fill="#4a7a3a">5</tspan><tspan x="453" fill="#4a7a3a">5</tspan><tspan x="487" fill="#b85450" font-weight="bold">6</tspan>
  </text>

  <!-- answer annotation -->
  <text x="487" y="285" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">↑ 答案 dp[10]=6</text>
  <text x="120" y="285" font-size="11" fill="#4a7a3a" filter="url(#rough2)">绿色=本行新增/更新</text>
</svg>
