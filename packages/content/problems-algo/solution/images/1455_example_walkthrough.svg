<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：逐单词前缀比对，首个命中即返回</text>

  <!-- ============ Example 1 ============ -->
  <text x="40" y="50" font-size="12.5" fill="#333" font-weight="bold">示例 1：sentence = "i love eating burger"，searchWord = "burg" → <tspan fill="#4a7a3a">4</tspan></text>

  <!-- Table header: 下标 | 单词 | 与检索词比对 | 命中? -->
  <rect x="70" y="62" width="50" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="95" y="78" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">下标</text>
  <rect x="122" y="62" width="86" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="165" y="78" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">单词</text>
  <rect x="210" y="62" width="210" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="315" y="78" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">与检索词 "burg" 比对</text>
  <rect x="422" y="62" width="110" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="477" y="78" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">命中?</text>

  <!-- Row 1: i -->
  <rect x="70" y="86" width="50" height="24" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="95" y="102" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <rect x="122" y="86" width="86" height="24" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="165" y="102" text-anchor="middle" font-size="10.5" fill="#333">i</text>
  <rect x="210" y="86" width="210" height="24" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="315" y="102" text-anchor="middle" font-size="10.5" fill="#b85450">i ≠ b（首字符即不同）</text>
  <rect x="422" y="86" width="110" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="477" y="102" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">✗</text>

  <!-- Row 2: love -->
  <rect x="70" y="110" width="50" height="24" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="95" y="126" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <rect x="122" y="110" width="86" height="24" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="165" y="126" text-anchor="middle" font-size="10.5" fill="#333">love</text>
  <rect x="210" y="110" width="210" height="24" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="315" y="126" text-anchor="middle" font-size="10.5" fill="#b85450">l ≠ b</text>
  <rect x="422" y="110" width="110" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="477" y="126" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">✗</text>

  <!-- Row 3: eating -->
  <rect x="70" y="134" width="50" height="24" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="95" y="150" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <rect x="122" y="134" width="86" height="24" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="165" y="150" text-anchor="middle" font-size="10.5" fill="#333">eating</text>
  <rect x="210" y="134" width="210" height="24" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="315" y="150" text-anchor="middle" font-size="10.5" fill="#b85450">e ≠ b</text>
  <rect x="422" y="134" width="110" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="477" y="150" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">✗</text>

  <!-- Row 4: burger (match, green) -->
  <rect x="70" y="158" width="50" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="95" y="174" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">4</text>
  <rect x="122" y="158" width="86" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="165" y="174" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">burger</text>
  <rect x="210" y="158" width="210" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="315" y="174" text-anchor="middle" font-size="10.5" fill="#4a7a3a">b=u, u=u, r=r, g=g 全匹配</text>
  <rect x="422" y="158" width="110" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="477" y="174" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">✓ → 返回 4</text>

  <!-- Ex1 result -->
  <text x="300" y="200" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">第 4 个单词 "burger" 以 "burg" 开头 ⟹ 返回 4</text>

  <!-- separator -->
  <path d="M 60 212 L 560 212" stroke="#e0e0e0" stroke-width="1.2" stroke-dasharray="5,5" fill="none" filter="url(#rough2)"/>

  <!-- ============ Example 2 ============ -->
  <text x="40" y="232" font-size="12.5" fill="#333" font-weight="bold">示例 2：sentence = "this problem is an easy problem"，searchWord = "pro" → <tspan fill="#4a7a3a">2</tspan></text>

  <!-- header -->
  <rect x="70" y="244" width="50" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="95" y="260" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">下标</text>
  <rect x="122" y="244" width="86" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="165" y="260" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">单词</text>
  <rect x="210" y="244" width="210" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="315" y="260" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">与检索词 "pro" 比对</text>
  <rect x="422" y="244" width="110" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="477" y="260" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">命中?</text>

  <!-- Row 1: this -->
  <rect x="70" y="268" width="50" height="24" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="95" y="284" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <rect x="122" y="268" width="86" height="24" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="165" y="284" text-anchor="middle" font-size="10.5" fill="#333">this</text>
  <rect x="210" y="268" width="210" height="24" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="315" y="284" text-anchor="middle" font-size="10.5" fill="#b85450">t ≠ p</text>
  <rect x="422" y="268" width="110" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="477" y="284" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">✗</text>

  <!-- Row 2: problem (match) -->
  <rect x="70" y="292" width="50" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="95" y="308" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">2</text>
  <rect x="122" y="292" width="86" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="165" y="308" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">problem</text>
  <rect x="210" y="292" width="210" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="315" y="308" text-anchor="middle" font-size="10.5" fill="#4a7a3a">p,r,o 全匹配</text>
  <rect x="422" y="292" width="110" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="477" y="308" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">✓ → 返回 2</text>

  <!-- Row skip -->
  <rect x="70" y="316" width="50" height="24" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="95" y="332" text-anchor="middle" font-size="10.5" fill="#aaa">3-5</text>
  <rect x="122" y="316" width="86" height="24" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="165" y="332" text-anchor="middle" font-size="10.5" fill="#aaa">is/an/easy</text>
  <rect x="210" y="316" width="210" height="24" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="315" y="332" text-anchor="middle" font-size="10.5" fill="#aaa">首字符均 ≠ p（跳过）</text>
  <rect x="422" y="316" width="110" height="24" rx="3" fill="#fafafa" stroke="#b0b0b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="477" y="332" text-anchor="middle" font-size="10.5" fill="#aaa">—</text>

  <!-- Row 6: problem (also match but already returned) -->
  <rect x="70" y="340" width="50" height="24" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="95" y="356" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">6</text>
  <rect x="122" y="340" width="86" height="24" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="165" y="356" text-anchor="middle" font-size="10.5" fill="#d6a040">problem</text>
  <rect x="210" y="340" width="210" height="24" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="315" y="356" text-anchor="middle" font-size="10.5" fill="#d6a040">同样匹配，但 2 &lt; 6</text>
  <rect x="422" y="340" width="110" height="24" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="477" y="356" text-anchor="middle" font-size="10.5" fill="#d6a040">不再考虑</text>

  <!-- Ex2 result -->
  <text x="300" y="382" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">多个单词匹配时返回最小下标 ⟹ 第 2 个单词即返回 2</text>

  <!-- bottom note -->
  <rect x="60" y="396" width="500" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="417" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">从左到右扫描，首个前缀命中即返回 —— 保证最小下标</text>
</svg>
