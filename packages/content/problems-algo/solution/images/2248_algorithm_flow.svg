<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：计数统计 → 遍历值域筛交集</text>

  <!-- ===== Step 1: Initialize ===== -->
  <rect x="130" y="40" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="61" text-anchor="middle" font-size="11.5" fill="#333">① 初始化 count[1001]={0}，n = len(nums)</text>

  <path d="M 260 76 L 260 92" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: Loop over sub-arrays ===== -->
  <polygon points="260,94 380,132 260,170 140,132" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="128" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">② 遍历每个子数组 arr?</text>
  <text x="260" y="144" text-anchor="middle" font-size="10.5" fill="#555">还有未处理的数组?</text>

  <!-- No branch: go down to step 3 -->
  <path d="M 260 170 L 260 190" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="184" font-size="10" fill="#888">否</text>

  <!-- Yes branch right: increment count -->
  <path d="M 380 132 L 420 132" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="126" text-anchor="middle" font-size="10" fill="#888">是</text>
  <rect x="420" y="116" width="96" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="468" y="133" text-anchor="middle" font-size="10.5" fill="#333">对每个 v ∈ arr</text>
  <text x="468" y="146" text-anchor="middle" font-size="10.5" fill="#333">count[v] += 1</text>

  <!-- loop back to step 2 -->
  <path d="M 468 116 L 468 100 L 260 100 L 260 94" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="364" y="96" text-anchor="middle" font-size="9.5" fill="#888">下一数组</text>

  <!-- ===== Step 3: Loop over value range ===== -->
  <polygon points="260,192 380,228 260,264 140,228" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="224" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">③ 遍历 v = 1..1000?</text>
  <text x="260" y="240" text-anchor="middle" font-size="10.5" fill="#555">还有未检查的值?</text>

  <!-- No branch: return result -->
  <path d="M 380 228 L 420 228" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="400" y="222" text-anchor="middle" font-size="10" fill="#4a7a3a">否</text>
  <rect x="420" y="212" width="96" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="468" y="234" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">return result</text>

  <!-- Yes branch down -->
  <path d="M 260 264 L 260 284" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="278" font-size="10" fill="#888">是</text>

  <!-- ===== Step 4: Check count == n ===== -->
  <polygon points="260,286 380,322 260,358 140,322" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">④ count[v] == n ?</text>
  <text x="260" y="334" text-anchor="middle" font-size="10" fill="#555">出现在所有数组?</text>

  <!-- Yes: append to result, loop back to step 3 -->
  <path d="M 380 322 L 410 322 L 410 228 L 380 228" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="396" y="278" font-size="9.5" fill="#4a7a3a">是 → 加入</text>

  <!-- No: skip, loop back to step 3 -->
  <path d="M 140 322 L 70 322 L 70 228 L 140 228" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="64" y="278" font-size="9.5" fill="#888">否 → 跳过</text>

  <!-- ===== Bottom note ===== -->
  <rect x="40" y="370" width="440" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="260" y="385" text-anchor="middle" font-size="10" fill="#555">值域 1..1000 升序遍历 → result 天然升序，无需额外排序</text>
</svg>
