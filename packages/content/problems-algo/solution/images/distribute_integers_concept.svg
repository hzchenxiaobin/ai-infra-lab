<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：频次值 → 顾客子集分配</text>

  <!-- nums row -->
  <text x="36" y="72" font-size="13" fill="#446688" filter="url(#rough2)">nums</text>
  <rect x="86" y="56" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="107" y="76" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="130" y="56" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="151" y="76" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="174" y="56" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="195" y="76" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="218" y="56" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="239" y="76" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>

  <!-- arrow down -->
  <path d="M167,92 L167,118" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="178" y="110" font-size="11" fill="#888" filter="url(#rough2)">统计频次</text>

  <!-- freq row (left) -->
  <text x="36" y="150" font-size="13" fill="#4a7a3a" filter="url(#rough2)">freq</text>
  <rect x="86" y="134" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="114" y="155" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="148" y="134" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="176" y="155" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="216" y="155" font-size="11" fill="#888" filter="url(#rough2)">≤50 个不同值</text>

  <!-- customers (right) -->
  <text x="372" y="100" font-size="13" fill="#b85450" filter="url(#rough2)">顾客 quantity</text>
  <rect x="372" y="110" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="412" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">顾客0 需2</text>
  <rect x="460" y="110" width="80" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="500" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">顾客1 需2</text>
  <text x="400" y="158" font-size="11" fill="#888" filter="url(#rough2)">mask 第 0 位</text>
  <text x="488" y="158" font-size="11" fill="#888" filter="url(#rough2)">mask 第 1 位</text>

  <!-- assignment arrows -->
  <path d="M114,168 C160,210 300,210 392,144" stroke="#d6a040" stroke-width="1.8" fill="none" stroke-dasharray="6,3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="210" y="206" font-size="12" fill="#d6a040" filter="url(#rough2)">freq[0]=2 → 子集{0}</text>

  <path d="M176,168 C250,255 380,255 480,144" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="6,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="290" y="266" font-size="12" fill="#4a7a3a" filter="url(#rough2)">freq[1]=2 → 子集{1}</text>

  <!-- key insight box -->
  <rect x="50" y="296" width="480" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="70" y="318" font-size="12" fill="#333" filter="url(#rough2)">m ≤ 10 → 用 bitmask（2^m ≤ 1024 个子集）表示「已满足的顾客集合」</text>
  <text x="70" y="338" font-size="12" fill="#333" filter="url(#rough2)">每个 freq 值分配给「未满足顾客」的某个子集 sub，要求</text>
  <text x="70" y="356" font-size="12" fill="#333" filter="url(#rough2)">sub_sum[sub] ≤ freq[idx]；状态 (idx, mask) 记忆化搜索。</text>
</svg>
