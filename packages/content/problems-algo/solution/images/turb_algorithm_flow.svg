<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">滑动窗口算法流程：维护比较符号交替的窗口 [left, right]</text>

  <!-- Start node -->
  <ellipse cx="270" cy="56" rx="80" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="60" text-anchor="middle" font-size="12" fill="#333">开始: left=0, max=1</text>

  <!-- arrow down -->
  <path d="M 270 76 L 270 94" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 1: right < n? -->
  <polygon points="270,98 360,138 270,178 180,138" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="134" text-anchor="middle" font-size="12" fill="#333">right &lt; n ?</text>
  <text x="270" y="150" text-anchor="middle" font-size="10" fill="#888">(遍历每个元素)</text>

  <!-- No branch -> end -->
  <path d="M 360 138 L 450 138" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="395" y="130" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="480" cy="138" rx="44" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="480" y="142" text-anchor="middle" font-size="12" fill="#333">返回 max</text>

  <!-- Yes branch down -->
  <path d="M 270 178 L 270 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="192" font-size="11" fill="#82b366">是</text>

  <!-- Decision 2: arr[right-1] == arr[right]? -->
  <polygon points="270,200 390,240 270,280 150,240" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="236" text-anchor="middle" font-size="12" fill="#333">arr[right−1] == arr[right]?</text>

  <!-- Yes (equal) -> left = right -->
  <path d="M 150 240 L 110 240" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="130" y="232" text-anchor="middle" font-size="11" fill="#b85450">是</text>
  <rect x="14" y="220" width="92" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="238" text-anchor="middle" font-size="11" fill="#333">相等 → 中断</text>
  <text x="60" y="254" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">left = right</text>

  <!-- No branch down -->
  <path d="M 270 280 L 270 298" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="294" font-size="11" fill="#82b366">否</text>

  <!-- Decision 3: right >= left+2 && sign not flipped? -->
  <polygon points="270,302 400,342 270,382 140,342" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="336" text-anchor="middle" font-size="11" fill="#333">right ≥ left+2</text>
  <text x="270" y="352" text-anchor="middle" font-size="11" fill="#333">且符号未翻转?</text>

  <!-- Yes (same sign) -> left = right-1 -->
  <path d="M 140 342 L 110 342" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="125" y="334" text-anchor="middle" font-size="11" fill="#d6a040">是</text>
  <rect x="14" y="322" width="92" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="340" text-anchor="middle" font-size="11" fill="#333">同号 → 重启</text>
  <text x="60" y="356" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">left = right−1</text>

  <!-- No branch -> extend (no action) -->
  <path d="M 270 382 L 270 400" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="396" font-size="10" fill="#82b366">否(翻转/首对)</text>

  <!-- Update box -->
  <rect x="150" y="404" width="240" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="428" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">max = max(max, right − left + 1)</text>

  <!-- merge arrows from left boxes to update box -->
  <path d="M 60 262 L 60 404 L 150 404" stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 60 364 L 60 404" stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- loop back arrow -->
  <path d="M 390 423 L 510 423 L 510 138 L 414 138" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="520" y="280" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 520 280)">right++ 继续循环</text>

  <!-- summary note -->
  <text x="270" y="460" text-anchor="middle" font-size="11" fill="#888">left 只增不减 → O(n)；三种情况：相等中断 / 同号重启 / 翻转扩展</text>
</svg>
