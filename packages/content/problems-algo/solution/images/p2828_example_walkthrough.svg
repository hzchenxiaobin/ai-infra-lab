<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 396" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="396" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：示例 3 逐位比对 + 示例 2 长度短路</text>

  <!-- 表头 -->
  <rect x="30" y="44" width="50" height="28" fill="#446688" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="55" y="62" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold" filter="url(#rough2)">i</text>

  <rect x="80" y="44" width="140" height="28" fill="#446688" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="150" y="62" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold" filter="url(#rough2)">words[i]</text>

  <rect x="220" y="44" width="80" height="28" fill="#446688" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold" filter="url(#rough2)">首字符</text>

  <rect x="300" y="44" width="80" height="28" fill="#446688" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="340" y="62" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold" filter="url(#rough2)">s[i]</text>

  <rect x="380" y="44" width="120" height="28" fill="#446688" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="440" y="62" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold" filter="url(#rough2)">匹配？</text>

  <!-- 行 0: never -->
  <rect x="30" y="74" width="50" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="55" y="92" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="80" y="74" width="140" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="150" y="92" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">"never"</text>
  <rect x="220" y="74" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="260" y="92" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">n</text>
  <rect x="300" y="74" width="80" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="340" y="92" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">n</text>
  <rect x="380" y="74" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="440" y="92" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <!-- 行 1: gonna -->
  <rect x="30" y="102" width="50" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="55" y="120" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="80" y="102" width="140" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="150" y="120" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">"gonna"</text>
  <rect x="220" y="102" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="260" y="120" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">g</text>
  <rect x="300" y="102" width="80" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="340" y="120" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">g</text>
  <rect x="380" y="102" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="440" y="120" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <!-- 行 2: give -->
  <rect x="30" y="130" width="50" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="55" y="148" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="80" y="130" width="140" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="150" y="148" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">"give"</text>
  <rect x="220" y="130" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="260" y="148" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">g</text>
  <rect x="300" y="130" width="80" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="340" y="148" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">g</text>
  <rect x="380" y="130" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="440" y="148" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <!-- 行 3: up -->
  <rect x="30" y="158" width="50" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="55" y="176" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="80" y="158" width="140" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="150" y="176" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">"up"</text>
  <rect x="220" y="158" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="260" y="176" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">u</text>
  <rect x="300" y="158" width="80" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="340" y="176" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">u</text>
  <rect x="380" y="158" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="440" y="176" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <!-- 行 4: on -->
  <rect x="30" y="186" width="50" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="55" y="204" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="80" y="186" width="140" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="150" y="204" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">"on"</text>
  <rect x="220" y="186" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="260" y="204" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">o</text>
  <rect x="300" y="186" width="80" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="340" y="204" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">o</text>
  <rect x="380" y="186" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="440" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <!-- 行 5: you -->
  <rect x="30" y="214" width="50" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="55" y="232" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <rect x="80" y="214" width="140" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="150" y="232" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">"you"</text>
  <rect x="220" y="214" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="260" y="232" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">y</text>
  <rect x="300" y="214" width="80" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="340" y="232" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">y</text>
  <rect x="380" y="214" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="440" y="232" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <!-- 示例 2 短路说明 -->
  <rect x="40" y="260" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="282" text-anchor="middle" font-size="11.5" fill="#8a6d1a" filter="url(#rough2)">示例 2 短路：words = ["an", "apple"]（n = 2），s = "a"（m = 1）</text>
  <text x="280" y="302" text-anchor="middle" font-size="11.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">n ≠ m → 长度不等，直接返回 false，一位都不用比</text>

  <text x="280" y="348" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">示例 3：六位全部 ✓ → 返回 true</text>
  <text x="280" y="372" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">示例 2：长度短路 → 返回 false</text>
</svg>
