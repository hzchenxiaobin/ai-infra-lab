<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：两条祖先链 = 两个相交单链表</text>

  <!-- ===== Shared tail (right): null <- root <- LCA, arrows point parent dir ===== -->
  <rect x="500" y="178" width="48" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="524" y="196" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">null</text>

  <rect x="392" y="176" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="418" y="196" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">root</text>

  <rect x="294" y="170" width="60" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="324" y="194" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">LCA</text>

  <path d="M 354 189 L 388 189" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 446 190 L 498 190" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="418" y="158" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">公共后缀：LCA → root → null</text>

  <!-- ===== Top chain (p, shorter) ===== -->
  <rect x="118" y="76" width="48" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="142" y="96" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">p</text>
  <rect x="208" y="76" width="48" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="232" y="96" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">·</text>
  <path d="M 166 91 L 206 91" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 256 102 Q 278 132 298 172" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="64" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">p 的祖先链（较短）</text>

  <!-- ===== Bottom chain (q, longer) ===== -->
  <rect x="74" y="276" width="48" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="98" y="296" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">q</text>
  <rect x="160" y="276" width="48" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="184" y="296" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">·</text>
  <rect x="246" y="276" width="48" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="270" y="296" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">·</text>
  <path d="M 122 291 L 158 291" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 208 291 L 244 291" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 296 284 Q 312 252 322 212" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="328" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">q 的祖先链（较长）</text>

  <!-- equivalence note -->
  <rect x="130" y="338" width="360" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="310" y="360" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">等价于 LeetCode 160 相交链表：两条链表共享公共后缀，求交点</text>
</svg>
