<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：初始化 → 无限循环「yield 产出 + 滚动前进」</text>

  <!-- Step 1: init -->
  <rect x="210" y="50" width="180" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① 初始化</text>
  <text x="300" y="92" text-anchor="middle" font-size="12" fill="#333">prev = 0,  curr = 1</text>

  <!-- arrow down -->
  <path d="M 300 106 L 300 134" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: yield -->
  <rect x="190" y="136" width="220" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="160" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">② yield prev</text>
  <text x="300" y="180" text-anchor="middle" font-size="11" fill="#333">产出当前值，暂停</text>
  <text x="300" y="194" text-anchor="middle" font-size="10" fill="#888">控制权交还给调用方，等下次 next()</text>

  <!-- output to side -->
  <path d="M 410 168 L 470 168" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <rect x="470" y="148" width="110" height="42" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="525" y="166" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">→ 产出值</text>
  <text x="525" y="182" text-anchor="middle" font-size="10" fill="#888">0, 1, 1, 2, 3 …</text>

  <!-- arrow down -->
  <path d="M 300 200 L 300 228" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: roll -->
  <rect x="150" y="230" width="300" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="254" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">③ 滚动前进</text>
  <text x="300" y="274" text-anchor="middle" font-size="11" fill="#333">[prev, curr] = [curr, prev + curr]</text>
  <text x="300" y="288" text-anchor="middle" font-size="10" fill="#888">旧 curr → 新 prev，和 → 新 curr</text>

  <!-- loop back arrow -->
  <path d="M 300 294 Q 300 340 480 340 Q 560 340 560 168 Q 560 110 412 110" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="6,4" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <rect x="430" y="326" width="120" height="30" fill="#fff" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="490" y="346" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">while(true)</text>

  <!-- note -->
  <rect x="60" y="360" width="480" height="44" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough)"/>
  <text x="300" y="380" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">没有终止条件——调用方决定何时停</text>
  <text x="300" y="396" text-anchor="middle" font-size="11" fill="#888">每次 next() 只做一次 yield + 一次滚动，共 O(1)</text>
</svg>
