<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arL" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="900" height="340" fill="#fafafa"/>

  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">Unix 管道：每个工具只做一件事，管道串起数据流</text>
  <path d="M 280 44 Q 450 52 620 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- input cue -->
  <text x="50" y="92" font-size="12" fill="#888">输入 words.txt</text>

  <!-- 五个阶段盒子 -->
  <!-- ① 拆词 -->
  <g filter="url(#sk)">
    <rect x="50" y="108" width="130" height="66" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="115" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">① 拆词</text>
  <text x="115" y="152" text-anchor="middle" font-size="11" fill="#446688">awk / tr / grep</text>
  <text x="115" y="166" text-anchor="middle" font-size="10" fill="#888">一行一词</text>

  <!-- ② 排序 -->
  <g filter="url(#sk)">
    <rect x="225" y="108" width="130" height="66" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="290" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">② 排序</text>
  <text x="290" y="152" text-anchor="middle" font-size="11" fill="#446688">sort</text>
  <text x="290" y="166" text-anchor="middle" font-size="10" fill="#888">相同词相邻</text>

  <!-- ③ 计数 -->
  <g filter="url(#sk)">
    <rect x="400" y="108" width="130" height="66" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="465" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">③ 去重计数</text>
  <text x="465" y="152" text-anchor="middle" font-size="11" fill="#4a7a3a">uniq -c</text>
  <text x="465" y="166" text-anchor="middle" font-size="10" fill="#888">count word</text>

  <!-- ④ 按频排序 -->
  <g filter="url(#sk)">
    <rect x="575" y="108" width="130" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="640" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415">④ 按频排序</text>
  <text x="640" y="152" text-anchor="middle" font-size="11" fill="#d6a040">sort -nr -k1</text>
  <text x="640" y="166" text-anchor="middle" font-size="10" fill="#888">频次降序</text>

  <!-- ⑤ 格式化 -->
  <g filter="url(#sk)">
    <rect x="750" y="108" width="130" height="66" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="815" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6e9e">⑤ 格式化</text>
  <text x="815" y="152" text-anchor="middle" font-size="11" fill="#446688">awk 列交换</text>
  <text x="815" y="166" text-anchor="middle" font-size="10" fill="#888">word count</text>

  <!-- 箭头 + 管道符 -->
  <path d="M 180 141 L 221 141" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>
  <text x="200" y="133" text-anchor="middle" font-size="14" font-weight="bold" fill="#999">|</text>
  <path d="M 355 141 L 396 141" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>
  <text x="375" y="133" text-anchor="middle" font-size="14" font-weight="bold" fill="#999">|</text>
  <path d="M 530 141 L 571 141" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>
  <text x="550" y="133" text-anchor="middle" font-size="14" font-weight="bold" fill="#999">|</text>
  <path d="M 705 141 L 746 141" stroke="#3a3a3a" stroke-width="1.8" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>
  <text x="725" y="133" text-anchor="middle" font-size="14" font-weight="bold" fill="#999">|</text>

  <!-- 数据预览面板 -->
  <!-- 预览 1 -->
  <g filter="url(#sk)">
    <rect x="55" y="200" width="120" height="108" rx="6" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="4 3"/>
  </g>
  <text x="115" y="220" text-anchor="middle" font-size="10" fill="#2b6e9e">the</text>
  <text x="115" y="236" text-anchor="middle" font-size="10" fill="#2b6e9e">day</text>
  <text x="115" y="252" text-anchor="middle" font-size="10" fill="#2b6e9e">is</text>
  <text x="115" y="268" text-anchor="middle" font-size="10" fill="#2b6e9e">sunny</text>
  <text x="115" y="284" text-anchor="middle" font-size="10" fill="#2b6e9e">the ...</text>
  <text x="115" y="300" text-anchor="middle" font-size="9" fill="#aaa">每行一词</text>

  <!-- 预览 2 -->
  <g filter="url(#sk)">
    <rect x="230" y="200" width="120" height="108" rx="6" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="4 3"/>
  </g>
  <text x="290" y="220" text-anchor="middle" font-size="10" fill="#2b6e9e">day</text>
  <text x="290" y="236" text-anchor="middle" font-size="10" fill="#2b6e9e">is</text>
  <text x="290" y="252" text-anchor="middle" font-size="10" fill="#2b6e9e">is</text>
  <text x="290" y="268" text-anchor="middle" font-size="10" fill="#2b6e9e">is</text>
  <text x="290" y="284" text-anchor="middle" font-size="10" fill="#2b6e9e">sunny ...</text>
  <text x="290" y="300" text-anchor="middle" font-size="9" fill="#aaa">同类相邻</text>

  <!-- 预览 3 -->
  <g filter="url(#sk)">
    <rect x="405" y="200" width="120" height="108" rx="6" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="4 3"/>
  </g>
  <text x="465" y="220" text-anchor="middle" font-size="10" fill="#2e6e2e">1 day</text>
  <text x="465" y="236" text-anchor="middle" font-size="10" fill="#2e6e2e">3 is</text>
  <text x="465" y="252" text-anchor="middle" font-size="10" fill="#2e6e2e">2 sunny</text>
  <text x="465" y="268" text-anchor="middle" font-size="10" fill="#2e6e2e">4 the</text>
  <text x="465" y="300" text-anchor="middle" font-size="9" fill="#aaa">频次前置</text>

  <!-- 预览 4 -->
  <g filter="url(#sk)">
    <rect x="580" y="200" width="120" height="108" rx="6" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="4 3"/>
  </g>
  <text x="640" y="220" text-anchor="middle" font-size="10" fill="#7a5415">4 the</text>
  <text x="640" y="236" text-anchor="middle" font-size="10" fill="#7a5415">3 is</text>
  <text x="640" y="252" text-anchor="middle" font-size="10" fill="#7a5415">2 sunny</text>
  <text x="640" y="268" text-anchor="middle" font-size="10" fill="#7a5415">1 day</text>
  <text x="640" y="300" text-anchor="middle" font-size="9" fill="#aaa">按频降序</text>

  <!-- 预览 5（输出） -->
  <g filter="url(#sk)">
    <rect x="755" y="200" width="120" height="108" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="815" y="220" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e6e2e">the 4</text>
  <text x="815" y="236" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e6e2e">is 3</text>
  <text x="815" y="252" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e6e2e">sunny 2</text>
  <text x="815" y="268" text-anchor="middle" font-size="10" font-weight="bold" fill="#2e6e2e">day 1</text>
  <text x="815" y="300" text-anchor="middle" font-size="9" fill="#2e6e2e">✓ 最终输出</text>

  <!-- 输入/输出标注 -->
  <path d="M 50 100 Q 40 104 50 108" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>
  <text x="880" y="92" font-size="12" fill="#888" text-anchor="end">输出</text>
</svg>
