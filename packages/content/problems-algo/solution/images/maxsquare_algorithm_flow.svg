<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="470" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">最大正方形 算法流程</text>

  <!-- Start pill -->
  <rect x="200" y="36" width="180" height="40" rx="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="61" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">开始：逐格遍历 (i,j)</text>
  <path d="M 290 76 L 290 106" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond 1 -->
  <polygon points="290,106 390,140 290,174 190,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="138" text-anchor="middle" font-size="12" fill="#333">matrix[i][j]</text>
  <text x="290" y="154" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">== '0' ?</text>
  <!-- Yes (left) to R0 -->
  <path d="M 190 140 L 120 140" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="155" y="132" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <!-- No (down) to Diamond2 -->
  <path d="M 290 174 L 290 206" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="304" y="192" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- R0: dp = 0 -->
  <rect x="40" y="120" width="80" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="80" y="145" text-anchor="middle" font-size="12" fill="#333">dp = 0</text>

  <!-- Diamond 2 -->
  <polygon points="290,206 390,240 290,274 190,240" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="238" text-anchor="middle" font-size="12" fill="#333">i == 0 或</text>
  <text x="290" y="254" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">j == 0 ?</text>
  <!-- Yes (right) to R1 -->
  <path d="M 390 240 L 460 240" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="425" y="232" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <!-- No (down) to Rmin -->
  <path d="M 290 274 L 290 300" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="304" y="290" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- R1: dp = 1 -->
  <rect x="460" y="220" width="100" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="510" y="245" text-anchor="middle" font-size="12" fill="#333">dp = 1</text>

  <!-- Rmin -->
  <rect x="170" y="300" width="240" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="327" text-anchor="middle" font-size="12" fill="#333">dp = min(上, 左, 左上) + 1</text>

  <!-- merge arrows: R0 -> merge, R1 -> merge, Rmin -> merge -->
  <path d="M 80 160 L 80 372 L 168 372" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 510 260 L 510 372 L 412 372" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 290 344 L 290 360" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Merge box -->
  <rect x="160" y="360" width="260" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="387" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">maxSide = max(maxSide, dp)</text>

  <!-- dashed loop-back to next cell -->
  <path d="M 160 382 L 24 382 L 24 56 L 198 56" stroke="#888" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="40" y="220" font-size="10.5" fill="#888" transform="rotate(-90 40 220)">下一格 (i,j)</text>

  <!-- End box (right) -->
  <rect x="440" y="360" width="130" height="44" rx="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="505" y="380" text-anchor="middle" font-size="11" fill="#333">遍历结束</text>
  <text x="505" y="396" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">返回 maxSide²</text>
  <path d="M 420 382 L 438 382" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
