<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "3+2*2"，求值结果 = 7</text>

  <!-- table header -->
  <text x="30" y="56" font-size="12" fill="#444" font-weight="bold">步骤</text>
  <text x="92" y="56" font-size="12" fill="#444" font-weight="bold">字符 c</text>
  <text x="172" y="56" font-size="12" fill="#444" font-weight="bold">num</text>
  <text x="244" y="56" font-size="12" fill="#444" font-weight="bold">preOp</text>
  <text x="332" y="56" font-size="12" fill="#444" font-weight="bold">动作（按 preOp 处理 num）</text>
  <text x="572" y="56" font-size="12" fill="#444" font-weight="bold">栈状态</text>

  <line x1="20" y1="62" x2="624" y2="62" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1 -->
  <text x="30" y="84" font-size="11" fill="#333">1</text>
  <text x="92" y="84" font-size="11" fill="#333" font-weight="bold">'3'</text>
  <text x="172" y="84" font-size="11" fill="#333">0→3</text>
  <text x="244" y="84" font-size="11" fill="#888">+</text>
  <text x="332" y="84" font-size="11" fill="#888">数字，累加 num</text>
  <text x="572" y="84" font-size="11" fill="#888">[ ]</text>

  <!-- Row 2 -->
  <text x="30" y="108" font-size="11" fill="#333">2</text>
  <text x="92" y="108" font-size="11" fill="#d6a040" font-weight="bold">'+'</text>
  <text x="172" y="108" font-size="11" fill="#333">3</text>
  <text x="244" y="108" font-size="11" fill="#333">+</text>
  <text x="332" y="108" font-size="11" fill="#4a7a3a">push 3 → preOp='+', num=0</text>
  <text x="572" y="108" font-size="11" fill="#333" font-weight="bold">[3]</text>

  <!-- Row 3 -->
  <text x="30" y="132" font-size="11" fill="#333">3</text>
  <text x="92" y="132" font-size="11" fill="#333" font-weight="bold">'2'</text>
  <text x="172" y="132" font-size="11" fill="#333">0→2</text>
  <text x="244" y="132" font-size="11" fill="#888">+</text>
  <text x="332" y="132" font-size="11" fill="#888">数字，累加 num</text>
  <text x="572" y="132" font-size="11" fill="#333">[3]</text>

  <!-- Row 4 -->
  <text x="30" y="156" font-size="11" fill="#333">4</text>
  <text x="92" y="156" font-size="11" fill="#b85450" font-weight="bold">'*'</text>
  <text x="172" y="156" font-size="11" fill="#333">2</text>
  <text x="244" y="156" font-size="11" fill="#333">+</text>
  <text x="332" y="156" font-size="11" fill="#4a7a3a">push 2 → preOp='*', num=0</text>
  <text x="572" y="156" font-size="11" fill="#333" font-weight="bold">[3, 2]</text>

  <!-- Row 5 -->
  <text x="30" y="180" font-size="11" fill="#333">5</text>
  <text x="92" y="180" font-size="11" fill="#333" font-weight="bold">'2'</text>
  <text x="172" y="180" font-size="11" fill="#333">0→2</text>
  <text x="244" y="180" font-size="11" fill="#888">*</text>
  <text x="332" y="180" font-size="11" fill="#888">数字，累加 num</text>
  <text x="572" y="180" font-size="11" fill="#333">[3, 2]</text>

  <!-- Row 6: end -->
  <text x="30" y="204" font-size="11" fill="#333">6</text>
  <text x="92" y="204" font-size="11" fill="#888" font-weight="bold">结束</text>
  <text x="172" y="204" font-size="11" fill="#333">2</text>
  <text x="244" y="204" font-size="11" fill="#b85450" font-weight="bold">*</text>
  <text x="332" y="204" font-size="11" fill="#b85450" font-weight="bold">pop 2，push 2×2=4</text>
  <text x="572" y="204" font-size="11" fill="#b85450" font-weight="bold">[3, 4]</text>

  <line x1="20" y1="214" x2="624" y2="214" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- result box -->
  <rect x="60" y="228" width="520" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="320" y="248" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">最后求和：3 + 4 = 7 ⭐</text>
  <text x="320" y="266" text-anchor="middle" font-size="11" fill="#888">乘法在读取到下一个运算符时才「落地」，天然保证了 × 优先于 +</text>

  <!-- division note -->
  <rect x="60" y="286" width="520" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="320" y="307" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">除法截断注意：s = " 3+5 / 2 "</text>
  <text x="320" y="325" text-anchor="middle" font-size="11" fill="#666">读到 '/' 时 push 5；结束时 preOp='/'，pop 5 push 5÷2 = 2（向 0 截断）</text>
  <text x="320" y="340" text-anchor="middle" font-size="11" fill="#666">栈 = [3, 2]，求和 = 3 + 2 = 5（÷ 截断发生在落地那一刻）</text>
</svg>
