<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 240"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="240" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：arr=[−2,−1,0,1,2]，fn = n =&gt; n+1</text>

  <!-- header row -->
  <rect x="20" y="38" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="43" y="57" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i</text>
  <rect x="66" y="38" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="101" y="57" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">arr[i]</text>
  <rect x="136" y="38" width="110" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="191" y="57" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">fn(arr[i], i)</text>
  <rect x="246" y="38" width="110" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="301" y="57" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">真值?</text>
  <rect x="356" y="38" width="84" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="398" y="57" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">动作</text>
  <rect x="440" y="38" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="500" y="57" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">res</text>

  <!-- row 0: i=0, arr=-2, fn=-1, truthy, 保留, [-2] -->
  <rect x="20" y="70" width="46" height="28" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="43" y="89" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="66" y="70" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="101" y="89" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">−2</text>
  <rect x="136" y="70" width="110" height="28" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="191" y="89" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">−1</text>
  <rect x="246" y="70" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="301" y="89" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">真值（非零）</text>
  <rect x="356" y="70" width="84" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="398" y="89" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">保留</text>
  <rect x="440" y="70" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="500" y="89" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[−2]</text>

  <!-- row 1: i=1, arr=-1, fn=0, FALSY, 丢弃, [-2]  (highlight) -->
  <rect x="20" y="102" width="46" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="43" y="121" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="66" y="102" width="70" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="101" y="121" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">−1</text>
  <rect x="136" y="102" width="110" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="191" y="121" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="246" y="102" width="110" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="301" y="121" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">假值（零）</text>
  <rect x="356" y="102" width="84" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="398" y="121" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">丢弃</text>
  <rect x="440" y="102" width="120" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="500" y="121" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[−2]</text>

  <!-- row 2: i=2, arr=0, fn=1, truthy, 保留, [-2,0] -->
  <rect x="20" y="134" width="46" height="28" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="43" y="153" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="66" y="134" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="101" y="153" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="136" y="134" width="110" height="28" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="191" y="153" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="246" y="134" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="301" y="153" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">真值</text>
  <rect x="356" y="134" width="84" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="398" y="153" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">保留</text>
  <rect x="440" y="134" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="500" y="153" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[−2, 0]</text>

  <!-- row 3: i=3, arr=1, fn=2, truthy, 保留, [-2,0,1] -->
  <rect x="20" y="166" width="46" height="28" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="43" y="185" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="66" y="166" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="101" y="185" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="136" y="166" width="110" height="28" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="191" y="185" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="246" y="166" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="301" y="185" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">真值</text>
  <rect x="356" y="166" width="84" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="398" y="185" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">保留</text>
  <rect x="440" y="166" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="500" y="185" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[−2, 0, 1]</text>

  <!-- row 4: i=4, arr=2, fn=3, truthy, 保留, [-2,0,1,2] -->
  <rect x="20" y="198" width="46" height="28" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="43" y="217" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="66" y="198" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="101" y="217" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="136" y="198" width="110" height="28" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="191" y="217" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="246" y="198" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="301" y="217" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">真值</text>
  <rect x="356" y="198" width="84" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="398" y="217" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">保留</text>
  <rect x="440" y="198" width="120" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="500" y="217" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[−2,0,1,2]</text>
</svg>
