<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 280" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="280" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 2 逐步演算</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="20" y="40" width="540" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="45" y="61" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">步骤</text>
    <text x="145" y="61" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">操作</text>
    <text x="390" y="61" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">结果</text>
    <path d="M 70 40 L 70 72" stroke="#446688" stroke-width="1" fill="none"/>
    <path d="M 220 40 L 220 72" stroke="#446688" stroke-width="1" fill="none"/>
  </g>

  <!-- 行 1 -->
  <g filter="url(#rough2)">
    <rect x="20" y="72" width="540" height="36" fill="#ffffff" stroke="#446688" stroke-width="1"/>
    <text x="45" y="95" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="145" y="95" text-anchor="middle" font-size="12" fill="#333">按空格切分</text>
    <text x="232" y="95" font-size="11" fill="#446688">["Keep","calm","and","code","on"]</text>
  </g>

  <!-- 行 2 -->
  <g filter="url(#rough2)">
    <rect x="20" y="108" width="540" height="36" fill="#ffffff" stroke="#446688" stroke-width="1"/>
    <text x="45" y="131" text-anchor="middle" font-size="12" fill="#333">2</text>
    <text x="145" y="131" text-anchor="middle" font-size="12" fill="#333">整体转小写</text>
    <text x="232" y="131" font-size="11" fill="#446688">["keep","calm","and","code","on"]</text>
  </g>

  <!-- 行 3 高亮 -->
  <g filter="url(#rough2)">
    <rect x="20" y="144" width="540" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="45" y="167" text-anchor="middle" font-size="12" fill="#333">3</text>
    <text x="145" y="167" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">稳定排序</text>
    <text x="232" y="167" font-size="11" fill="#b85450" font-weight="bold">["on","and","keep","calm","code"]</text>
  </g>

  <!-- 行 4 -->
  <g filter="url(#rough2)">
    <rect x="20" y="180" width="540" height="36" fill="#ffffff" stroke="#446688" stroke-width="1"/>
    <text x="45" y="203" text-anchor="middle" font-size="12" fill="#333">4</text>
    <text x="145" y="203" text-anchor="middle" font-size="12" fill="#333">首词首字母大写</text>
    <text x="232" y="203" font-size="11" fill="#446688">["On","and","keep","calm","code"]</text>
  </g>

  <!-- 行 5 -->
  <g filter="url(#rough2)">
    <rect x="20" y="216" width="540" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="45" y="239" text-anchor="middle" font-size="12" fill="#333">5</text>
    <text x="145" y="239" text-anchor="middle" font-size="12" fill="#333">单空格拼接</text>
    <text x="232" y="239" font-size="12" fill="#4a7a3a" font-weight="bold">"On and keep calm code"</text>
  </g>

  <text x="290" y="272" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">步骤③：keep→calm→code 同长保原序（稳定排序的体现）</text>
</svg>
