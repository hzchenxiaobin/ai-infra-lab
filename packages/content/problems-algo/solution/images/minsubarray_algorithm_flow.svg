<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：右扩入窗 → 命中则连续左缩</text>

  <!-- Start -->
  <rect x="220" y="44" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="17" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">left=0, sum=0, ans=∞</text>
  <path d="M 280 80 L 280 100" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- right loop header -->
  <rect x="210" y="104" width="140" height="30" fill="#f6f6f6" stroke="#888" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="124" text-anchor="middle" font-size="11.5" fill="#333">for right in [0, n−1]</text>
  <path d="M 280 136 L 280 156" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step1: sum += nums[right] -->
  <rect x="190" y="160" width="180" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="183" text-anchor="middle" font-size="12" fill="#333">sum += nums[right]  (右扩)</text>
  <path d="M 280 198 L 280 222" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamond: sum >= target? -->
  <path d="M 280 226 L 360 270 L 280 314 L 200 270 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="266" text-anchor="middle" font-size="11.5" fill="#333">sum ≥ target</text>
  <text x="280" y="282" text-anchor="middle" font-size="11.5" fill="#333">？</text>

  <!-- No branch: back to loop -->
  <path d="M 360 270 L 430 270 L 430 119 L 352 119" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="392" y="262" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <!-- Yes branch: down -->
  <path d="M 280 314 L 280 338" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="294" y="330" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- while body: update ans + shrink -->
  <rect x="150" y="342" width="260" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="364" text-anchor="middle" font-size="11.5" fill="#333">ans = min(ans, right−left+1)</text>
  <text x="280" y="384" text-anchor="middle" font-size="11.5" fill="#333">sum −= nums[left]; left++</text>
  <text x="280" y="404" text-anchor="middle" font-size="10.5" fill="#888" font-style="italic">（while：连续左缩直到 sum &lt; target）</text>

  <!-- loop back from while to decision -->
  <path d="M 150 378 L 110 378 L 110 270 L 200 270" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- end: after loop -->
  <rect x="190" y="430" width="180" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="447" text-anchor="middle" font-size="11.5" fill="#b85450">return ans &gt; n ? 0 : ans</text>
  <path d="M 430 119 L 510 119 L 510 442 L 372 442" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
