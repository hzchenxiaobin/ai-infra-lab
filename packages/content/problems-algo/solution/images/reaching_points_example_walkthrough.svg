<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="430" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：sx=1, sy=1, tx=3, ty=5 → true</text>

  <!-- ===== 逆向倒推路径（上方） ===== -->
  <text x="30" y="62" font-size="11" fill="#4a7a3a" font-weight="bold">逆向倒推</text>

  <!-- (3,5) -->
  <rect x="64" y="70" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="96" y="90" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">(3, 5)</text>

  <!-- ty>tx, ty%=tx -> 2 -->
  <path d="M 134 85 L 168 85" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="136" y="60" width="64" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="168" y="72" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">ty&gt;tx</text>
  <text x="168" y="100" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">5%3=2</text>

  <!-- (3,2) -->
  <rect x="172" y="70" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="204" y="90" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">(3, 2)</text>

  <!-- tx>ty, tx%=ty -> 1 -->
  <path d="M 242 85 L 276 85" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="244" y="60" width="64" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="276" y="72" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">tx&gt;ty</text>
  <text x="276" y="100" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">3%2=1</text>

  <!-- (1,2) tx==sx 退出 -->
  <rect x="280" y="70" width="64" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="312" y="90" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">(1, 2)</text>

  <path d="M 348 85 L 382 85" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="366" y="76" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold" filter="url(#rough2)">tx=sx</text>
  <text x="366" y="104" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">退出循环</text>

  <!-- 最后一程判定 -->
  <rect x="386" y="70" width="150" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="461" y="90" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">(2−1)%1==0 → true</text>

  <!-- ===== 逐步表格（下方） ===== -->
  <text x="30" y="146" font-size="11" fill="#446688" font-weight="bold">逐步状态</text>

  <!-- table header -->
  <rect x="30" y="158" width="520" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="176" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">状态 (tx,ty)</text>
  <text x="170" y="176" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">比较</text>
  <text x="290" y="176" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">倒推动作</text>
  <text x="476" y="176" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">说明</text>

  <!-- row 1 -->
  <rect x="30" y="184" width="520" height="30" fill="#fafafa" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="76" y="204" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">(3, 5)</text>
  <text x="170" y="204" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">ty &gt; tx</text>
  <text x="290" y="204" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ty %= tx → 2</text>
  <text x="476" y="204" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">从 y 减 x：5−3=2</text>

  <!-- row 2 -->
  <rect x="30" y="214" width="520" height="30" fill="#fafafa" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="76" y="234" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">(3, 2)</text>
  <text x="170" y="234" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">tx &gt; ty</text>
  <text x="290" y="234" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">tx %= ty → 1</text>
  <text x="476" y="234" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">从 x 减 y：3−2=1</text>

  <!-- row 3: exit -->
  <rect x="30" y="244" width="520" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="76" y="264" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">(1, 2)</text>
  <text x="170" y="264" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">tx = sx</text>
  <text x="290" y="264" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">退出循环</text>
  <text x="476" y="264" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">x 已到位，凑 y</text>

  <!-- row 4: last leg -->
  <rect x="30" y="274" width="520" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="76" y="294" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">最后一程</text>
  <text x="170" y="294" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">tx==sx</text>
  <text x="290" y="294" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">(ty−sy)%tx==0 ?</text>
  <text x="476" y="294" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">(2−1)%1=0 → true ⭐</text>

  <!-- ===== 正向验证（底部） ===== -->
  <path d="M 290 318 Q 290 330 290 340" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="30" y="362" font-size="11" fill="#446688" font-weight="bold">正向验证</text>

  <rect x="64" y="372" width="64" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="96" y="391" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">(1,1)</text>

  <path d="M 132 386 L 166 386" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="150" y="378" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">y+x</text>

  <rect x="170" y="372" width="64" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="202" y="391" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">(1,2)</text>

  <path d="M 238 386 L 272 386" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="256" y="378" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">x+y</text>

  <rect x="276" y="372" width="64" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="308" y="391" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">(3,2)</text>

  <path d="M 344 386 L 378 386" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="362" y="378" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">y+x</text>

  <rect x="382" y="372" width="64" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="414" y="391" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">(3,5)</text>

  <text x="470" y="391" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">每步合法 ✓</text>
</svg>
