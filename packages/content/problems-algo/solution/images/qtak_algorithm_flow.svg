<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="4.5" refY="8" orient="auto">
      <path d="M0,0 L4.5,8 L9,0 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="560" fill="#fafafa"/>
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：8 方向 × 逐步外走，命中即收</text>

  <!-- 1 开始 -->
  <rect x="200" y="48" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="260" y="70" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">开始</text>
  <path d="M 260 82 L 260 100" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 2 建索引 -->
  <rect x="150" y="104" width="220" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="124" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">皇后坐标存入集合 / 布尔矩阵</text>
  <text x="260" y="140" text-anchor="middle" font-size="10" fill="#888">board[q.x][q.y] = true  （O(1) 查询）</text>
  <path d="M 260 148 L 260 166" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 3 枚举方向 -->
  <rect x="130" y="170" width="260" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="190" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">枚举 8 方向 (dx,dy) ∈ {−1,0,1}²</text>
  <text x="260" y="206" text-anchor="middle" font-size="10" fill="#888">跳过 (0,0)：横、竖、两条对角线</text>
  <path d="M 260 214 L 260 232" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 4 从相邻格起步 -->
  <rect x="140" y="236" width="240" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="261" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">x,y = king.x+dx, king.y+dy</text>
  <path d="M 260 276 L 260 296" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 5 越界? diamond -->
  <polygon points="260,300 350,348 260,396 170,348" fill="#fff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="345" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">越界？</text>
  <text x="260" y="361" text-anchor="middle" font-size="10" fill="#888">x,y ∉ [0,8)</text>

  <!-- 越界=是 → 下一方向 (loop back to 枚举方向) -->
  <path d="M 350 348 L 408 348" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="378" y="342" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="408" y="328" width="86" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="451" y="345" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">本方向无命中</text>
  <text x="451" y="359" text-anchor="middle" font-size="9.5" fill="#b85450">→ 换下一方向</text>
  <!-- loop arrow up to 枚举方向 box right side -->
  <path d="M 451 328 L 451 192 L 392 192" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3,3" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 越界=否 → 命中? -->
  <path d="M 260 396 L 260 416" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="272" y="410" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- 6 命中皇后? diamond -->
  <polygon points="260,420 350,462 260,504 170,462" fill="#fff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="460" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">该格有皇后？</text>
  <text x="260" y="476" text-anchor="middle" font-size="10" fill="#888">board[x][y]?</text>

  <!-- 命中=是 → 记录+break -->
  <path d="M 350 462 L 408 462" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="378" y="456" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="408" y="442" width="86" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="451" y="460" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">收入 ans</text>
  <text x="451" y="475" text-anchor="middle" font-size="9.5" fill="#4a7a3a">break 换方向</text>
  <path d="M 451 442 L 451 328" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="3,3" fill="none" filter="url(#rough2)"/>

  <!-- 命中=否 → 继续外走 -->
  <path d="M 170 462 L 96 462" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="132" y="456" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">否</text>
  <rect x="10" y="442" width="86" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="53" y="460" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">继续外走</text>
  <text x="53" y="475" text-anchor="middle" font-size="9.5" fill="#446688">x+=dx, y+=dy</text>
  <!-- loop back up to 越界 diamond left side -->
  <path d="M 53 442 L 53 348 L 168 348" stroke="#446688" stroke-width="1.4" stroke-dasharray="3,3" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- bottom: 8 方向遍历完 → 返回 -->
  <path d="M 260 170 L 260 170" stroke="none"/>
  <rect x="170" y="524" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="260" y="544" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">8 方向遍历完 → 返回 ans</text>
  <text x="430" y="544" text-anchor="middle" font-size="9.5" fill="#888">（最多 8 颗）</text>

  <!-- note linking 换方向 boxes down to 返回 -->
  <path d="M 451 380 L 451 524 L 352 524" stroke="#888" stroke-width="1.2" stroke-dasharray="2,4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="460" y="452" font-size="9" fill="#888" transform="rotate(0 460 452)">方向用尽</text>
</svg>
