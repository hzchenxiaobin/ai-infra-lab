<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="600" height="500" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：栈模拟 —— 入栈 → 检查栈顶 → 命中则弹出</text>
  <text x="300" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">单趟扫描 s，每次入栈后检查栈顶 m 位是否等于 part</text>

  <!-- Start: empty stack -->
  <rect x="220" y="62" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="20" filter="url(#rough2)"/>
  <text x="300" y="87" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">开始：stack = []</text>

  <!-- Arrow down to decision: 还有字符? -->
  <path d="M 300 104 L 300 124" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Decision: 还有字符? -->
  <polygon points="300,128 410,168 300,208 190,168" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="164" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">s 中还有字符?</text>
  <text x="300" y="182" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i &lt; n</text>

  <!-- No branch: left -> return stack -->
  <path d="M 190 168 L 110 168" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="150" y="160" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="30" y="196" width="160" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="110" y="215" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">扫描完毕</text>
  <text x="110" y="232" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return stack</text>

  <!-- Yes branch: down to push -->
  <path d="M 300 208 L 300 228" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="312" y="224" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- Push box -->
  <rect x="210" y="232" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="257" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">stack.push(s[i]); i++</text>

  <!-- Arrow down to decision: stack top matches part? -->
  <path d="M 300 274 L 300 294" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Decision: stack top == part? -->
  <polygon points="300,298 420,348 300,398 180,348" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="344" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">栈顶 m 位 == part?</text>
  <text x="300" y="362" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">m = part.length</text>

  <!-- Yes branch: right -> pop m -->
  <path d="M 420 348 L 470 348" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="445" y="340" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="390" y="378" width="170" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="475" y="403" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">弹出栈顶 m 个字符</text>

  <!-- loop back from pop to re-check (dashed) -->
  <path d="M 475 378 L 475 318 L 420 318 L 420 348" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="490" y="340" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">复查栈顶</text>

  <!-- No branch: down-left, loop back to "还有字符?" -->
  <path d="M 300 398 L 300 424 L 130 424 L 130 168 L 190 168" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="312" y="390" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="248" y="430" width="124" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="452" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">继续读下一字符</text>

  <!-- Note -->
  <rect x="40" y="472" width="520" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="488" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">弹出后需复查栈顶（虚线回路）—— 新栈顶可能再次匹配 part</text>
</svg>
