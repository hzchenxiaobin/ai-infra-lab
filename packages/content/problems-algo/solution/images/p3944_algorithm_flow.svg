<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" font-size="15.5" fill="#333" text-anchor="middle" filter="url(#rough2)">算法流程：奇偶解耦 + 二阶差分建表 + 最小次小配对</text>

  <!-- B0 输入 -->
  <rect x="60" y="46" width="220" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="65" font-size="12" fill="#33475e" text-anchor="middle" filter="url(#rough2)">输入 nums, k</text>
  <line x1="170" y1="76" x2="170" y2="86" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B1 奇偶分组 -->
  <rect x="60" y="88" width="220" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="104" font-size="11.5" fill="#33475e" text-anchor="middle" filter="url(#rough2)">① 奇偶分组取余数</text>
  <text x="170" y="119" font-size="11.5" fill="#33475e" text-anchor="middle" filter="url(#rough2)">cntEven / cntOdd　O(n)</text>
  <line x1="170" y1="126" x2="170" y2="136" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B2 建表 -->
  <rect x="60" y="138" width="220" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="154" font-size="11.5" fill="#33475e" text-anchor="middle" filter="url(#rough2)">② 锚点 + 两次前缀和建表</text>
  <text x="170" y="169" font-size="11.5" fill="#33475e" text-anchor="middle" filter="url(#rough2)">evenCost / oddCost　O(n+k)</text>
  <line x1="170" y1="176" x2="170" y2="186" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B3 最小次小 -->
  <rect x="60" y="188" width="220" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="204" font-size="11.5" fill="#33475e" text-anchor="middle" filter="url(#rough2)">③ oddCost 求最小 m1</text>
  <text x="170" y="219" font-size="11.5" fill="#33475e" text-anchor="middle" filter="url(#rough2)">与次小 m2（记下标）O(k)</text>
  <line x1="170" y1="226" x2="170" y2="236" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B4 枚举 x -->
  <rect x="60" y="238" width="220" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="258" font-size="12" fill="#33475e" text-anchor="middle" filter="url(#rough2)">④ 枚举 x = 0 .. k−1</text>

  <!-- 菱形判断 -->
  <line x1="282" y1="254" x2="288" y2="254" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="350,230 410,254 350,278 290,254" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="258" font-size="11" fill="#7a5c1e" text-anchor="middle" filter="url(#rough2)">m1 == x ?</text>

  <!-- 分支 T1 / T2 -->
  <path d="M 386 243 L 426 229" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="404" y="227" font-size="11" fill="#7a5c1e" text-anchor="middle" filter="url(#rough2)">否</text>
  <rect x="430" y="210" width="124" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="492" y="225" font-size="11" fill="#2e4d24" text-anchor="middle" filter="url(#rough2)">取最小</text>
  <text x="492" y="240" font-size="11" fill="#2e4d24" text-anchor="middle" filter="url(#rough2)">oddCost[m1]</text>

  <path d="M 386 265 L 426 279" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="404" y="286" font-size="11" fill="#7a5c1e" text-anchor="middle" filter="url(#rough2)">是</text>
  <rect x="430" y="262" width="124" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="492" y="277" font-size="11" fill="#7a5c1e" text-anchor="middle" filter="url(#rough2)">取次小</text>
  <text x="492" y="292" font-size="11" fill="#7a5c1e" text-anchor="middle" filter="url(#rough2)">oddCost[m2]</text>

  <!-- 分支汇入 B5 -->
  <path d="M 428 233 L 276 306" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 428 281 L 280 322" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B5 取 min -->
  <rect x="60" y="300" width="220" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="318" font-size="11.5" fill="#33475e" text-anchor="middle" filter="url(#rough2)">ans = min(ans, evenCost[x]</text>
  <text x="170" y="334" font-size="11.5" fill="#33475e" text-anchor="middle" filter="url(#rough2)">+ bestOdd(x))　O(k)</text>

  <!-- 循环回边 -->
  <path d="M 60 322 L 38 322 L 38 254 L 54 254" fill="none" stroke="#999" stroke-width="1.4"
        stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="44" y="292" font-size="10" fill="#888" filter="url(#rough2)" transform="rotate(-90 44 292)">对每个 x</text>

  <line x1="170" y1="344" x2="170" y2="354" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B6 答案 -->
  <rect x="60" y="356" width="220" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="170" y="376" font-size="11.5" fill="#2e4d24" text-anchor="middle" filter="url(#rough2)">返回 ans　时间 O(n+k)｜空间 O(k)</text>

  <!-- 右侧补充注记 -->
  <rect x="306" y="330" width="248" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="430" y="348" font-size="10.5" fill="#8a3a36" text-anchor="middle" filter="url(#rough2)">⚠️ 别想只枚举「出现过的余数」：</text>
  <text x="430" y="363" font-size="10.5" fill="#8a3a36" text-anchor="middle" filter="url(#rough2)">nums=[4,4], k=4 的最优 y=1</text>
  <text x="430" y="378" font-size="10.5" fill="#8a3a36" text-anchor="middle" filter="url(#rough2)">从未出现 —— 必须建整表</text>
</svg>
