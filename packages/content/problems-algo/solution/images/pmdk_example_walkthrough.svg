<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">示例演算：每格的 dp 向量 [r0, r1, r2]</text>

  <!-- column header for r index -->
  <text x="60" y="68" font-size="11" fill="#888" filter="url(#rough2)">grid↓</text>
  <text x="300" y="56" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">余数 r：0 / 1 / 2 （k=3）</text>

  <!-- 3x3 grid, cell 120x88, origin x=80 y=70 -->
  <g filter="url(#rough2)">
    <!-- row 0 -->
    <rect x="80" y="70" width="120" height="88" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <rect x="200" y="70" width="120" height="88" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <rect x="320" y="70" width="120" height="88" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <!-- row 1 -->
    <rect x="80" y="158" width="120" height="88" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <rect x="200" y="158" width="120" height="88" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <rect x="320" y="158" width="120" height="88" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <!-- row 2 -->
    <rect x="80" y="246" width="120" height="88" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <rect x="200" y="246" width="120" height="88" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <rect x="320" y="246" width="120" height="88" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="6"/>
  </g>

  <!-- cell content: grid value (top), dp vector (bottom) -->
  <g font-size="13" fill="#333" filter="url(#rough2)">
    <!-- (0,0)=5, dp=[0,0,1] -->
    <text x="140" y="100" text-anchor="middle" font-size="18" fill="#333">5</text>
    <text x="140" y="128" text-anchor="middle" font-size="13" fill="#446688">[0, 0, 1]</text>
    <text x="140" y="146" text-anchor="middle" font-size="10" fill="#888">sum=5≡2</text>
    <!-- (0,1)=2, dp=[0,1,0] -->
    <text x="260" y="100" text-anchor="middle" font-size="18" fill="#333">2</text>
    <text x="260" y="128" text-anchor="middle" font-size="13" fill="#446688">[0, 1, 0]</text>
    <text x="260" y="146" text-anchor="middle" font-size="10" fill="#888">sum=7≡1</text>
    <!-- (0,2)=4, dp=[0,0,1] -->
    <text x="380" y="100" text-anchor="middle" font-size="18" fill="#333">4</text>
    <text x="380" y="128" text-anchor="middle" font-size="13" fill="#446688">[0, 0, 1]</text>
    <text x="380" y="146" text-anchor="middle" font-size="10" fill="#888">sum=11≡2</text>

    <!-- (1,0)=3, dp=[0,0,1] -->
    <text x="140" y="188" text-anchor="middle" font-size="18" fill="#333">3</text>
    <text x="140" y="216" text-anchor="middle" font-size="13" fill="#446688">[0, 0, 1]</text>
    <text x="140" y="234" text-anchor="middle" font-size="10" fill="#888">sum=8≡2</text>
    <!-- (1,1)=0, dp=[0,1,1] -->
    <text x="260" y="188" text-anchor="middle" font-size="18" fill="#333">0</text>
    <text x="260" y="216" text-anchor="middle" font-size="13" fill="#446688">[0, 1, 1]</text>
    <text x="260" y="234" text-anchor="middle" font-size="10" fill="#888">g=0, pr=r</text>
    <!-- (1,2)=5, dp=[1,2,0] -->
    <text x="380" y="188" text-anchor="middle" font-size="18" fill="#333">5</text>
    <text x="380" y="216" text-anchor="middle" font-size="13" fill="#446688">[1, 2, 0]</text>
    <text x="380" y="234" text-anchor="middle" font-size="10" fill="#888">g=2, pr=(r-2)</text>

    <!-- (2,0)=0, dp=[0,0,1] -->
    <text x="140" y="276" text-anchor="middle" font-size="18" fill="#333">0</text>
    <text x="140" y="304" text-anchor="middle" font-size="13" fill="#446688">[0, 0, 1]</text>
    <text x="140" y="322" text-anchor="middle" font-size="10" fill="#888">g=0</text>
    <!-- (2,1)=7, dp=[2,0,1] -->
    <text x="260" y="276" text-anchor="middle" font-size="18" fill="#333">7</text>
    <text x="260" y="304" text-anchor="middle" font-size="13" fill="#446688">[2, 0, 1]</text>
    <text x="260" y="322" text-anchor="middle" font-size="10" fill="#888">g=1, pr=(r-1)</text>
    <!-- (2,2)=2, dp=[2,1,3] ANSWER -->
    <text x="380" y="276" text-anchor="middle" font-size="18" fill="#b85450" font-weight="bold">2</text>
    <text x="380" y="304" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">[2, 1, 3]</text>
    <text x="380" y="322" text-anchor="middle" font-size="10" fill="#b85450">答案=dp[0]=2</text>
  </g>

  <!-- direction arrows -->
  <path d="M200 114 L196 114" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M320 114 L316 114" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M140 158 L140 162" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="460" y="120" font-size="11" fill="#4a7a3a" filter="url(#rough2)">→ 从左</text>
  <text x="460" y="136" font-size="11" fill="#4a7a3a" filter="url(#rough2)">↓ 从上</text>

  <!-- note box -->
  <rect x="40" y="356" width="520" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="300" y="380" text-anchor="middle" font-size="13" fill="#7a5a20" filter="url(#rough2)">逐行从左到右填表，每格 dp[r] = 上格[(r-g)%k] + 左格[(r-g)%k]</text>
  <text x="300" y="400" text-anchor="middle" font-size="12" fill="#7a5a20" filter="url(#rough2)">如 (2,2)：g=2，r=0 时 pr=(0-2)%3=1，取上格[1]=2 + 左格[1]=0 → 2 ✓</text>
  <text x="300" y="416" text-anchor="middle" font-size="12" fill="#7a5a20" filter="url(#rough2)">路径总数 2+1+3=6 = C(4,2)，其中余数 0 的恰 2 条 = 答案</text>
</svg>
