<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：系数排序 + DFS 剪枝</text>

  <!-- Step 1 -->
  <rect x="100" y="40" width="240" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="220" y="58" text-anchor="middle" font-size="11" fill="#333">① 计算每个字符的系数 coeff[c]</text>

  <path d="M 220 70 L 220 80" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="80" y="84" width="280" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="220" y="102" text-anchor="middle" font-size="11" fill="#333">② 按 |coeff| 降序排序（大系数先赋值）</text>

  <path d="M 220 114 L 220 124" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: DFS entry -->
  <rect x="120" y="128" width="200" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="220" y="146" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">③ DFS(idx, sum)</text>

  <path d="M 220 158 L 220 168" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 1: idx == n? -->
  <polygon points="220,172 290,200 220,228 150,200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="197" text-anchor="middle" font-size="10.5" fill="#333">idx == n?</text>
  <text x="220" y="210" text-anchor="middle" font-size="10.5" fill="#333">(全部赋完)</text>

  <!-- Yes branch → right -->
  <path d="M 290 200 L 350 200" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="318" y="194" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="350" y="186" width="130" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="415" y="204" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">return sum == 0 ✓</text>

  <!-- No branch → down -->
  <path d="M 220 228 L 220 238" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="234" y="236" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- Compute lo/hi -->
  <rect x="90" y="242" width="260" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="220" y="259" text-anchor="middle" font-size="10.5" fill="#333">计算剩余字符贡献上下界 lo, hi</text>

  <path d="M 220 270 L 220 278" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 2: prune? -->
  <polygon points="220,282 300,306 220,330 140,306" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="303" text-anchor="middle" font-size="9.5" fill="#333">sum+lo&gt;0 或</text>
  <text x="220" y="315" text-anchor="middle" font-size="9.5" fill="#333">sum+hi&lt;0?</text>

  <!-- Yes → prune -->
  <path d="M 300 306 L 370 306" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="332" y="300" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="370" y="292" width="120" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="430" y="310" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">剪枝 ✗ return</text>

  <!-- No → enumerate digits -->
  <path d="M 220 330 L 220 338" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="234" y="338" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="70" y="340" width="300" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="220" y="352" text-anchor="middle" font-size="9.5" fill="#333">枚举 d ∈ [0,9]（首字母 d≥1），used[d]=T，DFS(idx+1, sum+coeff×d)</text>

  <!-- Loop back arrow from bottom to Decision 1 -->
  <path d="M 70 348 L 40 348 L 40 200 L 150 200" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="48" y="272" font-size="9" fill="#888" transform="rotate(-90 48 272)">递归回溯</text>
</svg>
