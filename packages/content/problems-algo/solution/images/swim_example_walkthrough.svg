<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例 2 演算：n=5，水位升至 16 时连通</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">绿色为最短「最大高度」路径，瓶颈在 (2,4)=16</text>

  <!-- ===== 5x5 grid ===== -->
  <!-- col c, row r: x=60+c*44, y=66+r*44, cell 44x44 -->
  <g font-size="14">
    <!-- row 0: 0 1 2 3 4  (all path green) -->
    <rect x="60" y="66" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="82" y="94" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <rect x="104" y="66" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="126" y="94" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="148" y="66" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="170" y="94" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="192" y="66" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="214" y="94" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <rect x="236" y="66" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="258" y="94" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>

    <!-- row 1: 24 23 22 21 5  (only (1,4)=5 path green) -->
    <rect x="60" y="110" width="44" height="44" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="82" y="138" text-anchor="middle" fill="#999">24</text>
    <rect x="104" y="110" width="44" height="44" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="126" y="138" text-anchor="middle" fill="#999">23</text>
    <rect x="148" y="110" width="44" height="44" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="170" y="138" text-anchor="middle" fill="#999">22</text>
    <rect x="192" y="110" width="44" height="44" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="214" y="138" text-anchor="middle" fill="#999">21</text>
    <rect x="236" y="110" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="258" y="138" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>

    <!-- row 2: 12 13 14 15 16  (path green; 16 is bottleneck red) -->
    <rect x="60" y="154" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="82" y="182" text-anchor="middle" fill="#4a7a3a" font-weight="bold">12</text>
    <rect x="104" y="154" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="126" y="182" text-anchor="middle" fill="#4a7a3a" font-weight="bold">13</text>
    <rect x="148" y="154" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="170" y="182" text-anchor="middle" fill="#4a7a3a" font-weight="bold">14</text>
    <rect x="192" y="154" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="214" y="182" text-anchor="middle" fill="#4a7a3a" font-weight="bold">15</text>
    <rect x="236" y="154" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="3" filter="url(#rough2)"/>
    <text x="258" y="182" text-anchor="middle" fill="#d6a040" font-weight="bold">16</text>

    <!-- row 3: 11 17 18 19 20  (only (3,0)=11 path green) -->
    <rect x="60" y="198" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="82" y="226" text-anchor="middle" fill="#4a7a3a" font-weight="bold">11</text>
    <rect x="104" y="198" width="44" height="44" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="126" y="226" text-anchor="middle" fill="#999">17</text>
    <rect x="148" y="198" width="44" height="44" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="170" y="226" text-anchor="middle" fill="#999">18</text>
    <rect x="192" y="198" width="44" height="44" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="214" y="226" text-anchor="middle" fill="#999">19</text>
    <rect x="236" y="198" width="44" height="44" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="258" y="226" text-anchor="middle" fill="#999">20</text>

    <!-- row 4: 10 9 8 7 6  (all path green; (4,4)=6 end marker) -->
    <rect x="60" y="242" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="82" y="270" text-anchor="middle" fill="#4a7a3a" font-weight="bold">10</text>
    <rect x="104" y="242" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="126" y="270" text-anchor="middle" fill="#4a7a3a" font-weight="bold">9</text>
    <rect x="148" y="242" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="170" y="270" text-anchor="middle" fill="#4a7a3a" font-weight="bold">8</text>
    <rect x="192" y="242" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="214" y="270" text-anchor="middle" fill="#4a7a3a" font-weight="bold">7</text>
    <rect x="236" y="242" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
    <text x="258" y="270" text-anchor="middle" fill="#b85450" font-weight="bold">6</text>
  </g>

  <!-- start / end / bottleneck labels -->
  <text x="82" y="60" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">起点</text>
  <text x="258" y="60" text-anchor="middle" font-size="9" fill="#888">↑ 顶行</text>
  <text x="258" y="300" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">终点 (4,4)</text>
  <text x="288" y="180" font-size="9" fill="#d6a040" font-weight="bold">← 瓶颈 (2,4)=16</text>

  <!-- route arrows along path (centers) -->
  <!-- (0,0)->(0,4): horizontal right at y=88 -->
  <path d="M 88 88 L 248 88" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- (0,4)->(1,4)->(2,4): down at x=258 -->
  <path d="M 258 110 L 258 152" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- (2,4)->(2,0): left at y=176 -->
  <path d="M 236 176 L 88 176" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- (2,0)->(3,0)->(4,0): down at x=82 -->
  <path d="M 82 198 L 82 240" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- (4,0)->(4,4): right at y=264 -->
  <path d="M 88 264 L 248 264" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== explanation panel right ===== -->
  <rect x="310" y="90" width="252" height="220" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="436" y="112" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">Dijkstra 变体过程</text>

  <text x="322" y="136" font-size="10" fill="#446688" font-weight="bold">堆按「当前路径最大高度」排序：</text>
  <text x="322" y="154" font-size="10" fill="#446688">① 弹 (0,(0,0))，扩散到 (0,1):max=1</text>
  <text x="322" y="170" font-size="10" fill="#446688">② 弹 (1,(0,1))→(0,2):max=2</text>
  <text x="322" y="186" font-size="10" fill="#446688">③ 沿顶行一路 max=1,2,3,4</text>
  <text x="322" y="202" font-size="10" fill="#446688">④ (0,4)→(1,4):max(4,5)=5</text>
  <text x="322" y="218" font-size="10" fill="#d6a040" font-weight="bold">⑤ (1,4)→(2,4):max(5,16)=16</text>
  <text x="322" y="234" font-size="10" fill="#446688">⑥ 沿第 2 行向左 max 仍 16</text>
  <text x="322" y="250" font-size="10" fill="#446688">⑦ 下到第 4 行向右到 (4,4)</text>
  <text x="322" y="270" font-size="10" fill="#446688">到达 (4,4) 时 d=16，即答案</text>

  <rect x="322" y="282" width="228" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="436" y="298" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">瓶颈 max = 16 → 答案 16</text>

  <text x="60" y="328" font-size="10" fill="#888">注：堆每次弹出 d 最小者；因 grid 值非负，弹出即确定该格的「最小最大高度」(贪心正确)</text>
  <text x="60" y="344" font-size="10" fill="#888">任意更优路径都需绕开 16，但 (2,4)=16 是从上半区进入右下角区域的必经枢纽，无法绕开</text>
</svg>
