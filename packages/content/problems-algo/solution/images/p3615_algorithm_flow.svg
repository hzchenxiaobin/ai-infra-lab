<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：mask + 无序端点对的状态压缩 DP</text>

  <!-- ⑥ 答案（右上） -->
  <rect x="305" y="36" width="185" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="397" y="54" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">⑥ 全部状态处理完</text>
  <text x="397" y="70" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">答案 = max popcount(mask)</text>
  <text x="397" y="84" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">（单点即回文，至少 1）</text>

  <!-- ① -->
  <rect x="55" y="36" width="185" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="147" y="50" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">① 预处理</text>
  <text x="147" y="65" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">adj[v] 位掩码 + 按字符分组</text>

  <!-- ② -->
  <rect x="55" y="86" width="185" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="147" y="101" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">② 初始化基态</text>
  <text x="147" y="115" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">奇：每个单点 {v}(v,v)</text>
  <text x="147" y="127" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">偶：同字符边 {u,v}(u,v)</text>

  <!-- ③ -->
  <rect x="55" y="146" width="185" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="147" y="160" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">③ 取下一个可达状态</text>
  <text x="147" y="173" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">(mask, l, r)，l ≤ r</text>

  <!-- ④ -->
  <rect x="55" y="194" width="185" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="147" y="210" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">④ 枚举新端点对 a、b</text>
  <text x="147" y="225" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">a ∈ N(l)∖mask，b ∈ N(r)∖mask</text>
  <text x="147" y="239" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">约束：a ≠ b</text>
  <text x="147" y="250" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">且 label[a] == label[b]</text>

  <!-- 菱形判断 -->
  <polygon points="81,294 147,264 213,294 147,324" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="147" y="298" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">找到 (a,b)？</text>

  <!-- ⑤ -->
  <rect x="300" y="276" width="190" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="395" y="293" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">⑤ 标记新状态</text>
  <text x="395" y="308" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">dp[mask∪{a,b}][a][b] = 1</text>
  <text x="395" y="322" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">长度 = popcount(新 mask)</text>

  <!-- 主干箭头 -->
  <path d="M 147 72 L 147 84" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 147 130 L 147 144" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 147 178 L 147 192" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 147 252 L 147 262" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 是：菱形 → ⑤ -->
  <path d="M 147 324 C 200 328, 245 318, 296 310" fill="none" stroke="#4a7a3a" stroke-width="1.8"
        marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="195" y="344" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 否：菱形 → ③（换下一个状态） -->
  <path d="M 213 294 C 268 288, 262 210, 240 172" fill="none" stroke="#b85450" stroke-width="1.5"
        stroke-dasharray="5 4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="285" y="236" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否：换下一个状态</text>

  <!-- ⑤ → ④ 继续枚举 -->
  <path d="M 395 276 C 395 252, 320 236, 245 230" fill="none" stroke="#4a7a3a" stroke-width="1.5"
        stroke-dasharray="5 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="352" y="260" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">继续枚举更多对</text>

  <!-- ③ → ⑥ 遍历结束 -->
  <path d="M 240 156 C 262 150, 258 92, 298 68" fill="none" stroke="#d6a040" stroke-width="1.5"
        stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="262" y="106" text-anchor="start" font-size="10" fill="#999" filter="url(#rough2)">状态全部</text>
  <text x="262" y="118" text-anchor="start" font-size="10" fill="#999" filter="url(#rough2)">遍历完</text>

  <text x="55" y="350" font-size="10" fill="#999" filter="url(#rough2)">注：mask 只增不减 → 按数值递增一遍扫完（也可用栈 / 队列工作表）</text>
</svg>
