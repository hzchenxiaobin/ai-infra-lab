<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：目标值 x 只能是第 0 张多米诺的两个值之一</text>

  <!-- Dominoes label -->
  <text x="40" y="56" font-size="11" fill="#888">6 张多米诺（上=tops，下=bottoms）：</text>

  <!-- tops label -->
  <text x="76" y="86" text-anchor="end" font-size="10" fill="#446688" font-weight="bold">tops</text>
  <!-- bottoms label -->
  <text x="76" y="116" text-anchor="end" font-size="10" fill="#4a7a3a" font-weight="bold">bottoms</text>

  <!-- domino 0 (highlighted, candidate source) -->
  <rect x="86" y="66" width="48" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="86" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="86" y="96" width="48" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="116" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>

  <!-- domino 1 -->
  <rect x="150" y="66" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="174" y="86" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="150" y="96" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="174" y="116" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <!-- domino 2 -->
  <rect x="214" y="66" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="238" y="86" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="214" y="96" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="238" y="116" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>

  <!-- domino 3 -->
  <rect x="278" y="66" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="302" y="86" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="278" y="96" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="302" y="116" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <!-- domino 4 -->
  <rect x="342" y="66" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="366" y="86" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="342" y="96" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="366" y="116" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <!-- domino 5 -->
  <rect x="406" y="66" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="86" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="406" y="96" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="116" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <!-- index labels -->
  <text x="110" y="140" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">i=0</text>
  <text x="174" y="140" text-anchor="middle" font-size="9" fill="#999">i=1</text>
  <text x="238" y="140" text-anchor="middle" font-size="9" fill="#999">i=2</text>
  <text x="302" y="140" text-anchor="middle" font-size="9" fill="#999">i=3</text>
  <text x="366" y="140" text-anchor="middle" font-size="9" fill="#999">i=4</text>
  <text x="430" y="140" text-anchor="middle" font-size="9" fill="#999">i=5</text>

  <!-- bracket: every domino must contain x -->
  <path d="M 86 150 L 86 158 L 454 158 L 454 150" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="270" y="172" text-anchor="middle" font-size="11" fill="#666">要让某一行全等于 x，则每张牌必须含 x（上或下）</text>

  <!-- arrow down from domino 0 -->
  <path d="M 110 176 L 110 190" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- candidate note -->
  <rect x="56" y="192" width="428" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="212" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">第 0 张牌也必须含 x  ⟹  x ∈ { tops[0], bottoms[0] }</text>
  <text x="270" y="230" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">候选 x = { 2, 5 }，至多 2 个，逐个 O(n) 验证即可</text>

  <!-- ===== Rotation illustration ===== -->
  <text x="40" y="264" font-size="11" fill="#888" font-weight="bold">旋转操作 = 交换一张牌的上下半：</text>

  <!-- before rotation: domino 3 (4 / 2) -->
  <text x="96" y="286" text-anchor="middle" font-size="10" fill="#888">旋转前</text>
  <rect x="78" y="294" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="98" y="312" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="78" y="320" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="98" y="338" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <!-- swap arrow -->
  <path d="M 128 318 C 168 300 168 336 208 318" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="168" y="296" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">swap</text>

  <!-- after rotation: (2 / 4) -->
  <text x="248" y="286" text-anchor="middle" font-size="10" fill="#888">旋转后</text>
  <rect x="230" y="294" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="312" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="230" y="320" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="338" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>

  <!-- summary note on right -->
  <rect x="300" y="290" width="216" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="408" y="312" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">让“上排”全为 x：</text>
  <text x="408" y="330" text-anchor="middle" font-size="11" fill="#666">topRot = tops[i]≠x 的张数</text>
  <text x="408" y="346" text-anchor="middle" font-size="11" fill="#666">botRot = bottoms[i]≠x 的张数</text>

  <!-- bottom summary -->
  <text x="270" y="380" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">对每个候选 x：若每张牌都含 x，答案即 min(topRot, botRot)；否则该候选不可行</text>
</svg>
