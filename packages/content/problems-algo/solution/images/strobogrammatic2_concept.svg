<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="270" y="32" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">由外向内递归填对：n = 4 的分层结构</text>

  <!-- ===== 偶数长度 n=4 示例 ===== -->
  <text x="50" y="72" font-size="13" fill="#446688" filter="url(#rough2)">偶数长度 n = 4：</text>

  <!-- 外层配对（橙）位置 0 和 3 -->
  <rect x="90" y="84" width="60" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="113" text-anchor="middle" font-size="22" fill="#333" filter="url(#rough2)">1</text>
  <text x="120" y="146" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">外层左</text>

  <!-- 内层配对（蓝）位置 1 和 2 -->
  <rect x="160" y="84" width="60" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="113" text-anchor="middle" font-size="22" fill="#333" filter="url(#rough2)">0</text>
  <text x="190" y="146" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">内层左</text>

  <rect x="230" y="84" width="60" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="113" text-anchor="middle" font-size="22" fill="#333" filter="url(#rough2)">0</text>
  <text x="260" y="146" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">内层右</text>

  <rect x="300" y="84" width="60" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="330" y="113" text-anchor="middle" font-size="22" fill="#333" filter="url(#rough2)">1</text>
  <text x="330" y="146" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">外层右</text>

  <!-- 外层配对连线 -->
  <path d="M 120 82 Q 210 58 330 82" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="225" y="56" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">外层配对（4 选，无 0）</text>

  <!-- 内层配对连线 -->
  <path d="M 190 148 Q 225 168 260 148" fill="none" stroke="#446688" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="225" y="182" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">内层配对（5 选，含 0）</text>

  <!-- ===== 奇数长度 n=5 示例 ===== -->
  <text x="50" y="214" font-size="13" fill="#4a7a3a" filter="url(#rough2)">奇数长度 n = 5：</text>

  <rect x="90" y="226" width="50" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="115" y="251" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">6</text>

  <rect x="148" y="226" width="50" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="173" y="251" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">1</text>

  <rect x="206" y="226" width="50" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="231" y="251" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">8</text>
  <text x="231" y="276" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">中心</text>

  <rect x="264" y="226" width="50" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="289" y="251" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">1</text>

  <rect x="322" y="226" width="50" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="347" y="251" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">9</text>

  <!-- 中心标注 -->
  <path d="M 231 288 Q 231 300 231 306" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- ===== 三个层级说明框 ===== -->
  <rect x="60" y="312" width="150" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="135" y="333" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">外层：4 对（禁 0 前导零）</text>

  <rect x="220" y="312" width="150" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="295" y="333" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">内层：5 对（含 0 合法）</text>

  <rect x="380" y="312" width="120" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="440" y="333" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">中心：3 选 (0/1/8)</text>

  <!-- 底部结论 -->
  <rect x="60" y="358" width="440" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="379" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">每层从 5 对映射中选一对包裹内层，最外层去掉 0...0</text>
</svg>
