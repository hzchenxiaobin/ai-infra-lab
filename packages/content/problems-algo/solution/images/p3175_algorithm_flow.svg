<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：一趟扫描打擂台</text>

  <rect x="212" y="40" width="96" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="13" filter="url(#rough2)"/>
  <text x="260" y="58" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">开始</text>

  <path d="M 260 66 L 260 76" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="185" y="78" width="150" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="97" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">cur = 0, win = 0, i = 1</text>

  <path d="M 260 106 L 260 122" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,126 352,158 260,190 168,158" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="153" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">skills[i] &gt;</text>
  <text x="260" y="169" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">skills[cur] ?</text>

  <text x="155" y="148" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <text x="358" y="148" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <path d="M 168 158 L 150 158" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 352 158 L 372 158" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="140" width="110" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="95" y="162" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">新王登基：cur = i</text>

  <rect x="372" y="140" width="110" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="427" y="162" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">守擂：win + 1</text>

  <path d="M 95 176 L 95 212 L 260 212" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 427 176 L 427 212 L 268 212" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 260 212 L 260 220" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,222 332,246 260,270 188,246" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="251" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">win == k ?</text>

  <text x="340" y="236" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <path d="M 332 246 L 368 246" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="370" y="228" width="126" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="14" filter="url(#rough2)"/>
  <text x="433" y="250" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 cur（答案）</text>

  <text x="270" y="288" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <path d="M 260 270 L 260 278" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,280 348,304 260,328 172,304" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="309" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">i+1 &lt; n ?</text>

  <text x="330" y="332" font-size="11" fill="#b85450" filter="url(#rough2)">否（无人可挑战）</text>
  <path d="M 260 328 L 260 336" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="168" y="338" width="184" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="352" text-anchor="middle" font-size="11.5" fill="#8a3a34" filter="url(#rough2)">返回 cur（全局最强）</text>

  <path d="M 172 304 L 14 304 L 14 114 L 250 114 L 250 122" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="26" y="292" font-size="11" fill="#446688" filter="url(#rough2)">是（下一位挑战者 i+1）</text>
</svg>
