<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="500" height="560" fill="#fafafa"/>
  <text x="250" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">非递减数组算法流程：一趟扫描 + 贪心修法</text>

  <!-- init -->
  <rect x="140" y="44" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="250" y="69" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">cnt = 0; i = 1</text>

  <path d="M 250 84 L 250 102" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- loop check -->
  <polygon points="250,106 370,150 250,194 130,150" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="148" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i &lt; n ?</text>
  <text x="250" y="166" text-anchor="middle" font-size="10" fill="#777">还有元素？</text>

  <!-- No -> return true -->
  <path d="M 370 150 L 440 150 L 440 240" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="386" y="142" font-size="11" fill="#b85450" font-weight="bold">No</text>
  <rect x="376" y="244" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="436" y="262" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">返回 true</text>
  <text x="436" y="276" text-anchor="middle" font-size="9.5" fill="#888">cnt ≤ 1</text>

  <!-- Yes down -->
  <path d="M 250 194 L 250 214" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="266" y="208" font-size="11" fill="#82b366" font-weight="bold">Yes</text>

  <!-- check decrease -->
  <polygon points="250,218 380,262 250,306 120,262" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="260" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">nums[i] &lt; nums[i−1] ?</text>
  <text x="250" y="278" text-anchor="middle" font-size="10" fill="#777">下降？</text>

  <!-- No -> i++ back to loop -->
  <path d="M 120 262 L 60 262 L 60 150 L 130 150" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="74" y="254" font-size="11" fill="#82b366" font-weight="bold">No</text>
  <text x="40" y="208" font-size="9.5" fill="#888">i += 1</text>

  <!-- Yes down -->
  <path d="M 250 306 L 250 326" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="266" y="320" font-size="11" fill="#b85450" font-weight="bold">Yes</text>

  <!-- cnt++ and check -->
  <rect x="100" y="330" width="300" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="250" y="355" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">cnt += 1</text>

  <path d="M 250 370 L 250 388" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- cnt > 1 ? -->
  <polygon points="250,392 370,432 250,472 130,432" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="430" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">cnt &gt; 1 ?</text>

  <!-- Yes -> return false -->
  <path d="M 370 432 L 440 432 L 440 380 L 440 360" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="386" y="424" font-size="11" fill="#b85450" font-weight="bold">Yes</text>
  <rect x="376" y="316" width="120" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="436" y="334" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">返回 false</text>
  <text x="436" y="348" text-anchor="middle" font-size="9.5" fill="#888">超过 1 次修改</text>
  <path d="M 436 356 L 436 392" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- No -> choose repair -->
  <path d="M 250 472 L 250 492" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="266" y="486" font-size="11" fill="#82b366" font-weight="bold">No</text>

  <!-- repair decision -->
  <polygon points="250,496 390,532 250,568 110,532" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="528" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">i&lt;2 或 nums[i]≥nums[i−2] ?</text>
  <text x="250" y="546" text-anchor="middle" font-size="10" fill="#777">选修法</text>

  <!-- A: left -->
  <path d="M 110 532 L 50 532" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="92" y="524" font-size="10" fill="#4a7a3a" font-weight="bold">Yes</text>
  <rect x="14" y="516" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="34" y="536" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">A</text>

  <!-- B: right -->
  <path d="M 390 532 L 450 532" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="408" y="524" font-size="10" fill="#d6a040" font-weight="bold">No</text>
  <rect x="450" y="516" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="470" y="536" text-anchor="middle" font-size="9.5" fill="#a07820" font-weight="bold">B</text>
</svg>
