<svg xmlns="http://www.w3.org/200200/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">callPolyfill 执行流程</text>

  <!-- Step 1 -->
  <rect x="150" y="48" width="240" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">① fn = this</text>
  <text x="270" y="84" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">callPolyfill 的 this = 被调函数</text>
  <path d="M 270 92 L 270 112" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="150" y="112" width="240" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="132" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">② key = Symbol()</text>
  <text x="270" y="148" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">生成唯一键，避免覆盖已有属性</text>
  <path d="M 270 156 L 270 176" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="150" y="176" width="240" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="196" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">③ context[key] = fn</text>
  <text x="270" y="212" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">把函数挂载为 context 的方法</text>
  <path d="M 270 220 L 270 240" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4 -->
  <rect x="150" y="240" width="240" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="260" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">④ result = context[key](...args)</text>
  <text x="270" y="276" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">方法调用 → this 绑定为 context</text>
  <path d="M 270 284 L 270 304" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5 -->
  <rect x="150" y="304" width="240" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="324" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">⑤ delete context[key]</text>
  <text x="270" y="340" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">清理临时属性，恢复对象原貌</text>
  <path d="M 270 348 L 270 368" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 6 -->
  <rect x="150" y="368" width="240" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="388" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">⑥ return result</text>
  <text x="270" y="404" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">返回函数执行结果</text>

  <!-- side note -->
  <rect x="408" y="240" width="118" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="467" y="260" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">关键一步</text>
  <text x="467" y="276" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">this 绑定在此发生</text>
  <path d="M 390 262 L 408 262" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
