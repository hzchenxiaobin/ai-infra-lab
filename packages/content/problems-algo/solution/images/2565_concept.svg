<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="470" fill="#fafafa"/>

  <text x="330" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：删除一个连续段 → 保留 t 的前缀 + 后缀 → pre/suf 双向贪心</text>
  <text x="330" y="48" text-anchor="middle" font-size="11" fill="#888">得分只看被删下标的跨度 ⇒ 删整段不亏；保留的前缀用 s 前段、后缀用 s 后段</text>

  <!-- ===== t row ===== -->
  <text x="70" y="110" font-size="12" fill="#555" font-weight="bold">t =</text>

  <text x="160" y="76" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">保留前缀 (长 a)</text>
  <rect x="140" y="86" width="56" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="168" y="111" text-anchor="middle" font-size="15" fill="#333">b</text>

  <text x="280" y="76" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">删除段 [l, r]（得分 r−l+1）</text>
  <rect x="252" y="86" width="56" height="38" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="111" text-anchor="middle" font-size="15" fill="#333">z</text>

  <text x="400" y="76" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">保留后缀 (长 b)</text>
  <rect x="316" y="86" width="56" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="344" y="111" text-anchor="middle" font-size="15" fill="#333">a</text>
  <rect x="380" y="86" width="56" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="408" y="111" text-anchor="middle" font-size="15" fill="#333">a</text>

  <!-- bracket labels under t -->
  <text x="168" y="140" text-anchor="middle" font-size="10" fill="#446688">t[0..l−1]</text>
  <text x="280" y="140" text-anchor="middle" font-size="10" fill="#b85450">t[l..r]</text>
  <text x="376" y="140" text-anchor="middle" font-size="10" fill="#4a7a3a">t[r+1..m−1]</text>

  <!-- ===== s row ===== -->
  <text x="70" y="256" font-size="12" fill="#555" font-weight="bold">s =</text>

  <!-- s boxes: a b | a c a b a  (split k=2 after index 1) -->
  <!-- prefix region (blue) -->
  <rect x="144" y="232" width="48" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="168" y="256" text-anchor="middle" font-size="14" fill="#333">a</text>
  <rect x="198" y="232" width="48" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="222" y="256" text-anchor="middle" font-size="14" fill="#333">b</text>

  <!-- split line -->
  <path d="M 250 224 L 250 284" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="250" y="218" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">切分点 k</text>

  <!-- suffix region (green) -->
  <rect x="252" y="232" width="48" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="276" y="256" text-anchor="middle" font-size="14" fill="#333">a</text>
  <rect x="306" y="232" width="48" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="330" y="256" text-anchor="middle" font-size="14" fill="#333">c</text>
  <rect x="360" y="232" width="48" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="384" y="256" text-anchor="middle" font-size="14" fill="#333">a</text>
  <rect x="414" y="232" width="48" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="438" y="256" text-anchor="middle" font-size="14" fill="#333">b</text>
  <rect x="468" y="232" width="48" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="492" y="256" text-anchor="middle" font-size="14" fill="#333">a</text>

  <!-- region labels under s -->
  <text x="186" y="288" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">s[0..k−1] 匹配前缀</text>
  <text x="380" y="288" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">s[k..n−1] 匹配后缀</text>

  <!-- greedy arrows from t to s -->
  <path d="M 168 150 Q 150 195 178 228" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="190" font-size="10" fill="#446688">贪心 → pre[k]</text>

  <path d="M 376 150 Q 430 195 405 228" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="450" y="190" font-size="10" fill="#4a7a3a">suf[k] ← 贪心</text>

  <!-- ===== formula box ===== -->
  <rect x="80" y="320" width="500" height="60" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="345" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">得分 = r − l + 1 = m − (a + b)</text>
  <text x="330" y="366" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">答案 = max(0, m − max ( pre[k] + suf[k] ))</text>

  <!-- footnotes -->
  <text x="80" y="410" font-size="11" fill="#555">• 删整段不亏：[l,r] 内未删的也删掉，跨度不变、保留更短 ⇒ 更易成子序列</text>
  <text x="80" y="430" font-size="11" fill="#555">• 切分点 k ∈ [0, n]：前缀用 s[0..k−1]、后缀用 s[k..n−1]，天然不重叠</text>
  <text x="80" y="450" font-size="11" fill="#b85450">• pre[k]+suf[k] ≥ m ⇒ 整个 t 已是 s 子序列 ⇒ 不删，得分 0</text>
</svg>
