<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="300" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#444" font-weight="bold">示例演算：nums = [2,4,6], k = 2　输出：4</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">vals=[2,4,6]，cnt 各为 1，w = 2¹−1 = 1</text>

  <!-- table frame -->
  <rect x="24" y="56" width="472" height="160" fill="#ffffff" stroke="#cfd8e8" stroke-width="1.2" rx="6" filter="url(#rough2)"/>

  <!-- header -->
  <rect x="24" y="56" width="472" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="58" y="71" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">阶段</text>
  <text x="124" y="71" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">处理值</text>
  <text x="178" y="71" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">gap</text>
  <text x="232" y="71" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">dp0(跳)</text>
  <text x="296" y="71" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">dp1(取)</text>
  <text x="404" y="71" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">说明</text>

  <!-- row: 初始 -->
  <text x="58" y="94" text-anchor="middle" font-size="10" fill="#333">初始</text>
  <text x="124" y="94" text-anchor="middle" font-size="10" fill="#333">v=2</text>
  <text x="178" y="94" text-anchor="middle" font-size="10" fill="#888">—</text>
  <text x="232" y="94" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="296" y="94" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="340" y="94" font-size="9.5" fill="#555">跳过=1；取=2¹−1=1</text>

  <!-- row: i=1 -->
  <text x="58" y="118" text-anchor="middle" font-size="10" fill="#333">i=1</text>
  <text x="124" y="118" text-anchor="middle" font-size="10" fill="#333">v=4</text>
  <text x="178" y="118" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2</text>
  <text x="232" y="118" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="296" y="118" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="340" y="118" font-size="9.5" fill="#555">gap==k：跳 1+1=2；取 1·dp0=1</text>

  <!-- row: i=2 -->
  <text x="58" y="142" text-anchor="middle" font-size="10" fill="#333">i=2</text>
  <text x="124" y="142" text-anchor="middle" font-size="10" fill="#333">v=6</text>
  <text x="178" y="142" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2</text>
  <text x="232" y="142" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="296" y="142" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="340" y="142" font-size="9.5" fill="#555">gap==k：跳 2+1=3；取 1·dp0=2</text>

  <!-- separator -->
  <path d="M24 158 L496 158" stroke="#cfd8e8" stroke-width="1" filter="url(#rough2)"/>

  <!-- result row highlighted -->
  <rect x="26" y="160" width="468" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="58" y="177" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">结果</text>
  <text x="124" y="177" text-anchor="middle" font-size="10" fill="#888">—</text>
  <text x="178" y="177" text-anchor="middle" font-size="10" fill="#888">—</text>
  <text x="232" y="177" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="296" y="177" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="340" y="177" font-size="10" fill="#4a7a3a" font-weight="bold">3 + 2 − 1 = 4 ✓（扣空集）</text>

  <!-- bottom: the 4 beautiful subsets -->
  <text x="260" y="206" text-anchor="middle" font-size="10.5" fill="#666" font-weight="bold">美丽子集（共 4 个）</text>
  <rect x="60" y="214" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="100" y="231" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">{2}</text>
  <rect x="150" y="214" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="190" y="231" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">{4}</text>
  <rect x="240" y="214" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="280" y="231" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">{6}</text>
  <rect x="330" y="214" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="390" y="231" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">{2, 6}</text>

  <text x="260" y="262" text-anchor="middle" font-size="9.5" fill="#888">注意 {2,4}、{4,6}、{2,4,6} 因含相差 k 的对而非法；{2,6} 差 4≠2 合法</text>
  <text x="260" y="278" text-anchor="middle" font-size="9.5" fill="#888">每步「取」受 gap==k 限制只能接在「跳过」之后 → 正是打家劫舍的不相邻约束</text>
</svg>
