<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：单趟扫描 —— 先查表转移，再就地聚合</text>

  <!-- Start -->
  <rect x="155" y="32" width="210" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="49" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">初始化：p = 0，m_A = {0:1}，m_B = {}</text>
  <text x="260" y="65" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">起点计入状态A（首块必须 = t1）</text>
  <path d="M 260 74 L 260 84" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop -->
  <rect x="185" y="86" width="150" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="102" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">遍历 nums 中每个 x</text>
  <path d="M 260 110 L 260 120" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- p ^= x -->
  <rect x="175" y="122" width="170" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="138" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">p ^= x（当前前缀异或）</text>
  <path d="M 260 146 L 260 156" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- transfer -->
  <rect x="135" y="158" width="250" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="174" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">f_B = m_A[p ^ t1] —— 结束一块 XOR = t1</text>
  <text x="260" y="190" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">f_A = m_B[p ^ t2] —— 结束一块 XOR = t2</text>
  <path d="M 260 198 L 260 208" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- update -->
  <rect x="145" y="210" width="230" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="226" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">m_A[p] += f_A，m_B[p] += f_B（取模）</text>
  <path d="M 260 234 L 260 244" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision -->
  <polygon points="260,248 322,272 260,296 198,272" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="276" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">还有元素？</text>

  <!-- loop back -->
  <path d="M 198 272 L 118 272 L 118 98 L 181 98" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="265" font-size="9.5" fill="#888" filter="url(#rough2)">是</text>

  <!-- no -->
  <path d="M 260 296 L 260 308" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="306" font-size="9.5" fill="#888" filter="url(#rough2)">否</text>

  <!-- end -->
  <rect x="145" y="310" width="230" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="327" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">返回 (f_A + f_B) mod 10⁹+7</text>

  <!-- footer -->
  <text x="260" y="352" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">查表与更新均 O(1)：哈希表按前缀值聚合全部合法分割点 j，整体 O(n) 一遍扫完</text>
</svg>
