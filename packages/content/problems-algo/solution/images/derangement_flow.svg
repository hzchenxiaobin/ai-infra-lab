<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrDown" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：滚动变量 O(1) 空间递推</text>

  <!-- ===== Step 1: handle n=1 ===== -->
  <rect x="60" y="50" width="440" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="80" y="74" font-size="12" fill="#b85450" font-weight="bold">① 特判</text>
  <text x="80" y="92" font-size="11" fill="#444">若 n = 1，直接返回 0（仅 [1]，无法错排）</text>

  <path d="M 280 108 L 280 128" stroke="#446688" stroke-width="1.8" marker-end="url(#arrDown)" fill="none" filter="url(#rough2)"/>

  <!-- ===== Step 2: init ===== -->
  <rect x="60" y="132" width="440" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="80" y="156" font-size="12" fill="#446688" font-weight="bold">② 初始化两个滚动变量</text>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="120" y="166" width="80" height="24" fill="#fff" stroke="#446688" stroke-width="1" rx="4"/>
    <text x="160" y="182" fill="#446688">prev2 = 1</text>
    <rect x="240" y="166" width="80" height="24" fill="#fff" stroke="#446688" stroke-width="1" rx="4"/>
    <text x="280" y="182" fill="#446688">prev1 = 0</text>
    <text x="360" y="182" fill="#888" font-size="11">（D(0)=1, D(1)=0）</text>
  </g>

  <path d="M 280 198 L 280 218" stroke="#446688" stroke-width="1.8" marker-end="url(#arrDown)" fill="none" filter="url(#rough2)"/>

  <!-- ===== Step 3: loop ===== -->
  <rect x="60" y="222" width="440" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="80" y="246" font-size="12" fill="#4a7a3a" font-weight="bold">③ 循环 i = 2 … n</text>
  <text x="80" y="266" font-size="11" fill="#444">cur = (i − 1) × (prev1 + prev2) mod 10⁹+7</text>
  <text x="80" y="284" font-size="11" fill="#444">prev2 = prev1</text>
  <text x="80" y="302" font-size="11" fill="#444">prev1 = cur</text>
  <text x="380" y="284" font-size="10" fill="#4a7a3a">← 滚动前移一格</text>

  <!-- loop arrow back up -->
  <path d="M 480 272 C 520 272, 520 232, 480 232" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="510" y="254" font-size="9" fill="#4a7a3a" text-anchor="middle">i++</text>

  <path d="M 280 324 L 280 344" stroke="#446688" stroke-width="1.8" marker-end="url(#arrDown)" fill="none" filter="url(#rough2)"/>

  <!-- ===== Step 4: return ===== -->
  <rect x="60" y="348" width="440" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="80" y="372" font-size="12" fill="#d6a040" font-weight="bold">④ 返回 prev1（= D(n)）</text>
  <text x="80" y="390" font-size="11" fill="#444">循环结束时 prev1 即为答案，已对 10⁹+7 取模</text>

  <!-- right side: complexity note -->
  <rect x="465" y="132" width="80" height="40" fill="none" stroke="none"/>
</svg>
