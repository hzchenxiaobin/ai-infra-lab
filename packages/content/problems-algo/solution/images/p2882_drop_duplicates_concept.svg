<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="400" fill="#fafafa"/>

  <text x="320" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">判重只看 email：保留首次出现，删掉其后再现</text>

  <!-- Left: input table -->
  <text x="141" y="72" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">customers（输入 · 6 行）</text>

  <rect x="26" y="80" width="58" height="26" fill="#446688" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="55" y="97" text-anchor="middle" font-size="9" fill="#ffffff" filter="url(#rough2)">customer_id</text>
  <rect x="84" y="80" width="66" height="26" fill="#446688" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="117" y="97" text-anchor="middle" font-size="10" fill="#ffffff" filter="url(#rough2)">name</text>
  <rect x="150" y="80" width="106" height="26" fill="#446688" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="203" y="97" text-anchor="middle" font-size="10" fill="#ffffff" filter="url(#rough2)">email ← 判重键</text>

  <!-- row 0 -->
  <rect x="26" y="106" width="58" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="55" y="123" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="84" y="106" width="66" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="117" y="123" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Ella</text>
  <rect x="150" y="106" width="106" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="203" y="123" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">emily@example.com</text>

  <!-- row 1 -->
  <rect x="26" y="132" width="58" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="55" y="149" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="84" y="132" width="66" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="117" y="149" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">David</text>
  <rect x="150" y="132" width="106" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="203" y="149" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">michael@example.com</text>

  <!-- row 2 -->
  <rect x="26" y="158" width="58" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="55" y="175" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="84" y="158" width="66" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="117" y="175" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Zachary</text>
  <rect x="150" y="158" width="106" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="203" y="175" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">sarah@example.com</text>

  <!-- row 3: Alice, first occurrence, keep -->
  <rect x="26" y="184" width="58" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="55" y="201" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="84" y="184" width="66" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="117" y="201" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Alice</text>
  <rect x="150" y="184" width="106" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="203" y="201" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">john@example.com</text>
  <text x="141" y="201" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <!-- row 4: Finn, duplicate, drop -->
  <rect x="26" y="210" width="58" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="55" y="227" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <rect x="84" y="210" width="66" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="117" y="227" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Finn</text>
  <rect x="150" y="210" width="106" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="203" y="227" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">john@example.com</text>
  <text x="141" y="227" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗</text>
  <path d="M 28 223 L 254 221" fill="none" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- row 5 -->
  <rect x="26" y="236" width="58" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="55" y="253" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <rect x="84" y="236" width="66" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="117" y="253" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Violet</text>
  <rect x="150" y="236" width="106" height="26" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="203" y="253" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">alice@example.com</text>

  <!-- legend -->
  <rect x="40" y="270" width="12" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="58" y="281" font-size="10" fill="#4a7a3a" filter="url(#rough2)">首次出现 → 保留</text>
  <rect x="165" y="270" width="12" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="183" y="281" font-size="10" fill="#b85450" filter="url(#rough2)">重复出现 → 丢弃</text>

  <!-- Middle: arrow + call -->
  <text x="317" y="126" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">按 email 判重</text>
  <path d="M 262 140 L 372 140" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="317" y="160" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">再犯 → 弃</text>

  <rect x="260" y="180" width="116" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="318" y="202" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">drop_duplicates</text>
  <text x="318" y="220" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">(subset=['email'],</text>
  <text x="318" y="238" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">keep='first')</text>

  <!-- Right: output table -->
  <text x="495" y="72" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">输出（5 行）</text>

  <rect x="380" y="80" width="58" height="26" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="409" y="97" text-anchor="middle" font-size="9" fill="#ffffff" filter="url(#rough2)">customer_id</text>
  <rect x="438" y="80" width="66" height="26" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="471" y="97" text-anchor="middle" font-size="10" fill="#ffffff" filter="url(#rough2)">name</text>
  <rect x="504" y="80" width="106" height="26" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="557" y="97" text-anchor="middle" font-size="10" fill="#ffffff" filter="url(#rough2)">email</text>

  <!-- out row 0 -->
  <rect x="380" y="106" width="58" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="409" y="123" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="438" y="106" width="66" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="471" y="123" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Ella</text>
  <rect x="504" y="106" width="106" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="557" y="123" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">emily@example.com</text>

  <!-- out row 1 -->
  <rect x="380" y="132" width="58" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="409" y="149" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="438" y="132" width="66" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="471" y="149" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">David</text>
  <rect x="504" y="132" width="106" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="557" y="149" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">michael@example.com</text>

  <!-- out row 2 -->
  <rect x="380" y="158" width="58" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="409" y="175" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="438" y="158" width="66" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="471" y="175" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Zachary</text>
  <rect x="504" y="158" width="106" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="557" y="175" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">sarah@example.com</text>

  <!-- out row 3: Alice kept -->
  <rect x="380" y="184" width="58" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="409" y="201" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="438" y="184" width="66" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="471" y="201" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Alice</text>
  <rect x="504" y="184" width="106" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="557" y="201" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">john@example.com</text>

  <!-- out row 4: Violet -->
  <rect x="380" y="210" width="58" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="409" y="227" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <rect x="438" y="210" width="66" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="471" y="227" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Violet</text>
  <rect x="504" y="210" width="106" height="26" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="557" y="227" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">alice@example.com</text>

  <text x="495" y="252" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">顺序 = 首次出现顺序</text>
  <text x="495" y="268" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">行索引 0,1,2,3,5（跳过 4）</text>

  <!-- Bottom warning -->
  <rect x="50" y="296" width="540" height="88" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="320" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">⚠️ 漏传 subset 的坑</text>
  <text x="320" y="342" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">不传 subset → 「整行完全相同」才算重复</text>
  <text x="320" y="362" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Alice 与 Finn 的 name、id 都不同 → 判不重 → 一行都删不掉（静默 WA）</text>
</svg>
