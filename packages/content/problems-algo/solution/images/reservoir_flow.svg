<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">蓄水池抽样算法流程：单遍扫描 + 1/c 概率替换</text>

  <!-- 开始 -->
  <rect x="230" y="48" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="14" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">reservoir=-1, c=0</text>

  <!-- 箭头到循环 -->
  <path d="M 280 80 L 280 104" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环框 -->
  <rect x="210" y="108" width="140" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="280" y="128" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">for i in 0..n-1</text>

  <!-- 箭头到判定1 -->
  <path d="M 280 140 L 280 168" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定1: nums[i]==target? -->
  <path d="M 280 172 L 360 206 L 280 240 L 200 206 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="204" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">nums[i]==target?</text>
  <text x="280" y="218" text-anchor="middle" font-size="10" fill="#888">菱形判定</text>

  <!-- 否分支：跳过，回到循环 -->
  <path d="M 200 206 L 150 206 L 150 123 L 210 123" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="156" y="200" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <text x="156" y="160" font-size="10" fill="#b85450">跳过（continue）</text>

  <!-- 是分支：c++ -->
  <path d="M 280 240 L 280 264" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="256" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="220" y="268" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="280" y="287" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">c = c + 1</text>

  <!-- 箭头到判定2 -->
  <path d="M 280 296 L 280 320" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定2: rand()%c==0? -->
  <path d="M 280 324 L 372 360 L 280 396 L 188 360 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="358" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">rand()%c == 0?</text>
  <text x="280" y="372" text-anchor="middle" font-size="10" fill="#888">概率 1/c</text>

  <!-- 否分支：不替换，回循环 -->
  <path d="M 188 360 L 120 360 L 120 123 L 210 123" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="128" y="354" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <text x="128" y="300" font-size="10" fill="#b85450">保持不变</text>

  <!-- 是分支：替换 -->
  <path d="M 372 360 L 440 360" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="354" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="440" y="344" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="490" y="365" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">reservoir = i</text>

  <!-- 替换后回循环 -->
  <path d="M 490 344 L 490 123 L 350 123" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环结束出口（从循环框右侧） -->
  <path d="M 350 123 L 520 123 L 520 60 L 330 60" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="438" y="90" width="84" height="22" fill="#fafafa" stroke="none" filter="url(#rough2)"/>
  <text x="480" y="106" text-anchor="middle" font-size="10" fill="#446688">i 扫完</text>

  <!-- 返回框 -->
  <rect x="420" y="44" width="110" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="475" y="65" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">return reservoir</text>

  <!-- 底部注解 -->
  <rect x="30" y="410" width="500" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="426" text-anchor="middle" font-size="10.5" fill="#b85450">只扫一遍、只存 reservoir 与 c 两个变量 → O(n) 时间、O(1) 额外空间，支持流式数据</text>
</svg>
