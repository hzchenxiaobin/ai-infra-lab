<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：OrderedStream(5) 依次插入 (3, 1, 2, 5, 4)</text>

  <!-- Table outer frame -->
  <rect x="12" y="40" width="556" height="300" fill="none" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- Header background -->
  <rect x="12" y="40" width="556" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="35" y="59" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">步骤</text>
  <text x="107" y="59" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">操作</text>
  <text x="260" y="59" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">values[1..5]</text>
  <text x="392" y="59" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">idKey==ptr</text>
  <text x="447" y="59" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">ptr</text>
  <text x="517" y="59" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">返回</text>

  <!-- Column separators -->
  <line x1="55" y1="40" x2="55" y2="340" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="160" y1="40" x2="160" y2="340" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="360" y1="40" x2="360" y2="340" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="425" y1="40" x2="425" y2="340" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="470" y1="40" x2="470" y2="340" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Values cell separators (5 cells of width 40 from x=160 to 360) -->
  <line x1="200" y1="40" x2="200" y2="340" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="240" y1="40" x2="240" y2="340" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="280" y1="40" x2="280" y2="340" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="320" y1="40" x2="320" y2="340" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>

  <!-- Row 0: init, y center 85 -->
  <text x="35" y="89" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">init</text>
  <text x="107" y="89" text-anchor="middle" font-size="10.5" fill="#333">OrderedStream(5)</text>
  <!-- all empty -->
  <text x="180" y="89" text-anchor="middle" font-size="11" fill="#bbb">·</text>
  <text x="220" y="89" text-anchor="middle" font-size="11" fill="#bbb">·</text>
  <text x="260" y="89" text-anchor="middle" font-size="11" fill="#bbb">·</text>
  <text x="300" y="89" text-anchor="middle" font-size="11" fill="#bbb">·</text>
  <text x="340" y="89" text-anchor="middle" font-size="11" fill="#bbb">·</text>
  <text x="392" y="89" text-anchor="middle" font-size="10.5" fill="#888">—</text>
  <text x="447" y="89" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="517" y="89" text-anchor="middle" font-size="10.5" fill="#888">—</text>
  <line x1="12" y1="100" x2="568" y2="100" stroke="#446688" stroke-width="0.5" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- Row 1: insert(3,ccccc), y center 125 -->
  <text x="35" y="129" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">①</text>
  <text x="107" y="129" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">insert(3,"ccccc")</text>
  <text x="180" y="129" text-anchor="middle" font-size="10.5" fill="#bbb">·</text>
  <text x="220" y="129" text-anchor="middle" font-size="10.5" fill="#bbb">·</text>
  <rect x="244" y="115" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="260" y="129" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">ccccc</text>
  <text x="300" y="129" text-anchor="middle" font-size="10.5" fill="#bbb">·</text>
  <text x="340" y="129" text-anchor="middle" font-size="10.5" fill="#bbb">·</text>
  <text x="392" y="129" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3≠1 否</text>
  <text x="447" y="129" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="517" y="129" text-anchor="middle" font-size="10.5" fill="#888">[]</text>
  <line x1="12" y1="140" x2="568" y2="140" stroke="#446688" stroke-width="0.5" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- Row 2: insert(1,aaaaa), y center 165 -->
  <text x="35" y="169" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">②</text>
  <text x="107" y="169" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">insert(1,"aaaaa")</text>
  <rect x="164" y="155" width="32" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="180" y="169" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">aaaaa</text>
  <text x="220" y="169" text-anchor="middle" font-size="10.5" fill="#bbb">·</text>
  <text x="260" y="169" text-anchor="middle" font-size="9.5" fill="#333">ccccc</text>
  <text x="300" y="169" text-anchor="middle" font-size="10.5" fill="#bbb">·</text>
  <text x="340" y="169" text-anchor="middle" font-size="10.5" fill="#bbb">·</text>
  <text x="392" y="169" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1==1 是</text>
  <text x="447" y="169" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">1→2</text>
  <text x="517" y="169" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">["aaaaa"]</text>
  <line x1="12" y1="180" x2="568" y2="180" stroke="#446688" stroke-width="0.5" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- Row 3: insert(2,bbbbb), y center 205 -->
  <text x="35" y="209" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">③</text>
  <text x="107" y="209" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">insert(2,"bbbbb")</text>
  <text x="180" y="209" text-anchor="middle" font-size="9.5" fill="#333">aaaaa</text>
  <rect x="204" y="195" width="32" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="220" y="209" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">bbbbb</text>
  <rect x="244" y="195" width="32" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="260" y="209" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">ccccc</text>
  <text x="300" y="209" text-anchor="middle" font-size="10.5" fill="#bbb">·</text>
  <text x="340" y="209" text-anchor="middle" font-size="10.5" fill="#bbb">·</text>
  <text x="392" y="209" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2==2 是</text>
  <text x="447" y="209" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">2→4</text>
  <text x="517" y="205" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">["bbbbb",</text>
  <text x="517" y="216" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">"ccccc"]</text>
  <line x1="12" y1="220" x2="568" y2="220" stroke="#446688" stroke-width="0.5" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- Row 4: insert(5,eeeee), y center 245 -->
  <text x="35" y="249" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">④</text>
  <text x="107" y="249" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">insert(5,"eeeee")</text>
  <text x="180" y="249" text-anchor="middle" font-size="9.5" fill="#333">aaaaa</text>
  <text x="220" y="249" text-anchor="middle" font-size="9.5" fill="#333">bbbbb</text>
  <text x="260" y="249" text-anchor="middle" font-size="9.5" fill="#333">ccccc</text>
  <text x="300" y="249" text-anchor="middle" font-size="10.5" fill="#bbb">·</text>
  <rect x="324" y="235" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="340" y="249" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">eeeee</text>
  <text x="392" y="249" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">5≠4 否</text>
  <text x="447" y="249" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="517" y="249" text-anchor="middle" font-size="10.5" fill="#888">[]</text>
  <line x1="12" y1="260" x2="568" y2="260" stroke="#446688" stroke-width="0.5" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- Row 5: insert(4,ddddd), y center 285 -->
  <text x="35" y="289" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">⑤</text>
  <text x="107" y="289" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">insert(4,"ddddd")</text>
  <text x="180" y="289" text-anchor="middle" font-size="9.5" fill="#333">aaaaa</text>
  <text x="220" y="289" text-anchor="middle" font-size="9.5" fill="#333">bbbbb</text>
  <text x="260" y="289" text-anchor="middle" font-size="9.5" fill="#333">ccccc</text>
  <rect x="284" y="275" width="32" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="300" y="289" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">ddddd</text>
  <rect x="324" y="275" width="32" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="340" y="289" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">eeeee</text>
  <text x="392" y="289" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">4==4 是</text>
  <text x="447" y="289" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">4→6</text>
  <text x="517" y="285" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">["ddddd",</text>
  <text x="517" y="296" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">"eeeee"]</text>

  <!-- Bottom note -->
  <text x="290" y="360" text-anchor="middle" font-size="10.5" fill="#555">蓝色=本次新写入；绿框=本次被收割吐出的块；ptr 单调递增 1→2→4→6，从不回退</text>
  <text x="290" y="372" text-anchor="middle" font-size="10.5" fill="#888">返回长度之和 = 1+2+0+0+2 = 5 = n，每块恰好被收集一次</text>
</svg>
