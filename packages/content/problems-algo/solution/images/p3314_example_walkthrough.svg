<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="760" height="640" fill="#fafafa"/>

  <text x="380" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：把「末尾连续 1」的最高位清零，就得到最小 ans</text>
  <text x="380" y="40" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">bit0 在最右；红 ✕ = 本步清掉的位（末尾连续 1 中最高的那一个）</text>

  <!-- ===== 示例 1 ===== -->
  <rect x="20" y="54" width="720" height="262" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="380" y="76" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 1：nums = [2, 3, 5, 7] → ans = [−1, 1, 4, 3]</text>

  <!-- y=2：无解 -->
  <text x="78" y="110" text-anchor="end" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">y = 2</text>
  <rect x="322" y="92" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="338" y="110" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="358" y="92" width="32" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="374" y="110" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <path d="M 400 105 L 452 105" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="470" y="111" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1</text>
  <text x="100" y="132" font-size="9" fill="#b85450" filter="url(#rough2)">2 是偶数：末尾 0 个 1，没有可清的位 → 无解（唯一的偶质数）</text>

  <!-- y=3 → 1 -->
  <text x="78" y="166" text-anchor="end" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">y = 3</text>
  <rect x="322" y="148" width="32" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="338" y="166" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="358" y="148" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="374" y="166" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">1</text>
  <path d="M 329 153 L 347 169 M 347 153 L 329 169" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <path d="M 400 161 L 452 161" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="552" y="148" width="32" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="568" y="166" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="588" y="148" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="604" y="166" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="640" y="166" font-size="12" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">= 1</text>
  <text x="100" y="188" font-size="9" fill="#4a7a3a" filter="url(#rough2)">1 | 2 = 3 ✓（末尾 2 个连续 1，清最高的 bit1）</text>

  <!-- y=5 → 4 -->
  <text x="78" y="222" text-anchor="end" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">y = 5</text>
  <rect x="286" y="204" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="302" y="222" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="322" y="204" width="32" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="338" y="222" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="358" y="204" width="32" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="374" y="222" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <path d="M 365 209 L 383 225 M 383 209 L 365 225" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <path d="M 400 217 L 452 217" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="516" y="204" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="532" y="222" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="552" y="204" width="32" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="568" y="222" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="588" y="204" width="32" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="604" y="222" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="640" y="222" font-size="12" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">= 4</text>
  <text x="100" y="244" font-size="9" fill="#4a7a3a" filter="url(#rough2)">4 | 5 = 5 ✓（末尾只有 1 个 1，只能清 bit0）</text>

  <!-- y=7 → 3 -->
  <text x="78" y="278" text-anchor="end" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">y = 7</text>
  <rect x="286" y="260" width="32" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="302" y="278" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="322" y="260" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="338" y="278" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="358" y="260" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="374" y="278" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">1</text>
  <path d="M 293 265 L 311 281 M 311 265 L 293 281" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <path d="M 400 273 L 452 273" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="516" y="260" width="32" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="532" y="278" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="552" y="260" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="568" y="278" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="588" y="260" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="604" y="278" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="640" y="278" font-size="12" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">= 3</text>
  <text x="100" y="300" font-size="9" fill="#4a7a3a" filter="url(#rough2)">3 | 4 = 7 ✓（末尾 3 个连续 1，清最高的 bit2）</text>

  <!-- ===== 示例 2 ===== -->
  <rect x="20" y="328" width="720" height="220" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="380" y="350" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 2：nums = [11, 13, 31] → ans = [9, 12, 15]</text>

  <!-- y=11 → 9 -->
  <text x="78" y="384" text-anchor="end" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">y = 11</text>
  <rect x="250" y="366" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="266" y="384" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="286" y="366" width="32" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="302" y="384" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="322" y="366" width="32" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="338" y="384" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="358" y="366" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="374" y="384" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">1</text>
  <path d="M 329 371 L 347 387 M 347 371 L 329 387" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <path d="M 400 379 L 452 379" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="480" y="366" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="496" y="384" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="516" y="366" width="32" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="532" y="384" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="552" y="366" width="32" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="568" y="384" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="588" y="366" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="604" y="384" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="640" y="384" font-size="12" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">= 9</text>
  <text x="100" y="406" font-size="9" fill="#4a7a3a" filter="url(#rough2)">9 | 10 = 11 ✓（末尾 2 个连续 1，清最高的 bit1）</text>

  <!-- y=13 → 12 -->
  <text x="78" y="440" text-anchor="end" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">y = 13</text>
  <rect x="250" y="422" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="266" y="440" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="286" y="422" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="302" y="440" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="322" y="422" width="32" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="338" y="440" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="358" y="422" width="32" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="374" y="440" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <path d="M 365 427 L 383 443 M 383 427 L 365 443" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <path d="M 400 435 L 452 435" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="480" y="422" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="496" y="440" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="516" y="422" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="532" y="440" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="552" y="422" width="32" height="26" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="568" y="440" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">0</text>
  <rect x="588" y="422" width="32" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="604" y="440" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="640" y="440" font-size="12" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">= 12</text>
  <text x="100" y="462" font-size="9" fill="#4a7a3a" filter="url(#rough2)">12 | 13 = 13 ✓（末尾只有 1 个 1，只能清 bit0）</text>

  <!-- y=31 → 15 -->
  <text x="78" y="496" text-anchor="end" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">y = 31</text>
  <rect x="214" y="478" width="32" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="496" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="250" y="478" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="266" y="496" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="286" y="478" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="302" y="496" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="322" y="478" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="338" y="496" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="358" y="478" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="374" y="496" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">1</text>
  <path d="M 221 483 L 239 499 M 239 483 L 221 499" stroke="#b85450" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <path d="M 400 491 L 452 491" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="444" y="478" width="32" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="460" y="496" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="480" y="478" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="496" y="496" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="516" y="478" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="532" y="496" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="552" y="478" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="568" y="496" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="588" y="478" width="32" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="604" y="496" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="640" y="496" font-size="12" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">= 15</text>
  <text x="100" y="518" font-size="9" fill="#4a7a3a" filter="url(#rough2)">15 | 16 = 31 ✓（全 1 数：清掉最高位，恰剩一半）</text>

  <!-- 底部图例 -->
  <rect x="20" y="560" width="720" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="380" y="582" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">图例：橙色 = 末尾连续的 1；红 ✕ = 本步清掉的位（连续 1 中最高的那一个）</text>
  <text x="380" y="602" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">清掉的位变成 0 后，新数末尾的连续 1 恰好比原来少一个；也只有这样，x 和 x+1 的 OR 才能拼回 y</text>
</svg>
