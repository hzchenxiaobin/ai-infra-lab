<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：intervals = [[0,30],[5,10],[15,20]]</text>

  <!-- table header -->
  <rect x="24" y="48" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="59" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">当前会议</text>
  <rect x="94" y="48" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="149" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">判断 heap[0]≤s</text>
  <rect x="204" y="48" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="264" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">操作</text>
  <rect x="324" y="48" width="130" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="389" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">堆（结束时刻）</text>
  <rect x="454" y="48" width="82" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="495" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">房间数峰值</text>

  <!-- row 1: [0,30] -->
  <rect x="24" y="74" width="70" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="59" y="96" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">[0,30]</text>
  <rect x="94" y="74" width="110" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="149" y="96" text-anchor="middle" font-size="11" fill="#888">堆空</text>
  <rect x="204" y="74" width="120" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="264" y="96" text-anchor="middle" font-size="11" fill="#666">push(30)</text>
  <rect x="324" y="74" width="130" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="389" y="96" text-anchor="middle" font-size="12" fill="#333">[30]</text>
  <rect x="454" y="74" width="82" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="495" y="96" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <!-- row 2: [5,10] -->
  <rect x="24" y="108" width="70" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="59" y="130" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">[5,10]</text>
  <rect x="94" y="108" width="110" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="149" y="130" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">30 &gt; 5 否</text>
  <rect x="204" y="108" width="120" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="264" y="130" text-anchor="middle" font-size="11" fill="#b85450">push(10)，新开</text>
  <rect x="324" y="108" width="130" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="389" y="130" text-anchor="middle" font-size="12" fill="#333">[10, 30]</text>
  <rect x="454" y="108" width="82" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="495" y="130" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>

  <!-- row 3: [15,20] -->
  <rect x="24" y="142" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="59" y="164" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">[15,20]</text>
  <rect x="94" y="142" width="110" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="149" y="164" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">10 ≤ 15 是</text>
  <rect x="204" y="142" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="264" y="164" text-anchor="middle" font-size="11" fill="#4a7a3a">pop(10)→push(20)</text>
  <rect x="324" y="142" width="130" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="389" y="164" text-anchor="middle" font-size="12" fill="#333">[20, 30]</text>
  <rect x="454" y="142" width="82" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="495" y="164" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- result -->
  <rect x="24" y="190" width="512" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="216" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">最终 len(heap) = 2 → 最少需要 2 间会议室</text>

  <!-- timeline viz -->
  <text x="280" y="252" text-anchor="middle" font-size="11.5" fill="#888">时间轴占用情况（房间 1 = A，房间 2 = B 复用给 C）</text>
  <!-- axis -->
  <line x1="60" y1="290" x2="520" y2="290" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <g font-size="9.5" fill="#888" text-anchor="middle">
    <line x1="60" y1="286" x2="60" y2="294" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="60" y="306">0</text>
    <line x1="213" y1="286" x2="213" y2="294" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="213" y="306">10</text>
    <line x1="367" y1="286" x2="367" y2="294" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="367" y="306">20</text>
    <line x1="520" y1="286" x2="520" y2="294" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="520" y="306">30</text>
  </g>
  <!-- room1 A[0,30] -->
  <rect x="60" y="320" width="460" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="68" y="334" font-size="11" fill="#b85450" font-weight="bold">房间1: A [0,30]</text>
  <!-- room2 B[5,10] then C[15,20] -->
  <rect x="137" y="346" width="76" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="145" y="360" font-size="10" fill="#446688" font-weight="bold">B[5,10]</text>
  <rect x="290" y="346" width="76" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="298" y="360" font-size="10" fill="#4a7a3a" font-weight="bold">C[15,20]</text>
  <text x="68" y="360" font-size="10.5" fill="#888">房间2:</text>
  <!-- reuse note -->
  <text x="280" y="386" text-anchor="middle" font-size="10.5" fill="#4a7a3a">B 在 10 结束，C 在 15 才开始 → 房间2 可复用，无需第三间</text>
</svg>
