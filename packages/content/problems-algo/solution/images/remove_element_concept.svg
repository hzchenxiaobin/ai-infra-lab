<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title + val badge -->
  <text x="230" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">快慢双指针：判定条件 nums[fast] != val</text>
  <rect x="430" y="12" width="80" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="470" y="30" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">val = 2</text>

  <!-- ===== Scenario A: == val → skip ===== -->
  <text x="40" y="62" font-size="12" fill="#888">情况一：等于 val，跳过</text>

  <!-- index labels -->
  <text x="196" y="80" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">slow</text>
  <text x="196" y="64" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">fast</text>

  <!-- cells row A: [3, 1, 2, 2, 3, 0] fast=slow=2 -->
  <rect x="76" y="86" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="107" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="124" y="86" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="107" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="172" y="86" width="48" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="196" y="107" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="220" y="86" width="48" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="244" y="107" text-anchor="middle" font-size="14" fill="#999">2</text>
  <rect x="268" y="86" width="48" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="292" y="107" text-anchor="middle" font-size="14" fill="#999">3</text>
  <rect x="316" y="86" width="48" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="340" y="107" text-anchor="middle" font-size="14" fill="#999">0</text>

  <!-- pointer arrows A -->
  <path d="M 196 70 L 196 86" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 196 82 L 196 86" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- comparison A -->
  <text x="280" y="136" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">nums[fast] = 2 = val</text>
  <text x="220" y="152" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">→ 等于 val，跳过，slow 不动</text>

  <!-- ===== Scenario B: != val → write ===== -->
  <text x="40" y="190" font-size="12" fill="#888">情况二：不等于 val，写入</text>

  <!-- index labels B -->
  <text x="196" y="208" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">slow</text>
  <text x="292" y="208" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">fast</text>

  <!-- cells row B: [3, 1, ?, 2, 3, 0] fast=4 slow=2 -->
  <rect x="76" y="214" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="235" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="124" y="214" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="235" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="172" y="214" width="48" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="196" y="235" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">?</text>
  <rect x="220" y="214" width="48" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="244" y="235" text-anchor="middle" font-size="14" fill="#999">2</text>
  <rect x="268" y="214" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="292" y="235" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="316" y="214" width="48" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="340" y="235" text-anchor="middle" font-size="14" fill="#999">0</text>

  <!-- pointer arrows B -->
  <path d="M 196 210 L 196 214" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 292 210 L 292 214" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- write arrow from fast to slow -->
  <path d="M 292 250 Q 244 266 200 250" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="246" y="262" text-anchor="middle" font-size="10" fill="#4a7a3a">覆写</text>

  <!-- comparison B -->
  <text x="160" y="280" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">nums[fast] = 3</text>
  <text x="300" y="280" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">val = 2</text>
  <text x="240" y="296" text-anchor="middle" font-size="11" fill="#82b366" font-weight="bold">≠ → 写入 nums[slow] = 3, slow++</text>

  <!-- Core idea box -->
  <rect x="40" y="312" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="334" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">核心直觉：val 是固定的判定基准，直接与 nums[fast] 比较</text>
  <text x="280" y="354" text-anchor="middle" font-size="11" fill="#666">与 26 题不同：无需回看 slow−1，因为这里要删的是"指定值"而非"重复值"</text>
</svg>
