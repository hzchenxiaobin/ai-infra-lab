<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">索引约束双指针：偶下标放偶数、奇下标放奇数</text>

  <!-- ===== Goal: index parity coloring ===== -->
  <text x="40" y="48" font-size="12" fill="#888">目标：nums[i] 奇偶性 = i 奇偶性（蓝=偶下标须偶数，粉=奇下标须奇数）</text>

  <!-- parity labels above cells -->
  <text x="100" y="66" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">偶</text>
  <text x="148" y="66" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">奇</text>
  <text x="196" y="66" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">偶</text>
  <text x="244" y="66" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">奇</text>
  <text x="292" y="66" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">偶</text>
  <text x="340" y="66" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">奇</text>

  <!-- index numbers -->
  <text x="100" y="82" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="148" y="82" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="196" y="82" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="244" y="82" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="292" y="82" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <text x="340" y="82" text-anchor="middle" font-size="9" fill="#aaa">5</text>

  <!-- cells: [4,2,5,7,8,1]; fill=index parity; idx1&idx2 mismatch (thick stroke) -->
  <rect x="76" y="88" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="108" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <rect x="124" y="88" width="48" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="108" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="172" y="88" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="196" y="108" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <rect x="220" y="88" width="48" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="244" y="108" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">7</text>
  <rect x="268" y="88" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="292" y="108" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">8</text>
  <rect x="316" y="88" width="48" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="108" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <!-- wrong markers -->
  <text x="148" y="132" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">偶误入奇 ✗</text>
  <text x="196" y="132" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">奇误入偶 ✗</text>

  <!-- ===== Dual-track pointers + swap ===== -->
  <text x="40" y="156" font-size="12" fill="#888">双指针分轨：i 扫偶下标找误入的奇数，j 扫奇下标找误入的偶数</text>

  <!-- pointer labels -->
  <text x="148" y="174" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">j↓</text>
  <text x="196" y="174" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">i↓</text>

  <!-- swap arrow between idx1(148) and idx2(196) -->
  <path d="M 148 178 Q 172 194 196 178" stroke="#d6a040" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 196 178 Q 172 194 148 178" stroke="#d6a040" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="172" y="194" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">swap</text>

  <!-- ===== After swap ===== -->
  <text x="40" y="214" font-size="12" fill="#888">交换后：nums[2]=2（偶）✓  nums[1]=5（奇）✓  各归其位</text>

  <!-- index numbers -->
  <text x="100" y="230" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="148" y="230" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="196" y="230" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="244" y="230" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="292" y="230" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <text x="340" y="230" text-anchor="middle" font-size="9" fill="#aaa">5</text>

  <!-- cells: [4,5,2,7,8,1] all correct (green) -->
  <rect x="76" y="236" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="256" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <rect x="124" y="236" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="256" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <rect x="172" y="236" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="196" y="256" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="220" y="236" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="244" y="256" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">7</text>
  <rect x="268" y="236" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="292" y="256" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">8</text>
  <rect x="316" y="236" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="256" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <text x="220" y="280" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">所有下标奇偶性匹配 ✓</text>

  <!-- ===== Dual-track illustration ===== -->
  <text x="40" y="302" font-size="12" fill="#888">指针轨道：i 仅走偶下标 0→2→4，j 仅走奇下标 1→3→5</text>

  <!-- i track -->
  <text x="62" y="324" font-size="10" fill="#446688" font-weight="bold">i →</text>
  <path d="M 100 320 L 292 320" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <circle cx="100" cy="320" r="3" fill="#446688" filter="url(#rough2)"/>
  <circle cx="196" cy="320" r="3" fill="#446688" filter="url(#rough2)"/>
  <circle cx="292" cy="320" r="3" fill="#446688" filter="url(#rough2)"/>
  <text x="100" y="312" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="196" y="312" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="292" y="312" text-anchor="middle" font-size="9" fill="#aaa">4</text>

  <!-- j track -->
  <text x="62" y="348" font-size="10" fill="#b85450" font-weight="bold">j →</text>
  <path d="M 148 344 L 340 344" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <circle cx="148" cy="344" r="3" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="244" cy="344" r="3" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="340" cy="344" r="3" fill="#b85450" filter="url(#rough2)"/>
  <text x="148" y="360" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="244" y="360" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="340" y="360" text-anchor="middle" font-size="9" fill="#aaa">5</text>

  <!-- Core idea box -->
  <rect x="40" y="370" width="480" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="388" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">鸽笼原理：n/2 偶数 ↔ n/2 偶下标，误位偶数与误位奇数成对出现，交换即各归其位</text>
</svg>
