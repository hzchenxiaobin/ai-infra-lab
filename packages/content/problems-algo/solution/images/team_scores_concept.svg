<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：一场比赛拆成两条 (team_id, points) 记录</text>

  <!-- Top: point rules -->
  <text x="280" y="54" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">积分规则：胜 3 分 / 平 1 分 / 负 0 分</text>

  <rect x="70" y="62" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="130" y="80" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">胜（进球多）</text>
  <text x="130" y="96" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">+3 分</text>

  <rect x="220" y="62" width="120" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="80" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">平（进球同）</text>
  <text x="280" y="96" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">+1 分</text>

  <rect x="370" y="62" width="120" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="430" y="80" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">负（进球少）</text>
  <text x="430" y="96" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">+0 分</text>

  <!-- Middle: a Matches row -->
  <text x="280" y="132" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">Matches 表一行（一场比赛）</text>

  <rect x="60" y="140" width="440" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="92" y="160" font-size="9.5" fill="#888" font-weight="bold">match_id</text>
  <text x="170" y="160" font-size="9.5" fill="#446688" font-weight="bold">host_team</text>
  <text x="270" y="160" font-size="9.5" fill="#b85450" font-weight="bold">guest_team</text>
  <text x="370" y="160" font-size="9.5" fill="#4a7a3a" font-weight="bold">host_goals</text>
  <text x="470" y="160" font-size="9.5" fill="#d6a040" font-weight="bold">guest_goals</text>

  <rect x="60" y="174" width="440" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="92" y="191" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="170" y="191" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">10</text>
  <text x="270" y="191" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">20</text>
  <text x="370" y="191" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="470" y="191" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">0</text>

  <!-- column separators -->
  <line x1="120" y1="140" x2="120" y2="200" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="220" y1="140" x2="220" y2="200" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="320" y1="140" x2="320" y2="200" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="420" y1="140" x2="420" y2="200" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- split arrows: host_team(10) and guest_team(20) -->
  <path d="M170 200 C 150 224, 150 238, 170 258" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M270 200 C 290 224, 290 238, 290 258" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="148" y="232" font-size="9.5" fill="#446688" font-weight="bold">主队视角</text>
  <text x="296" y="232" font-size="9.5" fill="#b85450" font-weight="bold">客队视角</text>

  <!-- Bottom left: host split row -->
  <text x="115" y="252" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">主队记录</text>
  <rect x="60" y="258" width="120" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="120" y="276" text-anchor="middle" font-size="10" fill="#333">team_id = host_team = 10</text>
  <text x="120" y="292" text-anchor="middle" font-size="10" fill="#333">3 &gt; 0 → 胜</text>
  <text x="120" y="302" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">points = 3</text>

  <!-- Bottom right: guest split row -->
  <text x="345" y="252" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">客队记录</text>
  <rect x="290" y="258" width="120" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="350" y="276" text-anchor="middle" font-size="10" fill="#333">team_id = guest_team = 20</text>
  <text x="350" y="292" text-anchor="middle" font-size="10" fill="#333">0 &lt; 3 → 负</text>
  <text x="350" y="302" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">points = 0</text>

  <!-- merge arrows down to UNION ALL -->
  <path d="M120 306 C 120 326, 220 326, 240 338" stroke="#d6a040" stroke-width="1.8" fill="none" stroke-dasharray="4,3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M350 306 C 350 326, 250 326, 240 338" stroke="#d6a040" stroke-width="1.8" fill="none" stroke-dasharray="4,3" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <text x="280" y="332" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">UNION ALL：每场比赛 → 2 行 (team_id, points)</text>

  <rect x="150" y="340" width="260" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="180" y="359" font-size="10" fill="#446688" font-weight="bold">team_id</text>
  <text x="320" y="359" font-size="10" fill="#b85450" font-weight="bold">points</text>
  <line x1="250" y1="340" x2="250" y2="370" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- bottom note -->
  <rect x="30" y="378" width="500" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="50" y="396" font-size="10" fill="#333">核心：把「一场比赛两个队」拆成「两条队记录」，再按 <tspan fill="#446688" font-weight="bold">team_id</tspan> 分组求和 <tspan fill="#4a7a3a" font-weight="bold">SUM(points)</tspan></text>
</svg>
