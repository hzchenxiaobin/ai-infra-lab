<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrS" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">回溯流程：DFS(idx, cnt) — 对每个请求二选一</text>

  <!-- Root node -->
  <rect x="210" y="40" width="140" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="11" fill="#333">idx=0 cnt=0 delta=[0,0,0]</text>

  <!-- Level 1: skip / take [0,1] -->
  <path d="M250,72 Q180,88 150,100" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arrS)" filter="url(#rough2)"/>
  <text x="175" y="86" font-size="9" fill="#888">skip</text>
  <path d="M310,72 Q380,88 410,100" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="375" y="86" font-size="9" fill="#4a7a3a">take</text>

  <rect x="70" y="100" width="160" height="30" fill="#f5f5f5" stroke="#888" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="150" y="119" text-anchor="middle" font-size="10" fill="#666">idx=1 cnt=0 [0,0,0]</text>

  <rect x="330" y="100" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="420" y="119" text-anchor="middle" font-size="10" fill="#333">idx=1 cnt=1 [−1,1,0]</text>

  <!-- Level 2 from skip branch -->
  <path d="M120,130 Q100,150 90,162" fill="none" stroke="#888" stroke-width="1.2" marker-end="url(#arrS)" filter="url(#rough2)"/>
  <path d="M180,130 Q200,150 210,162" fill="none" stroke="#888" stroke-width="1.2" marker-end="url(#arrS)" filter="url(#rough2)"/>

  <rect x="20" y="162" width="120" height="26" fill="#f5f5f5" stroke="#888" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="80" y="179" text-anchor="middle" font-size="9" fill="#666">idx=2 cnt=0</text>
  <rect x="160" y="162" width="120" height="26" fill="#f5f5f5" stroke="#888" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="220" y="179" text-anchor="middle" font-size="9" fill="#666">idx=2 cnt=0</text>

  <!-- Level 2 from take branch -->
  <path d="M380,130 Q360,150 350,162" fill="none" stroke="#888" stroke-width="1.2" marker-end="url(#arrS)" filter="url(#rough2)"/>
  <path d="M440,130 Q460,150 470,162" fill="none" stroke="#4a7a3a" stroke-width="1.2" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="300" y="162" width="120" height="26" fill="#f5f5f5" stroke="#888" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="360" y="179" text-anchor="middle" font-size="9" fill="#666">idx=2 cnt=1</text>
  <rect x="440" y="162" width="116" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="498" y="179" text-anchor="middle" font-size="9" fill="#333">idx=2 cnt=2</text>

  <!-- Highlight answer path -->
  <rect x="440" y="162" width="116" height="26" fill="none" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="498" y="155" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">★ delta全零</text>

  <!-- Pruning box -->
  <rect x="40" y="210" width="240" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="232" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">剪枝条件</text>
  <text x="160" y="250" text-anchor="middle" font-size="10.5" fill="#444">cnt + (m − idx) ≤ ans</text>
  <text x="160" y="262" text-anchor="middle" font-size="9.5" fill="#888">剩余全取也无法超越 → 停止</text>

  <!-- Check box -->
  <rect x="310" y="210" width="210" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="415" y="232" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">每个节点都检查</text>
  <text x="415" y="250" text-anchor="middle" font-size="10.5" fill="#444">delta 全零 → 更新 ans</text>
  <text x="415" y="262" text-anchor="middle" font-size="9.5" fill="#888">不等到叶子才判定</text>

  <!-- Steps box -->
  <rect x="40" y="284" width="480" height="124" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="306" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">DFS 每步动作</text>
  <text x="60" y="328" font-size="11" fill="#333">① 检查当前 delta 是否全零 → 是则 ans = max(ans, cnt)</text>
  <text x="60" y="348" font-size="11" fill="#333">② 若 idx == m（已处理完所有请求）→ return</text>
  <text x="60" y="368" font-size="11" fill="#333">③ 剪枝：cnt + (m − idx) ≤ ans → return（不可能更优）</text>
  <text x="60" y="388" font-size="11" fill="#333">④ 分支 A：跳过 requests[idx]，dfs(idx+1, cnt)</text>
  <text x="60" y="402" font-size="11" fill="#4a7a3a">⑤ 分支 B：取 requests[idx]，改 delta，dfs(idx+1, cnt+1)，回溯 delta</text>
</svg>
