<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：离散化 + 树状数组，从左到右一趟统计</text>

  <!-- 主流程：左侧竖排 -->
  <rect x="60" y="36" width="200" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="160" y="55" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">① 算 pref[0..n]：偶 +b / 奇 −a（long long）</text>

  <path d="M 160 66 L 160 80" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="82" width="200" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="160" y="101" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">② 离散化：pref 全体排序去重，值 → 秩</text>

  <path d="M 160 112 L 160 126" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="128" width="200" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="160" y="147" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">③ j 从 0 到 n 取 pref[j]，r = rank(pref[j])</text>

  <path d="M 160 158 L 160 172" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="174" width="200" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="160" y="189" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">④ 查询：ans += seen − query(r−1)</text>
  <text x="160" y="203" text-anchor="middle" font-size="8" fill="#4a7a3a" filter="url(#rough2)">统计已插入值中 ≥ pref[j] 的个数 ← 核心</text>

  <path d="M 160 208 L 160 222" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="224" width="200" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="160" y="243" text-anchor="middle" font-size="9.5" fill="#7a5c1a" filter="url(#rough2)">⑤ 插入：update(r)，seen++</text>

  <path d="M 160 254 L 160 266" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="160,268 232,296 160,324 88,296" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="160" y="300" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">j ≤ n ?</text>

  <path d="M 232 296 H 270 V 143 H 266" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="244" y="288" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <text x="278" y="220" font-size="8" fill="#999" filter="url(#rough2)">回到 ③</text>

  <path d="M 160 324 L 160 338" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="170" y="332" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="92" y="340" width="136" height="17" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="160" y="352" text-anchor="middle" font-size="9" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 ans（long long）</text>

  <!-- 右侧：BIT 语义面板 -->
  <rect x="300" y="44" width="196" height="118" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="398" y="62" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">BIT 语义小抄</text>
  <text x="398" y="80" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">query(r−1) = 已插入值中 &lt; pref[j] 的个数</text>
  <text x="398" y="98" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">seen − query(r−1) = ≥ pref[j] 的个数</text>
  <text x="398" y="116" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">恰好每个 i&lt;j 且 pref[i] ≥ pref[j] 的对</text>
  <text x="398" y="134" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">seen = 目前已插入的 pref 值总数</text>
  <text x="398" y="152" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">（先查询后插入，j 自己不会算进去）</text>

  <rect x="300" y="172" width="196" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="398" y="190" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠️ ≤ 含等号</text>
  <text x="398" y="207" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">pref 相等的前缀对也合法，</text>
  <text x="398" y="222" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">「大于等于」一个都不能漏</text>

  <rect x="300" y="240" width="196" height="82" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="398" y="258" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">复杂度与数据范围</text>
  <text x="398" y="275" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">离散化 O(n log n)</text>
  <text x="398" y="291" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">n+1 次 BIT 查询/插入 O(n log n)</text>
  <text x="398" y="308" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">答案上界 (n+1)n/2 ≈ 5×10⁹ 须 long long</text>
  <text x="398" y="320" text-anchor="middle" font-size="7.5" fill="#999" filter="url(#rough2)">pref 值域 ±10¹⁴，同样 64 位</text>
</svg>
