<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：从左到右扫描，首次遇到「已见过」的字符即答案</text>

  <!-- string cells: s = "abccbaacz", indices 0..8 -->
  <!-- i=0 a (added) -->
  <rect x="66" y="56" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="88" y="86" text-anchor="middle" font-size="18" fill="#333">a</text>
  <text x="88" y="118" text-anchor="middle" font-size="10" fill="#888">0</text>
  <!-- i=1 b (added) -->
  <rect x="114" y="56" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="136" y="86" text-anchor="middle" font-size="18" fill="#333">b</text>
  <text x="136" y="118" text-anchor="middle" font-size="10" fill="#888">1</text>
  <!-- i=2 c (added) -->
  <rect x="162" y="56" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="184" y="86" text-anchor="middle" font-size="18" fill="#333">c</text>
  <text x="184" y="118" text-anchor="middle" font-size="10" fill="#888">2</text>
  <!-- i=3 c RED HIT -->
  <rect x="210" y="56" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="232" y="86" text-anchor="middle" font-size="18" fill="#b85450" font-weight="bold">c</text>
  <text x="232" y="118" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3</text>
  <!-- i=4..8 gray not reached -->
  <rect x="258" y="56" width="44" height="44" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="86" text-anchor="middle" font-size="18" fill="#aaa">b</text>
  <text x="280" y="118" text-anchor="middle" font-size="10" fill="#bbb">4</text>
  <rect x="306" y="56" width="44" height="44" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="328" y="86" text-anchor="middle" font-size="18" fill="#aaa">a</text>
  <text x="328" y="118" text-anchor="middle" font-size="10" fill="#bbb">5</text>
  <rect x="354" y="56" width="44" height="44" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="376" y="86" text-anchor="middle" font-size="18" fill="#aaa">a</text>
  <text x="376" y="118" text-anchor="middle" font-size="10" fill="#bbb">6</text>
  <rect x="402" y="56" width="44" height="44" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="424" y="86" text-anchor="middle" font-size="18" fill="#aaa">c</text>
  <text x="424" y="118" text-anchor="middle" font-size="10" fill="#bbb">7</text>
  <rect x="450" y="56" width="44" height="44" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="472" y="86" text-anchor="middle" font-size="18" fill="#aaa">z</text>
  <text x="472" y="118" text-anchor="middle" font-size="10" fill="#bbb">8</text>

  <!-- arrow under cell 3 pointing down -->
  <path d="M 232 126 L 232 152" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="232" y="146" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">首次命中</text>

  <!-- seen set box (left) -->
  <rect x="50" y="166" width="226" height="94" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="163" y="187" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">已见 seen（扫到 i=3 时）</text>
  <rect x="74" y="198" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="14" filter="url(#rough2)"/>
  <text x="91" y="217" text-anchor="middle" font-size="13" fill="#333">a</text>
  <rect x="120" y="198" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="14" filter="url(#rough2)"/>
  <text x="137" y="217" text-anchor="middle" font-size="13" fill="#333">b</text>
  <rect x="166" y="198" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="14" filter="url(#rough2)"/>
  <text x="183" y="217" text-anchor="middle" font-size="13" fill="#333">c</text>
  <text x="163" y="248" text-anchor="middle" font-size="10.5" fill="#b85450">s[3]='c' 已在 seen 中 → 命中</text>

  <!-- arrow from seen box to return box -->
  <path d="M 276 213 L 296 213" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- return box (right) -->
  <rect x="300" y="181" width="210" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="405" y="207" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">立即返回 'c'</text>
  <text x="405" y="227" text-anchor="middle" font-size="10.5" fill="#888">第二次出现下标 = 3（最小）</text>

  <!-- bottom notes -->
  <path d="M 40 278 L 520 278" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="50" y="300" font-size="11" fill="#555">• 逐位向右查：第一次「该字符已在 seen 中」的位置，就是某字符的第二次出现</text>
  <text x="50" y="318" font-size="11" fill="#555">• 若更早处另有字符第二次出现，扫描那时就该停了 → 故首命中即最小</text>
</svg>
