<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrN" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：批发价判定分支 + 枚举终值逐格 O(1) 直算</text>

  <!-- A 预处理 -->
  <rect x="95" y="40" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="170" y="59" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">预处理 n, mx, mn, Σ</text>
  <path d="M 170 70 L 170 84" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrN)" filter="url(#rough2)"/>

  <!-- B 判定 -->
  <polygon points="170,86 262,122 170,158 78,122" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="126" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">c₂ ≥ 2·c₁ ?</text>
  <path d="M 262 122 L 298 122" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrN)" filter="url(#rough2)"/>
  <text x="280" y="114" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 170 158 L 170 190" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrN)" filter="url(#rough2)"/>
  <text x="180" y="178" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- C 全零售分支 -->
  <rect x="300" y="102" width="196" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="398" y="120" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">全零售（T = mx）</text>
  <text x="398" y="137" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">ans = (n·mx − Σ)·c₁</text>
  <path d="M 398 144 L 398 166" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrN)" filter="url(#rough2)"/>

  <!-- OUT -->
  <rect x="300" y="168" width="196" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="398" y="182" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">return ans % MOD</text>
  <text x="398" y="197" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">（先比较，后取模）</text>

  <!-- D 枚举 -->
  <rect x="95" y="192" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="170" y="211" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">枚举 T ∈ [mx, 2mx−mn]</text>
  <path d="M 170 222 L 170 238" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrN)" filter="url(#rough2)"/>

  <!-- E 缺口 -->
  <rect x="95" y="240" width="150" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="170" y="257" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">S = n·T − Σ（总缺口）</text>
  <text x="170" y="274" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">d = T − mn（最大缺口）</text>
  <path d="M 170 282 L 170 296" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrN)" filter="url(#rough2)"/>

  <!-- F 批发次数 -->
  <rect x="95" y="298" width="150" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="170" y="317" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">p = min(⌊S/2⌋, S−d)</text>
  <path d="M 245 313 L 281 313" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrN)" filter="url(#rough2)"/>

  <!-- G 开销 -->
  <rect x="283" y="298" width="213" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="389" y="317" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">C = p·c₂ + (S−2p)·c₁</text>
  <path d="M 350 298 L 350 280" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrN)" filter="url(#rough2)"/>

  <!-- H 取最小 -->
  <rect x="283" y="246" width="213" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="389" y="266" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">ans = min(ans, C) ← 取模前比较</text>

  <!-- 循环箭头 H → D -->
  <path d="M 283 262 L 60 262 Q 52 262 52 252 L 52 216 Q 52 209 60 209 L 93 209" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrN)" filter="url(#rough2)"/>
  <text x="168" y="255" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">T += 1，继续枚举</text>

  <!-- H → OUT -->
  <path d="M 430 246 L 430 208" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrN)" filter="url(#rough2)"/>
  <text x="438" y="232" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">枚举完毕</text>

  <text x="260" y="348" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">⚠️ C 峰值 ≈ 3×10¹⁷：C++ 全程 long long / Python 大整数，比较完成后才 % MOD</text>
</svg>
