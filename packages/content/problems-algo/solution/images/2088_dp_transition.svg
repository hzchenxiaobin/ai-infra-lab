<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrUp" markerWidth="8" markerHeight="8" refX="4" refY="2" orient="auto">
      <path d="M0,7 L4,0 L8,7 Z" fill="#6a9acc"/>
    </marker>
  </defs>

  <rect width="520" height="320" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">DP 转移：金字塔高度由下方三个子金字塔决定</text>

  <!-- Parent cell (r, c) -->
  <rect x="230" y="50" width="44" height="44" fill="#6c8ebf" fill-opacity="0.75" stroke="#446688" stroke-width="2" rx="5" filter="url(#rough)"/>
  <text x="252" y="77" text-anchor="middle" font-size="11" fill="#fff">r, c</text>
  <text x="252" y="44" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">f[r][c]</text>

  <!-- Arrows from three children to parent -->
  <path d="M 155 140 L 235 96" stroke="#6a9acc" stroke-width="1.5" fill="none" marker-end="url(#arrUp)" filter="url(#rough2)"/>
  <path d="M 252 140 L 252 98" stroke="#6a9acc" stroke-width="1.5" fill="none" marker-end="url(#arrUp)" filter="url(#rough2)"/>
  <path d="M 349 140 L 269 96" stroke="#6a9acc" stroke-width="1.5" fill="none" marker-end="url(#arrUp)" filter="url(#rough2)"/>

  <!-- Three children -->
  <rect x="133" y="140" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough)"/>
  <text x="155" y="167" text-anchor="middle" font-size="10" fill="#446688">r+1,c−1</text>
  <text x="155" y="198" text-anchor="middle" font-size="9.5" fill="#888">f[r+1][c−1]</text>

  <rect x="230" y="140" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough)"/>
  <text x="252" y="167" text-anchor="middle" font-size="10" fill="#446688">r+1, c</text>
  <text x="252" y="198" text-anchor="middle" font-size="9.5" fill="#888">f[r+1][c]</text>

  <rect x="327" y="140" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough)"/>
  <text x="349" y="167" text-anchor="middle" font-size="10" fill="#446688">r+1,c+1</text>
  <text x="349" y="198" text-anchor="middle" font-size="9.5" fill="#888">f[r+1][c+1]</text>

  <!-- Formula box -->
  <rect x="70" y="212" width="380" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="232" text-anchor="middle" font-size="12" fill="#444">f[r][c] = min(f[r+1][c−1], f[r+1][c], f[r+1][c+1]) + 1</text>

  <!-- Notes -->
  <text x="50" y="262" font-size="10.5" fill="#666">• grid[r][c] = 0 时 f[r][c] = 0；底行 f = grid[r][c]（无法向下扩展）</text>
  <text x="50" y="278" font-size="10.5" fill="#666">• 边界外格子视为贫瘠（f = 0），自然限制金字塔不越界</text>
  <text x="50" y="294" font-size="10.5" fill="#666">• 倒金字塔 g[r][c] = min(g[r−1][c−1], g[r−1][c], g[r−1][c+1]) + 1，自顶向下递推</text>
  <text x="50" y="310" font-size="10.5" fill="#888">• 每个 apex 贡献 max(0, f − 1) 个金字塔（高度 ≥ 2 才算）</text>
</svg>
