<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">买第 i 个水果 ⇒ 免费拿下 [i+1, 2i]，下一笔购买落在 [i+1, 2i+1]</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">以 i = 3、prices = [26,18,6,12,49,7,45,45] 为例（示例 3）</text>

  <!-- top tags -->
  <text x="193" y="58" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">买 i = 3</text>
  <text x="381" y="58" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">2i+1</text>

  <!-- fruit boxes -->
  <text x="62" y="86" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">编号</text>
  <rect x="78" y="62" width="42" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="99" y="86" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="125" y="62" width="42" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="146" y="86" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="172" y="62" width="42" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="193" y="86" text-anchor="middle" font-size="13" fill="#8a6420" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="219" y="62" width="42" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="240" y="86" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">4</text>
  <rect x="266" y="62" width="42" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="287" y="86" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">5</text>
  <rect x="313" y="62" width="42" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="334" y="86" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">6</text>
  <rect x="360" y="62" width="42" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="381" y="86" text-anchor="middle" font-size="13" fill="#8f3a36" filter="url(#rough2)">7</text>
  <rect x="407" y="62" width="42" height="38" fill="#ffffff" stroke="#999" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="428" y="86" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>

  <!-- price row -->
  <text x="62" y="115" text-anchor="end" font-size="10.5" fill="#666" filter="url(#rough2)">价格</text>
  <text x="99" y="115" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">26</text>
  <text x="146" y="115" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">18</text>
  <text x="193" y="115" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">6</text>
  <text x="240" y="115" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">12</text>
  <text x="287" y="115" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">49</text>
  <text x="334" y="115" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">7</text>
  <text x="381" y="115" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">45</text>
  <text x="428" y="115" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">45</text>

  <!-- free bracket [4,6] -->
  <path d="M 219 126 L 219 132 L 355 132 L 355 126" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="287" y="148" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">免费赠品 [i+1, 2i] = [4, 6]</text>

  <!-- next-purchase bracket [4,7] -->
  <path d="M 219 158 L 219 164 L 402 164 L 402 158" fill="none" stroke="#446688" stroke-width="1.8" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="310" y="180" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">下一笔购买 j ∈ [i+1, 2i+1] = [4, 7]</text>

  <!-- chain: buy i -> free [i+1,2i] -> next in [i+1,2i+1] -->
  <rect x="36" y="200" width="140" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="106" y="221" text-anchor="middle" font-size="10.5" fill="#8a6420" filter="url(#rough2)">买 i：付 prices[i−1]</text>
  <path d="M 180 217 L 206 217" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="210" y="200" width="118" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="269" y="221" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">免费 [i+1, 2i]</text>
  <path d="M 332 217 L 358 217" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="362" y="200" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="432" y="221" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">下一笔 ∈ [i+1, 2i+1]</text>

  <!-- note 1 -->
  <rect x="48" y="252" width="424" height="52" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="272" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">j ∈ [i+1, 2i]：花钱买「白嫖货」，图的是它的赠品（示例 1 的关键一步）</text>
  <text x="260" y="292" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">j = 2i+1：第一个未被覆盖的水果，自己掏钱买下</text>

  <!-- note 2 -->
  <rect x="48" y="318" width="424" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="338" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">窗口 [i+1, 2i+1]：i 每减 1，左端左移 1 格、右端左移 2 格</text>
  <text x="260" y="360" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">两端同向左移 ⇒ 镜像版滑动窗口最小值 ⇒ 单调队列 O(n)</text>
</svg>
