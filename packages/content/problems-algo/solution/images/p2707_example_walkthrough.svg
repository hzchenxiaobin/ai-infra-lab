<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算：s = "leetscode"</text>
  <text x="280" y="40" text-anchor="middle" font-size="11" fill="#888">dictionary = ["leet","code","leetcode"]</text>

  <!-- dp table header: i 0..9 -->
  <text x="30" y="76" font-size="11" fill="#888">i</text>
  <text x="30" y="100" font-size="11" fill="#888">s[i-1]</text>
  <text x="30" y="124" font-size="11" fill="#888">dp[i]</text>

  <!-- column x positions: start 60, step 48 -->
  <!-- i row -->
  <rect x="60" y="62" width="48" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="84" y="77" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="108" y="62" width="48" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="132" y="77" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="156" y="62" width="48" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="180" y="77" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="204" y="62" width="48" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="228" y="77" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="252" y="62" width="48" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="276" y="77" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="300" y="62" width="48" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="324" y="77" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="348" y="62" width="48" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="372" y="77" text-anchor="middle" font-size="11" fill="#333">6</text>
  <rect x="396" y="62" width="48" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="420" y="77" text-anchor="middle" font-size="11" fill="#333">7</text>
  <rect x="444" y="62" width="48" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="468" y="77" text-anchor="middle" font-size="11" fill="#333">8</text>
  <rect x="492" y="62" width="48" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="516" y="77" text-anchor="middle" font-size="11" fill="#333">9</text>

  <!-- s[i-1] row -->
  <rect x="60" y="86" width="48" height="22" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="84" y="101" text-anchor="middle" font-size="11" fill="#888">—</text>
  <rect x="108" y="86" width="48" height="22" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="132" y="101" text-anchor="middle" font-size="11" fill="#333">l</text>
  <rect x="156" y="86" width="48" height="22" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="180" y="101" text-anchor="middle" font-size="11" fill="#333">e</text>
  <rect x="204" y="86" width="48" height="22" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="228" y="101" text-anchor="middle" font-size="11" fill="#333">e</text>
  <rect x="252" y="86" width="48" height="22" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="276" y="101" text-anchor="middle" font-size="11" fill="#333">t</text>
  <rect x="300" y="86" width="48" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="324" y="101" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">s</text>
  <rect x="348" y="86" width="48" height="22" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="372" y="101" text-anchor="middle" font-size="11" fill="#333">c</text>
  <rect x="396" y="86" width="48" height="22" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="420" y="101" text-anchor="middle" font-size="11" fill="#333">o</text>
  <rect x="444" y="86" width="48" height="22" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="468" y="101" text-anchor="middle" font-size="11" fill="#333">d</text>
  <rect x="492" y="86" width="48" height="22" fill="#fafafa" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="516" y="101" text-anchor="middle" font-size="11" fill="#333">e</text>

  <!-- dp[i] row -->
  <rect x="60" y="110" width="48" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="84" y="127" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="108" y="110" width="48" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="132" y="127" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="156" y="110" width="48" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="180" y="127" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="204" y="110" width="48" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="228" y="127" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="252" y="110" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="276" y="127" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="300" y="110" width="48" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="324" y="127" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="348" y="110" width="48" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="372" y="127" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="396" y="110" width="48" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="420" y="127" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="444" y="110" width="48" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="468" y="127" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="492" y="110" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="516" y="127" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- match arrows: i=4 from dp[0] (leet), i=9 from dp[5] (code) -->
  <path d="M 84 112 Q 180 50 276 112" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="180" y="44" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">s[0:4]="leet" → dp[0]=0</text>

  <path d="M 324 112 Q 420 150 516 112" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="420" y="166" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">s[5:9]="code" → dp[5]=1</text>

  <!-- explanation -->
  <rect x="40" y="200" width="480" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="56" y="222" font-size="11" fill="#333" font-weight="bold">关键步骤：</text>
  <text x="56" y="240" font-size="11" fill="#555">• i=4：丢弃路径给 dp[4]=4，但 s[0:4]="leet" 命中字典 → dp[0]=0，取更小得 0</text>
  <text x="56" y="258" font-size="11" fill="#555">• i=5..8：'s' 无词覆盖，逐位 dp[i-1]+1，额外字符累积到 4</text>
  <text x="56" y="276" font-size="11" fill="#555">• i=9：丢弃给 5，但 s[5:9]="code" 命中 → dp[5]=1，取更小得 1</text>

  <!-- answer -->
  <rect x="40" y="306" width="480" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="331" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">dp[9] = 1  →  仅下标 4 的 's' 是额外字符</text>

  <text x="280" y="372" text-anchor="middle" font-size="10" fill="#aaa">绿色箭头 = 命中字典单词的转移；其余位置走「丢弃 +1」兜底</text>
</svg>
