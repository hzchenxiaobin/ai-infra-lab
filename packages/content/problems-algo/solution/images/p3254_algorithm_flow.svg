<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 450"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <rect width="560" height="450" fill="#fafafa"/>
  <text x="280" y="22" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：一次遍历，断点清 1，就位即写</text>

  <!-- 开始 -->
  <rect x="55" y="34" width="190" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="54" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">开始：res ← [−1] × (n−k+1)</text>
  <path d="M 150 64 L 150 78" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="55" y="78" width="190" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="97" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">cnt ← 0，i ← 0</text>
  <path d="M 150 106 L 150 118" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 判断 i < n -->
  <polygon points="80,150 150,118 220,150 150,182" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="155" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">i &lt; n ?</text>
  <path d="M 220 150 L 298 150" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="258" y="142" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="300" y="133" width="110" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="355" y="155" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 res</text>
  <path d="M 150 182 L 150 198" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="161" y="196" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- 更新 cnt -->
  <rect x="25" y="198" width="250" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="216" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">断点判定：i &gt; 0 且 nums[i] = nums[i−1]+1 ?</text>
  <text x="150" y="234" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">是 → cnt++　　否 → cnt ← 1</text>
  <text x="150" y="250" text-anchor="middle" font-size="9" fill="#8899aa" filter="url(#rough2)">（断点只断连接，nums[i] 自成新段）</text>
  <path d="M 150 254 L 150 266" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 判断窗口就位且合法 -->
  <polygon points="55,300 150,266 245,300 150,334" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="295" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">i ≥ k−1 且</text>
  <text x="150" y="312" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">cnt ≥ k ?</text>
  <path d="M 150 334 L 150 350" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="161" y="348" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- 写入答案 -->
  <rect x="55" y="350" width="190" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="372" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">res[i−k+1] ← nums[i]</text>
  <path d="M 150 384 L 150 398" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- i++ 与回环 -->
  <rect x="105" y="398" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="418" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">i++</text>
  <path d="M 245 300 L 330 300 L 330 413 L 191 413" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="272" y="292" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <text x="330" y="436" text-anchor="middle" font-size="9.5" fill="#a08040" filter="url(#rough2)">非法窗口：预填的 −1 直接生效</text>
  <path d="M 105 413 L 20 413 L 20 150 L 76 150" stroke="#8a8a8a" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text transform="rotate(-90 34 282)" x="34" y="282" text-anchor="middle" font-size="9.5" fill="#8899aa" filter="url(#rough2)">回到循环头</text>
</svg>
