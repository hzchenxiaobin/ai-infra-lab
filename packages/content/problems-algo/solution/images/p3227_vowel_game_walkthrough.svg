<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：k = 4（偶）Alice 照样赢；k = 0 秒判负</text>

  <!-- 左：官方示例走法 -->
  <rect x="20" y="40" width="272" height="226" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="156" y="62" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">官方示例走法 · s = "leetcoder"</text>

  <!-- 字符条：leetcoder，元音高亮 -->
  <rect x="34" y="70" width="22" height="22" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="45" y="86" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">l</text>
  <rect x="58" y="70" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="69" y="86" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">e</text>
  <rect x="82" y="70" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="93" y="86" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">e</text>
  <rect x="106" y="70" width="22" height="22" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="117" y="86" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">t</text>
  <rect x="130" y="70" width="22" height="22" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="141" y="86" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">c</text>
  <rect x="154" y="70" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="165" y="86" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">o</text>
  <rect x="178" y="70" width="22" height="22" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="189" y="86" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">d</text>
  <rect x="202" y="70" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="213" y="86" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">e</text>
  <rect x="226" y="70" width="22" height="22" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="237" y="86" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">r</text>
  <text x="256" y="86" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">← k=4</text>

  <text x="34" y="114" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">① Alice 删 "leetco"（3 元音·奇✓）→ "der"</text>
  <text x="34" y="138" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">② Bob 删 "d"（0 元音·偶✓）→ "er"</text>
  <text x="34" y="162" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">③ Alice 删 "er"（1 元音·奇✓）→ ""</text>
  <text x="34" y="186" font-size="10.5" fill="#333" filter="url(#rough2)">④ Bob 面对空串无从下刀 → Alice 赢</text>
  <rect x="88" y="200" width="136" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="156" y="219" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">输出 true ✓</text>

  <!-- 右：不变式走法 -->
  <rect x="312" y="40" width="188" height="226" fill="#ffffff" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="406" y="62" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">不变式走法（更狠）</text>
  <text x="326" y="88" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">① Alice 只删 1 个元音</text>
  <text x="326" y="106" font-size="10.5" fill="#333" filter="url(#rough2)">   （如单个 "e"）→ k: 4→3</text>
  <text x="326" y="130" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">② Bob 删偶数元音段也没用</text>
  <text x="326" y="148" font-size="10.5" fill="#333" filter="url(#rough2)">   剩 k 仍为奇数 ≥ 1</text>
  <text x="326" y="172" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">③ Alice 如法炮制</text>
  <text x="326" y="190" font-size="10.5" fill="#333" filter="url(#rough2)">   先卡死的必是 Bob</text>
  <rect x="348" y="204" width="116" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="406" y="223" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">输出 true ✓</text>

  <!-- 底部：bbcd -->
  <rect x="20" y="282" width="480" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="305" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">s = "bbcd"：k = 0，任何子串元音数都是 0（偶）→ Alice 开局即负 → false</text>

  <text x="260" y="344" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">别被「k 是偶数」吓到：Alice 永远能把奇数局面塞回给 Bob</text>
</svg>
