<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 548"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="548" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="13.5" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：逐位滚动 DP（状态：已用元素 t / 进位 carry / 置位数 b）</text>

  <rect x="190" y="36" width="180" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="55" text-anchor="middle" font-size="11.5" fill="#2d4d24" filter="url(#rough2)">初始化 dp[0][0][0] = 1</text>

  <path d="M280,64 V84" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="88" width="260" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="107" text-anchor="middle" font-size="11.5" fill="#2a4a6a" filter="url(#rough2)">for j = 0 … n−1（逐位滚动）</text>

  <path d="M280,116 V136" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="140" width="340" height="28" fill="#fff" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="159" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">枚举每个非零状态 (t, carry, b)</text>

  <path d="M280,168 V188" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="192" width="320" height="28" fill="#fff" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="211" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">枚举 c = 0 … m−t：位置 j 放 c 个元素</text>

  <path d="M280,220 V240" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="244" width="380" height="44" fill="#fff" stroke="#888" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="262" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">s = c + carry</text>
  <text x="280" y="280" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">新状态 (t+c, s≫1, b+(s&amp;1))</text>

  <path d="M280,288 V308" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="64" y="312" width="456" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="292" y="330" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">dp′[t+c][s≫1][b+(s&amp;1)]</text>
  <text x="292" y="348" text-anchor="middle" font-size="12" fill="#8a6d1f" filter="url(#rough2)">+= dp[t][carry][b] · nums[j]^c / c!</text>

  <path d="M520,334 H536 V102 H418" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="549" y="218" font-size="10" fill="#446688" filter="url(#rough2)" transform="rotate(90 549 218)">下一个 j</text>

  <path d="M150,102 H52 V417 H90" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="44" y="260" font-size="10" fill="#4a7a3a" filter="url(#rough2)" transform="rotate(-90 44 260)">全部 n 位处理完</text>

  <rect x="96" y="394" width="368" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="413" text-anchor="middle" font-size="11" fill="#2a4a6a" filter="url(#rough2)">j 循环结束：末进位 = S 的高位部分</text>
  <text x="280" y="431" text-anchor="middle" font-size="11" fill="#2a4a6a" filter="url(#rough2)">收集 b + popcount(carry) = k 的 dp[m][carry][b] 求和</text>

  <path d="M280,440 V460" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="464" width="260" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="483" text-anchor="middle" font-size="11.5" fill="#2d4d24" font-weight="bold" filter="url(#rough2)">答案 = 收集和 × m!  mod (10⁹+7)</text>

  <rect x="40" y="504" width="480" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5,3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="523" text-anchor="middle" font-size="10.5" fill="#8a3a36" filter="url(#rough2)">剪枝：carry ≤ ⌊t/2⌋ ≤ 15、b ≤ min(t,k)、b+(s&amp;1) ≤ k ⇒ 非零状态仅数千个</text>
</svg>
