<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M 0 0 L 4 8 L 8 0 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">双指针贪心：s 的每个字符在 t 中尽量靠前匹配</text>

  <!-- s row label -->
  <text x="20" y="130" font-size="12" fill="#888">s:</text>

  <!-- s cells positioned above their matched t positions -->
  <rect x="40" y="110" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="68" y="130" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="160" y="110" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="188" y="130" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="340" y="110" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="368" y="130" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>

  <!-- s index labels -->
  <text x="68" y="100" text-anchor="middle" font-size="9" fill="#aaa">i=0</text>
  <text x="188" y="100" text-anchor="middle" font-size="9" fill="#aaa">i=1</text>
  <text x="368" y="100" text-anchor="middle" font-size="9" fill="#aaa">i=2</text>

  <!-- dashed arrows from s cells down to matched t positions -->
  <path d="M 68 142 L 68 198" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 188 142 L 188 198" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 368 142 L 368 198" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- t row label -->
  <text x="20" y="220" font-size="12" fill="#888">t:</text>

  <!-- t cells: matched in green, skipped in gray -->
  <rect x="40" y="200" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="68" y="220" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="100" y="200" width="56" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="128" y="220" text-anchor="middle" font-size="13" fill="#999">h</text>
  <rect x="160" y="200" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="188" y="220" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="220" y="200" width="56" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="248" y="220" text-anchor="middle" font-size="13" fill="#999">g</text>
  <rect x="280" y="200" width="56" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="308" y="220" text-anchor="middle" font-size="13" fill="#999">d</text>
  <rect x="340" y="200" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="368" y="220" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>

  <!-- t index labels -->
  <text x="68" y="248" text-anchor="middle" font-size="9" fill="#aaa">j=0</text>
  <text x="128" y="248" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="188" y="248" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="248" y="248" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="308" y="248" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <text x="368" y="248" text-anchor="middle" font-size="9" fill="#aaa">5</text>

  <!-- legend -->
  <rect x="40" y="266" width="16" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="62" y="279" font-size="11" fill="#555">匹配</text>
  <rect x="110" y="266" width="16" height="16" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="132" y="279" font-size="11" fill="#555">跳过</text>

  <!-- key idea box -->
  <rect x="40" y="294" width="440" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="314" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">贪心：每个字符选 t 中最早可匹配位置</text>
  <text x="260" y="332" text-anchor="middle" font-size="11" fill="#555">剩余区间更长 → 后续字符可行域是超集 → 不会更差</text>
</svg>
