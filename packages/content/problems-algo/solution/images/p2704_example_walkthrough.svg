<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：三个用例覆盖「相等 / 不等 / 取反」三条路径</text>

  <!-- ===== Example 1: expect(5).toBe(5) → true ===== -->
  <rect x="30" y="45" width="500" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="45" y="66" font-size="12" fill="#4a7a3a" font-weight="bold">示例 1：expect(5).toBe(5) → true</text>

  <rect x="50" y="78" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="80" y="98" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">val=5</text>

  <text x="120" y="98" font-size="11" fill="#666">.toBe(</text>
  <rect x="160" y="78" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="185" y="98" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <text x="215" y="98" font-size="11" fill="#666">)</text>

  <path d="M 230 93 L 270 93" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="280" y="88" font-size="10" fill="#888">5 === 5?</text>
  <text x="280" y="102" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 相等</text>

  <path d="M 350 93 L 400 93" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>

  <rect x="410" y="78" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="450" y="98" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">true ✓</text>

  <text x="50" y="128" font-size="10" fill="#888">断言"相等"成功，返回 true</text>

  <!-- ===== Example 2: expect(5).toBe(null) → throw "Not Equal" ===== -->
  <rect x="30" y="160" width="500" height="100" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="45" y="181" font-size="12" fill="#b85450" font-weight="bold">示例 2：expect(5).toBe(null) → throw "Not Equal"</text>

  <rect x="50" y="193" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="80" y="213" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">val=5</text>

  <text x="120" y="213" font-size="11" fill="#666">.toBe(</text>
  <rect x="160" y="193" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="185" y="213" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">null</text>
  <text x="215" y="213" font-size="11" fill="#666">)</text>

  <path d="M 230 208 L 270 208" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="280" y="203" font-size="10" fill="#888">5 === null?</text>
  <text x="280" y="217" font-size="11" fill="#b85450" font-weight="bold">✗ 不等</text>

  <path d="M 350 208 L 400 208" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <rect x="410" y="193" width="100" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="460" y="213" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">throw "Not Equal"</text>

  <text x="50" y="243" font-size="10" fill="#888">断言"相等"失败（5 ≠ null），抛出 "Not Equal"</text>

  <!-- ===== Example 3: expect(5).notToBe(null) → true ===== -->
  <rect x="30" y="275" width="500" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="45" y="296" font-size="12" fill="#4a7a3a" font-weight="bold">示例 3：expect(5).notToBe(null) → true</text>

  <rect x="50" y="308" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="80" y="328" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">val=5</text>

  <text x="115" y="328" font-size="11" fill="#666">.notToBe(</text>
  <rect x="175" y="308" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="200" y="328" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">null</text>
  <text x="230" y="328" font-size="11" fill="#666">)</text>

  <path d="M 245 323 L 285 323" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="295" y="318" font-size="10" fill="#888">5 !== null?</text>
  <text x="295" y="332" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 确实不等</text>

  <path d="M 380 323 L 420 323" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>

  <rect x="430" y="308" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="470" y="328" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">true ✓</text>

  <text x="50" y="358" font-size="10" fill="#888">断言"不等"成功（5 ≠ null），返回 true</text>

  <!-- Bottom note -->
  <rect x="30" y="390" width="500" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="412" text-anchor="middle" font-size="11" fill="#444">toBe 与 notToBe 互为反面：一个断言"相等"，一个断言"不等"，失败时抛出各自的错误信息</text>
</svg>
