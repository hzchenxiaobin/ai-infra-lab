<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">下标映射：前半原序照抄，后半镜像逆序（n = 3）</text>

  <!-- legend -->
  <rect x="358" y="46" width="194" height="68" fill="none" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5,4" rx="8" filter="url(#rough2)"/>
  <path d="M 370 72 L 398 72" fill="none" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="404" y="76" font-size="10" fill="#446688">原序：ans[i]=nums[i]</text>
  <path d="M 370 94 L 398 94" fill="none" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="404" y="98" font-size="10" fill="#a87020">镜像：ans[i+n]=nums[n−i−1]</text>

  <!-- nums row -->
  <text x="178" y="82" text-anchor="end" font-size="13" fill="#888" font-weight="bold">nums</text>
  <rect x="188" y="56" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="214" y="82" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="242" y="56" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="268" y="82" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="296" y="56" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="322" y="82" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <text x="214" y="113" text-anchor="middle" font-size="10.5" fill="#999">i=0</text>
  <text x="268" y="113" text-anchor="middle" font-size="10.5" fill="#999">i=1</text>
  <text x="322" y="113" text-anchor="middle" font-size="10.5" fill="#999">i=2</text>

  <!-- copy arrows (blue) -->
  <path d="M 208 102 C 195 150 158 200 146 240" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 262 102 C 248 150 214 200 202 240" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 316 102 C 304 150 266 200 258 240" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- mirror arrows (orange) -->
  <path d="M 328 102 C 334 155 322 200 312 240" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 276 102 C 296 160 344 200 360 240" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 222 102 C 262 165 388 200 414 240" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- mirror axis -->
  <path d="M 280 236 L 280 306" fill="none" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ans row -->
  <text x="104" y="278" text-anchor="end" font-size="13" fill="#888" font-weight="bold">ans</text>
  <rect x="114" y="250" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="140" y="276" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="170" y="250" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="196" y="276" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="226" y="250" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="252" y="276" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="282" y="250" width="52" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="308" y="276" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="338" y="250" width="52" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="364" y="276" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="394" y="250" width="52" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="420" y="276" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="140" y="308" text-anchor="middle" font-size="10.5" fill="#999">0</text>
  <text x="196" y="308" text-anchor="middle" font-size="10.5" fill="#999">1</text>
  <text x="252" y="308" text-anchor="middle" font-size="10.5" fill="#999">2</text>
  <text x="308" y="308" text-anchor="middle" font-size="10.5" fill="#999">3</text>
  <text x="364" y="308" text-anchor="middle" font-size="10.5" fill="#999">4</text>
  <text x="420" y="308" text-anchor="middle" font-size="10.5" fill="#999">5</text>

  <!-- palindrome note -->
  <rect x="60" y="344" width="440" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="366" text-anchor="middle" font-size="12" fill="#3a5a2e" font-weight="bold">对称性彩蛋：ans[i] = ans[2n−1−i]</text>
  <text x="280" y="386" text-anchor="middle" font-size="11" fill="#4a7a3a">中缝（红虚线）两侧镜像，答案必为回文：正读、反读都是 1,2,3,3,2,1</text>
</svg>
