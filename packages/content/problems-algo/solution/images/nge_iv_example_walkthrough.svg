<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 262" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="262" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：nums = [2, 4, 0, 9, 6]</text>
  <text x="270" y="42" text-anchor="middle" font-size="10" fill="#888">s1 / s2 存下标，括号内为下标对应值；栈顶在右</text>

  <!-- table frame -->
  <rect x="10" y="52" width="520" height="194" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>

  <!-- column dividers -->
  <g stroke="#ddd" stroke-width="1" filter="url(#rough2)">
    <line x1="44"  y1="52" x2="44"  y2="246"/>
    <line x1="78"  y1="52" x2="78"  y2="246"/>
    <line x1="128" y1="52" x2="128" y2="246"/>
    <line x1="232" y1="52" x2="232" y2="246"/>
    <line x1="336" y1="52" x2="336" y2="246"/>
  </g>
  <!-- row dividers -->
  <g stroke="#ddd" stroke-width="1" filter="url(#rough2)">
    <line x1="10" y1="82"  x2="530" y2="82"/>
    <line x1="10" y1="114" x2="530" y2="114"/>
    <line x1="10" y1="146" x2="530" y2="146"/>
    <line x1="10" y1="178" x2="530" y2="178"/>
    <line x1="10" y1="210" x2="530" y2="210"/>
  </g>

  <!-- header -->
  <rect x="10" y="52" width="520" height="30" fill="#e8f0fe" stroke="none" filter="url(#rough2)"/>
  <g font-size="11" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="27"  y="72">步</text>
    <text x="61"  y="72">i</text>
    <text x="103" y="72">nums[i]</text>
    <text x="180" y="72">s1（下标）</text>
    <text x="284" y="72">s2（下标）</text>
    <text x="433" y="72">answer</text>
  </g>

  <!-- data rows -->
  <g font-size="10.5" fill="#333" text-anchor="middle">
    <!-- row 0 -->
    <rect x="10" y="82" width="520" height="32" fill="#f6faff" stroke="none" filter="url(#rough2)"/>
    <text x="27"  y="103">0</text>
    <text x="61"  y="103">0</text>
    <text x="103" y="103">2</text>
    <text x="180" y="103" fill="#446688" font-weight="bold">[0(2)]</text>
    <text x="284" y="103" fill="#888">[ ]</text>
    <text x="433" y="103">[-1,-1,-1,-1,-1]</text>

    <!-- row 1 -->
    <rect x="10" y="114" width="520" height="32" fill="#fff" stroke="none" filter="url(#rough2)"/>
    <text x="27"  y="135">1</text>
    <text x="61"  y="135">1</text>
    <text x="103" y="135">4</text>
    <text x="180" y="135" fill="#446688" font-weight="bold">[1(4)]</text>
    <text x="284" y="135" fill="#4a7a3a" font-weight="bold">[0(2)]</text>
    <text x="433" y="135">[-1,-1,-1,-1,-1]</text>

    <!-- row 2 -->
    <rect x="10" y="146" width="520" height="32" fill="#f6faff" stroke="none" filter="url(#rough2)"/>
    <text x="27"  y="167">2</text>
    <text x="61"  y="167">2</text>
    <text x="103" y="167">0</text>
    <text x="180" y="167" fill="#446688" font-weight="bold">[1(4), 2(0)]</text>
    <text x="284" y="167" fill="#4a7a3a" font-weight="bold">[0(2)]</text>
    <text x="433" y="167">[-1,-1,-1,-1,-1]</text>

    <!-- row 3: big settle -->
    <rect x="10" y="178" width="520" height="32" fill="#fff8e1" stroke="none" filter="url(#rough2)"/>
    <text x="27"  y="199">3</text>
    <text x="61"  y="199">3</text>
    <text x="103" y="199" fill="#b85450" font-weight="bold">9</text>
    <text x="180" y="199" fill="#446688" font-weight="bold">[3(9)]</text>
    <text x="284" y="199" fill="#4a7a3a" font-weight="bold">[1(4), 2(0)]</text>
    <text x="433" y="199" fill="#b85450" font-weight="bold">[9,-1,-1,-1,-1]</text>

    <!-- row 4 -->
    <rect x="10" y="210" width="520" height="32" fill="#f6faff" stroke="none" filter="url(#rough2)"/>
    <text x="27"  y="231">4</text>
    <text x="61"  y="231">4</text>
    <text x="103" y="231" fill="#b85450" font-weight="bold">6</text>
    <text x="180" y="231" fill="#446688" font-weight="bold">[3(9), 4(6)]</text>
    <text x="284" y="231" fill="#888">[ ]</text>
    <text x="433" y="231" fill="#b85450" font-weight="bold">[9,6,6,-1,-1]</text>
  </g>
</svg>
