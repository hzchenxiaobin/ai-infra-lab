<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">五步流水线：位压缩 → SOS → 容斥</text>

  <!-- ① -->
  <rect x="112" y="38" width="296" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="57" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">① 一趟 OR 求 S，令 k = popcount(S)</text>
  <text x="260" y="74" text-anchor="middle" font-size="11" fill="#667788" filter="url(#rough2)">值域 10⁶ &lt; 2²⁰ ⇒ k ≤ 20</text>

  <path d="M 260 82 L 260 96" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② -->
  <rect x="112" y="98" width="296" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="117" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">② 每个元素压成 k 位签名 sig，桶计数 cnt</text>
  <text x="260" y="134" text-anchor="middle" font-size="11" fill="#667788" filter="url(#rough2)">只保留 S 中出现的位，值 → 掩码免离散化</text>

  <path d="M 260 142 L 260 156" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ -->
  <rect x="112" y="158" width="296" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="177" text-anchor="middle" font-size="13" fill="#2e5a24" filter="url(#rough2)">③ SOS 子集和：f[U] = #{ sig ⊆ U }</text>
  <text x="260" y="194" text-anchor="middle" font-size="11" fill="#667788" filter="url(#rough2)">k 轮逐位前缀和，O(k · 2^k) ≈ 2×10⁷</text>

  <path d="M 260 202 L 260 216" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ④ -->
  <rect x="112" y="218" width="296" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="237" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">④ 容斥：ans = Σ (−1)<tspan dy="-5" font-size="9">|T|+1</tspan><tspan dy="5"> · 2</tspan><tspan dy="-5" font-size="9">f[~T]</tspan></text>
  <text x="260" y="254" text-anchor="middle" font-size="11" fill="#667788" filter="url(#rough2)">T 枚举非空位集；pw[0..n] 预计算，查表 O(1)</text>

  <path d="M 260 262 L 260 276" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ⑤ -->
  <rect x="112" y="278" width="296" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="297" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">⑤ 输出 ans mod (10⁹ + 7)</text>
  <text x="260" y="314" text-anchor="middle" font-size="11" fill="#667788" filter="url(#rough2)">± 交替累加，收尾统一转非负</text>

  <text x="260" y="345" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">瓶颈全在 2^k 一侧：与 n 无关，k ≤ 20 钉死上界</text>
</svg>
