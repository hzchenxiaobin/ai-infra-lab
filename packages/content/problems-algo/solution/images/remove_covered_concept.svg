<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：被覆盖 = 被另一个区间完全「包住」</text>

  <!-- ===== 顶部：覆盖定义 ===== -->
  <rect x="32" y="44" width="456" height="118" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="48" y="66" font-size="12" fill="#446688" font-weight="bold">覆盖定义：[c,d] 覆盖 [a,b] ⟺ c ≤ a 且 b ≤ d</text>

  <!-- number line for definition -->
  <line x1="70" y1="120" x2="470" y2="120" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 470 120 L 462 116 L 462 124 Z" fill="#888" filter="url(#rough2)"/>
  <g font-size="10.5" fill="#888" text-anchor="middle">
    <line x1="110" y1="116" x2="110" y2="126" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="110" y="140">1</text>
    <line x1="190" y1="116" x2="190" y2="126" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="190" y="140">3</text>
    <line x1="270" y1="116" x2="270" y2="126" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="270" y="140">4</text>
    <line x1="390" y1="116" x2="390" y2="126" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="390" y="140">8</text>
  </g>

  <!-- covering interval [1,8] big -->
  <rect x="110" y="86" width="280" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="116" y="101" font-size="11" fill="#b85450" font-weight="bold">[c,d]=[1,8] 覆盖者</text>

  <!-- covered interval [3,4] small inside -->
  <rect x="190" y="148" width="80" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="230" y="162" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">[a,b]=[3,4] 被覆盖</text>
  <!-- containment arrows -->
  <path d="M 190 150 L 190 110" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,3" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 270 150 L 270 110" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,3" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <text x="48" y="178" font-size="11" fill="#555">c=1 ≤ a=3 ✓ 且 d=8 ≥ b=4 ✓ → [3,4] 被 [1,8] 覆盖，删除</text>

  <!-- ===== 底部：排序策略 ===== -->
  <rect x="32" y="194" width="456" height="170" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="48" y="216" font-size="12" fill="#d6a040" font-weight="bold">排序策略：起点升序，起点相同则终点降序</text>

  <!-- case: same start, end desc -->
  <text x="48" y="240" font-size="11" fill="#555" font-weight="bold">起点相同的区间，终点大的排前：</text>

  <line x1="70" y1="290" x2="430" y2="290" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 430 290 L 422 286 L 422 294 Z" fill="#888" filter="url(#rough2)"/>
  <g font-size="10.5" fill="#888" text-anchor="middle">
    <line x1="110" y1="286" x2="110" y2="296" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="110" y="310">2</text>
    <line x1="270" y1="286" x2="270" y2="296" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="270" y="310">3</text>
    <line x1="390" y1="286" x2="390" y2="296" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="390" y="310">8</text>
  </g>

  <!-- [2,8] first -->
  <rect x="110" y="254" width="280" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="116" y="269" font-size="11" fill="#4a7a3a" font-weight="bold">① [2,8] 终点大→先处理，更新 max_end=8</text>

  <!-- [2,3] second, covered -->
  <rect x="110" y="322" width="160" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="190" y="336" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">② [2,3] 3 ≤ max_end=8 → 被覆盖，删除</text>

  <text x="48" y="356" font-size="10.5" fill="#888" font-style="italic">终点降序保证：同起点中「最大终点」先入 max_end，小的自然判为被覆盖</text>
</svg>
