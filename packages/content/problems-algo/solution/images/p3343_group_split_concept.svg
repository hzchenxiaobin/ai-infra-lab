<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：平衡只由「哪些数字落在偶数下标组」决定</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">一个排列 = 把数字分成偶位组 / 奇位组 + 组内自由排列</text>

  <!-- 排列 A -->
  <text x="118" y="54" font-size="10.5" fill="#666" filter="url(#rough2)">排列 A = 132231</text>
  <g filter="url(#rough2)">
    <rect x="118" y="58" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="172" y="58" width="46" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="226" y="58" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="280" y="58" width="46" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="334" y="58" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="388" y="58" width="46" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="141" y="83" text-anchor="middle" font-size="16" font-weight="bold" fill="#33506b">1</text>
    <text x="195" y="83" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f5d24">3</text>
    <text x="249" y="83" text-anchor="middle" font-size="16" font-weight="bold" fill="#33506b">2</text>
    <text x="303" y="83" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f5d24">2</text>
    <text x="357" y="83" text-anchor="middle" font-size="16" font-weight="bold" fill="#33506b">3</text>
    <text x="411" y="83" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f5d24">1</text>
    <text x="141" y="108" text-anchor="middle" font-size="8.5" fill="#999">下标0</text>
    <text x="195" y="108" text-anchor="middle" font-size="8.5" fill="#999">1</text>
    <text x="249" y="108" text-anchor="middle" font-size="8.5" fill="#999">2</text>
    <text x="303" y="108" text-anchor="middle" font-size="8.5" fill="#999">3</text>
    <text x="357" y="108" text-anchor="middle" font-size="8.5" fill="#999">4</text>
    <text x="411" y="108" text-anchor="middle" font-size="8.5" fill="#999">5</text>
  </g>
  <text x="260" y="128" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">偶位（蓝）和 = 1+2+3 = 6</text>
  <text x="260" y="144" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">奇位（绿）和 = 3+2+1 = 6　→ 平衡 ✓</text>

  <!-- 换序箭头 -->
  <path d="M 240 152 Q 260 164 280 176" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="386" y="168" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">组内任意换序，和不变</text>

  <!-- 排列 B -->
  <text x="118" y="168" font-size="10.5" fill="#666" filter="url(#rough2)">排列 B = 321123</text>
  <g filter="url(#rough2)">
    <rect x="118" y="176" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="172" y="176" width="46" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="226" y="176" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="280" y="176" width="46" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="334" y="176" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="388" y="176" width="46" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="141" y="201" text-anchor="middle" font-size="16" font-weight="bold" fill="#33506b">3</text>
    <text x="195" y="201" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f5d24">2</text>
    <text x="249" y="201" text-anchor="middle" font-size="16" font-weight="bold" fill="#33506b">1</text>
    <text x="303" y="201" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f5d24">1</text>
    <text x="357" y="201" text-anchor="middle" font-size="16" font-weight="bold" fill="#33506b">2</text>
    <text x="411" y="201" text-anchor="middle" font-size="16" font-weight="bold" fill="#2f5d24">3</text>
  </g>
  <text x="260" y="232" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">偶位组 {1,2,3}、奇位组 {1,2,3} 与 A 完全相同 → 仍平衡 ✓</text>

  <!-- 公式框 -->
  <rect x="20" y="244" width="480" height="106" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="264" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">数排列 ⇨ 数分组：只需决定每种数字 d 各取 k_d 个进偶位组（c_d 为 d 的总个数）</text>
  <text x="260" y="284" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">约束：Σ k_d = m = ⌈n/2⌉ 个偶位，且 Σ d·k_d = S/2（S = 全部数字之和；S 为奇数 ⇒ 答案 0）</text>
  <text x="260" y="308" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">每个分组的方案数 = m!·(n−m)! / Π [ k_d! · (c_d − k_d)! ]</text>
  <text x="260" y="330" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">两组各自做多重集排列再相乘；不同分组互斥 —— 不重不漏，直接求和</text>
  <text x="260" y="344" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">对照：3340 是「判定一个串是否平衡」，本题是「数出所有平衡排列」</text>
</svg>
