<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 620" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="620" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：分别贪心求 a 最大与 b 最小</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888">两趟扫描 + 全量替换，各 O(d)，互不干扰</text>

  <!-- Step 0: s = to_string(num) -->
  <rect x="200" y="60" width="240" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="83" text-anchor="middle" font-size="12" fill="#333">① s = to_string(num)</text>
  <path d="M 320 100 L 320 114" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Maximize a branch ===== -->
  <rect x="60" y="118" width="200" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="160" y="137" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">— 最大化 a —</text>

  <!-- Step: scan for first non-9 -->
  <rect x="40" y="154" width="240" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="160" y="172" text-anchor="middle" font-size="11" fill="#333">② 从左到右找第一个 ≠ '9' 的</text>
  <text x="160" y="186" text-anchor="middle" font-size="11" fill="#333">数位 d</text>
  <path d="M 160 196 L 160 212" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: found? -->
  <polygon points="160,216 230,246 160,276 90,246" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="160" y="250" text-anchor="middle" font-size="11" fill="#333">找到 d?</text>

  <!-- Yes: replace -->
  <path d="M 230 246 L 270 246" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="250" y="239" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="274" y="228" width="150" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="349" y="251" text-anchor="middle" font-size="11" fill="#4a7a3a">a = s.replace(d,'9')</text>

  <!-- No: a = s -->
  <path d="M 90 246 L 50 246 L 50 288" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="70" y="239" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="20" y="280" width="90" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="65" y="300" text-anchor="middle" font-size="11" fill="#b85450">a = s（全9）</text>

  <!-- a result -->
  <path d="M 349 264 L 349 300 L 160 300 L 160 320" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 65 312 L 65 320" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Minimize b branch ===== -->
  <rect x="360" y="118" width="200" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="460" y="137" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">— 最小化 b —</text>

  <!-- Decision: s[0] == '1'? -->
  <polygon points="460,154 550,194 460,234 370,194" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="460" y="190" text-anchor="middle" font-size="11" fill="#333">s[0] == '1' ?</text>
  <text x="460" y="206" text-anchor="middle" font-size="10" fill="#888">(首位是否为1)</text>

  <!-- No: replace s[0] with '1' -->
  <path d="M 550 194 L 590 194 L 590 248" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="570" y="187" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="500" y="240" width="110" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="555" y="263" text-anchor="middle" font-size="10" fill="#b85450">b=s.replace(s[0],'1')</text>

  <!-- Yes: scan from pos 1 -->
  <path d="M 460 234 L 460 250" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="475" y="246" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="340" y="254" width="240" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="460" y="272" text-anchor="middle" font-size="11" fill="#333">③ 从 i=1 起找第一个</text>
  <text x="460" y="286" text-anchor="middle" font-size="11" fill="#333">≠ '0' 且 ≠ '1' 的数位 d</text>
  <path d="M 460 296 L 460 310" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: found? -->
  <polygon points="460,314 530,344 460,374 390,344" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="460" y="348" text-anchor="middle" font-size="11" fill="#333">找到 d?</text>

  <!-- Yes: replace d with '0' -->
  <path d="M 530 344 L 570 344 L 570 388" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="550" y="337" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="500" y="380" width="110" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="555" y="403" text-anchor="middle" font-size="10" fill="#4a7a3a">b=s.replace(d,'0')</text>

  <!-- No: b = s -->
  <path d="M 390 344 L 350 344 L 350 388" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="370" y="337" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="300" y="380" width="100" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="350" y="403" text-anchor="middle" font-size="11" fill="#b85450">b = s（无法降）</text>

  <!-- b result merge -->
  <path d="M 555 416 L 555 440" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 350 416 L 350 440" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Final merge: return a - b ===== -->
  <path d="M 160 320 L 160 470 L 280 470" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="180" y="465" font-size="10" fill="#4a7a3a" font-weight="bold">a</text>

  <path d="M 555 440 L 555 470 L 440 470" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="520" y="465" font-size="10" fill="#b85450" font-weight="bold">b</text>

  <rect x="220" y="458" width="200" height="42" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="485" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">④ return int(a) − int(b)</text>

  <!-- footer notes -->
  <rect x="40" y="520" width="540" height="80" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="542" font-size="11" fill="#b85450" font-weight="bold">前导零约束处理要点：</text>
  <text x="60" y="560" font-size="10" fill="#555">• 最大化 a 无前导零风险——替换目标恒为 9，首位不可能变 0</text>
  <text x="60" y="576" font-size="10" fill="#555">• 最小化 b：首位 ≠ 1 时替换目标为 1（非 0），无前导零风险</text>
  <text x="60" y="592" font-size="10" fill="#555">• 最小化 b：首位 = 1 时跳过首位，在后续数位中替换为 0，首位不受影响</text>
</svg>
