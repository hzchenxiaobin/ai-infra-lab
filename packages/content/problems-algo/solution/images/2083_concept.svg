<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：同字符的任意两个位置（含自身）构成一个合法子串</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">字符 c 出现 f 次 → 配对数 = C(f,2) + f = f(f+1)/2</text>

  <!-- String "abcba" with positions -->
  <text x="28" y="74" font-size="10.5" fill="#666">s =</text>
  <text x="60" y="72" font-size="9" fill="#aaa">下标</text>

  <!-- Position labels -->
  <text x="104" y="66" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="148" y="66" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="192" y="66" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="236" y="66" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="280" y="66" text-anchor="middle" font-size="9" fill="#aaa">4</text>

  <!-- Character boxes: a(orange) b(blue) c(green) b(blue) a(orange) -->
  <rect x="84" y="76" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="104" y="99" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>
  <rect x="128" y="76" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="99" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">b</text>
  <rect x="172" y="76" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="99" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">c</text>
  <rect x="216" y="76" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="236" y="99" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">b</text>
  <rect x="260" y="76" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="99" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>

  <!-- Divider -->
  <path d="M 30 128 L 530 128" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Group by character: 'a' -->
  <text x="28" y="152" font-size="11" fill="#d6a040" font-weight="bold">a: 位置 {0, 4}</text>
  <!-- positions 0 and 4 highlighted -->
  <rect x="84" y="142" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="104" y="161" text-anchor="middle" font-size="13" fill="#333">a</text>
  <rect x="260" y="142" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="161" text-anchor="middle" font-size="13" fill="#333">a</text>
  <!-- bracket connecting 0 and 4 -->
  <path d="M 104 174 Q 104 184 192 184 Q 280 184 280 174" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="192" y="200" text-anchor="middle" font-size="10" fill="#d6a040">配对 (0,0) (0,4) (4,4) → "a" "abcba" "a"</text>
  <text x="430" y="161" font-size="11" fill="#555">f=2 → 2×3/2 = </text>
  <text x="500" y="161" font-size="13" fill="#d6a040" font-weight="bold">3</text>

  <!-- Group by character: 'b' -->
  <text x="28" y="224" font-size="11" fill="#446688" font-weight="bold">b: 位置 {1, 3}</text>
  <rect x="128" y="214" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="148" y="233" text-anchor="middle" font-size="13" fill="#333">b</text>
  <rect x="216" y="214" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="236" y="233" text-anchor="middle" font-size="13" fill="#333">b</text>
  <path d="M 148 246 Q 148 256 192 256 Q 236 256 236 246" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="192" y="272" text-anchor="middle" font-size="10" fill="#446688">配对 (1,1) (1,3) (3,3) → "b" "bcb" "b"</text>
  <text x="430" y="233" font-size="11" fill="#555">f=2 → 2×3/2 = </text>
  <text x="500" y="233" font-size="13" fill="#446688" font-weight="bold">3</text>

  <!-- Group by character: 'c' -->
  <text x="28" y="296" font-size="11" fill="#4a7a3a" font-weight="bold">c: 位置 {2}</text>
  <rect x="172" y="286" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="192" y="305" text-anchor="middle" font-size="13" fill="#333">c</text>
  <text x="192" y="328" text-anchor="middle" font-size="10" fill="#4a7a3a">配对 (2,2) → "c"</text>
  <text x="430" y="305" font-size="11" fill="#555">f=1 → 1×2/2 = </text>
  <text x="500" y="305" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- Total -->
  <rect x="340" y="340" width="200" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="440" y="361" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">总计 = 3 + 3 + 1 = 7</text>
</svg>
