<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 620" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="500" height="620" fill="#fafafa"/>
  <text x="250" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">优美的排列 II 算法流程：前段递增 + 尾段双指针交错</text>

  <!-- init -->
  <rect x="110" y="44" width="280" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="250" y="66" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">ans = [1, 2, …, n−k]（前段递增）</text>
  <text x="250" y="82" text-anchor="middle" font-size="10.5" fill="#555">lo = n−k+1，hi = n，toggle = true（先取 hi）</text>

  <path d="M 250 92 L 250 110" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- loop check -->
  <polygon points="250,114 380,158 250,202 120,158" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="156" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">lo ≤ hi ?</text>
  <text x="250" y="174" text-anchor="middle" font-size="10" fill="#777">还有数未放？</text>

  <!-- No -> return -->
  <path d="M 380 158 L 450 158 L 450 250" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="396" y="150" font-size="11" fill="#b85450" font-weight="bold">No</text>
  <rect x="384" y="254" width="132" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="450" y="274" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">返回 ans</text>
  <text x="450" y="290" text-anchor="middle" font-size="9.5" fill="#888">差值恰有 k 个不同值</text>

  <!-- Yes down -->
  <path d="M 250 202 L 250 222" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="266" y="216" font-size="11" fill="#82b366" font-weight="bold">Yes</text>

  <!-- toggle check -->
  <polygon points="250,226 380,270 250,314 120,270" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="266" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">toggle ?</text>
  <text x="250" y="284" text-anchor="middle" font-size="9.5" fill="#777">该取哪一端</text>

  <!-- Yes toggle -> take hi -->
  <path d="M 380 270 L 430 270 L 430 300" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="396" y="262" font-size="10.5" fill="#a07820" font-weight="bold">true</text>
  <rect x="362" y="304" width="136" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="430" y="324" text-anchor="middle" font-size="10.5" fill="#a07820" font-weight="bold">ans.append(hi)</text>
  <text x="430" y="340" text-anchor="middle" font-size="10" fill="#555">hi −= 1</text>

  <!-- No toggle -> take lo -->
  <path d="M 120 270 L 70 270 L 70 300" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="92" y="262" font-size="10.5" fill="#446688" font-weight="bold">false</text>
  <rect x="2" y="304" width="136" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="70" y="324" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">ans.append(lo)</text>
  <text x="70" y="340" text-anchor="middle" font-size="10" fill="#555">lo += 1</text>

  <!-- both converge to toggle flip -->
  <path d="M 430 350 L 430 372 L 250 372" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 70 350 L 70 372 L 250 372" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <rect x="150" y="374" width="200" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="250" y="399" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">toggle = not toggle</text>

  <path d="M 250 414 L 250 436" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- insight box: why diff decreases -->
  <rect x="40" y="440" width="420" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="250" y="462" text-anchor="middle" font-size="11" fill="#a07820" font-weight="bold">为什么差值每次恰好递减 1？</text>
  <text x="250" y="480" text-anchor="middle" font-size="10.5" fill="#555">首步边界：|n − (n−k)| = k（前段末与尾段首）</text>
  <text x="250" y="496" text-anchor="middle" font-size="10.5" fill="#555">之后 lo、hi 各向中间走 1，相邻间距每次缩 1</text>
  <text x="250" y="512" text-anchor="middle" font-size="10.5" fill="#555">→ 差值链 k, k−1, k−2, …, 1（共 k 个）</text>

  <!-- loop back arrow to loop check -->
  <path d="M 250 518 L 250 540 L 40 540 L 40 158 L 120 158" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="48" y="556" font-size="10" fill="#888">回到循环判定 lo ≤ hi ?</text>

  <!-- footer summary -->
  <rect x="40" y="572" width="420" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="250" y="590" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">一趟构造 O(n)：前段贡献 {1}，尾段贡献 {k,…,1}</text>
  <text x="250" y="605" text-anchor="middle" font-size="10" fill="#555">并集 = {1, 2, …, k}，恰 k 个不同差值</text>
</svg>
