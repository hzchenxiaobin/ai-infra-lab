<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">操作的本质：任意次「合并」⟺ 选一个划分</text>

  <!-- 原数组 -->
  <text x="100" y="74" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">nums =</text>
  <rect x="140" y="50" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="168" y="73" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="204" y="50" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="232" y="73" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="268" y="50" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="296" y="73" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="332" y="50" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="360" y="73" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>

  <!-- 划分括号 -->
  <path d="M 143 92 L 143 103 L 193 103 L 193 92" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 207 92 L 207 103 L 325 103 L 325 92" fill="none" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 335 92 L 335 103 L 385 103 L 385 92" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="168" y="122" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">第 1 段</text>
  <text x="266" y="122" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">第 2 段</text>
  <text x="360" y="122" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">第 3 段</text>

  <!-- 合并箭头 -->
  <path d="M 264 132 L 264 160" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="276" y="152" font-size="11" fill="#446688" filter="url(#rough2)">每段缩成段和</text>

  <!-- 结果数组 -->
  <rect x="150" y="166" width="54" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="177" y="189" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="216" y="166" width="54" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="243" y="189" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <rect x="282" y="166" width="54" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="309" y="189" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>
  <text x="368" y="180" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">非递减 ✓</text>
  <text x="368" y="198" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">长度 3</text>

  <!-- 对比：并成一段 -->
  <rect x="410" y="88" width="96" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5,4" rx="8" filter="url(#rough2)"/>
  <text x="458" y="110" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">全并成 1 段：</text>
  <text x="458" y="128" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[15]</text>
  <text x="458" y="144" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">长度只有 1</text>

  <!-- 结论框 -->
  <rect x="30" y="240" width="460" height="112" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="266" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">最终数组的每个元素 = 原数组某段连续区间的和</text>
  <text x="260" y="290" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">这些区间首尾相接、恰好覆盖全数组 —— 就是一个「划分」</text>
  <text x="260" y="322" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">答案 = 最多分几段，使各段和从左到右非递减</text>
</svg>
