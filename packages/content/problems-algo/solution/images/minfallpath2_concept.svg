<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：全行取 min 但排除同列 → min1/min2 优化</text>

  <!-- Left: 931 (three fathers) -->
  <rect x="20" y="44" width="240" height="160" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="20" y="44" width="240" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="140" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">931. 下降路径最小和 I</text>
  <!-- Row i-1: 5 cells -->
  <rect x="40" y="84" width="36" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="58" y="103" text-anchor="middle" font-size="10" fill="#aaa">·</text>
  <rect x="80" y="84" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="98" y="103" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">j−1</text>
  <rect x="120" y="84" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="138" y="103" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">j</text>
  <rect x="160" y="84" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="178" y="103" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">j+1</text>
  <rect x="200" y="84" width="36" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="218" y="103" text-anchor="middle" font-size="10" fill="#aaa">·</text>
  <text x="140" y="126" text-anchor="middle" font-size="9" fill="#888">第 i−1 行（只看 3 个相邻列）</text>
  <!-- arrows from 3 cells to current -->
  <path d="M 98 116 L 138 150" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 138 116 L 138 150" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 178 116 L 138 150" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <!-- Row i: current cell -->
  <rect x="120" y="152" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="138" y="171" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">j</text>
  <text x="140" y="194" text-anchor="middle" font-size="9.5" fill="#888">第 i 行</text>

  <!-- Right: 1289 (all columns except j) -->
  <rect x="300" y="44" width="240" height="160" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="300" y="44" width="240" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="420" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1289. 下降路径最小和 II</text>
  <!-- Row i-1: 5 cells, all except j highlighted -->
  <rect x="320" y="84" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="338" y="103" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">✓</text>
  <rect x="360" y="84" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="378" y="103" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">✓</text>
  <rect x="400" y="84" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="418" y="103" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✗</text>
  <rect x="440" y="84" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="458" y="103" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">✓</text>
  <rect x="480" y="84" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="498" y="103" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">✓</text>
  <text x="420" y="126" text-anchor="middle" font-size="9" fill="#888">第 i−1 行（全部列 ≠ j）</text>
  <!-- arrows from 4 cells to current -->
  <path d="M 338 116 L 418 150" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 378 116 L 418 150" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 458 116 L 418 150" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 498 116 L 418 150" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <!-- Row i: current cell -->
  <rect x="400" y="152" width="36" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="418" y="171" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">j</text>
  <text x="420" y="194" text-anchor="middle" font-size="9.5" fill="#888">第 i 行</text>

  <!-- Divider -->
  <path d="M 30 222 L 530 222" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Bottom: min1/min2 trick -->
  <text x="280" y="248" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">min1/min2 优化：O(n²) → O(n) per row</text>

  <!-- Previous row values -->
  <text x="60" y="280" font-size="11" fill="#888">上一行 dp：</text>
  <rect x="140" y="266" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="285" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">min1</text>
  <rect x="184" y="266" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="204" y="285" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">min2</text>
  <rect x="228" y="266" width="40" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="248" y="285" text-anchor="middle" font-size="11" fill="#aaa">…</text>
  <rect x="272" y="266" width="40" height="28" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="292" y="285" text-anchor="middle" font-size="11" fill="#aaa">…</text>
  <text x="324" y="285" font-size="10" fill="#888">只需记录最小 min1（及其列号）和次小 min2</text>

  <!-- Case 1: j != min1_col -->
  <rect x="40" y="312" width="235" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="157" y="334" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">情况一：j ≠ min1 所在列</text>
  <text x="157" y="356" text-anchor="middle" font-size="11" fill="#444">dp[i][j] = grid[i][j] + min1</text>
  <text x="157" y="378" text-anchor="middle" font-size="9.5" fill="#888">排除的列不是 min1，min1 仍可选</text>
  <text x="157" y="394" text-anchor="middle" font-size="9.5" fill="#888">直接用全局最小值</text>

  <!-- Case 2: j == min1_col -->
  <rect x="285" y="312" width="235" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="402" y="334" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">情况二：j = min1 所在列</text>
  <text x="402" y="356" text-anchor="middle" font-size="11" fill="#444">dp[i][j] = grid[i][j] + min2</text>
  <text x="402" y="378" text-anchor="middle" font-size="9.5" fill="#888">必须排除 min1（同列禁选）</text>
  <text x="402" y="394" text-anchor="middle" font-size="9.5" fill="#888">退而求其次用次小值</text>
</svg>
