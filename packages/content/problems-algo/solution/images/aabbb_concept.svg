<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：合法 ⇔ 不存在 "ba" 相邻转移</text>

  <!-- ====== Valid example: aaabbb ====== -->
  <text x="280" y="60" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 合法：s = "aaabbb"</text>

  <!-- a block (3 cells) -->
  <rect x="120" y="74" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="97" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="160" y="74" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="97" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="200" y="74" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="97" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>

  <!-- transition a→b (GREEN, allowed) -->
  <rect x="240" y="74" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="97" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">a→b</text>

  <!-- b block (3 cells) -->
  <rect x="280" y="74" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="97" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
  <rect x="320" y="74" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="97" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
  <rect x="360" y="74" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="97" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>

  <!-- bracket: all a's before all b's -->
  <path d="M 120 124 Q 120 132 126 132 L 234 132 Q 240 132 240 124" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="180" y="148" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">所有 a 在前</text>
  <path d="M 280 124 Q 280 132 286 132 L 394 132 Q 400 132 400 124" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="340" y="148" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">所有 b 在后</text>

  <!-- ====== Invalid example: abab ====== -->
  <text x="280" y="184" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗ 非法：s = "abab"</text>

  <!-- a -->
  <rect x="160" y="198" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="221" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <!-- b -->
  <rect x="200" y="198" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="221" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
  <!-- transition b→a (RED, forbidden!) -->
  <rect x="240" y="198" width="40" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="221" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">b→a</text>
  <!-- a -->
  <rect x="280" y="198" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="221" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <!-- b -->
  <rect x="320" y="198" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="221" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>

  <!-- red arrow pointing to b→a -->
  <path d="M 260 252 L 260 268" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="260" y="282" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">出现 "ba" → 有 b 在 a 之前</text>

  <!-- Core idea box -->
  <rect x="40" y="300" width="480" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">等价转化：所有 a 在所有 b 之前 ⇔ 字符串不含 "ba" 子串</text>
  <text x="280" y="346" text-anchor="middle" font-size="11" fill="#666">合法串必形如 aaa...bbb...（非递减）；一旦出现 b→a 转移即非法</text>
</svg>
