<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">DP 核心递推：从因数 j 出发一次复制 + 多次粘贴涨到 i</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">j 必须整除 i；令 k = i/j，则 Copy All 1 步 + Paste (k−1) 步 = 共 k 步</text>

  <!-- ===== stage: j 个 A ===== -->
  <rect x="36" y="74" width="120" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="96" y="98" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">屏幕已有</text>
  <text x="96" y="118" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">j 个 A</text>

  <!-- arrow: copy all -->
  <path d="M 156 102 L 188 102" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="172" y="94" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">Copy All</text>
  <text x="172" y="116" text-anchor="middle" font-size="9" fill="#888">1 步</text>

  <!-- ===== clipboard ===== -->
  <rect x="192" y="74" width="120" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="252" y="98" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">剪贴板</text>
  <text x="252" y="118" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">= j 个 A</text>

  <!-- arrow: paste k-1 times -->
  <path d="M 312 102 L 344 102" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="328" y="94" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">Paste</text>
  <text x="328" y="116" text-anchor="middle" font-size="9" fill="#888">k−1 次</text>

  <!-- ===== result: i 个 A ===== -->
  <rect x="348" y="74" width="136" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="416" y="98" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">屏幕达到</text>
  <text x="416" y="118" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">i = j·k 个 A</text>

  <!-- ===== cost breakdown bar ===== -->
  <rect x="36" y="158" width="448" height="62" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="260" y="178" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">新增操作次数拆解</text>

  <!-- cost piece 1: copy -->
  <rect x="60" y="188" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="204" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">Copy: 1</text>

  <text x="158" y="204" text-anchor="middle" font-size="14" fill="#888">+</text>

  <!-- cost piece 2: paste -->
  <rect x="176" y="188" width="120" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="236" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Paste: k − 1</text>

  <text x="314" y="204" text-anchor="middle" font-size="14" fill="#888">=</text>

  <!-- total -->
  <rect x="332" y="188" width="80" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="372" y="204" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">k = i/j</text>

  <!-- ===== factor pair note ===== -->
  <rect x="36" y="240" width="448" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="256" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">因数对：j 与 i/j 一一对应（j 整除 i）</text>
  <text x="260" y="272" text-anchor="middle" font-size="10" fill="#666">枚举 j = 1…√i，同时得到因数 (j, i/j)，分别尝试 dp[j]+i/j 与 dp[i/j]+j</text>

  <!-- ===== Formula ===== -->
  <rect x="40" y="300" width="440" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="320" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">dp[i] = min(dp[j] + i/j)</text>
  <text x="260" y="336" text-anchor="middle" font-size="9" fill="#888">对所有 j | i，1 ≤ j &lt; i 取最小；dp[1] = 0</text>
</svg>
