<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="560" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">距离 K 算法流程：建父指针 + BFS 逐层扩展</text>

  <!-- ===== 阶段一标题 ===== -->
  <rect x="150" y="46" width="300" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">阶段一：DFS 建父指针（树 → 无向图）</text>

  <path d="M 300 76 L 300 92" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- buildParent 入口 -->
  <rect x="210" y="94" width="180" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="115" text-anchor="middle" font-size="12" fill="#333">buildParent(node, par)</text>

  <path d="M 300 126 L 300 142" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判空菱形 -->
  <polygon points="300,144 400,184 300,224 200,184" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="180" text-anchor="middle" font-size="12" fill="#333">node == null ?</text>
  <text x="300" y="198" text-anchor="middle" font-size="10" fill="#888">空节点</text>

  <!-- 是 → return -->
  <path d="M 400 184 L 470 184 L 470 116" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="425" y="176" font-size="10" fill="#b85450">是</text>
  <rect x="410" y="94" width="120" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="470" y="115" text-anchor="middle" font-size="12" fill="#888">return</text>

  <!-- 否 ↓ -->
  <path d="M 300 224 L 300 242" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="240" font-size="10" fill="#82b366">否</text>

  <!-- 记录父指针 -->
  <rect x="200" y="244" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="265" text-anchor="middle" font-size="12" fill="#333">parent[node] = par</text>

  <path d="M 300 276 L 300 292" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 递归左右 -->
  <rect x="120" y="294" width="170" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="205" y="315" text-anchor="middle" font-size="11" fill="#333">buildParent(left, node)</text>

  <rect x="310" y="294" width="170" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="395" y="315" text-anchor="middle" font-size="11" fill="#333">buildParent(right, node)</text>

  <!-- 分隔虚线 -->
  <path d="M 60 344 L 540 344" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== 阶段二标题 ===== -->
  <rect x="120" y="356" width="360" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="376" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">阶段二：BFS 从 target 逐层扩展</text>

  <path d="M 300 386 L 300 402" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="160" y="404" width="280" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="425" text-anchor="middle" font-size="11" fill="#333">q=[target], visited={target}, dist=0</text>

  <path d="M 300 436 L 300 452" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- dist==k 菱形 -->
  <polygon points="300,454 420,494 300,534 180,494" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="490" text-anchor="middle" font-size="12" fill="#333">dist == k ?</text>
  <text x="300" y="508" text-anchor="middle" font-size="10" fill="#888">达到目标层</text>

  <!-- 是 → 收集答案 -->
  <path d="M 420 494 L 500 494 L 500 420" stroke="#82b366" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="445" y="486" font-size="10" fill="#82b366">是</text>
  <rect x="440" y="404" width="120" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="500" y="425" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回队列中值</text>

  <!-- 否 → 扩展（左下回环） -->
  <path d="M 180 494 L 80 494 L 80 404" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="486" font-size="10" fill="#b85450">否</text>

  <rect x="40" y="404" width="120" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="100" y="422" text-anchor="middle" font-size="10" fill="#b85450">处理当前层</text>
  <text x="100" y="438" text-anchor="middle" font-size="10" fill="#b85450">扩展 3 邻居</text>
  <text x="100" y="452" text-anchor="middle" font-size="10" fill="#b85450">未访问→入队</text>

  <!-- dist++ 回到菱形 -->
  <path d="M 100 404 L 100 388 L 300 388" stroke="#666" stroke-width="1.3" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="382" font-size="10" fill="#888">dist++ 后重新判定</text>

  <text x="300" y="552" text-anchor="middle" font-size="11" fill="#888">两阶段：建父指针 O(n) + BFS 逐层 O(n) = 总 O(n) 时间</text>
</svg>
