<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：双指针贪心 + 循环递增判定</text>

  <!-- init -->
  <rect x="200" y="46" width="140" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">初始化 i = 0, j = 0</text>

  <path d="M270,88 L270,110" stroke="#446688" stroke-width="1.8" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="282" y="106" font-size="10" fill="#888">i &lt; |str1| &amp;&amp; j &lt; |str2|</text>

  <!-- decision diamond: can match? -->
  <polygon points="270,112 390,168 270,224 150,168" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="160" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">str1[i]==str2[j]</text>
  <text x="270" y="178" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">或 next(str1[i])==str2[j] ?</text>

  <!-- yes branch: advance both -->
  <path d="M390,168 L440,168 L440,118 L342,68" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="412" y="160" font-size="10" fill="#4a7a3a" font-weight="bold">能匹配</text>

  <rect x="420" y="108" width="108" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="474" y="128" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">i++, j++</text>
  <text x="474" y="144" text-anchor="middle" font-size="9" fill="#4a7a3a">消费一个 str2 字符</text>

  <!-- no branch: advance only i -->
  <path d="M150,168 L100,168" stroke="#446688" stroke-width="1.8" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="112" y="160" font-size="10" fill="#446688" font-weight="bold">不能</text>

  <rect x="40" y="148" width="108" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="94" y="168" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">i++</text>
  <text x="94" y="184" text-anchor="middle" font-size="9" fill="#446688">跳过 str1[i]，j 不动</text>

  <!-- loop back -->
  <path d="M94,194 L94,232 L270,232 L270,224" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M474,154 L474,232 L270,232" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="282" y="226" font-size="9" fill="#888">下一个 str1 字符</text>

  <!-- end -->
  <path d="M270,232 L270,262" stroke="#446688" stroke-width="1.8" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="282" y="256" font-size="10" fill="#888">遍历结束</text>

  <!-- final decision: j == |str2|? -->
  <polygon points="270,264 380,312 270,360 160,312" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="316" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">j == |str2| ?</text>

  <!-- yes: true -->
  <path d="M380,312 L430,312" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="394" y="304" font-size="9" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="430" y="292" width="90" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="475" y="317" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return true</text>

  <!-- no: false -->
  <path d="M160,312 L110,312" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="122" y="304" font-size="9" fill="#b85450" font-weight="bold">否</text>
  <rect x="20" y="292" width="90" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="65" y="317" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return false</text>

  <!-- note -->
  <rect x="60" y="378" width="420" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="270" y="398" text-anchor="middle" font-size="11" fill="#333">next(c) = 循环递增：'a'→'b' → ... → 'z'→'a'，即 (c−'a'+1)%26+'a'</text>
  <text x="270" y="416" text-anchor="middle" font-size="10" fill="#555">i、j 各最多走 |str1| 步，整体 O(|str1|) 时间、O(1) 空间</text>
</svg>
