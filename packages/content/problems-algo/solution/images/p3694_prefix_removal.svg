<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">核心观察：删除 [i, i+k) ⇒ 终点 = 前缀位置 + 后缀位移</text>

  <!-- 字符串分三段 -->
  <text x="77" y="38" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">前缀</text>
  <text x="147" y="38" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">删除段(长 k)</text>
  <text x="217" y="38" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">后缀</text>

  <rect x="60" y="44" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="77" y="65" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">L</text>

  <rect x="130" y="44" width="34" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="147" y="65" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">U</text>

  <rect x="200" y="44" width="34" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="217" y="65" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">L</text>

  <!-- 打叉：删除窗口 -->
  <path d="M 133 47 L 161 73" fill="none" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <path d="M 133 73 L 161 47" fill="none" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>

  <!-- 拼接公式 -->
  <rect x="80" y="96" width="360" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="117" text-anchor="middle" font-size="13.5" fill="#333" filter="url(#rough2)">终点(i) = P[i] + ( P[n] − P[i+k] )</text>
  <text x="260" y="135" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">x、y 坐标各自独立做前缀和，O(1) 拼出终点</text>

  <!-- 左下：路径示意 -->
  <text x="160" y="166" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">例：s = "LUL"，k = 1，删除中间的 U</text>

  <path d="M 170 273 Q 118 240 68 273" fill="none" stroke="#888" stroke-width="1.5"
        stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="118" y="246" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">剩余移动 "LL"</text>

  <path d="M 170 285 L 124 285" fill="none" stroke="#446688" stroke-width="2.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="147" y="277" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">L</text>

  <path d="M 118 285 L 72 285" fill="none" stroke="#4a7a3a" stroke-width="2.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="95" y="277" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">L</text>

  <circle cx="170" cy="285" r="3.5" fill="#333" filter="url(#rough2)"/>
  <text x="170" y="303" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(0,0)</text>

  <circle cx="118" cy="285" r="3.5" fill="#446688" filter="url(#rough2)"/>
  <text x="118" y="320" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">P[i]=(−1,0)</text>

  <circle cx="66" cy="285" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <text x="66" y="303" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">终点(−2,0)</text>

  <text x="160" y="344" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">前缀把人带到 P[i]，再叠加后缀总位移</text>

  <!-- 右下：枚举结果 -->
  <rect x="300" y="158" width="200" height="176" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="400" y="180" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">枚举全部 3 个删除位置：</text>
  <path d="M 310 190 L 490 190" fill="none" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="320" y="210" font-size="11.5" fill="#333" filter="url(#rough2)">i=0 删 L → (−1, 1)</text>
  <text x="320" y="232" font-size="11.5" fill="#333" filter="url(#rough2)">i=1 删 U → (−2, 0)</text>
  <text x="320" y="254" font-size="11.5" fill="#333" filter="url(#rough2)">i=2 删 L → (−1, 1)</text>
  <text x="452" y="254" font-size="10.5" fill="#b85450" filter="url(#rough2)">← 重复</text>
  <rect x="330" y="268" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="400" y="288" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">不同终点数 = 2</text>
  <text x="400" y="320" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">💡 哈希集合自动去重</text>
</svg>
