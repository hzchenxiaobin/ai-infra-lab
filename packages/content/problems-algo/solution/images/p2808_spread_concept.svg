<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">值 x 的传播：从每个出现位置每秒向左右各扩散 1 格，两股前沿在间隙中间相遇</text>

  <!-- t=0 row -->
  <text x="64" y="89" font-size="12" fill="#999" font-weight="bold" filter="url(#rough2)">t = 0</text>
  <rect x="140" y="64" width="56" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="168" y="90" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">x</text>
  <rect x="196" y="64" width="56" height="42" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="224" y="90" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">·</text>
  <rect x="252" y="64" width="56" height="42" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="90" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">·</text>
  <rect x="308" y="64" width="56" height="42" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="336" y="90" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">·</text>
  <rect x="364" y="64" width="56" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="392" y="90" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">x</text>

  <!-- gap bracket t=0 -->
  <path d="M 168 114 L 168 120 L 392 120 L 392 114" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="280" y="134" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">gap = 4（两处 x 之间的距离）</text>

  <!-- down arrow t0 -> t1 -->
  <path d="M 280 142 L 280 150" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- t=1 row -->
  <text x="64" y="181" font-size="12" fill="#999" font-weight="bold" filter="url(#rough2)">t = 1</text>
  <rect x="140" y="156" width="56" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="168" y="182" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">x</text>
  <rect x="196" y="156" width="56" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="224" y="182" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">x</text>
  <rect x="252" y="156" width="56" height="42" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="182" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">·</text>
  <rect x="308" y="156" width="56" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="336" y="182" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">x</text>
  <rect x="364" y="156" width="56" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="392" y="182" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">x</text>

  <!-- spread arrows t0->t1 -->
  <text x="440" y="174" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">← 向左扩散</text>
  <text x="440" y="190" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ 向右扩散</text>

  <!-- down arrow t1 -> t2 -->
  <path d="M 280 234 L 280 242" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- t=2 row -->
  <text x="64" y="273" font-size="12" fill="#999" font-weight="bold" filter="url(#rough2)">t = 2</text>
  <rect x="140" y="248" width="56" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="168" y="274" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">x</text>
  <rect x="196" y="248" width="56" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="224" y="274" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">x</text>
  <rect x="252" y="248" width="56" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="274" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">x</text>
  <rect x="308" y="248" width="56" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="336" y="274" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">x</text>
  <rect x="364" y="248" width="56" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="392" y="274" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">x</text>

  <!-- meet annotation -->
  <path d="M 268 230 L 280 244" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 292 230 L 280 244" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="280" y="226" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">两股前沿在中间相遇！</text>

  <!-- bottom note -->
  <rect x="50" y="306" width="460" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="64" y="328" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">关键结论：</text>
  <text x="64" y="348" font-size="12" fill="#555" filter="url(#rough2)">相邻两处 x 间距为 d → 填满中间段需 floor(d / 2) 秒（两股各走 d/2）</text>
</svg>
