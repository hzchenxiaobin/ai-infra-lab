<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：≤ 2 次换道 ⇒ 路径只有三种形态</text>
  <text x="260" y="38" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">示例 1 的最优路径：形态「1→2→1」，两次换道，合计 14</text>

  <!-- two lanes with example values -->
  <text x="52" y="68" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">车道1</text>
  <text x="52" y="118" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">车道2</text>

  <rect x="95" y="50" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="117" y="69" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="145" y="50" width="44" height="28" fill="#ffffff" stroke="#9db4c9" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="167" y="69" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">-2</text>
  <rect x="195" y="50" width="44" height="28" fill="#ffffff" stroke="#9db4c9" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="217" y="69" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">-10</text>
  <rect x="245" y="50" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="267" y="69" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="95" y="100" width="44" height="28" fill="#ffffff" stroke="#9db4c9" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="117" y="119" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">-5</text>
  <rect x="145" y="100" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="167" y="119" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">10</text>
  <rect x="195" y="100" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="217" y="119" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="245" y="100" width="44" height="28" fill="#ffffff" stroke="#9db4c9" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="267" y="119" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">1</text>

  <path d="M 117 64 L 167 114 L 217 114 L 267 64" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <circle cx="117" cy="64" r="3" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="167" cy="114" r="3" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="217" cy="114" r="3" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="267" cy="64" r="3" fill="#b85450" filter="url(#rough2)"/>
  <text x="128" y="90" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">换道①</text>
  <text x="230" y="90" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">换道②</text>
  <text x="400" y="92" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">1 + 10 + 0 + 3 = 14</text>

  <!-- state machine of three rolling variables -->
  <text x="260" y="148" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">三个滚动变量分别维护三种形态的最优段和（Kadane 式更新）</text>

  <rect x="55" y="158" width="130" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="120" y="176" text-anchor="middle" font-size="11" font-weight="bold" fill="#33506b" filter="url(#rough2)">a：形态「1」</text>
  <text x="120" y="193" text-anchor="middle" font-size="9" fill="#55677d" filter="url(#rough2)">max(a, 0) + lane1[i]</text>

  <rect x="205" y="158" width="130" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="176" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">b：形态「1→2」</text>
  <text x="270" y="193" text-anchor="middle" font-size="9" fill="#4a6b3f" filter="url(#rough2)">max(max(b,0)+lane2[i], a)</text>

  <rect x="355" y="158" width="130" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="420" y="176" text-anchor="middle" font-size="11" font-weight="bold" fill="#33506b" filter="url(#rough2)">c：形态「1→2→1」</text>
  <text x="420" y="193" text-anchor="middle" font-size="9" fill="#55677d" filter="url(#rough2)">max(max(c,0)+lane1[i], b)</text>

  <path d="M 185 180 L 205 180" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" fill="none" filter="url(#rough2)"/>
  <text x="195" y="172" text-anchor="middle" font-size="9" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">换道</text>
  <path d="M 335 180 L 355 180" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" fill="none" filter="url(#rough2)"/>
  <text x="345" y="172" text-anchor="middle" font-size="9" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">换道</text>

  <!-- bottom notes -->
  <g filter="url(#rough2)">
    <rect x="40" y="222" width="220" height="66" fill="#ffffff" stroke="#9db4c9" stroke-width="1.4" stroke-dasharray="5 3" rx="8"/>
    <text x="150" y="240" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#33506b">① 随进随出 = Kadane 重启</text>
    <text x="150" y="256" text-anchor="middle" font-size="9.5" fill="#55677d">max(·, 0)：前缀为负就地丢弃，</text>
    <text x="150" y="270" text-anchor="middle" font-size="9.5" fill="#55677d">在第 i 英里重新进入；「至少 1 英里」自动满足</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="280" y="222" width="220" height="66" fill="#ffffff" stroke="#9db4c9" stroke-width="1.4" stroke-dasharray="5 3" rx="8"/>
    <text x="390" y="240" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5d24">② 首尾的特殊换道</text>
    <text x="390" y="256" text-anchor="middle" font-size="9.5" fill="#55677d">进站立即换道 ⇒ b 的重启分支</text>
    <text x="390" y="270" text-anchor="middle" font-size="9.5" fill="#55677d">出站前免费换道 ⇒ c ≥ b，答案只需收 a 与 c</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="40" y="302" width="460" height="44" fill="#ffffff" stroke="#9db4c9" stroke-width="1.4" stroke-dasharray="5 3" rx="8"/>
    <text x="270" y="320" text-anchor="middle" font-size="10" font-weight="bold" fill="#8a6d1f">每英里按序更新：a → b → c（后者引用本轮前者，顺序不可换）</text>
    <text x="270" y="338" text-anchor="middle" font-size="10" fill="#55677d">单趟扫描 O(n) 时间 / O(1) 空间；答案可为负，初始化用 −∞</text>
  </g>
</svg>
