<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="33" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="880" height="400" fill="#fdfcf7"/>

  <text x="440" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">旋转链表：算法流程</text>
  <path d="M 290 40 Q 440 48 590 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Step 1 -->
  <g filter="url(#sk)"><rect x="60" y="62" width="760" height="44" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="80" y="82" font-size="13" font-weight="bold" fill="#2b6e9e">① 边界处理</text>
  <text x="80" y="98" font-size="11" fill="#555" font-family="monospace">if !head or !head.next or k == 0: return head</text>
  <text x="620" y="90" font-size="10" fill="#888">空链表 / 单节点 / k=0</text>

  <!-- Step 2 -->
  <g filter="url(#sk)"><rect x="60" y="116" width="760" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="80" y="136" font-size="13" font-weight="bold" fill="#2e6e2e">② 求长度并找尾</text>
  <text x="80" y="152" font-size="11" fill="#555" font-family="monospace">n = 1; tail = head; while tail.next: n++; tail = tail.next</text>
  <text x="620" y="144" font-size="10" fill="#888">一趟遍历得 n 和 tail</text>

  <!-- Step 3 -->
  <g filter="url(#sk)"><rect x="60" y="170" width="760" height="44" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="80" y="190" font-size="13" font-weight="bold" fill="#7a5415">③ 取模</text>
  <text x="80" y="206" font-size="11" fill="#555" font-family="monospace">k %= n; if k == 0: return head</text>
  <text x="620" y="198" font-size="10" fill="#888">k 可达 2×10⁹，必须取模</text>

  <!-- Step 4 -->
  <g filter="url(#sk)"><rect x="60" y="224" width="760" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="80" y="244" font-size="13" font-weight="bold" fill="#b85450">④ 成环</text>
  <text x="80" y="260" font-size="11" fill="#555" font-family="monospace">tail.next = head</text>
  <text x="620" y="252" font-size="10" fill="#888">首尾相连成环</text>

  <!-- Step 5 -->
  <g filter="url(#sk)"><rect x="60" y="278" width="760" height="44" rx="8" fill="#f3e8fb" stroke="#8e4adb" stroke-width="1.5"/></g>
  <text x="80" y="298" font-size="13" font-weight="bold" fill="#6b3da0">⑤ 走到新尾</text>
  <text x="80" y="314" font-size="11" fill="#555" font-family="monospace">new_tail = head; for i in range(n - k - 1): new_tail = new_tail.next</text>
  <text x="620" y="306" font-size="10" fill="#888">走 n−k−1 步到断点前驱</text>

  <!-- Step 6 -->
  <g filter="url(#sk)"><rect x="60" y="332" width="760" height="44" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.5"/></g>
  <text x="80" y="352" font-size="13" font-weight="bold" fill="#444">⑥ 断开并返回</text>
  <text x="80" y="368" font-size="11" fill="#555" font-family="monospace">new_head = new_tail.next; new_tail.next = null; return new_head</text>
  <text x="620" y="360" font-size="10" fill="#888">一刀切断，返回新头</text>

  <!-- key notes -->
  <g filter="url(#sk)"><rect x="60" y="382" width="760" height="14" rx="6" fill="#fffdf3" stroke="none"/></g>
</svg>
