<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心概念：0–9 各数字旋转 180° 后的归宿</text>

  <!-- Row 1: digits 0,1,2,3,4 -->
  <!-- 0 -> 0 (unchanged, blue) -->
  <rect x="30" y="60" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="52" y="88" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">0</text>
  <path d="M 78 82 L 108 82" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="114" y="60" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="136" y="88" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">0</text>
  <text x="80" y="120" text-anchor="middle" font-size="10" fill="#446688">不变</text>

  <!-- 1 -> 1 -->
  <rect x="180" y="60" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="202" y="88" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">1</text>
  <path d="M 228 82 L 258 82" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="264" y="60" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="286" y="88" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">1</text>
  <text x="230" y="120" text-anchor="middle" font-size="10" fill="#446688">不变</text>

  <!-- 2 -> 5 (changes, green) -->
  <rect x="330" y="60" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="352" y="88" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">2</text>
  <path d="M 378 82 L 408 82" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="414" y="60" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="436" y="88" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">5</text>
  <text x="380" y="120" text-anchor="middle" font-size="10" fill="#4a7a3a">改变</text>

  <!-- 3 -> invalid (red) -->
  <rect x="480" y="60" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="502" y="88" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">3</text>
  <path d="M 528 82 L 556 82" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <rect x="492" y="118" width="20" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="502" y="133" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">✗</text>
  <text x="502" y="150" text-anchor="middle" font-size="10" fill="#b85450">非法</text>

  <!-- Row 2: digits 4,5,6,7,8,9 -->
  <!-- 4 -> invalid -->
  <rect x="30" y="170" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="52" y="198" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">4</text>
  <rect x="42" y="228" width="20" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="52" y="243" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">✗</text>
  <text x="52" y="260" text-anchor="middle" font-size="10" fill="#b85450">非法</text>

  <!-- 5 -> 2 (changes) -->
  <rect x="100" y="170" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="122" y="198" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">5</text>
  <path d="M 148 192 L 178 192" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="184" y="170" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="206" y="198" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">2</text>
  <text x="150" y="230" text-anchor="middle" font-size="10" fill="#4a7a3a">改变</text>

  <!-- 6 -> 9 (changes) -->
  <rect x="250" y="170" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="272" y="198" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">6</text>
  <path d="M 298 192 L 328 192" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="334" y="170" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="356" y="198" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">9</text>
  <text x="300" y="230" text-anchor="middle" font-size="10" fill="#4a7a3a">改变</text>

  <!-- 7 -> invalid -->
  <rect x="400" y="170" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="422" y="198" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">7</text>
  <rect x="412" y="228" width="20" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="422" y="243" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">✗</text>
  <text x="422" y="260" text-anchor="middle" font-size="10" fill="#b85450">非法</text>

  <!-- 8 -> 8 (unchanged) -->
  <rect x="470" y="170" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="492" y="198" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">8</text>
  <path d="M 518 192 L 548 192" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <rect x="492" y="270" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="514" y="298" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">8</text>

  <!-- 9 -> 6 (changes) placed on row 2 right area; reuse 9 box drawn? draw separate below 6/9 row -->
  <rect x="250" y="270" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="272" y="298" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">9</text>
  <path d="M 298 292 L 328 292" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="334" y="270" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="356" y="298" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">6</text>
  <text x="300" y="330" text-anchor="middle" font-size="10" fill="#4a7a3a">改变</text>

  <!-- Legend / classification box -->
  <rect x="20" y="330" width="220" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="34" y="350" font-size="11" fill="#446688" font-weight="bold">数位三分类</text>
  <text x="34" y="366" font-size="10" fill="#446688">① 不变 {0,1,8} → 旋转后仍为自身</text>
  <text x="34" y="380" font-size="10" fill="#4a7a3a">② 改变 {2,5,6,9} → 旋转成另一合法数字</text>
  <text x="160" y="380" font-size="10" fill="#b85450">③ 非法 {3,4,7}</text>
</svg>
