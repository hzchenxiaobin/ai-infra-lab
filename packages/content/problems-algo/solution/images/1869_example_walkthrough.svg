<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：s = "110100010" 逐字符状态追踪</text>
  <text x="310" y="40" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">切换时结算前段并更新 max；遍历结束后再结算末段</text>

  <!-- Header row -->
  <rect x="20" y="52" width="580" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="54" y="69">i</text>
    <text x="104" y="69">c</text>
    <text x="245" y="69">事件</text>
    <text x="390" y="69">cur</text>
    <text x="445" y="69">run</text>
    <text x="510" y="69">max₁</text>
    <text x="570" y="69">max₀</text>
  </g>

  <!-- Row i=0: c=1, 新段, cur=1, run=1, max1=0, max0=0 -->
  <rect x="20" y="78" width="580" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <text x="54" y="93" fill="#555" font-weight="bold">0</text>
    <text x="104" y="93" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="245" y="93" fill="#888">新段开始</text>
    <text x="390" y="93" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="445" y="93" fill="#555">1</text>
    <text x="510" y="93" fill="#aaa">0</text>
    <text x="570" y="93" fill="#aaa">0</text>
  </g>

  <!-- Row i=1: c=1, 延续, cur=1, run=2 -->
  <rect x="20" y="100" width="580" height="22" fill="#f6fff6" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <text x="54" y="115" fill="#555" font-weight="bold">1</text>
    <text x="104" y="115" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="245" y="115" fill="#888">延续</text>
    <text x="390" y="115" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="445" y="115" fill="#555">2</text>
    <text x="510" y="115" fill="#aaa">0</text>
    <text x="570" y="115" fill="#aaa">0</text>
  </g>

  <!-- Row i=2: c=0, 切换→结算1: max1=2 -->
  <rect x="20" y="122" width="580" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <text x="54" y="137" fill="#555" font-weight="bold">2</text>
    <text x="104" y="137" fill="#446688" font-weight="bold">0</text>
    <text x="245" y="137" fill="#d6a040" font-weight="bold">切换 → 结算 1</text>
    <text x="390" y="137" fill="#446688" font-weight="bold">0</text>
    <text x="445" y="137" fill="#555">1</text>
    <text x="510" y="137" fill="#d6a040" font-weight="bold">2</text>
    <text x="570" y="137" fill="#aaa">0</text>
  </g>

  <!-- Row i=3: c=1, 切换→结算0: max0=1 -->
  <rect x="20" y="144" width="580" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <text x="54" y="159" fill="#555" font-weight="bold">3</text>
    <text x="104" y="159" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="245" y="159" fill="#d6a040" font-weight="bold">切换 → 结算 0</text>
    <text x="390" y="159" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="445" y="159" fill="#555">1</text>
    <text x="510" y="159" fill="#aaa">2</text>
    <text x="570" y="159" fill="#d6a040" font-weight="bold">1</text>
  </g>

  <!-- Row i=4: c=0, 切换→结算1: max1=max(2,1)=2 -->
  <rect x="20" y="166" width="580" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <text x="54" y="181" fill="#555" font-weight="bold">4</text>
    <text x="104" y="181" fill="#446688" font-weight="bold">0</text>
    <text x="245" y="181" fill="#d6a040" font-weight="bold">切换 → 结算 1</text>
    <text x="390" y="181" fill="#446688" font-weight="bold">0</text>
    <text x="445" y="181" fill="#555">1</text>
    <text x="510" y="181" fill="#aaa">2</text>
    <text x="570" y="181" fill="#aaa">1</text>
  </g>

  <!-- Row i=5: c=0, 延续, run=2 -->
  <rect x="20" y="188" width="580" height="22" fill="#f6faff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <text x="54" y="203" fill="#555" font-weight="bold">5</text>
    <text x="104" y="203" fill="#446688" font-weight="bold">0</text>
    <text x="245" y="203" fill="#888">延续</text>
    <text x="390" y="203" fill="#446688" font-weight="bold">0</text>
    <text x="445" y="203" fill="#555">2</text>
    <text x="510" y="203" fill="#aaa">2</text>
    <text x="570" y="203" fill="#aaa">1</text>
  </g>

  <!-- Row i=6: c=0, 延续, run=3 -->
  <rect x="20" y="210" width="580" height="22" fill="#f6faff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <text x="54" y="225" fill="#555" font-weight="bold">6</text>
    <text x="104" y="225" fill="#446688" font-weight="bold">0</text>
    <text x="245" y="225" fill="#888">延续</text>
    <text x="390" y="225" fill="#446688" font-weight="bold">0</text>
    <text x="445" y="225" fill="#555">3</text>
    <text x="510" y="225" fill="#aaa">2</text>
    <text x="570" y="225" fill="#aaa">1</text>
  </g>

  <!-- Row i=7: c=1, 切换→结算0: max0=max(1,3)=3 -->
  <rect x="20" y="232" width="580" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <text x="54" y="247" fill="#555" font-weight="bold">7</text>
    <text x="104" y="247" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="245" y="247" fill="#d6a040" font-weight="bold">切换 → 结算 0</text>
    <text x="390" y="247" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="445" y="247" fill="#555">1</text>
    <text x="510" y="247" fill="#aaa">2</text>
    <text x="570" y="247" fill="#d6a040" font-weight="bold">3</text>
  </g>

  <!-- Row i=8: c=0, 切换→结算1: max1=max(2,1)=2 -->
  <rect x="20" y="254" width="580" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <text x="54" y="269" fill="#555" font-weight="bold">8</text>
    <text x="104" y="269" fill="#446688" font-weight="bold">0</text>
    <text x="245" y="269" fill="#d6a040" font-weight="bold">切换 → 结算 1</text>
    <text x="390" y="269" fill="#446688" font-weight="bold">0</text>
    <text x="445" y="269" fill="#555">1</text>
    <text x="510" y="269" fill="#aaa">2</text>
    <text x="570" y="269" fill="#aaa">3</text>
  </g>

  <!-- Final settle row -->
  <rect x="20" y="276" width="580" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="2" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <text x="54" y="291" fill="#b85450" font-weight="bold">—</text>
    <text x="104" y="291" fill="#b85450" font-weight="bold">—</text>
    <text x="245" y="291" fill="#b85450" font-weight="bold">末段结算 0</text>
    <text x="390" y="291" fill="#888">—</text>
    <text x="445" y="291" fill="#888">—</text>
    <text x="510" y="291" fill="#aaa">2</text>
    <text x="570" y="291" fill="#b85450" font-weight="bold">3</text>
  </g>

  <!-- Summary -->
  <rect x="60" y="316" width="500" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="336" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">max₁ = 2（"11" 段）    max₀ = 3（"000" 段）</text>
  <text x="310" y="352" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">橙色行 = 字符切换并结算前段；红色行 = 遍历结束结算末段</text>

  <!-- Result -->
  <rect x="130" y="372" width="360" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="310" y="395" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">max₁ &gt; max₀ ? 2 &gt; 3 ? → false ✓</text>
</svg>
