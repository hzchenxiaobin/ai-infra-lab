<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：记忆化包装函数</text>

  <!-- start -->
  <rect x="160" y="36" width="200" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">调用 memoized(...args)</text>
  <path d="M 260 74 L 260 90" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- serialize key -->
  <rect x="120" y="92" width="280" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="116" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">key = JSON.stringify(args)</text>
  <path d="M 260 130 L 260 146" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond -->
  <polygon points="260,148 390,200 260,252 130,200" fill="#ffffff" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="204" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">cache.has(key) ?</text>

  <!-- YES branch (hit) -->
  <text x="400" y="192" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 390 200 L 445 200 L 445 250" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="380" y="252" width="130" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="445" y="276" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">return</text>
  <text x="445" y="294" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">cache.get(key)</text>
  <text x="445" y="310" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">命中·不调 fn</text>

  <!-- NO branch (miss) -->
  <text x="272" y="266" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 260 252 L 260 268" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="270" width="250" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="245" y="294" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">result = fn(...args)</text>
  <path d="M 245 308 L 245 322" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="324" width="250" height="38" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="245" y="348" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">cache.set(key, result)</text>
  <path d="M 245 362 L 245 378" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="380" width="250" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="245" y="404" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return result</text>

  <!-- note -->
  <rect x="120" y="430" width="390" height="30" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="130" y="449" font-size="11" fill="#b85450" filter="url(#rough2)">不变式：命中即不调 fn → callCount 不增；键 = 参数序列的有序序列化</text>
</svg>
