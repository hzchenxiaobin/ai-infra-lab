<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">好路径的数目：算法流程</text>

  <!-- ===== Step 1: preprocess ===== -->
  <rect x="120" y="44" width="320" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① 预处理</text>
  <text x="280" y="84" text-anchor="middle" font-size="11" fill="#555">建桶 nodes_by_val[V]；边按 max(vals[u],vals[v]) 升序</text>

  <line x1="280" y1="100" x2="280" y2="118" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: init ===== -->
  <rect x="120" y="118" width="320" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="138" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">② 初始化并查集 par[i] = i，ans = n</text>
  <text x="280" y="156" text-anchor="middle" font-size="10" fill="#888">n 条单节点路径先计入答案</text>

  <line x1="280" y1="168" x2="280" y2="186" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: main loop ===== -->
  <rect x="60" y="186" width="440" height="200" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="6 4" rx="12" filter="url(#rough2)"/>
  <text x="280" y="208" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">③ for V in 值的升序唯一值：</text>

  <!-- 3a add edges -->
  <rect x="90" y="218" width="380" height="44" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="238" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">a) 加边：union 所有 max(vals[u],vals[v]) == V 的边</text>
  <text x="280" y="254" text-anchor="middle" font-size="10" fill="#888">此时分量恰为「节点值 ≤ V」诱导子图的连通块</text>

  <line x1="280" y1="262" x2="280" y2="274" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3b bucket -->
  <rect x="90" y="274" width="380" height="44" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="294" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">b) 分桶：同值 V 节点按 find(root) 分组，得每桶 k</text>
  <text x="280" y="310" text-anchor="middle" font-size="10" fill="#888">同一桶 = 经「全 ≤ V」节点可达 → 两两构成好路径</text>

  <line x1="280" y1="318" x2="280" y2="330" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3c accumulate -->
  <rect x="90" y="330" width="380" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">c) 累加：ans += Σ C(k,2) = Σ k(k−1)/2</text>
  <text x="280" y="366" text-anchor="middle" font-size="10" fill="#888">每个分量内同值节点两两配对</text>

  <!-- loop back arrow on right -->
  <path d="M 500 286 Q 524 286 524 210 Q 524 200 500 200" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="510" y="248" text-anchor="middle" font-size="10" fill="#4a7a3a" font-style="italic">下一 V</text>

  <line x1="280" y1="386" x2="280" y2="404" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 4: return ===== -->
  <rect x="120" y="404" width="320" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="424" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">④ 返回 ans = n + Σ C(k,2)</text>
  <text x="280" y="442" text-anchor="middle" font-size="10" fill="#888">单节点 n 条 + 同值配对 Σ C(k,2) 条</text>
</svg>
