<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：n = 10 的 DP 填表</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">dp[k] = k 作为因子的最大值（允许不拆）；答案 = dp[10] = 36</text>

  <!-- ===== DP table header ===== -->
  <g font-size="10" fill="#666">
    <text x="36" y="74" text-anchor="middle" font-weight="bold" fill="#444">k</text>
    <text x="36" y="90" text-anchor="middle" fill="#888" font-size="8">因子值</text>
  </g>

  <!-- k row -->
  <g font-size="10" fill="#333" font-weight="bold">
    <rect x="60" y="62" width="38" height="30" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="79" y="82" text-anchor="middle">1</text>
    <rect x="100" y="62" width="38" height="30" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="119" y="82" text-anchor="middle">2</text>
    <rect x="140" y="62" width="38" height="30" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="159" y="82" text-anchor="middle">3</text>
    <rect x="180" y="62" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="199" y="82" text-anchor="middle">4</text>
    <rect x="220" y="62" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="239" y="82" text-anchor="middle">5</text>
    <rect x="260" y="62" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="279" y="82" text-anchor="middle">6</text>
    <rect x="300" y="62" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="319" y="82" text-anchor="middle">7</text>
    <rect x="340" y="62" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="359" y="82" text-anchor="middle">8</text>
    <rect x="380" y="62" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="399" y="82" text-anchor="middle">9</text>
    <rect x="420" y="62" width="38" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="439" y="82" text-anchor="middle" fill="#b85450">10</text>
  </g>

  <!-- ===== dp[k] row ===== -->
  <g font-size="10" fill="#333">
    <rect x="60" y="96" width="38" height="30" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="79" y="116" text-anchor="middle">1</text>
    <rect x="100" y="96" width="38" height="30" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="119" y="116" text-anchor="middle">2</text>
    <rect x="140" y="96" width="38" height="30" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="159" y="116" text-anchor="middle">3</text>
    <rect x="180" y="96" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="199" y="116" text-anchor="middle" font-weight="bold">4</text>
    <rect x="220" y="96" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="239" y="116" text-anchor="middle" font-weight="bold">6</text>
    <rect x="260" y="96" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="279" y="116" text-anchor="middle" font-weight="bold">9</text>
    <rect x="300" y="96" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="319" y="116" text-anchor="middle" font-weight="bold">12</text>
    <rect x="340" y="96" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="359" y="116" text-anchor="middle" font-weight="bold">18</text>
    <rect x="380" y="96" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="399" y="116" text-anchor="middle" font-weight="bold">27</text>
    <rect x="420" y="96" width="38" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="439" y="116" text-anchor="middle" font-weight="bold" fill="#b85450">36</text>
  </g>

  <!-- label for dp row -->
  <text x="36" y="116" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">dp[k]</text>

  <!-- ===== annotation ===== -->
  <rect x="40" y="138" width="440" height="56" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="260" y="156" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">k=1,2,3 时 dp[k]=k（作为因子，不拆优于拆）</text>
  <text x="260" y="172" text-anchor="middle" font-size="10" fill="#555">k≥4 时拆更优：dp[4]=2×2=4, dp[5]=2×3=6, dp[6]=3×3=9 …</text>
  <text x="260" y="186" text-anchor="middle" font-size="9" fill="#888">规律：dp[k] 越往后越接近「全切成 3」</text>

  <!-- ===== dp[10] computation ===== -->
  <text x="40" y="216" font-size="11" fill="#444" font-weight="bold">dp[10] 的计算（枚举第一刀 j，取 j × dp[10−j] 的最大值）：</text>

  <g font-size="10" fill="#333">
    <rect x="40" y="226" width="440" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
    <text x="56" y="244" font-size="10">j=1: 1×dp[9]=27</text>
    <text x="56" y="260" font-size="10">j=2: 2×dp[8]=36</text>
    <text x="56" y="276" font-size="10">j=3: 3×dp[7]=36</text>
    <text x="56" y="292" font-size="10">j=4: 4×dp[6]=36</text>
    <text x="56" y="306" font-size="10">j=5: 5×dp[5]=30</text>

    <text x="280" y="248" font-size="11" fill="#b85450" font-weight="bold">最大值 = 36</text>
    <text x="280" y="266" font-size="10" fill="#555">对应拆法：3 + 3 + 4</text>
    <text x="280" y="282" font-size="10" fill="#555">3 × 3 × 4 = 36</text>
    <text x="280" y="300" font-size="9" fill="#888">贪心验证：10÷3=3⋯1</text>
    <text x="280" y="312" font-size="9" fill="#888">→ 3² × 4 = 36 ✓</text>
  </g>

  <!-- ===== Greedy check badge ===== -->
  <rect x="40" y="318" width="440" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="338" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">DP 与贪心结果一致：余数为 1 时凑成 4，恰好等于 dp 表的最大值</text>
</svg>
