<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：最终 z 序 ＝ 逆序去重 queries ＋ 原序补齐 windows</text>
  <text x="24" y="42" font-size="10" fill="#999" filter="url(#rough2)">（以示例 2 为例）</text>

  <!-- queries 行 -->
  <text x="24" y="72" font-size="11" fill="#555" filter="url(#rough2)">queries</text>
  <rect x="88" y="52" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="108" y="70" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="132" y="52" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="152" y="70" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="176" y="52" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="196" y="70" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="240" y="66" font-size="10.5" fill="#555" filter="url(#rough2)">从右往左收新 id</text>

  <!-- 交叉箭头：体现逆序反转 -->
  <path d="M 196 82 C 196 104, 108 98, 108 120" stroke="#446688" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 152 82 L 152 120" stroke="#446688" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 108 82 C 108 104, 196 98, 196 120" stroke="#446688" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ans 上层 -->
  <text x="24" y="142" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans 上层</text>
  <rect x="88" y="122" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="108" y="140" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="132" y="122" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="152" y="140" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="176" y="122" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="196" y="140" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="240" y="136" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">最后选中的排最前</text>

  <path d="M 152 152 L 152 210" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- windows 行 -->
  <text x="204" y="186" text-anchor="end" font-size="11" fill="#555" filter="url(#rough2)">windows 正序扫</text>
  <rect x="264" y="166" width="40" height="28" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="284" y="184" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">1</text>
  <path d="M 268 190 L 300 172" stroke="#b85450" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <rect x="308" y="166" width="40" height="28" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="328" y="184" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">4</text>
  <path d="M 312 190 L 344 172" stroke="#b85450" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <rect x="352" y="166" width="40" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="372" y="184" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="396" y="166" width="40" height="28" rx="4" fill="#f0f0f0" stroke="#aaaaaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="416" y="184" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">3</text>
  <path d="M 400 190 L 432 172" stroke="#b85450" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="330" y="210" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">已收过的划掉，新面孔 2 接到尾部</text>

  <path d="M 372 196 C 372 222, 354 218, 354 238" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 最终两层结构 -->
  <rect x="60" y="216" width="224" height="66" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="172" y="234" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">被选中层：最后选中时间 ↓</text>
  <rect x="84" y="244" width="40" height="26" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="104" y="261" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="132" y="244" width="40" height="26" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="152" y="261" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="180" y="244" width="40" height="26" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="261" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>

  <rect x="292" y="216" width="128" height="66" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="356" y="234" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">未选中层：原序</text>
  <rect x="336" y="244" width="40" height="26" rx="4" fill="#ffffff" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="356" y="261" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>

  <text x="260" y="304" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">最终 z 序（顶→底）：[3, 1, 4, 2]</text>
  <text x="260" y="330" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">同一 id 被选多次 ⇒ 只有最后一次作数</text>
  <text x="260" y="348" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">从未选中的窗口：相对顺序永远不变（稳定性）</text>
</svg>
