<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="330" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：三个示例，三种「死法」</text>

  <!-- 表头 -->
  <rect x="22" y="42" width="118" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="81" y="62" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">word</text>

  <rect x="140" y="42" width="68" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="174" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">长度≥3</text>

  <rect x="208" y="42" width="88" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="252" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">无非法字符</text>

  <rect x="296" y="42" width="68" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="330" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">有元音</text>

  <rect x="364" y="42" width="68" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="398" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">有辅音</text>

  <rect x="432" y="42" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="467" y="62" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">结果</text>

  <!-- 行1：234Adas -->
  <rect x="22" y="74" width="118" height="40" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="81" y="99" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">"234Adas"</text>

  <rect x="140" y="74" width="68" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="174" y="91" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="174" y="106" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">7 个</text>

  <rect x="208" y="74" width="88" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="252" y="91" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="252" y="106" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">全是字母数字</text>

  <rect x="296" y="74" width="68" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="330" y="91" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="330" y="106" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">a</text>

  <rect x="364" y="74" width="68" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="398" y="91" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="398" y="106" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">d、s</text>

  <rect x="432" y="74" width="70" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="467" y="99" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">true</text>

  <!-- 行2：b3 -->
  <rect x="22" y="118" width="118" height="40" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="81" y="143" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">"b3"</text>

  <rect x="140" y="118" width="68" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="174" y="135" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="174" y="150" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">只有 2 个</text>

  <rect x="208" y="118" width="88" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="252" y="135" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <rect x="296" y="118" width="68" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="330" y="135" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <rect x="364" y="118" width="68" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="398" y="135" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="398" y="150" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">b</text>

  <rect x="432" y="118" width="70" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="467" y="143" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">false</text>

  <!-- 行3：a3$e -->
  <rect x="22" y="162" width="118" height="40" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="81" y="187" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">"a3$e"</text>

  <rect x="140" y="162" width="68" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="174" y="179" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="174" y="194" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">4 个</text>

  <rect x="208" y="162" width="88" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="252" y="179" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="252" y="194" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">'$' 出局</text>

  <rect x="296" y="162" width="68" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="330" y="179" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="330" y="194" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">a、e</text>

  <rect x="364" y="162" width="68" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="398" y="179" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <rect x="432" y="162" width="70" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="467" y="187" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">false</text>

  <!-- 三条注解 -->
  <rect x="48" y="216" width="424" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="234" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">① "234Adas"：数字旁观、元音 a、辅音 d/s —— 四关全过 → true</text>

  <rect x="48" y="248" width="424" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="266" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">② "b3"：第一关就倒下（长度 2 &lt; 3）—— 其实元音也缺席，一票否决看最快倒下的一关</text>

  <rect x="48" y="280" width="424" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="298" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">③ "a3$e"：'$' 一票否决 —— 纵有元音 a/e 也救不回，何况辅音也缺席</text>

  <text x="260" y="322" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">四个条件是 AND：任何一关 ✗ 即 false</text>
</svg>
