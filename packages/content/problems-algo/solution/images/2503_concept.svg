  <text x="671.0" y="153.0" text-anchor="middle" font-size="13" fill="#2e6e2e" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="692" y="128" width="42" height="42" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.7"/></g>
  <text x="713.0" y="153.0" text-anchor="middle" font-size="13" fill="#2e6e2e" filter="url(#sk)">5</text>
  <g filter="url(#sk)"><rect x="734" y="128" width="42" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="755.0" y="153.0" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#sk)">7</text>
  <g filter="url(#sk)"><rect x="650" y="170" width="42" height="42" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.7"/></g>
  <text x="671.0" y="195.0" text-anchor="middle" font-size="13" fill="#2e6e2e" filter="url(#sk)">3</text>
  <g filter="url(#sk)"><rect x="692" y="170" width="42" height="42" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.7"/></g>
  <text x="713.0" y="195.0" text-anchor="middle" font-size="13" fill="#2e6e2e" filter="url(#sk)">5</text>
  <g filter="url(#sk)"><rect x="734" y="170" width="42" height="42" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.7"/></g>
  <text x="755.0" y="195.0" text-anchor="middle" font-size="13" fill="#2e6e2e" filter="url(#sk)">1</text>
  <text x="713.0" y="234" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">答案 = 8</text>
  <path d="M 206 149.0 L 350 149.0" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <path d="M 496 149.0 L 640 149.0" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="278.0" y="143.0" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#sk)">q↑</text>
  <text x="568.0" y="143.0" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#sk)">q↑</text>
  <g filter="url(#sk)"><rect x="60" y="272" width="22" height="14" rx="3" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="90" y="284" font-size="11" fill="#444" filter="url(#sk)">值 &lt; q 且连到 (0,0)（计分）</text>
  <g filter="url(#sk)"><rect x="280" y="272" width="22" height="14" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="4 3"/></g>
  <text x="310" y="284" font-size="11" fill="#444" filter="url(#sk)">值 &lt; q 但被堵隔（不计）</text>
  <g filter="url(#sk)"><rect x="500" y="272" width="22" height="14" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="530" y="284" font-size="11" fill="#444" filter="url(#sk)">值 ≥ q（过不去，挡路）</text>
  <g filter="url(#sk)"><rect x="60" y="300" width="780" height="84" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/></g>
  <text x="80" y="324" font-size="12" font-weight="bold" fill="#444" filter="url(#sk)">把每个查询独立看成「q 阈值下从 (0,0) 的连通块大小」</text>
  <text x="80" y="344" font-size="11" fill="#444" filter="url(#sk)">• 多个查询若各自 BFS：O(k·mn) 太慢。注意到 q↑ 时连通块只增不减 → 离线排序查询 + 单调扩张。</text>
  <text x="80" y="362" font-size="11" fill="#444" filter="url(#sk)">• 用最小堆维护「前沿」：堆顶 = 当前可达边界中值最小的格子；q 升到能跨过谁，就把谁「并入」并扩张其邻居。</text>
  <text x="80" y="380" font-size="11" fill="#7a5415" filter="url(#sk)">= 1697（离线排序查询）+ 1631/407（最小堆在网格上扩张）两种范式的合体。</text>
</svg>
