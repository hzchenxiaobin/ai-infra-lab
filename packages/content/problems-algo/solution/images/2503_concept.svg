  <text x="465.0" y="195.0" text-anchor="middle" font-size="13" fill="#7a5415" filter="url(#sk)">1</text>
  <text x="423.0" y="234" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">答案 = 5</text>
  <text x="713.0" y="74" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415" filter="url(#sk)">q = 6</text>
  <g filter="url(#sk)"><rect x="650" y="86" width="42" height="42" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.7"/></g>
  <text x="671.0" y="111.0" text-anchor="middle" font-size="13" fill="#2e6e2e" filter="url(#sk)">1</text>
  <text x="655" y="98" font-size="9" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">起</text>
  <g filter="url(#sk)"><rect x="692" y="86" width="42" height="42" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.7"/></g>
  <text x="713.0" y="111.0" text-anchor="middle" font-size="13" fill="#2e6e2e" filter="url(#sk)">2</text>
