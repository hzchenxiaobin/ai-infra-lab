  <g filter="url(#sk)"><rect x="402" y="170" width="42" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="423.0" y="195.0" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#sk)">5</text>
