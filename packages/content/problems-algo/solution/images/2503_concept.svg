  <text x="381.0" y="153.0" text-anchor="middle" font-size="13" fill="#2e6e2e" filter="url(#sk)">2</text>
  <g filter="url(#sk)"><rect x="402" y="128" width="42" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="423.0" y="153.0" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#sk)">5</text>
  <g filter="url(#sk)"><rect x="444" y="128" width="42" height="42" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
