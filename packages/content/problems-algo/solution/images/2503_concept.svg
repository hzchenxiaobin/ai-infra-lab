  <g filter="url(#sk)"><rect x="360" y="86" width="42" height="42" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.7"/></g>
  <text x="381.0" y="111.0" text-anchor="middle" font-size="13" fill="#2e6e2e" filter="url(#sk)">1</text>
  <text x="365" y="98" font-size="9" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">起</text>
