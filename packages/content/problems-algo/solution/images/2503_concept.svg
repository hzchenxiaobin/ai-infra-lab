  <rect width="900" height="470" fill="#fdfcf7"/>
  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">核心观察：阈值 q 下从 (0,0) 出发的连通块大小 = 答案</text>
