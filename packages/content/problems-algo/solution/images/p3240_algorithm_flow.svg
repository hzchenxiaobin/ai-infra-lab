<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 490"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="490" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">算法流程：一趟扫描分类计数，收尾三问</text>

  <!-- 起点 -->
  <rect x="70" y="42" width="190" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="165" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">输入 m×n 二进制矩阵 grid</text>
  <line x1="165" y1="74" x2="165" y2="86" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 四元组扫描 -->
  <rect x="70" y="88" width="190" height="54" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="165" y="107" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">四元组：i &lt; ⌊m/2⌋、j &lt; ⌊n/2⌋</text>
  <text x="165" y="123" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">ans += min(c, 4−c)</text>
  <text x="165" y="137" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">c = 组内 1 的个数</text>
  <line x1="165" y1="142" x2="165" y2="150" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定 1：m 奇？ -->
  <polygon points="165,150 225,176 165,202 105,176" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="165" y="180" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">m 为奇数？</text>
  <line x1="225" y1="176" x2="300" y2="176" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="254" y="170" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">是</text>
  <rect x="300" y="152" width="194" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="397" y="170" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">中间行二元组（j &lt; ⌊n/2⌋）</text>
  <text x="397" y="188" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">c=1 → ans+1, flex+1；c=2 → pair11+1</text>
  <path d="M397,198 C397,214 215,210 170,222" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="165" y1="202" x2="165" y2="230" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="176" y="220" font-size="10" fill="#666" filter="url(#rough2)">否</text>

  <!-- 判定 2：n 奇？ -->
  <polygon points="165,230 225,256 165,282 105,256" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="165" y="260" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">n 为奇数？</text>
  <line x1="225" y1="256" x2="300" y2="256" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="254" y="250" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">是</text>
  <rect x="300" y="232" width="194" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="397" y="250" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">中间列二元组（i &lt; ⌊m/2⌋）</text>
  <text x="397" y="268" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">c=1 → ans+1, flex+1；c=2 → pair11+1</text>
  <path d="M397,278 C397,294 215,290 170,302" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="165" y1="282" x2="165" y2="306" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="176" y="298" font-size="10" fill="#666" filter="url(#rough2)">否</text>

  <!-- 判定 3：中心格 -->
  <polygon points="165,306 225,332 165,358 105,332" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="165" y="336" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">双奇且中心=1？</text>
  <line x1="225" y1="332" x2="300" y2="332" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="254" y="326" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">是</text>
  <rect x="300" y="310" width="194" height="42" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="397" y="335" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">ans += 1（中心格必须归零）</text>
  <path d="M397,352 C397,366 215,362 170,372" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="165" y1="358" x2="165" y2="376" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="176" y="372" font-size="10" fill="#666" filter="url(#rough2)">否</text>

  <!-- 判定 4：pair11 奇偶 -->
  <polygon points="165,372 225,402 165,432 105,402" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="165" y="406" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">pair11 为奇数？</text>
  <line x1="225" y1="402" x2="300" y2="402" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="254" y="396" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">是</text>
  <rect x="300" y="366" width="194" height="70" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="397" y="384" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">余数调配（flex = 不等对数）</text>
  <text x="397" y="402" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">flex &gt; 0 → 挑 1 对修成 11（+0）</text>
  <text x="397" y="420" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">flex = 0 → ans += 2（硬改 11⇄00）</text>
  <path d="M397,436 C397,458 270,460 240,458" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="165" y1="432" x2="165" y2="444" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="176" y="441" font-size="10" fill="#666" filter="url(#rough2)">否</text>

  <!-- 结果 -->
  <rect x="95" y="444" width="140" height="34" rx="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="165" y="466" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f5d27" filter="url(#rough2)">return ans</text>
</svg>
