<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例 1 演算：m=4, n=6，最终状态与计数</text>
  <text x="270" y="42" text-anchor="middle" font-size="10.5" fill="#888">guards=[[0,0],[1,1],[2,3]]，walls=[[0,1],[2,2],[1,4]] → 蓝色 ? 即未保卫空格</text>

  <!-- column index labels -->
  <text x="108" y="74" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="164" y="74" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="220" y="74" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="276" y="74" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="332" y="74" text-anchor="middle" font-size="9" fill="#888">4</text>
  <text x="388" y="74" text-anchor="middle" font-size="9" fill="#888">5</text>
  <!-- row index labels -->
  <text x="68" y="122" text-anchor="end" font-size="9" fill="#888">0</text>
  <text x="68" y="178" text-anchor="end" font-size="9" fill="#888">1</text>
  <text x="68" y="234" text-anchor="end" font-size="9" fill="#888">2</text>
  <text x="68" y="290" text-anchor="end" font-size="9" fill="#888">3</text>

  <!-- ===== Row 0: G, W, ?, guarded, ?, ? ===== -->
  <rect x="80"  y="90" width="56" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="108" y="124" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">G</text>
  <rect x="136" y="90" width="56" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="164" y="124" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">W</text>
  <rect x="192" y="90" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="124" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">?</text>
  <rect x="248" y="90" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="276" y="124" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="304" y="90" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="332" y="124" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">?</text>
  <rect x="360" y="90" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="388" y="124" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">?</text>

  <!-- ===== Row 1: guarded, G, guarded, guarded, W, ? ===== -->
  <rect x="80"  y="146" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="108" y="180" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="136" y="146" width="56" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="164" y="180" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">G</text>
  <rect x="192" y="146" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="180" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="248" y="146" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="276" y="180" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="304" y="146" width="56" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="332" y="180" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">W</text>
  <rect x="360" y="146" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="388" y="180" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">?</text>

  <!-- ===== Row 2: guarded, guarded, W, G, guarded, guarded ===== -->
  <rect x="80"  y="202" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="108" y="236" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="136" y="202" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="164" y="236" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="192" y="202" width="56" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="236" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">W</text>
  <rect x="248" y="202" width="56" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="276" y="236" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">G</text>
  <rect x="304" y="202" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="332" y="236" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="360" y="202" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="388" y="236" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- ===== Row 3: guarded, guarded, ?, guarded, ?, ? ===== -->
  <rect x="80"  y="258" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="108" y="292" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="136" y="258" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="164" y="292" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="192" y="258" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="292" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">?</text>
  <rect x="248" y="258" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="276" y="292" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="304" y="258" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="332" y="292" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">?</text>
  <rect x="360" y="258" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="388" y="292" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">?</text>

  <!-- ===== Legend ===== -->
  <rect x="440" y="90" width="92" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="486" y="108" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">G 警卫</text>
  <rect x="440" y="122" width="92" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="486" y="140" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">W 墙</text>
  <rect x="440" y="154" width="92" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="486" y="172" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1 已保卫</text>
  <rect x="440" y="186" width="92" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="486" y="204" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">? 未保卫</text>

  <!-- ===== Count result ===== -->
  <rect x="80" y="332" width="392" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="276" y="353" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">未保卫空格 = (0,2),(0,4),(0,5),(1,5),(3,2),(3,4),(3,5)</text>
  <text x="276" y="368" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">数 g == 0 → 答案 = 7 ✓</text>

  <!-- footer note -->
  <rect x="80" y="384" width="392" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="276" y="403" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">警卫 (2,3) 向上穿过已保卫的 (1,3) 才能照到 (0,3)——印证「1 不挡视线」</text>
</svg>
