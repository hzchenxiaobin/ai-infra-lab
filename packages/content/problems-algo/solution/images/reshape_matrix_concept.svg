<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：二维坐标 ⇄ 一维线性下标 双向映射</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">同一元素在两种形状里共享一个「展平下标」idx</text>

  <!-- ===== Left: original matrix 2x2 ===== -->
  <text x="110" y="78" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">原矩阵 mat (2×2)</text>
  <!-- row 0: [1, 2] -->
  <rect x="68" y="90" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="90" y="112" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="114" y="90" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="136" y="112" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <!-- row 1: [3, 4] -->
  <rect x="68" y="128" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="90" y="150" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">3</text>
  <rect x="114" y="128" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="136" y="150" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">4</text>
  <!-- coord labels -->
  <text x="56" y="112" text-anchor="end" font-size="9.5" fill="#888">(0,0)</text>
  <text x="56" y="150" text-anchor="end" font-size="9.5" fill="#888">(1,0)</text>

  <!-- ===== Middle: 1D linear index ===== -->
  <text x="280" y="78" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">展平下标 idx</text>
  <rect x="208" y="90" width="38" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="227" y="112" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="248" y="90" width="38" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="267" y="112" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="208" y="128" width="38" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="227" y="150" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="248" y="128" width="38" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="267" y="150" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <!-- arrow: original -> linear (forward = i*n+j) -->
  <path d="M 162 107 L 204 107" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="183" y="100" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">i*n+j</text>

  <!-- ===== Right: new matrix 1x4 ===== -->
  <text x="450" y="78" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">新矩阵 (1×4)</text>
  <rect x="372" y="108" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="394" y="130" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="418" y="108" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="440" y="130" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <rect x="464" y="108" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="486" y="130" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">3</text>
  <rect x="510" y="108" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="532" y="130" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">4</text>
  <!-- coord labels -->
  <text x="394" y="156" text-anchor="middle" font-size="9.5" fill="#888">(0,0)</text>
  <text x="440" y="156" text-anchor="middle" font-size="9.5" fill="#888">(0,1)</text>
  <text x="486" y="156" text-anchor="middle" font-size="9.5" fill="#888">(0,2)</text>
  <text x="532" y="156" text-anchor="middle" font-size="9.5" fill="#888">(0,3)</text>

  <!-- arrow: linear -> new (back = idx/c, idx%c) -->
  <path d="M 290 125 L 368 125" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="329" y="118" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">idx÷c, idx%c</text>

  <!-- ===== Formula box ===== -->
  <rect x="30" y="178" width="500" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="202" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">下标映射公式（c = 新矩阵列数）</text>
  <text x="280" y="223" text-anchor="middle" font-size="12" fill="#3a5a2a">正向：idx = i × n + j        逆向：r' = idx ÷ c ， c' = idx mod c</text>

  <!-- ===== Insight box ===== -->
  <rect x="30" y="248" width="500" height="118" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="272" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">为什么能「直接搬」而不需先展平？</text>
  <text x="48" y="296" font-size="11.5" fill="#444">① 行优先遍历下，元素在内存里天然是一维连续序列。</text>
  <text x="48" y="316" font-size="11.5" fill="#444">② 同一个 idx 在原矩阵定位 (i, j) = (idx÷n, idx%n)，在新矩阵定位 (r', c') = (idx÷c, idx%c)。</text>
  <text x="48" y="336" font-size="11.5" fill="#444">③ 于是无需先开一维数组暂存，遍历 idx ∈ [0, m·n) 直接双向算坐标即可。</text>
  <text x="48" y="356" font-size="11.5" fill="#b85450" font-weight="bold">前提：m·n == r·c，否则形状不兼容，原样返回。</text>
</svg>
