<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="1.4"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>
  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：destination=[2,3]，k=2 → "HHVHV"</text>

  <!-- Table header -->
  <g filter="url(#rough2)">
    <rect x="20" y="48" width="580" height="30" fill="#f0f7ff" stroke="#446688" stroke-width="1.3" rx="4"/>
    <line x1="60" y1="48" x2="60" y2="78" stroke="#446688" stroke-width="1"/>
    <line x1="180" y1="48" x2="180" y2="78" stroke="#446688" stroke-width="1"/>
    <line x1="300" y1="48" x2="300" y2="78" stroke="#446688" stroke-width="1"/>
    <line x1="400" y1="48" x2="400" y2="78" stroke="#446688" stroke-width="1"/>
    <line x1="500" y1="48" x2="500" y2="78" stroke="#446688" stroke-width="1"/>
  </g>
  <text x="40" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">步</text>
  <text x="120" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">row,col</text>
  <text x="240" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">cnt=C(r+c−1,r)</text>
  <text x="450" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">判定（k）</text>
  <text x="550" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">输出</text>

  <!-- Row 1 -->
  <g filter="url(#rough2)">
    <rect x="20" y="78" width="580" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <line x1="60" y1="78" x2="60" y2="128" stroke="#446688" stroke-width="1"/>
    <line x1="180" y1="78" x2="180" y2="128" stroke="#446688" stroke-width="1"/>
    <line x1="300" y1="78" x2="300" y2="128" stroke="#446688" stroke-width="1"/>
    <line x1="400" y1="78" x2="400" y2="128" stroke="#446688" stroke-width="1"/>
    <line x1="500" y1="78" x2="500" y2="128" stroke="#446688" stroke-width="1"/>
  </g>
  <text x="40" y="108" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">①</text>
  <text x="120" y="108" text-anchor="middle" font-size="11" fill="#333">2, 3</text>
  <text x="240" y="108" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">C(4,2)=6</text>
  <text x="450" y="100" text-anchor="middle" font-size="10.5" fill="#444">k=2 ≤ 6</text>
  <text x="450" y="116" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">选 H</text>
  <text x="550" y="108" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">H</text>

  <!-- Row 2 -->
  <g filter="url(#rough2)">
    <rect x="20" y="128" width="580" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <line x1="60" y1="128" x2="60" y2="178" stroke="#446688" stroke-width="1"/>
    <line x1="180" y1="128" x2="180" y2="178" stroke="#446688" stroke-width="1"/>
    <line x1="300" y1="128" x2="300" y2="178" stroke="#446688" stroke-width="1"/>
    <line x1="400" y1="128" x2="400" y2="178" stroke="#446688" stroke-width="1"/>
    <line x1="500" y1="128" x2="500" y2="178" stroke="#446688" stroke-width="1"/>
  </g>
  <text x="40" y="158" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">②</text>
  <text x="120" y="158" text-anchor="middle" font-size="11" fill="#333">2, 2</text>
  <text x="240" y="158" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">C(3,2)=3</text>
  <text x="450" y="150" text-anchor="middle" font-size="10.5" fill="#444">k=2 ≤ 3</text>
  <text x="450" y="166" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">选 H</text>
  <text x="540" y="158" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">HH</text>

  <!-- Row 3 -->
  <g filter="url(#rough2)">
    <rect x="20" y="178" width="580" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <line x1="60" y1="178" x2="60" y2="228" stroke="#b85450" stroke-width="1"/>
    <line x1="180" y1="178" x2="180" y2="228" stroke="#b85450" stroke-width="1"/>
    <line x1="300" y1="178" x2="300" y2="228" stroke="#b85450" stroke-width="1"/>
    <line x1="400" y1="178" x2="400" y2="228" stroke="#b85450" stroke-width="1"/>
    <line x1="500" y1="178" x2="500" y2="228" stroke="#b85450" stroke-width="1"/>
  </g>
  <text x="40" y="208" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">③</text>
  <text x="120" y="208" text-anchor="middle" font-size="11" fill="#333">2, 1</text>
  <text x="240" y="208" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">C(2,2)=1</text>
  <text x="450" y="200" text-anchor="middle" font-size="10.5" fill="#444">k=2 &gt; 1</text>
  <text x="450" y="216" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">选 V，k−=1</text>
  <text x="534" y="208" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">HHV</text>

  <!-- Row 4 -->
  <g filter="url(#rough2)">
    <rect x="20" y="228" width="580" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <line x1="60" y1="228" x2="60" y2="278" stroke="#446688" stroke-width="1"/>
    <line x1="180" y1="228" x2="180" y2="278" stroke="#446688" stroke-width="1"/>
    <line x1="300" y1="228" x2="300" y2="278" stroke="#446688" stroke-width="1"/>
    <line x1="400" y1="228" x2="400" y2="278" stroke="#446688" stroke-width="1"/>
    <line x1="500" y1="228" x2="500" y2="278" stroke="#446688" stroke-width="1"/>
  </g>
  <text x="40" y="258" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">④</text>
  <text x="120" y="258" text-anchor="middle" font-size="11" fill="#333">1, 1</text>
  <text x="240" y="258" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">C(1,1)=1</text>
  <text x="450" y="250" text-anchor="middle" font-size="10.5" fill="#444">k=1 ≤ 1</text>
  <text x="450" y="266" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">选 H</text>
  <text x="528" y="258" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">HHVH</text>

  <!-- Row 5 -->
  <g filter="url(#rough2)">
    <rect x="20" y="278" width="580" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4"/>
    <line x1="60" y1="278" x2="60" y2="328" stroke="#b85450" stroke-width="1"/>
    <line x1="180" y1="278" x2="180" y2="328" stroke="#b85450" stroke-width="1"/>
    <line x1="300" y1="278" x2="300" y2="328" stroke="#b85450" stroke-width="1"/>
    <line x1="400" y1="278" x2="400" y2="328" stroke="#b85450" stroke-width="1"/>
    <line x1="500" y1="278" x2="500" y2="328" stroke="#b85450" stroke-width="1"/>
  </g>
  <text x="40" y="308" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">⑤</text>
  <text x="120" y="308" text-anchor="middle" font-size="11" fill="#333">1, 0</text>
  <text x="240" y="308" text-anchor="middle" font-size="11" fill="#888">col=0</text>
  <text x="450" y="300" text-anchor="middle" font-size="10.5" fill="#444">H 用尽</text>
  <text x="450" y="316" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">选 V</text>
  <text x="522" y="308" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">HHVHV</text>

  <!-- Result -->
  <g filter="url(#rough2)">
    <rect x="20" y="340" width="580" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
  </g>
  <text x="310" y="362" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">结果："HHVHV"  ✓  与示例 2 一致</text>

  <g filter="url(#rough2)">
    <rect x="20" y="384" width="580" height="26" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3" rx="6"/>
  </g>
  <text x="310" y="401" text-anchor="middle" font-size="10.5" fill="#444">关键：步③ k=2 &gt; cnt=1，跳过 1 条 H 块，k 减 1 后在 V 块内继续</text>
</svg>
