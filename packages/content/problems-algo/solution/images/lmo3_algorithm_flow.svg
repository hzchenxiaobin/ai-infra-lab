<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">贪心算法流程</text>

  <!-- Step 1: count + sum -->
  <rect x="190" y="40" width="180" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="12" fill="#333">① 统计 cnt[0..9]，求 sum</text>

  <path d="M 280 80 L 280 92" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: diamond r = sum%3 -->
  <polygon points="280,94 376,116 280,138 184,116" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="113" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">sum % 3</text>
  <text x="280" y="128" text-anchor="middle" font-size="10" fill="#888">=?</text>

  <!-- branch arrows -->
  <path d="M 184 116 L 115 116 L 115 158" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="120" y="108" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>

  <path d="M 280 138 L 280 158" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="290" y="152" font-size="11" fill="#b85450" font-weight="bold">1</text>

  <path d="M 376 116 L 445 116 L 445 158" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="430" y="108" font-size="11" fill="#d6a040" font-weight="bold">2</text>

  <!-- r=0 box -->
  <rect x="40" y="160" width="150" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="115" y="184" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">r = 0</text>
  <text x="115" y="204" text-anchor="middle" font-size="11" fill="#444">无需删除</text>
  <text x="115" y="222" text-anchor="middle" font-size="10.5" fill="#888">→ 直接构造</text>

  <!-- r=1 box -->
  <rect x="205" y="160" width="150" height="80" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="182" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">r = 1</text>
  <text x="280" y="200" text-anchor="middle" font-size="10.5" fill="#444">删 1 个最小余 1</text>
  <text x="280" y="216" text-anchor="middle" font-size="10.5" fill="#444">不够 → 删 2 个余 2</text>
  <text x="280" y="232" text-anchor="middle" font-size="10" fill="#b85450">仍不够 → return ""</text>

  <!-- r=2 box -->
  <rect x="370" y="160" width="150" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="445" y="182" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">r = 2</text>
  <text x="445" y="200" text-anchor="middle" font-size="10.5" fill="#444">删 1 个最小余 2</text>
  <text x="445" y="216" text-anchor="middle" font-size="10.5" fill="#444">不够 → 删 2 个余 1</text>
  <text x="445" y="232" text-anchor="middle" font-size="10" fill="#b85450">仍不够 → return ""</text>

  <!-- merge bus -->
  <path d="M 115 240 L 115 258 L 445 258" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 280 240 L 280 258" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 280 258 L 280 272" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 4: concat descending -->
  <rect x="180" y="274" width="200" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="298" text-anchor="middle" font-size="12" fill="#333">④ 降序拼接为字符串</text>

  <path d="M 280 312 L 280 324" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 5: leading zero / empty -->
  <rect x="140" y="326" width="280" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="346" text-anchor="middle" font-size="11.5" fill="#444">⑤ 前导零 / 空串处理</text>
  <text x="280" y="364" text-anchor="middle" font-size="10.5" fill="#888">空 → "" ；首位 '0'（全零）→ "0" ；否则原样</text>

  <path d="M 280 376 L 280 388" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="210" y="390" width="140" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="414" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">return 结果</text>

  <!-- note -->
  <text x="280" y="450" text-anchor="middle" font-size="10" fill="#888">「删 1 个」优先于「删 2 个」：位数多 ⇒ 数更大；从桶内最小者删起</text>
</svg>
