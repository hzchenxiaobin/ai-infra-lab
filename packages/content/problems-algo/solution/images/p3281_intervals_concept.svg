<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心概念：每个区间各取一个数，得分 = 两两最小差</text>

  <!-- 三个区间（示例 1 排序后） -->
  <rect x="70" y="46" width="80" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="158" y="63" font-size="10.5" fill="#2e4460" filter="url(#rough2)">区间 [0, 2]</text>

  <rect x="190" y="86" width="80" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="278" y="103" font-size="10.5" fill="#3a5a2e" filter="url(#rough2)">区间 [3, 5]</text>

  <rect x="310" y="126" width="80" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="398" y="143" font-size="10.5" fill="#8a6a20" filter="url(#rough2)">区间 [6, 8]</text>

  <!-- 选中的点 -->
  <text x="70" y="38" text-anchor="middle" font-size="10.5" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">选 0</text>
  <text x="230" y="80" text-anchor="middle" font-size="10.5" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">选 4</text>
  <text x="390" y="120" text-anchor="middle" font-size="10.5" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">选 8</text>

  <!-- 选点到数轴的虚线引导 -->
  <path d="M 70 68 L 70 288" stroke="#b85450" stroke-width="1" stroke-dasharray="4,3" opacity="0.4" filter="url(#rough2)"/>
  <path d="M 230 108 L 230 288" stroke="#b85450" stroke-width="1" stroke-dasharray="4,3" opacity="0.4" filter="url(#rough2)"/>
  <path d="M 390 148 L 390 288" stroke="#b85450" stroke-width="1" stroke-dasharray="4,3" opacity="0.4" filter="url(#rough2)"/>

  <!-- 两两差标注 -->
  <path d="M 82 170 L 218 170" stroke="#555" stroke-width="1.5" fill="none" marker-start="url(#arr)" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="162" text-anchor="middle" font-size="10.5" fill="#8a3a34" filter="url(#rough2)">|0 − 4| = 4</text>

  <path d="M 242 170 L 378 170" stroke="#555" stroke-width="1.5" fill="none" marker-start="url(#arr)" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="162" text-anchor="middle" font-size="10.5" fill="#8a3a34" filter="url(#rough2)">|4 − 8| = 4</text>

  <path d="M 76 198 L 384 198" stroke="#555" stroke-width="1.5" fill="none" marker-start="url(#arr)" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="305" y="213" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">|0 − 8| = 8</text>

  <!-- 得分框 -->
  <rect x="150" y="224" width="220" height="30" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="244" text-anchor="middle" font-size="12" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">得分 = min(4, 4, 8) = 4</text>

  <!-- 数轴 -->
  <path d="M 55 292 L 415 292" stroke="#555" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 70 288 L 70 296 M 110 288 L 110 296 M 150 288 L 150 296 M 190 288 L 190 296 M 230 288 L 230 296 M 270 288 L 270 296 M 310 288 L 310 296 M 350 288 L 350 296 M 390 288 L 390 296" stroke="#555" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="310" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">0</text>
  <text x="110" y="310" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1</text>
  <text x="150" y="310" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">2</text>
  <text x="190" y="310" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">3</text>
  <text x="230" y="310" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">4</text>
  <text x="270" y="310" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">5</text>
  <text x="310" y="310" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">6</text>
  <text x="350" y="310" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">7</text>
  <text x="390" y="310" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">8</text>

  <text x="260" y="332" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">数轴（区间按 start 排序后：[0,2]、[3,5]、[6,8]）</text>

  <text x="260" y="352" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">d 越大区间越宽、选点越自由——目标：让离得最近的两点尽量远</text>
</svg>
