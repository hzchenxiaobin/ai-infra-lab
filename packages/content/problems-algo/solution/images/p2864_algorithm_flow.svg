<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="200" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：一趟计数 ＋ 三段拼接</text>

  <!-- start -->
  <ellipse cx="200" cy="62" rx="46" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="67" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M 200 80 L 200 94" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- step 1: count -->
  <rect x="80" y="96" width="240" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="200" y="115" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">一趟扫描 s</text>
  <text x="200" y="133" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">统计 '1' 的个数 k，记 n = len(s)</text>
  <path d="M 200 142 L 200 156" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- annotation 1 -->
  <path d="M 320 119 L 356 119" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="362" y="108" text-anchor="start" font-size="11" fill="#888" filter="url(#rough2)">题目保证 k ≥ 1</text>
  <text x="362" y="124" text-anchor="start" font-size="11" fill="#888" filter="url(#rough2)">→ k−1 ≥ 0 恒成立，无特判</text>

  <!-- step 2: first segment -->
  <rect x="80" y="158" width="240" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="200" y="177" text-anchor="middle" font-size="12" fill="#b07818" font-weight="bold" filter="url(#rough2)">拼第 1 段：(k−1) 个 '1'</text>
  <text x="200" y="195" text-anchor="middle" font-size="11" fill="#b07818" filter="url(#rough2)">k−1 个 '1' 堆到最高位</text>
  <path d="M 200 204 L 200 218" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- step 3: second segment -->
  <rect x="80" y="220" width="240" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="200" y="239" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">拼第 2 段：(n−k) 个 '0'</text>
  <text x="200" y="257" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">0 全部垫在中间（前导零合法）</text>
  <path d="M 200 266 L 200 280" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- step 4: last one -->
  <rect x="80" y="282" width="240" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="200" y="301" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">拼第 3 段：末位 1 个 '1'</text>
  <text x="200" y="319" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">末位 '1' ⇔ 结果是奇数</text>
  <path d="M 200 328 L 200 342" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- annotation 2 -->
  <path d="M 320 305 L 356 305" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="362" y="294" text-anchor="start" font-size="11" fill="#888" filter="url(#rough2)">三段长度之和</text>
  <text x="362" y="310" text-anchor="start" font-size="11" fill="#888" filter="url(#rough2)">(k−1)+(n−k)+1 = n ✓</text>
  <text x="362" y="326" text-anchor="start" font-size="11" fill="#888" filter="url(#rough2)">不多不少正好铺满</text>

  <!-- end -->
  <ellipse cx="200" cy="366" rx="46" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="371" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回</text>

  <!-- right side: result preview -->
  <rect x="392" y="168" width="150" height="110" fill="#fafafa" stroke="#bbb" stroke-width="1.5" stroke-dasharray="6 4" rx="10" filter="url(#rough2)"/>
  <text x="467" y="192" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">结果形态预览</text>
  <g filter="url(#rough2)">
    <rect x="410" y="206" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="423" y="224" text-anchor="middle" font-size="12" fill="#b07818" font-weight="bold">1</text>
    <rect x="438" y="206" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="451" y="224" text-anchor="middle" font-size="12" fill="#446688">0</text>
    <rect x="466" y="206" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="479" y="224" text-anchor="middle" font-size="12" fill="#446688">0</text>
    <rect x="494" y="206" width="26" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="507" y="224" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
    <text x="467" y="252" text-anchor="middle" font-size="10" fill="#aaa">1…1 0…0 1</text>
    <text x="467" y="267" text-anchor="middle" font-size="10" fill="#aaa">（可能带前导零）</text>
  </g>
</svg>
