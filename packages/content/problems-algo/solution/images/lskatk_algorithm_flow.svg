<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="560" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">分治算法流程：divide(l, r)</text>

  <!-- Start: divide(l, r) -->
  <rect x="160" y="44" width="200" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="67" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">divide(l, r)  // 处理 s[l:r]</text>

  <path d="M 260 80 L 260 96" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Count frequency -->
  <rect x="120" y="100" width="280" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="120" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">统计 s[l:r] 各字符频率 cnt</text>
  <text x="260" y="136" text-anchor="middle" font-size="10.5" fill="#555">遍历区间，cnt[26] 计数</text>

  <path d="M 260 144 L 260 162" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Diamond: exists freq < k char? -->
  <polygon points="260,166 380,210 260,254 140,210" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="206" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">存在 cnt[c] &gt; 0</text>
  <text x="260" y="222" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">且 cnt[c] &lt; k ？</text>

  <!-- No → return r - l (right, green) -->
  <path d="M 380 210 L 440 210" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="410" y="202" text-anchor="middle" font-size="11" fill="#82b366" font-weight="bold">No</text>
  <rect x="404" y="222" width="104" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="456" y="244" text-anchor="middle" font-size="10.5" fill="#333">所有字符</text>
  <text x="456" y="258" text-anchor="middle" font-size="10.5" fill="#333">都 ≥ k</text>
  <text x="456" y="272" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return r - l</text>

  <!-- Yes → down -->
  <path d="M 260 254 L 260 276" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="280" y="270" font-size="11" fill="#b85450" font-weight="bold">Yes</text>

  <!-- pick split char -->
  <rect x="120" y="280" width="280" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="298" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">取该字符为 split（分隔符）</text>
  <text x="260" y="313" text-anchor="middle" font-size="10.5" fill="#555">按 split 把 s[l:r] 切成若干段</text>

  <path d="M 260 320 L 260 338" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Loop diamond: more segments? -->
  <polygon points="260,342 360,380 260,418 160,380" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="378" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">还有下一段？</text>
  <text x="260" y="394" text-anchor="middle" font-size="10" fill="#777">遍历各段</text>

  <!-- Yes → recurse (right) -->
  <path d="M 360 380 L 410 380" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="385" y="372" text-anchor="middle" font-size="10.5" fill="#82b366" font-weight="bold">Yes</text>
  <rect x="414" y="360" width="96" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="462" y="378" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">递归</text>
  <text x="462" y="392" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">divide(seg)</text>

  <!-- loop back arrow from recurse to loop -->
  <path d="M 462 400 L 462 432 L 260 432 L 260 418" stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="360" y="448" font-size="9.5" fill="#888" font-style="italic">取各段结果的最大值</text>

  <!-- No → down to return max -->
  <path d="M 260 418 L 260 462" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="280" y="440" font-size="10.5" fill="#b85450" font-weight="bold">No</text>

  <!-- return max -->
  <rect x="140" y="466" width="240" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="486" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">ans = max(各段 divide 结果)</text>
  <text x="260" y="502" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return ans</text>

  <path d="M 260 510 L 260 528" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- end -->
  <rect x="200" y="532" width="120" height="24" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="549" text-anchor="middle" font-size="10.5" fill="#888">结束</text>
</svg>
