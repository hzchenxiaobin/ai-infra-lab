<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 510" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="510" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">后序 DFS：返回 (isBST, min, max, sum)，合法时更新 best</text>

  <!-- Entry -->
  <rect x="195" y="40" width="190" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="60" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">dfs(node) → (isBST, min, max, sum)</text>

  <path d="M 290 70 L 290 86" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Decision: null? -->
  <polygon points="290,90 380,128 290,166 200,128" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="124" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">node == null ?</text>
  <text x="290" y="140" text-anchor="middle" font-size="10" fill="#888">空树</text>

  <!-- Yes branch: return (True, inf, -inf, 0) -->
  <path d="M 200 128 L 90 128" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="145" y="120" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="20" y="110" width="70" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="55" y="126" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">return</text>
  <text x="55" y="138" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">(T,∞,-∞,0)</text>

  <!-- No branch -->
  <path d="M 290 166 L 290 182" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="305" y="178" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- Step 2: recurse left and right -->
  <rect x="40" y="184" width="500" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="208" font-size="11" fill="#446688" font-weight="bold">① 后序递归：</text>
  <text x="200" y="208" font-size="11" fill="#333" font-family="monospace">L = dfs(node.left)   R = dfs(node.right)</text>

  <path d="M 290 224 L 290 240" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 3: BST check -->
  <rect x="40" y="242" width="500" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="266" font-size="11" fill="#b85450" font-weight="bold">② BST 判定：</text>
  <text x="200" y="266" font-size="11" fill="#333" font-family="monospace">isBST = L.isBST &amp;&amp; R.isBST</text>
  <text x="200" y="284" font-size="11" fill="#333" font-family="monospace">         &amp;&amp; node.val &gt; L.max &amp;&amp; node.val &lt; R.min</text>

  <path d="M 290 294 L 290 310" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Decision: isBST? -->
  <polygon points="290,314 360,346 290,378 220,346" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="344" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">isBST ?</text>

  <!-- Yes: compute and update best -->
  <path d="M 220 346 L 110 346" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="165" y="338" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="20" y="392" width="220" height="84" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="130" y="412" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">③ 合法 BST</text>
  <text x="30" y="430" font-size="10" fill="#333" font-family="monospace">sum = node.val</text>
  <text x="30" y="444" font-size="10" fill="#333" font-family="monospace">      + L.sum + R.sum</text>
  <text x="30" y="458" font-size="10" fill="#b85450" font-family="monospace" font-weight="bold">best = max(best, sum)</text>
  <text x="30" y="472" font-size="10" fill="#4a7a3a" font-family="monospace">return (T, min(v,L.min),</text>
  <text x="30" y="472" font-size="10" fill="#4a7a3a" font-family="monospace"> </text>
  <text x="30" y="472" font-size="10" fill="#4a7a3a" font-family="monospace"></text>

  <!-- No: return (False, 0, 0, 0) -->
  <path d="M 360 346 L 470 346" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="415" y="338" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="340" y="392" width="220" height="84" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="450" y="412" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">④ 非 BST</text>
  <text x="360" y="438" text-anchor="middle" font-size="10" fill="#666">min/max/sum 无意义</text>
  <text x="360" y="456" text-anchor="middle" font-size="10" fill="#666">父节点看 isBST=False</text>
  <text x="360" y="470" text-anchor="middle" font-size="10" fill="#b85450" font-family="monospace" font-weight="bold">return (F, 0, 0, 0)</text>

  <!-- vertical connectors to boxes -->
  <path d="M 130 346 L 130 392" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>
  <path d="M 450 346 L 450 392" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3 3" fill="none" filter="url(#rough2)"/>

  <!-- bottom note -->
  <rect x="20" y="484" width="540" height="20" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="290" y="498" text-anchor="middle" font-size="10" fill="#666">空节点返回 (T, ∞, -∞, 0)：空树是 BST，∞/-∞ 不约束父节点的值域边界</text>
</svg>
