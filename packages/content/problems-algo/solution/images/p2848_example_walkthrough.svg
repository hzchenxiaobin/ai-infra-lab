<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="340" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：nums = [[3,6],[1,5],[4,7]] → 答案 7</text>
  <text x="300" y="48" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">三辆车各打一对桩（共 6 格），再从左到右拉前缀和</text>

  <!-- header row: y 64..96; cols p=1..8 left x = 122+50(i-1), w=50; tail col x=522 w=62 -->
  <g filter="url(#rough2)">
    <text x="110" y="84" text-anchor="end" font-size="12" fill="#555" font-weight="bold">p</text>
    <rect x="122" y="64" width="50" height="32" fill="#fff8e1" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="172" y="64" width="50" height="32" fill="#fff8e1" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="222" y="64" width="50" height="32" fill="#fff8e1" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="272" y="64" width="50" height="32" fill="#fff8e1" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="322" y="64" width="50" height="32" fill="#fff8e1" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="372" y="64" width="50" height="32" fill="#fff8e1" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="422" y="64" width="50" height="32" fill="#fff8e1" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="472" y="64" width="50" height="32" fill="#fff8e1" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="522" y="64" width="62" height="32" fill="#fff8e1" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="147" y="84" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">1</text>
    <text x="197" y="84" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">2</text>
    <text x="247" y="84" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">3</text>
    <text x="297" y="84" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">4</text>
    <text x="347" y="84" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">5</text>
    <text x="397" y="84" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">6</text>
    <text x="447" y="84" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">7</text>
    <text x="497" y="84" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">8</text>
    <text x="553" y="84" text-anchor="middle" font-size="10" fill="#555">9..100</text>
  </g>

  <!-- diff row: y 96..134 -->
  <g filter="url(#rough2)">
    <text x="110" y="120" text-anchor="end" font-size="12" fill="#555" font-weight="bold">diff[p]</text>
    <rect x="122" y="96" width="50" height="38" fill="#e6f4ea" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="172" y="96" width="50" height="38" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="222" y="96" width="50" height="38" fill="#e6f4ea" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="272" y="96" width="50" height="38" fill="#e6f4ea" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="322" y="96" width="50" height="38" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="372" y="96" width="50" height="38" fill="#fce4ec" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="422" y="96" width="50" height="38" fill="#fce4ec" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="472" y="96" width="50" height="38" fill="#fce4ec" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="522" y="96" width="62" height="38" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="147" y="120" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">+1</text>
    <text x="197" y="120" text-anchor="middle" font-size="12" fill="#999">0</text>
    <text x="247" y="120" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">+1</text>
    <text x="297" y="120" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">+1</text>
    <text x="347" y="120" text-anchor="middle" font-size="12" fill="#999">0</text>
    <text x="397" y="120" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−1</text>
    <text x="447" y="120" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−1</text>
    <text x="497" y="120" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−1</text>
    <text x="553" y="120" text-anchor="middle" font-size="12" fill="#999">0</text>
  </g>

  <!-- cover row: y 134..172 -->
  <g filter="url(#rough2)">
    <text x="110" y="158" text-anchor="end" font-size="12" fill="#555" font-weight="bold">cover</text>
    <rect x="122" y="134" width="50" height="38" fill="#e8f0fe" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="172" y="134" width="50" height="38" fill="#e8f0fe" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="222" y="134" width="50" height="38" fill="#e8f0fe" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="272" y="134" width="50" height="38" fill="#e8f0fe" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="322" y="134" width="50" height="38" fill="#e8f0fe" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="372" y="134" width="50" height="38" fill="#e8f0fe" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="422" y="134" width="50" height="38" fill="#e8f0fe" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="472" y="134" width="50" height="38" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="522" y="134" width="62" height="38" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="147" y="158" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
    <text x="197" y="158" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
    <text x="247" y="158" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
    <text x="297" y="158" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
    <text x="347" y="158" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
    <text x="397" y="158" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
    <text x="447" y="158" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
    <text x="497" y="158" text-anchor="middle" font-size="12" fill="#999">0</text>
    <text x="553" y="158" text-anchor="middle" font-size="12" fill="#999">0</text>
  </g>

  <!-- covered row: y 172..210 -->
  <g filter="url(#rough2)">
    <text x="110" y="196" text-anchor="end" font-size="12" fill="#555" font-weight="bold">被覆盖？</text>
    <rect x="122" y="172" width="50" height="38" fill="#e6f4ea" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="172" y="172" width="50" height="38" fill="#e6f4ea" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="222" y="172" width="50" height="38" fill="#e6f4ea" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="272" y="172" width="50" height="38" fill="#e6f4ea" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="322" y="172" width="50" height="38" fill="#e6f4ea" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="372" y="172" width="50" height="38" fill="#e6f4ea" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="422" y="172" width="50" height="38" fill="#e6f4ea" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="472" y="172" width="50" height="38" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3"/>
    <rect x="522" y="172" width="62" height="38" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="147" y="196" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
    <text x="197" y="196" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
    <text x="247" y="196" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
    <text x="297" y="196" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
    <text x="347" y="196" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
    <text x="397" y="196" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
    <text x="447" y="196" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
    <text x="497" y="196" text-anchor="middle" font-size="13" fill="#b85450">✗</text>
    <text x="553" y="196" text-anchor="middle" font-size="13" fill="#b85450">✗</text>
  </g>

  <!-- bottom boxes -->
  <rect x="55" y="232" width="280" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="195" y="258" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓ cover &gt; 0 的点：1 ~ 7</text>
  <text x="195" y="288" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 ans = 7</text>

  <rect x="365" y="232" width="200" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="465" y="258" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">读出重叠：点 4 层数 = 3</text>
  <text x="465" y="284" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">三辆车同时盖住点 4</text>
</svg>
