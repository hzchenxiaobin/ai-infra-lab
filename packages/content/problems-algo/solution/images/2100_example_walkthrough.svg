<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：security = [5,3,3,3,5,6,2], time = 2</text>

  <!-- Highlight bands for qualifying columns i=2, i=3 -->
  <rect x="182" y="50" width="112" height="230" fill="#fce4ec" stroke="none" opacity="0.45" filter="url(#rough2)"/>

  <!-- Index row -->
  <text x="60" y="72" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">下标 i</text>
  <text x="94" y="72" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">0</text>
  <text x="150" y="72" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1</text>
  <text x="206" y="72" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="262" y="72" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="318" y="72" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">4</text>
  <text x="374" y="72" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">5</text>
  <text x="430" y="72" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">6</text>

  <!-- Row 1: security -->
  <text x="60" y="110" text-anchor="end" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">security</text>
  <!-- cells -->
  <rect x="74" y="92" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="94" y="111" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="130" y="92" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="111" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="186" y="92" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="206" y="111" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="242" y="92" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="262" y="111" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="298" y="92" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="318" y="111" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="354" y="92" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="374" y="111" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="410" y="92" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="111" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- Row 2: left -->
  <text x="60" y="156" text-anchor="end" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">left[i]</text>
  <rect x="74" y="138" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="94" y="157" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="130" y="138" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="157" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="186" y="138" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="206" y="157" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="242" y="138" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="262" y="157" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="298" y="138" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="318" y="157" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="354" y="138" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="374" y="157" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="410" y="138" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="157" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- Row 3: right -->
  <text x="60" y="202" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">right[i]</text>
  <rect x="74" y="184" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="94" y="203" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="130" y="184" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="203" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="186" y="184" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="206" y="203" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="242" y="184" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="262" y="203" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="298" y="184" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="318" y="203" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="354" y="184" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="374" y="203" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="410" y="184" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="203" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>

  <!-- Row 4: qualify check -->
  <text x="60" y="248" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">合格?</text>
  <text x="94" y="248" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">✗</text>
  <text x="150" y="248" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">✗</text>
  <text x="206" y="248" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="262" y="248" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="318" y="248" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">✗</text>
  <text x="374" y="248" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">✗</text>
  <text x="430" y="248" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">✗</text>

  <!-- Reason annotations -->
  <rect x="30" y="276" width="500" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="298" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">逐列核对（time = 2）：</text>
  <text x="50" y="318" font-size="11" fill="#333" filter="url(#rough2)">i=2：left[2]=2 ≥ 2 ✓ 且 right[2]=3 ≥ 2 ✓ → 合格</text>
  <text x="50" y="336" font-size="11" fill="#333" filter="url(#rough2)">i=3：left[3]=3 ≥ 2 ✓ 且 right[3]=2 ≥ 2 ✓ → 合格</text>
  <text x="50" y="354" font-size="11" fill="#999" filter="url(#rough2)">i=1：left[1]=1 &lt; 2 ✗ ；i=4：right[4]=1 &lt; 2 ✗</text>
  <text x="50" y="372" font-size="11" fill="#999" filter="url(#rough2)">i=0/5/6：left 或 right 不足 2，均不合格</text>
  <text x="280" y="392" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 = [2, 3]</text>
</svg>
