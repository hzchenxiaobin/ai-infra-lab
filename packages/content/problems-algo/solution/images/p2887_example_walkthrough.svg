<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：逐行对照（重点看 quantity）</text>

  <!-- Left table: input -->
  <rect x="15" y="45" width="215" height="200" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="122" y="66" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">products（输入）</text>

  <rect x="28" y="76" width="90" height="20" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="73" y="90" text-anchor="middle" font-size="10" fill="#ffffff" filter="url(#rough2)">name</text>
  <rect x="120" y="76" width="58" height="20" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="149" y="90" text-anchor="middle" font-size="10" fill="#ffffff" filter="url(#rough2)">quantity</text>
  <rect x="180" y="76" width="48" height="20" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="204" y="90" text-anchor="middle" font-size="10" fill="#ffffff" filter="url(#rough2)">price</text>

  <rect x="28" y="98" width="90" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="73" y="113" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Wristwatch</text>
  <rect x="120" y="98" width="58" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="149" y="113" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">32</text>
  <rect x="180" y="98" width="48" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="204" y="113" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">135</text>

  <rect x="28" y="122" width="90" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="73" y="137" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">WirelessEarbuds</text>
  <rect x="120" y="122" width="58" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="149" y="137" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">NaN</text>
  <rect x="180" y="122" width="48" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="204" y="137" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">821</text>

  <rect x="28" y="146" width="90" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="73" y="161" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">GolfClubs</text>
  <rect x="120" y="146" width="58" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="149" y="161" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">NaN</text>
  <rect x="180" y="146" width="48" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="204" y="161" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">9319</text>

  <rect x="28" y="170" width="90" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="73" y="185" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Printer</text>
  <rect x="120" y="170" width="58" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="149" y="185" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">849</text>
  <rect x="180" y="170" width="48" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="204" y="185" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3051</text>

  <text x="122" y="215" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">quantity 列有 2 个 NaN</text>
  <text x="122" y="232" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">name / price 数据完整</text>

  <!-- Middle arrows -->
  <path d="M 234 109 L 321 109" fill="none" stroke="#446688" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="277" y="102" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">原样</text>

  <path d="M 234 133 L 321 133" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="277" y="126" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">NaN→0</text>

  <path d="M 234 157 L 321 157" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="277" y="150" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">NaN→0</text>

  <path d="M 234 181 L 321 181" fill="none" stroke="#446688" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="277" y="174" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">原样</text>

  <!-- Right table: output -->
  <rect x="325" y="45" width="215" height="200" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="432" y="66" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">输出（return products）</text>

  <rect x="338" y="76" width="90" height="20" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="383" y="90" text-anchor="middle" font-size="10" fill="#ffffff" filter="url(#rough2)">name</text>
  <rect x="430" y="76" width="58" height="20" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="459" y="90" text-anchor="middle" font-size="10" fill="#ffffff" filter="url(#rough2)">quantity</text>
  <rect x="490" y="76" width="48" height="20" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="514" y="90" text-anchor="middle" font-size="10" fill="#ffffff" filter="url(#rough2)">price</text>

  <rect x="338" y="98" width="90" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="383" y="113" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Wristwatch</text>
  <rect x="430" y="98" width="58" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="459" y="113" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">32</text>
  <rect x="490" y="98" width="48" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="514" y="113" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">135</text>

  <rect x="338" y="122" width="90" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="383" y="137" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">WirelessEarbuds</text>
  <rect x="430" y="122" width="58" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="459" y="137" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="490" y="122" width="48" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="514" y="137" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">821</text>

  <rect x="338" y="146" width="90" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="383" y="161" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">GolfClubs</text>
  <rect x="430" y="146" width="58" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="459" y="161" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="490" y="146" width="48" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="514" y="161" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">9319</text>

  <rect x="338" y="170" width="90" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="383" y="185" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Printer</text>
  <rect x="430" y="170" width="58" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="459" y="185" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">849</text>
  <rect x="490" y="170" width="48" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="514" y="185" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3051</text>

  <text x="432" y="215" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">仅 2 个 NaN 位置变成 0</text>
  <text x="432" y="232" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">行数 · 行序 · 其它列零改动</text>

  <!-- Bottom notes -->
  <rect x="15" y="262" width="255" height="112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="142" y="284" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">dtype 细节</text>
  <text x="142" y="306" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">列含 NaN → 整列 float64</text>
  <text x="142" y="324" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">（32 实际存成 32.0）</text>
  <text x="142" y="346" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">fillna(0) 填的是 0.0；</text>
  <text x="142" y="362" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">判题按值相等，0.0 == 0 成立</text>

  <rect x="290" y="262" width="250" height="112" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="415" y="284" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">对照：products.fillna(0) 全表填充</text>
  <text x="415" y="306" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">会填掉所有列的 NaN</text>
  <text x="415" y="324" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">——本题恰好只有 quantity 缺失，</text>
  <text x="415" y="342" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">两种写法结果相同</text>
  <text x="415" y="364" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">但列级写法意图更精确</text>
</svg>
