<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：n ⊕ (n&gt;&gt;1) 把交替位变成全 1</text>

  <!-- ===== Panel A: alternating n=10 (1010) ===== -->
  <text x="40" y="54" font-size="12" fill="#4a7a3a" font-weight="bold">交替位 n=10</text>

  <!-- n = 1010 -->
  <text x="40" y="78" font-size="11.5" fill="#333" font-weight="bold">n</text>
  <rect x="150" y="62" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="80" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="192" y="62" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="212" y="80" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="234" y="62" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="254" y="80" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="276" y="62" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="296" y="80" text-anchor="middle" font-size="13" fill="#333">0</text>
  <text x="328" y="78" font-size="10.5" fill="#4a7a3a" font-weight="bold">1,0,1,0 相邻皆异</text>

  <path d="M 170 90 Q 170 96 170 102" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="184" y="100" font-size="10.5" fill="#888">&gt;&gt; 1</text>

  <!-- n >> 1 = 0101 -->
  <text x="40" y="126" font-size="11.5" fill="#333" font-weight="bold">n&gt;&gt;1</text>
  <rect x="150" y="110" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="170" y="128" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="192" y="110" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="212" y="128" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="234" y="110" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="254" y="128" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="276" y="110" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="296" y="128" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <text x="328" y="126" font-size="10.5" fill="#888">右移错位对齐</text>

  <line x1="150" y1="140" x2="316" y2="140" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="140" y="144" text-anchor="end" font-size="12" fill="#4a7a3a" font-weight="bold">⊕</text>

  <!-- x = 1111 (all ones) -->
  <text x="40" y="172" font-size="11.5" fill="#4a7a3a" font-weight="bold">x</text>
  <rect x="150" y="156" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="174" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="192" y="156" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="212" y="174" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="234" y="156" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="254" y="174" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="276" y="156" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="296" y="174" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="328" y="172" font-size="11" fill="#4a7a3a" font-weight="bold">全 1 → 交替 ✓</text>

  <!-- divider -->
  <line x1="40" y1="196" x2="500" y2="196" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Panel B: non-alternating n=11 (1011) ===== -->
  <text x="40" y="220" font-size="12" fill="#b85450" font-weight="bold">非交替 n=11</text>

  <!-- n = 1011 -->
  <text x="40" y="244" font-size="11.5" fill="#333" font-weight="bold">n</text>
  <rect x="150" y="228" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="246" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="192" y="228" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="212" y="246" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="234" y="228" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="254" y="246" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="276" y="228" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="296" y="246" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <text x="328" y="244" font-size="10.5" fill="#b85450" font-weight="bold">末两位同为 1</text>

  <path d="M 170 256 Q 170 262 170 268" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="184" y="266" font-size="10.5" fill="#888">&gt;&gt; 1</text>

  <!-- n >> 1 = 0101 -->
  <text x="40" y="292" font-size="11.5" fill="#333" font-weight="bold">n&gt;&gt;1</text>
  <rect x="150" y="276" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="170" y="294" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="192" y="276" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="212" y="294" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="234" y="276" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="254" y="294" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="276" y="276" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="296" y="294" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>

  <line x1="150" y1="306" x2="316" y2="306" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="140" y="310" text-anchor="end" font-size="12" fill="#4a7a3a" font-weight="bold">⊕</text>

  <!-- x = 1110 (has a 0 gap) -->
  <text x="40" y="338" font-size="11.5" fill="#b85450" font-weight="bold">x</text>
  <rect x="150" y="322" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="340" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="192" y="322" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="212" y="340" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="234" y="322" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="254" y="340" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="276" y="322" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="296" y="340" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">0</text>
  <text x="328" y="338" font-size="11" fill="#b85450" font-weight="bold">有 0 缺口 → 非交替 ✗</text>

  <!-- bottom note -->
  <rect x="60" y="362" width="420" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="382" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">x 的每一位 = 原数相邻两位的异或 = 1 ⇔ 相邻不同</text>
</svg>
