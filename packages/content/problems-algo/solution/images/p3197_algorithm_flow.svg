<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 432" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="432" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：六大形态逐一枚举，取三段包围盒面积和的最小值</text>

  <!-- 开始 -->
  <rect x="200" y="38" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="58" text-anchor="middle" font-size="11.5" fill="#2d5a24" filter="url(#rough2)">输入 grid（≥3 个 1）</text>
  <line x1="260" y1="68" x2="260" y2="84" stroke="#666" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 预处理 -->
  <rect x="120" y="86" width="280" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="105" text-anchor="middle" font-size="11.5" fill="#2c4a6b" filter="url(#rough2)">定义 area(r1,r2,c1,c2)：</text>
  <text x="260" y="123" text-anchor="middle" font-size="11.5" fill="#2c4a6b" filter="url(#rough2)">段内 1 的包围盒面积；段内无 1 → 返回 −1（淘汰）</text>

  <!-- 分叉 -->
  <line x1="260" y1="132" x2="260" y2="152" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="100" y1="152" x2="420" y2="152" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="100" y1="152" x2="100" y2="166" stroke="#666" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <line x1="260" y1="152" x2="260" y2="166" stroke="#666" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <line x1="420" y1="152" x2="420" y2="166" stroke="#666" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 枚举框 1 -->
  <rect x="25" y="168" width="150" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="100" y="188" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">① 三竖条 + ② 三横条</text>
  <text x="100" y="206" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">枚举两刀 i&lt;j（竖切 O(n²)</text>
  <text x="100" y="221" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">或横切 O(m²)），三段求和</text>

  <!-- 枚举框 2 -->
  <rect x="185" y="168" width="150" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="188" text-anchor="middle" font-size="11.5" fill="#8c2f28" font-weight="bold" filter="url(#rough2)">③④ T 型（横刀 + 竖刀）</text>
  <text x="260" y="206" text-anchor="middle" font-size="10.5" fill="#8c2f28" filter="url(#rough2)">枚举 r∈[1,m)、c∈[1,n)</text>
  <text x="260" y="221" text-anchor="middle" font-size="10.5" fill="#8c2f28" filter="url(#rough2)">上整下切 / 下整上切</text>

  <!-- 枚举框 3 -->
  <rect x="345" y="168" width="150" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="420" y="188" text-anchor="middle" font-size="11.5" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">⑤⑥ T 型（竖刀 + 横刀）</text>
  <text x="420" y="206" text-anchor="middle" font-size="10.5" fill="#2d5a24" filter="url(#rough2)">枚举 c∈[1,n)、r∈[1,m)</text>
  <text x="420" y="221" text-anchor="middle" font-size="10.5" fill="#2d5a24" filter="url(#rough2)">左整右切 / 右整左切</text>

  <!-- 汇合 -->
  <line x1="100" y1="232" x2="100" y2="246" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="260" y1="232" x2="260" y2="246" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="420" y1="232" x2="420" y2="246" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="100" y1="246" x2="420" y2="246" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="260" y1="246" x2="260" y2="258" stroke="#666" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- min 框 -->
  <rect x="160" y="260" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="278" text-anchor="middle" font-size="11.5" fill="#2c4a6b" filter="url(#rough2)">best = min(best, 三段面积之和)</text>
  <text x="260" y="295" text-anchor="middle" font-size="10.5" fill="#2c4a6b" filter="url(#rough2)">（任一段为空 −1 → 跳过该切法）</text>

  <line x1="260" y1="304" x2="260" y2="318" stroke="#666" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 菱形：枚举完？ -->
  <polygon points="260,318 338,346 260,374 182,346" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="342" text-anchor="middle" font-size="11" fill="#2c4a6b" filter="url(#rough2)">六种形态</text>
  <text x="260" y="356" text-anchor="middle" font-size="11" fill="#2c4a6b" filter="url(#rough2)">全部枚举完？</text>

  <!-- 回环 -->
  <line x1="182" y1="346" x2="60" y2="346" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="60" y1="346" x2="60" y2="200" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="60" y1="200" x2="21" y2="200" stroke="#666" stroke-width="1.4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="118" y="338" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">否 · 继续</text>

  <!-- 返回 -->
  <line x1="260" y1="374" x2="260" y2="390" stroke="#666" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="278" y="386" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="195" y="392" width="130" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="412" text-anchor="middle" font-size="12" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">返回 best</text>
</svg>
