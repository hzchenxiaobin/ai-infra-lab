<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：LEFT JOIN 保全用户 + AVG 算确认占比</text>

  <!-- Signups table -->
  <rect x="30" y="60" width="150" height="180" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="105" y="80" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">Signups（左表）</text>
  <line x1="40" y1="90" x2="170" y2="90" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="55" y="108" font-size="10.5" fill="#888">user_id</text>
  <text x="130" y="108" font-size="10.5" fill="#888">time_stamp</text>
  <text x="60" y="132" font-size="12" fill="#333">3</text>
  <text x="60" y="156" font-size="12" fill="#333">7</text>
  <text x="60" y="180" font-size="12" fill="#333">2</text>
  <text x="60" y="204" font-size="12" fill="#b85450" font-weight="bold">6</text>
  <text x="135" y="222" font-size="9" fill="#b85450">↑ 无确认记录</text>

  <!-- LEFT JOIN arrow -->
  <path d="M 185 150 L 235 150" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="210" y="142" text-anchor="middle" font-size="9.5" fill="#666" font-weight="bold">LEFT JOIN</text>
  <text x="210" y="166" text-anchor="middle" font-size="8.5" fill="#888">ON user_id</text>

  <!-- Confirmations table -->
  <rect x="240" y="60" width="200" height="180" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="340" y="80" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">Confirmations（右表）</text>
  <line x1="250" y1="90" x2="430" y2="90" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="258" y="108" font-size="9.5" fill="#888">user_id</text>
  <text x="328" y="108" font-size="9.5" fill="#888">time_stamp</text>
  <text x="400" y="108" font-size="9.5" fill="#888">action</text>
  <text x="265" y="130" font-size="10.5" fill="#333">3</text><text x="330" y="130" font-size="8.5" fill="#888">…</text><text x="392" y="130" font-size="9.5" fill="#d6a040">timeout</text>
  <text x="265" y="148" font-size="10.5" fill="#333">3</text><text x="330" y="148" font-size="8.5" fill="#888">…</text><text x="392" y="148" font-size="9.5" fill="#d6a040">timeout</text>
  <text x="265" y="166" font-size="10.5" fill="#333">7</text><text x="330" y="166" font-size="8.5" fill="#888">…</text><text x="388" y="166" font-size="9.5" fill="#4a7a3a" font-weight="bold">confirmed</text>
  <text x="265" y="184" font-size="10.5" fill="#333">7</text><text x="330" y="184" font-size="8.5" fill="#888">…</text><text x="388" y="184" font-size="9.5" fill="#4a7a3a" font-weight="bold">confirmed</text>
  <text x="265" y="202" font-size="10.5" fill="#333">7</text><text x="330" y="202" font-size="8.5" fill="#888">…</text><text x="388" y="202" font-size="9.5" fill="#4a7a3a" font-weight="bold">confirmed</text>
  <text x="265" y="220" font-size="10.5" fill="#333">2</text><text x="330" y="220" font-size="8.5" fill="#888">…</text><text x="388" y="220" font-size="9.5" fill="#4a7a3a" font-weight="bold">confirmed</text>
  <text x="265" y="238" font-size="10.5" fill="#333">2</text><text x="330" y="238" font-size="8.5" fill="#888">…</text><text x="392" y="238" font-size="9.5" fill="#d6a040">timeout</text>

  <!-- Arrow down -->
  <path d="M 300 245 L 300 268" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Key challenge -->
  <rect x="30" y="272" width="540" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="50" y="294" font-size="12" fill="#b85450" font-weight="bold">⚠️ 关键挑战：用户 6 没有任何确认请求，仍须输出且 rate = 0.00</text>
  <text x="50" y="312" font-size="10.5" fill="#666">INNER JOIN 会丢掉用户 6 → 必须用 LEFT JOIN 保全左表每一行</text>

  <!-- Arrow down -->
  <path d="M 300 330 L 300 352" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Formula box -->
  <rect x="30" y="356" width="540" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="50" y="378" font-size="12" fill="#d6a040" font-weight="bold">💡 确认率 = confirmed 数 / 总请求数</text>
  <text x="50" y="396" font-size="10.5" fill="#555">AVG(IF(action='confirmed',1,0)) → 布尔转 0/1 求均值即得比例；GROUP BY user_id 逐用户算</text>
</svg>
