<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：scores = [4,5,6,5], ages = [2,1,2,1]</text>
  <text x="280" y="44" text-anchor="middle" font-size="10" fill="#999">按 (age, score) 排序后逐个 DP 递推，dp[i] = score[i] + max{dp[j] : score[j] ≤ score[i]}</text>

  <!-- Sorted players strip -->
  <text x="36" y="72" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">排序后：</text>

  <!-- Player cards -->
  <g filter="url(#rough2)">
    <rect x="92" y="56" width="80" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="176" y="56" width="80" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="260" y="56" width="80" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="344" y="56" width="80" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="10" fill="#666" text-anchor="middle">
    <text x="132" y="72" filter="url(#rough2)">序号 0</text>
    <text x="216" y="72" filter="url(#rough2)">序号 1</text>
    <text x="300" y="72" filter="url(#rough2)">序号 2</text>
    <text x="384" y="72" filter="url(#rough2)">序号 3</text>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="132" y="90" filter="url(#rough2)">age=1, s=5</text>
    <text x="216" y="90" filter="url(#rough2)">age=1, s=5</text>
    <text x="300" y="90" filter="url(#rough2)" fill="#b85450">age=2, s=4</text>
    <text x="384" y="90" filter="url(#rough2)" fill="#4a7a3a">age=2, s=6</text>
  </g>

  <!-- DP Table frame -->
  <rect x="40" y="112" width="480" height="276" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>

  <!-- Header row -->
  <rect x="40" y="112" width="480" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <g font-size="12" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="72" y="130" filter="url(#rough2)">i</text>
    <text x="120" y="130" filter="url(#rough2)">score</text>
    <text x="168" y="130" filter="url(#rough2)">age</text>
    <text x="300" y="130" filter="url(#rough2)">可接前驱（score[j] ≤ score[i]）</text>
    <text x="460" y="130" filter="url(#rough2)">dp[i]</text>
  </g>
  <g stroke="#dde" stroke-width="1" filter="url(#rough2)">
    <line x1="96" y1="112" x2="96" y2="388"/>
    <line x1="144" y1="112" x2="144" y2="388"/>
    <line x1="192" y1="112" x2="192" y2="388"/>
    <line x1="408" y1="112" x2="408" y2="388"/>
  </g>

  <!-- Row 0 -->
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="72" y="160" filter="url(#rough2)">0</text>
    <text x="120" y="160" font-weight="bold" fill="#446688" filter="url(#rough2)">5</text>
    <text x="168" y="160" filter="url(#rough2)">1</text>
    <text x="300" y="160" fill="#999" filter="url(#rough2)">无（首个球员）</text>
    <text x="460" y="160" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  </g>

  <!-- Row 1 -->
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="72" y="188" filter="url(#rough2)">1</text>
    <text x="120" y="188" font-weight="bold" fill="#446688" filter="url(#rough2)">5</text>
    <text x="168" y="188" filter="url(#rough2)">1</text>
    <text x="300" y="188" fill="#446688" filter="url(#rough2)">j=0（5 ≤ 5 ✓）</text>
    <text x="460" y="188" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">10</text>
  </g>

  <!-- Row 2 -->
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="72" y="216" filter="url(#rough2)">2</text>
    <text x="120" y="216" font-weight="bold" fill="#b85450" filter="url(#rough2)">4</text>
    <text x="168" y="216" filter="url(#rough2)">2</text>
    <text x="300" y="216" fill="#b85450" filter="url(#rough2)">无（j=0: 5&gt;4 ✗, j=1: 5&gt;4 ✗）</text>
    <text x="460" y="216" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  </g>

  <!-- Row 3 PEAK -->
  <rect x="42" y="228" width="476" height="28" fill="#fce4ec" stroke="none" filter="url(#rough2)"/>
  <g font-size="12" fill="#333" text-anchor="middle">
    <text x="72" y="248" filter="url(#rough2)">3</text>
    <text x="120" y="248" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">6</text>
    <text x="168" y="248" filter="url(#rough2)">2</text>
    <text x="300" y="248" fill="#4a7a3a" filter="url(#rough2)">j=0(5),j=1(10),j=2(4) → max=10</text>
    <text x="460" y="248" fill="#b85450" font-weight="bold" filter="url(#rough2)">16</text>
  </g>

  <!-- Row separators -->
  <g stroke="#eef" stroke-width="1" filter="url(#rough2)">
    <line x1="40" y1="168" x2="520" y2="168"/>
    <line x1="40" y1="196" x2="520" y2="196"/>
    <line x1="40" y1="224" x2="520" y2="224"/>
    <line x1="40" y1="256" x2="520" y2="256"/>
  </g>

  <!-- Result row -->
  <rect x="40" y="268" width="480" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="288" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = max(5, 10, 4, 16) = 16 ✓</text>

  <!-- Peak annotation -->
  <text x="500" y="248" font-size="10" fill="#b85450" font-weight="bold" text-anchor="end" filter="url(#rough2)">← 峰值</text>

  <!-- DP recurrence box -->
  <rect x="40" y="310" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="330" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">递推公式</text>
  <text x="56" y="348" font-size="11" fill="#555" filter="url(#rough2)">dp[i] = score[i] + max{ dp[j] : 0 ≤ j &lt; i, score[j] ≤ score[i] }</text>
  <text x="56" y="362" font-size="10" fill="#888" filter="url(#rough2)">无可接前驱时 dp[i] = score[i]（单独成队）</text>

  <!-- Observation box -->
  <rect x="40" y="376" width="480" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="396" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">观察</text>
  <text x="56" y="414" font-size="11" fill="#555" filter="url(#rough2)">• 序号 2（score=4）：前面两个 score=5 的球员都比它高，无法接续 → 只能单选，dp=4</text>
  <text x="56" y="430" font-size="11" fill="#555" filter="url(#rough2)">• 序号 3（score=6）：可接所有前驱，取最大 dp[1]=10，得 dp=6+10=16</text>
  <text x="56" y="442" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">对应球队：原下标 {1,3,2}，得分 [5,5,6]，年龄 [1,1,2] → 无冲突 ✓</text>
</svg>
