<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="540" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算：grid=[[1,0,0,0],[1,1,1,0]], hits=[[1,0]]</text>

  <!-- ===== Step A: original grid ===== -->
  <rect x="20" y="38" width="520" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="36" y="56" font-size="11" fill="#446688" font-weight="bold">A. 原始网格</text>

  <!-- grid cells -->
  <rect x="40" y="64" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="58" y="87" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="78" y="64" width="36" height="36" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="116" y="64" width="36" height="36" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="154" y="64" width="36" height="36" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <rect x="40" y="100" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="58" y="123" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="78" y="100" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="96" y="123" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="116" y="100" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="134" y="123" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="154" y="100" width="36" height="36" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <text x="210" y="80" font-size="10.5" fill="#666">hit = (1,0) 敲掉第 2 行第 1 列</text>
  <text x="210" y="96" font-size="10.5" fill="#666">(0,0) 在顶部 → 稳定</text>
  <text x="210" y="112" font-size="10.5" fill="#666">(1,1)(1,2) 经 (1,0) 连到顶 → 稳定</text>

  <line x1="280" y1="132" x2="280" y2="152" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step B: apply all hits ===== -->
  <rect x="20" y="156" width="520" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="36" y="174" font-size="11" fill="#b85450" font-weight="bold">B. 先删全部 hit → grid[1][0] 由 1 变 0</text>

  <rect x="40" y="182" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="58" y="205" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="78" y="182" width="36" height="36" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="116" y="182" width="36" height="36" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="154" y="182" width="36" height="36" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <rect x="40" y="218" width="36" height="36" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="78" y="218" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="96" y="241" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="116" y="218" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="134" y="241" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="154" y="218" width="36" height="36" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <text x="210" y="200" font-size="10.5" fill="#666">建并查集，roof = 8</text>
  <text x="210" y="216" font-size="10.5" fill="#666">(0,0) 在第 0 行 → union(0, roof)</text>
  <text x="210" y="232" font-size="10.5" fill="#666">(1,1)−(1,2) 互连，但不连 roof</text>
  <text x="210" y="248" font-size="10.5" fill="#b85450" font-weight="bold">before = size[roof] = 2</text>

  <line x1="280" y1="250" x2="280" y2="270" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step C: reverse process ===== -->
  <rect x="20" y="274" width="520" height="130" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="10" filter="url(#rough2)"/>
  <text x="36" y="292" font-size="11" fill="#4a7a3a" font-weight="bold">C. 逆序补砖：恢复 (1,0)，与四邻 union</text>

  <!-- roof node -->
  <ellipse cx="58" cy="308" rx="22" ry="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="58" y="312" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">roof</text>

  <!-- grid with restored brick -->
  <rect x="40" y="326" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="58" y="349" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="78" y="326" width="36" height="36" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="116" y="326" width="36" height="36" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="154" y="326" width="36" height="36" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <rect x="40" y="362" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="58" y="385" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="78" y="362" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="96" y="385" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="116" y="362" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="134" y="385" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="154" y="362" width="36" height="36" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <!-- union lines: roof-0, 0-4, 4-5, 5-6 -->
  <line x1="58" y1="320" x2="58" y2="326" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <line x1="58" y1="362" x2="58" y2="362" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <line x1="76" y1="344" x2="76" y2="380" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <line x1="76" y1="380" x2="78" y2="380" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <line x1="114" y1="380" x2="116" y2="380" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>

  <text x="210" y="312" font-size="10.5" fill="#666">恢复 grid[1][0] = 1</text>
  <text x="210" y="328" font-size="10.5" fill="#666">union((1,0), (0,0)) → 连入 roof</text>
  <text x="210" y="344" font-size="10.5" fill="#666">union((1,0), (1,1)) → 带回 (1,1)(1,2)</text>
  <text x="210" y="362" font-size="10.5" fill="#4a7a3a" font-weight="bold">after = size[roof] = 5</text>
  <text x="210" y="380" font-size="11" fill="#b85450" font-weight="bold">result = 5 − 2 − 1 = 2</text>

  <line x1="280" y1="406" x2="280" y2="426" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step D: final result ===== -->
  <rect x="100" y="430" width="360" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="452" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">after − before − 1 = 5 − 2 − 1 = 2</text>
  <text x="280" y="472" text-anchor="middle" font-size="11" fill="#888">恢复 (1,0) 带回 (1,1) 和 (1,2) 两块砖 → 敲掉时它们掉落</text>

  <text x="280" y="510" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">输出：[2]</text>
</svg>
