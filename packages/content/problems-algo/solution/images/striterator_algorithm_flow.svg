<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">next() / hasNext() 算法流程</text>

  <!-- ===== next() column ===== -->
  <text x="150" y="60" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">next()</text>

  <!-- start -->
  <ellipse cx="150" cy="86" rx="42" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="91" text-anchor="middle" font-size="12" fill="#333">进入 next</text>

  <path d="M150,104 L150,124" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision: rem==0 ? -->
  <polygon points="150,128 222,166 150,204 78,166" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="162" text-anchor="middle" font-size="12" fill="#333">rem == 0 ?</text>
  <text x="150" y="178" text-anchor="middle" font-size="11" fill="#555">(已耗尽)</text>

  <!-- yes branch -->
  <path d="M78,166 L40,166 L40,232" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="46" y="158" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="14" y="236" width="80" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="54" y="256" text-anchor="middle" font-size="12" fill="#b85450">return ' '</text>
  <text x="54" y="272" text-anchor="middle" font-size="11" fill="#555">空格占位</text>

  <!-- no branch -->
  <path d="M222,166 L270,166 L270,196" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="240" y="158" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- c = cur -->
  <rect x="222" y="200" width="96" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="222" text-anchor="middle" font-size="12" fill="#333">c = cur</text>

  <path d="M270,234 L270,256" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- rem-- -->
  <rect x="222" y="260" width="96" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="282" text-anchor="middle" font-size="12" fill="#333">rem −−</text>

  <path d="M270,294 L270,316" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision: rem==0 && ptr<n ? -->
  <polygon points="270,320 372,360 270,400 168,360" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="356" text-anchor="middle" font-size="11" fill="#333">rem==0</text>
  <text x="270" y="372" text-anchor="middle" font-size="11" fill="#333">&amp;&amp; ptr&lt;n ?</text>

  <!-- yes: load next group -->
  <path d="M372,360 L412,360 L412,330" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="352" font-size="11" fill="#446688" filter="url(#rough2)">是</text>
  <rect x="362" y="288" width="100" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="412" y="306" text-anchor="middle" font-size="12" fill="#333">load()</text>
  <text x="412" y="320" text-anchor="middle" font-size="10" fill="#555">解析下一组</text>

  <!-- no: skip -->
  <path d="M270,400 L270,424" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="416" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- return c -->
  <ellipse cx="270" cy="438" rx="46" ry="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="443" text-anchor="middle" font-size="12" fill="#b85450">return c</text>

  <!-- load arrow back up to merge before return -->
  <path d="M412,288 L412,438 L316,438" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== hasNext() column ===== -->
  <text x="490" y="60" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">hasNext()</text>
  <ellipse cx="490" cy="86" rx="42" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="91" text-anchor="middle" font-size="12" fill="#333">进入</text>
  <path d="M490,104 L490,128" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="490,132 548,168 490,204 432,168" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="166" text-anchor="middle" font-size="12" fill="#333">rem &gt; 0 ?</text>
  <text x="490" y="182" text-anchor="middle" font-size="11" fill="#555">(还有未吐字符)</text>
  <path d="M490,204 L490,236" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="490" cy="254" rx="40" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="259" text-anchor="middle" font-size="12" fill="#4a7a3a">return 布尔</text>

  <!-- legend -->
  <text x="40" y="416" font-size="11" fill="#555" filter="url(#rough2)">注：load() = 读字母赋 cur，连续读数字累乘得 rem，ptr 前移</text>
</svg>
