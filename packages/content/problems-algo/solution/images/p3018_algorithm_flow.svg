<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 392" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="392" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：由外向内填区间 DP 表，O(n²)</text>

  <!-- input -->
  <rect x="190" y="42" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="64" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">输入：nums（长 n）、queries（长 m）</text>

  <path d="M 310 76 L 310 90" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="190" y="94" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="116" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">f 全部置 0，起点 f[0][n−1] = 0</text>

  <path d="M 310 128 L 310 142" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loops -->
  <rect x="130" y="146" width="360" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="164" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">双层循环：外层 i 从 0 → n−1 递增</text>
  <text x="310" y="182" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">内层 j 从 n−1 → i 递减（依赖先算好）</text>

  <path d="M 310 190 L 310 204" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- transition -->
  <rect x="70" y="208" width="480" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="226" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">f[i][j] ← max( f[i−1][j] + (nums[i−1] ≥ queries[f[i−1][j]]) ,</text>
  <text x="310" y="244" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">f[i][j+1] + (nums[j+1] ≥ queries[f[i][j+1]]) )　← 真则 +1，假则免费删 +0</text>

  <path d="M 310 252 L 310 266" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="310,270 450,306 310,342 170,306" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="301" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">某个 f[i][j] == m ？</text>
  <text x="310" y="319" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">（查询全部处理完）</text>

  <!-- yes branch -->
  <text x="462" y="300" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 450 306 L 496 306" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="500" y="288" width="100" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="550" y="311" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">return m</text>

  <!-- no branch -->
  <text x="324" y="358" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">否：继续循环填表</text>
  <path d="M 310 342 L 310 356" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- final -->
  <rect x="90" y="360" width="330" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="255" y="379" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">收尾：ans = max( f[i][i] + bonus )，bonus 见右侧</text>
  <text x="440" y="379" font-size="10.5" fill="#999" filter="url(#rough2)">bonus = (nums[i] ≥ queries[f[i][i]])</text>
</svg>
