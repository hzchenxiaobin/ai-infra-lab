<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="860" height="560" fill="#fdfcf7"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">最低票价：算法流程</text>
  <path d="M 280 42 Q 430 50 580 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Start -->
  <g filter="url(#sk2)">
    <rect x="360" y="64" width="140" height="38" rx="19" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="430" y="89" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">开始</text>
  <path d="M 430 102 L 430 122" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Init -->
  <g filter="url(#sk2)">
    <rect x="300" y="124" width="260" height="44" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="430" y="144" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">建 travel = set(days)</text>
  <text x="430" y="160" text-anchor="middle" font-size="11" fill="#2b6e9e">dp[0]=0；last = days[-1]</text>
  <path d="M 430 168 L 430 188" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Loop header -->
  <g filter="url(#sk2)">
    <rect x="320" y="190" width="220" height="38" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="430" y="214" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">for d = 1 .. last</text>
  <path d="M 430 228 L 430 248" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Decision: travel day? -->
  <g filter="url(#sk2)">
    <polygon points="430,250 540,300 430,350 320,300" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="430" y="296" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">d 是旅行日?</text>
  <text x="430" y="312" text-anchor="middle" font-size="10" fill="#7a5415">(d ∈ travel)</text>

  <!-- No branch (left) -->
  <path d="M 320 300 L 200 300" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="260" y="292" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">否</text>
  <g filter="url(#sk2)">
    <rect x="80" y="278" width="120" height="44" rx="6" fill="#f4f4f4" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="140" y="298" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">dp[d] = dp[d−1]</text>
  <text x="140" y="314" text-anchor="middle" font-size="9" fill="#888">不买票，沿用昨日</text>

  <!-- Yes branch (right) -->
  <path d="M 540 300 L 660 300" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="600" y="292" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">是</text>
  <g filter="url(#sk2)">
    <rect x="660" y="262" width="160" height="78" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="740" y="282" text-anchor="middle" font-size="10" fill="#b03a3a" font-weight="bold">取三者最小：</text>
  <text x="740" y="300" text-anchor="middle" font-size="10" fill="#b03a3a" font-family="monospace">dp[d−1]+c0</text>
  <text x="740" y="315" text-anchor="middle" font-size="10" fill="#b03a3a" font-family="monospace">dp[d−7]+c1</text>
  <text x="740" y="330" text-anchor="middle" font-size="10" fill="#b03a3a" font-family="monospace">dp[d−30]+c2</text>

  <!-- merge back to loop -->
  <path d="M 140 322 L 140 404 L 430 404" stroke="#3a3a3a" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <path d="M 740 340 L 740 404 L 430 404" stroke="#3a3a3a" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <path d="M 430 404 L 430 190" stroke="none"/>
  <path d="M 430 404 Q 430 420 250 420 Q 200 420 200 230 Q 200 209 320 209" stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="180" y="370" text-anchor="middle" font-size="10" fill="#888">下一个 d</text>

  <!-- End -->
  <path d="M 430 404 L 540 404 L 540 470" stroke="none"/>
  <g filter="url(#sk2)">
    <rect x="320" y="440" width="220" height="46" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/>
  </g>
  <text x="430" y="460" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">循环结束</text>
  <text x="430" y="478" text-anchor="middle" font-size="11" fill="#2b6e9e">返回 dp[last]</text>
  <path d="M 430 404 L 430 440" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)" stroke-dasharray="4 3"/>

  <g filter="url(#sk2)">
    <rect x="360" y="500" width="140" height="38" rx="19" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="430" y="525" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">结束</text>

  <text x="430" y="552" text-anchor="middle" font-size="10" fill="#888">只需一遍正序扫描 1..last，每步 O(1)，总 O(last_day) ≤ O(365)</text>
</svg>
