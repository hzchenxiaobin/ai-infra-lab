<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：双层循环 + 滚动数组，O(nk) / O(n)</text>
  <text x="260" y="38" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">best 随 i 只增不减——每轮新进入窗口的 t 恰好只有一个</text>

  <!-- start box -->
  <g filter="url(#rough2)">
    <rect x="150" y="48" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
    <text x="260" y="67" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#33506b">前缀和 P[0..n]；dp[i] ← 0（j = 0）</text>
  </g>
  <path d="M 260 78 L 260 94" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <!-- outer loop container -->
  <g filter="url(#rough2)">
    <rect x="55" y="96" width="270" height="170" fill="#ffffff" stroke="#446688" stroke-width="1.5" stroke-dasharray="6 4" rx="8"/>
    <text x="190" y="114" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#33506b">外层：j = 1 .. k（每层 best ← −∞）</text>
  </g>

  <!-- inner loop container -->
  <g filter="url(#rough2)">
    <rect x="70" y="126" width="240" height="124" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5 3" rx="8"/>
    <text x="190" y="142" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f5d24">内层：i = j·m .. n</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="82" y="150" width="216" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="190" y="167" text-anchor="middle" font-size="9.5" fill="#2f5d24">best ← max(best, dp[i−m] − P[i−m])</text>
  </g>
  <path d="M 190 176 L 190 184" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="82" y="186" width="216" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="190" y="203" text-anchor="middle" font-size="9.5" fill="#2f5d24">cur ← P[i] + best（第 j 段以 i 结尾）</text>
  </g>
  <path d="M 190 212 L 190 220" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="82" y="222" width="216" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="190" y="239" text-anchor="middle" font-size="9.5" fill="#2f5d24">ndp[i] ← max(ndp[i−1], cur)</text>
  </g>

  <!-- swap box -->
  <path d="M 190 266 L 190 278" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="90" y="280" width="200" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="190" y="297" text-anchor="middle" font-size="9.5" fill="#33506b">swap(dp, ndp)——滚动到下一层 j</text>
  </g>

  <!-- loop back arrow -->
  <path d="M 90 293 L 46 293 L 46 181 L 53 181" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" fill="none" filter="url(#rough2)"/>
  <text x="40" y="240" text-anchor="middle" font-size="9" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">j+1</text>

  <!-- final box -->
  <path d="M 190 306 L 190 316" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="140" y="318" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10"/>
    <text x="190" y="336" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">返回 dp[n]</text>
  </g>

  <!-- right annotations -->
  <g filter="url(#rough2)">
    <path d="M 342 163 L 327 163" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3 2" fill="none"/>
    <text x="418" y="155" text-anchor="middle" font-size="9.5" fill="#55677d">窗口只右扩不左缩，</text>
    <text x="418" y="169" text-anchor="middle" font-size="9.5" fill="#55677d">i 每加 1 仅新增 t = i−m 一个候选</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 342 230 L 312 230" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3 2" fill="none"/>
    <text x="420" y="227" text-anchor="middle" font-size="9.5" fill="#55677d">i = j·m 是该层第一个 i，</text>
    <text x="420" y="241" text-anchor="middle" font-size="9.5" fill="#55677d">无 ndp[i−1] 可继承，直接取 cur</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 392 293 L 292 293" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3 2" fill="none"/>
    <text x="425" y="290" text-anchor="middle" font-size="9.5" fill="#55677d">滚动数组 O(n) 空间</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 385 332 L 243 332" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3 2" fill="none"/>
    <text x="425" y="329" text-anchor="middle" font-size="9.5" fill="#55677d">k·m ≤ n ⇒ 必有解</text>
  </g>

  <text x="260" y="356" text-anchor="middle" font-size="9.5" fill="#55677d" filter="url(#rough2)">n ≤ 2000、k ≤ n/m：最坏约 4×10⁶ 次循环，轻松通过</text>
</svg>
