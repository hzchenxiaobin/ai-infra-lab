<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：sum = s[i] + carry 的三分支决策</text>
  <text x="300" y="46" text-anchor="middle" font-size="11" fill="#888">i 从 n−1 向左到 1（跳过最高位 i=0），逐位消费；末尾用 carry 判定最高位</text>

  <!-- start: loop -->
  <rect x="150" y="60" width="300" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="80" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">for i = n−1 downto 1</text>
  <text x="300" y="96" text-anchor="middle" font-size="10" fill="#666">每次取 sum = (s[i] − '0') + carry</text>

  <path d="M 300 106 L 300 122" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="300,124 460,184 300,244 140,184" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="178" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">sum = s[i] + carry</text>
  <text x="300" y="196" text-anchor="middle" font-size="11" fill="#d6a040">取值 0 / 1 / 2 ?</text>

  <!-- branch sum==0 (left) -->
  <path d="M 140 184 L 80 184 L 80 260" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="92" y="176" font-size="11" fill="#4a7a3a" font-weight="bold">sum=0</text>
  <rect x="20" y="260" width="120" height="70" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="80" y="282" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">偶数（位0）</text>
  <text x="80" y="300" text-anchor="middle" font-size="10" fill="#555">÷2 丢位</text>
  <text x="80" y="316" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">steps += 1</text>
  <text x="80" y="330" text-anchor="middle" font-size="10" fill="#555">carry = 0</text>

  <!-- branch sum==1 (middle) -->
  <path d="M 300 244 L 300 260" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="308" y="256" font-size="11" fill="#b85450" font-weight="bold">sum=1</text>
  <rect x="240" y="260" width="120" height="70" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="282" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">奇数（位1）</text>
  <text x="300" y="300" text-anchor="middle" font-size="10" fill="#555">+1 再 ÷2</text>
  <text x="300" y="316" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">steps += 2</text>
  <text x="300" y="330" text-anchor="middle" font-size="10" fill="#555">carry = 1</text>

  <!-- branch sum==2 (right) -->
  <path d="M 460 184 L 520 184 L 520 260" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="492" y="176" font-size="11" fill="#d6a040" font-weight="bold">sum=2</text>
  <rect x="460" y="260" width="120" height="70" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="520" y="282" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1+1=10</text>
  <text x="520" y="300" text-anchor="middle" font-size="10" fill="#555">有效位0，÷2</text>
  <text x="520" y="316" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">steps += 1</text>
  <text x="520" y="330" text-anchor="middle" font-size="10" fill="#555">carry = 1</text>

  <!-- merge to loop back -->
  <path d="M 80 330 L 80 360 L 520 360" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 300 330 L 300 360" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 520 330 L 520 360" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 300 360 L 300 372 L 70 372 L 70 82 L 150 82" stroke="#666" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="86" y="368" font-size="9" fill="#999">循环下一 i</text>

  <!-- after loop: MSB check -->
  <path d="M 300 360 L 470 360 L 470 380" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <polygon points="470,382 560,410 470,438 380,410" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="470" y="406" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">循环结束</text>
  <text x="470" y="422" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">carry == 1 ?</text>

  <!-- yes: +1 -->
  <path d="M 380 410 L 340 410" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="356" y="402" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="220" y="392" width="120" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="415" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">steps += 1</text>

  <!-- return -->
  <path d="M 220 410 L 180 410" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <rect x="60" y="394" width="120" height="34" rx="6" fill="#fafafa" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="416" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">return steps</text>
</svg>
