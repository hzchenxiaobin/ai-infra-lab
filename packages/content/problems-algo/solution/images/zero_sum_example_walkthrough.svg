<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n=5（奇数）与 n=6（偶数）的构造过程</text>

  <text x="40" y="52" font-size="12" fill="#446688" font-weight="bold">n = 5（奇数）</text>

  <text x="50" y="80" font-size="11" fill="#555" font-weight="bold">i=1</text>
  <rect x="90" y="66" width="38" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="109" y="83" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">−1</text>
  <rect x="130" y="66" width="38" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="149" y="83" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="185" y="83" font-size="11" fill="#888">→ res = [−1, 1]</text>
  <text x="330" y="83" font-size="11" fill="#4a7a3a" font-weight="bold">(−1)+1 = 0</text>

  <text x="50" y="114" font-size="11" fill="#555" font-weight="bold">i=2</text>
  <rect x="90" y="100" width="38" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="109" y="117" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">−2</text>
  <rect x="130" y="100" width="38" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="149" y="117" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="185" y="117" font-size="11" fill="#888">→ res = [−1, 1, −2, 2]</text>
  <text x="330" y="117" font-size="11" fill="#4a7a3a" font-weight="bold">(−2)+2 = 0</text>

  <text x="50" y="148" font-size="11" fill="#b85450" font-weight="bold">补零</text>
  <rect x="90" y="134" width="38" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="109" y="151" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <text x="145" y="151" font-size="11" fill="#888">→ res = [−1, 1, −2, 2, 0]</text>
  <text x="330" y="151" font-size="11" fill="#b85450" font-weight="bold">0 不影响和</text>

  <rect x="40" y="168" width="460" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="186" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">5 个不同整数，和 = (−1+1) + (−2+2) + 0 = 0 ✓</text>

  <text x="40" y="222" font-size="12" fill="#446688" font-weight="bold">n = 6（偶数）</text>

  <text x="50" y="250" font-size="11" fill="#555" font-weight="bold">i=1</text>
  <rect x="90" y="236" width="38" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="109" y="253" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">−1</text>
  <rect x="130" y="236" width="38" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="149" y="253" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="185" y="253" font-size="11" fill="#888">→ res = [−1, 1]</text>
  <text x="330" y="253" font-size="11" fill="#4a7a3a" font-weight="bold">(−1)+1 = 0</text>

  <text x="50" y="284" font-size="11" fill="#555" font-weight="bold">i=2</text>
  <rect x="90" y="270" width="38" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="109" y="287" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">−2</text>
  <rect x="130" y="270" width="38" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="149" y="287" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="185" y="287" font-size="11" fill="#888">→ res = [−1, 1, −2, 2]</text>
  <text x="330" y="287" font-size="11" fill="#4a7a3a" font-weight="bold">(−2)+2 = 0</text>

  <text x="50" y="318" font-size="11" fill="#555" font-weight="bold">i=3</text>
  <rect x="90" y="304" width="38" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="109" y="321" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">−3</text>
  <rect x="130" y="304" width="38" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="149" y="321" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="185" y="321" font-size="11" fill="#888">→ res = [−1, 1, −2, 2, −3, 3]</text>
  <text x="370" y="321" font-size="11" fill="#4a7a3a" font-weight="bold">(−3)+3 = 0</text>

  <rect x="40" y="338" width="460" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="356" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">6 个不同整数，和 = (−1+1) + (−2+2) + (−3+3) = 0 ✓</text>

  <rect x="40" y="382" width="460" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="400" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">每对 (−i, +i) 自消为 0</text>
  <text x="270" y="418" text-anchor="middle" font-size="11" fill="#555">故总和 = 0 + 0 + … + 0 = 0（奇数情况多一个 0 也为 0）</text>
</svg>
