<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L8 5 L0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="500" height="440" fill="#fafafa"/>

  <text x="250" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：降序排序 → 贪心累加 → 判停返回</text>

  <!-- 开始 -->
  <rect x="200" y="40" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="250" y="58" text-anchor="middle" font-size="12" fill="#333">开始</text>

  <!-- 排序 -->
  <path d="M 250 70 L 250 82" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <rect x="150" y="86" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="106" text-anchor="middle" font-size="12" fill="#333">将 nums 按降序排序</text>

  <!-- 求和 -->
  <path d="M 250 118 L 250 130" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <rect x="160" y="134" width="180" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="154" text-anchor="middle" font-size="12" fill="#333">total = sum(nums)</text>

  <!-- 初始化 -->
  <path d="M 250 166 L 250 178" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <rect x="170" y="182" width="160" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="202" text-anchor="middle" font-size="12" fill="#333">cur = 0, ans = []</text>

  <!-- 累加 -->
  <path d="M 250 214 L 250 226" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <rect x="130" y="230" width="240" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="250" text-anchor="middle" font-size="12" fill="#333">cur += x, ans.push(x)  (遍历 x)</text>

  <!-- 判定菱形 -->
  <path d="M 250 262 L 250 274" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <polygon points="250,278 350,316 250,354 150,316" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="314" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">cur &gt; total - cur ?</text>
  <text x="250" y="330" text-anchor="middle" font-size="10" fill="#b85450">(严格大于)</text>

  <!-- 是 → 返回 -->
  <path d="M 250 354 L 250 368" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="266" y="364" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="170" y="372" width="160" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="392" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 ans</text>

  <!-- 否 → 回到累加 (循环) -->
  <path d="M 150 316 L 100 316 L 100 246 L 130 246" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="110" y="308" font-size="11" fill="#446688" font-weight="bold">否</text>
  <text x="100" y="280" font-size="10" fill="#888">取下一个</text>

  <!-- 结束 -->
  <path d="M 250 404 L 250 416" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <rect x="200" y="416" width="100" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="250" y="430" text-anchor="middle" font-size="11" fill="#333">结束</text>
</svg>
