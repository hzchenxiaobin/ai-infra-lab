<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：单次扫描判断山脉数组</text>

  <!-- Start node -->
  <ellipse cx="270" cy="56" rx="120" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="60" text-anchor="middle" font-size="12" fill="#333">开始: n = arr.length, i = 0</text>

  <path d="M 270 76 L 270 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 1: n >= 3? -->
  <polygon points="270,100 380,138 270,176 160,138" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="134" text-anchor="middle" font-size="12" fill="#333">n ≥ 3 ?</text>
  <text x="270" y="150" text-anchor="middle" font-size="10" fill="#666">(至少 3 个元素)</text>

  <!-- No -> false -->
  <path d="M 380 138 L 430 138" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="405" y="130" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="478" cy="138" rx="52" ry="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="478" y="142" text-anchor="middle" font-size="12" fill="#b85450">return false</text>

  <!-- Yes -> climb -->
  <path d="M 270 176 L 270 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="192" font-size="11" fill="#82b366">是</text>

  <!-- Climb box -->
  <rect x="110" y="200" width="320" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="218" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">上山阶段：while (i+1 &lt; n &amp;&amp; arr[i] &lt; arr[i+1])</text>
  <text x="270" y="234" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">i++</text>

  <path d="M 270 244 L 270 264" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 2: i > 0 && i < n-1? -->
  <polygon points="270,268 400,306 270,344 140,306" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="300" text-anchor="middle" font-size="11" fill="#333">i &gt; 0 &amp;&amp; i &lt; n−1 ?</text>
  <text x="270" y="316" text-anchor="middle" font-size="10" fill="#666">(山顶不在首尾)</text>

  <!-- No -> false -->
  <path d="M 400 306 L 430 306" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="415" y="298" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="478" cy="306" rx="52" ry="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="478" y="310" text-anchor="middle" font-size="12" fill="#b85450">return false</text>

  <!-- Yes -> descend -->
  <path d="M 270 344 L 270 364" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="360" font-size="11" fill="#82b366">是</text>

  <!-- Descend box -->
  <rect x="110" y="368" width="320" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="386" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">下山阶段：while (i+1 &lt; n &amp;&amp; arr[i] &gt; arr[i+1])</text>
  <text x="270" y="402" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">i++</text>

  <path d="M 270 412 L 270 432" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 3: i == n-1? -->
  <polygon points="270,436 370,470 270,504 170,470" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="468" text-anchor="middle" font-size="11" fill="#333">i == n−1 ?</text>
  <text x="270" y="484" text-anchor="middle" font-size="10" fill="#666">(走完全程)</text>

  <!-- No -> false -->
  <path d="M 370 470 L 430 470" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="462" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="478" cy="470" rx="52" ry="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="478" y="474" text-anchor="middle" font-size="12" fill="#b85450">return false</text>

  <!-- Yes -> true -->
  <path d="M 270 504 L 270 524" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="520" font-size="11" fill="#82b366">是</text>
  <ellipse cx="270" cy="530" rx="80" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="534" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return true ✓</text>
</svg>
