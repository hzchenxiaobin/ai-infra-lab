<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="540" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：nums1=[7,7,8,3], nums2=[1,2,9,7] → 答案 2</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">cnt1={7:2, 8:1, 3:1}，cnt2={1:1, 2:1, 9:1, 7:1}</text>

  <!-- ===== 类型 1 标题 ===== -->
  <rect x="40" y="60" width="520" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="300" y="79" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">类型 1：A=nums1, B=nums2，求 nums1[i]² = nums2[j]·nums2[k]</text>

  <!-- 类型1 表格 -->
  <g font-size="11">
    <!-- 表头 -->
    <rect x="60" y="98" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="100" y="114" text-anchor="middle" fill="#446688" font-weight="bold">v</text>
    <rect x="144" y="98" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="184" y="114" text-anchor="middle" fill="#446688" font-weight="bold">target</text>
    <rect x="228" y="98" width="200" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="328" y="114" text-anchor="middle" fill="#446688" font-weight="bold">配对情况 (a≤b)</text>
    <rect x="432" y="98" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="482" y="114" text-anchor="middle" fill="#446688" font-weight="bold">贡献</text>

    <!-- 行 v=7 -->
    <rect x="60" y="124" width="80" height="26" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="100" y="142" text-anchor="middle" fill="#333">7 (f=2)</text>
    <rect x="144" y="124" width="80" height="26" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="184" y="142" text-anchor="middle" fill="#333">49</text>
    <rect x="228" y="124" width="200" height="26" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="328" y="142" text-anchor="middle" fill="#888">a=7,b=7 → C(1,2)=0</text>
    <rect x="432" y="124" width="100" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="482" y="142" text-anchor="middle" fill="#b85450">0</text>

    <!-- 行 v=8 -->
    <rect x="60" y="152" width="80" height="26" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="100" y="170" text-anchor="middle" fill="#333">8 (f=1)</text>
    <rect x="144" y="152" width="80" height="26" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="184" y="170" text-anchor="middle" fill="#333">64</text>
    <rect x="228" y="152" width="200" height="26" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="328" y="170" text-anchor="middle" fill="#888">b 不在 cnt2</text>
    <rect x="432" y="152" width="100" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="482" y="170" text-anchor="middle" fill="#b85450">0</text>

    <!-- 行 v=3 命中 -->
    <rect x="60" y="180" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="100" y="198" text-anchor="middle" fill="#d6a040" font-weight="bold">3 (f=1)</text>
    <rect x="144" y="180" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="184" y="198" text-anchor="middle" fill="#d6a040" font-weight="bold">9</text>
    <rect x="228" y="180" width="200" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="328" y="198" text-anchor="middle" fill="#4a7a3a" font-weight="bold">a=1,b=9 → 1×1=1</text>
    <rect x="432" y="180" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="482" y="198" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1 ✓</text>
  </g>

  <text x="300" y="226" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">类型 1 合计 = 1 → 三元组 (3,0,2)：3² = 1 × 9</text>

  <!-- ===== 类型 2 标题 ===== -->
  <rect x="40" y="244" width="520" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="300" y="263" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">类型 2：A=nums2, B=nums1，求 nums2[i]² = nums1[j]·nums1[k]</text>

  <!-- 类型2 表格 -->
  <g font-size="11">
    <rect x="60" y="282" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="100" y="298" text-anchor="middle" fill="#446688" font-weight="bold">v</text>
    <rect x="144" y="282" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="184" y="298" text-anchor="middle" fill="#446688" font-weight="bold">target</text>
    <rect x="228" y="282" width="200" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="328" y="298" text-anchor="middle" fill="#446688" font-weight="bold">配对情况 (a≤b)</text>
    <rect x="432" y="282" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="482" y="298" text-anchor="middle" fill="#446688" font-weight="bold">贡献</text>

    <!-- v=1,2,9 全 0 -->
    <rect x="60" y="308" width="80" height="26" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="100" y="326" text-anchor="middle" fill="#333">1,2,9</text>
    <rect x="144" y="308" width="80" height="26" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="184" y="326" text-anchor="middle" fill="#888">1/4/81</text>
    <rect x="228" y="308" width="200" height="26" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="328" y="326" text-anchor="middle" fill="#888">b 不在 cnt1</text>
    <rect x="432" y="308" width="100" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="482" y="326" text-anchor="middle" fill="#b85450">0</text>

    <!-- v=7 命中 -->
    <rect x="60" y="336" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="100" y="354" text-anchor="middle" fill="#d6a040" font-weight="bold">7 (f=1)</text>
    <rect x="144" y="336" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="184" y="354" text-anchor="middle" fill="#d6a040" font-weight="bold">49</text>
    <rect x="228" y="336" width="200" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="328" y="354" text-anchor="middle" fill="#4a7a3a" font-weight="bold">a=7,b=7 → C(2,2)=1</text>
    <rect x="432" y="336" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="482" y="354" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1 ✓</text>
  </g>

  <text x="300" y="382" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">类型 2 合计 = 1 → 三元组 (3,0,1)：7² = 7 × 7（nums1 两个 7）</text>

  <!-- ===== 求和 ===== -->
  <path d="M 300 392 L 300 410" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="80" y="414" width="440" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="438" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">答案 = 类型1 + 类型2 = 1 + 1 = 2</text>
  <text x="300" y="458" text-anchor="middle" font-size="11" fill="#333">v=3 配 (1,9)，v=7 配 (7,7)，各贡献 1</text>

  <!-- ===== 关键提示 ===== -->
  <rect x="80" y="484" width="440" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="300" y="504" text-anchor="middle" font-size="11" fill="#b85450">⚠ a=b 时用组合数 C(n,2)：nums1 有两个 7，C(2,2)=1</text>
  <text x="300" y="522" text-anchor="middle" font-size="11" fill="#b85450">a&lt;b 时用频率积：nums2 的 1 和 9 各 1 个，1×1=1</text>
</svg>
