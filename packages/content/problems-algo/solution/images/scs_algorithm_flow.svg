<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：LCS 二维 DP → 回溯构造 SCS</text>

  <!-- Start node -->
  <ellipse cx="270" cy="58" rx="120" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="62" text-anchor="middle" font-size="12" fill="#333">输入 str1(m), str2(n)</text>

  <!-- arrow down -->
  <path d="M 270 78 L 270 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 1: LCS dp table -->
  <rect x="100" y="100" width="340" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="118" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">Step 1: 构建 LCS dp 表  O(mn)</text>
  <text x="270" y="134" text-anchor="middle" font-size="10" fill="#666">匹配 → dp[i-1][j-1]+1 · 不匹配 → max(上, 左)</text>

  <!-- arrow down -->
  <path d="M 270 144 L 270 162" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: backtrack init -->
  <rect x="150" y="166" width="240" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="186" text-anchor="middle" font-size="12" fill="#333">Step 2: 回溯  i = m, j = n</text>

  <!-- arrow down -->
  <path d="M 270 198 L 270 216" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond 1: str1[i-1] == str2[j-1]? -->
  <polygon points="270,220 380,266 270,312 160,266" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="260" text-anchor="middle" font-size="11" fill="#333">str1[i-1]</text>
  <text x="270" y="274" text-anchor="middle" font-size="11" fill="#333">== str2[j-1] ?</text>

  <!-- Yes branch -> right: output shared char -->
  <path d="M 380 266 L 430 266" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="402" y="258" text-anchor="middle" font-size="11" fill="#82b366">是</text>
  <rect x="398" y="248" width="130" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="463" y="266" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">输出共享字符</text>
  <text x="463" y="280" text-anchor="middle" font-size="10" fill="#555">i--, j--  (对角↖)</text>

  <!-- No branch -> down to Diamond 2 -->
  <path d="M 270 312 L 270 330" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="326" font-size="11" fill="#b85450">否</text>

  <!-- Diamond 2: dp[i-1][j] >= dp[i][j-1]? -->
  <polygon points="270,334 370,372 270,410 170,372" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="368" text-anchor="middle" font-size="11" fill="#333">dp[i-1][j]</text>
  <text x="270" y="382" text-anchor="middle" font-size="11" fill="#333">≥ dp[i][j-1]?</text>

  <!-- Yes -> left: output str1 char -->
  <path d="M 170 372 L 120 372" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="148" y="364" text-anchor="middle" font-size="11" fill="#82b366">是</text>
  <rect x="12" y="352" width="104" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="64" y="370" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">输出 str1[i-1]</text>
  <text x="64" y="384" text-anchor="middle" font-size="10" fill="#555">i--  (向上↑)</text>

  <!-- No -> right: output str2 char -->
  <path d="M 370 372 L 420 372" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="398" y="364" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <rect x="424" y="352" width="104" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="476" y="370" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">输出 str2[j-1]</text>
  <text x="476" y="384" text-anchor="middle" font-size="10" fill="#555">j--  (向左←)</text>

  <!-- Loop back note -->
  <text x="270" y="428" text-anchor="middle" font-size="10" fill="#888">↑ 三路均回到 Diamond 1，循环直到 i = 0 或 j = 0 → 补剩余前缀 → 逆序拼接得 SCS</text>
</svg>
