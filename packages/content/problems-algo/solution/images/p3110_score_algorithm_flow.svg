<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：单指针一趟扫描 n−1 个相邻对</text>

  <rect x="205" y="38" width="110" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="260" y="57" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">开始</text>

  <path d="M 260 66 L 260 80" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="180" y="84" width="160" height="30" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="260" y="104" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">ans = 0，i = 0</text>

  <path d="M 260 114 L 260 128" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="260,132 360,172 260,212 160,172" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="170" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">i ≤ n − 2 ?</text>
  <text x="260" y="188" text-anchor="middle" font-size="9.5" fill="#b08040" filter="url(#rough2)">还有相邻对没算？</text>

  <path d="M 260 212 L 260 232" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="271" y="226" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="165" y="236" width="190" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="256" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">取相邻对 (s[i], s[i+1])</text>

  <path d="M 260 266 L 260 282" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="150" y="286" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="306" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">ans += |ord(s[i]) − ord(s[i+1])|</text>

  <path d="M 260 316 L 260 330" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="185" y="334" width="150" height="28" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="260" y="353" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">i += 1</text>

  <path d="M 185 348 L 95 348 L 95 172 L 152 172" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="104" y="262" font-size="10" fill="#888" filter="url(#rough2)">下一对</text>

  <path d="M 360 172 L 400 172" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="372" y="164" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="404" y="144" width="94" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="451" y="167" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回</text>
  <text x="451" y="188" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans</text>

  <rect x="48" y="380" width="424" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="398" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">每对 O(1) → 总时间 O(n)，空间 O(1) 仅一个累加变量</text>
  <text x="260" y="416" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">n ≥ 2 保证循环至少执行一次，无需特判</text>
</svg>
