<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：取关键字 → 按键降序排序 → 输出行序列</text>

  <!-- Box 1 -->
  <rect x="24" y="128" width="140" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="94" y="156" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">① 取关键字</text>
  <text x="94" y="180" text-anchor="middle" font-size="11" fill="#333">key[i] ← score[i][k]</text>
  <text x="94" y="204" text-anchor="middle" font-size="11.5" fill="#888" font-weight="bold">O(m)</text>

  <!-- arrow 1->2 -->
  <path d="M 164 176 L 198 176" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 2 (core: sort) -->
  <rect x="200" y="128" width="140" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="156" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">② 按键降序排序</text>
  <text x="270" y="180" text-anchor="middle" font-size="11" fill="#333">比较仅看标量 key</text>
  <text x="270" y="204" text-anchor="middle" font-size="11.5" fill="#888" font-weight="bold">O(m log m)</text>

  <!-- arrow 2->3 -->
  <path d="M 340 176 L 374 176" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 3 -->
  <rect x="376" y="128" width="140" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="446" y="156" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">③ 输出行序列</text>
  <text x="446" y="180" text-anchor="middle" font-size="11" fill="#333">按新顺序返回行</text>
  <text x="446" y="204" text-anchor="middle" font-size="11.5" fill="#888" font-weight="bold">O(m)</text>

  <!-- bottom note -->
  <rect x="44" y="250" width="452" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="272" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">总时间 O(m log m)；比较每次 O(1)，与行宽 n 无关</text>
  <text x="270" y="294" text-anchor="middle" font-size="11.5" fill="#446688">空间 O(log m)（原地排序栈）/ O(m)（Python key 缓存）</text>
  <text x="270" y="314" text-anchor="middle" font-size="11" fill="#888">行宽 n 只影响输出矩阵大小，不进入排序复杂度</text>
</svg>
