<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="480" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：频次表 + 枚举约数（O(n + m + D·√(V/k))）</text>

  <rect x="225" y="36" width="70" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="12" filter="url(#rough2)"/>
  <text x="260" y="52" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">开始</text>

  <path d="M260,60 L260,76" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="78" width="180" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="260" y="96" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">建频次表 cnt1、cnt2</text>

  <path d="M260,106 L260,122" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="155" y="124" width="210" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="260" y="142" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">取 cnt1 下一个去重值 (x, c)</text>

  <path d="M365,138 L404,138" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="384" y="130" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">取完</text>

  <rect x="408" y="120" width="92" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="454" y="141" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <path d="M260,152 L260,168" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="180,198 260,170 340,198 260,226" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="202" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">k 整除 x ?</text>

  <path d="M180,198 L148,198" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="163" y="190" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="48" y="182" width="98" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="97" y="202" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">剪枝跳过</text>

  <path d="M48,198 L26,198 L26,132 L151,132" stroke="#888" stroke-width="1.4" stroke-dasharray="5,4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M260,226 L260,242" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="240" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="160" y="244" width="200" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="260" y="262" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">y = x / k，d = 1</text>

  <path d="M260,272 L260,288" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="175,322 260,292 345,322 260,352" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="326" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">d·d ≤ y ?</text>

  <path d="M175,322 L146,322" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="161" y="314" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="40" y="306" width="104" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="92" y="326" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">试除结束→下个值</text>

  <path d="M40,322 L18,322 L18,146 L151,146" stroke="#888" stroke-width="1.4" stroke-dasharray="5,4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M260,352 L260,368" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="366" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="95" y="370" width="330" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="390" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">若 y % d == 0：ans += c·cnt2[d]</text>
  <text x="260" y="408" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">d² ≠ y 时再加 c·cnt2[y/d]，随后 d++</text>

  <path d="M425,394 L470,394 L470,307 L312,307" stroke="#888" stroke-width="1.4" stroke-dasharray="5,4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="448" y="384" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">d++ 回判</text>

  <text x="260" y="456" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">D = nums1 去重值个数：外层 D 次、内层 √(x/k) 次试除，每次查表 O(1)</text>
</svg>
