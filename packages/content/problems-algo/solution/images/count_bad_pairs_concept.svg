<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：坏数对 ⟺ d[i] ≠ d[j]，坏 = 总对数 − 好数对</text>

  <!-- Equation transformation box -->
  <rect x="40" y="40" width="500" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="64" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">坏数对定义 (i &lt; j):   j − i  ≠  nums[j] − nums[i]</text>
  <path d="M 290 72 L 290 86" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="104" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">移项改写:   nums[i] − i  ≠  nums[j] − j</text>
  <path d="M 290 112 L 290 126" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="146" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">令 d[k] = nums[k] − k   ⟹   坏数对 ⟺ d[i] ≠ d[j]</text>

  <!-- Example label -->
  <text x="40" y="190" font-size="12" fill="#888" font-weight="bold">以 nums = [4, 1, 3, 3] 为例</text>

  <!-- nums row -->
  <text x="40" y="226" font-size="11" fill="#888" font-weight="bold">nums[i]</text>
  <rect x="120" y="200" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="226" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="184" y="200" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="216" y="226" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="248" y="200" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="226" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="312" y="200" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="344" y="226" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="384" y="226" font-size="10" fill="#888">i:  0    1    2    3</text>

  <!-- d row: d=4,0,1,0 ; highlight d=0 at idx1 and idx3 -->
  <text x="40" y="286" font-size="11" fill="#888" font-weight="bold">d[i]</text>
  <rect x="120" y="260" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="286" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="184" y="260" width="64" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="216" y="286" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="248" y="260" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="286" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="312" y="260" width="64" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="344" y="286" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="384" y="280" font-size="11" fill="#4a7a3a" font-weight="bold">← d=0 出现 2 次</text>
  <text x="384" y="294" font-size="11" fill="#4a7a3a" font-weight="bold">  贡献 C(2,2)=1 好数对</text>

  <!-- Bottom formula box -->
  <rect x="40" y="320" width="500" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="348" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">坏数对 = 总对数 − 好数对</text>
  <text x="290" y="372" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">= C(n, 2) − Σ C(c, 2)     (c 为每个 d 值的出现次数)</text>
  <text x="290" y="392" text-anchor="middle" font-size="11" fill="#666">本例：C(4, 2) − C(2, 2) = 6 − 1 = 5</text>
</svg>
