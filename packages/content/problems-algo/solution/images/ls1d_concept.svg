<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    滑动窗口：最多容纳 1 个 0
  </text>

  <!-- nums 数组：[0,1,1,1,0,1,1,0,1] -->
  <text x="32" y="86" font-size="12" fill="#666" filter="url(#rough2)">nums</text>

  <!-- cell 0: 0 (在窗口外) -->
  <rect x="76" y="70" width="44" height="44" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="98" y="98" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">0</text>

  <!-- cell 1: 1 (窗口起点) -->
  <rect x="120" y="70" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="142" y="98" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <!-- cell 2: 1 -->
  <rect x="164" y="70" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="98" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <!-- cell 3: 1 -->
  <rect x="208" y="70" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="98" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <!-- cell 4: 0 (窗口内，被删除) -->
  <rect x="252" y="70" width="44" height="44" fill="#fff8e1" stroke="#d6a040"
        stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="274" y="98" text-anchor="middle" font-size="14" fill="#d6a040" filter="url(#rough2)">0</text>
  <text x="274" y="128" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">删除</text>

  <!-- cell 5: 1 -->
  <rect x="296" y="70" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="318" y="98" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <!-- cell 6: 1 (窗口终点) -->
  <rect x="340" y="70" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="362" y="98" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <!-- cell 7: 0 (窗口外) -->
  <rect x="384" y="70" width="44" height="44" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="406" y="98" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">0</text>

  <!-- cell 8: 1 (窗口外) -->
  <rect x="428" y="70" width="44" height="44" fill="#fafafa" stroke="#999"
        stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="450" y="98" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">1</text>

  <!-- 窗口括号 -->
  <path d="M120,150 Q120,160 130,160 L362,160 Q374,160 374,150"
        fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="247" y="180" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">
    窗口 [left, right] = 6 个元素，含 1 个 0
  </text>

  <!-- left / right 指针标注 -->
  <text x="142" y="62" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">left</text>
  <text x="362" y="62" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">right</text>

  <!-- 删除一个 0 后的全 1 序列 -->
  <text x="32" y="216" font-size="12" fill="#666" filter="url(#rough2)">结果</text>

  <rect x="120" y="200" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="228" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <rect x="164" y="200" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="228" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <rect x="208" y="200" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="228" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <rect x="296" y="200" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="318" y="228" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <rect x="340" y="200" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="362" y="228" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <!-- 删除处的虚线空格 -->
  <rect x="252" y="200" width="44" height="44" fill="none" stroke="#d6a040"
        stroke-width="1.5" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="274" y="228" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">✕</text>

  <!-- 公式说明 -->
  <path d="M120,270 Q260,280 384,270" fill="none" stroke="#446688"
        stroke-width="1.5" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <rect x="110" y="286" width="300" height="56" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="308" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    答案 = 窗口长度 − 1
  </text>
  <text x="260" y="328" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">
    6 − 1 = 5
  </text>
</svg>
