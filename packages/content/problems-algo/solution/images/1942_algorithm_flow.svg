<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="480" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：事件排序 + 双堆分配回收</text>

  <!-- Step 1: build events -->
  <rect x="40" y="52" width="540" height="96" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="76" font-size="13" fill="#446688" font-weight="bold">步骤 1 · 建事件并按 (时刻, 类型) 排序</text>
  <g font-size="11" font-family="monospace">
    <text x="60" y="100" fill="#444">for i in 0..n-1:</text>
    <text x="80" y="118" fill="#b85450">events.append((leaving_i, 0, i))   // 离开 type=0</text>
    <text x="80" y="136" fill="#4a7a3a">events.append((arrival_i, 1, i))   // 到达 type=1</text>
  </g>

  <path d="M 310 152 L 310 178" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 2: init -->
  <rect x="40" y="184" width="540" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="208" font-size="13" fill="#d6a040" font-weight="bold">步骤 2 · 初始化</text>
  <text x="60" y="228" font-size="11" font-family="monospace" fill="#555">available = 空; nextChair = 0; chairOf[n] = -1</text>

  <path d="M 310 244 L 310 270" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 3: process events loop -->
  <rect x="40" y="276" width="540" height="172" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="300" font-size="13" fill="#4a7a3a" font-weight="bold">步骤 3 · 依次处理事件 ev = (t, type, i)</text>

  <!-- decision diamond -->
  <polygon points="180,316 270,346 180,376 90,346" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="350" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">type == 0?</text>

  <text x="280" y="338" font-size="11" fill="#888">是(离开)</text>
  <text x="140" y="384" font-size="11" fill="#888">否(到达)</text>

  <!-- leave branch: push back -->
  <rect x="300" y="328" width="260" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="316" y="348" font-size="11" font-family="monospace" fill="#b85450">available.push(chairOf[i])</text>
  <text x="316" y="362" font-size="10" fill="#888">// 椅子归还候选池</text>

  <!-- arrival branch -->
  <rect x="50" y="386" width="240" height="52" rx="6" fill="#fafafa" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="64" y="406" font-size="11" font-family="monospace" fill="#4a7a3a">c = available.top() ?: nextChair++</text>
  <text x="64" y="424" font-size="10" fill="#888">chairOf[i] = c</text>

  <path d="M 296 412 L 326 412" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- target check -->
  <rect x="330" y="386" width="230" height="52" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="346" y="406" font-size="11" fill="#4a7a3a" font-weight="bold">i == targetFriend ?</text>
  <text x="346" y="424" font-size="11" font-family="monospace" fill="#b85450">是 → return c（提前终止）</text>

  <path d="M 445 440 L 445 458" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <rect x="365" y="452" width="160" height="22" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="445" y="467" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回 c</text>
</svg>
