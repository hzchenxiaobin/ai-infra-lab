<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">单调性：字号↑ → 字符宽高↑ → 超出屏幕</text>

  <!-- Left screen: small font fits -->
  <text x="110" y="56" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">小字号 ✓ 放得下</text>
  <rect x="40" y="64" width="140" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="98" text-anchor="middle" font-size="10" fill="#333">helloworld</text>
  <text x="110" y="136" text-anchor="middle" font-size="9" fill="#888">fontSize = 6, 宽 64 ≤ 80, 高 8 ≤ 20</text>

  <!-- Right screen: large font overflows -->
  <text x="410" y="56" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">大字号 ✗ 溢出</text>
  <rect x="340" y="64" width="140" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="350" y="98" font-size="13" fill="#333" font-weight="bold">hello</text>
  <text x="392" y="98" font-size="13" fill="#b85450" font-weight="bold">w</text>
  <path d="M 482 88 L 510 88" stroke="#b85450" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="514" y="92" font-size="9" fill="#b85450">溢出!</text>
  <text x="410" y="136" text-anchor="middle" font-size="9" fill="#888">fontSize = 14, 宽 120 &gt; 80</text>

  <!-- Divider -->
  <line x1="30" y1="158" x2="530" y2="158" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- Font size array with check/cross -->
  <text x="30" y="182" font-size="11" fill="#555" font-weight="bold">fonts =</text>
  <g font-size="11" fill="#333" text-anchor="middle">
    <rect x="78"  y="170" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="96"  y="187">6</text>
    <rect x="118" y="170" width="36" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="136" y="187">8</text>
    <rect x="158" y="170" width="36" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="176" y="187">10</text>
    <rect x="198" y="170" width="36" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="216" y="187">12</text>
    <rect x="238" y="170" width="36" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="256" y="187">14</text>
    <rect x="278" y="170" width="36" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="296" y="187">16</text>
    <rect x="318" y="170" width="36" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="336" y="187">18</text>
    <rect x="358" y="170" width="36" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="376" y="187">24</text>
    <rect x="398" y="170" width="36" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="416" y="187">36</text>
  </g>

  <!-- Check / Cross marks above each box -->
  <g font-size="14" text-anchor="middle" filter="url(#rough2)">
    <text x="96"  y="212" fill="#4a7a3a" font-weight="bold">✓</text>
    <text x="136" y="212" fill="#b85450" font-weight="bold">✗</text>
    <text x="176" y="212" fill="#b85450" font-weight="bold">✗</text>
    <text x="216" y="212" fill="#b85450" font-weight="bold">✗</text>
    <text x="256" y="212" fill="#b85450" font-weight="bold">✗</text>
    <text x="296" y="212" fill="#b85450" font-weight="bold">✗</text>
    <text x="336" y="212" fill="#b85450" font-weight="bold">✗</text>
    <text x="376" y="212" fill="#b85450" font-weight="bold">✗</text>
    <text x="416" y="212" fill="#b85450" font-weight="bold">✗</text>
  </g>

  <!-- Answer pointer -->
  <path d="M 96 228 L 96 244" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="96" y="260" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">答案 = 6</text>
  <text x="96" y="274" text-anchor="middle" font-size="9" fill="#888">最后一个 ✓</text>

  <!-- Boundary annotation -->
  <path d="M 116 202 L 132 202" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="280" y="248" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">← 左边全 ✓（可行）  |  右边全 ✗（不可行） →</text>

  <!-- Insight box -->
  <rect x="30" y="296" width="500" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="48" y="316" font-size="11" fill="#446688" font-weight="bold">关键洞察：单调性 → 二分查找</text>
  <text x="48" y="334" font-size="11" fill="#555">① fonts 已升序排列；② 题目保证 getHeight(f) ≤ getHeight(f+1)、getWidth(f,ch) ≤ getWidth(f+1,ch)</text>
  <text x="48" y="352" font-size="11" fill="#555">→ 「字号能否放下」具有单调性：小字号放得下 ⇒ 更小的一定放得下</text>
  <text x="48" y="370" font-size="11" fill="#555">→ 在升序数组上二分，找最后一个「放得下」的字号（右边界）</text>
</svg>
