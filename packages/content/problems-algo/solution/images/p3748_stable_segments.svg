<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrBlu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrGrn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：极大非递减段 + 查询三段拆分</text>

  <!-- 段标签 -->
  <text x="150" y="48" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">段A</text>
  <text x="260" y="48" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">段B</text>
  <text x="370" y="48" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">段C</text>

  <!-- 数组格子：4 5 6 | 2 3 | 1 2 8 -->
  <rect x="84" y="56" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="128" y="56" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="172" y="56" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="216" y="56" width="44" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="260" y="56" width="44" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="304" y="56" width="44" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="348" y="56" width="44" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="392" y="56" width="44" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="106" y="81" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <text x="150" y="81" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <text x="194" y="81" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>
  <text x="238" y="81" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="282" y="81" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <text x="326" y="81" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="370" y="81" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="414" y="81" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">8</text>

  <!-- 下降沿切分线 -->
  <path d="M 216 52 L 216 100" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 304 52 L 304 100" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="216" y="48" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">6&gt;2</text>
  <text x="304" y="48" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">3&gt;1</text>

  <!-- 下标 -->
  <text x="106" y="112" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="150" y="112" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="194" y="112" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="238" y="112" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="282" y="112" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>
  <text x="326" y="112" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">5</text>
  <text x="370" y="112" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">6</text>
  <text x="414" y="112" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">7</text>

  <!-- 查询括号 [1,6] -->
  <path d="M 128 124 L 128 130 L 392 130 L 392 124" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="124" y="141" text-anchor="end" font-size="12" fill="#b85450" filter="url(#rough2)">查询 [1, 6]</text>

  <!-- 括号到三个拼装块的箭头 -->
  <path d="M 172 136 L 124 160" fill="none" stroke="#446688" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrBlu)" filter="url(#rough2)"/>
  <path d="M 260 136 L 271 160" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrGrn)" filter="url(#rough2)"/>
  <path d="M 348 136 L 425 160" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <!-- 三段拼装块 -->
  <rect x="40" y="164" width="150" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115" y="184" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">左残段 [5,6]（段A 尾）</text>
  <text x="115" y="202" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">len 2 → 3 个</text>

  <rect x="198" y="164" width="150" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="273" y="184" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">完整中段 [2,3]（段B）</text>
  <text x="273" y="202" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">len 2 → 3 个（pref 直取）</text>

  <rect x="356" y="164" width="150" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="431" y="184" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">右残段 [1,2]（段C 头）</text>
  <text x="431" y="202" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">len 2 → 3 个</text>

  <!-- 公式结果框 -->
  <rect x="56" y="228" width="408" height="88" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="260" y="252" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">ans = tri(左残长) + Σ 完整段 L(L+1)/2 + tri(右残长)</text>
  <text x="260" y="274" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">tri(m) = m(m+1)/2 ；中段和 = pref[jr−1] − pref[jl]（前缀和作差）</text>
  <text x="260" y="298" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">本例 = 3 + 3 + 3 = 9 ✓</text>

  <!-- 底注 -->
  <text x="260" y="336" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">稳定 ⟺ 非递减（无逆序对）；跨段必含下降沿 → 必不稳定 → 稳定子数组不跨段</text>
  <text x="260" y="352" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">l、r 同段（jl = jr）时退化为一步：ans = (r−l+1)(r−l+2)/2</text>
</svg>
