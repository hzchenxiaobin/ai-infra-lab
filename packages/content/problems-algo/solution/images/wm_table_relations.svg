<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">两表关联：Warehouse JOIN Products ON product_id</text>

  <!-- ===== Warehouse table ===== -->
  <rect x="30" y="50" width="180" height="150" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="120" y="70" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">Warehouse</text>
  <line x1="40" y1="78" x2="200" y2="78" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="42" y="94" font-size="11" fill="#333">name</text>
  <text x="42" y="110" font-size="11" fill="#b85450" font-weight="bold">product_id  PK</text>
  <text x="42" y="126" font-size="11" fill="#333">units</text>
  <text x="42" y="148" font-size="10" fill="#888">LCHouse1, p=1, u=1</text>
  <text x="42" y="162" font-size="10" fill="#888">LCHouse1, p=2, u=10</text>
  <text x="42" y="176" font-size="10" fill="#888">LCHouse3, p=4, u=1</text>
  <text x="42" y="192" font-size="10" fill="#888">… 6 行</text>

  <!-- ===== Products table ===== -->
  <rect x="350" y="50" width="190" height="170" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="445" y="70" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">Products</text>
  <line x1="360" y1="78" x2="530" y2="78" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="362" y="94" font-size="11" fill="#b85450" font-weight="bold">product_id  PK</text>
  <text x="362" y="110" font-size="11" fill="#333">product_name</text>
  <text x="362" y="126" font-size="11" fill="#d6a040" font-weight="bold">Width</text>
  <text x="362" y="142" font-size="11" fill="#d6a040" font-weight="bold">Length</text>
  <text x="362" y="158" font-size="11" fill="#d6a040" font-weight="bold">Height</text>
  <text x="362" y="180" font-size="10" fill="#888">1: LC-TV  5×50×40</text>
  <text x="362" y="194" font-size="10" fill="#888">2: KeyChain 5×5×5</text>
  <text x="362" y="208" font-size="10" fill="#888">4: T-Shirt 4×10×20</text>

  <!-- Join arrow -->
  <path d="M 210 100 L 350 100" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="93" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">JOIN ON product_id</text>
  <text x="280" y="116" text-anchor="middle" font-size="9" fill="#b85450">取 Width/Length/Height</text>

  <!-- ===== Formula box ===== -->
  <rect x="80" y="240" width="400" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="262" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">单行体积 = units × Width × Length × Height</text>
  <text x="280" y="280" text-anchor="middle" font-size="10" fill="#888">每行仓库记录 → 单件体积 × 存货数量</text>

  <!-- ===== Output ===== -->
  <rect x="120" y="312" width="320" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="332" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">输出：warehouse_name, volume</text>
  <text x="280" y="350" text-anchor="middle" font-size="10" fill="#888">GROUP BY name → SUM(单行体积)</text>

  <!-- arrows -->
  <path d="M 280 290 L 280 312" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
