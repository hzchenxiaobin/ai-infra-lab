<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：DFS 递归减法（target 逐层减 val）</text>

  <!-- start -->
  <rect x="170" y="44" width="180" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="260" y="65" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dfs(node, target)</text>
  <path d="M 260 76 L 260 92" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- diamond: node == null? -->
  <path d="M 260 96 L 340 132 L 260 168 L 180 132 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="136" text-anchor="middle" font-size="11" fill="#333">node == null ?</text>
  <path d="M 340 132 L 396 132" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="350" y="126" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="396" y="116" width="92" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="442" y="137" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return false</text>
  <path d="M 260 168 L 260 184" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="268" y="180" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- diamond: leaf? -->
  <path d="M 260 188 L 372 228 L 260 268 L 148 228 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="224" text-anchor="middle" font-size="11" fill="#333">叶子节点 ?</text>
  <text x="260" y="240" text-anchor="middle" font-size="10" fill="#888">(left==null &amp;&amp; right==null)</text>
  <path d="M 372 228 L 410 228" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="378" y="222" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="410" y="206" width="100" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="460" y="226" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return</text>
  <text x="460" y="242" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">target == val</text>
  <path d="M 260 268 L 260 290" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="268" y="284" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- recurse: or of two branches -->
  <rect x="120" y="292" width="280" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="313" text-anchor="middle" font-size="11" fill="#333">return dfs(left, target − val)</text>
  <text x="430" y="313" font-size="13" fill="#b85450" font-weight="bold">||</text>
  <text x="260" y="313" text-anchor="middle" font-size="11" fill="#333"></text>
  <path d="M 260 326 L 260 342" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <rect x="120" y="344" width="280" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="365" text-anchor="middle" font-size="11" fill="#333">dfs(right, target − val)</text>

  <!-- side note -->
  <path d="M 400 311 Q 462 330 462 372" stroke="#d6a040" stroke-width="1.3" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="372" y="372" width="138" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="441" y="390" text-anchor="middle" font-size="10" fill="#8a6a20">左/右只要有一个 true</text>
  <text x="441" y="406" text-anchor="middle" font-size="10" fill="#8a6a20">即短路返回 true</text>

  <text x="260" y="424" text-anchor="middle" font-size="10" fill="#888">用「target − val」下传，避免维护单独的 cur；叶子处只需比较相等</text>
</svg>
