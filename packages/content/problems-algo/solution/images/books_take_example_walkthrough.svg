<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 290" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="290" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：books = [8, 5, 2, 7, 9]</text>

  <rect x="80" y="46" width="400" height="28" fill="#446688" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="95" y="65" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">i</text>
  <text x="140" y="65" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">books[i]</text>
  <text x="197" y="65" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">b[i]−i</text>
  <text x="250" y="65" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">弹出</text>
  <text x="288" y="65" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">j</text>
  <text x="328" y="65" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">dp[i]</text>
  <text x="418" y="65" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">取书方案</text>

  <rect x="80" y="74" width="400" height="26" fill="#fff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="95" y="91" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="140" y="91" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">8</text>
  <text x="197" y="91" text-anchor="middle" font-size="11" fill="#446688">8</text>
  <text x="250" y="91" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="288" y="91" text-anchor="middle" font-size="11" fill="#999">−1</text>
  <text x="328" y="91" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">8</text>
  <text x="418" y="91" text-anchor="middle" font-size="11" fill="#333">[8]</text>

  <rect x="80" y="100" width="400" height="26" fill="#f7f7f7" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="95" y="117" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="140" y="117" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="197" y="117" text-anchor="middle" font-size="11" fill="#b85450">4</text>
  <text x="250" y="117" text-anchor="middle" font-size="11" fill="#b85450">0</text>
  <text x="288" y="117" text-anchor="middle" font-size="11" fill="#999">−1</text>
  <text x="328" y="117" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">9</text>
  <text x="418" y="117" text-anchor="middle" font-size="11" fill="#333">[4, 5]</text>

  <rect x="80" y="126" width="400" height="26" fill="#fff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="95" y="143" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="140" y="143" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="197" y="143" text-anchor="middle" font-size="11" fill="#b85450">0</text>
  <text x="250" y="143" text-anchor="middle" font-size="11" fill="#b85450">1</text>
  <text x="288" y="143" text-anchor="middle" font-size="11" fill="#999">−1</text>
  <text x="328" y="143" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="418" y="143" text-anchor="middle" font-size="11" fill="#333">[1, 2]</text>

  <rect x="80" y="152" width="400" height="26" fill="#f7f7f7" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="95" y="169" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="140" y="169" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>
  <text x="197" y="169" text-anchor="middle" font-size="11" fill="#4a7a3a">4</text>
  <text x="250" y="169" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="288" y="169" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="328" y="169" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">10</text>
  <text x="418" y="169" text-anchor="middle" font-size="11" fill="#333">[1, 2, 7]</text>

  <rect x="80" y="178" width="400" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="95" y="197" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="140" y="197" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">9</text>
  <text x="197" y="197" text-anchor="middle" font-size="11" fill="#4a7a3a">5</text>
  <text x="250" y="197" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="288" y="197" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="328" y="197" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">19</text>
  <text x="418" y="197" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[1, 2, 7, 9]</text>

  <path d="M 80 214 L 480 214" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <text x="280" y="240" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">答案 = max(dp) = 19</text>
  <text x="280" y="262" text-anchor="middle" font-size="11" fill="#888">i=1 时 b[i]−i=4 &lt; 8=b[0]−0，弹 0；i=2 同理弹 1 → 栈空 → dp 用 1+2+…+b[i] 求和</text>
  <text x="280" y="278" text-anchor="middle" font-size="11" fill="#888">i=3,4 时栈顶 b[k]−k &lt; b[i]−i → 不弹 → dp[i] = dp[j] + 等差求和</text>
</svg>
