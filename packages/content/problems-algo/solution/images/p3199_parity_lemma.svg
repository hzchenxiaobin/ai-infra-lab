<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：popcount 的奇偶性模 2 守恒</text>

  <!-- 左：逐位抵消表 -->
  <text x="148" y="46" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">逐位看 x ⊕ y：每行的差都是偶数</text>

  <rect x="36" y="54" width="48" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="60" y="69" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">x 位</text>
  <rect x="84" y="54" width="48" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="108" y="69" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">y 位</text>
  <rect x="132" y="54" width="52" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="158" y="69" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">x⊕y</text>
  <rect x="184" y="54" width="74" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="221" y="69" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">与加法之差</text>

  <rect x="36" y="76" width="48" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="91" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="84" y="76" width="48" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="108" y="91" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="132" y="76" width="52" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="158" y="91" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="184" y="76" width="74" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="221" y="91" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">+2</text>

  <rect x="36" y="98" width="48" height="22" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="113" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="84" y="98" width="48" height="22" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="108" y="113" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="132" y="98" width="52" height="22" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="158" y="113" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="184" y="98" width="74" height="22" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="221" y="113" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>

  <rect x="36" y="120" width="48" height="22" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="135" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="84" y="120" width="48" height="22" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="108" y="135" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="132" y="120" width="52" height="22" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="158" y="135" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="184" y="120" width="74" height="22" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="221" y="135" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>

  <rect x="36" y="142" width="48" height="22" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="157" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="84" y="142" width="48" height="22" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="108" y="157" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="132" y="142" width="52" height="22" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="158" y="157" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="184" y="142" width="74" height="22" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="221" y="157" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>

  <text x="258" y="91" text-anchor="middle" font-size="9" fill="#8a6d3b" filter="url(#rough2)">两个 1</text>
  <text x="258" y="102" text-anchor="middle" font-size="9" fill="#8a6d3b" filter="url(#rough2)">抵消成 0</text>

  <rect x="36" y="176" width="222" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="147" y="194" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">popcount(x⊕y) = popcount(x)+popcount(y) − 2·重叠</text>
  <text x="147" y="210" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">⇒ 模 2 意义下「异或 = 相加」✓</text>

  <!-- 右：数值验证 -->
  <rect x="296" y="54" width="196" height="132" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="394" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">数值验证：13 ⊕ 10 = 7</text>
  <text x="394" y="96" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">13 = 1101 → 3 个 1（奇）</text>
  <text x="394" y="114" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">10 = 1010 → 2 个 1（偶）</text>
  <text x="394" y="132" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">07 = 0111 → 3 个 1（奇）</text>
  <text x="394" y="154" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3 + 2 − 2×1 = 3</text>
  <text x="394" y="172" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">奇 + 偶 → 奇 ✓（重叠的 1 只有 1 个）</text>

  <!-- 底部：三元组奇偶判定 -->
  <rect x="48" y="248" width="104" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="100" y="266" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">a[i] 的奇偶</text>
  <text x="100" y="282" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">奇</text>

  <text x="172" y="274" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">⊕</text>

  <rect x="196" y="248" width="104" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="248" y="266" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">b[j] 的奇偶</text>
  <text x="248" y="282" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">奇</text>

  <text x="320" y="274" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">⊕</text>

  <rect x="344" y="248" width="104" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="396" y="266" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">c[k] 的奇偶</text>
  <text x="396" y="282" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">偶</text>

  <path d="M 260 292 L 260 310" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="276" y="306" font-size="9.5" fill="#446688" filter="url(#rough2)">奇 + 奇 + 偶 ≡ 0 (mod 2)</text>

  <rect x="60" y="314" width="400" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="336" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">异或结果的 popcount 奇偶 = 三个 popcount 奇偶之和 (mod 2)</text>
  <text x="260" y="356" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">「奇」的个数为 0 或 2 ⇔ a⊕b⊕c 的 popcount 为偶</text>
  <text x="260" y="372" text-anchor="middle" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">（每个数只剩一个比特的信息：popcount mod 2）</text>
</svg>
