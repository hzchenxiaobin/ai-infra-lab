<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">按 d 分层展开：撞车的那层整层报废</text>

  <!-- 左侧：同心正方形示意扩张方向 -->
  <rect x="35" y="60" width="120" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="55" y="80" width="80" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="75" y="100" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <circle cx="95" cy="120" r="4" fill="#666" filter="url(#rough2)"/>
  <text x="95" y="140" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">原点</text>
  <path d="M 95 120 L 160 55" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="52" font-size="12" fill="#b85450" filter="url(#rough2)">D 增大</text>

  <!-- d=2 层：安全 -->
  <rect x="150" y="60" width="240" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="138" y="88" text-anchor="end" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">d=2</text>
  <circle cx="195" cy="83" r="13" fill="#ffffff" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="195" y="88" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">a</text>
  <text x="214" y="88" font-size="10" fill="#666" filter="url(#rough2)">(2,2)</text>
  <circle cx="285" cy="83" r="13" fill="#ffffff" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="285" y="88" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">b</text>
  <text x="304" y="88" font-size="10" fill="#666" filter="url(#rough2)">(-1,-2)</text>
  <text x="400" y="88" font-size="12" fill="#4a7a3a" filter="url(#rough2)">✓ 已包含</text>

  <!-- d=3 层：撞车 -->
  <rect x="150" y="120" width="300" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="138" y="148" text-anchor="end" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">d=3</text>
  <circle cx="210" cy="143" r="13" fill="#ffffff" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="210" y="148" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">c</text>
  <text x="229" y="148" font-size="10" fill="#666" filter="url(#rough2)">(-3,1)</text>
  <circle cx="320" cy="143" r="13" fill="#ffffff" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="320" y="148" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">a</text>
  <text x="339" y="148" font-size="10" fill="#666" filter="url(#rough2)">(3,-3)</text>
  <text x="415" y="148" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗ 整层作废</text>
  <text x="260" y="113" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">a 撞车：标签 a 已在 d=2 层进场！</text>

  <!-- d=4 层：进不来 -->
  <rect x="150" y="180" width="330" height="46" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="8" opacity="0.85" filter="url(#rough2)"/>
  <text x="138" y="208" text-anchor="end" font-size="13" fill="#999" filter="url(#rough2)">d=4</text>
  <circle cx="240" cy="203" r="13" fill="#ffffff" stroke="#999" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="208" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">d</text>
  <text x="259" y="208" font-size="10" fill="#999" filter="url(#rough2)">(-4,4)</text>
  <text x="420" y="208" font-size="12" fill="#999" filter="url(#rough2)">进不来</text>

  <!-- 结论框 -->
  <rect x="60" y="250" width="400" height="85" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="80" y="278" font-size="13" fill="#333" filter="url(#rough2)">t = min(各标签的次小 d) = 3　（a 的第二次进场）</text>
  <text x="80" y="308" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">答案 = #{ d &lt; t } = 2　（d=3 层的 c 被连坐）</text>
</svg>
