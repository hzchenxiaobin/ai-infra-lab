<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：规则独立 + 字符串拼接</text>

  <!-- ===== Panel A: naive if-else, enumerate combinations ===== -->
  <text x="40" y="56" font-size="12.5" fill="#b85450" font-weight="bold">写死组合：每加一条规则，分支翻倍</text>

  <!-- rules: 3 -> Fizz -->
  <rect x="44" y="68" width="64" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="76" y="87" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3 → Fizz</text>

  <rect x="120" y="68" width="64" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="152" y="87" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">5 → Buzz</text>

  <!-- must manually combine: 15 -> FizzBuzz -->
  <text x="200" y="87" font-size="11.5" fill="#888">⇒ 手动凑</text>

  <rect x="252" y="68" width="92" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="298" y="87" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">15 → FizzBuzz</text>

  <!-- arrow down -->
  <path d="M 156 100 Q 156 110 156 120" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- if-else chain -->
  <rect x="44" y="124" width="300" height="86" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="56" y="142" font-size="10.5" fill="#888" font-weight="bold">if-else 链：</text>
  <text x="56" y="158" font-size="10.5" fill="#333">if i%15==0  → "FizzBuzz"</text>
  <text x="56" y="173" font-size="10.5" fill="#333">elif i%3==0 → "Fizz"</text>
  <text x="56" y="188" font-size="10.5" fill="#333">elif i%5==0 → "Buzz"</text>
  <text x="56" y="203" font-size="10.5" fill="#333">else        → str(i)</text>

  <!-- scaling note -->
  <rect x="44" y="218" width="300" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="194" y="237" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">再加一条「7→Jazz」？得手写 7 个分支 ⚠</text>

  <!-- divider -->
  <line x1="370" y1="48" x2="370" y2="330" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Panel B: independent rules + concatenation ===== -->
  <text x="392" y="56" font-size="12.5" fill="#4a7a3a" font-weight="bold">独立判定 + 拼接：加规则零成本</text>

  <!-- rule table -->
  <rect x="392" y="68" width="140" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="462" y="87" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">规则表 {3:Fizz, 5:Buzz}</text>

  <path d="M 462 100 Q 462 110 462 120" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- for each i: s = "" -->
  <rect x="392" y="124" width="140" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="462" y="143" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">s = ""</text>

  <path d="M 462 156 Q 462 164 462 172" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- two independent checks -->
  <rect x="388" y="176" width="68" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="422" y="193" text-anchor="middle" font-size="10" fill="#555">i%3==0 ?</text>
  <text x="422" y="208" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">s+="Fizz"</text>

  <rect x="468" y="176" width="68" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="502" y="193" text-anchor="middle" font-size="10" fill="#555">i%5==0 ?</text>
  <text x="502" y="208" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">s+="Buzz"</text>

  <path d="M 422 222 Q 422 232 422 240" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 502 222 Q 502 232 502 240" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- combine -->
  <rect x="392" y="244" width="140" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="462" y="261" text-anchor="middle" font-size="10.5" fill="#555">s == "" ?</text>
  <text x="462" y="277" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是→str(i) / 否→s</text>

  <!-- scaling note -->
  <rect x="388" y="296" width="152" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="464" y="315" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">加「7→Jazz」？规则表加一行 ✓</text>

  <!-- bottom comparison -->
  <rect x="80" y="340" width="400" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">不必预先枚举所有组合，每条规则独立判定后拼接</text>
  <text x="280" y="376" text-anchor="middle" font-size="10.5" fill="#d6a040">i=15：命中 3 又命中 5 → "Fizz"+"Buzz" 自然得到 "FizzBuzz"</text>
</svg>
