<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 600" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="600" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：子树计数 + 下探/横移</text>

  <!-- Start -->
  <rect x="210" y="44" width="140" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="280" y="63" text-anchor="middle" font-size="12" fill="#333">开始：输入 n, k</text>
  <path d="M 280 72 L 280 88" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="170" y="90" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="112" text-anchor="middle" font-size="12" fill="#333">cur = 1,   k −= 1   (0-indexed)</text>
  <path d="M 280 124 L 280 138" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== while loop ===== -->
  <rect x="40" y="142" width="480" height="316" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="5,3" rx="10" filter="url(#rough2)"/>
  <text x="60" y="160" font-size="10" fill="#888">while k &gt; 0</text>

  <!-- Decision: k > 0 ? -->
  <path d="M 280 150 L 380 188 L 280 226 L 180 188 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="184" text-anchor="middle" font-size="11" fill="#333">k &gt; 0 ?</text>
  <text x="280" y="200" text-anchor="middle" font-size="10" fill="#888">(还要走 k 步)</text>

  <!-- 否 → return -->
  <path d="M 180 188 L 100 188 L 100 540 L 210 540" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="108" y="182" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <text x="106" y="350" font-size="10" fill="#b85450">走完</text>
  <text x="106" y="364" font-size="10" fill="#b85450">返回 cur</text>

  <!-- 是 → countNodes -->
  <path d="M 280 226 L 280 244" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="288" y="240" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="110" y="246" width="340" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="271" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">step = countNodes(cur, n)</text>
  <path d="M 280 286 L 280 302" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: step <= k ? -->
  <path d="M 280 304 L 400 342 L 280 380 L 160 342 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="338" text-anchor="middle" font-size="11" fill="#333">step ≤ k ?</text>
  <text x="280" y="354" text-anchor="middle" font-size="10" fill="#888">(整棵子树都跳过)</text>

  <!-- 是 → 横移 -->
  <path d="M 400 342 L 470 342 L 470 410" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="408" y="336" font-size="10" fill="#d6a040" font-weight="bold">是</text>

  <rect x="330" y="412" width="180" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="420" y="430" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">横移</text>
  <text x="420" y="446" text-anchor="middle" font-size="10" fill="#333">cur += 1;  k −= step</text>

  <!-- 否 → 下探 -->
  <path d="M 160 342 L 90 342 L 90 410" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="120" y="336" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <rect x="50" y="412" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="140" y="430" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">下探</text>
  <text x="140" y="446" text-anchor="middle" font-size="10" fill="#333">cur *= 10;  k −= 1</text>

  <!-- 两条回到 while 判定 -->
  <path d="M 140 452 L 140 470 L 280 470 L 280 158" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 420 452 L 420 478 L 286 478 L 286 158" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="490" font-size="9" fill="#888">回循环顶部</text>

  <!-- Return -->
  <rect x="210" y="524" width="170" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="295" y="546" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">return cur</text>

  <text x="280" y="582" text-anchor="middle" font-size="10" fill="#888">下探用 1 步进入第一个孩子；横移用 step 步跳过整棵子树</text>
</svg>
