<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">base62 编码 / 解码流程（id = 12345 ↔ "3d7"）</text>

  <text x="40" y="58" font-size="11.5" fill="#446688" font-weight="bold">编码：id → 短码（不断对 62 取余）</text>

  <rect x="40" y="70" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="100" y="90" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">id = 12345</text>

  <path d="M 160 85 L 200 85" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="200" y="70" width="320" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="360" y="90" text-anchor="middle" font-size="11" fill="#d6a040">ALPHABET = "0..9 a..z A..Z"（62 个字符）</text>

  <text x="40" y="124" font-size="10.5" fill="#888">循环：while id &gt; 0: { code = ALPHABET[id % 62] + code; id = id // 62 }</text>

  <rect x="40" y="138" width="500" height="92" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>

  <text x="60" y="158" font-size="11" fill="#444" font-weight="bold">轮次</text>
  <text x="150" y="158" font-size="11" fill="#444" font-weight="bold">id（进入时）</text>
  <text x="270" y="158" font-size="11" fill="#444" font-weight="bold">id % 62</text>
  <text x="360" y="158" font-size="11" fill="#444" font-weight="bold">字符</text>
  <text x="450" y="158" font-size="11" fill="#444" font-weight="bold">id // 62</text>

  <line x1="50" y1="166" x2="530" y2="166" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="60" y="184" font-size="11" fill="#555">1</text>
  <text x="150" y="184" font-size="11" fill="#555">12345</text>
  <text x="270" y="184" font-size="11" fill="#b85450" font-weight="bold">7</text>
  <text x="360" y="184" font-size="11" fill="#b85450" font-weight="bold">'7'</text>
  <text x="450" y="184" font-size="11" fill="#555">199</text>

  <text x="60" y="204" font-size="11" fill="#555">2</text>
  <text x="150" y="204" font-size="11" fill="#555">199</text>
  <text x="270" y="204" font-size="11" fill="#d6a040" font-weight="bold">13</text>
  <text x="360" y="204" font-size="11" fill="#d6a040" font-weight="bold">'d'</text>
  <text x="450" y="204" font-size="11" fill="#555">3</text>

  <text x="60" y="224" font-size="11" fill="#555">3</text>
  <text x="150" y="224" font-size="11" fill="#555">3</text>
  <text x="270" y="224" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="360" y="224" font-size="11" fill="#4a7a3a" font-weight="bold">'3'</text>
  <text x="450" y="224" font-size="11" fill="#888">0（停）</text>

  <path d="M 360 236 L 360 258" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="280" y="258" width="160" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="360" y="278" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">code = "3d7"</text>

  <text x="40" y="312" font-size="11.5" fill="#b85450" font-weight="bold">解码：短码 → id（Horner 累乘加）</text>

  <rect x="40" y="324" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="100" y="344" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">code = "3d7"</text>

  <path d="M 160 339 L 200 339" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="200" y="324" width="320" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="360" y="344" text-anchor="middle" font-size="11" fill="#d6a040">id = 0; for c in code: id = id*62 + idx(c)</text>

  <rect x="40" y="366" width="500" height="62" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>

  <text x="60" y="386" font-size="11" fill="#444" font-weight="bold">字符 c</text>
  <text x="180" y="386" font-size="11" fill="#444" font-weight="bold">idx(c)</text>
  <text x="300" y="386" font-size="11" fill="#444" font-weight="bold">id（更新前）</text>
  <text x="440" y="386" font-size="11" fill="#444" font-weight="bold">id（更新后）</text>
  <line x1="50" y1="394" x2="530" y2="394" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="60" y="412" font-size="11" fill="#4a7a3a" font-weight="bold">'3'</text>
  <text x="180" y="412" font-size="11" fill="#555">3</text>
  <text x="300" y="412" font-size="11" fill="#555">0</text>
  <text x="440" y="412" font-size="11" fill="#555">0*62+3 = 3</text>

  <text x="60" y="428" font-size="11" fill="#d6a040" font-weight="bold">'d'</text>
  <text x="180" y="428" font-size="11" fill="#555">13</text>
  <text x="300" y="428" font-size="11" fill="#555">3</text>
  <text x="440" y="428" font-size="11" fill="#555">3*62+13 = 199</text>

  <text x="60" y="444" font-size="11" fill="#b85450" font-weight="bold">'7'</text>
  <text x="180" y="444" font-size="11" fill="#555">7</text>
  <text x="300" y="444" font-size="11" fill="#555">199</text>
  <text x="440" y="444" font-size="11" fill="#b85450" font-weight="bold">199*62+7 = 12345 ✓</text>
</svg>
