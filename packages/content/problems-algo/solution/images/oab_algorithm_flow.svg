<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">Bigram 分词：算法流程</text>

  <!-- Step 1: split -->
  <rect x="200" y="48" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="70" text-anchor="middle" font-size="12" fill="#333">words = text.split(" ")</text>
  <line x1="280" y1="82" x2="280" y2="98" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: init -->
  <rect x="200" y="100" width="160" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="122" text-anchor="middle" font-size="12" fill="#333">ans = []，i = 0</text>
  <line x1="280" y1="134" x2="280" y2="150" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: loop condition diamond -->
  <polygon points="280,152 380,196 280,240 180,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="192" text-anchor="middle" font-size="11" fill="#333">i ≤ len(words)</text>
  <text x="280" y="206" text-anchor="middle" font-size="11" fill="#333">− 3 ?</text>
  <line x1="280" y1="240" x2="280" y2="258" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="252" font-size="10" fill="#4a7a3a">是</text>
  <line x1="380" y1="196" x2="430" y2="196" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="190" font-size="10" fill="#b85450">否</text>

  <!-- return box (right) -->
  <rect x="432" y="180" width="110" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="487" y="202" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return ans</text>

  <!-- Step 4: match check diamond -->
  <polygon points="280,260 380,300 280,340 180,300" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="294" text-anchor="middle" font-size="10" fill="#333">words[i]==first</text>
  <text x="280" y="308" text-anchor="middle" font-size="10" fill="#333">∧ words[i+1]==second?</text>
  <text x="296" y="324" font-size="10" fill="#4a7a3a">是</text>
  <text x="166" y="296" font-size="10" fill="#888">否</text>

  <!-- collect branch (down) -->
  <line x1="280" y1="340" x2="280" y2="350" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170" y="352" width="220" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="368" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">ans.append(words[i + 2])</text>

  <!-- skip arrow back up to loop (left side) -->
  <path d="M 180 300 L 80 300 L 80 122 L 200 122" fill="none" stroke="#666" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="60" y="210" font-size="10" fill="#888">i += 1，回到循环</text>

  <!-- collect -> back to loop -->
  <path d="M 170 363 L 60 363 L 60 122 L 200 122" fill="none" stroke="#666" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
