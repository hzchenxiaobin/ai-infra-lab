<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：按 turn 排序 → 累计求和 → 找门槛以内最后一行</text>

  <!-- Table header -->
  <rect x="30" y="44" width="500" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="62" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">turn</text>
  <text x="150" y="62" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">person_name</text>
  <text x="280" y="62" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">weight</text>
  <text x="380" y="62" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">累计体重</text>
  <text x="490" y="62" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">能否上车</text>

  <line x1="105" y1="44" x2="105" y2="70" stroke="#446688" stroke-width="0.7" filter="url(#rough2)"/>
  <line x1="210" y1="44" x2="210" y2="70" stroke="#446688" stroke-width="0.7" filter="url(#rough2)"/>
  <line x1="330" y1="44" x2="330" y2="70" stroke="#446688" stroke-width="0.7" filter="url(#rough2)"/>
  <line x1="445" y1="44" x2="445" y2="70" stroke="#446688" stroke-width="0.7" filter="url(#rough2)"/>

  <!-- Row: turn 1 Alice 250 → 250 -->
  <rect x="30" y="72" width="500" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="70" y="88" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="150" y="88" text-anchor="middle" font-size="10" fill="#333">Alice</text>
  <text x="280" y="88" text-anchor="middle" font-size="10" fill="#333">250</text>
  <text x="380" y="88" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">250</text>
  <text x="490" y="88" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>
  <line x1="105" y1="72" x2="105" y2="96" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="210" y1="72" x2="210" y2="96" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="330" y1="72" x2="330" y2="96" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="445" y1="72" x2="445" y2="96" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>

  <!-- Row: turn 2 Alex 350 → 600 -->
  <rect x="30" y="98" width="500" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="70" y="114" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="150" y="114" text-anchor="middle" font-size="10" fill="#333">Alex</text>
  <text x="280" y="114" text-anchor="middle" font-size="10" fill="#333">350</text>
  <text x="380" y="114" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">600</text>
  <text x="490" y="114" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>
  <line x1="105" y1="98" x2="105" y2="122" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="210" y1="98" x2="210" y2="122" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="330" y1="98" x2="330" y2="122" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="445" y1="98" x2="445" y2="122" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>

  <!-- Row: turn 3 John Cena 400 → 1000 (LAST! highlighted) -->
  <rect x="30" y="124" width="500" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="2" filter="url(#rough2)"/>
  <text x="70" y="140" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <text x="150" y="140" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">John Cena</text>
  <text x="280" y="140" text-anchor="middle" font-size="10" fill="#333">400</text>
  <text x="380" y="140" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1000</text>
  <text x="490" y="140" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✓ 最后</text>
  <line x1="105" y1="124" x2="105" y2="148" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="210" y1="124" x2="210" y2="148" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="330" y1="124" x2="330" y2="148" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="445" y1="124" x2="445" y2="148" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>

  <!-- 1000 threshold marker line between row 3 and 4 -->
  <path d="M 30 150 L 530 150" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <rect x="200" y="148" width="160" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="280" y="159" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">↑ 1000 kg 门槛线 ↑</text>

  <!-- Row: turn 4 Marie 200 → 1200 (exceeds) -->
  <rect x="30" y="168" width="500" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="70" y="184" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="150" y="184" text-anchor="middle" font-size="10" fill="#333">Marie</text>
  <text x="280" y="184" text-anchor="middle" font-size="10" fill="#333">200</text>
  <text x="380" y="184" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1200</text>
  <text x="490" y="184" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✗ 超重</text>
  <line x1="105" y1="168" x2="105" y2="192" stroke="#b85450" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="210" y1="168" x2="210" y2="192" stroke="#b85450" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="330" y1="168" x2="330" y2="192" stroke="#b85450" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="445" y1="168" x2="445" y2="192" stroke="#b85450" stroke-width="0.5" filter="url(#rough2)"/>

  <!-- Row: turn 5 Bob (can't board) -->
  <rect x="30" y="194" width="500" height="24" fill="#f5f5f5" stroke="#ccc" stroke-width="0.8" stroke-dasharray="3,2" rx="2" filter="url(#rough2)"/>
  <text x="70" y="210" text-anchor="middle" font-size="10" fill="#bbb">5</text>
  <text x="150" y="210" text-anchor="middle" font-size="10" fill="#bbb">Bob</text>
  <text x="280" y="210" text-anchor="middle" font-size="10" fill="#bbb">175</text>
  <text x="380" y="210" text-anchor="middle" font-size="10" fill="#bbb">—</text>
  <text x="490" y="210" text-anchor="middle" font-size="10" fill="#bbb">✗</text>

  <!-- Row: turn 6 Winston (can't board) -->
  <rect x="30" y="220" width="500" height="24" fill="#f5f5f5" stroke="#ccc" stroke-width="0.8" stroke-dasharray="3,2" rx="2" filter="url(#rough2)"/>
  <text x="70" y="236" text-anchor="middle" font-size="10" fill="#bbb">6</text>
  <text x="150" y="236" text-anchor="middle" font-size="10" fill="#bbb">Winston</text>
  <text x="280" y="236" text-anchor="middle" font-size="10" fill="#bbb">500</text>
  <text x="380" y="236" text-anchor="middle" font-size="10" fill="#bbb">—</text>
  <text x="490" y="236" text-anchor="middle" font-size="10" fill="#bbb">✗</text>

  <!-- Divider -->
  <path d="M 30 262 L 530 262" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Step-by-step reasoning -->
  <rect x="30" y="272" width="500" height="112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="292" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">逐步推演</text>

  <text x="50" y="312" font-size="9.5" fill="#333">• <tspan fill="#4a7a3a" font-weight="bold">turn=1</tspan> Alice：250 → 累计 250 ≤ 1000 ✓ 上车</text>
  <text x="50" y="330" font-size="9.5" fill="#333">• <tspan fill="#4a7a3a" font-weight="bold">turn=2</tspan> Alex：350 → 累计 250+350=600 ≤ 1000 ✓ 上车</text>
  <text x="50" y="348" font-size="9.5" fill="#333">• <tspan fill="#4a7a3a" font-weight="bold">turn=3</tspan> John Cena：400 → 累计 600+400=1000 ≤ 1000 ✓ <tspan fill="#b85450" font-weight="bold">最后一个上车！</tspan></text>
  <text x="50" y="366" font-size="9.5" fill="#333">• <tspan fill="#b85450" font-weight="bold">turn=4</tspan> Marie：200 → 累计 1000+200=1200 &gt; 1000 ✗ 超重，无法上车</text>
  <text x="50" y="384" font-size="9.5" fill="#888">• turn=5/6：前序已超重，累计只增不减，均无法上车 → 最终答案 <tspan fill="#4a7a3a" font-weight="bold">John Cena</tspan></text>
</svg>
