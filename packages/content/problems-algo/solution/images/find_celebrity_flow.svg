<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrb" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程图：两遍扫描</text>

  <!-- ===== Pass 1 ===== -->
  <rect x="20" y="38" width="520" height="200" fill="#e8f0fe" fill-opacity="0.35" stroke="#446688" stroke-width="1.2" stroke-dasharray="6,3" rx="10" filter="url(#rough2)"/>
  <text x="40" y="58" font-size="12" fill="#446688" font-weight="bold">第一遍：排除法找候选</text>

  <!-- candidate = 0 (oval) -->
  <rect x="200" y="66" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="15" filter="url(#rough2)"/>
  <text x="280" y="86" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">candidate ← 0</text>

  <!-- arrow down -->
  <path d="M 280 98 L 280 110" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- for i = 1 to n-1 (box) -->
  <rect x="200" y="112" width="160" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="280" y="132" text-anchor="middle" font-size="11" fill="#333">for i = 1 to n − 1</text>

  <!-- arrow down -->
  <path d="M 280 144 L 280 156" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: knows(candidate, i)? -->
  <polygon points="280,156 380,186 280,216 180,186" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="183" text-anchor="middle" font-size="10" fill="#333">knows(candidate,</text>
  <text x="280" y="196" text-anchor="middle" font-size="10" fill="#333">i) ?</text>

  <!-- Yes branch → right -->
  <path d="M 380 186 L 430 186" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="392" y="180" font-size="10" fill="#b85450" font-weight="bold">Yes</text>
  <rect x="430" y="172" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="480" y="191" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">candidate ← i</text>

  <!-- loop back from candidate=i box -->
  <path d="M 480 172 Q 480 128 360 127" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- No branch → down -->
  <path d="M 280 216 L 280 228" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="288" y="226" font-size="10" fill="#446688" font-weight="bold">No</text>

  <!-- continue loop (box) -->
  <rect x="200" y="228" width="160" height="0" fill="none" stroke="none"/>
  <text x="280" y="238" text-anchor="middle" font-size="10" fill="#888">↑ 继续下一轮 i</text>

  <!-- ===== arrow to Pass 2 ===== -->
  <path d="M 280 250 L 280 262" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Pass 2 ===== -->
  <rect x="20" y="264" width="520" height="220" fill="#e6f4ea" fill-opacity="0.35" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="6,3" rx="10" filter="url(#rough2)"/>
  <text x="40" y="284" font-size="12" fill="#4a7a3a" font-weight="bold">第二遍：验证候选</text>

  <!-- for i = 0 to n-1, i ≠ candidate -->
  <rect x="170" y="292" width="220" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="11" fill="#333">for i = 0..n−1, i ≠ candidate</text>

  <!-- arrow down -->
  <path d="M 280 324 L 280 336" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: knows(candidate, i)? -->
  <polygon points="280,336 380,360 280,384 180,360" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="357" text-anchor="middle" font-size="9" fill="#333">knows(candidate, i) ?</text>
  <text x="280" y="369" text-anchor="middle" font-size="9" fill="#333">(应为 false)</text>

  <!-- Yes → return -1 -->
  <path d="M 380 360 L 430 360" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="392" y="354" font-size="10" fill="#b85450" font-weight="bold">Yes</text>
  <rect x="430" y="346" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="480" y="365" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return −1</text>

  <!-- No → down -->
  <path d="M 280 384 L 280 396" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="288" y="394" font-size="10" fill="#446688" font-weight="bold">No</text>

  <!-- Diamond: knows(i, candidate)? -->
  <polygon points="280,396 380,420 280,444 180,420" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="417" text-anchor="middle" font-size="9" fill="#333">knows(i, candidate) ?</text>
  <text x="280" y="429" text-anchor="middle" font-size="9" fill="#333">(应为 true)</text>

  <!-- No → return -1 -->
  <path d="M 380 420 L 430 420" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="392" y="414" font-size="10" fill="#b85450" font-weight="bold">No</text>
  <rect x="430" y="406" width="100" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="480" y="425" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return −1</text>

  <!-- Yes → down (all checks passed) -->
  <path d="M 280 444 L 280 456" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="288" y="454" font-size="10" fill="#4a7a3a" font-weight="bold">Yes</text>

  <!-- return candidate (green oval) -->
  <rect x="200" y="458" width="160" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="15" filter="url(#rough2)"/>
  <text x="280" y="478" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return candidate ✓</text>
</svg>
