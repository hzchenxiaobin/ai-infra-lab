<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：3×6 矩阵，输出 4</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">蓝=边界格(入堆)｜白=内陆格｜浅蓝=注水(水位 3 − 高度)｜红框=注水格</text>

  <!-- 3x6 grid: cell=54, x0=80, y0=70 -->
  <g filter="url(#rough2)" font-size="15" font-weight="bold">
    <!-- row0: all border -->
    <rect x="80" y="70" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="107" y="103" text-anchor="middle" fill="#446688">1</text>
    <rect x="134" y="70" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="161" y="103" text-anchor="middle" fill="#446688">4</text>
    <rect x="188" y="70" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="215" y="103" text-anchor="middle" fill="#446688">3</text>
    <rect x="242" y="70" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="269" y="103" text-anchor="middle" fill="#446688">1</text>
    <rect x="296" y="70" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="323" y="103" text-anchor="middle" fill="#446688">3</text>
    <rect x="350" y="70" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="377" y="103" text-anchor="middle" fill="#446688">2</text>
    <!-- row1: border, 2, 1, 3, 2, border -->
    <rect x="80" y="124" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="107" y="157" text-anchor="middle" fill="#446688">3</text>
    <rect x="134" y="124" width="54" height="54" fill="#ffffff" stroke="#b85450" stroke-width="2" rx="3"/><text x="161" y="157" text-anchor="middle" fill="#555">2</text>
    <rect x="188" y="124" width="54" height="54" fill="#ffffff" stroke="#b85450" stroke-width="2" rx="3"/><text x="215" y="157" text-anchor="middle" fill="#555">1</text>
    <rect x="242" y="124" width="54" height="54" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/><text x="269" y="157" text-anchor="middle" fill="#555">3</text>
    <rect x="296" y="124" width="54" height="54" fill="#ffffff" stroke="#b85450" stroke-width="2" rx="3"/><text x="323" y="157" text-anchor="middle" fill="#555">2</text>
    <rect x="350" y="124" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="377" y="157" text-anchor="middle" fill="#446688">4</text>
    <!-- row2: all border -->
    <rect x="80" y="178" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="107" y="211" text-anchor="middle" fill="#446688">2</text>
    <rect x="134" y="178" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="161" y="211" text-anchor="middle" fill="#446688">3</text>
    <rect x="188" y="178" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="215" y="211" text-anchor="middle" fill="#446688">3</text>
    <rect x="242" y="178" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="269" y="211" text-anchor="middle" fill="#446688">2</text>
    <rect x="296" y="178" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="323" y="211" text-anchor="middle" fill="#446688">3</text>
    <rect x="350" y="178" width="54" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/><text x="377" y="211" text-anchor="middle" fill="#446688">1</text>
  </g>

  <!-- water overlay on interior: level=3, cellH=54 -->
  <!-- (1,1)=2 -> water 1 -> 18px at bottom -->
  <g filter="url(#rough2)" opacity="0.6">
    <rect x="134" y="160" width="54" height="18" fill="#b8d4f0" stroke="none" rx="2"/>
    <!-- (1,2)=1 -> water 2 -> 36px -->
    <rect x="188" y="142" width="54" height="36" fill="#b8d4f0" stroke="none" rx="2"/>
    <!-- (1,3)=3 -> water 0 -> none -->
    <!-- (1,4)=2 -> water 1 -> 18px -->
    <rect x="296" y="160" width="54" height="18" fill="#b8d4f0" stroke="none" rx="2"/>
  </g>

  <!-- water amount annotations -->
  <g filter="url(#rough2)" font-size="11" fill="#b85450" font-weight="bold">
    <text x="161" y="120" text-anchor="middle">+1</text>
    <text x="215" y="120" text-anchor="middle">+2</text>
    <text x="269" y="120" text-anchor="middle" fill="#888">+0</text>
    <text x="323" y="120" text-anchor="middle">+1</text>
  </g>

  <!-- water level indicator line across interior row -->
  <g filter="url(#rough2)">
    <line x1="134" y1="142" x2="350" y2="142" stroke="#446688" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="404" y="146" font-size="10" fill="#446688" font-weight="bold">水位 3</text>
  </g>

  <!-- trace table -->
  <text x="280" y="262" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">关键注水时刻（弹出 h=3 的边界格 → 暴露内陆低洼）</text>

  <g filter="url(#rough2)" font-size="10">
    <!-- header -->
    <rect x="40" y="274" width="480" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="80" y="290" text-anchor="middle" fill="#446688" font-weight="bold">弹出格 (h=3)</text>
    <text x="180" y="290" text-anchor="middle" fill="#446688" font-weight="bold">暴露邻居</text>
    <text x="270" y="290" text-anchor="middle" fill="#446688" font-weight="bold">邻居高度</text>
    <text x="360" y="290" text-anchor="middle" fill="#446688" font-weight="bold">注水 3−nh</text>
    <text x="460" y="290" text-anchor="middle" fill="#446688" font-weight="bold">累计 ans</text>

    <!-- row1 -->
    <rect x="40" y="298" width="480" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="80" y="314" text-anchor="middle" fill="#555">(0,2)</text>
    <text x="180" y="314" text-anchor="middle" fill="#b85450" font-weight="bold">(1,2)</text>
    <text x="270" y="314" text-anchor="middle" fill="#555">1</text>
    <text x="360" y="314" text-anchor="middle" fill="#b85450" font-weight="bold">+2</text>
    <text x="460" y="314" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>

    <!-- row2 -->
    <rect x="40" y="322" width="480" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="80" y="338" text-anchor="middle" fill="#555">(2,1)</text>
    <text x="180" y="338" text-anchor="middle" fill="#b85450" font-weight="bold">(1,1)</text>
    <text x="270" y="338" text-anchor="middle" fill="#555">2</text>
    <text x="360" y="338" text-anchor="middle" fill="#b85450" font-weight="bold">+1</text>
    <text x="460" y="338" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>

    <!-- row3 -->
    <rect x="40" y="346" width="480" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="80" y="362" text-anchor="middle" fill="#555">(0,3) h=1</text>
    <text x="180" y="362" text-anchor="middle" fill="#888">(1,3)</text>
    <text x="270" y="362" text-anchor="middle" fill="#555">3</text>
    <text x="360" y="362" text-anchor="middle" fill="#888">+0（墙）</text>
    <text x="460" y="362" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>

    <!-- row4 -->
    <rect x="40" y="370" width="480" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <text x="80" y="386" text-anchor="middle" fill="#555">(2,4)</text>
    <text x="180" y="386" text-anchor="middle" fill="#b85450" font-weight="bold">(1,4)</text>
    <text x="270" y="386" text-anchor="middle" fill="#555">2</text>
    <text x="360" y="386" text-anchor="middle" fill="#b85450" font-weight="bold">+1</text>
    <text x="460" y="386" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>
  </g>

  <!-- note -->
  <g filter="url(#rough2)">
    <rect x="40" y="406" width="480" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6"/>
    <text x="60" y="424" font-size="10" fill="#4a7a3a">注：先弹完 h=1 的角格（无内陆邻居），水位降到 3 后开始暴露内陆；</text>
    <text x="60" y="438" font-size="10" fill="#4a7a3a">(1,3) 高度 3 ≥ 暴露它的 h=1，不注水，自身以高度 3 入堆成为新墙。最终 ans = 4 ✓</text>
  </g>
</svg>
