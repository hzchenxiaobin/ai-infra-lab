<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：续杯看 i−1，切换必须隔一个休整小时看 i−2</text>

  <!-- 小时表头 -->
  <rect x="120" y="40" width="80" height="20" fill="#ffffff" stroke="#888888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="54" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">小时 i−2</text>
  <rect x="260" y="40" width="80" height="20" fill="#ffffff" stroke="#888888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="300" y="54" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">小时 i−1</text>
  <rect x="400" y="40" width="80" height="20" fill="#ffffff" stroke="#888888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="440" y="54" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">小时 i</text>

  <!-- A 行 -->
  <text x="112" y="96" text-anchor="end" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">A 行（dpA）</text>
  <rect x="260" y="72" width="80" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="96" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">dpA[i−1]</text>
  <rect x="400" y="72" width="80" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="440" y="96" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">dpA[i]</text>

  <!-- ① 续杯箭头 -->
  <path d="M 342 92 L 392 92" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="368" y="84" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">① 续杯</text>

  <!-- 中间休整道 -->
  <rect x="268" y="130" width="64" height="26" fill="#eeeeee" stroke="#888888" stroke-width="1.2" stroke-dasharray="4 3" rx="13" filter="url(#rough2)"/>
  <text x="300" y="147" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">休整 +0</text>

  <!-- B 行 -->
  <text x="112" y="204" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">B 行（dpB）</text>
  <rect x="120" y="180" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="204" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">dpB[i−2]</text>
  <rect x="260" y="180" width="80" height="40" fill="#ffffff" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 4" rx="4" filter="url(#rough2)"/>
  <text x="300" y="204" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">dpB[i−1]</text>

  <!-- ② 切换箭头（经休整） -->
  <path d="M 160 176 C 160 156, 214 150, 272 157" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrO)" fill="none" filter="url(#rough2)"/>
  <path d="M 324 128 C 352 120, 402 112, 426 115" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrO)" fill="none" filter="url(#rough2)"/>
  <text x="192" y="146" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">② 切换</text>

  <!-- ③ 非法相邻切换 -->
  <path d="M 315 178 L 460 126" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="388" y="152" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="300" y="236" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">③ 这小时还在喝 B，休整无处安放</text>

  <!-- 转移公式 -->
  <rect x="40" y="248" width="440" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="271" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">dpA[i] = max( dpA[i−1], dpB[i−2] ) + A[i]</text>
  <rect x="40" y="292" width="440" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="315" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">dpB[i] = max( dpB[i−1], dpA[i−2] ) + B[i]</text>

  <!-- 答案 -->
  <rect x="40" y="336" width="440" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="358" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = max( dpA[n−1], dpB[n−1] )</text>
</svg>
