<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrS" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#6a9acc"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">栈模拟：n=4，表达式 4 * 3 / 2 + 1</text>

  <!-- 列标题 -->
  <text x="60" y="56" font-size="12" fill="#888">步骤</text>
  <text x="150" y="56" font-size="12" fill="#888">读入 token</text>
  <text x="280" y="56" font-size="12" fill="#888">动作</text>
  <text x="470" y="56" font-size="12" fill="#888">栈(底→顶)</text>

  <line x1="40" y1="64" x2="540" y2="64" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- step 0 -->
  <text x="62" y="92" font-size="12" fill="#555">0</text>
  <text x="150" y="92" font-size="12" fill="#333" font-weight="bold">4</text>
  <text x="280" y="92" font-size="11.5" fill="#555">push 4</text>
  <rect x="455" y="80" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="472" y="96" text-anchor="middle" font-size="11" fill="#333">4</text>

  <!-- step 1 -->
  <text x="62" y="132" font-size="12" fill="#555">1</text>
  <text x="150" y="132" font-size="12" fill="#333" font-weight="bold">*</text>
  <text x="280" y="132" font-size="11.5" fill="#555">记录 op=*</text>
  <rect x="455" y="120" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="472" y="136" text-anchor="middle" font-size="11" fill="#333">4</text>

  <!-- step 2 -->
  <text x="62" y="172" font-size="12" fill="#555">2</text>
  <text x="150" y="172" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="280" y="172" font-size="11.5" fill="#555">op=* → pop 4, 4*3=12, push 12</text>
  <rect x="455" y="160" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="472" y="176" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">12</text>

  <!-- step 3 -->
  <text x="62" y="212" font-size="12" fill="#555">3</text>
  <text x="150" y="212" font-size="12" fill="#333" font-weight="bold">/</text>
  <text x="280" y="212" font-size="11.5" fill="#555">记录 op=/</text>
  <rect x="455" y="200" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="472" y="216" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">12</text>

  <!-- step 4 -->
  <text x="62" y="252" font-size="12" fill="#555">4</text>
  <text x="150" y="252" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="280" y="252" font-size="11.5" fill="#555">op=/ → pop 12, 12/2=6, push 6</text>
  <rect x="455" y="240" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="472" y="256" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">6</text>

  <!-- step 5 -->
  <text x="62" y="292" font-size="12" fill="#555">5</text>
  <text x="150" y="292" font-size="12" fill="#333" font-weight="bold">+</text>
  <text x="280" y="292" font-size="11.5" fill="#555">op=+ → 直接 push +2 ? 下一数带 +</text>
  <rect x="455" y="280" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="472" y="296" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">6</text>

  <!-- step 6 -->
  <text x="62" y="332" font-size="12" fill="#555">6</text>
  <text x="150" y="332" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="280" y="332" font-size="11.5" fill="#555">op=+ → push +1</text>
  <rect x="455" y="312" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="472" y="328" text-anchor="middle" font-size="11" fill="#333">6</text>
  <rect x="455" y="338" width="34" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="472" y="354" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">+1</text>

  <!-- 求和 -->
  <line x1="40" y1="372" x2="540" y2="372" stroke="#ccc" stroke-width="1" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="62" y="396" font-size="12.5" fill="#b85450" font-weight="bold">求和</text>
  <text x="280" y="396" font-size="12.5" fill="#555">sum(stack) = 6 + 1 =</text>
  <rect x="445" y="384" width="54" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="472" y="401" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">7</text>
</svg>
