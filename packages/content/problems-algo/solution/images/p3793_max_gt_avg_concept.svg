<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333"
        filter="url(#rough2)">核心观察：MAX(tokens) &gt; AVG(tokens) ⟺ 至少一条超均值</text>

  <!-- ===== 左面板：用户 3 ===== -->
  <g filter="url(#rough2)">
    <text x="154" y="46" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">用户 3（4 条提示词）</text>
  </g>

  <g filter="url(#rough2)">
    <!-- 基线 -->
    <path d="M 46 235 L 262 235" stroke="#446688" stroke-width="1.6"/>
    <!-- 柱：300 / 250 超均值（红），220 / 180 低于均值（蓝） -->
    <rect x="58" y="85" width="40" height="150" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3"/>
    <rect x="106" y="110" width="40" height="125" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3"/>
    <rect x="154" y="125" width="40" height="110" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <rect x="202" y="145" width="40" height="90" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <!-- 柱内数值 -->
    <text x="78" y="105" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">300</text>
    <text x="126" y="130" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">250</text>
    <text x="174" y="145" text-anchor="middle" font-size="11" fill="#446688">220</text>
    <text x="222" y="165" text-anchor="middle" font-size="11" fill="#446688">180</text>
    <!-- 均值虚线：237.5 × 0.5 = 118.75 → y = 116 -->
    <path d="M 46 116 L 262 116" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6 4"/>
    <text x="246" y="110" text-anchor="end" font-size="10.5" fill="#d6a040" font-weight="bold">avg = 237.5</text>
  </g>

  <g filter="url(#rough2)" text-anchor="middle" font-size="10.5">
    <text x="154" y="252" fill="#4a7a3a">MAX = 300 &gt; 237.5 ✓</text>
    <text x="154" y="266" fill="#4a7a3a">count = 4 ≥ 3 ✓</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="64" y="274" width="180" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="154" y="290" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">✅ 入选：avg_tokens = 237.5</text>
  </g>

  <!-- ===== 右面板：用户 2 ===== -->
  <g filter="url(#rough2)">
    <text x="390" y="46" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">用户 2（2 条提示词）</text>
  </g>

  <g filter="url(#rough2)">
    <!-- 基线 -->
    <path d="M 318 235 L 448 235" stroke="#446688" stroke-width="1.6"/>
    <!-- 柱：60 低于均值（蓝），70 超均值（红） -->
    <rect x="330" y="145" width="40" height="90" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <rect x="390" y="130" width="40" height="105" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3"/>
    <!-- 柱内数值 -->
    <text x="350" y="163" text-anchor="middle" font-size="11" fill="#446688">60</text>
    <text x="410" y="148" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">70</text>
    <!-- 均值虚线：65 × 1.5 = 97.5 → y = 138 -->
    <path d="M 318 138 L 448 138" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6 4"/>
    <text x="322" y="132" text-anchor="start" font-size="10.5" fill="#d6a040" font-weight="bold">avg = 65</text>
  </g>

  <g filter="url(#rough2)" text-anchor="middle" font-size="10.5">
    <text x="390" y="252" fill="#4a7a3a">MAX = 70 &gt; 65 ✓</text>
    <text x="390" y="266" fill="#b85450">count = 2 &lt; 3 ✗</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="300" y="274" width="180" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
    <text x="390" y="290" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">❌ 出局：条数不足</text>
  </g>

  <!-- ===== 底部洞察 ===== -->
  <g filter="url(#rough2)">
    <rect x="36" y="308" width="448" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="260" y="325" text-anchor="middle" font-size="10.5" fill="#333">💡 「至少一条 tokens 超均值」⟺ 组内 MAX(tokens) &gt; AVG(tokens)</text>
    <text x="260" y="342" text-anchor="middle" font-size="10.5" fill="#333">⚠️ 用户 2：MAX &gt; avg 通过却出局 —— 两个组级条件彼此独立、缺一不可</text>
  </g>
</svg>
