<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：区间 DP 按长度递增填表 + 与 k 比较</text>

  <!-- Step 1: init -->
  <rect x="150" y="44" width="260" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 初始化 dp 表全 0</text>
  <text x="280" y="82" text-anchor="middle" font-size="10" fill="#888">对角线 dp[i][i]=0（单字符回文），空串边界亦 0</text>
  <path d="M 280 94 L 280 110" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: outer loop len -->
  <rect x="120" y="112" width="320" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="132" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 外层：len = 2 → n（子串长度递增）</text>
  <text x="280" y="150" text-anchor="middle" font-size="10" fill="#888">保证依赖的更短区间已填好</text>
  <path d="M 280 162 L 280 178" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: inner loop i -->
  <rect x="120" y="180" width="320" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="200" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 内层：i = 0 → n−len，令 j = i+len−1</text>
  <text x="280" y="218" text-anchor="middle" font-size="10" fill="#888">枚举所有长度为 len 的子串 [i, j]</text>
  <path d="M 280 230 L 280 246" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond: s[i] == s[j] ? -->
  <polygon points="280,250 380,296 280,342 180,296" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="292" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">s[i] == s[j] ?</text>
  <text x="280" y="308" text-anchor="middle" font-size="10" fill="#888">比较两端字符</text>

  <!-- Yes branch -->
  <path d="M 180 296 L 90 296 L 90 360" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="288" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="20" y="362" width="140" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="90" y="382" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">两端配对</text>
  <text x="90" y="398" text-anchor="middle" font-size="10" fill="#4a7a3a">dp[i][j] =</text>
  <text x="90" y="412" text-anchor="middle" font-size="10" fill="#4a7a3a">dp[i+1][j−1]</text>

  <!-- No branch -->
  <path d="M 380 296 L 470 296 L 470 360" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="288" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="400" y="362" width="140" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="470" y="382" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">删一个端点</text>
  <text x="470" y="398" text-anchor="middle" font-size="10" fill="#b85450">dp[i][j] = min(</text>
  <text x="470" y="412" text-anchor="middle" font-size="10" fill="#b85450">dp[i+1][j], dp[i][j−1]) + 1</text>

  <!-- merge arrows down -->
  <path d="M 90 418 L 90 436 L 280 436" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 470 418 L 470 436 L 280 436" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 280 436 L 280 448" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop back note -->
  <text x="280" y="466" text-anchor="middle" font-size="10" fill="#888">内层结束后回到 ② 继续下一 len；全部填完后进入 ④</text>

  <!-- Step 4: compare with k -->
  <rect x="110" y="478" width="340" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="497" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">④ 返回 dp[0][n−1] ≤ k</text>
  <text x="280" y="514" text-anchor="middle" font-size="10" fill="#b85450">最少删除次数 ≤ 预算 k → true，否则 false</text>
</svg>
