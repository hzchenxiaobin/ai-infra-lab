<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：JOIN 贴年龄标签 → 桶内条件求和 → 分子 / 分母</text>

  <!-- 左：Activities 表 -->
  <rect x="24" y="42" width="172" height="182" fill="#ffffff" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="24" y="38" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">Activities（按类型着色）</text>
  <path d="M 24 66 L 196 66" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="58" y="60" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">user_id</text>
  <text x="118" y="60" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">type</text>
  <text x="170" y="60" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">time</text>

  <circle cx="34" cy="79" r="4" fill="#d6a040" filter="url(#rough2)"/>
  <text x="58" y="83" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">123</text>
  <text x="118" y="83" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">open</text>
  <text x="170" y="83" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4.50</text>

  <circle cx="34" cy="98" r="4" fill="#446688" filter="url(#rough2)"/>
  <text x="58" y="102" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">123</text>
  <text x="118" y="102" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">send</text>
  <text x="170" y="102" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3.50</text>

  <circle cx="34" cy="117" r="4" fill="#446688" filter="url(#rough2)"/>
  <text x="58" y="121" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">456</text>
  <text x="118" y="121" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">send</text>
  <text x="170" y="121" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">5.67</text>

  <circle cx="34" cy="136" r="4" fill="#d6a040" filter="url(#rough2)"/>
  <text x="58" y="140" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">456</text>
  <text x="118" y="140" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">open</text>
  <text x="170" y="140" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3.00</text>

  <circle cx="34" cy="155" r="4" fill="#446688" filter="url(#rough2)"/>
  <text x="58" y="159" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">456</text>
  <text x="118" y="159" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">send</text>
  <text x="170" y="159" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">8.24</text>

  <circle cx="34" cy="174" r="4" fill="#446688" filter="url(#rough2)"/>
  <text x="58" y="178" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">789</text>
  <text x="118" y="178" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">send</text>
  <text x="170" y="178" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">6.24</text>

  <circle cx="34" cy="193" r="4" fill="#d6a040" filter="url(#rough2)"/>
  <text x="58" y="197" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">123</text>
  <text x="118" y="197" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">open</text>
  <text x="170" y="197" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1.25</text>

  <circle cx="34" cy="212" r="4" fill="#d6a040" filter="url(#rough2)"/>
  <text x="58" y="216" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">789</text>
  <text x="118" y="216" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">open</text>
  <text x="170" y="216" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">5.25</text>

  <!-- 中：JOIN 箭头 -->
  <path d="M 202 120 L 240 120" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="222" y="108" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">JOIN Age</text>
  <text x="222" y="140" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">USING(user_id)</text>
  <text x="222" y="154" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">行级贴桶标签</text>

  <!-- 右：三个桶 -->
  <rect x="286" y="42" width="210" height="84" fill="#ffffff" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="391" y="60" text-anchor="middle" font-size="11.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">桶 31-35 ← user 123</text>
  <rect x="296" y="68" width="190" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="304" y="80" font-size="9.5" fill="#446688" filter="url(#rough2)">send：3.50</text>
  <rect x="296" y="88" width="190" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="304" y="100" font-size="9.5" fill="#7a5a10" filter="url(#rough2)">open：4.50 ｜ 1.25</text>
  <text x="382" y="120" text-anchor="middle" font-size="10" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">Σ = 9.25</text>

  <rect x="286" y="136" width="210" height="84" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="391" y="154" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">桶 26-30 ← user 456</text>
  <rect x="296" y="162" width="190" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="304" y="174" font-size="9.5" fill="#446688" filter="url(#rough2)">send：5.67 ｜ 8.24</text>
  <rect x="296" y="182" width="190" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="304" y="194" font-size="9.5" fill="#7a5a10" filter="url(#rough2)">open：3.00</text>
  <text x="382" y="214" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">Σ = 16.91</text>

  <rect x="286" y="230" width="210" height="84" fill="#ffffff" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="391" y="248" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">桶 21-25 ← user 789</text>
  <rect x="296" y="256" width="190" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="304" y="268" font-size="9.5" fill="#446688" filter="url(#rough2)">send：6.24</text>
  <rect x="296" y="276" width="190" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="304" y="288" font-size="9.5" fill="#7a5a10" filter="url(#rough2)">open：5.25</text>
  <text x="382" y="308" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">Σ = 11.49</text>

  <!-- 左下：公式卡 -->
  <rect x="24" y="250" width="246" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="147" y="268" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">send_perc = 100 × Σsend 时间 / Σ全部时间</text>
  <text x="147" y="288" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">open_perc = 100 × Σopen 时间 / Σ全部时间</text>

  <!-- 左下：注记卡 -->
  <rect x="24" y="310" width="246" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="147" y="327" text-anchor="middle" font-size="9.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">💡 Σ全部时间 = SUM(time_spent)</text>
  <text x="147" y="343" text-anchor="middle" font-size="9.5" fill="#7a5a10" filter="url(#rough2)">每行非 send 即 open，无需再拆两半相加</text>
</svg>
