<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">示例演算：grid = [[0,1],[0,1],[0,0]]（m=3，n=2）</text>

  <!-- 左侧矩阵 -->
  <text x="70" y="58" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j=0</text>
  <text x="114" y="58" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j=1</text>
  <text x="38" y="92" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=0</text>
  <text x="38" y="136" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=1</text>
  <text x="38" y="180" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=2</text>

  <rect x="48" y="64" width="44" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="91" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="92" y="64" width="44" height="44" fill="#e8f0fe" stroke="#d6a040" stroke-width="3" rx="4" filter="url(#rough2)"/>
  <text x="114" y="91" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>

  <rect x="48" y="108" width="44" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="135" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="92" y="108" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="114" y="135" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>

  <rect x="48" y="152" width="44" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="179" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="92" y="152" width="44" height="44" fill="#ffffff" stroke="#d6a040" stroke-width="3" rx="4" filter="url(#rough2)"/>
  <text x="114" y="179" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>

  <text x="30" y="218" text-anchor="start" font-size="10.5" fill="#a06a10" filter="url(#rough2)">列 1 对称对：(0,1)=1 ≠ (2,1)=0</text>
  <text x="30" y="233" text-anchor="start" font-size="10.5" fill="#a06a10" filter="url(#rough2)">→ 翻 (2,1) 即可修复，代价 1</text>

  <!-- 行视角表 -->
  <rect x="190" y="56" width="300" height="120" fill="none" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="190" y="56" width="300" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="215" y="75" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">行 i</text>
  <text x="300" y="75" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">对称对（首 vs 尾）</text>
  <text x="370" y="75" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">判定</text>
  <text x="445" y="75" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">次数</text>

  <g stroke="#bbb" stroke-width="1" filter="url(#rough2)">
    <line x1="255" y1="56" x2="255" y2="176"/>
    <line x1="335" y1="56" x2="335" y2="176"/>
    <line x1="400" y1="56" x2="400" y2="176"/>
    <line x1="480" y1="56" x2="480" y2="176"/>
    <line x1="190" y1="86" x2="490" y2="86"/>
    <line x1="190" y1="116" x2="490" y2="116"/>
    <line x1="190" y1="146" x2="490" y2="146"/>
  </g>

  <text x="215" y="105" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="300" y="105" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0 vs 1</text>
  <text x="370" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">≠</text>
  <text x="445" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">1</text>

  <text x="215" y="135" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="300" y="135" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0 vs 1</text>
  <text x="370" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">≠</text>
  <text x="445" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">1</text>

  <text x="215" y="165" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="300" y="165" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0 vs 0</text>
  <text x="370" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">=</text>
  <text x="445" y="165" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">0</text>

  <rect x="250" y="184" width="180" height="26" rx="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="201" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d27" filter="url(#rough2)">rowDiff = 1+1+0 = 2</text>

  <!-- 列视角表 -->
  <rect x="190" y="226" width="300" height="90" fill="none" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="190" y="226" width="300" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="215" y="245" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">列 j</text>
  <text x="300" y="245" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">对称对（首行 vs 末行）</text>
  <text x="370" y="245" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">判定</text>
  <text x="445" y="245" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">次数</text>

  <g stroke="#bbb" stroke-width="1" filter="url(#rough2)">
    <line x1="255" y1="226" x2="255" y2="316"/>
    <line x1="335" y1="226" x2="335" y2="316"/>
    <line x1="400" y1="226" x2="400" y2="316"/>
    <line x1="480" y1="226" x2="480" y2="316"/>
    <line x1="190" y1="256" x2="490" y2="256"/>
    <line x1="190" y1="286" x2="490" y2="286"/>
  </g>

  <text x="215" y="275" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="300" y="275" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0 vs 0</text>
  <text x="370" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">=</text>
  <text x="445" y="275" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">0</text>

  <text x="215" y="305" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="300" y="305" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">1 vs 0</text>
  <text x="370" y="305" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">≠</text>
  <text x="445" y="305" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">1</text>

  <rect x="250" y="324" width="180" height="26" rx="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="341" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d27" filter="url(#rough2)">colDiff = 0+1 = 1</text>

  <!-- 结论 -->
  <rect x="60" y="362" width="400" height="44" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="381" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">ans = min(2, 1) = 1 —— 选列方向</text>
  <text x="260" y="398" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">翻 (2,1)：列 0=[0,0,0]，列 1=[1,1,1]，所有列回文 ✓</text>
</svg>
