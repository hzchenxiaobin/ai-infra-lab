<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="430" fill="#fafafa"/>

  <text x="290" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一遍线性扫描，O(n) 时间 / O(1) 空间</text>

  <!-- 左侧流程 -->
  <rect x="70" y="56" width="220" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="180" y="76" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">开始：输入 nums、target</text>

  <path d="M 180 88 L 180 102" fill="none" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="106" width="220" height="40" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="122" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">归一化：d[i] = nums[i] − target[i]</text>
  <text x="180" y="138" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（不用真建数组，边扫边算）</text>

  <path d="M 180 146 L 180 162" fill="none" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="166" width="220" height="32" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="186" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">prev = 0，ans = 0</text>

  <path d="M 180 198 L 180 214" fill="none" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="218" width="220" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="238" text-anchor="middle" font-size="11.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">循环 i = 0 … n−1：</text>
  <text x="180" y="256" text-anchor="middle" font-size="11.5" fill="#8a6d1a" filter="url(#rough2)">ans += |d[i] − prev|</text>
  <text x="180" y="274" text-anchor="middle" font-size="11.5" fill="#8a6d1a" filter="url(#rough2)">prev = d[i]</text>

  <path d="M 180 282 L 180 298" fill="none" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="302" width="220" height="40" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="318" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">扫描结束：ans += |prev|</text>
  <text x="180" y="334" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（补上右端哨兵项 |d[n−1]|）</text>

  <path d="M 180 342 L 180 358" fill="none" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="362" width="220" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="180" y="385" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans / 2</text>

  <!-- 右侧跟跑 -->
  <rect x="330" y="52" width="228" height="346" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="444" y="74" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 1 跟跑（d = [−1,−1,−1,−2]）</text>

  <rect x="344" y="82" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="362" y="99" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <rect x="380" y="82" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="404" y="99" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">d[i]</text>
  <rect x="428" y="82" width="76" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="466" y="99" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">|d[i]−prev|</text>
  <rect x="504" y="82" width="46" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="527" y="99" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">ans</text>

  <text x="362" y="127" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="404" y="127" text-anchor="middle" font-size="11" fill="#8a6d1a" filter="url(#rough2)">−1</text>
  <text x="466" y="127" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="527" y="127" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>

  <text x="362" y="155" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="404" y="155" text-anchor="middle" font-size="11" fill="#8a6d1a" filter="url(#rough2)">−1</text>
  <text x="466" y="155" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="527" y="155" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>

  <text x="362" y="183" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <text x="404" y="183" text-anchor="middle" font-size="11" fill="#8a6d1a" filter="url(#rough2)">−1</text>
  <text x="466" y="183" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="527" y="183" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>

  <text x="362" y="211" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>
  <text x="404" y="211" text-anchor="middle" font-size="11" fill="#8a6d1a" filter="url(#rough2)">−2</text>
  <text x="466" y="211" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="527" y="211" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">2</text>

  <text x="362" y="239" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">结束</text>
  <text x="404" y="239" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <text x="466" y="239" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">|−2| = 2</text>
  <text x="527" y="239" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>

  <text x="444" y="272" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">ans = 1+0+0+1+2 = 4</text>
  <text x="444" y="298" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 4 / 2 = 2 ✓</text>

  <text x="444" y="334" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">等价写法：ans = Σ max(0, e[i])</text>
  <text x="444" y="352" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（正差分之和，含两端哨兵项，</text>
  <text x="444" y="370" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">不用再除 2）</text>

  <text x="290" y="416" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">⚠️ C++ 注意：Σ|e| 最大约 2×10¹³，务必用 long long 累加</text>
</svg>
