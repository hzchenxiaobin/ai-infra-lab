<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：g = gcd(a,b) → 枚举 i 到 √g 成对计数 → 维护 ans</text>

  <!-- ===== Example 1: a=12, b=6, g=6 ===== -->
  <text x="40" y="48" font-size="12" fill="#446688" font-weight="bold">示例 1：a=12, b=6 → g=gcd(12,6)=6（6 整除 12）</text>

  <!-- header -->
  <rect x="60" y="56" width="380" height="24" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="73" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">i</text>
  <text x="170" y="73" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">g % i</text>
  <text x="250" y="73" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">命中</text>
  <text x="340" y="73" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">配对 (i, g/i)</text>
  <text x="415" y="73" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">ans</text>

  <line x1="130" y1="56" x2="130" y2="150" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="210" y1="56" x2="210" y2="150" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="290" y1="56" x2="290" y2="150" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="390" y1="56" x2="390" y2="150" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>

  <!-- i=1 -->
  <rect x="60" y="80" width="380" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="95" y="97" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="170" y="97" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0 ✓</text>
  <text x="250" y="97" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <text x="340" y="97" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1, 6</text>
  <text x="415" y="97" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- i=2 -->
  <rect x="60" y="106" width="380" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="95" y="123" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="170" y="123" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0 ✓</text>
  <text x="250" y="123" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <text x="340" y="123" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2, 3</text>
  <text x="415" y="123" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>

  <!-- i=3 stop -->
  <rect x="60" y="132" width="380" height="18" fill="#f4f7fb" stroke="none"/>
  <text x="95" y="144" text-anchor="middle" font-size="9.5" fill="#888">3</text>
  <text x="170" y="144" text-anchor="middle" font-size="9.5" fill="#888">—</text>
  <text x="250" y="144" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">i²=9&gt;6 停止</text>
  <text x="340" y="144" text-anchor="middle" font-size="9.5" fill="#888">—</text>
  <text x="415" y="144" text-anchor="middle" font-size="9.5" fill="#888">4</text>

  <rect x="60" y="56" width="380" height="94" fill="none" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- result ex1 -->
  <rect x="460" y="91" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="505" y="108" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">答案</text>
  <text x="505" y="120" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4 ✓</text>

  <!-- ===== Example 2: a=25, b=30, g=5 ===== -->
  <text x="40" y="176" font-size="12" fill="#d6a040" font-weight="bold">示例 2：a=25, b=30 → g=gcd(25,30)=5（25=5², 30=2·3·5）</text>

  <rect x="60" y="184" width="380" height="24" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="201" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">i</text>
  <text x="170" y="201" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">g % i</text>
  <text x="250" y="201" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">命中</text>
  <text x="340" y="201" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">配对 (i, g/i)</text>
  <text x="415" y="201" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">ans</text>

  <line x1="130" y1="184" x2="130" y2="278" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="210" y1="184" x2="210" y2="278" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="290" y1="184" x2="290" y2="278" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="390" y1="184" x2="390" y2="278" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>

  <!-- i=1 -->
  <rect x="60" y="208" width="380" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="95" y="225" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="170" y="225" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0 ✓</text>
  <text x="250" y="225" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <text x="340" y="225" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1, 5</text>
  <text x="415" y="225" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- i=2 miss -->
  <rect x="60" y="234" width="380" height="26" fill="#f4f7fb" stroke="none"/>
  <text x="95" y="251" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="170" y="251" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1 ✗</text>
  <text x="250" y="251" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <text x="340" y="251" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="415" y="251" text-anchor="middle" font-size="11" fill="#888">2</text>

  <!-- i=3 stop -->
  <rect x="60" y="260" width="380" height="18" fill="#f4f7fb" stroke="none"/>
  <text x="95" y="272" text-anchor="middle" font-size="9.5" fill="#888">3</text>
  <text x="170" y="272" text-anchor="middle" font-size="9.5" fill="#888">—</text>
  <text x="250" y="272" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">i²=9&gt;5 停止</text>
  <text x="340" y="272" text-anchor="middle" font-size="9.5" fill="#888">—</text>
  <text x="415" y="272" text-anchor="middle" font-size="9.5" fill="#888">2</text>

  <rect x="60" y="184" width="380" height="94" fill="none" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- result ex2 -->
  <rect x="460" y="219" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="505" y="236" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">答案</text>
  <text x="505" y="248" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2 ✓</text>

  <!-- footer: divisor sets -->
  <rect x="40" y="296" width="480" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="316" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">约数集：示例1 {1,2,3,6}（d(6)=4）；示例2 {1,5}（d(5)=2）</text>

  <!-- footer: key insight -->
  <rect x="40" y="340" width="480" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="358" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">关键：公因子集 = gcd 的约数集；枚举到 √g 成对计数 (i, g/i)</text>
  <text x="280" y="374" text-anchor="middle" font-size="10" fill="#888">g%i=0 → 计 i 与 g/i 一对；i==g/i（完全平方）只计 1</text>
</svg>
