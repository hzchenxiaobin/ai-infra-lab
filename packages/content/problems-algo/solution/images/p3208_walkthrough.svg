<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="268" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：run 一路涨落，命中 2 次</text>
  <text x="268" y="50" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">colors = [0,1,0,0,1,0,1]，k = 6，n = 7，链 a 长 n+k−1 = 12</text>

  <!-- 表格外框 -->
  <rect x="60" y="66" width="415" height="300" fill="none" stroke="#bbb" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 表头 -->
  <rect x="60" y="66" width="415" height="24" fill="#f0ede6" filter="url(#rough2)"/>
  <text x="82" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">j</text>
  <text x="132" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">a[j]</text>
  <text x="230" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">a[j] vs a[j−1]</text>
  <text x="330" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">run</text>
  <text x="392" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">run ≥ 6 ?</text>
  <text x="450" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">ans</text>

  <!-- 列分隔线 -->
  <path d="M105,66 L105,366 M160,66 L160,366 M300,66 L300,366 M360,66 L360,366 M425,66 L425,366"
        stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- 行分隔线 -->
  <path d="M60,113 L475,113 M60,136 L475,136 M60,159 L475,159 M60,182 L475,182 M60,205 L475,205 M60,228 L475,228 M60,251 L475,251 M60,274 L475,274 M60,297 L475,297 M60,320 L475,320 M60,343 L475,343"
        stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- 命中行底色 j=8,9 -->
  <rect x="61" y="274" width="413" height="46" fill="#e6f4ea" filter="url(#rough2)"/>
  <!-- 切断行底色 j=3,10 -->
  <rect x="61" y="159" width="413" height="23" fill="#fce4ec" filter="url(#rough2)"/>
  <rect x="61" y="320" width="413" height="23" fill="#fce4ec" filter="url(#rough2)"/>

  <!-- 数据行 -->
  <text x="82" y="106" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="132" y="106" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="230" y="106" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">—（起点）</text>
  <text x="330" y="106" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="392" y="106" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">—</text>
  <text x="450" y="106" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>

  <text x="82" y="129" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="132" y="129" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>
  <text x="230" y="129" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1 ≠ 0 ✓</text>
  <text x="330" y="129" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="392" y="129" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">—</text>
  <text x="450" y="129" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>

  <text x="82" y="152" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="132" y="152" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="230" y="152" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">0 ≠ 1 ✓</text>
  <text x="330" y="152" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="392" y="152" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">—</text>
  <text x="450" y="152" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>

  <text x="82" y="175" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="132" y="175" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="230" y="175" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">0 = 0 ✗ 切断</text>
  <text x="330" y="175" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="392" y="175" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">—</text>
  <text x="450" y="175" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>

  <text x="82" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="132" y="198" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>
  <text x="230" y="198" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1 ≠ 0 ✓</text>
  <text x="330" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="392" y="198" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">—</text>
  <text x="450" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>

  <text x="82" y="221" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="132" y="221" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="230" y="221" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">0 ≠ 1 ✓</text>
  <text x="330" y="221" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="392" y="221" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">—</text>
  <text x="450" y="221" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>

  <text x="82" y="244" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <text x="132" y="244" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>
  <text x="230" y="244" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1 ≠ 0 ✓</text>
  <text x="330" y="244" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="392" y="244" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">—</text>
  <text x="450" y="244" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>

  <text x="82" y="267" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>
  <text x="132" y="267" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="230" y="267" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">0 ≠ 1 ✓（跨缝）</text>
  <text x="330" y="267" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="392" y="267" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">—</text>
  <text x="450" y="267" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>

  <text x="82" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">8</text>
  <text x="132" y="290" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>
  <text x="230" y="290" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1 ≠ 0 ✓</text>
  <text x="330" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">6</text>
  <text x="392" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓ 命中</text>
  <text x="450" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <text x="82" y="313" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">9</text>
  <text x="132" y="313" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="230" y="313" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">0 ≠ 1 ✓</text>
  <text x="330" y="313" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">7</text>
  <text x="392" y="313" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓ 命中</text>
  <text x="450" y="313" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <text x="82" y="336" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">10</text>
  <text x="132" y="336" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="230" y="336" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">0 = 0 ✗ 切断</text>
  <text x="330" y="336" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="392" y="336" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">—</text>
  <text x="450" y="336" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>

  <text x="82" y="359" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">11</text>
  <text x="132" y="359" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>
  <text x="230" y="359" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1 ≠ 0 ✓</text>
  <text x="330" y="359" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="392" y="359" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">—</text>
  <text x="450" y="359" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>

  <text x="268" y="388" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">j=8 → 环上 [3,4,5,6,0,1]；j=9 → [4,5,6,0,1,2]，两个窗口均跨接缝</text>
</svg>
