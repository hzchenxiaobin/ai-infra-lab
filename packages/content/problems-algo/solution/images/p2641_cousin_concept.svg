<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">堂兄弟 = 同深度 + 不同父</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">新值 = 层和 −（自己 + 亲兄弟）之和</text>

  <!-- ===== Tree (example 1, left) ===== -->
  <g font-size="12">
    <!-- L0 root -->
    <circle cx="160" cy="82" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="160" y="88" text-anchor="middle" fill="#b85450" font-weight="bold">5</text>
    <!-- L1 -->
    <circle cx="105" cy="158" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="105" y="163" text-anchor="middle" fill="#446688" font-weight="bold">4</text>
    <circle cx="215" cy="158" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="215" y="163" text-anchor="middle" fill="#446688" font-weight="bold">9</text>
    <line x1="146" y1="96" x2="119" y2="144" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="174" y1="96" x2="201" y2="144" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <!-- L2 -->
    <circle cx="68" cy="234" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="68" y="239" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <circle cx="142" cy="234" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="142" y="239" text-anchor="middle" fill="#d6a040" font-weight="bold">10</text>
    <circle cx="215" cy="234" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="215" y="239" text-anchor="middle" fill="#4a7a3a" font-weight="bold">7</text>
    <line x1="91" y1="170" x2="78" y2="220" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="119" y1="170" x2="132" y2="220" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="215" y1="172" x2="215" y2="220" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  </g>

  <!-- Sibling group boxes (dashed) at depth 2 -->
  <rect x="44" y="214" width="122" height="40" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 3" rx="8" filter="url(#rough2)"/>
  <text x="105" y="272" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">同父 = 4</text>

  <rect x="193" y="214" width="44" height="40" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5 3" rx="8" filter="url(#rough2)"/>
  <text x="215" y="272" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">同父 = 9</text>

  <!-- Cousin double arrow between groups -->
  <path d="M 166 234 L 193 234" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="4 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 193 240 L 166 240" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="4 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="180" y="208" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">堂兄弟</text>

  <!-- depth labels -->
  <text x="34" y="88" font-size="10" fill="#aaa">d=0</text>
  <text x="34" y="164" font-size="10" fill="#aaa">d=1</text>
  <text x="34" y="240" font-size="10" fill="#aaa">d=2</text>

  <!-- ===== Right side: levelSum + formula ===== -->
  <text x="330" y="70" font-size="11" fill="#444" font-weight="bold">层和 levelSum</text>
  <g font-size="11">
    <text x="330" y="90" font-size="10" fill="#b85450" font-weight="bold">d=0</text>
    <rect x="360" y="78" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="380" y="94" text-anchor="middle" fill="#b85450" font-weight="bold">5</text>
    <text x="410" y="94" font-size="9" fill="#888">= 5</text>

    <text x="330" y="120" font-size="10" fill="#446688" font-weight="bold">d=1</text>
    <rect x="360" y="108" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="380" y="124" text-anchor="middle" fill="#446688" font-weight="bold">13</text>
    <text x="410" y="124" font-size="9" fill="#888">= 4+9</text>

    <text x="330" y="150" font-size="10" fill="#d6a040" font-weight="bold">d=2</text>
    <rect x="360" y="138" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="380" y="154" text-anchor="middle" fill="#d6a040" font-weight="bold">18</text>
    <text x="410" y="154" font-size="9" fill="#888">= 1+10+7</text>
  </g>

  <!-- Formula box -->
  <rect x="330" y="180" width="210" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="435" y="200" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">新值 = levelSum[d] − siblingSum</text>
  <text x="435" y="218" text-anchor="middle" font-size="10" fill="#888">siblingSum = 自己 + 亲兄弟之和</text>

  <!-- Examples at d=2 -->
  <text x="330" y="252" font-size="11" fill="#444" font-weight="bold">举例（d=2, levelSum=18）</text>
  <g font-size="11">
    <text x="330" y="274" font-size="10" fill="#d6a040" font-weight="bold">node 1:</text>
    <text x="390" y="274" font-size="10" fill="#333">18 − (1+10) =</text>
    <rect x="475" y="262" width="34" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="492" y="277" text-anchor="middle" fill="#4a7a3a" font-weight="bold">7</text>

    <text x="330" y="302" font-size="10" fill="#4a7a3a" font-weight="bold">node 7:</text>
    <text x="390" y="302" font-size="10" fill="#333">18 − 7 =</text>
    <rect x="458" y="290" width="34" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="475" y="305" text-anchor="middle" fill="#d6a040" font-weight="bold">11</text>
  </g>

  <!-- Legend -->
  <line x1="20" y1="330" x2="540" y2="330" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="30" y="352" font-size="10" fill="#888" font-weight="bold">图例</text>
  <rect x="80" y="342" width="16" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="102" y="354" font-size="10" fill="#666">{1, 10} 同父（4）</text>
  <rect x="230" y="342" width="16" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="252" y="354" font-size="10" fill="#666">{7} 同父（9）</text>
  <line x1="380" y1="350" x2="410" y2="350" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="418" y="354" font-size="10" fill="#666">堂兄弟关系</text>

  <text x="280" y="386" text-anchor="middle" font-size="10" fill="#aaa">同一父节点的子节点互为亲兄弟，其余同层节点互为堂兄弟</text>
</svg>
