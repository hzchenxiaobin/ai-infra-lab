<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：扫描单词边界 + 原地反转</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">i 推进串，遇到空格即定出单词 [start, i)，反转之</text>

  <!-- Start -->
  <rect x="190" y="58" width="180" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="280" y="77" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">i = 0</text>

  <path d="M 280 88 L 280 106" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: i < n ? -->
  <polygon points="280,108 380,150 280,192 180,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="146" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">i &lt; n ?</text>
  <text x="280" y="162" text-anchor="middle" font-size="9" fill="#8a6a20">（还没到串尾）</text>

  <!-- No -->
  <text x="160" y="146" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M 180 150 L 110 150" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="40" y="134" width="70" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="75" y="154" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">返回 s</text>

  <!-- Yes -->
  <text x="300" y="208" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 280 192 L 280 216" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- start = i -->
  <rect x="170" y="218" width="220" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="280" y="238" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">start = i</text>

  <path d="M 280 250 L 280 268" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 扫描单词末尾 -->
  <rect x="90" y="270" width="380" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="290" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">while i &lt; n 且 s[i] ≠ ' '：i++   ← 跳过整个单词</text>

  <path d="M 280 302 L 280 320" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- reverse [start, i) -->
  <rect x="90" y="322" width="380" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="342" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">reverse(s[start .. i))   ← 对撞双指针反转单词</text>

  <path d="M 280 354 L 280 372" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i++ 跳过空格 -->
  <rect x="150" y="374" width="260" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="280" y="394" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">i++   ← 跳过单词后的空格</text>

  <!-- loop back to diamond -->
  <path d="M 410 390 L 450 390 L 450 150 L 380 150" stroke="#666" stroke-width="1.1" fill="none" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="460" y="270" font-size="9" fill="#888">回到判定</text>

  <!-- 关键提示 -->
  <rect x="30" y="420" width="500" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="42" y="440" font-size="11" fill="#8a6a20" font-weight="bold">关键：单词区间是左闭右开 [start, i)</text>
  <text x="42" y="456" font-size="10" fill="#666">i 停在空格或 n 处，恰为单词末尾+1，reverse 模板直接套用 344</text>
</svg>
