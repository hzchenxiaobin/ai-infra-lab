<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：blocked=[[0,1],[1,0]], source=[0,0], target=[0,2]</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">B=2 → limit=1；source 被两堵墙 + 两个封锁格堵死在角落</text>

  <g filter="url(#rough2)" font-size="13" font-weight="bold">
    <!-- top wall -->
    <rect x="76" y="74" width="168" height="8" fill="#d6a040"/>
    <!-- left wall -->
    <rect x="76" y="74" width="8" height="168" fill="#d6a040"/>

    <!-- 3x3 grid, cell=56, origin (84,82) -->
    <!-- (0,0) source green -->
    <rect x="84" y="82" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4"/>
    <text x="112" y="108" text-anchor="middle" fill="#4a7a3a">source</text>
    <text x="112" y="126" text-anchor="middle" fill="#4a7a3a" font-size="11">(0,0)</text>

    <!-- (1,0) blocker red -->
    <rect x="140" y="82" width="56" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="168" y="108" text-anchor="middle" fill="#b85450">block</text>
    <text x="168" y="126" text-anchor="middle" fill="#b85450" font-size="11">(1,0)</text>

    <!-- (2,0) empty -->
    <rect x="196" y="82" width="56" height="56" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="224" y="116" text-anchor="middle" fill="#999" font-size="11">(2,0)</text>

    <!-- (0,1) blocker red -->
    <rect x="84" y="138" width="56" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="112" y="164" text-anchor="middle" fill="#b85450">block</text>
    <text x="112" y="182" text-anchor="middle" fill="#b85450" font-size="11">(0,1)</text>

    <!-- (1,1) empty -->
    <rect x="140" y="138" width="56" height="56" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="168" y="172" text-anchor="middle" fill="#999" font-size="11">(1,1)</text>

    <!-- (2,1) empty -->
    <rect x="196" y="138" width="56" height="56" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="224" y="172" text-anchor="middle" fill="#999" font-size="11">(2,1)</text>

    <!-- (0,2) target orange -->
    <rect x="84" y="194" width="56" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4"/>
    <text x="112" y="220" text-anchor="middle" fill="#d6a040">target</text>
    <text x="112" y="238" text-anchor="middle" fill="#d6a040" font-size="11">(0,2)</text>

    <!-- (1,2) empty -->
    <rect x="140" y="194" width="56" height="56" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="168" y="228" text-anchor="middle" fill="#999" font-size="11">(1,2)</text>

    <!-- (2,2) empty -->
    <rect x="196" y="194" width="56" height="56" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="224" y="228" text-anchor="middle" fill="#999" font-size="11">(2,2)</text>

    <!-- wall labels -->
    <text x="168" y="68" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">↑ 网格边界（墙）</text>
    <text x="70" y="166" text-anchor="end" font-size="10" fill="#d6a040" font-weight="bold" transform="rotate(-90 70 166)">墙 →</text>
  </g>

  <!-- step table on the right -->
  <g filter="url(#rough2)" font-size="11">
    <rect x="300" y="78" width="220" height="180" fill="#ffffff" stroke="#888" stroke-width="1.2" rx="8"/>
    <text x="410" y="98" text-anchor="middle" fill="#444" font-weight="bold">BFS 从 source 执行</text>

    <text x="312" y="122" fill="#555">初始：vis = {(0,0)}，size=1</text>
    <text x="312" y="142" fill="#555">limit = 2×1/2 = 1</text>

    <text x="312" y="168" fill="#b85450" font-weight="bold">尝试扩展 (0,0)：</text>
    <text x="320" y="184" fill="#b85450" font-size="10">(0,1) 封锁 ✗</text>
    <text x="320" y="198" fill="#b85450" font-size="10">(1,0) 封锁 ✗</text>
    <text x="320" y="212" fill="#d6a040" font-size="10">(0,−1) 越界 ✗</text>
    <text x="320" y="226" fill="#d6a040" font-size="10">(−1,0) 越界 ✗</text>

    <text x="312" y="248" fill="#b85450" font-weight="bold">队列空 → source 被围</text>

    <!-- conclusion -->
    <rect x="300" y="270" width="220" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
    <text x="410" y="290" text-anchor="middle" fill="#b85450" font-weight="bold">未遇见 target 且被围</text>
    <text x="410" y="306" text-anchor="middle" fill="#b85450" font-size="11">⇒ return false ✓</text>
  </g>

  <text x="270" y="354" text-anchor="middle" font-size="11" fill="#888">两个封锁格借助两面墙把 source 钉死在 (0,0) 角落，target 在墙外不可达</text>
</svg>
