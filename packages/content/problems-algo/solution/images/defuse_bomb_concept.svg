<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4"/>
    </filter>
    <marker id="arG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="720" height="400" fill="#fdfcf7"/>
  <text x="360" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">拆炸弹：环形数组与窗口方向</text>
  <path d="M 230 42 Q 360 50 490 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ========= Left ring: k > 0 ========= -->
  <text x="190" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">k &gt; 0：取「后 k 个」</text>
  <text x="190" y="94" text-anchor="middle" font-size="11" fill="#666">code=[5,7,1,4], k=3, i=0</text>

  <circle cx="190" cy="210" r="86" fill="none" stroke="#ddd" stroke-width="1.2" stroke-dasharray="3 3" filter="url(#sk)"/>

  <!-- cell 0 top: 5 (anchor, blue) -->
  <g filter="url(#sk2)"><rect x="168" y="110" width="44" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <text x="190" y="138" text-anchor="middle" font-size="15" fill="#2b4a6a" font-weight="bold">5</text>
  <text x="244" y="120" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">i=0</text>

  <!-- cell 1 right: 7 (window) -->
  <g filter="url(#sk2)"><rect x="246" y="188" width="44" height="44" rx="6" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="268" y="216" text-anchor="middle" font-size="15" fill="#2e5e2e" font-weight="bold">7</text>
  <text x="312" y="200" text-anchor="middle" font-size="10" fill="#4a7a3a">1</text>

  <!-- cell 2 bottom: 1 (window) -->
  <g filter="url(#sk2)"><rect x="168" y="266" width="44" height="44" rx="6" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="190" y="294" text-anchor="middle" font-size="15" fill="#2e5e2e" font-weight="bold">1</text>
  <text x="244" y="306" text-anchor="middle" font-size="10" fill="#4a7a3a">2</text>

  <!-- cell 3 left: 4 (window) -->
  <g filter="url(#sk2)"><rect x="90" y="188" width="44" height="44" rx="6" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="112" y="216" text-anchor="middle" font-size="15" fill="#2e5e2e" font-weight="bold">4</text>
  <text x="68" y="200" text-anchor="middle" font-size="10" fill="#4a7a3a">3</text>

  <!-- clockwise arrows: 0->1, 1->2, 2->3 -->
  <path d="M 212 152 Q 250 162 258 190" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <path d="M 262 232 Q 250 268 214 278" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <path d="M 168 278 Q 132 268 124 232" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>

  <g filter="url(#sk2)"><rect x="120" y="332" width="140" height="36" rx="8" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="190" y="355" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">res[0] = 7+1+4 = 12</text>

  <!-- ========= Right ring: k < 0 ========= -->
  <text x="530" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#b03a3a">k &lt; 0：取「前 |k| 个」</text>
  <text x="530" y="94" text-anchor="middle" font-size="11" fill="#666">code=[2,4,9,3], k=-2, i=0</text>

  <circle cx="530" cy="210" r="86" fill="none" stroke="#ddd" stroke-width="1.2" stroke-dasharray="3 3" filter="url(#sk)"/>

  <!-- cell 0 top: 2 (anchor) -->
  <g filter="url(#sk2)"><rect x="508" y="110" width="44" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2"/></g>
  <text x="530" y="138" text-anchor="middle" font-size="15" fill="#2b4a6a" font-weight="bold">2</text>
  <text x="584" y="120" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">i=0</text>

  <!-- cell 1 right: 4 -->
  <g filter="url(#sk2)"><rect x="586" y="188" width="44" height="44" rx="6" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2"/></g>
  <text x="608" y="216" text-anchor="middle" font-size="15" fill="#888">4</text>

  <!-- cell 2 bottom: 9 (window) -->
  <g filter="url(#sk2)"><rect x="508" y="266" width="44" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="530" y="294" text-anchor="middle" font-size="15" fill="#a03a3a" font-weight="bold">9</text>

  <!-- cell 3 left: 3 (window) -->
  <g filter="url(#sk2)"><rect x="430" y="188" width="44" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/></g>
  <text x="452" y="216" text-anchor="middle" font-size="15" fill="#a03a3a" font-weight="bold">3</text>
  <text x="408" y="200" text-anchor="middle" font-size="10" fill="#b85450">3</text>

  <!-- counterclockwise arrows: 0->3, 3->2 -->
  <path d="M 508 152 Q 470 162 462 190" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <path d="M 458 232 Q 470 268 506 278" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>

  <g filter="url(#sk2)"><rect x="460" y="332" width="140" height="36" rx="8" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="530" y="355" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">res[0] = 3+9 = 12</text>

  <text x="360" y="392" text-anchor="middle" font-size="10" fill="#999">k&gt;0 顺时针取后 k 个；k&lt;0 逆时针取前 |k| 个；k=0 全置零</text>
</svg>
