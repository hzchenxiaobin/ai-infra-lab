<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="410" fill="#fafafa"/>
  <text x="270" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：一趟取负标记，两个判据同时找「重复」与「缺失」</text>

  <!-- Section 1: value -> index mapping -->
  <text x="40" y="60" font-size="12" fill="#446688" font-weight="bold">① 值 v → 下标 v−1，取负表示「v 存在」</text>

  <rect x="40" y="72" width="48" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="64" y="96" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">v</text>
  <text x="100" y="96" font-size="11" fill="#888">值 v</text>

  <text x="128" y="92" font-size="11" fill="#d6a040" font-weight="bold">v−1</text>
  <path d="M 150 90 L 184 90" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="188" y="72" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="216" y="96" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">nums[v−1]</text>
  <text x="256" y="96" font-size="11" fill="#4a7a3a">→ 取负：标记 v 存在</text>

  <!-- divider -->
  <path d="M 40 124 L 500 124" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>

  <!-- Section 2: duplicate detection -->
  <text x="40" y="152" font-size="12" fill="#b85450" font-weight="bold">② 重复检测：访问 v 时，nums[v−1] 已为负 → v 是重复数</text>

  <!-- visit v=2 (duplicate) -->
  <rect x="50" y="166" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="72" y="188" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="104" y="188" font-size="11" fill="#888">访问 v=2</text>

  <text x="160" y="186" font-size="11" fill="#d6a040" font-weight="bold">查 nums[1]</text>
  <path d="M 216 184 L 250 184" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- already negative -->
  <rect x="254" y="166" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="278" y="188" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−2</text>
  <text x="312" y="188" font-size="11" fill="#b85450">已负！</text>

  <text x="352" y="186" font-size="14" fill="#b85450" font-weight="bold">⇒ dup = 2</text>

  <!-- divider -->
  <path d="M 40 214 L 500 214" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>

  <!-- Section 3: missing detection -->
  <text x="40" y="242" font-size="12" fill="#4a7a3a" font-weight="bold">③ 缺失检测：标记全部完成后，nums[i] 仍为正 → i+1 是缺失数</text>

  <!-- scan index i=2 -->
  <rect x="50" y="256" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="72" y="278" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">i=2</text>
  <text x="104" y="278" font-size="11" fill="#888">扫描下标 2</text>

  <text x="170" y="276" font-size="11" fill="#4a7a3a" font-weight="bold">查 nums[2]</text>
  <path d="M 224 274 L 258 274" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- still positive -->
  <rect x="262" y="256" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="286" y="278" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="320" y="278" font-size="11" fill="#4a7a3a">仍为正！</text>

  <text x="352" y="276" font-size="14" fill="#4a7a3a" font-weight="bold">⇒ miss = 3</text>

  <!-- footer -->
  <rect x="40" y="316" width="460" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="340" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">一趟遍历找 dup（已负判据） + 一趟扫描找 miss（仍正判据）</text>
  <text x="270" y="358" text-anchor="middle" font-size="10.5" fill="#555">读 nums[i] 须取 abs：它可能已被前一轮标记成负数</text>
  <text x="270" y="374" text-anchor="middle" font-size="10.5" fill="#555">返回 [dup, miss]</text>
</svg>
