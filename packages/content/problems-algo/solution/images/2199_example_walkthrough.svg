<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：4 篇文章的主题判定</text>

  <!-- ===== Post 1 ===== -->
  <rect x="20" y="36" width="580" height="90" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="30" y="52" font-size="10" fill="#446688" font-weight="bold">Post 1: "We call it soccer They call it football hahaha"</text>
  <!-- words -->
  <text x="30" y="70" font-size="9" fill="#888">分词：</text>
  <text x="70" y="70" font-size="9" fill="#888">We call it soccer They call it</text>
  <rect x="250" y="60" width="50" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="275" y="71" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">football</text>
  <text x="310" y="70" font-size="9" fill="#888">hahaha</text>
  <!-- match result -->
  <text x="30" y="92" font-size="9" fill="#4a7a3a">命中：football → topic 1 (cnt=1)</text>
  <text x="30" y="108" font-size="9" fill="#4a7a3a" font-weight="bold">唯一最大 → topic = 1 ✓</text>
  <rect x="500" y="90" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="540" y="106" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- ===== Post 2 ===== -->
  <rect x="20" y="134" width="580" height="90" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="30" y="150" font-size="10" fill="#446688" font-weight="bold">Post 2: "Americans prefer basketball while Europeans love handball and football"</text>
  <text x="30" y="168" font-size="9" fill="#888">分词：... Europeans love</text>
  <rect x="158" y="158" width="56" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="186" y="169" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">handball</text>
  <text x="222" y="168" font-size="9" fill="#888">and</text>
  <rect x="246" y="158" width="50" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="271" y="169" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">football</text>
  <text x="30" y="190" font-size="9" fill="#4a7a3a">命中：handball + football → topic 1 (cnt=2)</text>
  <text x="30" y="206" font-size="9" fill="#4a7a3a" font-weight="bold">唯一最大 → topic = 1 ✓</text>
  <rect x="500" y="188" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="540" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- ===== Post 3 ===== -->
  <rect x="20" y="232" width="580" height="100" fill="#fff" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="30" y="248" font-size="10" fill="#d6a040" font-weight="bold">Post 3: "stop the war and play handball"</text>
  <text x="30" y="266" font-size="9" fill="#888">分词：stop the</text>
  <rect x="112" y="256" width="28" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="126" y="267" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">war</text>
  <text x="146" y="266" font-size="9" fill="#888">and play</text>
  <rect x="210" y="256" width="56" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="238" y="267" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">handball</text>
  <text x="30" y="288" font-size="9" fill="#b85450">命中：war → topic 3 (cnt=1)，handball → topic 1 (cnt=1)</text>
  <text x="30" y="304" font-size="9" fill="#d6a040" font-weight="bold">两个主题并列 cnt=1 → topic = "Ambiguous" ⚡</text>
  <text x="30" y="320" font-size="8" fill="#888">WAR 大小写不敏感匹配 war；两主题各 1 词，无法分高低</text>
  <rect x="500" y="286" width="80" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="540" y="302" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">Ambiguous</text>

  <!-- ===== Post 4 ===== -->
  <rect x="20" y="342" width="580" height="100" fill="#fff" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="30" y="358" font-size="10" fill="#b85450" font-weight="bold">Post 4: "warning I planted some flowers this morning and then got vaccinated"</text>
  <text x="30" y="376" font-size="9" fill="#888">分词：</text>
  <rect x="70" y="366" width="48" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="94" y="377" text-anchor="middle" font-size="8" fill="#4a7a3a">warning</text>
  <text x="126" y="376" font-size="8" fill="#b85450">≠ war</text>
  <text x="170" y="376" font-size="9" fill="#888">... got</text>
  <rect x="212" y="366" width="62" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="243" y="377" text-anchor="middle" font-size="8" fill="#4a7a3a">vaccinated</text>
  <text x="282" y="376" font-size="8" fill="#b85450">≠ Vaccine</text>
  <text x="30" y="398" font-size="9" fill="#b85450">无命中：warning 是完整词≠war；vaccinated≠Vaccine</text>
  <text x="30" y="414" font-size="9" fill="#b85450" font-weight="bold">命中数 = 0 → topic = "No Topic" ✗</text>
  <text x="30" y="430" font-size="8" fill="#888">若误用子串匹配(LIKE '%war%')，warning 会误命中 → 必须词级匹配</text>
  <rect x="500" y="396" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="540" y="412" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">No Topic</text>

  <!-- ===== Output table ===== -->
  <rect x="160" y="456" width="300" height="52" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="310" y="474" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">最终输出</text>
  <line x1="160" y1="478" x2="460" y2="478" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="200" y="492" font-size="9" fill="#888">post_id</text>
  <text x="280" y="492" font-size="9" fill="#888">1</text>
  <text x="310" y="492" font-size="9" fill="#888">2</text>
  <text x="345" y="492" font-size="9" fill="#888">3</text>
  <text x="385" y="492" font-size="9" fill="#888">4</text>
  <text x="220" y="504" font-size="9" fill="#888">topic</text>
  <text x="278" y="504" font-size="9" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="308" y="504" font-size="9" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="338" y="504" font-size="9" fill="#d6a040" font-weight="bold">Amb.</text>
  <text x="380" y="504" font-size="9" fill="#b85450" font-weight="bold">No T.</text>
</svg>
