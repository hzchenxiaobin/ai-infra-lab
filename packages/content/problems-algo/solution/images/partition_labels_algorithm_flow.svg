<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="500" height="470" fill="#fafafa"/>

  <text x="250" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：贪心 + 维护当前片段右边界</text>

  <!-- N1 start ellipse -->
  <ellipse cx="250" cy="50" rx="48" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250" y="55" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始</text>

  <!-- N2 preprocess -->
  <rect x="110" y="84" width="280" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="250" y="107" text-anchor="middle" font-size="11.5" fill="#333">预处理：last[c] ← 字符 c 在 s 中的最后下标</text>

  <!-- N3 init -->
  <rect x="140" y="136" width="220" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="250" y="159" text-anchor="middle" font-size="11.5" fill="#333">start=0, end=0, i=0, ans=[]</text>

  <!-- D1 diamond i<n? center (250,200) -->
  <polygon points="250,178 305,200 250,222 195,200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="204" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">i &lt; n ?</text>

  <!-- Nend return ans -->
  <ellipse cx="415" cy="200" rx="52" ry="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="415" y="205" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">返回 ans</text>

  <!-- N4 end=max -->
  <rect x="125" y="250" width="250" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="250" y="273" text-anchor="middle" font-size="11.5" fill="#333">end = max(end, last[s[i]])</text>

  <!-- D2 diamond i==end? center (250,322) -->
  <polygon points="250,298 312,322 250,346 188,322" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="326" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">i == end ?</text>

  <!-- N5 record -->
  <rect x="110" y="372" width="280" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="250" y="395" text-anchor="middle" font-size="11.5" fill="#333">ans.append(end−start+1)；start = i+1</text>

  <!-- N6 i++ -->
  <rect x="205" y="428" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="250" y="448" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">i++</text>

  <!-- arrows -->
  <!-- N1->N2 -->
  <path d="M 250 66 L 250 84" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrf)" filter="url(#rough2)"/>
  <!-- N2->N3 -->
  <path d="M 250 120 L 250 136" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrf)" filter="url(#rough2)"/>
  <!-- N3->D1 -->
  <path d="M 250 172 L 250 178" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrf)" filter="url(#rough2)"/>
  <!-- D1 No -> Nend -->
  <path d="M 305 200 L 363 200" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrf)" filter="url(#rough2)"/>
  <text x="334" y="194" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <!-- D1 Yes -> N4 -->
  <path d="M 250 222 L 250 250" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrf)" filter="url(#rough2)"/>
  <text x="262" y="240" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <!-- N4 -> D2 -->
  <path d="M 250 286 L 250 298" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrf)" filter="url(#rough2)"/>
  <!-- D2 Yes -> N5 -->
  <path d="M 250 346 L 250 372" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrf)" filter="url(#rough2)"/>
  <text x="262" y="362" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <!-- D2 No -> bypass right channel to N6 -->
  <path d="M 312 322 L 405 322 L 405 443 L 295 443" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrf)" filter="url(#rough2)"/>
  <text x="356" y="316" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <!-- N5 -> N6 -->
  <path d="M 250 408 L 250 428" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrf)" filter="url(#rough2)"/>
  <!-- N6 -> loop back to D1 via left channel x=40 -->
  <path d="M 205 443 L 40 443 L 40 200 L 195 200" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrf)" filter="url(#rough2)"/>
  <text x="58" y="436" font-size="10" fill="#888" font-style="italic">继续下一轮</text>
</svg>
