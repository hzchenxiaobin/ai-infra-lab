<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="430" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：JOIN 取单价 → 金额 = 数量 × 单价 → 按用户求和取最大</text>

  <!-- Sales label -->
  <text x="120" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Sales 表（销售记录）</text>

  <!-- Sales header -->
  <rect x="20" y="60" width="200" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="40" y="75" text-anchor="middle" font-size="9" fill="#446688">sale_id</text>
  <text x="84" y="75" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">product_id</text>
  <text x="140" y="75" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">user_id</text>
  <text x="190" y="75" text-anchor="middle" font-size="9" fill="#446688">quantity</text>

  <!-- Sales product_id column highlight -->
  <rect x="62" y="82" width="44" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>

  <text x="40" y="97" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="84" y="97" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">1</text>
  <text x="140" y="97" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">101</text>
  <text x="190" y="97" text-anchor="middle" font-size="9" fill="#333">10</text>

  <text x="40" y="115" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="84" y="115" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">3</text>
  <text x="140" y="115" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">101</text>
  <text x="190" y="115" text-anchor="middle" font-size="9" fill="#333">7</text>

  <text x="40" y="133" text-anchor="middle" font-size="9" fill="#333">3</text>
  <text x="84" y="133" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">1</text>
  <text x="140" y="133" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">102</text>
  <text x="190" y="133" text-anchor="middle" font-size="9" fill="#333">9</text>

  <!-- Sales dividers -->
  <line x1="62" y1="60" x2="62" y2="136" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="106" y1="60" x2="106" y2="136" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="174" y1="60" x2="174" y2="136" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="20" y1="82" x2="220" y2="82" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <rect x="20" y="60" width="200" height="76" fill="none" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>

  <!-- Product label -->
  <text x="480" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Product 表（单价）</text>

  <!-- Product header -->
  <rect x="380" y="60" width="200" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="75" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">product_id</text>
  <text x="530" y="75" text-anchor="middle" font-size="9" fill="#446688">price</text>

  <!-- Product product_id column highlight -->
  <rect x="380" y="82" width="100" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>

  <text x="430" y="97" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">1</text>
  <text x="530" y="97" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">10</text>

  <text x="430" y="115" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">2</text>
  <text x="530" y="115" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">25</text>

  <text x="430" y="133" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">3</text>
  <text x="530" y="133" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">15</text>

  <line x1="480" y1="60" x2="480" y2="136" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="380" y1="82" x2="580" y2="82" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <rect x="380" y="60" width="200" height="76" fill="none" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>

  <!-- Bridge arrow JOIN ON product_id -->
  <path d="M220 109 L376 109" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="298" y="102" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">JOIN ON</text>
  <text x="298" y="123" text-anchor="middle" font-size="8" fill="#d6a040">product_id</text>

  <!-- Down arrow to amount table -->
  <path d="M310 146 L310 174" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="330" y="166" text-anchor="start" font-size="9" fill="#d6a040" font-weight="bold">金额 = quantity × price</text>

  <!-- Amount table (per sale) -->
  <text x="310" y="190" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">JOIN 后每笔销售的金额</text>
  <rect x="120" y="198" width="380" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="212" text-anchor="middle" font-size="9" fill="#446688">sale_id</text>
  <text x="225" y="212" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">user_id</text>
  <text x="290" y="212" text-anchor="middle" font-size="9" fill="#446688">qty</text>
  <text x="345" y="212" text-anchor="middle" font-size="9" fill="#4a7a3a">price</text>
  <text x="445" y="212" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">amount = qty×price</text>

  <rect x="445" y="218" width="55" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="160" y="232" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="225" y="232" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">101</text>
  <text x="290" y="232" text-anchor="middle" font-size="9" fill="#333">10</text>
  <text x="345" y="232" text-anchor="middle" font-size="9" fill="#4a7a3a">10</text>
  <text x="445" y="232" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">100</text>

  <text x="160" y="252" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="225" y="252" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">101</text>
  <text x="290" y="252" text-anchor="middle" font-size="9" fill="#333">7</text>
  <text x="345" y="252" text-anchor="middle" font-size="9" fill="#4a7a3a">15</text>
  <text x="445" y="252" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">105</text>

  <line x1="195" y1="198" x2="195" y2="258" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="260" y1="198" x2="260" y2="258" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="320" y1="198" x2="320" y2="258" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="370" y1="198" x2="370" y2="258" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="417" y1="198" x2="417" y2="258" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="120" y1="218" x2="500" y2="218" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <rect x="120" y="198" width="380" height="60" fill="none" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="465" y="274" text-anchor="middle" font-size="8" fill="#888">… 共 6 笔</text>

  <!-- Down arrow: GROUP BY user_id, SUM(amount) -->
  <path d="M310 280 L310 308" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="330" y="300" text-anchor="start" font-size="9" fill="#b85450" font-weight="bold">GROUP BY user_id → SUM(amount)</text>

  <!-- Per-user total table -->
  <text x="310" y="324" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">按用户汇总消费总额</text>
  <rect x="170" y="332" width="280" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="346" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">user_id</text>
  <text x="380" y="346" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">SUM(amount)</text>

  <rect x="170" y="352" width="280" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="240" y="365" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">101</text>
  <text x="380" y="365" text-anchor="middle" font-size="9" fill="#555">205</text>

  <rect x="170" y="370" width="280" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="240" y="383" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">102</text>
  <text x="380" y="383" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">450 ★ 最大</text>

  <line x1="310" y1="332" x2="310" y2="388" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="170" y1="352" x2="450" y2="352" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <rect x="170" y="332" width="280" height="56" fill="none" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>

  <!-- Result -->
  <path d="M310 392 L310 408" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="250" y="410" width="120" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="310" y="421" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">返回 user_id = 102</text>
</svg>
