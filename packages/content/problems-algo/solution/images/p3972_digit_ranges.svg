<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 528" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="528" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：首数字 ⇒ 数位区间，末数字 ⇒ 模 10 余数</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">x = 1：首位=1 ⟺ S ∈ [1·10ᵖ, 2·10ᵖ−1]；末位=1 ⟺ S ≡ 1 (mod 10)；S = P[j] − P[i]</text>

  <!-- ===== number line ===== -->
  <!-- bands -->
  <rect x="76" y="100" width="20" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="269" y="100" width="212" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="86" y="92" text-anchor="middle" font-size="9.5" fill="#a87020" font-weight="bold">p=1: [10,19]</text>
  <text x="375" y="92" text-anchor="middle" font-size="9.5" fill="#a87020" font-weight="bold">p=2: [100,199]</text>
  <text x="494" y="92" font-size="9.5" fill="#a87020" font-weight="bold">…</text>

  <!-- the line -->
  <path d="M 55 112 L 505 112" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- ticks -->
  <path d="M 55 112 L 55 120 M 76 112 L 76 120 M 96 112 L 96 120 M 269 112 L 269 120 M 481 112 L 481 120" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="55" y="134" text-anchor="middle" font-size="9.5" fill="#446688">0</text>
  <text x="76" y="134" text-anchor="middle" font-size="9.5" fill="#446688">10</text>
  <text x="96" y="134" text-anchor="middle" font-size="9.5" fill="#446688">19</text>
  <text x="269" y="134" text-anchor="middle" font-size="9.5" fill="#446688">100</text>
  <text x="481" y="134" text-anchor="middle" font-size="9.5" fill="#446688">199</text>

  <!-- red dots: numbers ending with x=1 inside the bands -->
  <circle cx="57" cy="112" r="5" fill="#b85450" filter="url(#rough2)"/>
  <text x="46" y="92" text-anchor="middle" font-size="9.5" fill="#a87020" font-weight="bold">p=0:[1,1]</text>
  <circle cx="79" cy="112" r="3.4" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="271" cy="112" r="3.4" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="293" cy="112" r="3.4" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="314" cy="112" r="3.4" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="336" cy="112" r="3.4" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="357" cy="112" r="3.4" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="379" cy="112" r="3.4" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="400" cy="112" r="3.4" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="421" cy="112" r="3.4" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="443" cy="112" r="3.4" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="464" cy="112" r="3.4" fill="#b85450" filter="url(#rough2)"/>

  <!-- legend -->
  <text x="62" y="156" font-size="10" fill="#a87020" font-weight="bold">■ 橙带 = 首位为 x 的区间 [x·10ᵖ, (x+1)·10ᵖ−1]，p = 0, 1, 2, …（至多约 15 个）</text>
  <text x="62" y="172" font-size="10" fill="#b85450" font-weight="bold">● 红点 = 末位为 x（S ≡ x (mod 10)）；橙带 ∩ 红点 ⇒ 首尾同为 x，有效子数组和</text>

  <text x="280" y="196" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">P 严格递增 ⇒ 按 P mod 10 分入 10 个桶，桶内天然有序</text>

  <!-- ===== buckets ===== -->
  <rect x="33" y="206" width="44" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="83" y="206" width="44" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="6" filter="url(#rough2)"/>
  <rect x="133" y="206" width="44" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <rect x="183" y="206" width="44" height="58" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <rect x="233" y="206" width="44" height="58" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <rect x="283" y="206" width="44" height="58" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <rect x="333" y="206" width="44" height="58" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <rect x="383" y="206" width="44" height="58" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <rect x="433" y="206" width="44" height="58" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <rect x="483" y="206" width="44" height="58" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="6" filter="url(#rough2)"/>

  <text x="55" y="240" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="105" y="232" text-anchor="middle" font-size="11" fill="#2f5e23" font-weight="bold">1</text>
  <text x="105" y="252" text-anchor="middle" font-size="11" fill="#2f5e23" font-weight="bold">101</text>
  <text x="155" y="240" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">102</text>
  <text x="205" y="240" text-anchor="middle" font-size="10" fill="#999">—</text>
  <text x="255" y="240" text-anchor="middle" font-size="10" fill="#999">—</text>
  <text x="305" y="240" text-anchor="middle" font-size="10" fill="#999">—</text>
  <text x="355" y="240" text-anchor="middle" font-size="10" fill="#999">—</text>
  <text x="405" y="240" text-anchor="middle" font-size="10" fill="#999">—</text>
  <text x="455" y="240" text-anchor="middle" font-size="10" fill="#999">—</text>
  <text x="505" y="240" text-anchor="middle" font-size="10" fill="#999">—</text>

  <text x="55" y="278" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">V₀</text>
  <text x="105" y="278" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">V₁</text>
  <text x="155" y="278" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">V₂</text>
  <text x="205" y="278" text-anchor="middle" font-size="9.5" fill="#8899aa">V₃</text>
  <text x="255" y="278" text-anchor="middle" font-size="9.5" fill="#8899aa">V₄</text>
  <text x="305" y="278" text-anchor="middle" font-size="9.5" fill="#8899aa">V₅</text>
  <text x="355" y="278" text-anchor="middle" font-size="9.5" fill="#8899aa">V₆</text>
  <text x="405" y="278" text-anchor="middle" font-size="9.5" fill="#8899aa">V₇</text>
  <text x="455" y="278" text-anchor="middle" font-size="9.5" fill="#8899aa">V₈</text>
  <text x="505" y="278" text-anchor="middle" font-size="9.5" fill="#8899aa">V₉</text>
  <text x="280" y="296" text-anchor="middle" font-size="9.5" fill="#888">桶 Vᵣ = {P[i] : P[i] mod 10 = r}（示例 nums=[1,100,1] 的 P = 0, 1, 101, 102）</text>

  <!-- ===== query box ===== -->
  <rect x="28" y="308" width="504" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="44" y="328" font-size="11" fill="#2f5e23" font-weight="bold">查询机制（x = 1）：枚举 j，令 r = (P[j] − x) mod 10 → 只查桶 Vᵣ</text>
  <text x="44" y="346" font-size="10.5" fill="#444">枚举 p：目标区间 [x·10ᵖ, (x+1)·10ᵖ−1] → 转成 P[i] 的窗口 [P[j]−R, P[j]−L]，在 Vᵣ 中二分计数</text>
  <text x="44" y="364" font-size="10.5" fill="#444">如 j=3（P[j]=102），p=2 → 窗口 [0,2]，V₁ 中命中 1 ⇒ 和 = 102−1 = 101 ✓（子数组 [1..2]）</text>
  <text x="44" y="380" font-size="9.5" fill="#888">hi = P[j]−L &lt; P[j] ⇒ 命中的 P[i] 必在 P[j] 左侧，i &lt; j 自动成立，无需判下标顺序</text>

  <!-- ===== insight boxes ===== -->
  <rect x="28" y="398" width="504" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="44" y="419" font-size="11.5" fill="#446688" font-weight="bold">① 元素全正 ⇒ P 严格递增：子数组和 = P[j] − P[i]，且 P[i] &lt; P[j] ⟺ i &lt; j</text>
  <text x="44" y="438" font-size="10" fill="#444">「数子数组」变成「数有序前缀和的差值对」；P[0]=0 也在桶 V₀ 里，代表以 0 开头的子数组</text>

  <rect x="28" y="462" width="504" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="44" y="483" font-size="11.5" fill="#a87020" font-weight="bold">② 首位条件只有约 15 个区间（S ≤ 10⁵×10⁹ = 10¹⁴），末位条件锁定唯一余数桶</text>
  <text x="44" y="502" font-size="10" fill="#444">每个 j 至多 15 个区间 × 每次 1 回二分 ⇒ 总代价 O(15·n·log n)，n = 10⁵ 轻松通过</text>
</svg>
