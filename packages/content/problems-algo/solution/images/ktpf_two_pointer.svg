<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">双指针计数：mid = 0.4 时统计分数 ≤ 0.4 的个数（按分母 j 扫描，分子指针 i 只增不减）</text>

  <!-- index labels -->
  <text x="148" y="48" text-anchor="middle" font-size="10" fill="#aaa">idx0</text>
  <text x="218" y="48" text-anchor="middle" font-size="10" fill="#aaa">idx1</text>
  <text x="288" y="48" text-anchor="middle" font-size="10" fill="#aaa">idx2</text>
  <text x="358" y="48" text-anchor="middle" font-size="10" fill="#aaa">idx3</text>

  <!-- ===== j=1 row ===== -->
  <text x="40" y="74" font-size="12" fill="#888" font-weight="bold">j=1</text>
  <text x="40" y="88" font-size="9" fill="#aaa">分母=2</text>
  <rect x="120" y="56" width="56" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="148" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="190" y="56" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="218" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="260" y="56" width="56" height="36" fill="#ddd" stroke="#aaa" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="288" y="80" text-anchor="middle" font-size="14" fill="#999">3</text>
  <rect x="330" y="56" width="56" height="36" fill="#ddd" stroke="#aaa" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="358" y="80" text-anchor="middle" font-size="14" fill="#999">5</text>

  <text x="218" y="46" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">j</text>
  <text x="148" y="108" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1≤0.8? ✗</text>
  <text x="412" y="78" font-size="11" fill="#444">i=0 不动 → cnt += <tspan font-weight="bold" fill="#d6a040">0</tspan>　1/2=0.5 &gt; 0.4</text>

  <!-- ===== j=2 row ===== -->
  <text x="40" y="154" font-size="12" fill="#888" font-weight="bold">j=2</text>
  <text x="40" y="168" font-size="9" fill="#aaa">分母=3</text>
  <rect x="120" y="136" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="160" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="190" y="136" width="56" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="218" y="160" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="260" y="136" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="288" y="160" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="330" y="136" width="56" height="36" fill="#ddd" stroke="#aaa" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="358" y="160" text-anchor="middle" font-size="14" fill="#999">5</text>

  <text x="288" y="126" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">j</text>
  <text x="148" y="188" text-anchor="middle" font-size="10" fill="#4a7a3a">1≤1.2 ✓</text>
  <text x="218" y="188" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2≤1.2? ✗</text>
  <text x="412" y="158" font-size="11" fill="#444">i: 0→1 → cnt += <tspan font-weight="bold" fill="#d6a040">1</tspan>　1/3=0.33 ✓</text>

  <!-- ===== j=3 row ===== -->
  <text x="40" y="234" font-size="12" fill="#888" font-weight="bold">j=3</text>
  <text x="40" y="248" font-size="9" fill="#aaa">分母=5</text>
  <rect x="120" y="216" width="56" height="36" fill="#ddd" stroke="#aaa" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="148" y="240" text-anchor="middle" font-size="14" fill="#999">1</text>
  <rect x="190" y="216" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="240" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="260" y="216" width="56" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="288" y="240" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="330" y="216" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="358" y="240" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>

  <text x="358" y="206" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">j</text>
  <text x="218" y="268" text-anchor="middle" font-size="10" fill="#4a7a3a">2≤2.0 ✓</text>
  <text x="288" y="268" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3≤2.0? ✗</text>
  <text x="412" y="238" font-size="11" fill="#444">i: 1→2 → cnt += <tspan font-weight="bold" fill="#d6a040">2</tspan>　2/5=0.4 ✓</text>

  <!-- summary -->
  <rect x="60" y="294" width="480" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="318" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">count(0.4) = 0 + 1 + 2 = 3 ≥ k=3 ✓</text>
  <text x="300" y="340" text-anchor="middle" font-size="11" fill="#666">分子指针 i 全程只增不减：j=1 时 i=0，j=2 时 i→1，j=3 时 i→2（从未回退）</text>
  <text x="300" y="358" text-anchor="middle" font-size="11" fill="#666">原因：j 变大 ⇒ arr[j] 变大 ⇒ mid·arr[j] 变大 ⇒ 能容纳的分子 arr[i] 更多</text>
  <text x="300" y="376" text-anchor="middle" font-size="11" fill="#4a7a3a">两指针各走 ≤ n 步 ⇒ 每次 check 为 O(n)；同时记录 ≤ mid 的最大分数 = 2/5</text>

  <!-- legend -->
  <rect x="120" y="400" width="16" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="142" y="412" font-size="11" fill="#555">分母 j</text>
  <rect x="200" y="400" width="16" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="222" y="412" font-size="11" fill="#555">i 扫过的合法分子</text>
  <rect x="350" y="400" width="16" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="372" y="412" font-size="11" fill="#555">i 停下（分子超阈值）</text>
  <rect x="490" y="400" width="16" height="16" fill="#ddd" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="512" y="412" font-size="11" fill="#555">已跳过</text>

  <text x="300" y="440" text-anchor="middle" font-size="10" fill="#888">判定条件 arr[i] ≤ mid·arr[j] 等价于 arr[i]/arr[j] ≤ mid，避免除法浮点误差</text>
</svg>
