<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#888"/>
    </marker>
    <marker id="arrCyc" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：数组演变以 2n 为周期循环（nums = [0,1,2]，n=3）</text>
  <text x="270" y="44" text-anchor="middle" font-size="10.5" fill="#888">删除阶段（0→n）逐个移除最左 · 添加阶段（n→2n）按删除顺序加回尾部</text>

  <!-- ===== Phase bands (left gutter) ===== -->
  <rect x="10" y="66" width="16" height="124" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="18" y="128" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" transform="rotate(-90 18 128)">删除阶段</text>

  <rect x="10" y="196" width="16" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="18" y="228" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" transform="rotate(-90 18 228)">添加阶段</text>

  <rect x="10" y="264" width="16" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="18" y="280" text-anchor="middle" font-size="9" fill="#888" transform="rotate(-90 18 280)">复原</text>

  <!-- ===== Rows: m=0 .. m=6 ===== -->
  <!-- m=0 : [0,1,2] -->
  <text x="44" y="84" font-size="11" fill="#555" font-weight="bold">m=0</text>
  <rect x="80" y="72" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="97" y="89" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="116" y="72" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="133" y="89" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="152" y="72" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="169" y="89" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="200" y="89" font-size="10" fill="#888">len=3</text>

  <!-- m=1 : [1,2] -->
  <text x="44" y="114" font-size="11" fill="#555" font-weight="bold">m=1</text>
  <rect x="80" y="102" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="97" y="119" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="116" y="102" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="133" y="119" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="162" y="119" font-size="10" fill="#b85450">←移除 0</text>
  <text x="200" y="119" font-size="10" fill="#888">len=2</text>

  <!-- m=2 : [2] -->
  <text x="44" y="144" font-size="11" fill="#555" font-weight="bold">m=2</text>
  <rect x="80" y="132" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="97" y="149" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="126" y="149" font-size="10" fill="#b85450">←移除 1</text>
  <text x="200" y="149" font-size="10" fill="#888">len=1</text>

  <!-- m=3 : [] -->
  <text x="44" y="174" font-size="11" fill="#555" font-weight="bold">m=3</text>
  <rect x="78" y="162" width="40" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="98" y="179" text-anchor="middle" font-size="11" fill="#999">∅ 空</text>
  <text x="130" y="179" font-size="10" fill="#b85450">←移除 2</text>
  <text x="200" y="179" font-size="10" fill="#888">len=0</text>

  <!-- m=4 : [0] -->
  <text x="44" y="204" font-size="11" fill="#555" font-weight="bold">m=4</text>
  <rect x="80" y="192" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="97" y="209" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="126" y="209" font-size="10" fill="#4a7a3a">尾加 0</text>
  <text x="200" y="209" font-size="10" fill="#888">len=1</text>

  <!-- m=5 : [0,1] -->
  <text x="44" y="234" font-size="11" fill="#555" font-weight="bold">m=5</text>
  <rect x="80" y="222" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="97" y="239" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="116" y="222" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="133" y="239" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="162" y="239" font-size="10" fill="#4a7a3a">尾加 1</text>
  <text x="200" y="239" font-size="10" fill="#888">len=2</text>

  <!-- m=6 : [0,1,2] (= m=0, dashed highlight) -->
  <text x="44" y="280" font-size="11" fill="#b85450" font-weight="bold">m=6</text>
  <rect x="80" y="268" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="97" y="285" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="116" y="268" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="133" y="285" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="152" y="268" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="169" y="285" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="196" y="285" font-size="10" fill="#b85450" font-weight="bold">≡ m=0 复原</text>

  <!-- Cycle arrow: from m=6 area curving back up to m=0 -->
  <path d="M 250 280 Q 280 270 280 175 Q 280 84 250 84" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrCyc)" filter="url(#rough2)"/>
  <text x="290" y="180" font-size="10.5" fill="#b85450" font-weight="bold">周期 = 2n</text>
  <text x="290" y="196" font-size="10" fill="#b85450">m = t mod 2n</text>

  <!-- ===== Bottom insight ===== -->
  <rect x="40" y="312" width="460" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="332" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">无需逐分钟模拟：m = t mod 2n 直接定位所处阶段</text>
  <text x="270" y="348" text-anchor="middle" font-size="10.5" fill="#555">删除阶段(m≤n)：数组=nums[m:n] · 添加阶段(m&gt;n)：数组=nums[0:m−n]</text>

  <!-- Footer -->
  <text x="270" y="372" text-anchor="middle" font-size="9.5" fill="#aaa">每个查询 O(1) · 总时间 O(q)</text>
</svg>
