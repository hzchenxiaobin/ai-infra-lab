<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">LCS 归约：最小删除步数 = m + n − 2 × LCS</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">保留部分 = 公共子序列，让保留最长 ⇒ 删除最少</text>

  <!-- ===== 上半：两字符串 + 公共子序列 ===== -->
  <!-- word1 = "sea" -->
  <text x="60" y="80" font-size="11" fill="#446688" font-weight="bold">word1 (m=3)</text>
  <rect x="60" y="88" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="80" y="110" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">s</text>
  <rect x="100" y="88" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="110" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">e</text>
  <rect x="140" y="88" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="160" y="110" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">a</text>
  <text x="195" y="100" font-size="9" fill="#b85450">删 s</text>
  <text x="195" y="112" font-size="9" fill="#888">(m−L = 1)</text>

  <!-- 公共子序列保留部分 (中间) -->
  <rect x="220" y="88" width="180" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="310" y="100" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">保留 = 公共子序列</text>
  <text x="310" y="114" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">长度 L = LCS</text>

  <!-- word2 = "eat" -->
  <text x="430" y="80" font-size="11" fill="#446688" font-weight="bold">word2 (n=3)</text>
  <rect x="430" y="88" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="450" y="110" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">e</text>
  <rect x="470" y="88" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="490" y="110" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">a</text>
  <rect x="510" y="88" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="530" y="110" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">t</text>

  <!-- 删除箭头: word1 删 s -->
  <path d="M 80 124 L 80 138" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 75 138 L 85 138 M 72 142 L 80 138 L 88 142" stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 保留箭头: word1 的 ea -> 中间 -->
  <path d="M 140 105 L 218 105" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="3,2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- 保留箭头: word2 的 ea -> 中间 -->
  <path d="M 430 105 L 402 105" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="3,2" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 删除箭头: word2 删 t -->
  <path d="M 530 124 L 530 138" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 525 138 L 535 138 M 522 142 L 530 138 L 538 142" stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <text x="425" y="100" font-size="9" fill="#b85450">删 t</text>
  <text x="425" y="112" font-size="9" fill="#888">(n−L = 1)</text>

  <!-- ===== 公式推导 ===== -->
  <rect x="40" y="160" width="500" height="84" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="60" y="180" font-size="11" fill="#446688" font-weight="bold">推导：</text>
  <text x="60" y="198" font-family="monospace" font-size="11" fill="#555">保留长度 L ⇒ word1 删 (m−L)，word2 删 (n−L)</text>
  <text x="60" y="214" font-family="monospace" font-size="11" fill="#555">总删除 = (m−L) + (n−L) = m + n − 2L</text>
  <text x="60" y="232" font-family="monospace" font-size="11" fill="#4a7a3a" font-weight="bold">最小化删除 ⇔ 最大化 L ⇔ L = LCS(word1, word2)</text>

  <!-- ===== 最终公式 ===== -->
  <rect x="40" y="254" width="500" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="282" text-anchor="middle" font-family="monospace" font-size="14" fill="#4a7a3a" font-weight="bold">minDistance = m + n − 2 × LCS(word1, word2)</text>

  <!-- ===== 示例代入 ===== -->
  <rect x="40" y="308" width="500" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="60" y="326" font-size="11" fill="#d6a040" font-weight="bold">代入示例：word1="sea", word2="eat"</text>
  <text x="60" y="344" font-family="monospace" font-size="11" fill="#555">LCS = "ea" = 2 ⇒ minDistance = 3 + 3 − 2×2 = 2 ✓</text>

  <!-- ===== 底部提示 ===== -->
  <rect x="40" y="362" width="500" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="290" y="381" text-anchor="middle" font-size="10" fill="#b85450">💡 直接复用 1143 LCS 代码即可，把求出的 LCS 长度代入公式</text>
</svg>
