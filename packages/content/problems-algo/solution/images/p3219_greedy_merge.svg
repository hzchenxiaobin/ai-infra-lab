<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrBlue" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">降序归并取大：每刀乘数 = 对侧已切条数 + 1</text>

  <!-- h 数组条带 -->
  <text x="46" y="72" font-size="12" fill="#446688" filter="url(#rough2)">h 降序 →</text>
  <rect x="120" y="52" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="142" y="72" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">9</text>
  <rect x="164" y="52" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="186" y="72" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <rect x="208" y="52" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="72" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="252" y="52" width="44" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="274" y="72" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <line x1="142" y1="38" x2="142" y2="48" stroke="#446688" stroke-width="2" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="122" y="36" font-size="11" fill="#446688" filter="url(#rough2)">i</text>

  <!-- v 数组条带 -->
  <text x="46" y="132" font-size="12" fill="#4a7a3a" filter="url(#rough2)">v 降序 →</text>
  <rect x="120" y="112" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="142" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <rect x="164" y="112" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="186" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <rect x="208" y="112" width="44" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <line x1="142" y1="98" x2="142" y2="108" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="122" y="104" font-size="11" fill="#4a7a3a" filter="url(#rough2)">j</text>

  <!-- 右侧说明：为何乘数是对侧+1 -->
  <rect x="330" y="48" width="172" height="96" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="416" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#a06a10" filter="url(#rough2)">乘数从哪来？</text>
  <text x="416" y="90" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">切水平线时，已有的 j 条竖线</text>
  <text x="416" y="106" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">把它断成 j+1 段，每段一刀</text>
  <text x="416" y="126" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">（基准一刀 + 每对交点 +1）</text>

  <!-- 比较菱形 -->
  <polygon points="260,158 335,190 260,222 185,190" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="186" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">h[i] ≥ v[j]？</text>
  <text x="260" y="202" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（一侧耗尽选另一侧）</text>
  <line x1="142" y1="82" x2="142" y2="150" stroke="#446688" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <line x1="142" y1="150" x2="200" y2="178" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 两个分支 -->
  <line x1="335" y1="190" x2="368" y2="190" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="368" y1="190" x2="368" y2="224" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="352" y="182" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="278" y="228" width="216" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="386" y="248" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">横切：ans += h[i] × (j + 1)</text>
  <text x="386" y="264" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">断成 j+1 段，每段一刀</text>
  <text x="386" y="280" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">然后 i++</text>

  <line x1="185" y1="190" x2="152" y2="190" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="152" y1="190" x2="152" y2="224" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="168" y="182" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="26" y="228" width="216" height="60" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="134" y="248" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">竖切：ans += v[j] × (i + 1)</text>
  <text x="134" y="264" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">断成 i+1 段，每段一刀</text>
  <text x="134" y="280" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">然后 j++</text>

  <!-- 底部直觉 -->
  <rect x="26" y="306" width="468" height="40" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="324" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">直觉：贵的先切（贯穿完整块只付基准一刀）</text>
  <text x="260" y="340" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">便宜的后切（被断成很多段也只付小单价）</text>
</svg>
