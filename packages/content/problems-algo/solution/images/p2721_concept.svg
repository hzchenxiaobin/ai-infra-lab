<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">核心观察：按索引落位 + 计数器归零 + 首拒即拒</text>

  <!-- functions array (top) -->
  <text x="40" y="62" font-size="11" fill="#888">functions</text>
  <rect x="100" y="50" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="130" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">f0()</text>
  <rect x="170" y="50" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="200" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">f1()</text>
  <rect x="240" y="50" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="270" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">f2()</text>

  <!-- parallel fire arrows (down, all at once) -->
  <path d="M 130 86 L 130 110" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 200 86 L 200 110" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 270 86 L 270 110" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="295" y="100" font-size="9" fill="#446688">并发触发</text>

  <!-- three promises resolving at different times -->
  <rect x="100" y="114" width="60" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="130" y="130" text-anchor="middle" font-size="10" fill="#d6a040">50ms</text>
  <text x="130" y="144" text-anchor="middle" font-size="10" fill="#333">→ 4 ✓</text>

  <rect x="170" y="114" width="60" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="200" y="130" text-anchor="middle" font-size="10" fill="#d6a040">150ms</text>
  <text x="200" y="144" text-anchor="middle" font-size="10" fill="#333">→ 10 ✓</text>

  <rect x="240" y="114" width="60" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="270" y="130" text-anchor="middle" font-size="10" fill="#d6a040">100ms</text>
  <text x="270" y="144" text-anchor="middle" font-size="10" fill="#333">→ 16 ✓</text>

  <!-- arrows down to results slots (crossing: f2 resolves before f1) -->
  <path d="M 130 156 L 130 178" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <path d="M 270 156 L 270 178" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <path d="M 200 156 Q 200 200 200 178" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrGreen)" filter="url(#rough2)"/>

  <!-- results array (preserves order) -->
  <text x="40" y="200" font-size="11" fill="#888">results</text>
  <rect x="100" y="182" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="130" y="202" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">[0]=4</text>
  <rect x="170" y="182" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="200" y="202" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">[1]=10</text>
  <rect x="240" y="182" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="270" y="202" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">[2]=16</text>
  <text x="320" y="200" font-size="9" fill="#4a7a3a">按原索引落位</text>

  <!-- counter -->
  <rect x="100" y="230" width="200" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="200" y="251" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">count: 1 → 2 → 3（完成数累加）</text>

  <!-- arrow: when count == n -->
  <path d="M 200 266 L 200 290" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="215" y="282" font-size="10" fill="#4a7a3a">count == 3</text>

  <!-- resolve box -->
  <rect x="100" y="294" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="200" y="313" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">resolve([4, 10, 16])</text>
  <text x="200" y="327" text-anchor="middle" font-size="9" fill="#4a7a3a">最终数组保持原顺序</text>

  <!-- Right side: reject path -->
  <text x="430" y="62" font-size="11" fill="#b85450" font-weight="bold">任意 reject 路径</text>
  <rect x="380" y="74" width="160" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="460" y="92" text-anchor="middle" font-size="10" fill="#333">某 promise reject</text>
  <text x="460" y="106" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">reason = "Error"</text>

  <path d="M 460 116 L 460 138" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="475" y="132" font-size="9" fill="#b85450">立即触发</text>

  <rect x="380" y="142" width="160" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="460" y="160" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">reject(reason)</text>
  <text x="460" y="174" text-anchor="middle" font-size="9" fill="#b85450">首拒即拒，不等其它</text>

  <!-- Bottom note -->
  <rect x="40" y="352" width="480" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="370" text-anchor="middle" font-size="11" fill="#333">不串行 await：所有 promise 同时发起，谁先完成谁先落位</text>
  <text x="280" y="384" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">落位靠「索引」、收尾靠「计数器」、出错靠「首拒即拒」</text>
</svg>
