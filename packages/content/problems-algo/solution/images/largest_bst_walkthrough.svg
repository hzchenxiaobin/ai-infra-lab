<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="430" fill="#fafafa"/>
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：root = [10,5,15,1,8,null,7]</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">后序顺序：1 → 8 → 5 → 7 → 15 → 10</text>

  <!-- ========= table ========= -->
  <!-- column x positions: 步骤44, 节点120, 左子返回200, 右子返回300, 判定400, 当前返回500, maxSize580 -->
  <!-- widths: 44, 76, 100, 100, 100, 80, 60  -> ends at 560; let me shift to start at 20 -->
  <!-- start x=20: 步骤[20,64], 节点[64,140], 左[140,244], 右[244,348], 判定[348,468], 返回[468,548], max[548,580] -->

  <!-- header row -->
  <rect x="20" y="60" width="560" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="64"  y1="60" x2="64"  y2="92" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="140" y1="60" x2="140" y2="92" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="244" y1="60" x2="244" y2="92" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="348" y1="60" x2="348" y2="92" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="468" y1="60" x2="468" y2="92" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="42"  y="80" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">步骤</text>
  <text x="102" y="80" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">后序节点</text>
  <text x="192" y="80" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">左子返回</text>
  <text x="296" y="80" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">右子返回</text>
  <text x="408" y="80" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">BST 判定</text>
  <text x="508" y="80" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">当前返回</text>
  <text x="564" y="80" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">maxSize</text>

  <!-- row 1: leaf 1 -->
  <rect x="20" y="92" width="560" height="40" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="42"  y="116" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">①</text>
  <text x="102" y="116" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">叶 1</text>
  <text x="192" y="116" text-anchor="middle" font-size="10" fill="#888">(∞,-∞,0)</text>
  <text x="296" y="116" text-anchor="middle" font-size="10" fill="#888">(∞,-∞,0)</text>
  <text x="408" y="116" text-anchor="middle" font-size="10" fill="#4a7a3a">-∞&lt;1&lt;∞ ✓</text>
  <text x="508" y="116" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">(1,1,1)</text>
  <text x="564" y="116" text-anchor="middle" font-size="11" fill="#555">1</text>

  <!-- row 2: leaf 8 -->
  <rect x="20" y="132" width="560" height="40" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="42"  y="156" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">②</text>
  <text x="102" y="156" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">叶 8</text>
  <text x="192" y="156" text-anchor="middle" font-size="10" fill="#888">(∞,-∞,0)</text>
  <text x="296" y="156" text-anchor="middle" font-size="10" fill="#888">(∞,-∞,0)</text>
  <text x="408" y="156" text-anchor="middle" font-size="10" fill="#4a7a3a">-∞&lt;8&lt;∞ ✓</text>
  <text x="508" y="156" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">(8,8,1)</text>
  <text x="564" y="156" text-anchor="middle" font-size="11" fill="#555">1</text>

  <!-- row 3: node 5 (HIGHLIGHT - largest BST) -->
  <rect x="20" y="172" width="560" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="42"  y="196" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">③</text>
  <text x="102" y="196" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">节点 5</text>
  <text x="192" y="196" text-anchor="middle" font-size="10" fill="#4a7a3a">(1,1,1)</text>
  <text x="296" y="196" text-anchor="middle" font-size="10" fill="#4a7a3a">(8,8,1)</text>
  <text x="408" y="196" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1&lt;5&lt;8 ✓</text>
  <text x="508" y="196" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">(1,8,3)</text>
  <text x="564" y="196" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>

  <!-- row 4: leaf 7 -->
  <rect x="20" y="212" width="560" height="40" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="42"  y="236" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">④</text>
  <text x="102" y="236" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">叶 7</text>
  <text x="192" y="236" text-anchor="middle" font-size="10" fill="#888">(∞,-∞,0)</text>
  <text x="296" y="236" text-anchor="middle" font-size="10" fill="#888">(∞,-∞,0)</text>
  <text x="408" y="236" text-anchor="middle" font-size="10" fill="#4a7a3a">-∞&lt;7&lt;∞ ✓</text>
  <text x="508" y="236" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">(7,7,1)</text>
  <text x="564" y="236" text-anchor="middle" font-size="11" fill="#555">3</text>

  <!-- row 5: node 15 (NOT BST, key step) -->
  <rect x="20" y="252" width="560" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="42"  y="276" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⑤</text>
  <text x="102" y="276" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">节点 15</text>
  <text x="192" y="276" text-anchor="middle" font-size="10" fill="#888">(∞,-∞,0)</text>
  <text x="296" y="276" text-anchor="middle" font-size="10" fill="#446688">(7,7,1)</text>
  <text x="408" y="276" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">15&lt;7? ❌</text>
  <text x="508" y="276" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">(0,0,-1)</text>
  <text x="564" y="276" text-anchor="middle" font-size="11" fill="#555">3</text>

  <!-- row 6: root 10 -->
  <rect x="20" y="292" width="560" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="42"  y="316" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⑥</text>
  <text x="102" y="316" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">根 10</text>
  <text x="192" y="316" text-anchor="middle" font-size="10" fill="#4a7a3a">(1,8,3)</text>
  <text x="296" y="316" text-anchor="middle" font-size="10" fill="#b85450">(0,0,-1)</text>
  <text x="408" y="316" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">rsize=-1 ❌</text>
  <text x="508" y="316" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">(0,0,-1)</text>
  <text x="564" y="316" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>

  <!-- column dividers for body -->
  <g stroke="#ddd" stroke-width="1" filter="url(#rough2)">
    <line x1="64"  y1="92" x2="64"  y2="332"/>
    <line x1="140" y1="92" x2="140" y2="332"/>
    <line x1="244" y1="92" x2="244" y2="332"/>
    <line x1="348" y1="92" x2="348" y2="332"/>
    <line x1="468" y1="92" x2="468" y2="332"/>
  </g>

  <!-- key annotations -->
  <rect x="20" y="348" width="270" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="34" y="366" font-size="10" fill="#4a7a3a" font-weight="bold">③ 是答案所在：</text>
  <text x="34" y="380" font-size="9.5" fill="#555">左右均 BST 且 1&lt;5&lt;8，合成 size=3</text>

  <rect x="310" y="348" width="270" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="324" y="366" font-size="10" fill="#b85450" font-weight="bold">⑤⑥ 是关键传播：</text>
  <text x="324" y="380" font-size="9.5" fill="#555">15 违反值域 → 哨兵 -1 传至根 10</text>
</svg>
