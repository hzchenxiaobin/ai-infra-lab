<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">为什么只追踪 max 不够？负数让 min 翻身成 max</text>

  <!-- ===== Left: grid with values ===== -->
  <text x="120" y="52" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">网格 grid（3×2）</text>

  <!-- grid cells -->
  <rect x="60" y="65" width="40" height="35" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="87" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <rect x="100" y="65" width="40" height="35" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="87" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−2</text>

  <rect x="60" y="100" width="40" height="35" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="122" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <rect x="100" y="100" width="40" height="35" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="122" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−4</text>

  <rect x="60" y="135" width="40" height="35" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="157" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>

  <rect x="100" y="135" width="40" height="35" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="157" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−6</text>

  <!-- highlight cell (1,1) -->
  <rect x="98" y="98" width="44" height="39" fill="none" stroke="#d6a040" stroke-width="2.5" rx="6" filter="url(#rough2)"/>

  <!-- arrows for two paths into (1,1) -->
  <path d="M 120 100 L 120 105" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 100 117 L 105 117" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="120" y="190" text-anchor="middle" font-size="10" fill="#888">终点 −6 是负数</text>

  <!-- arrow to right panel -->
  <path d="M 175 115 L 215 115" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="195" y="108" text-anchor="middle" font-size="10" fill="#888">DP</text>

  <!-- ===== Right: dp_max and dp_min tables ===== -->
  <text x="370" y="52" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">dp_max（只存最大积）</text>

  <!-- dp_max grid -->
  <rect x="310" y="65" width="40" height="35" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="87" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>

  <rect x="350" y="65" width="40" height="35" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="87" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">−2</text>

  <rect x="310" y="100" width="40" height="35" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="122" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>

  <rect x="350" y="100" width="40" height="35" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="370" y="122" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">8</text>

  <rect x="310" y="135" width="40" height="35" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="157" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">15</text>

  <rect x="350" y="135" width="40" height="35" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="157" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−48</text>

  <!-- annotation on dp_max final -->
  <text x="395" y="155" font-size="9" fill="#b85450">← max·(−6)</text>

  <text x="370" y="190" text-anchor="middle" font-size="10" fill="#b85450">只用 max → 终点 = −48 ❌</text>

  <!-- ===== Far right: dp_min ===== -->
  <text x="490" y="52" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">dp_min（还要存最小积）</text>

  <rect x="430" y="65" width="40" height="35" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="450" y="87" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>

  <rect x="470" y="65" width="40" height="35" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="490" y="87" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">−2</text>

  <rect x="430" y="100" width="40" height="35" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="450" y="122" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>

  <rect x="470" y="100" width="40" height="35" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="490" y="122" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">−12</text>

  <rect x="430" y="135" width="40" height="35" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="450" y="157" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">15</text>

  <rect x="470" y="135" width="40" height="35" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="490" y="157" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">72</text>

  <!-- annotation -->
  <text x="515" y="155" font-size="9" fill="#4a7a3a">← min·(−6)</text>
  <path d="M 510 150 L 510 130" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="490" y="190" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">用 min → 终点 = 72 ✅</text>

  <!-- ===== Bottom note ===== -->
  <rect x="40" y="215" width="480" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="237" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">关键观察：负数格让符号翻转</text>
  <text x="280" y="255" text-anchor="middle" font-size="11" fill="#555">到 (1,1) 的最小积 −12（路径 1→3→−4），乘终点 −6 后翻身变最大积 72</text>

  <!-- ===== Bottom: DP recurrence ===== -->
  <rect x="40" y="280" width="480" height="85" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="302" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">DP 状态：每个格子存一对 (max, min)</text>
  <text x="280" y="322" text-anchor="middle" font-size="11" fill="#555">候选 = 上方和左方格子的 max、min 各乘 grid[i][j]</text>
  <text x="280" y="340" text-anchor="middle" font-size="11" fill="#555">dp_max[i][j] = max(候选四个值)，dp_min[i][j] = min(候选四个值)</text>
  <text x="280" y="358" text-anchor="middle" font-size="10" fill="#888">负数 × 负数 = 正数 → 最小积可能翻身变最大积</text>
</svg>
