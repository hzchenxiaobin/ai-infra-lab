<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：maxHeights = [6,5,3,9,2,7]</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">left 从左往右递推，right 从右往左递推，最后逐位合并取最大</text>

  <!-- row 1: maxHeights -->
  <text x="150" y="85" text-anchor="end" font-size="12" fill="#555" filter="url(#rough2)">maxHeights</text>
  <rect x="164" y="62" width="54" height="38" fill="#f0f0f0" stroke="#999999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="191" y="86" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <rect x="224" y="62" width="54" height="38" fill="#f0f0f0" stroke="#999999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="251" y="86" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="284" y="62" width="54" height="38" fill="#f0f0f0" stroke="#999999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="311" y="86" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="344" y="62" width="54" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="371" y="86" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">9</text>
  <rect x="404" y="62" width="54" height="38" fill="#f0f0f0" stroke="#999999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="431" y="86" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="464" y="62" width="54" height="38" fill="#f0f0f0" stroke="#999999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="491" y="86" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>

  <!-- indices -->
  <text x="191" y="116" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="251" y="116" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="311" y="116" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="371" y="116" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="431" y="116" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>
  <text x="491" y="116" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">5</text>

  <!-- row 2: left -->
  <text x="150" y="153" text-anchor="end" font-size="12" fill="#446688" filter="url(#rough2)">left[]</text>
  <rect x="164" y="130" width="54" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="191" y="154" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <rect x="224" y="130" width="54" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="251" y="154" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">10</text>
  <rect x="284" y="130" width="54" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="311" y="154" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>
  <rect x="344" y="130" width="54" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="371" y="154" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">18</text>
  <rect x="404" y="130" width="54" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="431" y="154" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">10</text>
  <rect x="464" y="130" width="54" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="491" y="154" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">17</text>

  <!-- row 3: right -->
  <text x="150" y="211" text-anchor="end" font-size="12" fill="#4a7a3a" filter="url(#rough2)">right[]</text>
  <rect x="164" y="188" width="54" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="191" y="212" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">21</text>
  <rect x="224" y="188" width="54" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="251" y="212" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">15</text>
  <rect x="284" y="188" width="54" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="311" y="212" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">10</text>
  <rect x="344" y="188" width="54" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="371" y="212" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">13</text>
  <rect x="404" y="188" width="54" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="431" y="212" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="464" y="188" width="54" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="491" y="212" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>

  <!-- row 4: combine -->
  <text x="150" y="269" text-anchor="end" font-size="12" fill="#8a6420" filter="url(#rough2)">left+right−h</text>
  <rect x="164" y="246" width="54" height="38" fill="#f0f0f0" stroke="#999999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="191" y="270" text-anchor="middle" font-size="13" fill="#777" filter="url(#rough2)">21</text>
  <rect x="224" y="246" width="54" height="38" fill="#f0f0f0" stroke="#999999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="251" y="270" text-anchor="middle" font-size="13" fill="#777" filter="url(#rough2)">20</text>
  <rect x="284" y="246" width="54" height="38" fill="#f0f0f0" stroke="#999999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="311" y="270" text-anchor="middle" font-size="13" fill="#777" filter="url(#rough2)">16</text>
  <rect x="344" y="246" width="54" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="371" y="270" text-anchor="middle" font-size="14" fill="#8a6420" font-weight="bold" filter="url(#rough2)">22</text>
  <rect x="404" y="246" width="54" height="38" fill="#f0f0f0" stroke="#999999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="431" y="270" text-anchor="middle" font-size="13" fill="#777" filter="url(#rough2)">12</text>
  <rect x="464" y="246" width="54" height="38" fill="#f0f0f0" stroke="#999999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="491" y="270" text-anchor="middle" font-size="13" fill="#777" filter="url(#rough2)">17</text>

  <!-- notes -->
  <text x="310" y="306" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">left[3] = left[2] + 9×(3−2) = 18；left[4]：左侧无更小 → [0..4] 整段压平 2×5 = 10</text>
  <text x="310" y="324" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">right[3] = right[4] + 9×(4−3) = 13</text>

  <!-- conclusion -->
  <rect x="70" y="340" width="480" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="364" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">最优峰值 i = 3：18 + 13 − 9 = 22</text>
  <text x="310" y="384" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">对应 heights = [3,3,3,9,2,2] ✓</text>
</svg>
