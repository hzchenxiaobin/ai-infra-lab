<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="880" height="540" fill="#fdfcf7"/>
  <text x="440" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">无向图连通性 = source 的连通分量是否含 destination</text>
  <path d="M 300 40 Q 440 48 580 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== LEFT: example 1 — connected ===== -->
  <g filter="url(#sk)">
    <rect x="24" y="66" width="400" height="450" rx="10" fill="#eef6ef" stroke="#4a7e4a" stroke-width="1.6"/>
  </g>
  <text x="224" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">① 示例 1：连通图，0 → 2 有路径</text>

  <!-- triangle edges -->
  <path d="M 180 194 L 118 300" stroke="#446688" stroke-width="2" fill="none" filter="url(#sk)"/>
  <path d="M 118 318 L 250 318" stroke="#446688" stroke-width="2" fill="none" filter="url(#sk)"/>
  <path d="M 250 300 L 180 194" stroke="#446688" stroke-width="2" fill="none" filter="url(#sk)"/>

  <!-- BFS highlight path 0 -> 2 -->
  <path d="M 180 194 L 250 300" stroke="#4a8e4a" stroke-width="3.2" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>

  <!-- node 0 = source -->
  <g filter="url(#sk)">
    <circle cx="180" cy="180" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="2.4"/>
  </g>
  <text x="180" y="186" text-anchor="middle" font-size="16" font-weight="bold" fill="#34506e">0</text>
  <text x="180" y="148" text-anchor="middle" font-size="10.5" fill="#34506e">source</text>

  <!-- node 1 -->
  <g filter="url(#sk)">
    <circle cx="110" cy="320" r="26" fill="#fff" stroke="#7f9cc0" stroke-width="1.6"/>
  </g>
  <text x="110" y="326" text-anchor="middle" font-size="16" fill="#34506e">1</text>

  <!-- node 2 = destination -->
  <g filter="url(#sk)">
    <circle cx="260" cy="320" r="26" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2.6"/>
  </g>
  <text x="260" y="326" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e">2</text>
  <text x="260" y="358" text-anchor="middle" font-size="10.5" fill="#2e6e2e">dest</text>

  <!-- result box -->
  <g filter="url(#sk)">
    <rect x="44" y="380" width="360" height="86" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="224" y="406" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e">同一连通分量 → 有路径</text>
  <text x="224" y="430" text-anchor="middle" font-size="11.5" fill="#3a6a3a">BFS 从 0 出发，邻居中发现 2</text>
  <text x="224" y="450" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">→ 返回 true ✓</text>

  <!-- ===== RIGHT: example 2 — disconnected ===== -->
  <g filter="url(#sk)">
    <rect x="444" y="66" width="412" height="450" rx="10" fill="#fdecee" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="650" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450">② 示例 2：非连通图，0 → 5 无路径</text>

  <!-- component A edges -->
  <path d="M 540 194 L 488 300" stroke="#446688" stroke-width="2" fill="none" filter="url(#sk)"/>
  <path d="M 540 194 L 592 300" stroke="#446688" stroke-width="2" fill="none" filter="url(#sk)"/>

  <!-- component B edges (triangle) -->
  <path d="M 770 194 L 718 300" stroke="#446688" stroke-width="2" fill="none" filter="url(#sk)"/>
  <path d="M 718 318 L 822 318" stroke="#446688" stroke-width="2" fill="none" filter="url(#sk)"/>
  <path d="M 822 300 L 770 194" stroke="#446688" stroke-width="2" fill="none" filter="url(#sk)"/>

  <!-- dashed separator between components -->
  <path d="M 660 150 L 660 340" stroke="#b85450" stroke-width="1.4" stroke-dasharray="6 5" fill="none" filter="url(#sk)"/>
  <text x="660" y="146" text-anchor="middle" font-size="10.5" fill="#b85450">无边相连</text>

  <!-- component A: node 0 = source -->
  <g filter="url(#sk)">
    <circle cx="540" cy="180" r="26" fill="#e8f0fe" stroke="#446688" stroke-width="2.4"/>
  </g>
  <text x="540" y="186" text-anchor="middle" font-size="16" font-weight="bold" fill="#34506e">0</text>
  <text x="540" y="148" text-anchor="middle" font-size="10.5" fill="#34506e">source</text>
  <!-- node 1 -->
  <g filter="url(#sk)">
    <circle cx="480" cy="320" r="24" fill="#fff" stroke="#7f9cc0" stroke-width="1.6"/>
  </g>
  <text x="480" y="326" text-anchor="middle" font-size="15" fill="#34506e">1</text>
  <!-- node 2 -->
  <g filter="url(#sk)">
    <circle cx="600" cy="320" r="24" fill="#fff" stroke="#7f9cc0" stroke-width="1.6"/>
  </g>
  <text x="600" y="326" text-anchor="middle" font-size="15" fill="#34506e">2</text>

  <!-- component B: node 3 -->
  <g filter="url(#sk)">
    <circle cx="770" cy="180" r="24" fill="#fff" stroke="#7f9cc0" stroke-width="1.6"/>
  </g>
  <text x="770" y="186" text-anchor="middle" font-size="15" fill="#34506e">3</text>
  <!-- node 4 -->
  <g filter="url(#sk)">
    <circle cx="710" cy="320" r="24" fill="#fff" stroke="#7f9cc0" stroke-width="1.6"/>
  </g>
  <text x="710" y="326" text-anchor="middle" font-size="15" fill="#34506e">4</text>
  <!-- node 5 = destination -->
  <g filter="url(#sk)">
    <circle cx="830" cy="320" r="26" fill="#fdecee" stroke="#b85450" stroke-width="2.6"/>
  </g>
  <text x="830" y="326" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450">5</text>
  <text x="830" y="358" text-anchor="middle" font-size="10.5" fill="#b85450">dest</text>

  <!-- cross X : unreachable -->
  <path d="M 566 196 L 804 308" stroke="#b85450" stroke-width="2" stroke-dasharray="8 6" fill="none" filter="url(#sk)"/>
  <text x="685" y="244" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">✗ 跨分量不可达</text>

  <!-- result box -->
  <g filter="url(#sk)">
    <rect x="470" y="380" width="362" height="86" rx="8" fill="#fdecee" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="651" y="406" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">不同连通分量 → 无路径</text>
  <text x="651" y="430" text-anchor="middle" font-size="11.5" fill="#8a3a3a">BFS 遍历完 {0,1,2} 也遇不到 5</text>
  <text x="651" y="450" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">→ 返回 false ✗</text>

  <!-- bottom key insight -->
  <text x="440" y="528" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">无向图两点有路径 ⇔ 同属一个连通分量 —— BFS/DFS 遍历 source 的连通分量即可判定</text>
</svg>
