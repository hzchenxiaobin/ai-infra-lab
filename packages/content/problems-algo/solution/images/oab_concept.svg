<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">Bigram 分词：三元滑动窗口</text>

  <!-- Panel A: target pattern -->
  <rect x="24" y="44" width="512" height="78" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">目标模式：first  second  third</text>
  <rect x="96" y="78" width="86" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="139" y="98" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">first</text>
  <rect x="196" y="78" width="86" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="239" y="98" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">second</text>
  <rect x="296" y="78" width="86" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="339" y="98" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">third</text>
  <text x="396" y="98" font-size="11" fill="#555">← 待收集</text>

  <!-- Panel B: sliding window over word array -->
  <rect x="24" y="138" width="512" height="194" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="160" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">在单词数组上滑动窗口 [i, i+1, i+2]</text>

  <!-- word boxes: we will we will rock you -->
  <text x="32" y="194" font-size="11" fill="#888">words</text>
  <rect x="48" y="180" width="58" height="26" fill="#fff" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="77" y="198" text-anchor="middle" font-size="11" fill="#333">we</text>
  <rect x="116" y="180" width="58" height="26" fill="#fff" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="145" y="198" text-anchor="middle" font-size="11" fill="#333">will</text>
  <rect x="184" y="180" width="58" height="26" fill="#fff" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="213" y="198" text-anchor="middle" font-size="11" fill="#333">we</text>
  <rect x="252" y="180" width="58" height="26" fill="#fff" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="281" y="198" text-anchor="middle" font-size="11" fill="#333">will</text>
  <rect x="320" y="180" width="58" height="26" fill="#fff" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="349" y="198" text-anchor="middle" font-size="11" fill="#333">rock</text>
  <rect x="388" y="180" width="58" height="26" fill="#fff" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="417" y="198" text-anchor="middle" font-size="11" fill="#333">you</text>

  <!-- window i=0 bracket: covers boxes 0,1,2 -> x 46..244 -->
  <path d="M 48 224 L 48 216 L 244 216 L 244 224" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <line x1="146" y1="216" x2="146" y2="226" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="146" y="244" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">i=0：we==first ∧ will==second</text>
  <text x="146" y="258" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">→ 收集 third = "we"</text>

  <!-- window i=2 bracket: covers boxes 2,3,4 -> x 182..380 -->
  <path d="M 184 290 L 184 282 L 380 282 L 380 290" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <line x1="282" y1="282" x2="282" y2="272" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="308" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">i=2：we==first ∧ will==second</text>
  <text x="282" y="322" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">→ 收集 third = "rock"</text>

  <!-- insight strip -->
  <rect x="24" y="340" width="512" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="351" text-anchor="middle" font-size="10" fill="#555">前两位匹配即取第三位，窗口允许重叠（i=0 与 i=2 共用下标 2）</text>
</svg>
