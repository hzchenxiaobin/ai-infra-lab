<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="500" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：递归分治 + 组合数预计算</text>

  <!-- Start: numOfWays -->
  <rect x="195" y="40" width="150" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="60" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">numOfWays(nums)</text>

  <path d="M 270 70 L 270 86" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 1: Precompute factorials -->
  <rect x="150" y="88" width="240" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="270" y="108" text-anchor="middle" font-size="11" fill="#333">预计算 fact[] 和 invFact[]（费马小定理求逆元）</text>

  <path d="M 270 118 L 270 134" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 2: Call dfs -->
  <rect x="170" y="136" width="200" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="270" y="156" text-anchor="middle" font-size="11" fill="#333">ans = dfs(nums)</text>

  <path d="M 270 166 L 270 182" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Decision: len <= 1? -->
  <polygon points="270,184 360,212 270,240 180,212" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="210" text-anchor="middle" font-size="11" fill="#444">len(nums)</text>
  <text x="270" y="224" text-anchor="middle" font-size="11" fill="#444">≤ 1?</text>

  <!-- Yes -> return 1 -->
  <path d="M 360 212 L 398 212" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="376" y="206" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>
  <rect x="400" y="196" width="110" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="455" y="216" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return 1</text>

  <!-- No -> partition -->
  <path d="M 270 240 L 270 256" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="282" y="252" font-size="10" fill="#b85450">否</text>

  <!-- Partition step -->
  <rect x="120" y="258" width="300" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="270" y="278" text-anchor="middle" font-size="10" fill="#333">root = nums[0]; left = [x &lt; root]; right = [x &gt; root]</text>

  <path d="M 270 288 L 270 304" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Compute C(l+r, l) -->
  <rect x="130" y="306" width="280" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="270" y="326" text-anchor="middle" font-size="11" fill="#333">ways = C(l+r, l)   （组合数查表）</text>

  <path d="M 270 336 L 270 352" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Recurse left -->
  <rect x="110" y="354" width="160" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="190" y="372" text-anchor="middle" font-size="10" fill="#4a7a3a">ways *= dfs(left)</text>

  <!-- Recurse right -->
  <rect x="290" y="354" width="160" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="370" y="372" text-anchor="middle" font-size="10" fill="#d6a040">ways *= dfs(right)</text>

  <path d="M 190 382 L 190 396" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 370 382 L 370 396" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 190 396 L 370 396" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 270 396 L 270 408" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Return ways -->
  <rect x="180" y="410" width="180" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="430" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return ways % MOD</text>

  <path d="M 270 440 L 270 456" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Final answer -->
  <rect x="150" y="458" width="240" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="478" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return (ans - 1 + MOD) % MOD</text>
</svg>
