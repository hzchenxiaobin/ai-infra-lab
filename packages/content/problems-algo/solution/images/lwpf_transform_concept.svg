<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：>8 记 +1、其余记 −1，转化为「子和 > 0」</text>

  <!-- hours row -->
  <text x="40" y="74" font-size="12" fill="#888">hours:</text>
  <rect x="92" y="58" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="114" y="78" text-anchor="middle" font-size="12" fill="#333">9</text>
  <rect x="136" y="58" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="158" y="78" text-anchor="middle" font-size="12" fill="#333">9</text>
  <rect x="180" y="58" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="78" text-anchor="middle" font-size="12" fill="#333">6</text>
  <rect x="224" y="58" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="246" y="78" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="268" y="58" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="78" text-anchor="middle" font-size="12" fill="#333">6</text>
  <rect x="312" y="58" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="334" y="78" text-anchor="middle" font-size="12" fill="#333">6</text>
  <rect x="356" y="58" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="378" y="78" text-anchor="middle" font-size="12" fill="#333">9</text>

  <!-- transform arrows -->
  <path d="M 114 90 L 114 106" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 158 90 L 158 106" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 202 90 L 202 106" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 246 90 L 246 106" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 290 90 L 290 106" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 334 90 L 334 106" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 378 90 L 378 106" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <rect x="392" y="86" width="116" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="450" y="101" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">>8→+1，≤8→−1</text>

  <!-- transformed row -->
  <text x="32" y="128" font-size="12" fill="#888">变换后:</text>
  <rect x="92" y="112" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="114" y="132" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">+1</text>
  <rect x="136" y="112" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="158" y="132" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">+1</text>
  <rect x="180" y="112" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="202" y="132" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">−1</text>
  <rect x="224" y="112" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="246" y="132" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">−1</text>
  <rect x="268" y="112" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="132" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">−1</text>
  <rect x="312" y="112" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="334" y="132" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">−1</text>
  <rect x="356" y="112" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="378" y="132" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">+1</text>

  <!-- bracket spanning [9,9,6] = +1,+1,-1, sum = +1 > 0 -->
  <path d="M 96 150 Q 96 158 104 158 L 200 158 Q 208 158 208 150" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="152" y="152" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">[9,9,6]：2 劳累 &gt; 1 非劳累，和 +1&gt;0</text>

  <!-- equation box -->
  <rect x="36" y="172" width="448" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="194" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">劳累日数 &gt; 非劳累日数  ⇔  变换后子和 &gt; 0</text>
  <text x="260" y="216" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">⇔  prefix[j] − prefix[i] &gt; 0  ⇔  prefix[i] &lt; prefix[j]</text>

  <!-- generalization: longest j-i with prefix[i] < prefix[j] -->
  <rect x="36" y="240" width="448" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="262" text-anchor="middle" font-size="12" fill="#333">求「最长」→ 哈希表存每个前缀和的「最早下标」</text>
  <text x="260" y="280" text-anchor="middle" font-size="11.5" fill="#4a7a3a">命中即得长度 i − first[v]，取最大</text>

  <!-- lemma box: check score-1 -->
  <rect x="36" y="306" width="448" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="328" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">关键引理：前缀和每步 ±1</text>
  <text x="260" y="346" text-anchor="middle" font-size="11.5" fill="#444">最早「跌破 score」的位置必落在 score−1，故只需查 seen[score−1]</text>
  <text x="260" y="362" text-anchor="middle" font-size="10.5" fill="#888">score&gt;0 时整段前缀即合法，ans = i+1</text>
</svg>
