<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="18" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：n = 9 的 3×3 网格（官方示例 3）</text>

  <!-- 左侧步骤 -->
  <rect x="16" y="40" width="236" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="26" y="59" font-size="9.5" fill="#33506b" filter="url(#rough2)">① 度为 2 的：{1, 3, 5, 8}（四角）；取 c = 1</text>

  <rect x="16" y="78" width="236" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="26" y="96" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">② 邻居 a = 0、b = 7；d = 4（a、b 公共邻居）</text>
  <text x="26" y="112" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">row0 = [1, 0]，row1 = [7, 4]</text>

  <rect x="16" y="130" width="236" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="26" y="148" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">③ deg(0) = 3：右伸 adj(0) − {1,4} = {5}</text>
  <text x="26" y="164" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">下配 adj(5) ∩ adj(4) − {0} = {2}</text>

  <rect x="16" y="182" width="236" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="26" y="201" font-size="9.5" fill="#a07830" filter="url(#rough2)">④ deg(5) = 2 到右上角 ⇒ C = 3，R = 9/3 = 3</text>

  <rect x="16" y="220" width="236" height="74" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="26" y="238" font-size="9" fill="#33506b" filter="url(#rough2)">⑤ 递推第 2 行（i = 2）：</text>
  <text x="26" y="254" font-size="9" fill="#33506b" filter="url(#rough2)">w0 = adj(7) − {1,4} = {8}</text>
  <text x="26" y="270" font-size="9" fill="#33506b" filter="url(#rough2)">w1 = adj(8) ∩ adj(4) − {7} = {6}</text>
  <text x="26" y="286" font-size="9" fill="#33506b" filter="url(#rough2)">w2 = adj(6) ∩ adj(2) − {4} = {3}</text>

  <rect x="16" y="302" width="236" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" rx="6" filter="url(#rough2)"/>
  <text x="26" y="320" font-size="9" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">⑥ 输出 [[1,0,5],[7,4,2],[8,6,3]] ✓</text>
  <text x="26" y="336" font-size="9" fill="#8a3a34" filter="url(#rough2)">与官方 [[8,6,3],[7,4,2],[1,0,5]] 恰为</text>
  <text x="26" y="350" font-size="9" fill="#8a3a34" filter="url(#rough2)">上下镜像 —— 同样合法</text>

  <!-- 右侧 3×3 网格，格子 58×58，起点 (300,52) -->
  <text x="329" y="46" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">列 0</text>
  <text x="387" y="46" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">列 1</text>
  <text x="445" y="46" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">列 2</text>
  <text x="292" y="84" text-anchor="end" font-size="8.5" fill="#888" filter="url(#rough2)">行 0</text>
  <text x="292" y="142" text-anchor="end" font-size="8.5" fill="#888" filter="url(#rough2)">行 1</text>
  <text x="292" y="200" text-anchor="end" font-size="8.5" fill="#888" filter="url(#rough2)">行 2</text>

  <!-- 行 0 -->
  <rect x="300" y="52" width="58" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="329" y="87" text-anchor="middle" font-size="17" fill="#a07830" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="329" y="101" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">c</text>
  <text x="348" y="64" text-anchor="middle" font-size="8.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">②</text>

  <rect x="358" y="52" width="58" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="387" y="87" text-anchor="middle" font-size="17" fill="#a07830" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="387" y="101" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">a</text>
  <text x="406" y="64" text-anchor="middle" font-size="8.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">②</text>

  <rect x="416" y="52" width="58" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="445" y="87" text-anchor="middle" font-size="17" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="464" y="64" text-anchor="middle" font-size="8.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">③</text>

  <!-- 行 1 -->
  <rect x="300" y="110" width="58" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="329" y="145" text-anchor="middle" font-size="17" fill="#a07830" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="329" y="159" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">b</text>
  <text x="348" y="122" text-anchor="middle" font-size="8.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">②</text>

  <rect x="358" y="110" width="58" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="387" y="145" text-anchor="middle" font-size="17" fill="#a07830" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="387" y="159" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">d</text>
  <text x="406" y="122" text-anchor="middle" font-size="8.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">②</text>

  <rect x="416" y="110" width="58" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="445" y="145" text-anchor="middle" font-size="17" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="464" y="122" text-anchor="middle" font-size="8.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">③</text>

  <!-- 行 2 -->
  <rect x="300" y="168" width="58" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="329" y="203" text-anchor="middle" font-size="17" fill="#33506b" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="348" y="180" text-anchor="middle" font-size="8.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">⑤</text>

  <rect x="358" y="168" width="58" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="387" y="203" text-anchor="middle" font-size="17" fill="#33506b" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="406" y="180" text-anchor="middle" font-size="8.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">⑤</text>

  <rect x="416" y="168" width="58" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="445" y="203" text-anchor="middle" font-size="17" fill="#33506b" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="464" y="180" text-anchor="middle" font-size="8.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">⑤</text>

  <!-- 游走箭头 -->
  <path d="M 341 75 L 373 75" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 399 75 L 431 75" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 341 133 L 373 133" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 399 133 L 431 133" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 341 191 L 373 191" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 399 191 L 431 191" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <text x="387" y="244" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">橙 = 步骤② · 绿 = 步骤③ · 蓝 = 步骤⑤</text>
  <text x="387" y="258" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">格内小圈号 = 填入步骤</text>

  <rect x="292" y="268" width="192" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" rx="8" filter="url(#rough2)"/>
  <text x="388" y="286" text-anchor="middle" font-size="9" fill="#7a5a20" filter="url(#rough2)">每步都在 ≤ 4 的邻居集上做</text>
  <text x="388" y="300" text-anchor="middle" font-size="9" fill="#7a5a20" filter="url(#rough2)">「排除已知 + 求公共邻居」</text>
  <text x="388" y="314" text-anchor="middle" font-size="9" fill="#7a5a20" filter="url(#rough2)">候选唯一 ⇒ 全程无回溯</text>
</svg>
