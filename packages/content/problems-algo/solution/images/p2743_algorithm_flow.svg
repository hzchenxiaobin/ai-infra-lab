<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：滑动窗口 + 逐 right 累加计数</text>

  <!-- Init -->
  <rect x="190" y="44" width="180" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">初始化：left=0, ans=0, pos={}</text>
  <path d="M 280 82 L 280 98" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- For loop header -->
  <rect x="160" y="102" width="240" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="126" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">for right = 0 … n−1</text>
  <path d="M 280 140 L 280 156" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Process: record position / check duplicate -->
  <rect x="140" y="160" width="280" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="178" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">若 pos[s[right]] ≥ left</text>
  <text x="280" y="193" text-anchor="middle" font-size="11" fill="#666">→ left = pos[s[right]] + 1  （跳过旧重复）</text>
  <path d="M 280 198 L 280 214" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Update pos -->
  <rect x="200" y="218" width="160" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="240" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">pos[s[right]] = right</text>
  <path d="M 280 252 L 280 268" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Accumulate -->
  <rect x="130" y="272" width="300" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="297" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">ans += right − left + 1</text>

  <!-- loop back to for-header (right side) -->
  <path d="M 430 292 L 460 292 L 460 121 L 400 121" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="472" y="210" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">下</text>
  <text x="472" y="222" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">一</text>
  <text x="472" y="234" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">个</text>
  <text x="472" y="246" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">right</text>

  <!-- exit to return -->
  <path d="M 280 312 L 280 328" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="324" font-size="10" fill="#888" font-weight="bold">循环结束</text>

  <!-- Return -->
  <rect x="190" y="332" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="357" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">return ans</text>
</svg>
