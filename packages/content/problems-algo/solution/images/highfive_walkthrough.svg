<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    示例演算
  </text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">
    items = [[1,91],[1,92],[2,93],[2,97],[1,60],[2,77],[1,65],[1,87],[1,100],[2,100],[2,76]]
  </text>

  <!-- Student 1 section -->
  <text x="20" y="76" font-size="13" fill="#446688" filter="url(#rough2)">学生 1</text>

  <!-- Original scores -->
  <text x="20" y="96" font-size="11" fill="#666" filter="url(#rough2)">原始成绩：</text>
  <g filter="url(#rough2)">
    <rect x="100" y="82" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="120" y="98" text-anchor="middle" font-size="11" fill="#333">91</text>
    <rect x="144" y="82" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="164" y="98" text-anchor="middle" font-size="11" fill="#333">92</text>
    <rect x="188" y="82" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="208" y="98" text-anchor="middle" font-size="11" fill="#333">60</text>
    <rect x="232" y="82" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="252" y="98" text-anchor="middle" font-size="11" fill="#333">65</text>
    <rect x="276" y="82" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="296" y="98" text-anchor="middle" font-size="11" fill="#333">87</text>
    <rect x="320" y="82" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="342" y="98" text-anchor="middle" font-size="11" fill="#333">100</text>
  </g>

  <!-- Arrow -->
  <path d="M200,114 L200,134" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr3)" filter="url(#rough2)"/>
  <text x="210" y="128" font-size="10" fill="#888" filter="url(#rough2)">降序排序</text>

  <!-- Sorted -->
  <text x="20" y="150" font-size="11" fill="#666" filter="url(#rough2)">降序排列：</text>
  <g filter="url(#rough2)">
    <rect x="100" y="136" width="44" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <text x="122" y="152" text-anchor="middle" font-size="11" fill="#333">100</text>
    <rect x="148" y="136" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <text x="168" y="152" text-anchor="middle" font-size="11" fill="#333">92</text>
    <rect x="192" y="136" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <text x="212" y="152" text-anchor="middle" font-size="11" fill="#333">91</text>
    <rect x="236" y="136" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <text x="256" y="152" text-anchor="middle" font-size="11" fill="#333">87</text>
    <rect x="280" y="136" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <text x="300" y="152" text-anchor="middle" font-size="11" fill="#333">65</text>
    <rect x="324" y="136" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" opacity="0.5"/>
    <text x="344" y="152" text-anchor="middle" font-size="11" fill="#999">60</text>
  </g>
  <text x="375" y="150" font-size="10" fill="#b85450" filter="url(#rough2)">↑ 前5（红框）</text>

  <!-- Average -->
  <text x="20" y="178" font-size="11" fill="#666" filter="url(#rough2)">求均分：</text>
  <g filter="url(#rough2)">
    <rect x="100" y="166" width="280" height="26" fill="none" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4,3" rx="4"/>
    <text x="240" y="184" text-anchor="middle" font-size="11" fill="#333">(100 + 92 + 91 + 87 + 65) / 5 = 435 / 5 = 87</text>
  </g>
  <rect x="395" y="166" width="70" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="430" y="184" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">→ [1,87]</text>

  <!-- Divider -->
  <line x1="20" y1="206" x2="540" y2="206" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- Student 2 section -->
  <text x="20" y="230" font-size="13" fill="#4a7a3a" filter="url(#rough2)">学生 2</text>

  <!-- Original scores -->
  <text x="20" y="250" font-size="11" fill="#666" filter="url(#rough2)">原始成绩：</text>
  <g filter="url(#rough2)">
    <rect x="100" y="236" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="120" y="252" text-anchor="middle" font-size="11" fill="#333">93</text>
    <rect x="144" y="236" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="164" y="252" text-anchor="middle" font-size="11" fill="#333">97</text>
    <rect x="188" y="236" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="208" y="252" text-anchor="middle" font-size="11" fill="#333">77</text>
    <rect x="232" y="236" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="254" y="252" text-anchor="middle" font-size="11" fill="#333">100</text>
    <rect x="280" y="236" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="300" y="252" text-anchor="middle" font-size="11" fill="#333">76</text>
  </g>

  <!-- Arrow -->
  <path d="M200,268 L200,288" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr3)" filter="url(#rough2)"/>
  <text x="210" y="282" font-size="10" fill="#888" filter="url(#rough2)">降序排序</text>

  <!-- Sorted -->
  <text x="20" y="304" font-size="11" fill="#666" filter="url(#rough2)">降序排列：</text>
  <g filter="url(#rough2)">
    <rect x="100" y="290" width="44" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <text x="122" y="306" text-anchor="middle" font-size="11" fill="#333">100</text>
    <rect x="148" y="290" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <text x="168" y="306" text-anchor="middle" font-size="11" fill="#333">97</text>
    <rect x="192" y="290" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <text x="212" y="306" text-anchor="middle" font-size="11" fill="#333">93</text>
    <rect x="236" y="290" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <text x="256" y="306" text-anchor="middle" font-size="11" fill="#333">77</text>
    <rect x="280" y="290" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <text x="300" y="306" text-anchor="middle" font-size="11" fill="#333">76</text>
  </g>
  <text x="335" y="304" font-size="10" fill="#b85450" filter="url(#rough2)">↑ 恰好5个，全取</text>

  <!-- Average -->
  <text x="20" y="332" font-size="11" fill="#666" filter="url(#rough2)">求均分：</text>
  <g filter="url(#rough2)">
    <rect x="100" y="320" width="280" height="26" fill="none" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4,3" rx="4"/>
    <text x="240" y="338" text-anchor="middle" font-size="11" fill="#333">(100 + 97 + 93 + 77 + 76) / 5 = 443 / 5 = 88</text>
  </g>
  <rect x="395" y="320" width="70" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="430" y="338" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">→ [2,88]</text>

  <!-- Final result -->
  <line x1="20" y1="362" x2="540" y2="362" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="280" y="386" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    按 id 升序输出：[[1, 87], [2, 88]]
  </text>
</svg>
