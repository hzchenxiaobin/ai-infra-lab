<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">
    核心观察：排序后逐位比对
  </text>

  <!-- 图例 -->
  <rect x="380" y="42" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="398" y="53" font-size="10" fill="#555" filter="url(#rough2)">匹配</text>
  <rect x="438" y="42" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="456" y="53" font-size="10" fill="#555" filter="url(#rough2)">不匹配</text>

  <!-- ===== Row 1: heights 原始 ===== -->
  <text x="40" y="102" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">heights</text>
  <text x="40" y="118" font-size="10" fill="#888" filter="url(#rough2)">原始顺序</text>

  <rect x="138" y="86" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="160" y="108" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="186" y="86" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="208" y="108" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="234" y="86" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="256" y="108" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="282" y="86" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="304" y="108" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="330" y="86" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="352" y="108" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="378" y="86" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="400" y="108" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- 索引 -->
  <text x="160" y="138" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="208" y="138" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="256" y="138" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="304" y="138" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>
  <text x="352" y="138" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">4</text>
  <text x="400" y="138" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">5</text>

  <!-- 向下箭头：排序 -->
  <path d="M 280 148 L 280 172" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="166" font-size="11" fill="#888" filter="url(#rough2)">排序</text>

  <!-- ===== Row 2: expected 排序后，按匹配/不匹配着色 ===== -->
  <text x="40" y="198" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">expected</text>
  <text x="40" y="214" font-size="10" fill="#888" filter="url(#rough2)">升序排列</text>

  <!-- idx0: 1==1 匹配 -->
  <rect x="138" y="182" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="204" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <!-- idx1: 1==1 匹配 -->
  <rect x="186" y="182" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="208" y="204" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <!-- idx2: 4!=1 不匹配 -->
  <rect x="234" y="182" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="256" y="204" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <!-- idx3: 2==2 匹配 -->
  <rect x="282" y="182" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="304" y="204" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <!-- idx4: 1!=3 不匹配 -->
  <rect x="330" y="182" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="352" y="204" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <!-- idx5: 3!=4 不匹配 -->
  <rect x="378" y="182" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="400" y="204" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- 不匹配位置的红圈标注 -->
  <text x="256" y="168" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="352" y="168" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="400" y="168" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <!-- 向下箭头：计数 -->
  <path d="M 280 228 L 280 252" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="246" font-size="11" fill="#888" filter="url(#rough2)">计数</text>

  <!-- ===== 结果 ===== -->
  <rect x="138" y="262" width="284" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">
    不匹配数 = 3（索引 2, 4, 5）
  </text>

  <!-- 底部说明 -->
  <rect x="30" y="312" width="500" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="336" text-anchor="middle" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">
    expected 就是 heights 排序后的结果
  </text>
  <text x="280" y="354" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">
    逐位比较 heights[i] 与 expected[i]，不等则计入答案
  </text>
  <text x="280" y="370" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">
    ⚠️ 注意：不是统计「值频次差异」，而是统计「同位置不同值」的个数
  </text>
</svg>
