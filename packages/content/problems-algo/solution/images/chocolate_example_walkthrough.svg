<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：sweetness = [1,2,3,4,5,6,7,8,9], K = 5</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">min=1, sum=45, 需切成 K+1=6 段, 答案区间 [1, 45]</text>

  <!-- ===== Table header ===== -->
  <rect x="30" y="60" width="500" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="77" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">轮次</text>
  <text x="150" y="77" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">[lo, hi]</text>
  <text x="230" y="77" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">mid</text>
  <text x="320" y="77" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">check(mid) 切割结果</text>
  <text x="430" y="77" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">cnt</text>
  <text x="495" y="77" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">动作</text>

  <!-- ===== Row 1 ===== -->
  <rect x="30" y="88" width="500" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="113" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="150" y="113" text-anchor="middle" font-size="11" fill="#333">[1, 45]</text>
  <text x="230" y="113" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">23</text>
  <text x="320" y="108" text-anchor="middle" font-size="10" fill="#666">[1..7]=28✓ [8,9]=17✗</text>
  <text x="320" y="122" text-anchor="middle" font-size="9" fill="#999">末段不足, 不计</text>
  <text x="430" y="113" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="495" y="113" text-anchor="middle" font-size="10" fill="#b85450">✗ hi=22</text>

  <!-- ===== Row 2 ===== -->
  <rect x="30" y="130" width="500" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="155" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="150" y="155" text-anchor="middle" font-size="11" fill="#333">[1, 22]</text>
  <text x="230" y="155" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">11</text>
  <text x="320" y="150" text-anchor="middle" font-size="10" fill="#666">[1..5]=15✓ [6,7]=13✓ [8,9]=17✓</text>
  <text x="320" y="164" text-anchor="middle" font-size="9" fill="#999">三段都达标</text>
  <text x="430" y="155" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="495" y="155" text-anchor="middle" font-size="10" fill="#b85450">✗ hi=10</text>

  <!-- ===== Row 3 (feasible) ===== -->
  <rect x="30" y="172" width="500" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="70" y="197" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="150" y="197" text-anchor="middle" font-size="11" fill="#333">[1, 10]</text>
  <text x="230" y="197" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="320" y="192" text-anchor="middle" font-size="10" fill="#666">[1,2,3]✓[4,5]✓[6]✓[7]✓[8]✓[9]✓</text>
  <text x="320" y="206" text-anchor="middle" font-size="9" fill="#999">每块独立即达标</text>
  <text x="430" y="197" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">6</text>
  <text x="495" y="197" text-anchor="middle" font-size="10" fill="#4a7a3a">✓ ans=5</text>

  <!-- ===== Row 4 ===== -->
  <rect x="30" y="214" width="500" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="239" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="150" y="239" text-anchor="middle" font-size="11" fill="#333">[6, 10]</text>
  <text x="230" y="239" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">8</text>
  <text x="320" y="234" text-anchor="middle" font-size="10" fill="#666">[1..4]=10✓[5,6]=11✓[7,8]=15✓[9]✗</text>
  <text x="320" y="248" text-anchor="middle" font-size="9" fill="#999">末段 9&lt;8 不计</text>
  <text x="430" y="239" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="495" y="239" text-anchor="middle" font-size="10" fill="#b85450">✗ hi=7</text>

  <!-- ===== Row 5 (feasible, answer) ===== -->
  <rect x="30" y="256" width="500" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="281" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="150" y="281" text-anchor="middle" font-size="11" fill="#333">[6, 7]</text>
  <text x="230" y="281" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">6</text>
  <text x="320" y="276" text-anchor="middle" font-size="10" fill="#666">[1,2,3]=6✓[4,5]=9✓[6]✓[7]✓[8]✓[9]✓</text>
  <text x="320" y="290" text-anchor="middle" font-size="9" fill="#999">恰好 6 段, 最小段=6</text>
  <text x="430" y="281" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">6</text>
  <text x="495" y="281" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓ ans=6</text>

  <!-- ===== Row 6 ===== -->
  <rect x="30" y="298" width="500" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="323" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>
  <text x="150" y="323" text-anchor="middle" font-size="11" fill="#333">[7, 7]</text>
  <text x="230" y="323" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>
  <text x="320" y="318" text-anchor="middle" font-size="10" fill="#666">[1..4]=10✓[5,6]=11✓[7]✓[8]✓[9]✓</text>
  <text x="320" y="332" text-anchor="middle" font-size="9" fill="#999">只切出 5 段</text>
  <text x="430" y="323" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5</text>
  <text x="495" y="323" text-anchor="middle" font-size="10" fill="#b85450">✗ hi=6</text>

  <!-- ===== End row ===== -->
  <rect x="30" y="340" width="500" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="280" y="361" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">lo=7 &gt; hi=6, 循环结束 → 返回 ans = 6</text>

  <!-- ===== Bottom note ===== -->
  <rect x="30" y="382" width="500" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="400" text-anchor="middle" font-size="11" fill="#444">最优切割：[1,2,3]·[4,5]·[6]·[7]·[8]·[9]，6 段甜度和 {6,9,6,7,8,9}</text>
  <text x="280" y="416" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">你吃到最小的一块 = 6，这就是能拿到的最大总甜度</text>
</svg>
