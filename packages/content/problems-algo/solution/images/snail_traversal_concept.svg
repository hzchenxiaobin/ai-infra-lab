<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrDown" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto">
      <path d="M 0 0 L 10 0 L 5 10 z" fill="#446688"/>
    </marker>
    <marker id="arrUp" markerWidth="10" markerHeight="10" refX="5" refY="1" orient="auto">
      <path d="M 5 0 L 10 10 L 0 10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrGray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">蜗牛遍历：按列蛇形填，偶数列向下、奇数列向上</text>

  <!-- 1D array strip -->
  <text x="40" y="58" font-size="11" fill="#888">原 1D 数组 nums（按下标顺序依次填入）：</text>
  <g filter="url(#rough2)">
    <rect x="40" y="66" width="520" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
  </g>
  <text x="300" y="84" text-anchor="middle" font-size="11" fill="#446688">19 10 3 7 9 8 5 2 1 17 16 14 12 18 6 13 11 20 4 15</text>
  <text x="44" y="104" font-size="10" fill="#aaa">idx 0 ……………………………………………………… 19</text>

  <!-- arrow down -->
  <path d="M 300 112 L 300 132" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <text x="310" y="126" font-size="10" fill="#888">按蜗牛序逐个写入</text>

  <!-- Grid 5x4: origin gx=140, gy=140; cw=80, ch=44 -->
  <!-- column headers with direction -->
  <text x="180" y="136" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">c=0 ↓</text>
  <text x="260" y="136" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">c=1 ↑</text>
  <text x="340" y="136" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">c=2 ↓</text>
  <text x="420" y="136" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">c=3 ↑</text>

  <!-- direction arrows over columns -->
  <path d="M 180 150 L 180 354" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrDown)" filter="url(#rough2)"/>
  <path d="M 260 354 L 260 150" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrUp)" filter="url(#rough2)"/>
  <path d="M 340 150 L 340 354" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrDown)" filter="url(#rough2)"/>
  <path d="M 420 354 L 420 150" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrUp)" filter="url(#rough2)"/>

  <!-- cells: col center x = 160,240,320,400 ; row center y = 164,208,252,296,340 -->
  <!-- column 0 (even, down): 19,10,3,7,9 -->
  <g filter="url(#rough2)">
    <rect x="140" y="142" width="80" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="140" y="186" width="80" height="44" fill="#fff" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="140" y="230" width="80" height="44" fill="#fff" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="140" y="274" width="80" height="44" fill="#fff" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="140" y="318" width="80" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
  </g>
  <text x="180" y="170" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">19</text>
  <text x="180" y="214" text-anchor="middle" font-size="13" fill="#333">10</text>
  <text x="180" y="258" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="180" y="302" text-anchor="middle" font-size="13" fill="#333">7</text>
  <text x="180" y="346" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">9</text>

  <!-- column 1 (odd, up): 8,5,2,1,17 -->
  <g filter="url(#rough2)">
    <rect x="220" y="142" width="80" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <rect x="220" y="186" width="80" height="44" fill="#fff" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <rect x="220" y="230" width="80" height="44" fill="#fff" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <rect x="220" y="274" width="80" height="44" fill="#fff" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <rect x="220" y="318" width="80" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
  </g>
  <text x="260" y="170" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">17</text>
  <text x="260" y="214" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="260" y="258" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="260" y="302" text-anchor="middle" font-size="13" fill="#333">5</text>
  <text x="260" y="346" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>

  <!-- column 2 (even, down): 16,14,12,18,6 -->
  <g filter="url(#rough2)">
    <rect x="300" y="142" width="80" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="300" y="186" width="80" height="44" fill="#fff" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="300" y="230" width="80" height="44" fill="#fff" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="300" y="274" width="80" height="44" fill="#fff" stroke="#446688" stroke-width="1.2" rx="4"/>
    <rect x="300" y="318" width="80" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
  </g>
  <text x="340" y="170" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">16</text>
  <text x="340" y="214" text-anchor="middle" font-size="13" fill="#333">14</text>
  <text x="340" y="258" text-anchor="middle" font-size="13" fill="#333">12</text>
  <text x="340" y="302" text-anchor="middle" font-size="13" fill="#333">18</text>
  <text x="340" y="346" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>

  <!-- column 3 (odd, up): 13,11,20,4,15 -->
  <g filter="url(#rough2)">
    <rect x="380" y="142" width="80" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <rect x="380" y="186" width="80" height="44" fill="#fff" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <rect x="380" y="230" width="80" height="44" fill="#fff" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <rect x="380" y="274" width="80" height="44" fill="#fff" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <rect x="380" y="318" width="80" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
  </g>
  <text x="420" y="170" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">15</text>
  <text x="420" y="214" text-anchor="middle" font-size="13" fill="#333">4</text>
  <text x="420" y="258" text-anchor="middle" font-size="13" fill="#333">20</text>
  <text x="420" y="302" text-anchor="middle" font-size="13" fill="#333">11</text>
  <text x="420" y="346" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">13</text>

  <!-- key insight -->
  <rect x="40" y="380" width="520" height="56" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="300" y="400" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">每列读 rowsCount 个，列内方向由 c 的奇偶决定</text>
  <text x="300" y="420" text-anchor="middle" font-size="11" fill="#888">下标 k 落在第 ⌊k/rowsCount⌋ 列；偶数列正序、奇数列逆序写入</text>
</svg>
