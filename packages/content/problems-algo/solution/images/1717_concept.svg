<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：两种删除各吃一对 a,b —— 先贪心删高分对，再删低分对</text>

  <!-- ===== Two operations ===== -->
  <text x="150" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">两种操作</text>

  <!-- ab -> x -->
  <g filter="url(#rough2)">
    <rect x="44" y="68" width="80" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6"/>
    <text x="84" y="88" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">"ab"</text>
    <text x="84" y="104" text-anchor="middle" font-size="10" fill="#888">删 → +x 分</text>
  </g>
  <text x="132" y="94" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">吃 1a+1b</text>

  <!-- ba -> y -->
  <g filter="url(#rough2)">
    <rect x="196" y="68" width="80" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="236" y="88" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">"ba"</text>
    <text x="236" y="104" text-anchor="middle" font-size="10" fill="#888">删 → +y 分</text>
  </g>
  <text x="284" y="94" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">吃 1a+1b</text>

  <!-- arrow down -->
  <path d="M 168 118 L 168 138" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Key observation: total fixed ===== -->
  <rect x="40" y="144" width="480" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="52" y="164" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">关键观察：每个「只含 a,b 的连续段」总删除数 = min(#a, #b)（与删除顺序无关）</text>
  <text x="52" y="182" font-size="10" fill="#555" filter="url(#rough2)">① 每次删除消耗 1 个 a 和 1 个 b ⇒ 总数 ≤ min(#a, #b)</text>
  <text x="52" y="198" font-size="10" fill="#555" filter="url(#rough2)">② 段内只要还有 a 也有 b，在 a↔b 的过渡处就一定有相邻 "ab" 或 "ba" 可删</text>
  <text x="52" y="214" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⇒ 总能删到某种字母耗尽，总数恰为 min(#a, #b)；其它字母只是分段屏障</text>

  <!-- arrow down -->
  <path d="M 280 224 L 280 242" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Consequence: maximize high-value ===== -->
  <rect x="40" y="248" width="480" height="86" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="52" y="268" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">推论：总删除数固定 ⇒ 得分 = x·#ab + y·#ba，要最大化就尽量多删「高分对」</text>
  <text x="52" y="286" font-size="10" fill="#555" filter="url(#rough2)">交换论证：跳过 1 个高分删除（亏 x），腾出的 1a+1b 至多再凑 1 个低分删除（赚 ≤ y）</text>
  <text x="52" y="302" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">净变化 ≤ y − x ≤ 0 ⇒ 永远不划算 ⇒ 贪心删尽高分对最优</text>
  <text x="52" y="320" font-size="10" fill="#555" filter="url(#rough2)">跳过 k 个同理：亏 kx，赚 ≤ ky，净 ≤ k(y−x) ≤ 0</text>

  <!-- arrow down -->
  <path d="M 280 340 L 280 358" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Strategy ===== -->
  <rect x="40" y="364" width="480" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="52" y="384" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">策略：一趟栈贪心删尽高分对 → 拿剩余串再一趟栈删低分对</text>
  <text x="52" y="402" font-size="10" fill="#555" filter="url(#rough2)">若 x ≥ y：先删 "ab"（栈：top=a 且来 b 则弹 +x），再用剩余删 "ba"</text>
  <text x="52" y="418" font-size="10" fill="#555" filter="url(#rough2)">若 y &gt; x：先删 "ba"（栈：top=b 且来 a 则弹 +y），再用剩余删 "ab"</text>
  <text x="52" y="434" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">两趟 O(n)，无需回溯 / DP</text>

  <text x="280" y="464" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">总分 = 第一趟高分 + 第二趟低分</text>
</svg>
