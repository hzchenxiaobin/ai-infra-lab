<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="430" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [5,1,5,2,5,3,5,4]（N=4）</text>

  <!-- ============ Step i=3 ============ -->
  <text x="36" y="64" font-size="12" fill="#888" font-weight="bold">步骤 1：i = 3</text>

  <!-- array cells, 8 cells width 44 starting x=120 -->
  <!-- centers: 142, 186, 230, 274, 318, 362, 406, 450 -->
  <rect x="120" y="50" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="72" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">5</text>

  <rect x="164" y="50" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="72" text-anchor="middle" font-size="14" fill="#333">1</text>

  <rect x="208" y="50" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="72" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">5</text>

  <!-- i=3 highlighted with bold orange -->
  <rect x="252" y="50" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="274" y="72" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">2</text>

  <rect x="296" y="50" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="318" y="72" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">5</text>

  <rect x="340" y="50" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="362" y="72" text-anchor="middle" font-size="14" fill="#333">3</text>

  <rect x="384" y="50" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="406" y="72" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">5</text>

  <rect x="428" y="50" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="450" y="72" text-anchor="middle" font-size="14" fill="#333">4</text>

  <!-- index labels -->
  <text x="142" y="98" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="186" y="98" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="230" y="98" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="274" y="98" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">3</text>
  <text x="318" y="98" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <text x="362" y="98" text-anchor="middle" font-size="9" fill="#aaa">5</text>
  <text x="406" y="98" text-anchor="middle" font-size="9" fill="#aaa">6</text>
  <text x="450" y="98" text-anchor="middle" font-size="9" fill="#aaa">7</text>

  <!-- comparison arrows from i=3 down to i-1,i-2,i-3 -->
  <path d="M 274 108 Q 252 124 230 112" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="248" y="128" font-size="10" fill="#b85450">i−1: 5 ≠ 2 ✗</text>

  <path d="M 274 108 Q 230 132 186 112" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="200" y="148" font-size="10" fill="#b85450">i−2: 1 ≠ 2 ✗</text>

  <path d="M 274 108 Q 208 140 142 112" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="150" y="168" font-size="10" fill="#b85450">i−3: 5 ≠ 2 ✗</text>

  <rect x="470" y="58" width="92" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="516" y="76" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">未命中，i++</text>

  <!-- ============ Step i=4 ============ -->
  <text x="36" y="216" font-size="12" fill="#888" font-weight="bold">步骤 2：i = 4</text>

  <rect x="120" y="202" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="224" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">5</text>

  <rect x="164" y="202" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="224" text-anchor="middle" font-size="14" fill="#333">1</text>

  <!-- i-2 match target: index 2, value 5, highlighted green -->
  <rect x="208" y="202" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="224" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">5</text>

  <rect x="252" y="202" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="274" y="224" text-anchor="middle" font-size="14" fill="#333">2</text>

  <!-- i=4 highlighted bold orange -->
  <rect x="296" y="202" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="318" y="224" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">5</text>

  <rect x="340" y="202" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="362" y="224" text-anchor="middle" font-size="14" fill="#333">3</text>

  <rect x="384" y="202" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="406" y="224" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">5</text>

  <rect x="428" y="202" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="450" y="224" text-anchor="middle" font-size="14" fill="#333">4</text>

  <!-- index labels -->
  <text x="142" y="250" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="186" y="250" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="230" y="250" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="274" y="250" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="318" y="250" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">4</text>
  <text x="362" y="250" text-anchor="middle" font-size="9" fill="#aaa">5</text>
  <text x="406" y="250" text-anchor="middle" font-size="9" fill="#aaa">6</text>
  <text x="450" y="250" text-anchor="middle" font-size="9" fill="#aaa">7</text>

  <!-- arrow i=4 -> i-1 (index 3, value 2): no -->
  <path d="M 318 260 Q 296 276 274 264" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="292" y="282" font-size="10" fill="#b85450">i−1: 2 ≠ 5 ✗</text>

  <!-- arrow i=4 -> i-2 (index 2, value 5): MATCH -->
  <path d="M 318 260 Q 274 284 230 264" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="244" y="302" font-size="11" fill="#4a7a3a" font-weight="bold">i−2: 5 == 5 ✓ 命中！</text>

  <!-- result box -->
  <rect x="470" y="262" width="92" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="516" y="278" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回 5</text>
  <text x="516" y="290" text-anchor="middle" font-size="10" fill="#4a7a3a">(距离 2)</text>

  <!-- Conclusion -->
  <rect x="40" y="368" width="500" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="388" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">i=3 未命中后 i++ 到 4，回看第 2 格即命中答案 5</text>
  <text x="290" y="406" text-anchor="middle" font-size="11" fill="#666">共扫描 2 步、6 次比较即停——鸽巢保证命中点必在前几个位置</text>
</svg>
