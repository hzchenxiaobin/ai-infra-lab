<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">保序配对：第 k 个偶数 → 第 k 个偶数槽</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">示例① [2,4,6,5,7]：n=5 奇、偶多 ⇒ 唯一模板「偶开头」</text>

  <!-- 原数组下标 -->
  <text x="132" y="58" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">位置0</text>
  <text x="204" y="58" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">位置1</text>
  <text x="276" y="58" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">位置2</text>
  <text x="348" y="58" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">位置3</text>
  <text x="420" y="58" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">位置4</text>

  <!-- 原数组 -->
  <rect x="100" y="64" width="64" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <rect x="172" y="64" width="64" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <rect x="244" y="64" width="64" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <rect x="316" y="64" width="64" height="54" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="388" y="64" width="64" height="54" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>

  <text x="132" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <text x="204" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>
  <text x="276" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">6</text>
  <text x="348" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">5</text>
  <text x="420" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">7</text>

  <text x="132" y="107" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">E₀</text>
  <text x="204" y="107" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">E₁</text>
  <text x="276" y="107" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">E₂</text>
  <text x="348" y="107" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">O₀</text>
  <text x="420" y="107" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">O₁</text>

  <!-- 交叉点图例 -->
  <circle cx="330" cy="114" r="4" fill="#b85450" filter="url(#rough2)"/>
  <text x="339" y="118" font-size="10" fill="#b85450" filter="url(#rough2)">= 一对元素交叉 = 1 次相邻交换</text>

  <!-- 偶数轨迹（实线蓝） -->
  <path d="M132,124 L132,202" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M204,124 L274,202" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M276,124 L418,202" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 奇数轨迹（虚线绿） -->
  <path d="M348,124 L206,202" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M420,124 L350,202" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 位移标注 -->
  <text x="140" y="168" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">|0−0|=0</text>
  <text x="218" y="152" text-anchor="end" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">|1−2|=1</text>
  <text x="298" y="140" text-anchor="end" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">|2−4|=2</text>

  <!-- 三个交叉点 -->
  <circle cx="252" cy="177" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="312" cy="144" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="372" cy="177" r="4.5" fill="#b85450" filter="url(#rough2)"/>

  <!-- 目标槽位 -->
  <text x="132" y="222" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">槽0(偶)</text>
  <text x="204" y="222" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">槽1(奇)</text>
  <text x="276" y="222" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">槽2(偶)</text>
  <text x="348" y="222" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">槽3(奇)</text>
  <text x="420" y="222" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">槽4(偶)</text>

  <rect x="100" y="228" width="64" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <rect x="172" y="228" width="64" height="54" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="244" y="228" width="64" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <rect x="316" y="228" width="64" height="54" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="388" y="228" width="64" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>

  <text x="132" y="252" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <text x="204" y="252" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">5</text>
  <text x="276" y="252" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>
  <text x="348" y="252" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">7</text>
  <text x="420" y="252" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">6</text>

  <text x="132" y="271" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">E₀</text>
  <text x="204" y="271" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">O₀</text>
  <text x="276" y="271" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">E₁</text>
  <text x="348" y="271" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">O₁</text>
  <text x="420" y="271" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">E₂</text>

  <!-- 交叉计数说明 -->
  <rect x="40" y="292" width="440" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="310" text-anchor="middle" font-size="11" fill="#8a6d3a" filter="url(#rough2)">交叉计数：第 k 个偶数前面——初始有 e−k 个奇数、最终有 t−k 个奇数（均为前缀），</text>
  <text x="260" y="328" text-anchor="middle" font-size="11" fill="#8a6d3a" filter="url(#rough2)">前缀之差 |e−t| = 与它交叉的奇数个数；图中共 3 个红点 = 3 次交叉</text>

  <!-- 底部公式 -->
  <rect x="40" y="348" width="440" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="366" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">代价 = Σ|eₖ−tₖ| = |0−0|+|1−2|+|2−4| = 3 ✓</text>
  <text x="260" y="384" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">奇数侧 |3−1|+|4−3| 同为 3，取其一即可——相加会翻倍！</text>
</svg>
