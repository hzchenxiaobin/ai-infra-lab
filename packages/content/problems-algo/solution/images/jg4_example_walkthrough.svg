<svg xmlns="http://www.w3.org/2000/svg" width="560" height="470" viewBox="0 0 560 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="6" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arp" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7a5499"/>
    </marker>
  </defs>
  <rect width="560" height="470" fill="#fdfcf7"/>
  <text x="280" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">BFS 逐层扩展演算</text>
  <path d="M 150 38 Q 280 46 410 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="280" y="56" text-anchor="middle" font-size="11" fill="#888">arr = [100,-23,-23,404,100,23,23,23,3,404]，目标 = 下标 9</text>

  <!-- 10 cells: width 48, step 52, x: 36,88,140,192,244,296,348,400,452,504 ; cx: 60,112,164,216,268,320,372,424,476,528 -->
  <text x="20" y="103" font-size="10" fill="#888">下标</text>
  <text x="20" y="131" font-size="10" fill="#888">值</text>

  <!-- cell 0: 100 start -->
  <g filter="url(#sk)"><rect x="36" y="84" width="48" height="28" rx="4" fill="#fff8e1" stroke="#c98a2b" stroke-width="2.2"/></g>
  <g filter="url(#sk)"><rect x="36" y="112" width="48" height="28" rx="4" fill="#fff8e1" stroke="#c98a2b" stroke-width="2.2"/></g>
  <text x="60" y="103" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">0</text>
  <text x="60" y="131" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">100</text>
  <text x="60" y="78" text-anchor="middle" font-size="8" fill="#7a5415" font-weight="bold">起点</text>

  <!-- cell 1: -23 -->
  <g filter="url(#sk)"><rect x="88" y="84" width="48" height="28" rx="4" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="88" y="112" width="48" height="28" rx="4" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/></g>
  <text x="112" y="103" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="112" y="131" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">-23</text>

  <!-- cell 2: -23 -->
  <g filter="url(#sk)"><rect x="140" y="84" width="48" height="28" rx="4" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="140" y="112" width="48" height="28" rx="4" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/></g>
  <text x="164" y="103" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="164" y="131" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">-23</text>

  <!-- cell 3: 404 (path node, purple) -->
  <g filter="url(#sk)"><rect x="192" y="84" width="48" height="28" rx="4" fill="#f3eef8" stroke="#7a5499" stroke-width="2.2"/></g>
  <g filter="url(#sk)"><rect x="192" y="112" width="48" height="28" rx="4" fill="#f3eef8" stroke="#7a5499" stroke-width="2.2"/></g>
  <text x="216" y="103" text-anchor="middle" font-size="11" fill="#5a3a79" font-weight="bold">3</text>
  <text x="216" y="131" text-anchor="middle" font-size="11" fill="#5a3a79" font-weight="bold">404</text>

  <!-- cell 4: 100 (path node, blue) -->
  <g filter="url(#sk)"><rect x="244" y="84" width="48" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/></g>
  <g filter="url(#sk)"><rect x="244" y="112" width="48" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/></g>
  <text x="268" y="103" text-anchor="middle" font-size="11" fill="#2b4b6e" font-weight="bold">4</text>
  <text x="268" y="131" text-anchor="middle" font-size="11" fill="#2b4b6e" font-weight="bold">100</text>

  <!-- cell 5: 23 -->
  <g filter="url(#sk)"><rect x="296" y="84" width="48" height="28" rx="4" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="296" y="112" width="48" height="28" rx="4" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/></g>
  <text x="320" y="103" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="320" y="131" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">23</text>

  <!-- cell 6: 23 -->
  <g filter="url(#sk)"><rect x="348" y="84" width="48" height="28" rx="4" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="348" y="112" width="48" height="28" rx="4" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/></g>
  <text x="372" y="103" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="372" y="131" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">23</text>

  <!-- cell 7: 23 -->
  <g filter="url(#sk)"><rect x="400" y="84" width="48" height="28" rx="4" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="400" y="112" width="48" height="28" rx="4" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/></g>
  <text x="424" y="103" text-anchor="middle" font-size="11" fill="#333">7</text>
  <text x="424" y="131" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">23</text>

  <!-- cell 8: 3 -->
  <g filter="url(#sk)"><rect x="452" y="84" width="48" height="28" rx="4" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/></g>
  <g filter="url(#sk)"><rect x="452" y="112" width="48" height="28" rx="4" fill="#f4f4f4" stroke="#888" stroke-width="1.2"/></g>
  <text x="476" y="103" text-anchor="middle" font-size="11" fill="#333">8</text>
  <text x="476" y="131" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>

  <!-- cell 9: 404 target -->
  <g filter="url(#sk)"><rect x="504" y="84" width="48" height="28" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2.2"/></g>
  <g filter="url(#sk)"><rect x="504" y="112" width="48" height="28" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2.2"/></g>
  <text x="528" y="103" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">9</text>
  <text x="528" y="131" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">404</text>
  <text x="528" y="78" text-anchor="middle" font-size="8" fill="#2e6e2e" font-weight="bold">目标</text>

  <!-- layer 0 -->
  <g filter="url(#sk)"><rect x="40" y="158" width="480" height="40" rx="8" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.3"/></g>
  <text x="56" y="182" font-size="11" fill="#7a5415" font-weight="bold">层 0</text>
  <text x="100" y="182" font-size="11" fill="#444">弹出 0 → 邻接 1 入队；同值 100：{0,4} → 4 入队</text>
  <text x="476" y="182" font-size="10" fill="#b03a3a" font-weight="bold">清空 100</text>
  <path d="M 280 198 L 280 214" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- layer 1 -->
  <g filter="url(#sk)"><rect x="40" y="216" width="480" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/></g>
  <text x="56" y="240" font-size="11" fill="#2b4b6e" font-weight="bold">层 1</text>
  <text x="100" y="238" font-size="11" fill="#444">弹出 1 → 同值 -23：{1,2} → 2 入队；清空 -23</text>
  <text x="100" y="256" font-size="11" fill="#444">弹出 4 → 邻接 3、5 入队（100 已清空，跳过）</text>
  <path d="M 280 268 L 280 284" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- layer 2 -->
  <g filter="url(#sk)"><rect x="40" y="286" width="480" height="52" rx="8" fill="#f3eef8" stroke="#7a5499" stroke-width="1.3"/></g>
  <text x="56" y="310" font-size="11" fill="#5a3a79" font-weight="bold">层 2</text>
  <text x="100" y="308" font-size="11" fill="#444">弹出 3 → 同值 404：{3,9} → 9 入队</text>
  <text x="100" y="326" font-size="11" fill="#444">弹出 5 → 同值 23：{5,6,7} → 6、7 入队</text>
  <text x="470" y="318" font-size="10" fill="#b03a3a" font-weight="bold">清空 404 / 23</text>
  <path d="M 280 338 L 280 354" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- layer 3: hit -->
  <g filter="url(#sk)"><rect x="40" y="356" width="480" height="44" rx="8" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="56" y="384" font-size="11" fill="#2e6e2e" font-weight="bold">层 3</text>
  <text x="100" y="384" font-size="11" fill="#2e6e2e" font-weight="bold">弹出 9 → i == n−1 ✓ 命中！返回 steps = 3</text>

  <!-- path arrow 0->4->3->9 (dashed) -->
  <path d="M 60 140 Q 164 168 268 140" stroke="#446688" stroke-width="1.8" stroke-dasharray="5 3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 268 140 Q 242 162 216 140" stroke="#7a5499" stroke-width="1.8" stroke-dasharray="5 3" fill="none" marker-end="url(#arp)" filter="url(#sk)"/>
  <path d="M 216 140 Q 372 175 528 140" stroke="#4a8e4a" stroke-width="1.8" stroke-dasharray="5 3" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>

  <!-- conclusion -->
  <g filter="url(#sk)"><rect x="40" y="416" width="480" height="44" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/></g>
  <text x="280" y="436" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">最短路径 0 → 4 → 3 → 9，共 3 步</text>
  <text x="280" y="452" text-anchor="middle" font-size="10" fill="#888">同值 100 与 404 各消费一次即清空，杜绝重复遍历</text>
</svg>
