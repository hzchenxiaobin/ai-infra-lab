<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L8 5 L0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：两串各自升序排序后逐位配对，同序配对使逐位差最小</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">例：s1 = "abc"，s2 = "xya" → s1' = "abc"，s2' = "axy"（已排序）</text>

  <!-- ===== sorted s1' row ===== -->
  <text x="44" y="84" font-size="12" fill="#446688" font-weight="bold">s1'</text>
  <rect x="160" y="64" width="60" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="91" text-anchor="middle" font-size="17" fill="#333">a</text>
  <rect x="250" y="64" width="60" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="91" text-anchor="middle" font-size="17" fill="#333">b</text>
  <rect x="340" y="64" width="60" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="370" y="91" text-anchor="middle" font-size="17" fill="#333">c</text>
  <text x="420" y="84" font-size="10" fill="#888">↑ 升序</text>

  <!-- ===== sorted s2' row ===== -->
  <text x="44" y="146" font-size="12" fill="#4a7a3a" font-weight="bold">s2'</text>
  <rect x="160" y="126" width="60" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="153" text-anchor="middle" font-size="17" fill="#333">a</text>
  <rect x="250" y="126" width="60" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="153" text-anchor="middle" font-size="17" fill="#333">x</text>
  <rect x="340" y="126" width="60" height="40" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="370" y="153" text-anchor="middle" font-size="17" fill="#333">y</text>
  <text x="420" y="146" font-size="10" fill="#888">↑ 升序</text>

  <!-- ===== Direction 1: s1' >= s2' ? ===== -->
  <text x="44" y="200" font-size="11.5" fill="#b85450" font-weight="bold">方向①</text>
  <text x="92" y="200" font-size="11" fill="#555">s1' ≥ s2' ?</text>
  <!-- col 0: a>=a -->
  <text x="190" y="200" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="190" y="214" text-anchor="middle" font-size="9.5" fill="#888">a≥a</text>
  <!-- col 1: b>=x? no -->
  <text x="280" y="200" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">✗</text>
  <text x="280" y="214" text-anchor="middle" font-size="9.5" fill="#b85450">b≥x?</text>
  <!-- col 2: not checked -->
  <text x="370" y="200" text-anchor="middle" font-size="13" fill="#bbb">—</text>
  <!-- result -->
  <rect x="430" y="186" width="86" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="473" y="206" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">失败</text>

  <!-- ===== Direction 2: s2' >= s1' ? ===== -->
  <text x="44" y="252" font-size="11.5" fill="#4a7a3a" font-weight="bold">方向②</text>
  <text x="92" y="252" font-size="11" fill="#555">s2' ≥ s1' ?</text>
  <text x="190" y="252" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="190" y="266" text-anchor="middle" font-size="9.5" fill="#888">a≥a</text>
  <text x="280" y="252" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="280" y="266" text-anchor="middle" font-size="9.5" fill="#888">x≥b</text>
  <text x="370" y="252" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="370" y="266" text-anchor="middle" font-size="9.5" fill="#888">y≥c</text>
  <rect x="430" y="238" width="86" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="473" y="258" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">全程成立</text>

  <!-- ===== conclusion box ===== -->
  <rect x="50" y="296" width="460" height="68" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="316" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">任一方向全程 ≥ 即返回 true（这里方向②成立 → true）</text>
  <text x="280" y="334" text-anchor="middle" font-size="10.5" fill="#555">原理：排序不等式——同序配对使逐位差值最小，最易全程 ≥ 0</text>
  <text x="280" y="350" text-anchor="middle" font-size="10.5" fill="#555">「存在合法排列」⟺「排序后逐位比较」（计数论证保证不漏判）</text>
</svg>
