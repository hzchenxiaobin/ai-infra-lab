<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#6a9acc"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">按长度分三种情形决策</text>

  <rect x="20" y="50" width="170" height="330" fill="#fce4ec" fill-opacity="0.4" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="105" y="74" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">情形 1：n &lt; 6</text>
  <text x="105" y="92" text-anchor="middle" font-size="11" fill="#555">需插入 (6−n) 个字符</text>
  <text x="32" y="116" font-size="10.5" fill="#446688">• 插入可补缺失种类</text>
  <text x="32" y="132" font-size="10.5" fill="#446688">• 插入可打断重复段</text>
  <rect x="32" y="148" width="146" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough)"/>
  <text x="105" y="166" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">答案 =</text>
  <text x="105" y="184" text-anchor="middle" font-size="11.5" fill="#333">max(6−n, missing_types)</text>
  <text x="32" y="216" font-size="10" fill="#888">例：n=3, miss=2</text>
  <text x="32" y="230" font-size="10" fill="#888">→ max(3,2)=3</text>

  <rect x="200" y="50" width="170" height="330" fill="#e6f4ea" fill-opacity="0.45" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="285" y="74" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">情形 2：6 ≤ n ≤ 20</text>
  <text x="285" y="92" text-anchor="middle" font-size="11" fill="#555">长度合法，用替换</text>
  <text x="212" y="116" font-size="10.5" fill="#446688">• 替换可补缺失种类</text>
  <text x="212" y="132" font-size="10.5" fill="#446688">• 替换可打断重复段</text>
  <text x="212" y="148" font-size="10.5" fill="#446688">• 每个 ⌊L/3⌋ 算 1 替换</text>
  <rect x="212" y="160" width="146" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough)"/>
  <text x="285" y="178" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">答案 =</text>
  <text x="285" y="196" text-anchor="middle" font-size="11" fill="#333">max(Σ⌊L/3⌋, missing_types)</text>
  <text x="212" y="228" font-size="10" fill="#888">例：runs=[6], miss=2</text>
  <text x="212" y="242" font-size="10" fill="#888">→ max(2,2)=2</text>

  <rect x="380" y="50" width="160" height="330" fill="#e8f0fe" fill-opacity="0.5" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="460" y="74" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">情形 3：n &gt; 20</text>
  <text x="460" y="92" text-anchor="middle" font-size="11" fill="#555">先删除到 20，再替换</text>
  <text x="392" y="116" font-size="10.5" fill="#446688">• 删除可打断重复段</text>
  <text x="392" y="132" font-size="10.5" fill="#446688">• 按 L%3 优先级删</text>
  <text x="392" y="148" font-size="10.5" fill="#446688">• 剩余再做替换</text>
  <rect x="392" y="160" width="136" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough)"/>
  <text x="460" y="178" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">答案 =</text>
  <text x="460" y="196" text-anchor="middle" font-size="10.5" fill="#333">(n−20) +</text>
  <text x="460" y="210" text-anchor="middle" font-size="10.5" fill="#333">max(rep', missing_types)</text>
  <text x="392" y="228" font-size="10" fill="#888">rep' = 删除后剩余替换数</text>
  <text x="392" y="242" font-size="10" fill="#888">贪心让 rep' 尽量小</text>

  <path d="M 200 280 L 178 280" stroke="#446688" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)" transform="rotate(180 200 280)"/>
  <path d="M 380 280 L 358 280" stroke="#446688" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)" transform="rotate(180 380 280)"/>

  <rect x="32" y="288" width="146" height="78" fill="#fff" stroke="#999" stroke-width="1" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="105" y="306" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">插入 1 个字符</text>
  <text x="40" y="324" font-size="10" fill="#555">a a a → a_X_a a</text>
  <text x="40" y="340" font-size="9.5" fill="#4a7a3a">补种类 + 打断段</text>
  <text x="40" y="356" font-size="9.5" fill="#888">1 操作可两用</text>

  <rect x="212" y="288" width="146" height="78" fill="#fff" stroke="#999" stroke-width="1" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="285" y="306" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">替换 1 个字符</text>
  <text x="218" y="324" font-size="10" fill="#555">a a a a a a → a a A a a 9</text>
  <text x="220" y="340" font-size="9.5" fill="#4a7a3a">补种类 + 打断段</text>
  <text x="220" y="356" font-size="9.5" fill="#888">每 3 个替换 1 个</text>

  <rect x="392" y="288" width="136" height="78" fill="#fff" stroke="#999" stroke-width="1" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="460" y="306" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">删除 1 个字符</text>
  <text x="398" y="324" font-size="10" fill="#555">a a a a a a → a a a a a</text>
  <text x="398" y="340" font-size="9.5" fill="#b85450">能否减 1 替换?</text>
  <text x="398" y="356" font-size="9.5" fill="#888">看 L%3（见下图）</text>
</svg>
