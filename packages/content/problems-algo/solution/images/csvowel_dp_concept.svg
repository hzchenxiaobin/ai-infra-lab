<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：dp[i][j] = 长度 i、末字符恰为第 j 个元音的串数</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">5 个元音 a &lt; e &lt; i &lt; o &lt; u 对应列 j = 0..4；只看「末字符」，前缀自然有序</text>

  <!-- ===== DP 表头 ===== -->
  <text x="60" y="92" font-size="12" fill="#444" font-weight="bold">dp 表（行=长度 i，列=末元音 j）</text>

  <!-- 列标签 a e i o u -->
  <g font-size="13" fill="#b85450" font-weight="bold">
    <text x="170" y="118" text-anchor="middle">a (0)</text>
    <text x="230" y="118" text-anchor="middle">e (1)</text>
    <text x="290" y="118" text-anchor="middle">i (2)</text>
    <text x="350" y="118" text-anchor="middle">o (3)</text>
    <text x="410" y="118" text-anchor="middle">u (4)</text>
  </g>

  <!-- 行标签 i=1 -->
  <text x="120" y="150" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">i=1</text>
  <g font-size="13" fill="#333">
    <rect x="142" y="132" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="170" y="153" text-anchor="middle">1</text>
    <rect x="202" y="132" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="230" y="153" text-anchor="middle">1</text>
    <rect x="262" y="132" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="290" y="153" text-anchor="middle">1</text>
    <rect x="322" y="132" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="350" y="153" text-anchor="middle">1</text>
    <rect x="382" y="132" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="410" y="153" text-anchor="middle">1</text>
  </g>

  <!-- 行标签 i=2 -->
  <text x="120" y="200" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">i=2</text>
  <g font-size="13" fill="#333">
    <rect x="142" y="182" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="170" y="203" text-anchor="middle">1</text>
    <rect x="202" y="182" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="230" y="203" text-anchor="middle">2</text>
    <rect x="262" y="182" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="290" y="203" text-anchor="middle">3</text>
    <rect x="322" y="182" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="350" y="203" text-anchor="middle">4</text>
    <rect x="382" y="182" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="410" y="203" text-anchor="middle">5</text>
  </g>

  <!-- 行标签 i=3 -->
  <text x="120" y="250" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">i=3</text>
  <g font-size="13" fill="#333">
    <rect x="142" y="232" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="170" y="253" text-anchor="middle">1</text>
    <rect x="202" y="232" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="230" y="253" text-anchor="middle">3</text>
    <rect x="262" y="232" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="290" y="253" text-anchor="middle">6</text>
    <rect x="322" y="232" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="350" y="253" text-anchor="middle">10</text>
    <rect x="382" y="232" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="410" y="253" text-anchor="middle">15</text>
  </g>

  <!-- 答案行 -->
  <text x="120" y="300" text-anchor="end" font-size="12" fill="#b85450" font-weight="bold">答案=Σ</text>
  <text x="470" y="203" font-size="11" fill="#888">← 末列即 C(n+4,4)</text>

  <!-- 累加箭头：i=2 的 j=4 来自上一行 0..4 -->
  <text x="475" y="253" font-size="11" fill="#b85450" font-weight="bold">15 = 1+2+3+4+5</text>
  <path d="M 170 165 Q 200 175 230 178" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <path d="M 230 165 Q 260 175 290 178" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <path d="M 290 165 Q 320 175 350 178" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <path d="M 350 165 Q 380 175 410 178" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="280" y="178" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">每格 = 上一行同列及左侧所有格之和（前缀和）</text>

  <!-- ===== 递推公式框 ===== -->
  <rect x="60" y="320" width="460" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="74" y="342" font-size="12" fill="#4a7a3a" font-weight="bold">递推式（两种等价写法）：</text>
  <text x="74" y="362" font-size="11" fill="#333">① dp[i][j] = Σ dp[i−1][k], k = 0..j   （末字符 j，前缀随意 ≤ j）</text>
  <text x="74" y="380" font-size="11" fill="#333">② dp[i][j] = dp[i−1][j] + dp[i][j−1]   （前缀和优化，O(1) 转移）</text>
</svg>
