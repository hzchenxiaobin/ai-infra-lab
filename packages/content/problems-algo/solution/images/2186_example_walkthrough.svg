<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：s = "leetcode", t = "coats"</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">完整 8 个字符的频率表，|差| 之和 = 7</text>

  <!-- Table header -->
  <g filter="url(#rough2)">
    <rect x="70" y="60" width="40" height="22" fill="#f0f0f0" stroke="#888" stroke-width="1.3" rx="4"/>
    <text x="90" y="76" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">字符</text>
    <rect x="110" y="60" width="50" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="135" y="76" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">cntS</text>
    <rect x="160" y="60" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="185" y="76" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">cntT</text>
    <rect x="210" y="60" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="235" y="76" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">|差|</text>
    <rect x="260" y="60" width="230" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="375" y="76" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">追加操作</text>
  </g>

  <!-- 8 rows, y starts at 82, height 22 each -->
  <!-- Row 1: a -->
  <g filter="url(#rough2)">
    <rect x="70" y="82" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="90" y="97" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>
    <rect x="110" y="82" width="50" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <text x="135" y="97" text-anchor="middle" font-size="11" fill="#888">0</text>
    <rect x="160" y="82" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4"/>
    <text x="185" y="97" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
    <rect x="210" y="82" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="235" y="97" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
    <rect x="260" y="82" width="230" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4"/>
    <text x="375" y="97" text-anchor="middle" font-size="10.5" fill="#d6a040">追加 a → s（1 步）</text>
  </g>

  <!-- Row 2: c (diff=0, gray) -->
  <g filter="url(#rough2)">
    <rect x="70" y="104" width="40" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="90" y="119" text-anchor="middle" font-size="11" fill="#888">c</text>
    <rect x="110" y="104" width="50" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="135" y="119" text-anchor="middle" font-size="11" fill="#888">1</text>
    <rect x="160" y="104" width="50" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="185" y="119" text-anchor="middle" font-size="11" fill="#888">1</text>
    <rect x="210" y="104" width="50" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="235" y="119" text-anchor="middle" font-size="11" fill="#aaa">0</text>
    <rect x="260" y="104" width="230" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="375" y="119" text-anchor="middle" font-size="10.5" fill="#aaa">—</text>
  </g>

  <!-- Row 3: d -->
  <g filter="url(#rough2)">
    <rect x="70" y="126" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="90" y="141" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">d</text>
    <rect x="110" y="126" width="50" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <text x="135" y="141" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
    <rect x="160" y="126" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4"/>
    <text x="185" y="141" text-anchor="middle" font-size="11" fill="#888">0</text>
    <rect x="210" y="126" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="235" y="141" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
    <rect x="260" y="126" width="230" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4"/>
    <text x="375" y="141" text-anchor="middle" font-size="10.5" fill="#d6a040">追加 d → t（1 步）</text>
  </g>

  <!-- Row 4: e (|diff|=3, highlighted) -->
  <g filter="url(#rough2)">
    <rect x="70" y="148" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="90" y="163" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">e</text>
    <rect x="110" y="148" width="50" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="135" y="163" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
    <rect x="160" y="148" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4"/>
    <text x="185" y="163" text-anchor="middle" font-size="11" fill="#888">0</text>
    <rect x="210" y="148" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <text x="235" y="163" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
    <rect x="260" y="148" width="230" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="375" y="163" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">追加 e, e, e → t（3 步）</text>
  </g>

  <!-- Row 5: l -->
  <g filter="url(#rough2)">
    <rect x="70" y="170" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="90" y="185" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">l</text>
    <rect x="110" y="170" width="50" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <text x="135" y="185" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
    <rect x="160" y="170" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4"/>
    <text x="185" y="185" text-anchor="middle" font-size="11" fill="#888">0</text>
    <rect x="210" y="170" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="235" y="185" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
    <rect x="260" y="170" width="230" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4"/>
    <text x="375" y="185" text-anchor="middle" font-size="10.5" fill="#d6a040">追加 l → t（1 步）</text>
  </g>

  <!-- Row 6: o (diff=0, gray) -->
  <g filter="url(#rough2)">
    <rect x="70" y="192" width="40" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="90" y="207" text-anchor="middle" font-size="11" fill="#888">o</text>
    <rect x="110" y="192" width="50" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="135" y="207" text-anchor="middle" font-size="11" fill="#888">1</text>
    <rect x="160" y="192" width="50" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="185" y="207" text-anchor="middle" font-size="11" fill="#888">1</text>
    <rect x="210" y="192" width="50" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="235" y="207" text-anchor="middle" font-size="11" fill="#aaa">0</text>
    <rect x="260" y="192" width="230" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="375" y="207" text-anchor="middle" font-size="10.5" fill="#aaa">—</text>
  </g>

  <!-- Row 7: s -->
  <g filter="url(#rough2)">
    <rect x="70" y="214" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4"/>
    <text x="90" y="229" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">s</text>
    <rect x="110" y="214" width="50" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4"/>
    <text x="135" y="229" text-anchor="middle" font-size="11" fill="#888">0</text>
    <rect x="160" y="214" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4"/>
    <text x="185" y="229" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
    <rect x="210" y="214" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4"/>
    <text x="235" y="229" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
    <rect x="260" y="214" width="230" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4"/>
    <text x="375" y="229" text-anchor="middle" font-size="10.5" fill="#d6a040">追加 s → s（1 步）</text>
  </g>

  <!-- Row 8: t (diff=0, gray) -->
  <g filter="url(#rough2)">
    <rect x="70" y="236" width="40" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="90" y="251" text-anchor="middle" font-size="11" fill="#888">t</text>
    <rect x="110" y="236" width="50" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="135" y="251" text-anchor="middle" font-size="11" fill="#888">1</text>
    <rect x="160" y="236" width="50" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="185" y="251" text-anchor="middle" font-size="11" fill="#888">1</text>
    <rect x="210" y="236" width="50" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="235" y="251" text-anchor="middle" font-size="11" fill="#aaa">0</text>
    <rect x="260" y="236" width="230" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4"/>
    <text x="375" y="251" text-anchor="middle" font-size="10.5" fill="#aaa">—</text>
  </g>

  <!-- Sum row -->
  <g filter="url(#rough2)">
    <rect x="70" y="262" width="180" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="160" y="278" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">合计 Σ|差|</text>
    <rect x="210" y="262" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="235" y="278" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">7</text>
    <rect x="260" y="262" width="230" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="375" y="278" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">ans = 7</text>
  </g>

  <!-- Operations summary -->
  <g filter="url(#rough2)">
    <rect x="50" y="300" width="460" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="280" y="318" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">追加到 s：a, s（2 步）  →  s' = "leetcodeas"</text>
    <text x="280" y="336" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">追加到 t：d, e, e, e, l（5 步）  →  t' = "coatsleede"</text>
    <text x="280" y="352" text-anchor="middle" font-size="10.5" fill="#888">总计 2 + 5 = 7 步，s' 与 t' 频率表相同 ✓</text>
  </g>

  <!-- Verification -->
  <g filter="url(#rough2)">
    <rect x="50" y="368" width="460" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8"/>
    <text x="280" y="386" text-anchor="middle" font-size="10.5" fill="#555">验证：s' = "leetcodeas" 与 t' = "coatsleede" 均含 a1 c1 d1 e3 l1 o1 s1 t1</text>
    <text x="280" y="400" text-anchor="middle" font-size="10.5" fill="#888">两者字符多重集合完全相同，互为字母异位词 ✓</text>
  </g>
</svg>
