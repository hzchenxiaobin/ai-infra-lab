<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：3 个点 → 3 对组合 → 取最小平方距离 → 开方</text>

  <!-- Left: mini coordinate plane -->
  <text x="100" y="54" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">point_2d 表（3 个点）</text>

  <!-- Axes -->
  <line x1="30" y1="150" x2="180" y2="150" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="105" y1="75" x2="105" y2="225" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="183" y="154" font-size="9" fill="#446688">x</text>
  <text x="99" y="73" font-size="9" fill="#446688">y</text>

  <!-- Grid marks -->
  <line x1="70" y1="146" x2="70" y2="154" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <text x="62" y="166" font-size="8" fill="#888">-1</text>
  <line x1="101" y1="185" x2="109" y2="185" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <text x="82" y="189" font-size="8" fill="#888">-1</text>
  <line x1="101" y1="220" x2="109" y2="220" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <text x="82" y="224" font-size="8" fill="#888">-2</text>

  <!-- Points: P1=(-1,-1)->(70,185), P2=(0,0)->(105,150), P3=(-1,-2)->(70,220) -->
  <!-- P1-P3: red (shortest) -->
  <line x1="70" y1="185" x2="70" y2="220" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <!-- P1-P2: blue dashed -->
  <line x1="70" y1="185" x2="105" y2="150" stroke="#446688" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <!-- P2-P3: blue dashed -->
  <line x1="105" y1="150" x2="70" y2="220" stroke="#446688" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Points -->
  <circle cx="70" cy="185" r="4.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="44" y="198" font-size="9" fill="#446688" font-weight="bold">P1(-1,-1)</text>

  <circle cx="105" cy="150" r="4.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="112" y="145" font-size="9" fill="#446688" font-weight="bold">P2(0,0)</text>

  <circle cx="70" cy="220" r="4.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="44" y="233" font-size="9" fill="#446688" font-weight="bold">P3(-1,-2)</text>

  <!-- Arrow to table -->
  <path d="M190 155 L230 155" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="210" y="148" text-anchor="middle" font-size="8.5" fill="#446688">自连接</text>

  <!-- Right: pair table -->
  <text x="400" y="54" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">3 对组合的平方距离计算</text>

  <!-- Table header -->
  <rect x="230" y="64" width="310" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="80" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">点对</text>
  <text x="305" y="80" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">(x₁,y₁)→(x₂,y₂)</text>
  <text x="395" y="80" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">dx²+dy²</text>
  <text x="500" y="80" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">距离</text>

  <!-- Column dividers in header -->
  <line x1="280" y1="64" x2="280" y2="88" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="360" y1="64" x2="360" y2="88" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="445" y1="64" x2="445" y2="88" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Row 1: P1↔P2 -->
  <rect x="230" y="88" width="310" height="28" fill="#f6f8fa" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="255" y="106" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">P1↔P2</text>
  <text x="305" y="106" text-anchor="middle" font-size="9" fill="#555">(-1,-1)→(0,0)</text>
  <text x="395" y="106" text-anchor="middle" font-size="9.5" fill="#555" font-family="Georgia, serif">1+1=2</text>
  <text x="500" y="106" text-anchor="middle" font-size="9.5" fill="#446688">√2≈1.41</text>
  <line x1="280" y1="88" x2="280" y2="116" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="360" y1="88" x2="360" y2="116" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="445" y1="88" x2="445" y2="116" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- Row 2: P1↔P3 (highlighted - shortest!) -->
  <rect x="230" y="116" width="310" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="255" y="134" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">P1↔P3</text>
  <text x="305" y="134" text-anchor="middle" font-size="9" fill="#555">(-1,-1)→(-1,-2)</text>
  <text x="395" y="134" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" font-family="Georgia, serif">0+1=1 ★</text>
  <text x="500" y="134" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">1.00 ★</text>
  <line x1="280" y1="116" x2="280" y2="144" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="360" y1="116" x2="360" y2="144" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="445" y1="116" x2="445" y2="144" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Row 3: P2↔P3 -->
  <rect x="230" y="144" width="310" height="28" fill="#f6f8fa" stroke="#446688" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="255" y="162" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">P2↔P3</text>
  <text x="305" y="162" text-anchor="middle" font-size="9" fill="#555">(0,0)→(-1,-2)</text>
  <text x="395" y="162" text-anchor="middle" font-size="9.5" fill="#555" font-family="Georgia, serif">1+4=5</text>
  <text x="500" y="162" text-anchor="middle" font-size="9.5" fill="#446688">√5≈2.24</text>
  <line x1="280" y1="144" x2="280" y2="172" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="360" y1="144" x2="360" y2="172" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="445" y1="144" x2="445" y2="172" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- Arrow down -->
  <path d="M385 172 L385 192" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- MIN result box -->
  <rect x="240" y="192" width="290" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="385" y="212" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">MIN(dx²+dy²) = MIN(2, 1, 5) = 1</text>
  <text x="385" y="232" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">SQRT(1) = 1.00 → ROUND(1.00, 2) = 1.00</text>

  <!-- Output box -->
  <rect x="240" y="260" width="290" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="385" y="278" text-anchor="middle" font-size="10" fill="#555">最终输出：</text>
  <text x="385" y="294" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">| shortest |</text>
  <text x="430" y="294" font-size="12" fill="#b85450" font-weight="bold">| 1.00     |</text>

  <!-- Bottom note -->
  <rect x="30" y="318" width="510" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="50" y="338" font-size="10" fill="#446688" font-weight="bold">关键观察：</text>
  <text x="50" y="356" font-size="9.5" fill="#555">① 平方距离免 SQRT：对 d² 取 MIN 再开方，等价于对 d 取 MIN（√ 单调递增）</text>
  <text x="280" y="356" font-size="9.5" fill="#555">② 字典序去半：每对只算 1 次，结果不变</text>
</svg>
