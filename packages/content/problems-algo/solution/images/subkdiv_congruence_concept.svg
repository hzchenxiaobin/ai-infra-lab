<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">同余定理：余数相同 ⇔ 区间和被 K 整除</text>

  <!-- nums row -->
  <text x="40" y="74" font-size="12" fill="#888">nums:</text>
  <rect x="95" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="78" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="145" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="78" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="195" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="78" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="245" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="78" text-anchor="middle" font-size="12" fill="#333">−2</text>
  <rect x="295" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="78" text-anchor="middle" font-size="12" fill="#333">−3</text>
  <rect x="345" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="78" text-anchor="middle" font-size="12" fill="#333">1</text>

  <text x="120" y="104" text-anchor="middle" font-size="9" fill="#aaa">i=0</text>
  <text x="170" y="104" text-anchor="middle" font-size="9" fill="#aaa">i=1</text>
  <text x="220" y="104" text-anchor="middle" font-size="9" fill="#aaa">i=2</text>
  <text x="270" y="104" text-anchor="middle" font-size="9" fill="#aaa">i=3</text>
  <text x="320" y="104" text-anchor="middle" font-size="9" fill="#aaa">i=4</text>
  <text x="370" y="104" text-anchor="middle" font-size="9" fill="#aaa">i=5</text>

  <!-- prefix row -->
  <text x="40" y="146" font-size="12" fill="#888">prefix:</text>
  <rect x="45" y="130" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="150" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="95" y="130" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="150" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="145" y="130" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="150" text-anchor="middle" font-size="12" fill="#333">9</text>
  <rect x="195" y="130" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="150" text-anchor="middle" font-size="12" fill="#333">9</text>
  <rect x="245" y="130" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="150" text-anchor="middle" font-size="12" fill="#333">7</text>
  <rect x="295" y="130" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="150" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="345" y="130" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="150" text-anchor="middle" font-size="12" fill="#333">5</text>

  <text x="70" y="176" text-anchor="middle" font-size="9" fill="#aaa">p[0]</text>
  <text x="120" y="176" text-anchor="middle" font-size="9" fill="#aaa">p[1]</text>
  <text x="170" y="176" text-anchor="middle" font-size="9" fill="#aaa">p[2]</text>
  <text x="220" y="176" text-anchor="middle" font-size="9" fill="#aaa">p[3]</text>
  <text x="270" y="176" text-anchor="middle" font-size="9" fill="#aaa">p[4]</text>
  <text x="320" y="176" text-anchor="middle" font-size="9" fill="#aaa">p[5]</text>
  <text x="370" y="176" text-anchor="middle" font-size="9" fill="#aaa">p[6]</text>

  <!-- remainder row -->
  <text x="40" y="214" font-size="12" fill="#888">% 5 :</text>
  <rect x="45" y="198" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="218" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">0</text>
  <rect x="95" y="198" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="218" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">4</text>
  <rect x="145" y="198" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="218" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">4</text>
  <rect x="195" y="198" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="218" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">4</text>
  <rect x="245" y="198" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="270" y="218" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <rect x="295" y="198" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="218" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">4</text>
  <rect x="345" y="198" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="370" y="218" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">0</text>

  <!-- highlight: p[0] and p[6] both %5==0 -->
  <path d="M 70 230 Q 70 242 80 242 L 360 242 Q 370 242 370 230" stroke="#d6a040" stroke-width="2" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="220" y="258" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">余数同为 0 → nums[0..5] 之和 = 5−0 = 5 ✓</text>

  <!-- highlight: p[1]..p[5] all %5==4 -->
  <path d="M 120 230 Q 120 270 132 270 L 308 270 Q 320 270 320 230" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="220" y="286" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">余数同为 4 → C(4,2)=6 个子数组 ✓</text>

  <!-- equation box -->
  <rect x="40" y="302" width="440" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="324" text-anchor="middle" font-size="12" fill="#333">sum(i,j) = prefix[j+1] − prefix[i]</text>
  <text x="260" y="344" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">K | sum  ⇔  prefix[j+1] % K == prefix[i] % K</text>
  <text x="260" y="360" text-anchor="middle" font-size="10.5" fill="#888">同余 → 任意两个余数相同的前缀和相减，差必被 K 整除</text>
</svg>
