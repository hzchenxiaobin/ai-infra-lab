<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：进位只在末尾连续的 9 上传播</text>

  <!-- ===== Panel A: input list 1 -> 2 -> 3 ===== -->
  <text x="40" y="56" font-size="12" fill="#446688" font-weight="bold">输入：1 → 2 → 3（正序，头=最高位）</text>

  <!-- nodes: 1, 2, 3 -->
  <g filter="url(#rough2)">
    <rect x="60" y="70" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <rect x="108" y="70" width="16" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
  </g>
  <text x="84" y="92" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="116" y="92" text-anchor="middle" font-size="13" fill="#888">·</text>

  <g filter="url(#rough2)">
    <rect x="150" y="70" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <rect x="198" y="70" width="16" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
  </g>
  <text x="174" y="92" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <text x="206" y="92" text-anchor="middle" font-size="13" fill="#888">·</text>

  <g filter="url(#rough2)">
    <rect x="240" y="70" width="48" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="6"/>
    <rect x="288" y="70" width="16" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="6"/>
  </g>
  <text x="264" y="92" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">3</text>
  <text x="296" y="92" text-anchor="middle" font-size="13" fill="#888">·</text>

  <!-- arrows between nodes -->
  <path d="M 124 87 L 148 87" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 214 87 L 238 87" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- +1 at tail -->
  <text x="330" y="92" font-size="14" fill="#b85450" font-weight="bold">+1</text>
  <text x="330" y="108" font-size="10.5" fill="#b85450">最低位</text>

  <!-- arrow down -->
  <path d="M 270 120 Q 270 132 270 142" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Panel B: result 1 -> 2 -> 4 ===== -->
  <text x="40" y="160" font-size="12" fill="#4a7a3a" font-weight="bold">输出：1 → 2 → 4（末位 3 → 4，无进位）</text>

  <g filter="url(#rough2)">
    <rect x="60" y="174" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <rect x="108" y="174" width="16" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
  </g>
  <text x="84" y="196" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <g filter="url(#rough2)">
    <rect x="150" y="174" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <rect x="198" y="174" width="16" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
  </g>
  <text x="174" y="196" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>

  <g filter="url(#rough2)">
    <rect x="240" y="174" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6"/>
    <rect x="288" y="174" width="16" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6"/>
  </g>
  <text x="264" y="196" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">4</text>

  <path d="M 124 191 L 148 191" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 214 191 L 238 191" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="330" y="196" font-size="10.5" fill="#4a7a3a" font-weight="bold">3 &lt; 9，直接 +1 ✓</text>

  <!-- divider -->
  <line x1="40" y1="226" x2="500" y2="226" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Panel C: all-9 case 9 -> 9 -> 9 ===== -->
  <text x="40" y="248" font-size="12" fill="#b85450" font-weight="bold">全 9 特例：9 → 9 → 9</text>

  <g filter="url(#rough2)">
    <rect x="60" y="262" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6"/>
    <rect x="108" y="262" width="16" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6"/>
  </g>
  <text x="84" y="284" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">9</text>

  <g filter="url(#rough2)">
    <rect x="150" y="262" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6"/>
    <rect x="198" y="262" width="16" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6"/>
  </g>
  <text x="174" y="284" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">9</text>

  <g filter="url(#rough2)">
    <rect x="240" y="262" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6"/>
    <rect x="288" y="262" width="16" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6"/>
  </g>
  <text x="264" y="284" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">9</text>

  <path d="M 124 279 L 148 279" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 214 279 L 238 279" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- arrow down to result -->
  <path d="M 270 302 Q 270 312 270 322" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Panel D: result 1 -> 0 -> 0 -> 0 ===== -->
  <text x="40" y="340" font-size="12" fill="#4a7a3a" font-weight="bold">输出：1 → 0 → 0 → 0（首位补 1，其余归 0）</text>

  <g filter="url(#rough2)">
    <rect x="20" y="354" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6"/>
    <rect x="68" y="354" width="16" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6"/>
  </g>
  <text x="44" y="376" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>

  <g filter="url(#rough2)">
    <rect x="110" y="354" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <rect x="158" y="354" width="16" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
  </g>
  <text x="134" y="376" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>

  <g filter="url(#rough2)">
    <rect x="200" y="354" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <rect x="248" y="354" width="16" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
  </g>
  <text x="224" y="376" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>

  <g filter="url(#rough2)">
    <rect x="290" y="354" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <rect x="338" y="354" width="16" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
  </g>
  <text x="314" y="376" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>

  <path d="M 84 371 L 108 371" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 174 371 L 198 371" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 264 371 L 288 371" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="375" y="376" font-size="10.5" fill="#4a7a3a" font-weight="bold">dummy 新头 = 1 ✓</text>
</svg>
