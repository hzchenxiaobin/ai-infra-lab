<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#666"/>
    </marker>
    <marker id="arblue" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>
  <rect width="560" height="440" fill="#fdfcf7"/>

  <text x="280" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">插入法：往已有序列的空位中放新一对 P_i, D_i</text>
  <path d="M 120 36 Q 280 44 440 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== Section 1: existing sequence with gaps ===== -->
  <text x="48" y="68" font-size="12" fill="#446688" font-weight="bold">已有 i−1=2 对（4 项），5 个空位 ▽</text>

  <!-- gaps (circles) above the sequence -->
  <g filter="url(#sk)">
    <circle cx="62" cy="92" r="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <circle cx="134" cy="92" r="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <circle cx="206" cy="92" r="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <circle cx="278" cy="92" r="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <circle cx="350" cy="92" r="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="62" y="96" text-anchor="middle" font-size="9" fill="#7a5415" font-weight="bold">1</text>
  <text x="134" y="96" text-anchor="middle" font-size="9" fill="#7a5415" font-weight="bold">2</text>
  <text x="206" y="96" text-anchor="middle" font-size="9" fill="#7a5415" font-weight="bold">3</text>
  <text x="278" y="96" text-anchor="middle" font-size="9" fill="#7a5415" font-weight="bold">4</text>
  <text x="350" y="96" text-anchor="middle" font-size="9" fill="#7a5415" font-weight="bold">5</text>

  <!-- sequence boxes -->
  <g filter="url(#sk)">
    <rect x="74" y="106" width="48" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="146" y="106" width="48" height="30" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.6"/>
    <rect x="218" y="106" width="48" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="290" y="106" width="48" height="30" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="98" y="126" text-anchor="middle" font-size="12" fill="#2b4b6e" font-weight="bold">P₁</text>
  <text x="170" y="126" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">D₁</text>
  <text x="242" y="126" text-anchor="middle" font-size="12" fill="#2b4b6e" font-weight="bold">P₂</text>
  <text x="314" y="126" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">D₂</text>

  <text x="400" y="126" font-size="11" fill="#888">空位数 = 2(i−1)+1 = 2i−1</text>

  <!-- separator -->
  <path d="M 60 156 Q 280 164 500 156" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5 4" fill="none" filter="url(#sk)"/>

  <!-- ===== Section 2: two example insertions ===== -->
  <text x="48" y="182" font-size="12" fill="#b85450" font-weight="bold">插入 P₃, D₃：选 2 个空位（可同位，P 前 D 后）</text>

  <!-- example A: distinct gaps -->
  <text x="48" y="206" font-size="11" fill="#444" font-weight="bold">A. 空位1 放 P₃，空位4 放 D₃：</text>
  <g filter="url(#sk)">
    <rect x="44" y="216" width="44" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="90" y="216" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="136" y="216" width="44" height="28" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="182" y="216" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="228" y="216" width="44" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="274" y="216" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="320" y="216" width="44" height="28" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="66" y="235" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">P₃</text>
  <text x="112" y="235" text-anchor="middle" font-size="11" fill="#2b4b6e">P₁</text>
  <text x="158" y="235" text-anchor="middle" font-size="11" fill="#2e6e2e">D₁</text>
  <text x="204" y="235" text-anchor="middle" font-size="11" fill="#2b4b6e">P₂</text>
  <text x="250" y="235" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">D₃</text>
  <text x="296" y="235" text-anchor="middle" font-size="11" fill="#2b4b6e">D₂</text>
  <text x="342" y="235" text-anchor="middle" font-size="11" fill="#2e6e2e"></text>

  <!-- example B: same gap -->
  <text x="48" y="266" font-size="11" fill="#444" font-weight="bold">B. 空位3 同时放 P₃, D₃（P₃ 紧贴 D₃ 前）：</text>
  <g filter="url(#sk)">
    <rect x="44" y="276" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="90" y="276" width="44" height="28" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.4"/>
    <rect x="136" y="276" width="44" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="182" y="276" width="44" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="228" y="276" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="274" y="276" width="44" height="28" rx="4" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="66" y="295" text-anchor="middle" font-size="11" fill="#2b4b6e">P₁</text>
  <text x="112" y="295" text-anchor="middle" font-size="11" fill="#2e6e2e">D₁</text>
  <text x="158" y="295" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">P₃</text>
  <text x="204" y="295" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">D₃</text>
  <text x="250" y="295" text-anchor="middle" font-size="11" fill="#2b4b6e">P₂</text>
  <text x="296" y="295" text-anchor="middle" font-size="11" fill="#2e6e2e">D₂</text>

  <!-- separator -->
  <path d="M 60 326 Q 280 334 500 326" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5 4" fill="none" filter="url(#sk)"/>

  <!-- ===== Section 3: formula ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="342" width="480" height="84" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="280" y="366" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">计数公式</text>
  <path d="M 120 372 Q 280 378 440 372" stroke="#bbb" stroke-width="1" fill="none" filter="url(#sk)"/>
  <g font-size="12" fill="#444">
    <text x="58" y="392">· 2i−1 个空位中选 2 个（可重复），小者放 P_i、大者放 D_i</text>
    <text x="58" y="410" fill="#7a5415" font-weight="bold">  组合数 = C(2i−1, 2) + (2i−1) = (2i−1)(2i−2)/2 + (2i−1) = i × (2i−1)</text>
    <text x="58" y="428" fill="#b03a3a" font-weight="bold">  递推：f(i) = f(i−1) × i × (2i−1)，f(1) = 1</text>
  </g>
</svg>
