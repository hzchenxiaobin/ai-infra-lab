<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：取列 → 向量化 ×2 → 整列回写 → 返回</text>

  <!-- Step 1 -->
  <rect x="18" y="96" width="108" height="104" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="72" y="120" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">① 取列</text>
  <text x="72" y="142" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">employees['salary']</text>
  <text x="72" y="160" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">得到 Series</text>
  <text x="72" y="178" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">dtype: int64</text>

  <path d="M 128 148 L 140 148" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="142" y="96" width="108" height="104" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="196" y="120" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">② 广播 ×2</text>
  <text x="196" y="142" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">Series * 2</text>
  <text x="196" y="160" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">标量广播到全列</text>
  <text x="196" y="178" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">C 层一趟算完</text>

  <path d="M 252 148 L 264 148" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="266" y="96" width="108" height="104" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="120" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">③ 整列回写</text>
  <text x="320" y="142" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">df['salary'] = 新列</text>
  <text x="320" y="160" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">__setitem__</text>
  <text x="320" y="178" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">替换整个列块</text>

  <path d="M 376 148 L 388 148" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4 -->
  <rect x="390" y="96" width="108" height="104" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="444" y="120" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">④ 返回</text>
  <text x="444" y="142" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">return employees</text>
  <text x="444" y="160" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">行顺序保持</text>
  <text x="444" y="178" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">name / 索引不动</text>

  <!-- Note: no python loop -->
  <text x="260" y="228" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">全程没有 Python 层循环——「整列一把算」是 pandas 的第一直觉</text>

  <!-- Bottom perf box -->
  <rect x="40" y="250" width="440" height="88" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="274" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">⚠️ 性能对照（1,000,000 行实测，pandas 3.0）</text>
  <text x="260" y="298" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">向量化 * 2 ≈ 6 ms　·　apply ≈ 0.7 s（慢约 100 倍）</text>
  <text x="260" y="320" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">iterrows ≈ 45 s（慢约 7000 倍，逐行拆装箱的代价）</text>
</svg>
