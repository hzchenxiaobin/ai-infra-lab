<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="410" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">迭代法流程：沿左脊下移 + 三指针重连</text>

  <!-- 初始化 -->
  <rect x="170" y="44" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">初始化</text>
  <text x="270" y="76" text-anchor="middle" font-size="10" fill="#444">cur=root, prev=null, prev_right=null</text>

  <path d="M 270 84 L 270 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 cur==null -->
  <polygon points="270,104 360,140 270,176 180,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="136" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">cur == null?</text>
  <text x="270" y="152" text-anchor="middle" font-size="9" fill="#888">（走完左脊）</text>

  <!-- 是 → 返回 -->
  <path d="M 360 140 L 430 140" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="395" y="132" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="430" y="122" width="100" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="480" y="144" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return prev</text>

  <!-- 否 → 保存 -->
  <path d="M 270 176 L 270 192" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="186" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <rect x="120" y="196" width="300" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="214" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">保存旧引用（先存后改，防覆盖丢失）</text>
  <text x="270" y="232" text-anchor="middle" font-size="10" fill="#444">next_cur = cur.left　cur_right = cur.right</text>

  <path d="M 270 242 L 270 258" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 重连 -->
  <rect x="80" y="262" width="380" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="282" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">三指针重连（原左子 node.left 已是新根候选）</text>
  <text x="270" y="300" text-anchor="middle" font-size="10" fill="#444">cur.left ← prev_right　（父的兄弟 → 我的新左）</text>
  <text x="270" y="316" text-anchor="middle" font-size="10" fill="#444">cur.right ← prev　　　　（父　　 → 我的新右）</text>

  <path d="M 270 320 L 270 336" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 推进 -->
  <rect x="120" y="340" width="300" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="358" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">沿左脊下移一格</text>
  <text x="270" y="374" text-anchor="middle" font-size="10" fill="#444">prev=cur, prev_right=cur_right, cur=next_cur</text>

  <!-- 回到判断 -->
  <path d="M 120 361 L 60 361 L 60 140 L 180 140" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="68" y="250" font-size="9" fill="#888">循环</text>

  <rect x="20" y="392" width="500" height="14" fill="none"/>
  <text x="270" y="402" text-anchor="middle" font-size="10" fill="#888">每轮 O(1)；总轮数 = 左脊长度 ≤ n</text>
</svg>
