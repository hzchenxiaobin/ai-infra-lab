<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "0110101"，逐字符更新 ans</text>

  <!-- string cells on top for reference -->
  <g filter="url(#rough2)">
    <rect x="170" y="42" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="190" y="62" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">0</text>
    <rect x="210" y="42" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="230" y="62" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">1</text>
    <rect x="250" y="42" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="270" y="62" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">1</text>
    <rect x="290" y="42" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="310" y="62" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">0</text>
    <rect x="330" y="42" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="350" y="62" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">1</text>
    <rect x="370" y="42" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="390" y="62" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">0</text>
    <rect x="410" y="42" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="430" y="62" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">1</text>
  </g>

  <!-- position indices below cells -->
  <text x="190" y="86" text-anchor="middle" font-size="10" fill="#999">0</text>
  <text x="230" y="86" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="270" y="86" text-anchor="middle" font-size="10" fill="#999">2</text>
  <text x="310" y="86" text-anchor="middle" font-size="10" fill="#999">3</text>
  <text x="350" y="86" text-anchor="middle" font-size="10" fill="#999">4</text>
  <text x="390" y="86" text-anchor="middle" font-size="10" fill="#999">5</text>
  <text x="430" y="86" text-anchor="middle" font-size="10" fill="#999">6</text>

  <!-- ============ Table ============ -->
  <!-- header row at y=110 -->
  <g filter="url(#rough2)">
    <rect x="40" y="110" width="540" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="80"  y="129" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">步</text>
    <text x="140" y="129" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">字符</text>
    <text x="220" y="129" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">zeros</text>
    <text x="340" y="129" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">max(ans+1, zeros)</text>
    <text x="500" y="129" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans / 说明</text>
    <!-- column dividers -->
    <line x1="120" y1="110" x2="120" y2="140" stroke="#446688" stroke-width="1"/>
    <line x1="180" y1="110" x2="180" y2="140" stroke="#446688" stroke-width="1"/>
    <line x1="260" y1="110" x2="260" y2="140" stroke="#446688" stroke-width="1"/>
    <line x1="420" y1="110" x2="420" y2="140" stroke="#446688" stroke-width="1"/>
  </g>

  <!-- row helper: 7 rows starting y=140, each h=30 -->
  <g filter="url(#rough2)">
    <!-- row 0: char 0, zeros->1, ans 0 -->
    <rect x="40" y="140" width="540" height="30" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
    <text x="80"  y="160" text-anchor="middle" font-size="12" fill="#444">0</text>
    <text x="140" y="160" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">0</text>
    <text x="220" y="160" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
    <text x="340" y="160" text-anchor="middle" font-size="12" fill="#888">—</text>
    <text x="500" y="160" text-anchor="middle" font-size="12" fill="#888">ans = 0（计 0）</text>

    <!-- row 1: char 1, zeros 1, max(0+1,1)=1 -->
    <rect x="40" y="170" width="540" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <text x="80"  y="190" text-anchor="middle" font-size="12" fill="#444">1</text>
    <text x="140" y="190" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
    <text x="220" y="190" text-anchor="middle" font-size="12" fill="#444">1</text>
    <text x="340" y="190" text-anchor="middle" font-size="12" fill="#333">max(0+1, 1) = <tspan fill="#b85450" font-weight="bold">1</tspan></text>
    <text x="500" y="190" text-anchor="middle" font-size="12" fill="#888">ans = 1（穿越 1 个 0）</text>

    <!-- row 2: char 1, zeros 1, max(1+1,1)=2 -->
    <rect x="40" y="200" width="540" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <text x="80"  y="220" text-anchor="middle" font-size="12" fill="#444">2</text>
    <text x="140" y="220" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
    <text x="220" y="220" text-anchor="middle" font-size="12" fill="#444">1</text>
    <text x="340" y="220" text-anchor="middle" font-size="12" fill="#333">max(1+1, 1) = <tspan fill="#b85450" font-weight="bold">2</tspan></text>
    <text x="500" y="220" text-anchor="middle" font-size="12" fill="#888">ans = 2（排队 +1）</text>

    <!-- row 3: char 0, zeros->2, ans 2 -->
    <rect x="40" y="230" width="540" height="30" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
    <text x="80"  y="250" text-anchor="middle" font-size="12" fill="#444">3</text>
    <text x="140" y="250" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">0</text>
    <text x="220" y="250" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
    <text x="340" y="250" text-anchor="middle" font-size="12" fill="#888">—</text>
    <text x="500" y="250" text-anchor="middle" font-size="12" fill="#888">ans = 2（计 0）</text>

    <!-- row 4: char 1, zeros 2, max(2+1,2)=3 -->
    <rect x="40" y="260" width="540" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/>
    <text x="80"  y="280" text-anchor="middle" font-size="12" fill="#444">4</text>
    <text x="140" y="280" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
    <text x="220" y="280" text-anchor="middle" font-size="12" fill="#444">2</text>
    <text x="340" y="280" text-anchor="middle" font-size="12" fill="#333">max(2+1, 2) = <tspan fill="#b85450" font-weight="bold">3</tspan></text>
    <text x="500" y="280" text-anchor="middle" font-size="12" fill="#888">ans = 3（排队 +1）</text>

    <!-- row 5: char 0, zeros->3, ans 3 -->
    <rect x="40" y="290" width="540" height="30" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
    <text x="80"  y="310" text-anchor="middle" font-size="12" fill="#444">5</text>
    <text x="140" y="310" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">0</text>
    <text x="220" y="310" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
    <text x="340" y="310" text-anchor="middle" font-size="12" fill="#888">—</text>
    <text x="500" y="310" text-anchor="middle" font-size="12" fill="#888">ans = 3（计 0）</text>

    <!-- row 6: char 1, zeros 3, max(3+1,3)=4 -->
    <rect x="40" y="320" width="540" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="80"  y="340" text-anchor="middle" font-size="12" fill="#444">6</text>
    <text x="140" y="340" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
    <text x="220" y="340" text-anchor="middle" font-size="12" fill="#444">3</text>
    <text x="340" y="340" text-anchor="middle" font-size="12" fill="#333">max(3+1, 3) = <tspan fill="#b85450" font-weight="bold">4</tspan></text>
    <text x="500" y="340" text-anchor="middle" font-size="12" fill="#888">ans = 4（排队 +1）</text>
  </g>

  <!-- result box -->
  <rect x="120" y="366" width="380" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="310" y="391" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">最终 ans = 4，与模拟 4 秒一致 ✓</text>
</svg>
