<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：正向算长度 + 逆向定位字符</text>

  <!-- ===== Phase 1 label ===== -->
  <rect x="20" y="36" width="110" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="52" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">阶段一：正向</text>

  <!-- Start node -->
  <rect x="200" y="38" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="58" text-anchor="middle" font-size="11" fill="#333">size = 0, i = 0</text>

  <!-- arrow down -->
  <path d="M 260 70 L 260 84" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: i < n ? -->
  <polygon points="260,86 340,116 260,146 180,116" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="112" text-anchor="middle" font-size="11" fill="#333">i &lt; n ?</text>
  <text x="260" y="126" text-anchor="middle" font-size="10" fill="#888">且 size &lt; k</text>

  <!-- No branch -> phase 2 -->
  <path d="M 340 116 L 400 116 L 400 180" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="352" y="110" font-size="10" fill="#b85450">否</text>

  <!-- Yes branch down -->
  <path d="M 260 146 L 260 160" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="248" y="156" font-size="10" fill="#4a7a3a">是</text>

  <!-- Decision: isdigit(s[i]) ? -->
  <polygon points="260,162 350,192 260,222 170,192" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="188" text-anchor="middle" font-size="11" fill="#333">s[i] 是数字?</text>

  <!-- Yes (digit) -> right -->
  <path d="M 350 192 L 410 192" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="186" font-size="10" fill="#4a7a3a">是</text>

  <rect x="410" y="178" width="130" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="475" y="198" text-anchor="middle" font-size="11" fill="#333">size *= s[i] − '0'</text>

  <!-- No (letter) -> left -->
  <path d="M 170 192 L 110 192" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="130" y="186" font-size="10" fill="#b85450">否</text>

  <rect x="20" y="178" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="65" y="198" text-anchor="middle" font-size="11" fill="#333">size += 1</text>

  <!-- Both merge to i++ -->
  <path d="M 475 208 L 475 226 L 260 226" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 65 208 L 65 226 L 260 226" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 260 226 L 260 86" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="238" font-size="10" fill="#888">i++, 回到循环</text>

  <!-- ===== Phase 2 label ===== -->
  <rect x="20" y="172" width="0" height="0" fill="none"/>

  <!-- Phase 2 starts -->
  <rect x="340" y="172" width="120" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="400" y="188" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">阶段二：逆向</text>

  <!-- arrow from phase 1 No to phase 2 box -->
  <!-- already drawn above to 400,180 -->

  <!-- Backward start -->
  <rect x="340" y="250" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="400" y="270" text-anchor="middle" font-size="11" fill="#333">j = i, 从右往左</text>

  <path d="M 400 280 L 400 294" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: j >= 0 ? -->
  <polygon points="400,296 470,322 400,348 330,322" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="400" y="326" text-anchor="middle" font-size="11" fill="#333">j ≥ 0 ?</text>

  <!-- No -> done -->
  <path d="M 470 322 L 510 322" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="480" y="316" font-size="10" fill="#b85450">否</text>
  <rect x="500" y="308" width="50" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="525" y="326" text-anchor="middle" font-size="10" fill="#b85450">结束</text>

  <!-- Yes -> down -->
  <path d="M 400 348 L 400 360" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="388" y="356" font-size="10" fill="#4a7a3a">是</text>

  <!-- Decision: isdigit(s[j]) ? -->
  <polygon points="400,362 480,390 400,418 320,390" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="400" y="388" text-anchor="middle" font-size="11" fill="#333">s[j] 是数字?</text>

  <!-- Yes (digit) -> left -->
  <path d="M 320 390 L 250 390" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="384" font-size="10" fill="#4a7a3a">是</text>

  <rect x="120" y="376" width="130" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="185" y="396" text-anchor="middle" font-size="10" fill="#333">size /= d; k %= size</text>
  <text x="185" y="436" text-anchor="middle" font-size="9" fill="#888">k==0 则 k=size</text>

  <!-- No (letter) -> right -->
  <path d="M 480 390 L 510 390" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="488" y="384" font-size="10" fill="#b85450">否</text>

  <!-- Decision: k == size ? -->
  <polygon points="560,376 560,376 560,404 560,404" fill="none"/>
  <rect x="500" y="376" width="55" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="527" y="388" text-anchor="middle" font-size="9" fill="#333">k==size?</text>

  <!-- This is getting cramped, let me simplify the right side -->
  <!-- k==size -> return -->
  <path d="M 527 404 L 527 416 L 400 416 L 400 296" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="440" y="430" font-size="10" fill="#b85450" font-weight="bold">是 → 返回 s[j]!</text>

  <!-- k!=size -> size-=1, j--, loop -->
  <path d="M 500 390 L 470 390 L 470 440 L 400 440 L 400 296" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="448" y="452" font-size="9" fill="#888">否 → size-=1, j--</text>

  <!-- left digit branch: after processing, j-- and loop back -->
  <path d="M 185 406 L 185 440 L 330 440 L 330 322" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="250" y="434" font-size="9" fill="#888">j--</text>

  <!-- Note box -->
  <rect x="20" y="296" width="280" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="160" y="316" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">逆向折叠原理</text>
  <text x="160" y="332" text-anchor="middle" font-size="10" fill="#555">数字 d 把单份重复了 d 次</text>
  <text x="160" y="346" text-anchor="middle" font-size="10" fill="#555">→ k 对单份取余即可折叠回去</text>
</svg>
