<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="9" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="1.2"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="680" height="400" fill="#fdfcf7"/>

  <!-- Title -->
  <text x="340" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">填充书架：枚举最后一层（一维 DP）</text>
  <path d="M 190 38 Q 340 46 490 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Formula box -->
  <g filter="url(#sk)"><rect x="50" y="56" width="580" height="42" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="340" y="83" text-anchor="middle" font-size="13" fill="#2e6e2e" font-weight="bold">dp[i] = min&#123; dp[j-1] + max(height[j-1..i-1]) &#125;   (j 倒序, 厚度超限即 break)</text>

  <!-- Section label -->
  <text x="340" y="124" text-anchor="middle" font-size="12" font-weight="bold" fill="#5a3a7a">books 序列（顺序固定）→ 枚举切分点 j</text>

  <!-- Baseline (shelf) -->
  <path d="M 175 262 L 510 262" stroke="#888" stroke-width="1.6" fill="none" filter="url(#sk)"/>

  <!-- book 0: t=1,h=1 -->
  <g filter="url(#sk2)"><rect x="192" y="242" width="30" height="20" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="207" y="257" text-anchor="middle" font-size="9" fill="#333">0</text>
  <text x="207" y="278" text-anchor="middle" font-size="8" fill="#888">t1 h1</text>

  <!-- book 1: t=2,h=3 -->
  <g filter="url(#sk2)"><rect x="226" y="202" width="60" height="60" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="256" y="237" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="256" y="278" text-anchor="middle" font-size="8" fill="#888">t2 h3</text>

  <!-- book 2: t=2,h=3 -->
  <g filter="url(#sk2)"><rect x="290" y="202" width="60" height="60" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3"/></g>
  <text x="320" y="237" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="320" y="278" text-anchor="middle" font-size="8" fill="#888">t2 h3</text>

  <!-- book 3: t=1,h=1 -->
  <g filter="url(#sk2)"><rect x="356" y="242" width="30" height="20" rx="2" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="371" y="257" text-anchor="middle" font-size="9" fill="#333">3</text>
  <text x="371" y="278" text-anchor="middle" font-size="8" fill="#888">t1 h1</text>

  <!-- book 4: t=1,h=1 -->
  <g filter="url(#sk2)"><rect x="390" y="242" width="30" height="20" rx="2" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="405" y="257" text-anchor="middle" font-size="9" fill="#333">4</text>
  <text x="405" y="278" text-anchor="middle" font-size="8" fill="#888">t1 h1</text>

  <!-- book 5: t=1,h=1 -->
  <g filter="url(#sk2)"><rect x="424" y="242" width="30" height="20" rx="2" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="439" y="257" text-anchor="middle" font-size="9" fill="#333">5</text>
  <text x="439" y="278" text-anchor="middle" font-size="8" fill="#888">t1 h1</text>

  <!-- book 6: t=1,h=2 -->
  <g filter="url(#sk2)"><rect x="458" y="222" width="30" height="40" rx="2" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="473" y="247" text-anchor="middle" font-size="9" fill="#333">6</text>
  <text x="473" y="278" text-anchor="middle" font-size="8" fill="#888">t1 h2</text>

  <!-- Split line at j=4 (between book 2 and book 3) -->
  <path d="M 353 150 L 353 272" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3" fill="none" filter="url(#sk)"/>
  <text x="353" y="146" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">切分点 j=4</text>

  <!-- Left bracket & label -->
  <path d="M 192 266 Q 192 290 202 290 L 343 290 Q 353 290 353 266" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="266" y="306" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">dp[j-1]=dp[3]（前缀已解决）</text>

  <!-- Right bracket & label -->
  <path d="M 353 266 Q 353 290 363 290 L 478 290 Q 488 290 488 266" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="420" y="306" text-anchor="middle" font-size="11" fill="#8a6a1a" font-weight="bold">最后一层: max(h)=2</text>

  <!-- Bottom combination -->
  <!-- dp[j-1] box -->
  <g filter="url(#sk)"><rect x="80" y="328" width="160" height="40" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="160" y="353" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">dp[j-1]（前缀最优）</text>

  <!-- + -->
  <text x="268" y="356" text-anchor="middle" font-size="20" fill="#5a5a5a" font-weight="bold">+</text>

  <!-- last shelf box -->
  <g filter="url(#sk)"><rect x="290" y="328" width="160" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="370" y="353" text-anchor="middle" font-size="12" fill="#8a6a1a" font-weight="bold">max(h)（末层层高）</text>

  <!-- = -->
  <text x="478" y="356" text-anchor="middle" font-size="20" fill="#5a5a5a" font-weight="bold">=</text>

  <!-- dp[i] result -->
  <g filter="url(#sk)"><rect x="498" y="328" width="140" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/></g>
  <text x="568" y="353" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold">dp[i]（取 min）</text>
</svg>
