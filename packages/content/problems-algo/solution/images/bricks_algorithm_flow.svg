<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="480" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">逆向并查集算法流程</text>

  <!-- Step 1: apply all hits -->
  <rect x="140" y="42" width="260" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="60" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">① 对每个 hit 位置 grid[r][c] −−</text>
  <text x="270" y="76" text-anchor="middle" font-size="10" fill="#666">原 1→0（被敲），原 0→−1（空位误击）</text>
  <line x1="270" y1="86" x2="270" y2="104" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: init UF + union remaining bricks -->
  <rect x="100" y="104" width="340" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="124" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">② 初始化并查集（m×n+1 个节点，+1 = roof）</text>
  <text x="270" y="140" text-anchor="middle" font-size="10.5" fill="#666">所有 grid==1 的格子与四邻 union</text>
  <text x="270" y="154" text-anchor="middle" font-size="10.5" fill="#666">第 0 行砖块额外与 roof union（标记稳定）</text>
  <line x1="270" y1="162" x2="270" y2="180" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: reverse loop header -->
  <rect x="120" y="180" width="300" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="201" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">③ 逆序遍历 hits[i]（i 从 n−1 到 0）</text>
  <line x1="270" y1="214" x2="270" y2="232" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: grid == -1? -->
  <path d="M 270 232 L 400 274 L 270 316 L 140 274 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="270" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">grid[r][c] == −1 ?</text>
  <text x="270" y="286" text-anchor="middle" font-size="10" fill="#888">原位置本就空</text>

  <!-- Yes branch -->
  <text x="412" y="270" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <line x1="400" y1="274" x2="450" y2="274" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="440" y="256" width="96" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="488" y="273" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">result[i]=0</text>
  <text x="488" y="287" text-anchor="middle" font-size="10" fill="#888">恢复 grid=0</text>

  <!-- No branch -->
  <text x="112" y="270" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <line x1="140" y1="274" x2="100" y2="274" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="14" y="256" width="86" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="57" y="273" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">补砖</text>
  <text x="57" y="287" text-anchor="middle" font-size="10" fill="#666">grid=1</text>

  <!-- No branch continues down -->
  <line x1="57" y1="294" x2="57" y2="324" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- before -->
  <rect x="14" y="324" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="104" y="345" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">before = size[find(roof)]</text>

  <!-- union with neighbors -->
  <rect x="210" y="324" width="280" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="350" y="345" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">第 0 行则 union(roof)；四邻 union</text>

  <line x1="194" y1="341" x2="210" y2="341" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <line x1="350" y1="358" x2="350" y2="378" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- after + compute -->
  <rect x="140" y="378" width="320" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="396" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">after = size[find(roof)]</text>
  <text x="300" y="412" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">result[i] = max(0, after − before − 1)</text>

  <!-- loop back arrow -->
  <path d="M 460 400 Q 510 400 510 197 Q 510 197 420 197" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="496" y="300" font-size="10" fill="#888" transform="rotate(-90 496 300)">下一个 hit（逆序）</text>

  <!-- end note -->
  <rect x="40" y="442" width="460" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="270" y="460" text-anchor="middle" font-size="10.5" fill="#444">after − before − 1：补砖带回来的「其他砖」数，−1 扣除被敲砖本身</text>
</svg>
