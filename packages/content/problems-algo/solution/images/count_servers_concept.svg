<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：行列计数法</text>

  <!-- Grid label -->
  <text x="60" y="52" font-size="11" fill="#888">grid</text>

  <!-- Column headers -->
  <text x="135" y="52" text-anchor="middle" font-size="10" fill="#aaa">col 0</text>
  <text x="190" y="52" text-anchor="middle" font-size="10" fill="#aaa">col 1</text>
  <text x="245" y="52" text-anchor="middle" font-size="10" fill="#aaa">col 2</text>
  <text x="300" y="52" text-anchor="middle" font-size="10" fill="#aaa">col 3</text>

  <!-- Row labels -->
  <text x="92" y="85" text-anchor="middle" font-size="10" fill="#aaa">row 0</text>
  <text x="92" y="140" text-anchor="middle" font-size="10" fill="#aaa">row 1</text>
  <text x="92" y="195" text-anchor="middle" font-size="10" fill="#aaa">row 2</text>
  <text x="92" y="250" text-anchor="middle" font-size="10" fill="#aaa">row 3</text>

  <!-- Row 0: 1 1 0 0 -->
  <rect x="110" y="60" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="135" y="92" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="165" y="60" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="92" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="220" y="60" width="50" height="50" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="245" y="92" text-anchor="middle" font-size="14" fill="#ccc">0</text>
  <rect x="275" y="60" width="50" height="50" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="300" y="92" text-anchor="middle" font-size="14" fill="#ccc">0</text>

  <!-- Row 1: 0 0 1 0 -->
  <rect x="110" y="115" width="50" height="50" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="135" y="147" text-anchor="middle" font-size="14" fill="#ccc">0</text>
  <rect x="165" y="115" width="50" height="50" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="190" y="147" text-anchor="middle" font-size="14" fill="#ccc">0</text>
  <rect x="220" y="115" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="245" y="147" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="275" y="115" width="50" height="50" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="300" y="147" text-anchor="middle" font-size="14" fill="#ccc">0</text>

  <!-- Row 2: 0 0 1 0 -->
  <rect x="110" y="170" width="50" height="50" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="135" y="202" text-anchor="middle" font-size="14" fill="#ccc">0</text>
  <rect x="165" y="170" width="50" height="50" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="190" y="202" text-anchor="middle" font-size="14" fill="#ccc">0</text>
  <rect x="220" y="170" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="245" y="202" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="275" y="170" width="50" height="50" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="300" y="202" text-anchor="middle" font-size="14" fill="#ccc">0</text>

  <!-- Row 3: 0 0 0 1 -->
  <rect x="110" y="225" width="50" height="50" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="135" y="257" text-anchor="middle" font-size="14" fill="#ccc">0</text>
  <rect x="165" y="225" width="50" height="50" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="190" y="257" text-anchor="middle" font-size="14" fill="#ccc">0</text>
  <rect x="220" y="225" width="50" height="50" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="245" y="257" text-anchor="middle" font-size="14" fill="#ccc">0</text>
  <rect x="275" y="225" width="50" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="300" y="257" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">1</text>

  <!-- Row counts (right side) -->
  <text x="345" y="52" font-size="11" fill="#888" font-weight="bold">行计数</text>
  <rect x="345" y="68" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="365" y="90" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">2</text>
  <path d="M 340 85 L 330 85" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="345" y="123" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="365" y="145" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
  <path d="M 340 140 L 330 140" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="345" y="178" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="365" y="200" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
  <path d="M 340 195 L 330 195" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="345" y="233" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="365" y="255" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
  <path d="M 340 250 L 330 250" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Column counts (bottom) -->
  <text x="110" y="300" font-size="11" fill="#888" font-weight="bold">列计数</text>
  <rect x="118" y="285" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="305" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <rect x="173" y="285" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="305" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <rect x="228" y="285" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="245" y="305" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
  <rect x="283" y="285" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="305" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>

  <!-- Divider -->
  <path d="M 40 335 L 520 335" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Formula box -->
  <rect x="60" y="348" width="440" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="368" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">服务器 (i, j) 可通信 ⟺ rowCount[i] &gt; 1 或 colCount[j] &gt; 1</text>
  <text x="280" y="384" text-anchor="middle" font-size="11" fill="#888">绿色 = 可通信（4 台）  红色 = 孤立（1 台）  答案 = 4</text>
</svg>
