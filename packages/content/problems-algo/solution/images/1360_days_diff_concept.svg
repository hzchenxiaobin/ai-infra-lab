<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrC" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：日期 → 天数序号 → 绝对差</text>

  <text x="40" y="74" font-size="11" fill="#888" filter="url(#rough2)">epoch</text>
  <rect x="40" y="80" width="90" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="85" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1971-01-01</text>
  <text x="85" y="116" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">序号 = 0</text>

  <line x1="130" y1="102" x2="400" y2="102" stroke="#446688" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <rect x="180" y="80" width="100" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="230" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">date1</text>
  <text x="230" y="116" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">序号 = n₁</text>

  <path d="M180,102 L155,102" stroke="#446688" stroke-width="1.5" marker-end="url(#arrC)" fill="none" filter="url(#rough2)"/>
  <text x="167" y="94" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">n₁ 天</text>

  <rect x="400" y="80" width="100" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="450" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">date2</text>
  <text x="450" y="116" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">序号 = n₂</text>

  <path d="M400,102 L285,102" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="345" y="94" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">|n₁ − n₂| 天</text>

  <rect x="40" y="150" width="460" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="173" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">答案 = |elapsed(date1) − elapsed(date2)|</text>

  <text x="260" y="208" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">elapsed 日期序号 = 三段累加</text>

  <rect x="30" y="222" width="150" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="105" y="244" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">① 完整年</text>
  <text x="105" y="262" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">(Y−1971)×365</text>
  <text x="105" y="278" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">+ 闰年计数</text>

  <rect x="185" y="222" width="150" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="244" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">② 完整月</text>
  <text x="260" y="262" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">prefix[M−1]</text>
  <text x="260" y="278" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">平年前缀和表</text>

  <rect x="340" y="222" width="150" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="415" y="244" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">③ 当月日</text>
  <text x="415" y="262" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">D − 1</text>
  <text x="415" y="278" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">+ 闰年修正</text>

  <rect x="60" y="310" width="400" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="330" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">闰年计数公式（容斥）：</text>
  <text x="260" y="348" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">leap(y) = ⌊y/4⌋ − ⌊y/100⌋ + ⌊y/400⌋</text>
</svg>
