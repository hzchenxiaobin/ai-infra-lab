<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1：nums = [2,3,0,0,2]，k = 4</text>

  <!-- header row -->
  <rect x="40" y="44" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="63" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i</text>
  <rect x="80" y="44" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="63" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">nums[i]</text>
  <rect x="150" y="44" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="185" y="63" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">cost(i)</text>
  <rect x="220" y="44" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="63" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">dp[i]</text>
  <rect x="280" y="44" width="220" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="390" y="63" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">计算</text>

  <!-- row 0 -->
  <rect x="40" y="76" width="40" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="60" y="95" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="80" y="76" width="70" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="115" y="95" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="150" y="76" width="70" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="185" y="95" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="220" y="76" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="95" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="280" y="76" width="220" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="390" y="95" text-anchor="middle" font-size="11" fill="#555">边界 = cost(0)</text>

  <!-- row 1 -->
  <rect x="40" y="108" width="40" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="60" y="127" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="80" y="108" width="70" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="115" y="127" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="150" y="108" width="70" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="185" y="127" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="220" y="108" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="127" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="280" y="108" width="220" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="390" y="127" text-anchor="middle" font-size="11" fill="#555">边界 = cost(1)</text>

  <!-- row 2 -->
  <rect x="40" y="140" width="40" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="60" y="159" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="80" y="140" width="70" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="115" y="159" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="150" y="140" width="70" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="185" y="159" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="220" y="140" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="159" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="280" y="140" width="220" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="390" y="159" text-anchor="middle" font-size="11" fill="#555">边界 = cost(2)</text>

  <!-- row 3 -->
  <rect x="40" y="172" width="40" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="60" y="191" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="80" y="172" width="70" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="115" y="191" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="150" y="172" width="70" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="185" y="191" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="220" y="172" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="191" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="280" y="172" width="220" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="390" y="191" text-anchor="middle" font-size="11" fill="#555">4 + min(2, 1, 4) = 5</text>

  <!-- row 4 -->
  <rect x="40" y="204" width="40" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="60" y="223" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="80" y="204" width="70" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="115" y="223" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="150" y="204" width="70" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="185" y="223" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="220" y="204" width="60" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="223" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="280" y="204" width="220" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="390" y="223" text-anchor="middle" font-size="11" fill="#555">2 + min(1, 4, 5) = 3</text>

  <!-- answer box -->
  <rect x="60" y="252" width="400" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="275" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans = min(dp[2], dp[3], dp[4]) = min(4, 5, 3) = 3 ✓</text>

  <!-- backtrack -->
  <rect x="60" y="304" width="400" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="321" text-anchor="middle" font-size="11" fill="#555">回溯：dp[4] ← dp[1] + cost(4)，哨兵集 {1, 4}（间距 3）</text>
  <text x="260" y="337" text-anchor="middle" font-size="11" fill="#555">对应官方解：抬 i=1 一次、i=4 两次 → [2,4,0,0,4]</text>
</svg>
