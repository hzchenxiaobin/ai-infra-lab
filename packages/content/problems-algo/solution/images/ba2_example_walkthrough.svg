<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>
  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：n=5, k=3 → 构造 [1,2,5,3,4]</text>

  <!-- header row -->
  <g filter="url(#rough2)">
    <rect x="20" y="40" width="520" height="24" fill="#446688" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="40" y="56" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">步骤</text>
    <text x="110" y="56" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">操作（toggle）</text>
    <text x="200" y="56" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">lo / hi</text>
    <text x="330" y="56" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">数组状态</text>
    <text x="475" y="56" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">新增差值</text>
  </g>

  <!-- step 0: 前段 -->
  <g filter="url(#rough2)">
    <rect x="20" y="64" width="520" height="40" fill="#e8f0fe" stroke="#c0d0e8" stroke-width="0.8"/>
    <text x="40" y="88" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">0</text>
    <text x="110" y="88" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">前段 [1..n−k]</text>
    <text x="200" y="88" text-anchor="middle" font-size="10" fill="#555">3 / 5</text>
    <rect x="270" y="70" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3"/>
    <text x="285" y="88" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
    <rect x="302" y="70" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3"/>
    <text x="317" y="88" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
    <text x="475" y="88" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">|2−1|=1</text>
  </g>

  <!-- step 1: toggle true -> hi=5 -->
  <g filter="url(#rough2)">
    <rect x="20" y="104" width="520" height="40" fill="#fff8e1" stroke="#e8d090" stroke-width="0.8"/>
    <text x="40" y="128" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
    <text x="110" y="128" text-anchor="middle" font-size="10" fill="#a07820" font-weight="bold">true → 取 hi</text>
    <text x="200" y="128" text-anchor="middle" font-size="10" fill="#555">3 / 4</text>
    <rect x="270" y="110" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="285" y="128" text-anchor="middle" font-size="11" fill="#446688">1</text>
    <rect x="302" y="110" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="317" y="128" text-anchor="middle" font-size="11" fill="#446688">2</text>
    <rect x="334" y="110" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="3"/>
    <text x="349" y="128" text-anchor="middle" font-size="11" fill="#a07820" font-weight="bold">5</text>
    <text x="475" y="128" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">|5−2|=3 ★</text>
  </g>

  <!-- step 2: toggle false -> lo=3 -->
  <g filter="url(#rough2)">
    <rect x="20" y="144" width="520" height="40" fill="#fff8e1" stroke="#e8d090" stroke-width="0.8"/>
    <text x="40" y="168" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
    <text x="110" y="168" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">false → 取 lo</text>
    <text x="200" y="168" text-anchor="middle" font-size="10" fill="#555">4 / 4</text>
    <rect x="270" y="150" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="285" y="168" text-anchor="middle" font-size="11" fill="#446688">1</text>
    <rect x="302" y="150" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="317" y="168" text-anchor="middle" font-size="11" fill="#446688">2</text>
    <rect x="334" y="150" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <text x="349" y="168" text-anchor="middle" font-size="11" fill="#a07820">5</text>
    <rect x="366" y="150" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="3"/>
    <text x="381" y="168" text-anchor="middle" font-size="11" fill="#a07820" font-weight="bold">3</text>
    <text x="475" y="168" text-anchor="middle" font-size="10.5" fill="#a07820" font-weight="bold">|3−5|=2 ★</text>
  </g>

  <!-- step 3: toggle true -> hi=4 -->
  <g filter="url(#rough2)">
    <rect x="20" y="184" width="520" height="40" fill="#fff8e1" stroke="#e8d090" stroke-width="0.8"/>
    <text x="40" y="208" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
    <text x="110" y="208" text-anchor="middle" font-size="10" fill="#a07820" font-weight="bold">true → 取 hi</text>
    <text x="200" y="208" text-anchor="middle" font-size="10" fill="#555">4 / 3</text>
    <rect x="270" y="190" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="285" y="208" text-anchor="middle" font-size="11" fill="#446688">1</text>
    <rect x="302" y="190" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="317" y="208" text-anchor="middle" font-size="11" fill="#446688">2</text>
    <rect x="334" y="190" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <text x="349" y="208" text-anchor="middle" font-size="11" fill="#a07820">5</text>
    <rect x="366" y="190" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <text x="381" y="208" text-anchor="middle" font-size="11" fill="#a07820">3</text>
    <rect x="398" y="190" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="3"/>
    <text x="413" y="208" text-anchor="middle" font-size="11" fill="#a07820" font-weight="bold">4</text>
    <text x="475" y="208" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">|4−3|=1</text>
  </g>

  <!-- end row -->
  <g filter="url(#rough2)">
    <rect x="20" y="226" width="520" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="280" y="244" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">lo=4 &gt; hi=3 停止 → ans = [1, 2, 5, 3, 4]</text>
  </g>

  <!-- diff set summary -->
  <rect x="20" y="266" width="520" height="74" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="290" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">差值序列：1, 3, 2, 1 → 集合 {1, 2, 3}</text>
  <text x="280" y="310" text-anchor="middle" font-size="10.5" fill="#555">不同整数个数 = 3 = k ✓</text>
  <text x="280" y="328" text-anchor="middle" font-size="10" fill="#888">前段贡献 {1}，尾段交错贡献 {3, 2, 1}，并集 = {1,2,3}</text>

  <!-- footer insight -->
  <rect x="20" y="352" width="520" height="106" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="374" text-anchor="middle" font-size="11.5" fill="#a07820" font-weight="bold">观察：差值链如何递减</text>
  <text x="280" y="394" text-anchor="middle" font-size="10.5" fill="#555">前段末 n−k=2，尾段首 hi=n=5 → 边界差 = 3 = k</text>
  <text x="280" y="412" text-anchor="middle" font-size="10.5" fill="#555">随后 lo 3↔hi 4 交替靠近，间距每次缩 1：3 → 2 → 1</text>
  <text x="280" y="430" text-anchor="middle" font-size="10.5" fill="#555">故尾段恰好补出 k, k−1, …, 1 全套差值</text>
  <text x="280" y="448" text-anchor="middle" font-size="10" fill="#888">k=1 时无交错段，前段即全长，差值恒为 1，亦成立</text>
</svg>
