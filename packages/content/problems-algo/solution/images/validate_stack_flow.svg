<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：单遍扫描 pushed + 内层连弹</text>

  <!-- 1. 初始化 -->
  <rect x="210" y="48" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="70" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">初始化 st=[] , j=0</text>
  <path d="M 280 82 L 280 100" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. for 每个 x in pushed -->
  <rect x="195" y="102" width="170" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="124" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">for x in pushed：st.push(x)</text>
  <path d="M 280 136 L 280 154" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. 判定菱形：栈顶==popped[j]? -->
  <polygon points="280,156 380,200 280,244 180,200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="280" y="196" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">栈非空 且</text>
  <text x="280" y="212" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">栈顶==popped[j]?</text>

  <!-- 是 → 连弹 -->
  <path d="M 380 200 L 440 200" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="388" y="192" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="440" y="183" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="490" y="205" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">pop, j++</text>
  <!-- 连弹回菱形 -->
  <path d="M 490 183 L 490 158 L 280 158" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="150" font-size="10" fill="#4a7a3a">连弹（while）</text>

  <!-- 否 → 回 for -->
  <path d="M 180 200 L 130 200 L 130 119 L 195 119" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="138" y="192" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <text x="84" y="162" font-size="10" fill="#b85450">回 for 取下个 x</text>

  <!-- for 结束 -->
  <path d="M 280 244 L 280 270" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="262" font-size="10" fill="#888">pushed 耗尽</text>

  <!-- 4. 判定：j==n? -->
  <polygon points="280,272 380,316 280,360 180,316" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">j == n ?</text>

  <!-- 是 → true -->
  <path d="M 380 316 L 440 316" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="388" y="308" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="440" y="299" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="490" y="321" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">true ✅</text>

  <!-- 否 → false -->
  <path d="M 180 316 L 130 316 L 130 399 L 195 399" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="138" y="308" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="195" y="382" width="150" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="404" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">false ❌</text>

  <!-- 底部提示 -->
  <rect x="30" y="432" width="500" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="50" y="448" font-size="10.5" fill="#446688">💡 内层 while 总 pop 次数 ≤ n，故整体 O(n)；j==n 与 st.empty() 等价（n 次 push 全部出栈）</text>
</svg>
