<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold">两个无重叠子数组：枚举分割点 i，左侧维护最大 L 和</text>

  <!-- nums row -->
  <text x="30" y="74" font-size="12" fill="#888">nums:</text>
  <!-- L window [0,1,2] blue -->
  <rect x="80" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="105" y="78" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="130" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="78" text-anchor="middle" font-size="12" fill="#333">8</text>
  <rect x="180" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="205" y="78" text-anchor="middle" font-size="12" fill="#333">1</text>
  <!-- gap [3,4,5] -->
  <rect x="230" y="58" width="50" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="255" y="78" text-anchor="middle" font-size="12" fill="#aaa">3</text>
  <rect x="280" y="58" width="50" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="305" y="78" text-anchor="middle" font-size="12" fill="#aaa">2</text>
  <rect x="330" y="58" width="50" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="355" y="78" text-anchor="middle" font-size="12" fill="#aaa">1</text>
  <!-- M window [6,7] green -->
  <rect x="380" y="58" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="405" y="78" text-anchor="middle" font-size="12" fill="#333">8</text>
  <rect x="430" y="58" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="455" y="78" text-anchor="middle" font-size="12" fill="#333">9</text>
  <!-- tail [8] -->
  <rect x="480" y="58" width="50" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="505" y="78" text-anchor="middle" font-size="12" fill="#aaa">0</text>

  <!-- index labels -->
  <text x="105" y="104" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="155" y="104" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="205" y="104" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="255" y="104" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="305" y="104" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <text x="355" y="104" text-anchor="middle" font-size="9" fill="#aaa">5</text>
  <text x="405" y="104" text-anchor="middle" font-size="9" fill="#aaa">6</text>
  <text x="455" y="104" text-anchor="middle" font-size="9" fill="#aaa">7</text>
  <text x="505" y="104" text-anchor="middle" font-size="9" fill="#aaa">8</text>

  <!-- L / M brackets -->
  <path d="M 82 46 L 82 40 L 228 40 L 228 46" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="155" y="34" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">L 子数组 (firstLen=3) 和=12</text>
  <path d="M 382 46 L 382 40 L 478 40 L 478 46" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="430" y="34" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">M 子数组 (secondLen=2) 和=17</text>

  <!-- split line -->
  <path d="M 355 116 L 355 96" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>
  <text x="355" y="128" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">分割点 i=5</text>

  <!-- formula box -->
  <rect x="40" y="146" width="480" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="170" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">扫描分割点 i：L 在 i 及左侧，M 在 i+1 及右侧</text>
  <text x="280" y="190" text-anchor="middle" font-size="12" fill="#444">maxL = max(maxL, prefix[i+1] − prefix[i+1−L])</text>
  <text x="280" y="208" text-anchor="middle" font-size="12" fill="#444">ans = max(ans, maxL + (prefix[i+1+M] − prefix[i+1]))</text>
  <text x="280" y="222" text-anchor="middle" font-size="10.5" fill="#888">maxL 随扫描单调更新 → O(n) 一遍扫完，无需回头</text>

  <!-- two orderings note -->
  <rect x="40" y="240" width="480" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="262" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">两种排列都要试：① L 在左、M 在右  ② M 在左、L 在右</text>
  <text x="280" y="282" text-anchor="middle" font-size="11" fill="#888">答案 = max( maxSum(L, M), maxSum(M, L) )</text>

  <!-- key insight -->
  <rect x="40" y="312" width="480" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="334" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">关键：不重叠 ⇔ 一左一右，固定顺序后只需维护左侧最大值</text>
  <text x="280" y="352" text-anchor="middle" font-size="10.5" fill="#888">前缀和 O(1) 取子数组和 + 滚动最大值 → 总 O(n)</text>
</svg>
