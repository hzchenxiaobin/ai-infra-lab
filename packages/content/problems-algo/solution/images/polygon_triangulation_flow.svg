<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">区间 DP 算法流程：按区间长度递增填表</text>

  <!-- Step 1: input -->
  <rect x="110" y="40" width="300" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="58" text-anchor="middle" font-size="12" fill="#333">n 个顶点 values[0..n-1]</text>
  <text x="260" y="73" text-anchor="middle" font-size="10" fill="#666">多边形天然闭合，无需两端补 1（对照 312 戳气球）</text>

  <!-- arrow -->
  <path d="M 260 82 L 260 98" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: outer loop length -->
  <rect x="110" y="102" width="300" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="120" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">外层：区间长度 len = 3 → n</text>
  <text x="260" y="135" text-anchor="middle" font-size="10" fill="#666">len &lt; 3 时顶点不足 3 个，dp = 0（无三角形）</text>

  <!-- arrow -->
  <path d="M 260 144 L 260 160" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: enumerate i, j -->
  <rect x="110" y="164" width="300" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="182" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">枚举左端 i，令 j = i + len - 1</text>
  <text x="260" y="197" text-anchor="middle" font-size="10" fill="#666">子多边形覆盖顶点 i, i+1, …, j</text>

  <!-- arrow -->
  <path d="M 260 206 L 260 222" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: diamond - enumerate k -->
  <polygon points="260,226 360,260 260,294 160,260" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="256" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">枚举 k = i+1 … j-1</text>
  <text x="260" y="272" text-anchor="middle" font-size="10" fill="#666">第三个顶点 k</text>

  <!-- arrow -->
  <path d="M 260 296 L 260 312" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: transition -->
  <rect x="60" y="316" width="400" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="338" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">转移：取最小</text>
  <text x="260" y="358" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">dp[i][j] = min(dp[i][j], values[i]·values[k]·values[j] + dp[i][k] + dp[k][j])</text>

  <!-- arrow -->
  <path d="M 260 374 L 260 388" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 6: return -->
  <rect x="110" y="392" width="300" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="413" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 dp[0][n-1]</text>
</svg>
