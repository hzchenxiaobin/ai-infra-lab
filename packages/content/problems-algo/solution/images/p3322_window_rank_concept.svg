<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：PARTITION 分赛季 + 三键排序发名次</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">多赛季混在一张大表 → 切成每赛季一张独立榜 → 组内三级键排序 → RANK() 打号</text>

  <!-- 左半：分区 -->
  <text x="140" y="66" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">① PARTITION BY season_id：每赛季一张榜</text>

  <rect x="24" y="76" width="232" height="108" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="36" y="92" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">SeasonStats（多赛季混在一起）</text>

  <rect x="36" y="99" width="10" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="52" y="108" font-size="10" fill="#333" filter="url(#rough2)">2021 · 曼城 93 分</text>
  <rect x="36" y="115" width="10" height="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="52" y="124" font-size="10" fill="#333" filter="url(#rough2)">2022 · 曼城 89 分</text>
  <rect x="36" y="131" width="10" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="52" y="140" font-size="10" fill="#333" filter="url(#rough2)">2021 · 利物浦 92 分</text>
  <rect x="36" y="147" width="10" height="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="52" y="156" font-size="10" fill="#333" filter="url(#rough2)">2022 · 阿森纳 84 分</text>
  <rect x="36" y="163" width="10" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="52" y="172" font-size="10" fill="#333" filter="url(#rough2)">2021 · 切尔西 74 分</text>

  <path d="M 100 186 C 90 196, 84 200, 76 206" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 180 186 C 190 196, 196 200, 204 206" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="200" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">分区，各排各的</text>

  <rect x="24" y="210" width="112" height="124" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="80" y="228" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">2021 赛季榜</text>
  <text x="36" y="246" font-size="9.5" fill="#333" filter="url(#rough2)">曼城 93 → ①</text>
  <text x="36" y="262" font-size="9.5" fill="#333" filter="url(#rough2)">利物浦 92 → ②</text>
  <text x="36" y="278" font-size="9.5" fill="#333" filter="url(#rough2)">切尔西 74 → ③</text>
  <text x="36" y="294" font-size="9.5" fill="#333" filter="url(#rough2)">热刺 71 → ④</text>
  <text x="36" y="310" font-size="9.5" fill="#333" filter="url(#rough2)">阿森纳 69 → ⑤</text>
  <text x="80" y="326" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">名次从 1 重新编起</text>

  <rect x="144" y="210" width="112" height="124" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="200" y="228" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">2022 赛季榜</text>
  <text x="156" y="246" font-size="9.5" fill="#333" filter="url(#rough2)">曼城 89 → ①</text>
  <text x="156" y="262" font-size="9.5" fill="#333" filter="url(#rough2)">阿森纳 84 → ②</text>
  <text x="156" y="278" font-size="9.5" fill="#333" filter="url(#rough2)">曼联 75 → ③</text>
  <text x="156" y="294" font-size="9.5" fill="#333" filter="url(#rough2)">纽卡 71 → ④</text>
  <text x="156" y="310" font-size="9.5" fill="#333" filter="url(#rough2)">利物浦 67 → ⑤</text>
  <text x="200" y="326" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">与 2021 互不干扰</text>

  <!-- 右半：三级排序键 -->
  <text x="384" y="66" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">② 三级排序键：名次的定义</text>

  <rect x="272" y="78" width="224" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="384" y="96" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">键① 积分 points ↓</text>
  <text x="384" y="112" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">points = wins×3 + draws</text>

  <path d="M 384 122 L 384 130" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="130" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">打平才看下一级</text>

  <rect x="272" y="134" width="224" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="384" y="152" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">键② 净胜球 GD ↓</text>
  <text x="384" y="168" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">GD = goals_for − goals_against</text>

  <path d="M 384 178 L 384 186" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="272" y="190" width="224" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="384" y="208" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">键③ 队名 team_name ↑</text>
  <text x="384" y="224" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">字典序兜底（A → Z 在前）</text>

  <path d="M 384 234 L 384 242" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="272" y="246" width="224" height="88" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="384" y="266" text-anchor="middle" font-size="11" fill="#8a3833" font-weight="bold" filter="url(#rough2)">RANK() OVER ( … )</text>
  <text x="384" y="284" text-anchor="middle" font-size="9.5" fill="#8a3833" filter="url(#rough2)">PARTITION BY season_id</text>
  <text x="384" y="298" text-anchor="middle" font-size="9.5" fill="#8a3833" filter="url(#rough2)">ORDER BY 三键</text>
  <text x="384" y="318" text-anchor="middle" font-size="9.5" fill="#8a3833" filter="url(#rough2)">三键全同 → 并列同号</text>
  <text x="384" y="330" text-anchor="middle" font-size="9" fill="#8a3833" filter="url(#rough2)">（承接系列 I「同分同名次」）</text>

  <!-- 底部备注 -->
  <rect x="20" y="346" width="480" height="44" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="364" font-size="10" fill="#333" filter="url(#rough2)">💡 points / GD 都是派生列：SELECT 里算一遍，OVER() 里还得再写一遍表达式</text>
  <text x="34" y="380" font-size="10" fill="#333" filter="url(#rough2)">MySQL 8 窗口里不能用 SELECT 别名 → 重复表达式，或先用 CTE 物化再开窗</text>
</svg>
