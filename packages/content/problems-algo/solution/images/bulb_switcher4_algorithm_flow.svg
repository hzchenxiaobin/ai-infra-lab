<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="440" height="520" fill="#fafafa"/>

  <text x="220" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">灯泡开关 IV：算法流程</text>

  <!-- Init -->
  <rect x="70" y="40" width="300" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="220" y="62" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">初始化</text>
  <text x="220" y="82" text-anchor="middle" font-size="11" fill="#555">flip = 0,  ans = 0   （全灭，未翻转）</text>

  <path d="M 220 100 L 220 118" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Loop entry -->
  <rect x="70" y="122" width="300" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="220" y="142" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">for i in 0..n−1</text>
  <text x="220" y="158" text-anchor="middle" font-size="10.5" fill="#555">从左到右逐位扫描 target</text>

  <path d="M 220 170 L 220 190" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="220,194 320,250 220,306 120,250" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="220" y="240" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">flip ==</text>
  <text x="220" y="256" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">target[i]?</text>
  <text x="220" y="272" text-anchor="middle" font-size="9.5" fill="#888">（有效状态是否匹配）</text>

  <!-- Yes branch (left) -->
  <path d="M 120 250 L 60 250 L 60 360" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="78" y="244" font-size="10.5" fill="#4a7a3a" font-weight="bold">是 ✓</text>
  <rect x="24" y="364" width="72" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="60" y="387" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">跳过</text>

  <!-- No branch (right) -->
  <path d="M 320 250 L 380 250 L 380 300" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="340" y="244" font-size="10.5" fill="#b85450" font-weight="bold">否 ✗</text>
  <rect x="324" y="304" width="112" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="380" y="326" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans += 1</text>
  <text x="380" y="344" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">flip ^= 1</text>

  <!-- merge arrows back down -->
  <path d="M 60 400 L 60 430 L 210 430" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 380 360 L 380 430 L 230 430" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- loop back -->
  <path d="M 220 430 L 220 470 L 400 470 L 400 144 L 370 144" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <text x="406" y="310" font-size="9.5" fill="#aaa" transform="rotate(-90 406 310)">下一个 i</text>

  <!-- final -->
  <text x="160" y="454" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">遍历结束</text>
  <text x="160" y="470" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">→ return ans</text>
  <text x="160" y="494" text-anchor="middle" font-size="9.5" fill="#aaa">O(n) 时间, O(1) 空间</text>
</svg>
