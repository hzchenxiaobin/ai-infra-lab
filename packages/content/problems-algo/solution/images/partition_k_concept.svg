<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：无前导零 ⟹ 子串值随长度单调增 ⟹ 尽量长地延伸</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888">从起点 i 向右延伸，value 超 k 即断开，取最长合法段开新段</text>

  <!-- String s = "165462", k=60 -->
  <text x="28" y="80" font-size="10.5" fill="#666">s =</text>

  <!-- 6 digit cards, w=44 gap=6 start=64 -->
  <rect x="64" y="62" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="86" y="87" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>

  <rect x="114" y="62" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="136" y="87" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">6</text>

  <rect x="164" y="62" width="44" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="87" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">5</text>

  <rect x="214" y="62" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="236" y="87" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">4</text>

  <rect x="264" y="62" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="286" y="87" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">6</text>

  <rect x="314" y="62" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="336" y="87" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>

  <text x="380" y="80" font-size="11" fill="#888">k = 60</text>

  <!-- Bracket: "1" ✓ 1 ≤ 60 -->
  <path d="M 64 108 L 64 118 L 108 118 L 108 108" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="86" y="134" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">"1"=1 ✓</text>

  <!-- Bracket: "16" ✓ 16 ≤ 60 (greedy takes this) -->
  <path d="M 64 142 L 64 152 L 158 152 L 158 142" stroke="#4a7a3a" stroke-width="2.5" fill="none" filter="url(#rough2)"/>
  <text x="111" y="168" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">"16"=16 ✓ ← 最长合法，贪心取此</text>

  <!-- Bracket: "165" ✗ 165 > 60 -->
  <path d="M 64 176 L 64 186 L 208 186 L 208 176" stroke="#b85450" stroke-width="2.5" fill="none" filter="url(#rough2)"/>
  <text x="136" y="202" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">"165"=165 ✗ &gt; 60，停止延伸</text>

  <!-- Arrow from greedy segment to next start -->
  <path d="M 158 210 L 164 210" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="260" y="214" font-size="10.5" fill="#666">→ i 跳到 2，从 '5' 开始下一段</text>

  <!-- Greedy chain: show 4 segments -->
  <text x="28" y="244" font-size="10.5" fill="#666">贪心分割</text>

  <!-- Segment 1: "16" green -->
  <rect x="64" y="232" width="94" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="111" y="253" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">16</text>

  <!-- Arrow -->
  <path d="M 158 248 L 168 248" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Segment 2: "54" green -->
  <rect x="168" y="232" width="94" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="215" y="253" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">54</text>

  <!-- Arrow -->
  <path d="M 262 248 L 272 248" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Segment 3: "6" green -->
  <rect x="272" y="232" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="294" y="253" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>

  <!-- Arrow -->
  <path d="M 316 248 L 326 248" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Segment 4: "2" green -->
  <rect x="326" y="232" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="348" y="253" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <text x="390" y="253" font-size="12" fill="#4a7a3a" font-weight="bold">= 4 段</text>

  <!-- Why greedy works box -->
  <rect x="40" y="282" width="440" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="302" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">为什么取最长合法段是最优的？</text>
  <text x="260" y="320" text-anchor="middle" font-size="10.5" fill="#555">取更长 ⟹ 剩余后缀更短 ⟹ 后续段数只减不增</text>
  <text x="260" y="334" text-anchor="middle" font-size="10.5" fill="#555">后缀的合法分割数 ≤ 原串的（后缀值更小，仍合法）</text>
</svg>
