<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="25" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">深度奇偶染色：奇数层→A(蓝)，偶数层→B(绿)</text>

  <text x="50" y="85" font-size="11" fill="#4a7a3a" font-weight="bold">深度 2</text>
  <text x="50" y="145" font-size="11" fill="#446688" font-weight="bold">深度 1</text>

  <path d="M 85 80 Q 260 78 425 80" stroke="#e6f4ea" stroke-width="22" fill="none" opacity="0.35" filter="url(#rough2)"/>
  <path d="M 85 140 Q 260 138 425 140" stroke="#e8f0fe" stroke-width="22" fill="none" opacity="0.35" filter="url(#rough2)"/>

  <path d="M 110 140 Q 285 205 460 140" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <path d="M 180 80 Q 215 112 250 80" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <path d="M 320 80 Q 355 112 390 80" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>

  <rect x="90" y="125" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="147" text-anchor="middle" font-size="16" fill="#333">(</text>

  <rect x="160" y="65" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="87" text-anchor="middle" font-size="16" fill="#333">(</text>

  <rect x="230" y="65" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="87" text-anchor="middle" font-size="16" fill="#333">)</text>

  <rect x="300" y="65" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="87" text-anchor="middle" font-size="16" fill="#333">(</text>

  <rect x="370" y="65" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="390" y="87" text-anchor="middle" font-size="16" fill="#333">)</text>

  <rect x="440" y="125" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="460" y="147" text-anchor="middle" font-size="16" fill="#333">)</text>

  <text x="50" y="210" font-size="11" fill="#666">answer:</text>
  <text x="110" y="210" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">0</text>
  <text x="180" y="210" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="250" y="210" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="320" y="210" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="390" y="210" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="460" y="210" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">0</text>

  <path d="M 40 235 Q 260 233 480 235" stroke="#ddd" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <rect x="35" y="255" width="210" height="60" fill="#e8f0fe" fill-opacity="0.35" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="275" font-size="12" fill="#446688" font-weight="bold">A (奇数层, answer=0):</text>
  <rect x="55" y="285" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="302" text-anchor="middle" font-size="14" fill="#333">(</text>
  <rect x="95" y="285" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="302" text-anchor="middle" font-size="14" fill="#333">)</text>
  <text x="140" y="302" font-size="11" fill="#666">→ "()"</text>
  <text x="195" y="302" font-size="11" fill="#446688" font-weight="bold">depth=1</text>

  <rect x="275" y="255" width="210" height="60" fill="#e6f4ea" fill-opacity="0.35" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="275" font-size="12" fill="#4a7a3a" font-weight="bold">B (偶数层, answer=1):</text>
  <rect x="295" y="285" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="309" y="302" text-anchor="middle" font-size="14" fill="#333">(</text>
  <rect x="333" y="285" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="347" y="302" text-anchor="middle" font-size="14" fill="#333">)</text>
  <rect x="371" y="285" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="385" y="302" text-anchor="middle" font-size="14" fill="#333">(</text>
  <rect x="409" y="285" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="423" y="302" text-anchor="middle" font-size="14" fill="#333">)</text>
  <text x="455" y="302" font-size="10" fill="#4a7a3a" font-weight="bold">d=1</text>

  <rect x="70" y="335" width="380" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="356" text-anchor="middle" font-size="12" fill="#444">max(depth(A), depth(B)) = max(1, 1) = 1</text>
  <text x="260" y="374" text-anchor="middle" font-size="11" fill="#d6a040">= ⌈D/2⌉ = ⌈2/2⌉ = 1（最优）</text>
</svg>
