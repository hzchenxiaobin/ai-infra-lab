<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">dfs(u) 流程：三色 + 死胡同检查</text>

  <!-- Start -->
  <rect x="236" y="48" width="88" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">进入 dfs(u)</text>
  <path d="M 280 78 L 280 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: color == gray? -->
  <polygon points="280,96 376,140 280,184 184,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="136" text-anchor="middle" font-size="11" fill="#333">color[u]==灰?</text>
  <text x="280" y="152" text-anchor="middle" font-size="11" fill="#333">(在递归栈上)</text>
  <!-- Yes -> cycle -->
  <path d="M 184 140 L 96 140 L 96 158" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="132" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是→回边</text>
  <rect x="48" y="158" width="96" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="96" y="180" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return False</text>
  <text x="96" y="206" text-anchor="middle" font-size="9" fill="#b85450">检测到环</text>

  <!-- No -->
  <path d="M 280 184 L 280 204" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="198" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- Decision: color == black? -->
  <polygon points="280,204 376,248 280,292 184,248" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="244" text-anchor="middle" font-size="11" fill="#333">color[u]==黑?</text>
  <text x="280" y="260" text-anchor="middle" font-size="11" fill="#333">(已验证)</text>
  <!-- Yes -> true -->
  <path d="M 376 248 L 464 248 L 464 266" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="240" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="416" y="266" width="96" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="464" y="288" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return True</text>

  <!-- No -->
  <path d="M 280 292 L 280 312" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="306" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- mark gray -->
  <rect x="214" y="312" width="132" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="331" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">标记 color[u] = 灰</text>
  <path d="M 280 340 L 280 356" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: no out-edges? -->
  <polygon points="280,356 384,392 280,428 176,392" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="388" text-anchor="middle" font-size="11" fill="#333">graph[u] 为空?</text>
  <text x="280" y="404" text-anchor="middle" font-size="11" fill="#333">(死胡同)</text>
  <!-- Yes: return u==dest -->
  <path d="M 176 392 L 110 392 L 110 374" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="384" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="48" y="338" width="124" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="110" y="356" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">标记黑</text>
  <text x="110" y="370" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">return u == dest</text>

  <!-- No: loop neighbors -->
  <path d="M 384 392 L 470 392 L 470 374" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="384" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="398" y="324" width="144" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="470" y="342" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">for v in adj[u]:</text>
  <text x="470" y="356" text-anchor="middle" font-size="10" fill="#333">  if !dfs(v)</text>
  <text x="470" y="368" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">    return False</text>

  <!-- after loop -> mark black return true (small note) -->
  <path d="M 470 324 L 470 304" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="404" y="270" width="132" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="470" y="284" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">全部邻居通过</text>
  <text x="470" y="298" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">标记黑 / return True</text>
</svg>
