<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>

  <rect width="760" height="440" fill="#fafafa"/>
  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">input(c) 算法流程</text>
  <path d="M 220 38 Q 380 46 540 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Start: input(c) -->
  <g filter="url(#sk2)">
    <rect x="320" y="52" width="120" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="380" y="72" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">input(c)</text>

  <!-- arrow down to decision -->
  <path d="M 380 82 L 380 102" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Decision: c == '#'? -->
  <g filter="url(#sk2)">
    <polygon points="380,104 450,140 380,176 310,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="380" y="136" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">c == '#'?</text>
  <text x="380" y="152" text-anchor="middle" font-size="9" fill="#888">终止符?</text>

  <!-- Yes branch → right -->
  <path d="M 450 140 L 530 140" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="470" y="134" font-size="10" fill="#4a7a3a" font-weight="bold">Yes</text>

  <!-- Yes: insert(query, 1) -->
  <g filter="url(#sk2)">
    <rect x="530" y="124" width="160" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="610" y="144" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">insert(query, 1)</text>

  <!-- arrow down -->
  <path d="M 610 154 L 610 176" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Yes: query='', cur=root -->
  <g filter="url(#sk2)">
    <rect x="530" y="178" width="160" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="610" y="198" text-anchor="middle" font-size="11" fill="#2e6e2e">query="", cur=root</text>

  <!-- arrow down -->
  <path d="M 610 208 L 610 230" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Yes: return [] -->
  <g filter="url(#sk2)">
    <rect x="555" y="232" width="110" height="28" rx="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="610" y="251" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return [ ]</text>

  <!-- No branch → down -->
  <path d="M 380 176 L 380 200" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="392" y="192" font-size="10" fill="#b85450" font-weight="bold">No</text>

  <!-- No: query += c -->
  <g filter="url(#sk2)">
    <rect x="320" y="202" width="120" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="380" y="222" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">query += c</text>

  <!-- arrow down to decision 2 -->
  <path d="M 380 232 L 380 252" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Decision 2: cur && c in children? -->
  <g filter="url(#sk2)">
    <polygon points="380,254 470,296 380,338 290,296" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="380" y="290" text-anchor="middle" font-size="10" fill="#7a5415" font-weight="bold">cur 非空且</text>
  <text x="380" y="304" text-anchor="middle" font-size="10" fill="#7a5415" font-weight="bold">c ∈ children?</text>

  <!-- No branch → left -->
  <path d="M 290 296 L 210 296" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="232" y="290" font-size="10" fill="#b85450" font-weight="bold">No</text>

  <!-- No: cur = null -->
  <g filter="url(#sk2)">
    <rect x="100" y="280" width="110" height="30" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="155" y="300" text-anchor="middle" font-size="11" fill="#b85450">cur = null</text>

  <!-- arrow down -->
  <path d="M 155 310 L 155 338" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- No: return [] -->
  <g filter="url(#sk2)">
    <rect x="100" y="340" width="110" height="28" rx="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="155" y="359" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return [ ]</text>

  <!-- Yes branch → down -->
  <path d="M 380 338 L 380 360" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="392" y="354" font-size="10" fill="#4a7a3a" font-weight="bold">Yes</text>

  <!-- Yes: cur = cur.children[c] -->
  <g filter="url(#sk2)">
    <rect x="300" y="362" width="160" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="380" y="382" text-anchor="middle" font-size="11" fill="#2b6e9e">cur = cur.children[c]</text>

  <!-- arrow down -->
  <path d="M 380 392 L 380 408" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Yes: sort freq, return top 3 -->
  <g filter="url(#sk2)">
    <rect x="280" y="410" width="200" height="28" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="380" y="429" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">sort freq → return top 3</text>
</svg>
