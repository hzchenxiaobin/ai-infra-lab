<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">状态设计：dp[mask] = (最少段数, 当前段最大剩余容量)</text>

  <!-- task row: tasks = [1,2,3], sessionTime=3 -->
  <text x="30" y="68" font-size="12" fill="#888">任务时长:</text>
  <rect x="110" y="50" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="70" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="170" y="50" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="195" y="70" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="230" y="50" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="70" text-anchor="middle" font-size="13" fill="#333">3</text>

  <!-- mask row: 001 = tasks {0} done -->
  <text x="30" y="112" font-size="12" fill="#888">mask 位:</text>
  <rect x="110" y="94" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="135" y="114" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="170" y="94" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="195" y="114" text-anchor="middle" font-size="13" fill="#999">0</text>
  <rect x="230" y="94" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="114" text-anchor="middle" font-size="13" fill="#999">0</text>

  <!-- arrow down -->
  <path d="M 135 128 L 135 150" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- mask = 001 label -->
  <rect x="60" y="150" width="320" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="220" y="172" text-anchor="middle" font-size="12" fill="#444">mask = 001（二进制）→ 已完成任务 {0}</text>

  <!-- dp state box -->
  <rect x="40" y="200" width="440" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="224" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">dp[mask] = ( sessions , remaining )</text>
  <text x="150" y="250" text-anchor="middle" font-size="12" fill="#4a7a3a">sessions = 1（用了 1 段）</text>
  <text x="370" y="250" text-anchor="middle" font-size="12" fill="#b85450">remaining = 2（当前段剩余）</text>

  <!-- open session container visual -->
  <text x="30" y="296" font-size="12" fill="#888">当前打开的工作段（容量 sessionTime = 3）:</text>
  <rect x="40" y="304" width="300" height="34" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="40" y="304" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="326" text-anchor="middle" font-size="11" fill="#4a7a3a">已装 1</text>
  <text x="240" y="326" text-anchor="middle" font-size="11" fill="#b85450">剩余 2</text>
  <rect x="360" y="304" width="120" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="420" y="326" text-anchor="middle" font-size="11" fill="#8a6d18">剩余越多越优</text>
</svg>
