<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">王位继承顺序 = 家族树的前序遍历（DFS）</text>

  <!-- ===== Left panel: family tree ===== -->
  <text x="140" y="56" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">家族树（按出生顺序建子节点列表）</text>

  <!-- tree edges -->
  <line x1="140" y1="92" x2="70" y2="150" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="140" y1="92" x2="140" y2="150" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="140" y1="92" x2="210" y2="150" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="70" y1="170" x2="70" y2="220" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="140" y1="170" x2="110" y2="220" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="140" y1="170" x2="170" y2="220" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- nodes -->
  <rect x="110" y="76" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="140" y="95" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">king</text>

  <rect x="44" y="152" width="52" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="70" y="168" text-anchor="middle" font-size="10" fill="#333">andy</text>

  <rect x="114" y="152" width="52" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="140" y="168" text-anchor="middle" font-size="10" fill="#333">bob</text>

  <rect x="184" y="152" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="214" y="168" text-anchor="middle" font-size="10" fill="#333">catherine</text>

  <rect x="44" y="222" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="74" y="238" text-anchor="middle" font-size="10" fill="#333">matthew</text>

  <rect x="84" y="222" width="46" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="107" y="238" text-anchor="middle" font-size="10" fill="#333">alex</text>

  <rect x="148" y="222" width="46" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="171" y="238" text-anchor="middle" font-size="10" fill="#333">asha</text>

  <!-- preorder path (curved arrow showing visit order) -->
  <path d="M 140 104 Q 30 130 60 150" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)" opacity="0.7"/>
  <path d="M 70 176 Q 40 200 65 220" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)" opacity="0.7"/>

  <text x="140" y="278" text-anchor="middle" font-size="10" fill="#aaa">红虚线 = 前序访问路径</text>

  <!-- arrow between panels -->
  <path d="M 268 160 L 312 160" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="290" y="153" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">前序</text>
  <text x="290" y="175" text-anchor="middle" font-size="10" fill="#4a7a3a">遍历</text>

  <!-- ===== Right panel: inheritance order ===== -->
  <text x="430" y="56" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">继承顺序（前序遍历结果）</text>

  <rect x="350" y="76" width="160" height="232" fill="none" stroke="#ddd" stroke-width="1" rx="6" filter="url(#rough2)"/>

  <rect x="362" y="86" width="136" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="372" y="104" font-size="11" fill="#333" font-weight="bold">1. king</text>

  <rect x="362" y="118" width="136" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="372" y="136" font-size="11" fill="#333">2. andy</text>

  <rect x="362" y="150" width="136" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="372" y="168" font-size="11" fill="#333">3. matthew</text>

  <rect x="362" y="182" width="136" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="372" y="200" font-size="11" fill="#333">4. bob</text>

  <rect x="362" y="214" width="136" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="372" y="232" font-size="11" fill="#333">5. alex</text>

  <rect x="362" y="246" width="136" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="372" y="264" font-size="11" fill="#333">6. asha</text>

  <rect x="362" y="278" width="136" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="372" y="296" font-size="11" fill="#333">7. catherine</text>

  <!-- ===== Bottom note ===== -->
  <rect x="40" y="300" width="280" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="180" y="322" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">关键洞察</text>
  <text x="180" y="342" text-anchor="middle" font-size="10.5" fill="#555">题目给出的 Successor(x) 递归函数</text>
  <text x="180" y="358" text-anchor="middle" font-size="10.5" fill="#555">本质就是「找 x 子树中下一个未访问节点」</text>
  <text x="180" y="376" text-anchor="middle" font-size="10.5" fill="#555">等价于对家族树做一次前序 DFS 遍历</text>
  <text x="180" y="392" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">death 只标记不删节点，遍历时跳过即可</text>
</svg>
