<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">两数之和 IV：哈希表法流程（DFS / BFS 均可）</text>

  <!-- 起点 -->
  <rect x="240" y="46" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">开始遍历树 seen=∅</text>

  <path d="M 300 82 L 300 104" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取节点 -->
  <rect x="220" y="108" width="160" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="300" y="130" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">取下一个节点 v = node.val</text>

  <path d="M 300 144 L 300 162" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判空 -->
  <polygon points="300,166 400,210 300,254 200,210" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="206" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">补数 k−v</text>
  <text x="300" y="222" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">在 seen 中？</text>

  <!-- 是 -->
  <path d="M 200 210 L 110 210 L 110 248" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="200" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="50" y="252" width="120" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="110" y="274" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 true ⭐</text>

  <!-- 否 -->
  <path d="M 400 210 L 490 210 L 490 248" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="450" y="200" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="430" y="252" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="490" y="274" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">seen.add(v)</text>

  <path d="M 490 286 L 490 314" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 还有节点？ -->
  <polygon points="490,318 560,348 490,378 420,348" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="490" y="346" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">还有</text>
  <text x="490" y="360" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">节点？</text>

  <!-- 回环到取节点 -->
  <path d="M 420 348 L 300 348 L 300 142" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="360" y="340" text-anchor="middle" font-size="11" fill="#666">是，继续</text>

  <!-- 否，返回 false -->
  <path d="M 560 348 L 580 348 L 580 410 L 380 410 L 380 388" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="560" y="400" text-anchor="middle" font-size="11" fill="#666">否</text>
  <rect x="300" y="392" width="120" height="0" fill="none"/>

  <rect x="50" y="410" width="520" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="300" y="432" text-anchor="middle" font-size="12" fill="#555">遍历完未命中 → 返回 false（每个节点查一次 O(n)、seen 最大 O(n)）</text>
</svg>
