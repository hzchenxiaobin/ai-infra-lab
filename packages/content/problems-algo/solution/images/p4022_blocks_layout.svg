    <text x="372.5" y="227" text-anchor="middle" font-size="10.5" fill="#333">32</text>
    <text x="403.5" y="227" text-anchor="middle" font-size="10.5" fill="#333">31</text>
    <text x="434.5" y="227" text-anchor="middle" font-size="10.5" fill="#333">30</text>
