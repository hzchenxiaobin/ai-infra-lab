  <!-- 核心观察说明框 -->
  <rect x="25" y="262" width="470" height="82" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="288" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">核心观察</text>
  <text x="260" y="310" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">块内顺序只影响数字的排列，不改变总位数</text>
  <text x="260" y="332" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">写完块 b 后累计位数 = digits(10b+9)（与自然顺序写 1..10b+9 相同）</text>
