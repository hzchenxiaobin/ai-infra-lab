<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：两层 DP —— 删空判定 + 后缀拼接</text>

  <!-- 开始 -->
  <rect x="60" y="34" width="180" height="32" rx="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="55" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">开始：字符串 s（n ≤ 250）</text>
  <path d="M150,66 L150,84" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 步骤 1：预处理 -->
  <rect x="30" y="86" width="240" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="106" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">预处理 ok[i][i+1]：相邻连续对</text>
  <text x="150" y="123" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">含 a↔z（字符差 ∈ {1, 25}）</text>
  <path d="M150,132 L150,150" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 步骤 2：区间 DP -->
  <rect x="30" y="152" width="240" height="64" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="172" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">区间 DP 填 ok 表</text>
  <text x="150" y="189" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">len = 4, 6, …（只枚举偶数长度）</text>
  <text x="150" y="206" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">两端夹中间 / 拆分拼接，O(n³)</text>
  <path d="M150,216 L150,234" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 步骤 3：后缀 DP -->
  <rect x="30" y="236" width="240" height="46" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="256" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">后缀 DP：填 ans[i]</text>
  <text x="150" y="273" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">i 从 n−1 递减到 0（ans[n] = ""）</text>
  <path d="M150,282 L150,300" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 步骤 4：枚举幸存位置 -->
  <rect x="30" y="302" width="240" height="64" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="322" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">枚举首个幸存位置 j（i ≤ j &lt; n）</text>
  <text x="150" y="339" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">候选 s[j] + ans[j+1]（需 i==j 或 ok[i][j−1]）</text>
  <text x="150" y="356" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">ok[i][n−1] 时再加候选 ""</text>
  <path d="M150,366 L150,384" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 步骤 5：取最小 -->
  <rect x="30" y="386" width="240" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="408" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">ans[i] = 字典序最小的候选</text>
  <path d="M150,422 L150,440" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 结束 -->
  <rect x="60" y="442" width="180" height="26" rx="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="459" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">输出 ans[0]</text>

  <!-- 右侧注 1：ok 表转移 -->
  <rect x="310" y="152" width="186" height="84" rx="8" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="403" y="174" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">ok[i][j]：可否删空</text>
  <text x="403" y="193" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">转移① 两端相邻 + 中间删空</text>
  <text x="403" y="210" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">转移② 左右两段各自删空</text>
  <text x="403" y="228" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">配对嵌套/并行 ⇒ 转移完备</text>

  <!-- 右侧注 2：j 的含义 -->
  <rect x="310" y="302" width="186" height="100" rx="8" fill="#fafafa" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="403" y="324" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">j = 首个幸存字符</text>
  <text x="403" y="343" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">前提：s[i..j−1] 整段删空</text>
  <text x="403" y="360" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">（配对不能跨过 s[j]）</text>
  <text x="403" y="377" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">后缀独立演化出 ans[j+1]</text>
  <text x="403" y="394" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">全删空 ⟹ "" 直接胜出</text>

  <!-- 右侧注 3：复杂度 -->
  <rect x="310" y="86" width="186" height="50" rx="8" fill="#fafafa" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="403" y="106" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">时间 O(n³)、空间 O(n²)</text>
  <text x="403" y="124" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">n = 250：百万级操作，轻松通过</text>
</svg>
