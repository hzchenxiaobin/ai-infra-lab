<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心概念：两针角度均以 12 点为 0° 基准，做差取较小角</text>

  <!-- ===== Clock face (center 150,175 r=105) ===== -->
  <circle cx="150" cy="175" r="108" fill="#ffffff" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>

  <!-- 12 tick marks -->
  <g stroke="#8899aa" stroke-width="1.2" filter="url(#rough2)">
    <line x1="150" y1="77" x2="150" y2="71"/>
    <line x1="199" y1="90" x2="202" y2="85"/>
    <line x1="235" y1="126" x2="240" y2="123"/>
    <line x1="248" y1="175" x2="254" y2="175"/>
    <line x1="235" y1="224" x2="240" y2="227"/>
    <line x1="199" y1="260" x2="202" y2="265"/>
    <line x1="150" y1="273" x2="150" y2="279"/>
    <line x1="101" y1="260" x2="98" y2="265"/>
    <line x1="65" y1="224" x2="60" y2="227"/>
    <line x1="52" y1="175" x2="46" y2="175"/>
    <line x1="65" y1="126" x2="60" y2="123"/>
    <line x1="101" y1="90" x2="98" y2="85"/>
  </g>

  <!-- 4 numbers -->
  <g font-size="13" fill="#446688" font-weight="bold" text-anchor="middle" filter="url(#rough2)">
    <text x="150" y="96">12</text>
    <text x="234" y="180">3</text>
    <text x="150" y="264">6</text>
    <text x="66" y="180">9</text>
  </g>

  <!-- angle wedge (hour=3,min=30 → 75°) -->
  <path d="M 150,175 L 189,185 A 40,40 0 0,1 150,215 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="178" y="208" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">75°</text>

  <!-- hour hand (θ=105°, len 55) -->
  <line x1="150" y1="175" x2="203" y2="189" stroke="#446688" stroke-width="3.5" stroke-linecap="round" filter="url(#rough2)"/>
  <!-- minute hand (θ=180°, len 88) -->
  <line x1="150" y1="175" x2="150" y2="263" stroke="#4a7a3a" stroke-width="2.5" stroke-linecap="round" filter="url(#rough2)"/>
  <!-- center pin -->
  <circle cx="150" cy="175" r="4" fill="#b85450" filter="url(#rough2)"/>

  <!-- hand labels -->
  <text x="210" y="180" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">时针</text>
  <text x="160" y="255" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">分针</text>
  <text x="150" y="310" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">示例：hour=3, minutes=30</text>

  <!-- ===== Right side: formula boxes ===== -->
  <!-- Box1: minute angle -->
  <rect x="290" y="52" width="220" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="71" font-size="11" fill="#444" filter="url(#rough2)">分针 minuteAngle = minutes × 6°</text>
  <text x="300" y="88" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">= 30 × 6° = 180°</text>

  <!-- Box2: hour angle -->
  <rect x="290" y="110" width="220" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="129" font-size="11" fill="#444" filter="url(#rough2)">时针 hourAngle</text>
  <text x="300" y="145" font-size="11" fill="#444" filter="url(#rough2)">= (hour%12)×30° + minutes×0.5°</text>
  <text x="300" y="161" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">= 90° + 15° = 105°</text>

  <!-- Box3: diff -->
  <rect x="290" y="180" width="220" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="199" font-size="11" fill="#444" filter="url(#rough2)">diff = |hourAngle − minuteAngle|</text>
  <text x="300" y="216" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">= |105 − 180| = 75°</text>

  <!-- Box4: answer -->
  <rect x="290" y="238" width="220" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="258" font-size="11" fill="#444" filter="url(#rough2)">ans = min(diff, 360° − diff)</text>
  <text x="300" y="278" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">= min(75, 285) = 75°</text>
</svg>
