<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">摆动排序：偶数下标是谷，奇数下标是峰</text>

  <!-- Valley / peak tags -->
  <text x="90" y="50" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">谷</text>
  <text x="150" y="50" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">峰</text>
  <text x="210" y="50" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">谷</text>
  <text x="270" y="50" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">峰</text>
  <text x="330" y="50" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">谷</text>
  <text x="390" y="50" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">峰</text>

  <!-- Index labels -->
  <text x="90" y="64" text-anchor="middle" font-size="10" fill="#999">idx 0</text>
  <text x="150" y="64" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="210" y="64" text-anchor="middle" font-size="10" fill="#999">2</text>
  <text x="270" y="64" text-anchor="middle" font-size="10" fill="#999">3</text>
  <text x="330" y="64" text-anchor="middle" font-size="10" fill="#999">4</text>
  <text x="390" y="64" text-anchor="middle" font-size="10" fill="#999">5</text>

  <!-- Array cells: [3,5,1,6,2,4] -->
  <rect x="70" y="72" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="92" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="130" y="72" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="92" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="190" y="72" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="92" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="250" y="72" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="92" text-anchor="middle" font-size="12" fill="#333">6</text>
  <rect x="310" y="72" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="92" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="370" y="72" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="390" y="92" text-anchor="middle" font-size="12" fill="#333">4</text>

  <!-- Relation labels between cells -->
  <text x="120" y="92" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">≤</text>
  <text x="180" y="92" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">≥</text>
  <text x="240" y="92" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">≤</text>
  <text x="300" y="92" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">≥</text>
  <text x="360" y="92" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">≤</text>

  <!-- Wave path: up-down-up-down-up -->
  <path d="M 90 124 Q 120 104 150 124 Q 180 168 210 124 Q 240 104 270 124 Q 300 168 330 124 Q 360 104 390 124"
        stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>

  <!-- Invariant box -->
  <rect x="40" y="190" width="480" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="214" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">逐对检查：相邻 (i−1, i) 是否满足期望关系</text>
  <text x="280" y="236" text-anchor="middle" font-size="11" fill="#444">i 为奇数（峰位）：期望 nums[i−1] ≤ nums[i]，违反则交换</text>
  <text x="280" y="254" text-anchor="middle" font-size="11" fill="#444">i 为偶数（谷位）：期望 nums[i−1] ≥ nums[i]，违反则交换</text>

  <!-- Swap-safety box -->
  <rect x="40" y="282" width="480" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="306" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">交换为何不破坏左侧已排好的前缀？</text>
  <text x="280" y="328" text-anchor="middle" font-size="11" fill="#444">交换后新 nums[i−1] 比旧值「更靠」期望方向，左侧约束只会更宽松</text>
  <text x="280" y="346" text-anchor="middle" font-size="11" fill="#444">如 i 为奇数：新 nums[i−1] = 旧 nums[i] &lt; 旧 nums[i−1]，谷位更小仍 ≤ 左峰</text>

  <!-- footer -->
  <text x="280" y="372" text-anchor="middle" font-size="10" fill="#999">一趟扫描，每对只看局部关系，不回看前缀</text>
</svg>
