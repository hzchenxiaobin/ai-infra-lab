<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">
    算法流程：四类字符的四向分支
  </text>

  <!-- "遍历字符" box -->
  <rect x="200" y="40" width="160" height="30" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">遍历每个字符 c</text>

  <!-- Arrow to diamond -->
  <line x1="280" y1="72" x2="280" y2="90" stroke="#446688" stroke-width="1.6"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <path d="M 280 90 L 348 120 L 280 150 L 212 120 Z" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="124" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">c 是？</text>

  <!-- Horizontal bus + drops -->
  <line x1="80" y1="150" x2="500" y2="150" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="80" y1="150" x2="80" y2="170" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="220" y1="150" x2="220" y2="170" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="360" y1="150" x2="360" y2="170" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="500" y1="150" x2="500" y2="170" stroke="#446688" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 1: '[' -->
  <rect x="25" y="172" width="110" height="100" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="80" y="190" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">'['</text>
  <text x="80" y="210" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">压入新空列表</text>
  <text x="80" y="226" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">stack.push(NI())</text>
  <text x="80" y="250" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">开启子层</text>

  <!-- Box 2: ']' -->
  <rect x="165" y="172" width="110" height="100" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="220" y="190" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">']'</text>
  <text x="220" y="208" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">提交末尾数字</text>
  <text x="220" y="223" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">弹栈 top</text>
  <text x="220" y="242" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">栈非空→挂回父级</text>

  <!-- Box 3: ',' -->
  <rect x="305" y="172" width="110" height="100" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="360" y="190" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">','</text>
  <text x="360" y="210" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">提交数字到栈顶</text>
  <text x="360" y="228" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">重置 num / sign</text>
  <text x="360" y="250" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">has_num = False</text>

  <!-- Box 4: digit / '-' -->
  <rect x="445" y="172" width="110" height="100" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="500" y="190" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">数字 / '-'</text>
  <text x="500" y="210" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">num = num*10+d</text>
  <text x="500" y="226" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">has_num = True</text>
  <text x="500" y="246" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">'-' → sign = -1</text>

  <!-- Loop back arrow -->
  <path d="M 500 272 C 548 292, 548 56, 360 56" stroke="#4a7a3a" stroke-width="1.4"
        fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="548" y="170" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">↻</text>
  <text x="548" y="184" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">循环</text>

  <!-- End note -->
  <rect x="150" y="296" width="260" height="44" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="314" text-anchor="middle" font-size="11" fill="#444" font-weight="bold" filter="url(#rough2)">遍历结束 → 返回 top（根列表）</text>
  <text x="280" y="330" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">单整数特判：s[0] ≠ '[' 时直接 return NI(int(s))</text>
</svg>
