<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">安全节点 = 不在环上、也不通向环</text>

  <!-- Edges: cycle 0->1->3->0 in red -->
  <path d="M 127 196 L 233 134" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 250 142 L 250 278" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 231 288 L 129 222" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <!-- other edges in gray -->
  <path d="M 132 210 L 348 210" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 268 133 L 352 197" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 390 200 L 470 160" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 383 302 L 477 168" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- cycle label -->
  <text x="190" y="210" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">环</text>

  <!-- Unsafe nodes: 0,1,3 (pink) -->
  <circle cx="110" cy="210" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="110" y="215" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <circle cx="250" cy="120" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="125" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <circle cx="250" cy="300" r="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="305" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>

  <!-- Safe nodes: 2,4 (green) -->
  <circle cx="370" cy="210" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="370" y="215" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <circle cx="370" cy="320" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="370" y="325" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>

  <!-- Terminal nodes: 5,6 (green + double ring) -->
  <circle cx="490" cy="150" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="490" cy="150" r="17" fill="none" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="490" y="155" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <text x="490" y="120" text-anchor="middle" font-size="10" fill="#4a7a3a">终端</text>

  <circle cx="490" cy="310" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="490" cy="310" r="17" fill="none" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="490" y="315" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>
  <text x="490" y="345" text-anchor="middle" font-size="10" fill="#4a7a3a">终端</text>

  <!-- callouts -->
  <text x="110" y="252" text-anchor="middle" font-size="10" fill="#b85450">在环上·不安全</text>
  <text x="370" y="180" text-anchor="middle" font-size="10" fill="#4a7a3a">后继全安全</text>

  <!-- Legend -->
  <rect x="30" y="335" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="50" y="347" font-size="11" fill="#555">安全(绿)</text>
  <rect x="130" y="335" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="150" y="347" font-size="11" fill="#555">不安全(粉)</text>
  <line x1="240" y1="342" x2="270" y2="342" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="278" y="347" font-size="11" fill="#555">环上的边</text>

  <!-- Bottom note -->
  <rect x="330" y="330" width="210" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="435" y="348" text-anchor="middle" font-size="10" fill="#444">安全 ⟺ 所有后继安全（归纳基础=终端）</text>
  <text x="435" y="362" text-anchor="middle" font-size="10" fill="#666">不安全 ⟺ 存在路径进入环</text>
</svg>
