<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <g filter="url(#rough2)">
    <text x="280" y="22" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">核心观察：偶频率 ⇒ 前缀异或相等；恰 k 个不同 ⇒ r 落入连续段</text>

    <!-- ===== Panel 1: prefix XOR ===== -->
    <text x="36" y="48" font-size="11.5" fill="#446688" font-weight="bold">① 频率全偶 ⇔ 前缀异或状态相等（随机哈希）</text>

    <!-- nums cells -->
    <rect x="130" y="62" width="70" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="165" y="85" text-anchor="middle" font-size="14" fill="#333">1</text>
    <rect x="210" y="62" width="70" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="245" y="85" text-anchor="middle" font-size="14" fill="#333">2</text>
    <rect x="290" y="62" width="70" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="325" y="85" text-anchor="middle" font-size="14" fill="#333">2</text>
    <rect x="370" y="62" width="70" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="405" y="85" text-anchor="middle" font-size="14" fill="#333">1</text>

    <!-- prefix xor state boxes at boundaries -->
    <rect x="97" y="112" width="66" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="130" y="129" text-anchor="middle" font-size="8.5" fill="#446688">P0=0</text>
    <rect x="167" y="112" width="66" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="200" y="129" text-anchor="middle" font-size="8.5" fill="#4a7a3a">P1=h1</text>
    <rect x="247" y="112" width="66" height="26" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="280" y="129" text-anchor="middle" font-size="8.5" fill="#8a6d1f">P2=h1⊕h2</text>
    <rect x="327" y="112" width="66" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="360" y="129" text-anchor="middle" font-size="8.5" fill="#4a7a3a">P3=h1</text>
    <rect x="407" y="112" width="66" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="440" y="129" text-anchor="middle" font-size="8.5" fill="#446688">P4=0</text>

    <!-- pairing cups under state boxes -->
    <circle cx="200" cy="140" r="2.5" fill="#4a7a3a"/>
    <circle cx="360" cy="140" r="2.5" fill="#4a7a3a"/>
    <path d="M 200 140 Q 280 172 360 140" fill="none" stroke="#4a7a3a" stroke-width="2"/>
    <text x="280" y="168" text-anchor="middle" font-size="10" fill="#4a7a3a">[1,2] 全偶 ✓</text>

    <circle cx="130" cy="140" r="2.5" fill="#446688"/>
    <circle cx="440" cy="140" r="2.5" fill="#446688"/>
    <path d="M 130 140 Q 285 218 440 140" fill="none" stroke="#446688" stroke-width="2"/>
    <text x="285" y="196" text-anchor="middle" font-size="10" fill="#446688">[0,3] 全偶 ✓：h1、h2 成对抵消</text>

    <text x="280" y="214" text-anchor="middle" font-size="9.5" fill="#333">P[r+1] ⊕ P[l] = 奇频值的哈希之异或 ⇒ 全偶 ⇔ 为 0 ⇔ 两端状态相等</text>

    <!-- ===== Panel 2: distinct monotone band ===== -->
    <text x="36" y="240" font-size="11.5" fill="#4a7a3a" font-weight="bold">② 恰 k 个不同 ⇔ r 落入连续段 [A(l), B(l)]</text>
    <text x="36" y="262" font-size="9.5" fill="#333">l = 0 时 distinct(0, r) 随 r 右扩（k = 2）：</text>

    <!-- distinct value cells -->
    <rect x="130" y="270" width="70" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="165" y="291" text-anchor="middle" font-size="13" fill="#333">1</text>
    <rect x="210" y="270" width="70" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="245" y="291" text-anchor="middle" font-size="13" fill="#333">2</text>
    <rect x="290" y="270" width="70" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="325" y="291" text-anchor="middle" font-size="13" fill="#333">2</text>
    <rect x="370" y="270" width="70" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="405" y="291" text-anchor="middle" font-size="13" fill="#333">2</text>

    <!-- window over r = 1..3 -->
    <rect x="204" y="264" width="242" height="44" rx="8" fill="none" stroke="#d6a040" stroke-width="2.5"/>
    <text x="165" y="320" text-anchor="middle" font-size="8.5" fill="#6b7f99">r=0</text>
    <text x="245" y="320" text-anchor="middle" font-size="8.5" fill="#6b7f99">r=1</text>
    <text x="325" y="320" text-anchor="middle" font-size="8.5" fill="#6b7f99">r=2</text>
    <text x="405" y="320" text-anchor="middle" font-size="8.5" fill="#6b7f99">r=3</text>
    <text x="322" y="338" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold">distinct = 2 = k 的 r：1..3，连成一段（A(0)=1，B(0)=3）</text>

    <!-- monotonicity note -->
    <rect x="36" y="350" width="488" height="44" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="280" y="368" text-anchor="middle" font-size="10" fill="#8a3a35" font-weight="bold">l 右移只丢元素 ⇒ distinct 整体下移 ⇒ A(l)、B(l) 单调不减</text>
    <text x="280" y="384" text-anchor="middle" font-size="9.5" fill="#8a3a35">⇒ 两次滑动窗口（阈值 k 与 k+1）O(n) 求出全表</text>

    <!-- final formula -->
    <rect x="36" y="400" width="488" height="38" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="280" y="416" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">查询 [l, r] 有效 ⇔ P[r+1] = P[l] 且 A(l) ≤ r ≤ B(l)</text>
    <text x="280" y="432" text-anchor="middle" font-size="9" fill="#6b7f99">例：查询 [1,2] → P3 = P1 ✓ 但 2 &lt; A(1) = 3 → false</text>
  </g>
</svg>
