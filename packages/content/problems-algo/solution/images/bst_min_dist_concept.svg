<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrOrange" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">BST 中序 = 升序序列 → 最小距离必在相邻元素间</text>

  <!-- 左：原 BST -->
  <text x="40" y="58" font-size="12" fill="#888">原 BST：</text>

  <!-- 树枝 -->
  <line x1="142" y1="102" x2="108" y2="148" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="158" y1="102" x2="200" y2="148" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="92" y1="172" x2="73" y2="218" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="112" y1="172" x2="137" y2="218" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>

  <!-- 节点 4 (根, ④) -->
  <circle cx="150" cy="90" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="94" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <text x="174" y="84" font-size="10" fill="#b85450" font-weight="bold">④</text>

  <!-- 节点 2 (②) -->
  <circle cx="100" cy="160" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="164" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="122" y="156" font-size="10" fill="#b85450" font-weight="bold">②</text>

  <!-- 节点 6 (⑤) -->
  <circle cx="210" cy="160" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="164" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>
  <text x="232" y="156" font-size="10" fill="#b85450" font-weight="bold">⑤</text>

  <!-- 节点 1 (①) -->
  <circle cx="65" cy="230" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="65" y="234" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="83" y="226" font-size="10" fill="#d6a040" font-weight="bold">①</text>

  <!-- 节点 3 (③) -->
  <circle cx="145" cy="230" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="145" y="234" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="163" y="226" font-size="10" fill="#b85450" font-weight="bold">③</text>

  <text x="40" y="270" font-size="11" fill="#888">中序访问顺序：1 → 2 → 3 → 4 → 6</text>

  <!-- 右：升序序列 + 相邻差 -->
  <text x="300" y="58" font-size="12" fill="#888">中序序列（升序）：</text>

  <!-- 序列方格 1 2 3 4 6 -->
  <rect x="300" y="68" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="318" y="87" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <path d="M 336 82 L 348 82" stroke="#d6a040" stroke-width="1.3" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>

  <rect x="348" y="68" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="366" y="87" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <path d="M 384 82 L 396 82" stroke="#d6a040" stroke-width="1.3" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>

  <rect x="396" y="68" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="414" y="87" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <path d="M 432 82 L 444 82" stroke="#d6a040" stroke-width="1.3" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>

  <rect x="444" y="68" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="462" y="87" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <path d="M 480 82 L 492 82" stroke="#d6a040" stroke-width="1.3" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>

  <rect x="492" y="68" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="510" y="87" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>

  <!-- 相邻差标注 -->
  <text x="300" y="122" font-size="12" fill="#888">相邻距离 |a[i]−a[i−1]|：</text>

  <!-- 虚线指引 from sequence gaps to diffs -->
  <path d="M 342 96 L 342 128" stroke="#bbb" stroke-width="0.8" stroke-dasharray="2,3" fill="none" filter="url(#rough2)"/>
  <path d="M 390 96 L 390 128" stroke="#bbb" stroke-width="0.8" stroke-dasharray="2,3" fill="none" filter="url(#rough2)"/>
  <path d="M 438 96 L 438 128" stroke="#bbb" stroke-width="0.8" stroke-dasharray="2,3" fill="none" filter="url(#rough2)"/>
  <path d="M 486 96 L 486 128" stroke="#bbb" stroke-width="0.8" stroke-dasharray="2,3" fill="none" filter="url(#rough2)"/>

  <!-- diff boxes -->
  <rect x="319" y="128" width="46" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="342" y="145" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">|2−1|=1</text>

  <rect x="367" y="128" width="46" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="390" y="145" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">|3−2|=1</text>

  <rect x="415" y="128" width="46" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="438" y="145" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">|4−3|=1</text>

  <rect x="463" y="128" width="46" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="486" y="145" text-anchor="middle" font-size="9" fill="#888">|6−4|=2</text>

  <!-- min result -->
  <text x="300" y="180" font-size="12" fill="#888">最小值：</text>
  <rect x="350" y="168" width="80" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="390" y="186" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">min = 1</text>

  <!-- 证明 mini box -->
  <rect x="300" y="210" width="250" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="312" y="232" font-size="11" fill="#333" font-weight="bold">为什么只需看相邻？</text>
  <text x="312" y="250" font-size="10" fill="#555">升序序列中，对任意 i &lt; j：</text>
  <text x="312" y="266" font-size="10" fill="#555">a_j − a_i = Σ(相邻差) ≥ 单个相邻差</text>
  <text x="312" y="278" font-size="10" fill="#4a7a3a" font-weight="bold">⇒ 跨元素距不小于某个相邻距</text>

  <!-- 说明框 -->
  <rect x="40" y="300" width="500" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="60" y="324" font-size="12" fill="#333" font-weight="bold">核心：BST 中序 = 升序 ⇒ 最小距离 = min{|a[i]−a[i−1]|}</text>
  <text x="60" y="344" font-size="11" fill="#555">遍历时维护 prev（上一访问值），每步算 cur−prev 更新答案</text>
  <text x="60" y="362" font-size="11" fill="#b85450" font-weight="bold">升序保证 cur−prev ≥ 0，无需 abs；一次中序 O(n)</text>
</svg>
