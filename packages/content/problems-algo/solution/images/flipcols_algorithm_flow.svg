<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：规范化键 + 哈希计数</text>

  <!-- Box 1 -->
  <rect x="150" y="48" width="260" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="72" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">遍历每行 row</text>
  <line x1="280" y1="88" x2="280" y2="104" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 2: normalization with example -->
  <rect x="60" y="106" width="440" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="128" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">规范化：key[j] = row[j] ⊕ row[0]   （首位归 0，互补行合并）</text>

  <text x="92" y="160" font-size="10" fill="#888">row</text>
  <rect x="118" y="146" width="30" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="133" y="162" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <rect x="150" y="146" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="165" y="162" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="182" y="146" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="197" y="162" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>

  <text x="222" y="162" font-size="13" fill="#666" font-weight="bold">⊕ row[0]</text>
  <line x1="300" y1="157" x2="332" y2="157" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="346" y="160" font-size="10" fill="#888">key</text>
  <rect x="372" y="146" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="387" y="162" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="404" y="146" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="419" y="162" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="436" y="146" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="451" y="162" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <text x="280" y="192" text-anchor="middle" font-size="10" fill="#888">互补行 [0,0,1] 也映射到同一 key → 同组</text>

  <line x1="280" y1="204" x2="280" y2="220" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 3: hash count -->
  <rect x="150" y="222" width="260" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="246" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">哈希计数：cnt[key] += 1</text>
  <line x1="280" y1="262" x2="280" y2="278" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box 4: return max -->
  <rect x="150" y="280" width="260" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="304" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">返回 cnt 中的最大值</text>

  <!-- side notes -->
  <text x="430" y="244" font-size="10" fill="#888">O(mn) 时间</text>
  <text x="430" y="260" font-size="10" fill="#888">O(mn) 空间</text>
  <text x="430" y="304" font-size="10" fill="#4a7a3a">最大等价类</text>
</svg>
