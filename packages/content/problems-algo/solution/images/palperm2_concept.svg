<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：取半排列 → 镜像拼接成回文</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">palindrome = half + mid + reverse(half)</text>

  <!-- ====== Row 1: input string → freq table ====== -->
  <text x="20" y="74" font-size="11" fill="#888">输入 s =</text>
  <g font-size="12">
    <rect x="76" y="58" width="26" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="89" y="77" text-anchor="middle" fill="#333">a</text>
    <rect x="104" y="58" width="26" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="117" y="77" text-anchor="middle" fill="#333">a</text>
    <rect x="132" y="58" width="26" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="145" y="77" text-anchor="middle" fill="#333">b</text>
    <rect x="160" y="58" width="26" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="173" y="77" text-anchor="middle" fill="#333">b</text>
  </g>

  <path d="M 192 72 L 226 72" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="209" y="64" text-anchor="middle" font-size="9.5" fill="#888">频次</text>

  <!-- freq table -->
  <g font-size="12">
    <rect x="236" y="58" width="44" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="258" y="77" text-anchor="middle" font-size="11" fill="#888">a:2</text>
    <rect x="284" y="58" width="44" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="306" y="77" text-anchor="middle" font-size="11" fill="#888">b:2</text>
  </g>
  <text x="340" y="74" font-size="10" fill="#4a7a3a">全偶 → mid = ""</text>

  <!-- arrow down to half -->
  <path d="M 258 90 L 258 110" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="106" font-size="10" fill="#888">取半 freq÷2</text>

  <!-- ====== Row 2: half string ====== -->
  <text x="20" y="130" font-size="11" fill="#446688" font-weight="bold">half =</text>
  <g font-size="12">
    <rect x="76" y="114" width="26" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="89" y="133" text-anchor="middle" fill="#333">a</text>
    <rect x="104" y="114" width="26" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="117" y="133" text-anchor="middle" fill="#333">b</text>
  </g>
  <text x="146" y="130" font-size="10" fill="#888">排列 half → 所有唯一排列</text>

  <!-- arrow down to two branches -->
  <path d="M 89 146 L 89 162" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 117 146 L 330 162" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ====== Row 3: two palindrome results ====== -->
  <!-- Left branch: "ab" → "abba" -->
  <rect x="20" y="166" width="250" height="100" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="40" y="186" font-size="11" fill="#446688" font-weight="bold">排列① "ab"</text>
  <g font-size="12">
    <rect x="100" y="172" width="22" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="111" y="189" text-anchor="middle" fill="#333">a</text>
    <rect x="124" y="172" width="22" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="135" y="189" text-anchor="middle" fill="#333">b</text>
  </g>
  <text x="160" y="186" font-size="10" fill="#888">→ 镜像拼接 →</text>

  <text x="40" y="214" font-size="11" fill="#4a7a3a" font-weight="bold">回文 "abba"</text>
  <g font-size="12">
    <rect x="100" y="204" width="22" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="111" y="221" text-anchor="middle" fill="#333">a</text>
    <rect x="124" y="204" width="22" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="135" y="221" text-anchor="middle" fill="#333">b</text>
    <rect x="148" y="204" width="22" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="159" y="221" text-anchor="middle" fill="#333">b</text>
    <rect x="172" y="204" width="22" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="183" y="221" text-anchor="middle" fill="#333">a</text>
  </g>
  <text x="111" y="250" text-anchor="middle" font-size="9" fill="#446688">左半</text>
  <text x="159" y="250" text-anchor="middle" font-size="9" fill="#4a7a3a">右半(镜像)</text>
  <path d="M 100 244 L 146 244" stroke="#446688" stroke-width="1" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <path d="M 148 244 L 194 244" stroke="#4a7a3a" stroke-width="1" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- Right branch: "ba" → "baab" -->
  <rect x="290" y="166" width="250" height="100" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="186" font-size="11" fill="#446688" font-weight="bold">排列② "ba"</text>
  <g font-size="12">
    <rect x="370" y="172" width="22" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="381" y="189" text-anchor="middle" fill="#333">b</text>
    <rect x="394" y="172" width="22" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="405" y="189" text-anchor="middle" fill="#333">a</text>
  </g>
  <text x="430" y="186" font-size="10" fill="#888">→ 镜像拼接 →</text>

  <text x="310" y="214" font-size="11" fill="#4a7a3a" font-weight="bold">回文 "baab"</text>
  <g font-size="12">
    <rect x="370" y="204" width="22" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="381" y="221" text-anchor="middle" fill="#333">b</text>
    <rect x="394" y="204" width="22" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="405" y="221" text-anchor="middle" fill="#333">a</text>
    <rect x="418" y="204" width="22" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="429" y="221" text-anchor="middle" fill="#333">a</text>
    <rect x="442" y="204" width="22" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="453" y="221" text-anchor="middle" fill="#333">b</text>
  </g>
  <text x="381" y="250" text-anchor="middle" font-size="9" fill="#446688">左半</text>
  <text x="429" y="250" text-anchor="middle" font-size="9" fill="#4a7a3a">右半(镜像)</text>
  <path d="M 370 244 L 416 244" stroke="#446688" stroke-width="1" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <path d="M 418 244 L 464 244" stroke="#4a7a3a" stroke-width="1" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- ====== Row 4: odd case ====== -->
  <rect x="40" y="284" width="480" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="60" y="306" font-size="11.5" fill="#d6a040" font-weight="bold">奇数情况：s = "aabbc" → a:2, b:2, c:1 → half = "ab", mid = "c"</text>
  <g font-size="12">
    <rect x="100" y="322" width="22" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="111" y="339" text-anchor="middle" fill="#333">a</text>
    <rect x="124" y="322" width="22" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="135" y="339" text-anchor="middle" fill="#333">b</text>
    <rect x="148" y="322" width="22" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="159" y="339" text-anchor="middle" fill="#d6a040" font-weight="bold">c</text>
    <rect x="172" y="322" width="22" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="183" y="339" text-anchor="middle" fill="#333">b</text>
    <rect x="196" y="322" width="22" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="207" y="339" text-anchor="middle" fill="#333">a</text>
  </g>
  <text x="240" y="336" font-size="11" fill="#555">= "abcba"</text>
  <text x="240" y="350" font-size="9.5" fill="#888">half + mid + reverse(half)</text>
  <text x="159" y="354" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">mid 居中</text>

  <!-- ====== bottom summary ====== -->
  <text x="280" y="382" text-anchor="middle" font-size="10.5" fill="#555">排列 half 得到所有唯一左半 → 镜像拼接即得所有回文排列</text>
  <text x="280" y="396" text-anchor="middle" font-size="9.5" fill="#888">搜索空间从 n! 降至 (n/2)!，天然去重</text>
</svg>
