<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：m=3, n=3, positions=[[0,0],[0,1],[1,2],[2,1]]</text>

  <!-- ===== Step 1: add (0,0) ===== -->
  <text x="125" y="62" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">① 加 (0,0)</text>
  <!-- 3x3 grid, cell 34px, origin x=58 y=72 -->
  <!-- row0 -->
  <rect x="58" y="72" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="75" y="93" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">L</text>
  <rect x="92" y="72" width="34" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="109" y="93" text-anchor="middle" font-size="11" fill="#aaa">~</text>
  <rect x="126" y="72" width="34" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="143" y="93" text-anchor="middle" font-size="11" fill="#aaa">~</text>
  <!-- row1 -->
  <rect x="58" y="106" width="34" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="75" y="127" text-anchor="middle" font-size="11" fill="#aaa">~</text>
  <rect x="92" y="106" width="34" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="109" y="127" text-anchor="middle" font-size="11" fill="#aaa">~</text>
  <rect x="126" y="106" width="34" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="143" y="127" text-anchor="middle" font-size="11" fill="#aaa">~</text>
  <!-- row2 -->
  <rect x="58" y="140" width="34" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="75" y="161" text-anchor="middle" font-size="11" fill="#aaa">~</text>
  <rect x="92" y="140" width="34" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="109" y="161" text-anchor="middle" font-size="11" fill="#aaa">~</text>
  <rect x="126" y="140" width="34" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="143" y="161" text-anchor="middle" font-size="11" fill="#aaa">~</text>
  <text x="125" y="190" text-anchor="middle" font-size="10.5" fill="#888">无陆地邻居</text>
  <rect x="78" y="198" width="94" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="125" y="216" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">count = 0→1</text>

  <!-- ===== Step 2: add (0,1) ===== -->
  <text x="415" y="62" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">② 加 (0,1)</text>
  <!-- grid origin x=348 y=72 -->
  <rect x="348" y="72" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="365" y="93" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">L</text>
  <rect x="382" y="72" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="399" y="93" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">L</text>
  <rect x="416" y="72" width="34" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="433" y="93" text-anchor="middle" font-size="11" fill="#aaa">~</text>
  <rect x="348" y="106" width="34" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="365" y="127" text-anchor="middle" font-size="11" fill="#aaa">~</text>
  <rect x="382" y="106" width="34" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="399" y="127" text-anchor="middle" font-size="11" fill="#aaa">~</text>
  <rect x="416" y="106" width="34" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="433" y="127" text-anchor="middle" font-size="11" fill="#aaa">~</text>
  <rect x="348" y="140" width="34" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="365" y="161" text-anchor="middle" font-size="11" fill="#aaa">~</text>
  <rect x="382" y="140" width="34" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="399" y="161" text-anchor="middle" font-size="11" fill="#aaa">~</text>
  <rect x="416" y="140" width="34" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="433" y="161" text-anchor="middle" font-size="11" fill="#aaa">~</text>
  <!-- union arrow from (0,1) to left neighbor (0,0) -->
  <path d="M 384 89 L 366 89" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="415" y="190" text-anchor="middle" font-size="10.5" fill="#888">左邻居 (0,0) 是陆地</text>
  <rect x="368" y="198" width="94" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="415" y="216" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">count = 1+1−1</text>

  <!-- ===== Step 3: add (1,2) ===== -->
  <text x="125" y="262" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">③ 加 (1,2)</text>
  <!-- grid origin x=58 y=272 -->
  <rect x="58" y="272" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="75" y="293" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">L</text>
  <rect x="92" y="272" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="109" y="293" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">L</text>
  <rect x="126" y="272" width="34" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="143" y="293" text-anchor="middle" font-size="11" fill="#aaa">~</text>
  <rect x="58" y="306" width="34" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="75" y="327" text-anchor="middle" font-size="11" fill="#aaa">~</text>
  <rect x="92" y="306" width="34" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="109" y="327" text-anchor="middle" font-size="11" fill="#aaa">~</text>
  <rect x="126" y="306" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="143" y="327" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">L</text>
  <rect x="58" y="340" width="34" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="75" y="361" text-anchor="middle" font-size="11" fill="#aaa">~</text>
  <rect x="92" y="340" width="34" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="109" y="361" text-anchor="middle" font-size="11" fill="#aaa">~</text>
  <rect x="126" y="340" width="34" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="143" y="361" text-anchor="middle" font-size="11" fill="#aaa">~</text>
  <text x="125" y="390" text-anchor="middle" font-size="10.5" fill="#888">邻居皆水</text>
  <rect x="78" y="398" width="94" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="125" y="416" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">count = 1→2</text>

  <!-- ===== Step 4: add (2,1) ===== -->
  <text x="415" y="262" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">④ 加 (2,1)</text>
  <!-- grid origin x=348 y=272 -->
  <rect x="348" y="272" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="365" y="293" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">L</text>
  <rect x="382" y="272" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="399" y="293" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">L</text>
  <rect x="416" y="272" width="34" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="433" y="293" text-anchor="middle" font-size="11" fill="#aaa">~</text>
  <rect x="348" y="306" width="34" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="365" y="327" text-anchor="middle" font-size="11" fill="#aaa">~</text>
  <rect x="382" y="306" width="34" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="399" y="327" text-anchor="middle" font-size="11" fill="#aaa">~</text>
  <rect x="416" y="306" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="433" y="327" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">L</text>
  <rect x="348" y="340" width="34" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="365" y="361" text-anchor="middle" font-size="11" fill="#aaa">~</text>
  <rect x="382" y="340" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="399" y="361" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">L</text>
  <rect x="416" y="340" width="34" height="34" fill="#f0f0f0" stroke="#bbb" stroke-width="1.1" rx="3" filter="url(#rough2)"/>
  <text x="433" y="361" text-anchor="middle" font-size="11" fill="#aaa">~</text>
  <text x="415" y="390" text-anchor="middle" font-size="10.5" fill="#888">邻居皆水</text>
  <rect x="368" y="398" width="94" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="415" y="416" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">count = 2→3</text>

  <!-- final result -->
  <rect x="150" y="432" width="240" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="449" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">输出 ans = [1, 1, 2, 3] ✓</text>
</svg>
