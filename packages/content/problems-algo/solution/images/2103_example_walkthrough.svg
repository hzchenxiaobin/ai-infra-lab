<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">逐步演算：rings = "B0R0G0R9R0B0G0"</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">每对解析 (颜色, 杆) → mask[rod] |= bit，最终数 mask==7</text>

  <!-- Table outer frame -->
  <rect x="40" y="58" width="440" height="206" fill="none" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- Column dividers -->
  <line x1="96" y1="58" x2="96" y2="264" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="156" y1="58" x2="156" y2="264" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="206" y1="58" x2="206" y2="264" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="316" y1="58" x2="316" y2="264" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- Header row divider -->
  <line x1="40" y1="86" x2="480" y2="86" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- Header background -->
  <rect x="41" y="59" width="438" height="26" fill="#e8f0fe" stroke="none" filter="url(#rough2)"/>

  <!-- Header text -->
  <text x="68" y="77" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">步骤</text>
  <text x="126" y="77" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">输入对</text>
  <text x="181" y="77" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">rod</text>
  <text x="261" y="77" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">mask[rod] 演化</text>
  <text x="398" y="77" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">说明</text>

  <!-- Row height: 25px each, 7 rows from y=87 to y=262 -->

  <!-- Row 1: B0 -->
  <rect x="41" y="87" width="438" height="25" fill="#fff8e1" stroke="none" filter="url(#rough2)"/>
  <line x1="40" y1="112" x2="480" y2="112" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="68" y="104" text-anchor="middle" font-size="11" fill="#555">1</text>
  <text x="126" y="104" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">B0</text>
  <text x="181" y="104" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="261" y="104" text-anchor="middle" font-size="11" fill="#446688">0 |= 0b100 → 0b100</text>
  <text x="398" y="104" text-anchor="middle" font-size="10.5" fill="#888">套 B 到杆 0</text>

  <!-- Row 2: R0 -->
  <rect x="41" y="112" width="438" height="25" fill="#fff8e1" stroke="none" filter="url(#rough2)"/>
  <line x1="40" y1="137" x2="480" y2="137" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="68" y="129" text-anchor="middle" font-size="11" fill="#555">2</text>
  <text x="126" y="129" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">R0</text>
  <text x="181" y="129" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="261" y="129" text-anchor="middle" font-size="11" fill="#446688">0b100 |= 0b001 → 0b101</text>
  <text x="398" y="129" text-anchor="middle" font-size="10.5" fill="#888">套 R 到杆 0</text>

  <!-- Row 3: G0  — reaches 0b111, green highlight -->
  <rect x="41" y="137" width="438" height="25" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <line x1="40" y1="162" x2="480" y2="162" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="68" y="154" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="126" y="154" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">G0</text>
  <text x="181" y="154" text-anchor="middle" font-size="11" fill="#4a7a3a">0</text>
  <text x="261" y="154" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0b101 |= 0b010 → 0b111</text>
  <text x="398" y="154" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">三色齐 ✓ =7</text>

  <!-- Row 4: R9 -->
  <rect x="41" y="162" width="438" height="25" fill="#fce4ec" stroke="none" filter="url(#rough2)"/>
  <line x1="40" y1="187" x2="480" y2="187" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="68" y="179" text-anchor="middle" font-size="11" fill="#555">4</text>
  <text x="126" y="179" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">R9</text>
  <text x="181" y="179" text-anchor="middle" font-size="11" fill="#333">9</text>
  <text x="261" y="179" text-anchor="middle" font-size="11" fill="#b85450">0 |= 0b001 → 0b001</text>
  <text x="398" y="179" text-anchor="middle" font-size="10.5" fill="#888">套 R 到杆 9</text>

  <!-- Row 5: R0 (duplicate, or-noop) -->
  <rect x="41" y="187" width="438" height="25" fill="#f5f5f5" stroke="none" filter="url(#rough2)"/>
  <line x1="40" y1="212" x2="480" y2="212" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="68" y="204" text-anchor="middle" font-size="11" fill="#aaa">5</text>
  <text x="126" y="204" text-anchor="middle" font-size="11.5" fill="#888">R0</text>
  <text x="181" y="204" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="261" y="204" text-anchor="middle" font-size="11" fill="#888">0b111 |= 0b001 → 0b111</text>
  <text x="398" y="204" text-anchor="middle" font-size="10.5" fill="#888">重复 R，幂等不变</text>

  <!-- Row 6: B0 (duplicate) -->
  <rect x="41" y="212" width="438" height="25" fill="#f5f5f5" stroke="none" filter="url(#rough2)"/>
  <line x1="40" y1="237" x2="480" y2="237" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="68" y="229" text-anchor="middle" font-size="11" fill="#aaa">6</text>
  <text x="126" y="229" text-anchor="middle" font-size="11.5" fill="#888">B0</text>
  <text x="181" y="229" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="261" y="229" text-anchor="middle" font-size="11" fill="#888">0b111 |= 0b100 → 0b111</text>
  <text x="398" y="229" text-anchor="middle" font-size="10.5" fill="#888">重复 B，幂等不变</text>

  <!-- Row 7: G0 (duplicate) -->
  <rect x="41" y="237" width="438" height="25" fill="#f5f5f5" stroke="none" filter="url(#rough2)"/>
  <text x="68" y="254" text-anchor="middle" font-size="11" fill="#aaa">7</text>
  <text x="126" y="254" text-anchor="middle" font-size="11.5" fill="#888">G0</text>
  <text x="181" y="254" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="261" y="254" text-anchor="middle" font-size="11" fill="#888">0b111 |= 0b010 → 0b111</text>
  <text x="398" y="254" text-anchor="middle" font-size="10.5" fill="#888">重复 G，幂等不变</text>

  <!-- ===== Result box ===== -->
  <rect x="90" y="278" width="340" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="297" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">终统计：mask[0]==7 ✓ · 其余 9 杆 ✗ → 答案 = 1</text>
  <text x="260" y="313" text-anchor="middle" font-size="10.5" fill="#555">重复颜色按位或幂等，不改变 mask；判定用 ==7 而非 &amp;7</text>

  <!-- Footer note -->
  <text x="260" y="338" text-anchor="middle" font-size="10.5" fill="#888">第 3 步即达 0b111，后续重复套环不改变状态</text>
  <text x="260" y="352" text-anchor="middle" font-size="10" fill="#aaa">时间 O(n) · 空间 O(1) · 位掩码天然去重</text>
</svg>
