<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="6" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="440" fill="#fdfcf7"/>

  <text x="380" y="34" text-anchor="middle" font-size="18" fill="#2b2b2b" font-weight="bold">交错字符串 DP 状态转移</text>
  <path d="M 250 44 Q 380 52 510 44" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="380" y="60" text-anchor="middle" font-size="11" fill="#888">dp[i][j] = s3[0..i+j-1] 是否由 s1[0..i-1] 与 s2[0..j-1] 交错而成</text>

  <!-- col labels (j) -->
  <text x="160" y="100" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">j=0</text>
  <text x="220" y="100" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">1</text>
  <text x="280" y="100" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">2</text>
  <text x="340" y="100" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">3</text>
  <text x="380" y="100" font-size="11" fill="#888">← s2 前缀长度</text>

  <!-- row labels (i) -->
  <text x="120" y="138" text-anchor="end" font-size="11" fill="#888" font-weight="bold">i=0</text>
  <text x="120" y="186" text-anchor="end" font-size="11" fill="#888" font-weight="bold">1</text>
  <text x="120" y="234" text-anchor="end" font-size="11" fill="#888" font-weight="bold">2</text>
  <text x="120" y="282" text-anchor="end" font-size="11" fill="#888" font-weight="bold">3</text>
  <text x="120" y="312" text-anchor="end" font-size="11" fill="#888">s1 前缀长度 ↑</text>

  <!-- row i=0 (boundary, orange) -->
  <g filter="url(#sk)"><rect x="130" y="114" width="60" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="160" y="144" text-anchor="middle" font-size="14" fill="#9a6820" font-weight="bold">✓</text>
  <g filter="url(#sk)"><rect x="190" y="114" width="60" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="220" y="144" text-anchor="middle" font-size="14" fill="#9a6820" font-weight="bold">✗</text>
  <g filter="url(#sk)"><rect x="250" y="114" width="60" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="280" y="144" text-anchor="middle" font-size="14" fill="#9a6820" font-weight="bold">✗</text>
  <g filter="url(#sk)"><rect x="310" y="114" width="60" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="340" y="144" text-anchor="middle" font-size="14" fill="#9a6820" font-weight="bold">✗</text>

  <!-- row i=1 -->
  <g filter="url(#sk)"><rect x="130" y="162" width="60" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="160" y="192" text-anchor="middle" font-size="14" fill="#9a6820" font-weight="bold">✓</text>
  <g filter="url(#sk)"><rect x="190" y="162" width="60" height="48" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.1"/></g>
  <text x="220" y="192" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">✗</text>
  <!-- top source dp[1][2] = ✗ -->
  <g filter="url(#sk)"><rect x="250" y="162" width="60" height="48" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.1"/></g>
  <text x="280" y="192" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">✗</text>
  <g filter="url(#sk)"><rect x="310" y="162" width="60" height="48" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.1"/></g>
  <text x="340" y="192" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">✗</text>

  <!-- row i=2 -->
  <g filter="url(#sk)"><rect x="130" y="210" width="60" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="160" y="240" text-anchor="middle" font-size="14" fill="#9a6820" font-weight="bold">✓</text>
  <!-- left source dp[2][1] = ✓ -->
  <g filter="url(#sk)"><rect x="190" y="210" width="60" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1"/></g>
  <text x="220" y="240" text-anchor="middle" font-size="14" fill="#2a5a2a" font-weight="bold">✓</text>
  <!-- current cell dp[2][2] = ✓ (highlighted) -->
  <g filter="url(#sk)"><rect x="250" y="210" width="60" height="48" rx="4" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="2.4"/></g>
  <text x="280" y="240" text-anchor="middle" font-size="15" fill="#2a5a2a" font-weight="bold">✓</text>
  <g filter="url(#sk)"><rect x="310" y="210" width="60" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1"/></g>
  <text x="340" y="240" text-anchor="middle" font-size="14" fill="#2a5a2a" font-weight="bold">✓</text>

  <!-- row i=3 -->
  <g filter="url(#sk)"><rect x="130" y="258" width="60" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3"/></g>
  <text x="160" y="288" text-anchor="middle" font-size="14" fill="#9a6820" font-weight="bold">✗</text>
  <g filter="url(#sk)"><rect x="190" y="258" width="60" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1"/></g>
  <text x="220" y="288" text-anchor="middle" font-size="14" fill="#2a5a2a" font-weight="bold">✓</text>
  <g filter="url(#sk)"><rect x="250" y="258" width="60" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1"/></g>
  <text x="280" y="288" text-anchor="middle" font-size="14" fill="#2a5a2a" font-weight="bold">✓</text>
  <g filter="url(#sk)"><rect x="310" y="258" width="60" height="48" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.1"/></g>
  <text x="340" y="288" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">✗</text>

  <!-- current cell label -->
  <text x="280" y="338" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">dp[i][j] (当前格)</text>

  <!-- top source arrow: dp[1][2] -> dp[2][2] (取 s1, fails) -->
  <path d="M 280 162 Q 286 188 280 210" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#sk)" stroke-dasharray="5,3"/>
  <text x="300" y="186" font-size="11" fill="#b85450" font-weight="bold">取 s1 ↑</text>
  <text x="300" y="200" font-size="10" fill="#b85450">s1[i-1]==s3[i+j-1]?</text>

  <!-- left source arrow: dp[2][1] -> dp[2][2] (取 s2, succeeds) -->
  <path d="M 190 234 Q 220 240 250 234" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="196" y="226" font-size="11" fill="#4a7a3a" font-weight="bold">取 s2 ←</text>
  <text x="180" y="356" font-size="10" fill="#4a7a3a">s2[j-1]==s3[i+j-1]?</text>

  <!-- formula box (right) -->
  <g filter="url(#sk)">
    <rect x="430" y="114" width="300" height="172" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3"/>
  </g>
  <text x="580" y="138" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">状态转移方程（OR 二选一）</text>
  <text x="448" y="166" font-family="monospace" font-size="12" fill="#2b2b2b">dp[i][j] =</text>
  <text x="448" y="188" font-size="11" fill="#b85450" font-weight="bold">  ( dp[i-1][j]</text>
  <text x="556" y="188" font-size="11" fill="#444">且 s1[i-1]==s3[i+j-1] )</text>
  <text x="610" y="188" font-size="13" fill="#2b2b2b" font-weight="bold">  or</text>
  <text x="448" y="210" font-size="11" fill="#4a7a3a" font-weight="bold">  ( dp[i][j-1]</text>
  <text x="556" y="210" font-size="11" fill="#444">且 s2[j-1]==s3[i+j-1] )</text>
  <text x="448" y="238" font-size="11" fill="#888">边界：dp[0][0]=✓</text>
  <text x="448" y="256" font-size="11" fill="#888">dp[i][0]：只用 s1 顺序匹配</text>
  <text x="448" y="274" font-size="11" fill="#888">dp[0][j]：只用 s2 顺序匹配</text>

  <!-- intuition box (bottom right) -->
  <g filter="url(#sk)">
    <rect x="430" y="300" width="300" height="116" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3" stroke-dasharray="5,3"/>
  </g>
  <text x="580" y="322" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">为什么用 OR？</text>
  <text x="448" y="344" font-size="11" fill="#444">s3[i+j-1] 这一个字符只能来自</text>
  <text x="448" y="360" font-size="11" fill="#444">s1 或 s2 之一，任一能接上即 ✓</text>
  <text x="448" y="384" font-size="11" fill="#888">可行性 DP → or</text>
  <text x="448" y="400" font-size="11" fill="#888">最值 DP → min / max</text>
</svg>
