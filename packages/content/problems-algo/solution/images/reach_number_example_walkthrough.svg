<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="500" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：target = 2 → 最少 3 步</text>

  <!-- ===== Section 1: 逐步累加表 ===== -->
  <text x="34" y="56" font-size="11" fill="#446688" font-weight="bold">① 逐步累加 S，找最小的 k</text>

  <!-- table header -->
  <rect x="40" y="66" width="520" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <g font-size="11" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="80" y="84" filter="url(#rough2)">k</text>
    <text x="150" y="84" filter="url(#rough2)">S=1+…+k</text>
    <text x="240" y="84" filter="url(#rough2)">S ≥ 2 ?</text>
    <text x="330" y="84" filter="url(#rough2)">D=S−2</text>
    <text x="420" y="84" filter="url(#rough2)">D 偶 ?</text>
    <text x="510" y="84" filter="url(#rough2)">动作</text>
  </g>

  <!-- row k=1 -->
  <rect x="40" y="94" width="520" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="80" y="112" font-weight="bold" filter="url(#rough2)">1</text>
    <text x="150" y="112" filter="url(#rough2)">1</text>
    <text x="240" y="112" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
    <text x="330" y="112" fill="#bbb" filter="url(#rough2)">—</text>
    <text x="420" y="112" fill="#bbb" filter="url(#rough2)">—</text>
    <text x="510" y="112" fill="#888" filter="url(#rough2)">继续</text>
  </g>

  <!-- row k=2 -->
  <rect x="40" y="124" width="520" height="28" fill="#f6f8fb" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="80" y="142" font-weight="bold" filter="url(#rough2)">2</text>
    <text x="150" y="142" filter="url(#rough2)">3</text>
    <text x="240" y="142" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
    <text x="330" y="142" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
    <text x="420" y="142" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
    <text x="510" y="142" fill="#888" filter="url(#rough2)">继续</text>
  </g>

  <!-- row k=3 (answer) -->
  <rect x="40" y="154" width="520" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="80" y="172" font-weight="bold" fill="#b85450" filter="url(#rough2)">3</text>
    <text x="150" y="172" font-weight="bold" fill="#b85450" filter="url(#rough2)">6</text>
    <text x="240" y="172" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
    <text x="330" y="172" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
    <text x="420" y="172" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
    <text x="510" y="172" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 3 ⭐</text>
  </g>

  <!-- ===== Section 2: 数轴上的三步走法 ===== -->
  <text x="34" y="210" font-size="11" fill="#446688" font-weight="bold">② 数轴上的实际走法（翻转第 2 步）</text>

  <!-- number line -->
  <path d="M 80 240 L 540 240" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- positions: -1, 0, 1, 2 -->
  <circle cx="160" cy="240" r="3" fill="#888" filter="url(#rough2)"/>
  <text x="160" y="258" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">−1</text>

  <circle cx="240" cy="240" r="3.5" fill="#446688" filter="url(#rough2)"/>
  <text x="240" y="258" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>

  <circle cx="320" cy="240" r="3.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="320" y="258" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <circle cx="480" cy="240" r="4" fill="#b85450" filter="url(#rough2)"/>
  <text x="480" y="258" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- move 1: 0 -> 1 (+1) -->
  <path d="M 244 232 L 316 232" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="268" y="206" width="40" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="288" y="220" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">+1</text>

  <!-- move 2: 1 -> -1 (-2) -->
  <path d="M 316 248 Q 240 268 164 248" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="224" y="268" width="40" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="244" y="282" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">−2</text>

  <!-- move 3: -1 -> 2 (+3) -->
  <path d="M 164 232 Q 320 200 476 232" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="300" y="186" width="40" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="320" y="200" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">+3</text>

  <!-- ===== Section 3: 翻转推导 ===== -->
  <text x="34" y="320" font-size="11" fill="#446688" font-weight="bold">③ 翻转推导：D=4 → T=D/2=2 → 翻转步 2</text>

  <!-- original all-positive -->
  <rect x="80" y="332" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="110" y="352" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">+1</text>
  <rect x="146" y="332" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="176" y="352" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">+2</text>
  <rect x="212" y="332" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="242" y="352" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">+3</text>
  <text x="284" y="352" font-size="12" fill="#888" font-weight="bold" filter="url(#rough2)">= 6 = S</text>

  <!-- arrow down: flip step 2 -->
  <path d="M 300 372 L 300 388" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="316" y="384" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">翻转步 2</text>

  <!-- after flip -->
  <rect x="80" y="392" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="110" y="412" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">+1</text>
  <rect x="146" y="392" width="60" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="176" y="412" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−2</text>
  <rect x="212" y="392" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="242" y="412" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">+3</text>
  <text x="284" y="412" font-size="12" fill="#888" font-weight="bold" filter="url(#rough2)">= 2 = target</text>

  <!-- result box -->
  <rect x="380" y="392" width="180" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="470" y="413" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">6 − 2×2 = 2  ✓</text>

  <!-- verification note -->
  <rect x="80" y="446" width="440" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)" opacity="0.6"/>
  <text x="300" y="464" text-anchor="middle" font-size="10" fill="#4a7a3a">验证 target=3：S₂=3≥3, D=0 偶 → 返回 2（+1, +2 = 3）✓</text>
  <text x="300" y="479" text-anchor="middle" font-size="10" fill="#4a7a3a">验证 target=4：S₃=6≥4, D=2 偶 → 返回 3（−1, +2, +3 = 4）✓</text>
</svg>
