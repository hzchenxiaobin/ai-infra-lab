  <text x="314" y="80" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">b[i] &gt; tested ?</text>
  <rect x="373" y="62" width="68" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="407" y="80" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">tested</text>

