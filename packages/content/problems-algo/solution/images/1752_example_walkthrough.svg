<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例对比：环视角逐对比较，下降数 ≤ 1 即合法</text>
  <text x="300" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">绿 = ≤ 无下降；红 = &gt; 下降；末尾环回到开头一起数</text>

  <!-- ============ Example 1 ============ -->
  <rect x="30" y="54" width="540" height="178" fill="#f4faf4" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="6 4" rx="10" filter="url(#rough2)"/>
  <text x="48" y="76" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">示例 1：nums = [3, 4, 5, 1, 2]，n = 5</text>

  <!-- 5 boxes centers 164,232,300,368,436 ; y 86-120 -->
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="136" y="86" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="164" y="108" fill="#333" font-weight="bold">3</text>
    <rect x="204" y="86" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="232" y="108" fill="#333" font-weight="bold">4</text>
    <rect x="272" y="86" width="56" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <text x="300" y="108" fill="#b85450" font-weight="bold">5</text>
    <rect x="340" y="86" width="56" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <text x="368" y="108" fill="#b85450" font-weight="bold">1</text>
    <rect x="408" y="86" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="436" y="108" fill="#333" font-weight="bold">2</text>
  </g>

  <!-- inline pair chips: x=198,266,334,402 ; y=140 -->
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="184" y="132" width="28" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="198" y="146" fill="#4a7a3a" font-weight="bold">≤</text>
    <rect x="252" y="132" width="28" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="266" y="146" fill="#4a7a3a" font-weight="bold">≤</text>
    <rect x="318" y="132" width="32" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="334" y="146" fill="#b85450" font-weight="bold">↓</text>
    <rect x="388" y="132" width="28" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="402" y="146" fill="#4a7a3a" font-weight="bold">≤</text>
  </g>

  <!-- wrap chip + curved arrow from box4 (436,120) to box0 (164,120) below -->
  <path d="M 436 122 Q 470 170 470 178 Q 470 188 300 188 Q 130 188 130 178 Q 130 170 164 122"
        stroke="#4a7a3a" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="262" y="178" width="156" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="340" y="193" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">环回 2 ≤ 3 → ≤ 无下降</text>

  <!-- result line -->
  <rect x="184" y="206" width="232" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="221" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">drops = 1 ≤ 1 → true ✓</text>

  <!-- ============ Example 2 ============ -->
  <rect x="30" y="244" width="540" height="186" fill="#fdf4f4" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6 4" rx="10" filter="url(#rough2)"/>
  <text x="48" y="266" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">示例 2：nums = [2, 1, 3, 4]，n = 4</text>

  <!-- 4 boxes centers 192,264,336,408 ; y 276-310 -->
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="164" y="276" width="56" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <text x="192" y="298" fill="#b85450" font-weight="bold">2</text>
    <rect x="236" y="276" width="56" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <text x="264" y="298" fill="#b85450" font-weight="bold">1</text>
    <rect x="308" y="276" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="336" y="298" fill="#333" font-weight="bold">3</text>
    <rect x="380" y="276" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="408" y="298" fill="#333" font-weight="bold">4</text>
  </g>

  <!-- inline pair chips: x=228,300,372 ; y=326 -->
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="212" y="318" width="32" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="228" y="332" fill="#b85450" font-weight="bold">↓</text>
    <rect x="286" y="318" width="28" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="300" y="332" fill="#4a7a3a" font-weight="bold">≤</text>
    <rect x="358" y="318" width="28" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="372" y="332" fill="#4a7a3a" font-weight="bold">≤</text>
  </g>

  <!-- wrap chip + curved arrow from box3 (408,310) to box0 (192,310) below -->
  <path d="M 408 312 Q 448 364 448 372 Q 448 382 300 382 Q 152 382 152 372 Q 152 364 192 312"
        stroke="#b85450" stroke-width="2.2" stroke-dasharray="5 4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="222" y="372" width="156" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="387" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">环回 4 &gt; 2 → ↓ 第二个下降！</text>

  <!-- result line -->
  <rect x="184" y="402" width="232" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="417" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">drops = 2 &gt; 1 → false ✗</text>
</svg>
