<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：D(1) → D(4) 逐项递推</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">递推式 D(n) = (n−1) × (D(n−1) + D(n−2))</text>

  <!-- ===== D(1) = 0 ===== -->
  <text x="30" y="74" font-size="12" fill="#b85450" font-weight="bold">D(1) = 0</text>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="80" y="58" width="36" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="98" y="79" fill="#b85450" font-weight="bold">1</text>
  </g>
  <text x="140" y="79" font-size="11" fill="#b85450">[1]：1 必在位1 → 无错排</text>

  <!-- ===== D(2) = 1 ===== -->
  <text x="30" y="118" font-size="12" fill="#4a7a3a" font-weight="bold">D(2) = 1</text>
  <text x="80" y="118" font-size="10" fill="#888">= (2−1)×(D(1)+D(0)) = 1×(0+1) = 1</text>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="80" y="128" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="98" y="149" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="116" y="128" width="36" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="134" y="149" fill="#4a7a3a" font-weight="bold">1</text>
  </g>
  <text x="170" y="149" font-size="11" fill="#4a7a3a">[2,1]：唯一错排</text>

  <!-- ===== D(3) = 2 ===== -->
  <text x="30" y="192" font-size="12" fill="#446688" font-weight="bold">D(3) = 2</text>
  <text x="80" y="192" font-size="10" fill="#888">= (3−1)×(D(2)+D(1)) = 2×(1+0) = 2</text>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <!-- derangement 1: [2,3,1] -->
    <rect x="80" y="202" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="96" y="221" fill="#446688" font-weight="bold">2</text>
    <rect x="112" y="202" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="128" y="221" fill="#446688" font-weight="bold">3</text>
    <rect x="144" y="202" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="160" y="221" fill="#446688" font-weight="bold">1</text>
    <text x="195" y="221" font-size="10" fill="#446688">[2,3,1] ✓</text>
    <!-- derangement 2: [3,1,2] -->
    <rect x="80" y="234" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="96" y="253" fill="#446688" font-weight="bold">3</text>
    <rect x="112" y="234" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="128" y="253" fill="#446688" font-weight="bold">1</text>
    <rect x="144" y="234" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="160" y="253" fill="#446688" font-weight="bold">2</text>
    <text x="195" y="253" font-size="10" fill="#446688">[3,1,2] ✓</text>
  </g>

  <!-- ===== D(4) = 9 ===== -->
  <text x="30" y="288" font-size="12" fill="#d6a040" font-weight="bold">D(4) = 9</text>
  <text x="80" y="288" font-size="10" fill="#888">= (4−1)×(D(3)+D(2)) = 3×(2+1) = 9</text>

  <!-- 9 derangements listed compactly -->
  <g filter="url(#rough2)" font-size="10" fill="#d6a040" text-anchor="middle">
    <rect x="60" y="298" width="440" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6"/>
    <text x="280" y="316" font-size="10" fill="#888">n=4 的 9 个错排（节选展示）</text>
  </g>
  <g font-size="10" fill="#666" text-anchor="middle">
    <text x="100" y="336">[2,1,4,3]</text>
    <text x="180" y="336">[2,3,4,1]</text>
    <text x="260" y="336">[2,4,1,3]</text>
    <text x="340" y="336">[3,1,4,2]</text>
    <text x="420" y="336">[3,4,1,2]</text>
    <text x="100" y="356">[3,4,2,1]</text>
    <text x="180" y="356">[4,1,2,3]</text>
    <text x="260" y="356">[4,3,1,2]</text>
    <text x="340" y="356">[4,3,2,1]</text>
  </g>

  <!-- ===== Bottom: verify formula ===== -->
  <rect x="40" y="392" width="480" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="416" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">验证：D(4) = 3 × (2 + 1) = 9 ✓  （4! = 24 中恰 9 个错排）</text>
</svg>
