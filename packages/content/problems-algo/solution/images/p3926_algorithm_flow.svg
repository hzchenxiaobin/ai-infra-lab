<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="640" height="500" fill="#fafafa"/>

  <text x="320" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：单趟贪心切词入哈希表，查询端只查表</text>

  <!-- step 1 -->
  <rect x="200" y="40" width="240" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="320" y="64" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">① 拼接 chunks → s，i ← 0</text>

  <path d="M 320 78 L 320 86" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 2: outer scan decision -->
  <polygon points="320,90 420,132 320,174 220,132" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="137" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">② i &lt; n ?</text>

  <!-- no branch: scan done -->
  <path d="M 420 132 L 540 132 L 540 194" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="482" y="124" text-anchor="middle" font-size="10.5" fill="#a87020" filter="url(#rough2)">否：扫描完</text>

  <rect x="470" y="196" width="140" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="540" y="216" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">⑥ 逐 query 查表</text>
  <text x="540" y="234" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">ans[k] = cnt.get(q, 0)</text>

  <path d="M 540 244 L 540 260" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="470" y="264" width="140" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="540" y="287" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">⑦ 返回 ans</text>

  <!-- yes branch: letter decision -->
  <path d="M 320 174 L 320 196" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="330" y="190" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <polygon points="320,198 425,240 320,282 215,240" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="245" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">③ s[i] 是字母 ?</text>

  <!-- no branch: skip separator -->
  <path d="M 215 240 L 176 240" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="196" y="231" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否：分隔符</text>

  <rect x="40" y="220" width="130" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="105" y="245" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">i++ 跳过分隔符</text>

  <!-- i++ loop back to junction -->
  <path d="M 105 220 L 105 132" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="105" cy="132" r="3.2" fill="#b85450" filter="url(#rough2)"/>

  <!-- yes branch: greedy extend -->
  <path d="M 320 282 L 320 304" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="330" y="298" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是：词首，j ← i</text>

  <polygon points="320,306 470,352 320,398 170,352" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="346" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">④ s[j] 是字母 或</text>
  <text x="320" y="364" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">s[j]='-' 且 s[j+1] 是字母 ?</text>

  <!-- yes branch: j++ -->
  <path d="M 470 352 L 501 352" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="486" y="344" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="505" y="332" width="90" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="550" y="357" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">j++</text>

  <!-- j++ loop back to diamond 4 -->
  <path d="M 550 332 L 550 296 L 340 296 L 340 309" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- no branch: word ends -->
  <path d="M 320 398 L 320 416" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="330" y="412" font-size="10.5" fill="#a87020" filter="url(#rough2)">否：词结束</text>

  <rect x="180" y="420" width="280" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="320" y="440" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">⑤ token = s[i..j)，cnt[token]++</text>
  <text x="320" y="458" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">i ← j，回到 ②</text>

  <!-- step 5 loop back to step 2 (joins i++ junction) -->
  <path d="M 180 442 L 25 442 L 25 132 L 213 132" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <text x="320" y="490" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">切词 O(|s|)：每字符至多消费一次；查表 O(Σ|q|) —— 两个线性阶段</text>
</svg>
