<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">非降序数组切成 run：子数组 = 左后缀 + 完整 run + 右前缀</text>

  <!-- 主数组 8 格：2 2 2 | 5 5 | 8 8 8 -->
  <rect x="70" y="56" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="110" y="56" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="150" y="56" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="190" y="56" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="230" y="56" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="270" y="56" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="310" y="56" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="350" y="56" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="79" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="130" y="79" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="170" y="79" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="210" y="79" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <text x="250" y="79" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <text x="290" y="79" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">8</text>
  <text x="330" y="79" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">8</text>
  <text x="370" y="79" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">8</text>

  <!-- run 分隔虚线 -->
  <line x1="190" y1="50" x2="190" y2="100" stroke="#888" stroke-width="2.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <line x1="270" y1="50" x2="270" y2="100" stroke="#888" stroke-width="2.5" stroke-dasharray="6 4" filter="url(#rough2)"/>

  <!-- run 括号标注 -->
  <path d="M 70 110 L 70 116 L 189 116 L 189 110" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="131" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">run₁ (v=2, L=3)</text>
  <path d="M 191 110 L 191 116 L 269 116 L 269 110" fill="none" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="230" y="131" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">run₂ (5, 2)</text>
  <path d="M 271 110 L 271 116 L 389 116 L 389 110" fill="none" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="131" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">run₃ (8, 3)</text>

  <!-- 红框高亮多值子数组（位置 1..5） -->
  <rect x="106" y="48" width="208" height="56" rx="6" fill="none" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="424" y="72" font-size="12" fill="#b85450" filter="url(#rough2)">多值子数组</text>
  <text x="424" y="88" font-size="12" fill="#b85450" filter="url(#rough2)">[2,2,5,5,8]</text>

  <path d="M 210 106 L 210 140" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 分解小图 -->
  <rect x="56" y="146" width="92" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="102" y="167" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2,2（后缀）</text>
  <text x="160" y="167" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">+</text>
  <rect x="172" y="146" width="92" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="218" y="167" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5,5（全取）</text>
  <text x="276" y="167" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">+</text>
  <rect x="288" y="146" width="80" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="328" y="167" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8（前缀）</text>

  <!-- 绿色结论框 -->
  <rect x="48" y="196" width="424" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="220" text-anchor="middle" font-size="13" fill="#2a5420" filter="url(#rough2)">多值序列出现位置唯一 ⇒ 与位置区间一一对应，天然无重复</text>

  <!-- 单值部分 -->
  <text x="260" y="262" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">唯一重复来源：单值序列（在同一 run 内滑动）</text>
  <rect x="120" y="272" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="156" y="272" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="192" y="272" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="138" y="293" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="174" y="293" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="210" y="293" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>

  <rect x="116" y="266" width="80" height="44" rx="6" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <rect x="152" y="266" width="80" height="44" rx="6" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="5 4" filter="url(#rough2)"/>

  <path d="M 240 288 L 262 288" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <text x="270" y="284" font-size="12" fill="#b85450" filter="url(#rough2)">[2,2] 出现 L−x+1 = 2 次</text>
  <text x="270" y="302" font-size="12" fill="#b85450" filter="url(#rough2)">数值序列相同 ⇒ 只计 1 次</text>
</svg>
