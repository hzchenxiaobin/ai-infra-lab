<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="350" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [2,1,3,4]，k = 1</text>

  <!-- 左半：累积异或 -->
  <text x="130" y="48" text-anchor="middle" font-size="12" fill="#33507a" font-weight="bold" filter="url(#rough2)">① 累积异或求 X</text>

  <text x="36" y="78" font-size="11.5" fill="#333" filter="url(#rough2)">0 ⊕ 010 → 010</text>
  <text x="238" y="78" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">⊕ 2</text>

  <text x="36" y="104" font-size="11.5" fill="#333" filter="url(#rough2)">010 ⊕ 001 → 011</text>
  <text x="238" y="104" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">⊕ 1</text>

  <text x="36" y="130" font-size="11.5" fill="#333" filter="url(#rough2)">011 ⊕ 011 → 000</text>
  <text x="238" y="130" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">⊕ 3</text>

  <text x="36" y="156" font-size="11.5" fill="#333" filter="url(#rough2)">000 ⊕ 100 → 100</text>
  <text x="238" y="156" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">⊕ 4</text>

  <rect x="46" y="168" width="176" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="134" y="187" text-anchor="middle" font-size="12" fill="#33507a" font-weight="bold" filter="url(#rough2)">X = 100₂ = 4</text>

  <!-- 右半：逐位对比表 -->
  <text x="400" y="48" text-anchor="middle" font-size="12" fill="#33507a" font-weight="bold" filter="url(#rough2)">② 与 k 逐位对比</text>

  <text x="300" y="70" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">位</text>
  <rect x="308" y="54" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="328" y="71" text-anchor="middle" font-size="11" fill="#33507a" filter="url(#rough2)">2</text>
  <rect x="352" y="54" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="372" y="71" text-anchor="middle" font-size="11" fill="#33507a" filter="url(#rough2)">1</text>
  <rect x="396" y="54" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="416" y="71" text-anchor="middle" font-size="11" fill="#33507a" filter="url(#rough2)">0</text>

  <text x="300" y="96" text-anchor="end" font-size="11" fill="#333" filter="url(#rough2)">X=4</text>
  <rect x="308" y="80" width="40" height="24" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="328" y="97" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="352" y="80" width="40" height="24" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="372" y="97" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="396" y="80" width="40" height="24" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="416" y="97" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>

  <text x="300" y="122" text-anchor="end" font-size="11" fill="#333" filter="url(#rough2)">k=1</text>
  <rect x="308" y="106" width="40" height="24" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="328" y="123" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="352" y="106" width="40" height="24" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="372" y="123" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="396" y="106" width="40" height="24" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="416" y="123" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="300" y="148" text-anchor="end" font-size="11" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">X⊕k</text>
  <rect x="308" y="132" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="328" y="149" text-anchor="middle" font-size="12" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="352" y="132" width="40" height="24" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="372" y="149" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="396" y="132" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="416" y="149" text-anchor="middle" font-size="12" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="288" y="168" width="212" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="394" y="187" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">popcount(101₂) = 2 ⟹ 答案 2</text>

  <!-- 底部：修复方案 -->
  <text x="260" y="222" text-anchor="middle" font-size="12" fill="#33507a" font-weight="bold" filter="url(#rough2)">③ 还原一种修复方案（差异位翻在哪个元素上都行）</text>

  <rect x="36" y="234" width="220" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="146" y="254" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">位 2 差异：翻 nums[0] 的第 2 位</text>
  <text x="146" y="272" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">010₂ → 110₂（2 变 6）</text>

  <rect x="264" y="234" width="220" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="374" y="254" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">位 0 差异：翻 nums[1] 的第 0 位</text>
  <text x="374" y="272" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">001₂ → 000₂（1 变 0）</text>

  <rect x="36" y="292" width="448" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="316" text-anchor="middle" font-size="11.5" fill="#7a5a10" filter="url(#rough2)">验证：6 ⊕ 0 ⊕ 3 ⊕ 4 = 1 = k ✓（方案不唯一，次数唯一）</text>
</svg>
