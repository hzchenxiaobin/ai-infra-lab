<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">叶子相似判定：算法流程</text>

  <!-- 开始 -->
  <rect x="200" y="46" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="16" filter="url(#rough2)"/>
  <text x="260" y="67" text-anchor="middle" font-size="12" fill="#333">输入 root1, root2</text>

  <line x1="260" y1="78" x2="260" y2="98" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 收集叶子1 -->
  <rect x="160" y="100" width="200" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="123" text-anchor="middle" font-size="11" fill="#333">leaves1 = dfs(root1)</text>

  <line x1="260" y1="136" x2="260" y2="156" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 收集叶子2 -->
  <rect x="160" y="158" width="200" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="181" text-anchor="middle" font-size="11" fill="#333">leaves2 = dfs(root2)</text>

  <line x1="260" y1="194" x2="260" y2="214" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 -->
  <polygon points="260,216 360,266 260,316 160,266" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="262" text-anchor="middle" font-size="11" fill="#333">leaves1</text>
  <text x="260" y="277" text-anchor="middle" font-size="11" fill="#333">==</text>
  <text x="260" y="292" text-anchor="middle" font-size="11" fill="#333">leaves2?</text>

  <!-- 是 -->
  <line x1="260" y1="316" x2="260" y2="336" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="330" font-size="10" fill="#4a7a3a">是</text>
  <rect x="210" y="338" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="16" filter="url(#rough2)"/>
  <text x="260" y="359" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 true</text>

  <!-- 否 -->
  <line x1="160" y1="266" x2="90" y2="266" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="125" y="260" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <rect x="30" y="250" width="100" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="16" filter="url(#rough2)"/>
  <text x="80" y="271" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 false</text>

  <!-- ===== DFS 展开 ===== -->
  <rect x="370" y="100" width="140" height="130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="440" y="122" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">dfs(node) 内部</text>
  <line x1="385" y1="130" x2="495" y2="130" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="383" y="148" font-size="10" fill="#555">node == null?</text>
  <text x="470" y="148" font-size="10" fill="#b85450">→ return</text>
  <text x="383" y="166" font-size="10" fill="#555">叶子?</text>
  <text x="430" y="166" font-size="10" fill="#4a7a3a">→ 收集 val</text>
  <text x="383" y="184" font-size="10" fill="#555">dfs(node.left)</text>
  <text x="383" y="202" font-size="10" fill="#555">dfs(node.right)</text>
  <text x="383" y="220" font-size="9" fill="#888">左先右后 = 从左到右</text>

  <!-- 连接线 dfs展开到收集叶子1 -->
  <line x1="360" y1="118" x2="370" y2="118" stroke="#888" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- ===== 底部说明 ===== -->
  <rect x="40" y="392" width="440" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="414" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">时间 O(n1 + n2) ｜ 空间 O(n1 + n2)</text>
  <text x="260" y="434" text-anchor="middle" font-size="10" fill="#555">每棵树各遍历一次，叶子存入列表后逐元素比较</text>
</svg>
