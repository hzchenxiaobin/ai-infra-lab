<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrL" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">核心：只改一个位置，仅左右两条邻接边会变</text>

  <!-- array cells: 5 cells width 56, gap 0, start x=140, y=120 -->
  <g filter="url(#rough2)">
    <rect x="140" y="120" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="168" y="154" text-anchor="middle" font-size="16" fill="#333">1</text>
    <rect x="196" y="120" width="56" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="224" y="154" text-anchor="middle" font-size="16" fill="#333">1</text>
    <!-- index i = 2, highlighted, recolored 1 -> 2 -->
    <rect x="252" y="120" width="56" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4"/>
    <text x="280" y="150" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450">1→2</text>
    <text x="280" y="168" text-anchor="middle" font-size="10" fill="#a07020">改色</text>
    <rect x="308" y="120" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="336" y="154" text-anchor="middle" font-size="16" fill="#333">2</text>
    <rect x="364" y="120" width="56" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="392" y="154" text-anchor="middle" font-size="16" fill="#333">2</text>
  </g>

  <!-- index labels -->
  <g filter="url(#rough2)">
    <text x="168" y="200" text-anchor="middle" font-size="11" fill="#888">i−1</text>
    <text x="280" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040">i</text>
    <text x="336" y="200" text-anchor="middle" font-size="11" fill="#888">i+1</text>
    <text x="280" y="216" text-anchor="middle" font-size="10" fill="#bbb">其余位置不受影响</text>
  </g>

  <!-- left edge arc over cells i-1,i -->
  <path d="M196 112 C 210 78, 242 78, 252 112" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="224" y="84" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">左邻边</text>

  <!-- right edge arc over cells i,i+1 -->
  <path d="M308 112 C 322 78, 354 78, 364 112" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="336" y="84" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">右邻边</text>

  <!-- left edge delta detail -->
  <g filter="url(#rough2)">
    <rect x="40" y="244" width="220" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="150" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">左邻边 (i−1, i)</text>
    <text x="150" y="288" text-anchor="middle" font-size="11" fill="#333">旧: 1 == 1 ✓ → 撤 −1</text>
    <text x="150" y="308" text-anchor="middle" font-size="11" fill="#333">新: 2 == 1 ✗ → 不加</text>
    <text x="150" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">Δ = −1</text>
  </g>

  <!-- right edge delta detail -->
  <g filter="url(#rough2)">
    <rect x="300" y="244" width="220" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="410" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">右邻边 (i, i+1)</text>
    <text x="410" y="288" text-anchor="middle" font-size="11" fill="#333">旧: 1 == 2 ✗ → 不撤</text>
    <text x="410" y="308" text-anchor="middle" font-size="11" fill="#333">新: 2 == 2 ✓ → 加 +1</text>
    <text x="410" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">Δ = +1</text>
  </g>

  <!-- bottom note -->
  <text x="280" y="364" text-anchor="middle" font-size="12" fill="#7a5a10" filter="url(#rough2)">全局 ans：左 −1、右 +1，其余边不变 → 不必每次重数，O(1) 差量更新</text>
</svg>
