<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">极长交替段：段内任意连续子段都交替</text>

  <!-- 切断标记 -->
  <path d="M 201 58 V 114" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="201" y="52" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">1 = 1 相邻相等 → 切断 ✂</text>

  <!-- 数组格子 -->
  <text x="96" y="68" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="138" y="68" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="180" y="68" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="222" y="68" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>
  <text x="264" y="68" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">4</text>
  <text x="306" y="68" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">5</text>
  <text x="348" y="68" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">6</text>

  <rect x="75" y="72" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="117" y="72" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="159" y="72" width="42" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="201" y="72" width="42" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="243" y="72" width="42" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="285" y="72" width="42" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="327" y="72" width="42" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="96" y="99" text-anchor="middle" font-size="16" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="138" y="99" text-anchor="middle" font-size="16" font-weight="bold" fill="#446688" filter="url(#rough2)">0</text>
  <text x="180" y="99" text-anchor="middle" font-size="16" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="222" y="99" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="264" y="99" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="306" y="99" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="348" y="99" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>

  <!-- 段括号 -->
  <path d="M 75 120 L 75 128 L 180 128 L 180 120" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="127" y="146" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">极长交替段 len = 3</text>
  <path d="M 201 120 L 201 128 L 369 128 L 369 120" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="285" y="146" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">极长交替段 len = 4</text>

  <!-- 贡献公式 -->
  <rect x="58" y="160" width="140" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="128" y="181" text-anchor="middle" font-size="13" fill="#8a6d1a" filter="url(#rough2)">3×4÷2 = 6 个</text>
  <rect x="240" y="160" width="150" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="315" y="181" text-anchor="middle" font-size="13" fill="#8a6d1a" filter="url(#rough2)">4×5÷2 = 10 个</text>

  <!-- 枚举 len=3 段的子数组 -->
  <text x="60" y="226" font-size="12" fill="#446688" filter="url(#rough2)">len = 3 的段里逐个数：</text>
  <rect x="56" y="234" width="38" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="75" y="252" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1]</text>
  <rect x="102" y="234" width="38" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="121" y="252" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[0]</text>
  <rect x="148" y="234" width="38" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="167" y="252" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1]</text>
  <rect x="194" y="234" width="56" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="222" y="252" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1,0]</text>
  <rect x="258" y="234" width="56" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="286" y="252" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[0,1]</text>
  <rect x="322" y="234" width="76" height="26" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="360" y="252" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[1,0,1]</text>

  <text x="60" y="288" font-size="12" fill="#4a7a3a" filter="url(#rough2)">len = 4 的段同理：4 个长度1 + 3 个长度2 + 2 个长度3 + 1 个长度4 = 10</text>

  <!-- 总答案 -->
  <rect x="120" y="304" width="280" height="36" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="328" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d5a1f" filter="url(#rough2)">答案 = Σ L(L+1)/2 = 6 + 10 = 16</text>
</svg>
