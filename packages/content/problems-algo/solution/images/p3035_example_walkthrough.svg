<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：words = ["abbb", "ba", "aa"]</text>

  <!-- freq row -->
  <rect x="36" y="46" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="106" y="68" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">a × 4 → 2 对</text>
  <text x="184" y="68" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">+</text>
  <rect x="192" y="46" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="262" y="68" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b × 4 → 2 对</text>
  <path d="M 336 63 L 360 63" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="366" y="46" width="118" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="425" y="68" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">Q = 4 对</text>

  <!-- lengths row -->
  <text x="90" y="121" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">词长升序 →</text>
  <rect x="170" y="100" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="122" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">L=2</text>
  <rect x="226" y="100" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="248" y="122" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">L=2</text>
  <rect x="282" y="100" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="304" y="122" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">L=4</text>
  <text x="192" y="152" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">造价 1</text>
  <text x="248" y="152" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">造价 1</text>
  <text x="304" y="152" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">造价 2</text>

  <!-- table header -->
  <rect x="48" y="166" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="93" y="186" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">词长 L</text>
  <rect x="142" y="166" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="197" y="186" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">造价 ⌊L/2⌋</text>
  <rect x="256" y="166" width="140" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="326" y="186" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">Q 余额变化</text>
  <rect x="400" y="166" width="76" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="438" y="186" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">回文数</text>

  <!-- table rows -->
  <rect x="48" y="200" width="90" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="93" y="220" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">2</text>
  <rect x="142" y="200" width="110" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="197" y="220" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <rect x="256" y="200" width="140" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="326" y="220" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">4 → 3</text>
  <rect x="400" y="200" width="76" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="438" y="220" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1 ✓</text>

  <rect x="48" y="234" width="90" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="93" y="254" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">2</text>
  <rect x="142" y="234" width="110" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="197" y="254" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <rect x="256" y="234" width="140" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="326" y="254" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">3 → 2</text>
  <rect x="400" y="234" width="76" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="438" y="254" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2 ✓</text>

  <rect x="48" y="268" width="90" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="93" y="288" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="142" y="268" width="110" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="197" y="288" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="256" y="268" width="140" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="326" y="288" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">2 → 0</text>
  <rect x="400" y="268" width="76" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="438" y="288" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3 ✓</text>

  <!-- result -->
  <rect x="36" y="314" width="448" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="332" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = 3：三个词全部成为回文 ✓</text>
  <text x="260" y="351" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">一种分配：["aa", "aa", "bbbb"]（4 个 a、4 个 b 恰好用完）</text>

  <!-- bottom note -->
  <rect x="36" y="370" width="448" height="50" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="390" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">⚠️ 贪心的必要性：词长 [2,2,8]、Q=4 时，先喂造价 4 的长词只得 1 个回文；</text>
  <text x="260" y="408" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">先喂造价 1、1 的两个短词可得 2 个 —— 便宜优先是安全策略。</text>
</svg>
