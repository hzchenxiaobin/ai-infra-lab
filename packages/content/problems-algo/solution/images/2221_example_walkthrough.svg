<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：nums = [1,2,3,4,5]</text>
  <text x="270" y="40" text-anchor="middle" font-size="10.5" fill="#888">原地覆写：有效前缀逐轮缩短，尾段旧值保留但被忽略</text>

  <!-- slot index header -->
  <text x="86" y="56" text-anchor="middle" font-size="9" fill="#aaa">slot0</text>
  <text x="128" y="56" text-anchor="middle" font-size="9" fill="#aaa">slot1</text>
  <text x="170" y="56" text-anchor="middle" font-size="9" fill="#aaa">slot2</text>
  <text x="212" y="56" text-anchor="middle" font-size="9" fill="#aaa">slot3</text>
  <text x="254" y="56" text-anchor="middle" font-size="9" fill="#aaa">slot4</text>

  <!-- ===== Row 0: initial [1,2,3,4,5] ===== -->
  <text x="34" y="76" font-size="10" fill="#666" font-weight="bold">初始</text>
  <rect x="69" y="60" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="86" y="79" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="111" y="60" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="128" y="79" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="153" y="60" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="79" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="195" y="60" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="212" y="79" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="237" y="60" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="254" y="79" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>

  <!-- computations row0->row1 -->
  <text x="86" y="100" text-anchor="middle" font-size="8.5" fill="#888">1+2</text>
  <text x="128" y="100" text-anchor="middle" font-size="8.5" fill="#888">2+3</text>
  <text x="170" y="100" text-anchor="middle" font-size="8.5" fill="#888">3+4</text>
  <text x="212" y="100" text-anchor="middle" font-size="8.5" fill="#888">4+5</text>
  <path d="M 86 92 L 86 110" stroke="#aaa" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 128 92 L 128 110" stroke="#aaa" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 170 92 L 170 110" stroke="#aaa" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 212 92 L 212 110" stroke="#aaa" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row 1: i=0 -> [3,5,7,9, 5] ===== -->
  <text x="34" y="131" font-size="10" fill="#666" font-weight="bold">i=0后</text>
  <rect x="69" y="110" width="34" height="28" fill="#eaf2ff" stroke="#5588bb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="86" y="129" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="111" y="110" width="34" height="28" fill="#eaf2ff" stroke="#5588bb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="128" y="129" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <rect x="153" y="110" width="34" height="28" fill="#eaf2ff" stroke="#5588bb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="129" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
  <rect x="195" y="110" width="34" height="28" fill="#eaf2ff" stroke="#5588bb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="212" y="129" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">9</text>
  <rect x="237" y="110" width="34" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <text x="254" y="129" text-anchor="middle" font-size="12" fill="#aaa">5</text>
  <text x="282" y="129" font-size="9" fill="#aaa">←忽略</text>

  <!-- computations row1->row2 -->
  <text x="86" y="150" text-anchor="middle" font-size="8.5" fill="#888">3+5</text>
  <text x="128" y="150" text-anchor="middle" font-size="8.5" fill="#888">5+7=12</text>
  <text x="170" y="150" text-anchor="middle" font-size="8.5" fill="#888">7+9=16</text>
  <path d="M 86 142 L 86 160" stroke="#aaa" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 128 142 L 128 160" stroke="#aaa" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 170 142 L 170 160" stroke="#aaa" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row 2: i=1 -> [8,2,6, 9,5] ===== -->
  <text x="34" y="181" font-size="10" fill="#666" font-weight="bold">i=1后</text>
  <rect x="69" y="160" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="86" y="179" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>
  <rect x="111" y="160" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="128" y="179" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="153" y="160" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="179" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <rect x="195" y="160" width="34" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <text x="212" y="179" text-anchor="middle" font-size="12" fill="#aaa">9</text>
  <rect x="237" y="160" width="34" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <text x="254" y="179" text-anchor="middle" font-size="12" fill="#aaa">5</text>

  <!-- computations row2->row3 -->
  <text x="86" y="200" text-anchor="middle" font-size="8.5" fill="#888">8+2=10</text>
  <text x="128" y="200" text-anchor="middle" font-size="8.5" fill="#888">2+6</text>
  <path d="M 86 192 L 86 210" stroke="#aaa" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 128 192 L 128 210" stroke="#aaa" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row 3: i=2 -> [0,8, 6,9,5] ===== -->
  <text x="34" y="231" font-size="10" fill="#666" font-weight="bold">i=2后</text>
  <rect x="69" y="210" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="86" y="229" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="111" y="210" width="34" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="128" y="229" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>
  <rect x="153" y="210" width="34" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="229" text-anchor="middle" font-size="12" fill="#aaa">6</text>
  <rect x="195" y="210" width="34" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <text x="212" y="229" text-anchor="middle" font-size="12" fill="#aaa">9</text>
  <rect x="237" y="210" width="34" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <text x="254" y="229" text-anchor="middle" font-size="12" fill="#aaa">5</text>

  <!-- computation row3->row4 -->
  <text x="86" y="250" text-anchor="middle" font-size="8.5" fill="#888">0+8</text>
  <path d="M 86 242 L 86 260" stroke="#aaa" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row 4: i=3 -> [8, 8,6,9,5] ===== -->
  <text x="34" y="281" font-size="10" fill="#666" font-weight="bold">i=3后</text>
  <rect x="65" y="260" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="86" y="281" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">8</text>
  <rect x="111" y="260" width="34" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <text x="128" y="279" text-anchor="middle" font-size="12" fill="#aaa">8</text>
  <rect x="153" y="260" width="34" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="279" text-anchor="middle" font-size="12" fill="#aaa">6</text>
  <rect x="195" y="260" width="34" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <text x="212" y="279" text-anchor="middle" font-size="12" fill="#aaa">9</text>
  <rect x="237" y="260" width="34" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <text x="254" y="279" text-anchor="middle" font-size="12" fill="#aaa">5</text>
  <text x="86" y="304" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">答案</text>

  <!-- ===== Side panel: step legend ===== -->
  <rect x="330" y="60" width="200" height="206" fill="#f4f8ff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="430" y="80" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">归约过程小结</text>

  <rect x="346" y="92" width="168" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="352" y="107" font-size="9.5" fill="#333">轮0: [1,2,3,4,5] →长5</text>

  <rect x="346" y="118" width="168" height="22" fill="#eaf2ff" stroke="#5588bb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="352" y="133" font-size="9.5" fill="#333">轮1: [3,5,7,9] →长4</text>

  <rect x="346" y="144" width="168" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="352" y="159" font-size="9.5" fill="#333">轮2: [8,2,6] →长3</text>

  <rect x="346" y="170" width="168" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="352" y="185" font-size="9.5" fill="#333">轮3: [0,8] →长2</text>

  <rect x="346" y="196" width="168" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="352" y="211" font-size="9.5" fill="#b85450" font-weight="bold">轮4: [8] →长1 = 答案</text>

  <text x="430" y="234" text-anchor="middle" font-size="9" fill="#888">每轮长度 −1，共 n−1=4 轮</text>
  <text x="430" y="248" text-anchor="middle" font-size="9" fill="#888">虚框 = 原地残留旧值（已忽略）</text>

  <!-- ===== Result box ===== -->
  <rect x="330" y="276" width="200" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="430" y="294" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">系数 [1,4,6,4,1] 加权和</text>
  <text x="430" y="310" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">= 48 mod 10 = 8 ✓</text>

  <!-- ===== Footer ===== -->
  <rect x="30" y="330" width="500" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="350" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">关键：nums[j]=(nums[j]+nums[j+1])%10，从左到右覆写前缀</text>
  <text x="270" y="366" text-anchor="middle" font-size="10" fill="#555">第 i 轮有效长度 n−i，尾段旧值残留但不再读取 → O(1) 额外空间</text>
</svg>
