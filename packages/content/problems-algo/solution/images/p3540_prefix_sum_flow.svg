<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：前缀和预处理 + 逐段 O(1) 查询取 min</text>

  <rect x="50" y="42" width="180" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="62" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2a5a8a" filter="url(#rough2)">① 预处理前缀和</text>
  <text x="140" y="79" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">F[i+1] = F[i] + forward[i]</text>
  <text x="140" y="94" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">B[i+1] = B[i] + backward[i]</text>

  <rect x="50" y="120" width="180" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="141" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">② cur = 0（房屋 0 出发），ans = 0</text>

  <polygon points="140,170 200,202 140,234 80,202" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="198" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">③ 还有下一个</text>
  <text x="140" y="214" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">query 吗？</text>

  <rect x="50" y="252" width="180" height="46" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="271" text-anchor="middle" font-size="10.5" fill="#2a5a2a" filter="url(#rough2)">④ ans += min(dist_f, dist_b)</text>
  <text x="140" y="288" text-anchor="middle" font-size="10.5" fill="#2a5a2a" filter="url(#rough2)">cur = 当前 query</text>

  <rect x="50" y="314" width="180" height="32" rx="16" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="140" y="334" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2a5a8a" filter="url(#rough2)">⑤ 返回 ans</text>

  <path d="M 140 102 L 140 116" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 140 154 L 140 164" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 140 234 L 140 246" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="150" y="244" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 230 275 L 258 275 L 258 202 L 204 202" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="244" y="245" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">循环</text>
  <path d="M 80 202 L 32 202 L 32 330 L 44 330" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="72" y="193" text-anchor="end" font-size="10" font-weight="bold" fill="#d6a040" filter="url(#rough2)">否</text>

  <text x="395" y="48" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">每段移动的 O(1) 距离公式</text>

  <rect x="285" y="58" width="220" height="70" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="395" y="78" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2a5a8a" filter="url(#rough2)">顺时针（走 forward 环）</text>
  <text x="395" y="97" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">v ≥ u：F[v] − F[u]</text>
  <text x="395" y="115" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">v &lt; u：F[n] − F[u] + F[v]</text>

  <rect x="285" y="138" width="220" height="70" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="395" y="158" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#3a6a2a" filter="url(#rough2)">逆时针（走 backward 环）</text>
  <text x="395" y="177" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">u ≥ v：B[u+1] − B[v+1]</text>
  <text x="395" y="195" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">u &lt; v：B[u+1] + B[n] − B[v+1]</text>

  <rect x="285" y="218" width="220" height="64" rx="8" fill="#fff8e1" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="395" y="237" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">⚠ 易错：backward[i] 是「i → i−1」</text>
  <text x="395" y="254" text-anchor="middle" font-size="10.5" fill="#8a6d3a" filter="url(#rough2)">的价格，下标挂在出发房屋（较大者）上，</text>
  <text x="395" y="270" text-anchor="middle" font-size="10.5" fill="#8a6d3a" filter="url(#rough2)">别按 forward 的习惯把下标记反！</text>

  <text x="395" y="302" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">F[n]、B[n]：整圈总长（回绕时补上）</text>
  <text x="395" y="320" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">总时间 = 各段最小花费之和（段间无耦合）</text>
  <text x="395" y="338" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">整体复杂度 O(n + q)</text>

</svg>
