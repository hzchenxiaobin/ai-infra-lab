<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：n=10，逐步生成前 10 个丑数</text>
  <text x="280" y="42" text-anchor="middle" font-size="10" fill="#888">红色行 = 出现重复（多个指针同时推进）；加粗 = 三路候选中的最小值</text>

  <!-- ===== table frame ===== -->
  <rect x="36" y="54" width="488" height="228" fill="#fff" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>

  <!-- highlight rows: i=5 (row 5), i=8 (row 8), i=9 (row 9) -->
  <!-- row height = 22, header height = 24; rows start at y=78 -->
  <!-- row i: y = 78 + (i-1)*22 -->
  <rect x="37" y="78" width="486" height="22" fill="#fce4ec" opacity="0.5" filter="url(#rough2)"/>
  <rect x="37" y="78" width="486" height="0.1" fill="none"/>
  <!-- i=5: y=78+4*22=166 -->
  <rect x="37" y="166" width="486" height="22" fill="#fce4ec" opacity="0.6" filter="url(#rough2)"/>
  <!-- i=8: y=78+7*22=232 -->
  <rect x="37" y="232" width="486" height="22" fill="#fce4ec" opacity="0.6" filter="url(#rough2)"/>
  <!-- i=9: y=78+8*22=254 -->
  <rect x="37" y="254" width="486" height="22" fill="#fce4ec" opacity="0.6" filter="url(#rough2)"/>

  <!-- column dividers -->
  <line x1="76" y1="54" x2="76" y2="282" stroke="#eee" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="112" y1="54" x2="112" y2="282" stroke="#eee" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="148" y1="54" x2="148" y2="282" stroke="#eee" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="184" y1="54" x2="184" y2="282" stroke="#eee" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="244" y1="54" x2="244" y2="282" stroke="#eee" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="304" y1="54" x2="304" y2="282" stroke="#eee" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="364" y1="54" x2="364" y2="282" stroke="#eee" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="416" y1="54" x2="416" y2="282" stroke="#eee" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- header row separator -->
  <line x1="36" y1="78" x2="524" y2="78" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== header ===== -->
  <text x="56" y="71" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">i</text>
  <text x="94" y="71" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">p2</text>
  <text x="130" y="71" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">p3</text>
  <text x="166" y="71" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">p5</text>
  <text x="214" y="71" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">×2</text>
  <text x="274" y="71" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">×3</text>
  <text x="334" y="71" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">×5</text>
  <text x="390" y="71" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">next</text>
  <text x="470" y="71" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">推进</text>

  <!-- ===== data rows ===== -->
  <!-- Row i=1: p2=0 p3=0 p5=0 | 2 3 5 | 2 | p2 -->
  <g font-size="11">
    <text x="56" y="93" text-anchor="middle" fill="#666">1</text>
    <text x="94" y="93" text-anchor="middle" fill="#446688">0</text>
    <text x="130" y="93" text-anchor="middle" fill="#4a7a3a">0</text>
    <text x="166" y="93" text-anchor="middle" fill="#d6a040">0</text>
    <text x="214" y="93" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <text x="274" y="93" text-anchor="middle" fill="#4a7a3a">3</text>
    <text x="334" y="93" text-anchor="middle" fill="#d6a040">5</text>
    <text x="390" y="93" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <text x="470" y="93" text-anchor="middle" fill="#446688" font-weight="bold">p2</text>
  </g>

  <!-- Row i=2: p2=1 p3=0 p5=0 | 4 3 5 | 3 | p3 -->
  <g font-size="11">
    <text x="56" y="115" text-anchor="middle" fill="#666">2</text>
    <text x="94" y="115" text-anchor="middle" fill="#446688">1</text>
    <text x="130" y="115" text-anchor="middle" fill="#4a7a3a">0</text>
    <text x="166" y="115" text-anchor="middle" fill="#d6a040">0</text>
    <text x="214" y="115" text-anchor="middle" fill="#446688">4</text>
    <text x="274" y="115" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
    <text x="334" y="115" text-anchor="middle" fill="#d6a040">5</text>
    <text x="390" y="115" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
    <text x="470" y="115" text-anchor="middle" fill="#4a7a3a" font-weight="bold">p3</text>
  </g>

  <!-- Row i=3: p2=1 p3=1 p5=0 | 4 6 5 | 4 | p2 -->
  <g font-size="11">
    <text x="56" y="137" text-anchor="middle" fill="#666">3</text>
    <text x="94" y="137" text-anchor="middle" fill="#446688">1</text>
    <text x="130" y="137" text-anchor="middle" fill="#4a7a3a">1</text>
    <text x="166" y="137" text-anchor="middle" fill="#d6a040">0</text>
    <text x="214" y="137" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>
    <text x="274" y="137" text-anchor="middle" fill="#4a7a3a">6</text>
    <text x="334" y="137" text-anchor="middle" fill="#d6a040">5</text>
    <text x="390" y="137" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>
    <text x="470" y="137" text-anchor="middle" fill="#446688" font-weight="bold">p2</text>
  </g>

  <!-- Row i=4: p2=2 p3=1 p5=0 | 6 6 5 | 5 | p5 -->
  <g font-size="11">
    <text x="56" y="159" text-anchor="middle" fill="#666">4</text>
    <text x="94" y="159" text-anchor="middle" fill="#446688">2</text>
    <text x="130" y="159" text-anchor="middle" fill="#4a7a3a">1</text>
    <text x="166" y="159" text-anchor="middle" fill="#d6a040">0</text>
    <text x="214" y="159" text-anchor="middle" fill="#446688">6</text>
    <text x="274" y="159" text-anchor="middle" fill="#4a7a3a">6</text>
    <text x="334" y="159" text-anchor="middle" fill="#b85450" font-weight="bold">5</text>
    <text x="390" y="159" text-anchor="middle" fill="#b85450" font-weight="bold">5</text>
    <text x="470" y="159" text-anchor="middle" fill="#d6a040" font-weight="bold">p5</text>
  </g>

  <!-- Row i=5: p2=2 p3=1 p5=1 | 6 6 10 | 6 | p2,p3  HIGHLIGHT -->
  <g font-size="11">
    <text x="56" y="181" text-anchor="middle" fill="#666" font-weight="bold">5</text>
    <text x="94" y="181" text-anchor="middle" fill="#446688">2</text>
    <text x="130" y="181" text-anchor="middle" fill="#4a7a3a">1</text>
    <text x="166" y="181" text-anchor="middle" fill="#d6a040">1</text>
    <text x="214" y="181" text-anchor="middle" fill="#b85450" font-weight="bold">6</text>
    <text x="274" y="181" text-anchor="middle" fill="#b85450" font-weight="bold">6</text>
    <text x="334" y="181" text-anchor="middle" fill="#d6a040">10</text>
    <text x="390" y="181" text-anchor="middle" fill="#b85450" font-weight="bold">6</text>
    <text x="455" y="181" text-anchor="middle" fill="#446688" font-weight="bold">p2,</text>
    <text x="486" y="181" text-anchor="middle" fill="#4a7a3a" font-weight="bold">p3</text>
  </g>

  <!-- Row i=6: p2=3 p3=2 p5=1 | 8 9 10 | 8 | p2 -->
  <g font-size="11">
    <text x="56" y="203" text-anchor="middle" fill="#666">6</text>
    <text x="94" y="203" text-anchor="middle" fill="#446688">3</text>
    <text x="130" y="203" text-anchor="middle" fill="#4a7a3a">2</text>
    <text x="166" y="203" text-anchor="middle" fill="#d6a040">1</text>
    <text x="214" y="203" text-anchor="middle" fill="#b85450" font-weight="bold">8</text>
    <text x="274" y="203" text-anchor="middle" fill="#4a7a3a">9</text>
    <text x="334" y="203" text-anchor="middle" fill="#d6a040">10</text>
    <text x="390" y="203" text-anchor="middle" fill="#b85450" font-weight="bold">8</text>
    <text x="470" y="203" text-anchor="middle" fill="#446688" font-weight="bold">p2</text>
  </g>

  <!-- Row i=7: p2=4 p3=2 p5=1 | 10 9 10 | 9 | p3 -->
  <g font-size="11">
    <text x="56" y="225" text-anchor="middle" fill="#666">7</text>
    <text x="94" y="225" text-anchor="middle" fill="#446688">4</text>
    <text x="130" y="225" text-anchor="middle" fill="#4a7a3a">2</text>
    <text x="166" y="225" text-anchor="middle" fill="#d6a040">1</text>
    <text x="214" y="225" text-anchor="middle" fill="#446688">10</text>
    <text x="274" y="225" text-anchor="middle" fill="#b85450" font-weight="bold">9</text>
    <text x="334" y="225" text-anchor="middle" fill="#d6a040">10</text>
    <text x="390" y="225" text-anchor="middle" fill="#b85450" font-weight="bold">9</text>
    <text x="470" y="225" text-anchor="middle" fill="#4a7a3a" font-weight="bold">p3</text>
  </g>

  <!-- Row i=8: p2=4 p3=3 p5=1 | 10 12 10 | 10 | p2,p5  HIGHLIGHT -->
  <g font-size="11">
    <text x="56" y="247" text-anchor="middle" fill="#666" font-weight="bold">8</text>
    <text x="94" y="247" text-anchor="middle" fill="#446688">4</text>
    <text x="130" y="247" text-anchor="middle" fill="#4a7a3a">3</text>
    <text x="166" y="247" text-anchor="middle" fill="#d6a040">1</text>
    <text x="214" y="247" text-anchor="middle" fill="#b85450" font-weight="bold">10</text>
    <text x="274" y="247" text-anchor="middle" fill="#4a7a3a">12</text>
    <text x="334" y="247" text-anchor="middle" fill="#b85450" font-weight="bold">10</text>
    <text x="390" y="247" text-anchor="middle" fill="#b85450" font-weight="bold">10</text>
    <text x="455" y="247" text-anchor="middle" fill="#446688" font-weight="bold">p2,</text>
    <text x="486" y="247" text-anchor="middle" fill="#d6a040" font-weight="bold">p5</text>
  </g>

  <!-- Row i=9: p2=5 p3=3 p5=2 | 12 12 15 | 12 | p2,p3  HIGHLIGHT -->
  <g font-size="11">
    <text x="56" y="269" text-anchor="middle" fill="#666" font-weight="bold">9</text>
    <text x="94" y="269" text-anchor="middle" fill="#446688">5</text>
    <text x="130" y="269" text-anchor="middle" fill="#4a7a3a">3</text>
    <text x="166" y="269" text-anchor="middle" fill="#d6a040">2</text>
    <text x="214" y="269" text-anchor="middle" fill="#b85450" font-weight="bold">12</text>
    <text x="274" y="269" text-anchor="middle" fill="#b85450" font-weight="bold">12</text>
    <text x="334" y="269" text-anchor="middle" fill="#d6a040">15</text>
    <text x="390" y="269" text-anchor="middle" fill="#b85450" font-weight="bold">12</text>
    <text x="455" y="269" text-anchor="middle" fill="#446688" font-weight="bold">p2,</text>
    <text x="486" y="269" text-anchor="middle" fill="#4a7a3a" font-weight="bold">p3</text>
  </g>

  <!-- ===== result ===== -->
  <rect x="60" y="298" width="440" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="319" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">nums = [1, 2, 3, 4, 5, 6, 8, 9, 10, 12] → 答案 = 12</text>

  <text x="280" y="356" text-anchor="middle" font-size="10" fill="#888">第 5、8、9 步出现重复：6=3×2=2×3、10=5×2=2×5、12=6×2=4×3</text>
  <text x="280" y="372" text-anchor="middle" font-size="10" fill="#888">→ 用 if 而非 elif，让所有匹配指针同时前进，保证去重</text>
</svg>
