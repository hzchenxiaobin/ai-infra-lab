<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n=5, edges=[[0,1],[1,2],[3,4]]</text>

  <!-- table header -->
  <rect x="24" y="48" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="54" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">步骤</text>
  <rect x="84" y="48" width="84" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="126" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">边 (u,v)</text>
  <rect x="168" y="48" width="180" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="258" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">parent [0,1,2,3,4]</text>
  <rect x="348" y="48" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="378" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">count</text>
  <rect x="408" y="48" width="108" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="462" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">操作说明</text>

  <!-- row 0: init -->
  <rect x="24" y="74" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="54" y="94" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">init</text>
  <rect x="84" y="74" width="84" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="126" y="94" text-anchor="middle" font-size="12" fill="#888">—</text>
  <rect x="168" y="74" width="180" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="258" y="94" text-anchor="middle" font-size="12" fill="#333">[0, 1, 2, 3, 4]</text>
  <rect x="348" y="74" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="378" y="94" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="408" y="74" width="108" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="462" y="94" text-anchor="middle" font-size="11" fill="#666">各自为根</text>

  <!-- row 1: (0,1) -->
  <rect x="24" y="104" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="54" y="124" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">①</text>
  <rect x="84" y="104" width="84" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="126" y="124" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">(0,1)</text>
  <rect x="168" y="104" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="258" y="124" text-anchor="middle" font-size="12" fill="#333">[0, <tspan fill="#b85450" font-weight="bold">0</tspan>, 2, 3, 4]</text>
  <rect x="348" y="104" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="378" y="124" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="408" y="104" width="108" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="462" y="124" text-anchor="middle" font-size="10.5" fill="#4a7a3a">不同根→union</text>

  <!-- row 2: (1,2) -->
  <rect x="24" y="134" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="54" y="154" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">②</text>
  <rect x="84" y="134" width="84" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="126" y="154" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">(1,2)</text>
  <rect x="168" y="134" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="258" y="154" text-anchor="middle" font-size="12" fill="#333">[0, 0, <tspan fill="#b85450" font-weight="bold">0</tspan>, 3, 4]</text>
  <rect x="348" y="134" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="378" y="154" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="408" y="134" width="108" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="462" y="154" text-anchor="middle" font-size="10.5" fill="#4a7a3a">find(1)=0≠2→union</text>

  <!-- row 3: (3,4) -->
  <rect x="24" y="164" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="54" y="184" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">③</text>
  <rect x="84" y="164" width="84" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="126" y="184" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">(3,4)</text>
  <rect x="168" y="164" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="258" y="184" text-anchor="middle" font-size="12" fill="#333">[0, 0, 0, 3, <tspan fill="#b85450" font-weight="bold">3</tspan>]</text>
  <rect x="348" y="164" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="378" y="184" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="408" y="164" width="108" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="462" y="184" text-anchor="middle" font-size="10.5" fill="#4a7a3a">find(3)=3≠4→union</text>

  <!-- result -->
  <rect x="24" y="206" width="492" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="232" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">返回 count = 2 ⭐ 连通分量 {0,1,2} 与 {3,4}</text>

  <!-- graph viz -->
  <text x="270" y="268" text-anchor="middle" font-size="11.5" fill="#888">最终图：0—1—2 与 3—4 两条独立链，共 2 个分量</text>

  <!-- component 1 -->
  <circle cx="120" cy="320" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="325" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <circle cx="180" cy="320" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="325" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <circle cx="240" cy="320" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="325" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <line x1="136" y1="320" x2="164" y2="320" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <line x1="196" y1="320" x2="224" y2="320" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>

  <!-- component 2 -->
  <circle cx="340" cy="320" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="340" y="325" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <circle cx="400" cy="320" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="400" y="325" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <line x1="356" y1="320" x2="384" y2="320" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>

  <rect x="40" y="352" width="460" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="270" y="368" text-anchor="middle" font-size="10.5" fill="#444">每条成功 union 让 count−−；已同根的边不减（不会出现在本题输入中重复连）</text>
</svg>
