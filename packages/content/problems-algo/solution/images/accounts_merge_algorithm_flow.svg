<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">账户合并算法流程</text>

  <!-- step 1: build maps -->
  <rect x="160" y="44" width="240" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 建哈希映射</text>
  <text x="280" y="80" text-anchor="middle" font-size="10.5" fill="#666">emailToIndex[email]=idx</text>
  <text x="280" y="92" text-anchor="middle" font-size="10.5" fill="#666">emailToName[email]=name</text>
  <line x1="280" y1="94" x2="280" y2="114" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2: union within account -->
  <rect x="140" y="114" width="280" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="134" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 遍历每个账户，邮箱与第一个 union</text>
  <text x="280" y="150" text-anchor="middle" font-size="10.5" fill="#666">first = idx(acc[1])</text>
  <text x="280" y="164" text-anchor="middle" font-size="10.5" fill="#666">for i in 2..m: union(first, idx(acc[i]))</text>

  <!-- self loop back to step2 -->
  <path d="M 420 143 Q 470 143 470 130 Q 470 118 420 118" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="478" y="135" font-size="9.5" fill="#888">下一账户</text>
  <line x1="280" y1="172" x2="280" y2="192" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 3: group by root -->
  <rect x="140" y="192" width="280" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="212" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 按根分组</text>
  <text x="280" y="228" text-anchor="middle" font-size="10.5" fill="#666">for email in allEmails:</text>
  <text x="280" y="242" text-anchor="middle" font-size="10.5" fill="#666">  rootToEmails[find(idx)].append(email)</text>
  <line x1="280" y1="250" x2="280" y2="270" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 4: sort + name -->
  <rect x="140" y="270" width="280" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="290" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">④ 每组排序 + 拼姓名</text>
  <text x="280" y="306" text-anchor="middle" font-size="10.5" fill="#666">sort(emails)</text>
  <text x="280" y="320" text-anchor="middle" font-size="10.5" fill="#666">merged = [name] + emails</text>
  <line x1="280" y1="328" x2="280" y2="348" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- output -->
  <rect x="180" y="348" width="200" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="366" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回合并后的账户列表</text>
  <text x="280" y="380" text-anchor="middle" font-size="10" fill="#888">组间顺序任意</text>

  <!-- side note -->
  <rect x="430" y="200" width="120" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="490" y="220" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">为何与「第一个」union?</text>
  <text x="490" y="238" text-anchor="middle" font-size="9.5" fill="#666">靠传递性让整组</text>
  <text x="490" y="252" text-anchor="middle" font-size="9.5" fill="#666">同根，只需 m−1 次</text>
  <text x="490" y="266" text-anchor="middle" font-size="9.5" fill="#666">union，比两两</text>
  <text x="490" y="280" text-anchor="middle" font-size="9.5" fill="#666">O(m²) 更省</text>
</svg>
