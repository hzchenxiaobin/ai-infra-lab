<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="470" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：每只猪 = (T+1) 进制的一位，n 只猪区分 (T+1)ⁿ 种结局</text>

  <!-- ===== Row 1: 时间线 minutesToTest 切成 T 轮 ===== -->
  <text x="34" y="62" font-size="12" fill="#446688" font-weight="bold">时间线</text>
  <text x="92" y="62" font-size="11" fill="#666">minutesToTest 切成 T = minutesToTest / minutesToDie 轮</text>

  <!-- 时间线主体 -->
  <line x1="60" y1="92" x2="500" y2="92" stroke="#446688" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- 轮次格子 -->
  <g filter="url(#rough2)">
    <rect x="90"  y="80" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="180" y="80" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="270" y="80" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="360" y="80" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
  </g>
  <text x="130" y="97" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">轮 1</text>
  <text x="220" y="97" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">轮 2</text>
  <text x="310" y="97" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">轮 3</text>
  <text x="400" y="97" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">轮 T</text>
  <text x="468" y="84" font-size="14" fill="#bbb" font-weight="bold">···</text>
  <text x="130" y="118" text-anchor="middle" font-size="10" fill="#888">minutesToDie</text>
  <text x="310" y="118" text-anchor="middle" font-size="10" fill="#888">每轮冷却后观察死活</text>

  <!-- arrow down -->
  <path d="M 290 128 Q 290 138 290 148" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row 2: 一只猪的 T+1 种结局 ===== -->
  <text x="34" y="166" font-size="12" fill="#b85450" font-weight="bold">一只猪的结局</text>
  <text x="120" y="166" font-size="11" fill="#666">共 T+1 种可能</text>

  <g filter="url(#rough2)">
    <rect x="60"  y="178" width="72" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5"/>
    <rect x="140" y="178" width="72" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5"/>
    <rect x="220" y="178" width="72" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5"/>
    <rect x="320" y="178" width="96" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5"/>
  </g>
  <text x="96"  y="199" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">第1轮死</text>
  <text x="176" y="199" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">第2轮死</text>
  <text x="256" y="199" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">第T轮死</text>
  <text x="368" y="199" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">活下来</text>
  <text x="256" y="170" text-anchor="middle" font-size="10" fill="#888">······ T 种死法 ······</text>

  <rect x="440" y="178" width="120" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="500" y="200" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">T+1 种状态</text>

  <!-- arrow down -->
  <path d="M 290 226 Q 290 236 290 246" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row 3: n 只猪 → (T+1)^n 种结局 ===== -->
  <text x="34" y="264" font-size="12" fill="#446688" font-weight="bold">n 只猪</text>
  <text x="92" y="264" font-size="11" fill="#666">每只独立 T+1 种结局 → 乘起来</text>

  <g filter="url(#rough2)">
    <rect x="70"  y="278" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <rect x="150" y="278" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
    <rect x="230" y="278" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6"/>
  </g>
  <text x="100" y="303" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">猪1</text>
  <text x="180" y="303" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">猪2</text>
  <text x="260" y="303" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">猪n</text>
  <text x="200" y="293" text-anchor="middle" font-size="14" fill="#bbb" font-weight="bold">× ··· ×</text>

  <text x="316" y="304" font-size="18" fill="#888" font-weight="bold">=</text>

  <rect x="340" y="278" width="130" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="405" y="304" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">(T+1)ⁿ 种结局</text>

  <!-- arrow down -->
  <path d="M 290 332 Q 290 342 290 352" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row 4: 需求 (T+1)^n >= buckets ===== -->
  <rect x="60" y="358" width="460" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="380" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">需区分 buckets 个桶 → 每个桶对应一种独特结局</text>
  <text x="290" y="402" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">求最小 n 使 (T+1)ⁿ ≥ buckets</text>

  <text x="290" y="440" text-anchor="middle" font-size="11" fill="#888">即 n = ⌈ log(buckets) / log(T+1) ⌉，用迭代乘法避免浮点误差</text>
</svg>
