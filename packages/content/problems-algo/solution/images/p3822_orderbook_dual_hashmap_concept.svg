<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：正排哈希管定位，倒排哈希管聚合</text>
  <text x="260" y="38" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">每个写操作同时更新两张表 —— 这就是 hint「keep all data structures in sync」的落点</text>

  <!-- active order chips -->
  <rect x="52" y="54" width="112" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="108" y="74" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">订单1 buy@1</text>
  <rect x="174" y="54" width="112" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="74" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">订单2 buy@1</text>
  <rect x="296" y="54" width="112" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="352" y="74" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">订单3 sell@2</text>
  <text x="418" y="73" font-size="9" fill="#999" filter="url(#rough2)">← 示例前 3 步</text>

  <!-- arrows chips -> panels -->
  <path d="M 135 88 L 128 110" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="96" y="106" font-size="9" fill="#446688" filter="url(#rough2)">登记</text>
  <path d="M 352 88 L 386 110" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="394" y="103" font-size="9" fill="#4a7a3a" filter="url(#rough2)">入桶计数</text>

  <!-- forward table (left) -->
  <rect x="42" y="112" width="212" height="152" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="148" y="132" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">正排 orders（管定位）</text>
  <rect x="56" y="142" width="184" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="148" y="159" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1 → (buy, 1)</text>
  <rect x="56" y="172" width="184" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="148" y="189" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2 → (buy, 1)</text>
  <rect x="56" y="202" width="184" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="148" y="219" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3 → (sell, 2)</text>
  <text x="148" y="252" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">modify / cancel 在此 O(1) 定位</text>

  <!-- inverted table (right) -->
  <rect x="288" y="112" width="200" height="152" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="388" y="132" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">倒排 cnt（管聚合）</text>
  <rect x="300" y="142" width="176" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="388" y="159" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">(buy, 1) → 2</text>
  <rect x="300" y="172" width="176" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="388" y="189" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(sell, 2) → 1</text>
  <text x="388" y="252" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">查询在此 O(1) 直读</text>

  <!-- sync arrows between panels -->
  <path d="M 256 152 L 286 152" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 286 182 L 256 182" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="271" y="170" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">同步</text>

  <!-- modifyOrder demo (left bottom) -->
  <rect x="42" y="280" width="226" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="155" y="293" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">modifyOrder(1, 3)：正排 1 → (buy, 3)</text>
  <text x="155" y="306" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">旧桶 (buy,1) 2→1，新桶 (buy,3) 0→1</text>

  <!-- query result (right bottom) -->
  <path d="M 388 266 L 388 278" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="288" y="280" width="200" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="388" y="301" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">getOrdersAtPrice("buy",1) = 2</text>

  <!-- notes -->
  <rect x="28" y="324" width="464" height="50" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="44" y="342" font-size="10" fill="#333" filter="url(#rough2)">① 正排管写（orderId → 详情）、倒排管读（(类型,价格) → 计数），两端都是 O(1)</text>
  <text x="44" y="357" font-size="10" fill="#333" filter="url(#rough2)">② 桶键是 (类型, 价格) 二元组：buy@1 与 sell@1 是两个独立档位，别只用 price 当键</text>
  <text x="44" y="371" font-size="9" fill="#888" filter="url(#rough2)">③ 每次 add/modify/cancel 两表一起动；modify 成同价「先减后加」净零，计数天然对称</text>
</svg>
