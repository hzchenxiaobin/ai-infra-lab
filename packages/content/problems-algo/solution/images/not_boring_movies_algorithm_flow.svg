<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">
    SELECT 执行顺序 vs 书写顺序
  </text>

  <text x="120" y="68" text-anchor="middle" font-size="14" fill="#888" filter="url(#rough2)">书写顺序</text>
  <rect x="40" y="78" width="160" height="38" rx="6" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="102" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">① SELECT ...</text>

  <rect x="40" y="124" width="160" height="38" rx="6" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="148" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">② FROM cinema</text>

  <rect x="40" y="170" width="160" height="38" rx="6" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="194" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">③ WHERE ...</text>

  <rect x="40" y="216" width="160" height="38" rx="6" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="240" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">④ ORDER BY ...</text>

  <text x="440" y="68" text-anchor="middle" font-size="14" fill="#888" filter="url(#rough2)">实际执行顺序</text>
  <rect x="360" y="78" width="160" height="38" rx="6" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="440" y="102" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">① FROM cinema</text>

  <rect x="360" y="124" width="160" height="38" rx="6" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="440" y="148" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">② WHERE 过滤</text>

  <rect x="360" y="170" width="160" height="38" rx="6" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="440" y="194" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">③ ORDER BY 排序</text>

  <rect x="360" y="216" width="160" height="38" rx="6" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="440" y="240" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">④ SELECT 投影</text>

  <path d="M 200 97 Q 280 97 360 97" fill="none" stroke="#446688"
        stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 200 143 Q 280 130 360 143" fill="none" stroke="#446688"
        stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 200 189 Q 280 170 360 189" fill="none" stroke="#446688"
        stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 200 235 Q 280 235 360 235" fill="none" stroke="#446688"
        stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="288" width="440" height="86" rx="10" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">本题 SQL 骨架</text>
  <text x="280" y="336" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">SELECT id, movie, description, rating</text>
  <text x="280" y="356" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">FROM cinema</text>
  <text x="280" y="376" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">WHERE description != 'boring' AND id % 2 = 1   ORDER BY rating DESC</text>
</svg>
