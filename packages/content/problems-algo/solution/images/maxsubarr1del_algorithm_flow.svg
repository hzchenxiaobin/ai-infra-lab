<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">删除一次得最大子数组和：算法流程</text>

  <!-- Step 1: Init -->
  <rect x="150" y="44" width="220" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 初始化</text>
  <text x="260" y="84" text-anchor="middle" font-size="11" fill="#555">dp0 = arr[0], dp1 = −∞, ans = arr[0]</text>

  <!-- Arrow down -->
  <path d="M 260 94 L 260 108" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- Step 2: Loop -->
  <path d="M 260 112 L 360 152 L 260 192 L 160 152 Z" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i &lt; n ?</text>
  <text x="260" y="168" text-anchor="middle" font-size="11" fill="#555">遍历每个元素</text>

  <!-- Yes branch: down -->
  <path d="M 260 192 L 260 206" stroke="#82b366" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="272" y="204" font-size="11" fill="#82b366">是</text>

  <!-- Step 3: compute dp0 -->
  <rect x="40" y="210" width="210" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="145" y="230" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">② dp0 = max(arr[i], dp0 + arr[i])</text>
  <text x="145" y="248" text-anchor="middle" font-size="10" fill="#555">不删：续接或重启</text>

  <!-- Step 4: compute dp1 -->
  <rect x="270" y="210" width="210" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="375" y="230" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">③ dp1 = max(dp0_old, dp1+arr[i])</text>
  <text x="375" y="248" text-anchor="middle" font-size="10" fill="#555">删当前 / 已删后续接</text>

  <!-- Arrow to update ans -->
  <path d="M 145 260 L 145 274 L 260 282" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <path d="M 375 260 L 375 274 L 260 282" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- Step 5: update ans -->
  <rect x="120" y="284" width="280" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="302" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">④ ans = max(ans, dp0, dp1)</text>
  <text x="260" y="318" text-anchor="middle" font-size="10" fill="#555">dp0_old = dp0（为下一步保留旧值）</text>

  <!-- Loop back -->
  <path d="M 400 306 Q 460 152 360 152" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="452" y="230" font-size="10" fill="#888">i++</text>

  <!-- No branch: exit right -->
  <path d="M 360 152 L 430 152" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="392" y="144" font-size="11" fill="#b85450">否</text>

  <rect x="360" y="134" width="120" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="420" y="158" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 ans</text>

  <!-- Summary -->
  <rect x="30" y="356" width="460" height="32" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="260" y="376" text-anchor="middle" font-size="11" fill="#888">一次遍历，滚动两个变量 dp0/dp1，O(n) 时间 O(1) 空间</text>
</svg>
