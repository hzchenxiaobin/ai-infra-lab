<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">核心观察：后缀关系决定「免费复用」</text>

  <!-- three words -->
  <text x="40" y="66" font-size="11" fill="#888">待编码单词：</text>

  <rect x="40" y="74" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="70" y="96" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">time</text>

  <rect x="120" y="74" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="142" y="96" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">me</text>

  <rect x="184" y="74" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="212" y="96" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">bell</text>

  <!-- suffix note -->
  <path d="M 142 110 Q 142 130 110 130 Q 80 130 78 108" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="128" font-size="10.5" fill="#b85450" font-weight="bold">是 "time" 的后缀</text>
  <text x="150" y="142" font-size="10" fill="#b85450">→ 复用同一段，无需单独存储</text>

  <!-- right note box -->
  <rect x="300" y="74" width="230" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="415" y="96" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">「后缀」可被「前缀更长者」覆盖</text>
  <text x="415" y="114" text-anchor="middle" font-size="10" fill="#555">若 word A 是 word B 的后缀</text>
  <text x="415" y="128" text-anchor="middle" font-size="10" fill="#555">则 A 的索引可指向 B 的中段</text>
  <text x="415" y="142" text-anchor="middle" font-size="10" fill="#b85450">A 不贡献额外长度</text>

  <!-- encoding string -->
  <text x="40" y="178" font-size="11" fill="#888">最短编码串 s =</text>

  <g filter="url(#rough2)">
    <rect x="40" y="186" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
  </g>
  <text x="48" y="212" font-size="18" fill="#333" font-family="'Comic Sans MS', monospace">time#bell#</text>

  <!-- index ticks -->
  <text x="48" y="244" font-size="9" fill="#4a7a3a">0</text>
  <text x="96" y="244" font-size="9" fill="#4a7a3a">4</text>
  <text x="128" y="244" font-size="9" fill="#4a7a3a">5</text>
  <text x="176" y="244" font-size="9" fill="#4a7a3a">9</text>

  <!-- index labels -->
  <rect x="40" y="254" width="110" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="95" y="272" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">indices = [0, 2, 5]</text>
  <text x="95" y="288" text-anchor="middle" font-size="9.5" fill="#555">time→0, me→2, bell→5</text>
  <text x="95" y="302" text-anchor="middle" font-size="9.5" fill="#b85450">me 复用 time 的第 2 位起</text>

  <!-- length breakdown -->
  <rect x="180" y="254" width="340" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="350" y="272" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">答案 = Σ(未被覆盖单词长度 + 1)</text>
  <text x="350" y="290" text-anchor="middle" font-size="10.5" fill="#555">time: 4+1=5 ， bell: 4+1=5 ， me: 被覆盖=0</text>
  <text x="350" y="305" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">总长 = 5 + 5 = 10</text>

  <!-- bottom takeaway -->
  <rect x="40" y="324" width="480" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="346" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">「是某更长单词的后缀」 ⇔ 「可被免费复用」</text>
  <text x="280" y="364" text-anchor="middle" font-size="10.5" fill="#555">问题转化：找出所有「不是任何其它单词后缀」的单词</text>
  <text x="280" y="378" text-anchor="middle" font-size="10.5" fill="#4a7a3a">每个这样的词贡献 len+1（+1 给分隔符 #）</text>
</svg>
