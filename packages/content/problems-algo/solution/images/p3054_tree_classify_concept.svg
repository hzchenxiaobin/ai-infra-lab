<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">一张表拍平一棵树：P 列就是「全部父亲」的集合</text>

  <rect x="42" y="56" width="110" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="69" y="71" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">N</text>
  <text x="124" y="71" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">P</text>

  <rect x="42" y="78" width="55" height="21" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="97" y="78" width="55" height="21" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="69" y="93" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="124" y="93" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>

  <rect x="42" y="99" width="55" height="21" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="97" y="99" width="55" height="21" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="69" y="114" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="124" y="114" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>

  <rect x="42" y="120" width="55" height="21" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="97" y="120" width="55" height="21" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="69" y="135" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <text x="124" y="135" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>

  <rect x="42" y="141" width="55" height="21" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="97" y="141" width="55" height="21" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="69" y="156" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">9</text>
  <text x="124" y="156" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>

  <rect x="42" y="162" width="55" height="21" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="97" y="162" width="55" height="21" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="69" y="177" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="124" y="177" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>

  <rect x="42" y="183" width="55" height="21" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="97" y="183" width="55" height="21" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="69" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>
  <text x="124" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>

  <rect x="42" y="204" width="55" height="21" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="97" y="204" width="55" height="21" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="69" y="219" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="124" y="219" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">null</text>

  <path d="M 158 145 L 205 145" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="181" y="136" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">同一棵树</text>

  <path d="M 330 103 L 274 145" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 330 103 L 386 145" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 268 172 L 236 222" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 268 172 L 300 222" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 392 172 L 360 222" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 392 172 L 424 222" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>

  <ellipse cx="330" cy="88" rx="17" ry="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="330" y="93" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="330" y="58" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">Root（P 为 null）</text>

  <ellipse cx="268" cy="158" rx="17" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="268" y="163" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <ellipse cx="392" cy="158" rx="17" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="392" y="163" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="330" y="132" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">Inner（有爹有娃）</text>

  <ellipse cx="232" cy="238" rx="17" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="232" y="243" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <ellipse cx="304" cy="238" rx="17" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="304" y="243" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <ellipse cx="360" cy="238" rx="17" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="360" y="243" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>
  <ellipse cx="432" cy="238" rx="17" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="432" y="243" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="330" y="278" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">Leaf（有爹没娃：N 从不出现在 P 列）</text>

  <rect x="36" y="310" width="150" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="111" y="331" text-anchor="middle" font-size="11" fill="#8a6d1a" filter="url(#rough2)">Root：P IS NULL</text>

  <rect x="205" y="310" width="150" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="331" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">Inner：有爹 + 有娃</text>

  <rect x="374" y="310" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="449" y="331" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">Leaf：有爹 + 没娃</text>

  <text x="280" y="368" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">判定只需局部信息：自己有没有爹、N 是否出现在 P 列 —— 与树的深度无关</text>
</svg>
