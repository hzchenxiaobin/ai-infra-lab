<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="520" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：root=[3,0,4,null,2,null,null,1]，low=1，high=3</text>

  <!-- ===== 原始树 ===== -->
  <text x="160" y="56" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">原始 BST</text>
  <!-- 3 -->
  <circle cx="160" cy="84" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="89" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
  <!-- 0 -->
  <circle cx="120" cy="130" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="134" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <line x1="148" y1="96" x2="128" y2="118" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <!-- 4 -->
  <circle cx="200" cy="130" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="134" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">4</text>
  <line x1="172" y1="96" x2="192" y2="118" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <!-- 2 -->
  <circle cx="150" cy="178" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="150" y="182" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <line x1="132" y1="142" x2="142" y2="166" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <!-- 1 -->
  <circle cx="128" cy="226" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="128" y="230" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <line x1="140" y1="190" x2="130" y2="214" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>

  <!-- 区间标注 -->
  <rect x="60" y="258" width="200" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="160" y="272" text-anchor="middle" font-size="10" fill="#4a7a3a">保留区间 [1, 3]</text>

  <!-- 递归箭头 -->
  <path d="M 280 160 L 330 160" stroke="#666" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="305" y="154" text-anchor="middle" font-size="10" fill="#666">trim</text>

  <!-- ===== 步骤表 ===== -->
  <text x="470" y="56" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">递归调用栈（自顶向下）</text>

  <!-- 步骤行 -->
  <rect x="340" y="70" width="260" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="350" y="89" text-anchor="start" font-size="10" fill="#555" font-weight="bold">①trim(3)</text>
  <text x="430" y="89" text-anchor="start" font-size="10" fill="#4a7a3a">1≤3≤3 保留</text>

  <rect x="340" y="106" width="260" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="350" y="125" text-anchor="start" font-size="10" fill="#555" font-weight="bold">②trim(0)</text>
  <text x="430" y="125" text-anchor="start" font-size="10" fill="#b85450">0&lt;1 丢，return trim(右=2)</text>

  <rect x="340" y="142" width="260" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="350" y="161" text-anchor="start" font-size="10" fill="#555" font-weight="bold">③trim(2)</text>
  <text x="430" y="161" text-anchor="start" font-size="10" fill="#4a7a3a">1≤2≤3 保留</text>

  <rect x="340" y="178" width="260" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="350" y="197" text-anchor="start" font-size="10" fill="#555" font-weight="bold">④trim(1)</text>
  <text x="430" y="197" text-anchor="start" font-size="10" fill="#4a7a3a">1≤1≤3 保留，叶</text>

  <rect x="340" y="214" width="260" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="350" y="233" text-anchor="start" font-size="10" fill="#555" font-weight="bold">⑤trim(4)</text>
  <text x="430" y="233" text-anchor="start" font-size="10" fill="#b85450">4&gt;3 丢，return trim(左=null)</text>

  <!-- 回溯说明 -->
  <rect x="340" y="258" width="260" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
  <text x="350" y="274" text-anchor="start" font-size="9" fill="#555">回溯：④返1 → ③的left=1</text>
  <text x="350" y="288" text-anchor="start" font-size="9" fill="#555">③返2 → ②返2 → ①的left=2</text>
  <text x="350" y="302" text-anchor="start" font-size="9" fill="#555">⑤返null → ①的right=null</text>

  <!-- 分隔线 -->
  <line x1="40" y1="300" x2="580" y2="300" stroke="#bbb" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- ===== 结果树 ===== -->
  <text x="160" y="332" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">修剪后 BST = [3,2,null,1]</text>
  <!-- 3 -->
  <circle cx="160" cy="368" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="160" y="373" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <!-- 2 -->
  <circle cx="130" cy="420" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="130" y="425" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <line x1="150" y1="382" x2="136" y2="408" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <!-- 1 -->
  <circle cx="108" cy="470" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="108" y="474" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <line x1="122" y1="432" x2="112" y2="460" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 结果说明 -->
  <rect x="300" y="340" width="280" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="312" y="358" text-anchor="start" font-size="10" fill="#555" font-weight="bold">关键观察：</text>
  <text x="312" y="374" text-anchor="start" font-size="9" fill="#555">• 节点 0 被删，但它的右子树（2）被</text>
  <text x="312" y="386" text-anchor="start" font-size="9" fill="#555">  递归修剪后"顶替"了 0 的位置</text>
  <text x="312" y="400" text-anchor="start" font-size="9" fill="#555">• 节点 4 越界，整子树丢弃</text>
  <text x="312" y="412" text-anchor="start" font-size="9" fill="#555">• 2 与 1 的父子关系原样保留</text>

  <!-- 底部 -->
  <rect x="40" y="436" width="540" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="310" y="454" text-anchor="middle" font-size="10" fill="#555">BST 有序性是关键：删 0 时其左子树全 &lt; 0 &lt; low，可整片丢；只需递归右子树</text>
</svg>
