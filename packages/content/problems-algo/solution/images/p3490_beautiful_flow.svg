<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 436"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="436" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">f(x) = A + B：含 0 与无 0 分兵两路</text>

  <!-- 顶部：前缀相减 -->
  <rect x="170" y="34" width="180" height="26" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="51" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">ans = f(r) − f(l−1)</text>

  <path d="M 235 60 C 200 76, 165 86, 140 100" fill="none" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arro)" filter="url(#rough2)"/>
  <path d="M 285 60 C 320 76, 355 86, 380 100" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- ===== 左列：A 轨 ===== -->
  <rect x="24" y="104" width="226" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="137" y="123" text-anchor="middle" font-size="12" fill="#8a6d3a" font-weight="bold" filter="url(#rough2)">A：含数位 0 → 积为 0 → 必美丽</text>

  <path d="M 137 134 L 137 148" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arro)" filter="url(#rough2)"/>

  <rect x="24" y="150" width="226" height="72" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="137" y="168" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">zeroFree(x)：无 0 数计数</text>
  <text x="137" y="186" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">位数 L &lt; n：Σ 9^L</text>
  <text x="137" y="202" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">第 i 位取更小的 c：</text>
  <text x="137" y="216" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(c−1)·9^(n−1−i)，撞 0 断裂</text>

  <path d="M 137 222 L 137 236" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arro)" filter="url(#rough2)"/>

  <rect x="24" y="238" width="226" height="28" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="137" y="256" text-anchor="middle" font-size="12" fill="#8a6d3a" font-weight="bold" filter="url(#rough2)">A = x − zeroFree(x)</text>

  <!-- ===== 右列：B 轨 ===== -->
  <rect x="270" y="104" width="226" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="383" y="123" text-anchor="middle" font-size="12" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">B：无 0 美丽数（数位 1~9）</text>

  <path d="M 383 134 L 383 148" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <rect x="270" y="150" width="226" height="56" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="383" y="168" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">B2：沿 x 走 tight 前缀</text>
  <text x="383" y="186" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">第 i 位枚举更小的 c：</text>
  <text x="383" y="200" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">累加 free(n−1−i, s+c, p·c)</text>

  <path d="M 383 206 L 383 220" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <rect x="270" y="222" width="226" height="44" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="383" y="240" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">B1：位数不足 n：Σ_c free(L−1, c, c)</text>
  <text x="383" y="258" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">x 自身无 0：p % s == 0 ? +1</text>

  <!-- ===== 汇合 ===== -->
  <path d="M 137 266 C 137 282, 170 286, 196 290" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 383 266 C 383 282, 350 286, 324 290" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="290" width="180" height="28" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="308" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">f(x) = A + B</text>

  <!-- B2 调用 free -->
  <path d="M 494 190 C 512 240, 508 300, 466 336" fill="none" stroke="#999" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="470" y="262" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">调用</text>

  <!-- ===== free 递归面板 ===== -->
  <rect x="40" y="336" width="440" height="88" rx="10" fill="#ffffff" stroke="#999" stroke-width="1.2" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="260" y="356" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">free(rem, s, p)：剩 rem 位自由填 1~9（记忆化，与 x 无关）</text>

  <polygon points="120,364 158,382 120,400 82,382" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="386" text-anchor="middle" font-size="10.5" fill="#8a6d3a" filter="url(#rough2)">rem==0?</text>

  <path d="M 158 382 L 174 382" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="166" y="375" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="178" y="368" width="130" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="243" y="386" text-anchor="middle" font-size="10.5" fill="#2a5a2a" filter="url(#rough2)">p % s == 0 ? 1 : 0</text>

  <path d="M 120 400 C 150 418, 280 420, 324 406" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="152" y="417" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">否</text>

  <rect x="326" y="394" width="150" height="24" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="401" y="410" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">Σ c=1..9 free(rem−1, s+c, p·c)</text>
</svg>
