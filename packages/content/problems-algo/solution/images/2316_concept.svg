<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">连通分量分块：跨分量的点对即无法到达</text>

  <!-- Component A: {0,2,4,5} size 4 -->
  <ellipse cx="110" cy="120" rx="78" ry="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="110" y="78" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">分量 A (s=4)</text>
  <circle cx="78" cy="108" r="13" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="78" y="112" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <circle cx="118" cy="98" r="13" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="118" y="102" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <circle cx="142" cy="130" r="13" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="142" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <circle cx="92" cy="140" r="13" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="92" y="144" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <line x1="91" y1="108" x2="105" y2="102" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="89" y1="131" x2="105" y2="117" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="105" y1="111" x2="131" y2="123" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="131" y1="124" x2="103" y2="136" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- Component B: {1,6} size 2 -->
  <ellipse cx="290" cy="120" rx="52" ry="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="290" y="86" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">分量 B (s=2)</text>
  <circle cx="268" cy="120" r="13" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="268" y="124" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="312" cy="120" r="13" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="312" y="124" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <line x1="281" y1="120" x2="299" y2="120" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- Component C: {3} size 1 -->
  <ellipse cx="410" cy="120" rx="34" ry="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="410" y="92" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">分量 C (s=1)</text>
  <circle cx="410" cy="120" r="13" fill="#fff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="410" y="124" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>

  <!-- Dashed lines between components: unreachable pairs -->
  <path d="M188,120 L238,120" stroke="#b85450" stroke-width="2" stroke-dasharray="5,4" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <path d="M342,120 L376,120" stroke="#b85450" stroke-width="2" stroke-dasharray="5,4" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="213" y="112" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">不可达</text>
  <text x="359" y="112" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">不可达</text>

  <!-- Formula box -->
  <rect x="70" y="190" width="400" height="60" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="214" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">跨分量无序点对数</text>
  <text x="270" y="236" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">ans = Σᵢ sᵢ · (Σⱼ&lt;ᵢ sⱼ)  =  (n² − Σ sᵢ²) / 2</text>

  <!-- Prefix accumulation illustration -->
  <text x="40" y="284" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">前缀累加：</text>
  <rect x="120" y="272" width="60" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="290" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">s=4, seen=0</text>
  <text x="190" y="290" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">→</text>
  <rect x="210" y="272" width="60" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240" y="290" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">s=2, seen=4</text>
  <text x="280" y="290" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">→</text>
  <rect x="300" y="272" width="60" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="290" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">s=1, seen=6</text>

  <text x="120" y="332" font-size="12" fill="#b85450" filter="url(#rough2)">贡献 = 4×0 + 2×4 + 1×6 = 0 + 8 + 6 = 14</text>
  <text x="120" y="354" font-size="11" fill="#666" filter="url(#rough2)">每来一个分量 s，它与之前所有分量两两配对贡献 s × seen</text>
</svg>
