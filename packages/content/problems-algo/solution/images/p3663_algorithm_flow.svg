<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：拆位计数 → 升序扫描取最小</text>

  <!-- 输入 -->
  <rect x="70" y="40" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="130" y="60" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">输入 n</text>
  <path d="M 130 70 L 130 88" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="45" y="92" width="170" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="130" y="112" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">cnt[10]=0, best=-1, d=0</text>
  <path d="M 130 122 L 130 136" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环①：拆位入桶 -->
  <polygon points="130,140 178,168 130,196 82,168" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="130" y="173" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">n &gt; 0 ?</text>

  <path d="M 178 168 L 214 168" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="196" y="160" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="218" y="148" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="308" y="166" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">d = n % 10；cnt[d]++</text>
  <text x="308" y="182" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">n /= 10</text>

  <path d="M 308 148 C 308 122, 130 122, 130 138" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="225" y="128" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">位拆完（n=0）退出循环①</text>

  <!-- 进入循环② -->
  <path d="M 130 196 L 130 232" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="142" y="218" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- 循环②：升序扫描 -->
  <polygon points="130,236 182,266 130,296 78,266" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="130" y="271" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">d &lt; 10 ?</text>

  <path d="M 182 266 L 216 266" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="198" y="258" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="220" y="238" width="206" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="323" y="256" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">cnt[d] &gt; 0 且 cnt[d] &lt; cnt[best]</text>
  <text x="323" y="272" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">⇒ best = d</text>
  <text x="323" y="288" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">（首次 best==-1 时放行；随后 d++）</text>

  <path d="M 323 238 C 323 210, 175 210, 154 235" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="250" y="220" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">扫完 d = 0..9 退出循环②</text>

  <!-- 返回 -->
  <path d="M 130 296 L 130 314" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="142" y="308" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="64" y="318" width="132" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="130" y="339" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 best</text>
  <text x="280" y="339" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">n ≥ 1 ⇒ best 必非 -1</text>

  <!-- 侧注 -->
  <text x="460" y="60" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">两阶段：</text>
  <text x="460" y="78" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">① 拆位入桶 O(位数)</text>
  <text x="460" y="96" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">② 升序扫描 O(10)</text>
  <text x="460" y="176" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">升序 + 严格小于</text>
  <text x="460" y="194" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">⇒ 平局自动取最小</text>
  <text x="460" y="316" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">cnt[d]=0 未出现跳过</text>

  <text x="16" y="352" font-size="10" fill="#999" filter="url(#rough2)">注：可用 minFreq = 11 代替 best == -1 特判</text>
  <text x="430" y="352" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">时间 O(log n)，空间 O(1)</text>
</svg>
