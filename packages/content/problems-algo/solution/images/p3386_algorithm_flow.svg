<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：一次遍历打擂台，O(n) 收工</text>

  <!-- 左侧：平局示例 -->
  <rect x="12" y="92" width="150" height="134" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="87" y="112" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">平局 → 取 index 最小</text>
  <text x="87" y="132" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">events =</text>
  <text x="87" y="148" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[[5,1],[2,3],[5,5]]</text>
  <text x="87" y="166" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">d = 1, 2, 2</text>
  <text x="87" y="184" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">最大 2：按钮 2、5 并列</text>
  <text x="87" y="208" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">→ 返回 2</text>

  <!-- 左下：警告 -->
  <rect x="12" y="244" width="150" height="106" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="87" y="264" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠️ 别写 d &gt;= best_time</text>
  <text x="87" y="284" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">平局会被「后按下」</text>
  <text x="87" y="300" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">的按钮顶掉擂主，</text>
  <text x="87" y="316" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">违反「取最小 index」</text>

  <!-- 主流程：初始化 -->
  <rect x="170" y="42" width="180" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">best = (idx, t) ← 首个事件</text>
  <text x="365" y="58" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">首次按下：d = 时间戳</text>
  <path d="M 260 74 L 260 88" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 遍历 -->
  <rect x="170" y="92" width="180" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="112" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">遍历 i = 1 … n−1</text>
  <path d="M 260 124 L 260 138" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 计算 d -->
  <rect x="170" y="142" width="180" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="260" y="162" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">d = t[i] − t[i−1]</text>
  <path d="M 260 174 L 260 188" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="260,192 348,230 260,268 172,230" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="226" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">d &gt; best_time 或</text>
  <text x="260" y="242" text-anchor="middle" font-size="10" fill="#8a6d1f" filter="url(#rough2)">平局且 idx 更小？</text>

  <!-- 是 分支 -->
  <text x="270" y="284" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 260 268 L 260 290" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170" y="294" width="180" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="314" text-anchor="middle" font-size="10.5" fill="#8a3833" font-weight="bold" filter="url(#rough2)">best = (idx, d) 换擂主</text>

  <!-- 否 分支 -->
  <text x="354" y="222" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 348 230 L 452 230" fill="none" stroke="#a07830" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 回环 -->
  <path d="M 350 310 L 452 310" fill="none" stroke="#a07830" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 452 310 L 452 84 L 272 84 L 272 90" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="98" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">取下一个 i（循环）</text>

  <!-- 出口 -->
  <path d="M 260 326 L 260 348" fill="none" stroke="#a07830" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="344" font-size="8.5" fill="#777" filter="url(#rough2)">遍历结束</text>
  <rect x="170" y="352" width="180" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="368" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 best_idx</text>
</svg>
