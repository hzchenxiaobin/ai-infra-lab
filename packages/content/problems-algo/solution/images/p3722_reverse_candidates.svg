<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#b85450" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="16" fill="#333"
        filter="url(#rough2)">一次操作的全部可能：两类反转 × k = 1…n</text>

  <!-- ① 前缀反转 -->
  <text x="26" y="58" font-size="12.5" fill="#446688" font-weight="bold"
        filter="url(#rough2)">① 反转前 k 个：P(k) = rev(前 k 个) + 其余照抄</text>

  <path d="M 68 64 Q 128 34 188 64" stroke="#b85450" stroke-width="1.6" fill="none"
        marker-start="url(#arrRed)" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="128" y="30" text-anchor="middle" font-size="11" fill="#b85450"
        filter="url(#rough2)">k = 3</text>

  <rect x="60" y="76" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="104" y="76" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="148" y="76" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="192" y="76" width="40" height="34" fill="#ffffff" stroke="#999999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="80" y="98">d</text>
    <text x="124" y="98">c</text>
    <text x="168" y="98">a</text>
    <text x="212" y="98">b</text>
  </g>

  <path d="M 240 93 L 268 93" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="286" y="76" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="330" y="76" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="374" y="76" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="418" y="76" width="40" height="34" fill="#ffffff" stroke="#999999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="306" y="98">a</text>
    <text x="350" y="98">c</text>
    <text x="394" y="98">d</text>
    <text x="438" y="98">b</text>
  </g>

  <text x="60" y="134" font-size="11" fill="#4a7a3a"
        filter="url(#rough2)">rev("dca") = "acd"，拼上 "b" ⇒ "acdb"（示例 1 的答案）</text>

  <!-- ② 后缀反转 -->
  <text x="26" y="178" font-size="12.5" fill="#d6a040" font-weight="bold"
        filter="url(#rough2)">② 反转后 k 个：Q(k) = 前面照抄 + rev(后 k 个)</text>

  <path d="M 112 184 Q 168 154 224 184" stroke="#b85450" stroke-width="1.6" fill="none"
        marker-start="url(#arrRed)" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="168" y="150" text-anchor="middle" font-size="11" fill="#b85450"
        filter="url(#rough2)">k = 3</text>

  <rect x="60" y="196" width="40" height="34" fill="#ffffff" stroke="#999999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="104" y="196" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="148" y="196" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="192" y="196" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="80" y="218">d</text>
    <text x="124" y="218">c</text>
    <text x="168" y="218">a</text>
    <text x="212" y="218">b</text>
  </g>

  <path d="M 240 213 L 268 213" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="286" y="196" width="40" height="34" fill="#ffffff" stroke="#999999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="330" y="196" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="374" y="196" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="418" y="196" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="14" fill="#333" text-anchor="middle">
    <text x="306" y="218">d</text>
    <text x="350" y="218">b</text>
    <text x="394" y="218">a</text>
    <text x="438" y="218">c</text>
  </g>

  <text x="60" y="254" font-size="11" fill="#d6a040"
        filter="url(#rough2)">前面照抄 "d"，rev("cab") = "bac" ⇒ "dbac"</text>

  <!-- 底部总结 -->
  <rect x="40" y="284" width="440" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="306" text-anchor="middle" font-size="11.5" fill="#4a7a3a"
        filter="url(#rough2)">k = 1…n，两类各 n 个候选：k = 1 时都是原串 s，k = n 时都是 rev(s)</text>
  <text x="260" y="328" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold"
        filter="url(#rough2)">全部构造出来，取字典序最小 ⇒ O(n²) 枚举，n ≤ 1000 稳过</text>
</svg>
