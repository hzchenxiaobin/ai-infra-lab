<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="4" refY="8" orient="auto">
      <path d="M0,0 L4,8 L8,0 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">删除优先级：按 L % 3 分类</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#666">目标：用尽可能少的删除，把 ⌊L/3⌋ 替换数减 1</text>

  <rect x="20" y="60" width="170" height="280" fill="#e6f4ea" fill-opacity="0.5" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="105" y="84" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">L % 3 == 0</text>
  <text x="105" y="100" text-anchor="middle" font-size="10.5" fill="#666">最优：1 删 = 1 减</text>

  <g filter="url(#rough)">
    <rect x="36" y="118" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="56" y="118" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="76" y="118" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="96" y="118" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="116" y="118" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="136" y="118" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="96" y="152" text-anchor="middle" font-size="10" fill="#555">L=6, ⌊6/3⌋=2</text>

  <rect x="76" y="118" width="20" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 86 148 L 86 168" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <g filter="url(#rough)">
    <rect x="46" y="178" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="66" y="178" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="86" y="178" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="106" y="178" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="126" y="178" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="96" y="212" text-anchor="middle" font-size="10" fill="#555">L=5, ⌊5/3⌋=1</text>
  <text x="96" y="228" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">替换减 1 ✓</text>

  <rect x="36" y="244" width="138" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough)"/>
  <text x="105" y="262" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">代价：1 删 / 1 减</text>
  <text x="105" y="278" text-anchor="middle" font-size="10" fill="#666">优先级 ★★★</text>
  <text x="105" y="318" text-anchor="middle" font-size="10" fill="#4a7a3a">用 one 计数</text>

  <rect x="195" y="60" width="170" height="280" fill="#fff8e1" fill-opacity="0.6" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="84" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">L % 3 == 1</text>
  <text x="280" y="100" text-anchor="middle" font-size="10.5" fill="#666">次优：2 删 = 1 减</text>

  <g filter="url(#rough)">
    <rect x="216" y="118" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="236" y="118" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="256" y="118" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="276" y="118" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="296" y="118" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="316" y="118" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="336" y="118" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="286" y="152" text-anchor="middle" font-size="10" fill="#555">L=7, ⌊7/3⌋=2</text>

  <rect x="216" y="118" width="20" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="336" y="118" width="20" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 286 148 L 286 168" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <g filter="url(#rough)">
    <rect x="226" y="178" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="246" y="178" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="266" y="178" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="286" y="178" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="306" y="178" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="286" y="212" text-anchor="middle" font-size="10" fill="#555">L=5, ⌊5/3⌋=1</text>
  <text x="286" y="228" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">替换减 1 ✓</text>

  <rect x="211" y="244" width="138" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough)"/>
  <text x="280" y="262" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">代价：2 删 / 1 减</text>
  <text x="280" y="278" text-anchor="middle" font-size="10" fill="#666">优先级 ★★</text>
  <text x="280" y="318" text-anchor="middle" font-size="10" fill="#d6a040">用 two 计数</text>

  <rect x="370" y="60" width="170" height="280" fill="#fce4ec" fill-opacity="0.5" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="455" y="84" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">L % 3 == 2</text>
  <text x="455" y="100" text-anchor="middle" font-size="10.5" fill="#666">最差：3 删 = 1 减</text>

  <g filter="url(#rough)">
    <rect x="391" y="118" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="411" y="118" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="431" y="118" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="451" y="118" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="471" y="118" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="491" y="118" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="511" y="118" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="531" y="118" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="471" y="152" text-anchor="middle" font-size="10" fill="#555">L=8, ⌊8/3⌋=2</text>

  <rect x="391" y="118" width="20" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="411" y="118" width="20" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="531" y="118" width="20" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 471 148 L 471 168" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <g filter="url(#rough)">
    <rect x="406" y="178" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="426" y="178" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="446" y="178" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="466" y="178" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <rect x="486" y="178" width="20" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="471" y="212" text-anchor="middle" font-size="10" fill="#555">L=5, ⌊5/3⌋=1</text>
  <text x="471" y="228" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">替换减 1 ✓</text>

  <rect x="386" y="244" width="138" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough)"/>
  <text x="455" y="262" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">代价：3 删 / 1 减</text>
  <text x="455" y="278" text-anchor="middle" font-size="10" fill="#666">优先级 ★</text>
  <text x="455" y="318" text-anchor="middle" font-size="10" fill="#b85450">最后兜底：delete/3</text>
</svg>
