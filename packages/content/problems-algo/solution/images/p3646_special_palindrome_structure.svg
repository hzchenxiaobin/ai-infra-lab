<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：数字集合唯一决定回文结构 x = Q + c + rev(Q)</text>

  <!-- 组合来源 -->
  <rect x="30" y="38" width="180" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="58" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">偶数字池：E ⊆ {2, 4, 6, 8}</text>
  <text x="120" y="76" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">2⁴ = 16 种搭配</text>

  <rect x="310" y="38" width="180" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="400" y="58" text-anchor="middle" font-size="11.5" fill="#a07820" filter="url(#rough2)">中心 c ∈ {∅, 1, 3, 5, 7, 9}</text>
  <text x="400" y="76" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">奇数字至多选 1 个</text>

  <path d="M 150 92 L 200 118" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 370 92 L 320 118" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="175" y="120" width="170" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="140" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">共 16 × 6 = 96 个集合</text>

  <!-- 例1：奇长度 -->
  <text x="120" y="185" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">例① 集合 {1, 2}，L = 3：</text>

  <rect x="95" y="196" width="34" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="112" y="218" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="129" y="196" width="34" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="146" y="218" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="163" y="196" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="218" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>

  <text x="112" y="246" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">Q（自由）</text>
  <text x="146" y="246" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">c 中心</text>
  <text x="180" y="246" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">镜像</text>

  <text x="290" y="210" font-size="10.5" fill="#555" filter="url(#rough2)">数字 2 贡献 2/2 = 1 个进 Q；</text>
  <text x="290" y="226" font-size="10.5" fill="#555" filter="url(#rough2)">数字 1 是奇数字：0 个进 Q，</text>
  <text x="290" y="242" font-size="10.5" fill="#555" filter="url(#rough2)">剩下的 1 个钉在正中间。</text>

  <!-- 例2：偶长度 -->
  <text x="120" y="278" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">例② 集合 {2, 4}，L = 6：</text>

  <rect x="33" y="289" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="46" y="307" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="59" y="289" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="72" y="307" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="85" y="289" width="26" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="98" y="307" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="111" y="289" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="124" y="307" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="137" y="289" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="307" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="163" y="289" width="26" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="176" y="307" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">2</text>

  <text x="98" y="331" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">Q = "244"（每个数字 k 贡献 k/2 个）</text>
  <text x="150" y="345" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">无中心，直接镜像</text>

  <!-- 观察点 -->
  <rect x="240" y="262" width="256" height="88" rx="8" fill="#fafafa" stroke="#446688" stroke-width="1.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="368" y="280" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">三个直接推论</text>
  <text x="252" y="298" font-size="10" fill="#555" filter="url(#rough2)">① 0 必须出现 0 次 → 特殊数不含 0</text>
  <text x="252" y="316" font-size="10" fill="#555" filter="url(#rough2)">② 回文至多 1 个数字出现奇数次 →</text>
  <text x="262" y="330" font-size="10" fill="#555" filter="url(#rough2)">奇数字 1/3/5/7/9 至多选 1 个且居中</text>
  <text x="252" y="344" font-size="10" fill="#555" filter="url(#rough2)">③ 位数 L = 选中数字之和，L ≤ 20 + 9 = 29</text>
</svg>
