<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">二分答案：每节电池只能贡献 min(b, t)，t 越大越难满足 Σmin(b,t) ≥ n·t</text>

  <!-- Input -->
  <text x="40" y="50" font-size="12" fill="#888">n = 2 台电脑, batteries = [3, 3, 3], 候选 t = 4</text>

  <!-- ===== Top: battery contribution at t=4 ===== -->
  <text x="40" y="76" font-size="11" fill="#446688" font-weight="bold">每节电池贡献 = min(容量, t)：超过 t 的部分无法分给别的电脑（同时刻只供一台）</text>

  <!-- Battery 0: capacity 3, contributes min(3,4)=3 -->
  <rect x="60" y="86" width="70" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="104" text-anchor="middle" font-size="11" fill="#666">容量 3</text>
  <text x="95" y="120" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">→ 3</text>

  <!-- Battery 1 -->
  <rect x="150" y="86" width="70" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="185" y="104" text-anchor="middle" font-size="11" fill="#666">容量 3</text>
  <text x="185" y="120" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">→ 3</text>

  <!-- Battery 2 -->
  <rect x="240" y="86" width="70" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="275" y="104" text-anchor="middle" font-size="11" fill="#666">容量 3</text>
  <text x="275" y="120" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">→ 3</text>

  <!-- Sum box -->
  <rect x="340" y="86" width="90" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="385" y="104" text-anchor="middle" font-size="11" fill="#4a7a3a">Σ = 9</text>
  <text x="385" y="120" text-anchor="middle" font-size="11" fill="#666">n·t = 2×4 = 8</text>

  <!-- verdict -->
  <rect x="446" y="86" width="96" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="494" y="104" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">9 ≥ 8</text>
  <text x="494" y="120" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">可行 ✓</text>

  <!-- wasted note -->
  <text x="160" y="142" font-size="10" fill="#d6a040">若 t &gt; 3：每节电池被 t 截断，超出容量前的部分才有效</text>

  <!-- arrow down -->
  <path d="M 280 152 L 280 170" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Bottom: chart sum(min) vs n*t ===== -->
  <text x="40" y="184" font-size="12" fill="#555" font-weight="bold">能量曲线：蓝 = Σmin(b,t)（分段上升后趋平），红 = n·t（直线）</text>

  <!-- axes -->
  <line x1="90" y1="200" x2="90" y2="380" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="90" y1="380" x2="430" y2="380" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="84" y="206" text-anchor="end" font-size="10" fill="#888">能量</text>
  <text x="434" y="384" font-size="10" fill="#888">t →</text>

  <!-- y ticks: 0, 6, 9, 12 -->
  <text x="84" y="384" text-anchor="end" font-size="9" fill="#aaa">0</text>
  <line x1="86" y1="290" x2="90" y2="290" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="84" y="294" text-anchor="end" font-size="9" fill="#aaa">6</text>
  <line x1="86" y1="245" x2="90" y2="245" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="84" y="249" text-anchor="end" font-size="9" fill="#aaa">9</text>
  <line x1="86" y1="200" x2="90" y2="200" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="84" y="204" text-anchor="end" font-size="9" fill="#aaa">12</text>

  <!-- x ticks: t=0..6, x = 90 + t*56.6 -->
  <text x="90" y="394" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="147" y="394" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="203" y="394" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="260" y="394" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="316" y="394" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <text x="373" y="394" text-anchor="middle" font-size="9" fill="#aaa">5</text>
  <text x="430" y="394" text-anchor="middle" font-size="9" fill="#aaa">6</text>

  <!-- Feasible region shade: t in [0, 4.5] -> x in [90, 345] -->
  <!-- polygon following blue (top) then red (bottom) back to origin -->
  <polygon points="90,380 146,335 203,290 260,245 345,245 345,245 345,272 260,380"
           fill="#e6f4ea" fill-opacity="0.45" filter="url(#rough2)"/>

  <!-- Blue curve: sum(min(3,t)*3): 3t for t<=3, then flat 9 -->
  <!-- t=0->90,380 ; t=1->147,335 ; t=2->203,290 ; t=3->260,245 ; t=6->430,245 -->
  <path d="M 90 380 L 260 245 L 430 245" stroke="#446688" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <text x="380" y="238" font-size="11" fill="#446688" font-weight="bold">Σmin(b,t)</text>

  <!-- Red line: n*t = 2t: t=0->0(380) ; t=6->12(200) -->
  <path d="M 90 380 L 430 200" stroke="#b85450" stroke-width="2" stroke-dasharray="6,4" fill="none" filter="url(#rough2)"/>
  <text x="392" y="196" font-size="11" fill="#b85450" font-weight="bold">n·t = 2t</text>

  <!-- crossing point at t=4.5 -> x=345, y=245 -->
  <circle cx="345" cy="245" r="4.5" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="345" y="234" text-anchor="middle" font-size="10" fill="#b85450">交点 t=4.5</text>

  <!-- answer mark at t=4 -> x=316 -->
  <line x1="316" y1="245" x2="316" y2="380" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="296" y="404" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="318" y="419" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">ans=4</text>

  <!-- feasible / infeasible labels -->
  <text x="120" y="270" font-size="10" fill="#4a7a3a">可行 ✓（蓝 ≥ 红）</text>
  <text x="370" y="270" font-size="10" fill="#b85450">不可行 ✗</text>

  <!-- right summary -->
  <rect x="446" y="210" width="104" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="498" y="232" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">答案空间</text>
  <text x="498" y="252" text-anchor="middle" font-size="10.5" fill="#666">t ∈ [1, Σ/n]</text>
  <text x="498" y="270" text-anchor="middle" font-size="10.5" fill="#666">求最大 t</text>
  <text x="498" y="288" text-anchor="middle" font-size="10.5" fill="#666">使 Σmin(b,t)≥n·t</text>
  <text x="498" y="314" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">二段性 ⇒ 二分</text>
</svg>
