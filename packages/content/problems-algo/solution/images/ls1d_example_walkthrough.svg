<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    示例演算：nums = [0,1,1,1,0,1,1,0,1]
  </text>

  <!-- 数组下标表头 -->
  <text x="40" y="58" font-size="11" fill="#999" filter="url(#rough2)">下标</text>
  <text x="92" y="58" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="132" y="58" font-size="11" fill="#999" filter="url(#rough2)">1</text>
  <text x="172" y="58" font-size="11" fill="#999" filter="url(#rough2)">2</text>
  <text x="212" y="58" font-size="11" fill="#999" filter="url(#rough2)">3</text>
  <text x="252" y="58" font-size="11" fill="#999" filter="url(#rough2)">4</text>
  <text x="292" y="58" font-size="11" fill="#999" filter="url(#rough2)">5</text>
  <text x="332" y="58" font-size="11" fill="#999" filter="url(#rough2)">6</text>
  <text x="372" y="58" font-size="11" fill="#999" filter="url(#rough2)">7</text>
  <text x="412" y="58" font-size="11" fill="#999" filter="url(#rough2)">8</text>

  <!-- 数值行 -->
  <text x="40" y="78" font-size="11" fill="#999" filter="url(#rough2)">nums</text>
  <text x="92" y="78" font-size="12" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="132" y="78" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="172" y="78" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="212" y="78" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="252" y="78" font-size="12" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="292" y="78" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="332" y="78" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="372" y="78" font-size="12" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="412" y="78" font-size="12" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <!-- 步骤说明区 -->
  <text x="40" y="108" font-size="12" fill="#333" filter="url(#rough2)">关键步骤（窗口演进）：</text>

  <!-- step 1: right 到 4，窗口 [0,4]，zeros=2 触发收缩 -->
  <rect x="40" y="120" width="440" height="48" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="52" y="140" font-size="12" fill="#333" filter="url(#rough2)">
    ① right=4 时窗口 [0,4] 含 2 个 0 → zeros&gt;1，收缩 left 越过下标 0
  </text>
  <text x="52" y="158" font-size="11" fill="#666" filter="url(#rough2)">
    left 移到 1，zeros 回到 1，窗口变为 [1,4] = {1,1,1,0}
  </text>

  <!-- step 2: right 到 6，窗口 [1,6]，zeros=1 -->
  <rect x="40" y="176" width="440" height="48" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="52" y="196" font-size="12" fill="#333" filter="url(#rough2)">
    ② right=5、6 继续 1，窗口扩到 [1,6] = {1,1,1,0,1,1}，zeros=1
  </text>
  <text x="52" y="214" font-size="11" fill="#666" filter="url(#rough2)">
    窗口长度 6 → best = 6（候选答案 6−1=5）
  </text>

  <!-- step 3: right 到 7，再次 zeros=2 收缩 -->
  <rect x="40" y="232" width="440" height="48" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="52" y="252" font-size="12" fill="#333" filter="url(#rough2)">
    ③ right=7 是 0，窗口 [1,7] 含 2 个 0 → 收缩 left 越过下标 4 的 0
  </text>
  <text x="52" y="270" font-size="11" fill="#666" filter="url(#rough2)">
    left 移到 5，zeros 回到 1，窗口变为 [5,7] = {1,1,0}
  </text>

  <!-- step 4: right 到 8，窗口 [5,8] -->
  <rect x="40" y="288" width="440" height="48" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="52" y="308" font-size="12" fill="#333" filter="url(#rough2)">
    ④ right=8 是 1，窗口扩到 [5,8] = {1,1,0,1}，长度 4
  </text>
  <text x="52" y="326" font-size="11" fill="#666" filter="url(#rough2)">
    4 &lt; best=6，不更新。遍历结束。
  </text>

  <!-- 结论 -->
  <path d="M260,344 L260,362" stroke="#446688" stroke-width="1.8"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="366" width="320" height="56" fill="#fce4ec" stroke="#b85450"
        stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="388" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    最长窗口 best = 6（含 1 个 0）
  </text>
  <text x="260" y="408" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">
    返回 best − 1 = 5
  </text>
</svg>
