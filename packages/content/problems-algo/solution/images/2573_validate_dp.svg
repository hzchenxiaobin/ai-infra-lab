<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">验证 = 从 word 反向 DP 重算 LCP，逐项比对</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">贪心只用了 &gt;0 / ==0 的二值信息，精确数值靠这步把关</text>

  <!-- Left: DP table for s="abab" -->
  <text x="40" y="70" font-size="11" fill="#666" font-weight="bold">重算 f[i][j]（s = "abab"）</text>

  <!-- header row j labels -->
  <rect x="40" y="78" width="42" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="61" y="99" text-anchor="middle" font-size="11" fill="#888">f</text>
  <rect x="82" y="78" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="103" y="99" text-anchor="middle" font-size="11" fill="#446688">j=0</text>
  <rect x="124" y="78" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="145" y="99" text-anchor="middle" font-size="11" fill="#446688">j=1</text>
  <rect x="166" y="78" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="187" y="99" text-anchor="middle" font-size="11" fill="#446688">j=2</text>
  <rect x="208" y="78" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="229" y="99" text-anchor="middle" font-size="11" fill="#446688">j=3</text>

  <!-- row i=0 -->
  <rect x="40" y="110" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="61" y="131" text-anchor="middle" font-size="11" fill="#446688">i=0</text>
  <rect x="82" y="110" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="103" y="131" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="124" y="110" width="42" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="145" y="131" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="166" y="110" width="42" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="187" y="131" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="208" y="110" width="42" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="229" y="131" text-anchor="middle" font-size="13" fill="#333">0</text>

  <!-- row i=1 -->
  <rect x="40" y="142" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="61" y="163" text-anchor="middle" font-size="11" fill="#446688">i=1</text>
  <rect x="82" y="142" width="42" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="103" y="163" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="124" y="142" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="145" y="163" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="166" y="142" width="42" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="187" y="163" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="208" y="142" width="42" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="229" y="163" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <!-- row i=2 -->
  <rect x="40" y="174" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="61" y="195" text-anchor="middle" font-size="11" fill="#446688">i=2</text>
  <rect x="82" y="174" width="42" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="103" y="195" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="124" y="174" width="42" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="145" y="195" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="166" y="174" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="187" y="195" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="208" y="174" width="42" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="229" y="195" text-anchor="middle" font-size="13" fill="#333">0</text>

  <!-- row i=3 -->
  <rect x="40" y="206" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="61" y="227" text-anchor="middle" font-size="11" fill="#446688">i=3</text>
  <rect x="82" y="206" width="42" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="103" y="227" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="124" y="206" width="42" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="145" y="227" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="166" y="206" width="42" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="187" y="227" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="208" y="206" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="229" y="227" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <!-- match check -->
  <text x="125" y="260" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">↕ 与给定 lcp 逐项比对</text>
  <text x="125" y="276" text-anchor="middle" font-size="10.5" fill="#555">[[4,0,2,0],[0,3,0,1],…]</text>
  <text x="125" y="290" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">全部相等 → 返回 "abab" ✓</text>

  <!-- dependency arrow: f[i][j] <- f[i+1][j+1] -->
  <path d="M208 206 L248 174" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="3 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="250" y="150" font-size="9.5" fill="#b85450">依赖右下</text>
  <text x="250" y="162" font-size="9.5" fill="#b85450">f[i+1][j+1]</text>

  <!-- Right: recurrence + rules -->
  <rect x="300" y="70" width="200" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="400" y="90" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">递推</text>
  <text x="400" y="108" text-anchor="middle" font-size="11" fill="#333">若 s[i]==s[j]：</text>
  <text x="400" y="123" text-anchor="middle" font-size="10.5" fill="#333">f[i][j] = f[i+1][j+1] + 1</text>
  <text x="400" y="136" text-anchor="middle" font-size="10.5" fill="#555">否则 f[i][j] = 0</text>

  <rect x="300" y="150" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="400" y="166" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">填表方向：右下 → 左上</text>
  <text x="400" y="181" text-anchor="middle" font-size="10" fill="#555">边界 f[n][·] = f[·][n] = 0</text>

  <rect x="300" y="200" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="400" y="216" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">对角线 = n − i</text>
  <text x="400" y="231" text-anchor="middle" font-size="10" fill="#555">f[0][0]=4, f[1][1]=3, f[2][2]=2, f[3][3]=1</text>

  <rect x="300" y="250" width="200" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="400" y="268" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">任一格 f[i][j] ≠ lcp[i][j]</text>
  <text x="400" y="284" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">→ return ""</text>

  <!-- Footer -->
  <text x="260" y="320" text-anchor="middle" font-size="10.5" fill="#888">示例 3：lcp[3][3]=3，但 f[3][3]=1 → 1≠3 → 返回 ""</text>
  <text x="260" y="338" text-anchor="middle" font-size="10" fill="#aaa">每格 O(1)，共 n² 格 → 验证 O(n²)；可滚动数组压到 O(n) 空间</text>
  <text x="260" y="354" text-anchor="middle" font-size="10" fill="#aaa">红格=对角线(n−i)，橙格=非零公共前缀，体现递推一致性</text>
</svg>
