<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">环形区间和 → 双倍数组前缀和 O(1)</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">把 cost 数组铺两遍（下标 mod 26），跨过 26 的「环形区间」就变回普通区间（示例 1 数据）</text>

  <!-- ① nextCost 部分 -->
  <text x="40" y="72" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① nextCost 铺两遍：下标 26 又回到 'a'，a=1→b=0 的 next 代价 = nextPre[26] − nextPre[1]</text>

  <text x="52" y="88" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">a</text>
  <text x="88" y="88" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">b</text>
  <text x="124" y="88" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">c</text>
  <text x="160" y="88" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">d</text>
  <text x="196" y="88" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">e</text>
  <text x="232" y="88" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">f</text>
  <text x="268" y="88" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">g</text>
  <text x="304" y="88" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">h</text>
  <text x="374" y="88" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">y</text>
  <text x="410" y="88" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">z</text>
  <text x="446" y="88" text-anchor="middle" font-size="9.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="482" y="88" text-anchor="middle" font-size="9.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">b</text>

  <rect x="40" y="94" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="55" y="111" text-anchor="middle" font-size="9.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">100</text>
  <rect x="76" y="94" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="91" y="111" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="112" y="94" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="127" y="111" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="148" y="94" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="163" y="111" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="184" y="94" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="199" y="111" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="220" y="94" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="235" y="111" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="256" y="94" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="271" y="111" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="292" y="94" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="307" y="111" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="340" y="111" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">… 0 …</text>
  <rect x="356" y="94" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="371" y="111" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="392" y="94" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="407" y="111" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="428" y="94" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="443" y="111" text-anchor="middle" font-size="9.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">100</text>
  <rect x="464" y="94" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="479" y="111" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">0</text>

  <text x="55" y="130" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="91" y="130" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="127" y="130" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="163" y="130" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="199" y="130" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="235" y="130" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">5</text>
  <text x="271" y="130" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">6</text>
  <text x="307" y="130" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">7</text>
  <text x="371" y="130" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">24</text>
  <text x="407" y="130" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">25</text>
  <text x="443" y="130" text-anchor="middle" font-size="8.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">26</text>
  <text x="479" y="130" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">27</text>

  <text x="42" y="146" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">pre[1]=100</text>
  <text x="240" y="146" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">（pre[2..25] 均为 100）</text>
  <text x="496" y="146" text-anchor="end" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">pre[26]=100</text>

  <path d="M 76 152 L 76 160 L 428 160 L 428 152" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="252" y="174" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">fwd = nextPre[1+25] − nextPre[1] = 100 − 100 = 0（b 一路 next 绕回 a，25 格全免费）</text>

  <!-- ② prevCost 部分 -->
  <text x="40" y="206" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">② prevCost 铺两遍：a=0→b=1 的 prev 代价 = prevPre[27] − prevPre[2]</text>

  <text x="52" y="222" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">a</text>
  <text x="88" y="222" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">b</text>
  <text x="124" y="222" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">c</text>
  <text x="160" y="222" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">d</text>
  <text x="196" y="222" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">e</text>
  <text x="232" y="222" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">f</text>
  <text x="268" y="222" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">g</text>
  <text x="304" y="222" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">h</text>
  <text x="374" y="222" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">y</text>
  <text x="410" y="222" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">z</text>
  <text x="446" y="222" text-anchor="middle" font-size="9.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="482" y="222" text-anchor="middle" font-size="9.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">b</text>

  <rect x="40" y="228" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="55" y="245" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="76" y="228" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="91" y="245" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">100</text>
  <rect x="112" y="228" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="127" y="245" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="148" y="228" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="163" y="245" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="184" y="228" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="199" y="245" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="220" y="228" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="235" y="245" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="256" y="228" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="271" y="245" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="292" y="228" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="307" y="245" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="340" y="245" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">… 0 …</text>
  <rect x="356" y="228" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="371" y="245" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="392" y="228" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="407" y="245" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="428" y="228" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="443" y="245" text-anchor="middle" font-size="9.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="464" y="228" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="479" y="245" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">100</text>

  <text x="42" y="280" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">pre[2]=101</text>
  <text x="240" y="280" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">（pre[3..26] 均为 101）</text>
  <text x="496" y="280" text-anchor="end" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">pre[27]=102</text>

  <path d="M 112 286 L 112 294 L 464 294 L 464 286" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="288" y="308" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">bwd = prevPre[1+25+1] − prevPre[1+1] = 102 − 101 = 1（a 一路 prev 绕 25 格，只花 1）</text>

  <!-- 底部公式总结 -->
  <rect x="24" y="322" width="472" height="66" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="36" y="342" font-size="10.5" fill="#333" filter="url(#rough2)">通用公式（cost 铺两遍，pre 长 53）：fd = (b−a) mod 26，bd = (a−b) mod 26</text>
  <text x="36" y="360" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">fwd = nextPre[a + fd] − nextPre[a]　　　bwd = prevPre[b + bd + 1] − prevPre[b + 1]</text>
  <text x="36" y="378" font-size="9.5" fill="#666" filter="url(#rough2)">a == b 时两式自然为 0；a + fd ≤ 51、b + bd + 1 ≤ 52，永不越界。</text>
</svg>
