<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    厨师单机调度：start = max(next_free, arrival)
  </text>

  <!-- Arrival markers row label -->
  <text x="48" y="86" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">到达</text>
  <!-- cust0 arrival t=1 -->
  <path d="M110,92 L106,100 L114,100 z" fill="#d6a040" filter="url(#rough2)"/>
  <text x="110" y="80" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">c0@1</text>
  <!-- cust1 arrival t=2 -->
  <path d="M140,92 L136,100 L144,100 z" fill="#d6a040" filter="url(#rough2)"/>
  <text x="140" y="80" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">c1@2</text>
  <!-- cust2 arrival t=4 -->
  <path d="M200,92 L196,100 L204,100 z" fill="#d6a040" filter="url(#rough2)"/>
  <text x="200" y="80" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">c2@4</text>

  <!-- faint guide lines from arrivals down to lane -->
  <line x1="110" y1="102" x2="110" y2="148" stroke="#d6a040" stroke-width="1" stroke-dasharray="2 3" opacity="0.6" filter="url(#rough2)"/>
  <line x1="140" y1="102" x2="140" y2="148" stroke="#d6a040" stroke-width="1" stroke-dasharray="2 3" opacity="0.6" filter="url(#rough2)"/>
  <line x1="200" y1="102" x2="200" y2="148" stroke="#d6a040" stroke-width="1" stroke-dasharray="2 3" opacity="0.6" filter="url(#rough2)"/>

  <!-- Chef busy lane label -->
  <text x="48" y="170" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">厨师</text>
  <!-- idle [0,1] -->
  <rect x="80" y="148" width="30" height="32" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="3 3" rx="3" filter="url(#rough2)"/>
  <text x="95" y="169" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">闲</text>
  <!-- cook0 [1,3] -->
  <rect x="110" y="148" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="169" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">c0 做菜</text>
  <!-- cook1 [3,8] -->
  <rect x="170" y="148" width="150" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="245" y="169" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">c1 做菜（c2 排队）</text>
  <!-- cook2 [8,11] -->
  <rect x="320" y="148" width="90" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="365" y="169" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">c2 做菜</text>

  <!-- next_free vertical cursor at finish boundaries -->
  <line x1="170" y1="140" x2="170" y2="190" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="4 2" filter="url(#rough2)"/>
  <text x="170" y="134" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">next_free=3</text>
  <line x1="320" y1="140" x2="320" y2="190" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="4 2" filter="url(#rough2)"/>
  <text x="320" y="134" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">next_free=8</text>

  <!-- wait brackets: dashed red arrow from arrival to finish -->
  <!-- c0: arrival 110 -> finish 170, wait=2 -->
  <path d="M110,214 L167,214" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="140" y="232" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">wait0 = 3−1 = 2</text>
  <!-- c1: arrival 140 -> finish 320, wait=6 -->
  <path d="M140,246 L317,246" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="228" y="264" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">wait1 = 8−2 = 6</text>
  <!-- c2: arrival 200 -> finish 410, wait=7 -->
  <path d="M200,278 L407,278" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="304" y="296" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">wait2 = 11−4 = 7</text>

  <!-- time axis -->
  <line x1="80" y1="312" x2="450" y2="312" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- ticks 0,2,4,6,8,10,12 -->
  <line x1="80" y1="310" x2="80" y2="318" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="328" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">0</text>
  <line x1="140" y1="310" x2="140" y2="318" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="140" y="328" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">2</text>
  <line x1="200" y1="310" x2="200" y2="318" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="200" y="328" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">4</text>
  <line x1="260" y1="310" x2="260" y2="318" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="260" y="328" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">6</text>
  <line x1="320" y1="310" x2="320" y2="318" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="320" y="328" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">8</text>
  <line x1="380" y1="310" x2="380" y2="318" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="380" y="328" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">10</text>
  <line x1="440" y1="310" x2="440" y2="318" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="440" y="328" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">12</text>
  <text x="466" y="316" font-size="10" fill="#666" filter="url(#rough2)">t</text>

  <!-- insight box -->
  <rect x="50" y="338" width="420" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="351" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">
    红色虚线 = 等待时长（finish − arrival）；单变量 next_free 滚动即可
  </text>
</svg>
