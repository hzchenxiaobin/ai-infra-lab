<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：相邻长度 2 子数组的和去重，遇重复即命中</text>

  <!-- nums array row -->
  <text x="40" y="62" font-size="12" fill="#446688" font-weight="bold">nums（以 [4, 2, 4] 为例）</text>
  <g filter="url(#rough2)">
    <rect x="80" y="72" width="56" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="108" y="102" text-anchor="middle" font-size="20" fill="#333" font-weight="bold">4</text>
    <text x="108" y="64" text-anchor="middle" font-size="10" fill="#888">i=0</text>
    <rect x="136" y="72" width="56" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="164" y="102" text-anchor="middle" font-size="20" fill="#333" font-weight="bold">2</text>
    <text x="164" y="64" text-anchor="middle" font-size="10" fill="#888">i=1</text>
    <rect x="192" y="72" width="56" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="220" y="102" text-anchor="middle" font-size="20" fill="#333" font-weight="bold">4</text>
    <text x="220" y="64" text-anchor="middle" font-size="10" fill="#888">i=2</text>
  </g>

  <!-- sliding windows of size 2 -->
  <text x="40" y="150" font-size="12" fill="#4a7a3a" font-weight="bold">相邻长度 2 的子数组（共 n−1 个）</text>
  <g filter="url(#rough2)">
    <rect x="80" y="160" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="108" y="186" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
    <rect x="136" y="160" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="164" y="186" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
    <text x="200" y="184" font-size="13" fill="#4a7a3a" font-weight="bold">和 = 6</text>

    <rect x="136" y="214" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="164" y="240" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
    <rect x="192" y="214" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6"/>
    <text x="220" y="240" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
    <text x="260" y="238" font-size="13" fill="#4a7a3a" font-weight="bold">和 = 6</text>
  </g>

  <!-- arrow to seen set -->
  <path d="M 250 234 Q 320 234 360 200" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- hash set box -->
  <text x="360" y="150" font-size="12" fill="#d6a040" font-weight="bold">哈希集合 seen</text>
  <g filter="url(#rough2)">
    <rect x="356" y="160" width="180" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10"/>
    <text x="446" y="182" text-anchor="middle" font-size="12" fill="#666">insert(6) ✓</text>
    <text x="446" y="206" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">{ 6 }</text>
    <text x="446" y="232" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">再次 6 → 已存在 ✗</text>
    <text x="446" y="250" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">→ return true</text>
  </g>

  <!-- insight box -->
  <rect x="40" y="290" width="496" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="288" y="316" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">长度 2 的子数组只有 n−1 个，和的取值至多 n−1 种</text>
  <text x="288" y="340" text-anchor="middle" font-size="12" fill="#666">边算和边入集合：插入失败 = 该和此前出现过 = 命中两个等和子数组</text>
  <text x="288" y="366" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">一次遍历 + 哈希集合即可，无需两两比较</text>
  <text x="288" y="388" text-anchor="middle" font-size="12" fill="#888">O(n) 时间 / O(n) 空间</text>
</svg>
