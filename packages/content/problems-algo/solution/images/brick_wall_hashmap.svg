<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">哈希表：gap[prefix]++ 累加缝隙频次</text>

  <!-- Left: process one row -->
  <text x="30" y="58" font-size="11" fill="#888">处理 row 1: [3, 1, 2]</text>

  <!-- row bricks small -->
  <rect x="30" y="68" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="60" y="84" text-anchor="middle" font-size="10" fill="#333">3</text>
  <rect x="90" y="68" width="20" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="100" y="84" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="110" y="68" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="130" y="84" text-anchor="middle" font-size="10" fill="#333">2</text>

  <!-- prefix accumulation -->
  <text x="30" y="114" font-size="10.5" fill="#555">累加 prefix：</text>
  <rect x="30" y="120" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="60" y="136" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">3</text>
  <text x="98" y="136" font-size="11" fill="#888">→</text>
  <rect x="110" y="120" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="130" y="136" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">4</text>
  <text x="158" y="136" font-size="9.5" fill="#888">(停止：末尾 6 不算)</text>

  <text x="30" y="164" font-size="10.5" fill="#555">得到缝隙：{3, 4}</text>

  <!-- write arrow to hashmap -->
  <path d="M 180 131 L 230 131" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="205" y="124" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">++</text>

  <!-- Right: hashmap gap -->
  <rect x="230" y="50" width="200" height="180" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="330" y="72" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">gap（缝隙位置 → 行数）</text>
  <line x1="242" y1="82" x2="418" y2="82" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>

  <text x="262" y="102" font-size="11" fill="#333">位置</text>
  <text x="372" y="102" font-size="11" fill="#333">行数</text>

  <rect x="246" y="110" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="276" y="126" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="346" y="110" width="50" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="371" y="126" text-anchor="middle" font-size="11" fill="#333">1</text>

  <rect x="246" y="138" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="276" y="154" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="346" y="138" width="50" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="371" y="154" text-anchor="middle" font-size="11" fill="#333">1</text>

  <rect x="246" y="166" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="276" y="182" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="346" y="166" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="371" y="182" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2 ↑</text>

  <rect x="246" y="194" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="276" y="210" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <rect x="346" y="194" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="371" y="210" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3 ↑</text>

  <text x="330" y="224" text-anchor="middle" font-size="9.5" fill="#777" font-style="italic">row 1 的 3 与 4 各 +1</text>

  <!-- max tracking -->
  <path d="M 371 216 L 371 240 L 270 240" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="4,2" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- bottom: max tracking -->
  <rect x="30" y="250" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="270" y="272" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">同时维护 maxGap = max(maxGap, gap[prefix])</text>
  <text x="270" y="292" text-anchor="middle" font-size="11" fill="#555">每写入一次就更新最大值，遍历结束无需再扫哈希表</text>

  <!-- final answer -->
  <rect x="30" y="318" width="480" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="340" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">最终答案 = rows − maxGap</text>
  <text x="270" y="358" text-anchor="middle" font-size="11" fill="#777">在 maxGap 位置画线 → 该位置有 maxGap 行是缝隙，穿砖数 = 总行数 − maxGap</text>
</svg>
