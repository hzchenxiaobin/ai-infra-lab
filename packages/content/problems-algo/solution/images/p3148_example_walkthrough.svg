<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：滚动数组 premin 的逐行快照（示例 1）</text>

  <text x="16" y="42" font-size="9.5" fill="#666" filter="url(#rough2)">grid = [[9,5,7,3],[8,9,6,1],[6,7,14,3],[2,5,3,1]]，premin[j] = 左上矩形 [0..i]×[0..j] 的最小值</text>

  <!-- row 0 -->
  <text x="16" y="78" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">处理完第 0 行</text>
  <rect x="130" y="58" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="151" y="79" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">9</text>
  <rect x="176" y="58" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="197" y="79" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="222" y="58" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="243" y="79" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="268" y="58" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="289" y="79" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="322" y="79" font-size="10.5" fill="#555" filter="url(#rough2)">ans =</text>
  <text x="356" y="79" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="386" y="79" font-size="9.5" fill="#666" filter="url(#rough2)">本行最佳 (0,2)：7−5</text>

  <!-- row 1 -->
  <text x="16" y="128" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">处理完第 1 行</text>
  <rect x="130" y="108" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="151" y="129" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="176" y="108" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="197" y="129" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="222" y="108" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="243" y="129" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="268" y="108" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="289" y="129" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="322" y="129" font-size="10.5" fill="#555" filter="url(#rough2)">ans =</text>
  <text x="356" y="129" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="386" y="129" font-size="9.5" fill="#666" filter="url(#rough2)">本行最佳 (1,1)：9−5</text>

  <!-- row 2 (key) -->
  <text x="16" y="178" font-size="10.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">处理完第 2 行</text>
  <rect x="130" y="158" width="42" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="151" y="179" text-anchor="middle" font-size="13" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="176" y="158" width="42" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="197" y="179" text-anchor="middle" font-size="13" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="222" y="158" width="42" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="243" y="179" text-anchor="middle" font-size="13" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="268" y="158" width="42" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="289" y="179" text-anchor="middle" font-size="13" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="322" y="179" font-size="10.5" fill="#555" filter="url(#rough2)">ans =</text>
  <text x="356" y="179" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="386" y="179" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">(2,2)：14−5 ★</text>

  <!-- callout -->
  <rect x="126" y="196" width="390" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="321" y="211" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">进入 (2,2) 时：上块 premin[2]=5（旧）、左块 premin[1]=5（新）⇒ best=5 ⇒ 14−5=9</text>

  <!-- row 3 -->
  <text x="16" y="246" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">处理完第 3 行</text>
  <rect x="130" y="226" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="151" y="247" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="176" y="226" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="197" y="247" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="222" y="226" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="243" y="247" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="268" y="226" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="289" y="247" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="322" y="247" font-size="10.5" fill="#555" filter="url(#rough2)">ans =</text>
  <text x="356" y="247" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="386" y="247" font-size="9.5" fill="#666" filter="url(#rough2)">(3,1)：5−2=3，未破纪录</text>

  <!-- bottom note -->
  <rect x="16" y="270" width="488" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="291" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">关键一步：最优起点是 (0,1) 的 5，路径 (0,1)→(2,1)→(2,2)，总分 9 = 14 − 5（中间 7 被抵消）</text>
  <text x="260" y="309" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">对照示例 2（全递减）：ans 全程停在 −1——必须动一次，最优也是负值</text>
  <text x="260" y="327" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">所以打擂台从 −∞ 起步，且 (0,0) 处 best = +∞ 无可选起点，直接跳过</text>
</svg>
