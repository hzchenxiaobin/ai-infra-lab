<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">核心观察：回文 = 字母两两配对放两侧 + 至多 1 个落单字母放正中</text>

  <!-- Palindrome row: d c c a c c d  -->
  <text x="40" y="86" font-size="12" fill="#888" font-weight="bold">最长回文:</text>
  <!-- pair d-d -->
  <rect x="120" y="66" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="140" y="92" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">d</text>
  <!-- pair c-c (left) -->
  <rect x="164" y="66" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="184" y="92" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">c</text>
  <!-- pair c-c (inner left) -->
  <rect x="208" y="66" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="228" y="92" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">c</text>
  <!-- center a -->
  <rect x="252" y="66" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="272" y="92" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">a</text>
  <!-- pair c-c (inner right) -->
  <rect x="296" y="66" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="316" y="92" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">c</text>
  <!-- pair c-c (right) -->
  <rect x="340" y="66" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="360" y="92" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">c</text>
  <!-- pair d-d (right) -->
  <rect x="384" y="66" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="404" y="92" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">d</text>

  <!-- pair arcs -->
  <path d="M 140 62 C 200 30 280 30 272 62" stroke="#446688" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="206" y="34" text-anchor="middle" font-size="10" fill="#446688">d 配对</text>
  <path d="M 184 58 C 240 22 300 22 316 58" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="250" y="20" text-anchor="middle" font-size="10" fill="#4a7a3a">c 配对 ×2</text>

  <!-- center marker -->
  <path d="M 272 116 L 272 130" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="146" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">落单字母 → 放正中</text>

  <!-- frequency → pair mapping table -->
  <rect x="40" y="166" width="480" height="172" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="190" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">从频次到长度：每对贡献 2，最多 1 个落单贡献 1</text>

  <!-- table header -->
  <text x="84" y="216" font-size="11" fill="#888" font-weight="bold">字母</text>
  <text x="180" y="216" font-size="11" fill="#888" font-weight="bold">频次 freq</text>
  <text x="312" y="216" font-size="11" fill="#888" font-weight="bold">freq // 2 × 2</text>
  <text x="450" y="216" font-size="11" fill="#888" font-weight="bold">落单?</text>

  <!-- row d -->
  <text x="84" y="240" font-size="12" fill="#446688" font-weight="bold">d</text>
  <text x="180" y="240" font-size="12" fill="#555">2</text>
  <text x="312" y="240" font-size="12" fill="#555" font-weight="bold">2</text>
  <text x="450" y="240" font-size="12" fill="#999">否</text>

  <!-- row c -->
  <text x="84" y="262" font-size="12" fill="#4a7a3a" font-weight="bold">c</text>
  <text x="180" y="262" font-size="12" fill="#555">4</text>
  <text x="312" y="262" font-size="12" fill="#555" font-weight="bold">4</text>
  <text x="450" y="262" font-size="12" fill="#999">否</text>

  <!-- row a -->
  <text x="84" y="284" font-size="12" fill="#b85450" font-weight="bold">a</text>
  <text x="180" y="284" font-size="12" fill="#555">1</text>
  <text x="312" y="284" font-size="12" fill="#555" font-weight="bold">0</text>
  <text x="450" y="284" font-size="12" fill="#b85450" font-weight="bold">是 → +1</text>

  <!-- row b -->
  <text x="84" y="306" font-size="12" fill="#b85450" font-weight="bold">b</text>
  <text x="180" y="306" font-size="12" fill="#555">1</text>
  <text x="312" y="306" font-size="12" fill="#555" font-weight="bold">0</text>
  <text x="450" y="306" font-size="12" fill="#b85450" font-weight="bold">是（已用 1 个）</text>

  <!-- summary -->
  <text x="280" y="330" text-anchor="middle" font-size="12" fill="#444">配对和 = 2+4 = 6，存在落单字母 → ans = 6 + 1 = 7</text>
</svg>
