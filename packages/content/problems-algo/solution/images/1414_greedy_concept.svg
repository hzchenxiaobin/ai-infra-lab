<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：每次贪心取 ≤ 剩余值的最大斐波那契数</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888">Zeckendorf 定理：贪心给出互不相邻的斐波那契表示，项数最少</text>

  <!-- ===== Fibonacci sequence row ===== -->
  <text x="40" y="78" font-size="11" fill="#446688" font-weight="bold">斐波那契数列 (≤ k 的部分):</text>
  <g font-size="11">
    <rect x="40" y="86" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="62" y="105" text-anchor="middle" fill="#333">1</text>
    <rect x="88" y="86" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="110" y="105" text-anchor="middle" fill="#333">1</text>
    <rect x="136" y="86" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="158" y="105" text-anchor="middle" fill="#333">2</text>
    <rect x="184" y="86" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="206" y="105" text-anchor="middle" fill="#333">3</text>
    <rect x="232" y="86" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="254" y="105" text-anchor="middle" fill="#333">5</text>
    <rect x="280" y="86" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="302" y="105" text-anchor="middle" fill="#333">8</text>
    <!-- highlighted 13 -->
    <rect x="328" y="86" width="44" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
    <text x="350" y="105" text-anchor="middle" fill="#4a7a3a" font-weight="bold">13</text>
    <rect x="376" y="86" width="44" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="398" y="105" text-anchor="middle" fill="#333">21</text>
    <text x="428" y="105" font-size="11" fill="#888">...</text>
  </g>
  <text x="350" y="128" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">↑ F_j = 13 ≤ k=19, 取走</text>

  <!-- ===== Greedy subtraction chain ===== -->
  <text x="40" y="160" font-size="11" fill="#446688" font-weight="bold">贪心相减过程 (k = 19):</text>

  <!-- Step 1: k=19, take 13 -->
  <rect x="40" y="168" width="120" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="100" y="190" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">rem = 19</text>
  <path d="M 166 186 L 200 186" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="183" y="178" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">取 13</text>

  <!-- Step 2: rem=6, take 5 -->
  <rect x="208" y="168" width="120" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="268" y="190" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">rem = 6</text>
  <path d="M 334 186 L 368 186" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="351" y="178" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">取 5</text>

  <!-- Step 3: rem=1, take 1 -->
  <rect x="376" y="168" width="120" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="436" y="190" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">rem = 1</text>
  <path d="M 502 186 L 536 186" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="519" y="178" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">取 1</text>

  <!-- Result: rem=0 -->
  <rect x="544" y="168" width="56" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="572" y="190" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">rem=0</text>

  <!-- ===== Key property box ===== -->
  <rect x="40" y="224" width="560" height="72" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="246" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">关键性质：k - F_j &lt; F_{j-1}</text>
  <text x="56" y="266" font-size="11" fill="#555">• F_j ≤ k &lt; F_{j+1} = F_j + F_{j-1}  ⇒  k - F_j &lt; F_{j-1}</text>
  <text x="56" y="282" font-size="11" fill="#555">• 剩余值跳到前两个位置以下，下一步取的数 ≤ F_{j-2}，与 F_j 不相邻</text>
  <text x="56" y="296" font-size="10" fill="#888">⇒ 天然产生 Zeckendorf 表示的「互不相邻」结构，且每步 1 个数 ≥ 任何替代方案</text>

  <!-- ===== Non-adjacent visualization ===== -->
  <text x="40" y="322" font-size="11" fill="#446688" font-weight="bold">取走的数 {13, 5, 1} 在数列中的位置（互不相邻）:</text>
  <g font-size="11">
    <!-- full sequence with positions -->
    <rect x="40" y="330" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="60" y="349" text-anchor="middle" fill="#333">1</text>
    <rect x="84" y="330" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="104" y="349" text-anchor="middle" fill="#333">1</text>
    <!-- taken 1 (position 2) -->
    <rect x="128" y="330" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
    <text x="148" y="349" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="172" y="330" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="192" y="349" text-anchor="middle" fill="#333">3</text>
    <!-- taken 5 (position 4) -->
    <rect x="216" y="330" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
    <text x="236" y="349" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
    <rect x="260" y="330" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="280" y="349" text-anchor="middle" fill="#333">8</text>
    <!-- taken 13 (position 6) -->
    <rect x="304" y="330" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
    <text x="324" y="349" text-anchor="middle" fill="#4a7a3a" font-weight="bold">13</text>
    <rect x="348" y="330" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="368" y="349" text-anchor="middle" fill="#333">21</text>
    <text x="398" y="349" font-size="11" fill="#888">...</text>
  </g>
  <!-- brackets showing non-adjacency -->
  <path d="M 128 366 L 128 372 L 168 372 L 168 366" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="148" y="386" text-anchor="middle" font-size="9" fill="#4a7a3a">F₂</text>
  <path d="M 216 366 L 216 372 L 256 372 L 256 366" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="236" y="386" text-anchor="middle" font-size="9" fill="#4a7a3a">F₄</text>
  <path d="M 304 366 L 304 372 L 344 372 L 344 366" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="324" y="386" text-anchor="middle" font-size="9" fill="#4a7a3a">F₆</text>
  <text x="220" y="402" text-anchor="middle" font-size="10" fill="#888">取走的下标 {2, 4, 6} 互不相邻 ⇒ Zeckendorf 表示</text>

  <!-- legend -->
  <g font-size="10" fill="#555">
    <rect x="420" y="330" width="14" height="12" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="440" y="340">取走(贪心选中)</text>
    <rect x="420" y="348" width="14" height="12" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="440" y="358">未取</text>
  </g>

  <text x="310" y="428" text-anchor="middle" font-size="10" fill="#888">19 = 13 + 5 + 1，3 项，即 Zeckendorf 表示的项数 = 最少项数</text>
</svg>
