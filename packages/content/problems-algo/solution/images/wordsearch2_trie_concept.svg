<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">把 words 建成 Trie：一次 DFS 扫遍所有单词</text>

  <!-- ===== Left: brute force ===== -->
  <rect x="24" y="44" width="240" height="312" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5,3" rx="10" filter="url(#rough2)"/>
  <text x="144" y="64" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">暴力：每个单词各搜一遍</text>

  <rect x="44" y="78" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="74" y="95" text-anchor="middle" font-size="11" fill="#333">oath</text>
  <rect x="44" y="110" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="74" y="127" text-anchor="middle" font-size="11" fill="#333">pea</text>
  <rect x="44" y="142" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="74" y="159" text-anchor="middle" font-size="11" fill="#333">eat</text>
  <rect x="44" y="174" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="74" y="191" text-anchor="middle" font-size="11" fill="#333">rain</text>
  <text x="74" y="216" text-anchor="middle" font-size="9" fill="#888">words[]</text>

  <!-- three small boards (redundant scans) -->
  <g filter="url(#rough2)">
    <rect x="150" y="80" width="50" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="150" y="80" width="12" height="12" fill="#b8d4f0" stroke="#446688" stroke-width="0.8"/>
    <rect x="162" y="80" width="13" height="12" fill="#b8d4f0" stroke="#446688" stroke-width="0.8"/>
    <rect x="175" y="80" width="13" height="12" fill="#b8d4f0" stroke="#446688" stroke-width="0.8"/>
    <rect x="188" y="80" width="12" height="12" fill="#b8d4f0" stroke="#446688" stroke-width="0.8"/>
  </g>
  <text x="175" y="134" text-anchor="middle" font-size="9" fill="#888">board 扫第 1 次</text>

  <g filter="url(#rough2)">
    <rect x="150" y="146" width="50" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="150" y="146" width="12" height="12" fill="#b8d4f0" stroke="#446688" stroke-width="0.8"/>
    <rect x="162" y="146" width="13" height="12" fill="#b8d4f0" stroke="#446688" stroke-width="0.8"/>
    <rect x="175" y="146" width="13" height="12" fill="#b8d4f0" stroke="#446688" stroke-width="0.8"/>
    <rect x="188" y="146" width="12" height="12" fill="#b8d4f0" stroke="#446688" stroke-width="0.8"/>
  </g>
  <text x="175" y="200" text-anchor="middle" font-size="9" fill="#888">board 扫第 2 次</text>

  <g filter="url(#rough2)">
    <rect x="150" y="212" width="50" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <rect x="150" y="212" width="12" height="12" fill="#b8d4f0" stroke="#446688" stroke-width="0.8"/>
    <rect x="162" y="212" width="13" height="12" fill="#b8d4f0" stroke="#446688" stroke-width="0.8"/>
    <rect x="175" y="212" width="13" height="12" fill="#b8d4f0" stroke="#446688" stroke-width="0.8"/>
    <rect x="188" y="212" width="12" height="12" fill="#b8d4f0" stroke="#446688" stroke-width="0.8"/>
  </g>
  <text x="175" y="266" text-anchor="middle" font-size="9" fill="#888">board 扫第 3 次 …</text>

  <path d="M 110 92 L 146 96" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 110 124 L 146 160" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 110 156 L 146 224" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="48" y="288" width="192" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="144" y="310" text-anchor="middle" font-size="11" fill="#444">重复扫 board</text>
  <text x="144" y="328" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">O(N · m·n · 4^L)</text>

  <!-- ===== Right: Trie ===== -->
  <rect x="296" y="44" width="240" height="312" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="416" y="64" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">Trie：所有单词共享前缀</text>

  <!-- root -->
  <g filter="url(#rough2)">
    <circle cx="416" cy="92" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="416" y="96" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">root</text>

  <!-- o branch -->
  <path d="M 404 104 L 360 140" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="116" font-size="9" fill="#888">o</text>
  <g filter="url(#rough2)"><circle cx="354" cy="146" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="354" y="150" text-anchor="middle" font-size="9" fill="#446688">o</text>

  <path d="M 354 159 L 354 190" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="362" y="178" font-size="9" fill="#888">a</text>
  <g filter="url(#rough2)"><circle cx="354" cy="196" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="354" y="200" text-anchor="middle" font-size="9" fill="#446688">a</text>

  <path d="M 354 209 L 354 236" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="362" y="226" font-size="9" fill="#888">t</text>
  <g filter="url(#rough2)"><circle cx="354" cy="242" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="354" y="246" text-anchor="middle" font-size="9" fill="#446688">t</text>

  <path d="M 354 255 L 354 280" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="362" y="270" font-size="9" fill="#888">h</text>
  <g filter="url(#rough2)"><circle cx="354" cy="286" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="354" y="290" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">h★</text>

  <!-- e branch -->
  <path d="M 416 108 L 416 138" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="424" y="126" font-size="9" fill="#888">e</text>
  <g filter="url(#rough2)"><circle cx="416" cy="146" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="416" y="150" text-anchor="middle" font-size="9" fill="#446688">e</text>

  <path d="M 416 159 L 416 186" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="424" y="176" font-size="9" fill="#888">a</text>
  <g filter="url(#rough2)"><circle cx="416" cy="192" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="416" y="196" text-anchor="middle" font-size="9" fill="#446688">a</text>

  <path d="M 416 205 L 416 232" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="424" y="222" font-size="9" fill="#888">t</text>
  <g filter="url(#rough2)"><circle cx="416" cy="238" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="416" y="242" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">t★</text>

  <!-- r branch -->
  <path d="M 428 104 L 478 140" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="462" y="116" font-size="9" fill="#888">r</text>
  <g filter="url(#rough2)"><circle cx="484" cy="146" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="484" y="150" text-anchor="middle" font-size="9" fill="#446688">r</text>

  <path d="M 484 159 L 484 186" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="492" y="176" font-size="9" fill="#888">a</text>
  <g filter="url(#rough2)"><circle cx="484" cy="192" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="484" y="196" text-anchor="middle" font-size="9" fill="#446688">a</text>

  <path d="M 484 205 L 484 232" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="492" y="222" font-size="9" fill="#888">i</text>
  <g filter="url(#rough2)"><circle cx="484" cy="238" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="484" y="242" text-anchor="middle" font-size="9" fill="#446688">i</text>

  <path d="M 484 251 L 484 278" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="492" y="268" font-size="9" fill="#888">n</text>
  <g filter="url(#rough2)"><circle cx="484" cy="284" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/></g>
  <text x="484" y="288" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">n★</text>

  <text x="416" y="318" text-anchor="middle" font-size="9" fill="#4a7a3a">★ = 单词结尾（isEnd）</text>

  <rect x="312" y="330" width="208" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="416" y="344" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">一次 DFS 走完 → O(m·n·4^L)</text>
</svg>
