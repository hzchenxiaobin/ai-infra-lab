<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：两条轨道分别判定多重集合相等</text>

  <!-- start -->
  <rect x="200" y="46" width="160" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="69" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">读入 s1, s2（长度 4）</text>

  <path d="M 280 82 L 280 104" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 1: even group -->
  <polygon points="280,104 420,154 280,204 140,154" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="146" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">偶数位组：(s1[0],s1[2]) 与</text>
  <text x="280" y="163" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">(s2[0],s2[2]) 正序相等</text>
  <text x="280" y="180" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">或反序相等？</text>

  <path d="M 424 154 L 436 154" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="430" y="144" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <path d="M 280 204 L 280 232" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="296" y="222" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- diamond 2: odd group -->
  <polygon points="280,232 420,282 280,332 140,282" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="274" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">奇数位组：(s1[1],s1[3]) 与</text>
  <text x="280" y="291" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">(s2[1],s2[3]) 正序相等</text>
  <text x="280" y="308" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">或反序相等？</text>

  <path d="M 420 282 L 500 282 L 500 190 L 500 172" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="444" y="274" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <path d="M 280 332 L 280 356" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="296" y="348" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- false box -->
  <rect x="440" y="136" width="100" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="490" y="159" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 false</text>

  <!-- true box -->
  <rect x="210" y="356" width="140" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="379" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 true ✓</text>

  <text x="280" y="416" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">任一组多重集合不相等 ⇒ 字符困在轨道里凑不齐 ⇒ false</text>
</svg>
