<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：删除一段，剩余 = 递增前缀 + 递增后缀</text>

  <!-- 顶部标签 -->
  <text x="133" y="44" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">递增前缀</text>
  <text x="201" y="44" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">删除 [l..r]</text>
  <text x="303" y="44" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">递增后缀</text>

  <!-- 数组格子：以 [6,5,7,8] 删 [5] 为例 -->
  <rect x="100" y="52" width="66" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="133" y="75" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>
  <rect x="168" y="52" width="66" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="201" y="75" text-anchor="middle" font-size="14" fill="#7a2e2a" filter="url(#rough2)">5</text>
  <rect x="236" y="52" width="66" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="269" y="75" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>
  <rect x="304" y="52" width="66" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="337" y="75" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">8</text>

  <!-- 删除叉号 -->
  <path d="M 174 58 L 228 82" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <path d="M 228 58 L 174 82" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>

  <text x="133" y="100" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">0</text>
  <text x="201" y="100" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">1</text>
  <text x="269" y="100" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">2</text>
  <text x="337" y="100" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">3</text>

  <!-- 拼接弧线箭头：l-1 的元素接 r+1 的元素 -->
  <path d="M 133 106 C 133 130, 269 130, 269 106" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="110" y="108" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">(l-1)</text>
  <text x="292" y="108" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">(r+1)</text>
  <text x="201" y="140" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">拼接不断崖：6 &lt; 7 ✓</text>

  <path d="M 40 152 L 480 152" stroke="#ccc" stroke-width="1" stroke-dasharray="6 5" filter="url(#rough2)"/>

  <!-- 三个合法性条件 -->
  <rect x="46" y="160" width="428" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="179" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">① 前缀 nums[0..l-1] 递增 ⟺ l ≤ x+1（x = 递增前缀末尾 = 0）</text>

  <rect x="46" y="198" width="428" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="217" text-anchor="middle" font-size="11" fill="#33506e" filter="url(#rough2)">② 后缀 nums[r+1..n-1] 递增 ⟺ r ≥ y-1（y = 递增后缀起点 = 1）</text>

  <rect x="46" y="236" width="428" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="255" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">③ 拼接不断崖：l = 0 或 r = n-1 或 nums[l-1] &lt; nums[r+1]</text>

  <!-- 结构条 -->
  <rect x="46" y="282" width="130" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="111" y="302" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">递增前缀 [0..x]</text>
  <rect x="176" y="282" width="168" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="302" text-anchor="middle" font-size="11" fill="#7a2e2a" filter="url(#rough2)">断崖区 [x..y-1]</text>
  <rect x="344" y="282" width="130" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="409" y="302" text-anchor="middle" font-size="11" fill="#33506e" filter="url(#rough2)">递增后缀 [y..n-1]</text>

  <path d="M 176 314 L 176 324" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="176" y="336" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">x</text>
  <path d="M 344 314 L 344 324" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="344" y="336" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">y</text>

  <rect x="46" y="344" width="428" height="28" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="362" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">所有断崖（nums[i] ≥ nums[i+1]）须落在 [l-1, r] 内：红区罩住，两侧可多删</text>
</svg>
