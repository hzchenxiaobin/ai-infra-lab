<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="470" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：逐 query 取与 dictionary 各词的最小汉明距离</text>
  <text x="290" y="40" text-anchor="middle" font-size="10.5" fill="#888">dictionary = ["wood","joke","moat"]</text>

  <!-- table header -->
  <rect x="36" y="52" width="448" height="26" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="69" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">query</text>
  <text x="150" y="69" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">vs wood</text>
  <text x="230" y="69" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">vs joke</text>
  <text x="310" y="69" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">vs moat</text>
  <text x="400" y="69" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">最小距离</text>
  <text x="468" y="69" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">收录?</text>

  <line x1="108" y1="52" x2="108" y2="330" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="188" y1="52" x2="188" y2="330" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="268" y1="52" x2="268" y2="330" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="350" y1="52" x2="350" y2="330" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>
  <line x1="436" y1="52" x2="436" y2="330" stroke="#cdd5df" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 1: word -->
  <rect x="36" y="80" width="448" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="70" y="99" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">word</text>
  <text x="150" y="99" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1 ✓</text>
  <text x="230" y="99" text-anchor="middle" font-size="11" fill="#888">3</text>
  <text x="310" y="99" text-anchor="middle" font-size="11" fill="#888">3</text>
  <text x="400" y="99" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="468" y="99" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- row 2: note -->
  <rect x="36" y="110" width="448" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="70" y="129" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">note</text>
  <text x="150" y="129" text-anchor="middle" font-size="11" fill="#888">3</text>
  <text x="230" y="129" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2 ✓</text>
  <text x="310" y="129" text-anchor="middle" font-size="11" fill="#888">3</text>
  <text x="400" y="129" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="468" y="129" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- row 3: ants -->
  <rect x="36" y="140" width="448" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="70" y="159" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ants</text>
  <text x="150" y="159" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <text x="230" y="159" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <text x="310" y="159" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <text x="400" y="159" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <text x="468" y="159" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>

  <!-- row 4: wood -->
  <rect x="36" y="170" width="448" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="70" y="189" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">wood</text>
  <text x="150" y="189" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0 ✓</text>
  <text x="230" y="189" text-anchor="middle" font-size="10" fill="#b85450">break</text>
  <text x="310" y="189" text-anchor="middle" font-size="10" fill="#b85450">break</text>
  <text x="400" y="189" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="468" y="189" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- table outer border -->
  <rect x="36" y="52" width="448" height="148" fill="none" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- result badge -->
  <rect x="170" y="214" width="240" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="240" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">返回 ["word","note","wood"]</text>

  <!-- annotation: wood detail -->
  <rect x="36" y="270" width="510" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="290" font-size="10.5" fill="#446688" font-weight="bold">注：wood = w,o,o,d 与 dictionary[0] "wood" 完全一致 → 距离 0，命中即停（不必比 joke/moat）</text>
  <text x="50" y="306" font-size="10.5" fill="#555">note vs joke：n/j · o=o · t/k · e=e → 仅 2 位不同 = 2 ≤ 2 → 收录</text>
  <text x="50" y="322" font-size="10.5" fill="#555">ants 与任一 dict 词在 4 个位置全不同 → 最小 4 &gt; 2 → 排除</text>

  <!-- footer: complexity -->
  <rect x="36" y="346" width="510" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="366" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">规模：q≤100, d≤100, n≤100 → 最坏 10^6 次字符比较；剪枝让实际远低于此</text>

  <!-- footer: key insight -->
  <rect x="36" y="388" width="510" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="408" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">关键：等长 → 编辑=替换=汉明距离；逐位计数，diff&gt;2 立即剪枝</text>
  <text x="290" y="424" text-anchor="middle" font-size="10" fill="#555">命中一个 ≤2 的 dict 词即可收录该 query，不必求全部距离</text>
  <text x="290" y="440" text-anchor="middle" font-size="10" fill="#555">外层 queries 顺序遍历，保证返回顺序与 queries 原顺序一致</text>
</svg>
