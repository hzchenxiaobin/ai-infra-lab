<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：单趟扫描，每个间隔套公式累加</text>

  <!-- Start (oval) -->
  <ellipse cx="280" cy="62" rx="56" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始</text>

  <path d="M 280 82 L 280 100" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Init (rect) -->
  <rect x="200" y="104" width="160" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="124" text-anchor="middle" font-size="11.5" fill="#333">prev = 0（地面高度）</text>
  <text x="280" y="140" text-anchor="middle" font-size="11.5" fill="#333">ans = 0</text>

  <path d="M 280 148 L 280 168" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Decision: more rungs? (diamond) -->
  <polygon points="280,172 376,214 280,256 184,214" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="210" text-anchor="middle" font-size="11.5" fill="#333">还有未处理</text>
  <text x="280" y="226" text-anchor="middle" font-size="11.5" fill="#333">的梯级？</text>

  <!-- No branch -> return -->
  <path d="M 376 214 L 460 214 L 460 300" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="402" y="206" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <rect x="392" y="304" width="136" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="460" y="328" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 ans</text>

  <!-- Yes branch -> down -->
  <path d="M 280 256 L 280 276" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="292" y="270" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- gap = rung - prev -->
  <rect x="196" y="280" width="168" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="304" text-anchor="middle" font-size="11.5" fill="#333">gap = rung − prev</text>

  <path d="M 280 318 L 280 334" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- ans += (gap-1)//dist -->
  <rect x="180" y="338" width="200" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="363" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">ans += (gap − 1) // dist</text>

  <path d="M 280 378 L 280 396" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- prev = rung -->
  <rect x="196" y="400" width="168" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="424" text-anchor="middle" font-size="11.5" fill="#333">prev = rung（站上新梯级）</text>

  <!-- loop back arrow to decision -->
  <path d="M 196 419 L 110 419 L 110 214 L 184 214" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="118" y="320" font-size="10.5" fill="#888">取下一梯级</text>

  <!-- note -->
  <text x="60" y="446" font-size="10.5" fill="#888">注：公式对 gap ≤ dist 自动得 0，无需分支判断</text>
</svg>
