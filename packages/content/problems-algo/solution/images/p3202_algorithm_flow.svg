<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="16.5" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：外层枚举 val，内层一遍扫描</text>

  <ellipse cx="170" cy="52" rx="36" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="57" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">开始</text>

  <path d="M 170 67 L 170 76" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="80" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="170" y="99" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">val ← 0</text>

  <path d="M 170 108 L 170 118" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="170,122 228,150 170,178 112,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="155" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">val &lt; k ?</text>

  <text x="244" y="142" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 228 150 L 356 150" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <ellipse cx="414" cy="150" rx="52" ry="17" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="414" y="155" text-anchor="middle" font-size="12" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <text x="180" y="196" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 170 178 L 170 192" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="75" y="196" width="190" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="170" y="216" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">dp[0..k−1] ← 0；i ← 0</text>

  <path d="M 170 226 L 170 236" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="170,240 228,268 170,296 112,268" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="273" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">i &lt; n ?</text>

  <text x="92" y="262" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 112 268 L 46 268 L 46 386 L 158 386" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="180" y="314" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 170 296 L 170 310" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="55" y="314" width="230" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="170" y="334" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">y ← nums[i]%k；prev ← (val−y+k)%k</text>

  <path d="M 170 344 L 170 354" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="75" y="358" width="190" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="170" y="378" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">dp[y] ← dp[prev] + 1</text>

  <path d="M 265 373 L 358 373 L 358 268 L 232 268" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="356" y="304" width="70" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="391" y="320" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">i ← i+1</text>

  <rect x="162" y="372" width="180" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="252" y="390" text-anchor="middle" font-size="10.5" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">ans ← max(ans, max(dp))</text>
  <text x="252" y="405" text-anchor="middle" font-size="10.5" fill="#8a3a34" filter="url(#rough2)">val ← val + 1</text>

  <path d="M 342 392 L 494 392 L 494 150 L 470 150" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="486" y="290" font-size="10.5" fill="#888" filter="url(#rough2)">回到</text>
  <text x="486" y="304" font-size="10.5" fill="#888" filter="url(#rough2)">val循环</text>
</svg>
