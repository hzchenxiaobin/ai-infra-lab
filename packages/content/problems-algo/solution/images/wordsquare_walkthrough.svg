<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">回溯搜索树：前缀逐层约束，ball / wall 两条路径成功</text>

  <!-- start node -->
  <g filter="url(#rough2)">
    <rect x="230" y="40" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
  </g>
  <text x="260" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">start</text>

  <!-- row0 nodes: ball, wall -->
  <g filter="url(#rough2)">
    <rect x="110" y="80" width="66" height="26" fill="#fff8e1" stroke="#888" stroke-width="1.4" rx="5"/>
    <rect x="344" y="80" width="66" height="26" fill="#fff8e1" stroke="#888" stroke-width="1.4" rx="5"/>
  </g>
  <g font-size="12" text-anchor="middle" filter="url(#rough2)">
    <text x="143" y="97" fill="#333">ball</text>
    <text x="377" y="97" fill="#333">wall</text>
  </g>
  <text x="260" y="97" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">…其它候选…</text>

  <!-- row1 nodes: area (both branches) -->
  <g filter="url(#rough2)">
    <rect x="110" y="140" width="66" height="26" fill="#fff8e1" stroke="#888" stroke-width="1.4" rx="5"/>
    <rect x="344" y="140" width="66" height="26" fill="#fff8e1" stroke="#888" stroke-width="1.4" rx="5"/>
  </g>
  <g font-size="12" text-anchor="middle" filter="url(#rough2)">
    <text x="143" y="157" fill="#333">area</text>
    <text x="377" y="157" fill="#333">area</text>
  </g>

  <!-- row2 nodes: lead -->
  <g filter="url(#rough2)">
    <rect x="110" y="200" width="66" height="26" fill="#fff8e1" stroke="#888" stroke-width="1.4" rx="5"/>
    <rect x="344" y="200" width="66" height="26" fill="#fff8e1" stroke="#888" stroke-width="1.4" rx="5"/>
  </g>
  <g font-size="12" text-anchor="middle" filter="url(#rough2)">
    <text x="143" y="217" fill="#333">lead</text>
    <text x="377" y="217" fill="#333">lead</text>
  </g>

  <!-- row3 nodes: lady (success, green) -->
  <g filter="url(#rough2)">
    <rect x="108" y="260" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <rect x="342" y="260" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6"/>
  </g>
  <g font-size="12" text-anchor="middle" filter="url(#rough2)">
    <text x="143" y="278" fill="#4a7a3a" font-weight="bold">lady ✓</text>
    <text x="377" y="278" fill="#4a7a3a" font-weight="bold">lady ✓</text>
  </g>

  <!-- edges start -> row0 -->
  <path d="M 250 64 L 150 80" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 270 64 L 370 80" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 260 64 L 258 78" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- edges row0 -> row1 -> row2 -> row3 (left branch) -->
  <path d="M 143 106 L 143 140" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 143 166 L 143 200" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 143 226 L 143 260" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- right branch -->
  <path d="M 377 106 L 377 140" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 377 166 L 377 200" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 377 226 L 377 260" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- edge prefix labels (left branch only, right mirrors) -->
  <g font-size="10" filter="url(#rough2)">
    <text x="184" y="128" fill="#446688">前缀 "a"</text>
    <text x="184" y="188" fill="#4a7a3a">前缀 "le"</text>
    <text x="184" y="248" fill="#d6a040">前缀 "lad"</text>
  </g>

  <!-- row labels (left margin) -->
  <g font-size="10" fill="#888" filter="url(#rough2)">
    <text x="44" y="97">row0</text>
    <text x="44" y="157">row1</text>
    <text x="44" y="217">row2</text>
    <text x="44" y="277">row3</text>
  </g>

  <!-- prune caption -->
  <rect x="226" y="232" width="118" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,2" rx="6" filter="url(#rough2)"/>
  <text x="285" y="246" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">area/lead/lady 作 row0 时早剪枝</text>

  <!-- result -->
  <text x="260" y="316" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">结果：[ball,area,lead,lady] 与 [wall,area,lead,lady]</text>
</svg>
