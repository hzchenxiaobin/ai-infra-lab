<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="320" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">逐步演算：s = "bcbbbcba"（left / right 都只进不退）</text>

  <!-- header row -->
  <rect x="20" y="32" width="492" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="43" y="48" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">right</text>
  <text x="92" y="48" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">s[right]</text>
  <text x="183" y="48" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">动作</text>
  <text x="296" y="48" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">窗口</text>
  <text x="408" y="48" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">窗口频次</text>
  <text x="492" y="48" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">maxLen</text>

  <!-- rows -->
  <rect x="20" y="56" width="492" height="24" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="20" y="80" width="492" height="24" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="20" y="104" width="492" height="24" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="20" y="128" width="492" height="24" fill="#fff8e1" stroke="#e0d8c0" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="20" y="152" width="492" height="24" fill="#fff8e1" stroke="#e0d8c0" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="20" y="176" width="492" height="24" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="20" y="200" width="492" height="24" fill="#fff8e1" stroke="#e0d8c0" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="20" y="224" width="492" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- row 0 -->
  <text x="43" y="72" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">0</text>
  <text x="92" y="72" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="183" y="72" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">扩张</text>
  <text x="296" y="72" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">[0,0] "b"</text>
  <text x="408" y="72" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">b:1</text>
  <text x="492" y="72" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- row 1 -->
  <text x="43" y="96" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="92" y="96" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="183" y="96" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">扩张</text>
  <text x="296" y="96" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">[0,1] "bc"</text>
  <text x="408" y="96" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">b:1 c:1</text>
  <text x="492" y="96" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- row 2 -->
  <text x="43" y="120" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">2</text>
  <text x="92" y="120" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="183" y="120" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">扩张</text>
  <text x="296" y="120" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">[0,2] "bcb"</text>
  <text x="408" y="120" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">b:2 c:1</text>
  <text x="492" y="120" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- row 3 -->
  <text x="43" y="144" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">3</text>
  <text x="92" y="144" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="183" y="144" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">b=3 → 收缩 1 格</text>
  <text x="296" y="144" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">[1,3] "cbb"</text>
  <text x="408" y="144" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">b:2 c:1</text>
  <text x="492" y="144" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- row 4 -->
  <text x="43" y="168" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">4</text>
  <text x="92" y="168" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="183" y="168" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">b=3 → 连缩 2 格</text>
  <text x="296" y="168" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">[3,4] "bb"</text>
  <text x="408" y="168" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">b:2</text>
  <text x="492" y="168" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- row 5 -->
  <text x="43" y="192" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">5</text>
  <text x="92" y="192" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="183" y="192" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">扩张</text>
  <text x="296" y="192" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">[3,5] "bbc"</text>
  <text x="408" y="192" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">b:2 c:1</text>
  <text x="492" y="192" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- row 6 -->
  <text x="43" y="216" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">6</text>
  <text x="92" y="216" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="183" y="216" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">b=3 → 收缩 1 格</text>
  <text x="296" y="216" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">[4,6] "bcb"</text>
  <text x="408" y="216" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">b:2 c:1</text>
  <text x="492" y="216" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- row 7 -->
  <text x="43" y="240" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="92" y="240" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="183" y="240" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">扩张</text>
  <text x="296" y="240" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">[4,7] "bcba"</text>
  <text x="408" y="240" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">b:2 c:1 a:1</text>
  <text x="492" y="240" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- column separators -->
  <path d="M 66 32 L 66 248" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 118 32 L 118 248" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 248 32 L 248 248" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 344 32 L 344 248" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 472 32 L 472 248" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- outer border -->
  <rect x="20" y="32" width="492" height="216" fill="none" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- bottom note -->
  <rect x="48" y="262" width="424" height="44" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="280" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">最终答案 maxLen = 4：窗口 [4,7] = "bcba"（b:2、c:1、a:1）</text>
  <text x="260" y="298" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">窗口先缩后胀——长度的「历史最大」才是答案，不是最后窗口的长度</text>
</svg>
