<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [3, 1, 4, 1, 5], k = 2  →  ans = 2</text>

  <!-- Step 1: Build Counter -->
  <rect x="20" y="44" width="280" height="150" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="20" y="44" width="280" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="63" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">第 1 步：统计频次</text>

  <text x="35" y="92" font-size="11" fill="#888">原数组：</text>
  <rect x="100" y="78" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="117" y="95" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="136" y="78" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="153" y="95" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="172" y="78" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="189" y="95" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <rect x="208" y="78" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="225" y="95" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="244" y="78" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="261" y="95" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>

  <text x="35" y="128" font-size="11" fill="#888">Counter：</text>
  <rect x="100" y="114" width="56" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="128" y="131" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">1 → 2</text>
  <rect x="160" y="114" width="56" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="131" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">3 → 1</text>
  <rect x="220" y="114" width="56" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="248" y="131" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">4 → 1</text>
  <rect x="100" y="142" width="56" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="128" y="159" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">5 → 1</text>

  <text x="160" y="182" text-anchor="middle" font-size="10" fill="#888" font-style="italic">k = 2 &gt; 0，走「查 x+k」分支</text>

  <!-- Step 2: Iterate unique values -->
  <rect x="310" y="44" width="290" height="310" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="310" y="44" width="290" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="455" y="63" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">第 2 步：遍历唯一值，查 x + k</text>

  <!-- x=1 -->
  <rect x="325" y="82" width="260" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="335" y="100" font-size="10.5" fill="#333" font-weight="bold">x = 1：</text>
  <text x="390" y="100" font-size="10.5" fill="#333">查 1+2=3 在 Counter？</text>
  <text x="390" y="116" font-size="10.5" fill="#82b366" font-weight="bold">→ 是！ans = 1  ✓ 数对 (1, 3)</text>

  <!-- x=3 -->
  <rect x="325" y="138" width="260" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="335" y="156" font-size="10.5" fill="#333" font-weight="bold">x = 3：</text>
  <text x="390" y="156" font-size="10.5" fill="#333">查 3+2=5 在 Counter？</text>
  <text x="390" y="172" font-size="10.5" fill="#82b366" font-weight="bold">→ 是！ans = 2  ✓ 数对 (3, 5)</text>

  <!-- x=4 -->
  <rect x="325" y="194" width="260" height="48" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="335" y="212" font-size="10.5" fill="#333" font-weight="bold">x = 4：</text>
  <text x="390" y="212" font-size="10.5" fill="#333">查 4+2=6 在 Counter？</text>
  <text x="390" y="228" font-size="10.5" fill="#b85450">→ 否，跳过  ✗</text>

  <!-- x=5 -->
  <rect x="325" y="250" width="260" height="48" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="335" y="268" font-size="10.5" fill="#333" font-weight="bold">x = 5：</text>
  <text x="390" y="268" font-size="10.5" fill="#333">查 5+2=7 在 Counter？</text>
  <text x="390" y="284" font-size="10.5" fill="#b85450">→ 否，跳过  ✗</text>

  <!-- result -->
  <rect x="325" y="308" width="260" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="455" y="331" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">最终 ans = 2  ⭐</text>

  <!-- bottom summary -->
  <rect x="20" y="210" width="280" height="144" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="35" y="232" font-size="11" fill="#444" font-weight="bold">为什么不会重复计数？</text>
  <text x="35" y="252" font-size="10.5" fill="#555">数对 (1, 3) 只在遍历到 x=1 时</text>
  <text x="35" y="268" font-size="10.5" fill="#555">计入（查 1+2=3 命中）；</text>
  <text x="35" y="284" font-size="10.5" fill="#555">遍历到 x=3 时查的是 3+2=5，</text>
  <text x="35" y="300" font-size="10.5" fill="#555">不会回头查 3−2=1。</text>
  <text x="35" y="322" font-size="10.5" fill="#d6a040" font-weight="bold">单向查 x+k = 天然去重</text>
  <text x="35" y="340" font-size="10" fill="#888" font-style="italic">即使原数组有两个 1，也只算 1 对</text>
</svg>
