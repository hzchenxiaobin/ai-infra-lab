<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：偶数步必回 (0,0) —— 永远出不了「家门口」</text>
  <text x="280" y="40" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">奇数步只能 →/↓，偶数步只能 ←/↑ ⇒ 每两步一个来回，轨迹被锁死在 3 个格子里</text>

  <!-- ============ Band 1: 移动规则 ============ -->
  <text x="40" y="58" font-size="11" fill="#444" font-weight="bold" filter="url(#rough2)">① 移动规则：按移动次数的奇偶交替</text>

  <g filter="url(#rough2)">
    <rect x="40" y="64" width="246" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="163" y="81" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">奇数次移动（第 1、3、5…次）</text>
    <text x="163" y="98" text-anchor="middle" font-size="10.5" fill="#333">只能向右 → 或向下 ↓</text>

    <rect x="300" y="64" width="246" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
    <text x="423" y="81" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">偶数次移动（第 2、4、6…次）</text>
    <text x="423" y="98" text-anchor="middle" font-size="10.5" fill="#333">只能向左 ← 或向上 ↑</text>
  </g>

  <!-- ============ Band 2: 振荡陷阱 ============ -->
  <text x="40" y="130" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">② 振荡陷阱：以 3×3 网格为例（格内数字 = 入场费 (i+1)(j+1)）</text>

  <!-- 网格 -->
  <g filter="url(#rough2)">
    <text x="109" y="145" text-anchor="middle" font-size="8.5" fill="#999">j=0</text>
    <text x="171" y="145" text-anchor="middle" font-size="8.5" fill="#999">j=1</text>
    <text x="233" y="145" text-anchor="middle" font-size="8.5" fill="#999">j=2</text>
    <text x="70" y="184" text-anchor="end" font-size="8.5" fill="#999">i=0</text>
    <text x="70" y="246" text-anchor="end" font-size="8.5" fill="#999">i=1</text>
    <text x="70" y="308" text-anchor="end" font-size="8.5" fill="#999">i=2</text>

    <rect x="78" y="150" width="62" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="140" y="150" width="62" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="202" y="150" width="62" height="62" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="78" y="212" width="62" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <rect x="140" y="212" width="62" height="62" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="202" y="212" width="62" height="62" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="78" y="274" width="62" height="62" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="140" y="274" width="62" height="62" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="202" y="274" width="62" height="62" fill="#f7f7f7" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5,3" rx="4"/>

    <text x="109" y="188" text-anchor="middle" font-size="14" fill="#2a5a2a" font-weight="bold">1</text>
    <text x="171" y="188" text-anchor="middle" font-size="14" fill="#2a5a2a" font-weight="bold">2</text>
    <text x="233" y="188" text-anchor="middle" font-size="13" fill="#999">3</text>
    <text x="109" y="250" text-anchor="middle" font-size="14" fill="#2a5a2a" font-weight="bold">2</text>
    <text x="171" y="250" text-anchor="middle" font-size="13" fill="#999">4</text>
    <text x="233" y="250" text-anchor="middle" font-size="13" fill="#999">6</text>
    <text x="109" y="308" text-anchor="middle" font-size="13" fill="#999">3</text>
    <text x="171" y="308" text-anchor="middle" font-size="13" fill="#999">6</text>
    <text x="233" y="302" text-anchor="middle" font-size="13" fill="#999">9</text>
    <text x="233" y="318" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">目标 ✗</text>
  </g>

  <!-- 振荡箭头：横向 (0,0) ⇄ (0,1) -->
  <g filter="url(#rough2)">
    <path d="M 88 166 L 178 166" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)"/>
    <text x="133" y="161" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">①</text>
    <path d="M 178 202 L 88 202" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)"/>
    <text x="133" y="197" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">②</text>

    <!-- 振荡箭头：纵向 (0,0) ⇄ (1,0) -->
    <path d="M 118 160 L 118 266" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)"/>
    <text x="124" y="240" font-size="9.5" fill="#446688" font-weight="bold">③</text>
    <path d="M 96 266 L 96 160" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)"/>
    <text x="90" y="240" text-anchor="end" font-size="9.5" fill="#b85450" font-weight="bold">④</text>
  </g>

  <text x="171" y="352" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">①→ ②← ③↓ ④↑ ⑤→ … 两步一个来回，无限打转</text>
  <text x="171" y="366" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">绿色 = 可达（仅 3 格）· 灰色 = 永远到不了</text>

  <!-- 右侧：归纳论证 -->
  <g filter="url(#rough2)">
    <rect x="292" y="150" width="254" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="419" y="170" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">奇数步：从 (0,0) 只能到隔壁</text>
    <text x="419" y="188" text-anchor="middle" font-size="9.5" fill="#333">向右 → (0,1) 或向下 ↓ (1,0) —— 离家最多 1 格</text>
  </g>
  <path d="M 419 204 L 419 220" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="292" y="224" width="254" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
    <text x="419" y="244" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">偶数步：出界方向全被堵死</text>
    <text x="419" y="262" text-anchor="middle" font-size="9.5" fill="#333">在 (0,1)：↑ 出界，只剩 ← 回 (0,0)</text>
    <text x="419" y="280" text-anchor="middle" font-size="9.5" fill="#333">在 (1,0)：← 出界，只剩 ↑ 回 (0,0)</text>
  </g>
  <path d="M 419 288 L 419 304" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="292" y="308" width="254" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="419" y="328" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold">数学归纳：第 2k 步后必在 (0,0)</text>
    <text x="419" y="346" text-anchor="middle" font-size="9.5" fill="#333">k = 0, 1, 2, … 偶数步全部「回家」；</text>
    <text x="419" y="362" text-anchor="middle" font-size="9.5" fill="#333">奇数步最多走到隔壁 —— 轨迹锁死在 3 格内</text>
  </g>

  <!-- ============ Band 3: 结论 ============ -->
  <g filter="url(#rough2)">
    <rect x="40" y="386" width="506" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="293" y="408" text-anchor="middle" font-size="12" fill="#2a5a2a" font-weight="bold">结论：可达集合 = { (0,0), (0,1), (1,0) }</text>
    <text x="293" y="426" text-anchor="middle" font-size="10" fill="#333">目标 (m−1, n−1) 可达 ⇔ (m, n) ∈ { 1×1, 1×2, 2×1 }，花费分别为 1 / 3 / 3</text>
    <text x="293" y="442" text-anchor="middle" font-size="9" fill="#555">且三种情形路径形态唯一，「最小花费」没有选择空间；其余尺寸一律返回 −1</text>
  </g>
</svg>
