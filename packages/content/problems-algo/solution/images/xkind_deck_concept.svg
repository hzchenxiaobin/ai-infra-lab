<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">卡牌分组：频次必有公约数 X ≥ 2</text>

  <!-- Row 1: deck cards -->
  <text x="40" y="62" font-size="12" fill="#888">牌堆 deck:</text>
  <rect x="110" y="44" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="65" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="156" y="44" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="65" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="202" y="44" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="224" y="65" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="248" y="44" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="65" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="294" y="44" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="316" y="65" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="340" y="44" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="362" y="65" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="386" y="44" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="408" y="65" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="432" y="44" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="454" y="65" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <!-- arrow down -->
  <path d="M 282 84 L 282 104" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="98" font-size="11" fill="#888">统计频次</text>

  <!-- Row 2: frequency table -->
  <text x="40" y="142" font-size="12" fill="#888">频次:</text>
  <rect x="110" y="124" width="64" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="144" text-anchor="middle" font-size="12" fill="#333">1 → 2</text>
  <rect x="184" y="124" width="64" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="216" y="144" text-anchor="middle" font-size="12" fill="#333">2 → 2</text>
  <rect x="258" y="124" width="64" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="144" text-anchor="middle" font-size="12" fill="#333">3 → 2</text>
  <rect x="332" y="124" width="64" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="364" y="144" text-anchor="middle" font-size="12" fill="#333">4 → 2</text>

  <!-- arrow down -->
  <path d="M 282 162 L 282 182" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="176" font-size="11" fill="#888">每组 X=2 张</text>

  <!-- Row 3: grouped pairs -->
  <text x="40" y="222" font-size="12" fill="#888">分组:</text>
  <rect x="110" y="204" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="224" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="140" y="204" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="224" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="184" y="204" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="199" y="224" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="214" y="204" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="229" y="224" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="258" y="204" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="273" y="224" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="288" y="204" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="303" y="224" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="332" y="204" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="347" y="224" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="362" y="204" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="377" y="224" text-anchor="middle" font-size="12" fill="#333">4</text>

  <!-- group brackets -->
  <path d="M 110 244 Q 125 252 140 244" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 184 244 Q 199 252 214 244" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 258 244 Q 273 252 288 244" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 332 244 Q 347 252 362 244" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- Insight box -->
  <rect x="40" y="272" width="460" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="270" y="296" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">核心观察：X 必须整除每个频次</text>
  <text x="270" y="316" text-anchor="middle" font-size="12" fill="#666">所有频次的最大公约数 g = gcd(freq₁, freq₂, ...)</text>
  <text x="270" y="336" text-anchor="middle" font-size="12" fill="#666">g ≥ 2 ⇒ 存在合法 X（取 X = g 即可）⇒ true</text>
  <text x="270" y="354" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">g = 1 ⇒ 无 X ≥ 2 能整除所有频次 ⇒ false</text>
</svg>
