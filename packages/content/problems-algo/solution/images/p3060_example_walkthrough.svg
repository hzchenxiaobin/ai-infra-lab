<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="500" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：三个用户逐一同类型相邻对核对</text>
  <text x="290" y="38" text-anchor="middle" font-size="9" fill="#888">gap = 后一会话 session_start − 前一会话 session_end；蓝=Viewer，橙=Streamer</text>

  <!-- ===== User 101 panel (excluded) ===== -->
  <rect x="25" y="50" width="530" height="106" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="45" y="68" font-size="11" fill="#b85450" font-weight="bold">用户 101</text>
  <text x="115" y="68" font-size="8" fill="#888">4 个会话 V/S/V/S 交替 → 每对同类型会话都隔了一整天</text>
  <rect x="45" y="78" width="106" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="98" y="92" text-anchor="middle" font-size="8" fill="#446688">#1 V 11-1 08–09</text>
  <rect x="159" y="78" width="106" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="212" y="92" text-anchor="middle" font-size="8" fill="#d6a040">#2 S 11-1 10–11</text>
  <rect x="273" y="78" width="106" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="326" y="92" text-anchor="middle" font-size="8" fill="#446688">#5 V 11-2 09–10</text>
  <rect x="387" y="78" width="106" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="440" y="92" text-anchor="middle" font-size="8" fill="#d6a040">#7 S 11-2 13–14</text>
  <path d="M 98 100 C 98 118, 326 118, 326 104" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="212" y="128" text-anchor="middle" font-size="8" fill="#b85450">V 对 #1→#5：09:00 → 次日 09:00，gap 24h ✗</text>
  <path d="M 212 100 C 212 116, 440 116, 440 104" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="141" text-anchor="middle" font-size="8" fill="#b85450">S 对 #2→#7：11:00 → 次日 13:00，gap 26h ✗</text>
  <text x="505" y="140" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">排除 ✗</text>

  <!-- ===== User 102 panel (included) ===== -->
  <rect x="25" y="170" width="530" height="106" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="45" y="188" font-size="11" fill="#4a7a3a" font-weight="bold">用户 102</text>
  <text x="115" y="188" font-size="8" fill="#888">同一天两个 Viewer 会话首尾相接，只隔 1 小时</text>
  <rect x="45" y="198" width="106" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="98" y="212" text-anchor="middle" font-size="8" fill="#446688">#3 V 11-1 13–14</text>
  <rect x="159" y="198" width="106" height="20" fill="#e8f0fe" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="212" y="212" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">#4 V 11-1 15–16</text>
  <rect x="273" y="198" width="106" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="326" y="212" text-anchor="middle" font-size="8" fill="#d6a040">#6 S 11-2 12–13</text>
  <rect x="387" y="198" width="106" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="440" y="212" text-anchor="middle" font-size="8" fill="#446688">#8 V 11-2 16–17</text>
  <path d="M 98 220 C 98 238, 212 238, 212 224" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="155" y="248" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">V 对 #3→#4：14:00 → 15:00，gap 1h ✓✓</text>
  <text x="360" y="248" text-anchor="middle" font-size="8" fill="#888">（V 对 #4→#8 gap 24h ✗；S 区仅 1 行）</text>
  <text x="505" y="248" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">入选 ✓</text>

  <!-- ===== User 103 panel (included) ===== -->
  <rect x="25" y="290" width="530" height="106" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="45" y="308" font-size="11" fill="#4a7a3a" font-weight="bold">用户 103</text>
  <text x="115" y="308" font-size="8" fill="#888">三个 Viewer 会话跨三天，最后一对间隔 10 小时</text>
  <rect x="45" y="318" width="130" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="332" text-anchor="middle" font-size="8" fill="#446688">#9 V 11-1 08–09</text>
  <rect x="225" y="318" width="130" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="332" text-anchor="middle" font-size="8" fill="#446688">#10 V 11-2 20–23</text>
  <rect x="405" y="318" width="130" height="20" fill="#e8f0fe" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="470" y="332" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">#11 V 11-3 09–10</text>
  <path d="M 110 340 C 110 356, 290 356, 290 344" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="368" text-anchor="middle" font-size="8" fill="#b85450">V 对 #9→#10：09:00 → 20:00，gap 35h ✗</text>
  <path d="M 290 340 C 290 358, 470 358, 470 344" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="381" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">V 对 #10→#11：23:00 → 次日 09:00，gap 10h ✓✓</text>
  <text x="505" y="380" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">入选 ✓</text>

  <!-- arrows to output -->
  <path d="M 290 396 L 290 408" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Output box ===== -->
  <rect x="25" y="412" width="530" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="434" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">输出（user_id 升序）：</text>
  <text x="290" y="456" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">102 → 103</text>
  <text x="290" y="476" text-anchor="middle" font-size="9" fill="#666">101 的两对同类型会话（24h / 26h）均超 12 小时；102、103 各有一对 ≤ 12 小时（1h / 10h）</text>
</svg>
