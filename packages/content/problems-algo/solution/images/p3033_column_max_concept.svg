<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：−1 的格子填所在列的最大值（每列只算一次）</text>
  <text x="167" y="48" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">matrix（示例 1）</text>

  <!-- matrix grid: w=50 h=44, x=70,142,214; y=56,106,156 -->
  <rect x="70" y="56" width="50" height="44" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="95" y="82" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="142" y="56" width="50" height="44" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="167" y="82" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="214" y="56" width="50" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="239" y="82" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1</text>

  <rect x="70" y="106" width="50" height="44" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="95" y="132" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="142" y="106" width="50" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="167" y="132" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1</text>
  <rect x="214" y="106" width="50" height="44" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="239" y="132" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>

  <rect x="70" y="156" width="50" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="95" y="182" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="142" y="156" width="50" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="167" y="182" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="214" y="156" width="50" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="239" y="182" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">9</text>

  <!-- fill arrows: column max -> -1 cell -->
  <path d="M 194 176 C 216 176 216 128 194 128" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 266 176 C 290 176 290 78 266 78" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="252" y="126" font-size="10" fill="#b85450" filter="url(#rough2)">回填</text>

  <!-- colMax strip -->
  <text x="167" y="218" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">逐列取最大值 colMax ↓</text>
  <rect x="70" y="226" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="95" y="247" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="142" y="226" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="167" y="247" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">8</text>
  <rect x="214" y="226" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="239" y="247" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">9</text>

  <!-- facts panel -->
  <rect x="304" y="56" width="194" height="156" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="401" y="80" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">两个关键事实</text>
  <text x="401" y="104" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">① 同列的 −1 共享同一个</text>
  <text x="401" y="121" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">替换值 colMax[j]，每列只算一次</text>
  <text x="401" y="144" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">② 值域 [−1,100]，每列至少</text>
  <text x="401" y="161" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">一个非负数 ⇒ 列 max ≥ 0</text>
  <text x="401" y="178" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">⇒ −1 永远不会是列最大值</text>
  <text x="401" y="200" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">∴ 对原始列直接取 max</text>

  <!-- conclusion -->
  <rect x="40" y="282" width="440" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="304" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">两遍扫描：先逐列求 colMax，再回填全部 −1 → 时间 O(mn)</text>
  <text x="260" y="324" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">第 0 列没有 −1，colMax[0]=7 备而不用，多算不影响正确性</text>
</svg>
