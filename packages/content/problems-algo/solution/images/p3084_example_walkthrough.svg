  <text x="198" y="305" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">第 j 个 a 结尾 ⟹ 贡献 j 个子串</text>
  <text x="198" y="324" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1 + 2 + 3 = 6 = 3×4/2 ✓</text>

  <!-- bottom note: example 2 -->
  <rect x="48" y="346" width="424" height="44" fill="#ffffff" stroke="#999" stroke-width="1.4" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="364" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">示例 2：s = "zzz"，c = "z" ⟹ m = 3，同样 6</text>
