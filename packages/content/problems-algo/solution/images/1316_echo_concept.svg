<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">循环子字符串：a + a 的拼接形式</text>

  <!-- ====== General concept ====== -->
  <rect x="70" y="48" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="105" y="70" text-anchor="middle" font-size="15" fill="#335" font-weight="bold">a</text>

  <text x="155" y="70" text-anchor="middle" font-size="16" fill="#888">+</text>

  <rect x="170" y="48" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="205" y="70" text-anchor="middle" font-size="15" fill="#3a5a2a" font-weight="bold">a</text>

  <text x="255" y="70" text-anchor="middle" font-size="16" fill="#888">=</text>

  <rect x="270" y="48" width="160" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="350" y="70" text-anchor="middle" font-size="13" fill="#a87020" font-weight="bold">aa（循环子串）</text>

  <!-- divider -->
  <path d="M 40 100 L 520 100" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ====== Example string ====== -->
  <text x="280" y="122" text-anchor="middle" font-size="12" fill="#666" font-weight="bold">text = "abcabcabc"</text>

  <!-- Index labels (row of 9 boxes at y=135) -->
  <!-- box w=34, start x=127, positions: 127,161,195,229,263,297,331,365,399 -->

  <!-- Echo 1: i=0, L=3 → boxes 0-2 blue, 3-5 green, 6-8 gray -->
  <text x="80" y="158" text-anchor="end" font-size="10" fill="#aaa">i=0,L=3</text>
  <!-- blue half -->
  <rect x="127" y="140" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="144" y="162" text-anchor="middle" font-size="14" fill="#335" font-weight="bold">a</text>
  <rect x="161" y="140" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="178" y="162" text-anchor="middle" font-size="14" fill="#335" font-weight="bold">b</text>
  <rect x="195" y="140" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="212" y="162" text-anchor="middle" font-size="14" fill="#335" font-weight="bold">c</text>
  <!-- separator -->
  <path d="M 229 136 L 229 178" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <!-- green half -->
  <rect x="229" y="140" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="246" y="162" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold">a</text>
  <rect x="263" y="140" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="162" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold">b</text>
  <rect x="297" y="140" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="314" y="162" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold">c</text>
  <!-- gray -->
  <rect x="331" y="140" width="34" height="34" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="365" y="140" width="34" height="34" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="399" y="140" width="34" height="34" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <!-- label -->
  <rect x="445" y="144" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="495" y="161" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">"abcabc" ✓</text>

  <!-- Echo 2: i=1, L=3 → box 0 gray, 1-3 blue, 4-6 green, 7-8 gray -->
  <text x="80" y="208" text-anchor="end" font-size="10" fill="#aaa">i=1,L=3</text>
  <rect x="127" y="190" width="34" height="34" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <!-- blue half -->
  <rect x="161" y="190" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="178" y="212" text-anchor="middle" font-size="14" fill="#335" font-weight="bold">b</text>
  <rect x="195" y="190" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="212" y="212" text-anchor="middle" font-size="14" fill="#335" font-weight="bold">c</text>
  <rect x="229" y="190" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="246" y="212" text-anchor="middle" font-size="14" fill="#335" font-weight="bold">a</text>
  <path d="M 263 186 L 263 228" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <!-- green half -->
  <rect x="263" y="190" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="212" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold">b</text>
  <rect x="297" y="190" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="314" y="212" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold">c</text>
  <rect x="331" y="190" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="348" y="212" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold">a</text>
  <!-- gray -->
  <rect x="365" y="190" width="34" height="34" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="399" y="190" width="34" height="34" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="445" y="194" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="495" y="211" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">"bcabca" ✓</text>

  <!-- Echo 3: i=2, L=3 → boxes 0-1 gray, 2-4 blue, 5-7 green, 8 gray -->
  <text x="80" y="258" text-anchor="end" font-size="10" fill="#aaa">i=2,L=3</text>
  <rect x="127" y="240" width="34" height="34" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="161" y="240" width="34" height="34" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <!-- blue half -->
  <rect x="195" y="240" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="212" y="262" text-anchor="middle" font-size="14" fill="#335" font-weight="bold">c</text>
  <rect x="229" y="240" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="246" y="262" text-anchor="middle" font-size="14" fill="#335" font-weight="bold">a</text>
  <rect x="263" y="240" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="262" text-anchor="middle" font-size="14" fill="#335" font-weight="bold">b</text>
  <path d="M 297 236 L 297 278" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <!-- green half -->
  <rect x="297" y="240" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="314" y="262" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold">c</text>
  <rect x="331" y="240" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="348" y="262" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold">a</text>
  <rect x="365" y="240" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="382" y="262" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold">b</text>
  <!-- gray -->
  <rect x="399" y="240" width="34" height="34" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="445" y="244" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="495" y="261" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">"cabcab" ✓</text>

  <!-- divider -->
  <path d="M 40 295 L 520 295" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Key insight box -->
  <rect x="60" y="310" width="440" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="332" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold">核心观察</text>
  <text x="280" y="352" text-anchor="middle" font-size="11" fill="#555">循环子串 = 长度 2L 的子串，前半段 text[i:i+L]</text>
  <text x="280" y="370" text-anchor="middle" font-size="11" fill="#555">与后半段 text[i+L:i+2L] 完全相同。去重后计数即可。</text>
</svg>
