<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    算法流程：展开 → 标首尾 → 自连接比对方
  </text>

  <rect x="40" y="50" width="180" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">① UNION ALL</text>
  <text x="130" y="92" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">caller/recipient</text>
  <text x="130" y="104" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">双向展开成 c</text>

  <path d="M 130 110 L 130 140" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <rect x="40" y="145" width="180" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="168" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">② ROW_NUMBER</text>
  <text x="130" y="185" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">PARTITION BY</text>
  <text x="130" y="197" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">user_id, DATE(call_time)</text>
  <text x="130" y="209" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">ASC 取首 / DESC 取尾</text>

  <path d="M 130 213 L 130 243" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <rect x="40" y="248" width="180" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">③ 自连接 JOIN</text>
  <text x="130" y="290" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">首通 rn_asc=1</text>
  <text x="130" y="302" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">× 末通 rn_desc=1</text>

  <path d="M 220 276 L 300 276" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <rect x="305" y="248" width="160" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="385" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">④ 比对方同人</text>
  <text x="385" y="290" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">first.other_id</text>
  <text x="385" y="302" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">= last.other_id</text>

  <path d="M 385 248 L 385 218" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <rect x="305" y="160" width="160" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="385" y="184" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">⑤ DISTINCT</text>
  <text x="385" y="202" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">去重 user_id</text>
  <text x="385" y="214" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">ORDER BY 升序</text>

  <path d="M 385 160 L 385 130" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <rect x="305" y="72" width="160" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="385" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">输出 user_id</text>
  <text x="385" y="114" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1, 4, 5, 8</text>

  <path d="M 220 180 Q 260 180 300 100" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="258" y="150" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">CTE t</text>

  <rect x="40" y="330" width="425" height="40" fill="none" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 3" rx="6" filter="url(#rough2)"/>
  <text x="252" y="354" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">
    ⚠ 窗口函数在 SELECT 阶段计算 → rn 必须放进 CTE，外层才能 WHERE rn=1
  </text>
</svg>
