<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#333" filter="url(#rough2)">示例 1 演算：nums = [2,3,6,1,9,2], x = 5</text>

  <!-- Table grid -->
  <!-- Column x positions: 步骤=35, nums[i]=110, 奇偶=170, maxEven=250, maxOdd=340, dp[i]=440, end=535 -->

  <!-- Header background -->
  <rect x="30" y="42" width="500" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="62" y="61" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">步骤</text>
  <text x="115" y="61" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">nums[i]</text>
  <text x="172" y="61" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">奇偶</text>
  <text x="245" y="61" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">maxEven</text>
  <text x="335" y="61" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">maxOdd</text>
  <text x="430" y="61" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">dp[i]</text>
  <text x="500" y="61" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">计算</text>

  <!-- Column dividers -->
  <line x1="90" y1="42" x2="90" y2="255" stroke="#ddd" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="140" y1="42" x2="140" y2="255" stroke="#ddd" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="205" y1="42" x2="205" y2="255" stroke="#ddd" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="285" y1="42" x2="285" y2="255" stroke="#ddd" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="380" y1="42" x2="380" y2="255" stroke="#ddd" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="475" y1="42" x2="475" y2="255" stroke="#ddd" stroke-width="0.5" filter="url(#rough2)"/>

  <!-- Row 0: Init -->
  <rect x="30" y="72" width="500" height="26" rx="2" fill="#e8f0fe" filter="url(#rough2)"/>
  <text x="62" y="89" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">初始</text>
  <text x="115" y="89" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="172" y="89" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">偶</text>
  <text x="245" y="89" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="335" y="89" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">−∞</text>
  <text x="430" y="89" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="500" y="89" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">nums[0]</text>

  <!-- Row 1: i=1 -->
  <text x="62" y="115" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">i=1</text>
  <text x="115" y="115" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="172" y="115" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">奇</text>
  <text x="245" y="115" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="335" y="115" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="430" y="115" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="500" y="115" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">2+3−5</text>

  <!-- Row 2: i=2 -->
  <rect x="30" y="122" width="500" height="26" rx="2" fill="#f5f5f5" filter="url(#rough2)"/>
  <text x="62" y="139" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">i=2</text>
  <text x="115" y="139" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">6</text>
  <text x="172" y="139" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">偶</text>
  <text x="245" y="139" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="335" y="139" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0</text>
  <text x="430" y="139" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">8</text>
  <text x="500" y="139" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">2+6</text>

  <!-- Row 3: i=3 -->
  <text x="62" y="165" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">i=3</text>
  <text x="115" y="165" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="172" y="165" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">奇</text>
  <text x="245" y="165" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">8</text>
  <text x="335" y="165" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="430" y="165" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4</text>
  <text x="500" y="165" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">8+1−5</text>

  <!-- Row 4: i=4 -->
  <rect x="30" y="172" width="500" height="26" rx="2" fill="#f5f5f5" filter="url(#rough2)"/>
  <text x="62" y="189" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">i=4</text>
  <text x="115" y="189" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">9</text>
  <text x="172" y="189" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">奇</text>
  <text x="245" y="189" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">8</text>
  <text x="335" y="189" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">13</text>
  <text x="430" y="189" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">13</text>
  <text x="500" y="189" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">4+9</text>

  <!-- Row 5: i=5 -->
  <text x="62" y="215" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">i=5</text>
  <text x="115" y="215" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="172" y="215" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">偶</text>
  <text x="245" y="215" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">10</text>
  <text x="335" y="215" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">13</text>
  <text x="430" y="215" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">10</text>
  <text x="500" y="215" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">8+2</text>

  <!-- Outer border -->
  <rect x="30" y="42" width="500" height="186" rx="4" fill="none" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Answer -->
  <rect x="110" y="252" width="340" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="277" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">答案 = max(10, 13) = 13</text>
</svg>
