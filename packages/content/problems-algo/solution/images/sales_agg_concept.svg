<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="470" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">SQL 思路：GROUP BY + SUM 两步聚合</text>

  <!-- Step 1: 原始表 Sales -->
  <text x="40" y="58" font-size="11.5" fill="#888">① 原始表 Sales（每行 = 一次销售记录）</text>
  <rect x="40" y="68" width="500" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="100" y="88" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">sale_id</text>
  <text x="215" y="88" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">product_id</text>
  <text x="320" y="88" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">year</text>
  <text x="420" y="88" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">quantity</text>
  <text x="500" y="88" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">price</text>
  <text x="290" y="106" text-anchor="middle" font-size="10.5" fill="#888">同一 product_id 可跨多年出现多行</text>

  <path d="M 290 118 L 290 138" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: GROUP BY -->
  <text x="40" y="152" font-size="11.5" fill="#888">② GROUP BY product_id — 按产品分组</text>
  <rect x="50" y="160" width="480" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="180" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">GROUP BY product_id</text>
  <text x="290" y="196" text-anchor="middle" font-size="10.5" fill="#555">相同 product_id 的行合并为一个分组</text>

  <path d="M 290 206 L 290 226" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="221" font-size="10" fill="#888">SUM(quantity)</text>

  <!-- Step 3: SUM -->
  <text x="40" y="240" font-size="11.5" fill="#888">③ SUM(quantity) — 组内销量求和</text>
  <rect x="50" y="248" width="480" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="268" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">SUM(quantity) AS total_quantity</text>
  <text x="290" y="284" text-anchor="middle" font-size="10.5" fill="#555">每组 quantity 列累加，得到该产品总销量</text>

  <path d="M 290 294 L 290 314" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="309" font-size="10" fill="#888">输出</text>

  <!-- Result -->
  <rect x="50" y="318" width="480" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="338" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">SELECT product_id, SUM(quantity) AS total_quantity</text>
  <text x="290" y="356" text-anchor="middle" font-size="10.5" fill="#555">结果 = 每个 product_id 的总销量（无销售的产品不出现）</text>

  <!-- Key insight box -->
  <rect x="40" y="386" width="500" height="68" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="60" y="406" font-size="11" fill="#555" font-weight="bold">💡 核心要点：</text>
  <text x="60" y="422" font-size="10.5" fill="#888">SUM 是聚合函数，必须配合 GROUP BY 使用——先分组再对组内某列求和。</text>
  <text x="60" y="438" font-size="10.5" fill="#888">本题无需 JOIN Product 表：只统计销量，product_name 不是输出列。</text>
  <text x="60" y="452" font-size="10.5" fill="#888">无销售记录的产品（如 Lenovo/400）不会出现在结果中。</text>
</svg>
