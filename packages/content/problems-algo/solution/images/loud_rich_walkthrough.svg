<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrMini" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrGMini" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算：DFS 后序递推各点答案</text>
  <text x="280" y="40" text-anchor="middle" font-size="11" fill="#888">quiet = [3,2,5,4,6,1,7,0]，最终 ans = [5,5,2,5,4,5,6,7]</text>

  <!-- Table header -->
  <rect x="24" y="54" width="512" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="50" y="73" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">dfs(x)</text>
  <text x="118" y="73" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">q[x]</text>
  <text x="245" y="73" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">富邻居 v 的 ans[v]</text>
  <text x="390" y="73" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">取最安静</text>
  <text x="490" y="73" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans[x]</text>

  <!-- column separators -->
  <line x1="80" y1="54" x2="80" y2="294" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="158" y1="54" x2="158" y2="294" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="330" y1="54" x2="330" y2="294" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="450" y1="54" x2="450" y2="294" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row: dfs(2) -->
  <rect x="24" y="82" width="512" height="26" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="50" y="100" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">②叶</text>
  <text x="118" y="100" text-anchor="middle" font-size="12" fill="#446688">5</text>
  <text x="245" y="100" text-anchor="middle" font-size="11" fill="#888">无</text>
  <text x="390" y="100" text-anchor="middle" font-size="11" fill="#333">自己 2 (q5)</text>
  <text x="490" y="100" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- Row: dfs(4) -->
  <rect x="24" y="108" width="512" height="26" fill="#f7f9fc" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="50" y="126" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">④叶</text>
  <text x="118" y="126" text-anchor="middle" font-size="12" fill="#446688">6</text>
  <text x="245" y="126" text-anchor="middle" font-size="11" fill="#888">无</text>
  <text x="390" y="126" text-anchor="middle" font-size="11" fill="#333">自己 4 (q6)</text>
  <text x="490" y="126" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4</text>

  <!-- Row: dfs(5) -->
  <rect x="24" y="134" width="512" height="26" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="50" y="152" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">⑤叶</text>
  <text x="118" y="152" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <text x="245" y="152" text-anchor="middle" font-size="11" fill="#888">无</text>
  <text x="390" y="152" text-anchor="middle" font-size="11" fill="#333">自己 5 (q1)</text>
  <text x="490" y="152" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">5</text>

  <!-- Row: dfs(6) -->
  <rect x="24" y="160" width="512" height="26" fill="#f7f9fc" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="50" y="178" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">⑥叶</text>
  <text x="118" y="178" text-anchor="middle" font-size="12" fill="#446688">7</text>
  <text x="245" y="178" text-anchor="middle" font-size="11" fill="#888">无</text>
  <text x="390" y="178" text-anchor="middle" font-size="11" fill="#333">自己 6 (q7)</text>
  <text x="490" y="178" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">6</text>

  <!-- Row: dfs(3) -->
  <rect x="24" y="186" width="512" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="50" y="204" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">③</text>
  <text x="118" y="204" text-anchor="middle" font-size="12" fill="#446688">4</text>
  <text x="245" y="204" text-anchor="middle" font-size="11" fill="#333">4(q6), 5(q1), 6(q7)</text>
  <text x="390" y="204" text-anchor="middle" font-size="11" fill="#333">min→5 (q1)</text>
  <text x="490" y="204" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">5</text>

  <!-- Row: dfs(7) -->
  <rect x="24" y="214" width="512" height="28" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="50" y="232" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">⑦</text>
  <text x="118" y="232" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <text x="245" y="232" text-anchor="middle" font-size="11" fill="#333">3 → ans[3]=5 (q1)</text>
  <text x="390" y="232" text-anchor="middle" font-size="11" fill="#333">min(7,5)→7 (q0)</text>
  <text x="490" y="232" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">7</text>

  <!-- Row: dfs(1) -->
  <rect x="24" y="242" width="512" height="28" fill="#f7f9fc" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="50" y="260" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">①</text>
  <text x="118" y="260" text-anchor="middle" font-size="12" fill="#446688">2</text>
  <text x="245" y="260" text-anchor="middle" font-size="11" fill="#333">2(q5), 3→5 (q1)</text>
  <text x="390" y="260" text-anchor="middle" font-size="11" fill="#333">min→5 (q1)</text>
  <text x="490" y="260" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">5</text>

  <!-- Row: dfs(0) -->
  <rect x="24" y="270" width="512" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="50" y="290" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">⓪</text>
  <text x="118" y="290" text-anchor="middle" font-size="12" fill="#446688">3</text>
  <text x="245" y="290" text-anchor="middle" font-size="11" fill="#333">1 → ans[1]=5 (q1)</text>
  <text x="390" y="290" text-anchor="middle" font-size="11" fill="#333">min(0,5)→5 (q1)</text>
  <text x="490" y="290" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">5</text>

  <!-- Bottom: mini graph with answers -->
  <text x="280" y="324" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">DAG：圈内 = id，圈下 q:quiet / ans:答案</text>

  <!-- edges (poorer -> richer) -->
  <!-- 0 -> 1 -->
  <path d="M 88 360 L 152 360" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrMini)" filter="url(#rough2)"/>
  <!-- 1 -> 2 -->
  <path d="M 188 348 Q 230 330 268 316" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrMini)" filter="url(#rough2)"/>
  <!-- 1 -> 3 -->
  <path d="M 188 372 Q 230 392 268 408" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrMini)" filter="url(#rough2)"/>
  <!-- 7 -> 3 (green) -->
  <path d="M 188 432 Q 230 430 268 414" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrGMini)" filter="url(#rough2)"/>
  <!-- 3 -> 4 -->
  <path d="M 304 396 Q 350 360 396 326" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrMini)" filter="url(#rough2)"/>
  <!-- 3 -> 5 -->
  <path d="M 306 408 L 396 372" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrMini)" filter="url(#rough2)"/>
  <!-- 3 -> 6 -->
  <path d="M 304 418 Q 350 440 396 448" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrMini)" filter="url(#rough2)"/>

  <!-- nodes -->
  <circle cx="70" cy="360" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="70" y="364" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="70" y="338" text-anchor="middle" font-size="9" fill="#446688">q:3</text>
  <text x="70" y="392" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">ans:5</text>

  <circle cx="170" cy="360" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="170" y="364" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="170" y="340" text-anchor="middle" font-size="9" fill="#446688">q:2</text>
  <text x="170" y="392" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">ans:5</text>

  <circle cx="286" cy="310" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="286" y="314" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="286" y="290" text-anchor="middle" font-size="9" fill="#446688">q:5</text>
  <text x="286" y="342" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">ans:2</text>

  <circle cx="286" cy="410" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="286" y="414" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="286" y="390" text-anchor="middle" font-size="9" fill="#446688">q:4</text>
  <text x="286" y="442" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">ans:5</text>

  <circle cx="170" cy="438" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="170" y="442" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>
  <text x="170" y="418" text-anchor="middle" font-size="9" fill="#4a7a3a">q:0</text>
  <text x="170" y="462" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">ans:7</text>

  <circle cx="410" cy="316" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="410" y="320" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="410" y="296" text-anchor="middle" font-size="9" fill="#446688">q:6</text>
  <text x="410" y="348" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">ans:4</text>

  <circle cx="410" cy="372" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="410" y="376" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="410" y="352" text-anchor="middle" font-size="9" fill="#b85450">q:1</text>
  <text x="410" y="404" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">ans:5</text>

  <circle cx="410" cy="456" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="410" y="460" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>
  <text x="410" y="436" text-anchor="middle" font-size="9" fill="#446688">q:7</text>
</svg>
