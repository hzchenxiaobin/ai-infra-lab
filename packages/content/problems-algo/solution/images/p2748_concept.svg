<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2748c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：只取首尾数字，互质则计数</text>

  <!-- nums array with digit highlighting -->
  <text x="70" y="62" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">nums</text>

  <rect x="100" y="48" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="115" y="74" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">1</text>
  <text x="145" y="74" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="130" y="102" text-anchor="middle" font-size="9" fill="#888">nums[0]</text>

  <rect x="200" y="48" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="215" y="74" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">2</text>
  <text x="245" y="74" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="230" y="102" text-anchor="middle" font-size="9" fill="#888">nums[1]</text>

  <rect x="300" y="48" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="315" y="74" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">1</text>
  <text x="345" y="74" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="330" y="102" text-anchor="middle" font-size="9" fill="#888">nums[2]</text>

  <!-- legend -->
  <rect x="400" y="52" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="420" y="64" font-size="10" fill="#d6a040" font-weight="bold">首位</text>
  <rect x="400" y="72" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="420" y="84" font-size="10" fill="#4a7a3a" font-weight="bold">末位</text>

  <!-- pairing example 1: beautiful -->
  <text x="60" y="140" font-size="12" fill="#446688" font-weight="bold">配对 (i=0, j=2)：首位[0] 与 末位[2] 互质</text>

  <rect x="60" y="150" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="85" y="172" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">1</text>
  <text x="85" y="196" text-anchor="middle" font-size="9" fill="#d6a040">首位[0]</text>

  <path d="M115,167 L165,167" stroke="#d6a040" stroke-width="2" marker-end="url(#arr2748c)" filter="url(#rough2)"/>
  <text x="140" y="160" text-anchor="middle" font-size="9" fill="#888">gcd</text>

  <rect x="170" y="150" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="195" y="172" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="195" y="196" text-anchor="middle" font-size="9" fill="#4a7a3a">末位[2]</text>

  <rect x="250" y="150" width="110" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="305" y="172" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">gcd=1 ✓ 美丽</text>

  <!-- pairing example 2: not beautiful -->
  <text x="60" y="230" font-size="12" fill="#446688" font-weight="bold">配对 (i=1, j=2)：首位[1] 与 末位[2] 不互质</text>

  <rect x="60" y="240" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="85" y="262" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">2</text>
  <text x="85" y="286" text-anchor="middle" font-size="9" fill="#d6a040">首位[1]</text>

  <path d="M115,257 L165,257" stroke="#d6a040" stroke-width="2" marker-end="url(#arr2748c)" filter="url(#rough2)"/>
  <text x="140" y="250" text-anchor="middle" font-size="9" fill="#888">gcd</text>

  <rect x="170" y="240" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="195" y="262" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="195" y="286" text-anchor="middle" font-size="9" fill="#4a7a3a">末位[2]</text>

  <rect x="250" y="240" width="110" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="305" y="262" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">gcd=2 ✗ 不美丽</text>

  <!-- bottom note -->
  <rect x="40" y="310" width="480" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="332" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">只需提取首位与末位：gcd(首位[i], 末位[j]) == 1 即计数</text>
  <text x="280" y="350" text-anchor="middle" font-size="11" fill="#446688">约束保证末位 ≠ 0，故 gcd 始终有效</text>
</svg>
