<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrk" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：特判 + 建网 + SSP 最小费用流</text>

  <!-- A -->
  <rect x="160" y="36" width="200" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="53" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">一趟扫描：总和 tot、总缺口 D</text>
  <path d="M 260 62 L 260 74" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrk)" filter="url(#rough2)"/>

  <!-- B: tot < 0 ? -->
  <polygon points="260,76 322,100 260,124 198,100" fill="#fff" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="104" text-anchor="middle" font-size="11" fill="#8f3b36" filter="url(#rough2)">tot &lt; 0 ？</text>
  <path d="M 322 100 L 388 100" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <text x="352" y="92" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="390" y="87" width="96" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="438" y="104" text-anchor="middle" font-size="11" fill="#8f3b36" filter="url(#rough2)">返回 −1</text>
  <path d="M 260 124 L 260 138" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <text x="270" y="134" font-size="10" fill="#666" filter="url(#rough2)">否</text>

  <!-- C: D == 0 ? -->
  <polygon points="260,140 322,164 260,188 198,164" fill="#fff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="168" text-anchor="middle" font-size="11" fill="#2f5a24" filter="url(#rough2)">D = 0 ？</text>
  <path d="M 322 164 L 388 164" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <text x="352" y="156" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="390" y="151" width="96" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="438" y="168" text-anchor="middle" font-size="11" fill="#2f5a24" filter="url(#rough2)">返回 0</text>
  <path d="M 260 188 L 260 198" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <text x="270" y="196" font-size="10" fill="#666" filter="url(#rough2)">否</text>

  <!-- D: 建网 -->
  <rect x="140" y="200" width="240" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="215" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">建费用流网络</text>
  <text x="260" y="232" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">S→正点 / 负点→T（费用 0）· 环边双向（费用 1）</text>
  <path d="M 260 240 L 260 252" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrk)" filter="url(#rough2)"/>

  <!-- E: SPFA -->
  <rect x="140" y="254" width="240" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="271" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">SPFA 找 S→T 费用最小的增广路</text>
  <path d="M 260 280 L 260 290" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arrk)" filter="url(#rough2)"/>

  <!-- F: 找到? -->
  <polygon points="260,292 330,316 260,340 190,316" fill="#fff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="320" text-anchor="middle" font-size="11" fill="#2c4a68" filter="url(#rough2)">找到增广路？</text>
  <path d="M 260 340 L 260 356" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <text x="270" y="352" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="185" y="358" width="150" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="375" text-anchor="middle" font-size="11" fill="#2f5a24" filter="url(#rough2)">返回 cost（总费用）</text>

  <path d="M 330 316 L 382 316" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <text x="354" y="308" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- G: 推流 -->
  <rect x="384" y="296" width="122" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="445" y="312" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">沿路推满瓶颈 aug</text>
  <text x="445" y="328" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">cost += aug × 路长</text>
  <path d="M 445 296 L 445 267 L 384 267" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrk)" filter="url(#rough2)"/>
  <text x="447" y="255" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">循环，直到无路</text>

  <!-- 底部注释 -->
  <text x="260" y="404" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">增广轮数 ≤ n：每轮必推满一条容量有限的源弧或汇弧，环弧容量 ∞ 永不瓶颈</text>
  <text x="260" y="421" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">与余额数值大小无关（b[i] = 10⁹ 也不会增广 10⁹ 轮）</text>
</svg>
