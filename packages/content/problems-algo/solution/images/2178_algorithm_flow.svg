<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：贪心拆分正偶数</text>

  <!-- Start: finalSum -->
  <rect x="220" y="44" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="17" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">输入 finalSum</text>

  <path d="M 280 78 L 280 96" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: odd? -->
  <polygon points="280,96 380,140 280,184 180,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="136" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">finalSum</text>
  <text x="280" y="152" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">为奇数？</text>

  <!-- Yes branch -> return [] -->
  <path d="M 180 140 L 100 140" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="140" y="132" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="40" y="124" width="60" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="70" y="144" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return []</text>

  <!-- No branch -> init -->
  <path d="M 380 140 L 460 140" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="420" y="132" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>

  <rect x="420" y="124" width="116" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="478" y="146" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">k=1, res=[]</text>

  <path d="M 478 158 L 478 184 L 280 184 L 280 204" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Loop condition diamond -->
  <polygon points="280,204 410,252 280,300 150,252" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="240" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">finalSum − 2k</text>
  <text x="280" y="256" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">≥ 2(k+1) ?</text>
  <text x="280" y="276" text-anchor="middle" font-size="10" fill="#888">（剩余够放下一项）</text>

  <!-- Yes loop body -->
  <path d="M 410 252 L 470 252" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="440" y="244" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="470" y="222" width="80" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="510" y="244" text-anchor="middle" font-size="11" fill="#333">res.append(2k)</text>
  <text x="510" y="260" text-anchor="middle" font-size="11" fill="#333">finalSum −= 2k</text>
  <text x="510" y="276" text-anchor="middle" font-size="11" fill="#333">k += 1</text>

  <!-- loop back arrow -->
  <path d="M 510 222 L 510 200 L 280 200 L 280 204" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="395" y="196" text-anchor="middle" font-size="10" fill="#4a7a3a">回到判定</text>

  <!-- No -> append remainder -->
  <path d="M 150 252 L 90 252 L 90 318" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="120" y="244" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <rect x="30" y="320" width="120" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="90" y="342" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">res.append(finalSum)</text>

  <path d="M 90 354 L 90 380 L 280 380 L 280 400" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- End -->
  <rect x="200" y="402" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="17" filter="url(#rough2)"/>
  <text x="280" y="424" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">return res</text>

  <!-- note bottom -->
  <text x="280" y="452" text-anchor="middle" font-size="10" fill="#888">末位 finalSum ≥ 2k &gt; 2(k−1)，与前面所有项互异 ✓</text>
</svg>
