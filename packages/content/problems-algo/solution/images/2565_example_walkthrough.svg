<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="430" fill="#fafafa"/>

  <text x="330" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：s = "abacaba" ， t = "bzaa" （m = 4, n = 7）</text>

  <!-- s reference -->
  <text x="60" y="62" font-size="12" fill="#555" font-weight="bold">s =</text>
  <rect x="92" y="48" width="30" height="24" rx="3" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="107" y="65" text-anchor="middle" font-size="12" fill="#333">a</text>
  <rect x="124" y="48" width="30" height="24" rx="3" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="139" y="65" text-anchor="middle" font-size="12" fill="#333">b</text>
  <rect x="156" y="48" width="30" height="24" rx="3" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="171" y="65" text-anchor="middle" font-size="12" fill="#333">a</text>
  <rect x="188" y="48" width="30" height="24" rx="3" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="203" y="65" text-anchor="middle" font-size="12" fill="#333">c</text>
  <rect x="220" y="48" width="30" height="24" rx="3" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="235" y="65" text-anchor="middle" font-size="12" fill="#333">a</text>
  <rect x="252" y="48" width="30" height="24" rx="3" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="267" y="65" text-anchor="middle" font-size="12" fill="#333">b</text>
  <rect x="284" y="48" width="30" height="24" rx="3" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="299" y="65" text-anchor="middle" font-size="12" fill="#333">a</text>
  <text x="328" y="65" font-size="11" fill="#888">下标 0..6</text>

  <!-- t reference -->
  <text x="470" y="62" font-size="12" fill="#555" font-weight="bold">t =</text>
  <rect x="500" y="48" width="30" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="515" y="65" text-anchor="middle" font-size="12" fill="#333">b</text>
  <rect x="532" y="48" width="30" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="547" y="65" text-anchor="middle" font-size="12" fill="#333">z</text>
  <rect x="564" y="48" width="30" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="579" y="65" text-anchor="middle" font-size="12" fill="#333">a</text>
  <rect x="596" y="48" width="30" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="611" y="65" text-anchor="middle" font-size="12" fill="#333">a</text>

  <!-- ===== table ===== -->
  <!-- label col x: 77..167 (w90), data cols start 167, w 52, gap 0 -->
  <!-- header row y 110..148 -->

  <!-- header -->
  <rect x="77" y="110" width="90" height="38" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="122" y="134" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">k（切分点）</text>

  <!-- column highlight for k=2,3,4 (max) drawn behind -->
  <rect x="271" y="110" width="156" height="152" fill="#fff8e1" opacity="0.6" filter="url(#rough2)"/>
  <text x="349" y="100" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">最大和 = 3</text>

  <!-- k header cells 0..7 -->
  <g font-size="12" fill="#555">
    <rect x="167" y="110" width="52" height="38" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="193" y="134" text-anchor="middle">0</text>
    <rect x="219" y="110" width="52" height="38" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="245" y="134" text-anchor="middle">1</text>
    <rect x="271" y="110" width="52" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="297" y="134" text-anchor="middle" fill="#d6a040" font-weight="bold">2</text>
    <rect x="323" y="110" width="52" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="349" y="134" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
    <rect x="375" y="110" width="52" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="401" y="134" text-anchor="middle" fill="#d6a040" font-weight="bold">4</text>
    <rect x="427" y="110" width="52" height="38" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="453" y="134" text-anchor="middle">5</text>
    <rect x="479" y="110" width="52" height="38" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="505" y="134" text-anchor="middle">6</text>
    <rect x="531" y="110" width="52" height="38" fill="#fafafa" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="557" y="134" text-anchor="middle">7</text>
  </g>

  <!-- pre row -->
  <rect x="77" y="148" width="90" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="122" y="172" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">pre[k]</text>
  <g font-size="13" fill="#333">
    <rect x="167" y="148" width="52" height="38" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="193" y="172" text-anchor="middle">0</text>
    <rect x="219" y="148" width="52" height="38" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="245" y="172" text-anchor="middle">0</text>
    <rect x="271" y="148" width="52" height="38" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="297" y="172" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="323" y="148" width="52" height="38" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="349" y="172" text-anchor="middle">1</text>
    <rect x="375" y="148" width="52" height="38" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="401" y="172" text-anchor="middle">1</text>
    <rect x="427" y="148" width="52" height="38" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="453" y="172" text-anchor="middle">1</text>
    <rect x="479" y="148" width="52" height="38" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="505" y="172" text-anchor="middle">1</text>
    <rect x="531" y="148" width="52" height="38" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="557" y="172" text-anchor="middle">1</text>
  </g>

  <!-- suf row -->
  <rect x="77" y="186" width="90" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="122" y="210" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">suf[k]</text>
  <g font-size="13" fill="#333">
    <rect x="167" y="186" width="52" height="38" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="193" y="210" text-anchor="middle">2</text>
    <rect x="219" y="186" width="52" height="38" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="245" y="210" text-anchor="middle">2</text>
    <rect x="271" y="186" width="52" height="38" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="297" y="210" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <rect x="323" y="186" width="52" height="38" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="349" y="210" text-anchor="middle">2</text>
    <rect x="375" y="186" width="52" height="38" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="401" y="210" text-anchor="middle">2</text>
    <rect x="427" y="186" width="52" height="38" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="453" y="210" text-anchor="middle">1</text>
    <rect x="479" y="186" width="52" height="38" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="505" y="210" text-anchor="middle">1</text>
    <rect x="531" y="186" width="52" height="38" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="557" y="210" text-anchor="middle">0</text>
  </g>

  <!-- sum row -->
  <rect x="77" y="224" width="90" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="122" y="248" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">pre+suf</text>
  <g font-size="13" fill="#333">
    <rect x="167" y="224" width="52" height="38" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="193" y="248" text-anchor="middle">2</text>
    <rect x="219" y="224" width="52" height="38" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="245" y="248" text-anchor="middle">2</text>
    <rect x="271" y="224" width="52" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="297" y="248" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
    <rect x="323" y="224" width="52" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="349" y="248" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
    <rect x="375" y="224" width="52" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="401" y="248" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
    <rect x="427" y="224" width="52" height="38" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="453" y="248" text-anchor="middle">2</text>
    <rect x="479" y="224" width="52" height="38" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="505" y="248" text-anchor="middle">2</text>
    <rect x="531" y="224" width="52" height="38" fill="#fff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="557" y="248" text-anchor="middle">1</text>
  </g>

  <!-- ===== conclusion ===== -->
  <rect x="60" y="288" width="540" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="312" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">最大和 best = 3 （k = 2,3,4） → 得分 = m − best = 4 − 3 = 1</text>
  <text x="330" y="334" text-anchor="middle" font-size="12" fill="#555">取 k = 2：保留前缀 "b"（a=1）用 s[0..1]，保留后缀 "aa"（b=2）用 s[2..6]，删中间 "z"</text>

  <text x="120" y="378" font-size="11" fill="#446688">pre：仅 s[1]='b' 匹配 t[0]='b'，'z' 不在 s 中 → 前缀最长 1</text>
  <text x="120" y="398" font-size="11" fill="#4a7a3a">suf：右→左 s[6]='a'、s[4]='a' 依次匹配 t 末尾 "aa" → 后缀最长 2</text>
</svg>
