<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：交换按「次数」计，两次相抵</text>

  <!-- ===================== 两条规则 ===================== -->
  <g filter="url(#rough2)">
    <rect x="28" y="42" width="244" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="288" y="42" width="244" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <g filter="url(#rough2)" text-anchor="middle">
    <text x="150" y="63" font-size="12" fill="#33506b" font-weight="bold">规则① 分数为奇数</text>
    <text x="150" y="80" font-size="10" fill="#557">nums[i] mod 2 == 1</text>
    <text x="150" y="96" font-size="10" fill="#557">→ 主动 / 被动互换一次</text>
    <text x="410" y="63" font-size="12" fill="#2f5d24" font-weight="bold">规则② 每第 6 场</text>
    <text x="410" y="80" font-size="10" fill="#477">i mod 6 == 5（第 6、12、18…场）</text>
    <text x="410" y="96" font-size="10" fill="#477">→ 主动 / 被动互换一次</text>
  </g>

  <!-- ===================== 汇入计数 ===================== -->
  <g filter="url(#rough2)">
    <path d="M 150 106 L 178 122" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)"/>
    <path d="M 410 106 L 382 122" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)"/>
  </g>
  <g filter="url(#rough2)">
    <rect x="175" y="118" width="210" height="26" rx="13" fill="#ffffff" stroke="#888" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="280" y="135" text-anchor="middle" font-size="10.5" fill="#555">每场计数：k = ①命中 + ②命中</text>
  </g>
  <g filter="url(#rough2)">
    <path d="M 268 146 L 122 158" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)"/>
    <path d="M 280 146 V 158" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)"/>
    <path d="M 292 146 L 438 158" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)"/>
  </g>

  <!-- ===================== 三种结果 ===================== -->
  <g filter="url(#rough2)">
    <rect x="28" y="160" width="158" height="62" rx="6" fill="#f5f5f5" stroke="#888" stroke-width="1.5"/>
    <rect x="201" y="160" width="158" height="62" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="374" y="160" width="158" height="62" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <g filter="url(#rough2)" text-anchor="middle">
    <text x="107" y="181" font-size="11.5" fill="#555" font-weight="bold">命中 0 次</text>
    <text x="107" y="197" font-size="10" fill="#777">不换人，sign 保持</text>
    <text x="107" y="213" font-size="10" fill="#777">（多数普通场次）</text>
    <text x="280" y="181" font-size="11.5" fill="#33506b" font-weight="bold">命中 1 次</text>
    <text x="280" y="197" font-size="10" fill="#557">换人！sign 取反</text>
    <text x="280" y="213" font-size="10" fill="#557">（奇数 或 第 6 场）</text>
    <text x="453" y="181" font-size="11.5" fill="#8a3a34" font-weight="bold">命中 2 次</text>
    <text x="453" y="197" font-size="10" fill="#a05a52">抵消！sign 不变</text>
    <text x="453" y="213" font-size="10" fill="#a05a52">⚠️ 双重命中最易错</text>
  </g>

  <!-- ===================== 示例条 ===================== -->
  <g filter="url(#rough2)">
    <rect x="28" y="238" width="504" height="64" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.5" stroke-dasharray="6 3"/>
  </g>
  <g filter="url(#rough2)" text-anchor="middle">
    <text x="280" y="260" font-size="11" fill="#33506b" font-weight="bold">示例 2 第 5 场：nums[5] = 1 是奇数 ✓ 且 i mod 6 == 5 是第 6 场 ✓</text>
    <text x="280" y="277" font-size="10.5" fill="#557">规则①换一次 ＋ 规则②再换一次 → 两次相抵 → 玩家 2 仍是主动方，得 1 分</text>
    <text x="280" y="293" font-size="10" fill="#b85450">（写成「奇数或第 6 场 → 只换一次」会错换成玩家 1 得分，答案 4 → 6）</text>
  </g>

  <!-- ===================== 底部要点 ===================== -->
  <g filter="url(#rough2)">
    <rect x="28" y="316" width="504" height="70" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <g filter="url(#rough2)" text-anchor="middle">
    <text x="280" y="338" font-size="12" fill="#a07020" font-weight="bold">净交换 ⇔ （奇数）⊕（i mod 6 == 5）</text>
    <text x="280" y="356" font-size="10.5" fill="#a07020">只需一个符号位 sign = ±1：玩家 1 主动 → diff += x；玩家 2 主动 → diff −= x</text>
    <text x="280" y="373" font-size="10.5" fill="#a07020">一趟线性扫描累加即得分数差，无需分别累计两人总分</text>
  </g>
</svg>
