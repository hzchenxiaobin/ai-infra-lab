<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="640" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心：单索引 k 同步推进，word1[k] → word2[k]，尾部自动落位</text>
  <text x="320" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">两指针按位同步前进 → 合并成一个 k，交叠段与剩余段共用同一循环</text>

  <!-- k labels -->
  <g filter="url(#rough2)" font-size="10" fill="#aaa" text-anchor="middle">
    <text x="200" y="74">k=0</text>
    <text x="280" y="74">k=1</text>
    <text x="360" y="74">k=2</text>
    <text x="440" y="74">k=3</text>
  </g>

  <!-- word1 row: a, b, then dashed exhausted -->
  <text x="120" y="112" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">word1</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="172" y="90" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="200" y="111" fill="#d6a040" font-weight="bold">a</text>
    <rect x="252" y="90" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="280" y="111" fill="#d6a040" font-weight="bold">b</text>
    <rect x="332" y="90" width="56" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1.4" stroke-dasharray="4 3" rx="4"/>
    <text x="360" y="111" fill="#bbb">·</text>
    <rect x="412" y="90" width="56" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1.4" stroke-dasharray="4 3" rx="4"/>
    <text x="440" y="111" fill="#bbb">·</text>
  </g>
  <text x="510" y="111" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">n1 = 2</text>

  <!-- word2 row: p q r s -->
  <text x="120" y="172" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">word2</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="172" y="150" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="200" y="171" fill="#4a7a3a" font-weight="bold">p</text>
    <rect x="252" y="150" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="280" y="171" fill="#4a7a3a" font-weight="bold">q</text>
    <rect x="332" y="150" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="360" y="171" fill="#4a7a3a" font-weight="bold">r</text>
    <rect x="412" y="150" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="440" y="171" fill="#4a7a3a" font-weight="bold">s</text>
  </g>
  <text x="510" y="171" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">n2 = 4</text>

  <!-- merge zone arrow -->
  <path d="M 320 188 L 320 212" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="345" y="204" font-size="9.5" fill="#888" filter="url(#rough2)">逐 k 轮取</text>

  <!-- result row: a p b q r s colored by source -->
  <text x="80" y="262" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">结果</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="145" y="240" width="50" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="170" y="261" fill="#d6a040" font-weight="bold">a</text>
    <text x="170" y="288" font-size="8.5" fill="#aaa">①</text>

    <rect x="205" y="240" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="230" y="261" fill="#4a7a3a" font-weight="bold">p</text>
    <text x="230" y="288" font-size="8.5" fill="#aaa">②</text>

    <rect x="265" y="240" width="50" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="290" y="261" fill="#d6a040" font-weight="bold">b</text>
    <text x="290" y="288" font-size="8.5" fill="#aaa">③</text>

    <rect x="325" y="240" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="350" y="261" fill="#4a7a3a" font-weight="bold">q</text>
    <text x="350" y="288" font-size="8.5" fill="#aaa">④</text>

    <rect x="385" y="240" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="410" y="261" fill="#4a7a3a" font-weight="bold">r</text>
    <text x="410" y="288" font-size="8.5" fill="#aaa">⑤</text>

    <rect x="445" y="240" width="50" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="470" y="261" fill="#4a7a3a" font-weight="bold">s</text>
    <text x="470" y="288" font-size="8.5" fill="#aaa">⑥</text>
  </g>

  <!-- bottom note -->
  <rect x="60" y="306" width="520" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="328" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">k &lt; n1 才取 word1[k]，k &lt; n2 才取 word2[k]</text>
  <text x="320" y="348" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">交叠段（k=0,1）两取，剩余段（k=2,3）只取未耗尽的一方 → 一个循环搞定</text>
</svg>
