<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：操作只能「清位」</text>
  <text x="270" y="44" text-anchor="middle" font-size="10.5" fill="#888">nums[i] AND (nums[i] XOR x) ⟹ v_i 的 1 位 ⊆ nums[i] 的 1 位（submask）</text>

  <!-- bit index header -->
  <text x="180" y="76" text-anchor="end" font-size="10" fill="#888">数值</text>
  <text x="210" y="76" text-anchor="middle" font-size="10" fill="#888">bit3</text>
  <text x="250" y="76" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">bit2★</text>
  <text x="290" y="76" text-anchor="middle" font-size="10" fill="#888">bit1</text>
  <text x="330" y="76" text-anchor="middle" font-size="10" fill="#888">bit0</text>

  <!-- bit2 frozen-0 band across reachable rows -->
  <rect x="230" y="84" width="40" height="124" fill="#fff8e1" stroke="none" filter="url(#rough2)"/>

  <!-- nums[i] = 11 = 1 0 1 1 -->
  <text x="180" y="106" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">nums[i]=11</text>
  <rect x="190" y="90" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="109" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="230" y="90" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="109" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">0</text>
  <rect x="270" y="90" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="109" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="310" y="90" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="330" y="109" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- arrow down with operation label -->
  <path d="M270 120 L270 138" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="356" y="132" text-anchor="middle" font-size="10" fill="#888">AND (任意 y)</text>

  <!-- reachable submasks label -->
  <text x="180" y="156" text-anchor="end" font-size="10.5" fill="#4a7a3a" font-weight="bold">可达 v_i</text>

  <!-- submask row A: 1011 = 11 (不动) -->
  <rect x="190" y="142" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="210" y="160" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="230" y="142" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="250" y="160" text-anchor="middle" font-size="12" fill="#b85450">0</text>
  <rect x="270" y="142" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="290" y="160" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="310" y="142" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="330" y="160" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="392" y="160" text-anchor="start" font-size="10.5" fill="#888">= 11（全留）</text>

  <!-- submask row B: 0011 = 3 (清 bit3) -->
  <rect x="190" y="172" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="210" y="190" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="230" y="172" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="250" y="190" text-anchor="middle" font-size="12" fill="#b85450">0</text>
  <rect x="270" y="172" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="290" y="190" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="310" y="172" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="330" y="190" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="392" y="190" text-anchor="start" font-size="10.5" fill="#888">= 3（清 bit3）</text>

  <!-- submask row C: 1000 = 8 (清 bit1,bit0) -->
  <rect x="190" y="202" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="210" y="220" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="230" y="202" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="250" y="220" text-anchor="middle" font-size="12" fill="#b85450">0</text>
  <rect x="270" y="202" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="290" y="220" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="310" y="202" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="330" y="220" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="392" y="220" text-anchor="start" font-size="10.5" fill="#888">= 8（清 bit1,0）</text>

  <!-- bracket for frozen bit2 -->
  <path d="M232 230 L232 238 L268 238 L268 230" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="250" y="254" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">bit2 恒 0（被继承）</text>

  <!-- impossible: 1101 = 13, bit2 试图 0->1 -->
  <text x="180" y="288" text-anchor="end" font-size="10.5" fill="#b85450" font-weight="bold">不可达</text>
  <rect x="190" y="272" width="40" height="26" fill="#eee" stroke="#bbb" stroke-width="1.3" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="210" y="290" text-anchor="middle" font-size="12" fill="#999">1</text>
  <rect x="230" y="272" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="290" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <rect x="270" y="272" width="40" height="26" fill="#eee" stroke="#bbb" stroke-width="1.3" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="290" y="290" text-anchor="middle" font-size="12" fill="#999">0</text>
  <rect x="310" y="272" width="40" height="26" fill="#eee" stroke="#bbb" stroke-width="1.3" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="330" y="290" text-anchor="middle" font-size="12" fill="#999">1</text>
  <text x="392" y="290" text-anchor="start" font-size="10.5" fill="#b85450" font-weight="bold">✗ bit2 不能 0→1</text>

  <!-- conclusion box -->
  <rect x="40" y="312" width="460" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="334" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">XOR 逐位独立：结果 bit b 可为 1 ⟺ 某 nums[i] 该位为 1</text>
  <text x="270" y="354" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">⟹ 最大异或和 = 全员按位 OR</text>
</svg>
