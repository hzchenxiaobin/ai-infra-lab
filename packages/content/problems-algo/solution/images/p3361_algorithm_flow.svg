<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：O(52) 预处理 + O(n) 一遍扫描</text>

  <!-- 开始 -->
  <ellipse cx="260" cy="52" rx="42" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="56.5" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M 260 68 L 260 80" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 预处理 -->
  <rect x="140" y="82" width="240" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="101" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">预处理 nextPre / prevPre（长 53，cost 铺两遍）</text>
  <path d="M 260 112 L 260 124" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环菱形 -->
  <polygon points="260,126 328,158 260,190 192,158" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="162" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">i &lt; n ?</text>

  <!-- 否分支：返回 -->
  <path d="M 328 158 L 372 158" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="344" y="150" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">否</text>
  <rect x="374" y="142" width="130" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="439" y="156" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 ans</text>
  <text x="439" y="169" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">（long long）</text>

  <!-- 是分支 -->
  <path d="M 260 190 L 260 204" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="202" font-size="10" fill="#666" filter="url(#rough2)">是</text>

  <rect x="135" y="206" width="250" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="220" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">a = s[i]−'a'，b = t[i]−'a'</text>
  <text x="260" y="234" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">fd = (b−a) mod 26，bd = (a−b) mod 26</text>
  <path d="M 260 240 L 260 252" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="135" y="254" width="250" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="272" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">fwd = nextPre[a+fd] − nextPre[a]（顺时针代价）</text>
  <path d="M 260 282 L 260 292" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="135" y="294" width="250" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="312" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">bwd = prevPre[b+bd+1] − prevPre[b+1]（逆时针）</text>
  <path d="M 260 322 L 260 332" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="135" y="334" width="250" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="352" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">ans += min(fwd, bwd)　　i += 1</text>

  <!-- 回环箭头 -->
  <path d="M 135 348 L 96 348 L 96 158 L 188 158" fill="none" stroke="#a07830" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 底部提醒 -->
  <rect x="24" y="370" width="472" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="260" y="386" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">⚠ 累加器必须 long long：单步最贵 26×10⁹，总代价可达 26×10⁹×10⁵ ≈ 2.6×10¹⁵</text>
</svg>
