<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">核心：跳过休息 = 不等整点；用「距离 = 速度×时间」规避浮点</text>

  <text x="40" y="50" font-size="11" fill="#888" filter="url(#rough2)">示例 dist=[1,3,2], speed=4, hoursBefore=2</text>

  <!-- ===== Row 1: No skip (0 skips) ===== -->
  <text x="40" y="78" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">不跳过 (0 skips)</text>

  <!-- Time axis for row 1 -->
  <line x1="80" y1="96" x2="480" y2="96" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="9" fill="#888" text-anchor="middle">
    <line x1="80" y1="94" x2="80" y2="100" stroke="#888" stroke-width="1"/>
    <text x="80" y="112">0</text>
    <line x1="210" y1="94" x2="210" y2="100" stroke="#888" stroke-width="1"/>
    <text x="210" y="112">1</text>
    <line x1="340" y1="94" x2="340" y2="100" stroke="#888" stroke-width="1"/>
    <text x="340" y="112">2</text>
    <line x1="470" y1="94" x2="470" y2="100" stroke="#888" stroke-width="1"/>
    <text x="470" y="112">3</text>
  </g>

  <!-- Ride 0: [80, 113] dist=1, 1/4=0.25h -->
  <rect x="80" y="64" width="33" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="96" y="80" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">1/4</text>

  <!-- Wait 0: [113, 210] -->
  <rect x="113" y="64" width="97" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4,3" rx="3" filter="url(#rough2)"/>
  <text x="161" y="80" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">等→1h</text>

  <!-- Ride 1: [210, 308] dist=3, 3/4=0.75h -->
  <rect x="210" y="64" width="98" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="259" y="80" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">3/4</text>

  <!-- Wait 1: [308, 340] -->
  <rect x="308" y="64" width="32" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4,3" rx="3" filter="url(#rough2)"/>
  <text x="324" y="80" text-anchor="middle" font-size="8" fill="#d6a040" filter="url(#rough2)">等</text>

  <!-- Ride 2 (last): [340, 405] dist=2, 2/4=0.5h -->
  <rect x="340" y="64" width="65" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="372" y="80" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2/4</text>

  <!-- Total time for row 1 -->
  <text x="415" y="78" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">= 2.5h ✗</text>

  <!-- ===== Row 2: Skip rest 0 (1 skip) ===== -->
  <text x="40" y="148" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">跳过休息0 (1 skip)</text>

  <!-- Time axis for row 2 -->
  <line x1="80" y1="166" x2="480" y2="166" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="9" fill="#888" text-anchor="middle">
    <line x1="80" y1="164" x2="80" y2="170" stroke="#888" stroke-width="1"/>
    <text x="80" y="182">0</text>
    <line x1="210" y1="164" x2="210" y2="170" stroke="#888" stroke-width="1"/>
    <text x="210" y="182">1</text>
    <line x1="340" y1="164" x2="340" y2="170" stroke="#888" stroke-width="1"/>
    <text x="340" y="182">2</text>
  </g>

  <!-- Ride 0: [80, 113] -->
  <rect x="80" y="134" width="33" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="96" y="150" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">1/4</text>

  <!-- Skipped rest 0: crossed out -->
  <rect x="113" y="134" width="97" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4,3" rx="3" filter="url(#rough2)"/>
  <line x1="118" y1="138" x2="205" y2="154" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="161" y="150" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">跳过!</text>

  <!-- Ride 1: [113, 210] starts immediately -->
  <rect x="113" y="134" width="97" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" opacity="0" filter="url(#rough2)"/>

  <!-- Actually ride 1 after skip: starts at 0.25h = x113, takes 0.75h → ends at 1.0h = x210 -->
  <!-- Already drawn above (the skip box), let me redo -->
  <!-- Ride 1 actual: [113, 210] but we drew skip box there. Let me use a different approach -->
  <!-- Ride 1 continues from 113 to 210 -->
  <rect x="113" y="134" width="97" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="161" y="150" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">3/4=0.75</text>

  <!-- Wait 1: [210, 210] - no wait needed, already at integer -->
  <text x="225" y="148" font-size="9" fill="#d6a040" filter="url(#rough2)">⌈1.0⌉=1.0</text>

  <!-- Ride 2 (last): [210, 275] -->
  <rect x="210" y="134" width="65" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="242" y="150" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2/4</text>

  <!-- Total time for row 2 -->
  <text x="285" y="148" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">= 1.5h ✓</text>

  <!-- ===== Formula box ===== -->
  <rect x="40" y="200" width="480" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="222" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">用「距离」替代「时间」（dist = speed × time，全程整数运算）</text>
  <text x="280" y="242" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">不跳过：dp[i][j] = ⌈dp[i−1][j] / speed⌉ × speed + dist[i]</text>
  <text x="280" y="260" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">跳过：dp[i][j] = dp[i−1][j−1] + dist[i]</text>

  <!-- ===== Distance tracking illustration ===== -->
  <text x="40" y="294" font-size="11" fill="#888" font-weight="bold" filter="url(#rough2)">距离演化（speed=4）：</text>

  <!-- No skip row -->
  <g filter="url(#rough2)">
    <text x="50" y="316" font-size="10" fill="#b85450">0 skip:</text>
    <rect x="110" y="304" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="130" y="319" text-anchor="middle" font-size="10" fill="#333">1</text>
    <text x="158" y="319" font-size="10" fill="#888">→⌈1/4⌉×4+3→</text>
    <rect x="250" y="304" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="270" y="319" text-anchor="middle" font-size="10" fill="#333">7</text>
    <text x="298" y="319" font-size="10" fill="#888">→⌈7/4⌉×4+2→</text>
    <rect x="390" y="304" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="410" y="319" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">10</text>
    <text x="440" y="319" font-size="10" fill="#b85450">=2.5h ✗</text>
  </g>

  <!-- 1 skip row -->
  <g filter="url(#rough2)">
    <text x="50" y="352" font-size="10" fill="#4a7a3a">1 skip:</text>
    <rect x="110" y="340" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="130" y="355" text-anchor="middle" font-size="10" fill="#333">1</text>
    <text x="158" y="355" font-size="10" fill="#4a7a3a">→ 1+3 →</text>
    <rect x="230" y="340" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="250" y="355" text-anchor="middle" font-size="10" fill="#333">4</text>
    <text x="278" y="355" font-size="10" fill="#888">→⌈4/4⌉×4+2→</text>
    <rect x="390" y="340" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="410" y="355" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">6</text>
    <text x="440" y="355" font-size="10" fill="#4a7a3a">=1.5h ✓</text>
  </g>

  <!-- Key insight box -->
  <rect x="40" y="372" width="480" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="387" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">dp 值始终为整数 ⇒ 100×dp[j] ≤ round(hour×100)×speed 精确比较</text>
</svg>
