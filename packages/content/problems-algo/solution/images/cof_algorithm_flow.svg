<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：JOIN → GROUP BY → HAVING 双条件</text>

  <!-- Step 1: JOIN -->
  <rect x="180" y="48" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① JOIN 三表</text>
  <text x="280" y="84" text-anchor="middle" font-size="10" fill="#666">Customers ⨝ Orders ⨝ Product</text>

  <path d="M 280 92 L 280 108" stroke="#666" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: compute amount -->
  <rect x="180" y="110" width="200" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="130" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">② 计算每行金额</text>
  <text x="280" y="146" text-anchor="middle" font-size="10" fill="#666">amount = quantity × price</text>

  <path d="M 280 154 L 280 170" stroke="#666" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: GROUP BY -->
  <rect x="160" y="172" width="240" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="192" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">③ GROUP BY customer_id</text>
  <text x="280" y="208" text-anchor="middle" font-size="10" fill="#666">按客户折叠，SUM 聚合总金额</text>

  <path d="M 280 216 L 280 232" stroke="#666" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: HAVING (decision diamond) -->
  <polygon points="280,234 400,274 280,314 160,274" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="266" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">④ HAVING</text>
  <text x="280" y="282" text-anchor="middle" font-size="10" fill="#333">SUM(amount) ≥ 100</text>
  <text x="280" y="298" text-anchor="middle" font-size="10" fill="#333">AND</text>
  <text x="280" y="312" text-anchor="middle" font-size="10" fill="#333">有 6 月订单?</text>

  <!-- Yes branch -->
  <path d="M 400 274 L 460 274" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="268" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">YES</text>

  <rect x="420" y="286" width="120" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="480" y="308" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">输出该客户</text>

  <!-- No branch -->
  <path d="M 160 274 L 100 274" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="130" y="268" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">NO</text>

  <rect x="40" y="286" width="120" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="100" y="308" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">丢弃</text>

  <!-- Bottom note -->
  <rect x="60" y="346" width="440" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="364" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">HAVING 与 WHERE 的区别</text>
  <text x="280" y="380" text-anchor="middle" font-size="10" fill="#666">WHERE 过滤行（JOIN 前），HAVING 过滤组（GROUP BY 后）</text>
</svg>
