<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    Nim 和 = 所有堆大小按位异或 ⊕
  </text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">
    示例 piles = [1, 2, 3]
  </text>

  <line x1="290" y1="60" x2="290" y2="220" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <text x="110" y="78" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">石堆</text>

  <text x="70" y="78" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">堆1</text>
  <circle cx="70" cy="185" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="110" y="78" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">堆2</text>
  <circle cx="110" cy="185" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="110" cy="167" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="150" y="78" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">堆3</text>
  <circle cx="150" cy="185" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="150" cy="167" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="150" cy="149" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <line x1="45" y1="198" x2="175" y2="198" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="70" y="215" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>
  <text x="110" y="215" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">2</text>
  <text x="150" y="215" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">3</text>

  <text x="400" y="78" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">按位异或</text>

  <text x="358" y="105" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">4</text>
  <text x="388" y="105" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="418" y="105" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>

  <text x="335" y="125" text-anchor="end" font-size="11" fill="#446688" filter="url(#rough2)">1 =</text>
  <text x="358" y="125" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">0</text>
  <text x="388" y="125" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">0</text>
  <text x="418" y="125" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>

  <text x="335" y="145" text-anchor="end" font-size="11" fill="#446688" filter="url(#rough2)">2 =</text>
  <text x="358" y="145" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">0</text>
  <text x="388" y="145" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>
  <text x="418" y="145" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">0</text>

  <text x="335" y="165" text-anchor="end" font-size="11" fill="#446688" filter="url(#rough2)">3 =</text>
  <text x="358" y="165" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">0</text>
  <text x="388" y="165" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>
  <text x="418" y="165" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>

  <line x1="345" y1="175" x2="435" y2="175" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="335" y="193" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">⊕ =</text>
  <text x="358" y="193" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="388" y="193" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="418" y="193" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="450" y="193" font-size="11" fill="#b85450" filter="url(#rough2)">= 0</text>

  <rect x="40" y="245" width="230" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="155" y="268" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">Nim 和 = 0</text>
  <text x="155" y="288" text-anchor="middle" font-size="11" fill="#7a3a38" filter="url(#rough2)">必败态 P → 后手赢</text>

  <rect x="290" y="245" width="230" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="405" y="268" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">Nim 和 ≠ 0</text>
  <text x="405" y="288" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">必胜态 N → 先手赢</text>

  <rect x="40" y="328" width="480" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="352" text-anchor="middle" font-size="11" fill="#7a5a20" filter="url(#rough2)">
    [1,2,3] 异或 = 0 → Alice 必败 → 返回 false
  </text>
</svg>
