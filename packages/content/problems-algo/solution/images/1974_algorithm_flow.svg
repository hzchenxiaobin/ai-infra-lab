<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：遍历 word，逐字符算最短移动 + 键入</text>

  <!-- ===== Start ===== -->
  <rect x="200" y="40" width="140" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始</text>
  <path d="M 270 70 L 270 82" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Init ===== -->
  <rect x="180" y="84" width="180" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="104" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">total = 0,  cur = 0  (指向 'a')</text>
  <path d="M 270 114 L 270 126" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Loop container ===== -->
  <rect x="50" y="128" width="440" height="270" rx="10" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="270" y="146" text-anchor="middle" font-size="11" fill="#888" font-style="italic">对每个字符 c ∈ word 重复</text>

  <!-- Step 1: target = pos(c) -->
  <rect x="190" y="158" width="160" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="176" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">target = pos(c) = c − 'a'</text>
  <path d="M 270 186 L 270 198" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: diff -->
  <rect x="190" y="200" width="160" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="218" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">diff = |target − cur|</text>
  <path d="M 270 228 L 270 240" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: moves = min(diff, 26-diff) — highlighted -->
  <rect x="170" y="242" width="200" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="270" y="260" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">moves = min(diff, 26 − diff)</text>
  <path d="M 270 270 L 270 282" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: total += moves + 1 — highlighted -->
  <rect x="180" y="284" width="180" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="270" y="302" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">total += moves + 1  (键入)</text>
  <path d="M 270 312 L 270 324" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: cur = target -->
  <rect x="210" y="326" width="120" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="344" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">cur = target</text>
  <path d="M 270 354 L 270 366" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Next char -->
  <rect x="210" y="368" width="120" height="24" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="384" text-anchor="middle" font-size="11" fill="#555">下一个字符</text>

  <!-- Loop back arrow -->
  <path d="M 330 380 L 480 380 L 480 172 L 352 172" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="488" y="276" font-size="10" fill="#888" font-style="italic">循环</text>

  <!-- ===== Return ===== -->
  <path d="M 270 398 L 270 418" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="200" y="420" width="140" height="32" rx="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="441" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">return total</text>
</svg>
