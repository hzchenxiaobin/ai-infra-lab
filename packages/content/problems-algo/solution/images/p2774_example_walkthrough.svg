<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">示例演算</text>

  <!-- 三组示例 -->
  <text x="40" y="56" font-size="12" fill="#333" filter="url(#rough2)">① [3,4,5], target=5</text>
  <text x="230" y="56" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ 2 ✓</text>
  <text x="40" y="76" font-size="12" fill="#333" filter="url(#rough2)">② [1,4,5], target=2</text>
  <text x="230" y="76" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ −1 (无 2) ✗</text>
  <text x="40" y="96" font-size="12" fill="#333" filter="url(#rough2)">③ [3,4,6,6,6,6,7], target=6</text>
  <text x="290" y="96" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ 5 ✓</text>

  <!-- 分隔 -->
  <line x1="40" y1="112" x2="480" y2="112" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <text x="260" y="134" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">逐步演算示例 ③：target = 6</text>

  <!-- 数组常驻显示，idx 0..6, box w=44, start x=80 -->
  <text x="40" y="166" font-size="11" fill="#888" filter="url(#rough2)">数组</text>
  <rect x="80" y="150" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="102" y="172" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="124" y="150" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="146" y="172" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="168" y="150" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="172" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <rect x="212" y="150" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="234" y="172" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <rect x="256" y="150" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="278" y="172" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <rect x="300" y="150" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="322" y="172" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <rect x="344" y="150" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="366" y="172" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>

  <text x="80" y="200" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <text x="124" y="200" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="168" y="200" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <text x="212" y="200" font-size="10" fill="#888" filter="url(#rough2)">3</text>
  <text x="256" y="200" font-size="10" fill="#888" filter="url(#rough2)">4</text>
  <text x="300" y="200" font-size="10" fill="#888" filter="url(#rough2)">5</text>
  <text x="344" y="200" font-size="10" fill="#888" filter="url(#rough2)">6</text>

  <!-- 步骤表头 -->
  <text x="40" y="226" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">步</text>
  <text x="90" y="226" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">[left,right]</text>
  <text x="190" y="226" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">mid</text>
  <text x="240" y="226" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">this[mid]</text>
  <text x="330" y="226" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">动作</text>
  <text x="470" y="226" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">ans</text>

  <!-- step 1 -->
  <text x="40" y="250" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="90" y="250" font-size="11" fill="#333" filter="url(#rough2)">[0, 6]</text>
  <text x="190" y="250" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="240" y="250" font-size="11" fill="#d6a040" filter="url(#rough2)">6 == 6</text>
  <text x="330" y="250" font-size="11" fill="#b85450" filter="url(#rough2)">记录, left=4</text>
  <text x="470" y="250" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- step 2 -->
  <text x="40" y="274" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="90" y="274" font-size="11" fill="#333" filter="url(#rough2)">[4, 6]</text>
  <text x="190" y="274" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="240" y="274" font-size="11" fill="#d6a040" filter="url(#rough2)">6 == 6</text>
  <text x="330" y="274" font-size="11" fill="#b85450" filter="url(#rough2)">记录, left=6</text>
  <text x="470" y="274" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>

  <!-- step 3 -->
  <text x="40" y="298" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="90" y="298" font-size="11" fill="#333" filter="url(#rough2)">[6, 6]</text>
  <text x="190" y="298" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <text x="240" y="298" font-size="11" fill="#446688" filter="url(#rough2)">7 &gt; 6</text>
  <text x="330" y="298" font-size="11" fill="#446688" filter="url(#rough2)">right=5</text>
  <text x="470" y="298" font-size="11" fill="#888" filter="url(#rough2)">5</text>

  <!-- step 4 -->
  <text x="40" y="322" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="90" y="322" font-size="11" fill="#b85450" filter="url(#rough2)">6 &gt; 5</text>
  <text x="190" y="322" font-size="11" fill="#888" filter="url(#rough2)">—</text>
  <text x="240" y="322" font-size="11" fill="#888" filter="url(#rough2)">退出循环</text>
  <text x="330" y="322" font-size="11" fill="#4a7a3a" filter="url(#rough2)">return ans</text>
  <text x="470" y="322" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5 ✓</text>

  <line x1="40" y1="336" x2="500" y2="336" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- 总结 -->
  <text x="40" y="360" font-size="12" fill="#333" filter="url(#rough2)">每次 this[mid] == target 就记录并继续往右搜（left = mid+1）,</text>
  <text x="40" y="380" font-size="12" fill="#333" filter="url(#rough2)">最终 ans 落在最右一次命中处 = 5。</text>
  <text x="40" y="410" font-size="12" fill="#b85450" filter="url(#rough2)">示例 ② target=2 不在数组中：全程无 == 命中，ans 始终为 −1。</text>
</svg>
