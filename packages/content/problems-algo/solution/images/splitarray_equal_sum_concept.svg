<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：i, j, k 三个切点把数组分成 4 段和相等的子数组</text>

  <!-- part brackets above -->
  <text x="118" y="62" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">Part1</text>
  <text x="218" y="62" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">Part2</text>
  <text x="318" y="62" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">Part3</text>
  <text x="418" y="62" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">Part4</text>

  <path d="M 100 70 Q 100 78 108 78 L 128 78 Q 136 78 136 70" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 200 70 Q 200 78 208 78 L 228 78 Q 236 78 236 70" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 300 70 Q 300 78 308 78 L 328 78 Q 336 78 336 70" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 400 70 Q 400 78 408 78 L 428 78 Q 436 78 436 70" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <text x="118" y="94" text-anchor="middle" font-size="10" fill="#4a7a3a">sum=1</text>
  <text x="218" y="94" text-anchor="middle" font-size="10" fill="#4a7a3a">sum=1</text>
  <text x="318" y="94" text-anchor="middle" font-size="10" fill="#4a7a3a">sum=1</text>
  <text x="418" y="94" text-anchor="middle" font-size="10" fill="#4a7a3a">sum=1</text>

  <!-- array boxes -->
  <rect x="100" y="108" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="130" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <rect x="150" y="108" width="36" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="168" y="130" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2</text>

  <rect x="200" y="108" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="130" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <rect x="250" y="108" width="36" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="268" y="130" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2</text>

  <rect x="300" y="108" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="318" y="130" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <rect x="350" y="108" width="36" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="368" y="130" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2</text>

  <rect x="400" y="108" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="418" y="130" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <!-- index labels -->
  <text x="118" y="158" text-anchor="middle" font-size="9.5" fill="#aaa">0</text>
  <text x="168" y="158" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">1</text>
  <text x="218" y="158" text-anchor="middle" font-size="9.5" fill="#aaa">2</text>
  <text x="268" y="158" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">3</text>
  <text x="318" y="158" text-anchor="middle" font-size="9.5" fill="#aaa">4</text>
  <text x="368" y="158" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">5</text>
  <text x="418" y="158" text-anchor="middle" font-size="9.5" fill="#aaa">6</text>

  <!-- cut labels -->
  <text x="168" y="178" text-anchor="middle" font-size="10" fill="#b85450">i=1 切点</text>
  <text x="268" y="178" text-anchor="middle" font-size="10" fill="#b85450">j=3 切点</text>
  <text x="368" y="178" text-anchor="middle" font-size="10" fill="#b85450">k=5 切点</text>

  <!-- 4 parts formulas -->
  <text x="20" y="208" font-size="11" fill="#888">四段和：</text>
  <rect x="30" y="218" width="480" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="240" text-anchor="middle" font-size="11.5" fill="#333">sum(0, i−1) = sum(i+1, j−1) = sum(j+1, k−1) = sum(k+1, n−1)</text>
  <text x="270" y="260" text-anchor="middle" font-size="11" fill="#555">切点 i, j, k 处的元素被排除（不参与任何一段）</text>

  <!-- constraints box -->
  <rect x="30" y="290" width="480" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="310" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">约束：0 &lt; i,  i+1 &lt; j,  j+1 &lt; k &lt; n−1</text>
  <text x="270" y="328" text-anchor="middle" font-size="10.5" fill="#888">即 i ≥ 1, j ≥ i+2, k ≥ j+2, k ≤ n−2（四段均非空）</text>

  <rect x="30" y="346" width="480" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="270" y="364" text-anchor="middle" font-size="11" fill="#4a7a3a">关键：固定中间切点 j，左、右两侧独立用前缀和 + 哈希表求解</text>
</svg>
