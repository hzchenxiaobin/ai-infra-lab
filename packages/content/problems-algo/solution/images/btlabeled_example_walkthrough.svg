<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：后序 DFS 逐节点频率合并</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">访问顺序：4 → 5 → 1 → 3 → 6 → 2 → 0</text>

  <!-- Tree structure (compact) -->
  <!-- Edges -->
  <path d="M 280 72 L 190 110" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 280 72 L 370 110" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 190 128 L 140 166" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 190 128 L 240 166" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 370 128 L 320 166" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 370 128 L 420 166" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>

  <!-- Nodes with labels -->
  <circle cx="280" cy="64" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">0</text>
  <text x="280" y="74" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">a</text>

  <circle cx="190" cy="118" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="116" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">1</text>
  <text x="190" y="127" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">b</text>

  <circle cx="370" cy="118" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="370" y="116" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">2</text>
  <text x="370" y="127" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">e</text>

  <circle cx="140" cy="172" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="170" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">4</text>
  <text x="140" y="181" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">a</text>

  <circle cx="240" cy="172" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="170" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">5</text>
  <text x="240" y="181" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">d</text>

  <circle cx="320" cy="172" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="170" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">3</text>
  <text x="320" y="181" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">c</text>

  <circle cx="420" cy="172" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="420" y="170" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">6</text>
  <text x="420" y="181" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">d</text>

  <!-- Divider -->
  <path d="M 40 200 L 520 200" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Frequency table header -->
  <text x="280" y="220" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">各节点子树频率（只列非零字母）</text>

  <!-- Table -->
  <!-- Column headers -->
  <rect x="40" y="232" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="248" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">节点</text>
  <rect x="104" y="232" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="126" y="248" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">标签</text>
  <rect x="152" y="232" width="300" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="302" y="248" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">子树频率（非零字母）</text>
  <rect x="456" y="232" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="486" y="248" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">ans</text>

  <!-- Row: node 4 -->
  <rect x="40" y="260" width="60" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="275" text-anchor="middle" font-size="10" fill="#333">4</text>
  <rect x="104" y="260" width="44" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="126" y="275" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">a</text>
  <rect x="152" y="260" width="300" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="180" y="275" font-size="10" fill="#555">a:1</text>
  <text x="302" y="275" font-size="9.5" fill="#888">← 叶节点，只含自身</text>
  <rect x="456" y="260" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="486" y="275" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>

  <!-- Row: node 5 -->
  <rect x="40" y="284" width="60" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="299" text-anchor="middle" font-size="10" fill="#333">5</text>
  <rect x="104" y="284" width="44" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="126" y="299" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">d</text>
  <rect x="152" y="284" width="300" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="180" y="299" font-size="10" fill="#555">d:1</text>
  <rect x="456" y="284" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="486" y="299" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>

  <!-- Row: node 1 (merge 4,5) -->
  <rect x="40" y="308" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="70" y="323" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <rect x="104" y="308" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="126" y="323" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">b</text>
  <rect x="152" y="308" width="300" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="170" y="323" font-size="10" fill="#555">a:1 + b:1 + d:1</text>
  <text x="300" y="323" font-size="9.5" fill="#4a7a3a">← 合并子节点 4、5</text>
  <rect x="456" y="308" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="486" y="323" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>

  <!-- Row: node 3 -->
  <rect x="40" y="332" width="60" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="347" text-anchor="middle" font-size="10" fill="#333">3</text>
  <rect x="104" y="332" width="44" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="126" y="347" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">c</text>
  <rect x="152" y="332" width="300" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="180" y="347" font-size="10" fill="#555">c:1</text>
  <rect x="456" y="332" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="486" y="347" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>

  <!-- Row: node 6 -->
  <rect x="40" y="356" width="60" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="371" text-anchor="middle" font-size="10" fill="#333">6</text>
  <rect x="104" y="356" width="44" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="126" y="371" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">d</text>
  <rect x="152" y="356" width="300" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="180" y="371" font-size="10" fill="#555">d:1</text>
  <rect x="456" y="356" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="486" y="371" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>

  <!-- Row: node 2 (merge 3,6) -->
  <rect x="40" y="380" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="70" y="395" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
  <rect x="104" y="380" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="126" y="395" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">e</text>
  <rect x="152" y="380" width="300" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="170" y="395" font-size="10" fill="#555">c:1 + d:1 + e:1</text>
  <text x="290" y="395" font-size="9.5" fill="#4a7a3a">← 合并子节点 3、6</text>
  <rect x="456" y="380" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="486" y="395" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>

  <!-- Row: node 0 (merge 1,2) - highlighted -->
  <rect x="40" y="404" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="70" y="420" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">0</text>
  <rect x="104" y="404" width="44" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="126" y="420" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">a</text>
  <rect x="152" y="404" width="300" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="168" y="420" font-size="10" fill="#555" font-weight="bold">a:2 + b:1 + c:1 + d:2 + e:1</text>
  <text x="345" y="420" font-size="9.5" fill="#b85450" font-weight="bold">← 合并 1、2</text>
  <rect x="456" y="404" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="486" y="420" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>

  <!-- Final note -->
  <text x="280" y="448" text-anchor="middle" font-size="10.5" fill="#555">节点 0：合并子节点 1 的 {a:1,b:1,d:1} 和子节点 2 的 {c:1,d:1,e:1}，再加自身 'a' → a:2</text>
</svg>
