<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">时间线：先锚定首次阳性，再向右找首个阴性</text>

  <circle cx="150" cy="52" r="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="56" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">+</text>
  <text x="163" y="56" font-size="12" fill="#555" filter="url(#rough2)">阳性</text>
  <circle cx="225" cy="52" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="225" y="56" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">−</text>
  <text x="238" y="56" font-size="12" fill="#555" filter="url(#rough2)">阴性</text>
  <circle cx="300" cy="52" r="8" fill="#f5f5f5" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="56" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">?</text>
  <text x="313" y="56" font-size="12" fill="#555" filter="url(#rough2)">不确定（忽略）</text>
  <text x="517" y="84" font-size="10" fill="#999" filter="url(#rough2)">时间 →</text>

  <text x="45" y="99" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">Alice</text>
  <path d="M88 95 C 200 92, 380 98, 545 95" stroke="#bbb" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <ellipse cx="173" cy="95" rx="16" ry="15" fill="none" stroke="#d6a040" stroke-width="2.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <circle cx="173" cy="95" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="173" y="100" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">+</text>
  <ellipse cx="260" cy="95" rx="16" ry="15" fill="none" stroke="#d6a040" stroke-width="2.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <circle cx="260" cy="95" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="100" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">−</text>
  <path d="M186 80 Q 216 64 247 79" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="216" y="60" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">10 天</text>
  <text x="173" y="118" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">01-15</text>
  <text x="260" y="118" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">01-25</text>

  <text x="45" y="152" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">Bob</text>
  <path d="M88 148 C 200 145, 380 151, 545 148" stroke="#bbb" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <ellipse cx="321" cy="148" rx="16" ry="15" fill="none" stroke="#d6a040" stroke-width="2.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <circle cx="321" cy="148" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="321" y="153" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">+</text>
  <circle cx="356" cy="148" r="10" fill="#f5f5f5" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="356" y="153" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">?</text>
  <ellipse cx="417" cy="148" rx="16" ry="15" fill="none" stroke="#d6a040" stroke-width="2.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <circle cx="417" cy="148" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="417" y="153" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">−</text>
  <path d="M334 133 Q 369 117 404 132" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="369" y="112" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">11 天</text>
  <text x="321" y="171" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">02-01</text>
  <text x="356" y="171" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">02-05</text>
  <text x="417" y="171" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">02-12</text>
  <text x="356" y="185" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">（忽略）</text>

  <text x="45" y="205" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">Carol</text>
  <path d="M88 201 C 200 198, 380 204, 545 201" stroke="#bbb" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <circle cx="217" cy="201" r="10" fill="#e6f4ea" fill-opacity="0.5" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="217" y="206" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">−</text>
  <path d="M209 193 L225 209 M225 193 L209 209" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="217" y="186" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">阳性之前 ✗</text>
  <ellipse cx="400" cy="201" rx="16" ry="15" fill="none" stroke="#d6a040" stroke-width="2.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <circle cx="400" cy="201" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="206" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">+</text>
  <ellipse cx="487" cy="201" rx="16" ry="15" fill="none" stroke="#d6a040" stroke-width="2.5" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <circle cx="487" cy="201" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="487" y="206" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">−</text>
  <path d="M413 186 Q 448 170 476 185" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="445" y="164" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">10 天</text>
  <text x="217" y="224" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">01-20</text>
  <text x="400" y="224" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">02-10</text>
  <text x="487" y="224" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">02-20</text>

  <text x="45" y="258" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">David</text>
  <path d="M88 254 C 200 251, 380 257, 545 254" stroke="#bbb" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <circle cx="130" cy="254" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="130" y="259" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">+</text>
  <circle cx="200" cy="254" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="259" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">+</text>
  <text x="370" y="243" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">只有阳性，无后续阴性 → 出局</text>
  <text x="130" y="277" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">01-10</text>
  <text x="200" y="277" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">01-18</text>

  <text x="45" y="311" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">Emma</text>
  <path d="M88 307 C 200 304, 380 310, 545 307" stroke="#bbb" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <circle cx="443" cy="307" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="443" y="312" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">−</text>
  <circle cx="487" cy="307" r="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="487" y="312" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">−</text>
  <text x="250" y="296" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">只有阴性，从未阳性 → 出局</text>
  <text x="443" y="330" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">02-15</text>
  <text x="487" y="330" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">02-20</text>

  <rect x="75" y="350" width="410" height="64" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="373" text-anchor="middle" font-size="12" fill="#6b4f14" filter="url(#rough2)">① 每人先锚定首次阳性（橙虚线圈）</text>
  <text x="280" y="396" text-anchor="middle" font-size="12" fill="#6b4f14" filter="url(#rough2)">② 再向右找首个阴性（橙虚线圈）→ 差即康复天数</text>
</svg>
