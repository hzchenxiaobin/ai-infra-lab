<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="340" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">示例 1 演算：tasks=[1,2,1,2,3,1], space=3</text>

  <!-- table outline: y 48..270, header 30 + 6 rows * 32 = 222 -->
  <rect x="20" y="48" width="560" height="222" rx="6" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- column separators -->
  <line x1="60" y1="48" x2="60" y2="270" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="120" y1="48" x2="120" y2="270" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="190" y1="48" x2="190" y2="270" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="350" y1="48" x2="350" y2="270" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="420" y1="48" x2="420" y2="270" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- header row 48..78 -->
  <rect x="20" y="48" width="560" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="40" y="67" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">步</text>
  <text x="90" y="67" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">任务 t</text>
  <text x="155" y="67" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">进入时 day</text>
  <text x="270" y="67" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">判定（space=3）</text>
  <text x="385" y="67" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">完成日</text>
  <text x="500" y="67" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">last 更新 / day→</text>

  <!-- row separators: rows at top 78,110,142,174,206,238 -->
  <line x1="20" y1="78" x2="580" y2="78" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="20" y1="110" x2="580" y2="110" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="142" x2="580" y2="142" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="174" x2="580" y2="174" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="206" x2="580" y2="206" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="238" x2="580" y2="238" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- jump-row highlights: row3 (142..174) and row6 (238..270) -->
  <rect x="190" y="142" width="160" height="32" fill="#fff8e1" opacity="0.7" filter="url(#rough2)"/>
  <rect x="350" y="142" width="70" height="32" fill="#e6f4ea" opacity="0.7" filter="url(#rough2)"/>
  <rect x="190" y="238" width="160" height="32" fill="#fff8e1" opacity="0.7" filter="url(#rough2)"/>
  <rect x="350" y="238" width="70" height="32" fill="#e6f4ea" opacity="0.7" filter="url(#rough2)"/>

  <!-- row 1: t=1 (top 78, center 94) -->
  <text x="40" y="98" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="90" y="98" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="155" y="98" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="270" y="98" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">新任务（无 last）</text>
  <text x="385" y="98" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="500" y="98" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">last[1]=1；day→2</text>

  <!-- row 2: t=2 (top 110, center 126) -->
  <text x="40" y="130" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="90" y="130" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="155" y="130" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="270" y="130" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">新任务（无 last）</text>
  <text x="385" y="130" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="500" y="130" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">last[2]=2；day→3</text>

  <!-- row 3: t=1, jump (top 142, center 158) -->
  <text x="40" y="162" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="90" y="162" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="155" y="162" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="270" y="162" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3−1=2 ≤3，跳到 5</text>
  <text x="385" y="162" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="500" y="162" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">last[1]=5；day→6</text>

  <!-- row 4: t=2, no jump (top 174, center 190) -->
  <text x="40" y="194" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="90" y="194" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="155" y="194" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <text x="270" y="194" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">6−2=4 >3，直接做</text>
  <text x="385" y="194" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="500" y="194" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">last[2]=6；day→7</text>

  <!-- row 5: t=3 (top 206, center 222) -->
  <text x="40" y="226" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="90" y="226" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="155" y="226" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>
  <text x="270" y="226" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">新任务（无 last）</text>
  <text x="385" y="226" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="500" y="226" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">last[3]=7；day→8</text>

  <!-- row 6: t=1, jump (top 238, center 254) -->
  <text x="40" y="258" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <text x="90" y="258" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="155" y="258" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>
  <text x="270" y="258" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">8−5=3 ≤3，跳到 9</text>
  <text x="385" y="258" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="500" y="258" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">last[1]=9；day→10</text>

  <!-- result box (below table 270) -->
  <rect x="120" y="288" width="360" height="34" rx="8" fill="#b85450" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="309" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold" filter="url(#rough2)">返回 day − 1 = 10 − 1 = 9 ✓</text>
</svg>
