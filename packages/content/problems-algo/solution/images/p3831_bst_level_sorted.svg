<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrK" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#555"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="18" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：BST 的同一层从左到右天然升序</text>
  <text x="260" y="35" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">证明：同层的 u（左）、v（右）分居 LCA 两侧 ⇒ u &lt; LCA &lt; v，相邻对对成立 ⇒ 整层递增</text>

  <!-- Level labels -->
  <text x="46" y="96" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">第0层</text>
  <text x="46" y="162" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">第1层</text>
  <text x="46" y="228" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">第2层</text>

  <!-- Tree edges -->
  <line x1="165" y1="92" x2="112" y2="158" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="165" y1="92" x2="218" y2="158" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="112" y1="158" x2="78" y2="224" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="112" y1="158" x2="134" y2="224" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="218" y1="158" x2="190" y2="224" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="218" y1="158" x2="246" y2="224" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- LCA dashed path: 40 -> 50 -> 60 -->
  <path d="M 134 206 L 165 108 L 190 206" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="188" y="88" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">LCA</text>

  <!-- Tree nodes: level 0 -->
  <circle cx="165" cy="92" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="165" y="96" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">50</text>

  <!-- level 1 -->
  <circle cx="112" cy="158" r="13" fill="#f5f5f5" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="112" y="162" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">30</text>
  <circle cx="218" cy="158" r="13" fill="#f5f5f5" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="218" y="162" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">70</text>

  <!-- level 2 (target level) -->
  <circle cx="78" cy="224" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="78" y="228" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">20</text>
  <circle cx="134" cy="224" r="13" fill="#fff8e1" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="134" y="228" text-anchor="middle" font-size="11" fill="#223" font-weight="bold" filter="url(#rough2)">40</text>
  <circle cx="190" cy="224" r="13" fill="#fff8e1" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="190" y="228" text-anchor="middle" font-size="11" fill="#223" font-weight="bold" filter="url(#rough2)">60</text>
  <circle cx="246" cy="224" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="246" y="228" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">80</text>

  <!-- labels for u / v -->
  <text x="134" y="250" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">u</text>
  <text x="190" y="250" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">v</text>

  <!-- proof annotation -->
  <text x="160" y="270" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">u=40 在 LCA=50 的左子树，v=60 在右子树</text>
  <text x="160" y="285" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">⇒ 40 &lt; 50 &lt; 60</text>

  <!-- level ascending note -->
  <text x="160" y="308" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">第 2 层：20 &lt; 40 &lt; 60 &lt; 80 ✓ 天然升序</text>

  <!-- Right panel: upper median box -->
  <rect x="292" y="60" width="216" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="400" y="79" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">上中位数（upper median）</text>
  <text x="400" y="96" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">升序下标 ⌊k/2⌋ 处（0 起）</text>
  <text x="400" y="112" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">k=4：[20,40,60,80] → 取 <tspan fill="#b85450" font-weight="bold">60</tspan></text>
  <text x="400" y="128" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">k 为奇数时恰为正中间</text>

  <!-- Right panel: no-sort box -->
  <rect x="292" y="148" width="216" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="400" y="168" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">BFS 先左后右收集第 level 层</text>
  <text x="400" y="184" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">⇒ 层内天然有序，排序整体省掉</text>
  <text x="400" y="200" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">cur[k/2] 一次索引即中位数</text>

  <!-- Right panel: warning box -->
  <rect x="292" y="226" width="216" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="400" y="246" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠️ 前提：输入是有效 BST</text>
  <text x="400" y="262" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">普通二叉树层内无序，</text>
  <text x="400" y="278" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">须排序 / 快速选择</text>

  <!-- bottom note -->
  <text x="260" y="352" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">中序有序是 BST 的常识，「层序每一层也有序」是隐藏彩蛋——同层左右分居 LCA 两侧，整层被左小右大锁死</text>
</svg>
