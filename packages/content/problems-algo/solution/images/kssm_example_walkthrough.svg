<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：matrix = [[1,5,9],[10,11,13],[12,13,15]]，k = 8</text>

  <!-- header row -->
  <rect x="60" y="40" width="60" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="90" y="57" text-anchor="middle" font-size="11" fill="#888">步骤</text>
  <rect x="124" y="40" width="110" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="179" y="57" text-anchor="middle" font-size="11" fill="#888">弹出 (val, r, c)</text>
  <rect x="238" y="40" width="140" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="308" y="57" text-anchor="middle" font-size="11" fill="#888">同行入堆</text>
  <rect x="382" y="40" width="118" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="441" y="57" text-anchor="middle" font-size="11" fill="#888">堆内候选</text>

  <!-- step 1 -->
  <rect x="60" y="68" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="90" y="86" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="124" y="68" width="110" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="179" y="86" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1, (0,0)</text>
  <rect x="238" y="68" width="140" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="308" y="86" text-anchor="middle" font-size="11" fill="#333">5, (0,1)</text>
  <rect x="382" y="68" width="118" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="441" y="86" text-anchor="middle" font-size="11" fill="#333">{5,10,12}</text>

  <!-- step 2 -->
  <rect x="60" y="98" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="90" y="116" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="124" y="98" width="110" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="179" y="116" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5, (0,1)</text>
  <rect x="238" y="98" width="140" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="308" y="116" text-anchor="middle" font-size="11" fill="#333">9, (0,2)</text>
  <rect x="382" y="98" width="118" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="441" y="116" text-anchor="middle" font-size="11" fill="#333">{9,10,12}</text>

  <!-- step 3 (row 0 exhausted) -->
  <rect x="60" y="128" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="90" y="146" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="124" y="128" width="110" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="179" y="146" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">9, (0,2)</text>
  <rect x="238" y="128" width="140" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="308" y="146" text-anchor="middle" font-size="10" fill="#888">行0耗尽，不补</text>
  <rect x="382" y="128" width="118" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="441" y="146" text-anchor="middle" font-size="11" fill="#333">{10,12}</text>

  <!-- step 4 -->
  <rect x="60" y="158" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="90" y="176" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="124" y="158" width="110" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="179" y="176" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">10, (1,0)</text>
  <rect x="238" y="158" width="140" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="308" y="176" text-anchor="middle" font-size="11" fill="#333">11, (1,1)</text>
  <rect x="382" y="158" width="118" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="441" y="176" text-anchor="middle" font-size="11" fill="#333">{11,12}</text>

  <!-- step 5 -->
  <rect x="60" y="188" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="90" y="206" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="124" y="188" width="110" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="179" y="206" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">11, (1,1)</text>
  <rect x="238" y="188" width="140" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="308" y="206" text-anchor="middle" font-size="11" fill="#333">13, (1,2)</text>
  <rect x="382" y="188" width="118" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="441" y="206" text-anchor="middle" font-size="11" fill="#333">{12,13}</text>

  <!-- step 6 -->
  <rect x="60" y="218" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="90" y="236" text-anchor="middle" font-size="11" fill="#333">6</text>
  <rect x="124" y="218" width="110" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="179" y="236" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">12, (2,0)</text>
  <rect x="238" y="218" width="140" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="308" y="236" text-anchor="middle" font-size="11" fill="#333">13, (2,1)</text>
  <rect x="382" y="218" width="118" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="441" y="236" text-anchor="middle" font-size="11" fill="#333">{13,13}</text>

  <!-- step 7 (row 1 exhausted) -->
  <rect x="60" y="248" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="90" y="266" text-anchor="middle" font-size="11" fill="#333">7</text>
  <rect x="124" y="248" width="110" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="179" y="266" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">13, (1,2)</text>
  <rect x="238" y="248" width="140" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="308" y="266" text-anchor="middle" font-size="10" fill="#888">行1耗尽，不补</text>
  <rect x="382" y="248" width="118" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="441" y="266" text-anchor="middle" font-size="11" fill="#333">{13}</text>

  <!-- step 8 (answer) -->
  <rect x="60" y="278" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="90" y="298" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">8</text>
  <rect x="124" y="278" width="110" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.6" rx="4" filter="url(#rough2)"/>
  <text x="179" y="298" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">13, (2,1)</text>
  <rect x="238" y="278" width="140" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="308" y="298" text-anchor="middle" font-size="10" fill="#888">—</text>
  <rect x="382" y="278" width="118" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="441" y="298" text-anchor="middle" font-size="10" fill="#888">空</text>

  <!-- sorted sequence -->
  <rect x="60" y="328" width="440" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="348" text-anchor="middle" font-size="12" fill="#444">弹出的有序序列（按弹出先后）：</text>
  <text x="280" y="364" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1 → 5 → 9 → 10 → 11 → 13 → 13 → 13</text>

  <!-- final answer -->
  <rect x="60" y="384" width="440" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="408" text-anchor="middle" font-size="13" fill="#444">第 k = 8 次弹出即第 8 小元素</text>
  <text x="280" y="430" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">answer = 13  ✓</text>
</svg>
