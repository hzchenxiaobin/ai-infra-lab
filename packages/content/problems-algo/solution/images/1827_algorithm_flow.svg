<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：从左到右贪心抬升</text>

  <!-- Start node -->
  <ellipse cx="280" cy="56" rx="120" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="12" fill="#333">开始: ops = 0, i = 1</text>

  <!-- Arrow down to D1 -->
  <path d="M 280 76 L 280 92" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D1: i < n ? -->
  <polygon points="280,96 370,130 280,164 190,130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="134" text-anchor="middle" font-size="12" fill="#333">i &lt; n ?</text>

  <!-- D1 No -> return ops (right) -->
  <path d="M 370 130 L 410 130" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="388" y="122" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <rect x="410" y="108" width="130" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="475" y="128" text-anchor="middle" font-size="10" fill="#333">遍历完毕</text>
  <text x="475" y="144" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 ops</text>

  <!-- D1 Yes -> D2 (down) -->
  <path d="M 280 164 L 280 182" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="178" font-size="11" fill="#82b366">是</text>

  <!-- D2: nums[i] <= nums[i-1] ? -->
  <polygon points="280,186 390,220 280,254 170,220" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="216" text-anchor="middle" font-size="11" fill="#333">nums[i] ≤ nums[i-1] ?</text>
  <text x="280" y="232" text-anchor="middle" font-size="11" fill="#333">(需抬升?)</text>

  <!-- D2 No -> i++ box (right) -->
  <path d="M 390 220 L 415 220" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="402" y="212" text-anchor="middle" font-size="11" fill="#82b366">否</text>
  <rect x="415" y="198" width="80" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="455" y="218" text-anchor="middle" font-size="10" fill="#666">已递增</text>
  <text x="455" y="234" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">i++</text>

  <!-- D2 Yes -> ops += ... (down) -->
  <path d="M 280 254 L 280 274" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="270" font-size="11" fill="#b85450">是</text>

  <!-- ops += box -->
  <rect x="170" y="278" width="220" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="299" text-anchor="middle" font-size="11" fill="#333">ops += nums[i-1] + 1 - nums[i]</text>
  <text x="280" y="318" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">nums[i] = nums[i-1] + 1</text>

  <!-- Arrow down to i++ box -->
  <path d="M 280 334 L 280 350 L 455 350 L 455 244" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="348" font-size="10" fill="#888">抬升后继续</text>

  <!-- i++ loop back to D1 -->
  <path d="M 455 198 L 455 84 L 280 84 L 280 92" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="370" y="78" text-anchor="middle" font-size="10" fill="#888">下一个元素</text>

  <!-- Summary note -->
  <rect x="40" y="384" width="480" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="406" text-anchor="middle" font-size="11" fill="#666">关键：每个位置只看前一个元素，独立决策——这是贪心成立的根基</text>
  <text x="280" y="424" text-anchor="middle" font-size="11" fill="#666">nums[0] 不动（无前驱）；nums[i] 的下界 = nums[i-1] + 1，恰取下界最优</text>
  <text x="280" y="442" text-anchor="middle" font-size="10" fill="#888">时间 O(n)，空间 O(1)</text>
</svg>
