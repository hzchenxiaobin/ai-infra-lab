<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：n = 3 共 5 种平铺</text>

  <!-- ===== 5 tilings, cell 22, grid oy=60 ===== -->
  <!-- ① 3 vertical dominos, ox=47 -->
  <g>
    <rect x="47" y="60" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <rect x="69" y="60" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <rect x="91" y="60" width="22" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
    <rect x="47" y="82" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <rect x="69" y="82" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <rect x="91" y="82" width="22" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
    <rect x="47" y="60" width="22" height="44" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
    <rect x="69" y="60" width="22" height="44" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <rect x="91" y="60" width="22" height="44" fill="none" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="80" y="122" text-anchor="middle" font-size="10" fill="#555">① 3 块竖多米诺</text>
  </g>

  <!-- ② vertical col1 + 2 horizontal cols2-3, ox=157 -->
  <g>
    <rect x="157" y="60" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <rect x="179" y="60" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <rect x="201" y="60" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <rect x="157" y="82" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <rect x="179" y="82" width="22" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
    <rect x="201" y="82" width="22" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
    <rect x="157" y="60" width="22" height="44" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
    <rect x="179" y="60" width="44" height="22" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <rect x="179" y="82" width="44" height="22" fill="none" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="190" y="122" text-anchor="middle" font-size="10" fill="#555">② 竖 + 两横</text>
  </g>

  <!-- ③ 2 horizontal cols1-2 + vertical col3, ox=267 -->
  <g>
    <rect x="267" y="60" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <rect x="289" y="60" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <rect x="311" y="60" width="22" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
    <rect x="267" y="82" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <rect x="289" y="82" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <rect x="311" y="82" width="22" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
    <rect x="267" y="60" width="44" height="22" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
    <rect x="267" y="82" width="44" height="22" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <rect x="311" y="60" width="22" height="44" fill="none" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
    <text x="300" y="122" text-anchor="middle" font-size="10" fill="#555">③ 两横 + 竖</text>
  </g>

  <!-- ④ two trominoes, kink on top, ox=377 -->
  <g>
    <rect x="377" y="60" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <rect x="399" y="60" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <rect x="421" y="60" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <rect x="377" y="82" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <rect x="399" y="82" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <rect x="421" y="82" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <path d="M 377 60 H 421 V 82 H 399 V 104 H 377 Z" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
    <path d="M 421 60 H 443 V 104 H 399 V 82 H 421 Z" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="410" y="122" text-anchor="middle" font-size="10" fill="#555">④ 两块 L（凸上）</text>
  </g>

  <!-- ⑤ two trominoes, kink on bottom, ox=487 -->
  <g>
    <rect x="487" y="60" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <rect x="509" y="60" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <rect x="531" y="60" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <rect x="487" y="82" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <rect x="509" y="82" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <rect x="531" y="82" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <path d="M 487 60 H 509 V 82 H 531 V 104 H 487 Z" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
    <path d="M 509 60 H 553 V 104 H 531 V 82 H 509 Z" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="520" y="122" text-anchor="middle" font-size="10" fill="#555">⑤ 两块 L（凸下）</text>
  </g>

  <text x="300" y="148" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">f[3] = 5</text>

  <!-- ===== DP table ===== -->
  <text x="60" y="176" font-size="11" fill="#888" font-weight="bold">DP 表（k = 列数）：</text>

  <!-- header row k=0..5, cell 48x28, origin (110,184) -->
  <g font-size="11" fill="#333">
    <rect x="110" y="184" width="48" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="134" y="203" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">k</text>
    <rect x="158" y="184" width="48" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="182" y="203" text-anchor="middle" fill="#888">0</text>
    <rect x="206" y="184" width="48" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="230" y="203" text-anchor="middle" fill="#888">1</text>
    <rect x="254" y="184" width="48" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="278" y="203" text-anchor="middle" fill="#888">2</text>
    <rect x="302" y="184" width="48" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="326" y="203" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
    <rect x="350" y="184" width="48" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="374" y="203" text-anchor="middle" fill="#888">4</text>
    <rect x="398" y="184" width="48" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="422" y="203" text-anchor="middle" fill="#888">5</text>

    <!-- f row -->
    <rect x="110" y="212" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="134" y="231" text-anchor="middle" fill="#446688" font-weight="bold">f[k]</text>
    <rect x="158" y="212" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="182" y="231" text-anchor="middle">1</text>
    <rect x="206" y="212" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="230" y="231" text-anchor="middle">1</text>
    <rect x="254" y="212" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="278" y="231" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="302" y="212" width="48" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="326" y="231" text-anchor="middle" fill="#b85450" font-weight="bold">5</text>
    <rect x="350" y="212" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="374" y="231" text-anchor="middle">11</text>
    <rect x="398" y="212" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="422" y="231" text-anchor="middle">24</text>

    <!-- h row -->
    <rect x="110" y="240" width="48" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="134" y="259" text-anchor="middle" fill="#b85450" font-weight="bold">h[k]</text>
    <rect x="158" y="240" width="48" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="182" y="259" text-anchor="middle">0</text>
    <rect x="206" y="240" width="48" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="230" y="259" text-anchor="middle">0</text>
    <rect x="254" y="240" width="48" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="278" y="259" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <rect x="302" y="240" width="48" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="326" y="259" text-anchor="middle">2</text>
    <rect x="350" y="240" width="48" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="374" y="259" text-anchor="middle">4</text>
    <rect x="398" y="240" width="48" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
    <text x="422" y="259" text-anchor="middle" fill="#aaa">—</text>
  </g>

  <!-- annotation arrows: f[3] = f[2] + f[1] + 2*h[2] -->
  <path d="M 278 212 L 322 212" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="4,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 230 212 L 322 212" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="4,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 278 240 L 326 240" stroke="#d6a040" stroke-width="1.4" fill="none" stroke-dasharray="4,2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="80" y="284" width="440" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="300" y="306" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">f[3] = f[2] + f[1] + 2·h[2] = 2 + 1 + 2×1 = 5 ✓</text>

  <!-- footer note -->
  <rect x="80" y="332" width="440" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="300" y="354" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">读表规律</text>
  <text x="96" y="374" font-size="10.5" fill="#555">• f[k] 由 f[k−1]（左 1 格）、f[k−2]（左 2 格）、2·h[k−1]（上一行左 1 格）相加</text>
  <text x="96" y="392" font-size="10.5" fill="#555">• h[k] 由 h[k−1]（左 1 格）、f[k−2]（上一行左 2 格）相加</text>
  <text x="96" y="410" font-size="10.5" fill="#888">• 边界：f[0]=1（空铺 1 种）、f[1]=1、h[0]=h[1]=0</text>
</svg>
