<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 415" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="415" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：全体 AND 锁死 x 的 1 位；答案 = 把 n−1 填进 x 的 0 位空槽</text>

  <!-- fact 1 -->
  <rect x="60" y="38" width="400" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="58" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">AND 只清位不置位 ⇒ 每个元素都必须带上 x 的全部 1 位</text>

  <!-- bit row of x = 4 -->
  <text x="260" y="86" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">x = 4 = (0100)₂ 的 6 个位（位 5…0）：蓝格 = 固定 1 位，绿虚线格 = 空槽</text>

  <rect x="140" y="94" width="44" height="36" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5 3" rx="4" filter="url(#rough2)"/>
  <text x="162" y="118" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="184" y="94" width="44" height="36" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5 3" rx="4" filter="url(#rough2)"/>
  <text x="206" y="118" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="228" y="94" width="44" height="36" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5 3" rx="4" filter="url(#rough2)"/>
  <text x="250" y="118" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="272" y="94" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="294" y="118" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="316" y="94" width="44" height="36" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5 3" rx="4" filter="url(#rough2)"/>
  <text x="338" y="118" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="360" y="94" width="44" height="36" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5 3" rx="4" filter="url(#rough2)"/>
  <text x="382" y="118" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>

  <!-- bit index labels -->
  <text x="162" y="146" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">位5</text>
  <text x="206" y="146" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">位4</text>
  <text x="250" y="146" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">位3</text>
  <text x="294" y="146" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">位2</text>
  <text x="338" y="146" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">位1</text>
  <text x="382" y="146" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">位0</text>

  <!-- slot labels -->
  <text x="162" y="161" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">slot4</text>
  <text x="206" y="161" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">slot3</text>
  <text x="250" y="161" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">slot2</text>
  <text x="294" y="161" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">（锁死）</text>
  <text x="338" y="161" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">slot1</text>
  <text x="382" y="161" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">slot0</text>

  <!-- fact 2 -->
  <rect x="60" y="172" width="400" height="30" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="192" text-anchor="middle" font-size="11" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">合法数 = 保留 x 的 1 位 + 只在空槽里放 1 —— 空槽是一条「压缩数轴」</text>

  <!-- chips: merge(x,k) -->
  <text x="260" y="220" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">合法数从小到大 = merge(x, k)，k = 0, 1, 2, …（把 k 的二进制撒进空槽）</text>
  <rect x="58" y="228" width="76" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="96" y="248" text-anchor="middle" font-size="10.5" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">k=0 → 4</text>
  <rect x="140" y="228" width="76" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="178" y="248" text-anchor="middle" font-size="10.5" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">k=1 → 5</text>
  <rect x="222" y="228" width="76" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="248" text-anchor="middle" font-size="10.5" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">k=2 → 6</text>
  <rect x="304" y="228" width="76" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="342" y="248" text-anchor="middle" font-size="10.5" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">k=3 → 7</text>
  <rect x="386" y="228" width="76" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="424" y="248" text-anchor="middle" font-size="10.5" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">k=4 → 12</text>

  <!-- monotonic -->
  <rect x="60" y="268" width="400" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="288" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">merge 保序：k 越大 ⇒ 数越大（最高分叉位决定大小，引理见题解）</text>

  <!-- answer -->
  <rect x="60" y="308" width="400" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="330" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans = merge(x, n−1)：严格递增 ⇒ 取最小的 n 个合法数最优</text>

  <!-- why AND exactly x -->
  <rect x="60" y="352" width="400" height="30" fill="#fafafa" stroke="#888888" stroke-width="1.2" stroke-dasharray="4 3" rx="8" filter="url(#rough2)"/>
  <text x="260" y="372" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">AND 为何恰好 = x？第 1 个合法数就是 x（空槽全 0），把自由位全压灭</text>

  <!-- bottom note -->
  <path d="M 240 396 L 268 396" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="260" y="409" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">对照官方 hint：元素 = merge(x, v)，v = 0…n−1，第 n 个即答案</text>
</svg>
