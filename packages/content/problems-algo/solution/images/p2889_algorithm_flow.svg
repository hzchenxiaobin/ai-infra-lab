<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">pivot 一行流：定行 → 定列 → 定值 → 查重 → 物化</text>

  <!-- Step 1 -->
  <rect x="130" y="56" width="300" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="78" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">输入长表 weather</text>
  <text x="280" y="96" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">(city, month, temperature) 每行一条观测</text>

  <path d="M 280 108 L 280 130" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="130" y="134" width="300" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="154" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">定行列：index='month'（行）· columns='city'（列）</text>
  <text x="280" y="170" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">行标签 / 列标签 = 各自去重值</text>

  <path d="M 280 178 L 280 200" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="130" y="204" width="300" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="224" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">定格值：values='temperature'</text>
  <text x="280" y="240" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">每格填对应观测行的温度</text>

  <path d="M 280 248 L 280 260" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: diamond -->
  <polygon points="170,296 280,262 390,296 280,330" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="292" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">(month, city)</text>
  <text x="280" y="308" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">组合唯一？</text>

  <!-- side branch -->
  <path d="M 390 296 L 396 296" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="392" y="288" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="400" y="268" width="150" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="475" y="288" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">有重复组合</text>
  <text x="475" y="306" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">ValueError 报错</text>
  <text x="475" y="322" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">→ 改用 pivot_table 聚合</text>

  <path d="M 280 330 L 280 360" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="350" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- Step 5 -->
  <rect x="130" y="364" width="300" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="384" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">物化宽表：行=月份去重 · 列=城市去重</text>
  <text x="280" y="402" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">缺失组合的格子为 NaN</text>

  <path d="M 280 416 L 280 436" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 6 -->
  <rect x="130" y="440" width="300" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="460" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">return 宽表（month 为行索引）</text>
  <text x="280" y="478" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">可选：sort_index() 定序 · reset_index() 还原列</text>
</svg>
