<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="15" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>

  <rect width="720" height="440" fill="#fdfcf7"/>

  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：从右下角倒推 min/max 0 数（滚动一维）</text>
  <path d="M 200 38 Q 360 46 520 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ============ Left: grid + sweep arrow ============ -->
  <g filter="url(#sk)">
    <rect x="60" y="80" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="102" y="80" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="144" y="80" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="186" y="80" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="60" y="122" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="102" y="122" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="144" y="122" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="186" y="122" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="60" y="164" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="102" y="164" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="144" y="164" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="186" y="164" width="40" height="40" rx="4" fill="#fff3d6" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <text x="206" y="189" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415" filter="url(#sk)">基</text>
  <text x="143" y="74" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)">→ 取右邻 j+1</text>
  <text x="40" y="143" text-anchor="middle" font-size="11" fill="#888" filter="url(#sk)" transform="rotate(-90 40 143)">↓ 取下邻 i+1</text>

  <!-- sweep arrow from (2,3) to (0,0) -->
  <path d="M 206 184 Q 120 140 80 100" stroke="#b85450" stroke-width="2.2" stroke-dasharray="6 4" fill="none" marker-end="url(#ag)" filter="url(#sk)"/>
  <text x="150" y="120" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">倒推</text>

  <g filter="url(#sk)">
    <rect x="40" y="216" width="232" height="92" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/>
  </g>
  <text x="156" y="238" text-anchor="middle" font-size="11" fill="#444" filter="url(#sk)">c = (grid[i][j] == 0 ? 1 : 0)</text>
  <text x="156" y="258" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">mn[i][j] = c + min(mn[i+1][j], mn[i][j+1])</text>
  <text x="156" y="278" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">mx[i][j] = c + max(mx[i+1][j], mx[i][j+1])</text>
  <text x="156" y="298" text-anchor="middle" font-size="10" fill="#7a5415" filter="url(#sk)">行内 j 从 n−1 → 0，复用一维数组</text>

  <!-- ============ Right: flow steps ============ -->
  <g filter="url(#sk)">
    <rect x="300" y="80" width="390" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="316" y="105" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#sk)">1.  L = m + n − 1；若 L 为奇 ⇒ return false</text>

  <line x1="495" y1="120" x2="495" y2="138" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="300" y="138" width="390" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="316" y="163" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#sk)">2.  目标 T = L / 2</text>

  <line x1="495" y1="178" x2="495" y2="196" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="300" y="196" width="390" height="92" rx="8" fill="#eaf6ee" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="316" y="220" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">3.  for i = m−1 downto 0:</text>
  <text x="316" y="240" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">       for j = n−1 downto 0:</text>
  <text x="316" y="260" font-size="12" fill="#2e6e2e" filter="url(#sk)">         c = (grid[i][j]==0)</text>
  <text x="316" y="280" font-size="12" fill="#2e6e2e" filter="url(#sk)">         mn[j]=c+min(mn[j], mn[j+1]); mx[j]=c+max(...)</text>

  <line x1="495" y1="288" x2="495" y2="306" stroke="#5a5a5a" stroke-width="1.6" marker-end="url(#ar)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="300" y="306" width="390" height="44" rx="8" fill="#fff3d6" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="316" y="333" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">4.  return  mn[0] ≤ T ≤ mx[0]</text>

  <text x="360" y="380" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">每格仅依赖「下邻」与「右邻」，故可逐行、行内从右往左滚动，O(n) 额外空间</text>
  <text x="360" y="400" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">下邻即上一轮的 mn[j]（尚未覆盖）；右邻即本轮已算的 mn[j+1]</text>
</svg>
