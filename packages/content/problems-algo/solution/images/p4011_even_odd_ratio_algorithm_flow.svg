<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 570"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="570" fill="#fafafa"/>

  <g filter="url(#rough2)">
    <text x="280" y="20" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">算法流程：固定左端点 l，右端点 r 逐步右扩，单窗口 O(1)</text>

    <!-- ① init -->
    <rect x="90" y="34" width="280" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="230" y="55" text-anchor="middle" font-size="10.5" fill="#2f5d24">① 读入 nums、a、b；ans = 0</text>
    <path d="M 230 68 V 82" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none"/>

    <!-- ② outer loop -->
    <rect x="90" y="84" width="280" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="230" y="103" text-anchor="middle" font-size="10" fill="#33506b">② 枚举左端点 l = 0 … n − 1</text>
    <text x="230" y="120" text-anchor="middle" font-size="9" fill="#555">每轮开始时 x = 0、y = 0（清零）</text>
    <path d="M 230 132 V 146" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none"/>

    <!-- ③ inner loop dashed box -->
    <rect x="40" y="150" width="440" height="246" rx="10" fill="none" stroke="#446688" stroke-width="1.5" stroke-dasharray="6,4"/>
    <rect x="54" y="142" width="176" height="16" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="142" y="153.5" text-anchor="middle" font-size="8" fill="#33506b">③ 枚举右端点 r = l … n − 1</text>

    <!-- diamond 1: parity -->
    <polygon points="230,182 300,214 230,246 160,214" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="230" y="211" text-anchor="middle" font-size="10" fill="#7a5c1a">nums[r] 是偶数？</text>
    <text x="230" y="225" text-anchor="middle" font-size="7.5" fill="#a08040">并入窗口右端</text>

    <text x="322" y="207" text-anchor="middle" font-size="8.5" fill="#4a7a3a">是</text>
    <path d="M 300 214 H 344" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none"/>
    <rect x="348" y="196" width="104" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="400" y="218" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold">x ← x + 1</text>

    <text x="153" y="207" text-anchor="middle" font-size="8.5" fill="#b85450">否</text>
    <path d="M 160 214 H 148" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none"/>
    <rect x="44" y="196" width="100" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="94" y="218" text-anchor="middle" font-size="10" fill="#a87020" font-weight="bold">y ← y + 1</text>

    <path d="M 94 232 V 260 H 218" stroke="#446688" stroke-width="1.5" fill="none"/>
    <path d="M 400 232 V 260 H 242" stroke="#446688" stroke-width="1.5" fill="none"/>
    <path d="M 230 260 V 268" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none"/>

    <!-- diamond 2: integer predicate -->
    <polygon points="230,272 330,306 230,340 130,306" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="230" y="303" text-anchor="middle" font-size="10" fill="#7a5c1a">y &gt; 0 且 b·x ≤ a·y？</text>
    <text x="230" y="317" text-anchor="middle" font-size="7.5" fill="#a08040">整数判据，O(1)</text>

    <text x="340" y="299" text-anchor="middle" font-size="8.5" fill="#4a7a3a">是</text>
    <path d="M 330 306 H 350" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none"/>
    <rect x="354" y="288" width="104" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="406" y="310" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold">ans ← ans + 1</text>

    <text x="238" y="354" text-anchor="start" font-size="8.5" fill="#b85450">否</text>
    <path d="M 406 324 V 358" stroke="#446688" stroke-width="1.5" fill="none"/>
    <path d="M 230 340 V 358 H 500 V 168 H 486" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="506" y="262" text-anchor="start" font-size="7.5" fill="#888">下一个 r</text>

    <!-- after inner loop -->
    <path d="M 230 396 V 410" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none"/>

    <!-- diamond 3: outer loop -->
    <polygon points="230,412 318,444 230,476 142,444" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="230" y="441" text-anchor="middle" font-size="10" fill="#7a5c1a">l + 1 &lt; n？</text>
    <text x="230" y="455" text-anchor="middle" font-size="7.5" fill="#a08040">还有左端点没试过？</text>

    <text x="124" y="437" text-anchor="middle" font-size="8.5" fill="#4a7a3a">是</text>
    <path d="M 142 444 H 36 V 108 H 84" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="24" y="280" text-anchor="middle" font-size="7.5" fill="#888" transform="rotate(-90 24 280)">下一个 l</text>

    <text x="238" y="490" text-anchor="start" font-size="8.5" fill="#b85450">否</text>
    <path d="M 230 476 V 490" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none"/>

    <!-- ⑤ return -->
    <rect x="90" y="492" width="280" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="230" y="513" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">⑤ 返回 ans</text>

    <text x="280" y="548" text-anchor="middle" font-size="8.5" fill="#999">单个窗口 (l, r) 只做一次奇偶归类 + 一次整数比较 ⇒ 总时间 O(n²)、额外空间 O(1)；n ≤ 1000 约 5×10⁵ 个窗口</text>
  </g>
</svg>
