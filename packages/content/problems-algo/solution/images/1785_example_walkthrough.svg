<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：求和 → 差距 → 上取整 → 验证</text>

  <!-- ===== Example 1 ===== -->
  <rect x="30" y="40" width="520" height="180" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="44" y="60" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 1：nums = [1, −1, 1]，limit = 3，goal = −4</text>

  <!-- step rows -->
  <g filter="url(#rough2)" font-size="10.5" fill="#555">
    <text x="44" y="82">① 求和</text>
    <text x="120" y="82">S = 1 + (−1) + 1 = </text>
    <rect x="248" y="70" width="40" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="268" y="84" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">1</text>

    <text x="44" y="108">② 差距</text>
    <text x="120" y="108">diff = goal − S = −4 − 1 = </text>
    <rect x="276" y="96" width="50" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <text x="301" y="110" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">−5</text>
    <text x="340" y="108">→ |diff| = </text>
    <rect x="408" y="96" width="40" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <text x="428" y="110" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">5</text>

    <text x="44" y="134">③ 上取整</text>
    <text x="120" y="134">ans = ⌈5 / 3⌉ = (5 + 3 − 1) // 3 = 7 // 3 = </text>
    <rect x="372" y="122" width="40" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="392" y="136" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">2</text>
  </g>

  <!-- verification row -->
  <line x1="44" y1="150" x2="536" y2="150" stroke="#c0d0e8" stroke-width="1" filter="url(#rough2)"/>
  <text x="44" y="168" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">验证：</text>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="92" y="158" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="108" y="173" fill="#333">1</text>
    <text x="132" y="173" font-size="11" fill="#888">+</text>
    <rect x="142" y="158" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="162" y="173" fill="#b85450" font-weight="bold">−3</text>
    <text x="190" y="173" font-size="11" fill="#888">+</text>
    <rect x="200" y="158" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="220" y="173" fill="#b85450" font-weight="bold">−2</text>
    <text x="252" y="173" font-size="10.5" fill="#888">=</text>
    <rect x="264" y="158" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="284" y="173" fill="#4a7a3a" font-weight="bold">−4</text>
    <text x="316" y="173" font-size="10" fill="#4a7a3a" font-weight="bold">= goal ✓</text>
  </g>
  <text x="44" y="200" font-size="9.5" fill="#888" filter="url(#rough2)">注：每个新元素 |−3| = 3 ≤ limit，|−2| = 2 ≤ limit，满足约束</text>

  <!-- ===== Example 2 ===== -->
  <rect x="30" y="232" width="520" height="180" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="44" y="252" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">示例 2：nums = [1, −10, 9, 1]，limit = 100，goal = 0</text>

  <g filter="url(#rough2)" font-size="10.5" fill="#555">
    <text x="44" y="274">① 求和</text>
    <text x="120" y="274">S = 1 + (−10) + 9 + 1 = </text>
    <rect x="264" y="262" width="40" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="284" y="276" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">1</text>

    <text x="44" y="300">② 差距</text>
    <text x="120" y="300">diff = goal − S = 0 − 1 = </text>
    <rect x="252" y="288" width="40" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <text x="272" y="302" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">−1</text>
    <text x="304" y="300">→ |diff| = </text>
    <rect x="372" y="288" width="40" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <text x="392" y="302" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">1</text>

    <text x="44" y="326">③ 上取整</text>
    <text x="120" y="326">ans = ⌈1 / 100⌉ = (1 + 100 − 1) // 100 = 100 // 100 = </text>
    <rect x="408" y="314" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="428" y="328" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">1</text>
  </g>

  <line x1="44" y1="342" x2="536" y2="342" stroke="#e8d8b0" stroke-width="1" filter="url(#rough2)"/>
  <text x="44" y="360" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">验证：</text>
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="92" y="350" width="32" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <text x="108" y="365" fill="#333">1</text>
    <text x="132" y="365" font-size="11" fill="#888">+</text>
    <rect x="142" y="350" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="162" y="365" fill="#b85450" font-weight="bold">−1</text>
    <text x="190" y="365" font-size="11" fill="#888">=</text>
    <rect x="202" y="350" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="222" y="365" fill="#4a7a3a" font-weight="bold">0</text>
    <text x="254" y="365" font-size="10" fill="#4a7a3a" font-weight="bold">= goal ✓</text>
  </g>
  <text x="44" y="392" font-size="9.5" fill="#888" filter="url(#rough2)">注：差距很小但 limit 很大，仍需 1 个元素补齐（上取整保证至少 1）</text>

  <!-- ===== Footer: key takeaway ===== -->
  <rect x="30" y="424" width="520" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="446" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">通用公式：ans = (|goal − Σnums| + limit − 1) // limit，一步到位</text>
</svg>
