<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：特判 + 值域 [1, U] 上的一次 BFS</text>

  <!-- start -->
  <rect x="155" y="48" width="140" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="225" y="68" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">输入 x, y</text>
  <path d="M 225 80 L 225 98" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 1 -->
  <polygon points="225,100 287,130 225,160 163,130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="225" y="135" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">y ≥ x ?</text>
  <path d="M 287 130 L 371 130" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="326" y="122" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="375" y="114" width="118" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="434" y="134" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 y − x</text>
  <path d="M 225 160 L 225 196" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="234" y="182" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- init -->
  <rect x="75" y="200" width="300" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="225" y="218" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">U = 2x − y；dist[x] = 0</text>
  <text x="225" y="234" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">队列 q = [x]</text>
  <path d="M 225 244 L 225 258" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- pop -->
  <rect x="140" y="262" width="170" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="225" y="281" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">取出队首 v</text>
  <path d="M 225 292 L 225 312" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- side note -->
  <rect x="330" y="258" width="168" height="46" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.2" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="414" y="275" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">每状态至多入队一次</text>
  <text x="414" y="291" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">出队时 dist 已定稿（BFS 性质）</text>

  <!-- diamond 2 -->
  <polygon points="225,316 275,342 225,368 175,342" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="225" y="347" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">v = y ?</text>
  <path d="M 275 342 L 371 342" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="334" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="375" y="326" width="118" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="434" y="346" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 dist[v]</text>
  <path d="M 225 368 L 225 386" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="234" y="382" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- expand -->
  <rect x="50" y="390" width="350" height="48" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="225" y="408" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">扩展邻居 w：v−1 / v+1 / v÷11 / v÷5（后两个需整除）</text>
  <text x="225" y="426" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">1 ≤ w ≤ U 且未访问 → dist[w] = dist[v]+1，入队</text>

  <!-- loop back -->
  <path d="M 50 414 C 22 380 22 300 132 279" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="34" y="352" text-anchor="middle" font-size="9.5" fill="#d6a040" filter="url(#rough2)">循环</text>
</svg>
