<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">桶分桶：w = t + 1，按 ⌊v / w⌋ 分桶</text>
  <path d="M 150 44 Q 300 52 450 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 说明：t = valueDiff, w = t + 1 -->
  <text x="300" y="74" text-anchor="middle" font-size="12" fill="#888">设 t = 3，则 w = 4，每桶跨度 [k·w, k·w + w − 1]</text>

  <!-- 数轴 -->
  <line x1="50" y1="120" x2="550" y2="120" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- 刻度 -->
  <g filter="url(#rough2)">
    <line x1="80" y1="114" x2="80" y2="128" stroke="#446688" stroke-width="1.4"/>
    <line x1="200" y1="114" x2="200" y2="128" stroke="#446688" stroke-width="1.4"/>
    <line x1="320" y1="114" x2="320" y2="128" stroke="#446688" stroke-width="1.4"/>
    <line x1="440" y1="114" x2="440" y2="128" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="80" y="142" text-anchor="middle" font-size="11" fill="#666">0</text>
  <text x="200" y="142" text-anchor="middle" font-size="11" fill="#666">4</text>
  <text x="320" y="142" text-anchor="middle" font-size="11" fill="#666">8</text>
  <text x="440" y="142" text-anchor="middle" font-size="11" fill="#666">12</text>

  <!-- 桶 0: [0, 3] -->
  <g filter="url(#rough2)">
    <rect x="80" y="160" width="120" height="60" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="140" y="180" text-anchor="middle" font-size="11" fill="#888">桶 0  [0, 3]</text>
  <g filter="url(#rough2)">
    <ellipse cx="110" cy="200" rx="16" ry="12" fill="#fff" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="110" y="204" text-anchor="middle" font-size="12" fill="#333">1</text>
  <g filter="url(#rough2)">
    <ellipse cx="170" cy="200" rx="16" ry="12" fill="#fff" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="170" y="204" text-anchor="middle" font-size="12" fill="#333">3</text>

  <!-- 桶 1: [4, 7] — 当前值所在桶（高亮） -->
  <g filter="url(#rough2)">
    <rect x="200" y="160" width="120" height="60" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <text x="260" y="180" text-anchor="middle" font-size="11" fill="#888">桶 1  [4, 7]</text>
  <g filter="url(#rough2)">
    <ellipse cx="260" cy="200" rx="16" ry="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="260" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">6</text>
  <text x="282" y="195" font-size="10" fill="#b85450">← 当前</text>

  <!-- 桶 2: [8, 11] -->
  <g filter="url(#rough2)">
    <rect x="320" y="160" width="120" height="60" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="380" y="180" text-anchor="middle" font-size="11" fill="#888">桶 2  [8, 11]</text>
  <g filter="url(#rough2)">
    <ellipse cx="380" cy="200" rx="16" ry="12" fill="#fff" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="380" y="204" text-anchor="middle" font-size="12" fill="#333">9</text>

  <!-- 桶 3: [12, 15] -->
  <g filter="url(#rough2)">
    <rect x="440" y="160" width="100" height="60" rx="6" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,2"/>
  </g>
  <text x="490" y="180" text-anchor="middle" font-size="11" fill="#aaa">桶 3  [12, 15]</text>
  <text x="490" y="206" text-anchor="middle" font-size="11" fill="#ccc">（空）</text>

  <!-- 检查箭头：同桶 -->
  <path d="M 260 224 Q 260 236 260 244" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 检查箭头：左邻桶 -->
  <path d="M 230 224 Q 180 236 150 244" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- 检查箭头：右邻桶 -->
  <path d="M 290 224 Q 340 236 370 244" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- 三种检查结果说明 -->
  <g filter="url(#rough2)">
    <rect x="60" y="250" width="150" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="135" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">同桶 → 必中</text>
  <text x="135" y="290" text-anchor="middle" font-size="11" fill="#555">|v₁ − v₂| &lt; w = t+1</text>
  <text x="135" y="302" text-anchor="middle" font-size="11" fill="#555">即 |差| ≤ t ✓</text>

  <g filter="url(#rough2)">
    <rect x="225" y="250" width="150" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="300" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040">邻桶 → 待查</text>
  <text x="300" y="290" text-anchor="middle" font-size="11" fill="#555">可能跨桶边界</text>
  <text x="300" y="302" text-anchor="middle" font-size="11" fill="#555">需验证 |差| ≤ t ?</text>

  <g filter="url(#rough2)">
    <rect x="390" y="250" width="150" height="56" rx="8" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,2"/>
  </g>
  <text x="465" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#999">远桶 → 跳过</text>
  <text x="465" y="290" text-anchor="middle" font-size="11" fill="#aaa">|差| ≥ w = t+1</text>
  <text x="465" y="302" text-anchor="middle" font-size="11" fill="#aaa">必 &gt; t，不可能</text>

  <!-- 底部关键洞察 -->
  <g filter="url(#rough2)">
    <rect x="60" y="326" width="480" height="56" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="300" y="350" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">关键：桶大小取 t+1 而非 t</text>
  <text x="300" y="370" text-anchor="middle" font-size="12" fill="#555">同桶两数之差 ≤ t−1 &lt; t+1 = w，闭区间 [0, t] 恰好 t+1 个整数</text>
</svg>
