<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15.5" fill="#333" filter="url(#rough2)">算法流程：一遍判定 + 阶乘累乘</text>

  <g filter="url(#rough2)">
    <!-- 开始 -->
    <rect x="175" y="46" width="210" height="38" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="280" y="70" text-anchor="middle" font-size="12" fill="#446688">读入 complexity（n 台机器）</text>
    <path d="M 280 84 L 280 102" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)"/>

    <!-- 扫描 -->
    <rect x="175" y="106" width="210" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="280" y="130" text-anchor="middle" font-size="12" fill="#446688">逐个检查 i = 1 … n−1 的 c[i]</text>
    <path d="M 280 144 L 280 162" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)"/>

    <!-- 判定菱形 -->
    <polygon points="280,166 396,208 280,250 164,208" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="280" y="213" text-anchor="middle" font-size="12" fill="#a07818">存在 c[i] ≤ c[0] ？</text>

    <!-- 是 → 返回 0 -->
    <path d="M 396 208 L 420 208" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)"/>
    <text x="408" y="200" text-anchor="middle" font-size="11" fill="#b85450">是</text>
    <rect x="424" y="184" width="90" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="469" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">返回 0</text>
    <text x="469" y="222" text-anchor="middle" font-size="9.5" fill="#b85450">有机器锁死 ✗</text>

    <!-- 否 → 阶乘累乘 -->
    <path d="M 280 250 L 280 268" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)"/>
    <text x="293" y="264" text-anchor="middle" font-size="11" fill="#4a7a3a">否</text>
    <rect x="155" y="272" width="250" height="50" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="280" y="291" text-anchor="middle" font-size="11.5" fill="#a07818">ans = 1</text>
    <text x="280" y="309" text-anchor="middle" font-size="11.5" fill="#a07818">k = 1 … n−1：ans ← ans · k mod 10⁹+7</text>
    <path d="M 280 322 L 280 340" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)"/>

    <!-- 返回答案 -->
    <rect x="155" y="344" width="250" height="40" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="280" y="369" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#4a7a3a">返回 ans = (n−1)! mod 10⁹+7</text>

    <!-- 侧注 -->
    <rect x="16" y="276" width="126" height="70" rx="8" fill="none" stroke="#999999" stroke-width="1.4" stroke-dasharray="6 4"/>
    <text x="79" y="298" text-anchor="middle" font-size="10" fill="#666">边乘边取模防溢出</text>
    <text x="79" y="315" text-anchor="middle" font-size="10" fill="#666">只乘不除</text>
    <text x="79" y="332" text-anchor="middle" font-size="10" fill="#666">⇒ 无需乘法逆元</text>
  </g>
</svg>
