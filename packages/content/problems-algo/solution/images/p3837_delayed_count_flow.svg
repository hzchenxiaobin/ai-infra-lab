<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrK" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#555"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrW" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#999"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="18" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：从右往左一遍扫描，后缀计数只增不删</text>
  <text x="260" y="34" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">官方 hints 三步——入表 nums[i+k+1]（若存在）→ 查 cnt[nums[i]] → 逆序收集后反转</text>

  <!-- Start -->
  <rect x="168" y="44" width="224" height="28" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="10" fill="#223" font-weight="bold" filter="url(#rough2)">开始：cnt ← 空表，res ← n 元数组，i ← n−1</text>

  <path d="M 280 72 L 280 82" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrK)" filter="url(#rough2)"/>

  <!-- Diamond 1: i >= 0? -->
  <polygon points="232,114 280,88 328,114 280,140" fill="#fff" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="118" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">i ≥ 0 ?</text>

  <!-- no -> return -->
  <path d="M 328 114 L 388 114" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="356" y="107" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="392" y="98" width="100" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="442" y="118" text-anchor="middle" font-size="10.5" fill="#2a5a1e" font-weight="bold" filter="url(#rough2)">返回 res</text>

  <!-- yes -->
  <path d="M 280 140 L 280 154" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrK)" filter="url(#rough2)"/>
  <text x="291" y="151" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- Process box: insert -->
  <rect x="160" y="156" width="240" height="38" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="172" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">若 i+k+1 &lt; n：cnt[nums[i+k+1]] += 1</text>
  <text x="280" y="188" text-anchor="middle" font-size="8.5" fill="#a07830" filter="url(#rough2)">（后缀新左端入表｜越界则跳过）</text>

  <path d="M 280 194 L 280 204" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrK)" filter="url(#rough2)"/>

  <!-- Process box: query -->
  <rect x="160" y="206" width="240" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="225" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">res[i] ← cnt[nums[i]]（一步查表）</text>

  <path d="M 280 236 L 280 246" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrK)" filter="url(#rough2)"/>

  <!-- Process box: decrement i -->
  <rect x="168" y="248" width="224" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="267" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">i ← i − 1（左移一格）</text>

  <!-- loop back -->
  <path d="M 168 263 L 126 263 L 126 114 L 228 114" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <text x="118" y="192" text-anchor="end" font-size="9" fill="#999" filter="url(#rough2)">下一轮</text>

  <!-- bottom notes -->
  <rect x="48" y="296" width="424" height="72" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="316" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">每个位置恰入表一次、从不删除 ⇒ 时间 O(n)；空间 O(n)（哈希表 + 输出）</text>
  <text x="260" y="334" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">倒序产出：append 收集则末尾 reverse；开数组原地写 res[i] 免显式反转</text>
  <text x="260" y="352" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">边界：k ≥ n−1 ⇒ 永不入表，答案全 0；n = 1 ⇒ res = [0]</text>
</svg>
