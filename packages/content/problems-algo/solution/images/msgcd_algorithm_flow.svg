<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一遍扫描 + 滚动 gcd（O(n)，O(1)）</text>

  <!-- start -->
  <rect x="180" y="46" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="20" filter="url(#rough2)"/>
  <text x="260" y="71" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">初始化 g = 0, ans = 1</text>

  <path d="M260 90 L260 112" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop header -->
  <rect x="150" y="118" width="220" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="143" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">for each x in nums（依次取下一元素）</text>

  <path d="M260 160 L260 182" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- update g -->
  <rect x="150" y="188" width="220" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="213" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">g ← gcd(g, x)   // gcd(0,x)=x</text>

  <path d="M260 230 L260 252" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond: g==1? -->
  <path d="M260 258 L340 300 L260 342 L180 300 Z" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="296" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">g == 1 ?</text>
  <text x="260" y="312" text-anchor="middle" font-size="10" fill="#b85450">追加 x 后整段 gcd 跌到 1</text>

  <!-- No branch (left): back to loop -->
  <path d="M180 300 L70 300 L70 138 L150 138" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="78" y="292" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <text x="78" y="306" font-size="10" fill="#4a7a3a">x 留在本段，继续</text>

  <!-- Yes branch (right): cut -->
  <path d="M340 300 L440 300 L440 198 L370 198" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="402" y="292" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <text x="448" y="316" font-size="10" fill="#b85450">本段到此为止</text>

  <!-- cut action box -->
  <rect x="370" y="178" width="120" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="430" y="196" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">ans += 1</text>
  <text x="430" y="210" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">g ← x（新开一段）</text>

  <!-- exit path: loop end → return -->
  <path d="M70 138 L70 372 L180 372" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="80" y="362" font-size="10" fill="#888">遍历结束</text>

  <!-- return -->
  <rect x="180" y="392" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="20" filter="url(#rough2)"/>
  <text x="260" y="417" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">return ans   // 最小子数组数</text>
</svg>
