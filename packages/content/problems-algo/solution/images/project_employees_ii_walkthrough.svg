<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：5 行 → 2 个项目 → 最大值 3 → 输出 {1}</text>

  <!-- 原始 Project 表 -->
  <text x="30" y="52" font-size="11.5" fill="#888">Project 表（5 行）</text>
  <rect x="40" y="60" width="500" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="120" y="80" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">project_id</text>
  <text x="460" y="80" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">employee_id</text>
  <text x="120" y="100" text-anchor="middle" font-size="10.5" fill="#333">1 / 1 / 1</text>
  <text x="460" y="100" text-anchor="middle" font-size="10.5" fill="#333">1 , 2 , 3</text>
  <text x="120" y="116" text-anchor="middle" font-size="10.5" fill="#333">2 / 2</text>
  <text x="460" y="116" text-anchor="middle" font-size="10.5" fill="#333">1 , 4</text>

  <path d="M 290 126 L 290 146" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 分组计数 -->
  <text x="30" y="158" font-size="11.5" fill="#888">GROUP BY project_id 后各组计数</text>
  <rect x="40" y="166" width="500" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="188" text-anchor="middle" font-size="11" fill="#333">project_id = 1</text>
  <text x="160" y="204" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">COUNT = 3 ✅ max</text>
  <text x="420" y="188" text-anchor="middle" font-size="11" fill="#333">project_id = 2</text>
  <text x="420" y="204" text-anchor="middle" font-size="10.5" fill="#888">COUNT = 2</text>

  <path d="M 290 222 L 290 242" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 比较最大值 -->
  <text x="30" y="254" font-size="11.5" fill="#888">HAVING cnt &gt;= ALL (…) → 仅 cnt = 3 通过</text>
  <rect x="100" y="262" width="380" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="286" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">max_cnt = 3，project 2 (cnt=2) 被过滤</text>

  <path d="M 290 304 L 290 324" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 输出 -->
  <rect x="180" y="328" width="220" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="352" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">输出 project_id = 1</text>

  <!-- 注解 -->
  <text x="290" y="384" text-anchor="middle" font-size="10.5" fill="#888">若 project 2 也有 3 名员工，则并列输出 {1, 2} — ALL / RANK 天然保留 ties</text>
</svg>
