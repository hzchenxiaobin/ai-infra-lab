<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：一次操作吃掉一种值 ⇒ 答案 = 失配值的去重个数</text>

  <!-- 示例 3：nums 行 -->
  <text x="113" y="42" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">i = 0</text>
  <text x="185" y="42" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">i = 1</text>
  <text x="257" y="42" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">i = 2</text>
  <text x="48" y="71" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">nums</text>

  <rect x="80" y="48" width="66" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="113" y="71" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="152" y="48" width="66" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="185" y="71" text-anchor="middle" font-size="13" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="224" y="48" width="66" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="257" y="71" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">7</text>

  <!-- 失配标记 -->
  <text x="113" y="109" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">≠</text>
  <text x="185" y="109" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">≠</text>
  <text x="257" y="109" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">≠</text>

  <!-- target 行 -->
  <text x="44" y="141" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">target</text>
  <rect x="80" y="118" width="66" height="36" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="113" y="141" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="152" y="118" width="66" height="36" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="185" y="141" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="224" y="118" width="66" height="36" rx="4" fill="#f4f4f4" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="257" y="141" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>

  <text x="158" y="180" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">示例 3：三位置全失配 ⇒ 失配位数 3、失配段数 3</text>

  <!-- 值分组框 -->
  <rect x="20" y="192" width="276" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="158" y="212" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">值 7 → 位置 0、2（极大段 [0,0] 与 [2,2]）</text>
  <text x="158" y="232" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">一次 x = 7 同时修复两段！</text>

  <rect x="20" y="258" width="276" height="54" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="158" y="278" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">值 3 → 位置 1（极大段 [1,1]）</text>
  <text x="158" y="298" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">一次 x = 3 修复</text>

  <!-- 右侧：集合 D -->
  <rect x="312" y="48" width="188" height="74" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="406" y="68" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">失配值集合（按值去重）</text>
  <text x="406" y="93" text-anchor="middle" font-size="15" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">D = {7, 3}</text>
  <text x="406" y="112" text-anchor="middle" font-size="9.5" fill="#998a5a" filter="url(#rough2)">只收失配位上 nums[i] 的值</text>

  <!-- 右侧：答案 -->
  <rect x="312" y="134" width="188" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="406" y="162" text-anchor="middle" font-size="15" fill="#33506b" font-weight="bold" filter="url(#rough2)">答案 = |D| = 2</text>
  <text x="406" y="186" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">下界 = 上界，精确夹逼</text>

  <!-- 右侧：口径对比 -->
  <rect x="312" y="210" width="188" height="96" rx="10" fill="#ffffff" stroke="#b85450" stroke-width="1.4" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="406" y="230" text-anchor="middle" font-size="10.5" fill="#8a3a3a" font-weight="bold" filter="url(#rough2)">三个口径对比</text>
  <text x="406" y="250" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">失配位数 3　✗</text>
  <text x="406" y="268" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">失配段数 3　✗</text>
  <text x="406" y="288" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">失配值数 2　✓</text>

  <!-- 底部结论条 -->
  <rect x="20" y="322" width="480" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="341" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">下界：每种失配值至少一次（守值 + 一次只修一种值）　⇔　上界：每种值一次足够（同值段一网打尽）</text>
</svg>
