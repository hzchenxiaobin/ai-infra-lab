<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1 演算：word = aabbccdd，k = 7，统计「长度 ≤ 6」的方案数</text>
  <text x="260" y="38" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">m = 4 组、每组 c = 2：f[j] = 处理完若干组后、长度恰为 j 的保留方案数</text>

  <!-- ===== 表头 ===== -->
  <rect x="16" y="54" width="112" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="72" y="71" text-anchor="middle" font-size="9" fill="#33506b" font-weight="bold" filter="url(#rough2)">处理进度</text>
  <rect x="134" y="54" width="46" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="180" y="54" width="46" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="226" y="54" width="46" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="272" y="54" width="46" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="318" y="54" width="46" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="364" y="54" width="46" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <rect x="410" y="54" width="46" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="157" y="71" text-anchor="middle" font-size="9" fill="#33506b" font-weight="bold" filter="url(#rough2)">j=0</text>
  <text x="203" y="71" text-anchor="middle" font-size="9" fill="#33506b" font-weight="bold" filter="url(#rough2)">j=1</text>
  <text x="249" y="71" text-anchor="middle" font-size="9" fill="#33506b" font-weight="bold" filter="url(#rough2)">j=2</text>
  <text x="295" y="71" text-anchor="middle" font-size="9" fill="#33506b" font-weight="bold" filter="url(#rough2)">j=3</text>
  <text x="341" y="71" text-anchor="middle" font-size="9" fill="#33506b" font-weight="bold" filter="url(#rough2)">j=4</text>
  <text x="387" y="71" text-anchor="middle" font-size="9" fill="#33506b" font-weight="bold" filter="url(#rough2)">j=5</text>
  <text x="433" y="71" text-anchor="middle" font-size="9" fill="#33506b" font-weight="bold" filter="url(#rough2)">j=6</text>

  <!-- ===== 行 1：初始 ===== -->
  <rect x="16" y="82" width="112" height="26" fill="#f4f4f4" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="72" y="99" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">初始（0 组）</text>
  <rect x="134" y="82" width="46" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="180" y="82" width="46" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="226" y="82" width="46" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="272" y="82" width="46" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="318" y="82" width="46" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="364" y="82" width="46" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="410" y="82" width="46" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="157" y="99" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="203" y="99" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="249" y="99" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="295" y="99" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="341" y="99" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="387" y="99" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="433" y="99" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>

  <!-- ===== 行 2：第 1 组 ===== -->
  <rect x="16" y="110" width="112" height="26" fill="#f4f4f4" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="72" y="127" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">第 1 组 c=2</text>
  <rect x="134" y="110" width="46" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="180" y="110" width="46" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="226" y="110" width="46" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="272" y="110" width="46" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="318" y="110" width="46" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="364" y="110" width="46" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="410" y="110" width="46" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="157" y="127" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="203" y="127" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="249" y="127" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="295" y="127" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="341" y="127" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="387" y="127" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="433" y="127" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>

  <!-- ===== 行 3：第 2 组 ===== -->
  <rect x="16" y="138" width="112" height="26" fill="#f4f4f4" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="72" y="155" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">第 2 组 c=2</text>
  <rect x="134" y="138" width="46" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="180" y="138" width="46" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="226" y="138" width="46" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="272" y="138" width="46" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="318" y="138" width="46" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="364" y="138" width="46" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="410" y="138" width="46" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="157" y="155" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="203" y="155" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="249" y="155" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="295" y="155" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="341" y="155" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="387" y="155" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="433" y="155" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>

  <!-- ===== 行 4：第 3 组 ===== -->
  <rect x="16" y="166" width="112" height="26" fill="#f4f4f4" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="72" y="183" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">第 3 组 c=2</text>
  <rect x="134" y="166" width="46" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="180" y="166" width="46" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="226" y="166" width="46" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="272" y="166" width="46" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="318" y="166" width="46" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="364" y="166" width="46" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="410" y="166" width="46" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="157" y="183" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="203" y="183" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="249" y="183" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="295" y="183" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="341" y="183" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="387" y="183" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="433" y="183" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- ===== 行 5：第 4 组（高亮） ===== -->
  <rect x="16" y="194" width="112" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="72" y="211" text-anchor="middle" font-size="8.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">第 4 组 c=2</text>
  <rect x="134" y="194" width="46" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="180" y="194" width="46" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="226" y="194" width="46" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="272" y="194" width="46" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="318" y="194" width="46" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="364" y="194" width="46" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="410" y="194" width="46" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="157" y="211" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="203" y="211" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="249" y="211" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="295" y="211" text-anchor="middle" font-size="10" fill="#bbb" filter="url(#rough2)">0</text>
  <text x="341" y="211" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="387" y="211" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="433" y="211" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">6</text>

  <!-- 阶梯注记 -->
  <text x="470" y="100" font-size="8" fill="#888" filter="url(#rough2)">← 每行开头</text>
  <text x="470" y="112" font-size="8" fill="#888" filter="url(#rough2)">  多一个 0：</text>
  <text x="470" y="124" font-size="8" fill="#888" filter="url(#rough2)">  i 组后长度</text>
  <text x="470" y="136" font-size="8" fill="#888" filter="url(#rough2)">  至少为 i</text>

  <!-- ===== 结论框 ===== -->
  <rect x="40" y="240" width="248" height="66" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="164" y="260" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">bad = f[4] + f[5] + f[6] = 1 + 4 + 6 = 11</text>
  <text x="164" y="278" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">（长度 4 / 5 / 6 的「太短」方案数）</text>
  <text x="164" y="298" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ans = 16 − 11 = 5 ✓</text>

  <rect x="302" y="240" width="182" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="393" y="258" text-anchor="middle" font-size="9" fill="#a05a20" font-weight="bold" filter="url(#rough2)">隐藏的巧合：</text>
  <text x="393" y="274" text-anchor="middle" font-size="9" fill="#a05a20" filter="url(#rough2)">末行 f[j] = C(4, j−4)</text>
  <text x="393" y="290" text-anchor="middle" font-size="8" fill="#a07830" filter="url(#rough2)">＝从 4 组里挑 j−4 组</text>
  <text x="393" y="301" text-anchor="middle" font-size="8" fill="#a07830" filter="url(#rough2)">「留 2 个」的组合数</text>

  <text x="260" y="330" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">示例 3（aaabbb，k = 3）同理：bad = f[2] = 1，ans = 3×3 − 1 = 8 ✓</text>
</svg>
