<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14.5" fill="#333" font-weight="bold" filter="url(#rough2)">观察 2：dp 单调不减 ⟹ 跳跃游戏 II，match[i] 就是位置 i 的「跳力」</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">截短论证：跨过 i 的末段截短到 i 结束仍合法 ⟹ 「≤k 段可达」永远是前缀区间 [0, Rₖ]</text>

  <!-- 跳跃弧 -->
  <path d="M 60 150 Q 110 82 150 150" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="105" y="72" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i=0：0+2 → R₁=2</text>

  <path d="M 168 150 Q 235 58 304 150" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="235" y="48" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">i=2：2+3 → R₂=5</text>

  <path d="M 322 150 Q 388 58 452 150" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="387" y="48" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">i=5：5+3 → R₃=8 ✓</text>

  <!-- match 柱状图 -->
  <text x="48" y="206" text-anchor="end" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">match[i]→</text>
  <rect x="53" y="182" width="14" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="176" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="103" y="166" width="14" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="160" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="153" y="166" width="14" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="158" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="210" y="204" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="260" y="204" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <rect x="303" y="166" width="14" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="158" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="353" y="182" width="14" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="360" y="176" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="410" y="204" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>

  <!-- 数轴 -->
  <path d="M 45 214 L 475 214" stroke="#555" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 60 210 L 60 218 M 110 210 L 110 218 M 160 210 L 160 218 M 210 210 L 210 218 M 260 210 L 260 218 M 310 210 L 310 218 M 360 210 L 360 218 M 410 210 L 410 218 M 460 210 L 460 218" stroke="#555" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="232" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="110" y="232" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="160" y="232" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <text x="210" y="232" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>
  <text x="260" y="232" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4</text>
  <text x="310" y="232" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">5</text>
  <text x="360" y="232" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">6</text>
  <text x="410" y="232" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">7</text>
  <text x="460" y="232" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">8=n</text>

  <!-- 分层色带（dp 值） -->
  <rect x="54" y="246" width="12" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="60" y="263" text-anchor="middle" font-size="9" fill="#2c4a66" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="68" y="246" width="92" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="114" y="263" text-anchor="middle" font-size="10" fill="#3a5f30" font-weight="bold" filter="url(#rough2)">dp ≤ 1</text>
  <rect x="162" y="246" width="148" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="236" y="263" text-anchor="middle" font-size="10" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">dp ≤ 2</text>
  <rect x="312" y="246" width="148" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="386" y="263" text-anchor="middle" font-size="10" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">dp ≤ 3</text>

  <!-- 说明框 -->
  <rect x="40" y="296" width="440" height="70" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="316" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">Rₖ₊₁ = max { i + match[i] : i ≤ Rₖ }，首个 Rₖ ≥ n 的 k 即答案</text>
  <text x="260" y="336" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">旧层位置重复参与取 max 无害：可达集是前缀区间，它们早已被覆盖</text>
  <text x="260" y="356" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">卡死判据：farthest == end 且 end &lt; n → 返回 −1（示例 3：match=[0,0,0]）</text>
</svg>
