<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="720" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="360" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">示例演算：7 行 → 每员工判定 → 4 行结果</text>
  <path d="M 180 34 Q 360 42 540 34" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== Input table header ===== -->
  <g filter="url(#rough2)">
    <rect x="30" y="50" width="340" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
  </g>
  <text x="70" y="68" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">employee_id</text>
  <text x="180" y="68" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">department_id</text>
  <text x="300" y="68" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">primary_flag</text>

  <!-- row 1: 1 1 N (single) -->
  <g filter="url(#rough2)"><rect x="30" y="78" width="340" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/></g>
  <text x="70" y="93" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="180" y="93" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="300" y="93" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">N</text>

  <!-- row 2: 2 1 Y -->
  <g filter="url(#rough2)"><rect x="30" y="102" width="340" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/></g>
  <text x="70" y="117" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="180" y="117" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="300" y="117" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">Y</text>

  <!-- row 3: 2 2 N -->
  <g filter="url(#rough2)"><rect x="30" y="126" width="340" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3"/></g>
  <text x="70" y="141" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="180" y="141" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="300" y="141" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">N</text>

  <!-- row 4: 3 3 N (single) -->
  <g filter="url(#rough2)"><rect x="30" y="150" width="340" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/></g>
  <text x="70" y="165" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="180" y="165" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="300" y="165" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">N</text>

  <!-- row 5: 4 2 N -->
  <g filter="url(#rough2)"><rect x="30" y="174" width="340" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3"/></g>
  <text x="70" y="189" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="180" y="189" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="300" y="189" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">N</text>

  <!-- row 6: 4 3 Y -->
  <g filter="url(#rough2)"><rect x="30" y="198" width="340" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/></g>
  <text x="70" y="213" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="180" y="213" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="300" y="213" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">Y</text>

  <!-- row 7: 4 4 N -->
  <g filter="url(#rough2)"><rect x="30" y="222" width="340" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3"/></g>
  <text x="70" y="237" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="180" y="237" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="300" y="237" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">N</text>

  <!-- arrow to right -->
  <path d="M 374 150 L 410 150" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="142" text-anchor="middle" font-size="9" fill="#888">判定</text>

  <!-- ===== Right: per-employee decision ===== -->
  <g filter="url(#rough2)">
    <rect x="414" y="56" width="280" height="200" rx="8" fill="#fff" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <text x="554" y="74" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">按员工分组判定</text>

  <!-- emp 1 -->
  <g filter="url(#rough2)"><rect x="430" y="82" width="250" height="36" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="444" y="98" font-size="10" fill="#d6a040" font-weight="bold">emp 1</text>
  <text x="444" y="112" font-size="9" fill="#555">仅 1 部门 → 取 dept 1</text>
  <text x="666" y="105" text-anchor="end" font-size="10" fill="#4a7a3a" font-weight="bold">✓ 1</text>

  <!-- emp 2 -->
  <g filter="url(#rough2)"><rect x="430" y="122" width="250" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="444" y="138" font-size="10" fill="#446688" font-weight="bold">emp 2</text>
  <text x="444" y="152" font-size="9" fill="#555">2 部门 → 取 flag='Y' → dept 1</text>
  <text x="666" y="145" text-anchor="end" font-size="10" fill="#4a7a3a" font-weight="bold">✓ 1</text>

  <!-- emp 3 -->
  <g filter="url(#rough2)"><rect x="430" y="162" width="250" height="36" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="444" y="178" font-size="10" fill="#d6a040" font-weight="bold">emp 3</text>
  <text x="444" y="192" font-size="9" fill="#555">仅 1 部门 → 取 dept 3</text>
  <text x="666" y="185" text-anchor="end" font-size="10" fill="#4a7a3a" font-weight="bold">✓ 3</text>

  <!-- emp 4 -->
  <g filter="url(#rough2)"><rect x="430" y="202" width="250" height="36" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="444" y="218" font-size="10" fill="#446688" font-weight="bold">emp 4</text>
  <text x="444" y="232" font-size="9" fill="#555">3 部门 → 取 flag='Y' → dept 3</text>
  <text x="666" y="225" text-anchor="end" font-size="10" fill="#4a7a3a" font-weight="bold">✓ 3</text>

  <!-- ===== Final result ===== -->
  <path d="M 554 256 L 554 280" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="30" y="284" width="660" height="96" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="50" y="306" font-size="11" fill="#4a7a3a" font-weight="bold">最终结果（employee_id, department_id）：</text>

  <g filter="url(#rough2)"><rect x="50" y="314" width="120" height="24" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="3"/></g>
  <text x="110" y="330" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">emp 1 · dept 1</text>

  <g filter="url(#rough2)"><rect x="190" y="314" width="120" height="24" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="3"/></g>
  <text x="250" y="330" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">emp 2 · dept 1</text>

  <g filter="url(#rough2)"><rect x="330" y="314" width="120" height="24" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="3"/></g>
  <text x="390" y="330" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">emp 3 · dept 3</text>

  <g filter="url(#rough2)"><rect x="470" y="314" width="120" height="24" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="3"/></g>
  <text x="530" y="330" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">emp 4 · dept 3</text>

  <text x="360" y="358" text-anchor="middle" font-size="10" fill="#888">黄=单部门（分支 B）；蓝=多部门取 Y（分支 A）</text>
  <text x="360" y="372" text-anchor="middle" font-size="9" fill="#888">两分支结果集互斥，UNION 合并即完整答案</text>
</svg>
