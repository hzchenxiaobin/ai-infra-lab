<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：每段恰贡献一个 +max、一个 −min —— 环上「选点配对」</text>

  <!-- 面板一：环形划分与带符号选点 -->
  <rect x="18" y="30" width="484" height="138" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="46" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">① 示例 1：nums = [1,2,3,3]，k = 2 —— 划成 [2,3] 与 [3,1]（环绕）</text>

  <ellipse cx="125" cy="106" rx="56" ry="40" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <path d="M 164.6 77.7 A 56 40 0 0 1 164.6 134.3" fill="none" stroke="#4a7a3a" stroke-width="5" filter="url(#rough2)"/>
  <path d="M 85.4 134.3 A 56 40 0 0 1 164.6 77.7" fill="none" stroke="#d6a040" stroke-width="5" filter="url(#rough2)"/>
  <path d="M 160 73 L 169 83" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 81 129 L 90 139" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="172" y="80" font-size="8" fill="#b85450" filter="url(#rough2)">切割点</text>

  <rect x="109" y="55" width="32" height="26" rx="4" fill="#ffffff" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="125" y="73" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="165" y="93" width="32" height="26" rx="4" fill="#ffffff" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="181" y="111" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="109" y="131" width="32" height="26" rx="4" fill="#ffffff" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="125" y="149" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="53" y="93" width="32" height="26" rx="4" fill="#ffffff" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="69" y="111" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <circle cx="147" cy="52" r="9.5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="147" y="56" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">−1</text>
  <circle cx="201" cy="89" r="9.5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="201" y="93" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">−2</text>
  <circle cx="148" cy="156" r="9.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="148" y="160" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">+3</text>
  <circle cx="48" cy="89" r="9.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48" y="93" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">+3</text>

  <text x="252" y="66" font-size="10" fill="#333" filter="url(#rough2)">每段恰出一个「+max」和一个「−min」</text>
  <text x="252" y="84" font-size="10" fill="#333" filter="url(#rough2)">得分 = (3−2) + (3−1) = 3 = (+3−2) + (+3−1)</text>
  <text x="252" y="102" font-size="10" fill="#b85450" filter="url(#rough2)">⇒ 得分 = 带符号选点之和，与「怎么配对」无关！</text>
  <text x="252" y="120" font-size="10" fill="#333" filter="url(#rough2)">预算：至多 k 段 ⇔ 至多 2k 个选点</text>
  <text x="252" y="138" font-size="10" fill="#333" filter="url(#rough2)">段 = 环上一条弧 ⇒ 同段两选点在环上相邻，</text>
  <text x="252" y="156" font-size="10" fill="#333" filter="url(#rough2)">即选点序列恰能两两配成一 (+, −) 对</text>

  <!-- 面板二：线性化与三个平衡窗口 -->
  <rect x="18" y="174" width="484" height="176" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="190" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">② 线性化：平衡 B = #(+选点) − #(−选点) 要全程待在一个宽度 3 的窗口里</text>

  <rect x="36" y="198" width="34" height="24" rx="4" fill="#ffffff" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="53" y="215" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="76" y="198" width="34" height="24" rx="4" fill="#ffffff" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="93" y="215" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="116" y="198" width="34" height="24" rx="4" fill="#ffffff" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="133" y="215" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="156" y="198" width="34" height="24" rx="4" fill="#ffffff" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="173" y="215" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="30" y="238" text-anchor="end" font-size="8.5" fill="#666" filter="url(#rough2)">选点</text>
  <text x="53" y="238" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">−1</text>
  <text x="93" y="238" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">−2</text>
  <text x="133" y="238" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">+3</text>
  <text x="173" y="238" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">+3</text>

  <path d="M 40 252 L 228 252" stroke="#999" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 40 270 L 228 270" stroke="#999" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 40 288 L 228 288" stroke="#999" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="34" y="255" text-anchor="end" font-size="8.5" fill="#666" filter="url(#rough2)">0</text>
  <text x="34" y="273" text-anchor="end" font-size="8.5" fill="#666" filter="url(#rough2)">−1</text>
  <text x="34" y="291" text-anchor="end" font-size="8.5" fill="#666" filter="url(#rough2)">−2</text>
  <text x="34" y="246" text-anchor="end" font-size="8.5" fill="#666" filter="url(#rough2)">B</text>

  <path d="M 53 252 L 93 270 L 133 288 L 173 270 L 213 252" fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="53" cy="252" r="2.8" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="93" cy="270" r="2.8" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="133" cy="288" r="2.8" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="173" cy="270" r="2.8" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="213" cy="252" r="2.8" fill="#b85450" filter="url(#rough2)"/>
  <text x="219" y="248" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">回到 0 ✓</text>
  <text x="40" y="306" font-size="8.5" fill="#666" filter="url(#rough2)">B 触到 −2 ⇒ 本例只有窗口 [−2,0] 容得下</text>

  <text x="244" y="268" font-size="9" fill="#333" filter="url(#rough2)">窗口 [−1,1]</text>
  <rect x="366" y="256" width="22" height="17" rx="3" fill="#eeeeee" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="377" y="268" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">−2</text>
  <rect x="390" y="256" width="22" height="17" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="401" y="268" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">−1</text>
  <rect x="414" y="256" width="22" height="17" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="425" y="268" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">0</text>
  <rect x="438" y="256" width="22" height="17" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="449" y="268" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="462" y="256" width="22" height="17" rx="3" fill="#eeeeee" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="473" y="268" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">2</text>

  <text x="244" y="298" font-size="9" fill="#333" filter="url(#rough2)">窗口 [0,2]</text>
  <rect x="366" y="286" width="22" height="17" rx="3" fill="#eeeeee" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="377" y="298" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">−2</text>
  <rect x="390" y="286" width="22" height="17" rx="3" fill="#eeeeee" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="401" y="298" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">−1</text>
  <rect x="414" y="286" width="22" height="17" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="425" y="298" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">0</text>
  <rect x="438" y="286" width="22" height="17" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="449" y="298" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="462" y="286" width="22" height="17" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="473" y="298" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">2</text>

  <text x="244" y="328" font-size="9" fill="#333" filter="url(#rough2)"><tspan fill="#b85450">✓ </tspan>窗口 [−2,0]</text>
  <rect x="366" y="316" width="22" height="17" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="377" y="328" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">−2</text>
  <rect x="390" y="316" width="22" height="17" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="401" y="328" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">−1</text>
  <rect x="414" y="316" width="22" height="17" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="425" y="328" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">0</text>
  <rect x="438" y="316" width="22" height="17" rx="3" fill="#eeeeee" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="449" y="328" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">1</text>
  <rect x="462" y="316" width="22" height="17" rx="3" fill="#eeeeee" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>
  <text x="473" y="328" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">2</text>

  <text x="24" y="346" font-size="8.5" fill="#666" filter="url(#rough2)">语义：[−1,1]＝断点弧不跨断点（顺次配对）；[0,2] / [−2,0]＝断点弧跨断点、首个选点为 + / −（首尾配对）</text>
</svg>
