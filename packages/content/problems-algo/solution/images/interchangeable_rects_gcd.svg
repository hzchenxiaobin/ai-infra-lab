<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">GCD 化简宽高比：精确归一化</text>

  <!-- Float problem box -->
  <rect x="30" y="46" width="240" height="84" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="45" y="66" font-size="11" fill="#b85450" font-weight="bold">浮点除法的风险</text>
  <text x="45" y="84" font-size="10" fill="#555" font-family="monospace">4/3 = 1.3333...33</text>
  <text x="45" y="100" font-size="10" fill="#555" font-family="monospace">8/6 = 1.3333...33</text>
  <text x="45" y="118" font-size="9" fill="#888">w,h 高达 10⁹，舍入误差易出错</text>

  <!-- Arrow -->
  <path d="M 272 88 L 292 88" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- GCD solution box -->
  <rect x="294" y="46" width="240" height="84" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="309" y="66" font-size="11" fill="#4a7a3a" font-weight="bold">GCD 归一化（精确）</text>
  <text x="309" y="84" font-size="10" fill="#555" font-family="monospace">g = gcd(w, h)</text>
  <text x="309" y="100" font-size="10" fill="#555" font-family="monospace">键 = (w/g, h/g)</text>
  <text x="309" y="118" font-size="9" fill="#888">相同比例 → 相同键，100% 可靠</text>

  <!-- Examples table -->
  <text x="280" y="154" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">归一化示例</text>

  <!-- Header -->
  <rect x="30" y="168" width="500" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="70" y="186" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">矩形</text>
  <text x="140" y="186" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">w</text>
  <text x="200" y="186" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">h</text>
  <text x="280" y="186" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">gcd</text>
  <text x="370" y="186" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">归一化键</text>
  <text x="490" y="186" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">比例</text>

  <!-- Row 1 -->
  <rect x="30" y="196" width="500" height="24" fill="#f5f5f5" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="70" y="212" text-anchor="middle" font-size="10" fill="#333">R₁</text>
  <text x="140" y="212" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">4</text>
  <text x="200" y="212" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">3</text>
  <text x="280" y="212" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">1</text>
  <text x="370" y="212" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" font-family="monospace">(4, 3)</text>
  <text x="490" y="212" text-anchor="middle" font-size="9" fill="#888">4:3</text>

  <!-- Row 2 -->
  <rect x="30" y="222" width="500" height="24" fill="#fff" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="70" y="238" text-anchor="middle" font-size="10" fill="#333">R₂</text>
  <text x="140" y="238" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">8</text>
  <text x="200" y="238" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">6</text>
  <text x="280" y="238" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">2</text>
  <text x="370" y="238" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" font-family="monospace">(4, 3)</text>
  <text x="490" y="238" text-anchor="middle" font-size="9" fill="#888">8:6=4:3</text>

  <!-- Row 3 -->
  <rect x="30" y="248" width="500" height="24" fill="#f5f5f5" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="70" y="264" text-anchor="middle" font-size="10" fill="#333">R₃</text>
  <text x="140" y="264" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">12</text>
  <text x="200" y="264" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">9</text>
  <text x="280" y="264" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">3</text>
  <text x="370" y="264" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" font-family="monospace">(4, 3)</text>
  <text x="490" y="264" text-anchor="middle" font-size="9" fill="#888">12:9=4:3</text>

  <!-- Row 4: different ratio -->
  <rect x="30" y="274" width="500" height="24" fill="#fff" stroke="#ccc" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="70" y="290" text-anchor="middle" font-size="10" fill="#333">R₄</text>
  <text x="140" y="290" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">6</text>
  <text x="200" y="290" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">4</text>
  <text x="280" y="290" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">2</text>
  <text x="370" y="290" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" font-family="monospace">(3, 2)</text>
  <text x="490" y="290" text-anchor="middle" font-size="9" fill="#888">6:4=3:2</text>

  <!-- Result note -->
  <rect x="30" y="308" width="500" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="45" y="326" font-size="11" fill="#d6a040" font-weight="bold">分组结果</text>
  <text x="130" y="326" font-size="10" fill="#555">(4,3) → {R₁, R₂, R₃} 共 3 个 → C(3,2) = 3 对</text>
  <text x="45" y="342" font-size="10" fill="#555">(3,2) → {R₄} 共 1 个 → C(1,2) = 0 对</text>
</svg>
