<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：两标志逐步追踪</text>

  <!-- ======== Example 1: [1,2,2,3] → true ======== -->
  <text x="40" y="58" font-size="12" fill="#4a7a3a" font-weight="bold">示例 1：nums = [1, 2, 2, 3] → true</text>

  <!-- header row -->
  <rect x="36" y="68" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="61" y="84" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">步骤</text>
  <rect x="88" y="68" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="116" y="84" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">i</text>
  <rect x="146" y="68" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="84" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">比较</text>
  <rect x="228" y="68" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="278" y="84" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">动作</text>
  <rect x="330" y="68" width="86" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="373" y="84" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">increasing</text>
  <rect x="418" y="68" width="86" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="461" y="84" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">decreasing</text>

  <!-- row 1: i=1, 2>1 -->
  <rect x="36" y="94" width="50" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="61" y="109" text-anchor="middle" font-size="10" fill="#555">1</text>
  <rect x="88" y="94" width="56" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="116" y="109" text-anchor="middle" font-size="10" fill="#555">1</text>
  <rect x="146" y="94" width="80" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="186" y="109" text-anchor="middle" font-size="10" fill="#4a7a3a">2 &gt; 1 ↑</text>
  <rect x="228" y="94" width="100" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="278" y="109" text-anchor="middle" font-size="10" fill="#446688">dec = false</text>
  <rect x="330" y="94" width="86" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="373" y="109" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">true</text>
  <rect x="418" y="94" width="86" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="461" y="109" text-anchor="middle" font-size="10" fill="#b85450">false</text>

  <!-- row 2: i=2, 2==2 -->
  <rect x="36" y="118" width="50" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="61" y="133" text-anchor="middle" font-size="10" fill="#555">2</text>
  <rect x="88" y="118" width="56" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="116" y="133" text-anchor="middle" font-size="10" fill="#555">2</text>
  <rect x="146" y="118" width="80" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="186" y="133" text-anchor="middle" font-size="10" fill="#888">2 = 2 →</text>
  <rect x="228" y="118" width="100" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="278" y="133" text-anchor="middle" font-size="10" fill="#888">跳过</text>
  <rect x="330" y="118" width="86" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="373" y="133" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">true</text>
  <rect x="418" y="118" width="86" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="461" y="133" text-anchor="middle" font-size="10" fill="#b85450">false</text>

  <!-- row 3: i=3, 3>2 -->
  <rect x="36" y="142" width="50" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="61" y="157" text-anchor="middle" font-size="10" fill="#555">3</text>
  <rect x="88" y="142" width="56" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="116" y="157" text-anchor="middle" font-size="10" fill="#555">3</text>
  <rect x="146" y="142" width="80" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="186" y="157" text-anchor="middle" font-size="10" fill="#4a7a3a">3 &gt; 2 ↑</text>
  <rect x="228" y="142" width="100" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="278" y="157" text-anchor="middle" font-size="10" fill="#446688">dec 已 false</text>
  <rect x="330" y="142" width="86" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="373" y="157" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">true</text>
  <rect x="418" y="142" width="86" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="461" y="157" text-anchor="middle" font-size="10" fill="#b85450">false</text>

  <!-- result 1 -->
  <rect x="146" y="168" width="358" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="325" y="183" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">return true || false → true ✓ 单调递增</text>

  <!-- ======== Example 2: [1,3,2] → false ======== -->
  <text x="40" y="214" font-size="12" fill="#b85450" font-weight="bold">示例 2：nums = [1, 3, 2] → false</text>

  <rect x="36" y="224" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="61" y="240" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">步骤</text>
  <rect x="88" y="224" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="116" y="240" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">i</text>
  <rect x="146" y="224" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="240" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">比较</text>
  <rect x="228" y="224" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="278" y="240" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">动作</text>
  <rect x="330" y="224" width="86" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="373" y="240" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">increasing</text>
  <rect x="418" y="224" width="86" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="461" y="240" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">decreasing</text>

  <!-- initial state row -->
  <rect x="36" y="250" width="50" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="61" y="265" text-anchor="middle" font-size="10" fill="#888">初始</text>
  <rect x="88" y="250" width="56" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="116" y="265" text-anchor="middle" font-size="10" fill="#888">—</text>
  <rect x="146" y="250" width="80" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="186" y="265" text-anchor="middle" font-size="10" fill="#888">—</text>
  <rect x="228" y="250" width="100" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="278" y="265" text-anchor="middle" font-size="10" fill="#888">两 flag 均 true</text>
  <rect x="330" y="250" width="86" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="373" y="265" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">true</text>
  <rect x="418" y="250" width="86" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="461" y="265" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">true</text>

  <!-- row 1: i=1, 3>1 -->
  <rect x="36" y="274" width="50" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="61" y="289" text-anchor="middle" font-size="10" fill="#555">1</text>
  <rect x="88" y="274" width="56" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="116" y="289" text-anchor="middle" font-size="10" fill="#555">1</text>
  <rect x="146" y="274" width="80" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="186" y="289" text-anchor="middle" font-size="10" fill="#4a7a3a">3 &gt; 1 ↑</text>
  <rect x="228" y="274" width="100" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="278" y="289" text-anchor="middle" font-size="10" fill="#446688">dec = false</text>
  <rect x="330" y="274" width="86" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="373" y="289" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">true</text>
  <rect x="418" y="274" width="86" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="461" y="289" text-anchor="middle" font-size="10" fill="#b85450">false</text>

  <!-- row 2: i=2, 2<3 -->
  <rect x="36" y="298" width="50" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="61" y="313" text-anchor="middle" font-size="10" fill="#555">2</text>
  <rect x="88" y="298" width="56" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="116" y="313" text-anchor="middle" font-size="10" fill="#555">2</text>
  <rect x="146" y="298" width="80" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="186" y="313" text-anchor="middle" font-size="10" fill="#b85450">2 &lt; 3 ↓</text>
  <rect x="228" y="298" width="100" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="278" y="313" text-anchor="middle" font-size="10" fill="#b85450">inc = false ★</text>
  <rect x="330" y="298" width="86" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="373" y="313" text-anchor="middle" font-size="10" fill="#b85450">false</text>
  <rect x="418" y="298" width="86" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="461" y="313" text-anchor="middle" font-size="10" fill="#b85450">false</text>

  <!-- result 2 -->
  <rect x="146" y="324" width="358" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="325" y="339" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">return false || false → false ✗ 又升又降</text>

  <!-- ======== Bottom insight ======== -->
  <rect x="36" y="360" width="468" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="380" text-anchor="middle" font-size="11" fill="#a07820" font-weight="bold">关键：两标志互不干扰，各管一个方向</text>
  <text x="270" y="398" text-anchor="middle" font-size="10.5" fill="#555">等号（=）不触发任何标志 → 全等数组 [1,1,1] 两个 flag 都保持 true → true</text>
</svg>
