<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：[2,3,4,6] → 8，以及 [2,3,4,6,8,12] → 40</text>

  <!-- ===== Example 1: [2,3,4,6] ===== -->
  <text x="40" y="54" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 1：nums = [2,3,4,6]</text>

  <!-- array row -->
  <g filter="url(#rough2)" font-size="11" fill="#888">
    <text x="40" y="78">下标</text>
    <text x="84" y="78">0</text>
    <text x="118" y="78">1</text>
    <text x="152" y="78">2</text>
    <text x="186" y="78">3</text>
  </g>
  <g filter="url(#rough2)" font-size="13" font-weight="bold" text-anchor="middle">
    <rect x="68" y="84" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="84" y="103" fill="#446688">2</text>
    <rect x="102" y="84" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="118" y="103" fill="#446688">3</text>
    <rect x="136" y="84" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="152" y="103" fill="#446688">4</text>
    <rect x="170" y="84" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="186" y="103" fill="#446688">6</text>
  </g>

  <!-- pairs table -->
  <text x="220" y="92" font-size="10" fill="#888" filter="url(#rough2)">枚举 6 个数对 (i&lt;j)：</text>
  <g filter="url(#rough2)" font-size="10" fill="#555">
    <rect x="220" y="98" width="150" height="14" fill="#fff" stroke="#ddd" stroke-width="0.5"/>
    <text x="226" y="108">(0,1)=2·3=6</text>
    <rect x="220" y="112" width="150" height="14" fill="#fff" stroke="#ddd" stroke-width="0.5"/>
    <text x="226" y="122">(0,2)=2·4=8</text>
    <rect x="220" y="126" width="150" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="0.8"/>
    <text x="226" y="136" fill="#b85450" font-weight="bold">(0,3)=2·6=12  ★</text>
    <rect x="220" y="140" width="150" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="0.8"/>
    <text x="226" y="150" fill="#b85450" font-weight="bold">(1,2)=3·4=12  ★</text>
    <rect x="220" y="154" width="150" height="14" fill="#fff" stroke="#ddd" stroke-width="0.5"/>
    <text x="226" y="164">(1,3)=3·6=18</text>
    <rect x="220" y="168" width="150" height="14" fill="#fff" stroke="#ddd" stroke-width="0.5"/>
    <text x="226" y="178">(2,3)=4·6=24</text>
  </g>

  <!-- freq + contribution -->
  <rect x="384" y="84" width="140" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="454" y="102" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">freq 与贡献</text>
  <line x1="394" y1="108" x2="514" y2="108" stroke="#e8d090" stroke-width="1" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10" fill="#555">
    <text x="394" y="122">6:1, 8:1, 18:1, 24:1</text>
    <text x="394" y="136" fill="#b85450" font-weight="bold">12:2 ⇒ c=2</text>
    <text x="394" y="152" fill="#4a7a3a" font-weight="bold">贡献 = 4·2·1</text>
    <text x="394" y="168" fill="#4a7a3a" font-weight="bold">       = 8</text>
  </g>

  <!-- 8 tuples enumerated -->
  <rect x="40" y="120" width="170" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="52" y="138" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">8 个元组（c·(c−1)·4）：</text>
  <g filter="url(#rough2)" font-size="9" fill="#555">
    <text x="52" y="152">(2,6,3,4) (6,2,3,4)</text>
    <text x="52" y="164">(2,6,4,3) (6,2,4,3)</text>
    <text x="52" y="176">(3,4,2,6) (4,3,2,6)</text>
  </g>

  <!-- divider -->
  <line x1="40" y1="200" x2="520" y2="200" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Example 3: [2,3,4,6,8,12] ===== -->
  <text x="40" y="222" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">示例 3：nums = [2,3,4,6,8,12]（n=6，共 C(6,2)=15 对）</text>

  <!-- groups table -->
  <text x="40" y="244" font-size="10" fill="#888" filter="url(#rough2)">按乘积分组（只列 c≥2 的组）：</text>
  <g filter="url(#rough2)" font-size="10" fill="#555">
    <rect x="40" y="250" width="240" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="0.8"/>
    <text x="48" y="262" font-weight="bold" fill="#b85450">乘积 12： (2,6)(3,4)        c=2 → 4·2·1 = 8</text>
    <rect x="40" y="268" width="240" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="0.8"/>
    <text x="48" y="280" font-weight="bold" fill="#b85450">乘积 24： (2,12)(3,8)(4,6)   c=3 → 4·3·2 = 24</text>
    <rect x="40" y="286" width="240" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="0.8"/>
    <text x="48" y="298" font-weight="bold" fill="#b85450">乘积 48： (4,12)(6,8)        c=2 → 4·2·1 = 8</text>
  </g>
  <text x="48" y="322" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = 8 + 24 + 8 = 40 ✓</text>

  <!-- c=3 highlight box -->
  <rect x="300" y="250" width="220" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="410" y="268" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">重点看 c=3 的 24 个元组</text>
  <line x1="312" y1="274" x2="508" y2="274" stroke="#c0d0e8" stroke-width="1" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10" fill="#555">
    <text x="312" y="290">有序选两对：3·2 = 6 种</text>
    <text x="312" y="306">每对内交换：2·2 = 4 种</text>
    <text x="312" y="324" fill="#4a7a3a" font-weight="bold">合计 6 × 4 = 24 个元组</text>
  </g>

  <!-- bottom takeaway -->
  <rect x="40" y="352" width="480" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="52" y="372" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">要点：只需关注 c ≥ 2 的乘积组；c=1 的组无法凑出两对，贡献 0。</text>
  <text x="52" y="388" font-size="10" fill="#555" filter="url(#rough2)">每组贡献随 c 平方增长 —— 4·c·(c−1) ≈ 4c²，故同积数对越集中，元组数越大。</text>

  <text x="280" y="420" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">元素互异 ⇒ 同积两对必不相交（共下标则推出两元素相等），故无需查重</text>
  <text x="280" y="436" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">两阶段总开销：枚举 C(n,2) 个数对建表 + 至多 C(n,2) 项求和</text>
</svg>
