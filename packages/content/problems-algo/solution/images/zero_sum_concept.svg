<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：对称配对抵消 —— (−k) + k = 0</text>

  <text x="40" y="56" font-size="12" fill="#446688" font-weight="bold">偶数 n = 6：3 对相反数，和 = 0</text>

  <rect x="70" y="68" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="92" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">−3</text>
  <rect x="130" y="68" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">−2</text>
  <rect x="190" y="68" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="212" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">−1</text>
  <rect x="250" y="68" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="272" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="310" y="68" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="332" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="370" y="68" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="392" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <path d="M 92 100 Q 230 144 392 100" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="230" y="136" text-anchor="middle" font-size="10" fill="#446688">−3+3=0</text>
  <path d="M 152 100 Q 240 128 332 100" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="240" y="122" text-anchor="middle" font-size="10" fill="#4a7a3a">−2+2=0</text>
  <path d="M 212 100 Q 250 116 272 100" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="250" y="112" text-anchor="middle" font-size="10" fill="#d6a040">−1+1=0</text>

  <rect x="430" y="72" width="92" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="476" y="89" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">总和 = 0 ✓</text>

  <text x="40" y="178" font-size="12" fill="#446688" font-weight="bold">奇数 n = 5：2 对相反数 + 一个 0，和 = 0</text>

  <rect x="100" y="190" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="210" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">−2</text>
  <rect x="160" y="190" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="182" y="210" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">−1</text>
  <rect x="220" y="190" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="242" y="210" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">0</text>
  <rect x="280" y="190" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="302" y="210" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="340" y="190" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="362" y="210" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <path d="M 122 222 Q 240 256 362 222" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="240" y="248" text-anchor="middle" font-size="10" fill="#4a7a3a">−2+2=0</text>
  <path d="M 182 222 Q 260 242 302 222" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="260" y="234" text-anchor="middle" font-size="10" fill="#d6a040">−1+1=0</text>

  <text x="242" y="270" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">↑ 0 自身为零，不影响总和</text>

  <rect x="410" y="194" width="112" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="466" y="211" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">总和 = 0 ✓</text>

  <rect x="40" y="296" width="460" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="318" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">构造策略</text>
  <text x="60" y="340" font-size="12" fill="#333">• 偶数 n = 2m：生成 m 对相反数 (−1,1), (−2,2), …, (−m,m)，共 2m = n 个不同整数</text>
  <text x="60" y="360" font-size="12" fill="#333">• 奇数 n = 2m+1：同上 m 对相反数，再补一个 0，共 2m+1 = n 个不同整数</text>
  <text x="60" y="376" font-size="11" fill="#b85450" font-weight="bold">关键：0 是唯一「加入不改变和」的数，补 0 一举两得</text>
</svg>
