<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">3×3 矩阵里只有 4 个候选 2×2 窗口</text>

  <!-- 3x3 grid, cell 48, origin (60,60) -->
  <rect x="60" y="60" width="48" height="48" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="108" y="60" width="48" height="48" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="156" y="60" width="48" height="48" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="60" y="108" width="48" height="48" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="108" y="108" width="48" height="48" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="156" y="108" width="48" height="48" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="60" y="156" width="48" height="48" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="108" y="156" width="48" height="48" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="156" y="156" width="48" height="48" fill="#ffffff" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- row/col indices -->
  <text x="48" y="88" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="48" y="136" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">1</text>
  <text x="48" y="184" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">2</text>
  <text x="84" y="52" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="132" y="52" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">1</text>
  <text x="180" y="52" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">2</text>

  <!-- four dashed windows, slightly offset for visibility -->
  <rect x="54" y="54" width="106" height="106" fill="none" stroke="#446688" stroke-width="2.2" rx="6" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <rect x="104" y="58" width="106" height="106" fill="none" stroke="#4a7a3a" stroke-width="2.2" rx="6" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <rect x="58" y="104" width="106" height="106" fill="none" stroke="#d6a040" stroke-width="2.2" rx="6" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <rect x="110" y="110" width="100" height="100" fill="none" stroke="#b85450" stroke-width="2.2" rx="6" stroke-dasharray="7 5" filter="url(#rough2)"/>

  <!-- legend -->
  <rect x="250" y="66" width="18" height="18" fill="none" stroke="#446688" stroke-width="2" rx="4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="278" y="80" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">窗口① 左上角 (0,0)</text>
  <rect x="250" y="100" width="18" height="18" fill="none" stroke="#4a7a3a" stroke-width="2" rx="4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="278" y="114" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">窗口② 左上角 (0,1)</text>
  <rect x="250" y="134" width="18" height="18" fill="none" stroke="#d6a040" stroke-width="2" rx="4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="278" y="148" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">窗口③ 左上角 (1,0)</text>
  <rect x="250" y="168" width="18" height="18" fill="none" stroke="#b85450" stroke-width="2" rx="4" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="278" y="182" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">窗口④ 左上角 (1,1)</text>

  <rect x="240" y="210" width="300" height="56" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="390" y="232" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">2×2 子正方形个数 = (3 − 2 + 1)² = 4</text>
  <text x="390" y="252" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">枚举量固定为 4，与数据无关 → O(1)</text>

  <text x="132" y="240" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每个窗口只需数 4 个格子里的 B</text>
  <text x="132" y="258" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">总共 4 × 4 = 16 次检查</text>
</svg>
