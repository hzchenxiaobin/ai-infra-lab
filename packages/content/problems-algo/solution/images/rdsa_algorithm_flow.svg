<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="430" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一次遍历快慢双指针</text>

  <!-- Start node -->
  <ellipse cx="270" cy="62" rx="98" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="12" fill="#333">开始: slow = 1, fast = 1（首元素必保留）</text>

  <!-- arrow down -->
  <path d="M 270 82 L 270 98" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: fast < n? -->
  <polygon points="270,102 370,148 270,194 170,148" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="144" text-anchor="middle" font-size="12" fill="#333">fast &lt; n ?</text>
  <text x="270" y="160" text-anchor="middle" font-size="11" fill="#666">(还有未扫描元素)</text>

  <!-- No branch -> end -->
  <path d="M 370 148 L 450 148" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="140" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="490" cy="148" rx="44" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="152" text-anchor="middle" font-size="12" fill="#333">返回 slow</text>

  <!-- Yes branch down -->
  <path d="M 270 194 L 270 212" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="208" font-size="11" fill="#82b366">是</text>

  <!-- Decision: nums[fast] != nums[slow-1]? -->
  <polygon points="270,216 390,262 270,308 150,262" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="258" text-anchor="middle" font-size="11" fill="#333">nums[fast] ≠</text>
  <text x="270" y="274" text-anchor="middle" font-size="11" fill="#333">nums[slow−1] ?</text>

  <!-- Yes (not equal) -> write -->
  <path d="M 150 262 L 80 262" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="254" text-anchor="middle" font-size="11" fill="#82b366">是</text>
  <rect x="10" y="240" width="68" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="44" y="258" text-anchor="middle" font-size="10" fill="#333">nums[slow]</text>
  <text x="44" y="272" text-anchor="middle" font-size="10" fill="#333">= nums[fast]</text>
  <text x="44" y="284" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">slow++</text>

  <!-- No (equal) -> skip annotation -->
  <path d="M 390 262 L 460 262" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="425" y="254" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <rect x="460" y="240" width="64" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="492" y="260" text-anchor="middle" font-size="10" fill="#333">已有一份</text>
  <text x="492" y="274" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">跳过</text>

  <!-- Both branches merge -> fast++ -->
  <path d="M 44 286 L 44 320 L 270 320" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 492 286 L 492 320 L 270 320" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- fast++ box -->
  <rect x="200" y="326" width="140" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="348" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">fast++</text>

  <!-- loop back arrow -->
  <path d="M 270 362 L 270 382 L 50 382 L 50 148 L 170 148" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="50" y="265" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 50 265)">继续循环</text>

  <!-- summary note -->
  <text x="270" y="414" text-anchor="middle" font-size="11" fill="#888">关键：slow ≤ fast 恒成立，覆写不破坏未读数据；slow 只增不减 → O(n)</text>
</svg>
