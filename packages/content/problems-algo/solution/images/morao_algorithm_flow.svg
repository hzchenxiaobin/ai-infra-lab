<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：四步求最小操作数</text>

  <!-- ===== Step 1: 棋盘染色 ===== -->
  <rect x="50" y="50" width="420" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="70" y="72" font-size="12" fill="#446688" font-weight="bold">Step 1  棋盘染色</text>
  <text x="70" y="90" font-size="11" fill="#555">遍历 grid，按 (i+j) % 2 将格子分两组：</text>
  <text x="70" y="104" font-size="11" fill="#555">B = 偶数格（黑），W = 奇数格（白）。相邻格子必异组 → 天然二分图</text>
  <!-- mini checkerboard icon -->
  <g filter="url(#rough2)">
    <rect x="390" y="62" width="18" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2"/>
    <rect x="408" y="62" width="18" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2"/>
    <rect x="390" y="80" width="18" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2"/>
    <rect x="408" y="80" width="18" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2"/>
  </g>

  <path d="M 260 116 L 260 132" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: 建二分图 ===== -->
  <rect x="50" y="136" width="420" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="70" y="158" font-size="12" fill="#4a7a3a" font-weight="bold">Step 2  建二分图</text>
  <text x="70" y="176" font-size="11" fill="#555">以 W 组中值为 1 的格子为左部点，向四邻方向中 B 组值为 1 的格子</text>
  <text x="70" y="190" font-size="11" fill="#555">连无向边。每条边代表一对「相邻的 1」，需删掉至少一端</text>
  <!-- mini graph icon -->
  <g filter="url(#rough2)">
    <circle cx="400" cy="158" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <circle cx="426" cy="148" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <circle cx="426" cy="172" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <line x1="407" y1="156" x2="419" y2="150" stroke="#bbb" stroke-width="1.2"/>
    <line x1="407" y1="162" x2="419" y2="168" stroke="#bbb" stroke-width="1.2"/>
  </g>

  <path d="M 260 202 L 260 218" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: 匈牙利算法 ===== -->
  <rect x="50" y="222" width="420" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="70" y="244" font-size="12" fill="#a87020" font-weight="bold">Step 3  匈牙利算法（DFS 增广）</text>
  <text x="70" y="262" font-size="11" fill="#555">枚举 W 组每个 1-点 u，DFS 找增广路：</text>
  <text x="70" y="276" font-size="11" fill="#555">  • 邻居 v 未匹配 → 直接 match[v]=u，匹配数+1</text>
  <text x="70" y="290" font-size="11" fill="#555">  • 邻居 v 已匹配 → 递归让 match[v] 另寻新配对，成功则 match[v]=u</text>

  <path d="M 260 300 L 260 316" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 4: 返回答案 ===== -->
  <rect x="50" y="320" width="420" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="70" y="342" font-size="12" fill="#b85450" font-weight="bold">Step 4  返回答案</text>
  <text x="70" y="360" font-size="11" fill="#555">最大匹配数 = 最小点覆盖（König 定理）= 最小操作数</text>
  <text x="280" y="360" font-size="12" fill="#b85450" font-weight="bold">return ans</text>
</svg>
