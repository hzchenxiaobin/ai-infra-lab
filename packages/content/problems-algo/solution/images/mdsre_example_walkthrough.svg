<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [7, 9, 5, 8, 1, 3]，n = 2</text>
  <text x="290" y="42" text-anchor="middle" font-size="11" fill="#888">枚举分界点 i = 1, 2, 3，逐个算 leftMinSum − rightMaxSum</text>

  <!-- ===== Row 1: i = 1 ===== -->
  <text x="40" y="68" font-size="11" fill="#b85450" font-weight="bold">i = 1</text>

  <!-- array cells, boundary after index 1 -->
  <rect x="80" y="76" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="99" y="96" text-anchor="middle" font-size="11" fill="#333">7</text>
  <rect x="122" y="76" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="141" y="96" text-anchor="middle" font-size="11" fill="#333">9</text>

  <line x1="166" y1="72" x2="166" y2="112" stroke="#b85450" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <rect x="172" y="76" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="191" y="96" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="214" y="76" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="233" y="96" text-anchor="middle" font-size="11" fill="#333">8</text>
  <rect x="256" y="76" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="275" y="96" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="298" y="76" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="317" y="96" text-anchor="middle" font-size="11" fill="#333">3</text>

  <!-- computations -->
  <text x="356" y="88" font-size="10.5" fill="#446688">左段 {7,9} 留 2 小 → 7+9 = 16</text>
  <text x="356" y="103" font-size="10.5" fill="#4a7a3a">右段 {5,8,1,3} 留 2 大 → 8+5 = 13</text>
  <rect x="510" y="80" width="56" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="538" y="98" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">16−13=3</text>

  <!-- ===== Row 2: i = 2 (optimal) ===== -->
  <text x="40" y="134" font-size="11" fill="#b85450" font-weight="bold">i = 2</text>

  <rect x="80" y="142" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="99" y="162" text-anchor="middle" font-size="11" fill="#333">7</text>
  <rect x="122" y="142" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="141" y="162" text-anchor="middle" font-size="11" fill="#333">9</text>
  <rect x="164" y="142" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="183" y="162" text-anchor="middle" font-size="11" fill="#333">5</text>

  <line x1="208" y1="138" x2="208" y2="178" stroke="#b85450" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <rect x="214" y="142" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="233" y="162" text-anchor="middle" font-size="11" fill="#333">8</text>
  <rect x="256" y="142" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="275" y="162" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="298" y="142" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="317" y="162" text-anchor="middle" font-size="11" fill="#333">3</text>

  <text x="356" y="154" font-size="10.5" fill="#446688">左段 {7,9,5} 留 2 小 → 5+7 = 12</text>
  <text x="356" y="169" font-size="10.5" fill="#4a7a3a">右段 {8,1,3} 留 2 大 → 8+3 = 11</text>
  <rect x="506" y="146" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="536" y="164" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">12−11=1</text>
  <text x="536" y="180" text-anchor="middle" font-size="9" fill="#4a7a3a">✓ 最优</text>

  <!-- ===== Row 3: i = 3 ===== -->
  <text x="40" y="200" font-size="11" fill="#b85450" font-weight="bold">i = 3</text>

  <rect x="80" y="208" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="99" y="228" text-anchor="middle" font-size="11" fill="#333">7</text>
  <rect x="122" y="208" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="141" y="228" text-anchor="middle" font-size="11" fill="#333">9</text>
  <rect x="164" y="208" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="183" y="228" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="206" y="208" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="225" y="228" text-anchor="middle" font-size="11" fill="#333">8</text>

  <line x1="250" y1="204" x2="250" y2="244" stroke="#b85450" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <rect x="256" y="208" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="275" y="228" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="298" y="208" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="317" y="228" text-anchor="middle" font-size="11" fill="#333">3</text>

  <text x="356" y="220" font-size="10.5" fill="#446688">左段 {7,9,5,8} 留 2 小 → 5+7 = 12</text>
  <text x="356" y="235" font-size="10.5" fill="#4a7a3a">右段 {1,3} 留 2 大 → 3+1 = 4</text>
  <rect x="510" y="212" width="56" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="538" y="230" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">12−4=8</text>

  <!-- ===== Summary ===== -->
  <path d="M 290 252 L 290 272" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="278" width="340" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="300" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">ans = min(3, 1, 8) = 1</text>

  <!-- ===== Heap evolution note ===== -->
  <text x="40" y="336" font-size="11" fill="#446688" font-weight="bold">大根堆演化（左段，留 n=2 个最小）：</text>

  <rect x="40" y="346" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="85" y="363" text-anchor="middle" font-size="10" fill="#333">i=1: {7,9}</text>

  <path d="M 132 359 L 148 359" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="354" text-anchor="middle" font-size="8" fill="#888">+5</text>

  <rect x="152" y="346" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="197" y="363" text-anchor="middle" font-size="10" fill="#333">i=2: {5,7}</text>
  <text x="197" y="384" text-anchor="middle" font-size="8" fill="#b85450">挤出 9</text>

  <path d="M 244 359 L 260 359" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="252" y="354" text-anchor="middle" font-size="8" fill="#888">+8</text>

  <rect x="264" y="346" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="309" y="363" text-anchor="middle" font-size="10" fill="#333">i=3: {5,7}</text>
  <text x="309" y="384" text-anchor="middle" font-size="8" fill="#888">8 太大，不入</text>

  <text x="370" y="363" font-size="10" fill="#888">leftMinSum = [16, 12, 12]</text>

  <!-- right heap evolution -->
  <text x="40" y="406" font-size="11" fill="#4a7a3a" font-weight="bold">小根堆演化（右段，留 n=2 个最大）：</text>

  <rect x="40" y="414" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="85" y="429" text-anchor="middle" font-size="10" fill="#333">i=1: {8,5}</text>

  <path d="M 132 425 L 148 425" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="152" y="414" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="197" y="429" text-anchor="middle" font-size="10" fill="#333">i=2: {8,3}</text>

  <path d="M 244 425 L 260 425" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="264" y="414" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="309" y="429" text-anchor="middle" font-size="10" fill="#333">i=3: {3,1}</text>

  <text x="370" y="429" font-size="10" fill="#888">rightMaxSum = [13, 11, 4]</text>
</svg>
