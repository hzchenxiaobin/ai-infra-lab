<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：数轴上区间涂色 ——「先查已涂长度，再标记整段」</text>

  <!-- Number line -->
  <text x="30" y="66" font-size="12" fill="#888">数轴（单位格 [x, x+1)）：</text>

  <!-- grid cells 0..9 -->
  <rect x="60" y="76" width="48" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="84" y="98" text-anchor="middle" font-size="11" fill="#aaa">0</text>

  <rect x="110" y="76" width="48" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="134" y="98" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>

  <rect x="160" y="76" width="48" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="184" y="98" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>

  <rect x="210" y="76" width="48" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="234" y="98" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>

  <rect x="260" y="76" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="284" y="98" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>

  <rect x="310" y="76" width="48" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="334" y="98" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>

  <rect x="360" y="76" width="48" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="384" y="98" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>

  <rect x="410" y="76" width="48" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="434" y="98" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>

  <rect x="460" y="76" width="48" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="484" y="98" text-anchor="middle" font-size="11" fill="#aaa">8</text>

  <rect x="510" y="76" width="48" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="534" y="98" text-anchor="middle" font-size="11" fill="#aaa">9</text>

  <!-- legend -->
  <rect x="60" y="128" width="18" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="84" y="140" font-size="10" fill="#555">已涂（第0天 [1,4)）</text>

  <rect x="200" y="128" width="18" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="224" y="140" font-size="10" fill="#555">本次新涂</text>

  <rect x="310" y="128" width="18" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="334" y="140" font-size="10" fill="#555">本次查询（已涂/未涂混合）</text>

  <rect x="480" y="128" width="18" height="14" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="504" y="140" font-size="10" fill="#555">未涂</text>

  <!-- Step: query -->
  <text x="30" y="180" font-size="12" fill="#555" font-weight="bold">第2天 [4,7)：先 query 已涂数量</text>

  <rect x="60" y="190" width="48" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="110" y="190" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="160" y="190" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="210" y="190" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>

  <!-- query bracket [4,7) -->
  <path d="M 260 186 L 260 180 L 410 180 L 410 186" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="335" y="174" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">query [4,7) → 已涂=0</text>

  <rect x="260" y="190" width="48" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="284" y="210" text-anchor="middle" font-size="11" fill="#333">4</text>

  <rect x="310" y="190" width="48" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="334" y="210" text-anchor="middle" font-size="11" fill="#333">5</text>

  <rect x="360" y="190" width="48" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="384" y="210" text-anchor="middle" font-size="11" fill="#333">6</text>

  <rect x="410" y="190" width="48" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="470" y="196" width="140" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="540" y="215" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">新涂 = 3−0 = 3</text>

  <!-- Step: modify -->
  <text x="30" y="252" font-size="12" fill="#555" font-weight="bold">再 modify [4,7) → 整段标记为已涂</text>

  <rect x="60" y="262" width="48" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="110" y="262" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="160" y="262" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <rect x="210" y="262" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>

  <rect x="260" y="262" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="284" y="282" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>

  <rect x="310" y="262" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="334" y="282" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>

  <rect x="360" y="262" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="384" y="282" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>

  <rect x="410" y="262" width="48" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>

  <!-- arrow -->
  <path d="M 540 232 L 540 250" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Summary box -->
  <rect x="60" y="318" width="500" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="340" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">线段树节点维护：v = 区间内已涂格子数</text>
  <text x="310" y="358" text-anchor="middle" font-size="11" fill="#555">每次操作：query([l,r]) 查已涂数 → 新涂 = (r−l) − query → modify([l,r]) 标记</text>

  <!-- complexity -->
  <text x="310" y="400" text-anchor="middle" font-size="11" fill="#888">每次 query / modify 均 O(log U)，U = 坐标范围；总计 O(n log U)</text>

  <text x="310" y="424" text-anchor="middle" font-size="10" fill="#aaa">懒标记 add：整段标记为已涂时不必下传到叶子，查询时再 pushdown</text>
</svg>
