<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程</text>

  <!-- start -->
  <rect x="200" y="40" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="15" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="12" fill="#333">开始</text>
  <path d="M 260 70 L 260 88" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 1: counter -->
  <rect x="160" y="90" width="200" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="112" text-anchor="middle" font-size="12" fill="#333">Counter 统计，弹出 cnt[0]</text>
  <path d="M 260 126 L 260 144" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2: init -->
  <rect x="160" y="146" width="200" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="168" text-anchor="middle" font-size="12" fill="#333">f[0] = cnt[0]+1，开到 r</text>
  <path d="M 260 182 L 260 200" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop over values -->
  <rect x="150" y="202" width="220" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="224" text-anchor="middle" font-size="12" fill="#333">取下一个非零值 v（次数 c）</text>
  <path d="M 260 238 L 260 256" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision: v > r -->
  <polygon points="260,258 340,288 260,318 180,288" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="292" text-anchor="middle" font-size="11" fill="#333">v &gt; r ?</text>
  <!-- yes: skip back to loop -->
  <path d="M 340 288 Q 420 288 420 220 Q 420 202 370 220" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="400" y="272" text-anchor="middle" font-size="11" fill="#b85450">跳过</text>
  <!-- no: continue -->
  <path d="M 260 318 L 260 336" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="330" font-size="10" fill="#4a7a3a">否</text>

  <!-- slide window transfer -->
  <rect x="120" y="338" width="280" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="360" text-anchor="middle" font-size="12" fill="#333">每条余数链上滑动窗口转移</text>
  <!-- loop back -->
  <path d="M 120 356 Q 50 356 50 220 Q 50 202 150 220" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="60" y="300" text-anchor="middle" font-size="10" fill="#888">值遍历完?</text>

  <!-- final: sum -->
  <path d="M 400 356 Q 460 356 460 380 L 400 380" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="200" y="368" width="200" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="390" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">答案 = Σ f[l..r] mod 1e9+7</text>

  <text x="470" y="336" font-size="10" fill="#888">完</text>
</svg>
