<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心思路：ID 为奇数 ∧ 名字不以 'M' 开头 → bonus = salary，否则 0</text>

  <!-- ===== Two condition gates ===== -->
  <rect x="40" y="48" width="220" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="150" y="66" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">条件 ①</text>
  <text x="150" y="82" text-anchor="middle" font-size="9.5" fill="#333">employee_id % 2 = 1（奇数）</text>

  <text x="310" y="74" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">AND</text>

  <rect x="360" y="48" width="220" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="470" y="66" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">条件 ②</text>
  <text x="470" y="82" text-anchor="middle" font-size="9.5" fill="#333">name NOT LIKE 'M%'（非 M 开头）</text>

  <!-- arrows from conditions converging -->
  <path d="M150 90 L150 104" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M470 90 L470 104" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== Two output paths ===== -->
  <rect x="60" y="108" width="230" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="175" y="126" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">两条件均 ✓</text>
  <text x="175" y="140" text-anchor="middle" font-size="10" fill="#4a7a3a">→ bonus = salary</text>

  <rect x="330" y="108" width="230" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="445" y="126" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">任一条件 ✗</text>
  <text x="445" y="140" text-anchor="middle" font-size="10" fill="#b85450">→ bonus = 0</text>

  <!-- ===== Representative employees ===== -->
  <text x="40" y="170" font-size="10" fill="#555" font-weight="bold">三类代表员工：</text>

  <!-- Employee 1: id=2 Meir, fails cond1 (even) -->
  <rect x="40" y="178" width="270" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="52" y="196" font-size="9.5" fill="#333" font-weight="bold">id=2  Meir  salary=3000</text>
  <text x="52" y="212" font-size="9" fill="#b85450">① ✗ 偶数  ② —</text>
  <text x="52" y="224" font-size="9.5" fill="#b85450" font-weight="bold">→ bonus = 0</text>
  <path d="M310 202 L330 128" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Employee 2: id=3 Michael, passes cond1, fails cond2 (M) -->
  <rect x="175" y="232" width="270" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="187" y="250" font-size="9.5" fill="#333" font-weight="bold">id=3  Michael  salary=3800</text>
  <text x="187" y="266" font-size="9" fill="#333">① <tspan fill="#4a7a3a">✓ 奇数</tspan>  ② <tspan fill="#b85450">✗ M 开头</tspan></text>
  <text x="187" y="278" font-size="9.5" fill="#b85450" font-weight="bold">→ bonus = 0</text>
  <path d="M445 280 L445 150" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Employee 3: id=7 Addilyn, passes both -->
  <rect x="310" y="178" width="270" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="322" y="196" font-size="9.5" fill="#333" font-weight="bold">id=7  Addilyn  salary=7400</text>
  <text x="322" y="212" font-size="9" fill="#4a7a3a">① ✓ 奇数  ② ✓ 非 M</text>
  <text x="322" y="224" font-size="9.5" fill="#4a7a3a" font-weight="bold">→ bonus = 7400</text>
  <path d="M310 202 L290 128" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== Key insight ===== -->
  <rect x="20" y="294" width="580" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="312" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">关键洞察</text>
  <text x="36" y="328" font-size="9.5" fill="#333">• bonus 非此即彼：<tspan fill="#4a7a3a" font-weight="bold">两条件全满足</tspan>拿全额 salary，<tspan fill="#b85450" font-weight="bold">否则一律 0</tspan>——天然适合 <tspan font-family="monospace" fill="#446688">CASE WHEN ... THEN ... ELSE 0</tspan></text>
  <text x="36" y="342" font-size="9.5" fill="#333">• 失败原因有三种：① 偶数 ID（id=2/8）② 名字以 M 开头（id=3）③ 两者皆不满足——但结果都是 0，无需区分</text>

  <!-- ===== SQL snippet ===== -->
  <rect x="20" y="360" width="580" height="32" fill="#f5f5f5" stroke="#888" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="34" y="380" font-size="9.5" fill="#446688" font-family="monospace">SELECT employee_id, CASE WHEN employee_id % 2 = 1 AND name NOT LIKE 'M%' THEN salary ELSE 0 END AS bonus FROM Employees ORDER BY employee_id;</text>
</svg>
