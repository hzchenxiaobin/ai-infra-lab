<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#666"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">状态压缩 DP：用三进制编码 9 个篮子的占用情况</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">每个篮子容量 2 → 占用数 ∈ {0,1,2} → 天然对应一位三进制</text>

  <!-- ===== Left: 3x3 grid of baskets ===== -->
  <text x="40" y="72" font-size="11.5" fill="#446688" font-weight="bold">① 9 个篮子（编号 1–9，每个容量 2）</text>

  <!-- Basket 1: row0 col0, occ=2, items [1,4] -->
  <rect x="40" y="80" width="72" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="48" y="94" font-size="9.5" fill="#4a7a3a" font-weight="bold">#1</text>
  <rect x="46" y="100" width="28" height="26" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="117" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="78" y="100" width="28" height="26" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="92" y="117" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>

  <!-- Basket 2: row0 col1, occ=2, items [2,6] -->
  <rect x="120" y="80" width="72" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="128" y="94" font-size="9.5" fill="#4a7a3a" font-weight="bold">#2</text>
  <rect x="126" y="100" width="28" height="26" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="140" y="117" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="158" y="100" width="28" height="26" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="172" y="117" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>

  <!-- Basket 3: row0 col2, occ=2, items [3,5] -->
  <rect x="200" y="80" width="72" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="208" y="94" font-size="9.5" fill="#4a7a3a" font-weight="bold">#3</text>
  <rect x="206" y="100" width="28" height="26" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="220" y="117" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="238" y="100" width="28" height="26" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="252" y="117" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>

  <!-- Basket 4: row1 col0, occ=0 -->
  <rect x="40" y="138" width="72" height="50" fill="#fff" stroke="#bbb" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="48" y="152" font-size="9.5" fill="#888" font-weight="bold">#4</text>
  <rect x="46" y="158" width="28" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="78" y="158" width="28" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <!-- Basket 5: row1 col1, occ=0 -->
  <rect x="120" y="138" width="72" height="50" fill="#fff" stroke="#bbb" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="128" y="152" font-size="9.5" fill="#888" font-weight="bold">#5</text>
  <rect x="126" y="158" width="28" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="158" y="158" width="28" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <!-- Basket 6: row1 col2, occ=0 -->
  <rect x="200" y="138" width="72" height="50" fill="#fff" stroke="#bbb" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="208" y="152" font-size="9.5" fill="#888" font-weight="bold">#6</text>
  <rect x="206" y="158" width="28" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="238" y="158" width="28" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <!-- Basket 7: row2 col0, occ=0 -->
  <rect x="40" y="196" width="72" height="50" fill="#fff" stroke="#bbb" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="48" y="210" font-size="9.5" fill="#888" font-weight="bold">#7</text>
  <rect x="46" y="216" width="28" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="78" y="216" width="28" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <!-- Basket 8: row2 col1, occ=0 -->
  <rect x="120" y="196" width="72" height="50" fill="#fff" stroke="#bbb" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="128" y="210" font-size="9.5" fill="#888" font-weight="bold">#8</text>
  <rect x="126" y="216" width="28" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="158" y="216" width="28" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <!-- Basket 9: row2 col2, occ=0 -->
  <rect x="200" y="196" width="72" height="50" fill="#fff" stroke="#bbb" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="208" y="210" font-size="9.5" fill="#888" font-weight="bold">#9</text>
  <rect x="206" y="216" width="28" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="238" y="216" width="28" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>

  <!-- digit string below grid -->
  <text x="40" y="266" font-size="10.5" fill="#555">占用位 d₁..d₉ =</text>
  <rect x="120" y="252" width="20" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="130" y="267" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="142" y="252" width="20" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="152" y="267" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="164" y="252" width="20" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="174" y="267" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="186" y="252" width="20" height="20" fill="#fff" stroke="#ccc" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="196" y="267" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <rect x="208" y="252" width="20" height="20" fill="#fff" stroke="#ccc" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="218" y="267" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <rect x="230" y="252" width="20" height="20" fill="#fff" stroke="#ccc" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="240" y="267" text-anchor="middle" font-size="11" fill="#aaa">0</text>
  <rect x="252" y="252" width="20" height="20" fill="#fff" stroke="#ccc" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="262" y="267" text-anchor="middle" font-size="11" fill="#aaa">0</text>

  <!-- formula -->
  <rect x="40" y="284" width="232" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="156" y="302" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">state = d₁·3⁰ + d₂·3¹ + … + d₉·3⁸</text>
  <text x="156" y="320" text-anchor="middle" font-size="10.5" fill="#555">= 2·1 + 2·3 + 2·9 = 26</text>
  <text x="156" y="334" text-anchor="middle" font-size="9.5" fill="#888">此例仅用 3 个篮子（numSlots=3）</text>

  <!-- ===== Right: encoding & recurrence ===== -->
  <line x1="300" y1="60" x2="300" y2="400" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <text x="430" y="72" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">② 状态空间与 DP 转移</text>

  <!-- state space box -->
  <rect x="320" y="84" width="220" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="104" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">状态总数 = 3^numSlots</text>
  <text x="430" y="122" text-anchor="middle" font-size="11" fill="#333">numSlots ≤ 9 → 3⁹ = 19683</text>

  <!-- arrow -->
  <path d="M 430 138 L 430 152" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- recurrence box -->
  <rect x="320" y="156" width="220" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="176" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">转移：把下一个数 x 放入篮子 i</text>
  <text x="430" y="194" text-anchor="middle" font-size="10" fill="#555">dp[s + 3ⁱ] =</text>
  <text x="430" y="210" text-anchor="middle" font-size="10" fill="#555">max( dp[s+3ⁱ], dp[s] + (x &amp; (i+1)) )</text>
  <text x="430" y="224" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">仅当 dᵢ &lt; 2（篮子 i 还有空位）</text>

  <!-- arrow -->
  <path d="M 430 234 L 430 248" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- meaning box -->
  <rect x="320" y="252" width="220" height="74" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="430" y="272" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">为什么「计数状态」足够？</text>
  <text x="430" y="288" text-anchor="middle" font-size="9.5" fill="#555">约束只有「每篮 ≤ 2」</text>
  <text x="430" y="302" text-anchor="middle" font-size="9.5" fill="#555">按固定顺序放数，同一 cnt(s)</text>
  <text x="430" y="316" text-anchor="middle" font-size="9.5" fill="#555">对应放同一批数，取 max 即可</text>

  <!-- bottom note -->
  <text x="40" y="362" font-size="11" fill="#444" font-weight="bold">关键：把「分配问题」压缩成「占用状态上的最短路」——状态数仅 19683，可暴力枚举转移</text>

  <!-- mini transition illustration -->
  <rect x="40" y="376" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="80" y="392" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">状态 s</text>
  <text x="80" y="405" text-anchor="middle" font-size="9" fill="#888">已放 cnt 个数</text>

  <path d="M 120 393 L 175 393" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="148" y="386" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">+3ⁱ</text>

  <rect x="175" y="376" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="225" y="392" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">状态 s + 3ⁱ</text>
  <text x="225" y="405" text-anchor="middle" font-size="9" fill="#888">+ (x &amp; (i+1))</text>

  <path d="M 275 393 L 330 393" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="330" y="376" width="210" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="435" y="392" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">枚举所有篮子 i（有空位者）</text>
  <text x="435" y="405" text-anchor="middle" font-size="9" fill="#888">逐状态递推，取最大与和</text>
</svg>
