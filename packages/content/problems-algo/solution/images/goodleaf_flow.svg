<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">dfs(node) 返回「node 到子树各叶子的距离列表」</text>

  <!-- 入口 -->
  <rect x="220" y="44" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="12" fill="#333">调用 dfs(node)</text>
  <path d="M 280 72 L 280 82" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判空 菱形 -->
  <path d="M 280 82 L 350 112 L 280 142 L 210 112 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="116" text-anchor="middle" font-size="11" fill="#333">node == null?</text>

  <!-- 是 → return [] -->
  <path d="M 350 112 L 440 112" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="104" font-size="10" fill="#4a7a3a">是</text>
  <rect x="440" y="98" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="490" y="116" text-anchor="middle" font-size="11" fill="#333">return [ ]</text>

  <!-- 否 → 判叶 -->
  <path d="M 280 142 L 280 152" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="150" font-size="10" fill="#b85450">否</text>

  <path d="M 280 152 L 360 182 L 280 212 L 200 182 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="180" text-anchor="middle" font-size="10" fill="#333">无左右孩子?</text>
  <text x="280" y="194" text-anchor="middle" font-size="10" fill="#333">(叶子节点)</text>

  <!-- 是 → return [0] -->
  <path d="M 360 182 L 440 182" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="174" font-size="10" fill="#4a7a3a">是</text>
  <rect x="440" y="168" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="490" y="186" text-anchor="middle" font-size="11" fill="#333">return [0]</text>

  <!-- 否 → 递归左右 -->
  <path d="M 280 212 L 280 222" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="220" font-size="10" fill="#b85450">否</text>

  <rect x="160" y="222" width="240" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="241" text-anchor="middle" font-size="11" fill="#333">left = dfs(node.left)　right = dfs(node.right)</text>

  <path d="M 280 252 L 280 262" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 配对计数 -->
  <rect x="110" y="262" width="340" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="281" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">枚举 d₁ ∈ left, d₂ ∈ right</text>
  <text x="280" y="298" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">若 d₁ + d₂ + 2 ≤ distance → ans++</text>

  <path d="M 280 306 L 280 316" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 返回 -->
  <rect x="120" y="316" width="320" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="338" text-anchor="middle" font-size="11" fill="#333">return [d+1 for d in left+right if d+1 &lt; distance]</text>

  <!-- 底部说明 -->
  <rect x="40" y="370" width="480" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="390" text-anchor="middle" font-size="11" fill="#555">叶子 → [0]　·　空节点 → [ ]　·　距离 +1 后剪枝 ≥ distance 的项</text>
  <text x="280" y="410" text-anchor="middle" font-size="11" fill="#555">每对叶子恰在唯一 LCA 处被计数一次（左叶 + 右叶）</text>
</svg>
