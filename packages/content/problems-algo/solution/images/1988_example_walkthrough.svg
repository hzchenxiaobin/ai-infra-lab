<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="480" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：三所学校 × 三档分数的截止线推演</text>

  <!-- Cumulative reference table -->
  <rect x="200" y="42" width="200" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="60" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">累计表（共用）</text>
  <line x1="210" y1="68" x2="390" y2="68" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="225" y="84" font-size="10" fill="#888">score</text>
  <text x="300" y="84" font-size="10" fill="#888">count</text>
  <text x="365" y="84" font-size="10" fill="#888">cum</text>
  <text x="232" y="102" font-size="11" fill="#333">100</text>
  <text x="305" y="102" font-size="11" fill="#333">3</text>
  <text x="365" y="102" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="232" y="118" font-size="11" fill="#333">90</text>
  <text x="305" y="118" font-size="11" fill="#333">5</text>
  <text x="365" y="118" font-size="11" fill="#4a7a3a" font-weight="bold">8</text>
  <text x="232" y="134" font-size="11" fill="#333">80</text>
  <text x="305" y="134" font-size="11" fill="#333">7</text>
  <text x="365" y="134" font-size="11" fill="#4a7a3a" font-weight="bold">15</text>

  <!-- School 1 -->
  <rect x="30" y="150" width="170" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="115" y="170" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">School 1 (cap=10)</text>
  <line x1="40" y1="178" x2="190" y2="178" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="45" y="194" font-size="10" fill="#333">cum=3 ≤10 ✓</text>
  <text x="45" y="210" font-size="10" fill="#4a7a3a" font-weight="bold">cum=8 ≤10 ✓ ←max</text>
  <text x="45" y="226" font-size="10" fill="#b85450">cum=15 &gt;10 ✗</text>
  <text x="45" y="240" font-size="11" fill="#d6a040" font-weight="bold">→ cutoff = 90</text>

  <!-- School 2 -->
  <rect x="215" y="150" width="170" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="170" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">School 2 (cap=5)</text>
  <line x1="225" y1="178" x2="375" y2="178" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="230" y="194" font-size="10" fill="#4a7a3a" font-weight="bold">cum=3 ≤5 ✓ ←max</text>
  <text x="230" y="210" font-size="10" fill="#b85450">cum=8 &gt;5 ✗</text>
  <text x="230" y="226" font-size="10" fill="#b85450">cum=15 &gt;5 ✗</text>
  <text x="230" y="240" font-size="11" fill="#d6a040" font-weight="bold">→ cutoff = 100</text>

  <!-- School 3 -->
  <rect x="400" y="150" width="170" height="96" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="485" y="170" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">School 3 (cap=2)</text>
  <line x1="410" y1="178" x2="560" y2="178" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="415" y="194" font-size="10" fill="#b85450">cum=3 &gt;2 ✗</text>
  <text x="415" y="210" font-size="10" fill="#b85450">cum=8 &gt;2 ✗</text>
  <text x="415" y="226" font-size="10" fill="#b85450">cum=15 &gt;2 ✗</text>
  <text x="415" y="240" font-size="11" fill="#b85450" font-weight="bold">→ cutoff = -1</text>

  <!-- Arrow down -->
  <path d="M 300 248 L 300 268" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Output table -->
  <rect x="150" y="272" width="300" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="292" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">输出结果</text>
  <line x1="170" y1="300" x2="430" y2="300" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="200" y="316" font-size="10.5" fill="#888">school_id</text>
  <text x="350" y="316" font-size="10.5" fill="#888">score</text>
  <text x="210" y="336" font-size="12" fill="#333">1</text>
  <text x="350" y="336" font-size="12" fill="#4a7a3a" font-weight="bold">90</text>
  <text x="210" y="354" font-size="12" fill="#333">2</text>
  <text x="350" y="354" font-size="12" fill="#4a7a3a" font-weight="bold">100</text>
  <text x="210" y="372" font-size="12" fill="#333">3</text>
  <text x="350" y="372" font-size="12" fill="#b85450" font-weight="bold">-1</text>

  <!-- Insight box -->
  <rect x="30" y="388" width="540" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="410" font-size="11" fill="#b85450" font-weight="bold">⚠️ 三种边界一图打尽：</text>
  <text x="50" y="428" font-size="10.5" fill="#666">School 1：正常截断——cum 跨过 capacity 时取前一个分数（90），录取 8 人</text>
  <text x="50" y="444" font-size="10.5" fill="#666">School 2：只录取最高分档——3 ≤ 5 但 8 &gt; 5，cutoff=100，录取 3 人</text>
  <text x="50" y="460" font-size="10.5" fill="#666">School 3：最高分档就超容——3 &gt; 2，无合法截止线，返回 -1</text>
</svg>
