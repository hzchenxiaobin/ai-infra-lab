<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：栈顶匹配 popped[j] 时，必须立刻弹</text>

  <!-- pushed 流（左）-->
  <text x="40" y="60" font-size="11" fill="#888">pushed 流（按序压入）</text>
  <rect x="40" y="68" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="57" y="86" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <rect x="78" y="68" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="95" y="86" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <rect x="116" y="68" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="133" y="86" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
  <rect x="154" y="68" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="171" y="86" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">4</text>
  <path d="M 196 81 L 232 140" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 栈（中）-->
  <text x="262" y="118" text-anchor="middle" font-size="11" fill="#888">栈 st</text>
  <rect x="230" y="200" width="64" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="262" y="218" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <rect x="230" y="174" width="64" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="262" y="192" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <rect x="230" y="148" width="64" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="262" y="166" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
  <rect x="230" y="122" width="64" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="262" y="140" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4 ←顶</text>

  <!-- popped 指针（右）-->
  <text x="380" y="60" font-size="11" fill="#888">popped 待弹序列</text>
  <rect x="360" y="68" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="377" y="86" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4</text>
  <rect x="398" y="68" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="415" y="86" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">5</text>
  <rect x="436" y="68" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="453" y="86" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
  <rect x="474" y="68" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="491" y="86" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <rect x="512" y="68" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="529" y="86" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <text x="360" y="108" font-size="10" fill="#4a7a3a" font-weight="bold">↑ popped[j]</text>

  <!-- 匹配连线：栈顶 4 → popped[0] 4 -->
  <path d="M 296 135 Q 330 110 360 81" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="5 3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 判定框 -->
  <rect x="120" y="250" width="160" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="200" y="272" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">栈顶 == popped[j]</text>
  <text x="200" y="292" text-anchor="middle" font-size="11" fill="#4a7a3a">立刻 pop，j++ ✅</text>
  <path d="M 262 200 L 230 250" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="300" y="250" width="160" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="380" y="272" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">栈顶 != popped[j]</text>
  <text x="380" y="292" text-anchor="middle" font-size="11" fill="#d6a040">只能继续 push ⏳</text>

  <!-- 底部论证 -->
  <rect x="30" y="324" width="500" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="50" y="344" font-size="11" fill="#b85450" font-weight="bold">为什么不延迟弹？</text>
  <text x="50" y="360" font-size="10.5" fill="#555">LIFO：再 push 会把栈顶埋住，之后想弹它必先弹新元素，但 popped[j+1] 未必是新元素 → 局面更受限</text>
</svg>
