<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="330" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：排序定结构 —— 前 k 个最小，后 k 个最大</text>
  <text x="280" y="44" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">nums = [5,2,2,4]，k = 2（示例 1）</text>

  <!-- ① 原始数组 -->
  <text x="76" y="68" font-size="11" fill="#446688" filter="url(#rough2)">① 升序排序：入选哪些元素只看大小、不看位置</text>

  <rect x="72" y="76" width="56" height="26" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="94" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="148" y="76" width="56" height="26" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="176" y="94" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="224" y="76" width="56" height="26" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="252" y="94" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="300" y="76" width="56" height="26" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="328" y="94" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>

  <path d="M 214 106 L 214 130" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="230" y="124" font-size="11" fill="#446688" filter="url(#rough2)">sort</text>

  <!-- ② 排序后：前 k 绿、后 k 蓝 -->
  <rect x="66" y="132" width="144" height="50" rx="8" fill="none" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <rect x="72" y="138" width="56" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="159" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="148" y="138" width="56" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="176" y="159" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="138" y="179" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">minSum = 2+2 = 4</text>

  <rect x="218" y="132" width="144" height="50" rx="8" fill="none" stroke="#446688" stroke-width="1.2" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <rect x="224" y="138" width="56" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="252" y="159" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="300" y="138" width="56" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="328" y="159" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="290" y="179" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">maxSum = 4+5 = 9</text>

  <!-- 逐项配对箭头：a[0]→a[2]，a[1]→a[3] -->
  <path d="M 100 192 C 100 212, 252 212, 252 196" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 176 192 C 176 226, 328 226, 328 196" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <text x="214" y="244" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">② 逐项配对：a[n−k+i] ≥ a[i]（0 ≤ i &lt; k）</text>
  <text x="214" y="260" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">⇒ maxSum ≥ minSum 恒成立，无需 abs</text>

  <!-- 右侧说明框 -->
  <rect x="378" y="76" width="172" height="164" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="464" y="100" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">为什么 |·| 可以去掉？</text>
  <text x="464" y="122" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">排序后对每个 i：</text>
  <text x="464" y="140" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">a[n−k+i] ≥ a[i]</text>
  <text x="464" y="158" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">⇒ maxSum ≥ minSum</text>
  <text x="464" y="176" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">⇒ ans = maxSum − minSum</text>
  <text x="464" y="198" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">k &gt; n/2 时两端重叠：</text>
  <text x="464" y="212" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">重叠元素两边都计入，</text>
  <text x="464" y="226" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">不等式依旧成立，无需特判</text>

  <!-- 结论 -->
  <rect x="70" y="282" width="480" height="34" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="304" text-anchor="middle" font-size="12.5" fill="#b85450" filter="url(#rough2)">ans = maxSum − minSum = 9 − 4 = 5</text>
</svg>
