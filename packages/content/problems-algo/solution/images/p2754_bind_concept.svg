<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">bindPolyfill 原理：闭包捕获 fn + obj，返回新函数</text>

  <!-- Function f (blue) -->
  <rect x="30" y="56" width="160" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="110" y="78" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">function f(...)</text>
  <text x="110" y="96" text-anchor="middle" font-size="11" fill="#888">this = ??? (未绑定)</text>
  <text x="110" y="110" text-anchor="middle" font-size="10" fill="#aaa">待绑定的原函数</text>

  <!-- Object obj (green) -->
  <rect x="330" y="56" width="160" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="410" y="78" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">obj = { x: 10 }</text>
  <text x="410" y="96" text-anchor="middle" font-size="11" fill="#888">目标 this 上下文</text>
  <text x="410" y="110" text-anchor="middle" font-size="10" fill="#aaa">传入 bindPolyfill</text>

  <!-- bindPolyfill call -->
  <rect x="160" y="140" width="200" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="161" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">f.bindPolyfill(obj)</text>
  <text x="260" y="177" text-anchor="middle" font-size="10" fill="#888">this = f, 参数 = obj</text>

  <!-- arrows from f and obj to bindPolyfill -->
  <path d="M 110 116 Q 140 128 200 140" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 410 116 Q 380 128 320 140" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Closure box (yellow) -->
  <rect x="100" y="210" width="320" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="232" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">闭包（箭头函数）</text>
  <text x="260" y="252" text-anchor="middle" font-size="11" fill="#555">捕获 fn = this（= f）</text>
  <text x="260" y="268" text-anchor="middle" font-size="11" fill="#555">捕获 obj</text>
  <text x="260" y="284" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return fn.call(obj, ...args)</text>

  <!-- arrow from bindPolyfill to closure -->
  <path d="M 260 184 L 260 208" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- returned bound function -->
  <rect x="150" y="320" width="220" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="341" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">bound = 新函数</text>
  <text x="260" y="357" text-anchor="middle" font-size="10" fill="#888">调用时 this 永远 = obj</text>

  <!-- arrow from closure to bound function -->
  <path d="M 260 290 L 260 318" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
</svg>
