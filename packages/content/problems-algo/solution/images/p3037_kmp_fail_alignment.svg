<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">失配跳转的几何：j ← fail[j−1]，pattern 滑到最长相等前后缀处续比</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">示例：pattern = [1,1,0,1,1,1]，fail[4] = 2，已匹配 5 位后读到 c = 0</text>

  <!-- stream row -->
  <text x="40" y="72" font-size="10.5" fill="#888" filter="url(#rough2)">流 →</text>
  <rect x="80" y="52" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="75" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="124" y="52" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="144" y="75" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="168" y="52" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="188" y="75" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="212" y="52" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="232" y="75" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="256" y="52" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="276" y="75" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="300" y="52" width="40" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="75" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="356" y="74" font-size="15" fill="#555" filter="url(#rough2)">…</text>

  <text x="100" y="98" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">i−4</text>
  <text x="144" y="98" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">i−3</text>
  <text x="188" y="98" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">i−2</text>
  <text x="232" y="98" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">i−1</text>
  <text x="276" y="98" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">i</text>
  <text x="320" y="98" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">c</text>

  <!-- pattern row A -->
  <text x="30" y="146" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">pattern</text>

  <rect x="80" y="124" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.6" rx="4" filter="url(#rough2)"/>
  <text x="100" y="147" text-anchor="middle" font-size="14" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="124" y="124" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.6" rx="4" filter="url(#rough2)"/>
  <text x="144" y="147" text-anchor="middle" font-size="14" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="168" y="124" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="188" y="147" text-anchor="middle" font-size="14" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="212" y="124" width="40" height="36" fill="#e6f4ea" stroke="#d6a040" stroke-width="2.6" rx="4" filter="url(#rough2)"/>
  <text x="232" y="147" text-anchor="middle" font-size="14" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="256" y="124" width="40" height="36" fill="#e6f4ea" stroke="#d6a040" stroke-width="2.6" rx="4" filter="url(#rough2)"/>
  <text x="276" y="147" text-anchor="middle" font-size="14" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="300" y="124" width="40" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="147" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="100" y="118" text-anchor="middle" font-size="11" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="144" y="118" text-anchor="middle" font-size="11" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="188" y="118" text-anchor="middle" font-size="11" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="232" y="118" text-anchor="middle" font-size="11" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="276" y="118" text-anchor="middle" font-size="11" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="320" y="118" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <text x="372" y="136" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">j = 5</text>
  <text x="372" y="152" font-size="9.5" fill="#888" filter="url(#rough2)">已匹配 5 位，</text>
  <text x="372" y="165" font-size="9.5" fill="#888" filter="url(#rough2)">pattern[5]=1 ≠ c=0</text>

  <!-- prefix / suffix brace -->
  <path d="M 100 166 C 100 180, 122 182, 144 180" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 232 166 C 232 180, 254 182, 276 180" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 146 178 C 170 192, 208 192, 228 178" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="188" y="200" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">前缀 [1,1] == 后缀 [1,1] → fail[4] = 2</text>

  <!-- jump arrow -->
  <path d="M 460 146 C 492 170, 492 218, 462 240" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="470" y="196" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">j ← 2</text>
  <text x="470" y="210" font-size="9.5" fill="#b85450" filter="url(#rough2)">右滑 3 位</text>

  <!-- pattern row B -->
  <text x="30" y="266" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">pattern′</text>

  <rect x="212" y="248" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.6" rx="4" filter="url(#rough2)"/>
  <text x="232" y="271" text-anchor="middle" font-size="14" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="256" y="248" width="40" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.6" rx="4" filter="url(#rough2)"/>
  <text x="276" y="271" text-anchor="middle" font-size="14" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="300" y="248" width="40" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="271" text-anchor="middle" font-size="14" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="344" y="248" width="40" height="36" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="364" y="271" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">1</text>
  <text x="404" y="271" font-size="14" fill="#999" filter="url(#rough2)">…</text>

  <text x="232" y="242" text-anchor="middle" font-size="11" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">✓ 自动对齐</text>
  <text x="276" y="242" text-anchor="middle" font-size="11" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="320" y="242" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">pattern[2] vs c 续比</text>

  <text x="470" y="262" font-size="9.5" fill="#888" filter="url(#rough2)">起点右滑</text>
  <text x="470" y="276" font-size="9.5" fill="#888" filter="url(#rough2)">i−4 → i−1</text>

  <!-- insight box -->
  <rect x="36" y="304" width="448" height="102" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="326" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① fail[4]=2：前 5 位 [1,1,0,1,1] 的最长相等真前后缀是 [1,1]</text>
  <text x="260" y="348" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">② 右滑 3 位：前 2 位与流天然对齐，直接从 pattern[2] 续比 c（=0 ✓ 接上，j=3）</text>
  <text x="260" y="370" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">③ 跳过的起点 i−3、i−2 必然失配：它们要求更长的前后缀对齐，在前 5 位内自相矛盾</text>
  <text x="260" y="392" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">④ 续比仍失配？继续 j ← fail[j−1]，c 始终不变——直到接上或 j = 0</text>
</svg>
