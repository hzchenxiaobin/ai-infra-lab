<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：逐账户判定</text>

  <!-- ===== Table ===== -->
  <!-- Header row -->
  <rect x="30" y="40" width="520" height="28" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="58" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">acc</text>
  <text x="130" y="58" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">start_date</text>
  <text x="225" y="58" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">end_date</text>
  <text x="305" y="58" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">覆盖 2021?</text>
  <text x="390" y="58" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">stream_date</text>
  <text x="465" y="58" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">21 年流量?</text>
  <text x="530" y="58" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">计数?</text>

  <!-- Column separators -->
  <line x1="80" y1="40" x2="80" y2="320" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="180" y1="40" x2="180" y2="320" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="270" y1="40" x2="270" y2="320" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="340" y1="40" x2="340" y2="320" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="440" y1="40" x2="440" y2="320" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="490" y1="40" x2="490" y2="320" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1: acc 9 → counts -->
  <rect x="30" y="68" width="520" height="36" fill="#fce4ec" stroke="#eee" stroke-width="1" filter="url(#rough2)" opacity="0.6"/>
  <text x="55" y="90" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">9</text>
  <text x="130" y="90" text-anchor="middle" font-size="9" fill="#555">2020-02-18</text>
  <text x="225" y="90" text-anchor="middle" font-size="9" fill="#555">2021-10-30</text>
  <text x="305" y="90" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="390" y="90" text-anchor="middle" font-size="9" fill="#b85450">2020-05-16</text>
  <text x="465" y="90" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✗</text>
  <text x="530" y="90" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✓</text>

  <!-- Row 2: acc 3 → no count -->
  <rect x="30" y="104" width="520" height="36" fill="#fff" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="55" y="126" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">3</text>
  <text x="130" y="126" text-anchor="middle" font-size="9" fill="#555">2021-09-21</text>
  <text x="225" y="126" text-anchor="middle" font-size="9" fill="#555">2021-11-13</text>
  <text x="305" y="126" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="390" y="126" text-anchor="middle" font-size="9" fill="#4a7a3a">2021-10-27</text>
  <text x="465" y="126" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="530" y="126" text-anchor="middle" font-size="10" fill="#999">✗</text>

  <!-- Row 3: acc 11 → no sub in 2021 -->
  <rect x="30" y="140" width="520" height="36" fill="#f0f0f0" stroke="#eee" stroke-width="1" filter="url(#rough2)" opacity="0.7"/>
  <text x="55" y="162" text-anchor="middle" font-size="10" fill="#999" font-weight="bold">11</text>
  <text x="130" y="162" text-anchor="middle" font-size="9" fill="#999">2020-02-28</text>
  <text x="225" y="162" text-anchor="middle" font-size="9" fill="#999">2020-08-18</text>
  <text x="305" y="162" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✗</text>
  <text x="390" y="162" text-anchor="middle" font-size="9" fill="#999">2020-04-29</text>
  <text x="465" y="162" text-anchor="middle" font-size="8" fill="#999">—</text>
  <text x="530" y="162" text-anchor="middle" font-size="10" fill="#999">✗</text>

  <!-- Row 4: acc 13 → no count -->
  <rect x="30" y="176" width="520" height="36" fill="#fff" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="55" y="198" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">13</text>
  <text x="130" y="198" text-anchor="middle" font-size="9" fill="#555">2021-04-20</text>
  <text x="225" y="198" text-anchor="middle" font-size="9" fill="#555">2021-09-22</text>
  <text x="305" y="198" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="390" y="198" text-anchor="middle" font-size="9" fill="#4a7a3a">2021-08-08</text>
  <text x="465" y="198" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="530" y="198" text-anchor="middle" font-size="10" fill="#999">✗</text>

  <!-- Row 5: acc 4 → counts -->
  <rect x="30" y="212" width="520" height="36" fill="#fce4ec" stroke="#eee" stroke-width="1" filter="url(#rough2)" opacity="0.6"/>
  <text x="55" y="234" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">4</text>
  <text x="130" y="234" text-anchor="middle" font-size="9" fill="#555">2020-10-26</text>
  <text x="225" y="234" text-anchor="middle" font-size="9" fill="#555">2021-05-08</text>
  <text x="305" y="234" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="390" y="234" text-anchor="middle" font-size="9" fill="#b85450">2020-12-31</text>
  <text x="465" y="234" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✗</text>
  <text x="530" y="234" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✓</text>

  <!-- Row 6: acc 5 → no count -->
  <rect x="30" y="248" width="520" height="36" fill="#fff" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="55" y="270" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">5</text>
  <text x="130" y="270" text-anchor="middle" font-size="9" fill="#555">2020-09-11</text>
  <text x="225" y="270" text-anchor="middle" font-size="9" fill="#555">2021-01-17</text>
  <text x="305" y="270" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="390" y="270" text-anchor="middle" font-size="9" fill="#4a7a3a">2021-01-05</text>
  <text x="465" y="270" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="530" y="270" text-anchor="middle" font-size="10" fill="#999">✗</text>

  <!-- Table border -->
  <rect x="30" y="40" width="520" height="244" fill="none" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- ===== Summary ===== -->
  <rect x="30" y="300" width="520" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="318" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">判定逻辑</text>
  <text x="290" y="334" text-anchor="middle" font-size="9" fill="#666">覆盖 2021 ✓ 且 2021 年流量 ✗ → 计入；acc 4 和 acc 9 满足条件</text>

  <!-- ===== Result ===== -->
  <rect x="180" y="360" width="220" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="378" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">accounts_count</text>
  <line x1="200" y1="384" x2="380" y2="384" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="290" y="398" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- Notes -->
  <text x="60" y="414" font-size="8" fill="#b85450">红行：计入（有订阅无流量）</text>
  <text x="300" y="414" font-size="8" fill="#999">灰行：2021 无订阅，直接排除</text>
</svg>
