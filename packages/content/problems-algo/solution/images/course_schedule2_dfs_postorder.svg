<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto">
      <path d="M 0 0 L 8 0 L 4 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">DFS 后序压栈：递归离开时记录，逆序即拓扑序</text>

  <!-- ===== Left: DFS recursion tree ===== -->
  <text x="130" y="52" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">DFS 递归树</text>

  <!-- solid edges (real recursion) -->
  <path d="M 100 92 L 150 138" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 100 92 L 150 248" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 178 156 L 232 188" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- dashed skipped edge 2->3 already done -->
  <path d="M 178 248 L 250 216" stroke="#bbb" stroke-width="1.3" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Nodes with post-order number badges -->
  <circle cx="86" cy="80" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="86" y="85" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="104" y="58" width="20" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="114" y="70" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">#4</text>

  <circle cx="166" cy="150" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="166" y="155" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="184" y="128" width="20" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="194" y="140" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">#2</text>

  <circle cx="266" cy="196" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="266" y="201" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="284" y="174" width="20" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="294" y="186" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">#1</text>

  <circle cx="166" cy="262" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="166" y="267" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="184" y="240" width="20" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="194" y="252" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">#3</text>

  <text x="232" y="240" text-anchor="middle" font-size="9" fill="#999">已访问,跳过</text>

  <!-- leaf note -->
  <text x="266" y="232" text-anchor="middle" font-size="10" fill="#4a7a3a">叶节点先记</text>

  <!-- ===== Right: post-order stack -> reverse ===== -->
  <text x="430" y="52" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">后序栈(顶在上)</text>

  <!-- stack boxes top=#4(0) ... bottom=#1(3) ; push order #1 first at bottom -->
  <rect x="388" y="64" width="84" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="82" text-anchor="middle" font-size="12" fill="#333">0  (最后压)</text>

  <rect x="388" y="94" width="84" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="112" text-anchor="middle" font-size="12" fill="#333">2</text>

  <rect x="388" y="124" width="84" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="142" text-anchor="middle" font-size="12" fill="#333">1</text>

  <rect x="388" y="154" width="84" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="172" text-anchor="middle" font-size="12" fill="#333">3  (最先压)</text>

  <!-- reverse arrow -->
  <text x="430" y="206" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">逆序输出</text>
  <path d="M 430 194 L 430 214" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- topo order result -->
  <text x="430" y="240" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">拓扑序</text>
  <rect x="368" y="250" width="34" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="385" y="271" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="404" y="250" width="34" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="421" y="271" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="440" y="250" width="34" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="457" y="271" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="476" y="250" width="34" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="493" y="271" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <!-- ===== Bottom note ===== -->
  <rect x="30" y="300" width="500" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">节点在递归「离开」时(标记完成前)压入栈 → 栈中恰为后序序列</text>
  <text x="280" y="340" text-anchor="middle" font-size="11" fill="#555">后序 = 「先处理完所有后修再记自己」→ 逆序后先修在前 = 拓扑序</text>
  <text x="280" y="356" text-anchor="middle" font-size="11" fill="#b85450">遇到颜色「访问中」的节点即回边 → 有环，返回 []</text>
</svg>
