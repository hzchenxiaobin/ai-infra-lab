<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 368" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="368" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算："leetcoleet"，k = 2 —— 留下 "et"，共 3 次操作</text>

  <!-- 初始行 -->
  <text x="72" y="52" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">初始</text>

  <rect x="148" y="32" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="170" y="52" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">le</text>
  <rect x="198" y="32" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="220" y="52" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">et</text>
  <rect x="248" y="32" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="270" y="52" text-anchor="middle" font-size="14" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">co</text>
  <rect x="298" y="32" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="320" y="52" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">le</text>
  <rect x="348" y="32" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="370" y="52" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">et</text>

  <text x="170" y="76" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">块0</text>
  <text x="220" y="76" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">块1</text>
  <text x="270" y="76" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">块2</text>
  <text x="320" y="76" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">块3</text>
  <text x="370" y="76" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">块4</text>

  <!-- 操作 1 -->
  <text x="260" y="90" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">① i=0, j=2：块0 ← word[2..3] = "et"</text>
  <path d="M 270 94 L 270 104" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 行1 -->
  <rect x="148" y="106" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="126" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">et</text>
  <rect x="198" y="106" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="220" y="126" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">et</text>
  <rect x="248" y="106" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="270" y="126" text-anchor="middle" font-size="14" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">co</text>
  <rect x="298" y="106" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="320" y="126" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">le</text>
  <rect x="348" y="106" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="370" y="126" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">et</text>

  <!-- 操作 2 -->
  <text x="260" y="164" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">② i=4, j=0：块2 ← word[0..1] = "et"</text>
  <path d="M 270 168 L 270 178" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 行2 -->
  <rect x="148" y="180" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="170" y="200" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">et</text>
  <rect x="198" y="180" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="220" y="200" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">et</text>
  <rect x="248" y="180" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="270" y="200" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">et</text>
  <rect x="298" y="180" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="320" y="200" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">le</text>
  <rect x="348" y="180" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="370" y="200" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">et</text>

  <!-- 操作 3 -->
  <text x="260" y="238" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">③ i=6, j=0：块3 ← word[0..1] = "et"</text>
  <path d="M 270 242 L 270 252" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 行3 -->
  <rect x="148" y="254" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="170" y="274" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">et</text>
  <rect x="198" y="254" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="220" y="274" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">et</text>
  <rect x="248" y="254" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="270" y="274" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">et</text>
  <rect x="298" y="254" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="274" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">et</text>
  <rect x="348" y="254" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="370" y="274" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">et</text>

  <!-- 结论框 -->
  <rect x="60" y="296" width="400" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="315" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">终态 "etetetetet" = "et" × 5，是 k=2 周期串 ✓</text>
  <text x="260" y="334" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">答案 = m − max频率 = 5 − 2 = 3</text>

  <text x="260" y="358" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">初始 ≠ "et" 的块恰好 3 个（le、co、le），每块一次操作，一步不多</text>
</svg>
