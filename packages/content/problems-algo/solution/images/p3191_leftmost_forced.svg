<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 348" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="348" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：最左边的 0，只能靠「从它开始的窗口」修复</text>

  <text x="138" y="42" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">已锁定为 1 ✓</text>
  <text x="268" y="42" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">当前 i</text>
  <text x="372" y="42" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">尚未处理</text>

  <rect x="36" y="48" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="74" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">1</text>
  <rect x="88" y="48" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="74" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">1</text>
  <rect x="140" y="48" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="164" y="74" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">1</text>
  <rect x="192" y="48" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="216" y="74" text-anchor="middle" font-size="13" fill="#2f5d24" filter="url(#rough2)">1</text>
  <rect x="244" y="48" width="48" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="268" y="74" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="296" y="48" width="48" height="40" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="74" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">1</text>
  <rect x="348" y="48" width="48" height="40" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="372" y="74" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">0</text>
  <rect x="400" y="48" width="48" height="40" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="424" y="74" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">1</text>

  <text x="60" y="102" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="112" y="102" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="164" y="102" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="216" y="102" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>
  <text x="268" y="102" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="320" y="102" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">5</text>
  <text x="372" y="102" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">6</text>
  <text x="424" y="102" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">7</text>

  <path d="M 140 122 v 10 h 152 v -10" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="216" y="150" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">起点 i−2：✗ 会把已锁定的 2、3 翻回 0</text>

  <path d="M 192 160 v 10 h 152 v -10" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="268" y="188" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">起点 i−1：✗ 会把已锁定的 3 翻回 0</text>

  <path d="M 244 198 v 10 h 152 v -10" fill="none" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="320" y="226" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">起点 i：✓ 唯一不破坏前缀的选择</text>

  <rect x="36" y="244" width="448" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="266" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">为什么「见 0 就翻」就是最优？</text>
  <text x="260" y="288" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">① 同一窗口翻两次 = 白翻 → 每个窗口只有「翻 / 不翻」两种取值，顺序无关</text>
  <text x="260" y="308" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">② 从左往右，每个 d[i] 都被前缀唯一逼出 → 合法解（若存在）必然唯一</text>
  <text x="260" y="326" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">③ 贪心构造的就是这个唯一解，操作数 = 翻转窗口的个数，天然最少</text>
</svg>
