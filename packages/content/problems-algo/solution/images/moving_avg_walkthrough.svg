<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：size = 3，窗口逐次轮换</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">依次 next(1) → next(10) → next(3) → next(5)</text>

  <!-- ===== 表头 ===== -->
  <text x="40" y="78" font-size="11" fill="#888" font-weight="bold">步骤</text>
  <text x="100" y="78" font-size="11" fill="#888" font-weight="bold">入队 val</text>
  <text x="180" y="78" font-size="11" fill="#888" font-weight="bold">出队 old</text>
  <text x="252" y="78" font-size="11" fill="#888" font-weight="bold">窗口 [队首→队尾]</text>
  <text x="430" y="78" font-size="11" fill="#888" font-weight="bold">sum</text>
  <text x="490" y="78" font-size="11" fill="#888" font-weight="bold">返回</text>

  <!-- 表头分隔线 -->
  <line x1="30" y1="84" x2="560" y2="84" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== 第①步：next(1) ===== -->
  <text x="48" y="108" font-size="12" fill="#333" font-weight="bold">①</text>
  <rect x="92" y="94" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="110" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="190" y="110" font-size="11" fill="#888">—</text>
  <!-- 窗口：1格 -->
  <rect x="250" y="94" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="110" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="290" y="94" width="40" height="24" fill="none" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <rect x="330" y="94" width="40" height="24" fill="none" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="430" y="110" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <text x="490" y="110" font-size="11" fill="#4a7a3a" font-weight="bold">1.00000</text>

  <!-- ===== 第②步：next(10) ===== -->
  <text x="48" y="150" font-size="12" fill="#333" font-weight="bold">②</text>
  <rect x="92" y="136" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="152" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">10</text>
  <text x="190" y="152" font-size="11" fill="#888">—</text>
  <rect x="250" y="136" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="152" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="290" y="136" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="152" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">10</text>
  <rect x="330" y="136" width="40" height="24" fill="none" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="430" y="152" font-size="11" fill="#d6a040" font-weight="bold">11</text>
  <text x="490" y="152" font-size="11" fill="#4a7a3a" font-weight="bold">5.50000</text>

  <!-- ===== 第③步：next(3) ===== -->
  <text x="48" y="192" font-size="12" fill="#333" font-weight="bold">③</text>
  <rect x="92" y="178" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="194" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="190" y="194" font-size="11" fill="#888">—</text>
  <rect x="250" y="178" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="194" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="290" y="178" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="194" text-anchor="middle" font-size="11" fill="#333">10</text>
  <rect x="330" y="178" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="350" y="194" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="430" y="194" font-size="11" fill="#d6a040" font-weight="bold">14</text>
  <text x="490" y="194" font-size="11" fill="#4a7a3a" font-weight="bold">4.66667</text>

  <!-- 窗口满标记 -->
  <rect x="240" y="170" width="140" height="50" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="386" y="190" font-size="10" fill="#b85450" font-weight="bold">↑ 满</text>

  <!-- 步骤③④分隔线（强调轮换开始） -->
  <line x1="30" y1="216" x2="560" y2="216" stroke="#bbb" stroke-width="1" stroke-dasharray="2,3" filter="url(#rough2)"/>
  <text x="300" y="228" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">↓ 窗口已满，此后每次「一进一出」</text>

  <!-- ===== 第④步：next(5) ===== -->
  <text x="48" y="262" font-size="12" fill="#333" font-weight="bold">④</text>
  <rect x="92" y="248" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="264" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">5</text>
  <!-- old=1 标红 -->
  <rect x="172" y="248" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="192" y="264" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <!-- 窗口：10,3,5（1 已出，5 入） -->
  <rect x="250" y="248" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="264" text-anchor="middle" font-size="11" fill="#333">10</text>
  <rect x="290" y="248" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="264" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="330" y="248" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="350" y="264" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="430" y="264" font-size="11" fill="#d6a040" font-weight="bold">18</text>
  <text x="490" y="264" font-size="11" fill="#4a7a3a" font-weight="bold">6.00000</text>

  <!-- 出入箭头标注（步骤④） -->
  <line x1="192" y1="276" x2="270" y2="276" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="210" y="288" font-size="9" fill="#b85450" font-weight="bold">old 出队</text>

  <line x1="112" y1="276" x2="350" y2="276" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="320" y="288" font-size="9" fill="#4a7a3a" font-weight="bold">val 入队</text>

  <!-- ===== sum 增量演算（步骤④详解） ===== -->
  <text x="40" y="316" font-size="12" fill="#444" font-weight="bold">步骤 ④ 的 sum 增量演算：</text>

  <rect x="40" y="326" width="520" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="54" y="346" font-size="11" fill="#333">
    <tspan font-weight="bold" fill="#d6a040">满 → </tspan>
    <tspan>sum = 14（旧）</tspan>
    <tspan fill="#b85450" font-weight="bold"> − old(1)</tspan>
    <tspan fill="#4a7a3a" font-weight="bold"> + val(5)</tspan>
    <tspan> = 18</tspan>
    <tspan fill="#888">   →   18 / 3 = 6.00000</tspan>
  </text>

  <!-- ===== 颜色说明 ===== -->
  <text x="40" y="384" font-size="11" fill="#444" font-weight="bold">图例：</text>
  <rect x="80" y="374" width="18" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="104" y="386" font-size="10" fill="#333">新入队 val</text>
  <rect x="170" y="374" width="18" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="194" y="386" font-size="10" fill="#333">出队 old</text>
  <rect x="252" y="374" width="18" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="276" y="386" font-size="10" fill="#333">窗口内既有元素</text>
  <rect x="376" y="374" width="18" height="16" fill="none" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="400" y="386" font-size="10" fill="#888">空位（窗口未满）</text>

  <!-- ===== 关键提示 ===== -->
  <rect x="30" y="408" width="540" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="44" y="427" font-size="10" fill="#4a7a3a" font-weight="bold">关键观察：</text>
  <text x="44" y="442" font-size="10" fill="#555">① ④ 满后每次「一进一出」，sum 增量更新（14 − 1 + 5 = 18），无需重新遍历窗口求和</text>
</svg>
