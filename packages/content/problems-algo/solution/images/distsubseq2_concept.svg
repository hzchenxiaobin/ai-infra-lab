<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">去重计数 DP：翻倍原理与扣减重复</text>

  <!-- ===== Section 1: Doubling ===== -->
  <text x="30" y="52" font-size="12" fill="#4a7a3a" font-weight="bold">① 翻倍：处理字符 c，每个子序列保留原样 or 末尾追加 c</text>

  <!-- Left box: f[i-1] -->
  <rect x="30" y="64" width="110" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="85" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">f[i−1]</text>
  <text x="85" y="100" text-anchor="middle" font-size="9" fill="#888">含空串的子序列数</text>

  <!-- Two curved arrows: keep / append -->
  <path d="M 145 76 Q 195 68 245 76" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="195" y="64" text-anchor="middle" font-size="9" fill="#4a7a3a">保留原样</text>

  <path d="M 145 100 Q 195 108 245 100" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="195" y="118" text-anchor="middle" font-size="9" fill="#4a7a3a">末尾追加 c</text>

  <!-- Plus sign -->
  <text x="258" y="92" text-anchor="middle" font-size="16" fill="#555" font-weight="bold">+</text>

  <!-- Right box: 2*f[i-1] -->
  <rect x="275" y="64" width="110" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="330" y="84" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">2·f[i−1]</text>
  <text x="330" y="100" text-anchor="middle" font-size="9" fill="#888">c 首次出现时</text>

  <!-- Note -->
  <text x="405" y="78" font-size="10" fill="#888">f[i−1] 个子序列</text>
  <text x="405" y="92" font-size="10" fill="#888">每个 → 保留 or +c</text>
  <text x="405" y="106" font-size="10" fill="#4a7a3a">→ 翻倍</text>

  <!-- Dashed separator -->
  <path d="M 20 132 L 540 132" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4" fill="none" filter="url(#rough2)"/>

  <!-- ===== Section 2: Dedup ===== -->
  <text x="30" y="152" font-size="12" fill="#b85450" font-weight="bold">② 扣减：c 曾出现在位置 j，prefix[0..j−2]+c 已在步骤 j 计入</text>

  <!-- String positions -->
  <text x="30" y="182" font-size="10" fill="#888">s =</text>

  <rect x="58" y="168" width="30" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="73" y="186" text-anchor="middle" font-size="10" fill="#ccc">…</text>

  <rect x="90" y="168" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="186" text-anchor="middle" font-size="9" fill="#333">j−1</text>

  <rect x="122" y="168" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="137" y="186" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">c</text>

  <rect x="154" y="168" width="30" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="169" y="186" text-anchor="middle" font-size="10" fill="#ccc">…</text>

  <rect x="186" y="168" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="201" y="186" text-anchor="middle" font-size="9" fill="#333">i−1</text>

  <rect x="218" y="168" width="30" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="233" y="186" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">c</text>

  <!-- Position labels -->
  <text x="137" y="208" text-anchor="middle" font-size="9" fill="#d6a040">位置 j</text>
  <text x="233" y="208" text-anchor="middle" font-size="9" fill="#b85450">位置 i（当前）</text>

  <!-- Bracket for prefix[0..j-2] -->
  <path d="M 58 200 L 58 206 L 120 206 L 120 200" stroke="#446688" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <text x="89" y="220" text-anchor="middle" font-size="9" fill="#446688">prefix[0..j−2]</text>

  <!-- Dedup flow -->
  <rect x="30" y="234" width="130" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="95" y="252" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">f[j−1] 个子序列</text>
  <text x="95" y="266" text-anchor="middle" font-size="9" fill="#888">prefix[0..j−2]（含空串）</text>

  <path d="M 165 256 L 215 256" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="190" y="250" text-anchor="middle" font-size="9" fill="#888">每个 + c</text>

  <rect x="220" y="234" width="120" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="252" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">已在步骤 j 计入</text>
  <text x="280" y="266" text-anchor="middle" font-size="9" fill="#888">重复！</text>

  <path d="M 345 256 L 405 256" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="375" y="250" text-anchor="middle" font-size="9" fill="#b85450">扣除</text>

  <rect x="410" y="234" width="120" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="470" y="252" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">− f[j−1]</text>
  <text x="470" y="266" text-anchor="middle" font-size="9" fill="#888">消除重复</text>

  <!-- Formula box -->
  <rect x="30" y="300" width="500" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">f[i] = <tspan fill="#4a7a3a">2·f[i−1]</tspan> − <tspan fill="#b85450">f[j−1]</tspan></text>
  <text x="280" y="340" text-anchor="middle" font-size="10" fill="#888">j = last[c]（c 上次出现的 1-indexed 位置）；首次出现时 f[j−1] = 0，不扣</text>

  <!-- Answer note -->
  <text x="280" y="376" text-anchor="middle" font-size="10" fill="#b85450">最终答案 = f[n] − 1（减去空串），对 10⁹+7 取模</text>
</svg>
