<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a7a7a"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：哈希表计数 + 按 k 分支处理</text>

  <!-- Init oval -->
  <rect x="150" y="38" width="240" height="34" rx="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="60" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">初始化：ans = 0</text>
  <path d="M 270 72 L 270 88" stroke="#7a7a7a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Build counter -->
  <rect x="120" y="90" width="300" height="34" rx="6" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="112" text-anchor="middle" font-size="11.5" fill="#333">用 Counter 统计每个值的出现频次</text>
  <path d="M 270 124 L 270 140" stroke="#7a7a7a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision 1: k < 0 ? -->
  <polygon points="270,142 380,178 270,214 160,178" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="175" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">k &lt; 0 ?</text>
  <text x="372" y="172" text-anchor="end" font-size="10.5" fill="#b85450" font-weight="bold">是</text>
  <text x="168" y="172" text-anchor="start" font-size="10.5" fill="#82b366" font-weight="bold">否</text>

  <!-- k < 0 -> return 0 (right) -->
  <rect x="392" y="160" width="120" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="452" y="178" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">return 0</text>
  <text x="452" y="192" text-anchor="middle" font-size="9.5" fill="#b85450">绝对值不可能&lt;0</text>
  <path d="M 380 178 L 391 178" stroke="#7a7a7a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- No -> decision 2: k == 0 ? -->
  <path d="M 270 214 L 270 228" stroke="#7a7a7a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="270,230 380,266 270,302 160,266" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="263" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">k == 0 ?</text>
  <text x="372" y="260" text-anchor="end" font-size="10.5" fill="#82b366" font-weight="bold">是</text>
  <text x="168" y="260" text-anchor="start" font-size="10.5" fill="#b85450" font-weight="bold">否 (k&gt;0)</text>

  <!-- k == 0 branch (right) -->
  <rect x="392" y="240" width="130" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="457" y="260" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">ans += 1</text>
  <text x="457" y="274" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">(对每个 freq ≥ 2 的值)</text>
  <text x="457" y="288" text-anchor="middle" font-size="9.5" fill="#4a7a3a">数重复出现的值</text>
  <path d="M 380 266 L 391 266" stroke="#7a7a7a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- k > 0 branch (left) -->
  <rect x="28" y="240" width="130" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="93" y="260" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">遍历每个唯一值 x</text>
  <text x="93" y="276" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">if x+k in cnt:</text>
  <text x="93" y="290" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">  ans += 1</text>
  <path d="M 160 266 L 149 266" stroke="#7a7a7a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- merge to end -->
  <path d="M 457 296 L 457 330 L 270 330" stroke="#7a7a7a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 93 296 L 93 330 L 270 330" stroke="#7a7a7a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 270 330 L 270 344" stroke="#7a7a7a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- End oval -->
  <rect x="150" y="346" width="240" height="34" rx="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="368" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">返回 ans</text>

  <!-- key insight box -->
  <rect x="20" y="396" width="500" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="412" text-anchor="middle" font-size="10.5" fill="#444" font-weight="bold">关键：k&gt;0 时只查 x+k（单向），天然去重；k=0 时数频次≥2 的值</text>
  <text x="270" y="426" text-anchor="middle" font-size="10" fill="#888">两种分支都保证每个数对只被计入一次</text>
</svg>
