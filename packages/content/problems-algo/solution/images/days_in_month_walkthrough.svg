<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：四组 (Y, M) 验证闰年规则</text>

  <!-- ===== Table header ===== -->
  <!-- columns: Y=56, M=120, 判定路径=230, 闰年=330, 天数=400, 说明=490 -->
  <rect x="32" y="40" width="496" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>

  <text x="64" y="59" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">Y</text>
  <line x1="96" y1="44" x2="96" y2="66" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <text x="120" y="59" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">M</text>
  <line x1="148" y1="44" x2="148" y2="66" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <text x="232" y="59" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">判定路径</text>
  <line x1="316" y1="44" x2="316" y2="66" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <text x="348" y="59" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">闰年?</text>
  <line x1="380" y1="44" x2="380" y2="66" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <text x="412" y="59" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">天数</text>
  <line x1="444" y1="44" x2="444" y2="66" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <text x="492" y="59" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">说明</text>

  <!-- ===== Row 1: 1992, 1月, non-Feb, 31 ===== -->
  <rect x="32" y="72" width="496" height="34" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="64" y="94" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1992</text>
  <text x="120" y="94" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1 月</text>
  <text x="232" y="94" text-anchor="middle" font-size="11" fill="#888">— 非二月</text>
  <text x="348" y="94" text-anchor="middle" font-size="11" fill="#888">N/A</text>
  <rect x="396" y="78" width="32" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="412" y="94" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">31</text>
  <text x="492" y="94" text-anchor="middle" font-size="10.5" fill="#555">一月恒 31</text>

  <!-- ===== Row 2: 2020, 2月, ÷4非÷100, 闰, 29 ===== -->
  <rect x="32" y="108" width="496" height="34" fill="#e6f4ea" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="64" y="130" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2020</text>
  <text x="120" y="130" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2 月</text>
  <text x="232" y="130" text-anchor="middle" font-size="11" fill="#555">÷4 非 ÷100</text>
  <text x="348" y="130" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">闰</text>
  <rect x="396" y="114" width="32" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="412" y="130" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">29</text>
  <text x="492" y="130" text-anchor="middle" font-size="10.5" fill="#4a7a3a">普通闰年</text>

  <!-- ===== Row 3: 2000, 2月, ÷400, 闰, 29 ===== -->
  <rect x="32" y="144" width="496" height="34" fill="#e6f4ea" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="64" y="166" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2000</text>
  <text x="120" y="166" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2 月</text>
  <text x="232" y="166" text-anchor="middle" font-size="11" fill="#555">÷400</text>
  <text x="348" y="166" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">闰</text>
  <rect x="396" y="150" width="32" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="412" y="166" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">29</text>
  <text x="492" y="166" text-anchor="middle" font-size="10.5" fill="#4a7a3a">世纪闰年</text>

  <!-- ===== Row 4: 1900, 2月, ÷100非÷400, 平, 28 (TRAP) ===== -->
  <rect x="32" y="180" width="496" height="34" fill="#fce4ec" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="64" y="202" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1900</text>
  <text x="120" y="202" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2 月</text>
  <text x="232" y="202" text-anchor="middle" font-size="11" fill="#555">÷100 非 ÷400</text>
  <text x="348" y="202" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">平</text>
  <rect x="396" y="186" width="32" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="412" y="202" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">28</text>
  <text x="492" y="202" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">世纪陷阱 ⚠</text>

  <!-- ===== Key insight box ===== -->
  <rect x="32" y="232" width="496" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="48" y="254" font-size="11.5" fill="#d6a040" font-weight="bold">⚠ 世纪年陷阱（最常见的错点）：</text>
  <text x="48" y="274" font-size="11" fill="#333">• <tspan font-weight="bold" fill="#4a7a3a">2000</tspan> ÷400 → 闰年 29 天 ✓    • <tspan font-weight="bold" fill="#b85450">1900</tspan> ÷100 但非 ÷400 → 平年 28 天 ⚠</text>
  <text x="48" y="294" font-size="11" fill="#333">• 2100、2200、2300 同 1900，均为平年；2400 同 2000，为闰年</text>
  <text x="48" y="314" font-size="11" fill="#555">→ 判定顺序很重要：先查 ÷400（最高优先），再查 ÷100（排除），最后查 ÷4</text>
</svg>
