<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：从 start=0 出发逐次松弛</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">图：0—1(0.5)、1—2(0.5)、0—2(0.2)；prob 0-indexed：[0,1,2]</text>

  <!-- column headers -->
  <text x="34" y="68" font-size="10" fill="#888" font-weight="bold">步骤</text>
  <text x="104" y="68" font-size="10" fill="#888" font-weight="bold">弹出(p,u)</text>
  <text x="206" y="68" font-size="10" fill="#888" font-weight="bold">松弛动作</text>
  <text x="346" y="68" font-size="10" fill="#888" font-weight="bold">prob[]</text>
  <text x="478" y="68" font-size="10" fill="#888" font-weight="bold">堆(处理后)</text>

  <!-- ===== Initial row ===== -->
  <rect x="20" y="76" width="520" height="34" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="42" y="97" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">初始</text>
  <text x="138" y="97" text-anchor="middle" font-size="10" fill="#888">—</text>
  <text x="262" y="97" text-anchor="middle" font-size="10" fill="#888">prob[0]=1，其余=0</text>
  <text x="386" y="97" text-anchor="middle" font-size="10" fill="#666" font-family="monospace">[1, 0, 0]</text>
  <text x="498" y="97" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" font-family="monospace">[(1.0,0)]</text>

  <!-- ===== Step 1 ===== -->
  <rect x="20" y="116" width="520" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="42" y="143" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <text x="138" y="143" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">(1.0, 0)</text>
  <text x="262" y="137" text-anchor="middle" font-size="9" fill="#555">0→1: 1×0.5=0.5&gt;0 ✓</text>
  <text x="262" y="151" text-anchor="middle" font-size="9" fill="#555">0→2: 1×0.2=0.2&gt;0 ✓</text>
  <text x="386" y="143" text-anchor="middle" font-size="10" fill="#666" font-family="monospace">[1, 0.5, 0.2]</text>
  <text x="498" y="143" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" font-family="monospace">[(0.5,1),(0.2,2)]</text>

  <!-- ===== Step 2 ===== -->
  <rect x="20" y="166" width="520" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="42" y="194" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>
  <text x="138" y="194" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">(0.5, 1)</text>
  <text x="262" y="186" text-anchor="middle" font-size="9" fill="#888">1→0: 0.5×0.5=0.25&lt;1 跳过</text>
  <text x="262" y="200" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">1→2: 0.5×0.5=0.25&gt;0.2 ✓ 更新</text>
  <text x="386" y="194" text-anchor="middle" font-size="10" fill="#666" font-family="monospace">[1, 0.5, 0.25]</text>
  <text x="498" y="194" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" font-family="monospace">[(0.25,2),(0.2,2)]</text>

  <!-- ===== Step 3 (early termination) ===== -->
  <rect x="20" y="220" width="520" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="42" y="248" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="138" y="248" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">(0.25, 2)</text>
  <text x="262" y="240" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">u==end → 提前终止</text>
  <text x="262" y="254" text-anchor="middle" font-size="9" fill="#888">旧记录(0.2,2)不再处理</text>
  <text x="386" y="248" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" font-family="monospace">[1, 0.5, 0.25]</text>
  <text x="498" y="248" text-anchor="middle" font-size="10" fill="#aaa" font-family="monospace">[(0.2,2)]丢弃</text>

  <!-- arrow down to conclusion -->
  <path d="M 280 268 L 280 290" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Conclusion ===== -->
  <rect x="60" y="292" width="440" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="314" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">弹出 end=2 时 prob=0.25 已确定</text>
  <text x="280" y="334" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">答案 = 0.25（0→1→2 优于 0→2 直达）</text>

  <!-- footnotes -->
  <text x="40" y="372" font-size="10" fill="#888">弹出顺序即 prob 从大到小的确定顺序：1.0(0) → 0.5(1) → 0.25(2)</text>
  <text x="40" y="390" font-size="10" fill="#888">第 2 步中转路径 0→1→2=0.25 大于直达 0→2=0.2，故更新 prob[2]</text>
  <text x="40" y="408" font-size="10" fill="#446688" font-weight="bold">最大堆每次弹出最大 (p,u)；边权≤1 → 延伸只减不增 → 贪心正确</text>
</svg>
