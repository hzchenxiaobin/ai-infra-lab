<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：JOIN 后分组求和的全过程</text>

  <rect x="40" y="44" width="220" height="160" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">JOIN 后的中间行</text>
  <text x="55" y="88" font-size="11" fill="#333" filter="url(#rough2)">2 Avery   | 197</text>
  <text x="55" y="106" font-size="11" fill="#333" filter="url(#rough2)">2 Avery   | 196</text>
  <text x="55" y="124" font-size="11" fill="#333" filter="url(#rough2)">4 Michael | 59</text>
  <text x="55" y="142" font-size="11" fill="#333" filter="url(#rough2)">4 Michael | 357</text>
  <text x="55" y="160" font-size="11" fill="#333" filter="url(#rough2)">10 Eleanor| NULL</text>
  <text x="55" y="178" font-size="11" fill="#333" filter="url(#rough2)">14 Ethan  | 161, 25</text>
  <text x="55" y="196" font-size="11" fill="#333" filter="url(#rough2)">17 Addison| 160</text>

  <path d="M 260 124 L 300 124" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="112" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">SUM</text>

  <rect x="300" y="44" width="200" height="160" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="400" y="66" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">分组求和</text>
  <text x="315" y="88" font-size="11" fill="#333" filter="url(#rough2)">u2  197+196=393</text>
  <text x="315" y="106" font-size="11" fill="#333" filter="url(#rough2)">u4  59+357=416</text>
  <text x="315" y="124" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">u10 SUM(NULL)=NULL</text>
  <text x="315" y="142" font-size="11" fill="#333" filter="url(#rough2)">u14 161+25=186</text>
  <text x="315" y="160" font-size="11" fill="#333" filter="url(#rough2)">u17 160</text>
  <text x="315" y="184" font-size="10" fill="#999" filter="url(#rough2)">空集的 SUM 是 NULL，不是 0！</text>

  <path d="M 270 204 L 270 228" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="236" width="420" height="160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="258" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">最终输出（IFNULL 兜底 + 按 user_id 升序）</text>

  <rect x="85" y="270" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="135" y="288" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">user_id</text>
  <rect x="185" y="270" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="235" y="288" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">name</text>
  <rect x="285" y="270" width="150" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="360" y="288" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">traveled distance</text>

  <text x="135" y="318" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="235" y="318" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Avery</text>
  <text x="360" y="318" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">393</text>
  <text x="135" y="338" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="235" y="338" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Michael</text>
  <text x="360" y="338" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">416</text>
  <text x="135" y="358" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">10</text>
  <text x="235" y="358" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">Eleanor</text>
  <text x="360" y="358" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">0 ← 兜底</text>
  <text x="135" y="378" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">14 / 17</text>
  <text x="235" y="378" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Ethan / Addison</text>
  <text x="360" y="378" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">186 / 160</text>
</svg>
