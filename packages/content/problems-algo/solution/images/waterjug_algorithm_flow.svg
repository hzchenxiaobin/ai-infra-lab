<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="500" height="460" fill="#fafafa"/>

  <text x="250" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：两道判定关（Bézout 数学法）</text>

  <!-- Start oval -->
  <ellipse cx="250" cy="60" rx="62" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="65" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">输入 x, y, target</text>

  <line x1="250" y1="80" x2="250" y2="98" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 1: target > x + y ? -->
  <polygon points="250,102 360,150 250,198 140,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="146" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">target &gt; x + y ?</text>
  <text x="250" y="162" text-anchor="middle" font-size="10" fill="#888">超过两壶总容量</text>

  <!-- No branch down -->
  <text x="262" y="218" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <line x1="250" y1="198" x2="250" y2="216" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Yes branch (right) to false -->
  <text x="370" y="150" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <path d="M 360 150 Q 410 150 410 230" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 2: target % gcd == 0 ? -->
  <polygon points="250,220 384,268 250,316 116,268" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="250" y="262" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">target % gcd(x, y) == 0 ?</text>
  <text x="250" y="280" text-anchor="middle" font-size="10" fill="#888">target 是 gcd 的倍数</text>

  <!-- Yes branch (right) to true -->
  <text x="394" y="268" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 384 268 Q 420 268 420 324" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return true -->
  <rect x="350" y="328" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="420" y="350" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">return true ✓</text>

  <line x1="420" y1="362" x2="420" y2="384" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="420" cy="402" rx="50" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="420" y="407" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">能量出 target</text>

  <!-- No branch (decision 2) left, merge to false -->
  <text x="100" y="268" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M 116 268 Q 80 268 80 328" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return false -->
  <rect x="20" y="328" width="140" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="90" y="350" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">return false ✗</text>

  <line x1="90" y1="362" x2="90" y2="384" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="90" cy="402" rx="50" ry="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="90" y="407" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">量不出 target</text>

  <!-- merge line from decision1-yes into false box -->
  <path d="M 410 262 L 410 262" stroke="#888" stroke-width="1.6" fill="none"/>

  <!-- bottom note -->
  <rect x="100" y="428" width="300" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="250" y="445" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">时间 O(log(min(x,y)))，空间 O(1)</text>
</svg>
