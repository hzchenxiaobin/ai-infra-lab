<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一趟扫描，先用后更新</text>

  <!-- Step 1 -->
  <rect x="60" y="48" width="440" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="76" y="74" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① 初始化：ans=0, preMax=nums[0], maxDiff=−∞</text>

  <path d="M 280 92 L 280 112" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="60" y="116" width="440" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="76" y="142" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">② k=1..n−1 先结算：ans = max(ans, maxDiff × nums[k])</text>
  <text x="388" y="142" font-size="10.5" fill="#999" filter="url(#rough2)">maxDiff 有效时</text>

  <path d="M 280 160 L 280 180" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="60" y="184" width="440" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="76" y="203" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">③ 再更新：maxDiff = max(maxDiff, preMax − nums[k])</text>
  <text x="96" y="220" font-size="12" fill="#4a7a3a" filter="url(#rough2)">preMax = max(preMax, nums[k])（k 依次当新 j、新 i）</text>

  <path d="M 280 228 L 280 248" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4 -->
  <rect x="60" y="252" width="440" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="76" y="278" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">④ 返回 ans（全负时保持初始值 0）</text>

  <!-- side note -->
  <path d="M 280 296 L 280 312" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="100" y="314" width="360" height="34" fill="#fafafa" stroke="#999" stroke-width="1" stroke-dasharray="4 3" rx="6" filter="url(#rough2)"/>
  <text x="280" y="335" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">先用后更新 ⇒ 下标严格 i &lt; j &lt; k；O(n) 时间 · O(1) 空间</text>
</svg>
