<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：f(k)=k(k+1)/2 关于 k 单调递增 ⇒ 二段性，求最大的「f(k) ≤ n」</text>

  <!-- ===== Left panel: staircase arrangement n=8 ===== -->
  <text x="40" y="56" font-size="12" fill="#888" font-weight="bold">阶梯排列（n = 8）</text>

  <!-- row 1: 1 coin (complete) -->
  <circle cx="170" cy="300" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="304" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">第1行</text>

  <!-- row 2: 2 coins (complete) -->
  <circle cx="160" cy="276" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="180" cy="276" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="280" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">第2行</text>

  <!-- row 3: 3 coins (complete) -->
  <circle cx="150" cy="252" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="170" cy="252" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="190" cy="252" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="256" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">第3行</text>

  <!-- row 4: needs 4, only 2 present (incomplete) -->
  <circle cx="140" cy="228" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="160" cy="228" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="180" cy="228" r="8" fill="none" stroke="#ccc" stroke-width="1.2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <circle cx="200" cy="228" r="8" fill="none" stroke="#ccc" stroke-width="1.2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="120" y="232" text-anchor="end" font-size="11" fill="#d6a040" font-weight="bold">第4行</text>

  <!-- complete/incomplete labels -->
  <rect x="40" y="148" width="92" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="86" y="163" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓ 完整行</text>
  <rect x="40" y="176" width="92" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="86" y="191" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">✗ 不完整</text>

  <!-- answer callout -->
  <rect x="40" y="320" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="140" y="338" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">完整阶梯行数 = 3</text>
  <text x="140" y="354" text-anchor="middle" font-size="10" fill="#888">1+2+3=6 ≤ 8，第4行差2枚</text>

  <!-- ===== Right panel: answer space number line ===== -->
  <text x="300" y="56" font-size="12" fill="#888" font-weight="bold">答案空间（在 k 上二分）</text>

  <!-- number line -->
  <line x1="310" y1="180" x2="530" y2="180" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <!-- feasible segment (green) 310 -> 430 -->
  <line x1="310" y1="180" x2="430" y2="180" stroke="#4a7a3a" stroke-width="4" filter="url(#rough2)"/>
  <!-- infeasible segment (red) 430 -> 530 -->
  <line x1="430" y1="180" x2="530" y2="180" stroke="#b85450" stroke-width="4" filter="url(#rough2)"/>

  <!-- endpoints -->
  <circle cx="310" cy="180" r="3.5" fill="#888" filter="url(#rough2)"/>
  <circle cx="530" cy="180" r="3.5" fill="#888" filter="url(#rough2)"/>
  <text x="310" y="200" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="530" y="200" text-anchor="middle" font-size="10" fill="#999">n</text>

  <!-- answer marker at boundary 430 -->
  <circle cx="430" cy="180" r="5.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="430" y="200" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">ans</text>

  <!-- region labels -->
  <text x="370" y="166" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">k(k+1)/2 ≤ n ✓ 可行</text>
  <text x="480" y="166" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">k(k+1)/2 &gt; n ✗ 太多</text>

  <!-- arrow: ans is the RIGHTMOST feasible -->
  <path d="M 430 232 L 430 214" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="248" text-anchor="middle" font-size="10" fill="#4a7a3a">最大的可行 k</text>

  <!-- formula box -->
  <rect x="310" y="270" width="220" height="90" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="420" y="294" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">验证函数 check(k)</text>
  <text x="420" y="316" text-anchor="middle" font-size="12" fill="#444">k 行需 k(k+1)/2 枚</text>
  <text x="420" y="334" text-anchor="middle" font-size="12" fill="#444">return (long)k*(k+1)/2 &lt;= n</text>
  <text x="420" y="350" text-anchor="middle" font-size="10" fill="#888">O(1) 验证，单调 ⇒ 可二分</text>
</svg>
