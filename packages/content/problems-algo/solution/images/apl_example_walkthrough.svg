<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：空数组判定用 length，而非 ?? 兜底</text>

  <!-- column headers -->
  <text x="160" y="54" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">数组 this</text>
  <text x="350" y="54" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">长度判定</text>
  <text x="510" y="54" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">返回</text>

  <!-- ===== Row 1: normal ===== -->
  <text x="30" y="96" font-size="14" fill="#888" font-weight="bold" filter="url(#rough2)">①</text>
  <!-- array box with 3 cells -->
  <rect x="56" y="64" width="208" height="56" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="66" y="74" width="60" height="38" rx="4" fill="#fff" stroke="#88a0c0" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="96" y="98" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">null</text>
  <rect x="130" y="74" width="60" height="38" rx="4" fill="#fff" stroke="#88a0c0" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="160" y="98" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">{ }</text>
  <rect x="194" y="74" width="60" height="38" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="224" y="98" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <!-- arrow -->
  <path d="M 264 92 L 300 92" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- length box -->
  <rect x="300" y="64" width="100" height="56" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350" y="88" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">length = 3</text>
  <text x="350" y="106" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">≠ 0</text>
  <!-- arrow -->
  <path d="M 400 92 L 440 92" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- result -->
  <rect x="440" y="64" width="140" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="510" y="98" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">返回 3</text>

  <!-- ===== Row 2: empty ===== -->
  <text x="30" y="196" font-size="14" fill="#888" font-weight="bold" filter="url(#rough2)">②</text>
  <rect x="56" y="164" width="208" height="56" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="160" y="198" text-anchor="middle" font-size="12" fill="#aaa" filter="url(#rough2)">（空数组）</text>
  <path d="M 264 192 L 300 192" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="300" y="164" width="100" height="56" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350" y="188" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">length = 0</text>
  <text x="350" y="206" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">空</text>
  <path d="M 400 192 L 440 192" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="440" y="164" width="140" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="510" y="198" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">返回 -1</text>

  <!-- ===== Row 3: null edge ===== -->
  <text x="30" y="296" font-size="14" fill="#888" font-weight="bold" filter="url(#rough2)">③</text>
  <rect x="56" y="264" width="208" height="56" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="130" y="274" width="60" height="38" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="298" text-anchor="middle" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">null</text>
  <path d="M 264 292 L 300 292" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="300" y="264" width="100" height="56" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350" y="288" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">length = 1</text>
  <text x="350" y="306" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">≠ 0</text>
  <path d="M 400 292 L 440 292" stroke="#888" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="440" y="264" width="140" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="510" y="298" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">返回 null</text>

  <!-- footer note -->
  <text x="310" y="350" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">⚠ ③ 中末元素是 null，仍算“有元素” → 应返回 null 而非 -1</text>
  <text x="310" y="372" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">若用 this.at(-1) ?? -1 兜底，null ?? -1 会误返回 -1，故必须显式判 length === 0</text>
</svg>
