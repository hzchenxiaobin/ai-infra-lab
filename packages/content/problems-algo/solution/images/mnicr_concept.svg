<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="340" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：固定预算下，小数字「单位预算换数量」效率最高</text>

  <!-- ===== Panel A: greedy smallest-first ===== -->
  <text x="60" y="60" font-size="12.5" fill="#4a7a3a" font-weight="bold">贪心：从小到大取</text>
  <!-- stacked segments along ruler: 1, 2, 3  -> sum 6 -->
  <rect x="60" y="68" width="70" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="95" y="93" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="130" y="68" width="140" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="200" y="93" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="270" y="68" width="210" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="375" y="93" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>

  <!-- ruler scale 0..6 -->
  <path d="M 60 116 L 480 116" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="60" y="130" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="130" y="130" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="200" y="130" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="270" y="130" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="340" y="130" text-anchor="middle" font-size="10" fill="#888">4</text>
  <text x="410" y="130" text-anchor="middle" font-size="10" fill="#888">5</text>
  <text x="480" y="130" text-anchor="middle" font-size="10" fill="#888">6=maxSum</text>

  <text x="60" y="152" font-size="11.5" fill="#4a7a3a" font-weight="bold">1+2+3 = 6 ≤ 6</text>
  <rect x="410" y="140" width="70" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="445" y="155" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">取 3 个</text>

  <!-- ===== Panel B: naive largest-first ===== -->
  <text x="60" y="190" font-size="12.5" fill="#b85450" font-weight="bold">对照：只取一个大数</text>
  <rect x="60" y="198" width="420" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="270" y="223" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>

  <path d="M 60 246 L 480 246" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="60" y="260" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="270" y="260" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="480" y="260" text-anchor="middle" font-size="10" fill="#888">6=maxSum</text>

  <text x="60" y="282" font-size="11.5" fill="#b85450" font-weight="bold">6 = 6 ≤ 6（同样填满预算）</text>
  <rect x="410" y="270" width="70" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="445" y="285" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">仅 1 个</text>

  <!-- exchange argument note -->
  <rect x="40" y="300" width="460" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="270" y="313" text-anchor="middle" font-size="10.5" fill="#555">交换论证：把可行解里任一较大数 a 换成更小且未取的 b（b &lt; a），和不增、数量不变，</text>
  <text x="270" y="327" text-anchor="middle" font-size="10.5" fill="#555">故最优解必是「最小的若干个可用数」 → 从小到大贪心取即可。</text>
</svg>
