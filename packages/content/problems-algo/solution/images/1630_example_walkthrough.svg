<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="320" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：三个查询的截取 → 排序 → 验证</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">nums = [4,6,5,9,3,7],  l = [0,0,2],  r = [2,3,5]</text>

  <!-- Table outer frame -->
  <rect x="30" y="54" width="540" height="150" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>

  <!-- Header row -->
  <rect x="30" y="54" width="540" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <g font-size="11" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="52" y="73">查询</text>
    <text x="107" y="73">[l, r]</text>
    <text x="187" y="73">子数组</text>
    <text x="285" y="73">排序后</text>
    <text x="352" y="73">d</text>
    <text x="430" y="73">逐对验证</text>
    <text x="530" y="73">结果</text>
  </g>

  <!-- Column dividers -->
  <g stroke="#dde" stroke-width="1" filter="url(#rough2)">
    <line x1="75" y1="54" x2="75" y2="204"/>
    <line x1="140" y1="54" x2="140" y2="204"/>
    <line x1="235" y1="54" x2="235" y2="204"/>
    <line x1="335" y1="54" x2="335" y2="204"/>
    <line x1="370" y1="54" x2="370" y2="204"/>
    <line x1="490" y1="54" x2="490" y2="204"/>
  </g>

  <!-- Row 0: true -->
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="52" y="105">0</text>
    <text x="107" y="105">[0, 2]</text>
    <text x="187" y="105">[4, 6, 5]</text>
    <text x="285" y="105">[4, 5, 6]</text>
    <text x="352" y="105">1</text>
    <text x="430" y="105">1, 1 ✓</text>
  </g>
  <rect x="492" y="92" width="76" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="530" y="107" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">true ✓</text>

  <!-- Row 1: false (highlighted) -->
  <rect x="31" y="116" width="538" height="34" fill="#fff5f7" stroke="none" filter="url(#rough2)"/>
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="52" y="139">1</text>
    <text x="107" y="139">[0, 3]</text>
    <text x="187" y="139">[4, 6, 5, 9]</text>
    <text x="285" y="139">[4, 5, 6, 9]</text>
    <text x="352" y="139">1</text>
    <text x="430" y="139">
      <tspan fill="#333">1, 1, </tspan><tspan fill="#b85450" font-weight="bold">3 ✗</tspan>
    </text>
  </g>
  <rect x="492" y="126" width="76" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="530" y="141" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">false ✗</text>

  <!-- Row 2: true -->
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="52" y="175">2</text>
    <text x="107" y="175">[2, 5]</text>
    <text x="187" y="175">[5, 9, 3, 7]</text>
    <text x="285" y="175">[3, 5, 7, 9]</text>
    <text x="352" y="175">2</text>
    <text x="430" y="175">2, 2, 2 ✓</text>
  </g>
  <rect x="492" y="162" width="76" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="530" y="177" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">true ✓</text>

  <!-- Row separators -->
  <g stroke="#eef" stroke-width="1" filter="url(#rough2)">
    <line x1="30" y1="114" x2="570" y2="114"/>
    <line x1="30" y1="150" x2="570" y2="150"/>
    <line x1="30" y1="184" x2="570" y2="184"/>
  </g>

  <!-- Annotation arrow on the failing diff -->
  <text x="430" y="196" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">↑ 9−6=3 ≠ d=1，首个不匹配即判 false</text>

  <!-- Bottom note -->
  <rect x="30" y="216" width="540" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="48" y="238" font-size="11" fill="#d6a040" font-weight="bold">观察</text>
  <text x="48" y="256" font-size="11" fill="#555">• 查询 1：排序后 [4,5,6,9]，前两对差为 1，但第三对 9−6=3 ≠ 1 → false</text>
  <text x="48" y="274" font-size="11" fill="#555">• 查询 0、2：排序后所有相邻差恒定 → true</text>
  <text x="48" y="292" font-size="11" fill="#b85450" font-weight="bold">• 遇到首个不等于 d 的差值立即跳出，无需继续验证</text>
</svg>
