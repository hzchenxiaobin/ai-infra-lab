<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：建树缓存 best，查询一路下行</text>

  <!-- phase 1 header -->
  <rect x="150" y="38" width="220" height="24" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="54" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">① 建树：wordsContainer 反转插入</text>
  <path d="M 260 62 L 260 74" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- A -->
  <rect x="140" y="76" width="240" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="93" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">best[根] ← 全局最短单词下标（平局最早）</text>
  <path d="M 260 102 L 260 114" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B -->
  <rect x="110" y="116" width="300" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="133" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">for 单词 w（下标 i 升序）：反转 w，从根逐字符下行</text>
  <path d="M 260 142 L 260 154" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- C diamond -->
  <polygon points="260,156 360,186 260,216 160,186" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="183" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">节点不存在 /</text>
  <text x="260" y="198" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">w 严格更短？</text>

  <!-- C no branch -->
  <path d="M 360 186 L 384 186" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="370" y="179" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="388" y="172" width="124" height="28" fill="#fafafa" stroke="#999" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="450" y="190" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">best 不变</text>

  <!-- C yes branch -->
  <path d="M 260 216 L 260 230" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="227" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="170" y="232" width="180" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="249" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">best[u] ← i（新建节点同样置 i）</text>

  <!-- loop back -->
  <path d="M 170 245 L 92 245 L 92 133 L 104 133" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="84" y="192" text-anchor="end" font-size="9" fill="#999" filter="url(#rough2)">下一字符</text>

  <!-- phase 2 header -->
  <rect x="150" y="282" width="220" height="24" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="298" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">② 查询：wordsQuery 反转下行</text>
  <path d="M 260 306 L 260 318" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- E -->
  <rect x="140" y="320" width="240" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="337" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">for 查询词 q：反转 q，从根出发</text>
  <path d="M 260 346 L 260 358" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- F diamond -->
  <polygon points="260,360 356,388 260,416 164,388" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="392" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">子节点存在？</text>

  <!-- F yes branch (left) -->
  <path d="M 164 388 L 136 388" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="381" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="24" y="374" width="108" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="78" y="392" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">下移一层</text>
  <path d="M 78 374 L 78 350 L 246 350 L 254 359" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="346" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">能走就走，走最深</text>

  <!-- F no branch (down) -->
  <path d="M 260 416 L 260 430" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="427" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="140" y="432" width="240" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="449" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">停止：ans ← best[停留节点]</text>

  <!-- side note -->
  <rect x="390" y="404" width="118" height="54" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="449" y="422" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">一步都走不了 =</text>
  <text x="449" y="436" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">空公共后缀，</text>
  <text x="449" y="450" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">用 best[根] 兜底</text>
</svg>
