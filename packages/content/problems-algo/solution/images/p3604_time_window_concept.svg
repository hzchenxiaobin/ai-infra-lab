<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：出发时刻必须落在边的窗口 [start, end] 内</text>
  <text x="260" y="46" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">边 (u → v, start, end)：只有 start ≤ t ≤ end 的整数时刻才能从 u 出发走这条边</text>

  <path d="M 50 130 L 468 130" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="484" y="134" font-size="10.5" fill="#446688" filter="url(#rough2)">时间</text>

  <rect x="170" y="100" width="180" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="119" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">可出发窗口</text>
  <text x="260" y="152" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">[start, end]</text>

  <path d="M 170 162 L 170 170" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="184" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">start</text>
  <path d="M 350 162 L 350 170" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="184" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">end</text>

  <circle cx="100" cy="130" r="5.5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="100" y="114" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">t₁</text>
  <circle cx="260" cy="130" r="5.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="184" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">t₂</text>
  <circle cx="420" cy="130" r="5.5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="420" y="114" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">t₃</text>

  <rect x="16" y="200" width="156" height="104" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="94" y="222" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">① t₁ &lt; start：等待再走</text>
  <text x="94" y="245" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">在 u 原地等待</text>
  <text x="94" y="262" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">等到 start 才出发</text>
  <text x="94" y="288" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">到达 v：start + 1</text>

  <rect x="182" y="200" width="156" height="104" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="222" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 窗内 t₂：立即走</text>
  <text x="260" y="245" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">当前时刻就在窗内</text>
  <text x="260" y="262" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">不用等，立刻出发</text>
  <text x="260" y="288" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">到达 v：t₂ + 1</text>

  <rect x="348" y="200" width="156" height="104" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="426" y="222" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">③ t₃ &gt; end：已过期</text>
  <text x="426" y="245" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">等待不能回到过去</text>
  <text x="426" y="262" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">窗口关了就是关了</text>
  <text x="426" y="288" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">此边弃用 ✗</text>

  <rect x="56" y="324" width="408" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="343" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">统一转移（当 t ≤ end）：nt = max(t, start) + 1</text>
  <text x="260" y="361" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">「等待」被 max 一口吞掉——无需逐秒模拟</text>

  <text x="260" y="400" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">支配性：等待任意久都合法 ⇒ 更早到达 v 绝不更差 ⇒ 每点只记「最早到达时刻」⇒ 可跑 Dijkstra</text>
</svg>
