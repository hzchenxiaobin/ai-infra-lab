<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">核心：前 n−1 趟 ⌈d/v⌉（等整点发车），末趟 d/v（精确到达）</text>

  <!-- ===== Train timeline ===== -->
  <text x="40" y="52" font-size="11" fill="#888" filter="url(#rough2)">示例 dist=[1,3,2], speed=3：</text>

  <!-- Time axis -->
  <line x1="80" y1="172" x2="460" y2="172" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10" fill="#888" text-anchor="middle">
    <line x1="80" y1="170" x2="80" y2="176" stroke="#888" stroke-width="1"/>
    <text x="80" y="188">0</text>
    <line x1="180" y1="170" x2="180" y2="176" stroke="#888" stroke-width="1"/>
    <text x="180" y="188">1</text>
    <line x1="280" y1="170" x2="280" y2="176" stroke="#888" stroke-width="1"/>
    <text x="280" y="188">2</text>
    <text x="350" y="188" fill="#b85450" font-weight="bold">2.7</text>
    <text x="380" y="188">3</text>
  </g>

  <!-- Hour threshold line -->
  <line x1="350" y1="48" x2="350" y2="172" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="356" y="46" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">hour=2.7</text>

  <!-- Train 0: running [80, 113], waiting [113, 180] -->
  <rect x="80" y="66" width="33" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="113" y="66" width="67" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4,3" rx="3" filter="url(#rough2)"/>
  <text x="96" y="81" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">1/3</text>
  <text x="146" y="81" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">等待</text>
  <text x="146" y="60" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">⌈1/3⌉=1</text>

  <!-- Train 1: running [180, 280] -->
  <rect x="180" y="98" width="100" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="230" y="113" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">3/3=1</text>
  <text x="230" y="92" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">⌈3/3⌉=1</text>

  <!-- Train 2 (last): running [280, 347], exact -->
  <rect x="280" y="130" width="67" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="313" y="145" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2/3≈0.67</text>
  <text x="313" y="124" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">末趟：精确</text>

  <!-- Train labels -->
  <text x="72" y="81" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">列车0</text>
  <text x="72" y="113" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">列车1</text>
  <text x="72" y="145" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">列车2</text>

  <!-- Total arrival -->
  <circle cx="347" cy="172" r="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="355" y="167" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">到达 2.67</text>

  <!-- ===== Formula box ===== -->
  <rect x="50" y="206" width="460" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="228" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">T(v) = Σ ⌈dist[i] / v⌉ (i &lt; n−1)  +  dist[n−1] / v</text>
  <text x="280" y="248" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">前 n−1 趟：向上取整（等整点发车）  |  末趟：精确除法（到站即止）</text>

  <!-- ===== Monotonicity curve ===== -->
  <line x1="80" y1="296" x2="80" y2="370" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="80" y1="370" x2="300" y2="370" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="74" y="302" text-anchor="end" font-size="10" fill="#888" filter="url(#rough2)">T(v)</text>
  <text x="304" y="374" font-size="10" fill="#888" filter="url(#rough2)">v→</text>

  <!-- decreasing curve -->
  <path d="M 90 308 C 140 336 200 356 290 362" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="150" y="324" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">v ↑ ⇒ T ↓</text>

  <!-- hour threshold -->
  <line x1="80" y1="346" x2="300" y2="346" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="304" y="350" font-size="10" fill="#b85450" filter="url(#rough2)">hour</text>

  <!-- answer point -->
  <circle cx="172" cy="346" r="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="172" y="388" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">v*</text>

  <text x="110" y="340" font-size="9" fill="#b85450" filter="url(#rough2)">太慢 ✗</text>
  <text x="250" y="340" font-size="9" fill="#4a7a3a" filter="url(#rough2)">可行 ✓</text>

  <!-- summary note -->
  <rect x="340" y="296" width="200" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="440" y="318" text-anchor="middle" font-size="11" fill="#444" font-weight="bold" filter="url(#rough2)">二段性</text>
  <text x="440" y="336" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">v &lt; v* → T(v) &gt; hour</text>
  <text x="440" y="352" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">v ≥ v* → T(v) ≤ hour</text>
  <text x="440" y="366" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">⇒ 二分答案</text>
</svg>
