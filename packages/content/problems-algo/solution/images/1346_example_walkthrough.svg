<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：arr = [10, 2, 5, 3]</text>

  <!-- Table header -->
  <rect x="30" y="48" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="60" y="67" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">步</text>
  <rect x="90" y="48" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="120" y="67" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">x</text>
  <rect x="150" y="48" width="150" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="225" y="67" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2x ∈ seen ?</text>
  <rect x="300" y="48" width="150" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="375" y="67" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">x/2 ∈ seen ?</text>
  <rect x="450" y="48" width="140" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="520" y="67" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">seen 更新</text>

  <!-- Row 1: x=10 -->
  <rect x="30" y="78" width="60" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="100" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="90" y="78" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="120" y="100" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">10</text>
  <rect x="150" y="78" width="150" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="225" y="100" text-anchor="middle" font-size="11" fill="#888">20 ? 否</text>
  <rect x="300" y="78" width="150" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="375" y="100" text-anchor="middle" font-size="11" fill="#888">5 ? 否</text>
  <rect x="450" y="78" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="520" y="100" text-anchor="middle" font-size="11" fill="#333">→ {10}</text>

  <!-- Row 2: x=2 -->
  <rect x="30" y="114" width="60" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="136" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="90" y="114" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="120" y="136" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="150" y="114" width="150" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="225" y="136" text-anchor="middle" font-size="11" fill="#888">4 ? 否</text>
  <rect x="300" y="114" width="150" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="375" y="136" text-anchor="middle" font-size="11" fill="#888">1 ? 否</text>
  <rect x="450" y="114" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="520" y="136" text-anchor="middle" font-size="11" fill="#333">→ {10, 2}</text>

  <!-- Row 3: x=5 HIT -->
  <rect x="30" y="150" width="60" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="60" y="172" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <rect x="90" y="150" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="120" y="172" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="150" y="150" width="150" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="225" y="172" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">10 ? 是 ⭐</text>
  <rect x="300" y="150" width="150" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="375" y="172" text-anchor="middle" font-size="11" fill="#888">2.5 跳过</text>
  <rect x="450" y="150" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="520" y="172" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return true</text>

  <!-- annotation -->
  <text x="310" y="206" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">第 3 步：x=5，查 2×5=10 → 已在 seen 中（i=0 存入），即 10 = 2×5 ✓</text>

  <!-- Divider -->
  <line x1="20" y1="226" x2="600" y2="226" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- False example -->
  <text x="310" y="250" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">反例：arr = [3, 1, 7, 11] → 全程无命中</text>

  <!-- compact false walkthrough -->
  <rect x="40" y="266" width="540" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="60" y="286" font-size="11" fill="#333">步1 x=3：</text>
  <text x="135" y="286" font-size="11" fill="#888">6?否 / 1.5跳</text>
  <text x="225" y="286" font-size="11" fill="#333">→{3}</text>
  <text x="285" y="286" font-size="11" fill="#888">|</text>
  <text x="300" y="286" font-size="11" fill="#333">步2 x=1：</text>
  <text x="375" y="286" font-size="11" fill="#888">2?否 / 奇跳</text>
  <text x="460" y="286" font-size="11" fill="#333">→{3,1}</text>

  <rect x="40" y="300" width="540" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="60" y="320" font-size="11" fill="#333">步3 x=7：</text>
  <text x="135" y="320" font-size="11" fill="#888">14?否 / 奇跳</text>
  <text x="225" y="320" font-size="11" fill="#333">→{3,1,7}</text>
  <text x="300" y="320" font-size="11" fill="#888">|</text>
  <text x="315" y="320" font-size="11" fill="#333">步4 x=11：</text>
  <text x="390" y="320" font-size="11" fill="#888">22?否 / 奇跳</text>
  <text x="475" y="320" font-size="11" fill="#333">→{3,1,7,11}</text>

  <rect x="40" y="338" width="540" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="358" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">遍历结束无命中 → return false</text>

  <!-- zero case -->
  <line x1="20" y1="384" x2="600" y2="384" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="30" y="406" font-size="11" fill="#444" font-weight="bold">零特判验证：</text>
  <text x="130" y="406" font-size="11" fill="#333">[0,0] → 第2个0查 2×0=0 ∈ seen → true</text>
  <text x="370" y="406" font-size="11" fill="#333">| [0,1] → 0无伴，1查2?否 → false</text>
</svg>
