<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：两标志法跑三个例子</text>

  <!-- Column headers for the table -->
  <rect x="20" y="44" width="520" height="26" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="60"  y="61" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">例子</text>
  <text x="120" y="61" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">L, W, H</text>
  <text x="180" y="61" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">mass</text>
  <text x="250" y="61" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">维度≥1e4?</text>
  <text x="330" y="61" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">体积≥1e9?</text>
  <text x="400" y="61" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">isBulky</text>
  <text x="460" y="61" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">isHeavy</text>
  <text x="515" y="61" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">结果</text>

  <!-- Row 1: Example 1 -> Heavy -->
  <rect x="20" y="72" width="520" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="60"  y="105" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">示例1</text>
  <text x="120" y="98"  text-anchor="middle" font-size="10.5" fill="#333">1000, 35,</text>
  <text x="120" y="112" text-anchor="middle" font-size="10.5" fill="#333">700</text>
  <text x="180" y="105" text-anchor="middle" font-size="11" fill="#333">300</text>
  <text x="250" y="105" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <text x="330" y="98"  text-anchor="middle" font-size="10.5" fill="#333">2.45×10^7</text>
  <text x="330" y="112" text-anchor="middle" font-size="10.5" fill="#b85450">否</text>
  <text x="400" y="105" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">false</text>
  <text x="460" y="105" text-anchor="middle" font-size="11" fill="#7a5510" font-weight="bold">true</text>
  <text x="515" y="105" text-anchor="middle" font-size="12" fill="#7a5510" font-weight="bold">Heavy</text>

  <!-- Row 2: Example 2 -> Neither -->
  <rect x="20" y="130" width="520" height="56" fill="#ffffff" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="60"  y="163" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">示例2</text>
  <text x="120" y="156" text-anchor="middle" font-size="10.5" fill="#333">200, 50,</text>
  <text x="120" y="170" text-anchor="middle" font-size="10.5" fill="#333">800</text>
  <text x="180" y="163" text-anchor="middle" font-size="11" fill="#333">50</text>
  <text x="250" y="163" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <text x="330" y="156" text-anchor="middle" font-size="10.5" fill="#333">8×10^6</text>
  <text x="330" y="170" text-anchor="middle" font-size="10.5" fill="#b85450">否</text>
  <text x="400" y="163" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">false</text>
  <text x="460" y="163" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">false</text>
  <text x="515" y="163" text-anchor="middle" font-size="12" fill="#666" font-weight="bold">Neither</text>

  <!-- Row 3: Extra -> Both (dimension fast path) -->
  <rect x="20" y="188" width="520" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="60"  y="221" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">补充</text>
  <text x="120" y="214" text-anchor="middle" font-size="10.5" fill="#333">10000, 1,</text>
  <text x="120" y="228" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <text x="180" y="221" text-anchor="middle" font-size="11" fill="#333">100</text>
  <text x="250" y="221" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <text x="330" y="221" text-anchor="middle" font-size="10.5" fill="#888">短路跳过</text>
  <text x="400" y="221" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">true</text>
  <text x="460" y="221" text-anchor="middle" font-size="11" fill="#7a5510" font-weight="bold">true</text>
  <text x="515" y="221" text-anchor="middle" font-size="12" fill="#8a3030" font-weight="bold">Both</text>

  <!-- Row 4: Extra -> Bulky (volume path) -->
  <rect x="20" y="246" width="520" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="60"  y="279" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">补充</text>
  <text x="120" y="272" text-anchor="middle" font-size="10.5" fill="#333">1000,1000,</text>
  <text x="120" y="286" text-anchor="middle" font-size="10.5" fill="#333">2000</text>
  <text x="180" y="279" text-anchor="middle" font-size="11" fill="#333">10</text>
  <text x="250" y="279" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <text x="330" y="272" text-anchor="middle" font-size="10.5" fill="#333">2×10^9</text>
  <text x="330" y="286" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <text x="400" y="279" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">true</text>
  <text x="460" y="279" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">false</text>
  <text x="515" y="279" text-anchor="middle" font-size="12" fill="#2a4466" font-weight="bold">Bulky</text>

  <!-- Divider -->
  <path d="M 30 316 L 530 316" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Notes -->
  <text x="30" y="336" font-size="11" fill="#555">• 「维度≥1e4」是 isBulky 的快路径：命中即可短路，跳过乘法、回避溢出。</text>
  <text x="30" y="354" font-size="11" fill="#555">• 体积路径才需 long long：补充例 4 体积 2×10^9 超 INT_MAX，int 相乘会溢出错判。</text>
  <text x="30" y="372" font-size="11" fill="#555">• 两标志独立：示例1 维度/体积都否、仅 mass≥100 → 只 isHeavy=true → Heavy。</text>
  <text x="30" y="390" font-size="11" fill="#b85450">• 易错点：把体积写成 int 乘法 (L*W*H) → 大数溢出 → 本该 Bulky 误判 Neither。</text>
</svg>
