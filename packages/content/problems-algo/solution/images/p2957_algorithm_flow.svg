<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一次线性扫描，i 跳 1 或跳 2</text>

  <!-- 开始 -->
  <rect x="200" y="38" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="59" text-anchor="middle" font-size="12" fill="#33476b" font-weight="bold" filter="url(#rough2)">ans = 0，i = 1</text>

  <path d="M 260 70 L 260 84" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <!-- 菱形 1 -->
  <polygon points="260,88 330,124 260,160 190,124" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="129" text-anchor="middle" font-size="12" fill="#33476b" font-weight="bold" filter="url(#rough2)">i &lt; n ?</text>

  <path d="M 330 124 L 394 124" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <text x="362" y="116" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">否（扫完）</text>

  <rect x="398" y="108" width="108" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="452" y="129" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <path d="M 260 160 L 260 176" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <text x="272" y="172" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 菱形 2 -->
  <polygon points="260,180 338,226 260,272 182,226" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="223" text-anchor="middle" font-size="11.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">|w[i] − w[i−1]| ≤ 1 ?</text>
  <text x="260" y="240" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">（相邻冲突？）</text>

  <path d="M 338 226 L 366 226" fill="none" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrg)"/>
  <text x="352" y="218" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">是</text>

  <!-- 冲突分支 -->
  <rect x="370" y="198" width="140" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="440" y="219" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">ans += 1；i += 2</text>
  <text x="440" y="240" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">✱ 与两侧都安全，跳过 i+1</text>

  <path d="M 260 272 L 260 292" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <text x="272" y="288" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- 安全分支 -->
  <rect x="192" y="296" width="136" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="319" text-anchor="middle" font-size="12" fill="#33476b" font-weight="bold" filter="url(#rough2)">i += 1</text>

  <!-- 回环 -->
  <path d="M 260 332 L 260 348 L 440 348" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 440 254 L 440 348" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 260 348 L 96 348 L 96 124 L 184 124" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <text x="150" y="366" font-size="10.5" fill="#555" filter="url(#rough2)">回到「i &lt; n ?」继续</text>

  <!-- 底部注释 -->
  <rect x="60" y="376" width="400" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="390" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">全程不真正修改 word：修改只为计数——反正 ✱ 总能选到</text>
</svg>
