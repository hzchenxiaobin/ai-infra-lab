<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：循环分段求和，直到 len(s) ≤ k</text>

  <!-- ===== Start ===== -->
  <rect x="200" y="36" width="140" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="14" filter="url(#rough2)"/>
  <text x="270" y="55" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">开始：输入 s, k</text>
  <path d="M 270 64 L 270 80" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Diamond 1: len(s) > k ? ===== -->
  <polygon points="270,80 360,116 270,152 180,116" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="114" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">len(s) &gt; k ?</text>
  <text x="270" y="128" text-anchor="middle" font-size="9" fill="#666">还需操作？</text>

  <!-- No -> return s -->
  <path d="M 360 116 L 420 116" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="386" y="110" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">否</text>
  <rect x="420" y="100" width="110" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="14" filter="url(#rough2)"/>
  <text x="475" y="120" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">返回 s</text>

  <!-- Yes -> i = 0 -->
  <path d="M 270 152 L 270 168" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="282" y="164" font-size="9.5" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- ===== Init: next = "" , i = 0 ===== -->
  <rect x="170" y="168" width="200" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="186" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">next = ""; i = 0</text>
  <path d="M 270 194 L 270 208" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Diamond 2: i < len(s) ? ===== -->
  <polygon points="270,208 360,238 270,268 180,238" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="236" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i &lt; len(s) ?</text>
  <text x="270" y="250" text-anchor="middle" font-size="9" fill="#666">还有组？</text>

  <!-- No -> s = next, loop back to Diamond1 -->
  <path d="M 180 238 L 120 238" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="150" y="232" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">否</text>
  <rect x="44" y="224" width="76" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="82" y="242" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">s = next</text>
  <!-- loop back up to Diamond1 left point (180,116) -->
  <path d="M 82 224 L 82 116 L 180 116" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="56" y="170" font-size="9" fill="#888">回外层</text>

  <!-- Yes -> process -->
  <path d="M 270 268 L 270 282" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="282" y="278" font-size="9.5" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- ===== Process: sum digits of group s[i:i+k] ===== -->
  <rect x="96" y="282" width="348" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="270" y="301" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">g = 求和(s[i : i+k])；next += str(g)</text>
  <path d="M 270 312 L 270 326" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== i += k ===== -->
  <rect x="215" y="326" width="110" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="344" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i += k</text>
  <!-- loop back to Diamond2 right point (360,238) -->
  <path d="M 325 339 L 420 339 L 420 238 L 360 238" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="290" font-size="9" fill="#888">回内层</text>

  <!-- ===== Footer ===== -->
  <rect x="30" y="360" width="480" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="270" y="378" text-anchor="middle" font-size="9.5" fill="#555">外层按 len&gt;k 控轮数；内层步长 k 取组、求数位和并拼到 next；末组自动截断</text>
</svg>
