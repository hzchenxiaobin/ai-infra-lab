<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">删掉一段连续的可删线 ⇒ 空洞跨度 = 段长 + 1</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">以水平线为例（决定空洞的「高」）：设 n = 5，hBars = [2,3,4,6]</text>

  <!-- hole band between line1 and line5 -->
  <rect x="150" y="92" width="200" height="104" fill="#e6f4ea" opacity="0.6" filter="url(#rough2)"/>
  <text x="250" y="186" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">空洞：高 = 5 − 1 = 4</text>

  <!-- horizontal lines 1..7 -->
  <path d="M 150 92 L 350 92" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <path d="M 150 118 L 350 118" stroke="#d6a040" stroke-width="2" stroke-dasharray="7 4" filter="url(#rough2)"/>
  <path d="M 150 144 L 350 144" stroke="#d6a040" stroke-width="2" stroke-dasharray="7 4" filter="url(#rough2)"/>
  <path d="M 150 170 L 350 170" stroke="#d6a040" stroke-width="2" stroke-dasharray="7 4" filter="url(#rough2)"/>
  <path d="M 150 196 L 350 196" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 150 222 L 350 222" stroke="#d6a040" stroke-width="2" stroke-dasharray="7 4" filter="url(#rough2)"/>
  <path d="M 150 248 L 350 248" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>

  <!-- left line numbers -->
  <text x="138" y="96" text-anchor="end" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <text x="138" y="122" text-anchor="end" font-size="12" fill="#a07818" filter="url(#rough2)">2</text>
  <text x="138" y="148" text-anchor="end" font-size="12" fill="#a07818" filter="url(#rough2)">3</text>
  <text x="138" y="174" text-anchor="end" font-size="12" fill="#a07818" filter="url(#rough2)">4</text>
  <text x="138" y="200" text-anchor="end" font-size="12" fill="#555" filter="url(#rough2)">5</text>
  <text x="138" y="226" text-anchor="end" font-size="12" fill="#a07818" filter="url(#rough2)">6</text>
  <text x="138" y="252" text-anchor="end" font-size="12" fill="#555" filter="url(#rough2)">7</text>

  <!-- X marks on deleted run [2,4] -->
  <path d="M 243 111 L 257 125 M 257 111 L 243 125" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 243 137 L 257 151 M 257 137 L 243 151" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 243 163 L 257 177 M 257 163 L 243 177" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- right annotations -->
  <text x="366" y="96" font-size="10.5" fill="#446688" filter="url(#rough2)">固定边框</text>
  <path d="M 356 118 L 361 118 L 361 170 L 356 170" stroke="#a07818" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="368" y="138" font-size="10.5" fill="#a07818" filter="url(#rough2)">hBars 连续段</text>
  <text x="368" y="154" font-size="10.5" fill="#a07818" filter="url(#rough2)">[2,4] 长 3，全删</text>
  <text x="366" y="200" font-size="10.5" fill="#b85450" filter="url(#rough2)">不在 hBars，删不掉</text>
  <text x="366" y="222" font-size="10.5" fill="#b85450" filter="url(#rough2)">⇒ 卡断，两段无法合并</text>
  <text x="366" y="246" font-size="10.5" fill="#a07818" filter="url(#rough2)">另一段 [6]：跨度仅 2</text>
  <text x="366" y="262" font-size="10.5" fill="#446688" filter="url(#rough2)">固定边框</text>

  <!-- formula boxes -->
  <rect x="70" y="290" width="380" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="308" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">水平方向最大跨度 = 最长连续段长 + 1 = 3 + 1 = 4</text>
  <text x="260" y="326" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">边界是段两端外扩一格的 x−1 和 y+1（都不在 hBars 里，天然保留）</text>

  <rect x="70" y="348" width="380" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="366" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">正方形边长 = min(水平最大跨度, 竖直最大跨度)</text>
  <text x="260" y="382" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">面积 = 边长² ；跨度大的方向少删几条线即可凑齐同样的边长</text>
</svg>
