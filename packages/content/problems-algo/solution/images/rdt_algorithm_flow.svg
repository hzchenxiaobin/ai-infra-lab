<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：split → 剥后缀 → 查月份表 → 拼接补零</text>

  <!-- ===== Step 1: split ===== -->
  <rect x="180" y="48" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① 切分 date.split(' ')</text>
  <text x="280" y="84" text-anchor="middle" font-size="11" fill="#666">→ ["20th", "Oct", "2052"]</text>

  <path d="M 280 92 L 280 108" stroke="#666" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: year ===== -->
  <rect x="180" y="110" width="200" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="130" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">② 取 year = 第 3 段</text>
  <text x="280" y="146" text-anchor="middle" font-size="11" fill="#666">→ "2052"（4 位，无需补零）</text>

  <path d="M 280 154 L 280 170" stroke="#666" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: strip suffix ===== -->
  <rect x="180" y="172" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="192" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">③ 剥 day 后缀 d[:-2]</text>
  <text x="280" y="208" text-anchor="middle" font-size="11" fill="#666">→ "20th" 去末 2 字符 → "20"</text>

  <path d="M 280 216 L 280 232" stroke="#666" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 4: month lookup ===== -->
  <rect x="180" y="234" width="200" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="254" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">④ 月份查表 month["Oct"]</text>
  <text x="280" y="270" text-anchor="middle" font-size="11" fill="#666">→ 10</text>

  <path d="M 280 278 L 280 294" stroke="#666" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 5: format ===== -->
  <rect x="160" y="296" width="240" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="316" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">⑤ 补零拼接 f"{y}-{m:02d}-{d:02d}"</text>
  <text x="280" y="332" text-anchor="middle" font-size="11" fill="#666">day/month 不足 2 位前补零</text>

  <path d="M 280 340 L 280 356" stroke="#666" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Output ===== -->
  <rect x="180" y="358" width="200" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="380" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">输出 "2052-10-20"</text>

  <!-- Side annotation: no branch -->
  <rect x="400" y="172" width="140" height="100" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)" opacity="0.6"/>
  <text x="470" y="196" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">流程特点</text>
  <text x="470" y="214" text-anchor="middle" font-size="10" fill="#666">• 无分支判断</text>
  <text x="470" y="230" text-anchor="middle" font-size="10" fill="#666">• 直线流程</text>
  <text x="470" y="246" text-anchor="middle" font-size="10" fill="#666">• 后缀恒 2 字符</text>
  <text x="470" y="262" text-anchor="middle" font-size="10" fill="#666">• 月份固定 12 项</text>
</svg>
