<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：目标函数 f(x,y) 是凸函数</text>
  <text x="270" y="46" text-anchor="middle" font-size="11" fill="#888">f(x,y) = Σ √((x−xi)² + (y−yi)²) → 凸 → 三分搜索可求全局最小值</text>

  <!-- coordinate system -->
  <path d="M 70 305 L 70 70" stroke="#999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 70 305 L 500 305" stroke="#999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="55" y="75" font-size="10" fill="#888">f(x)</text>
  <text x="502" y="309" font-size="10" fill="#888">x</text>

  <!-- convex curve (bowl shape, slightly asymmetric, min around x≈235) -->
  <path d="M 95 82 C 175 300, 270 285, 470 68" stroke="#446688" stroke-width="2.4" fill="none" filter="url(#rough2)"/>

  <!-- minimum point -->
  <circle cx="235" cy="272" r="3.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="235" y="290" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">min</text>

  <!-- ternary search interval [lo, hi] -->
  <path d="M 110 305 L 110 314" stroke="#666" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="110" y="328" text-anchor="middle" font-size="9" fill="#666">lo</text>
  <path d="M 450 305 L 450 314" stroke="#666" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="450" y="328" text-anchor="middle" font-size="9" fill="#666">hi</text>

  <!-- interval bracket -->
  <path d="M 110 318 L 110 322 L 450 322 L 450 318" stroke="#666" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <!-- m1 = lo + (hi-lo)/3 ≈ 223, m2 = hi - (hi-lo)/3 ≈ 337 -->
  <!-- f(m1) near minimum (low = large y), f(m2) higher (small y) -->
  <path d="M 223 305 L 223 245" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="3 2" fill="none" filter="url(#rough2)"/>
  <circle cx="223" cy="245" r="4" fill="#d6a040" filter="url(#rough2)"/>
  <text x="223" y="328" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">m₁</text>
  <text x="200" y="240" font-size="9" fill="#d6a040">f(m₁)↓</text>

  <path d="M 337 305 L 337 145" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3 2" fill="none" filter="url(#rough2)"/>
  <circle cx="337" cy="145" r="4" fill="#b85450" filter="url(#rough2)"/>
  <text x="337" y="328" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">m₂</text>
  <text x="345" y="140" font-size="9" fill="#b85450">f(m₂)↑</text>

  <!-- shaded discarded region [m2, hi] -->
  <rect x="337" y="70" width="113" height="235" fill="#fce4ec" opacity="0.35" filter="url(#rough2)"/>
  <text x="393" y="100" text-anchor="middle" font-size="11" fill="#b85450">舍弃</text>

  <!-- comparison arrow f(m1) < f(m2) -->
  <path d="M 223 235 C 270 215, 290 165, 337 155" stroke="#888" stroke-width="1" stroke-dasharray="2 2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- note box -->
  <rect x="355" y="150" width="175" height="105" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="442" y="170" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">三分搜索判据</text>
  <text x="362" y="190" font-size="10" fill="#333">f(m₁) &lt; f(m₂) → min 在</text>
  <text x="362" y="204" font-size="10" fill="#333">　[lo, m₂]，令 hi = m₂</text>
  <text x="362" y="222" font-size="10" fill="#333">f(m₁) &gt; f(m₂) → min 在</text>
  <text x="362" y="236" font-size="10" fill="#333">　[m₁, hi]，令 lo = m₁</text>

  <!-- bottom summary -->
  <rect x="50" y="345" width="460" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="280" y="363" text-anchor="middle" font-size="11" fill="#333">凸性保证：每轮区间缩减 1/3 → O(log((hi−lo)/ε)) 轮收敛到全局最优</text>
</svg>
