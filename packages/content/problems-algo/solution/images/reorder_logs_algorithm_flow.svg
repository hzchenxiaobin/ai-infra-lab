<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="500" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：分类 → 排序字母 → 拼接数字</text>

  <!-- Step 1: iterate -->
  <rect x="170" y="44" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="64" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">遍历每条日志</text>
  <text x="270" y="78" text-anchor="middle" font-size="11" fill="#666">for log in logs</text>
  <path d="M 270 88 L 270 108" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: find space + classify -->
  <rect x="130" y="112" width="280" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="132" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">找首空格，判定类型</text>
  <text x="270" y="148" text-anchor="middle" font-size="11" fill="#666">i = log.find(' '); log[i+1] 是字母?</text>
  <path d="M 270 164 L 270 184" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="270,188 330,212 270,236 210,212" fill="#fff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="216" text-anchor="middle" font-size="12" fill="#333">字母?</text>

  <!-- left branch: letter -->
  <path d="M 210 212 L 120 212 L 120 250" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="244" text-anchor="middle" font-size="11" fill="#d6a040">是</text>
  <rect x="50" y="254" width="140" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="120" y="276" text-anchor="middle" font-size="12" fill="#333">加入 letterLogs</text>

  <!-- right branch: digit -->
  <path d="M 330 212 L 420 212 L 420 250" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="420" y="244" text-anchor="middle" font-size="11" fill="#4a7a3a">否</text>
  <rect x="350" y="254" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="420" y="276" text-anchor="middle" font-size="12" fill="#333">加入 digitLogs</text>

  <!-- loop back arrow -->
  <path d="M 50 271 Q 24 271 24 64 Q 24 48 170 48" stroke="#888" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="34" y="170" font-size="11" fill="#888" transform="rotate(-90 34 170)">下一条</text>

  <!-- merge to sort step -->
  <path d="M 120 292 L 120 318" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 420 292 L 420 318" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: sort letter logs -->
  <rect x="70" y="322" width="400" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="342" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">对 letterLogs 排序</text>
  <text x="270" y="358" text-anchor="middle" font-size="11" fill="#666">键 = (log[id+1:], log[:id])  内容优先，标识符兜底</text>
  <path d="M 270 370 L 270 390" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: concat -->
  <rect x="110" y="394" width="320" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="414" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">拼接 letterLogs + digitLogs</text>
  <text x="270" y="428" text-anchor="middle" font-size="11" fill="#666">数字日志按收集顺序原样追加</text>
  <path d="M 270 438 L 270 458" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Final -->
  <rect x="150" y="462" width="240" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="482" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">返回结果数组</text>
</svg>
