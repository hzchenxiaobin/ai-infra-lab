<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：x ÷ 数位和 s，除得尽是哈沙德数</text>

  <!-- left: x = 18 success -->
  <text x="128" y="58" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">x = 18 ✓</text>

  <rect x="76" y="70" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="97" y="97" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="122" y="70" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="143" y="97" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold" filter="url(#rough2)">8</text>

  <path d="M 120 122 L 120 146" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="134" y="140" font-size="10" fill="#888" filter="url(#rough2)">各位相加</text>

  <rect x="66" y="156" width="108" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="120" y="178" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">s = 1 + 8 = 9</text>

  <path d="M 120 196 L 120 220" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="58" y="230" width="124" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="120" y="252" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">18 mod 9 = 0 整除</text>

  <rect x="58" y="278" width="124" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="120" y="303" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return 9</text>

  <!-- right: x = 23 fail -->
  <text x="392" y="58" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">x = 23 ✗</text>

  <rect x="340" y="70" width="42" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="361" y="97" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="386" y="70" width="42" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="407" y="97" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>

  <path d="M 384 122 L 384 146" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="398" y="140" font-size="10" fill="#888" filter="url(#rough2)">各位相加</text>

  <rect x="330" y="156" width="108" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="384" y="178" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">s = 2 + 3 = 5</text>

  <path d="M 384 196 L 384 220" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="322" y="230" width="124" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="384" y="252" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">23 mod 5 = 3 余 3</text>

  <rect x="322" y="278" width="124" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="384" y="303" text-anchor="middle" font-size="13.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">return −1</text>

  <!-- divider -->
  <path d="M 260 60 L 260 330" stroke="#ccc" stroke-width="1.4" stroke-dasharray="6 5" fill="none" filter="url(#rough2)"/>

  <!-- bottom strip -->
  <rect x="48" y="338" width="424" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="358" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">两步走：① 一趟 %10 / ÷10 扫描求 s　② 一次取模判定</text>
  <text x="260" y="377" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">彩蛋性质：x − s(x) 恒为 9 的倍数（弃九法）</text>
</svg>
