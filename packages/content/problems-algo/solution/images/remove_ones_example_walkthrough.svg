<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">以 row0 为基准，逐行判定「相同 / 相反」</text>

  <!-- ===== Example 1: true ===== -->
  <rect x="30" y="58" width="500" height="186" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="48" y="80" font-size="12.5" fill="#333" font-weight="bold">示例 1：grid = [[0,1,0],[1,0,1],[0,1,0]] → true</text>

  <!-- Row labels + cells: cell w=38 h=30, start x=110 -->
  <!-- row0 -->
  <text x="100" y="108" text-anchor="end" font-size="11" fill="#446688" font-weight="bold">row0 基准</text>
  <rect x="110" y="92" width="38" height="30" fill="#f6f6f6" stroke="#bbb" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="129" y="112" text-anchor="middle" font-size="13" fill="#bbb">0</text>
  <rect x="148" y="92" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="167" y="112" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="186" y="92" width="38" height="30" fill="#f6f6f6" stroke="#bbb" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="205" y="112" text-anchor="middle" font-size="13" fill="#bbb">0</text>
  <text x="240" y="108" font-size="11" fill="#888">取作 base</text>

  <!-- row1 -->
  <text x="100" y="146" text-anchor="end" font-size="11" fill="#555">row1</text>
  <rect x="110" y="130" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="129" y="150" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="148" y="130" width="38" height="30" fill="#f6f6f6" stroke="#bbb" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="167" y="150" text-anchor="middle" font-size="13" fill="#bbb">0</text>
  <rect x="186" y="130" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="205" y="150" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="240" y="146" font-size="11" fill="#d6a040" font-weight="bold">= ~base ✓</text>

  <!-- row2 -->
  <text x="100" y="184" text-anchor="end" font-size="11" fill="#555">row2</text>
  <rect x="110" y="168" width="38" height="30" fill="#f6f6f6" stroke="#bbb" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="129" y="188" text-anchor="middle" font-size="13" fill="#bbb">0</text>
  <rect x="148" y="168" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="167" y="188" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="186" y="168" width="38" height="30" fill="#f6f6f6" stroke="#bbb" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="205" y="188" text-anchor="middle" font-size="13" fill="#bbb">0</text>
  <text x="240" y="184" font-size="11" fill="#4a7a3a" font-weight="bold">= base ✓</text>

  <text x="340" y="140" font-size="11" fill="#555">row0:[0,1,0]</text>
  <text x="340" y="158" font-size="11" fill="#555">row1:[1,0,1] 逐位相反</text>
  <text x="340" y="176" font-size="11" fill="#555">row2:[0,1,0] 逐位相同</text>
  <text x="340" y="200" font-size="12" fill="#4a7a3a" font-weight="bold">→ 全部行合法，return true</text>

  <!-- ===== Example 2: false ===== -->
  <rect x="30" y="256" width="500" height="186" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="48" y="278" font-size="12.5" fill="#333" font-weight="bold">示例 2：grid = [[1,1,0],[0,0,0],[0,0,0]] → false</text>

  <!-- row0 -->
  <text x="100" y="306" text-anchor="end" font-size="11" fill="#446688" font-weight="bold">row0 基准</text>
  <rect x="110" y="290" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="129" y="310" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="148" y="290" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="167" y="310" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="186" y="290" width="38" height="30" fill="#f6f6f6" stroke="#bbb" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="205" y="310" text-anchor="middle" font-size="13" fill="#bbb">0</text>
  <text x="240" y="306" font-size="11" fill="#888">取作 base = [1,1,0]</text>

  <!-- row1: [0,0,0], neither -->
  <text x="100" y="344" text-anchor="end" font-size="11" fill="#555">row1</text>
  <rect x="110" y="328" width="38" height="30" fill="#f6f6f6" stroke="#bbb" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="129" y="348" text-anchor="middle" font-size="13" fill="#bbb">0</text>
  <rect x="148" y="328" width="38" height="30" fill="#f6f6f6" stroke="#bbb" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="167" y="348" text-anchor="middle" font-size="13" fill="#bbb">0</text>
  <rect x="186" y="328" width="38" height="30" fill="#f6f6f6" stroke="#bbb" stroke-width="0.8" rx="3" filter="url(#rough2)"/>
  <text x="205" y="348" text-anchor="middle" font-size="13" fill="#bbb">0</text>
  <text x="240" y="344" font-size="11" fill="#b85450" font-weight="bold">≠ base 且 ≠ ~base ✗</text>

  <!-- ~base would be [0,0,1], row1 is [0,0,0] -->
  <text x="340" y="320" font-size="11" fill="#555">base   = [1,1,0]</text>
  <text x="340" y="338" font-size="11" fill="#555">~base  = [0,0,1]</text>
  <text x="340" y="356" font-size="11" fill="#b85450" font-weight="bold">row1=[0,0,0] 两者都不是</text>
  <text x="340" y="378" font-size="12" fill="#b85450" font-weight="bold">→ 出现第三形态，return false</text>

  <!-- row2 (faded, not reached) -->
  <text x="100" y="382" text-anchor="end" font-size="11" fill="#aaa">row2</text>
  <rect x="110" y="366" width="38" height="30" fill="#f6f6f6" stroke="#ddd" stroke-width="0.6" rx="3" filter="url(#rough2)"/>
  <text x="129" y="386" text-anchor="middle" font-size="13" fill="#ddd">0</text>
  <rect x="148" y="366" width="38" height="30" fill="#f6f6f6" stroke="#ddd" stroke-width="0.6" rx="3" filter="url(#rough2)"/>
  <text x="167" y="386" text-anchor="middle" font-size="13" fill="#ddd">0</text>
  <rect x="186" y="366" width="38" height="30" fill="#f6f6f6" stroke="#ddd" stroke-width="0.6" rx="3" filter="url(#rough2)"/>
  <text x="205" y="386" text-anchor="middle" font-size="13" fill="#ddd">0</text>
  <text x="240" y="382" font-size="10.5" fill="#aaa">（未判定，已提前返回）</text>

  <!-- footer note -->
  <text x="280" y="464" text-anchor="middle" font-size="10.5" fill="#888">判定一行只需 O(n)：逐位比较是否「全相同」或「全相反」，无需真正模拟翻转过程</text>
</svg>
