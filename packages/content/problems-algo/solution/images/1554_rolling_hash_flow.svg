<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    滚动哈希算法流程（O(n·m)）
  </text>

  <!-- Step 1: Preprocessing -->
  <rect x="40" y="48" width="480" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="72" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">① 预处理</text>
  <text x="60" y="92" font-size="11" fill="#555" filter="url(#rough2)">
    对每个串 sⱼ 计算前缀哈希 pref[0..m]：pref[k+1] = pref[k]·B + val(sⱼ[k])  mod M
  </text>
  <text x="60" y="106" font-size="11" fill="#555" filter="url(#rough2)">
    预计算 B 的幂次 powB[0..m]；双模数 (M₁, M₂) 防碰撞
  </text>

  <!-- Arrow down -->
  <path d="M280,114 L280,134" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- Step 2: Outer loop -->
  <rect x="40" y="138" width="480" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="164" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">② 遍历每个位置 i = 0 … m−1</text>
  <text x="300" y="164" font-size="11" fill="#888" filter="url(#rough2)">（每轮新建空哈希表 seen）</text>

  <!-- Arrow down -->
  <path d="M280,184 L280,204" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- Step 3: Inner loop -->
  <rect x="40" y="208" width="480" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="234" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">③ 遍历每个串 sⱼ ，计算指纹</text>

  <!-- Arrow down -->
  <path d="M280,254 L280,268" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- Fingerprint formula box -->
  <rect x="60" y="272" width="440" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="293" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">
    指纹 = 去掉位置 i 后子串的哈希（长度 m−1）
  </text>
  <text x="280" y="312" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">
    fp = pref[i]·B^(m−1−i) + (pref[m] − pref[i+1]·B^(m−1−i))  mod M
  </text>

  <!-- Arrow down -->
  <path d="M280,328 L280,342" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="280,346 380,376 280,406 180,376" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="372" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">指纹在 seen 中</text>
  <text x="280" y="388" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">且字符不同?</text>

  <!-- Yes arrow (right) -->
  <path d="M380,376 L440,376" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="395" y="370" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="440" y="362" width="75" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="477" y="382" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">return true</text>

  <!-- No arrow (left) -->
  <path d="M180,376 L130,376" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="145" y="370" font-size="11" fill="#446688" filter="url(#rough2)">否</text>
  <rect x="50" y="362" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="90" y="382" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">seen[fp]=c</text>

  <!-- Loop back arrow -->
  <path d="M90,362 L90,229 L40,229 L40,229" stroke="#446688" stroke-width="1" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M50,229 L40,229 L45,225" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M50,229 L40,229 L45,233" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="32" y="300" font-size="10" fill="#888" filter="url(#rough2)" transform="rotate(-90 32 300)">下一个串 / 位置</text>

  <!-- Final return -->
  <rect x="220" y="416" width="120" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="431" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">遍历结束 → return false</text>
</svg>
