<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一次遍历 + 奇偶切换</text>

  <!-- Start oval -->
  <rect x="200" y="38" width="160" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="15" filter="url(#rough2)"/>
  <text x="280" y="58" text-anchor="middle" font-size="12" fill="#333">开始 cnt=0, inside=false</text>
  <path d="M 280 68 L 280 84" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Loop frame -->
  <rect x="70" y="86" width="420" height="232" fill="none" stroke="#b8b8b8" stroke-width="1.5" stroke-dasharray="6,4" rx="12" filter="url(#rough2)"/>
  <text x="84" y="104" font-size="11" fill="#888" font-style="italic">对每个字符 c ∈ s</text>

  <!-- D1: c == '|' ? -->
  <polygon points="280,118 348,142 280,166 212,142" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="146" text-anchor="middle" font-size="12" fill="#333">c == ‘|’ ?</text>
  <!-- D1 yes branch right -->
  <text x="354" y="138" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 348 142 L 372 142" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="372" y="128" width="104" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="424" y="148" text-anchor="middle" font-size="12" fill="#333">inside = !inside</text>
  <!-- rejoin from D1 action down-then-left to main flow -->
  <path d="M 424 158 L 424 192 L 286 192" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <!-- D1 no branch down -->
  <text x="288" y="180" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M 280 166 L 280 192" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <circle cx="280" cy="192" r="3" fill="#888" filter="url(#rough2)"/>

  <!-- D2: c == '*' and !inside ? -->
  <polygon points="280,208 368,236 280,264 192,236" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="232" text-anchor="middle" font-size="11.5" fill="#333">c == ‘*’ 且</text>
  <text x="280" y="246" text-anchor="middle" font-size="11.5" fill="#333">!inside ?</text>
  <!-- D2 yes branch right -->
  <text x="374" y="232" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 368 236 L 384 236" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="384" y="222" width="92" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="430" y="242" text-anchor="middle" font-size="12" fill="#333">cnt++</text>
  <!-- rejoin from D2 action -->
  <path d="M 430 252 L 430 286 L 286 286" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <!-- D2 no branch down (skip) -->
  <text x="288" y="278" font-size="11" fill="#b85450" font-weight="bold">否·跳过</text>
  <path d="M 280 264 L 280 286" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <circle cx="280" cy="286" r="3" fill="#888" filter="url(#rough2)"/>

  <!-- advance to next char -->
  <path d="M 280 286 L 280 308" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="290" y="304" font-size="10.5" fill="#888" font-style="italic">下一字符</text>

  <!-- End oval -->
  <path d="M 280 318 L 280 340" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="200" y="340" width="160" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="15" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="12" fill="#333">返回 cnt</text>

  <!-- note -->
  <text x="84" y="384" font-size="10.5" fill="#888">三分支：遇 | 翻转 / 遇外 * 计数 / 其它跳过，均为 O(1)</text>
</svg>
