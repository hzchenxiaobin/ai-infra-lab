<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">核心观察：num1[i]×num2[j] → 个位落 res[i+j+1]，进位落 res[i+j]</text>

  <!-- index rulers -->
  <text x="190" y="72" text-anchor="middle" font-size="10" fill="#888">i=0</text>
  <text x="238" y="72" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">i=1</text>
  <text x="286" y="72" text-anchor="middle" font-size="10" fill="#888">i=2</text>

  <!-- num1 row -->
  <text x="120" y="103" font-size="12" fill="#888">num1:</text>
  <rect x="168" y="84" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="108" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="216" y="84" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="238" y="108" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="264" y="84" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="286" y="108" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>

  <!-- num2 row -->
  <text x="120" y="151" font-size="12" fill="#888">num2:</text>
  <text x="190" y="120" text-anchor="middle" font-size="10" fill="#888">j=0</text>
  <text x="238" y="120" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">j=1</text>
  <text x="286" y="120" text-anchor="middle" font-size="10" fill="#888">j=2</text>
  <rect x="168" y="132" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="156" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <rect x="216" y="132" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="238" y="156" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <rect x="264" y="132" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="286" y="156" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>

  <!-- × symbol and equation -->
  <text x="330" y="118" font-size="20" fill="#666" font-weight="bold">×</text>
  <text x="372" y="104" font-size="12" fill="#666">取 i=1, j=1</text>
  <text x="372" y="124" font-size="13" fill="#b85450" font-weight="bold">2 × 5 = 10</text>

  <!-- arrow from num2[1] down to split cells -->
  <path d="M 238 168 L 238 190" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- split cells: carry + ones -->
  <rect x="216" y="192" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="238" y="215" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="238" y="240" text-anchor="middle" font-size="9" fill="#446688">进位(十位)</text>
  <rect x="260" y="192" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="282" y="215" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <text x="282" y="240" text-anchor="middle" font-size="9" fill="#4a7a3a">个位</text>

  <!-- right note box -->
  <rect x="408" y="186" width="142" height="118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="479" y="208" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">位置映射</text>
  <text x="479" y="228" text-anchor="middle" font-size="11" fill="#666">i + j = 2</text>
  <text x="479" y="246" text-anchor="middle" font-size="11" fill="#666">i + j + 1 = 3</text>
  <text x="479" y="266" text-anchor="middle" font-size="11" fill="#446688">进位 → res[2]</text>
  <text x="479" y="284" text-anchor="middle" font-size="11" fill="#4a7a3a">个位 → res[3]</text>

  <!-- arrows down to res array -->
  <path d="M 238 226 L 238 268" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 282 226 L 282 268" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- res array -->
  <text x="96" y="296" font-size="12" fill="#888">res:</text>
  <text x="150" y="262" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="194" y="262" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="238" y="262" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">2</text>
  <text x="282" y="262" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">3</text>
  <text x="326" y="262" text-anchor="middle" font-size="10" fill="#888">4</text>
  <text x="370" y="262" text-anchor="middle" font-size="10" fill="#888">5</text>
  <rect x="128" y="270" width="44" height="38" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="295" text-anchor="middle" font-size="14" fill="#999">0</text>
  <rect x="172" y="270" width="44" height="38" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="194" y="295" text-anchor="middle" font-size="14" fill="#999">0</text>
  <rect x="216" y="270" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="238" y="295" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">+</text>
  <rect x="260" y="270" width="44" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="282" y="295" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">+</text>
  <rect x="304" y="270" width="44" height="38" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="326" y="295" text-anchor="middle" font-size="14" fill="#999">0</text>
  <rect x="348" y="270" width="44" height="38" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="370" y="295" text-anchor="middle" font-size="14" fill="#999">0</text>

  <!-- bottom formula -->
  <rect x="40" y="326" width="480" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="345" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">位权 10^(m+n−2−(i+j)) ⇒ res 下标 p = i+j+1</text>
  <text x="280" y="361" text-anchor="middle" font-size="10" fill="#888">故个位落 res[i+j+1]，进位（十位）落 res[i+j]</text>
</svg>
