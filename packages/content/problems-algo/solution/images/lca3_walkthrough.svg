<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：p = 5, q = 4（LCA = 5）</text>
  <text x="300" y="46" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">5 → 3 → null（m=2 步）；4 → 2 → 5 → 3 → null（n=4 步）</text>

  <!-- ===== table grid ===== -->
  <!-- header -->
  <rect x="40" y="64" width="520" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="110" y1="64" x2="110" y2="360" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="220" y1="64" x2="220" y2="360" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="330" y1="64" x2="330" y2="360" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="75" y="87" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">步</text>
  <text x="165" y="87" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="275" y="87" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="445" y="87" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">本步动作</text>

  <!-- row 0 -->
  <rect x="40" y="100" width="520" height="42" fill="#fafafa" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="75" y="126" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="165" y="126" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="275" y="126" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="345" y="126" font-size="11" fill="#555" filter="url(#rough2)">初始化 a = p, b = q</text>

  <!-- row 1 -->
  <rect x="40" y="142" width="520" height="42" fill="#fafafa" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="75" y="168" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="165" y="168" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="275" y="168" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="345" y="168" font-size="11" fill="#555" filter="url(#rough2)">a←parent(5)=3；b←parent(4)=2</text>

  <!-- row 2 -->
  <rect x="40" y="184" width="520" height="42" fill="#fafafa" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="75" y="210" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="165" y="210" text-anchor="middle" font-size="12" fill="#888" font-weight="bold" filter="url(#rough2)">null</text>
  <text x="275" y="210" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="345" y="210" font-size="11" fill="#555" filter="url(#rough2)">a←parent(3)=null；b←parent(2)=5</text>

  <!-- row 3 -->
  <rect x="40" y="226" width="520" height="42" fill="#fff8e1" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="75" y="252" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="165" y="252" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="275" y="252" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="345" y="252" font-size="11" fill="#b85450" filter="url(#rough2)">a 为 null → 跳到 q=4；b←parent(5)=3</text>

  <!-- row 4 -->
  <rect x="40" y="268" width="520" height="42" fill="#fff8e1" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="75" y="294" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="165" y="294" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="275" y="294" text-anchor="middle" font-size="12" fill="#888" font-weight="bold" filter="url(#rough2)">null</text>
  <text x="345" y="294" font-size="11" fill="#d6a040" filter="url(#rough2)">a←parent(4)=2；b 为 null → 跳到 p=5</text>

  <!-- row 5: meeting -->
  <rect x="40" y="310" width="520" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="75" y="336" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="165" y="336" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="275" y="336" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="345" y="336" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">a == b → 返回 5 ✓</text>

  <text x="300" y="378" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">各走 |p链|+|q链|−|公共后缀| = 3+5−3 = 5 步后相遇</text>
</svg>
