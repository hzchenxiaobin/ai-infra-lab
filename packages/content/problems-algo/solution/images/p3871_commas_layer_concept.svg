<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：位数定逗号数；纵向分层 Σ(n − 10^3k + 1)</text>

  <!-- ① 横向：位数分组 -->
  <text x="24" y="46" font-size="11.5" fill="#444" font-weight="bold" filter="url(#rough2)">① 横向看：位数分组，组内逗号数统一 ⌊(d−1)/3⌋</text>

  <rect x="24" y="56" width="92" height="44" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="71" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">1~3 位</text>
  <text x="70" y="84" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">999</text>
  <text x="70" y="96" text-anchor="middle" font-size="9.5" fill="#666" font-weight="bold" filter="url(#rough2)">0 个逗号</text>

  <rect x="122" y="56" width="92" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="168" y="71" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">4~6 位</text>
  <text x="168" y="84" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">1,000</text>
  <text x="168" y="96" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">1 个逗号</text>

  <rect x="220" y="56" width="92" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="266" y="71" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">7~9 位</text>
  <text x="266" y="84" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">1,000,000</text>
  <text x="266" y="96" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2 个逗号</text>

  <rect x="318" y="56" width="92" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="364" y="71" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">10~12 位</text>
  <text x="364" y="84" text-anchor="middle" font-size="8.5" fill="#8a6d1f" filter="url(#rough2)">1,000,000,000</text>
  <text x="364" y="96" text-anchor="middle" font-size="9.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">3 个逗号</text>

  <rect x="416" y="56" width="92" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="462" y="71" text-anchor="middle" font-size="9.5" fill="#a0433f" filter="url(#rough2)">13~15 位</text>
  <text x="462" y="84" text-anchor="middle" font-size="8" fill="#a0433f" filter="url(#rough2)">1,000,000,000,000</text>
  <text x="462" y="96" text-anchor="middle" font-size="9.5" fill="#a0433f" font-weight="bold" filter="url(#rough2)">4 个逗号</text>

  <!-- ② 纵向：分层 -->
  <text x="24" y="126" font-size="11.5" fill="#444" font-weight="bold" filter="url(#rough2)">② 纵向看：第 k 层 = 「至少 k 个逗号」的数 ⟺ x ≥ 10^3k</text>

  <!-- 层条（自上而下 k=5..1，右端对齐 n） -->
  <text x="378" y="164" text-anchor="end" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">k=5</text>
  <rect x="384" y="150" width="100" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="434" y="162" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">n−10¹⁵+1</text>

  <text x="314" y="187" text-anchor="end" font-size="9.5" fill="#a0433f" font-weight="bold" filter="url(#rough2)">k=4</text>
  <rect x="320" y="173" width="164" height="16" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="402" y="185" text-anchor="middle" font-size="9" fill="#a0433f" filter="url(#rough2)">n − 10¹² + 1</text>

  <text x="250" y="210" text-anchor="end" font-size="9.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">k=3</text>
  <rect x="256" y="196" width="228" height="16" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="370" y="208" text-anchor="middle" font-size="9" fill="#8a6d1f" filter="url(#rough2)">n − 10⁹ + 1</text>

  <text x="186" y="233" text-anchor="end" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">k=2</text>
  <rect x="192" y="219" width="292" height="16" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="338" y="231" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">n − 10⁶ + 1</text>

  <text x="122" y="256" text-anchor="end" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">k=1</text>
  <rect x="128" y="242" width="356" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="306" y="254" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">n − 10³ + 1</text>

  <!-- 数轴 -->
  <path d="M 60 266 L 486 266" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="484" y="258" text-anchor="end" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">n</text>
  <path d="M 62 262 L 62 270" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="62" y="282" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">1</text>
  <path d="M 128 262 L 128 270" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="128" y="282" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">10³</text>
  <path d="M 192 262 L 192 270" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="192" y="282" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">10⁶</text>
  <path d="M 256 262 L 256 270" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="256" y="282" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">10⁹</text>
  <path d="M 320 262 L 320 270" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="282" text-anchor="middle" font-size="9.5" fill="#a0433f" filter="url(#rough2)">10¹²</text>
  <path d="M 384 262 L 384 270" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="384" y="282" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">10¹⁵</text>

  <!-- 公式与注记 -->
  <rect x="82" y="294" width="356" height="32" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="314" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">ans = Σk max(0, n − 10^3k + 1)；n ≤ 10¹⁵ ⇒ 只有 k = 1..5</text>

  <text x="260" y="346" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">每个 c 逗号的数恰在第 1..c 层各数一次 ⇒ 分层求和 = 逐数枚举</text>
</svg>
