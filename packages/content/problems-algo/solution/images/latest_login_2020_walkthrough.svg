<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：9 行 → WHERE 剩 4 行 → GROUP BY 3 组 → MAX 取最晚</text>

  <!-- Step 1: All rows -->
  <text x="24" y="46" font-size="10.5" fill="#666">① 全部记录</text>
  <rect x="20" y="52" width="160" height="170" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="20" y="52" width="160" height="20" fill="#e8f0fe" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="100" y="66" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">user_id | time_stamp | year</text>
  <text x="100" y="84" text-anchor="middle" font-size="8.5" fill="#333">6 | 2020-06-30 | 2020</text>
  <text x="100" y="98" text-anchor="middle" font-size="8.5" fill="#b85450">6 | 2021-04-21 | 2021 ✗</text>
  <text x="100" y="112" text-anchor="middle" font-size="8.5" fill="#b85450">6 | 2019-03-07 | 2019 ✗</text>
  <text x="100" y="126" text-anchor="middle" font-size="8.5" fill="#333">8 | 2020-02-01 | 2020</text>
  <text x="100" y="140" text-anchor="middle" font-size="8.5" fill="#333">8 | 2020-12-30 | 2020</text>
  <text x="100" y="154" text-anchor="middle" font-size="8.5" fill="#333">2 | 2020-01-16 | 2020</text>
  <text x="100" y="168" text-anchor="middle" font-size="8.5" fill="#b85450">2 | 2019-08-25 | 2019 ✗</text>
  <text x="100" y="182" text-anchor="middle" font-size="8.5" fill="#b85450">14 | 2019-07-14 | 2019 ✗</text>
  <text x="100" y="196" text-anchor="middle" font-size="8.5" fill="#b85450">14 | 2021-01-06 | 2021 ✗</text>
  <text x="100" y="214" text-anchor="middle" font-size="9" fill="#888">9 行（含所有年份）</text>

  <!-- Arrow 1: WHERE -->
  <path d="M 184 137 L 214 137" stroke="#d6a040" stroke-width="2.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="199" y="129" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">WHERE</text>
  <text x="199" y="150" text-anchor="middle" font-size="8" fill="#d6a040">YEAR=2020</text>

  <!-- Step 2: Filtered -->
  <text x="252" y="46" font-size="10.5" fill="#666">② 过滤后</text>
  <rect x="220" y="52" width="140" height="106" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="220" y="52" width="140" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="66" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">user_id | time_stamp</text>
  <text x="290" y="84" text-anchor="middle" font-size="8.5" fill="#333">6 | 2020-06-30</text>
  <text x="290" y="98" text-anchor="middle" font-size="8.5" fill="#333">8 | 2020-02-01</text>
  <text x="290" y="112" text-anchor="middle" font-size="8.5" fill="#333">8 | 2020-12-30</text>
  <text x="290" y="126" text-anchor="middle" font-size="8.5" fill="#333">2 | 2020-01-16</text>
  <text x="290" y="148" text-anchor="middle" font-size="9" fill="#888">4 行（仅 2020 年）</text>

  <!-- Arrow 2: GROUP BY + MAX -->
  <path d="M 364 105 L 394 105" stroke="#4a7a3a" stroke-width="2.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="379" y="97" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">GROUP</text>
  <text x="379" y="118" text-anchor="middle" font-size="8" fill="#4a7a3a">+ MAX</text>

  <!-- Step 3: Result -->
  <text x="430" y="46" font-size="10.5" fill="#666">③ 结果</text>
  <rect x="400" y="52" width="100" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="400" y="52" width="100" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="450" y="66" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">uid | last_stamp</text>
  <text x="450" y="84" text-anchor="middle" font-size="8.5" fill="#333">6 | 06-30</text>
  <text x="450" y="98" text-anchor="middle" font-size="8.5" fill="#333">8 | 12-30</text>
  <text x="450" y="112" text-anchor="middle" font-size="8.5" fill="#333">2 | 01-16</text>
  <text x="450" y="126" text-anchor="middle" font-size="9" fill="#888">3 行</text>

  <!-- Group detail boxes -->
  <text x="24" y="248" font-size="10.5" fill="#666">分组详情：每组取 MAX(time_stamp)</text>

  <!-- Group: user 6 -->
  <rect x="40" y="258" width="130" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="105" y="274" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">user_id = 6</text>
  <text x="105" y="290" text-anchor="middle" font-size="9" fill="#333">组内: [2020-06-30]</text>
  <text x="105" y="306" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">MAX → 2020-06-30</text>

  <!-- Group: user 8 -->
  <rect x="195" y="258" width="150" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="274" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">user_id = 8</text>
  <text x="270" y="290" text-anchor="middle" font-size="9" fill="#333">组内: [02-01, 12-30]</text>
  <text x="270" y="306" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">MAX → 2020-12-30</text>

  <!-- Group: user 2 -->
  <rect x="370" y="258" width="130" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="435" y="274" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">user_id = 2</text>
  <text x="435" y="290" text-anchor="middle" font-size="9" fill="#333">组内: [2020-01-16]</text>
  <text x="435" y="306" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">MAX → 2020-01-16</text>

  <!-- Bottom note -->
  <rect x="40" y="330" width="440" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="348" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">⚠ user 14 无 2020 年记录 → WHERE 过滤后 0 行 → 不出现在结果中</text>
  <text x="260" y="362" text-anchor="middle" font-size="10" fill="#888">若漏写 WHERE：user 6 的 MAX 会取 2021-04-21（非 2020 年，错误！）</text>
</svg>
