<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：按步长模拟每个查询，最后统一异或</text>

  <rect x="215" y="32" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="13" filter="url(#rough2)"/>
  <text x="260" y="50" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">开始</text>

  <path d="M 260 58 L 260 72" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="160" y="74" width="200" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="93" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">取出一个查询 [l, r, k, v]</text>

  <path d="M 260 102 L 260 116" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="215" y="118" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="137" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">idx ← l</text>

  <path d="M 260 146 L 260 160" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,162 330,194 260,226 190,194" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="199" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">idx ≤ r ?</text>

  <path d="M 330 194 L 430 194 L 430 240" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="345" y="186" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <path d="M 260 226 L 260 244" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="272" y="240" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="135" y="246" width="250" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="264" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a[idx] ← a[idx] · v mod p</text>
  <text x="260" y="281" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">p = 10⁹+7（C++ 中间量用 long long）</text>

  <path d="M 260 288 L 260 302" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="185" y="304" width="150" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="323" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">idx ← idx + k</text>

  <path d="M 185 318 L 80 318 L 80 194 L 186 194" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="355" y="244" width="150" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="430" y="265" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">该查询结束</text>
  <text x="430" y="283" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">取下一个查询</text>
  <text x="430" y="301" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">（用完则向下收尾）</text>

  <path d="M 505 262 L 512 262 L 512 88 L 362 88" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 430 308 L 430 324" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="310" y="326" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="347" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ans ← a[0] ⊕ a[1] ⊕ … ⊕ a[n−1]</text>

  <path d="M 410 360 L 410 374" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="365" y="376" width="90" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="13" filter="url(#rough2)"/>
  <text x="410" y="394" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 ans</text>
</svg>
