<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    算法流程：一维映射 + 直接填充
  </text>

  <!-- Step 1 -->
  <rect x="40" y="50" width="200" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="140" y="72" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">① 计算有效迁移量</text>
  <text x="140" y="92" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">k = k mod (m × n)</text>

  <!-- Arrow 1->2 -->
  <path d="M 140 112 L 140 138" fill="none" stroke="#446688" stroke-width="2"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="40" y="140" width="200" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="140" y="162" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">② 遍历新网格每个位置</text>
  <text x="140" y="182" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">for i in 0..m-1, j in 0..n-1</text>

  <!-- Arrow 2->3 -->
  <path d="M 140 202 L 140 228" fill="none" stroke="#446688" stroke-width="2"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="40" y="230" width="200" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="140" y="252" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">③ 反推旧位置</text>
  <text x="140" y="272" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">oldIdx = (i×n + j − k)</text>
  <text x="140" y="288" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">+ m×n) mod (m×n)</text>

  <!-- Arrow 3->4 -->
  <path d="M 140 306 L 140 332" fill="none" stroke="#446688" stroke-width="2"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4 -->
  <rect x="40" y="334" width="200" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="140" y="356" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">④ 填入新网格</text>
  <text x="140" y="374" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">res[i][j] = grid[r][c]</text>

  <!-- Right side: index mapping illustration -->
  <rect x="290" y="50" width="210" height="334" fill="none" stroke="#cccccc" stroke-width="1" stroke-dasharray="4,3" rx="8" filter="url(#rough2)"/>
  <text x="395" y="72" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">索引映射示意</text>

  <!-- new grid position -->
  <rect x="320" y="90" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="345" y="112" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(i,j)</text>
  <text x="395" y="108" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">新位置</text>

  <!-- new flat index -->
  <path d="M 345 128 L 345 148" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="305" y="152" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="345" y="172" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">newIdx = i×n+j</text>

  <!-- reverse shift -->
  <path d="M 345 186 L 345 206" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="200" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">− k</text>
  <rect x="285" y="210" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="345" y="230" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">oldIdx=(newIdx−k+mn)%mn</text>

  <!-- split into row/col -->
  <path d="M 345 244 L 345 264" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="300" y="268" width="90" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="345" y="288" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">r = oldIdx / n</text>
  <rect x="300" y="304" width="90" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="345" y="324" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">c = oldIdx % n</text>

  <!-- final -->
  <path d="M 345 338 L 345 354" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="300" y="358" width="90" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="345" y="374" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">res[i][j]=grid[r][c]</text>
</svg>
