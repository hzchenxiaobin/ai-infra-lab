<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="29" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
  </defs>

  <rect width="880" height="430" fill="#fdfcf7"/>

  <text x="440" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例 1 演算：nums = [4, 3, 6, 16, 8, 2]</text>
  <path d="M 300 38 Q 440 46 580 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="60" y="64" font-size="12" font-weight="bold" fill="#7a5415" filter="url(#sk)">集合 = {2,3,4,6,8,16}，v 从 16 递减到 2：</text>

  <!-- table frame -->
  <g filter="url(#sk)"><rect x="50" y="78" width="780" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <!-- header text -->
  <text x="120" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">v (逆序)</text>
  <text x="250" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">has[v]</text>
  <text x="370" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">v²</text>
  <text x="500" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">v² ∈ 集合?</text>
  <text x="630" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">dp[v]</text>
  <text x="760" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">ans</text>

  <!-- column separators -->
  <g stroke="#cdd9e5" stroke-width="1" filter="url(#sk)">
    <line x1="185" y1="78" x2="185" y2="290"/>
    <line x1="315" y1="78" x2="315" y2="290"/>
    <line x1="435" y1="78" x2="435" y2="290"/>
    <line x1="565" y1="78" x2="565" y2="290"/>
    <line x1="695" y1="78" x2="695" y2="290"/>
  </g>

  <!-- row 1: v=16 -->
  <g filter="url(#sk)"><rect x="50" y="112" width="780" height="30" fill="#ffffff" stroke="#e2e2e2" stroke-width="0.8"/></g>
  <text x="120" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">16</text>
  <text x="250" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">✓</text>
  <text x="370" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">256</text>
  <text x="500" y="132" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#sk)">✗</text>
  <text x="630" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">1</text>
  <text x="760" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">1</text>

  <!-- row 2: v=8 -->
  <g filter="url(#sk)"><rect x="50" y="142" width="780" height="30" fill="#fbfbf7" stroke="#e2e2e2" stroke-width="0.8"/></g>
  <text x="120" y="162" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">8</text>
  <text x="250" y="162" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">✓</text>
  <text x="370" y="162" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">64</text>
  <text x="500" y="162" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#sk)">✗</text>
  <text x="630" y="162" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">1</text>
  <text x="760" y="162" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">1</text>

  <!-- row 3: v=6 -->
  <g filter="url(#sk)"><rect x="50" y="172" width="780" height="30" fill="#ffffff" stroke="#e2e2e2" stroke-width="0.8"/></g>
  <text x="120" y="192" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">6</text>
  <text x="250" y="192" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">✓</text>
  <text x="370" y="192" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">36</text>
  <text x="500" y="192" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#sk)">✗</text>
  <text x="630" y="192" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">1</text>
  <text x="760" y="192" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">1</text>

  <!-- row 4: v=4  (highlight green) -->
  <g filter="url(#sk)"><rect x="50" y="202" width="780" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1"/></g>
  <text x="120" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">4</text>
  <text x="250" y="222" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">✓</text>
  <text x="370" y="222" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">16</text>
  <text x="500" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">✓</text>
  <text x="630" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">1 + dp[16] = 2</text>
  <text x="760" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">2</text>

  <!-- row 5: v=3 -->
  <g filter="url(#sk)"><rect x="50" y="232" width="780" height="30" fill="#fbfbf7" stroke="#e2e2e2" stroke-width="0.8"/></g>
  <text x="120" y="252" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">3</text>
  <text x="250" y="252" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">✓</text>
  <text x="370" y="252" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">9</text>
  <text x="500" y="252" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#sk)">✗</text>
  <text x="630" y="252" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">1</text>
  <text x="760" y="252" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">2</text>

  <!-- row 6: v=2  (highlight green, winner) -->
  <g filter="url(#sk)"><rect x="50" y="262" width="780" height="30" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
  <text x="120" y="282" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">2</text>
  <text x="250" y="282" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">✓</text>
  <text x="370" y="282" text-anchor="middle" font-size="12" fill="#333" filter="url(#sk)">4</text>
  <text x="500" y="282" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">✓</text>
  <text x="630" y="282" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">1 + dp[4] = 3</text>
  <text x="760" y="282" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">3</text>

  <!-- bottom note -->
  <g filter="url(#sk)">
    <rect x="50" y="320" width="780" height="86" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/>
  </g>
  <text x="70" y="346" font-size="12" font-weight="bold" fill="#444" filter="url(#sk)">读表</text>
  <text x="70" y="366" font-size="11" fill="#444" filter="url(#sk)">v = 4：v² = 16 ∈ 集合 → dp[4] = 1 + dp[16] = 1 + 1 = 2</text>
  <text x="70" y="384" font-size="11" fill="#444" filter="url(#sk)">v = 2：v² = 4 ∈ 集合 → dp[2] = 1 + dp[4] = 1 + 2 = 3 ← 全局最大</text>
  <text x="70" y="400" font-size="11" fill="#b85450" filter="url(#sk)">ans = 3 ≥ 2 → 返回 3；若 ans &lt; 2（如示例 2）则返回 −1</text>
</svg>
