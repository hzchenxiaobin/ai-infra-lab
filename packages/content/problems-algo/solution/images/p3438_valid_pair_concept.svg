<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">「出现次数 = 数字本身」是全局属性 → 先计数，再查表找相邻数对</text>

  <text x="95" y="58" text-anchor="end" font-size="11" fill="#888">s =</text>
  <rect x="108" y="40" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="127" y="58" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="148" y="40" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="167" y="58" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="188" y="40" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="207" y="58" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="228" y="40" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="247" y="58" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="268" y="40" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="287" y="58" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="308" y="40" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="327" y="58" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="348" y="40" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="367" y="58" text-anchor="middle" font-size="12" fill="#333">3</text>

  <text x="127" y="80" text-anchor="middle" font-size="9" fill="#999">0</text>
  <text x="167" y="80" text-anchor="middle" font-size="9" fill="#999">1</text>
  <text x="207" y="80" text-anchor="middle" font-size="9" fill="#999">2</text>
  <text x="247" y="80" text-anchor="middle" font-size="9" fill="#999">3</text>
  <text x="287" y="80" text-anchor="middle" font-size="9" fill="#999">4</text>
  <text x="327" y="80" text-anchor="middle" font-size="9" fill="#999">5</text>
  <text x="367" y="80" text-anchor="middle" font-size="9" fill="#999">6</text>

  <text x="40" y="105" font-size="11" fill="#555" font-weight="bold">第一趟：计数 → 判定数位合法性（cnt[d] == d）</text>

  <rect x="60" y="112" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="82" y="128" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="118" y="128" font-size="11" fill="#444">出现 2 次</text>
  <text x="235" y="128" font-size="11" fill="#4a7a3a" font-weight="bold">2 = 2 ✓ 合法</text>

  <rect x="60" y="140" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="82" y="156" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="118" y="156" font-size="11" fill="#444">出现 2 次</text>
  <text x="235" y="156" font-size="11" fill="#b85450" font-weight="bold">2 ≠ 5 ✗ 不合法</text>

  <rect x="60" y="168" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="82" y="184" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="118" y="184" font-size="11" fill="#444">出现 3 次</text>
  <text x="235" y="184" font-size="11" fill="#4a7a3a" font-weight="bold">3 = 3 ✓ 合法</text>

  <rect x="385" y="124" width="120" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="445" y="146" text-anchor="middle" font-size="11" fill="#333">合法数位集合</text>
  <text x="445" y="166" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">{2, 3}</text>

  <text x="40" y="212" font-size="11" fill="#555" font-weight="bold">第二趟：从左到右查相邻数对（a≠b 且 a、b 都合法）</text>

  <rect x="55" y="224" width="52" height="34" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="81" y="246" text-anchor="middle" font-size="13" fill="#666">25</text>
  <rect x="119" y="224" width="52" height="34" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="145" y="246" text-anchor="middle" font-size="13" fill="#666">52</text>
  <rect x="183" y="224" width="52" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="209" y="246" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">23</text>
  <rect x="247" y="224" width="52" height="34" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="273" y="246" text-anchor="middle" font-size="13" fill="#666">35</text>
  <rect x="311" y="224" width="52" height="34" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="337" y="246" text-anchor="middle" font-size="13" fill="#666">53</text>
  <rect x="375" y="224" width="52" height="34" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="401" y="246" text-anchor="middle" font-size="13" fill="#666">33</text>

  <text x="81" y="276" text-anchor="middle" font-size="10" fill="#999">5 不合法 ✗</text>
  <text x="145" y="276" text-anchor="middle" font-size="10" fill="#999">5 不合法 ✗</text>
  <text x="209" y="276" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">命中 ⭐</text>
  <text x="273" y="276" text-anchor="middle" font-size="10" fill="#999">5 不合法 ✗</text>
  <text x="337" y="276" text-anchor="middle" font-size="10" fill="#999">5 不合法 ✗</text>
  <text x="401" y="276" text-anchor="middle" font-size="10" fill="#999">3 = 3 相等 ✗</text>

  <text x="81" y="292" text-anchor="middle" font-size="9" fill="#bbb">i=0</text>
  <text x="145" y="292" text-anchor="middle" font-size="9" fill="#bbb">i=1</text>
  <text x="209" y="292" text-anchor="middle" font-size="9" fill="#bbb">i=2</text>
  <text x="273" y="292" text-anchor="middle" font-size="9" fill="#bbb">i=3</text>
  <text x="337" y="292" text-anchor="middle" font-size="9" fill="#bbb">i=4</text>
  <text x="401" y="292" text-anchor="middle" font-size="9" fill="#bbb">i=5</text>

  <rect x="60" y="300" width="400" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="320" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">返回 "23"（最先命中的合法相邻数对）</text>
  <text x="260" y="338" text-anchor="middle" font-size="10.5" fill="#555">cnt[2] = 2 ✓，cnt[3] = 3 ✓，且 2 ≠ 3</text>
</svg>
