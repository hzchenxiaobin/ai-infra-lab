<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [10, 4, 8, 3]，T = 25，输出 [15, 1, 11, 22]</text>

  <!-- ===== nums array with moving pointer ===== -->
  <text x="40" y="62" font-size="11.5" fill="#446688" font-weight="bold">nums</text>
  <!-- index labels -->
  <text x="120" y="58" text-anchor="middle" font-size="9.5" fill="#888">0</text>
  <text x="180" y="58" text-anchor="middle" font-size="9.5" fill="#888">1</text>
  <text x="240" y="58" text-anchor="middle" font-size="9.5" fill="#888">2</text>
  <text x="300" y="58" text-anchor="middle" font-size="9.5" fill="#888">3</text>
  <!-- cells -->
  <rect x="90" y="64" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="120" y="87" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">10</text>
  <rect x="150" y="64" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="180" y="87" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">4</text>
  <rect x="210" y="64" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="240" y="87" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">8</text>
  <rect x="270" y="64" width="60" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="300" y="87" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">3</text>

  <!-- total box -->
  <rect x="370" y="64" width="160" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="450" y="87" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">total = 25</text>

  <!-- table header -->
  <rect x="30" y="118" width="500" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="62"  y="134" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">步</text>
  <text x="112" y="134" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">i</text>
  <text x="172" y="134" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">leftSum(前)</text>
  <text x="232" y="134" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">x</text>
  <text x="312" y="134" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">rightSum=25−leftSum−x</text>
  <text x="402" y="134" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">answer[i]</text>
  <text x="486" y="134" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">leftSum(后)</text>

  <!-- row 0 -->
  <rect x="30" y="144" width="500" height="30" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="62"  y="163" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="112" y="163" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <text x="172" y="163" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="232" y="163" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">10</text>
  <text x="312" y="163" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">25 − 0 − 10 = 15</text>
  <text x="402" y="163" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">|0−15| = 15</text>
  <text x="486" y="163" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">10</text>

  <!-- row 1 -->
  <rect x="30" y="176" width="500" height="30" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="62"  y="195" text-anchor="middle" font-size="11" fill="#888">1</text>
  <text x="112" y="195" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <text x="172" y="195" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">10</text>
  <text x="232" y="195" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="312" y="195" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">25 − 10 − 4 = 11</text>
  <text x="402" y="195" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">|10−11| = 1</text>
  <text x="486" y="195" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">14</text>

  <!-- row 2 -->
  <rect x="30" y="208" width="500" height="30" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="62"  y="227" text-anchor="middle" font-size="11" fill="#888">2</text>
  <text x="112" y="227" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <text x="172" y="227" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">14</text>
  <text x="232" y="227" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">8</text>
  <text x="312" y="227" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">25 − 14 − 8 = 3</text>
  <text x="402" y="227" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">|14−3| = 11</text>
  <text x="486" y="227" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">22</text>

  <!-- row 3 -->
  <rect x="30" y="240" width="500" height="30" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="62"  y="259" text-anchor="middle" font-size="11" fill="#888">3</text>
  <text x="112" y="259" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
  <text x="172" y="259" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">22</text>
  <text x="232" y="259" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="312" y="259" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">25 − 22 − 3 = 0</text>
  <text x="402" y="259" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">|22−0| = 22</text>
  <text x="486" y="259" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">25</text>

  <!-- answer row highlight -->
  <rect x="360" y="284" width="170" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="445" y="305" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">answer = [15,1,11,22]</text>

  <!-- flow annotations -->
  <path d="M 486 272 Q 486 282 445 284" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- key takeaways -->
  <rect x="30" y="330" width="500" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">要点：① rightSum 由 total − leftSum − x 扣出，无内层扫描</text>
  <text x="280" y="368" text-anchor="middle" font-size="11" fill="#888">② 先用后加：本轮 leftSum 为左侧和，算完 answer[i] 再 += x</text>
  <text x="280" y="382" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">③ 末步 leftSum 追平 total（22+3=25），扫完整段的前缀和即总和</text>

  <!-- per-step pointer showing i advancing -->
  <text x="40" y="418" font-size="10.5" fill="#888">i 游标右移：</text>
  <rect x="110" y="406" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="130" y="421" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">0</text>
  <path d="M 152 417 L 170 417" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="172" y="406" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="192" y="421" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <path d="M 214 417 L 232 417" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="234" y="406" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="254" y="421" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2</text>
  <path d="M 276 417 L 294 417" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="296" y="406" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="316" y="421" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3</text>
  <text x="346" y="421" font-size="10" fill="#888">（每步 leftSum 是 i 左侧之和）</text>
</svg>
