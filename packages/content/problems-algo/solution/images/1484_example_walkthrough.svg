<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="330" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：7 行 → 3 组 → 去重计数 + 词典序拼接</text>
  <text x="330" y="42" text-anchor="middle" font-size="10.5" fill="#888">同日多行合并为一行；DISTINCT 去重；ORDER BY product 保证词典序</text>

  <!-- ===== Input table header ===== -->
  <text x="130" y="64" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">Activities（输入 7 行）</text>
  <rect x="20" y="68" width="220" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="84" text-anchor="middle" font-size="10" fill="#333">sell_date</text>
  <text x="175" y="84" text-anchor="middle" font-size="10" fill="#333">product</text>

  <!-- input rows -->
  <rect x="20" y="92" width="220" height="22" rx="3" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="107" text-anchor="middle" font-size="10" fill="#333">2020-05-30</text>
  <text x="175" y="107" text-anchor="middle" font-size="10" fill="#446688">Headphone</text>

  <rect x="20" y="114" width="220" height="22" rx="3" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="129" text-anchor="middle" font-size="10" fill="#333">2020-05-30</text>
  <text x="175" y="129" text-anchor="middle" font-size="10" fill="#446688">Basketball</text>

  <rect x="20" y="136" width="220" height="22" rx="3" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="151" text-anchor="middle" font-size="10" fill="#333">2020-05-30</text>
  <text x="175" y="151" text-anchor="middle" font-size="10" fill="#446688">T-Shirt</text>

  <rect x="20" y="158" width="220" height="22" rx="3" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="173" text-anchor="middle" font-size="10" fill="#333">2020-06-01</text>
  <text x="175" y="173" text-anchor="middle" font-size="10" fill="#446688">Pencil</text>

  <rect x="20" y="180" width="220" height="22" rx="3" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="195" text-anchor="middle" font-size="10" fill="#333">2020-06-01</text>
  <text x="175" y="195" text-anchor="middle" font-size="10" fill="#446688">Bible</text>

  <rect x="20" y="202" width="220" height="22" rx="3" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="217" text-anchor="middle" font-size="10" fill="#333">2020-06-02</text>
  <text x="175" y="217" text-anchor="middle" font-size="10" fill="#446688">Mask</text>

  <rect x="20" y="224" width="220" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="239" text-anchor="middle" font-size="10" fill="#333">2020-06-02</text>
  <text x="175" y="239" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">Mask</text>

  <!-- Arrow to grouping -->
  <path d="M 248 155 L 280 155" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="264" y="150" text-anchor="middle" font-size="9" fill="#446688">分组</text>

  <!-- ===== Grouping (middle) ===== -->
  <text x="370" y="64" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">GROUP BY sell_date</text>

  <!-- Group 1: 05-30 -->
  <rect x="280" y="92" width="140" height="66" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="350" y="108" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2020-05-30</text>
  <text x="350" y="124" text-anchor="middle" font-size="9.5" fill="#555">Headphone</text>
  <text x="350" y="138" text-anchor="middle" font-size="9.5" fill="#555">Basketball</text>
  <text x="350" y="152" text-anchor="middle" font-size="9.5" fill="#555">T-Shirt</text>

  <!-- Group 2: 06-01 -->
  <rect x="280" y="158" width="140" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="350" y="174" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2020-06-01</text>
  <text x="350" y="190" text-anchor="middle" font-size="9.5" fill="#555">Pencil</text>
  <text x="350" y="196" text-anchor="middle" font-size="9.5" fill="#555"> </text>

  <!-- Group 3: 06-02 -->
  <rect x="280" y="202" width="140" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="350" y="218" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2020-06-02</text>
  <text x="350" y="234" text-anchor="middle" font-size="9.5" fill="#b85450">Mask × 2</text>
  <text x="350" y="240" text-anchor="middle" font-size="9" fill="#b85450">(去重→1)</text>

  <!-- Arrow to result -->
  <path d="M 428 125 L 460 125" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="444" y="120" text-anchor="middle" font-size="9" fill="#446688">聚合</text>

  <!-- ===== Result table (right) ===== -->
  <text x="555" y="64" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">结果（3 行）</text>
  <rect x="460" y="68" width="180" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="84" text-anchor="middle" font-size="9.5" fill="#333">sell_date</text>
  <text x="555" y="84" text-anchor="middle" font-size="9.5" fill="#333">num_sold</text>
  <text x="610" y="84" text-anchor="middle" font-size="9.5" fill="#333">products</text>

  <!-- result row 1 -->
  <rect x="460" y="92" width="180" height="40" rx="3" fill="#fff" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="490" y="108" text-anchor="middle" font-size="9.5" fill="#333">2020-05-30</text>
  <text x="555" y="108" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="610" y="108" text-anchor="middle" font-size="7.5" fill="#446688">Basketball,</text>
  <text x="610" y="120" text-anchor="middle" font-size="7.5" fill="#446688">Headphone,T-Shirt</text>

  <!-- result row 2 -->
  <rect x="460" y="134" width="180" height="40" rx="3" fill="#fff" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="490" y="150" text-anchor="middle" font-size="9.5" fill="#333">2020-06-01</text>
  <text x="555" y="150" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="610" y="150" text-anchor="middle" font-size="8" fill="#446688">Bible,Pencil</text>

  <!-- result row 3 -->
  <rect x="460" y="178" width="180" height="40" rx="3" fill="#fff" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="490" y="194" text-anchor="middle" font-size="9.5" fill="#333">2020-06-02</text>
  <text x="555" y="194" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="610" y="194" text-anchor="middle" font-size="8" fill="#446688">Mask</text>

  <!-- ===== Bottom note boxes ===== -->
  <!-- Note box 1: DISTINCT -->
  <rect x="40" y="270" width="580" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="330" y="288" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">步骤 ①：GROUP BY sell_date 分组 + DISTINCT 去重</text>
  <text x="330" y="306" text-anchor="middle" font-size="10.5" fill="#555" font-family="'Comic Sans MS', monospace">06-02 两行 Mask → DISTINCT 去重为 1 个 Mask</text>

  <!-- Note box 2: COUNT -->
  <rect x="40" y="322" width="580" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="330" y="340" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">步骤 ②：COUNT(DISTINCT product) AS num_sold</text>
  <text x="330" y="358" text-anchor="middle" font-size="10.5" fill="#555">05-30 → 3（Headphone, Basketball, T-Shirt）｜06-01 → 2（Pencil, Bible）｜06-02 → 1（Mask）</text>

  <!-- Note box 3: GROUP_CONCAT -->
  <rect x="40" y="374" width="580" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="330" y="392" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">步骤 ③：GROUP_CONCAT(DISTINCT product ORDER BY product SEPARATOR ',')</text>
  <text x="330" y="410" text-anchor="middle" font-size="10.5" fill="#555">05-30 → Basketball,Headphone,T-Shirt（词典序）｜06-01 → Bible,Pencil｜06-02 → Mask</text>

  <!-- Footer -->
  <text x="330" y="440" text-anchor="middle" font-size="10.5" fill="#888">关键：DISTINCT 去重 + ORDER BY product 保证词典序 + SEPARATOR ',' 逗号分隔 + 外层 ORDER BY sell_date 按日期排序</text>
</svg>
