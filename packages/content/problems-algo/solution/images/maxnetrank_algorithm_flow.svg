<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：度数剪枝 + 候选对枚举</text>

  <!-- Start -->
  <ellipse cx="280" cy="54" rx="42" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="58" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">开始</text>

  <path d="M 280 72 L 280 86" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 1 -->
  <rect x="120" y="88" width="320" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="109" text-anchor="middle" font-size="12" fill="#333">① 计算每城 degree[i]，矩阵 connected 存边</text>

  <path d="M 280 122 L 280 136" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="120" y="138" width="320" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="159" text-anchor="middle" font-size="12" fill="#333">② maxDeg = max(degree)；first = {deg = maxDeg}</text>

  <path d="M 280 172 L 280 186" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="280,188 400,228 280,268 160,228" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="224" text-anchor="middle" font-size="12" fill="#333">|first| ≥ 2 ?</text>
  <text x="280" y="240" text-anchor="middle" font-size="10" fill="#888">最大度城市≥2个</text>

  <!-- Yes branch (left) -->
  <path d="M 160 228 L 110 228 L 110 270" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="132" y="220" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="20" y="272" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="290" text-anchor="middle" font-size="11" fill="#333">枚举 first 内所有对 (u,v)</text>
  <text x="110" y="304" text-anchor="middle" font-size="10" fill="#888">rank = 2·maxDeg − 直连?</text>
  <path d="M 110 312 L 110 328" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="20" y="330" width="180" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="350" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">不相连 → 2·maxDeg</text>
  <text x="110" y="365" text-anchor="middle" font-size="10" fill="#888">(早停，理论上限)</text>
  <text x="110" y="375" text-anchor="middle" font-size="10" fill="#888">全相连 → 2·maxDeg − 1</text>

  <!-- No branch (right) -->
  <path d="M 400 228 L 450 228 L 450 270" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="416" y="220" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="360" y="272" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="450" y="290" text-anchor="middle" font-size="11" fill="#333">u = first[0]；找 secondDeg</text>
  <text x="450" y="304" text-anchor="middle" font-size="10" fill="#888">候选 v ∈ {deg = secondDeg}</text>
  <path d="M 450 312 L 450 328" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="360" y="330" width="180" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="450" y="350" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">不相连 → maxDeg+secondDeg</text>
  <text x="450" y="365" text-anchor="middle" font-size="10" fill="#888">(早停)</text>
  <text x="450" y="375" text-anchor="middle" font-size="10" fill="#888">全相连 → 再 − 1</text>

  <!-- Merge arrows to final box -->
  <path d="M 110 380 L 110 408 L 240 408" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 450 380 L 450 408 L 320 408" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Final return box -->
  <rect x="200" y="412" width="160" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="433" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">③ 返回最大网络秩</text>
</svg>
