<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心概念：字符频次必须互不相同</text>

  <!-- ===== Top: Original string and frequency table ===== -->
  <text x="40" y="52" font-size="12" fill="#888">原始字符串 s = "aaabbbcc"</text>

  <!-- Character blocks -->
  <rect x="40" y="62" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="82" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="72" y="62" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="87" y="82" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="104" y="62" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="119" y="82" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="140" y="62" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="82" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
  <rect x="172" y="62" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="187" y="82" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
  <rect x="204" y="62" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="219" y="82" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
  <rect x="240" y="62" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="82" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">c</text>
  <rect x="272" y="62" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="287" y="82" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">c</text>

  <!-- arrow down -->
  <path d="M 165 100 L 165 118" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="114" font-size="11" fill="#888">统计频次</text>

  <!-- ===== Frequency bars (before) ===== -->
  <text x="40" y="140" font-size="12" fill="#888">频次（降序）：a=3, b=3, c=2 → 有冲突！</text>

  <!-- Bar a=3 -->
  <rect x="80" y="152" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="169" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a: 3</text>

  <!-- Bar b=3 (highlighted - conflict) -->
  <rect x="80" y="182" width="90" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="125" y="199" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">b: 3 ✗</text>

  <!-- Bar c=2 -->
  <rect x="80" y="212" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="229" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">c: 2</text>

  <!-- Conflict indicator -->
  <path d="M 175 164 L 175 194" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" fill="none" filter="url(#rough2)"/>
  <text x="185" y="183" font-size="11" fill="#b85450" font-weight="bold">冲突!</text>

  <!-- arrow right to solution -->
  <path d="M 300 195 L 340 195" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="188" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">贪心调整</text>

  <!-- ===== Right: After adjustment ===== -->
  <text x="360" y="140" font-size="12" fill="#888">调整后：a=3, b=2, c=1 → 全唯一 ✓</text>

  <!-- Bar a=3 -->
  <rect x="380" y="152" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="425" y="169" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a: 3</text>

  <!-- Bar b=2 (reduced) -->
  <rect x="380" y="182" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="199" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">b: 2 ✓</text>

  <!-- Bar c=1 (reduced) -->
  <rect x="380" y="212" width="30" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="395" y="229" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">c:1</text>

  <!-- Deletion annotations -->
  <text x="480" y="199" font-size="11" fill="#b85450" font-weight="bold">−1</text>
  <text x="480" y="229" font-size="11" fill="#b85450" font-weight="bold">−1</text>

  <!-- ===== Bottom: Key insight box ===== -->
  <rect x="40" y="256" width="480" height="108" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="280" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">贪心策略：降序排列，逐个"压低"到不冲突</text>
  <text x="60" y="304" font-size="11" fill="#666">① 按频次降序排序，大频次优先保留</text>
  <text x="60" y="324" font-size="11" fill="#666">② 当前频次 f 若 ≥ 上一个保留值 prev，压到 prev−1（删除 f−(prev−1) 个字符）</text>
  <text x="60" y="344" font-size="11" fill="#666">③ 若 prev 已降到 0，该字符全删（频次归零，不计入"使用中"的频次集合）</text>
  <text x="360" y="344" font-size="12" fill="#d6a040" font-weight="bold">总删除数最小！</text>
</svg>
