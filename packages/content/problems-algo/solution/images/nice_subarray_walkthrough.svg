<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [1,1,2,1,1],  atMost(3)</text>

  <!-- 5 panels, width 104, gap 7, start x=12 -->
  <!-- Panel 0: right=0 -->
  <rect x="12" y="40" width="104" height="300" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="12" y="40" width="104" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="64" y="59" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">right=0</text>
  <!-- array cells: highlight window [0,0] -->
  <rect x="22" y="80" width="18" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="31" y="94" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <rect x="42" y="80" width="18" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="51" y="94" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <rect x="62" y="80" width="18" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="71" y="94" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <rect x="82" y="80" width="18" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="91" y="94" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <rect x="22" y="102" width="18" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="31" y="113" text-anchor="middle" font-size="7" fill="#b85450">1</text>
  <text x="64" y="140" text-anchor="middle" font-size="10" fill="#888">odd：</text>
  <text x="64" y="156" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <text x="64" y="180" text-anchor="middle" font-size="10" fill="#888">≤3？</text>
  <text x="64" y="196" text-anchor="middle" font-size="11" fill="#82b366" font-weight="bold">✓</text>
  <text x="64" y="222" text-anchor="middle" font-size="9.5" fill="#888">+1</text>
  <rect x="22" y="232" width="84" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="64" y="251" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">total=1</text>
  <text x="64" y="280" text-anchor="middle" font-size="9" fill="#aaa" font-style="italic">窗口 [1]</text>
  <text x="64" y="294" text-anchor="middle" font-size="9" fill="#aaa" font-style="italic">left=0</text>

  <!-- Panel 1: right=1 -->
  <rect x="123" y="40" width="104" height="300" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="123" y="40" width="104" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="175" y="59" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">right=1</text>
  <rect x="133" y="80" width="18" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="142" y="94" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <rect x="153" y="80" width="18" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="162" y="94" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <rect x="173" y="80" width="18" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="182" y="94" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <rect x="193" y="80" width="18" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="202" y="94" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <rect x="133" y="102" width="18" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="142" y="113" text-anchor="middle" font-size="7" fill="#b85450">1</text>
  <rect x="153" y="102" width="18" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="162" y="113" text-anchor="middle" font-size="7" fill="#b85450">1</text>
  <text x="175" y="140" text-anchor="middle" font-size="10" fill="#888">odd：</text>
  <text x="175" y="156" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <text x="175" y="180" text-anchor="middle" font-size="10" fill="#888">≤3？</text>
  <text x="175" y="196" text-anchor="middle" font-size="11" fill="#82b366" font-weight="bold">✓</text>
  <text x="175" y="222" text-anchor="middle" font-size="9.5" fill="#888">+2</text>
  <rect x="133" y="232" width="84" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="175" y="251" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">total=3</text>
  <text x="175" y="280" text-anchor="middle" font-size="9" fill="#aaa" font-style="italic">窗口 [1,1]</text>
  <text x="175" y="294" text-anchor="middle" font-size="9" fill="#aaa" font-style="italic">left=0</text>

  <!-- Panel 2: right=2 -->
  <rect x="234" y="40" width="104" height="300" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="234" y="40" width="104" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="286" y="59" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">right=2</text>
  <rect x="244" y="80" width="18" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="253" y="94" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <rect x="264" y="80" width="18" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="273" y="94" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <rect x="284" y="80" width="18" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="293" y="94" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="304" y="80" width="18" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="313" y="94" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <rect x="244" y="102" width="18" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="253" y="113" text-anchor="middle" font-size="7" fill="#b85450">1</text>
  <rect x="264" y="102" width="18" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="273" y="113" text-anchor="middle" font-size="7" fill="#b85450">1</text>
  <rect x="284" y="102" width="18" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="293" y="113" text-anchor="middle" font-size="7" fill="#4a7a3a">0</text>
  <text x="286" y="140" text-anchor="middle" font-size="10" fill="#888">odd：</text>
  <text x="286" y="156" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <text x="286" y="180" text-anchor="middle" font-size="10" fill="#888">≤3？</text>
  <text x="286" y="196" text-anchor="middle" font-size="11" fill="#82b366" font-weight="bold">✓</text>
  <text x="286" y="222" text-anchor="middle" font-size="9.5" fill="#888">+3</text>
  <rect x="244" y="232" width="84" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="286" y="251" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">total=6</text>
  <text x="286" y="280" text-anchor="middle" font-size="9" fill="#aaa" font-style="italic">窗口 [1,1,2]</text>
  <text x="286" y="294" text-anchor="middle" font-size="9" fill="#aaa" font-style="italic">left=0</text>

  <!-- Panel 3: right=3 -->
  <rect x="345" y="40" width="104" height="300" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="345" y="40" width="104" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="397" y="59" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">right=3</text>
  <rect x="355" y="80" width="18" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="364" y="94" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <rect x="375" y="80" width="18" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="384" y="94" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <rect x="395" y="80" width="18" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="404" y="94" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="415" y="80" width="18" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="424" y="94" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <rect x="355" y="102" width="18" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="364" y="113" text-anchor="middle" font-size="7" fill="#b85450">1</text>
  <rect x="375" y="102" width="18" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="384" y="113" text-anchor="middle" font-size="7" fill="#b85450">1</text>
  <rect x="395" y="102" width="18" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="404" y="113" text-anchor="middle" font-size="7" fill="#4a7a3a">0</text>
  <rect x="415" y="102" width="18" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="424" y="113" text-anchor="middle" font-size="7" fill="#b85450">1</text>
  <text x="397" y="140" text-anchor="middle" font-size="10" fill="#888">odd：</text>
  <text x="397" y="156" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
  <text x="397" y="180" text-anchor="middle" font-size="10" fill="#888">≤3？</text>
  <text x="397" y="196" text-anchor="middle" font-size="11" fill="#82b366" font-weight="bold">✓</text>
  <text x="397" y="222" text-anchor="middle" font-size="9.5" fill="#888">+4</text>
  <rect x="355" y="232" width="84" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="397" y="251" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">total=10</text>
  <text x="397" y="280" text-anchor="middle" font-size="9" fill="#aaa" font-style="italic">窗口 [1,1,2,1]</text>
  <text x="397" y="294" text-anchor="middle" font-size="9" fill="#aaa" font-style="italic">left=0</text>

  <!-- Panel 4: right=4 (shrink!) -->
  <rect x="456" y="40" width="104" height="300" fill="#ffffff" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <rect x="456" y="40" width="104" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="508" y="59" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">right=4 ★</text>
  <!-- array: left moves to 1, window [1,4] -->
  <rect x="466" y="80" width="18" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="475" y="94" text-anchor="middle" font-size="9" fill="#bbb">1</text>
  <rect x="486" y="80" width="18" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="495" y="94" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <rect x="506" y="80" width="18" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="515" y="94" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="526" y="80" width="18" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="535" y="94" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <!-- odd markers for window -->
  <rect x="486" y="102" width="18" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="495" y="113" text-anchor="middle" font-size="7" fill="#b85450">1</text>
  <rect x="506" y="102" width="18" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="515" y="113" text-anchor="middle" font-size="7" fill="#4a7a3a">0</text>
  <rect x="526" y="102" width="18" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="535" y="113" text-anchor="middle" font-size="7" fill="#b85450">1</text>
  <text x="508" y="140" text-anchor="middle" font-size="10" fill="#888">odd：</text>
  <text x="508" y="156" text-anchor="middle" font-size="11" fill="#b85450">4→</text>
  <text x="508" y="172" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
  <text x="508" y="190" text-anchor="middle" font-size="9" fill="#b85450">缩left!</text>
  <text x="508" y="208" text-anchor="middle" font-size="9.5" fill="#888">+4</text>
  <rect x="466" y="232" width="84" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="508" y="251" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">total=14</text>
  <text x="508" y="280" text-anchor="middle" font-size="9" fill="#aaa" font-style="italic">窗口[1,2,1,1]</text>
  <text x="508" y="294" text-anchor="middle" font-size="9" fill="#d6a040" font-style="italic">left=0→1</text>

  <!-- Bottom summary -->
  <rect x="12" y="356" width="548" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="286" y="378" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">atMost(3) = 14，同理 atMost(2) = 12</text>
  <text x="286" y="398" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">答案 = atMost(3) − atMost(2) = 14 − 12 = 2 ✓</text>
  <text x="286" y="416" text-anchor="middle" font-size="10.5" fill="#888">每次 right 固定后，以 right 结尾的合法子数组有 right−left+1 个</text>
</svg>
