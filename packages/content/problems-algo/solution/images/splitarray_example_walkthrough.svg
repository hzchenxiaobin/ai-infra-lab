<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="410" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [1,2,1,2,1,2,1]，n = 7</text>

  <!-- nums row -->
  <text x="40" y="62" font-size="11" fill="#888">nums:</text>
  <rect x="86" y="48" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="106" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="126" y="48" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="146" y="68" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>
  <rect x="166" y="48" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="206" y="48" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="226" y="68" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>
  <rect x="246" y="48" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="266" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="286" y="48" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="306" y="68" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>
  <rect x="326" y="48" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="346" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <text x="106" y="92" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="146" y="92" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <text x="186" y="92" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="226" y="92" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">3</text>
  <text x="266" y="92" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <text x="306" y="92" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">5</text>
  <text x="346" y="92" text-anchor="middle" font-size="9" fill="#aaa">6</text>
  <text x="146" y="106" text-anchor="middle" font-size="9" fill="#b85450">i=1</text>
  <text x="226" y="106" text-anchor="middle" font-size="9" fill="#b85450">j=3</text>
  <text x="306" y="106" text-anchor="middle" font-size="9" fill="#b85450">k=5</text>

  <!-- prefix sum row -->
  <text x="36" y="132" font-size="11" fill="#888">s[]:</text>
  <text x="86" y="132" font-size="10.5" fill="#888">0</text>
  <text x="106" y="132" font-size="10.5" fill="#888">1</text>
  <text x="146" y="132" font-size="10.5" fill="#888">3</text>
  <text x="186" y="132" font-size="10.5" fill="#888">4</text>
  <text x="226" y="132" font-size="10.5" fill="#888">6</text>
  <text x="266" y="132" font-size="10.5" fill="#888">7</text>
  <text x="306" y="132" font-size="10.5" fill="#888">9</text>
  <text x="346" y="132" font-size="10.5" fill="#888">10</text>
  <text x="86" y="146" font-size="8.5" fill="#bbb">s0</text>
  <text x="106" y="146" font-size="8.5" fill="#bbb">s1</text>
  <text x="146" y="146" font-size="8.5" fill="#bbb">s2</text>
  <text x="186" y="146" font-size="8.5" fill="#bbb">s3</text>
  <text x="226" y="146" font-size="8.5" fill="#bbb">s4</text>
  <text x="266" y="146" font-size="8.5" fill="#bbb">s5</text>
  <text x="306" y="146" font-size="8.5" fill="#bbb">s6</text>
  <text x="346" y="146" font-size="8.5" fill="#bbb">s7</text>

  <!-- left computation box -->
  <rect x="30" y="162" width="230" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="145" y="182" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">左侧（j=3，枚举 i=1）</text>
  <text x="40" y="202" font-size="10.5" fill="#444">sum(0, i−1) = s[1] = 1</text>
  <text x="40" y="220" font-size="10.5" fill="#444">sum(i+1, j−1) = s[3]−s[2] = 4−3 = 1</text>
  <text x="40" y="240" font-size="11" fill="#4a7a3a" font-weight="bold">1 == 1 ⇒ seen = {1}</text>

  <!-- seen set -->
  <rect x="180" y="200" width="68" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="214" y="216" text-anchor="middle" font-size="9.5" fill="#888">集合 seen</text>
  <text x="214" y="232" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">{ 1 }</text>

  <!-- right computation box -->
  <rect x="280" y="162" width="230" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="395" y="182" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">右侧（k=5）</text>
  <text x="290" y="202" font-size="10.5" fill="#444">sum(j+1, k−1) = s[5]−s[4] = 7−6 = 1</text>
  <text x="290" y="220" font-size="10.5" fill="#444">sum(k+1, n−1) = s[7]−s[6] = 10−9 = 1</text>
  <text x="290" y="240" font-size="11" fill="#d6a040" font-weight="bold">1 == 1，且 1 ∈ seen</text>

  <!-- arrow from left to right via seen -->
  <path d="M 248 220 L 280 210" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4 3"/>

  <!-- result -->
  <rect x="120" y="276" width="300" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="270" y="301" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">四段和均为 1 ⇒ 返回 true ✓</text>

  <!-- 4 parts equal note -->
  <rect x="30" y="328" width="480" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="270" y="350" text-anchor="middle" font-size="11" fill="#444">四段：[1] · [1] · [1] · [1]，被排除的切点元素 2, 2, 2 不计入</text>
  <text x="270" y="370" text-anchor="middle" font-size="11" fill="#555">固定 j=3 把问题切成「左找 i」+「右找 k」两半</text>
  <text x="270" y="386" text-anchor="middle" font-size="10.5" fill="#446688">seen 充当「左侧可达等和」的记忆，右侧一查即匹配</text>
</svg>
