<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：增量配对计数 + 「至少 K」单调前缀</text>

  <!-- ============ Top: incremental pair counting ============ -->
  <text x="36" y="56" font-size="12" fill="#446688" font-weight="bold">① 加入 x，新增对数 = 窗口内已有 x 的个数</text>

  <!-- window cells [3,1,4,3] -->
  <text x="40" y="96" font-size="11" fill="#888">窗口：</text>
  <rect x="92" y="80" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="113" y="100" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="136" y="80" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="157" y="100" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="180" y="80" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="201" y="100" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="224" y="80" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="245" y="100" text-anchor="middle" font-size="13" fill="#333">3</text>

  <!-- + -->
  <text x="284" y="101" font-size="16" fill="#888">+</text>

  <!-- new cell 3 (red) -->
  <rect x="304" y="80" width="42" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="325" y="100" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3</text>
  <text x="325" y="128" text-anchor="middle" font-size="10" fill="#b85450">新加入</text>

  <!-- arrows: new 3 -> each existing 3 (index0 center 113, index3 center 245) -->
  <path d="M 304 92 Q 200 52 135 80" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="190" y="50" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">+1 对</text>
  <path d="M 304 92 Q 280 64 250 80" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="288" y="64" font-size="10" fill="#b85450" font-weight="bold">+1 对</text>

  <!-- formula box -->
  <rect x="92" y="138" width="300" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="242" y="157" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">pairs += cnt[x] （加入前同值个数）</text>
  <text x="410" y="157" font-size="11" fill="#888">→ cnt[3]=2，新增 2 对</text>

  <!-- Divider -->
  <path d="M 36 184 L 524 184" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ============ Bottom: monotonicity bar chart ============ -->
  <text x="36" y="206" font-size="12" fill="#4a7a3a" font-weight="bold">② 固定右端 right，左端 left 越大（窗口越小）→ 配对数单调不增</text>
  <text x="36" y="224" font-size="11" fill="#888">好子数组 = 配对数 ≥ k 的连续前缀 [0, left)，个数恰为 left</text>

  <!-- bars: left=0..6, heights pairs = 3,2,2,1,1,0,0 ; k=2 -->
  <!-- chart geometry: axis y=376, scale 30px/pair, bars width 36 gap 12, start x=118 -->
  <!-- k line at y = 376 - 2*30 = 316 -->
  <line x1="100" y1="376" x2="470" y2="376" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- k=2 threshold line -->
  <path d="M 100 316 L 470 316" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="476" y="320" font-size="11" fill="#d6a040" font-weight="bold">k=2</text>

  <!-- bar left=0 : pairs 3 (good) -->
  <rect x="118" y="286" width="36" height="90" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="136" y="280" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="136" y="392" text-anchor="middle" font-size="9.5" fill="#888">0</text>

  <!-- bar left=1 : pairs 2 (good) -->
  <rect x="166" y="316" width="36" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="184" y="310" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="184" y="392" text-anchor="middle" font-size="9.5" fill="#888">1</text>

  <!-- bar left=2 : pairs 2 (good) -->
  <rect x="214" y="316" width="36" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="232" y="310" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="232" y="392" text-anchor="middle" font-size="9.5" fill="#888">2</text>

  <!-- bar left=3 : pairs 1 (bad) -- first below k -->
  <rect x="262" y="346" width="36" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="280" y="340" text-anchor="middle" font-size="11" fill="#999">1</text>
  <text x="280" y="392" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">3</text>

  <!-- bar left=4 : pairs 1 (bad) -->
  <rect x="310" y="346" width="36" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="328" y="340" text-anchor="middle" font-size="11" fill="#999">1</text>
  <text x="328" y="392" text-anchor="middle" font-size="9.5" fill="#888">4</text>

  <!-- bar left=5 : pairs 0 -->
  <rect x="358" y="374" width="36" height="2" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="376" y="340" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <text x="376" y="392" text-anchor="middle" font-size="9.5" fill="#888">5</text>

  <!-- bar left=6 : pairs 0 -->
  <rect x="406" y="374" width="36" height="2" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="424" y="340" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <text x="424" y="392" text-anchor="middle" font-size="9.5" fill="#888">6</text>

  <text x="448" y="380" font-size="10" fill="#888">left</text>

  <!-- bracket over good prefix left=0..2 -->
  <path d="M 118 270 L 118 264 L 250 264 L 250 270" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="184" y="258" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">3 个好子数组（≥ k）</text>

  <!-- arrow pointing to left=3 (first below k) -->
  <path d="M 280 404 L 280 414" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="280" y="426" text-anchor="middle" font-size="9.5" fill="#b85450">首个 &lt; k</text>

  <!-- bottom formula box -->
  <rect x="92" y="416" width="376" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="430" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">ans += left（首个跌破 k 的起点 = 好数组数）</text>
</svg>
