<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：差值数组是字符串的「签名」，前三个即可定多数</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">示例 1：words = ["adc","wzy","abc"]，串长 3 → 签名长 2</text>

  <!-- column headers -->
  <text x="113" y="60" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">字符串</text>
  <text x="231" y="60" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">差值签名 diff</text>
  <text x="395" y="60" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">判定</text>

  <!-- ===== Row 1: adc ===== -->
  <rect x="70" y="68" width="26" height="28" fill="#fff" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="83" y="87" text-anchor="middle" font-size="12" fill="#333">a</text>
  <rect x="100" y="68" width="26" height="28" fill="#fff" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="113" y="87" text-anchor="middle" font-size="12" fill="#333">d</text>
  <rect x="130" y="68" width="26" height="28" fill="#fff" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="143" y="87" text-anchor="middle" font-size="12" fill="#333">c</text>
  <text x="172" y="87" font-size="14" fill="#888">→</text>
  <rect x="195" y="68" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="212" y="87" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
  <rect x="233" y="68" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="87" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">−1</text>
  <rect x="320" y="70" width="150" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="395" y="87" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">多数签名 ✓</text>

  <!-- ===== Row 2: wzy ===== -->
  <rect x="70" y="120" width="26" height="28" fill="#fff" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="83" y="139" text-anchor="middle" font-size="12" fill="#333">w</text>
  <rect x="100" y="120" width="26" height="28" fill="#fff" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="113" y="139" text-anchor="middle" font-size="12" fill="#333">z</text>
  <rect x="130" y="120" width="26" height="28" fill="#fff" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="143" y="139" text-anchor="middle" font-size="12" fill="#333">y</text>
  <text x="172" y="139" font-size="14" fill="#888">→</text>
  <rect x="195" y="120" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="212" y="139" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
  <rect x="233" y="120" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="139" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">−1</text>
  <rect x="320" y="122" width="150" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="395" y="139" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">多数签名 ✓</text>

  <!-- equality annotation between row1 and row2 -->
  <text x="395" y="110" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">diff[0] == diff[1]</text>

  <!-- ===== Row 3: abc (ODD) ===== -->
  <rect x="70" y="172" width="26" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="83" y="191" text-anchor="middle" font-size="12" fill="#b85450">a</text>
  <rect x="100" y="172" width="26" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="113" y="191" text-anchor="middle" font-size="12" fill="#b85450">b</text>
  <rect x="130" y="172" width="26" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="143" y="191" text-anchor="middle" font-size="12" fill="#b85450">c</text>
  <text x="172" y="191" font-size="14" fill="#b85450">→</text>
  <rect x="195" y="172" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="212" y="191" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <rect x="233" y="172" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="191" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <rect x="320" y="174" width="150" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="395" y="191" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">异类 ← 返回 "abc"</text>

  <!-- connector from odd signature to pill -->
  <path d="M 272 186 L 316 186" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- bottom note boxes -->
  <rect x="40" y="226" width="480" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="246" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">恰好一个字符串不同 ⟹ 前三个签名里至少两个相同（鸽巢原理）</text>

  <rect x="40" y="266" width="480" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="286" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">比较 diff[0]、diff[1]：相等→多数已定、扫描其余；不等→其一为异类，用 diff[2] 裁决</text>

  <rect x="40" y="306" width="480" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="326" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">无需保存全部签名，仅持一两个 diff 数组（O(m) 空间）即可定位异类</text>
</svg>
