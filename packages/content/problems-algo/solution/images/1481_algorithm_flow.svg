<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：计数 → 升序 → 贪心删小频次桶 → 返回剩余种类</text>

  <!-- Start -->
  <ellipse cx="200" cy="54" rx="42" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="58" text-anchor="middle" font-size="12" fill="#333">开始</text>

  <path d="M 200 70 L 200 82" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box1: count freq -->
  <rect x="84" y="84" width="232" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="104" text-anchor="middle" font-size="11.5" fill="#333">freq = 统计每个整数出现次数</text>

  <path d="M 200 116 L 200 128" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box2: sort ascending -->
  <rect x="84" y="130" width="232" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="150" text-anchor="middle" font-size="11.5" fill="#333">freqs = 频次升序排列；i = 0</text>

  <path d="M 200 162 L 200 176" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: i < n 且 freqs[i] <= k ? -->
  <polygon points="200,178 300,218 200,258 100,218" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="214" text-anchor="middle" font-size="11" fill="#333">i &lt; len 且</text>
  <text x="200" y="228" text-anchor="middle" font-size="11" fill="#333">freqs[i] ≤ k ?</text>

  <!-- Yes branch down -->
  <path d="M 200 258 L 200 274" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="210" y="270" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Box: k -= freqs[i]; i += 1 -->
  <rect x="80" y="276" width="240" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="295" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">k -= freqs[i]</text>
  <text x="200" y="311" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">i += 1（整桶删，种类 −1）</text>

  <path d="M 200 320 L 200 332" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop back: box left -> left -> up -> diamond left point -->
  <path d="M 80 298 L 52 298 L 52 218 L 98 218" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="40" y="212" font-size="10.5" fill="#4a7a3a">回到判断</text>

  <!-- No branch right -->
  <path d="M 300 218 L 344 218" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="308" y="212" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <!-- Box: return len - i -->
  <rect x="344" y="202" width="156" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="422" y="222" text-anchor="middle" font-size="11.5" fill="#333">返回 len(freqs) − i</text>

  <path d="M 422 234 L 422 246" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- End -->
  <ellipse cx="422" cy="264" rx="42" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="422" y="268" text-anchor="middle" font-size="12" fill="#333">结束</text>

  <!-- footer note -->
  <rect x="56" y="386" width="448" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="406" text-anchor="middle" font-size="11" fill="#555">每个频次桶只看「整桶能否删」：k ≥ 频次才删，否则停</text>
  <text x="280" y="424" text-anchor="middle" font-size="11" fill="#555">部分删除不减少种类数 → 一旦删不动即终止</text>
  <text x="280" y="440" text-anchor="middle" font-size="10" fill="#888">时间 O(n log n)（排序），空间 O(n)</text>
</svg>
