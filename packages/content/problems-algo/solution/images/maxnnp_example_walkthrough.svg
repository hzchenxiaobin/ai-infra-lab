<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：grid = [[1,−2],[3,−4],[5,−6]]</text>

  <!-- ===== Row 1: grid ===== -->
  <text x="100" y="52" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">grid</text>

  <rect x="60" y="60" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="81" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <rect x="100" y="60" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="81" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−2</text>

  <rect x="60" y="92" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="113" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>

  <rect x="100" y="92" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="113" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−4</text>

  <rect x="60" y="124" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="145" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>

  <rect x="100" y="124" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="145" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−6</text>

  <!-- ===== Row 1: dp_max ===== -->
  <text x="270" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">dp_max</text>

  <rect x="230" y="60" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="81" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>

  <rect x="270" y="60" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="81" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">−2</text>

  <rect x="230" y="92" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="113" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>

  <rect x="270" y="92" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="113" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">8</text>

  <rect x="230" y="124" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="145" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">15</text>

  <rect x="270" y="124" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="145" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−48</text>

  <!-- ===== Row 1: dp_min ===== -->
  <text x="440" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">dp_min</text>

  <rect x="400" y="60" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="81" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>

  <rect x="440" y="60" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="460" y="81" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">−2</text>

  <rect x="400" y="92" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="113" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>

  <rect x="440" y="92" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="460" y="113" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">−12</text>

  <rect x="400" y="124" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="145" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">15</text>

  <rect x="440" y="124" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="460" y="145" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">72</text>

  <!-- ===== Step table ===== -->
  <text x="280" y="180" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">逐格填表过程</text>

  <!-- step 1 -->
  <rect x="30" y="195" width="170" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="115" y="215" text-anchor="middle" font-size="10" fill="#333">(0,0): g=1 → max=1, min=1</text>

  <!-- step 2 -->
  <rect x="30" y="230" width="170" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="115" y="250" text-anchor="middle" font-size="10" fill="#333">(0,1): g=−2, 左1 → −2</text>

  <!-- step 3 -->
  <rect x="30" y="265" width="170" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="115" y="285" text-anchor="middle" font-size="10" fill="#333">(1,0): g=3, 上1 → 3</text>

  <!-- step 4 - key -->
  <rect x="210" y="195" width="190" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="305" y="215" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">(1,1): g=−4</text>

  <rect x="210" y="230" width="190" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="305" y="250" text-anchor="middle" font-size="9" fill="#555">上(−2)→−4·−2=8</text>

  <rect x="210" y="265" width="190" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="305" y="285" text-anchor="middle" font-size="9" fill="#555">左(3)→−4·3=−12 → max=8,min=−12</text>

  <!-- step 5 -->
  <rect x="410" y="195" width="150" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="485" y="215" text-anchor="middle" font-size="10" fill="#333">(2,0): g=5, 上3 → 15</text>

  <!-- step 6 - key -->
  <rect x="410" y="230" width="150" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="485" y="250" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">(2,1): g=−6</text>

  <rect x="410" y="265" width="150" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="485" y="285" text-anchor="middle" font-size="9" fill="#555">min(−12)·−6=72 ✅</text>

  <!-- ===== Bottom: key insight ===== -->
  <rect x="40" y="310" width="480" height="55" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="332" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">关键一步：(2,1) 处 g=−6 是负数</text>
  <text x="280" y="350" text-anchor="middle" font-size="11" fill="#555">dp_min[1][1]=−12（路径 1→3→−4）乘 −6 = 72，翻身成最大积</text>

  <!-- ===== Bottom: answer ===== -->
  <rect x="40" y="380" width="480" height="45" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="400" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">答案 = dp_max[2][1] = 72</text>
  <text x="280" y="418" text-anchor="middle" font-size="10" fill="#555">对应路径：(0,0)→(1,0)→(1,1)→(2,1) = 1·3·(−4)·(−6) = 72</text>
</svg>
