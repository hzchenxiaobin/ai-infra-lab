<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="500" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：计数器归零即切割</text>

  <!-- ===== Example 1 ===== -->
  <text x="40" y="52" font-size="11" fill="#446688" font-weight="bold">示例 1：s = "RLRRLLRLRL" → 输出 4</text>

  <!-- char label -->
  <text x="30" y="82" font-size="10" fill="#888">字符</text>

  <!-- Segment 1: RL (blue) -->
  <rect x="70" y="66" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="83" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">R</text>
  <rect x="110" y="66" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="83" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">L</text>

  <!-- Segment 2: RRLL (green) -->
  <rect x="150" y="66" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="83" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">R</text>
  <rect x="190" y="66" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="83" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">R</text>
  <rect x="230" y="66" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="83" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">L</text>
  <rect x="270" y="66" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="83" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">L</text>

  <!-- Segment 3: RL (orange) -->
  <rect x="310" y="66" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="83" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">R</text>
  <rect x="350" y="66" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="83" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">L</text>

  <!-- Segment 4: RL (pink) -->
  <rect x="390" y="66" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="83" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">R</text>
  <rect x="430" y="66" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="450" y="83" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">L</text>

  <!-- balance values -->
  <text x="30" y="110" font-size="10" fill="#888">balance</text>
  <text x="90" y="110" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <text x="130" y="110" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <text x="170" y="110" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="210" y="110" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="250" y="110" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="290" y="110" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <text x="330" y="110" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <text x="370" y="110" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <text x="410" y="110" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="450" y="110" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>

  <!-- cut lines -->
  <line x1="150" y1="62" x2="150" y2="118" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <line x1="310" y1="62" x2="310" y2="118" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <line x1="390" y1="62" x2="390" y2="118" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <line x1="470" y1="62" x2="470" y2="118" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="150" y="58" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">切</text>
  <text x="310" y="58" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">切</text>
  <text x="390" y="58" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">切</text>
  <text x="470" y="58" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">切</text>

  <!-- segment labels -->
  <text x="110" y="134" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">RL</text>
  <text x="230" y="134" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">RRLL</text>
  <text x="350" y="134" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">RL</text>
  <text x="430" y="134" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">RL</text>

  <!-- count row -->
  <text x="30" y="152" font-size="10" fill="#888">count</text>
  <rect x="96" y="140" width="28" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="153" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="216" y="140" width="28" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="153" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="336" y="140" width="28" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="350" y="153" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="416" y="140" width="28" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="430" y="153" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">4</text>

  <!-- reasoning -->
  <rect x="40" y="168" width="470" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="185" text-anchor="middle" font-size="10" fill="#444">R+1, L-1：balance 4 次归零 → 切出 RL | RRLL | RL | RL</text>

  <!-- separator -->
  <line x1="40" y1="208" x2="500" y2="208" stroke="#ddd" stroke-width="0.8" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Example 2 ===== -->
  <text x="40" y="230" font-size="11" fill="#b85450" font-weight="bold">示例 2（对比）：s = "LLLLRRRR" → 输出 1</text>

  <!-- char label -->
  <text x="30" y="260" font-size="10" fill="#888">字符</text>

  <!-- 8 chars, all same segment (blue) -->
  <rect x="90" y="244" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="261" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">L</text>
  <rect x="130" y="244" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="261" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">L</text>
  <rect x="170" y="244" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="261" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">L</text>
  <rect x="210" y="244" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="261" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">L</text>
  <rect x="250" y="244" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="261" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">R</text>
  <rect x="290" y="244" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="261" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">R</text>
  <rect x="330" y="244" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="350" y="261" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">R</text>
  <rect x="370" y="244" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="390" y="261" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">R</text>

  <!-- balance values -->
  <text x="30" y="288" font-size="10" fill="#888">balance</text>
  <text x="110" y="288" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">-1</text>
  <text x="150" y="288" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">-2</text>
  <text x="190" y="288" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">-3</text>
  <text x="230" y="288" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">-4</text>
  <text x="270" y="288" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">-3</text>
  <text x="310" y="288" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">-2</text>
  <text x="350" y="288" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">-1</text>
  <text x="390" y="288" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>

  <!-- cut line (only one, at the end) -->
  <line x1="410" y1="240" x2="410" y2="296" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="410" y="236" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">切</text>

  <!-- segment label -->
  <text x="250" y="312" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">LLLLRRRR（整段）</text>

  <!-- count -->
  <text x="30" y="330" font-size="10" fill="#888">count</text>
  <rect x="396" y="318" width="28" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="410" y="331" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- reasoning -->
  <rect x="40" y="346" width="470" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="363" text-anchor="middle" font-size="10" fill="#444">L 一路降到 -4，R 缓慢回升，仅末尾归零 → 只能切 1 段</text>

  <!-- arrow down to summary -->
  <path d="M 270 378 L 270 392" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Bottom summary ===== -->
  <rect x="40" y="396" width="470" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="418" font-size="11" fill="#d6a040" font-weight="bold">对比总结</text>
  <text x="60" y="436" font-size="10" fill="#444">示例 1：balance 频繁归零（4 次）→ 切出 4 段，每段都是最小平衡前缀</text>
  <text x="60" y="452" font-size="10" fill="#444">示例 2：balance 一路偏离零，仅在末尾归零（1 次）→ 只能切 1 段</text>
  <text x="60" y="470" font-size="10" fill="#444">结论：归零次数 = 最大分割数，贪心"尽早切"不会错过任何切分机会</text>
</svg>
