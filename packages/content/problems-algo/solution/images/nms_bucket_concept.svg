<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M 0 0 L 4 8 L 8 0 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：按「下一个待匹配字符」分桶（等待列表）</text>

  <!-- s string -->
  <text x="24" y="62" font-size="12" fill="#888">扫描 s =</text>
  <rect x="92" y="44" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="63" text-anchor="middle" font-size="13" fill="#333">a</text>
  <rect x="134" y="44" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="154" y="63" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">b</text>
  <rect x="176" y="44" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="196" y="63" text-anchor="middle" font-size="13" fill="#333">c</text>
  <rect x="218" y="44" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="238" y="63" text-anchor="middle" font-size="13" fill="#333">d</text>
  <rect x="260" y="44" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="63" text-anchor="middle" font-size="13" fill="#333">e</text>
  <text x="154" y="34" text-anchor="middle" font-size="10" fill="#b85450">↑ 当前字符 c</text>

  <!-- buckets header -->
  <text x="24" y="116" font-size="12" fill="#888">26 个桶 bucket[c]（按下一个待匹配字符分）：</text>

  <!-- bucket a -->
  <rect x="40" y="130" width="120" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="100" y="148" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">bucket['a']</text>
  <rect x="52" y="156" width="96" height="18" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="56" y="169" font-size="10" fill="#333">"a"      ptr=0</text>
  <rect x="52" y="178" width="96" height="18" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="56" y="191" font-size="10" fill="#333">"acd"    ptr=0</text>
  <rect x="52" y="200" width="96" height="18" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="56" y="213" font-size="10" fill="#333">"ace"    ptr=0</text>

  <!-- bucket b -->
  <rect x="180" y="130" width="120" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="240" y="148" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">bucket['b']</text>
  <rect x="192" y="156" width="96" height="18" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="196" y="169" font-size="10" fill="#333">"bb"     ptr=0</text>
  <text x="240" y="196" text-anchor="middle" font-size="10" fill="#999">（其余空）</text>

  <!-- bucket c (empty) -->
  <rect x="320" y="130" width="120" height="92" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="380" y="148" text-anchor="middle" font-size="12" fill="#999" font-weight="bold">bucket['c']</text>
  <text x="380" y="186" text-anchor="middle" font-size="11" fill="#aaa">∅ 空</text>

  <!-- bucket ... -->
  <rect x="460" y="130" width="80" height="92" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="500" y="148" text-anchor="middle" font-size="12" fill="#999" font-weight="bold">…'z']</text>
  <text x="500" y="186" text-anchor="middle" font-size="11" fill="#aaa">∅ 空</text>

  <!-- arrow: scan char c -> bucket[c] -->
  <path d="M 154 80 Q 100 100 100 126" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="80" y="104" font-size="10" fill="#b85450">取走整桶</text>

  <!-- bottom: action box -->
  <rect x="40" y="248" width="500" height="138" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="270" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">遇到字符 c 时：取走 bucket[c]，对其中的每个 (word, ptr)</text>

  <rect x="60" y="284" width="140" height="42" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="130" y="302" text-anchor="middle" font-size="11" fill="#333">ptr++（匹配掉 c）</text>
  <text x="130" y="318" text-anchor="middle" font-size="10" fill="#888">指针后移一位</text>

  <path d="M 200 305 L 218 305" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="222" y="284" width="150" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="297" y="302" text-anchor="middle" font-size="11" fill="#333">ptr == |word| ?</text>
  <text x="297" y="318" text-anchor="middle" font-size="10" fill="#888">是 → ans++ ✓</text>

  <path d="M 372 305 L 390 305" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="394" y="284" width="140" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="464" y="302" text-anchor="middle" font-size="11" fill="#333">否则放入</text>
  <text x="464" y="318" text-anchor="middle" font-size="10" fill="#446688">bucket[word[ptr]]</text>

  <text x="290" y="356" text-anchor="middle" font-size="11" fill="#555">扫一遍 s，所有单词「并行」推进 → 每个字符恰被推进一次</text>
  <text x="290" y="374" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">总复杂度 O(|s| + Σ|word|)</text>
</svg>
