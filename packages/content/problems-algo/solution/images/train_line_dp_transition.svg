<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrM" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">状态转移：f[i] 与 g[i] 的 4 条转移边</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">f = 到站时在常规线；g = 到站时在特快线；a=regular[i]，b=express[i]</text>

  <!-- Column labels -->
  <text x="160" y="70" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">站 i−1</text>
  <text x="440" y="70" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">站 i</text>

  <!-- f[i-1] box (top-left) -->
  <rect x="100" y="86" width="120" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="160" y="104" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">f[i−1]</text>
  <text x="160" y="120" text-anchor="middle" font-size="9.5" fill="#666">常规线·站 i−1</text>

  <!-- g[i-1] box (bottom-left) -->
  <rect x="100" y="226" width="120" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="160" y="244" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">g[i−1]</text>
  <text x="160" y="260" text-anchor="middle" font-size="9.5" fill="#666">特快线·站 i−1</text>

  <!-- f[i] box (top-right) -->
  <rect x="380" y="86" width="120" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="440" y="104" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">f[i]</text>
  <text x="440" y="120" text-anchor="middle" font-size="9.5" fill="#666">常规线·站 i</text>

  <!-- g[i] box (bottom-right) -->
  <rect x="380" y="226" width="120" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="440" y="244" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">g[i]</text>
  <text x="440" y="260" text-anchor="middle" font-size="9.5" fill="#666">特快线·站 i</text>

  <!-- Transition 1: f[i-1] -> f[i] (stay regular, +a) blue horizontal top -->
  <path d="M 220 100 L 376 100" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="250" y="78" width="96" height="20" fill="#fafafa" stroke="none" filter="url(#rough2)"/>
  <text x="298" y="92" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">+aᵢ（留常规）</text>

  <!-- Transition 4: g[i-1] -> g[i] (stay express, +b) green horizontal bottom -->
  <path d="M 220 256 L 376 256" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="250" y="262" width="96" height="20" fill="#fafafa" stroke="none" filter="url(#rough2)"/>
  <text x="298" y="276" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">+bᵢ（留特快）</text>

  <!-- Transition 2: g[i-1] -> f[i] (express -> regular, free, +a) diagonal up -->
  <path d="M 220 240 C 280 240, 320 110, 376 110" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrM)" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <rect x="252" y="166" width="110" height="20" fill="#fafafa" stroke="none" filter="url(#rough2)"/>
  <text x="307" y="180" text-anchor="middle" font-size="10" fill="#666">+aᵢ（特快→常规·免费）</text>

  <!-- Transition 3: f[i-1] -> g[i] (regular -> express, +expressCost+b) diagonal down -->
  <path d="M 220 122 C 280 122, 320 246, 376 246" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="240" y="180" width="138" height="20" fill="#fafafa" stroke="none" filter="url(#rough2)"/>
  <text x="309" y="194" text-anchor="middle" font-size="10" fill="#a87020" font-weight="bold">+expressCost+bᵢ（换乘）</text>

  <!-- Bottom: recurrence + answer -->
  <rect x="50" y="290" width="460" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="310" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">递推式：</text>
  <text x="280" y="328" text-anchor="middle" font-size="10.5" fill="#555">f[i]=min(f[i−1]+a, g[i−1]+a)　g[i]=min(f[i−1]+expressCost+b, g[i−1]+b)</text>
  <text x="280" y="342" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">答案 cost[i]=min(f[i], g[i])（到站 i 可在任一线）</text>
</svg>
