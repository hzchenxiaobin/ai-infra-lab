<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：每行只留 top-3 —— 鸽巢替换论证</text>

  <!-- 棋盘列标 -->
  <text x="71" y="52" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">c0</text>
  <text x="117" y="52" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">c1</text>
  <text x="163" y="52" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">c2</text>
  <text x="209" y="52" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">c3</text>

  <!-- 被占列橙色罩 -->
  <rect x="140" y="58" width="46" height="102" fill="#fff8e1" fill-opacity="0.5" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <rect x="186" y="58" width="46" height="102" fill="#fff8e1" fill-opacity="0.5" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>

  <!-- 行标 -->
  <text x="40" y="79" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">行0</text>
  <text x="40" y="113" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">行1</text>
  <text x="40" y="147" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">行2</text>

  <!-- 棋盘格子：row0 -->
  <rect x="48" y="58" width="46" height="34" fill="#efefef" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="71" y="79" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">−3</text>
  <rect x="94" y="58" width="46" height="34" fill="#ffffff" stroke="#8aa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="117" y="79" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="140" y="58" width="46" height="34" fill="#ffffff" stroke="#8aa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="163" y="79" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="186" y="58" width="46" height="34" fill="#ffffff" stroke="#8aa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="209" y="79" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>

  <!-- row1 -->
  <rect x="48" y="92" width="46" height="34" fill="#ffffff" stroke="#8aa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="71" y="113" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">−3</text>
  <rect x="94" y="92" width="46" height="34" fill="#ffffff" stroke="#8aa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="117" y="113" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="140" y="92" width="46" height="34" fill="#efefef" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="163" y="113" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">−3</text>
  <rect x="186" y="92" width="46" height="34" fill="#ffffff" stroke="#8aa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="209" y="113" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- row2：top-3 绿色 -->
  <rect x="48" y="126" width="46" height="34" fill="#efefef" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="71" y="147" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">−3</text>
  <rect x="94" y="126" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="117" y="147" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="133" y="138" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <rect x="140" y="126" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="163" y="147" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <rect x="186" y="126" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="209" y="147" text-anchor="middle" font-size="12.5" fill="#4a7a3a" filter="url(#rough2)">1</text>

  <!-- 三个车的红圈 -->
  <ellipse cx="163" cy="75" rx="17" ry="14" fill="none" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <ellipse cx="209" cy="109" rx="17" ry="14" fill="none" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <ellipse cx="117" cy="143" rx="17" ry="14" fill="none" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>

  <!-- 图例 -->
  <text x="48" y="176" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">绿 = 行2 的 top-3（3 个互异列）</text>
  <text x="48" y="193" font-size="10.5" fill="#d6a040" filter="url(#rough2)">橙罩 = 被另两个车占用的列（c2、c3）</text>
  <text x="48" y="210" font-size="10.5" fill="#b85450" filter="url(#rough2)">红圈 = 最优解的三个车；灰 = 非 top-3，可被替换</text>

  <!-- 候选池框 -->
  <rect x="48" y="224" width="196" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="146" y="245" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">候选池：每行留 3 个 (值, 列)</text>
  <text x="146" y="264" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">共 3m ≤ 300 个格子，最优解全在池内 ✓</text>

  <!-- 右侧论证框 A -->
  <rect x="268" y="56" width="232" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="384" y="78" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">约束：另两个车只占 2 个列</text>
  <text x="384" y="99" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">行 2 的车必须避开 c2、c3</text>

  <path d="M 384 118 L 384 134" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 论证框 B -->
  <rect x="268" y="136" width="232" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="384" y="158" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">行 2 的 top-3 = 3 个互不相同的列</text>
  <text x="384" y="178" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">3 个列 vs 至多 2 个被占 → 鸽巢</text>
  <text x="384" y="198" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">至少 1 个可用：c1 ✓</text>

  <path d="M 384 210 L 384 226" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 论证框 C -->
  <rect x="268" y="228" width="232" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="384" y="249" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">若某行的车在 top-3 之外</text>
  <text x="384" y="268" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">top-3 值 ≥ 它 → 换到可用候选</text>
  <text x="384" y="285" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">替换后合法且和不减</text>

  <!-- 底部引理 -->
  <rect x="48" y="300" width="452" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="274" y="321" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">引理：存在最优解，每个车都在所在行的 top-3 里 → 每行只留 3 个候选</text>

  <text x="260" y="352" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">推广：放 k 个互不攻击的车 → 每行留 top-k（另 k−1 个车至多占 k−1 列）</text>
</svg>
