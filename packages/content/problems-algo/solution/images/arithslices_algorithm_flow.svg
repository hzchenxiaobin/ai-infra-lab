<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="440" height="470" fill="#fafafa"/>

  <text x="220" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">等差数列划分算法流程（滚动变量 O(1)）</text>

  <rect x="110" y="40" width="220" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="220" y="62" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">初始化</text>
  <text x="220" y="80" text-anchor="middle" font-size="11" fill="#555">若 n &lt; 3 返回 0；cur = 0, total = 0</text>

  <path d="M 220 94 L 220 112" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <rect x="90" y="116" width="260" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="220" y="136" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">for i = 2 to n−1</text>
  <text x="220" y="152" text-anchor="middle" font-size="11" fill="#555">从第三个元素开始遍历</text>

  <path d="M 220 164 L 220 182" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <polygon points="220,187 335,234 220,281 105,234" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="220" y="230" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">nums[i]−nums[i−1]</text>
  <text x="220" y="248" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">== nums[i−1]−nums[i−2] ?</text>
  <text x="220" y="264" text-anchor="middle" font-size="10" fill="#777">公差是否不变</text>

  <path d="M 105 234 L 50 234 L 50 300" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="62" y="225" font-size="11" fill="#82b366" font-weight="bold">Yes</text>

  <rect x="8" y="304" width="100" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="58" y="324" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">延续</text>
  <text x="58" y="342" text-anchor="middle" font-size="10" fill="#555">cur += 1</text>
  <text x="58" y="358" text-anchor="middle" font-size="10" fill="#555">total += cur</text>
  <text x="58" y="372" text-anchor="middle" font-size="9.5" fill="#82b366">（继承 + 新增 1）</text>

  <path d="M 335 234 L 390 234 L 390 300" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="356" y="225" font-size="11" fill="#b85450" font-weight="bold">No</text>

  <rect x="340" y="304" width="92" height="74" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="386" y="324" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">中断</text>
  <text x="386" y="342" text-anchor="middle" font-size="10" fill="#555">cur = 0</text>
  <text x="386" y="360" text-anchor="middle" font-size="9.5" fill="#b85450">（无法继承，</text>
  <text x="386" y="372" text-anchor="middle" font-size="9.5" fill="#b85450">重新开始）</text>

  <path d="M 58 378 L 58 402 L 180 402" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <path d="M 386 378 L 386 402 L 262 402" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrowR)" filter="url(#rough2)"/>

  <path d="M 220 402 L 220 422 L 400 422 L 400 138 L 350 138" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>

  <text x="220" y="452" text-anchor="middle" font-size="11" fill="#d6a040" font-style="italic">循环结束 → return total　O(n) 时间 / O(1) 空间</text>
</svg>
