<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 510" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a4a4a"/>
    </marker>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="510" fill="#fdfcf7"/>

  <text x="280" y="26" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold">算法流程：反转 → 扫描删小 → 反转回</text>
  <path d="M 140 34 Q 280 42 420 34" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>

  <!-- 起始 -->
  <g filter="url(#sk)">
    <rect x="225" y="48" width="110" height="28" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">head（输入链表头）</text>

  <path d="M 280 76 L 280 92" stroke="#4a4a4a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ① reverse -->
  <g filter="url(#sk)">
    <rect x="150" y="92" width="260" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="280" y="113" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">① head = reverse(head)　链表掉头</text>

  <path d="M 280 126 L 280 142" stroke="#4a4a4a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ② 初始化 -->
  <g filter="url(#sk)">
    <rect x="120" y="142" width="320" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="280" y="163" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">② dummy=ListNode(0); prev=dummy; maxSoFar=0</text>

  <path d="M 280 176 L 280 192" stroke="#4a4a4a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 循环容器 -->
  <g filter="url(#sk)">
    <rect x="40" y="192" width="480" height="186" rx="10" fill="#f4f9ff" stroke="#446688" stroke-width="1.4" stroke-dasharray="6,4"/>
  </g>
  <text x="280" y="210" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">while (prev-&gt;next != nullptr)</text>

  <!-- 决策菱形 -->
  <g filter="url(#sk)">
    <path d="M 280,224 L 348,266 L 280,308 L 212,266 z" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.5"/>
  </g>
  <text x="280" y="262" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold">curr.val</text>
  <text x="280" y="276" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold">≥ maxSoFar?</text>

  <!-- Yes 分支 → 右 -->
  <path d="M 348 266 L 384 266" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="356" y="258" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <g filter="url(#sk)">
    <rect x="384" y="248" width="124" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
  </g>
  <text x="446" y="265" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold">保留</text>
  <text x="446" y="278" text-anchor="middle" font-size="10" fill="#444">max=val; prev=curr</text>

  <!-- No 分支 → 左 -->
  <path d="M 212 266 L 176 266" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="204" y="258" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <g filter="url(#sk)">
    <rect x="52" y="248" width="124" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="114" y="265" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold">删除</text>
  <text x="114" y="278" text-anchor="middle" font-size="10" fill="#444">prev.next=curr.next</text>

  <!-- 合并 → 循环回顶 -->
  <path d="M 114 284 L 114 330 L 446 330 L 446 284" stroke="#4a4a4a" stroke-width="1.3" fill="none" stroke-dasharray="4,3" filter="url(#sk)"/>
  <path d="M 446 330 L 280 330 L 280 330" stroke="#4a4a4a" stroke-width="1.3" fill="none"/>
  <path d="M 280 330 L 280 312" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="296" y="346" font-size="10" fill="#4a7a3a" font-weight="bold">prev.next≠∅ → 继续循环</text>

  <!-- 退出箭头（从菱形底部出） -->
  <path d="M 280 308 L 280 332" stroke="none"/>
  <path d="M 212 266 L 80 266 L 80 400 L 280 400 L 280 396" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="96" y="394" font-size="10" fill="#b85450" font-weight="bold">prev.next=∅ → 退出循环</text>

  <!-- ③ reverse 回 -->
  <path d="M 280 400 L 280 416" stroke="#4a4a4a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="150" y="416" width="260" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="280" y="437" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">③ head = reverse(dummy.next)　反转回</text>

  <path d="M 280 450 L 280 466" stroke="#4a4a4a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 结束 -->
  <g filter="url(#sk)">
    <rect x="200" y="466" width="160" height="28" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="280" y="484" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">返回 head（答案）</text>
</svg>
