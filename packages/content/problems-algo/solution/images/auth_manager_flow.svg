<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：HashMap + 最小堆惰性删除（count(15) 时清理）</text>

  <!-- ====== Left: HashMap ====== -->
  <text x="44" y="62" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">HashMap</text>
  <text x="44" y="76" font-size="9.5" fill="#888" filter="url(#rough2)">tokenId → expTime</text>
  <rect x="44" y="84" width="150" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="56" y="104" font-size="11" fill="#333" filter="url(#rough2)">aaa → 7</text>
  <text x="56" y="124" font-size="11" fill="#333" filter="url(#rough2)">bbb → 15</text>
  <text x="56" y="146" font-size="9.5" fill="#888" filter="url(#rough2)">(当前真实状态)</text>
  <text x="56" y="164" font-size="9.5" fill="#888" filter="url(#rough2)">size = 2</text>

  <!-- ====== Right: Min-Heap ====== -->
  <text x="330" y="62" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">最小堆</text>
  <text x="330" y="76" font-size="9.5" fill="#888" filter="url(#rough2)">(expTime, tokenId)</text>
  <!-- heap entries, sorted by expTime -->
  <rect x="330" y="84" width="170" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="415" y="103" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">(7, aaa)  ← top</text>
  <rect x="330" y="116" width="170" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="415" y="135" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">(12, bbb)  ⚠ 旧条目</text>
  <rect x="330" y="148" width="170" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="415" y="167" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">(15, bbb)  ← 新条目</text>

  <!-- arrow from heap top to clean step -->
  <path d="M 415 176 L 415 196" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ====== _clean step ====== -->
  <text x="44" y="210" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">_clean(15)</text>
  <rect x="44" y="216" width="472" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="236" font-size="10.5" fill="#333" filter="url(#rough2)">① pop (7, aaa)：dict[aaa]=7 匹配 → del aaa（真过期）</text>
  <text x="60" y="252" font-size="10.5" fill="#333" filter="url(#rough2)">② pop (12, bbb)：dict[bbb]=15 ≠ 12 → 跳过（旧 renew 残留的<tspan fill="#d6a040" font-weight="bold">惰性条目</tspan>）</text>
  <text x="60" y="268" font-size="10.5" fill="#333" filter="url(#rough2)">③ pop (15, bbb)：dict[bbb]=15 匹配 → del bbb（真过期）→ 堆空，停止</text>

  <!-- arrow down to result -->
  <path d="M 280 276 L 280 296" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ====== Result ====== -->
  <rect x="100" y="300" width="360" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">清理后 HashMap 为空 → countUnexpiredTokens(15) = 0</text>

  <!-- dashed separator -->
  <path d="M 40 344 L 520 344" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- key insights -->
  <text x="56" y="362" font-size="11" fill="#555" filter="url(#rough2)">每次操作先 _clean：堆顶 expTime ≤ currentTime 则弹出，与 dict 比对确认是否真过期</text>
  <text x="56" y="376" font-size="10.5" fill="#888" filter="url(#rough2)">每条目入堆一次出堆一次 → 摊还 O(log n)；renew 追加新条目，旧的留作惰性标记</text>
</svg>
