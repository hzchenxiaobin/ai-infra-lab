<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">概念：diff[i] = 前缀不同元素数 − 后缀不同元素数（取 i=2 演示）</text>

  <text x="70" y="68" text-anchor="end" font-size="12" fill="#888" filter="url(#rough2)">nums</text>

  <rect x="80" y="46" width="80" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="70" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="160" y="46" width="80" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="70" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="240" y="46" width="80" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="70" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="320" y="46" width="80" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="70" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="400" y="46" width="80" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="440" y="70" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>

  <text x="120" y="100" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">i=0</text>
  <text x="200" y="100" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">i=1</text>
  <text x="280" y="100" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">i=2</text>
  <text x="360" y="100" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">i=3</text>
  <text x="440" y="100" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">i=4</text>

  <path d="M 320 40 L 320 116" stroke="#b85450" stroke-width="2" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <text x="320" y="132" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">分隔点：i 之后</text>

  <path d="M 80 152 L 80 144 L 320 144 L 320 152" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="200" y="166" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">前缀 nums[0..2] = [3,2,3]</text>

  <path d="M 320 152 L 320 144 L 480 144 L 480 152" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="400" y="166" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">后缀 nums[3..4] = [4,2]</text>

  <rect x="60" y="184" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="160" y="206" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">不同元素 {3,2} → <tspan font-weight="bold" fill="#446688">2</tspan></text>

  <rect x="300" y="184" width="200" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="400" y="206" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">不同元素 {4,2} → <tspan font-weight="bold" fill="#4a7a3a">2</tspan></text>

  <text x="280" y="252" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">diff[2] = 2 − 2 =</text>

  <rect x="232" y="262" width="96" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="289" text-anchor="middle" font-size="20" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>

  <rect x="70" y="320" width="420" height="44" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="82" y="340" font-size="11" fill="#555" filter="url(#rough2)">关键：只数「不同元素」个数，重复不重复计；</text>
  <text x="82" y="356" font-size="11" fill="#555" filter="url(#rough2)">i=n−1 时后缀为空 → distinct = 0。</text>
</svg>
