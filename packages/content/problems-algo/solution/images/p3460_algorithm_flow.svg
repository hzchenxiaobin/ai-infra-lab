<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="18" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">流程：两指针找失配 → 删 s[i] 错位续配 → 返回</text>

  <!-- ===== 左列：找首个失配位 ===== -->
  <rect x="68" y="26" width="164" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="40" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">i = 0</text>
  <text x="150" y="52" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">两串从头对齐</text>

  <path d="M 150 56 L 150 70" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="45,108 150,72 255,108 150,144" fill="#fff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="104" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i&lt;n 且 i&lt;m</text>
  <text x="150" y="118" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">且 s[i]==t[i]?</text>

  <path d="M 150 144 L 150 151" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="158" y="153" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="122" y="154" width="56" height="32" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="174" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">i++</text>

  <path d="M 122 170 L 20 170 L 20 108 L 43 108" fill="none" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 255 108 L 294 108" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="274" y="100" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- ===== 右列：无失配判定 ===== -->
  <polygon points="298,108 390,72 482,108 390,144" fill="#fff" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="390" y="104" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i == n 或 i == m ?</text>
  <text x="390" y="118" text-anchor="middle" font-size="9.5" fill="#a07020" filter="url(#rough2)">（无失配）</text>

  <path d="M 390 144 L 390 158" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="398" y="156" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是 · 无失配</text>

  <rect x="310" y="160" width="160" height="36" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="177" text-anchor="middle" font-size="12.5" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">返回 i</text>
  <text x="390" y="190" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">删除无益</text>

  <path d="M 482 108 L 504 108 L 504 232 L 474 232" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="493" y="124" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- ===== 右列：删 s[i] 错位续配 ===== -->
  <rect x="290" y="208" width="180" height="36" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="390" y="223" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">删 s[i]（错位续配）</text>
  <text x="390" y="238" text-anchor="middle" font-size="11.5" fill="#a07020" font-weight="bold" filter="url(#rough2)">j = i+1，k = i</text>

  <path d="M 390 244 L 390 265" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="300,292 390,267 480,292 390,317" fill="#fff" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="390" y="288" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">j&lt;n 且 k&lt;m</text>
  <text x="390" y="301" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">且 s[j]==t[k]?</text>

  <path d="M 480 292 C 507 292, 507 264, 396 269" fill="none" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="335" y="268" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是 · j++ k++</text>

  <path d="M 390 317 L 390 328" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="378" y="324" text-anchor="end" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="300" y="330" width="180" height="28" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="348" text-anchor="middle" font-size="11.5" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">返回 k = i + 续配位数</text>

  <!-- ===== 左下：要点注记 ===== -->
  <rect x="36" y="290" width="242" height="62" rx="8" fill="#fff" stroke="#999" stroke-width="1.2" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="157" y="310" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">删除 = 指针跳一格，不建新串</text>
  <text x="157" y="326" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">s 侧 i → j、t 侧 k 单向前进</text>
  <text x="157" y="342" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">两趟合计 ≤ n + m 次比较</text>
</svg>
