<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：倒序遍历 + 维度对偶计数 + 标记去重</text>

  <!-- Start -->
  <rect x="220" y="40" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="16" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">开始 (ans=0)</text>
  <path d="M 280,72 L 280,88" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init -->
  <rect x="200" y="92" width="160" height="44" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="110" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">rowSeen/colSeen=false</text>
  <text x="280" y="127" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">rowCnt=0, colCnt=0</text>
  <path d="M 280,136 L 280,150" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop header -->
  <rect x="180" y="154" width="200" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="174" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">for i = m−1 downto 0：</text>
  <path d="M 280,186 L 280,200" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- type decision diamond -->
  <polygon points="280,204 360,244 280,284 200,244" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="240" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">queries[i]</text>
  <text x="280" y="256" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">type == 0 ?</text>

  <!-- left branch: row (type 0) -->
  <text x="168" y="240" text-anchor="end" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">是(行)</text>
  <path d="M 200,244 L 150,244" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="150,212 110,244 150,276 190,244" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="240" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">rowSeen</text>
  <text x="150" y="254" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[idx]?</text>

  <!-- row seen yes -> skip -->
  <text x="150" y="296" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 150,276 L 150,304" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="100" y="308" width="100" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="150" y="325" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">跳过（已被覆盖）</text>

  <!-- row not seen -> compute -->
  <text x="96" y="238" text-anchor="end" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 110,244 L 70,244" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="20" y="300" width="120" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="80" y="316" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">ans += val ×</text>
  <text x="80" y="330" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">(n − colCnt)</text>
  <text x="80" y="343" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">rowSeen[idx]=1</text>
  <text x="80" y="354" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">rowCnt++</text>
  <path d="M 110,324 Q 140,324 150,334" stroke="#4a7a3a" stroke-width="1" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- right branch: col (type 1) -->
  <text x="392" y="240" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否(列)</text>
  <path d="M 360,244 L 410,244" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="410,212 450,244 410,276 370,244" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="410" y="240" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">colSeen</text>
  <text x="410" y="254" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">[idx]?</text>

  <!-- col seen yes -> skip -->
  <text x="410" y="296" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 410,276 L 410,304" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="360" y="308" width="100" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="410" y="325" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">跳过（已被覆盖）</text>

  <!-- col not seen -> compute -->
  <text x="464" y="238" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 450,244 L 490,244" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="420" y="300" width="120" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="480" y="316" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">ans += val ×</text>
  <text x="480" y="330" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">(n − rowCnt)</text>
  <text x="480" y="343" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">colSeen[idx]=1</text>
  <text x="480" y="354" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">colCnt++</text>

  <!-- loop back note -->
  <path d="M 490,324 Q 540,324 540,170 Q 540,170 380,170" stroke="#d6a040" stroke-width="1" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="548" y="250" font-size="9" fill="#888" filter="url(#rough2)" transform="rotate(90 548 250)">回到循环</text>

  <!-- End -->
  <path d="M 280,360 L 280,376" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="210" y="376" width="140" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="390" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">返回 ans</text>
</svg>
