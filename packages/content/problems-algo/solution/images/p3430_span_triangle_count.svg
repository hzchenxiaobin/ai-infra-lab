<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：单调栈定跨度，「矩形砍角」数合法子数组</text>
  <text x="260" y="38" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">最大值并列归「最右」、最小值并列归「最左」—— 沿用 3428 的代言人约定</text>
  <text x="70" y="56" font-size="10.5" fill="#666" filter="url(#rough2)">例：nums = [5, 3, 4, 2, 1, 6]，k = 3，看 i=2 的 4 当最大值 →</text>

  <g filter="url(#rough2)">
    <rect x="70" y="64" width="52" height="36" fill="#fafafa" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 3" rx="4"/>
    <rect x="122" y="64" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="174" y="64" width="52" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4"/>
    <rect x="226" y="64" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="278" y="64" width="52" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <rect x="330" y="64" width="52" height="36" fill="#fafafa" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 3" rx="4"/>
    <text x="96" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450">5</text>
    <text x="148" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#33506b">3</text>
    <text x="200" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a6d1f">4</text>
    <text x="252" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#33506b">2</text>
    <text x="304" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#33506b">1</text>
    <text x="356" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450">6</text>
    <text x="96" y="116" text-anchor="middle" font-size="9.5" fill="#888">i=0</text>
    <text x="148" y="116" text-anchor="middle" font-size="9.5" fill="#888">i=1</text>
    <text x="200" y="116" text-anchor="middle" font-size="9.5" fill="#8a6d1f" font-weight="bold">i=2</text>
    <text x="252" y="116" text-anchor="middle" font-size="9.5" fill="#888">i=3</text>
    <text x="304" y="116" text-anchor="middle" font-size="9.5" fill="#888">i=4</text>
    <text x="356" y="116" text-anchor="middle" font-size="9.5" fill="#888">i=5</text>
    <path d="M 124 121 q 0 8 7 8 h 88 q 7 0 7 -8" fill="none" stroke="#4a7a3a" stroke-width="2"/>
    <path d="M 176 135 q 0 8 7 8 h 140 q 7 0 7 -8" fill="none" stroke="#446688" stroke-width="2"/>
    <text x="174" y="141" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">a = 2</text>
    <text x="252" y="157" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">b = 3</text>
  </g>
  <text x="70" y="171" font-size="9" fill="#666" filter="url(#rough2)">a 段元素 &lt; 4、b 段元素 ≤ 4；两侧红虚框 5、6 是挡住 4 的「哨兵」</text>
  <text x="70" y="185" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">换元 (x, y) = (i−l, r−i)：长度 x+y+1 ≤ k ⟺ x+y ≤ k−1</text>

  <g filter="url(#rough2)">
    <rect x="66" y="192" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/>
    <rect x="106" y="192" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/>
    <rect x="66" y="232" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/>
    <rect x="106" y="232" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/>
    <rect x="66" y="272" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/>
    <rect x="146" y="192" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3" rx="3"/>
    <rect x="106" y="272" width="40" height="40" fill="#f0f0f0" stroke="#999" stroke-width="1.5" rx="3"/>
    <rect x="146" y="232" width="40" height="40" fill="#f7f7f7" stroke="#ccc" stroke-width="1.2" rx="3"/>
    <rect x="146" y="272" width="40" height="40" fill="#f7f7f7" stroke="#ccc" stroke-width="1.2" rx="3"/>
    <text x="86" y="209" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#2f5d24">[4]</text>
    <text x="126" y="209" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#2f5d24">[3,4]</text>
    <text x="86" y="249" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#2f5d24">[4,2]</text>
    <text x="126" y="249" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#2f5d24">[3,4,2]</text>
    <text x="86" y="289" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#2f5d24">[4,2,1]</text>
    <text x="166" y="209" text-anchor="middle" font-size="9" font-weight="bold" fill="#b85450">x≥a</text>
    <text x="126" y="289" text-anchor="middle" font-size="8.5" fill="#777">超长</text>
    <text x="166" y="249" text-anchor="middle" font-size="10" fill="#c0c0c0">✗</text>
    <text x="166" y="289" text-anchor="middle" font-size="10" fill="#c0c0c0">✗</text>
    <rect x="66" y="192" width="80" height="120" fill="none" stroke="#446688" stroke-width="2.4" rx="2"/>
    <path d="M 186 192 L 66 312" fill="none" stroke="#d6a040" stroke-width="2"/>
    <text x="58" y="215" text-anchor="end" font-size="9" fill="#888">y=0</text>
    <text x="58" y="255" text-anchor="end" font-size="9" fill="#888">y=1</text>
    <text x="58" y="295" text-anchor="end" font-size="9" fill="#888">y=2</text>
    <text x="86" y="326" text-anchor="middle" font-size="9" fill="#888">x=0</text>
    <text x="126" y="326" text-anchor="middle" font-size="9" fill="#888">x=1</text>
    <text x="166" y="326" text-anchor="middle" font-size="9" fill="#888">x=2</text>
    <text x="126" y="342" text-anchor="middle" font-size="9" fill="#666">x = i−l（左端点离 i 的距离）</text>
    <text x="34" y="252" text-anchor="middle" font-size="9" fill="#666" transform="rotate(-90 34 252)">y = r−i（右端点离 i 的距离）</text>
    <text x="193" y="186" font-size="8.5" fill="#d6a040" font-weight="bold">x+y=k−1</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="210" y="192" width="295" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="357" y="204" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold">✓ 合法：x+y ≤ k−1 且 x ≤ a−1（绿）—— 本例 5 个</text>
    <text x="357" y="218" text-anchor="middle" font-size="9" fill="#4a6a3f">每个绿格 ↔ 一个「4 是最大值」的子数组</text>

    <rect x="210" y="232" width="295" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
    <text x="357" y="244" text-anchor="middle" font-size="9.5" fill="#8f3a35" font-weight="bold">✗ x ≥ a：越出左界，max 被 5 抢走（红格）</text>
    <text x="357" y="258" text-anchor="middle" font-size="9" fill="#8f3a35">Δ 第一项把它数了进去 → 第二项减掉</text>

    <rect x="210" y="272" width="295" height="32" fill="#f0f0f0" stroke="#999" stroke-width="1.6" rx="8"/>
    <text x="357" y="284" text-anchor="middle" font-size="9.5" fill="#777" font-weight="bold">✗ x+y ≥ k：子数组超长（对角线右下侧灰格）</text>
    <text x="357" y="298" text-anchor="middle" font-size="9" fill="#888">例如 [3,4,2,1] 长度 4 &gt; k=3</text>

    <rect x="210" y="312" width="295" height="46" fill="#ffffff" stroke="#446688" stroke-width="1.5" stroke-dasharray="6 4" rx="10"/>
    <text x="357" y="327" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b85450">cnt = Δ(min(b−1,k−1), k) − Δ(min(b−1,k−a−1), k−a)</text>
    <text x="357" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#33506b">本例 = Δ(2,3) − Δ(0,1) = 6 − 1 = 5 ✓</text>
    <text x="357" y="354" text-anchor="middle" font-size="8.5" fill="#55677d">Δ(m,s) = (m+1)(2s−m)/2，m&lt;0 时取 0</text>
  </g>
</svg>
