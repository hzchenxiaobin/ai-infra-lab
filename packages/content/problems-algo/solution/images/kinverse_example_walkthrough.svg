<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：n=3 逐行递推 dp 表</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">dp[i][j] = 排列 [1..i] 中恰有 j 个逆序对的排列数</text>

  <!-- ===== Table header ===== -->
  <!-- columns: i [30,90] | j=0 [90,170] | j=1 [170,250] | j=2 [250,330] | j=3 [330,410] | 说明 [410,580] -->
  <rect x="30" y="58" width="550" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="90" y1="58" x2="90" y2="88" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="170" y1="58" x2="170" y2="88" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="250" y1="58" x2="250" y2="88" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="330" y1="58" x2="330" y2="88" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="410" y1="58" x2="410" y2="88" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="78" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">i</text>
  <text x="130" y="78" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">j=0</text>
  <text x="210" y="78" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">j=1</text>
  <text x="290" y="78" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">j=2</text>
  <text x="370" y="78" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">j=3</text>
  <text x="495" y="78" text-anchor="middle" font-size="11" fill="#3a4a66" font-weight="bold">说明</text>

  <!-- ===== Row i=1 ===== -->
  <rect x="30" y="88" width="550" height="32" fill="#ffffff" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="109" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="90" y="88" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="130" y="109" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="210" y="109" text-anchor="middle" font-size="11" fill="#ccc">0</text>
  <text x="290" y="109" text-anchor="middle" font-size="11" fill="#ccc">0</text>
  <text x="370" y="109" text-anchor="middle" font-size="11" fill="#ccc">0</text>
  <text x="495" y="109" text-anchor="middle" font-size="10" fill="#555">[1]：0 逆序对</text>

  <!-- ===== Row i=2 ===== -->
  <rect x="30" y="120" width="550" height="32" fill="#f7f9fc" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="141" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="90" y="120" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="130" y="141" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="170" y="120" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="210" y="141" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="290" y="141" text-anchor="middle" font-size="11" fill="#ccc">0</text>
  <text x="370" y="141" text-anchor="middle" font-size="11" fill="#ccc">0</text>
  <text x="495" y="141" text-anchor="middle" font-size="10" fill="#555">[1,2] 和 [2,1]</text>

  <!-- ===== Row i=3 (highlight answer row) ===== -->
  <rect x="30" y="152" width="550" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="60" y="173" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="90" y="152" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="130" y="173" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="170" y="152" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="210" y="173" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>
  <rect x="250" y="152" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="290" y="173" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="330" y="152" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="370" y="173" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="495" y="173" text-anchor="middle" font-size="10" fill="#555">6 个排列全覆盖</text>

  <!-- column separators for data rows -->
  <g stroke="#dddddd" stroke-width="1">
    <line x1="90" y1="88" x2="90" y2="184" filter="url(#rough2)"/>
    <line x1="170" y1="88" x2="170" y2="184" filter="url(#rough2)"/>
    <line x1="250" y1="88" x2="250" y2="184" filter="url(#rough2)"/>
    <line x1="330" y1="88" x2="330" y2="184" filter="url(#rough2)"/>
    <line x1="410" y1="88" x2="410" y2="184" filter="url(#rough2)"/>
  </g>

  <!-- ===== Arrow pointing to answer ===== -->
  <path d="M 210 188 L 210 204" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="210" y="216" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">n=3, k=1 → 答案 = 2</text>

  <!-- ===== Permutation listing ===== -->
  <rect x="30" y="224" width="550" height="130" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="246" font-size="11" fill="#4a7a3a" font-weight="bold">验证：n=3 的全部 6 个排列及其逆序对数</text>

  <g font-size="11">
    <!-- permutations: [1,2,3]→0, [1,3,2]→1, [2,1,3]→1, [2,3,1]→2, [3,1,2]→2, [3,2,1]→3 -->
    <text x="50" y="268" fill="#555">[1,2,3] → 0 逆序对（dp[3][0]=1 ✓）</text>
    <text x="50" y="288" fill="#b85450">[1,3,2] → 1 逆序对（3&gt;2）  ┐</text>
    <text x="50" y="306" fill="#b85450">[2,1,3] → 1 逆序对（2&gt;1）  ┘ dp[3][1]=2 ✓</text>
    <text x="50" y="326" fill="#555">[2,3,1] → 2 逆序对  ┐ dp[3][2]=2 ✓</text>
    <text x="290" y="326" fill="#555">[3,1,2] → 2 逆序对  ┘</text>
    <text x="50" y="346" fill="#555">[3,2,1] → 3 逆序对（dp[3][3]=1 ✓）</text>
  </g>

  <text x="50" y="370" font-size="10" fill="#4a7a3a" font-weight="bold">Σ dp[3][j] = 1+2+2+1 = 6 = 3! ✓（所有排列恰好被覆盖一次）</text>
</svg>
