<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：n = 7, blacklist = [2, 3, 5]</text>

  <text x="40" y="54" font-size="11.5" fill="#888" font-weight="bold">init 阶段：sz = 4, B = {2, 3, 5}, w 从 4 起扫描</text>

  <rect x="40" y="68" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="100" y="86" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">b = 2  (&lt; sz)</text>

  <rect x="180" y="68" width="160" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="260" y="86" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">w=4 ∉ B → map[2]=4, w=5</text>

  <rect x="360" y="68" width="200" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="460" y="86" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">map = {2:4}</text>

  <path d="M 100 96 L 100 108" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 260 96 L 260 108" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="112" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="100" y="130" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">b = 3  (&lt; sz)</text>

  <rect x="180" y="112" width="160" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="260" y="130" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">w=5 ∈ B → w=6 ∉ B</text>

  <rect x="360" y="112" width="200" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="460" y="130" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">map[3]=6, w=7</text>

  <path d="M 100 140 L 100 152" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="156" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="100" y="174" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">b = 5  (≥ sz)</text>

  <rect x="180" y="156" width="160" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="260" y="174" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">跳过（不影响投点）</text>

  <rect x="360" y="156" width="200" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="460" y="174" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">map = {2:4, 3:6}</text>

  <text x="40" y="208" font-size="11.5" fill="#888" font-weight="bold">pick 阶段：r = rand() % 4 ∈ {0, 1, 2, 3}</text>

  <rect x="40" y="222" width="520" height="130" fill="#fafafa" stroke="#888" stroke-width="1.2" rx="6" filter="url(#rough2)"/>

  <text x="56" y="244" font-size="11" fill="#888" font-weight="bold">r</text>
  <text x="120" y="244" font-size="11" fill="#888" font-weight="bold">map.get(r, r)</text>
  <text x="240" y="244" font-size="11" fill="#888" font-weight="bold">命中类型</text>
  <text x="380" y="244" font-size="11" fill="#888" font-weight="bold">返回值</text>
  <text x="480" y="244" font-size="11" fill="#888" font-weight="bold">概率</text>

  <path d="M 50 252 L 556 252" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <text x="56" y="272" font-size="12" fill="#446688" font-weight="bold">0</text>
  <text x="120" y="272" font-size="11" fill="#555">map.get(0, 0) = 0</text>
  <text x="240" y="272" font-size="11" fill="#446688">白名单（不在 map）</text>
  <text x="380" y="272" font-size="12" fill="#446688" font-weight="bold">0</text>
  <text x="480" y="272" font-size="11" fill="#555">1/4</text>

  <text x="56" y="294" font-size="12" fill="#446688" font-weight="bold">1</text>
  <text x="120" y="294" font-size="11" fill="#555">map.get(1, 1) = 1</text>
  <text x="240" y="294" font-size="11" fill="#446688">白名单（不在 map）</text>
  <text x="380" y="294" font-size="12" fill="#446688" font-weight="bold">1</text>
  <text x="480" y="294" font-size="11" fill="#555">1/4</text>

  <text x="56" y="316" font-size="12" fill="#b85450" font-weight="bold">2</text>
  <text x="120" y="316" font-size="11" fill="#b85450" font-weight="bold">map.get(2, 2) = 4</text>
  <text x="240" y="316" font-size="11" fill="#b85450">黑名单 → 重映射</text>
  <text x="380" y="316" font-size="12" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="480" y="316" font-size="11" fill="#555">1/4</text>

  <text x="56" y="338" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <text x="120" y="338" font-size="11" fill="#b85450" font-weight="bold">map.get(3, 3) = 6</text>
  <text x="240" y="338" font-size="11" fill="#b85450">黑名单 → 重映射</text>
  <text x="380" y="338" font-size="12" fill="#4a7a3a" font-weight="bold">6</text>
  <text x="480" y="338" font-size="11" fill="#555">1/4</text>

  <text x="40" y="368" font-size="10.5" fill="#b85450" font-weight="bold">→ 返回值集合 = {0, 1, 4, 6}，每个概率 1/4，与题目要求一致 ✓</text>
</svg>
