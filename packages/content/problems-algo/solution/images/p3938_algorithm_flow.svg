<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <text x="320" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：行 / 列各跑一遍「长度 ≥ 2 的 Kadane」，再补内部单格</text>

  <!-- step 1 -->
  <rect x="240" y="36" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="320" y="58" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① ans ← −∞</text>

  <path d="M 320 70 L 320 82" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="118" y="86" width="404" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="320" y="106" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">② 每一行 a[0..n−1] 跑变形 Kadane</text>
  <text x="320" y="124" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">f1 ← max(f1, 0) + a[j]：以 j 结尾、长度 ≥ 1 的最大子段和</text>
  <text x="320" y="142" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">先取 f2 = f1(更新前) + a[j]：长度 ≥ 2 → ans = max(ans, f2)</text>

  <path d="M 320 154 L 320 166" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 3 -->
  <rect x="118" y="170" width="404" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="320" y="194" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ 每一列同样跑一遍（行列互换，逻辑完全复用）</text>

  <path d="M 320 208 L 320 220" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 4 decision -->
  <polygon points="320,224 462,272 320,320 178,272" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="320" y="266" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">④ m ≥ 3 且</text>
  <text x="320" y="284" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">n ≥ 3 都成立？</text>

  <!-- yes branch -->
  <path d="M 462 272 L 478 272" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="470" y="262" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="482" y="234" width="152" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="558" y="254" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">扫全部内部单格</text>
  <text x="558" y="272" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">1 ≤ i ≤ m−2</text>
  <text x="558" y="288" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">1 ≤ j ≤ n−2</text>
  <text x="558" y="306" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">ans = max(ans,</text>
  <text x="558" y="322" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">grid[i][j])</text>

  <!-- no branch -->
  <path d="M 320 320 L 320 362" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="334" y="344" font-size="10.5" fill="#b85450" filter="url(#rough2)">否：跳过</text>

  <!-- yes-branch join to step 5 -->
  <path d="M 558 334 L 558 386 L 448 386" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- step 5 -->
  <rect x="200" y="366" width="240" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="320" y="391" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">⑤ 返回 ans（最大共享和）</text>

  <text x="320" y="434" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">行线段、列线段、内部单格各扫一遍 ⇒ 总时间 O(mn)（mn ≤ 5×10⁵），额外空间 O(1)</text>
</svg>
