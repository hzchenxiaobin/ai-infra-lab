<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [12, 6, 1, 2, 7]</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">初始：pre_max = 12，max_diff = −∞，ans = 0</text>

  <!-- table geometry: 6 columns -->
  <!-- col x / width: k(30..70) x(70..110) ①(110..280) ②(280..440) ③(440..550) ans(550..600) -->
  <!-- header row -->
  <rect x="30" y="58" width="40" height="30" fill="#f0ede6" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="50" y="78" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">k</text>
  <rect x="70" y="58" width="40" height="30" fill="#f0ede6" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="90" y="78" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">x</text>
  <rect x="110" y="58" width="170" height="30" fill="#f0ede6" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="195" y="78" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">① 结算 max_diff × x</text>
  <rect x="280" y="58" width="160" height="30" fill="#f0ede6" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="360" y="78" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">② 新 max_diff</text>
  <rect x="440" y="58" width="110" height="30" fill="#f0ede6" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="495" y="78" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">③ 新 pre_max</text>
  <rect x="550" y="58" width="50" height="30" fill="#f0ede6" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="575" y="78" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">ans</text>

  <!-- row 0: init -->
  <rect x="30" y="88" width="40" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="108" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <rect x="70" y="88" width="40" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="90" y="108" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">12</text>
  <rect x="110" y="88" width="170" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="195" y="108" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">（初始化）</text>
  <rect x="280" y="88" width="160" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="360" y="108" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">−∞</text>
  <rect x="440" y="88" width="110" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="495" y="108" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">12</text>
  <rect x="550" y="88" width="50" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="575" y="108" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>

  <!-- row 1: k=1 x=6 -->
  <rect x="30" y="118" width="40" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="138" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="70" y="118" width="40" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="90" y="138" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <rect x="110" y="118" width="170" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="195" y="138" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">−∞ × 6 → 忽略</text>
  <rect x="280" y="118" width="160" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="360" y="138" text-anchor="middle" font-size="11" fill="#8a6420" filter="url(#rough2)">12 − 6 = 6</text>
  <rect x="440" y="118" width="110" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="495" y="138" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">12</text>
  <rect x="550" y="118" width="50" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="575" y="138" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>

  <!-- row 2: k=2 x=1 -->
  <rect x="30" y="148" width="40" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="168" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="70" y="148" width="40" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="90" y="168" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="110" y="148" width="170" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="195" y="168" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">6 × 1 = 6</text>
  <rect x="280" y="148" width="160" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="360" y="168" text-anchor="middle" font-size="11" fill="#8a6420" font-weight="bold" filter="url(#rough2)">12 − 1 = 11 ★</text>
  <rect x="440" y="148" width="110" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="495" y="168" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">12</text>
  <rect x="550" y="148" width="50" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="575" y="168" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>

  <!-- row 3: k=3 x=2 -->
  <rect x="30" y="178" width="40" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="70" y="178" width="40" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="90" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="110" y="178" width="170" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="195" y="198" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">11 × 2 = 22</text>
  <rect x="280" y="178" width="160" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="360" y="198" text-anchor="middle" font-size="11" fill="#8a6420" filter="url(#rough2)">12 − 2 = 10 → 11</text>
  <rect x="440" y="178" width="110" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="495" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">12</text>
  <rect x="550" y="178" width="50" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="575" y="198" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">22</text>

  <!-- row 4: k=4 x=7 (final) -->
  <rect x="30" y="208" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="50" y="228" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="70" y="208" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="90" y="228" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="110" y="208" width="170" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="195" y="228" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">11 × 7 = 77 ★★</text>
  <rect x="280" y="208" width="160" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="360" y="228" text-anchor="middle" font-size="11" fill="#8a6420" filter="url(#rough2)">12 − 7 = 5 → 11</text>
  <rect x="440" y="208" width="110" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="495" y="228" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">12</text>
  <rect x="550" y="208" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="575" y="228" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">77</text>

  <!-- takeaway box -->
  <rect x="40" y="262" width="540" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="286" text-anchor="middle" font-size="12" fill="#8a6420" font-weight="bold" filter="url(#rough2)">max_diff 在 k=2 定格为 11（i=0, j=2），k=4 时乘上 7 得 77</text>
  <text x="310" y="306" text-anchor="middle" font-size="11" fill="#8a6420" filter="url(#rough2)">「先攒出差值，再等最大的乘数」——两段最优不必相邻</text>

  <text x="310" y="352" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">对照前后缀分解版：枚举 j=1,2,3 得 42 / 77 / 70，最大同为 77 ✓</text>
  <text x="310" y="376" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">⚠️ 中途 11 × 2 = 22 只是临时答案，会被更靠右的更大乘数刷新</text>
</svg>
