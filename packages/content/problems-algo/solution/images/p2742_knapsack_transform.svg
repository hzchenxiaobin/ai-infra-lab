<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">问题转化：两油漆匠 → 0-1 背包</text>

  <!-- original problem box -->
  <rect x="50" y="48" width="420" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="72" text-anchor="middle" font-size="13" fill="#224" filter="url(#rough2)">原问题：选付费墙集合 S</text>
  <text x="260" y="92" text-anchor="middle" font-size="13" fill="#224" filter="url(#rough2)">使 Σ(time[i] + 1) ≥ n</text>
  <text x="260" y="110" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">最小化 Σ cost[i]</text>

  <!-- arrow down -->
  <path d="M260,124 L260,158" stroke="#446688" stroke-width="2" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="270" y="146" font-size="11" fill="#888" filter="url(#rough2)">每堵付费墙覆盖 time[i]+1 堵</text>

  <!-- knapsack model box -->
  <rect x="50" y="168" width="420" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="190" text-anchor="middle" font-size="13" fill="#243" filter="url(#rough2)">0-1 背包（求最小价值）</text>
  <text x="260" y="210" text-anchor="middle" font-size="12" fill="#243" filter="url(#rough2)">物品 i：重量 = time[i] + 1，价值 = cost[i]</text>
  <text x="260" y="228" text-anchor="middle" font-size="12" fill="#243" filter="url(#rough2)">总重量 ≥ n（容量封顶 n）</text>
  <text x="260" y="246" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">目标：最小总价值</text>

  <!-- arrow down -->
  <path d="M260,260 L260,294" stroke="#446688" stroke-width="2" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- DP box -->
  <rect x="50" y="304" width="420" height="82" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="326" text-anchor="middle" font-size="12" fill="#5a3a10" filter="url(#rough2)">dp[j] = 覆盖 j 堵墙的最小花费（j∈[0,n]）</text>
  <text x="260" y="346" text-anchor="middle" font-size="12" fill="#5a3a10" filter="url(#rough2)">dp[j] = min(dp[j], dp[max(0, j-(time[i]+1))] + cost[i])</text>
  <text x="260" y="368" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 = dp[n]</text>
</svg>
