<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="320" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：g = [1,2,3]，s = [1,1] → 1 个孩子满意</text>

  <!-- children row label -->
  <text x="48" y="96" font-size="12" fill="#446688" font-weight="bold">孩子 g</text>
  <!-- g[0]=1 -->
  <rect x="130" y="74" width="60" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="160" y="96" text-anchor="middle" font-size="14" fill="#2a4a66" font-weight="bold">1</text>
  <text x="160" y="66" text-anchor="middle" font-size="9" fill="#888">g[0]</text>
  <!-- g[1]=2 -->
  <rect x="220" y="74" width="60" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250" y="96" text-anchor="middle" font-size="14" fill="#2a4a66" font-weight="bold">2</text>
  <text x="250" y="66" text-anchor="middle" font-size="9" fill="#888">g[1]</text>
  <!-- g[2]=3 -->
  <rect x="310" y="74" width="60" height="34" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="340" y="96" text-anchor="middle" font-size="14" fill="#2a4a66" font-weight="bold">3</text>
  <text x="340" y="66" text-anchor="middle" font-size="9" fill="#888">g[2]</text>

  <!-- cookies row label -->
  <text x="48" y="186" font-size="12" fill="#d6a040" font-weight="bold">饼干 s</text>
  <!-- s[0]=1 -->
  <rect x="130" y="164" width="60" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="160" y="186" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold">1</text>
  <text x="160" y="216" text-anchor="middle" font-size="9" fill="#888">s[0]</text>
  <!-- s[1]=1 -->
  <rect x="220" y="164" width="60" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250" y="186" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold">1</text>
  <text x="250" y="216" text-anchor="middle" font-size="9" fill="#888">s[1]</text>

  <!-- match: g[0] with s[0] -->
  <line x1="160" y1="108" x2="160" y2="162" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="174" y="138" font-size="11" fill="#4a7a3a" font-weight="bold">1≥1 喂✓</text>

  <!-- fail: g[1] vs s[1] -->
  <line x1="250" y1="108" x2="250" y2="162" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="264" y="138" font-size="11" fill="#b85450" font-weight="bold">1&lt;2 ✗</text>

  <!-- g[2] no cookie -->
  <text x="340" y="138" text-anchor="middle" font-size="11" fill="#888">无饼干</text>

  <!-- step list box -->
  <rect x="40" y="238" width="480" height="68" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="258" font-size="11" fill="#555">① i=0, j=0：s[0]=1 ≥ g[0]=1 → 喂孩子0，ans=1，i=1, j=1</text>
  <text x="60" y="275" font-size="11" fill="#555">② i=1, j=1：s[1]=1 &lt; g[1]=2 → 饼干太小，丢弃，j=2</text>
  <text x="60" y="292" font-size="11" fill="#555">③ j=2 = m → 饼干用尽，结束。最终 ans = 1</text>
</svg>
