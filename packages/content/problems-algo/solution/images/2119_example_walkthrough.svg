<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：三个用例的两次反转全过程</text>

  <!-- ===== Example 1: 526 → true ===== -->
  <text x="40" y="56" font-size="11.5" fill="#4a7a3a" font-weight="bold">示例 1：num = 526</text>

  <text x="40" y="78" font-size="10.5" fill="#888">num</text>
  <rect x="80" y="62" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="97" y="80" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="114" y="62" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="131" y="80" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="148" y="62" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="165" y="80" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>

  <path d="M 165 92 L 165 104" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="178" y="102" font-size="9.5" fill="#888">reverse</text>

  <text x="40" y="124" font-size="10.5" fill="#888">reversed1</text>
  <rect x="80" y="108" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="97" y="126" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <rect x="114" y="108" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="131" y="126" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="148" y="108" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="165" y="126" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>

  <path d="M 165 138 L 165 150" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="178" y="148" font-size="9.5" fill="#888">reverse</text>

  <text x="40" y="170" font-size="10.5" fill="#888">reversed2</text>
  <rect x="80" y="154" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="97" y="172" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="114" y="154" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="131" y="172" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="148" y="154" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="165" y="172" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>

  <text x="210" y="172" font-size="11.5" fill="#4a7a3a" font-weight="bold">526 == 526 → true ✓</text>
  <text x="210" y="188" font-size="10" fill="#888">末位 6 ≠ 0，三位全部保留</text>

  <!-- divider -->
  <line x1="280" y1="50" x2="280" y2="200" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Example 2: 1800 → false ===== -->
  <text x="300" y="56" font-size="11.5" fill="#b85450" font-weight="bold">示例 2：num = 1800</text>

  <text x="300" y="78" font-size="10.5" fill="#888">num</text>
  <rect x="340" y="62" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="357" y="80" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="374" y="62" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="391" y="80" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">8</text>
  <rect x="408" y="62" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="425" y="80" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <rect x="442" y="62" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="459" y="80" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>

  <path d="M 459 92 L 459 104" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="472" y="102" font-size="9.5" fill="#888">reverse</text>

  <text x="300" y="124" font-size="10.5" fill="#888">reversed1</text>
  <rect x="340" y="108" width="34" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1.2" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <text x="357" y="126" text-anchor="middle" font-size="12" fill="#ccc" font-weight="bold">0</text>
  <rect x="374" y="108" width="34" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1.2" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <text x="391" y="126" text-anchor="middle" font-size="12" fill="#ccc" font-weight="bold">0</text>
  <rect x="408" y="108" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="425" y="126" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">8</text>
  <rect x="442" y="108" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="459" y="126" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="340" y="144" font-size="9.5" fill="#b85450" font-weight="bold">↑ 前导零丢弃 → 81</text>

  <path d="M 425 146 L 425 158" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="438" y="156" font-size="9.5" fill="#888">reverse</text>

  <text x="300" y="178" font-size="10.5" fill="#888">reversed2</text>
  <rect x="408" y="162" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="425" y="180" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="442" y="162" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="459" y="180" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">8</text>

  <text x="300" y="180" font-size="11.5" fill="#b85450" font-weight="bold">18 ≠ 1800 → false ✗</text>

  <!-- ===== Example 3: 0 → true ===== -->
  <text x="40" y="226" font-size="11.5" fill="#4a7a3a" font-weight="bold">示例 3：num = 0（特例）</text>

  <text x="40" y="250" font-size="10.5" fill="#888">num</text>
  <rect x="80" y="234" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="97" y="252" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>

  <path d="M 97 264 L 97 278" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="110" y="276" font-size="9.5" fill="#888">reverse</text>

  <text x="40" y="298" font-size="10.5" fill="#888">reversed1</text>
  <rect x="80" y="282" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="97" y="300" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>

  <path d="M 97 312 L 97 326" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="110" y="324" font-size="9.5" fill="#888">reverse</text>

  <text x="40" y="346" font-size="10.5" fill="#888">reversed2</text>
  <rect x="80" y="330" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="97" y="348" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>

  <text x="140" y="348" font-size="11.5" fill="#4a7a3a" font-weight="bold">0 == 0 → true ✓</text>

  <!-- Summary box -->
  <rect x="240" y="226" width="290" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="385" y="250" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">规律总结</text>
  <text x="255" y="272" font-size="10.5" fill="#555">• 末位 ≠ 0：所有数字参与两次反转</text>
  <text x="270" y="288" font-size="10" fill="#888">位数守恒，必然还原</text>
  <text x="255" y="308" font-size="10.5" fill="#555">• 末位 = 0（非零数）：尾随零在首次</text>
  <text x="270" y="324" font-size="10" fill="#888">反转变成前导零被丢弃，位数缩减</text>
  <text x="255" y="340" font-size="10" fill="#b85450" font-weight="bold">→ 永远无法还原</text>
</svg>
