<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">分组中位数：PARTITION BY company ORDER BY salary → 取中间行号</text>

  <!-- Company A sorted table (left) -->
  <text x="120" y="56" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">公司 A（n=6，偶数 → 2 行中位数）</text>
  <rect x="30" y="62" width="180" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50" y="77" font-size="9" fill="#333">rn</text>
  <text x="95" y="77" font-size="9" fill="#333">id</text>
  <text x="140" y="77" font-size="9" fill="#333">salary</text>
  <text x="185" y="77" font-size="9" fill="#333">cnt</text>
  <line x1="70" y1="62" x2="70" y2="86" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="120" y1="62" x2="120" y2="86" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="170" y1="62" x2="170" y2="86" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="86" width="180" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="100" font-size="9.5" fill="#333">1</text>
  <text x="95" y="100" font-size="9.5" fill="#333">3</text>
  <text x="140" y="100" font-size="9.5" fill="#333">15</text>
  <text x="185" y="100" font-size="9.5" fill="#888">6</text>

  <rect x="30" y="106" width="180" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="120" font-size="9.5" fill="#333">2</text>
  <text x="95" y="120" font-size="9.5" fill="#333">2</text>
  <text x="140" y="120" font-size="9.5" fill="#333">341</text>
  <text x="185" y="120" font-size="9.5" fill="#888">6</text>

  <rect x="30" y="126" width="180" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="50" y="141" font-size="10" fill="#b85450" font-weight="bold">3</text>
  <text x="95" y="141" font-size="10" fill="#333">5</text>
  <text x="140" y="141" font-size="10" fill="#b85450" font-weight="bold">451</text>
  <text x="185" y="141" font-size="9.5" fill="#888">6</text>

  <rect x="30" y="148" width="180" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="50" y="163" font-size="10" fill="#b85450" font-weight="bold">4</text>
  <text x="95" y="163" font-size="10" fill="#333">6</text>
  <text x="140" y="163" font-size="10" fill="#b85450" font-weight="bold">513</text>
  <text x="185" y="163" font-size="9.5" fill="#888">6</text>

  <rect x="30" y="170" width="180" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="184" font-size="9.5" fill="#333">5</text>
  <text x="95" y="184" font-size="9.5" fill="#333">1</text>
  <text x="140" y="184" font-size="9.5" fill="#333">2341</text>
  <text x="185" y="184" font-size="9.5" fill="#888">6</text>

  <rect x="30" y="190" width="180" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="204" font-size="9.5" fill="#333">6</text>
  <text x="95" y="204" font-size="9.5" fill="#333">4</text>
  <text x="140" y="204" font-size="9.5" fill="#333">15314</text>
  <text x="185" y="204" font-size="9.5" fill="#888">6</text>

  <line x1="70" y1="86" x2="70" y2="210" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="120" y1="86" x2="120" y2="210" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="170" y1="86" x2="170" y2="210" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <text x="120" y="226" text-anchor="middle" font-size="9" fill="#b85450">rn 在 ⌊(6+1)/2⌋=3 ~ ⌊(6+2)/2⌋=4 之间</text>

  <!-- Company B sorted table (right) -->
  <text x="430" y="56" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">公司 B（n=4，偶数 → 2 行中位数）</text>
  <rect x="340" y="62" width="180" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="77" font-size="9" fill="#333">rn</text>
  <text x="405" y="77" font-size="9" fill="#333">id</text>
  <text x="450" y="77" font-size="9" fill="#333">salary</text>
  <text x="495" y="77" font-size="9" fill="#333">cnt</text>
  <line x1="380" y1="62" x2="380" y2="86" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="430" y1="62" x2="430" y2="86" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="480" y1="62" x2="480" y2="86" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="340" y="86" width="180" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="360" y="100" font-size="9.5" fill="#333">1</text>
  <text x="405" y="100" font-size="9.5" fill="#333">8</text>
  <text x="450" y="100" font-size="9.5" fill="#333">13</text>
  <text x="495" y="100" font-size="9.5" fill="#888">4</text>

  <rect x="340" y="106" width="180" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="360" y="121" font-size="10" fill="#b85450" font-weight="bold">2</text>
  <text x="405" y="121" font-size="10" fill="#333">7</text>
  <text x="450" y="121" font-size="10" fill="#b85450" font-weight="bold">15</text>
  <text x="495" y="121" font-size="9.5" fill="#888">4</text>

  <rect x="340" y="128" width="180" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="360" y="143" font-size="10" fill="#b85450" font-weight="bold">3</text>
  <text x="405" y="143" font-size="10" fill="#333">9</text>
  <text x="450" y="143" font-size="10" fill="#b85450" font-weight="bold">1154</text>
  <text x="495" y="143" font-size="9.5" fill="#888">4</text>

  <rect x="340" y="150" width="180" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="360" y="164" font-size="9.5" fill="#333">4</text>
  <text x="405" y="164" font-size="9.5" fill="#333">10</text>
  <text x="450" y="164" font-size="9.5" fill="#333">1345</text>
  <text x="495" y="164" font-size="9.5" fill="#888">4</text>

  <line x1="380" y1="86" x2="380" y2="170" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="430" y1="86" x2="430" y2="170" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="480" y1="86" x2="480" y2="170" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <text x="430" y="186" text-anchor="middle" font-size="9" fill="#b85450">rn 在 ⌊(4+1)/2⌋=2 ~ ⌊(4+2)/2⌋=3 之间</text>

  <!-- Arrows to output -->
  <path d="M120 236 L180 270" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M430 196 L440 270" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Output table (bottom) -->
  <text x="310" y="278" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">输出（中位数行）</text>
  <rect x="180" y="284" width="260" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="299" font-size="9.5" fill="#333">id</text>
  <text x="290" y="299" font-size="9.5" fill="#333">company</text>
  <text x="380" y="299" font-size="9.5" fill="#333">salary</text>
  <line x1="250" y1="284" x2="250" y2="308" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="340" y1="284" x2="340" y2="308" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="180" y="308" width="260" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="225" y="322" font-size="9.5" fill="#333">5</text>
  <text x="300" y="322" font-size="9.5" fill="#333">A</text>
  <text x="385" y="322" font-size="9.5" fill="#b85450" font-weight="bold">451</text>

  <rect x="180" y="328" width="260" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="225" y="342" font-size="9.5" fill="#333">6</text>
  <text x="300" y="342" font-size="9.5" fill="#333">A</text>
  <text x="385" y="342" font-size="9.5" fill="#b85450" font-weight="bold">513</text>

  <rect x="180" y="348" width="260" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="225" y="362" font-size="9.5" fill="#333">7</text>
  <text x="300" y="362" font-size="9.5" fill="#333">B</text>
  <text x="385" y="362" font-size="9.5" fill="#b85450" font-weight="bold">15</text>

  <rect x="180" y="368" width="260" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="225" y="382" font-size="9.5" fill="#333">9</text>
  <text x="300" y="382" font-size="9.5" fill="#333">B</text>
  <text x="385" y="382" font-size="9.5" fill="#b85450" font-weight="bold">1154</text>

  <line x1="250" y1="308" x2="250" y2="388" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="340" y1="308" x2="340" y2="388" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- Key takeaway box -->
  <rect x="30" y="404" width="560" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="50" y="422" font-size="10.5" fill="#333" font-weight="bold">核心：rn BETWEEN ⌊(n+1)/2⌋ AND ⌊(n+2)/2⌋ —— 奇数取 1 行，偶数取 2 行</text>
</svg>
