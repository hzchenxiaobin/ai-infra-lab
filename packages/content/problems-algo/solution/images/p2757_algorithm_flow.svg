<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">cycleGenerator 算法流程</text>

  <!-- start: init -->
  <rect x="180" y="48" width="180" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="74" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i ← startIndex</text>

  <path d="M270,92 L270,118" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond: next step? -->
  <polygon points="270,120 360,168 270,216 180,168" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="164" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">steps 还有</text>
  <text x="270" y="180" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">下一项？</text>

  <!-- yes branch: down -->
  <text x="284" y="240" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M270,216 L270,248" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- move box -->
  <rect x="120" y="250" width="300" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="278" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">i ← ((i + step) % n + n) % n</text>

  <path d="M270,296 L270,322" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- yield box -->
  <rect x="150" y="324" width="240" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="352" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">yield arr[i]</text>

  <!-- loop back arrow: from yield box right side up to diamond right -->
  <path d="M390,347 C470,347 470,168 360,168" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="478" y="258" font-size="10" fill="#888" filter="url(#rough2)">取下一个 step</text>

  <!-- no branch: left to end -->
  <text x="150" y="162" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M180,168 L120,168 L120,210" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="210" width="120" height="42" fill="#f6f8fa" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="120" y="236" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">结束（done）</text>

  <text x="270" y="402" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每个 step 移动后吐出一个值 → 共 yield steps.length 次</text>
</svg>
