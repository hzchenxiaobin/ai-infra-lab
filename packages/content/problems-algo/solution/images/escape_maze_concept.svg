<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：B 个封锁格最多围住 B(B−1)/2 格</text>
  <text x="270" y="46" text-anchor="middle" font-size="11" fill="#888">封锁格 + 两堵网格边界 → 阶梯形最大三角形围合（图中 B=5）</text>

  <g filter="url(#rough2)" font-size="13" font-weight="bold">
    <!-- top wall (thick) -->
    <rect x="56" y="54" width="200" height="8" fill="#d6a040"/>
    <!-- left wall (thick) -->
    <rect x="56" y="54" width="8" height="200" fill="#d6a040"/>

    <!-- grid cells 6x6, cell=32, origin (64,62) -->
    <!-- col 1 (x=64) -->
    <rect x="64" y="62" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <rect x="64" y="94" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <rect x="64" y="126" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <rect x="64" y="158" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <rect x="64" y="190" width="32" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3"/>
    <rect x="64" y="222" width="32" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="3"/>

    <!-- col 2 (x=96) -->
    <rect x="96" y="62" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <rect x="96" y="94" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <rect x="96" y="126" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <rect x="96" y="158" width="32" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3"/>
    <rect x="96" y="190" width="32" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="96" y="222" width="32" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="3"/>

    <!-- col 3 (x=128) -->
    <rect x="128" y="62" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <rect x="128" y="94" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <rect x="128" y="126" width="32" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3"/>
    <rect x="128" y="158" width="32" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="128" y="190" width="32" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="128" y="222" width="32" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="3"/>

    <!-- col 4 (x=160) -->
    <rect x="160" y="62" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
    <rect x="160" y="94" width="32" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3"/>
    <rect x="160" y="126" width="32" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="160" y="158" width="32" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="160" y="190" width="32" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="160" y="222" width="32" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="3"/>

    <!-- col 5 (x=192) -->
    <rect x="192" y="62" width="32" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3"/>
    <rect x="192" y="94" width="32" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="192" y="126" width="32" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="192" y="158" width="32" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="192" y="190" width="32" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="192" y="222" width="32" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="3"/>

    <!-- col 6 (x=224) -->
    <rect x="224" y="62" width="32" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="224" y="94" width="32" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="224" y="126" width="32" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="224" y="158" width="32" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="224" y="190" width="32" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="224" y="222" width="32" height="32" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="3"/>

    <!-- staircase dashed line along blockers -->
    <path d="M 208 78 L 176 110 L 144 142 L 112 174 L 80 206" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5,3"/>

    <!-- count markers on enclosed rows -->
    <text x="48" y="83" text-anchor="end" font-size="10" fill="#4a7a3a">1</text>
    <text x="48" y="115" text-anchor="end" font-size="10" fill="#4a7a3a">2</text>
    <text x="48" y="147" text-anchor="end" font-size="10" fill="#4a7a3a">3</text>
    <text x="48" y="179" text-anchor="end" font-size="10" fill="#4a7a3a">4</text>
  </g>

  <!-- annotations right -->
  <g filter="url(#rough2)" font-size="12">
    <rect x="288" y="70" width="230" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
    <text x="403" y="89" text-anchor="middle" fill="#b85450" font-weight="bold">红格 = 封锁格（阶梯围栏）</text>
    <text x="403" y="105" text-anchor="middle" fill="#b85450" font-size="11">B=5 个，斜向铺成"楼梯"</text>

    <rect x="288" y="124" width="230" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="403" y="143" text-anchor="middle" fill="#4a7a3a" font-weight="bold">绿格 = 被围内部区域</text>
    <text x="403" y="159" text-anchor="middle" fill="#4a7a3a" font-size="11">1+2+3+4 = 10 格</text>

    <rect x="288" y="178" width="230" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="403" y="197" text-anchor="middle" fill="#d6a040" font-weight="bold">面积上界 = B(B−1)/2</text>
    <text x="403" y="213" text-anchor="middle" fill="#d6a040" font-size="11">5×4/2 = 10 ✓ ｜ 200×199/2 = 19900</text>

    <rect x="288" y="232" width="230" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="403" y="251" text-anchor="middle" fill="#446688" font-weight="bold">推论：BFS 探索 &gt; 19900 格</text>
    <text x="403" y="267" text-anchor="middle" fill="#446688" font-size="11">⇒ 该起点必在开放区（未被围）</text>

    <!-- pointer arrows -->
    <path d="M 288 92 L 250 100" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arrR)"/>
    <path d="M 288 146 L 180 150" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>

    <!-- wall labels -->
    <text x="156" y="50" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">← 网格边界（墙）→</text>
  </g>

  <text x="270" y="354" text-anchor="middle" font-size="11" fill="#888">两堵墙 + B 个封锁格围成阶梯三角形，内部至多 B(B−1)/2 格；超出即开放</text>
</svg>
