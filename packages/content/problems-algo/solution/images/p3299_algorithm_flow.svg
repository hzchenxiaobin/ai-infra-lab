<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：两遍对称扫描 + 一次合并，全程取模</text>

  <!-- 步骤一 -->
  <rect x="40" y="40" width="440" height="78" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">① 左 → 右扫描 i = 0 … n−1（哈希表 cnt↑ / cnt↓）</text>
  <text x="260" y="80" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">L↑[i] ← cnt↑[v−1]；　cnt↑[v] ← cnt↑[v] + L↑[i] + 1</text>
  <text x="260" y="98" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">L↓[i] ← cnt↓[v+1]；　cnt↓[v] ← cnt↓[v] + L↓[i] + 1</text>

  <path d="M 260 120 L 260 144" fill="none" stroke="#a07830" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="137" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">回写 +1 = 计入单身 [v]</text>

  <!-- 步骤二 -->
  <rect x="40" y="148" width="440" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="168" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">② 右 → 左扫描 i = n−1 … 0（清空两张表重用）</text>
  <text x="260" y="188" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">R↑[i] ← cnt↑[v+1]；　cnt↑[v] ← cnt↑[v] + R↑[i] + 1</text>
  <text x="260" y="206" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">R↓[i] ← cnt↓[v−1]；　cnt↓[v] ← cnt↓[v] + R↓[i] + 1</text>

  <path d="M 260 228 L 260 252" fill="none" stroke="#a07830" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="245" font-size="10.5" fill="#a07830" filter="url(#rough2)">表的键是「值」不是下标 → 查前驱 / 后继聚合 O(1)</text>

  <!-- 步骤三 -->
  <rect x="40" y="256" width="440" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="276" text-anchor="middle" font-size="11.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">③ 合并 i = 0 … n−1：乘法原理算出场次数</text>
  <text x="260" y="296" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">c = (L↑+1)(R↑+1) + (L↓+1)(R↓+1) − 1；　ans += nums[i] × c</text>
  <text x="260" y="316" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1 去单身的重复；取模后可能为负 → + MOD 再 %</text>

  <!-- 底部结论 -->
  <rect x="40" y="348" width="440" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="366" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">时间 O(n)，空间 O(n)；值域 [1, 10⁵] → 用值域数组替哈希表再提速</text>
</svg>
