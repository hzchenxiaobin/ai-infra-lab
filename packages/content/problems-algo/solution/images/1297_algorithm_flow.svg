<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="460" height="560" fill="#fafafa"/>

  <text x="230" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">枚举定长子串 + 哈希计数：算法流程</text>

  <!-- Init -->
  <rect x="90" y="44" width="280" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="66" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">初始化</text>
  <text x="230" y="86" text-anchor="middle" font-size="11" fill="#555">count = {}, ans = 0</text>

  <path d="M 230 104 L 230 122" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Loop entry -->
  <rect x="80" y="126" width="300" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="146" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">for i in 0 .. n − minSize</text>
  <text x="230" y="162" text-anchor="middle" font-size="10.5" fill="#555">枚举每个长度 = minSize 的子串起点</text>

  <path d="M 230 174 L 230 192" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- extract sub -->
  <rect x="110" y="196" width="240" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="230" y="216" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">sub = s[i : i+minSize]</text>
  <text x="230" y="232" text-anchor="middle" font-size="10.5" fill="#555">截取定长子串</text>

  <path d="M 230 244 L 230 262" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Diamond: distinct <= maxLetters? -->
  <polygon points="230,266 370,312 230,358 90,312" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="308" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">distinct(sub)</text>
  <text x="230" y="326" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">≤ maxLetters ?</text>

  <!-- No branch: skip -->
  <path d="M 370 312 L 430 312 L 430 372" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="384" y="304" font-size="11" fill="#82b366" font-weight="bold">No</text>
  <rect x="346" y="376" width="100" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="396" y="394" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">跳过</text>
  <text x="396" y="410" text-anchor="middle" font-size="10" fill="#555">不合法子串</text>

  <!-- Yes branch: count -->
  <path d="M 90 312 L 40 312 L 40 372" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="50" y="304" font-size="11" fill="#b85450" font-weight="bold">Yes</text>
  <rect x="6" y="376" width="120" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="66" y="396" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">计数更新</text>
  <text x="66" y="412" text-anchor="middle" font-size="10" fill="#555">count[sub]++</text>
  <text x="66" y="426" text-anchor="middle" font-size="10" fill="#555">ans = max(ans, …)</text>

  <!-- merge to loop back -->
  <path d="M 66 444 L 66 464 L 200 464" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <path d="M 396 422 L 396 464 L 260 464" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrowR)" filter="url(#rough2)"/>

  <!-- loop back arrow -->
  <path d="M 230 468 L 230 478 L 430 478 L 430 148 L 382 148" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <text x="440" y="312" font-size="9.5" fill="#aaa" transform="rotate(-90 440 312)">下一起点</text>

  <!-- final -->
  <rect x="90" y="496" width="280" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="516" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">遍历结束 → return ans</text>
  <text x="230" y="532" text-anchor="middle" font-size="10.5" fill="#888">时间 O(n · minSize)，空间 O(n · minSize)</text>
  <text x="230" y="548" text-anchor="middle" font-size="10" fill="#aaa">maxSize 不参与枚举（见核心观察）</text>
</svg>
