<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">状态机：只需记住『有没有半个 x 操作悬着』</text>

  <!-- 状态 A -->
  <g filter="url(#rough2)">
    <rect x="64" y="92" width="150" height="66" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="139" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#446688">f[i][0]</text>
    <text x="139" y="140" text-anchor="middle" font-size="11" fill="#333">前 i 个差异全部消除</text>
  </g>

  <!-- 状态 B -->
  <g filter="url(#rough2)">
    <rect x="316" y="92" width="170" height="66" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="401" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6512">f[i][1]</text>
    <text x="401" y="140" text-anchor="middle" font-size="11" fill="#333">悬置半个 x 操作（x 已付）</text>
  </g>

  <!-- A -> B 开启 -->
  <g filter="url(#rough2)">
    <path d="M 160 90 Q 265 36 380 90" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)"/>
    <text x="265" y="50" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">开启：当前差异位付 x</text>
  </g>

  <!-- B -> A 关闭 -->
  <g filter="url(#rough2)">
    <path d="M 380 160 Q 265 212 160 160" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)"/>
    <text x="265" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">关闭：另一半落在当前位，免费</text>
  </g>

  <!-- A 自环 -->
  <g filter="url(#rough2)">
    <path d="M 100 160 C 84 214, 196 214, 178 160" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="139" y="232" text-anchor="middle" font-size="11" fill="#446688">相邻差异配对 +min(x,d)</text>
  </g>

  <!-- B 自环 -->
  <g filter="url(#rough2)">
    <path d="M 352 160 C 336 214, 448 214, 430 160" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="393" y="232" text-anchor="middle" font-size="11" fill="#446688">相邻差异配对 +min(x,d)</text>
  </g>

  <!-- 说明框 -->
  <g filter="url(#rough2)">
    <rect x="36" y="248" width="448" height="96" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="60" y="274" font-size="12" fill="#2f5a24">① 悬置只记『有无』不记『位置』——x 的代价与两个下标的距离无关</text>
    <text x="60" y="298" font-size="12" fill="#2f5a24">② 至多一个悬置——两个嵌套的 x 配对花 2x，换成局部配对代价不增</text>
    <text x="60" y="326" font-size="12" fill="#2f5a24">③ d = 当前差异位与上一个差异位的间距</text>
  </g>
</svg>
