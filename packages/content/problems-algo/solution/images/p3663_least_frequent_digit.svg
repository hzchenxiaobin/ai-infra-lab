<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：只在「出现过」的数字里挑频率最低</text>

  <text x="260" y="52" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">n = 723344511，逐位入桶：</text>

  <!-- 9 个数位 -->
  <rect x="87" y="60" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="104" y="82" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>
  <rect x="126" y="60" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="143" y="82" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="165" y="60" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="182" y="82" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="204" y="60" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="221" y="82" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="243" y="60" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="82" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="282" y="60" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="299" y="82" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="321" y="60" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="338" y="82" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <rect x="360" y="60" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="377" y="82" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="399" y="60" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="416" y="82" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>

  <path d="M 260 96 L 260 114" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- cnt 桶：10 个 -->
  <rect x="38" y="120" width="40" height="50" fill="#f2f2f2" stroke="#aaaaaa" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="58" y="138" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="58" y="160" text-anchor="middle" font-size="15" fill="#999" filter="url(#rough2)">0</text>
  <path d="M 46 164 L 70 126" stroke="#b85450" stroke-width="1.2" opacity="0.6" filter="url(#rough2)"/>

  <rect x="83" y="120" width="40" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="103" y="138" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">1</text>
  <text x="103" y="160" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>

  <rect x="128" y="120" width="40" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="138" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">2</text>
  <text x="148" y="160" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>

  <rect x="173" y="120" width="40" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="193" y="138" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">3</text>
  <text x="193" y="160" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>

  <rect x="218" y="120" width="40" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="238" y="138" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">4</text>
  <text x="238" y="160" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>

  <rect x="263" y="120" width="40" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="283" y="138" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">5</text>
  <text x="283" y="160" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>

  <rect x="308" y="120" width="40" height="50" fill="#f2f2f2" stroke="#aaaaaa" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="328" y="138" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">6</text>
  <text x="328" y="160" text-anchor="middle" font-size="15" fill="#999" filter="url(#rough2)">0</text>
  <path d="M 316 164 L 340 126" stroke="#b85450" stroke-width="1.2" opacity="0.6" filter="url(#rough2)"/>

  <rect x="353" y="120" width="40" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="373" y="138" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">7</text>
  <text x="373" y="160" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>

  <rect x="398" y="120" width="40" height="50" fill="#f2f2f2" stroke="#aaaaaa" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="418" y="138" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">8</text>
  <text x="418" y="160" text-anchor="middle" font-size="15" fill="#999" filter="url(#rough2)">0</text>
  <path d="M 406 164 L 430 126" stroke="#b85450" stroke-width="1.2" opacity="0.6" filter="url(#rough2)"/>

  <rect x="443" y="120" width="40" height="50" fill="#f2f2f2" stroke="#aaaaaa" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="463" y="138" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">9</text>
  <text x="463" y="160" text-anchor="middle" font-size="15" fill="#999" filter="url(#rough2)">0</text>
  <path d="M 451 164 L 475 126" stroke="#b85450" stroke-width="1.2" opacity="0.6" filter="url(#rough2)"/>

  <text x="260" y="188" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">灰色桶 cnt = 0：数字未出现，不算候选（红斜杠划掉）</text>

  <!-- 平局候选 -->
  <text x="260" y="212" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">出现过的数字中频率最低（1 次）：{2, 5, 7} —— 平局</text>

  <rect x="160" y="220" width="64" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="192" y="241" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <text x="192" y="256" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">出现 1 次</text>

  <rect x="232" y="220" width="64" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="264" y="241" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">5</text>
  <text x="264" y="256" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">出现 1 次</text>

  <rect x="304" y="220" width="64" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="336" y="241" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">7</text>
  <text x="336" y="256" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">出现 1 次</text>

  <path d="M 264 268 L 264 284" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="140" y="288" width="240" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="310" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">平局 → 取最小数字 → 返回 2</text>

  <text x="16" y="346" font-size="10" fill="#999" filter="url(#rough2)">⚠️ 反证：若「未出现（频率 0）」也算候选，示例 1（n = 1553322）会错算成 0</text>
</svg>
