<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>
  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：排序成链 ⇒ 最短路 = 单调向右的贪心最远跳</text>
  <text x="280" y="46" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">示例 2：nums = [5, 3, 1, 9, 10]，maxDiff = 2</text>

  <!-- 原数组（无序） -->
  <text x="36" y="85" font-size="12" fill="#555" filter="url(#rough2)">原数组（无序）</text>
  <text x="192" y="60" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">#0</text>
  <text x="250" y="60" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">#1</text>
  <text x="308" y="60" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">#2</text>
  <text x="366" y="60" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">#3</text>
  <text x="424" y="60" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">#4</text>
  <rect x="170" y="66" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="192" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">5</text>
  <rect x="228" y="66" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">3</text>
  <rect x="286" y="66" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="308" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">1</text>
  <rect x="344" y="66" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="366" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">9</text>
  <rect x="402" y="66" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="424" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">10</text>

  <!-- 排序箭头 -->
  <path d="M 308 104 L 308 130" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="122" font-size="11" fill="#446688" filter="url(#rough2)">按值排序（记 pos 映射）</text>

  <!-- 相邻差标注 -->
  <text x="131" y="133" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">差 2</text>
  <text x="233" y="133" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">差 2</text>
  <text x="348" y="133" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">断口：差 4 &gt; 2</text>
  <text x="459" y="133" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">差 1</text>

  <!-- 断口墙 -->
  <line x1="348" y1="138" x2="348" y2="270" stroke="#b85450" stroke-width="3" stroke-dasharray="7,5" filter="url(#rough2)"/>

  <!-- 排序后的链 -->
  <rect x="44" y="140" width="72" height="62" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="172" text-anchor="middle" font-size="20" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="80" y="192" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">#2</text>

  <rect x="146" y="140" width="72" height="62" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="182" y="172" text-anchor="middle" font-size="20" font-weight="bold" fill="#446688" filter="url(#rough2)">3</text>
  <text x="182" y="192" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">#1</text>

  <rect x="248" y="140" width="72" height="62" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="284" y="172" text-anchor="middle" font-size="20" font-weight="bold" fill="#446688" filter="url(#rough2)">5</text>
  <text x="284" y="192" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">#0</text>

  <rect x="376" y="140" width="72" height="62" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="412" y="172" text-anchor="middle" font-size="20" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">9</text>
  <text x="412" y="192" text-anchor="middle" font-size="10.5" fill="#2a5a2a" filter="url(#rough2)">#3</text>

  <rect x="472" y="140" width="72" height="62" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="508" y="172" text-anchor="middle" font-size="20" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">10</text>
  <text x="508" y="192" text-anchor="middle" font-size="10.5" fill="#2a5a2a" filter="url(#rough2)">#4</text>

  <!-- 贪心跳跃弧线 -->
  <path d="M 80 204 C 80 228, 182 228, 182 204" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="131" y="240" text-anchor="middle" font-size="10.5" fill="#2a5a2a" filter="url(#rough2)">① 跳到最远 3</text>
  <path d="M 182 204 C 182 246, 284 246, 284 204" fill="none" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="233" y="258" text-anchor="middle" font-size="10.5" fill="#2a5a2a" filter="url(#rough2)">② 跳到最远 5</text>

  <!-- 查询卡片 -->
  <rect x="36" y="278" width="252" height="52" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="162" y="296" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">查询 [0,2]：值 5 ↔ 值 1（同段）</text>
  <text x="162" y="314" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">规范化 p=值1，q=值5：贪心 2 步 1→3→5</text>

  <rect x="308" y="278" width="216" height="52" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="416" y="296" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">查询 [2,3]：值 5 → 值 9 跨墙</text>
  <text x="416" y="314" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">无路可走 → 返回 −1</text>

  <!-- 结论框 -->
  <rect x="36" y="346" width="488" height="64" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="366" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#8a6a20" filter="url(#rough2)">贪心为何最优？</text>
  <text x="280" y="386" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">夹逼引理：边 (u,v) 中间任何位置与两端都有边 ⇒ 左绕路径可抹平成单调路径</text>
  <text x="280" y="404" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">交换论证：第二站换成最远点 R(c) 必不劣 ⇒「跳跃游戏 II」的贪心搬到值轴</text>
</svg>
