<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：只看 mod 24 余数，互补余数两两配对</text>

  <!-- 四组 值 -> 余数 -->
  <rect x="68" y="38" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="54" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">72</text>
  <path d="M 90 64 L 90 78" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <rect x="68" y="82" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="98" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">0</text>

  <rect x="168" y="38" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="54" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">48</text>
  <path d="M 190 64 L 190 78" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <rect x="168" y="82" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="98" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">0</text>

  <rect x="268" y="38" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="54" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">24</text>
  <path d="M 290 64 L 290 78" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <rect x="268" y="82" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="98" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">0</text>

  <rect x="368" y="38" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="390" y="54" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">3</text>
  <path d="M 390 64 L 390 78" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <rect x="368" y="82" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="390" y="98" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">3</text>

  <text x="452" y="62" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">mod 24</text>
  <text x="452" y="76" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">缩域!</text>

  <text x="260" y="126" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">10⁹ 内的任意小时数，都落进 24 个余数桶：</text>

  <!-- 24 个余数桶 -->
  <rect x="10" y="136" width="19" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="19.5" y="153" text-anchor="middle" font-size="9" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="30" y="136" width="19" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="39.5" y="153" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">1</text>
  <rect x="50" y="136" width="19" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="59.5" y="153" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="70" y="136" width="19" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="79.5" y="153" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">3</text>
  <rect x="90" y="136" width="19" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="99.5" y="153" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">4</text>
  <rect x="110" y="136" width="19" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="119.5" y="153" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">5</text>
  <rect x="130" y="136" width="19" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="139.5" y="153" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">6</text>
  <rect x="150" y="136" width="19" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="159.5" y="153" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">7</text>
  <rect x="170" y="136" width="19" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="179.5" y="153" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">8</text>
  <rect x="190" y="136" width="19" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="199.5" y="153" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">9</text>
  <rect x="210" y="136" width="19" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="219.5" y="153" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">10</text>
  <rect x="230" y="136" width="19" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="239.5" y="153" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">11</text>
  <rect x="250" y="136" width="19" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="259.5" y="153" text-anchor="middle" font-size="9" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">12</text>
  <rect x="270" y="136" width="19" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="279.5" y="153" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">13</text>
  <rect x="290" y="136" width="19" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="299.5" y="153" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">14</text>
  <rect x="310" y="136" width="19" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="319.5" y="153" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">15</text>
  <rect x="330" y="136" width="19" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="339.5" y="153" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">16</text>
  <rect x="350" y="136" width="19" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="359.5" y="153" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">17</text>
  <rect x="370" y="136" width="19" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="379.5" y="153" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">18</text>
  <rect x="390" y="136" width="19" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="399.5" y="153" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">19</text>
  <rect x="410" y="136" width="19" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="419.5" y="153" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">20</text>
  <rect x="430" y="136" width="19" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="439.5" y="153" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">21</text>
  <rect x="450" y="136" width="19" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="459.5" y="153" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">22</text>
  <rect x="470" y="136" width="19" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="479.5" y="153" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">23</text>

  <!-- 自环：0 和 12 -->
  <path d="M 12 134 C 2 120, 30 118, 27 134" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>
  <path d="M 252 134 C 242 120, 270 118, 267 134" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>
  <text x="259.5" y="112" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">0 和 12 自己配自己</text>

  <!-- 短弧：9↔15, 10↔14, 11↔13 -->
  <path d="M 199.5 165 Q 259.5 205 319.5 165" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-start="url(#arrGreen)" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <path d="M 219.5 165 Q 259.5 192 299.5 165" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-start="url(#arrGreen)" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <path d="M 239.5 165 Q 259.5 182 279.5 165" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-start="url(#arrGreen)" marker-end="url(#arrGreen)" filter="url(#rough2)"/>

  <!-- 长弧：1↔23 -->
  <path d="M 39.5 165 Q 259.5 265 479.5 165" stroke="#446688" stroke-width="1.6" fill="none" stroke-dasharray="6 4" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="260" y="232" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">1 ↔ 23、2 ↔ 22、⋯、11 ↔ 13 互补配对</text>

  <!-- 两个计数框 -->
  <rect x="24" y="272" width="228" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="138" y="291" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">互补对（r = 1…11）</text>
  <text x="138" y="308" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">cnt[r] × cnt[24 − r]</text>

  <rect x="268" y="272" width="228" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="382" y="291" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">自配对（r = 0 或 12）</text>
  <text x="382" y="308" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">C(cnt[r], 2)</text>

  <!-- 结论公式 -->
  <rect x="50" y="334" width="420" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="355" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(hᵢ + hⱼ) mod 24 = 0</text>
  <text x="260" y="375" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⟺ rⱼ = (24 − rᵢ) mod 24</text>
</svg>
