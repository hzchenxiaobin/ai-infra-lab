<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 620" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="620" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：apple + [plain, amber, blade] → "1p3"</text>

  <!-- ===== Section A: diff masks ===== -->
  <rect x="30" y="38" width="540" height="142" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="60" font-size="12" fill="#446688" font-weight="bold">第一步：过滤等长词，计算 diff 掩码（位置 i：target[i]≠w[i] 记 1）</text>

  <!-- header positions -->
  <text x="70" y="84" font-size="10" fill="#888">target=apple →</text>
  <text x="200" y="84" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>
  <text x="236" y="84" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">p</text>
  <text x="272" y="84" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">p</text>
  <text x="308" y="84" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">l</text>
  <text x="344" y="84" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">e</text>
  <text x="430" y="84" font-size="10" fill="#888">pos:</text>
  <text x="200" y="98" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="236" y="98" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="272" y="98" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="308" y="98" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="344" y="98" text-anchor="middle" font-size="9" fill="#aaa">4</text>

  <!-- plain row -->
  <text x="70" y="124" font-size="11" fill="#555">diff(plain): </text>
  <rect x="186" y="110" width="28" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="200" y="126" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <rect x="222" y="110" width="28" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="236" y="126" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <rect x="258" y="110" width="28" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="272" y="126" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <rect x="294" y="110" width="28" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="308" y="126" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <rect x="330" y="110" width="28" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="344" y="126" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <text x="380" y="126" font-size="10" fill="#888">全部不同</text>

  <!-- amber row -->
  <text x="70" y="150" font-size="11" fill="#555">diff(amber): </text>
  <rect x="186" y="136" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="200" y="152" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="222" y="136" width="28" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="236" y="152" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <rect x="258" y="136" width="28" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="272" y="152" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <rect x="294" y="136" width="28" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="308" y="152" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <rect x="330" y="136" width="28" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="344" y="152" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <text x="380" y="152" font-size="10" fill="#888">pos0 同(a=a)</text>

  <!-- blade row -->
  <text x="70" y="176" font-size="11" fill="#555">diff(blade): </text>
  <rect x="186" y="162" width="28" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="200" y="178" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <rect x="222" y="162" width="28" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="236" y="178" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <rect x="258" y="162" width="28" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="272" y="178" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <rect x="294" y="162" width="28" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="308" y="178" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <rect x="330" y="162" width="28" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="344" y="178" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="380" y="178" font-size="10" fill="#888">pos4 同(e=e)</text>

  <!-- ===== Section B: candidates by length ===== -->
  <rect x="30" y="192" width="540" height="412" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="48" y="214" font-size="12" fill="#d6a040" font-weight="bold">第二步：按缩写长度从短到长搜索，首个无冲突者即答案</text>

  <!-- Length 1 -->
  <text x="48" y="244" font-size="12" fill="#555" font-weight="bold">len=1</text>
  <rect x="100" y="230" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="130" y="248" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">5</text>
  <text x="170" y="248" font-size="10" fill="#888">mask=00000</text>
  <text x="280" y="248" font-size="11" fill="#b85450">&amp;任意diff=0 → 与 plain/amber/blade 全冲突 ✗</text>

  <!-- Length 2 -->
  <text x="48" y="288" font-size="12" fill="#555" font-weight="bold">len=2</text>

  <rect x="100" y="274" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="130" y="292" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">a4</text>
  <text x="170" y="292" font-size="10" fill="#888">mask=10000</text>
  <text x="280" y="292" font-size="11" fill="#b85450">&amp;amber(01111)=0 → 与 amber 冲突 ✗</text>

  <rect x="100" y="308" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="130" y="326" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">4e</text>
  <text x="170" y="326" font-size="10" fill="#888">mask=00001</text>
  <text x="280" y="326" font-size="11" fill="#b85450">&amp;blade(11110)=0 → 与 blade 冲突 ✗</text>

  <text x="470" y="312" font-size="10" fill="#888">↑ 长度 2 全军覆没</text>

  <!-- Length 3: the winner -->
  <text x="48" y="360" font-size="12" fill="#555" font-weight="bold">len=3</text>
  <rect x="100" y="346" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="130" y="364" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1p3</text>
  <text x="170" y="364" font-size="10" fill="#888">mask=01000</text>

  <!-- conflict checks for 1p3 -->
  <text x="280" y="356" font-size="10" fill="#4a7a3a">&amp;plain(11111)=01000≠0 ✓</text>
  <text x="280" y="370" font-size="10" fill="#4a7a3a">&amp;amber(01111)=01000≠0 ✓</text>
  <text x="280" y="384" font-size="10" fill="#4a7a3a">&amp;blade(11110)=01000≠0 ✓</text>
  <text x="430" y="370" font-size="12" fill="#4a7a3a" font-weight="bold">→ 命中！</text>

  <!-- mask decode illustration for 1p3 -->
  <text x="48" y="416" font-size="11" fill="#555" font-weight="bold">mask=01000 解码为缩写：</text>
  <rect x="186" y="402" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="206" y="422" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">0</text>
  <rect x="228" y="402" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="248" y="422" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="270" y="402" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="422" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">0</text>
  <rect x="312" y="402" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="332" y="422" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">0</text>
  <rect x="354" y="402" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="374" y="422" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">0</text>

  <!-- arrows down to abbr -->
  <path d="M 206 432 L 206 448" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 248 432 L 248 448" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 332 432 L 332 448" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="450" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="190" y="470" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">1</text>
  <rect x="228" y="450" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="248" y="470" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">p</text>
  <rect x="288" y="450" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="328" y="470" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">3</text>
  <text x="400" y="470" font-size="13" fill="#4a7a3a" font-weight="bold">→ "1p3" ✓</text>

  <!-- conclusion box -->
  <rect x="48" y="496" width="504" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="518" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">关键观察</text>
  <text x="60" y="538" font-size="11" fill="#555">• 每个等长词典词给出一组「必须命中的差异位」——保留位 mask 必须与每个 diff 有公共 1</text>
  <text x="60" y="556" font-size="11" fill="#555">• 这本质是 <tspan font-weight="bold">集合覆盖</tspan>：选一组保留位，覆盖所有 diff；同时最小化 popcount + 零段数</text>
  <text x="60" y="574" font-size="11" fill="#555">• len=2 时单保留位只能落在 pos0 或 pos4（单零段）；落在 pos1 则生两零段→len=3</text>
  <text x="60" y="588" font-size="11" fill="#4a7a3a" font-weight="bold">  所以 "1p3"(pos1) 是 len=3 的首个可行解，且字典序最小（数字开头 &lt; 字母开头）</text>
</svg>
