<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 392" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="392" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [2, 3, 1, 5, 4]，seen 为插入当前元素前的有序集合</text>

  <!-- table header -->
  <rect x="30" y="44" width="500" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="55" y="62" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">j</text>
  <text x="90" y="62" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">x</text>
  <text x="200" y="62" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">seen（有序）</text>
  <text x="292" y="62" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">pos</text>
  <text x="352" y="62" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">前驱</text>
  <text x="412" y="62" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">rmax[j]</text>
  <text x="492" y="62" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">ans</text>

  <!-- row j=0 -->
  <rect x="30" y="70" width="500" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="55" y="90" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="90" y="90" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="200" y="90" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{ }（空）</text>
  <text x="292" y="90" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="352" y="90" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">—</text>
  <text x="412" y="90" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="492" y="90" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">−1</text>

  <!-- row j=1 highlighted -->
  <rect x="30" y="100" width="500" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="55" y="120" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="90" y="120" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="200" y="120" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">{2}</text>
  <text x="292" y="120" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="352" y="120" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="412" y="120" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">5 ✓</text>
  <text x="492" y="120" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">2−3+5=4 ★</text>

  <!-- row j=2 -->
  <rect x="30" y="130" width="500" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="55" y="150" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="90" y="150" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="200" y="150" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{2, 3}</text>
  <text x="292" y="150" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="352" y="150" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">—</text>
  <text x="412" y="150" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="492" y="150" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>

  <!-- row j=3 -->
  <rect x="30" y="160" width="500" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="55" y="180" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="90" y="180" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="200" y="180" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">{1, 2, 3}</text>
  <text x="292" y="180" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="352" y="180" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="412" y="180" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">4 ✗</text>
  <text x="492" y="180" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">4（右侧不足）</text>

  <!-- row j=4 -->
  <rect x="30" y="190" width="500" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="55" y="210" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="90" y="210" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="200" y="210" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{1, 2, 3, 5}</text>
  <text x="292" y="210" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="352" y="210" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="412" y="210" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0 ✗</text>
  <text x="492" y="210" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>

  <!-- annotations -->
  <rect x="30" y="238" width="500" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="260" text-anchor="middle" font-size="10.5" fill="#2d5a1e" filter="url(#rough2)">💡 j = 1 是唯一命中：前驱 2 严格小于 3，rmax = 5 严格大于 3，</text>
  <text x="280" y="278" text-anchor="middle" font-size="10.5" fill="#2d5a1e" filter="url(#rough2)">候选 2 − 3 + 5 = 4，对应三元组 (0, 1, 3)，即 2 &lt; 3 &lt; 5。</text>
  <text x="280" y="294" text-anchor="middle" font-size="10.5" fill="#2d5a1e" filter="url(#rough2)">j = 3 教学点：左侧完美（前驱 3），但 5 ≥ rmax[3] = 4，右侧找不到更大者。</text>

  <rect x="30" y="314" width="500" height="58" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="280" y="336" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">⚠️ rmax[n−1] 为哨兵 0（右侧无元素，必不合法）；pos = 0 表示 seen 中</text>
  <text x="280" y="354" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">没有严格小于 x 的元素（如 j = 2 时值 1 是当前最小），左侧不合法。</text>
</svg>
