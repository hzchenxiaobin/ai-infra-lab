<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：等差子序列由「末尾下标 i」+「公差 d」共同决定</text>

  <!-- ===== Array row with indices ===== -->
  <text x="40" y="56" font-size="11.5" fill="#888">nums = [20, 1, 15, 3, 10, 5, 8]</text>

  <!-- index row -->
  <text x="32" y="84" font-size="10" fill="#999">i</text>
  <rect x="60" y="70" width="62" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="91" y="88" text-anchor="middle" font-size="11" fill="#888">0</text>
  <rect x="126" y="70" width="62" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="157" y="88" text-anchor="middle" font-size="11" fill="#888">1</text>
  <rect x="192" y="70" width="62" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="223" y="88" text-anchor="middle" font-size="11" fill="#888">2</text>
  <rect x="258" y="70" width="62" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="289" y="88" text-anchor="middle" font-size="11" fill="#888">3</text>
  <rect x="324" y="70" width="62" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="355" y="88" text-anchor="middle" font-size="11" fill="#888">4</text>
  <rect x="390" y="70" width="62" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="421" y="88" text-anchor="middle" font-size="11" fill="#888">5</text>
  <rect x="456" y="70" width="62" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="487" y="88" text-anchor="middle" font-size="11" fill="#888">6</text>

  <!-- values row: highlight 20,15,10,5 in red (d=-5 chain) -->
  <text x="32" y="118" font-size="10" fill="#999">val</text>
  <rect x="60" y="104" width="62" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="91" y="122" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">20</text>
  <rect x="126" y="104" width="62" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="157" y="122" text-anchor="middle" font-size="12" fill="#999">1</text>
  <rect x="192" y="104" width="62" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="223" y="122" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">15</text>
  <rect x="258" y="104" width="62" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="289" y="122" text-anchor="middle" font-size="12" fill="#999">3</text>
  <rect x="324" y="104" width="62" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="355" y="122" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">10</text>
  <rect x="390" y="104" width="62" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="421" y="122" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">5</text>
  <rect x="456" y="104" width="62" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="487" y="122" text-anchor="middle" font-size="12" fill="#999">8</text>

  <!-- d = -5 chain arrows -->
  <path d="M 91 132 L 91 142 L 223 142 L 223 132" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 223 132 L 223 142 L 355 142 L 355 132" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 355 132 L 355 142 L 421 142 L 421 132" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="510" y="140" font-size="10" fill="#b85450">d = −5</text>

  <!-- ===== State definition box ===== -->
  <rect x="40" y="158" width="500" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="183" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">状态：dp[i][d] = 以 nums[i] 结尾、公差为 d 的最长等差子序列长度</text>

  <!-- arrow down -->
  <path d="M 290 200 L 290 216" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="212" font-size="10" fill="#888">转移</text>

  <!-- ===== Transition formula ===== -->
  <rect x="50" y="220" width="480" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="240" text-anchor="middle" font-size="13" fill="#333">枚举 j &lt; i，令 d = nums[i] − nums[j]：</text>
  <text x="290" y="260" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">dp[i][d] = dp[j][d] + 1　（不存在则 = 2）</text>

  <!-- arrow down -->
  <path d="M 290 270 L 290 286" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Concrete example of the chain ===== -->
  <rect x="40" y="290" width="500" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="60" y="314" font-size="12" fill="#444" font-weight="bold">d = −5 这条链的成长（nums = [20, 1, 15, 3, 10, 5, 8]）：</text>

  <!-- chain step 1 -->
  <rect x="60" y="324" width="130" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="125" y="344" text-anchor="middle" font-size="11" fill="#b85450">i=2: dp[2][−5]=2</text>

  <!-- arrow -->
  <path d="M 190 339 L 210 339" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- chain step 2 -->
  <rect x="210" y="324" width="130" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="275" y="344" text-anchor="middle" font-size="11" fill="#b85450">i=4: dp[4][−5]=3</text>

  <!-- arrow -->
  <path d="M 340 339 L 360 339" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- chain step 3 -->
  <rect x="360" y="324" width="150" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="435" y="344" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">i=5: dp[5][−5]=4 ⭐</text>

  <!-- sequence representation -->
  <text x="60" y="376" font-size="11" fill="#666">序列：</text>
  <rect x="100" y="364" width="44" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="122" y="381" text-anchor="middle" font-size="11" fill="#b85450">20</text>
  <path d="M 144 376 L 158 376" stroke="#999" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="158" y="364" width="44" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="381" text-anchor="middle" font-size="11" fill="#b85450">15</text>
  <path d="M 202 376 L 216 376" stroke="#999" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="216" y="364" width="44" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="238" y="381" text-anchor="middle" font-size="11" fill="#b85450">10</text>
  <path d="M 260 376 L 274 376" stroke="#999" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="274" y="364" width="44" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="296" y="381" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5</text>
  <text x="330" y="381" font-size="11" fill="#888">长度 = 4</text>

  <!-- ===== Key insight note ===== -->
  <rect x="40" y="420" width="500" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="441" text-anchor="middle" font-size="11.5" fill="#444">每个公差 d 独立维护自己的最长链，互不干扰 → 用哈希表 dp[i] 存储</text>
</svg>
