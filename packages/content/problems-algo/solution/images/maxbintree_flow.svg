<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：分治递归 build(l, r)</text>

  <!-- 入口 build(l, r) -->
  <rect x="170" y="48" width="200" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="70" text-anchor="middle" font-size="12" fill="#333">build(l, r)  入口</text>

  <path d="M 270 82 L 270 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判空菱形 -->
  <polygon points="270,104 390,150 270,196 150,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="146" text-anchor="middle" font-size="12" fill="#333">l &gt; r ?</text>
  <text x="270" y="164" text-anchor="middle" font-size="10" fill="#888">区间为空</text>

  <!-- 是 → 返回 null -->
  <path d="M 390 150 L 450 150 L 450 110" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="142" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="390" y="88" width="120" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="450" y="108" text-anchor="middle" font-size="11" fill="#888">返回 nullptr</text>

  <!-- 否 ↓ -->
  <path d="M 270 196 L 270 214" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="210" font-size="10" fill="#82b366" font-weight="bold">否</text>

  <!-- 找最大值 -->
  <rect x="150" y="218" width="240" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="240" text-anchor="middle" font-size="11" fill="#333">线性扫描 [l, r] 找最大值下标 mid</text>

  <path d="M 270 252 L 270 268" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 建根节点 -->
  <rect x="160" y="272" width="220" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="294" text-anchor="middle" font-size="11" fill="#333">root = TreeNode(nums[mid])</text>

  <path d="M 270 306 L 270 322" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 左右递归 -->
  <rect x="40" y="326" width="190" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="135" y="348" text-anchor="middle" font-size="11" fill="#333">root.left = build(l, mid-1)</text>

  <path d="M 270 322 L 135 322 L 135 326" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="310" y="326" width="200" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="410" y="348" text-anchor="middle" font-size="11" fill="#333">root.right = build(mid+1, r)</text>

  <path d="M 270 322 L 410 322 L 410 326" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 返回 -->
  <path d="M 135 360 L 135 386 L 270 386" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 410 360 L 410 386 L 270 386" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 270 386 L 270 402" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="200" y="404" width="140" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="424" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold">返回 root</text>
</svg>
