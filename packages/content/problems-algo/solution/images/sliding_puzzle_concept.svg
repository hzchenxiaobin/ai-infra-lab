<svg xmlns="http://www.w3.org/2000/svg" width="860" height="540" viewBox="0 0 860 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="860" height="540" fill="#fdfcf7"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">把「滑动谜题」建模成「无权图最短路」</text>
  <path d="M 300 42 Q 430 50 560 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== LEFT: 棋盘布局 = 节点，一次交换 = 一条边 ===== -->
  <g filter="url(#sk)">
    <rect x="24" y="74" width="404" height="446" rx="10" fill="#eef3fb" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="226" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#34506e">① 每种棋盘布局 = 节点，一次交换 = 一条边</text>

  <!-- board 4 1 2 / 5 0 3 -->
  <g filter="url(#sk)">
    <rect x="130" y="124" width="192" height="120" rx="6" fill="#fff" stroke="#446688" stroke-width="1.6"/>
    <line x1="194" y1="124" x2="194" y2="244" stroke="#446688" stroke-width="1.4"/>
    <line x1="258" y1="124" x2="258" y2="244" stroke="#446688" stroke-width="1.4"/>
    <line x1="130" y1="184" x2="322" y2="184" stroke="#446688" stroke-width="1.4"/>
  </g>
  <!-- highlight the 0 cell -->
  <g filter="url(#sk2)">
    <rect x="258" y="184" width="64" height="60" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <g font-size="22" font-weight="bold" fill="#34506e" text-anchor="middle">
    <text x="162" y="160">4</text><text x="226" y="160">1</text><text x="290" y="160">2</text>
    <text x="162" y="222">5</text>
  </g>
  <text x="290" y="222" text-anchor="middle" font-size="22" font-weight="bold" fill="#d6a040">0</text>
  <text x="226" y="266" text-anchor="middle" font-size="10.5" fill="#7a7a7a">空格 0 与相邻格交换 → 新布局</text>

  <!-- swap arrows from 0 (pos4) to neighbors pos 1,3,5 -->
  <g stroke="#9aa6b8" stroke-width="1.4" fill="none" filter="url(#sk)" marker-end="url(#ar)">
    <path d="M 280 188 Q 250 150 232 150"/>
    <path d="M 270 240 Q 230 250 198 248"/>
    <path d="M 318 214 Q 348 214 360 214"/>
  </g>
  <text x="262" y="140" font-size="9.5" fill="#7f9cc0">↖ 0↔1</text>
  <text x="208" y="262" font-size="9.5" fill="#7f9cc0">↙ 0↔3</text>
  <text x="330" y="208" font-size="9.5" fill="#7f9cc0">0↔5 →</text>

  <!-- three resulting boards (compact) -->
  <g font-size="11" fill="#34506e" text-anchor="middle">
    <g filter="url(#sk2)"><rect x="60" y="292" width="86" height="40" rx="4" fill="#fff" stroke="#7f9cc0" stroke-width="1"/></g>
    <text x="74" y="316">1</text><text x="103" y="316">0</text><text x="132" y="316">2</text>
    <text x="74" y="332">4</text><text x="103" y="332">5</text><text x="132" y="332">3</text>
    <g filter="url(#sk2)"><rect x="183" y="292" width="86" height="40" rx="4" fill="#fff" stroke="#7f9cc0" stroke-width="1"/></g>
    <text x="197" y="316">4</text><text x="226" y="316">1</text><text x="255" y="316">2</text>
    <text x="197" y="332">0</text><text x="226" y="332">5</text><text x="255" y="332">3</text>
    <g filter="url(#sk2)"><rect x="306" y="292" width="86" height="40" rx="4" fill="#fff" stroke="#7f9cc0" stroke-width="1"/></g>
    <text x="320" y="316">4</text><text x="349" y="316">1</text><text x="378" y="316">2</text>
    <text x="320" y="332">5</text><text x="349" y="332">3</text><text x="378" y="332">0</text>
  </g>

  <!-- neighbors count note -->
  <g filter="url(#sk)">
    <rect x="44" y="352" width="364" height="70" rx="6" fill="#fffdf3" stroke="#c9a93a" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="226" y="374" text-anchor="middle" font-size="11" fill="#7a5415">角位 2 邻居 · 边位 3 邻居 · 中心位 4 邻居</text>
  <text x="226" y="392" text-anchor="middle" font-size="11" fill="#7a5415">静态邻居表 neigh[pos] → O(1) 取可换位置</text>
  <text x="226" y="412" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">→ 展平成字符串 "412503"，状态可哈希可比较</text>

  <text x="226" y="442" text-anchor="middle" font-size="10.5" fill="#5a5a5a">总状态数 = 6 个数的全排列 = 6! = 720</text>
  <g filter="url(#sk)">
    <rect x="44" y="456" width="364" height="50" rx="6" fill="#eef6ef" stroke="#4a7e4a" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="226" y="478" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">→ 最少移动次数 = 无权图最短路径</text>
  <text x="226" y="496" text-anchor="middle" font-size="10.5" fill="#2e6e2e">每次交换 = 一条边权为 1 的边</text>

  <!-- ===== RIGHT: BFS 按层扩展 ===== -->
  <g filter="url(#sk)">
    <rect x="444" y="74" width="392" height="446" rx="10" fill="#eef6ef" stroke="#4a7e4a" stroke-width="1.6"/>
  </g>
  <text x="640" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">② BFS 按层扩展：层 = 移动次数</text>

  <!-- concentric layers -->
  <g filter="url(#sk)">
    <rect x="470" y="150" width="340" height="280" rx="18" fill="none" stroke="#bcd8bc" stroke-width="1.4" stroke-dasharray="6 4"/>
  </g>
  <text x="492" y="168" font-size="10.5" fill="#6a9a6a">层 5 · 5 步</text>
  <g filter="url(#sk)">
    <rect x="500" y="186" width="280" height="208" rx="16" fill="none" stroke="#9ec9a0" stroke-width="1.4" stroke-dasharray="6 4"/>
  </g>
  <text x="522" y="204" font-size="10.5" fill="#6a9a6a">层 3 · 3 步</text>
  <g filter="url(#sk)">
    <rect x="528" y="220" width="224" height="140" rx="14" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/>
  </g>
  <text x="552" y="240" font-size="10.5" fill="#2e6e2e">层 0 · 起点</text>

  <!-- center start node -->
  <g filter="url(#sk)">
    <ellipse cx="640" cy="292" rx="38" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="640" y="297" text-anchor="middle" font-size="13" font-weight="bold" fill="#34506e">412503</text>
  <text x="640" y="372" text-anchor="middle" font-size="10" fill="#5a5a5a">初始布局</text>

  <!-- expansion arrow -->
  <path d="M 660 274 Q 720 214 770 172" stroke="#4a8e4a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="720" y="214" font-size="10.5" fill="#2e6e2e">一圈圈</text>
  <text x="720" y="228" font-size="10.5" fill="#2e6e2e">向外扩</text>

  <!-- target node on outer layer -->
  <g filter="url(#sk)">
    <ellipse cx="770" cy="172" rx="40" ry="20" fill="#fff0f3" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="770" y="177" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">123450</text>
  <text x="770" y="148" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450">⭐ 目标 · 层 5</text>

  <!-- a visited (duplicate) node marked X -->
  <g filter="url(#sk)">
    <ellipse cx="560" cy="172" rx="32" ry="16" fill="#fdecee" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3 2"/>
  </g>
  <text x="560" y="176" text-anchor="middle" font-size="9.5" fill="#b85450">已访问</text>
  <text x="560" y="154" text-anchor="middle" font-size="9.5" fill="#b85450">✗ 不重复入队</text>

  <g filter="url(#sk)">
    <rect x="464" y="446" width="352" height="58" rx="6" fill="#fffdf3" stroke="#c9a93a" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="640" y="468" text-anchor="middle" font-size="11" fill="#7a5415">每条边权 = 1 → 无权图</text>
  <text x="640" y="488" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">BFS 首次到达 123450 的层数 = 最少移动次数</text>

  <!-- bottom legend -->
  <text x="430" y="528" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">状态总数 6!=720（可达仅 360）；visited 去重 → BFS 必然在有限步内终止</text>
</svg>
