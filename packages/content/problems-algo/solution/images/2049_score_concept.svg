<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：删掉某节点 → 树裂成若干部分 → 分数 = 各部分大小乘积</text>

  <!-- 左侧标题 -->
  <text x="150" y="62" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">原树（示例 1）</text>

  <!-- 原树边 -->
  <line x1="150" y1="86" x2="100" y2="132" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="150" y1="86" x2="200" y2="132" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="100" y1="148" x2="66" y2="196" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="100" y1="148" x2="134" y2="196" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- 原树节点 -->
  <circle cx="150" cy="78" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="82" text-anchor="middle" font-size="11" fill="#333">0</text>

  <circle cx="100" cy="140" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="100" y="144" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="76" y="138" font-size="10" fill="#b85450" font-weight="bold">删</text>

  <circle cx="200" cy="140" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="200" y="144" text-anchor="middle" font-size="11" fill="#333">4</text>

  <circle cx="66" cy="206" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="66" y="210" text-anchor="middle" font-size="10" fill="#333">1</text>

  <circle cx="134" cy="206" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="134" y="210" text-anchor="middle" font-size="10" fill="#333">3</text>

  <!-- 红色删除标记 -->
  <line x1="86" y1="126" x2="114" y2="154" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <line x1="114" y1="126" x2="86" y2="154" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>

  <!-- 右侧：删除后的三部分 -->
  <text x="410" y="62" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">删节点 2 后 → 3 个连通块</text>

  <!-- 部分 A: {1} 绿 -->
  <rect x="338" y="84" width="80" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="378" y="104" text-anchor="middle" font-size="11" fill="#333">部分 A: {1}</text>
  <text x="378" y="120" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">大小 = 1</text>

  <!-- 部分 B: {3} 绿 -->
  <rect x="338" y="140" width="80" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="378" y="160" text-anchor="middle" font-size="11" fill="#333">部分 B: {3}</text>
  <text x="378" y="176" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">大小 = 1</text>

  <!-- 部分 C: {0,4} 橙 -->
  <rect x="338" y="196" width="80" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="378" y="216" text-anchor="middle" font-size="11" fill="#333">部分 C: {0,4}</text>
  <text x="378" y="232" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">大小 = 2</text>

  <!-- 连通块来源标注 -->
  <text x="300" y="108" font-size="9" fill="#4a7a3a">← 子树1</text>
  <text x="300" y="164" font-size="9" fill="#4a7a3a">← 子树3</text>
  <text x="300" y="220" font-size="9" fill="#d6a040">← 上方剩余</text>

  <!-- 公式框 -->
  <rect x="40" y="270" width="480" height="116" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="294" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">分数定义</text>
  <text x="58" y="316" font-size="12" fill="#555">• 删掉节点 i 及其所有连边 → 剩余部分是若干非空连通块（子树）</text>
  <text x="58" y="336" font-size="12" fill="#555">• 分数 score(i) = 各连通块大小的乘积</text>
  <text x="58" y="358" font-size="12" fill="#b85450" font-weight="bold">• 节点 2：score = 1 × 1 × 2 = 2</text>
  <text x="58" y="378" font-size="11" fill="#888">• 连通块来源 = i 的每个孩子的子树 + （若非根）上方剩余部分</text>
</svg>
