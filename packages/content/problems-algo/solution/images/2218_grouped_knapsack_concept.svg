<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：分组背包——每个栈是一个「物品组」，组内互斥选一个</text>

  <!-- ===== Pile 1 ===== -->
  <text x="70" y="66" font-size="12" fill="#888" font-weight="bold">栈 1</text>

  <!-- coins top to bottom -->
  <rect x="100" y="56" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="130" y="75" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="100" y="86" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="105" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">100</text>
  <rect x="100" y="116" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="135" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <!-- "从顶取" arrow -->
  <path d="M 175 70 L 205 70" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="190" y="62" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">从顶取</text>

  <!-- options for pile 1 -->
  <text x="220" y="44" font-size="10" fill="#888">组内选项（取 j 个）：</text>
  <rect x="220" y="52" width="130" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="285" y="66" text-anchor="middle" font-size="10" fill="#333">j=0 → 价值 0</text>
  <rect x="220" y="74" width="130" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="285" y="88" text-anchor="middle" font-size="10" fill="#333">j=1 → 价值 1</text>
  <rect x="220" y="96" width="130" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="285" y="110" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">j=2 → 价值 101</text>
  <rect x="220" y="118" width="130" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="285" y="132" text-anchor="middle" font-size="10" fill="#333">j=3 → 价值 104</text>

  <!-- prefix sum note -->
  <text x="370" y="88" font-size="10" fill="#555">↑ 前缀和</text>
  <text x="370" y="102" font-size="10" fill="#555">prefix[j] =</text>
  <text x="370" y="116" font-size="10" fill="#555">Σ 顶 j 个面值</text>

  <!-- divider -->
  <line x1="40" y1="170" x2="520" y2="170" stroke="#ddd" stroke-width="1" stroke-dasharray="6 4" filter="url(#rough2)"/>

  <!-- ===== Pile 2 ===== -->
  <text x="70" y="206" font-size="12" fill="#888" font-weight="bold">栈 2</text>

  <rect x="100" y="196" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="130" y="215" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
  <rect x="100" y="226" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="245" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>
  <rect x="100" y="256" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="275" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">9</text>

  <path d="M 175 210 L 205 210" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <rect x="220" y="192" width="130" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="285" y="206" text-anchor="middle" font-size="10" fill="#333">j=0 → 价值 0</text>
  <rect x="220" y="214" width="130" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="285" y="228" text-anchor="middle" font-size="10" fill="#333">j=1 → 价值 7</text>
  <rect x="220" y="236" width="130" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="285" y="250" text-anchor="middle" font-size="10" fill="#333">j=2 → 价值 15</text>
  <rect x="220" y="258" width="130" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="285" y="272" text-anchor="middle" font-size="10" fill="#333">j=3 → 价值 24</text>

  <!-- ===== Constraint: pick at most one option per group ===== -->
  <rect x="380" y="190" width="140" height="100" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="450" y="212" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">分组背包约束</text>
  <text x="450" y="232" text-anchor="middle" font-size="10" fill="#555">每个栈最多选 1 个</text>
  <text x="450" y="248" text-anchor="middle" font-size="10" fill="#555">选项（取 j 个硬币）</text>
  <text x="450" y="268" text-anchor="middle" font-size="10" fill="#555">总操作数 = 恰好 k</text>
  <text x="450" y="282" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">最大化总面值</text>

  <!-- ===== Summary box ===== -->
  <rect x="40" y="310" width="480" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="334" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">dp[t] = 恰好 t 次操作能获得的最大面值和</text>
  <text x="280" y="356" text-anchor="middle" font-size="11" fill="#555">对每个栈 i：dp[t] = max(dp[t − j] + prefix[i][j])，j = 0..min(t, len_i)</text>
  <text x="280" y="376" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">t 倒序遍历 → 一维滚动数组 O(k) 空间</text>
</svg>
