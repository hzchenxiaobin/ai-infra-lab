<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="480" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：[2,7,4,1,8,1]</text>

  <!-- 表头 -->
  <rect x="30" y="44" width="60" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="63" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">轮次</text>

  <rect x="90" y="44" width="180" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="63" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">取 y, x 相撞</text>

  <rect x="270" y="44" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="63" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">差值</text>

  <rect x="350" y="44" width="200" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="450" y="63" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">堆中剩余</text>

  <!-- Row 1: 初始建堆 -->
  <rect x="30" y="74" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="93" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">建堆</text>
  <rect x="90" y="74" width="180" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="180" y="93" text-anchor="middle" font-size="10.5" fill="#888">全部入堆</text>
  <rect x="270" y="74" width="80" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="310" y="93" text-anchor="middle" font-size="10.5" fill="#888">—</text>
  <rect x="350" y="74" width="200" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="450" y="93" text-anchor="middle" font-size="10.5" fill="#333">{8,7,4,2,1,1}</text>

  <!-- Row 2: Round 1 -->
  <rect x="30" y="104" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="123" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">R1</text>
  <rect x="90" y="104" width="180" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="180" y="123" text-anchor="middle" font-size="10.5" fill="#333">y=8, x=7 → 8−7</text>
  <rect x="270" y="104" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="310" y="123" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <rect x="350" y="104" width="200" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="450" y="123" text-anchor="middle" font-size="10.5" fill="#333">{4,2,1,1,1}</text>

  <!-- Row 3: Round 2 -->
  <rect x="30" y="134" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="153" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">R2</text>
  <rect x="90" y="134" width="180" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="180" y="153" text-anchor="middle" font-size="10.5" fill="#333">y=4, x=2 → 4−2</text>
  <rect x="270" y="134" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="310" y="153" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <rect x="350" y="134" width="200" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="450" y="153" text-anchor="middle" font-size="10.5" fill="#333">{2,1,1,1}</text>

  <!-- Row 4: Round 3 -->
  <rect x="30" y="164" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="183" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">R3</text>
  <rect x="90" y="164" width="180" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="180" y="183" text-anchor="middle" font-size="10.5" fill="#333">y=2, x=1 → 2−1</text>
  <rect x="270" y="164" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="310" y="183" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <rect x="350" y="164" width="200" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="450" y="183" text-anchor="middle" font-size="10.5" fill="#333">{1,1,1}</text>

  <!-- Row 5: Round 4 -->
  <rect x="30" y="194" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="60" y="213" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">R4</text>
  <rect x="90" y="194" width="180" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="180" y="213" text-anchor="middle" font-size="10.5" fill="#333">y=1, x=1 → 相等</text>
  <rect x="270" y="194" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="310" y="213" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">0（消失）</text>
  <rect x="350" y="194" width="200" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="450" y="213" text-anchor="middle" font-size="10.5" fill="#333">{1}</text>

  <!-- 结束行 -->
  <rect x="30" y="224" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="243" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">结束</text>
  <rect x="90" y="224" width="180" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="180" y="243" text-anchor="middle" font-size="10.5" fill="#888">堆大小 = 1，退出循环</text>
  <rect x="270" y="224" width="80" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="310" y="243" text-anchor="middle" font-size="10.5" fill="#888">—</text>
  <rect x="350" y="224" width="200" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="450" y="243" text-anchor="middle" font-size="10.5" fill="#333">{1}</text>

  <!-- 结论框 -->
  <rect x="60" y="264" width="460" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="289" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">答案 = 堆顶 = 1</text>

  <!-- 过程可视化：堆的变化 -->
  <text x="40" y="326" font-size="11.5" fill="#888">堆状态变化（从大到小排列）：</text>

  <rect x="40" y="334" width="500" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="290" y="353" text-anchor="middle" font-size="10.5" fill="#333">[8, 7, 4, 2, 1, 1]</text>

  <rect x="40" y="366" width="500" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="290" y="385" text-anchor="middle" font-size="10.5" fill="#333">[4, 2, 1, 1, 1]   ← 8−7=1 入堆</text>

  <rect x="40" y="398" width="500" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="290" y="417" text-anchor="middle" font-size="10.5" fill="#333">[2, 1, 1, 1]      ← 4−2=2 入堆</text>

  <rect x="40" y="430" width="500" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="290" y="449" text-anchor="middle" font-size="10.5" fill="#333">[1, 1, 1] → [1]   ← 2−1=1 入堆，再 1−1 消失</text>

  <rect x="40" y="462" width="500" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="473" text-anchor="middle" font-size="9.5" fill="#b85450">最终剩余 [1]</text>
</svg>
