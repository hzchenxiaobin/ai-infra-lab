<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="620" height="480" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 15 → 逐 k 检验，命中 4 种写法</text>

  <!-- ===== 表格 ===== -->
  <!-- 表头 -->
  <rect x="30" y="44" width="560" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="60"  y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">k</text>
  <text x="130" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">k(k−1)/2</text>
  <text x="230" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">r = mod k</text>
  <text x="320" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">起点 a</text>
  <text x="460" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">连续序列</text>
  <text x="565" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">命中</text>

  <!-- Row k=1 -->
  <rect x="30" y="74" width="560" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60"  y="93" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">1</text>
  <text x="130" y="93" text-anchor="middle" font-size="11.5" fill="#333">0</text>
  <text x="230" y="93" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="320" y="93" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">15</text>
  <text x="460" y="93" text-anchor="middle" font-size="11" fill="#333">[15]</text>
  <text x="565" y="93" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- Row k=2 -->
  <rect x="30" y="106" width="560" height="30" fill="#f6f8fb" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60"  y="125" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">2</text>
  <text x="130" y="125" text-anchor="middle" font-size="11.5" fill="#333">1</text>
  <text x="230" y="125" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="320" y="125" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">7</text>
  <text x="460" y="125" text-anchor="middle" font-size="11" fill="#333">[7, 8]</text>
  <text x="565" y="125" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- Row k=3 -->
  <rect x="30" y="138" width="560" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60"  y="157" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">3</text>
  <text x="130" y="157" text-anchor="middle" font-size="11.5" fill="#333">3</text>
  <text x="230" y="157" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="320" y="157" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">4</text>
  <text x="460" y="157" text-anchor="middle" font-size="11" fill="#333">[4, 5, 6]</text>
  <text x="565" y="157" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- Row k=4 (miss) -->
  <rect x="30" y="170" width="560" height="30" fill="#f6f8fb" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60"  y="189" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">4</text>
  <text x="130" y="189" text-anchor="middle" font-size="11.5" fill="#333">6</text>
  <text x="230" y="189" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">1</text>
  <text x="320" y="189" text-anchor="middle" font-size="11.5" fill="#bbb">—</text>
  <text x="460" y="189" text-anchor="middle" font-size="11" fill="#bbb">—</text>
  <text x="565" y="189" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>

  <!-- Row k=5 -->
  <rect x="30" y="202" width="560" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60"  y="221" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">5</text>
  <text x="130" y="221" text-anchor="middle" font-size="11.5" fill="#333">10</text>
  <text x="230" y="221" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="320" y="221" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">1</text>
  <text x="460" y="221" text-anchor="middle" font-size="10.5" fill="#333">[1, 2, 3, 4, 5]</text>
  <text x="565" y="221" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- Row k=6 (stop) -->
  <rect x="30" y="234" width="560" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="60"  y="253" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">6</text>
  <text x="130" y="253" text-anchor="middle" font-size="10.5" fill="#b85450">k(k+1)/2 = 21 &gt; 15</text>
  <text x="230" y="253" text-anchor="middle" font-size="11" fill="#b85450">停止</text>
  <text x="320" y="253" text-anchor="middle" font-size="11.5" fill="#bbb">—</text>
  <text x="460" y="253" text-anchor="middle" font-size="11" fill="#bbb">—</text>
  <text x="565" y="253" text-anchor="middle" font-size="11" fill="#b85450">停</text>

  <!-- 结果 -->
  <path d="M 310 268 L 310 284" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="200" y="286" width="220" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="310" y="307" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">return 4  ✓</text>

  <!-- ===== 下方：4 种写法可视化 ===== -->
  <text x="310" y="344" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">15 的 4 种连续正整数写法</text>

  <!-- 写法 1: [15] -->
  <text x="40" y="370" font-size="11" fill="#4a7a3a" font-weight="bold">k=1</text>
  <g filter="url(#rough2)">
    <rect x="90" y="358" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <text x="107" y="375" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">15</text>
  </g>
  <text x="140" y="375" font-size="11" fill="#888">= 15</text>

  <!-- 写法 2: [7, 8] -->
  <text x="40" y="398" font-size="11" fill="#4a7a3a" font-weight="bold">k=2</text>
  <g filter="url(#rough2)">
    <rect x="90" y="386" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <text x="107" y="403" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>
    <rect x="128" y="386" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <text x="145" y="403" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">8</text>
  </g>
  <text x="178" y="403" font-size="11" fill="#888">= 7 + 8</text>

  <!-- 写法 3: [4, 5, 6] -->
  <text x="40" y="426" font-size="11" fill="#4a7a3a" font-weight="bold">k=3</text>
  <g filter="url(#rough2)">
    <rect x="90" y="414" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <text x="107" y="431" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
    <rect x="128" y="414" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <text x="145" y="431" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
    <rect x="166" y="414" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <text x="183" y="431" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>
  </g>
  <text x="216" y="431" font-size="11" fill="#888">= 4 + 5 + 6</text>

  <!-- 写法 4: [1, 2, 3, 4, 5] -->
  <text x="40" y="454" font-size="11" fill="#4a7a3a" font-weight="bold">k=5</text>
  <g filter="url(#rough2)">
    <rect x="90" y="442" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <text x="107" y="459" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
    <rect x="128" y="442" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <text x="145" y="459" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
    <rect x="166" y="442" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <text x="183" y="459" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
    <rect x="204" y="442" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <text x="221" y="459" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
    <rect x="242" y="442" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <text x="259" y="459" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  </g>
  <text x="292" y="459" font-size="11" fill="#888">= 1 + 2 + 3 + 4 + 5</text>
</svg>
