<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="360" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：score = [10, 3, 8, 9, 4]</text>

  <!-- ===== Table grid ===== -->
  <!-- outer border -->
  <rect x="40" y="52" width="570" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- header text -->
  <g font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="95" y="73">排序位置 pos</text>
    <text x="185" y="73">分数 sc</text>
    <text x="260" y="73">原下标 idx</text>
    <text x="375" y="73">名次</text>
    <text x="530" y="73">写入 answer[idx]</text>
  </g>

  <!-- vertical column separators (header + rows) -->
  <g stroke="#bbb" stroke-width="1" filter="url(#rough2)">
    <line x1="150" y1="52" x2="150" y2="252"/>
    <line x1="220" y1="52" x2="220" y2="252"/>
    <line x1="300" y1="52" x2="300" y2="252"/>
    <line x1="450" y1="52" x2="450" y2="252"/>
  </g>

  <!-- row backgrounds: medals (warm) for pos 0-2, numeric (green) for pos 3-4 -->
  <g filter="url(#rough2)">
    <rect x="40" y="84" width="570" height="30" rx="3" fill="#fff8e1" opacity="0.6"/>
    <rect x="40" y="114" width="570" height="30" rx="3" fill="#fff8e1" opacity="0.6"/>
    <rect x="40" y="144" width="570" height="30" rx="3" fill="#fff8e1" opacity="0.6"/>
    <rect x="40" y="174" width="570" height="30" rx="3" fill="#e6f4ea" opacity="0.6"/>
    <rect x="40" y="204" width="570" height="30" rx="3" fill="#e6f4ea" opacity="0.6"/>
  </g>
  <!-- outer + horizontal row borders -->
  <g stroke="#888" stroke-width="1" fill="none" filter="url(#rough2)">
    <rect x="40" y="84" width="570" height="168" rx="4"/>
    <line x1="40" y1="114" x2="610" y2="114"/>
    <line x1="40" y1="144" x2="610" y2="144"/>
    <line x1="40" y1="174" x2="610" y2="174"/>
    <line x1="40" y1="204" x2="610" y2="204"/>
  </g>

  <!-- data rows text -->
  <g font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <!-- pos 0 -->
    <text x="95" y="104">0（第1名）</text>
    <text x="185" y="104" font-size="14" font-weight="bold">10</text>
    <text x="260" y="104">0</text>
    <text x="375" y="104" fill="#5a3a00" font-weight="bold">"Gold Medal"</text>
    <text x="530" y="104" fill="#b85450">answer[0] = "Gold Medal"</text>
    <!-- pos 1 -->
    <text x="95" y="134">1（第2名）</text>
    <text x="185" y="134" font-size="14" font-weight="bold">9</text>
    <text x="260" y="134">3</text>
    <text x="375" y="134" fill="#5a3a00" font-weight="bold">"Silver Medal"</text>
    <text x="530" y="134" fill="#b85450">answer[3] = "Silver Medal"</text>
    <!-- pos 2 -->
    <text x="95" y="164">2（第3名）</text>
    <text x="185" y="164" font-size="14" font-weight="bold">8</text>
    <text x="260" y="164">2</text>
    <text x="375" y="164" fill="#5a3a00" font-weight="bold">"Bronze Medal"</text>
    <text x="530" y="164" fill="#b85450">answer[2] = "Bronze Medal"</text>
    <!-- pos 3 -->
    <text x="95" y="194">3（第4名）</text>
    <text x="185" y="194" font-size="14" font-weight="bold">4</text>
    <text x="260" y="194">4</text>
    <text x="375" y="194" fill="#2a4a2a" font-weight="bold">"4"</text>
    <text x="530" y="194" fill="#b85450">answer[4] = "4"</text>
    <!-- pos 4 -->
    <text x="95" y="224">4（第5名）</text>
    <text x="185" y="224" font-size="14" font-weight="bold">3</text>
    <text x="260" y="224">1</text>
    <text x="375" y="224" fill="#2a4a2a" font-weight="bold">"5"</text>
    <text x="530" y="224" fill="#b85450">answer[1] = "5"</text>
  </g>

  <!-- ===== Final answer array ===== -->
  <text x="60" y="284" font-size="13" fill="#555" filter="url(#rough2)">最终 answer</text>
  <g font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">
    <text x="130" y="284">i=0</text><text x="210" y="284">i=1</text><text x="290" y="284">i=2</text>
    <text x="370" y="284">i=3</text><text x="450" y="284">i=4</text>
  </g>
  <g stroke-width="1.5" filter="url(#rough2)">
    <rect x="96" y="294" width="68" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="176" y="294" width="68" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="256" y="294" width="68" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="336" y="294" width="68" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="416" y="294" width="68" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <g font-size="10" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="130" y="312">Gold</text>
    <text x="130" y="326">Medal</text>
    <text x="210" y="320" font-size="13">5</text>
    <text x="290" y="312">Bronze</text>
    <text x="290" y="326">Medal</text>
    <text x="370" y="312">Silver</text>
    <text x="370" y="326">Medal</text>
    <text x="450" y="320" font-size="13">4</text>
  </g>

  <text x="540" y="320" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
</svg>
