<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">等价视角与题目家族</text>

  <!-- Equivalence box -->
  <rect x="40" y="44" width="500" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="290" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">最少删除次数 = n − LPS(s) = n − LCS(s, reverse(s))</text>
  <text x="290" y="86" text-anchor="middle" font-size="11" fill="#446688">判定：dp[0][n−1] ≤ k  ⟺  LCS(s, reverse(s)) ≥ n − k</text>
  <text x="290" y="106" text-anchor="middle" font-size="10" fill="#888">删字符与插字符对称：让串成回文的最少删除数 = 最少插入数 = n − LPS</text>

  <!-- Progression title -->
  <text x="290" y="138" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">验证回文串三部曲（按容错预算 K 递增）</text>

  <!-- Box 125 -->
  <rect x="30" y="150" width="155" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="107" y="170" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">125 验证回文串</text>
  <text x="107" y="188" text-anchor="middle" font-size="10" fill="#4a7a3a">K = 0（零容错）</text>
  <text x="107" y="206" text-anchor="middle" font-size="10" fill="#555">双指针逐对比较</text>
  <text x="107" y="224" text-anchor="middle" font-size="10" fill="#4a7a3a">O(n)</text>
  <text x="107" y="238" text-anchor="middle" font-size="9" fill="#888">失配即判否</text>

  <!-- Arrow 125 -> 680 -->
  <path d="M 185 196 L 210 196" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="197" y="188" text-anchor="middle" font-size="8" fill="#888">K↑</text>

  <!-- Box 680 -->
  <rect x="210" y="150" width="155" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="287" y="170" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">680 验证回文串 II</text>
  <text x="287" y="188" text-anchor="middle" font-size="10" fill="#d6a040">K = 1（一次容错）</text>
  <text x="287" y="206" text-anchor="middle" font-size="10" fill="#555">首处失配二选一</text>
  <text x="287" y="224" text-anchor="middle" font-size="10" fill="#d6a040">O(n)</text>
  <text x="287" y="238" text-anchor="middle" font-size="9" fill="#888">分支后线性扫描</text>

  <!-- Arrow 680 -> 1216 -->
  <path d="M 365 196 L 390 196" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="377" y="188" text-anchor="middle" font-size="8" fill="#888">K↑</text>

  <!-- Box 1216 -->
  <rect x="390" y="150" width="155" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="467" y="170" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1216 验证回文串 III</text>
  <text x="467" y="188" text-anchor="middle" font-size="10" fill="#b85450">K = 任意（本题）</text>
  <text x="467" y="206" text-anchor="middle" font-size="10" fill="#555">区间 DP / 记忆化</text>
  <text x="467" y="224" text-anchor="middle" font-size="10" fill="#b85450">O(n²) / O(nk)</text>
  <text x="467" y="238" text-anchor="middle" font-size="9" fill="#888">最少删除 ≤ k ?</text>

  <!-- Family box -->
  <rect x="40" y="260" width="500" height="112" fill="#fff" stroke="#ddd" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="280" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">回文区间 DP 三姐妹（共用 dp[i+1][j−1] / max·min 转移）</text>

  <rect x="60" y="290" width="135" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="127" y="308" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">516 最长回文子序列</text>
  <text x="127" y="324" text-anchor="middle" font-size="9" fill="#4a7a3a">求 LPS 长度（max）</text>
  <text x="127" y="340" text-anchor="middle" font-size="9" fill="#888">dp = max(配对+2, 缩端)</text>
  <text x="127" y="354" text-anchor="middle" font-size="9" fill="#888">答案 = dp[0][n−1]</text>

  <rect x="215" y="290" width="135" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="282" y="308" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1312 最少插入次数</text>
  <text x="282" y="324" text-anchor="middle" font-size="9" fill="#d6a040">求 n − LPS（min）</text>
  <text x="282" y="340" text-anchor="middle" font-size="9" fill="#888">dp = min(缩端) + 1</text>
  <text x="282" y="354" text-anchor="middle" font-size="9" fill="#888">答案 = dp[0][n−1]</text>

  <rect x="370" y="290" width="135" height="68" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="437" y="308" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1216 验证回文串III</text>
  <text x="437" y="324" text-anchor="middle" font-size="9" fill="#b85450">n − LPS ≤ k（判定）</text>
  <text x="437" y="340" text-anchor="middle" font-size="9" fill="#888">dp = min(缩端) + 1</text>
  <text x="437" y="354" text-anchor="middle" font-size="9" fill="#888">答案 = dp[0][n−1] ≤ k</text>

  <!-- Bottom note -->
  <rect x="60" y="388" width="460" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="410" text-anchor="middle" font-size="10" fill="#555">1216 = 516 的「判定版」+ 680 的「K 泛化版」，转移结构与 1312 完全同构</text>
</svg>
