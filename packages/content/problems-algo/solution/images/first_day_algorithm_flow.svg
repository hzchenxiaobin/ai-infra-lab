<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：前缀和加速的线性 DP</text>

  <!-- Start node -->
  <rect x="200" y="46" width="160" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="18" filter="url(#rough2)"/>
  <text x="280" y="69" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">初始化 prefix[0] = 0</text>

  <!-- arrow down -->
  <path d="M 280 86 L 280 108" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Loop diamond -->
  <polygon points="280,110 380,160 280,210 180,160" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="156" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">i &lt; n − 1 ?</text>
  <text x="280" y="172" text-anchor="middle" font-size="10.5" fill="#888">(逐房间求 dp)</text>

  <!-- No branch: output -->
  <path d="M 380 160 L 470 160" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="396" y="154" font-size="10.5" fill="#888">否</text>
  <rect x="448" y="142" width="100" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="498" y="160" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">返回</text>
  <text x="498" y="174" text-anchor="middle" font-size="10.5" fill="#b85450">prefix[n−1]</text>

  <!-- Yes branch down -->
  <path d="M 280 210 L 280 232" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="290" y="226" font-size="10.5" fill="#888">是</text>

  <!-- Step A: read j -->
  <rect x="140" y="234" width="280" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="252" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">取 j = nextVisit[i]</text>
  <text x="280" y="266" text-anchor="middle" font-size="10.5" fill="#888">(j ≤ i，题目保证)</text>

  <path d="M 280 274 L 280 296" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step B: compute dp -->
  <rect x="80" y="298" width="400" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="318" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">dp[i] = (2 + prefix[i] − prefix[j] + MOD) % MOD</text>
  <text x="280" y="336" text-anchor="middle" font-size="10.5" fill="#888">+ MOD 防止取模后相减为负</text>

  <path d="M 280 348 L 280 370" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step C: update prefix -->
  <rect x="100" y="372" width="360" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="390" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">prefix[i+1] = (prefix[i] + dp[i]) % MOD</text>
  <text x="280" y="404" text-anchor="middle" font-size="10.5" fill="#888">i++，回到循环判断</text>

  <!-- loop back arrow -->
  <path d="M 100 392 Q 60 392 60 160 Q 60 130 180 160" stroke="#888" stroke-width="1.8" fill="none" stroke-dasharray="4,3" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Note box -->
  <rect x="60" y="426" width="440" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="443" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">答案 = Σ dp[0..n−2] = prefix[n−1]（首访房间 n−1 的那天）</text>
</svg>
