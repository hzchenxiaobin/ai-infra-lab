<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：只跟踪余数 R(L) mod k，不存天文数字</text>

  <!-- ===== Left: repunit sequence ===== -->
  <rect x="28" y="48" width="230" height="212" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="143" y="70" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">全 1 数（repunit）序列</text>

  <text x="44" y="96" font-size="12" fill="#333">R(1) = </text>
  <text x="92" y="96" font-size="13" fill="#446688" font-weight="bold">1</text>

  <text x="44" y="120" font-size="12" fill="#333">R(2) = </text>
  <text x="92" y="120" font-size="13" fill="#446688" font-weight="bold">11</text>

  <text x="44" y="144" font-size="12" fill="#333">R(3) = </text>
  <text x="92" y="144" font-size="13" fill="#446688" font-weight="bold">111</text>

  <text x="44" y="168" font-size="12" fill="#333">R(4) = </text>
  <text x="92" y="168" font-size="13" fill="#446688" font-weight="bold">1111</text>

  <text x="44" y="192" font-size="12" fill="#333">...</text>

  <text x="44" y="216" font-size="12" fill="#333">R(L) = </text>
  <text x="92" y="216" font-size="12.5" fill="#446688" font-weight="bold">111...1</text>
  <text x="148" y="216" font-size="10" fill="#888">(L 个 1)</text>

  <rect x="40" y="228" width="206" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="143" y="245" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">R(L) 有 L 位 → k=99999 时爆 64 位！</text>

  <!-- ===== Middle arrow: mod k ===== -->
  <line x1="262" y1="140" x2="286" y2="140" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="274" y="128" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">mod</text>
  <text x="274" y="158" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">k</text>

  <!-- ===== Right: remainder sequence ===== -->
  <rect x="290" y="48" width="222" height="212" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="401" y="70" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">只存余数 r = R(L) mod k</text>

  <text x="306" y="96" font-size="11.5" fill="#333">r₁ = </text>
  <text x="334" y="96" font-size="11.5" fill="#4a7a3a" font-weight="bold">1 % k</text>

  <text x="306" y="120" font-size="11.5" fill="#333">r₂ = </text>
  <text x="334" y="120" font-size="11.5" fill="#4a7a3a" font-weight="bold">(r₁·10+1) % k</text>

  <text x="306" y="144" font-size="11.5" fill="#333">r₃ = </text>
  <text x="334" y="144" font-size="11.5" fill="#4a7a3a" font-weight="bold">(r₂·10+1) % k</text>

  <text x="306" y="168" font-size="11.5" fill="#333">...</text>

  <text x="306" y="192" font-size="11.5" fill="#333">r_L = </text>
  <text x="334" y="192" font-size="11.5" fill="#4a7a3a" font-weight="bold">(r_{L−1}·10+1) % k</text>

  <rect x="306" y="210" width="190" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="401" y="228" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">r 始终 ∈ [0, k−1]</text>
  <text x="401" y="244" text-anchor="middle" font-size="10" fill="#888">永不溢出，O(1) 空间</text>

  <!-- ===== Bottom: recurrence formula ===== -->
  <rect x="40" y="278" width="460" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="300" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">递推：r = (r · 10 + 1) % k，从 r = 0 起；r = 0 时当前长度即答案</text>

  <!-- ===== Bottom note: -1 condition + pigeonhole ===== -->
  <rect x="40" y="322" width="222" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="151" y="340" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">返回 −1 的条件</text>
  <text x="151" y="358" text-anchor="middle" font-size="10.5" fill="#666">k % 2 == 0 或 k % 5 == 0</text>

  <rect x="278" y="322" width="222" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="389" y="340" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">终止保证（鸽笼原理）</text>
  <text x="389" y="358" text-anchor="middle" font-size="10.5" fill="#666">至多 k 步必命中 0（gcd=1 时）</text>
</svg>
