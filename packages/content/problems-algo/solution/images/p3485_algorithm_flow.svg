<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 424" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="424" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：建树 → 对每个 i 依次「删除 / 查询 / 恢复」</text>

  <!-- step A: build -->
  <rect x="130" y="34" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="49" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">建 Trie：全部串插入并逐节点计数 cnt；</text>
  <text x="260" y="62" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">统计 good[d]，初始化 best = 最大非零层</text>

  <path d="M 260 68 L 260 80" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- loop pill -->
  <rect x="200" y="84" width="120" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="11" filter="url(#rough2)"/>
  <text x="260" y="99" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">对每个 i = 0 … n−1</text>

  <path d="M 260 106 L 260 120" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- phase labels -->
  <text x="112" y="145" text-anchor="end" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 删</text>
  <text x="112" y="305" text-anchor="end" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 查</text>
  <text x="112" y="353" text-anchor="end" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">③ 恢复</text>

  <!-- B: delete phase -->
  <rect x="118" y="124" width="284" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="142" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">沿 words[i] 的 Trie 路径逐节点 cnt −−</text>

  <path d="M 260 152 L 260 168" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- C: diamond cnt == k? -->
  <polygon points="260,172 345,198 260,224 175,198" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="202" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">删除前 cnt 恰为 k？</text>

  <!-- no branch -->
  <path d="M 345 198 L 438 198 L 438 300 L 361 300" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="392" y="190" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">否：跳过该节点</text>

  <!-- yes branch -->
  <path d="M 260 224 L 260 236" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="270" y="234" font-size="9.5" fill="#b85450" filter="url(#rough2)">是</text>

  <!-- D: good update + best descend -->
  <rect x="118" y="238" width="284" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="252" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">good[dep] −−；若该层清零且 dep = best，</text>
  <text x="260" y="266" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">best 向下探到最近非零层（摊还 O(1)）</text>

  <path d="M 260 272 L 260 286" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- E: answer -->
  <rect x="163" y="288" width="194" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="305" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">answer[i] = best（恒 ≥ 0）</text>

  <path d="M 260 314 L 260 328" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- F: restore phase -->
  <rect x="118" y="332" width="284" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="346" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">沿路径逐节点 cnt ++；若回到 k：</text>
  <text x="260" y="360" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">good[dep] ++，best = max(best, dep)</text>

  <!-- loop back -->
  <path d="M 402 349 L 462 349 L 462 95 L 324 95" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="470" y="226" font-size="10" fill="#8a6d3b" filter="url(#rough2)">i+1</text>

  <!-- exit -->
  <path d="M 260 366 L 260 380" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="332" y="378" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">全部 i 完成</text>

  <!-- G: return -->
  <rect x="170" y="384" width="180" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="401" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">返回 answer</text>
</svg>
