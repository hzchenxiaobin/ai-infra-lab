<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：拓扑序的「层」= 一个学期</text>

  <!-- Semester bands (background) -->
  <rect x="50" y="74" width="140" height="290" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="5,3" rx="10" filter="url(#rough2)" opacity="0.55"/>
  <rect x="210" y="74" width="140" height="290" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" stroke-dasharray="5,3" rx="10" filter="url(#rough2)" opacity="0.55"/>
  <rect x="370" y="74" width="140" height="290" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="5,3" rx="10" filter="url(#rough2)" opacity="0.55"/>

  <!-- Semester labels -->
  <text x="120" y="68" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">第 1 学期 (layer 0)</text>
  <text x="280" y="68" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">第 2 学期 (layer 1)</text>
  <text x="440" y="68" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">第 3 学期 (layer 2)</text>

  <!-- Edges: 1->3, 2->3, 1->4, 3->5, 4->5 -->
  <path d="M 148 200 L 246 200" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 148 230 L 246 260" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 148 260 L 246 260" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 312 200 L 408 230" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 312 260 L 408 230" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Layer 0 nodes: 1, 2 -->
  <circle cx="120" cy="200" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="120" y="205" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <circle cx="120" cy="260" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="120" y="265" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>

  <!-- Layer 1 nodes: 3, 4 -->
  <circle cx="280" cy="200" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="205" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>

  <circle cx="280" cy="260" r="24" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="265" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>

  <!-- Layer 2 nodes: 5 -->
  <circle cx="440" cy="230" r="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="440" y="235" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>

  <!-- Indegree badges -->
  <circle cx="140" cy="188" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="140" y="192" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">0</text>

  <circle cx="140" cy="248" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="140" y="252" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">0</text>

  <circle cx="300" cy="188" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="300" y="192" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">2</text>

  <circle cx="300" cy="248" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="300" y="252" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">1</text>

  <circle cx="460" cy="218" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="460" y="222" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">2</text>

  <!-- legend for badges -->
  <rect x="470" y="320" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="490" y="332" font-size="11" fill="#555">角标=入度</text>

  <!-- Bottom note box -->
  <rect x="40" y="350" width="480" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="370" text-anchor="middle" font-size="11" fill="#444">每学期同时修完「当前入度全为 0」的一层 → 删边后下一层入度归 0</text>
  <text x="280" y="385" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">最少学期数 = 拓扑序的最大层数 = DAG 最长路径长度</text>
</svg>
