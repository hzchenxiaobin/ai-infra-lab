<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
  </defs>

  <rect width="600" height="300" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 15 反复替换至不动点</text>

  <!-- Header background -->
  <rect x="30" y="58" width="540" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- Terminating row background -->
  <rect x="30" y="224" width="540" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- Grid lines: verticals -->
  <line x1="80" y1="58" x2="80" y2="268" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="140" y1="58" x2="140" y2="268" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="310" y1="58" x2="310" y2="268" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="410" y1="58" x2="410" y2="268" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <!-- horizontals -->
  <line x1="30" y1="92" x2="570" y2="92" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="30" y1="136" x2="570" y2="136" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="180" x2="570" y2="180" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="30" y1="224" x2="570" y2="224" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <!-- outer border -->
  <rect x="30" y="58" width="540" height="210" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- Header text -->
  <text x="55" y="79" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">步</text>
  <text x="110" y="79" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">n</text>
  <text x="225" y="79" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">质因数分解</text>
  <text x="360" y="79" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">质因数之和</text>
  <text x="490" y="79" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">不动点？</text>

  <!-- Row 0: 15 -->
  <text x="55" y="118" text-anchor="middle" font-size="13" fill="#333">0</text>
  <text x="110" y="118" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">15</text>
  <text x="225" y="118" text-anchor="middle" font-size="12" fill="#333">3 × 5</text>
  <text x="360" y="118" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>
  <text x="490" y="118" text-anchor="middle" font-size="12" fill="#b85450">否（8 ≠ 15）</text>

  <!-- Row 1: 8 -->
  <text x="55" y="158" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="110" y="158" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>
  <text x="225" y="158" text-anchor="middle" font-size="12" fill="#333">2 × 2 × 2</text>
  <text x="360" y="158" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <text x="490" y="158" text-anchor="middle" font-size="12" fill="#b85450">否（6 ≠ 8）</text>

  <!-- Row 2: 6 -->
  <text x="55" y="202" text-anchor="middle" font-size="13" fill="#333">2</text>
  <text x="110" y="202" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <text x="225" y="202" text-anchor="middle" font-size="12" fill="#333">2 × 3</text>
  <text x="360" y="202" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <text x="490" y="202" text-anchor="middle" font-size="12" fill="#b85450">否（5 ≠ 6）</text>

  <!-- Row 3: 5 (terminate) -->
  <text x="55" y="246" text-anchor="middle" font-size="13" fill="#2f5d20">3</text>
  <text x="110" y="246" text-anchor="middle" font-size="13" fill="#2f5d20" font-weight="bold">5</text>
  <text x="225" y="246" text-anchor="middle" font-size="12" fill="#4a7a3a">（质数）</text>
  <text x="360" y="246" text-anchor="middle" font-size="13" fill="#2f5d20" font-weight="bold">5</text>
  <text x="490" y="246" text-anchor="middle" font-size="12" fill="#2f5d20" font-weight="bold">是 → 返回 5 ⭐</text>
</svg>
