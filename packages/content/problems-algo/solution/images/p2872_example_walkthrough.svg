<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="410" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：k = 6，values = [1,8,1,4,4]</text>

  <!-- tree edges -->
  <path d="M 150 76 L 150 120" stroke="#999" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 160 155 L 215 212" stroke="#999" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 78 244 L 78 286" stroke="#999" stroke-width="1.8" filter="url(#rough2)"/>
  <!-- cut edge -->
  <path d="M 140 155 L 86 215" stroke="#b85450" stroke-width="3" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="64" y="182" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">✂ 切！</text>

  <!-- tree nodes -->
  <circle cx="150" cy="56" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="61" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="150" y="92" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">值 1</text>
  <text x="182" y="52" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">S=18 ✓</text>

  <circle cx="150" cy="140" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="145" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="150" y="176" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">值 1</text>
  <text x="182" y="136" font-size="11" fill="#555" filter="url(#rough2)">S=17</text>

  <circle cx="78" cy="224" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="78" y="229" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="78" y="260" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">值 8</text>
  <text x="108" y="220" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">S=12 ✓</text>

  <circle cx="225" cy="224" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="225" y="229" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="225" y="260" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">值 4</text>
  <text x="255" y="220" font-size="11" fill="#555" filter="url(#rough2)">S=4</text>

  <circle cx="78" cy="306" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="78" y="311" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="78" y="342" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">值 4</text>
  <text x="108" y="302" font-size="11" fill="#555" filter="url(#rough2)">S=4</text>

  <!-- component legend -->
  <circle cx="52" cy="368" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="66" y="372" font-size="10.5" fill="#555" filter="url(#rough2)">块 {1,3} 和 12 ✓</text>
  <circle cx="190" cy="368" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="204" y="372" font-size="10.5" fill="#555" filter="url(#rough2)">块 {0,2,4} 和 6 ✓</text>

  <text x="155" y="396" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">后序处理：3 → 1 → 4 → 2 → 0</text>

  <!-- computation table -->
  <rect x="300" y="48" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="348" y="48" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="412" y="48" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="468" y="48" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="324" y="69" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">节点</text>
  <text x="380" y="69" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">S(u)</text>
  <text x="440" y="69" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">mod 6</text>
  <text x="528" y="69" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">动作</text>

  <!-- row 1: node 3 -->
  <rect x="300" y="82" width="288" height="34" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="324" y="103" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">3</text>
  <text x="380" y="103" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">4</text>
  <text x="440" y="103" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="476" y="103" font-size="11" fill="#555" filter="url(#rough2)">上推 4 给 1</text>

  <!-- row 2: node 1 (cut!) -->
  <rect x="300" y="116" width="288" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="324" y="137" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="380" y="137" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">12</text>
  <text x="440" y="137" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="476" y="137" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">切 (1,2)！ans=1</text>

  <!-- row 3: node 4 -->
  <rect x="300" y="150" width="288" height="34" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="324" y="171" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">4</text>
  <text x="380" y="171" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">4</text>
  <text x="440" y="171" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="476" y="171" font-size="11" fill="#555" filter="url(#rough2)">上推 4 给 2</text>

  <!-- row 4: node 2 -->
  <rect x="300" y="184" width="288" height="34" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="324" y="205" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">2</text>
  <text x="380" y="205" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">17</text>
  <text x="440" y="205" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="476" y="205" font-size="11" fill="#555" filter="url(#rough2)">上推 17 给 0</text>

  <!-- row 5: node 0 (root) -->
  <rect x="300" y="218" width="288" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="324" y="239" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="380" y="239" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">18</text>
  <text x="440" y="239" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="476" y="239" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">根=最后一块，ans=2</text>

  <!-- conclusion box -->
  <rect x="300" y="270" width="288" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="444" y="294" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">答案 = #{ S(u) ≡ 0 (mod 6) } = 2</text>
  <text x="444" y="318" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">S(1) = 12 ✓、S(0) = 18 ✓（根）</text>
  <text x="444" y="342" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">切口只有 (1,2) 一处，两块均合法</text>
</svg>
