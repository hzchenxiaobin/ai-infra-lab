<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
  </defs>
  <rect width="860" height="460" fill="#fdfcf7"/>

  <text x="430" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：the cattle was rattled by the battery</text>
  <path d="M 260 40 Q 430 48 600 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="430" y="58" text-anchor="middle" font-size="11" fill="#888">dictionary = ["cat","bat","rat"] → 输出 "the cat was rat by the bat"</text>

  <!-- ===== Table header ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="78" width="780" height="30" rx="4" fill="#f6f6f6" stroke="#ccc" stroke-width="1"/>
  </g>
  <g font-size="11" font-weight="bold" fill="#444" text-anchor="middle">
    <text x="65" y="98">#</text>
    <text x="150" y="98">原词</text>
    <text x="430" y="98">Trie 走法</text>
    <text x="720" y="98">替换为</text>
  </g>
  <line x1="90" y1="78" x2="90" y2="108" stroke="#ddd" stroke-width="1" filter="url(#sk)"/>
  <line x1="210" y1="78" x2="210" y2="108" stroke="#ddd" stroke-width="1" filter="url(#sk)"/>
  <line x1="650" y1="78" x2="650" y2="108" stroke="#ddd" stroke-width="1" filter="url(#sk)"/>

  <!-- ===== Row 1: the ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="112" width="780" height="34" rx="3" fill="#fdfcf7" stroke="#e8e8e8" stroke-width="1"/>
    <rect x="650" y="112" width="170" height="34" rx="3" fill="#e8f0fa" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="65" y="134" text-anchor="middle" font-size="11" fill="#888">1</text>
  <text x="150" y="134" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">the</text>
  <text x="225" y="134" font-size="11">
    <tspan fill="#a03040" font-weight="bold">t</tspan>
    <tspan fill="#555"> → root 无 t 子节点 ✗（原样保留）</tspan>
  </text>
  <text x="720" y="134" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">the</text>

  <!-- ===== Row 2: cattle ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="148" width="780" height="34" rx="3" fill="#f6fbf6" stroke="#e8e8e8" stroke-width="1"/>
    <rect x="650" y="148" width="170" height="34" rx="3" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.8"/>
  </g>
  <text x="65" y="170" text-anchor="middle" font-size="11" fill="#888">2</text>
  <text x="150" y="170" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">cattle</text>
  <text x="225" y="170" font-size="11">
    <tspan fill="#2e8b57" font-weight="bold">c → a → t★</tspan>
    <tspan fill="#555"> 命中（第 3 字符遇 is_end，剩余 "tle" 不再走）</tspan>
  </text>
  <text x="720" y="170" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">cat</text>

  <!-- ===== Row 3: was ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="184" width="780" height="34" rx="3" fill="#fdfcf7" stroke="#e8e8e8" stroke-width="1"/>
    <rect x="650" y="184" width="170" height="34" rx="3" fill="#e8f0fa" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="65" y="206" text-anchor="middle" font-size="11" fill="#888">3</text>
  <text x="150" y="206" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">was</text>
  <text x="225" y="206" font-size="11">
    <tspan fill="#a03040" font-weight="bold">w</tspan>
    <tspan fill="#555"> → root 无 w 子节点 ✗</tspan>
  </text>
  <text x="720" y="206" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">was</text>

  <!-- ===== Row 4: rattled ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="220" width="780" height="34" rx="3" fill="#f6fbf6" stroke="#e8e8e8" stroke-width="1"/>
    <rect x="650" y="220" width="170" height="34" rx="3" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.8"/>
  </g>
  <text x="65" y="242" text-anchor="middle" font-size="11" fill="#888">4</text>
  <text x="150" y="242" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">rattled</text>
  <text x="225" y="242" font-size="11">
    <tspan fill="#2e8b57" font-weight="bold">r → a → t★</tspan>
    <tspan fill="#555"> 命中（剩余 "tled" 不再走）</tspan>
  </text>
  <text x="720" y="242" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">rat</text>

  <!-- ===== Row 5: by ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="256" width="780" height="34" rx="3" fill="#fdfcf7" stroke="#e8e8e8" stroke-width="1"/>
    <rect x="650" y="256" width="170" height="34" rx="3" fill="#e8f0fa" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="65" y="278" text-anchor="middle" font-size="11" fill="#888">5</text>
  <text x="150" y="278" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">by</text>
  <text x="225" y="278" font-size="11">
    <tspan fill="#2e8b57" font-weight="bold">b</tspan>
    <tspan fill="#555"> → </tspan>
    <tspan fill="#a03040" font-weight="bold">y</tspan>
    <tspan fill="#555"> ✗（b 下只有 a 子节点，无 y）</tspan>
  </text>
  <text x="720" y="278" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">by</text>

  <!-- ===== Row 6: the ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="292" width="780" height="34" rx="3" fill="#fdfcf7" stroke="#e8e8e8" stroke-width="1"/>
    <rect x="650" y="292" width="170" height="34" rx="3" fill="#e8f0fa" stroke="#446688" stroke-width="1.2"/>
  </g>
  <text x="65" y="314" text-anchor="middle" font-size="11" fill="#888">6</text>
  <text x="150" y="314" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">the</text>
  <text x="225" y="314" font-size="11">
    <tspan fill="#a03040" font-weight="bold">t</tspan>
    <tspan fill="#555"> → root 无 t 子节点 ✗</tspan>
  </text>
  <text x="720" y="314" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">the</text>

  <!-- ===== Row 7: battery ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="328" width="780" height="34" rx="3" fill="#f6fbf6" stroke="#e8e8e8" stroke-width="1"/>
    <rect x="650" y="328" width="170" height="34" rx="3" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.8"/>
  </g>
  <text x="65" y="350" text-anchor="middle" font-size="11" fill="#888">7</text>
  <text x="150" y="350" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">battery</text>
  <text x="225" y="350" font-size="11">
    <tspan fill="#2e8b57" font-weight="bold">b → a → t★</tspan>
    <tspan fill="#555"> 命中（剩余 "tery" 不再走）</tspan>
  </text>
  <text x="720" y="350" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">bat</text>

  <!-- ===== Final result ===== -->
  <line x1="40" y1="380" x2="820" y2="380" stroke="#eee" stroke-width="1" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="170" y="396" width="520" height="44" rx="8" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.8"/>
  </g>
  <text x="430" y="416" text-anchor="middle" font-size="11" fill="#2e6e2e">用空格连接各词 →</text>
  <text x="430" y="434" text-anchor="middle" font-size="14" fill="#2e6e2e" font-weight="bold">"the cat was rat by the bat" ✓</text>
</svg>
