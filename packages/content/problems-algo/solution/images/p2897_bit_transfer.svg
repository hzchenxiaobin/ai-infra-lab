<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察 1：一次操作 = 在元素之间「搬运」位</text>

  <!-- 操作说明框 -->
  <rect x="60" y="42" width="440" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="12" fill="#333">同时更新：nums[i] ← nums[i] AND nums[j]，nums[j] ← nums[i] OR nums[j]</text>

  <!-- 操作前：a=6, b=5 -->
  <text x="140" y="100" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">操作前</text>
  <text x="60" y="122" font-size="12" fill="#555">nums[i] = 6</text>
  <rect x="150" y="104" width="34" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="167" y="124" text-anchor="middle" font-size="13" fill="#999">0</text>
  <rect x="184" y="104" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="201" y="124" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="218" y="104" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="235" y="124" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="262" y="124" font-size="11" fill="#999">← bit1、bit2 有 1</text>

  <text x="420" y="122" font-size="12" fill="#555">nums[j] = 5</text>
  <rect x="310" y="104" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="327" y="124" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="344" y="104" width="34" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="361" y="124" text-anchor="middle" font-size="13" fill="#999">0</text>
  <rect x="378" y="104" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="395" y="124" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="420" y="140" font-size="11" fill="#999">← bit0、bit2 有 1</text>

  <!-- bit 箭头：bit1 从 i 搬到 j -->
  <path d="M 201 96 C 230 66, 330 66, 360 98" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">bit1：i 有、j 无 → 搬给 j</text>

  <!-- 位标签 -->
  <text x="167" y="146" text-anchor="middle" font-size="10" fill="#999">bit2</text>
  <text x="201" y="146" text-anchor="middle" font-size="10" fill="#999">bit1</text>
  <text x="235" y="146" text-anchor="middle" font-size="10" fill="#999">bit0</text>
  <text x="327" y="146" text-anchor="middle" font-size="10" fill="#999">bit2</text>
  <text x="361" y="146" text-anchor="middle" font-size="10" fill="#999">bit1</text>
  <text x="395" y="146" text-anchor="middle" font-size="10" fill="#999">bit0</text>

  <!-- 操作后：AND=4, OR=7 -->
  <text x="140" y="180" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">操作后</text>
  <text x="40" y="202" font-size="12" fill="#555">AND → 4</text>
  <rect x="150" y="184" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="167" y="204" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="184" y="184" width="34" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="201" y="204" text-anchor="middle" font-size="13" fill="#999">0</text>
  <rect x="218" y="184" width="34" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="235" y="204" text-anchor="middle" font-size="13" fill="#999">0</text>

  <text x="404" y="202" font-size="12" fill="#555">OR → 7</text>
  <rect x="310" y="184" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="327" y="204" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="344" y="184" width="34" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="361" y="204" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="378" y="184" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="395" y="204" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="416" y="218" font-size="11" fill="#999">← bit1 落到 j</text>

  <!-- 不变量表格 -->
  <text x="280" y="248" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">逐位核对「1 的总数」：</text>

  <rect x="150" y="258" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="276" text-anchor="middle" font-size="12" fill="#333">位</text>
  <rect x="230" y="258" width="90" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="275" y="276" text-anchor="middle" font-size="12" fill="#333">操作前</text>
  <rect x="320" y="258" width="90" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="365" y="276" text-anchor="middle" font-size="12" fill="#333">操作后</text>

  <rect x="150" y="284" width="80" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="302" text-anchor="middle" font-size="12" fill="#333">bit2</text>
  <rect x="230" y="284" width="90" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="275" y="302" text-anchor="middle" font-size="12" fill="#333">1 + 1 = 2</text>
  <rect x="320" y="284" width="90" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="365" y="302" text-anchor="middle" font-size="12" fill="#333">1 + 1 = 2</text>

  <rect x="150" y="310" width="80" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="328" text-anchor="middle" font-size="12" fill="#333">bit1</text>
  <rect x="230" y="310" width="90" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="275" y="328" text-anchor="middle" font-size="12" fill="#333">1 + 0 = 1</text>
  <rect x="320" y="310" width="90" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="365" y="328" text-anchor="middle" font-size="12" fill="#333">0 + 1 = 1</text>

  <rect x="150" y="336" width="80" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="354" text-anchor="middle" font-size="12" fill="#333">bit0</text>
  <rect x="230" y="336" width="90" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="275" y="354" text-anchor="middle" font-size="12" fill="#333">0 + 1 = 1</text>
  <rect x="320" y="336" width="90" height="26" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="365" y="354" text-anchor="middle" font-size="12" fill="#333">0 + 1 = 1</text>

  <!-- 结论框 -->
  <rect x="40" y="378" width="480" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="396" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">每个二进制位上 1 的总数是全程不变量 cnt[b]</text>
  <text x="280" y="412" text-anchor="middle" font-size="11" fill="#b85450">数组数值会变，但「位的库存清单」永远不变——这才是问题的本体</text>
</svg>
