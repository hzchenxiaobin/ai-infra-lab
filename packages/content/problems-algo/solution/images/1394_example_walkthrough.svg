<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：arr = [1, 2, 2, 3, 3, 3]</text>
  <text x="310" y="42" text-anchor="middle" font-size="11" fill="#888">逐元素扫描建频次表，再逐键判定 freq[v]==v 取最大</text>

  <!-- counting table -->
  <text x="70" y="66" font-size="12" fill="#444" font-weight="bold">阶段一：扫描 arr，freq 逐步累加</text>

  <!-- header -->
  <rect x="70" y="72" width="480" height="24" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="110" y="88" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">步骤</text>
  <text x="190" y="88" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">元素</text>
  <text x="280" y="88" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">freq[1]</text>
  <text x="380" y="88" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">freq[2]</text>
  <text x="490" y="88" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">freq[3]</text>

  <!-- step rows: 步骤 / 元素 / f[1] / f[2] / f[3] -->
  <!-- step0 -->
  <rect x="70" y="98" width="480" height="22" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="110" y="113" text-anchor="middle" font-size="10" fill="#777">0</text>
  <text x="190" y="113" text-anchor="middle" font-size="10" fill="#777">—</text>
  <text x="280" y="113" text-anchor="middle" font-size="10" fill="#bbb">0</text>
  <text x="380" y="113" text-anchor="middle" font-size="10" fill="#bbb">0</text>
  <text x="490" y="113" text-anchor="middle" font-size="10" fill="#bbb">0</text>
  <!-- step1: elem 1, f[1]=1 -->
  <rect x="70" y="122" width="480" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="110" y="137" text-anchor="middle" font-size="10" fill="#555">1</text>
  <rect x="170" y="125" width="40" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="190" y="137" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">1</text>
  <text x="280" y="137" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">1</text>
  <text x="380" y="137" text-anchor="middle" font-size="10" fill="#bbb">0</text>
  <text x="490" y="137" text-anchor="middle" font-size="10" fill="#bbb">0</text>
  <!-- step2: elem 2, f[2]=1 -->
  <rect x="70" y="146" width="480" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="110" y="161" text-anchor="middle" font-size="10" fill="#555">2</text>
  <rect x="170" y="149" width="40" height="16" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="190" y="161" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="280" y="161" text-anchor="middle" font-size="10" fill="#446688">1</text>
  <text x="380" y="161" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="490" y="161" text-anchor="middle" font-size="10" fill="#bbb">0</text>
  <!-- step3: elem 2, f[2]=2 -->
  <rect x="70" y="170" width="480" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="110" y="185" text-anchor="middle" font-size="10" fill="#555">3</text>
  <rect x="170" y="173" width="40" height="16" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="190" y="185" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="280" y="185" text-anchor="middle" font-size="10" fill="#446688">1</text>
  <text x="380" y="185" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="490" y="185" text-anchor="middle" font-size="10" fill="#bbb">0</text>
  <!-- step4: elem 3, f[3]=1 -->
  <rect x="70" y="194" width="480" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="110" y="209" text-anchor="middle" font-size="10" fill="#555">4</text>
  <rect x="170" y="197" width="40" height="16" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="190" y="209" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">3</text>
  <text x="280" y="209" text-anchor="middle" font-size="10" fill="#446688">1</text>
  <text x="380" y="209" text-anchor="middle" font-size="10" fill="#4a7a3a">2</text>
  <text x="490" y="209" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">1</text>
  <!-- step5: elem 3, f[3]=2 -->
  <rect x="70" y="218" width="480" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="110" y="233" text-anchor="middle" font-size="10" fill="#555">5</text>
  <rect x="170" y="221" width="40" height="16" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="190" y="233" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">3</text>
  <text x="280" y="233" text-anchor="middle" font-size="10" fill="#446688">1</text>
  <text x="380" y="233" text-anchor="middle" font-size="10" fill="#4a7a3a">2</text>
  <text x="490" y="233" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">2</text>
  <!-- step6: elem 3, f[3]=3 (final) -->
  <rect x="70" y="242" width="480" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="110" y="258" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">6</text>
  <rect x="170" y="245" width="40" height="18" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="190" y="258" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">3</text>
  <text x="280" y="258" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <text x="380" y="258" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="490" y="258" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>

  <!-- arrow down to phase 2 -->
  <path d="M 310 270 L 310 286" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="322" y="282" font-size="10" fill="#666">建表完成，逐键判定</text>

  <!-- phase 2: check table -->
  <text x="70" y="304" font-size="12" fill="#444" font-weight="bold">阶段二：遍历 freq 的键，判定 freq[v]==v，维护最大</text>

  <!-- header -->
  <rect x="140" y="310" width="340" height="24" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="175" y="326" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">v</text>
  <text x="250" y="326" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">freq[v]</text>
  <text x="335" y="326" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">v == freq?</text>
  <text x="430" y="326" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">幸运?</text>

  <!-- row v=1 -->
  <rect x="140" y="336" width="340" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="175" y="354" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <text x="250" y="354" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <text x="335" y="354" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1==1 ✓</text>
  <text x="430" y="354" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <!-- row v=2 -->
  <rect x="140" y="364" width="340" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="175" y="382" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="250" y="382" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="335" y="382" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2==2 ✓</text>
  <text x="430" y="382" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <!-- row v=3 (max) -->
  <rect x="140" y="392" width="340" height="26" rx="4" fill="#fff8e1" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="175" y="410" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>
  <text x="250" y="410" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>
  <text x="335" y="410" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3==3 ✓</text>
  <text x="430" y="410" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✓ 最大</text>

  <!-- result -->
  <rect x="140" y="430" width="340" height="30" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="450" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">ans = max(-1, 1, 2, 3) = 3</text>
</svg>
