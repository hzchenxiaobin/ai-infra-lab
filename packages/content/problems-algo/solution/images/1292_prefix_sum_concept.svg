<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">二维前缀和：任意 k×k 正方形区域和 O(1) 查询（容斥）</text>

  <!-- ====== Inclusion-exclusion diagram ====== -->
  <!-- Entire rectangle = P[r2+1][c2+1] : green "+" -->
  <rect x="110" y="66" width="300" height="210" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3" filter="url(#rough2)"/>

  <!-- Top strip = P[r1][c2+1] : blue "−" -->
  <rect x="110" y="66" width="300" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>

  <!-- Left strip = P[r2+1][c1] : blue "−" -->
  <rect x="110" y="66" width="100" height="210" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="3" filter="url(#rough2)"/>

  <!-- Top-left corner (overlap) = P[r1][c1] : green "+" (added back) -->
  <rect x="110" y="66" width="100" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>

  <!-- k×k square region (bottom-right) : orange -->
  <rect x="210" y="146" width="200" height="130" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="3" filter="url(#rough2)"/>
  <text x="310" y="200" text-anchor="middle" font-size="15" fill="#a87020" font-weight="bold">k × k 正方形</text>
  <text x="310" y="220" text-anchor="middle" font-size="12" fill="#a87020">区域和（所求）</text>

  <!-- signs -->
  <text x="160" y="108" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold">+</text>
  <text x="160" y="108" text-anchor="middle" font-size="10" fill="#4a7a3a">P[r1][c1]</text>

  <text x="340" y="92" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold">−</text>
  <text x="340" y="108" text-anchor="middle" font-size="10" fill="#446688">P[r1][c2+1]</text>

  <text x="150" y="200" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold">−</text>
  <text x="150" y="216" text-anchor="middle" font-size="10" fill="#446688">P[r2+1][c1]</text>

  <text x="360" y="300" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold">+</text>
  <text x="360" y="316" text-anchor="middle" font-size="10" fill="#4a7a3a">P[r2+1][c2+1]</text>

  <!-- axis hints -->
  <text x="110" y="60" font-size="10" fill="#aaa">行 r1</text>
  <text x="210" y="60" font-size="10" fill="#aaa">行 r2</text>
  <text x="104" y="150" text-anchor="end" font-size="10" fill="#aaa">列 c1</text>
  <text x="204" y="150" text-anchor="end" font-size="10" fill="#aaa">列 c2</text>

  <!-- divider -->
  <path d="M 40 340 L 520 340" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Formula box -->
  <rect x="70" y="352" width="420" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="378" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">
    sum = P[r2+1][c2+1] − P[r1][c2+1] − P[r2+1][c1] + P[r1][c1]
  </text>
</svg>
