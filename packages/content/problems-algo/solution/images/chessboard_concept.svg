<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M 0 0 L 4 8 L 8 0 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M 0 0 L 4 8 L 8 0 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：行列交换只重排，行/列的「模式集合」不变</text>

  <!-- ===== 左：合法棋盘，仅两类互补行 ===== -->
  <text x="40" y="60" font-size="12" fill="#4a7a3a" font-weight="bold">合法棋盘：行只有 A 与 ~A 两类，交替排列</text>

  <!-- 4x4 grid, cell 36px, origin (40,72) -->
  <!-- row0 A = 1 0 1 0 -->
  <rect x="40" y="72" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="58" y="96" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="76" y="72" width="36" height="36" fill="#fafafa" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="94" y="96" text-anchor="middle" font-size="13" fill="#999" font-weight="bold">0</text>
  <rect x="112" y="72" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="96" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="148" y="72" width="36" height="36" fill="#fafafa" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="166" y="96" text-anchor="middle" font-size="13" fill="#999" font-weight="bold">0</text>
  <text x="194" y="94" font-size="12" fill="#446688" font-weight="bold">A</text>

  <!-- row1 ~A = 0 1 0 1 -->
  <rect x="40" y="108" width="36" height="36" fill="#fafafa" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="58" y="132" text-anchor="middle" font-size="13" fill="#999" font-weight="bold">0</text>
  <rect x="76" y="108" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="94" y="132" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="112" y="108" width="36" height="36" fill="#fafafa" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="132" text-anchor="middle" font-size="13" fill="#999" font-weight="bold">0</text>
  <rect x="148" y="108" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="166" y="132" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="194" y="130" font-size="12" fill="#b85450" font-weight="bold">~A</text>

  <!-- row2 A -->
  <rect x="40" y="144" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="58" y="168" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="76" y="144" width="36" height="36" fill="#fafafa" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="94" y="168" text-anchor="middle" font-size="13" fill="#999" font-weight="bold">0</text>
  <rect x="112" y="144" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="168" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="148" y="144" width="36" height="36" fill="#fafafa" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="166" y="168" text-anchor="middle" font-size="13" fill="#999" font-weight="bold">0</text>
  <text x="194" y="166" font-size="12" fill="#446688" font-weight="bold">A</text>

  <!-- row3 ~A -->
  <rect x="40" y="180" width="36" height="36" fill="#fafafa" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="58" y="204" text-anchor="middle" font-size="13" fill="#999" font-weight="bold">0</text>
  <rect x="76" y="180" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="94" y="204" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="112" y="180" width="36" height="36" fill="#fafafa" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="204" text-anchor="middle" font-size="13" fill="#999" font-weight="bold">0</text>
  <rect x="148" y="180" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="166" y="204" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="194" y="202" font-size="12" fill="#b85450" font-weight="bold">~A</text>

  <!-- swap arrows: row swap + col swap -->
  <path d="M 232 126 L 268 126" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="250" y="120" text-anchor="middle" font-size="10" fill="#4a7a3a">交换</text>
  <text x="250" y="140" text-anchor="middle" font-size="10" fill="#888">两行/两列</text>

  <!-- ===== 右：交换后仍是两类行 ===== -->
  <text x="300" y="60" font-size="12" fill="#446688" font-weight="bold">交换后：行集合不变，仍只是 {A, ~A}</text>
  <!-- reordered grid: ~A, A, ~A, A -->
  <rect x="300" y="72" width="36" height="36" fill="#fafafa" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="318" y="96" text-anchor="middle" font-size="13" fill="#999" font-weight="bold">0</text>
  <rect x="336" y="72" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="354" y="96" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="372" y="72" width="36" height="36" fill="#fafafa" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="390" y="96" text-anchor="middle" font-size="13" fill="#999" font-weight="bold">0</text>
  <rect x="408" y="72" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="426" y="96" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="454" y="94" font-size="12" fill="#b85450" font-weight="bold">~A</text>

  <rect x="300" y="108" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="318" y="132" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="336" y="108" width="36" height="36" fill="#fafafa" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="354" y="132" text-anchor="middle" font-size="13" fill="#999" font-weight="bold">0</text>
  <rect x="372" y="108" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="390" y="132" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="408" y="108" width="36" height="36" fill="#fafafa" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="426" y="132" text-anchor="middle" font-size="13" fill="#999" font-weight="bold">0</text>
  <text x="454" y="130" font-size="12" fill="#446688" font-weight="bold">A</text>

  <rect x="300" y="144" width="36" height="36" fill="#fafafa" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="318" y="168" text-anchor="middle" font-size="13" fill="#999" font-weight="bold">0</text>
  <rect x="336" y="144" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="354" y="168" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="372" y="144" width="36" height="36" fill="#fafafa" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="390" y="168" text-anchor="middle" font-size="13" fill="#999" font-weight="bold">0</text>
  <rect x="408" y="144" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="426" y="168" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="454" y="166" font-size="12" fill="#b85450" font-weight="bold">~A</text>

  <rect x="300" y="180" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="318" y="204" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="336" y="180" width="36" height="36" fill="#fafafa" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="354" y="204" text-anchor="middle" font-size="13" fill="#999" font-weight="bold">0</text>
  <rect x="372" y="180" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="390" y="204" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="408" y="180" width="36" height="36" fill="#fafafa" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="426" y="204" text-anchor="middle" font-size="13" fill="#999" font-weight="bold">0</text>
  <text x="454" y="202" font-size="12" fill="#446688" font-weight="bold">A</text>

  <!-- ===== 中下：非法情形（出现第三类行） ===== -->
  <text x="40" y="246" font-size="12" fill="#b85450" font-weight="bold">非法：出现第三类行 → 怎么交换都消不掉，返回 -1</text>
  <!-- 3-row mini board -->
  <rect x="40" y="258" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="278" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="72" y="258" width="32" height="30" fill="#fafafa" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="88" y="278" text-anchor="middle" font-size="12" fill="#999" font-weight="bold">0</text>
  <rect x="104" y="258" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="278" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="136" y="258" width="32" height="30" fill="#fafafa" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="152" y="278" text-anchor="middle" font-size="12" fill="#999" font-weight="bold">0</text>
  <text x="176" y="276" font-size="11" fill="#446688" font-weight="bold">A</text>

  <rect x="40" y="288" width="32" height="30" fill="#fafafa" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="308" text-anchor="middle" font-size="12" fill="#999" font-weight="bold">0</text>
  <rect x="72" y="288" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="88" y="308" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="104" y="288" width="32" height="30" fill="#fafafa" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="308" text-anchor="middle" font-size="12" fill="#999" font-weight="bold">0</text>
  <rect x="136" y="288" width="32" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="152" y="308" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="176" y="306" font-size="11" fill="#b85450" font-weight="bold">~A</text>

  <!-- third pattern row, highlighted red -->
  <rect x="40" y="318" width="32" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="56" y="338" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <rect x="72" y="318" width="32" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="88" y="338" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <rect x="104" y="318" width="32" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="120" y="338" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <rect x="136" y="318" width="32" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="152" y="338" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <text x="176" y="336" font-size="11" fill="#b85450" font-weight="bold">C ✗</text>

  <!-- invariant formula box -->
  <rect x="230" y="258" width="300" height="90" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="380" y="280" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">不变量（充要条件）</text>
  <text x="380" y="302" text-anchor="middle" font-size="11.5" fill="#333">board[0][0] ^ board[0][j]</text>
  <text x="380" y="318" text-anchor="middle" font-size="11.5" fill="#333">      ^ board[i][0] ^ board[i][j] == 0</text>
  <text x="380" y="338" text-anchor="middle" font-size="10.5" fill="#888">任意两行要么全同、要么全反；列亦然</text>

  <!-- legend -->
  <rect x="40" y="362" width="12" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="58" y="372" font-size="10" fill="#666">行模式 A</text>
  <rect x="120" y="362" width="12" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="138" y="372" font-size="10" fill="#666">非法第三类</text>
  <text x="230" y="372" font-size="10" fill="#888">「行/列只两类互补」是可化为棋盘的充要前提，交换无法改变模式种类</text>
</svg>
