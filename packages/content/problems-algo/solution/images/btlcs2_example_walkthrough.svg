<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 root=[2,1,3] 递归演算</text>

  <!-- Edges -->
  <line x1="270" y1="92" x2="170" y2="180" stroke="#888" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="270" y1="92" x2="370" y2="180" stroke="#888" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- Node 2 (root) -->
  <circle cx="270" cy="70" r="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="270" y="75" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">inc=2, dec=2 → 折弯=3 ✓</text>

  <!-- Node 1 (left) -->
  <circle cx="170" cy="200" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="170" y="205" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="170" y="240" text-anchor="middle" font-size="11" fill="#4a7a3a">叶子: inc=1, dec=1</text>
  <text x="170" y="255" text-anchor="middle" font-size="11" fill="#4a7a3a">折弯=1</text>

  <!-- Node 3 (right) -->
  <circle cx="370" cy="200" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="370" y="205" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <text x="370" y="240" text-anchor="middle" font-size="11" fill="#446688">叶子: inc=1, dec=1</text>
  <text x="370" y="255" text-anchor="middle" font-size="11" fill="#446688">折弯=1</text>

  <!-- Edge relation labels -->
  <text x="195" y="140" font-size="10" fill="#4a7a3a">1=2−1 (接 dec)</text>
  <text x="305" y="140" font-size="10" fill="#446688">3=2+1 (接 inc)</text>

  <!-- Computation box for node 2 -->
  <rect x="50" y="285" width="440" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="270" y="307" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">node 2 汇总（v=2）</text>
  <text x="270" y="327" text-anchor="middle" font-size="11" fill="#555">左 1=v−1 → 取 ld=1；右 3=v+1 → 取 ri=1</text>
  <text x="270" y="345" text-anchor="middle" font-size="11" fill="#555">inc = 1 + max(0, ri=1) = 2</text>
  <text x="270" y="361" text-anchor="middle" font-size="11" fill="#555">dec = 1 + max(ld=1, 0) = 2  →  ans = 2+2−1 = 3</text>
</svg>
