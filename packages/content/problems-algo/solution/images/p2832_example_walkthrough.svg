<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 424" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="424" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1,5,4,3,6] → ans = [1,4,2,1,5]</text>

  <!-- section 1: pass 1 stack evolution -->
  <text x="30" y="52" font-size="11.5" fill="#999" font-weight="bold" filter="url(#rough2)">第一趟（左→右）：栈演变与 left[]</text>
  <text x="40" y="70" font-size="10.5" fill="#999" filter="url(#rough2)">i（值）</text>
  <text x="104" y="70" font-size="10.5" fill="#999" filter="url(#rough2)">操作</text>
  <text x="262" y="70" font-size="10.5" fill="#999" filter="url(#rough2)">栈（值，底→顶）</text>
  <text x="392" y="70" font-size="10.5" fill="#999" filter="url(#rough2)">left[i]</text>

  <!-- row 0 -->
  <text x="40" y="92" font-size="11" fill="#333" filter="url(#rough2)">0 (1)</text>
  <text x="104" y="92" font-size="11" fill="#555" filter="url(#rough2)">栈空 → 压入</text>
  <rect x="262" y="78" width="24" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="274" y="91" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">1</text>
  <text x="392" y="92" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1</text>

  <!-- row 1 -->
  <text x="40" y="116" font-size="11" fill="#333" filter="url(#rough2)">1 (5)</text>
  <text x="104" y="116" font-size="11" fill="#555" filter="url(#rough2)">弹出 1 → 压入</text>
  <rect x="262" y="102" width="24" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="274" y="115" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">5</text>
  <text x="392" y="116" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1</text>

  <!-- row 2 -->
  <text x="40" y="140" font-size="11" fill="#333" filter="url(#rough2)">2 (4)</text>
  <text x="104" y="140" font-size="11" fill="#555" filter="url(#rough2)">5 &gt; 4 → 压入</text>
  <rect x="262" y="126" width="24" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="274" y="139" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">5</text>
  <rect x="286" y="126" width="24" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="298" y="139" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">4</text>
  <text x="392" y="140" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- row 3 -->
  <text x="40" y="164" font-size="11" fill="#333" filter="url(#rough2)">3 (3)</text>
  <text x="104" y="164" font-size="11" fill="#555" filter="url(#rough2)">4 &gt; 3 → 压入</text>
  <rect x="262" y="150" width="24" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="274" y="163" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">5</text>
  <rect x="286" y="150" width="24" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="298" y="163" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">4</text>
  <rect x="310" y="150" width="24" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="322" y="163" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">3</text>
  <text x="392" y="164" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- row 4 -->
  <text x="40" y="188" font-size="11" fill="#333" filter="url(#rough2)">4 (6)</text>
  <text x="104" y="188" font-size="11" fill="#555" filter="url(#rough2)">弹出 3、4、5 → 压入</text>
  <rect x="262" y="174" width="24" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="274" y="187" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">6</text>
  <text x="392" y="188" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1</text>

  <path d="M 30 204 L 470 204" stroke="#ddd" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- section 2: pass 2 -->
  <text x="30" y="226" font-size="11.5" fill="#999" font-weight="bold" filter="url(#rough2)">第二趟（右→左，对称）</text>
  <text x="40" y="246" font-size="11" fill="#555" filter="url(#rough2)">同理得 right = [1, 4, 4, 4, 5]，其中 right[4] = 5 = n（右侧无更大）</text>

  <!-- section 3: merge table -->
  <text x="30" y="272" font-size="11.5" fill="#999" font-weight="bold" filter="url(#rough2)">合并：ans[i] = right[i] − left[i] − 1</text>

  <rect x="390" y="301" width="80" height="95" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="60" y="282" width="410" height="19" fill="#e8f0fe" filter="url(#rough2)"/>

  <path d="M 60 282 L 470 282 M 60 301 L 470 301 M 60 320 L 470 320 M 60 339 L 470 339 M 60 358 L 470 358 M 60 377 L 470 377 M 60 396 L 470 396" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 60 282 L 60 396 M 140 282 L 140 396 M 220 282 L 220 396 M 300 282 L 300 396 M 390 282 L 390 396 M 470 282 L 470 396" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="100" y="296" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="180" y="296" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">nums[i]</text>
  <text x="260" y="296" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">left[i]</text>
  <text x="345" y="296" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">right[i]</text>
  <text x="430" y="296" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans[i]</text>

  <text x="100" y="315" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="180" y="315" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="260" y="315" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">−1</text>
  <text x="345" y="315" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="430" y="315" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="100" y="334" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="180" y="334" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="260" y="334" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">−1</text>
  <text x="345" y="334" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="430" y="334" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">4</text>

  <text x="100" y="353" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="180" y="353" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="260" y="353" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="345" y="353" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="430" y="353" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>

  <text x="100" y="372" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="180" y="372" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="260" y="372" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="345" y="372" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="430" y="372" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="100" y="391" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="180" y="391" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <text x="260" y="391" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">−1</text>
  <text x="345" y="391" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5 = n</text>
  <text x="430" y="391" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5</text>

  <text x="265" y="416" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = [1, 4, 2, 1, 5]，与示例输出一致 ✓</text>
</svg>
