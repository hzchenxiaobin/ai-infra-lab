<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">合并二叉树：递归流程（前序）</text>

  <!-- 入口 -->
  <rect x="190" y="44" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="66" text-anchor="middle" font-size="12" fill="#333">merge(root1, root2)</text>
  <path d="M 290 78 L 290 94" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判空分支：三种情况 -->
  <polygon points="290,96 470,150 290,204 110,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="140" text-anchor="middle" font-size="12" fill="#333">两棵子树谁为空？</text>
  <text x="290" y="158" text-anchor="middle" font-size="11" fill="#888">三种情况</text>

  <!-- 都空 -->
  <path d="M 110 150 L 50 150 L 50 230" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="70" y="142" font-size="10" fill="#b85450">都空</text>
  <rect x="10" y="234" width="80" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="255" text-anchor="middle" font-size="11" fill="#888">返回 null</text>

  <!-- 仅 root1 空 -->
  <path d="M 110 150 L 110 230" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="116" y="175" font-size="9" fill="#4a7a3a">r1空</text>
  <rect x="100" y="234" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="255" text-anchor="middle" font-size="11" fill="#333">返回 root2</text>

  <!-- 仅 root2 空 -->
  <path d="M 470 150 L 470 230" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="478" y="175" font-size="9" fill="#446688">r2空</text>
  <rect x="420" y="234" width="100" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="470" y="255" text-anchor="middle" font-size="11" fill="#333">返回 root1</text>

  <!-- 都非空 -->
  <path d="M 290 204 L 290 234" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="225" font-size="10" fill="#82b366">都非空</text>

  <!-- 值相加 -->
  <rect x="180" y="238" width="220" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="256" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">root1.val += root2.val</text>
  <text x="290" y="272" text-anchor="middle" font-size="10" fill="#888">原地累加到 root1（也可新建节点）</text>
  <path d="M 290 278 L 290 296" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 递归左右 -->
  <rect x="110" y="300" width="170" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="195" y="322" text-anchor="middle" font-size="11" fill="#333">merge(r1.left, r2.left)</text>

  <rect x="300" y="300" width="170" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="385" y="322" text-anchor="middle" font-size="11" fill="#333">merge(r1.right, r2.right)</text>

  <path d="M 195 334 L 195 352" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 385 334 L 385 352" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 返回 -->
  <rect x="210" y="356" width="160" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="378" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 root1</text>

  <text x="290" y="406" text-anchor="middle" font-size="11" fill="#888">每对节点访问一次 → O(n)；递归栈 = 树高 → O(h)</text>
</svg>
