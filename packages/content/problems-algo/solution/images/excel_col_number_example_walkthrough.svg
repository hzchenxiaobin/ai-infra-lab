<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：AB → 28，ZY → 701</text>

  <!-- ============ Case 1: "AB" → 28 ============ -->
  <text x="34" y="56" font-size="12" fill="#446688" font-weight="bold">用例一："AB" → 28</text>

  <!-- column headers -->
  <text x="80" y="76" text-anchor="middle" font-size="10" fill="#888">字符</text>
  <text x="190" y="76" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">digit</text>
  <text x="300" y="76" text-anchor="middle" font-size="10" fill="#888">res（进入）</text>
  <text x="410" y="76" text-anchor="middle" font-size="10" fill="#888">res × 26</text>
  <text x="510" y="76" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">res（更新）</text>

  <!-- Row 1: A -->
  <rect x="40" y="82" width="80" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="104" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">A</text>
  <rect x="150" y="82" width="80" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="104" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">1</text>
  <rect x="260" y="82" width="80" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="300" y="104" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="370" y="82" width="80" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="410" y="104" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="470" y="82" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="510" y="104" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- arrow row1 -> row2 -->
  <path d="M 510 118 Q 510 128 80 128 L 80 136" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Row 2: B -->
  <rect x="40" y="140" width="80" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="162" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">B</text>
  <rect x="150" y="140" width="80" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="162" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">2</text>
  <rect x="260" y="140" width="80" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="300" y="162" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="370" y="140" width="80" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="410" y="162" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">26</text>
  <rect x="470" y="140" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="510" y="162" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">28</text>

  <!-- result bar case1 -->
  <rect x="80" y="186" width="470" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="315" y="206" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">res：0 → 1 → 28  ✓</text>

  <!-- ============ Case 2: "ZY" → 701 ============ -->
  <text x="34" y="246" font-size="12" fill="#446688" font-weight="bold">用例二："ZY" → 701</text>

  <text x="80" y="266" text-anchor="middle" font-size="10" fill="#888">字符</text>
  <text x="190" y="266" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">digit</text>
  <text x="300" y="266" text-anchor="middle" font-size="10" fill="#888">res（进入）</text>
  <text x="410" y="266" text-anchor="middle" font-size="10" fill="#888">res × 26</text>
  <text x="510" y="266" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">res（更新）</text>

  <!-- Row 1: Z -->
  <rect x="40" y="272" width="80" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="294" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">Z</text>
  <rect x="150" y="272" width="80" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="294" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">26</text>
  <rect x="260" y="272" width="80" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="300" y="294" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="370" y="272" width="80" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="410" y="294" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="470" y="272" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="510" y="294" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">26</text>

  <path d="M 510 308 Q 510 318 80 318 L 80 326" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Row 2: Y -->
  <rect x="40" y="330" width="80" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="352" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">Y</text>
  <rect x="150" y="330" width="80" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="352" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">25</text>
  <rect x="260" y="330" width="80" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="300" y="352" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">26</text>
  <rect x="370" y="330" width="80" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="410" y="352" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">676</text>
  <rect x="470" y="330" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="510" y="352" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">701</text>

  <!-- result bar case2 -->
  <rect x="80" y="376" width="470" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="315" y="396" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">res：0 → 26 → 701  ✓</text>

  <!-- bottom note -->
  <rect x="60" y="414" width="440" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="428" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">res 单调递增：中间值 ≤ 最终值，故不溢出</text>
</svg>
