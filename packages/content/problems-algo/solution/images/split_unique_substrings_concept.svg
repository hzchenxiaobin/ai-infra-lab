<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">拆分字符串使唯一子串数目最大：核心概念</text>

  <!-- 原始字符串 -->
  <text x="40" y="64" font-size="12" fill="#888">原串 s =</text>
  <rect x="100" y="48" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="68" text-anchor="middle" font-size="13" fill="#333">a</text>
  <rect x="130" y="48" width="30" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="145" y="68" text-anchor="middle" font-size="13" fill="#333">b</text>
  <rect x="160" y="48" width="60" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="68" text-anchor="middle" font-size="13" fill="#333">ab</text>
  <rect x="220" y="48" width="30" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="235" y="68" text-anchor="middle" font-size="13" fill="#333">c</text>
  <rect x="250" y="48" width="60" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="13" fill="#333">cc</text>

  <text x="320" y="68" font-size="12" fill="#82b366">5 段（最大）</text>

  <!-- 切分箭头 -->
  <path d="M 115 82 L 115 104" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 145 82 L 145 104" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 190 82 L 190 104" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 235 82 L 235 104" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 82 L 280 104" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- seen 集合 -->
  <rect x="80" y="116" width="340" height="120" fill="#fafafa" stroke="#999" stroke-width="1.5" stroke-dasharray="5,3" rx="8" filter="url(#rough2)"/>
  <text x="100" y="138" font-size="12" fill="#555" font-weight="bold">seen（哈希集合）</text>

  <rect x="100" y="148" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="166" text-anchor="middle" font-size="11" fill="#333">"a"</text>

  <rect x="160" y="148" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="185" y="166" text-anchor="middle" font-size="11" fill="#333">"b"</text>

  <rect x="220" y="148" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="166" text-anchor="middle" font-size="11" fill="#333">"ab"</text>

  <rect x="290" y="148" width="50" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="315" y="166" text-anchor="middle" font-size="11" fill="#333">"c"</text>

  <rect x="350" y="148" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="166" text-anchor="middle" font-size="11" fill="#333">"cc"</text>

  <text x="250" y="200" text-anchor="middle" font-size="11" fill="#82b366">5 个子串互不相同 → 合法拆分 ✓</text>
  <text x="250" y="220" text-anchor="middle" font-size="11" fill="#888">回溯：选段 → 查 seen → 加入 / 递归 / 移除</text>

  <!-- 错误示例 -->
  <rect x="80" y="256" width="460" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="100" y="278" font-size="12" fill="#555" font-weight="bold">反例：['a','b','a','b','c','cc']</text>
  <text x="100" y="298" font-size="11" fill="#b85450">"a" 重复出现 ✗，"b" 重复出现 ✗</text>
  <text x="100" y="318" font-size="11" fill="#888">虽然段数 6 > 5，但因重复不满足唯一性约束 → 非法</text>
  <text x="100" y="338" font-size="11" fill="#888">回溯时 seen.find("a") != end → 跳过该分支</text>
</svg>
