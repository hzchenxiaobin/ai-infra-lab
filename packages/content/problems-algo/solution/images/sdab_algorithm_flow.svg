<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="880" height="520" fill="#fdfcf7"/>
  <text x="440" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：扫描建楼列表 → 逐楼 BFS 累加 → 筛选取最小</text>
  <path d="M 260 40 Q 440 48 620 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Step 1: scan grid -->
  <g filter="url(#sk)">
    <rect x="60" y="72" width="200" height="76" rx="8" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.3"/>
  </g>
  <text x="160" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">① 扫描网格</text>
  <g font-size="10" fill="#444">
    <text x="76" y="114">收集所有楼坐标 buildings</text>
    <text x="76" y="130">统计楼总数 B = len(buildings)</text>
  </g>

  <!-- arrow -->
  <path d="M 160 150 L 160 176" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Step 2: init dist & reach -->
  <g filter="url(#sk)">
    <rect x="60" y="180" width="200" height="76" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
  </g>
  <text x="160" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e4e7e">② 初始化累加器</text>
  <g font-size="10" fill="#444">
    <text x="76" y="222">dist[m][n] ← 全 0（总距离）</text>
    <text x="76" y="238">reach[m][n] ← 全 0（到达楼数）</text>
  </g>

  <!-- arrow -->
  <path d="M 160 258 L 160 284" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Step 3: loop buildings (the big box) -->
  <g filter="url(#sk)">
    <rect x="40" y="288" width="560" height="216" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="320" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1a">③ for k, building in enumerate(buildings)：</text>

  <!-- BFS sub-box -->
  <g filter="url(#sk)">
    <rect x="60" y="324" width="240" height="166" rx="8" fill="#eef7ff" stroke="#4a8edb" stroke-width="1.2"/>
  </g>
  <text x="180" y="344" text-anchor="middle" font-size="11" font-weight="bold" fill="#2b6e9e">BFS 从 building 出发</text>
  <g font-size="10" fill="#444">
    <text x="76" y="364">队列入 building，层距 d = 0</text>
    <text x="76" y="382">while 队列非空（按层）：</text>
    <text x="76" y="398">  取当前层 size 个格子</text>
    <text x="76" y="414">  对每个 (i,j) 的四邻居：</text>
    <text x="76" y="430">    若越界/楼/障碍 → 跳过</text>
    <text x="76" y="446" fill="#b03a3a">    若 reach[ni][nj] == k（剪枝）</text>
    <text x="76" y="462" fill="#2e6e2e">      dist[ni][nj] += d+1</text>
    <text x="76" y="476" fill="#2e6e2e">      reach[ni][nj] += 1 → k+1</text>
  </g>

  <!-- prune explanation -->
  <g filter="url(#sk)">
    <rect x="320" y="324" width="260" height="166" rx="8" fill="#fff3f3" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 2"/>
  </g>
  <text x="450" y="344" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">reach 即 visited + 剪枝</text>
  <g font-size="10" fill="#444">
    <text x="336" y="364">第 k 栋楼 BFS 前：</text>
    <text x="336" y="380">  reach == k 的格 = 前k栋都能到</text>
    <text x="336" y="396">  reach &lt; k 的格 = 某栋到不了</text>
    <text x="336" y="416">BFS 只扩展 reach == k 的空地</text>
    <text x="336" y="432">→ 无需额外 visited 数组</text>
    <text x="336" y="452">→ 搜索范围逐栋缩小</text>
    <text x="336" y="472" fill="#888">候选越来越少，常数更优</text>
  </g>

  <!-- arrow to step 4 -->
  <path d="M 620 396 L 660 396" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Step 4: filter & find min -->
  <g filter="url(#sk)">
    <rect x="668" y="296" width="196" height="200" rx="10" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="766" y="318" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">④ 筛选取最小</text>
  <g font-size="10" fill="#444">
    <text x="684" y="340">遍历所有空地 (i,j)：</text>
    <text x="684" y="360">  若 reach[i][j] == B</text>
    <text x="684" y="376">    ans = min(ans,</text>
    <text x="684" y="390">            dist[i][j])</text>
    <text x="684" y="414">若 ans 仍为 ∞</text>
    <text x="684" y="430" fill="#b03a3a">  → 返回 -1</text>
    <text x="684" y="454">否则返回 ans</text>
    <text x="684" y="480" fill="#888">只认「全楼可达」的空地</text>
  </g>
</svg>
