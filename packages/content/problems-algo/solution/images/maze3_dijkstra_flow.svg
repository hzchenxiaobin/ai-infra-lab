<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：Dijkstra + 路径字典序 tie-break</text>

  <!-- Start -->
  <g filter="url(#rough2)">
    <rect x="170" y="48" width="220" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="18"/>
    <text x="280" y="72" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">PQ ← (0, "", ball.r, ball.c)</text>
  </g>
  <path d="M 280 88 L 280 104" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Diamond: PQ empty? -->
  <g filter="url(#rough2)">
    <polygon points="280,108 360,148 280,188 200,148" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="280" y="144" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">PQ 为空?</text>
    <text x="280" y="160" text-anchor="middle" font-size="10" fill="#888">是 → 右出</text>
  </g>
  <path d="M 360 148 L 420 148" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="420" y="128" width="120" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
    <text x="480" y="153" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return "impossible"</text>
  </g>
  <text x="384" y="142" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>

  <path d="M 280 188 L 280 204" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="288" y="200" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- Box: pop min (d, path, r, c) -->
  <g filter="url(#rough2)">
    <rect x="150" y="208" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6"/>
    <text x="280" y="226" text-anchor="middle" font-size="11" fill="#446688">弹出 PQ 顶部 (d, path, r, c)</text>
    <text x="280" y="240" text-anchor="middle" font-size="10" fill="#555">按 (距离, 路径字典序) 取最小</text>
  </g>
  <path d="M 280 248 L 280 264" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Diamond: visited? -->
  <g filter="url(#rough2)">
    <polygon points="280,268 360,300 280,332 200,300" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="280" y="296" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">visited[r][c]?</text>
    <text x="280" y="312" text-anchor="middle" font-size="10" fill="#888">已定型则跳过</text>
  </g>
  <path d="M 360 300 L 410 300" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="410" y="280" width="100" height="40" fill="#f0f0f0" stroke="#888" stroke-width="1.4" rx="8"/>
    <text x="460" y="298" text-anchor="middle" font-size="10" fill="#888">是 → 跳过</text>
    <text x="460" y="312" text-anchor="middle" font-size="10" fill="#888">(stale 条目)</text>
  </g>
  <text x="380" y="294" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">是</text>

  <path d="M 280 332 L 280 348" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="288" y="344" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- mark visited -->
  <g filter="url(#rough2)">
    <rect x="190" y="352" width="180" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6"/>
    <text x="280" y="370" text-anchor="middle" font-size="11" fill="#446688">visited[r][c] = true</text>
  </g>
  <path d="M 280 380 L 280 392" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Diamond: (r,c)==hole? -->
  <g filter="url(#rough2)">
    <polygon points="280,396 370,424 280,452 190,424" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="280" y="420" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">(r,c) == hole?</text>
    <text x="280" y="436" text-anchor="middle" font-size="10" fill="#888">是 → 右出</text>
  </g>
  <path d="M 370 424 L 420 424" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="420" y="404" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="480" y="429" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return path ✓</text>
  </g>
  <text x="394" y="418" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <path d="M 280 452 L 280 464" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="288" y="460" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- Box: for each dir, roll, push -->
  <g filter="url(#rough2)">
    <rect x="100" y="468" width="360" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6"/>
    <text x="280" y="486" text-anchor="middle" font-size="10" fill="#446688">for dir ∈ {d,l,r,u}: roll→(nr,nc,steps); push (d+steps, path+dir, nr,nc)</text>
  </g>

  <!-- loop back arrow: from bottom box left side up to PQ empty diamond -->
  <path d="M 100 482 L 60 482 L 60 148 L 198 148" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)" stroke-dasharray="5,3"/>
</svg>
