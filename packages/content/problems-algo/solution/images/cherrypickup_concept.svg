<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#446688"/>
    </marker>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="410" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心转换：去而复返 = 两人同时从起点走到终点</text>

  <!-- ============ Left grid: round trip ============ -->
  <text x="113" y="58" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">一人往返</text>

  <!-- row 0 -->
  <rect x="50" y="70" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="71" y="96" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="92" y="70" width="42" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="113" y="96" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="134" y="70" width="42" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="96" text-anchor="middle" font-size="12" fill="#b85450">✗</text>
  <!-- row 1 -->
  <rect x="50" y="112" width="42" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="71" y="138" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="92" y="112" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="113" y="138" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="134" y="112" width="42" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="138" text-anchor="middle" font-size="12" fill="#b85450">✗</text>
  <!-- row 2 -->
  <rect x="50" y="154" width="42" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="71" y="180" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="92" y="154" width="42" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="113" y="180" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="134" y="154" width="42" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="180" text-anchor="middle" font-size="12" fill="#333">1</text>

  <!-- Forward path (blue solid): (0,0)->(2,0)->(2,2) -->
  <circle cx="71" cy="91" r="3.5" fill="#446688" filter="url(#rough2)"/>
  <path d="M 71 91 L 71 175 L 152 175" stroke="#446688" stroke-width="2.5" fill="none" marker-end="url(#arrowB)" filter="url(#rough2)"/>
  <!-- Return path (green dashed, offset -5,-5): (2,2)->(2,1)->(1,1)->(0,1)->(0,0) -->
  <circle cx="150" cy="170" r="3.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <path d="M 150 170 L 108 170 L 108 86 L 68 86" stroke="#4a7a3a" stroke-width="2.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowG)" filter="url(#rough2)"/>

  <text x="44" y="118" font-size="10" fill="#446688" font-weight="bold">去↓</text>
  <text x="160" y="118" font-size="10" fill="#4a7a3a" font-weight="bold">回↑</text>

  <!-- equals sign -->
  <text x="285" y="138" text-anchor="middle" font-size="30" fill="#d6a040" font-weight="bold">=</text>
  <text x="285" y="158" text-anchor="middle" font-size="10" fill="#888">摘过的不再算</text>

  <!-- ============ Right grid: two persons forward ============ -->
  <text x="443" y="58" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">两人并行往下走</text>

  <!-- row 0 -->
  <rect x="380" y="70" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="401" y="96" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="422" y="70" width="42" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="443" y="96" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="464" y="70" width="42" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="485" y="96" text-anchor="middle" font-size="12" fill="#b85450">✗</text>
  <!-- row 1 -->
  <rect x="380" y="112" width="42" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="401" y="138" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="422" y="112" width="42" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="443" y="138" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="464" y="112" width="42" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="485" y="138" text-anchor="middle" font-size="12" fill="#b85450">✗</text>
  <!-- row 2 -->
  <rect x="380" y="154" width="42" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="401" y="180" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="422" y="154" width="42" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="443" y="180" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="464" y="154" width="42" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="485" y="180" text-anchor="middle" font-size="12" fill="#333">1</text>

  <!-- P1 (blue solid): (0,0)->(1,0)->(2,0)->(2,1)->(2,2) -->
  <circle cx="401" cy="91" r="3.5" fill="#446688" filter="url(#rough2)"/>
  <path d="M 401 91 L 401 175 L 482 175" stroke="#446688" stroke-width="2.5" fill="none" marker-end="url(#arrowB)" filter="url(#rough2)"/>
  <!-- P2 (green dashed, offset -5,-5): (0,0)->(0,1)->(1,1)->(2,1)->(2,2) -->
  <circle cx="396" cy="86" r="3.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <path d="M 396 86 L 438 86 L 438 170 L 477 170" stroke="#4a7a3a" stroke-width="2.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowG)" filter="url(#rough2)"/>

  <text x="370" y="118" font-size="10" fill="#446688" font-weight="bold">P1</text>
  <text x="452" y="118" font-size="10" fill="#4a7a3a" font-weight="bold">P2</text>

  <!-- ============ legend ============ -->
  <rect x="40" y="230" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="60" y="242" font-size="10.5" fill="#555">樱桃 1</text>
  <rect x="110" y="230" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="130" y="242" font-size="10.5" fill="#555">空 0</text>
  <rect x="170" y="230" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="190" y="242" font-size="10.5" fill="#555">荆棘 ✗</text>
  <line x1="240" y1="237" x2="270" y2="237" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="276" y="242" font-size="10.5" fill="#555">第一人</text>
  <line x1="320" y1="237" x2="350" y2="237" stroke="#4a7a3a" stroke-width="2.5" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="356" y="242" font-size="10.5" fill="#555">第二人</text>

  <!-- ============ bottom equation box ============ -->
  <rect x="50" y="270" width="520" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="310" y="294" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">同一时刻两人步数相同：x₁+y₁ = x₂+y₂ = k</text>
  <text x="310" y="316" text-anchor="middle" font-size="12" fill="#444">→ y₂ = k − x₂ = (x₁+y₁) − x₂，状态由 4 维降为 3 维</text>
  <text x="310" y="340" text-anchor="middle" font-size="11.5" fill="#555">同格只算一次：gain = grid[x₁][y₁] + (x₁==x₂ ? 0 : grid[x₂][y₂])</text>
  <text x="310" y="362" text-anchor="middle" font-size="10.5" fill="#888">从 4 个前驱取 max：dp[x₁][x₂] ← max(dp[p₁][p₂]) + gain，pᵢ ∈ {xᵢ−1, xᵢ}</text>
</svg>
