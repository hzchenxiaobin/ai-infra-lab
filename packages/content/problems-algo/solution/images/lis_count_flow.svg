<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="6" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="720" height="540" fill="#fdfcf7"/>

  <text x="360" y="32" text-anchor="middle" font-size="18" fill="#2b2b2b" font-weight="bold">算法流程：双重循环 + 计数转移</text>
  <path d="M 220 42 Q 360 50 500 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>

  <!-- 初始化 -->
  <g filter="url(#sk)">
    <rect x="260" y="60" width="200" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="360" y="84" text-anchor="middle" font-size="12" fill="#2b2b2b">初始化：length[i]=1, count[i]=1</text>

  <path d="M 360 100 L 360 118" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 外层循环 i -->
  <g filter="url(#sk)">
    <rect x="250" y="120" width="220" height="40" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.4"/>
  </g>
  <text x="360" y="144" text-anchor="middle" font-size="12" fill="#2b2b2b">for i in range(n)：枚举结尾 i</text>

  <path d="M 360 160 L 360 178" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 内层循环 j -->
  <g filter="url(#sk)">
    <rect x="250" y="180" width="220" height="40" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.4"/>
  </g>
  <text x="360" y="204" text-anchor="middle" font-size="12" fill="#2b2b2b">for j in range(i)：枚举前驱 j</text>

  <path d="M 360 220 L 360 238" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 判断 nums[j] < nums[i] -->
  <g filter="url(#sk)">
    <polygon points="360,240 470,290 360,340 250,290" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.6"/>
  </g>
  <text x="360" y="288" text-anchor="middle" font-size="12" fill="#2b2b2b">nums[j] &lt; nums[i] ?</text>
  <text x="360" y="304" text-anchor="middle" font-size="10" fill="#888">严格递增才可接</text>

  <!-- 否分支 -->
  <path d="M 470 290 L 520 290" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="490" y="282" text-anchor="middle" font-size="11" fill="#888">否</text>
  <g filter="url(#sk)">
    <rect x="524" y="276" width="80" height="30" rx="6" fill="#f0ede4" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <text x="564" y="296" text-anchor="middle" font-size="11" fill="#888">跳过 j</text>
  <path d="M 564 276 Q 564 200 470 200" stroke="#3a3a3a" stroke-width="1.2" fill="none" marker-end="url(#ar)" stroke-dasharray="4,3" filter="url(#sk)"/>
  <text x="600" y="232" font-size="10" fill="#888">下一 j</text>

  <!-- 是分支 -->
  <path d="M 360 340 L 360 358" stroke="#3a3a3a" stroke-width="1.4" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="372" y="352" font-size="11" fill="#4a8e4a">是</text>

  <!-- 判断 length[j]+1 vs length[i] -->
  <g filter="url(#sk)">
    <polygon points="360,360 500,410 360,460 220,410" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/>
  </g>
  <text x="360" y="406" text-anchor="middle" font-size="11" fill="#2b2b2b">length[j]+1</text>
  <text x="360" y="422" text-anchor="middle" font-size="11" fill="#2b2b2b">vs length[i]</text>

  <!-- 大于：规则一 -->
  <path d="M 220 410 L 150 410 L 150 470" stroke="#4a8e4a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="178" y="402" text-anchor="middle" font-size="10" fill="#4a8e4a">&gt;（更长）</text>
  <g filter="url(#sk)">
    <rect x="50" y="472" width="200" height="56" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="150" y="492" text-anchor="middle" font-size="11" fill="#2b2b2b">length[i] = length[j]+1</text>
  <text x="150" y="510" text-anchor="middle" font-size="11" fill="#2b2b2b">count[i] = count[j]</text>
  <text x="150" y="524" text-anchor="middle" font-size="10" fill="#4a8e4a">推倒重来</text>

  <!-- 等于：规则二 -->
  <path d="M 500 410 L 570 410 L 570 470" stroke="#b85450" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="542" y="402" text-anchor="middle" font-size="10" fill="#b85450">==（等长）</text>
  <g filter="url(#sk)">
    <rect x="470" y="472" width="200" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="570" y="492" text-anchor="middle" font-size="11" fill="#2b2b2b">length[i] 不变</text>
  <text x="570" y="510" text-anchor="middle" font-size="11" fill="#2b2b2b">count[i] += count[j]</text>
  <text x="570" y="524" text-anchor="middle" font-size="10" fill="#b85450">累加条数</text>

  <text x="360" y="530" text-anchor="middle" font-size="10" fill="#888">（小于则忽略：前驱不更优）</text>
</svg>
