<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">示例 1 演算：skills = [4,2,6,3,9]，k = 2</text>

  <rect x="10" y="52" width="500" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="40" y="74" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">场次</text>
  <text x="128" y="74" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">对决</text>
  <text x="228" y="74" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">比较结果</text>
  <text x="318" y="74" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">擂主 cur</text>
  <text x="400" y="74" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">连胜 win</text>
  <text x="470" y="74" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">动作</text>

  <rect x="10" y="86" width="500" height="34" fill="#fafafa" stroke="#888" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="40" y="108" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="128" y="108" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0(4) vs 1(2)</text>
  <text x="228" y="108" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4 &gt; 2</text>
  <text x="318" y="108" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="400" y="108" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="470" y="108" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">守擂 +1</text>

  <rect x="10" y="120" width="500" height="34" fill="#fafafa" stroke="#888" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="40" y="142" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="128" y="142" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0(4) vs 2(6)</text>
  <text x="228" y="142" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6 &gt; 4</text>
  <text x="318" y="142" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="400" y="142" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="470" y="142" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">换王重置</text>

  <rect x="10" y="154" width="500" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="40" y="176" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="128" y="176" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2(6) vs 3(3)</text>
  <text x="228" y="176" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">6 &gt; 3</text>
  <text x="318" y="176" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="400" y="176" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2 = k</text>
  <text x="470" y="176" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 2</text>

  <text x="260" y="212" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">玩家 2 连胜 2 场，成为赢家</text>

  <rect x="20" y="228" width="480" height="116" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="36" y="252" font-size="12.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">示例 2：skills = [2,5,4]，k = 3</text>
  <text x="36" y="274" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">场 1：0(2) vs 1(5) → 换王 cur = 1，win = 1</text>
  <text x="36" y="294" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">场 2：1(5) vs 2(4) → 守擂，win = 2</text>
  <text x="36" y="314" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">扫描结束仍未达到 k = 3 → cur = 1 已是全局最强，</text>
  <text x="36" y="334" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">后续无限连胜，必然最先连赢 3 场 → 返回 1</text>
</svg>
