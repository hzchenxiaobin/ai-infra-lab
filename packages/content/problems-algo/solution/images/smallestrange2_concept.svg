<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">排序后存在分割点：前缀 +k，后缀 −k</text>

  <!-- ===== Sorted array ===== -->
  <text x="40" y="52" font-size="12" fill="#888">排序后：nums[0] ≤ nums[1] ≤ ... ≤ nums[n−1]</text>

  <!-- Sorted row: 5 cells representing sorted array -->
  <text x="40" y="80" font-size="11" fill="#555">原始：</text>
  <rect x="100" y="62" width="64" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="132" y="82" text-anchor="middle" font-size="13" fill="#999">nums[0]</text>
  <rect x="164" y="62" width="64" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="196" y="82" text-anchor="middle" font-size="11" fill="#999">...</text>
  <rect x="228" y="62" width="64" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="82" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">nums[i]</text>
  <rect x="292" y="62" width="64" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="324" y="82" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">nums[i+1]</text>
  <rect x="356" y="62" width="64" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="388" y="82" text-anchor="middle" font-size="11" fill="#999">...</text>
  <rect x="420" y="62" width="64" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="452" y="82" text-anchor="middle" font-size="13" fill="#999">nums[n−1]</text>

  <!-- Split line -->
  <path d="M 292 52 L 292 100" stroke="#d6a040" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="292" y="44" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">分割点 i</text>

  <!-- ===== After transformation ===== -->
  <text x="40" y="118" font-size="11" fill="#555">变换后：</text>

  <!-- Left part +k (blue) -->
  <rect x="100" y="120" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="140" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">+k</text>
  <rect x="164" y="120" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="196" y="140" text-anchor="middle" font-size="11" fill="#446688">+k</text>
  <rect x="228" y="120" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="140" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">+k</text>

  <!-- Right part -k (red) -->
  <rect x="292" y="120" width="64" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="324" y="140" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−k</text>
  <rect x="356" y="120" width="64" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="388" y="140" text-anchor="middle" font-size="11" fill="#b85450">−k</text>
  <rect x="420" y="120" width="64" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="452" y="140" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−k</text>

  <!-- Zone labels -->
  <text x="196" y="168" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">前缀：全部 +k</text>
  <text x="388" y="168" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">后缀：全部 −k</text>

  <!-- ===== 4 candidate values ===== -->
  <text x="40" y="196" font-size="12" fill="#888" font-weight="bold">4 个候选极值：</text>

  <!-- nums[0]+k -->
  <rect x="60" y="204" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="120" y="226" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">nums[0] + k</text>
  <text x="120" y="252" text-anchor="middle" font-size="10" fill="#666">前缀最小 → 候选 low</text>

  <!-- nums[i]+k -->
  <rect x="200" y="204" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="226" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">nums[i] + k</text>
  <text x="260" y="252" text-anchor="middle" font-size="10" fill="#666">前缀最大 → 候选 high</text>

  <!-- nums[i+1]-k -->
  <rect x="340" y="204" width="120" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="400" y="226" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">nums[i+1] − k</text>
  <text x="400" y="252" text-anchor="middle" font-size="10" fill="#666">后缀最小 → 候选 low</text>

  <!-- arrows from candidate to formula area -->
  <path d="M 120 258 L 120 286" stroke="#446688" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 260 258 L 260 286" stroke="#446688" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 400 258 L 400 286" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Formula ===== -->
  <rect x="60" y="288" width="200" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="308" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">low = min(nums[0]+k, nums[i+1]−k)</text>

  <rect x="200" y="288" width="200" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="308" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">high = max(nums[i]+k, nums[n−1]−k)</text>

  <!-- ===== Core idea box ===== -->
  <rect x="40" y="338" width="480" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="358" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">交换论证：小值减 + 大值加 → 交换为 小值加 + 大值减</text>
  <text x="280" y="376" text-anchor="middle" font-size="11" fill="#666">max 不增、min 不减 → 分数不增 → 最优解必有分割结构</text>
</svg>
