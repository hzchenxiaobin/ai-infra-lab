<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="17" font-weight="bold"
        fill="#333" filter="url(#rough2)">示例演算：root = [1,2,3,null,4]</text>

  <!-- 左：原树 -->
  <text x="130" y="52" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">原树</text>
  <line x1="140" y1="74" x2="90" y2="118" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="140" y1="74" x2="190" y2="118" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="90" y1="140" x2="115" y2="184" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>

  <circle cx="140" cy="60" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="65" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>
  <circle cx="90" cy="130" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="90" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>
  <circle cx="190" cy="130" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="190" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>
  <circle cx="115" cy="200" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="115" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">4</text>

  <!-- 右：结果矩阵 3x7，cell 38x40，左上 (290,50)；列中心 x=309+c*38，行中心 y=70+r*40 -->
  <text x="423" y="42" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">结果矩阵 res (3×7)</text>
  <rect x="290" y="50" width="266" height="120" fill="none" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <!-- 行分隔 -->
  <line x1="290" y1="90" x2="556" y2="90" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="290" y1="130" x2="556" y2="130" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <!-- 列分隔 c=1..6: x = 290 + c*38 -->
  <line x1="328" y1="50" x2="328" y2="170" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="366" y1="50" x2="366" y2="170" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="404" y1="50" x2="404" y2="170" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="442" y1="50" x2="442" y2="170" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="480" y1="50" x2="480" y2="170" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="518" y1="50" x2="518" y2="170" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <!-- 填值 -->
  <text x="423" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="347" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="499" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="385" y="155" text-anchor="middle" font-size="14" font-weight="bold" fill="#d6a040" filter="url(#rough2)">4</text>

  <!-- 步骤徽章 -->
  <circle cx="440" cy="58" r="8" fill="#b85450" filter="url(#rough2)"/>
  <text x="440" y="62" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff" filter="url(#rough2)">1</text>
  <circle cx="364" cy="98" r="8" fill="#b85450" filter="url(#rough2)"/>
  <text x="364" y="102" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff" filter="url(#rough2)">2</text>
  <circle cx="516" cy="98" r="8" fill="#b85450" filter="url(#rough2)"/>
  <text x="516" y="102" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff" filter="url(#rough2)">3</text>
  <circle cx="402" cy="138" r="8" fill="#b85450" filter="url(#rough2)"/>
  <text x="402" y="142" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff" filter="url(#rough2)">4</text>

  <!-- 步骤表 -->
  <text x="40" y="210" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">放置步骤</text>

  <!-- 表格外框 + 列分隔：c0=40,c1=110,c2=200,c3=330,c4=450, 右边界 540 -->
  <rect x="40" y="220" width="500" height="200" fill="none" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="110" y1="220" x2="110" y2="420" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="200" y1="220" x2="200" y2="420" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="330" y1="220" x2="330" y2="420" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="450" y1="220" x2="450" y2="420" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <!-- 表头分隔 -->
  <line x1="40" y1="248" x2="540" y2="248" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="40" y="220" width="500" height="28" fill="#e8f0fe" filter="url(#rough2)"/>
  <text x="75"  y="239" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">步骤</text>
  <text x="155" y="239" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">节点</text>
  <text x="265" y="239" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">位置 (row,col)</text>
  <text x="390" y="239" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">区间 [lo,hi]</text>
  <text x="495" y="239" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">mid</text>

  <!-- 行间分隔 -->
  <line x1="40" y1="280" x2="540" y2="280" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="40" y1="312" x2="540" y2="312" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="40" y1="344" x2="540" y2="344" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="40" y1="376" x2="540" y2="376" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- 行0：初始化 -->
  <text x="75"  y="267" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="155" y="267" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">—</text>
  <text x="265" y="267" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">m×n = 3×7</text>
  <text x="390" y="267" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">—</text>
  <text x="495" y="267" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">h=2</text>

  <!-- 行1：根 1 -->
  <text x="75"  y="299" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>
  <text x="155" y="299" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="265" y="299" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(0, 3)</text>
  <text x="390" y="299" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[0, 6]</text>
  <text x="495" y="299" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">3</text>

  <!-- 行2：节点 2 -->
  <text x="75"  y="331" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">2</text>
  <text x="155" y="331" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="265" y="331" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(1, 1)</text>
  <text x="390" y="331" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[0, 2]</text>
  <text x="495" y="331" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">1</text>

  <!-- 行3：节点 3 -->
  <text x="75"  y="363" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">3</text>
  <text x="155" y="363" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="265" y="363" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(1, 5)</text>
  <text x="390" y="363" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[4, 6]</text>
  <text x="495" y="363" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">5</text>

  <!-- 行4：节点 4 -->
  <text x="75"  y="395" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">4</text>
  <text x="155" y="395" text-anchor="middle" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">4</text>
  <text x="265" y="395" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(2, 2)</text>
  <text x="390" y="395" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[2, 2]</text>
  <text x="495" y="395" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">2</text>

  <text x="40" y="442" font-size="10" fill="#777" filter="url(#rough2)">根坐 [0,6] 正中→col3；2、3 平分得 [0,2]/[4,6]；4 继承 [2,2] 落在 col2。</text>
</svg>
