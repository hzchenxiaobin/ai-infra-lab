<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrOrange" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">激活区与源分量（示例 2）</text>

  <!-- 左半：原图 -->
  <text x="135" y="60" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">原图（n = 7）</text>

  <!-- 环 0-1-2（不可达，红色） -->
  <ellipse cx="100" cy="100" rx="17" ry="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="105" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <ellipse cx="60" cy="155" rx="17" ry="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="160" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <ellipse cx="140" cy="155" rx="17" ry="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="160" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <path d="M91,110 L74,138" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <path d="M78,155 L121,155" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <path d="M130,143 L113,115" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="100" y="192" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">魔力流不达 → 待激活</text>

  <!-- 3→4 与 5→6（可达，绿色） -->
  <ellipse cx="55" cy="228" rx="17" ry="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="55" y="233" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <polygon points="55,206 61,199 67,206 61,213" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <ellipse cx="128" cy="262" rx="17" ry="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="128" y="267" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <path d="M69,235 L110,255" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>

  <ellipse cx="196" cy="228" rx="17" ry="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="196" y="233" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <polygon points="196,206 202,199 208,206 202,213" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <ellipse cx="222" cy="285" rx="17" ry="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="222" y="290" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <path d="M203,240 L216,268" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>

  <text x="70" y="320" font-size="11" fill="#d6a040" filter="url(#rough2)">◆ = 魔法水晶</text>
  <text x="70" y="338" font-size="11" fill="#888" filter="url(#rough2)">绿 = 已激活，红 = 未激活</text>

  <!-- 右半：缩点视角 -->
  <text x="398" y="60" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">激活区视角</text>

  <rect x="300" y="78" width="190" height="88" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="395" y="105" text-anchor="middle" font-size="13" fill="#2f5527" filter="url(#rough2)">已激活区</text>
  <text x="395" y="126" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">水晶 3、5 出发可达</text>
  <text x="395" y="145" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">焦点 3、4、5、6</text>

  <path d="M395,168 L395,225" stroke="#d6a040" stroke-width="2" stroke-dasharray="6,5" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>
  <text x="408" y="200" font-size="11" fill="#d6a040" filter="url(#rough2)">补 1 条符文</text>
  <text x="408" y="215" font-size="11" fill="#d6a040" filter="url(#rough2)">如 4 → 2</text>

  <rect x="305" y="230" width="180" height="72" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="395" y="253" text-anchor="middle" font-size="12" fill="#8c3a34" filter="url(#rough2)">分量 A：环 0→1→2→0</text>
  <text x="395" y="273" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">入度 = 0 且无水晶</text>
  <text x="395" y="291" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">必须手动接入</text>

  <!-- 底部结论 -->
  <rect x="60" y="322" width="400" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="342" text-anchor="middle" font-size="12.5" fill="#8a6d1f" filter="url(#rough2)">答案 = 入度为 0 且不含水晶的分量个数</text>
</svg>
