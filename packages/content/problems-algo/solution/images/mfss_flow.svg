<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">后序 DFS 流程：dfs(node) 返回子树和，途中更新频次表</text>

  <!-- 入口 -->
  <rect x="225" y="44" width="110" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="12" fill="#333">调用 dfs(node)</text>

  <!-- 判空 菱形 -->
  <path d="M 280 80 L 340 110 L 280 140 L 220 110 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="114" text-anchor="middle" font-size="11" fill="#333">node == null?</text>
  <path d="M 280 72 L 280 80" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 是 → return 0 -->
  <path d="M 340 110 L 420 110" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="360" y="102" font-size="10" fill="#4a7a3a">是</text>
  <rect x="420" y="96" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="475" y="114" text-anchor="middle" font-size="11" fill="#333">return 0</text>

  <!-- 否 → 递归 -->
  <path d="M 220 110 L 160 110" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="102" font-size="10" fill="#b85450">否</text>

  <rect x="70" y="96" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="115" y="114" text-anchor="middle" font-size="11" fill="#333">递归左右</text>
  <text x="115" y="140" text-anchor="middle" font-size="10" fill="#888">l = dfs(left)</text>
  <text x="115" y="154" text-anchor="middle" font-size="10" fill="#888">r = dfs(right)</text>

  <path d="M 115 124 L 115 160 L 280 160 L 280 175" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 求和 矩形 -->
  <rect x="195" y="175" width="170" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="197" text-anchor="middle" font-size="11" fill="#333">sum = node.val + l + r</text>

  <path d="M 280 209 L 280 225" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 更新频次 矩形 -->
  <rect x="170" y="225" width="220" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="245" text-anchor="middle" font-size="11" fill="#333">freq[sum] += 1</text>
  <text x="280" y="262" text-anchor="middle" font-size="11" fill="#333">maxFreq = max(maxFreq, freq[sum])</text>

  <path d="M 280 269 L 280 285" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return sum -->
  <rect x="215" y="285" width="130" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="305" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">return sum</text>

  <!-- 收集阶段 -->
  <rect x="40" y="335" width="480" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="358" text-anchor="middle" font-size="11" fill="#555">dfs(root) 结束后：遍历 freq，收集所有 freq[s] == maxFreq 的 s → ans</text>

  <!-- 底部说明 -->
  <rect x="40" y="390" width="480" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="412" text-anchor="middle" font-size="11" fill="#555">空节点 return 0（不拖累父节点求和）· 叶子 sum = 自身值 · 一遍后序即得全部子树和</text>
</svg>
