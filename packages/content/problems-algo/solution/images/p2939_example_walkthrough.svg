<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例 1 演算：a = 12 (1100)，b = 5 (0101)，n = 4</text>

  <!-- table header -->
  <rect x="30" y="44" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="52" y="64" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <rect x="74" y="44" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="114" y="64" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">a_i / b_i</text>
  <rect x="154" y="44" width="64" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="186" y="64" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">判定</text>
  <rect x="218" y="44" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="293" y="64" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">动作</text>
  <rect x="368" y="44" width="82" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="409" y="64" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">A（二进制）</text>
  <rect x="450" y="44" width="82" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="491" y="64" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">B（二进制）</text>

  <!-- row i=3 -->
  <rect x="30" y="78" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="52" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="74" y="78" width="80" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="114" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1 / 0</text>
  <rect x="154" y="78" width="64" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="186" y="100" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">异位</text>
  <rect x="218" y="78" width="150" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="293" y="100" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">A=B=0，给谁都行 → A</text>
  <rect x="368" y="78" width="82" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="409" y="100" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1000 (8)</text>
  <rect x="450" y="78" width="82" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="491" y="100" text-anchor="middle" font-size="12" fill="#8f3a36" filter="url(#rough2)">0000 (0)</text>

  <!-- row i=2 -->
  <rect x="30" y="116" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="52" y="138" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="74" y="116" width="80" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="114" y="138" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1 / 1</text>
  <rect x="154" y="116" width="64" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="186" y="138" text-anchor="middle" font-size="11.5" fill="#2f5d24" filter="url(#rough2)">同位</text>
  <rect x="218" y="116" width="150" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="293" y="138" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">双双置 1</text>
  <rect x="368" y="116" width="82" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="409" y="138" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1100 (12)</text>
  <rect x="450" y="116" width="82" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="491" y="138" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">0100 (4)</text>

  <!-- row i=1 -->
  <rect x="30" y="154" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="52" y="176" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="74" y="154" width="80" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="114" y="176" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0 / 0</text>
  <rect x="154" y="154" width="64" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="186" y="176" text-anchor="middle" font-size="11.5" fill="#2f5d24" filter="url(#rough2)">同位</text>
  <rect x="218" y="154" width="150" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="293" y="176" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">双双置 1</text>
  <rect x="368" y="154" width="82" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="409" y="176" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1110 (14)</text>
  <rect x="450" y="154" width="82" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="491" y="176" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">0110 (6)</text>

  <!-- row i=0 -->
  <rect x="30" y="192" width="44" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="52" y="214" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="74" y="192" width="80" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="114" y="214" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0 / 1</text>
  <rect x="154" y="192" width="64" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="186" y="214" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">异位</text>
  <rect x="218" y="192" width="150" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="293" y="214" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">A &gt; B → 补给 B</text>
  <rect x="368" y="192" width="82" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="409" y="214" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1110 (14)</text>
  <rect x="450" y="192" width="82" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="491" y="214" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">0111 (7)</text>

  <!-- final box -->
  <rect x="60" y="242" width="440" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="260" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">循环结束：A = 14，B = 7，乘积 = 98</text>
  <text x="280" y="278" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">反解 x：x_i = a_i ⊕ A_i 逐位拼出 x = 0010 = 2</text>

  <!-- verify box -->
  <rect x="60" y="296" width="440" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="314" text-anchor="middle" font-size="11.5" fill="#2f5d24" filter="url(#rough2)">验证：12 ⊕ 2 = 14，5 ⊕ 2 = 7，14 × 7 = 98 ✓</text>
  <text x="280" y="330" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">注意 A、B 一路只增不减（同位加、异位挪），始终非负</text>

  <!-- bottom note -->
  <text x="280" y="358" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">示例 2（a=6, b=7, n=5）：前四位全是同位双双置 1 → A=B=30，末位异位随便给 → 31×30=930</text>
</svg>
