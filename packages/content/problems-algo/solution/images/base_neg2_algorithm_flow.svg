<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：除 (−2) 取余 + 位运算捷径</text>

  <!-- ===== Left column: standard division method ===== -->
  <text x="140" y="54" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">方法一：除 (−2) 取余（通用）</text>

  <!-- start -->
  <rect x="70" y="64" width="140" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="140" y="83" text-anchor="middle" font-size="11" fill="#333">n == 0 ? 返回 "0"</text>

  <path d="M 140 94 L 140 106" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop diamond -->
  <polygon points="140,110 210,146 140,182 70,146" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="143" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">n != 0 ?</text>
  <text x="140" y="158" text-anchor="middle" font-size="10" fill="#888">while 循环</text>

  <!-- yes branch -->
  <text x="220" y="146" font-size="10" fill="#4a7a3a">是</text>
  <path d="M 210 146 L 230 146" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- step 1: r = n % (-2) -->
  <rect x="230" y="132" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="290" y="151" text-anchor="middle" font-size="10.5" fill="#333">r = n % (−2)</text>

  <path d="M 290 162 L 290 174" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2: n //= -2 -->
  <rect x="230" y="176" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="290" y="195" text-anchor="middle" font-size="10.5" fill="#333">n = n ÷ (−2)</text>

  <path d="M 290 206 L 290 218" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 3: fix negative remainder -->
  <rect x="215" y="220" width="150" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="290" y="237" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">r &lt; 0 ?</text>
  <text x="290" y="250" text-anchor="middle" font-size="9.5" fill="#b85450">r += 2; n += 1</text>

  <path d="M 290 258 L 290 270" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 4: append -->
  <rect x="230" y="272" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="290" y="291" text-anchor="middle" font-size="10.5" fill="#4a7a3a">res.append(r)</text>

  <!-- loop back arrow -->
  <path d="M 230 286 Q 200 286 200 200 Q 200 146 210 146" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- no branch from diamond -->
  <text x="148" y="200" font-size="10" fill="#b85450">否</text>
  <path d="M 140 182 L 140 312" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4,3"/>

  <!-- reverse and return -->
  <rect x="60" y="314" width="160" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="140" y="333" text-anchor="middle" font-size="11" fill="#333">reverse(res) → 返回</text>

  <!-- ===== Right column: bit manipulation method ===== -->
  <text x="420" y="54" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">方法二：位运算捷径（推荐）</text>

  <!-- start -->
  <rect x="350" y="64" width="140" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="420" y="83" text-anchor="middle" font-size="11" fill="#333">n == 0 ? 返回 "0"</text>

  <path d="M 420 94 L 420 106" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- loop diamond -->
  <polygon points="420,110 490,146 420,182 350,146" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="420" y="143" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">n != 0 ?</text>
  <text x="420" y="158" text-anchor="middle" font-size="10" fill="#888">while 循环</text>

  <!-- yes branch down -->
  <text x="430" y="200" font-size="10" fill="#4a7a3a">是</text>
  <path d="M 420 182 L 420 196" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- step 1: r = n & 1 -->
  <rect x="350" y="198" width="140" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="420" y="217" text-anchor="middle" font-size="11" fill="#333">r = n &amp; 1</text>

  <path d="M 420 228 L 420 240" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- step 2: n = -(n >> 1) -->
  <rect x="340" y="242" width="160" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="420" y="261" text-anchor="middle" font-size="11" fill="#333">n = −(n &gt;&gt; 1)</text>

  <path d="M 420 272 L 420 284" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- step 3: append -->
  <rect x="350" y="286" width="140" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="420" y="305" text-anchor="middle" font-size="11" fill="#4a7a3a">res.append(r)</text>

  <!-- loop back arrow -->
  <path d="M 350 300 Q 320 300 320 200 Q 320 146 350 146" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- no branch -->
  <text x="428" y="200" font-size="10" fill="#b85450">否</text>
  <path d="M 490 146 Q 530 146 530 312 L 530 326" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4,3"/>

  <!-- reverse and return -->
  <rect x="340" y="314" width="180" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="430" y="333" text-anchor="middle" font-size="11" fill="#333">reverse(res) → 返回</text>

  <!-- ===== Bottom: key insight ===== -->
  <rect x="40" y="360" width="480" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="379" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">位运算等价性：n &amp; 1 ≡ n % 2，−(n &gt;&gt; 1) ≡ n ÷ (−2)（余数已修正）</text>

  <rect x="40" y="398" width="230" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="155" y="418" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">方法一：通用但需修正</text>
  <text x="155" y="434" text-anchor="middle" font-size="10" fill="#555">n % (−2) 可能为 −1</text>
  <text x="155" y="450" text-anchor="middle" font-size="10" fill="#555">需 r+=2, n+=1 修正</text>

  <rect x="290" y="398" width="230" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="405" y="418" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">方法二：免修正</text>
  <text x="405" y="434" text-anchor="middle" font-size="10" fill="#555">n &amp; 1 恒 ∈ {0,1}</text>
  <text x="405" y="450" text-anchor="middle" font-size="10" fill="#555">−(n&gt;&gt;1) 内含修正</text>
</svg>
