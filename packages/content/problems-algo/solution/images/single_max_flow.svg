<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 7 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：分组计数 → 筛选 → MAX</text>

  <!-- Step 1: FROM MyNumbers -->
  <rect x="200" y="42" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="63" text-anchor="middle" font-size="12" fill="#333">FROM MyNumbers</text>

  <path d="M 260 76 L 260 92" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: GROUP BY num -->
  <rect x="180" y="96" width="160" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="117" text-anchor="middle" font-size="12" fill="#333">GROUP BY num</text>

  <path d="M 260 130 L 260 146" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: COUNT(*) per group -->
  <rect x="170" y="150" width="180" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="171" text-anchor="middle" font-size="12" fill="#333">COUNT(*) AS cnt</text>

  <path d="M 260 184 L 260 200" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond: HAVING cnt = 1 -->
  <path d="M 260 204 L 340 244 L 260 284 L 180 244 Z" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="240" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">HAVING</text>
  <text x="260" y="256" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">cnt = 1?</text>

  <!-- Yes branch: keep -->
  <path d="M 340 244 L 400 244" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="238" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="400" y="228" width="100" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="450" y="249" text-anchor="middle" font-size="11" fill="#333">保留该 num</text>

  <!-- No branch: discard -->
  <path d="M 180 244 L 120 244" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="238" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="40" y="228" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="80" y="249" text-anchor="middle" font-size="11" fill="#b85450">丢弃</text>

  <!-- arrow from keep to MAX -->
  <path d="M 450 262 L 450 284 L 260 284 L 260 300" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step: MAX(num) -->
  <rect x="190" y="304" width="140" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="325" text-anchor="middle" font-size="12" fill="#333">SELECT MAX(num)</text>

  <path d="M 260 338 L 260 354" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Output -->
  <rect x="150" y="358" width="220" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="380" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">输出：最大单一数字 或 NULL</text>
</svg>
