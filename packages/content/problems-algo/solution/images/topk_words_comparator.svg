<svg xmlns="http://www.w3.org/2000/svg" width="920" height="460" viewBox="0 0 920 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="arL" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="920" height="460" fill="#fafafa"/>
  <text x="460" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">比较器方向：答案排序 vs 堆的弹出（k = 2）</text>
  <path d="M 300 44 Q 460 52 620 44" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 顶部：频率统计表 -->
  <text x="460" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">频率统计：i→2，love→2，leetcode→1，coding→1</text>

  <!-- 左：答案顺序 -->
  <text x="170" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">① 答案排序（保留最好的 k）</text>
  <text x="170" y="136" text-anchor="middle" font-size="12" fill="#666">频率 ↓ ， 同频字典序 ↑</text>
  <g filter="url(#sk)">
    <rect x="70" y="148" width="200" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="170" y="173" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">i (2)</text>
  <g filter="url(#sk)">
    <rect x="70" y="190" width="200" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="170" y="215" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">love (2)</text>
  <g filter="url(#sk2)">
    <rect x="70" y="232" width="200" height="34" rx="6" fill="#fff" stroke="#ccc" stroke-dasharray="4 3"/>
  </g>
  <text x="170" y="254" text-anchor="middle" font-size="11" fill="#999">coding (1) —— 淘汰</text>
  <g filter="url(#sk2)">
    <rect x="70" y="266" width="200" height="34" rx="6" fill="#fff" stroke="#ccc" stroke-dasharray="4 3"/>
  </g>
  <text x="170" y="288" text-anchor="middle" font-size="11" fill="#999">leetcode (1) —— 淘汰</text>

  <!-- 中间：镜像箭头 -->
  <path d="M 460 200 L 460 200" stroke="none"/>
  <text x="460" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">方向相反</text>
  <path d="M 290 178 Q 460 150 630 178" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <path d="M 630 222 Q 460 250 290 222" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="460" y="146" text-anchor="middle" font-size="11" fill="#b85450">频率：降序 ↔ 升序</text>
  <text x="460" y="268" text-anchor="middle" font-size="11" fill="#b85450">字典序：升序 ↔ 降序</text>

  <!-- 右：堆弹出顺序 -->
  <text x="750" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">② 最小堆堆顶（最先弹出）</text>
  <text x="750" y="136" text-anchor="middle" font-size="12" fill="#666">频率 ↑ ， 同频字典序 ↓</text>
  <g filter="url(#sk)">
    <rect x="650" y="148" width="200" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
  </g>
  <text x="750" y="173" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">leetcode (1) ← 先弹</text>
  <g filter="url(#sk)">
    <rect x="650" y="190" width="200" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="750" y="215" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">coding (1)</text>
  <g filter="url(#sk)">
    <rect x="650" y="232" width="200" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="750" y="257" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">love (2) ← 同频较大</text>
  <g filter="url(#sk2)">
    <rect x="650" y="274" width="200" height="34" rx="6" fill="#fff" stroke="#ccc" stroke-dasharray="4 3"/>
  </g>
  <text x="750" y="296" text-anchor="middle" font-size="11" fill="#999">i (2) —— 最优，留到最后</text>

  <!-- 底部说明 -->
  <g filter="url(#sk)">
    <rect x="40" y="330" width="840" height="108" rx="8" fill="#fffdf3" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="60" y="356" font-size="13" font-weight="bold" fill="#7a5415">核心洞察：堆的比较器 = 答案比较器的「反方向」</text>
  <text x="60" y="380" font-size="12" fill="#444">· 答案要「最好的 k 个」：频率高优先，同频取字典序小。</text>
  <text x="60" y="400" font-size="12" fill="#444">· 堆顶要「最差的 1 个」以便弹出：频率低优先，同频取字典序大。</text>
  <text x="60" y="420" font-size="12" fill="#b85450">· 两者恰好相反——这正是 692 区别于 347 的关键陷阱。</text>
</svg>
