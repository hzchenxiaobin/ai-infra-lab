<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：六个活动逐行标号 → 聚合成四个不重叠区间</text>

  <!-- ============ Process table ============ -->
  <text x="40" y="54" font-size="11" fill="#446688" font-weight="bold">排序后逐行计算 prev_max_end / is_new / grp</text>

  <!-- header -->
  <rect x="30" y="62" width="520" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60"  y="80" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">hall</text>
  <text x="140" y="80" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">start_day</text>
  <text x="225" y="80" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">end_day</text>
  <text x="335" y="80" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">prev_max_end</text>
  <text x="430" y="80" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">is_new</text>
  <text x="495" y="80" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">grp</text>

  <!-- row 1: hall1 01-13~14 -->
  <rect x="30" y="88" width="520" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="60"  y="104" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="140" y="104" text-anchor="middle" font-size="10" fill="#333">2023-01-13</text>
  <text x="225" y="104" text-anchor="middle" font-size="10" fill="#333">2023-01-14</text>
  <text x="335" y="104" text-anchor="middle" font-size="10" fill="#888">NULL</text>
  <text x="430" y="104" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <text x="495" y="104" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- row 2: hall1 01-14~17 -->
  <rect x="30" y="112" width="520" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="60"  y="128" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="140" y="128" text-anchor="middle" font-size="10" fill="#333">2023-01-14</text>
  <text x="225" y="128" text-anchor="middle" font-size="10" fill="#333">2023-01-17</text>
  <text x="335" y="128" text-anchor="middle" font-size="10" fill="#333">2023-01-14</text>
  <text x="430" y="128" text-anchor="middle" font-size="10" fill="#4a7a3a">0</text>
  <text x="495" y="128" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- row 3: hall1 01-18~25 -->
  <rect x="30" y="136" width="520" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="60"  y="152" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="140" y="152" text-anchor="middle" font-size="10" fill="#333">2023-01-18</text>
  <text x="225" y="152" text-anchor="middle" font-size="10" fill="#333">2023-01-25</text>
  <text x="335" y="152" text-anchor="middle" font-size="10" fill="#333">2023-01-17</text>
  <text x="430" y="152" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <text x="495" y="152" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- row 4: hall2 12-09~23 -->
  <rect x="30" y="160" width="520" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="60"  y="176" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="140" y="176" text-anchor="middle" font-size="10" fill="#333">2022-12-09</text>
  <text x="225" y="176" text-anchor="middle" font-size="10" fill="#333">2022-12-23</text>
  <text x="335" y="176" text-anchor="middle" font-size="10" fill="#888">NULL</text>
  <text x="430" y="176" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <text x="495" y="176" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- row 5: hall2 12-13~17 (nested) -->
  <rect x="30" y="184" width="520" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="60"  y="200" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="140" y="200" text-anchor="middle" font-size="10" fill="#333">2022-12-13</text>
  <text x="225" y="200" text-anchor="middle" font-size="10" fill="#333">2022-12-17</text>
  <text x="335" y="200" text-anchor="middle" font-size="10" fill="#333">2022-12-23</text>
  <text x="430" y="200" text-anchor="middle" font-size="10" fill="#4a7a3a">0</text>
  <text x="495" y="200" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- row 6: hall3 12-01~01-30 -->
  <rect x="30" y="208" width="520" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="60"  y="224" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="140" y="224" text-anchor="middle" font-size="10" fill="#333">2022-12-01</text>
  <text x="225" y="224" text-anchor="middle" font-size="10" fill="#333">2023-01-30</text>
  <text x="335" y="224" text-anchor="middle" font-size="10" fill="#888">NULL</text>
  <text x="430" y="224" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <text x="495" y="224" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- note for nested row -->
  <text x="400" y="244" text-anchor="middle" font-size="9" fill="#b85450">↑ 嵌套行：start=12-13 ≤ 前缀 MAX=12-23 ⇒ 并入同岛</text>

  <!-- ============ Merged result table ============ -->
  <text x="40" y="276" font-size="11" fill="#4a7a3a" font-weight="bold">GROUP BY (hall_id, grp) 后取 MIN(start) / MAX(end)</text>

  <rect x="120" y="288" width="340" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="306" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">hall_id</text>
  <text x="290" y="306" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">start_day</text>
  <text x="400" y="306" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">end_day</text>

  <!-- merged rows -->
  <rect x="120" y="314" width="340" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="180" y="329" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="290" y="329" text-anchor="middle" font-size="10" fill="#333">2023-01-13</text>
  <text x="400" y="329" text-anchor="middle" font-size="10" fill="#333">2023-01-17</text>

  <rect x="120" y="336" width="340" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="180" y="351" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="290" y="351" text-anchor="middle" font-size="10" fill="#333">2023-01-18</text>
  <text x="400" y="351" text-anchor="middle" font-size="10" fill="#333">2023-01-25</text>

  <rect x="120" y="358" width="340" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="180" y="373" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="290" y="373" text-anchor="middle" font-size="10" fill="#333">2022-12-09</text>
  <text x="400" y="373" text-anchor="middle" font-size="10" fill="#333">2022-12-23</text>

  <rect x="120" y="380" width="340" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="180" y="395" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="290" y="395" text-anchor="middle" font-size="10" fill="#333">2022-12-01</text>
  <text x="400" y="395" text-anchor="middle" font-size="10" fill="#333">2023-01-30</text>

  <text x="290" y="420" text-anchor="middle" font-size="9" fill="#888">ORDER BY hall_id, start_day 整齐输出</text>
</svg>
