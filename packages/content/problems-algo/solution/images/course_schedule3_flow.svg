<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#b85450"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="480" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：排序 → 遍历 → 能放则放 / 否则替换更长</text>

  <!-- Step 1: Sort -->
  <rect x="150" y="44" width="220" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="67" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 按 lastDay 升序排序课程</text>

  <path d="M 260 84 L 260 100" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 2: Init -->
  <rect x="150" y="104" width="220" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="127" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② time = 0, 大顶堆 heap = 空</text>

  <path d="M 260 144 L 260 160" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 3: Loop -->
  <rect x="130" y="164" width="260" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="187" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 遍历每门课 (d, lastDay)</text>

  <path d="M 260 204 L 260 220" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Diamond: time + d <= lastDay? -->
  <polygon points="260,224 350,264 260,304 170,264" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="258" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">time + d</text>
  <text x="260" y="274" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">≤ lastDay?</text>

  <!-- Yes: take -->
  <path d="M 350 264 L 410 264" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="362" y="258" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="410" y="246" width="100" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="460" y="262" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">选课</text>
  <text x="460" y="276" text-anchor="middle" font-size="9.5" fill="#4a7a3a">time+=d, push(d)</text>

  <!-- loop back from take to step 3 -->
  <path d="M 460 246 L 460 182 L 390 182" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="3,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="412" y="176" font-size="9.5" fill="#4a7a3a">下一门</text>

  <!-- No branch -->
  <path d="M 170 264 L 110 264" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="122" y="258" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- Diamond: heap top > d? -->
  <polygon points="60,224 120,264 60,304 0,264" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="258" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">堆顶</text>
  <text x="60" y="272" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">&gt; d?</text>

  <!-- Yes: replace -->
  <path d="M 60 304 L 60 336" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="72" y="324" font-size="9.5" fill="#d6a040" font-weight="bold">是</text>
  <rect x="4" y="340" width="112" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="60" y="358" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">替换</text>
  <text x="60" y="372" text-anchor="middle" font-size="9" fill="#d6a040">pop(max)</text>
  <text x="60" y="383" text-anchor="middle" font-size="9" fill="#d6a040">push(d), time+=d−max</text>

  <!-- loop back from replace to step 3 -->
  <path d="M 60 340 L 60 182 L 130 182" stroke="#d6a040" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="78" y="176" font-size="9.5" fill="#d6a040">下一门</text>

  <!-- No: skip -->
  <path d="M 120 264 L 170 310" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="3,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="132" y="306" font-size="9.5" fill="#b85450" font-weight="bold">否</text>
  <rect x="170" y="318" width="76" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="208" y="338" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">跳过</text>

  <!-- loop back from skip to step 3 -->
  <path d="M 246 334 L 280 334 L 280 200" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="3,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="252" y="328" font-size="9" fill="#b85450">下一门</text>

  <!-- Return -->
  <path d="M 260 304 L 260 410" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <rect x="150" y="414" width="220" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="434" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">④ 返回 heap.size()</text>

  <!-- note -->
  <rect x="120" y="454" width="280" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="260" y="468" text-anchor="middle" font-size="9.5" fill="#d6a040">替换不改变课程数，但降低 time，为后续腾空间</text>
</svg>
