<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：数字格锚点直比 + 字母格双向映射</text>
  <text x="260" y="50" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">示例 2 命中候选 (1,1)：把 pattern 的字母替换成数字，恰好等于 board 子矩阵</text>

  <!-- 左：pattern -->
  <text x="105" y="74" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">pattern</text>
  <rect x="55" y="84" width="50" height="50" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="105" y="84" width="50" height="50" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <rect x="55" y="134" width="50" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="105" y="134" width="50" height="50" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="114" text-anchor="middle" font-size="16" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="130" y="114" text-anchor="middle" font-size="16" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="80" y="164" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">6</text>
  <text x="130" y="164" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">6</text>

  <!-- 右：board 子矩阵 -->
  <text x="415" y="74" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">board 子矩阵 @ (1,1)</text>
  <rect x="365" y="84" width="50" height="50" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="415" y="84" width="50" height="50" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="365" y="134" width="50" height="50" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="415" y="134" width="50" height="50" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="114" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <text x="440" y="114" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">4</text>
  <text x="390" y="164" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">6</text>
  <text x="440" y="164" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">6</text>

  <!-- 中：两张映射表 + 双向箭头 -->
  <path d="M157,105 L186,105" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M334,105 L363,105" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="190" y="86" width="140" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="102" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">l2d：字母 → 数字</text>
  <text x="260" y="119" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">a→3 ✓   b→4 ✓</text>

  <path d="M363,163 L334,163" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <path d="M186,163 L157,163" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <rect x="190" y="144" width="140" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="160" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">d2l：数字 → 字母</text>
  <text x="260" y="177" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3→a ✓   4→b ✓</text>

  <!-- 锚点说明 -->
  <text x="260" y="206" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">数字格 '6' 不进映射表：直接比对 6 = 6 ✓（锚点）</text>

  <!-- 规则框 -->
  <rect x="36" y="222" width="448" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="52" y="243" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">规则 A（字母→数字）：同字母必须映射同数字 —— a 上次是 3，这次还得是 3</text>
  <text x="52" y="262" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">规则 B（数字→字母）：同数字必须属于同字母 —— 3 已归 a，就不能再归 b</text>

  <rect x="36" y="286" width="448" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="52" y="307" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">单向映射漏判点：a→3、b→3 时两个方向的检查结果不同</text>
  <text x="52" y="327" font-size="11.5" fill="#333" filter="url(#rough2)">只查 l2d：两条各自成立 ⇒ 误判匹配；加查 d2l：数字 3 已属于 a ⇒ 冲突 ✗</text>
</svg>
