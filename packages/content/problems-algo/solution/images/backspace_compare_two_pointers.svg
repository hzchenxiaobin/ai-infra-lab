<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">双指针逆序：从右向左找「有效字符」</text>

  <!-- s string row -->
  <text x="30" y="58" font-size="11" fill="#888" font-weight="bold">s</text>
  <rect x="50" y="44" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="72" y="64" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">a</text>
  <rect x="98" y="44" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="64" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">b</text>
  <rect x="146" y="44" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="168" y="64" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">#</text>
  <rect x="194" y="44" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="216" y="64" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">c</text>
  <!-- pointer i at c -->
  <path d="M 216 90 L 216 78" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="216" y="104" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">i</text>

  <!-- skip logic flow -->
  <rect x="300" y="40" width="200" height="64" fill="#f8f8f8" stroke="#888" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="312" y="58" font-size="10.5" fill="#333" font-weight="bold">找下一个有效字符</text>
  <text x="312" y="76" font-size="10" fill="#555">遇 # → skip++, 左移</text>
  <text x="312" y="92" font-size="10" fill="#555">skip&gt;0 → 跳过该字符, 左移</text>

  <!-- arrow from i leftward -->
  <path d="M 200 120 L 120 120" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="150" y="114" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">向左扫描</text>

  <!-- t string row -->
  <text x="30" y="158" font-size="11" fill="#888" font-weight="bold">t</text>
  <rect x="50" y="144" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="72" y="164" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">a</text>
  <rect x="98" y="144" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="164" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">d</text>
  <rect x="146" y="144" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="168" y="164" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">#</text>
  <rect x="194" y="144" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="216" y="164" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">c</text>
  <path d="M 216 190 L 216 178" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="216" y="204" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">j</text>

  <!-- decision diamond -->
  <rect x="170" y="230" width="180" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="250" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">s[i] 与 t[j] 是否相等？</text>
  <text x="260" y="266" text-anchor="middle" font-size="10" fill="#888">(需先各自定位到有效字符)</text>

  <path d="M 216 130 L 230 228" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 216 210 L 250 228" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- yes branch -->
  <rect x="60" y="294" width="150" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="135" y="317" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">相等 → i--, j-- 继续</text>

  <!-- no branch -->
  <rect x="310" y="294" width="150" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="385" y="317" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">不等 → 返回 false</text>

  <path d="M 220 274 L 150 292" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="178" y="288" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 300 274 L 370 292" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="340" y="288" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- both exhausted -->
  <rect x="170" y="340" width="180" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="360" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">两串同时耗尽 → true</text>
</svg>
