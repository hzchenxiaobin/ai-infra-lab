<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="360" fill="#fafafa"/>

  <text x="290" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">递归剥标签：rest 从首个 # 起步，每轮剥一个、跳到下一个 #</text>

  <rect x="18" y="38" width="544" height="32" fill="#fff" stroke="#999" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="30" y="58" font-size="9.5" fill="#333" filter="url(#rough2)">推文 13：Enjoying a great start to the day. </text>
  <text x="262" y="58" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">#HappyDay #MorningVibes</text>

  <rect x="18" y="86" width="330" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="30" y="105" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">锚点（base）</text>
  <text x="30" y="124" font-size="9" fill="#333" filter="url(#rough2)">rest = SUBSTRING(tweet, LOCATE('#', tweet))</text>
  <text x="218" y="124" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">= "#HappyDay #MorningVibes"</text>

  <path d="M 183 142 L 183 154" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="18" y="158" width="330" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="30" y="177" font-size="9.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">轮 1：rest = "#HappyDay #MorningVibes"</text>
  <text x="30" y="194" font-size="9" fill="#333" filter="url(#rough2)">剥出 </text>
  <text x="54" y="194" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">#HappyDay</text>
  <text x="112" y="194" font-size="9" fill="#333" filter="url(#rough2)">；LOCATE('#', rest, 2) = 11 → rest 推进</text>
  <text x="30" y="210" font-size="9" fill="#8a6d1a" filter="url(#rough2)">新 rest = "#MorningVibes"（跳到下一个 #）</text>

  <path d="M 183 222 L 183 234" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="18" y="238" width="330" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="30" y="257" font-size="9.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">轮 2：rest = "#MorningVibes"</text>
  <text x="30" y="274" font-size="9" fill="#333" filter="url(#rough2)">剥出 </text>
  <text x="54" y="274" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">#MorningVibes</text>
  <text x="126" y="274" font-size="9" fill="#333" filter="url(#rough2)">；LOCATE('#', rest, 2) = 0</text>
  <text x="30" y="290" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">没有下一个 # → 递归终止（闸门 WHERE … > 0）</text>

  <rect x="372" y="86" width="190" height="128" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="467" y="106" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">exploded CTE 累积的行</text>
  <rect x="386" y="118" width="76" height="24" fill="#fff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="424" y="134" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">13</text>
  <rect x="470" y="118" width="84" height="24" fill="#fff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="512" y="134" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">#HappyDay</text>
  <rect x="386" y="150" width="76" height="24" fill="#fff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="424" y="166" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">13</text>
  <rect x="470" y="150" width="84" height="24" fill="#fff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="512" y="166" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">#MorningVibes</text>
  <text x="467" y="200" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">7 条推文 × 各 2 标签 = 14 行提及</text>

  <rect x="372" y="228" width="190" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="467" y="248" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">剥一个标签的三刀</text>
  <text x="467" y="264" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">SUBSTRING(rest, 2) 跳过 #</text>
  <text x="467" y="278" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">按 ' ' 截 → 按 '#' 截（防 #A#B 连写）</text>
  <text x="467" y="292" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">CONCAT('#', …) 拼回前缀</text>

  <rect x="18" y="312" width="544" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="290" y="328" text-anchor="middle" font-size="9.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">终止条件只管「停止繁殖新行」，当前行的标签照样被外层数到；</text>
  <text x="290" y="343" text-anchor="middle" font-size="9.5" fill="#8a6d1a" filter="url(#rough2)">数据驱动 → 天然不需要「每条推文最多几个标签」的先验上界</text>
</svg>
