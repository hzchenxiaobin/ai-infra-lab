<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="720" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="360" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：6 行 Person → 6 行拼接结果（逐行映射）</text>
  <text x="360" y="42" text-anchor="middle" font-size="10.5" fill="#888">每行独立 CONCAT(name, profession)，无分隔符；输出行序与输入一致</text>

  <!-- ===== Input table (left) ===== -->
  <text x="40" y="74" font-size="11.5" fill="#666" font-weight="bold">Person（输入，6 行）</text>
  <rect x="40" y="82" width="260" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="100" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">person_id</text>
  <text x="150" y="100" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">name</text>
  <text x="240" y="100" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">profession</text>

  <!-- 6 input rows -->
  <g font-size="11" fill="#333">
    <rect x="40" y="108" width="260" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="70" y="124" text-anchor="middle">1</text><text x="150" y="124" text-anchor="middle" fill="#446688" font-weight="bold">Alex</text><text x="240" y="124" text-anchor="middle">Singer</text>

    <rect x="40" y="132" width="260" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="70" y="148" text-anchor="middle">3</text><text x="150" y="148" text-anchor="middle" fill="#446688" font-weight="bold">Alice</text><text x="240" y="148" text-anchor="middle">Actor</text>

    <rect x="40" y="156" width="260" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="70" y="172" text-anchor="middle">2</text><text x="150" y="172" text-anchor="middle" fill="#446688" font-weight="bold">Bob</text><text x="240" y="172" text-anchor="middle">Player</text>

    <rect x="40" y="180" width="260" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="70" y="196" text-anchor="middle">4</text><text x="150" y="196" text-anchor="middle" fill="#446688" font-weight="bold">Messi</text><text x="240" y="196" text-anchor="middle">Doctor</text>

    <rect x="40" y="204" width="260" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="70" y="220" text-anchor="middle">6</text><text x="150" y="220" text-anchor="middle" fill="#446688" font-weight="bold">Tyson</text><text x="240" y="220" text-anchor="middle">Engineer</text>

    <rect x="40" y="228" width="260" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="70" y="244" text-anchor="middle">5</text><text x="150" y="244" text-anchor="middle" fill="#446688" font-weight="bold">Meir</text><text x="240" y="244" text-anchor="middle">Lawyer</text>
  </g>

  <!-- arrows row -> output (6 arrows) -->
  <path d="M 302 120 L 408 120" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 302 144 L 408 144" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 302 168 L 408 168" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 302 192 L 408 192" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 302 216 L 408 216" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 302 240 L 408 240" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="355" y="108" text-anchor="middle" font-size="9.5" fill="#888">CONCAT(name, profession)</text>

  <!-- ===== Output table (right) ===== -->
  <text x="412" y="74" font-size="11.5" fill="#666" font-weight="bold">输出（单列 name，6 行）</text>
  <rect x="412" y="82" width="270" height="26" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="547" y="100" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">name</text>

  <g font-size="11" fill="#4a7a3a" font-weight="bold">
    <rect x="412" y="108" width="270" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="547" y="124" text-anchor="middle">AlexSinger</text>

    <rect x="412" y="132" width="270" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="547" y="148" text-anchor="middle">AliceActor</text>

    <rect x="412" y="156" width="270" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="547" y="172" text-anchor="middle">BobPlayer</text>

    <rect x="412" y="180" width="270" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="547" y="196" text-anchor="middle">MessiDoctor</text>

    <rect x="412" y="204" width="270" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="547" y="220" text-anchor="middle">TysonEngineer</text>

    <rect x="412" y="228" width="270" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="547" y="244" text-anchor="middle">MeirLawyer</text>
  </g>

  <!-- Bottom takeaway -->
  <rect x="40" y="288" width="640" height="150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="360" y="312" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">关键观察</text>
  <text x="60" y="334" font-size="10.5" fill="#555">• 行数守恒：输入 6 行 → 输出 6 行，逐行映射，无聚合无过滤（无 GROUP BY / WHERE）。</text>
  <text x="60" y="352" font-size="10.5" fill="#555">• 拼接顺序：CONCAT 按入参顺序首尾相接，name 在前、profession 在后，故 Alex+Singer = AlexSinger（非 SingerAlex）。</text>
  <text x="60" y="370" font-size="10.5" fill="#555">• 无分隔符：CONCAT 不插入任何字符；若误写 CONCAT(name,' ',profession) 会得到 "Alex Singer"（带空格），与「concatenate」语义不符。</text>
  <text x="60" y="388" font-size="10.5" fill="#555">• person_id 不参与拼接：它仅标识行，被 SELECT 子句投影掉，不出现在输出中。</text>
  <text x="60" y="406" font-size="10.5" fill="#555">• 行序：示例按输入顺序输出；若题面要求特定排序再加 ORDER BY，本题默认不排序。</text>

  <text x="360" y="448" text-anchor="middle" font-size="9.5" fill="#bbb">CONCAT 是逐行标量函数：对每一行独立求 name‖profession，行间互不影响，故可并行求值</text>
</svg>
