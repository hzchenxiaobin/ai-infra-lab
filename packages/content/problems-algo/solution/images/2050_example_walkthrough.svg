<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="4.5" refY="8" orient="auto">
      <path d="M0,0 L4.5,8 L9,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="4.5" refY="8" orient="auto">
      <path d="M0,0 L4.5,8 L9,0 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 2 演算：n=5, time=[1,2,3,4,5]</text>

  <!-- ===== Graph ===== -->
  <text x="40" y="50" font-size="12" fill="#555" font-weight="bold">依赖图（红=关键路径 3→4→5）：</text>

  <!-- Edges -->
  <!-- 1 -> 5 -->
  <path d="M 70 96 L 320 196" stroke="#bbb" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <!-- 2 -> 5 -->
  <path d="M 70 146 L 320 196" stroke="#bbb" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <!-- 3 -> 5 -->
  <path d="M 70 196 L 320 196" stroke="#bbb" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <!-- 3 -> 4 (critical red) -->
  <path d="M 70 196 L 200 196" stroke="#b85450" stroke-width="2.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <!-- 4 -> 5 (critical red) -->
  <path d="M 200 196 L 320 196" stroke="#b85450" stroke-width="2.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Nodes -->
  <circle cx="70" cy="96" r="17" fill="#fafafa" stroke="#888" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="101" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">1</text>
  <text x="70" y="80" text-anchor="middle" font-size="9.5" fill="#888">t=1</text>

  <circle cx="70" cy="146" r="17" fill="#fafafa" stroke="#888" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="151" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">2</text>
  <text x="70" y="130" text-anchor="middle" font-size="9.5" fill="#888">t=2</text>

  <circle cx="70" cy="196" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="70" y="201" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="70" y="180" text-anchor="middle" font-size="9.5" fill="#888">t=3</text>

  <circle cx="200" cy="196" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="200" y="201" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <text x="200" y="180" text-anchor="middle" font-size="9.5" fill="#888">t=4</text>

  <circle cx="320" cy="196" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="320" y="201" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <text x="320" y="180" text-anchor="middle" font-size="9.5" fill="#888">t=5</text>

  <!-- Divider -->
  <path d="M 40 226 L 520 226" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== dist evolution table ===== -->
  <text x="280" y="248" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">拓扑序松弛 dist[v]（每门课最早完成时间）</text>

  <!-- Table header -->
  <rect x="40" y="262" width="480" height="24" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="92" y="278" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">处理 u</text>
  <text x="180" y="278" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">松弛 v</text>
  <text x="290" y="278" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">dist[v] 更新</text>
  <text x="430" y="278" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">indeg[v]</text>

  <!-- Row: init -->
  <rect x="40" y="288" width="480" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="92" y="303" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">初始化</text>
  <text x="180" y="303" text-anchor="middle" font-size="10.5" fill="#555">1,2,3,4,5</text>
  <text x="290" y="303" text-anchor="middle" font-size="10.5" fill="#333">[1, 2, 3, 4, 5]</text>
  <text x="430" y="303" text-anchor="middle" font-size="10.5" fill="#333">0入队:1,2,3</text>

  <!-- Row: process 1 -->
  <rect x="40" y="312" width="480" height="22" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="92" y="327" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">u=1</text>
  <text x="180" y="327" text-anchor="middle" font-size="10.5" fill="#333">1→5</text>
  <text x="290" y="327" text-anchor="middle" font-size="10.5" fill="#333">dist[5]=max(5, 1+5)=6</text>
  <text x="430" y="327" text-anchor="middle" font-size="10.5" fill="#333">3</text>

  <!-- Row: process 2 -->
  <rect x="40" y="336" width="480" height="22" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="92" y="351" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">u=2</text>
  <text x="180" y="351" text-anchor="middle" font-size="10.5" fill="#333">2→5</text>
  <text x="290" y="351" text-anchor="middle" font-size="10.5" fill="#333">dist[5]=max(6, 2+5)=7</text>
  <text x="430" y="351" text-anchor="middle" font-size="10.5" fill="#333">2</text>

  <!-- Row: process 3 (two relaxes) -->
  <rect x="40" y="360" width="480" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="92" y="381" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">u=3</text>
  <text x="180" y="375" text-anchor="middle" font-size="10.5" fill="#333">3→5</text>
  <text x="290" y="375" text-anchor="middle" font-size="10.5" fill="#333">dist[5]=max(7, 3+5)=8</text>
  <text x="430" y="375" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <text x="180" y="391" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">3→4</text>
  <text x="290" y="391" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">dist[4]=max(4, 3+4)=7</text>
  <text x="430" y="391" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">0→入队</text>

  <!-- Row: process 4 (critical) -->
  <rect x="40" y="398" width="480" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="92" y="413" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">u=4</text>
  <text x="180" y="413" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">4→5</text>
  <text x="290" y="413" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">dist[5]=max(8, 7+5)=12</text>
  <text x="430" y="413" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">0→入队</text>

  <!-- Result -->
  <rect x="40" y="424" width="480" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="444" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">答案 = max(dist) = max(1, 2, 3, 7, 12) = 12</text>
  <text x="280" y="462" text-anchor="middle" font-size="10.5" fill="#888">关键路径 3→4→5：3 + 4 + 5 = 12（决定总工期）</text>
</svg>
