<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="720" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="360" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：4 行数据各过三级判定，落进四个类别</text>
  <text x="360" y="44" text-anchor="middle" font-size="10.5" fill="#888">行 4 在第一级（合法性）就被拦截——「先合法性后分类」的直接体现</text>

  <!-- column header -->
  <rect x="40" y="76" width="616" height="28" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="57" y="94" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">行</text>
  <text x="122" y="94" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">A, B, C</text>
  <text x="277" y="94" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">合法性：任意两边之和 &gt; 第三边？</text>
  <text x="460" y="94" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">边型判定</text>
  <text x="596" y="94" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">triangle_type</text>

  <!-- row 1: 20,20,23 → Isosceles -->
  <rect x="40" y="104" width="496" height="32" fill="#f8f8f8" stroke="#bbb" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="57" y="124" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="122" y="124" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">20, 20, 23</text>
  <text x="277" y="124" text-anchor="middle" font-size="10" fill="#333">40&gt;23✓ 43&gt;20✓ 43&gt;20✓ → 合法</text>
  <text x="460" y="124" text-anchor="middle" font-size="10" fill="#333">全等✗ 恰两等✓</text>
  <rect x="536" y="104" width="120" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="596" y="124" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">Isosceles</text>

  <!-- row 2: 20,20,20 → Equilateral -->
  <rect x="40" y="136" width="496" height="32" fill="#f8f8f8" stroke="#bbb" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="57" y="156" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="122" y="156" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">20, 20, 20</text>
  <text x="277" y="156" text-anchor="middle" font-size="10" fill="#333">40&gt;20✓ 40&gt;20✓ 40&gt;20✓ → 合法</text>
  <text x="460" y="156" text-anchor="middle" font-size="10" fill="#333">全等✓（先拦截）</text>
  <rect x="536" y="136" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="596" y="156" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">Equilateral</text>

  <!-- row 3: 20,21,22 → Scalene -->
  <rect x="40" y="168" width="496" height="32" fill="#f8f8f8" stroke="#bbb" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="57" y="188" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="122" y="188" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">20, 21, 22</text>
  <text x="277" y="188" text-anchor="middle" font-size="10" fill="#333">41&gt;22✓ 42&gt;21✓ 43&gt;20✓ → 合法</text>
  <text x="460" y="188" text-anchor="middle" font-size="10" fill="#333">互异（两等✗）</text>
  <rect x="536" y="168" width="120" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="596" y="188" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">Scalene</text>

  <!-- row 4: 13,14,30 → Not A Triangle (short-circuited) -->
  <rect x="40" y="200" width="496" height="32" fill="#fdf0f2" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="57" y="220" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">4</text>
  <text x="122" y="220" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">13, 14, 30</text>
  <text x="277" y="220" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">27&gt;30✗ → 不合法</text>
  <text x="460" y="220" text-anchor="middle" font-size="10" fill="#b85450">—（短路跳过）</text>
  <rect x="536" y="200" width="120" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="596" y="220" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">Not A Triangle</text>

  <!-- ============ bottom takeaway ============ -->
  <rect x="40" y="252" width="616" height="84" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="348" y="274" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">关键点：① 4 行输入 → 4 行输出，行数守恒（逐行映射，无聚合无过滤）</text>
  <text x="348" y="292" text-anchor="middle" font-size="10.5" fill="#555">② 行 4 第一级即短路：不合法 → Not A Triangle，边型判定不再执行</text>
  <text x="348" y="310" text-anchor="middle" font-size="10.5" fill="#555">③ 行 2 验证「全等先于两等」的分支顺序；行 1 验证等腰不看第三边大小</text>
  <text x="348" y="328" text-anchor="middle" font-size="10.5" fill="#888">④ 边界自测：(1,1,3) 两等但非法 → Not A Triangle；(1,2,3) 退化（和=第三边）→ Not A Triangle</text>

  <text x="360" y="352" text-anchor="middle" font-size="9.5" fill="#bbb">输出与示例逐行一致：Isosceles / Equilateral / Scalene / Not A Triangle</text>
</svg>
