<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：shrink while bad 计数滑窗，一次扫描 O(n)</text>

  <!-- 初始化 -->
  <rect x="140" y="36" width="240" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="54" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">初始化 left=0, zeros=ones=ans=0</text>
  <path d="M 260 64 L 260 84" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环头 -->
  <rect x="170" y="88" width="180" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="106" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">right = 0 … n−1 逐个扫描</text>
  <path d="M 260 116 L 260 132" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 入窗 -->
  <rect x="170" y="136" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="151" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">s[right] 入窗</text>
  <text x="260" y="165" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">zeros / ones 对应 +1</text>
  <path d="M 260 170 L 260 182" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="260,186 357,222 260,258 163,222" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="216" text-anchor="middle" font-size="11" fill="#8a3833" font-weight="bold" filter="url(#rough2)">zeros &gt; k 且</text>
  <text x="260" y="234" text-anchor="middle" font-size="11" fill="#8a3833" font-weight="bold" filter="url(#rough2)">ones &gt; k ?</text>
  <text x="105" y="250" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠ 条件是 &amp;&amp;</text>
  <text x="105" y="264" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">只超一边不收缩</text>

  <!-- 是：出窗 -->
  <path d="M 357 222 L 448 222 L 448 182" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="376" y="213" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">是（坏）</text>
  <rect x="392" y="122" width="112" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="448" y="142" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">s[left] 出窗</text>
  <text x="448" y="160" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">计数 −1，left++</text>
  <path d="M 448 122 L 448 84 L 152 84 L 152 219 L 158 221" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="78" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">循环重测</text>

  <!-- 否：计数 -->
  <path d="M 260 258 L 260 274" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="274" y="270" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">否（好）</text>
  <rect x="155" y="278" width="210" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="299" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ans += right − left + 1</text>

  <!-- 下一个 right -->
  <path d="M 155 295 L 62 295 L 62 153 L 164 153" fill="none" stroke="#999" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="88" y="146" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">下一个 right</text>

  <!-- 结束 -->
  <path d="M 260 312 L 260 328" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="195" y="332" width="130" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="349" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">返回 ans</text>
</svg>
