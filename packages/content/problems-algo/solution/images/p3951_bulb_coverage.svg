<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：一盏灯最多照亮 3 个位置 ⇒ 最少灯数 k = ⌈brightness / 3⌉</text>
  <text x="260" y="40" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">示例：n = 9，brightness = 8 —— 灯放在位置 1、4、7，虚线框 = 该灯照亮的 3 格</text>

  <!-- 灯泡：位置 1 / 4 / 7 -->
  <g filter="url(#rough2)">
    <path d="M 110 68 L 105 63" stroke="#d6a040" stroke-width="1.6"/>
    <path d="M 121 63 L 121 57" stroke="#d6a040" stroke-width="1.6"/>
    <path d="M 132 68 L 137 63" stroke="#d6a040" stroke-width="1.6"/>
    <circle cx="121" cy="76" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="121" y="80" text-anchor="middle" font-size="9" fill="#8a6d1f">灯</text>

    <path d="M 248 68 L 243 63" stroke="#d6a040" stroke-width="1.6"/>
    <path d="M 259 63 L 259 57" stroke="#d6a040" stroke-width="1.6"/>
    <path d="M 270 68 L 275 63" stroke="#d6a040" stroke-width="1.6"/>
    <circle cx="259" cy="76" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="259" y="80" text-anchor="middle" font-size="9" fill="#8a6d1f">灯</text>

    <path d="M 386 68 L 381 63" stroke="#d6a040" stroke-width="1.6"/>
    <path d="M 397 63 L 397 57" stroke="#d6a040" stroke-width="1.6"/>
    <path d="M 408 68 L 413 63" stroke="#d6a040" stroke-width="1.6"/>
    <circle cx="397" cy="76" r="11" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="397" y="80" text-anchor="middle" font-size="9" fill="#8a6d1f">灯</text>
  </g>

  <!-- 灯 → 格子的箭头 -->
  <path d="M 121 90 L 121 103" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 259 90 L 259 103" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 397 90 L 397 103" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- 覆盖范围虚线框（每 3 格一组） -->
  <rect x="49" y="106" width="144" height="52" rx="8" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <rect x="187" y="106" width="144" height="52" rx="8" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <rect x="325" y="106" width="144" height="52" rx="8" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6,4" filter="url(#rough2)"/>

  <!-- 9 个格子（全部被照亮） -->
  <g filter="url(#rough2)">
    <rect x="53" y="112" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="99" y="112" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="145" y="112" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="191" y="112" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="237" y="112" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="283" y="112" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="329" y="112" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="375" y="112" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="421" y="112" width="44" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>

  <!-- 位置下标 -->
  <g filter="url(#rough2)" font-size="10.5" fill="#666" text-anchor="middle">
    <text x="75" y="172">0</text>
    <text x="121" y="172">1</text>
    <text x="167" y="172">2</text>
    <text x="213" y="172">3</text>
    <text x="259" y="172">4</text>
    <text x="305" y="172">5</text>
    <text x="351" y="172">6</text>
    <text x="397" y="172">7</text>
    <text x="443" y="172">8</text>
  </g>

  <text x="260" y="192" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">灯放在位置 1、4、7：三个虚线框互不重叠，每盏灯都照亮满 3 格（9 ≥ 8 即达标）</text>

  <!-- 左小图：边界灯只照 2 格 -->
  <text x="155" y="208" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">边界灯只照 2 格</text>
  <g filter="url(#rough2)">
    <path d="M 139 208 L 135 204" stroke="#d6a040" stroke-width="1.4"/>
    <path d="M 145 205 L 145 200" stroke="#d6a040" stroke-width="1.4"/>
    <path d="M 151 208 L 155 204" stroke="#d6a040" stroke-width="1.4"/>
    <circle cx="145" cy="214" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <rect x="103" y="222" width="58" height="36" rx="6" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="55" y="226" width="24" height="28" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="81" y="226" width="24" height="28" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="107" y="226" width="24" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="133" y="226" width="24" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="155" y="274" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">位置 0 / n−1 的灯缺一个邻居</text>

  <!-- 右小图：灯挨着放会重叠浪费 -->
  <text x="385" y="208" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">灯挨着放会重叠浪费</text>
  <g filter="url(#rough2)">
    <path d="M 324 208 L 320 204" stroke="#d6a040" stroke-width="1.4"/>
    <path d="M 330 205 L 330 200" stroke="#d6a040" stroke-width="1.4"/>
    <path d="M 336 208 L 340 204" stroke="#d6a040" stroke-width="1.4"/>
    <circle cx="330" cy="214" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <path d="M 348 208 L 344 204" stroke="#d6a040" stroke-width="1.4"/>
    <path d="M 354 205 L 354 200" stroke="#d6a040" stroke-width="1.4"/>
    <path d="M 360 208 L 364 204" stroke="#d6a040" stroke-width="1.4"/>
    <circle cx="354" cy="214" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <rect x="291" y="222" width="102" height="36" rx="6" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="295" y="226" width="22" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="319" y="226" width="22" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="343" y="226" width="22" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="367" y="226" width="22" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <rect x="391" y="226" width="22" height="28" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
    <rect x="415" y="226" width="22" height="28" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <text x="364" y="274" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">灯放 1 和 2：位置 1、2 被重复照亮，2 盏只换来 4 格</text>

  <!-- 底部要点框 -->
  <rect x="30" y="286" width="460" height="64" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="308" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">k 盏灯最大照亮 min(n, 3k) 格；brightness ≤ n ⇒ k = ⌈B/3⌉ 一定够（本图 B = 8 → k = 3）</text>
  <text x="260" y="326" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">下界：每盏 ≤ 3 格；构造：隔 3 格放灯 1, 4, 7, …，最后一盏贴右边界亏 1 格也不妨</text>
  <text x="260" y="342" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">示例 1：B = 5 → k = 2，灯放 1 和 4，照亮 3 + 2 = 5 格恰好达标</text>
</svg>
