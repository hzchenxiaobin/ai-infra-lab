<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">二分答案算法流程（求最大的 k 使 k(k+1)/2 ≤ n）</text>

  <!-- Start node -->
  <ellipse cx="270" cy="62" rx="110" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="12" fill="#333">开始: lo=1, hi=n, ans=0</text>

  <!-- arrow down -->
  <path d="M 270 82 L 270 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: lo <= hi? -->
  <polygon points="270,104 370,150 270,196 170,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="146" text-anchor="middle" font-size="12" fill="#333">lo &lt;= hi ?</text>
  <text x="270" y="162" text-anchor="middle" font-size="11" fill="#666">(二分未结束)</text>

  <!-- No branch -> end -->
  <path d="M 370 150 L 452 150" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="142" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="486" cy="150" rx="46" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="486" y="154" text-anchor="middle" font-size="12" fill="#333">返回 ans</text>

  <!-- Yes branch down -->
  <path d="M 270 196 L 270 214" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="210" font-size="11" fill="#82b366">是</text>

  <!-- mid computation -->
  <rect x="140" y="218" width="260" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="240" text-anchor="middle" font-size="12" fill="#333">mid = lo + (hi − lo) / 2  （候选行数 k）</text>

  <!-- arrow down -->
  <path d="M 270 252 L 270 270" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: mid*(mid+1)/2 <= n? -->
  <polygon points="270,274 390,322 270,370 150,322" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="316" text-anchor="middle" font-size="12" fill="#333">(long)mid*(mid+1)/2 &lt;= n ?</text>
  <text x="270" y="334" text-anchor="middle" font-size="11" fill="#666">(k 行硬币数 ≤ n)</text>

  <!-- Yes (feasible) -> try bigger -->
  <path d="M 390 322 L 440 322" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="414" y="314" text-anchor="middle" font-size="11" fill="#82b366">是</text>
  <rect x="442" y="302" width="84" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="484" y="320" text-anchor="middle" font-size="11" fill="#333">ans = mid</text>
  <text x="484" y="336" text-anchor="middle" font-size="11" fill="#555">lo = mid + 1</text>

  <!-- No (too big) -> try smaller -->
  <path d="M 150 322 L 100 322" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="124" y="314" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <rect x="14" y="302" width="84" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="328" text-anchor="middle" font-size="11" fill="#333">hi = mid − 1</text>

  <!-- loop back arrow from left box up to decision -->
  <path d="M 56 302 L 56 150 L 170 150" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="48" y="230" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 48 230)">继续二分</text>

  <!-- loop back arrow from right box up to decision -->
  <path d="M 484 302 L 484 150 L 370 150" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- summary note -->
  <text x="270" y="402" text-anchor="middle" font-size="11" fill="#888">求「最大的可行 k」⇒ 可行时先记 ans 再向右收缩；mid*(mid+1) 用 long 防溢出</text>
  <text x="270" y="420" text-anchor="middle" font-size="10" fill="#aaa">对比「求最小可行」(如 875 珂珂)：可行分支方向相反</text>
</svg>
