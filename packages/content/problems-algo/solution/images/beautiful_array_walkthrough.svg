<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="600" height="410" fill="#fafafa"/>

  <text x="300" y="22" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：自底向上构造 f(8)</text>
  <text x="300" y="38" text-anchor="middle" font-size="10" fill="#888">每层 = 上一层经 2x−1（奇，蓝）与 2x（偶，绿）两种映射后拼接，规模翻倍</text>

  <!-- ============ Section A: f(1) -> f(2) ============ -->
  <text x="60" y="60" font-size="12" fill="#666" font-weight="bold">f(1)</text>
  <!-- source f(1) -->
  <rect x="283" y="44" width="34" height="24" fill="#fff" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="300" y="60" text-anchor="middle" font-size="11" fill="#333">1</text>
  <!-- split -->
  <path d="M 300 70 L 300 76" stroke="#888" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 300 76 L 282 88" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 300 76 L 318 88" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="266" y="84" font-size="9" fill="#446688" font-weight="bold">2x−1</text>
  <text x="324" y="84" font-size="9" fill="#4a7a3a" font-weight="bold">2x</text>
  <!-- result f(2) -->
  <text x="60" y="104" font-size="12" fill="#666" font-weight="bold">f(2)</text>
  <rect x="263" y="88" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="104" text-anchor="middle" font-size="11" fill="#333">1</text>
  <line x1="300" y1="88" x2="300" y2="112" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <rect x="303" y="88" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="104" text-anchor="middle" font-size="11" fill="#333">2</text>

  <!-- ============ Section B: f(2) -> f(4) ============ -->
  <text x="60" y="140" font-size="12" fill="#666" font-weight="bold">f(2)</text>
  <rect x="263" y="124" width="34" height="24" fill="#fff" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="280" y="140" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="303" y="124" width="34" height="24" fill="#fff" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="320" y="140" text-anchor="middle" font-size="11" fill="#333">2</text>
  <!-- split -->
  <path d="M 300 150 L 300 156" stroke="#888" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 300 156 L 243 168" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 300 156 L 319 168" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="256" y="164" font-size="9" fill="#446688" font-weight="bold">2x−1</text>
  <text x="326" y="164" font-size="9" fill="#4a7a3a" font-weight="bold">2x</text>
  <!-- result f(4) -->
  <text x="60" y="184" font-size="12" fill="#666" font-weight="bold">f(4)</text>
  <rect x="224" y="168" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="241" y="184" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="262" y="168" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="279" y="184" text-anchor="middle" font-size="11" fill="#333">3</text>
  <line x1="299" y1="168" x2="299" y2="192" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <rect x="300" y="168" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="317" y="184" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="338" y="168" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="355" y="184" text-anchor="middle" font-size="11" fill="#333">4</text>

  <!-- ============ Section C: f(4) -> f(8) ============ -->
  <text x="60" y="220" font-size="12" fill="#666" font-weight="bold">f(4)</text>
  <rect x="224" y="204" width="34" height="24" fill="#fff" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="241" y="220" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="262" y="204" width="34" height="24" fill="#fff" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="279" y="220" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="300" y="204" width="34" height="24" fill="#fff" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="317" y="220" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="338" y="204" width="34" height="24" fill="#fff" stroke="#888" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="355" y="220" text-anchor="middle" font-size="11" fill="#333">4</text>
  <!-- split -->
  <path d="M 300 230 L 300 236" stroke="#888" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 300 236 L 205 248" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 300 236 L 357 248" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="226" y="244" font-size="9" fill="#446688" font-weight="bold">2x−1</text>
  <text x="332" y="244" font-size="9" fill="#4a7a3a" font-weight="bold">2x</text>
  <!-- result f(8) -->
  <text x="60" y="264" font-size="12" fill="#666" font-weight="bold">f(8)</text>
  <g font-size="11">
    <rect x="148" y="248" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="165" y="264" text-anchor="middle" fill="#333">1</text>
    <rect x="186" y="248" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="203" y="264" text-anchor="middle" fill="#333">5</text>
    <rect x="224" y="248" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="241" y="264" text-anchor="middle" fill="#333">3</text>
    <rect x="262" y="248" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="279" y="264" text-anchor="middle" fill="#333">7</text>
    <line x1="299" y1="248" x2="299" y2="272" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" filter="url(#rough2)"/>
    <rect x="300" y="248" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="317" y="264" text-anchor="middle" fill="#333">2</text>
    <rect x="338" y="248" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="355" y="264" text-anchor="middle" fill="#333">6</text>
    <rect x="376" y="248" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="393" y="264" text-anchor="middle" fill="#333">4</text>
    <rect x="414" y="248" width="34" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="431" y="264" text-anchor="middle" fill="#333">8</text>
  </g>
  <!-- half labels -->
  <text x="205" y="288" text-anchor="middle" font-size="9" fill="#446688">奇数段（2·f(4)−1）</text>
  <text x="357" y="288" text-anchor="middle" font-size="9" fill="#4a7a3a">偶数段（2·f(4)）</text>

  <!-- ===== Result box ===== -->
  <rect x="80" y="300" width="440" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="322" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">f(8) = [1, 5, 3, 7, 2, 6, 4, 8] ✓ 漂亮数组</text>

  <!-- ===== Notes ===== -->
  <text x="300" y="354" text-anchor="middle" font-size="10" fill="#888">每个上一层元素 x 同时产出 2x−1（填左半）和 2x（填右半），整段翻倍</text>
  <text x="300" y="372" text-anchor="middle" font-size="10" fill="#888">非 2 的幂同样适用：N=5 → half=3, N−half=2，左段取 f(3) 映射、右段取 f(2) 映射</text>
  <text x="300" y="390" text-anchor="middle" font-size="10" fill="#888">验证 f(8) 无等差三元组：如 1,3,5 不在「中位」位置出现，奇偶段隔绝不平均</text>
</svg>
