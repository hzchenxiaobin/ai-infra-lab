<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：两条边锁定中心</text>

  <!-- ===== Example 1 ===== -->
  <text x="30" y="52" font-size="11.5" fill="#d6a040" font-weight="bold">示例 1</text>
  <text x="78" y="52" font-size="10.5" fill="#888">edges = [[1,2],[2,3],[4,2]]　n = 4</text>

  <!-- e0 box -->
  <rect x="30" y="62" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="82" text-anchor="middle" font-size="11" fill="#333">e0 = [1,2]</text>

  <text x="120" y="82" font-size="14" fill="#666">,</text>

  <!-- e1 box -->
  <rect x="132" y="62" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="172" y="82" text-anchor="middle" font-size="11" fill="#333">e1 = [2,3]</text>

  <!-- arrow down -->
  <path d="M 70 94 L 70 110" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step: u0=1 in e1? -->
  <rect x="30" y="116" width="300" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="180" y="133" text-anchor="middle" font-size="10.5" fill="#333">u0 = 1，检查 1 是否在 e1 = [2,3] 中？</text>

  <!-- arrow down -->
  <path d="M 180 144 L 180 160" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- No -->
  <rect x="30" y="166" width="300" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="180" y="183" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">否 → u0 非中心 → return v0 = 2 ✓</text>

  <!-- Result highlight -->
  <rect x="350" y="62" width="140" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="420" y="82" text-anchor="middle" font-size="10.5" fill="#4a7a3a">答案</text>
  <text x="420" y="103" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">2</text>

  <!-- ===== Example 2 ===== -->
  <text x="30" y="220" font-size="11.5" fill="#d6a040" font-weight="bold">示例 2</text>
  <text x="78" y="220" font-size="10.5" fill="#888">edges = [[1,2],[5,1],[1,3],[1,4]]　n = 5</text>

  <!-- e0 box -->
  <rect x="30" y="230" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="250" text-anchor="middle" font-size="11" fill="#333">e0 = [1,2]</text>

  <text x="120" y="250" font-size="14" fill="#666">,</text>

  <!-- e1 box -->
  <rect x="132" y="230" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="172" y="250" text-anchor="middle" font-size="11" fill="#333">e1 = [5,1]</text>

  <!-- arrow down -->
  <path d="M 70 262 L 70 278" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step: u0=1 in e1? -->
  <rect x="30" y="284" width="300" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="180" y="301" text-anchor="middle" font-size="10.5" fill="#333">u0 = 1，检查 1 是否在 e1 = [5,1] 中？</text>

  <!-- arrow down -->
  <path d="M 180 312 L 180 328" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Yes -->
  <rect x="30" y="334" width="300" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="180" y="351" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">是 → u0 即中心 → return u0 = 1 ✓</text>

  <!-- Result highlight -->
  <rect x="350" y="230" width="140" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="420" y="250" text-anchor="middle" font-size="10.5" fill="#4a7a3a">答案</text>
  <text x="420" y="271" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>

  <!-- Footer -->
  <text x="260" y="372" text-anchor="middle" font-size="10" fill="#aaa">两例都只读了前两条边，未触碰后续边——结构保证使遍历退化为 O(1)</text>
</svg>
