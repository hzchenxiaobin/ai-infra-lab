<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">示例演算：bulbs = [3,1,5,2,4]，K = 1</text>
  <text x="320" y="48" text-anchor="middle" font-size="11" fill="#888">days = [2, 4, 1, 5, 3]（位置 1..5 的点亮日），窗口 right = left + K + 1</text>

  <!-- table header -->
  <g filter="url(#rough2)">
    <rect x="24" y="62" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="76" y="62" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="128" y="62" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="180" y="62" width="96" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="276" y="62" width="72" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="348" y="62" width="72" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="420" y="62" width="72" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="492" y="62" width="72" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <text x="50" y="80" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">步</text>
  <text x="102" y="80" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">left</text>
  <text x="154" y="80" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">right</text>
  <text x="228" y="80" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">中段位置</text>
  <text x="312" y="80" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">midMin</text>
  <text x="384" y="80" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">endMax</text>
  <text x="456" y="80" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">合法?</text>
  <text x="528" y="80" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans</text>

  <!-- row 1: left=1 -->
  <g filter="url(#rough2)">
    <rect x="24" y="90" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="76" y="90" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="128" y="90" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="180" y="90" width="96" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="276" y="90" width="72" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="348" y="90" width="72" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="420" y="90" width="72" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="492" y="90" width="72" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
  </g>
  <text x="50" y="111" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">①</text>
  <text x="102" y="111" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="154" y="111" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="228" y="111" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">{2}</text>
  <text x="312" y="111" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <text x="384" y="111" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="456" y="111" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4&gt;2 ✓</text>
  <text x="528" y="111" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2 ★</text>

  <!-- row 2: left=2 -->
  <g filter="url(#rough2)">
    <rect x="24" y="124" width="52" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <rect x="76" y="124" width="52" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <rect x="128" y="124" width="52" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <rect x="180" y="124" width="96" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <rect x="276" y="124" width="72" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <rect x="348" y="124" width="72" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <rect x="420" y="124" width="72" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <rect x="492" y="124" width="72" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
  </g>
  <text x="50" y="145" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">②</text>
  <text x="102" y="145" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="154" y="145" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <text x="228" y="145" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">{3}</text>
  <text x="312" y="145" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="384" y="145" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <text x="456" y="145" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1&gt;5 ✗</text>
  <text x="528" y="145" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <!-- row 3: left=3 -->
  <g filter="url(#rough2)">
    <rect x="24" y="158" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="76" y="158" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="128" y="158" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="180" y="158" width="96" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="276" y="158" width="72" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="348" y="158" width="72" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="420" y="158" width="72" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <rect x="492" y="158" width="72" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
  </g>
  <text x="50" y="179" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③</text>
  <text x="102" y="179" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="154" y="179" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <text x="228" y="179" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">{4}</text>
  <text x="312" y="179" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <text x="384" y="179" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="456" y="179" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">5&gt;3 ✓</text>
  <text x="528" y="179" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- day-2 snapshot -->
  <text x="320" y="216" text-anchor="middle" font-size="11.5" fill="#888">第 2 天状态（位置 1..5）：1 亮、2 灭、3 亮 → 位置 1 与 3 之间恰 1 盏关闭</text>
  <g filter="url(#rough2)">
    <rect x="170" y="228" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="228" y="228" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <rect x="286" y="228" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="344" y="228" width="50" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.4" stroke-dasharray="3,2" rx="4"/>
    <rect x="402" y="228" width="50" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.4" stroke-dasharray="3,2" rx="4"/>
  </g>
  <text x="195" y="248" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">亮</text>
  <text x="253" y="248" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">灭</text>
  <text x="311" y="248" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">亮</text>
  <text x="369" y="248" text-anchor="middle" font-size="11" fill="#bbb">未到</text>
  <text x="427" y="248" text-anchor="middle" font-size="11" fill="#bbb">未到</text>
  <text x="195" y="274" text-anchor="middle" font-size="9.5" fill="#aaa">pos1</text>
  <text x="253" y="274" text-anchor="middle" font-size="9.5" fill="#aaa">pos2</text>
  <text x="311" y="274" text-anchor="middle" font-size="9.5" fill="#aaa">pos3</text>
  <text x="369" y="274" text-anchor="middle" font-size="9.5" fill="#aaa">pos4</text>
  <text x="427" y="274" text-anchor="middle" font-size="9.5" fill="#aaa">pos5</text>

  <!-- result -->
  <rect x="24" y="296" width="540" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="294" y="321" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">ans = 2 ⭐ 两端点亮较晚者 = max(days[1],days[3]) = max(2,1) = 2</text>

  <!-- notes -->
  <rect x="24" y="346" width="540" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="42" y="368" font-size="11" fill="#555">• 步②虽不合法，但中段 days[3]=1 被单调队列保留，影响后续窗口判定</text>
  <text x="42" y="386" font-size="11" fill="#555">• 步③候选日 = max(days[3],days[5]) = 3，但 2 更小，ans 不更新</text>
  <text x="42" y="402" font-size="11" fill="#b85450" font-weight="bold">全程 O(n)：每位置入/出队各至多一次，窗口最小查询 O(1) 摊还</text>
</svg>
