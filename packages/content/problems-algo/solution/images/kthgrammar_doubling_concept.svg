<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">行翻倍结构：前半=父行原样，后半=父行逐位取反</text>

  <!-- ====== n = 1 row ====== -->
  <text x="36" y="64" font-size="12" fill="#888">n=1</text>
  <rect x="70" y="48" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="92" y="67" text-anchor="middle" font-size="13" fill="#333">0</text>

  <!-- arrow down -->
  <path d="M 92 80 L 92 96" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="108" y="92" font-size="10" fill="#888">0→01, 1→10</text>

  <!-- ====== n = 2 row ====== -->
  <text x="36" y="116" font-size="12" fill="#888">n=2</text>
  <rect x="70" y="100" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="92" y="119" text-anchor="middle" font-size="13" fill="#333">0</text>
  <!-- mid divider -->
  <line x1="116" y1="92" x2="116" y2="136" stroke="#b85450" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="118" y="100" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="119" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="92" y="142" text-anchor="middle" font-size="10" fill="#446688">前半=n=1 原样</text>
  <text x="140" y="142" text-anchor="middle" font-size="10" fill="#b85450">后半=取反</text>

  <!-- arrow down -->
  <path d="M 140 146 L 140 162" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ====== n = 3 row ====== -->
  <text x="36" y="182" font-size="12" fill="#888">n=3</text>
  <rect x="70" y="166" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="92" y="185" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="118" y="166" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="185" text-anchor="middle" font-size="13" fill="#333">1</text>
  <!-- mid divider -->
  <line x1="164" y1="158" x2="164" y2="202" stroke="#b85450" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="166" y="166" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="185" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="214" y="166" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="236" y="185" text-anchor="middle" font-size="13" fill="#333">0</text>
  <text x="140" y="208" text-anchor="middle" font-size="10" fill="#446688">前半=n=2 原样 (01)</text>
  <text x="212" y="208" text-anchor="middle" font-size="10" fill="#b85450">后半=取反 (10)</text>

  <!-- arrow down -->
  <path d="M 212 212 L 212 228" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ====== n = 4 row ====== -->
  <text x="36" y="248" font-size="12" fill="#888">n=4</text>
  <rect x="70" y="232" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="92" y="251" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="118" y="232" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="251" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="166" y="232" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="251" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="214" y="232" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="236" y="251" text-anchor="middle" font-size="13" fill="#333">0</text>
  <!-- mid divider -->
  <line x1="260" y1="224" x2="260" y2="268" stroke="#b85450" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="262" y="232" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="284" y="251" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="310" y="232" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="332" y="251" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="358" y="232" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="251" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="406" y="232" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="428" y="251" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="212" y="274" text-anchor="middle" font-size="10" fill="#446688">前半=n=3 原样 (0110)</text>
  <text x="332" y="274" text-anchor="middle" font-size="10" fill="#b85450">后半=取反 (1001)</text>

  <!-- Insight box -->
  <rect x="40" y="290" width="460" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="310" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">规则 0→01, 1→10：展开后首位=原字符，第二位=取反</text>
  <text x="270" y="326" text-anchor="middle" font-size="11" fill="#666">故第 n 行 = 第 n−1 行 + 第 n−1 行逐位取反</text>

  <!-- transition verification -->
  <rect x="40" y="340" width="460" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="361" text-anchor="middle" font-size="11" fill="#4a7a3a">递归：k≤mid 走前半(同父)　k&gt;mid 走后半(反父)，mid=2^(n−2)</text>
</svg>
