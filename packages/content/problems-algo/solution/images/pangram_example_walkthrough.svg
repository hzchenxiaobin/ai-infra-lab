  <text x="600" y="238" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">z</text>
  <text x="600" y="260" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- Panel 2 result -->
  <rect x="80" y="278" width="480" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="320" y="298" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">不同字母: 26 → mask == 0x3FFFFFF → 返回 true</text>

  <!-- Note about early termination -->
  <rect x="40" y="324" width="560" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="320" y="346" text-anchor="middle" font-size="11" fill="#666">字符串共 35 个字符，但第 26 个不同字母出现时 mask 即满 → 提前返回 true</text>
  <text x="320" y="364" text-anchor="middle" font-size="11" fill="#666">剩余字符根本不访问 —— 提前终止的价值</text>
  <text x="320" y="380" text-anchor="middle" font-size="10" fill="#888">绿格 = 该字母已出现（对应比特位为 1）；灰格 = 未出现（比特位为 0）</text>
</svg>
