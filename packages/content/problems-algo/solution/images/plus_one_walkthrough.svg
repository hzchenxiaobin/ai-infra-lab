<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：[9, 9, 9] + 1，逐位进位最终首位补 1</text>

  <!-- ===== 初始 ===== -->
  <text x="40" y="54" font-size="12" fill="#b85450" font-weight="bold">初始</text>
  <text x="44" y="89" font-size="11" fill="#888">digits:</text>
  <rect x="120" y="68" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="139" y="89" text-anchor="middle" font-size="13" fill="#333">9</text>
  <rect x="158" y="68" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="177" y="89" text-anchor="middle" font-size="13" fill="#333">9</text>
  <rect x="196" y="68" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="215" y="89" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">9</text>
  <text x="215" y="58" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">i=2</text>
  <text x="270" y="89" font-size="11" fill="#666">carry = 1，从末位开始</text>

  <!-- ===== 第 1 步 i=2 ===== -->
  <text x="40" y="118" font-size="12" fill="#b85450" font-weight="bold">第 1 步（i=2，个位）</text>
  <text x="44" y="153" font-size="11" fill="#888">digits:</text>
  <rect x="120" y="132" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="139" y="153" text-anchor="middle" font-size="13" fill="#333">9</text>
  <rect x="158" y="132" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="177" y="153" text-anchor="middle" font-size="13" fill="#333">9</text>
  <rect x="196" y="132" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="215" y="153" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <text x="215" y="122" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">写 0</text>
  <text x="270" y="153" font-size="11" fill="#666">→ 9 + 1 = 10</text>
  <text x="380" y="153" font-size="11" fill="#b85450" font-weight="bold">写 0，carry = 1</text>

  <!-- ===== 第 2 步 i=1 ===== -->
  <text x="40" y="182" font-size="12" fill="#b85450" font-weight="bold">第 2 步（i=1，十位）</text>
  <text x="44" y="217" font-size="11" fill="#888">digits:</text>
  <rect x="120" y="196" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="139" y="217" text-anchor="middle" font-size="13" fill="#333">9</text>
  <rect x="158" y="196" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="177" y="217" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="196" y="196" width="38" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="215" y="217" text-anchor="middle" font-size="13" fill="#bbb">0</text>
  <text x="177" y="186" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">写 0</text>
  <text x="270" y="217" font-size="11" fill="#666">→ 9 + 1 = 10</text>
  <text x="380" y="217" font-size="11" fill="#b85450" font-weight="bold">写 0，carry = 1</text>

  <!-- ===== 第 3 步 i=0 ===== -->
  <text x="40" y="246" font-size="12" fill="#b85450" font-weight="bold">第 3 步（i=0，百位）</text>
  <text x="44" y="281" font-size="11" fill="#888">digits:</text>
  <rect x="120" y="260" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="139" y="281" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="158" y="260" width="38" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="177" y="281" text-anchor="middle" font-size="13" fill="#bbb">0</text>
  <rect x="196" y="260" width="38" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="215" y="281" text-anchor="middle" font-size="13" fill="#bbb">0</text>
  <text x="139" y="250" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">写 0</text>
  <text x="270" y="281" font-size="11" fill="#666">→ 9 + 1 = 10</text>
  <text x="380" y="281" font-size="11" fill="#b85450" font-weight="bold">写 0，carry = 1</text>

  <!-- ===== 循环结束，首位补 1 ===== -->
  <text x="40" y="310" font-size="12" fill="#b85450" font-weight="bold">循环结束（i &lt; 0），carry 仍为 1</text>
  <text x="44" y="345" font-size="11" fill="#888">digits:</text>
  <rect x="82" y="324" width="38" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="101" y="345" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="101" y="316" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">补 1</text>
  <rect x="120" y="324" width="38" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="139" y="345" text-anchor="middle" font-size="13" fill="#bbb">0</text>
  <rect x="158" y="324" width="38" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="177" y="345" text-anchor="middle" font-size="13" fill="#bbb">0</text>
  <rect x="196" y="324" width="38" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="215" y="345" text-anchor="middle" font-size="13" fill="#bbb">0</text>
  <text x="270" y="345" font-size="11" fill="#666">→ 首位插入 1</text>
  <text x="380" y="345" font-size="11" fill="#4a7a3a" font-weight="bold">得到 [1, 0, 0, 0]</text>

  <!-- ===== Final result ===== -->
  <rect x="40" y="372" width="480" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="388" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">999 + 1 = 1000 → [1, 0, 0, 0] ✓</text>
</svg>
