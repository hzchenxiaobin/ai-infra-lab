<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心思路：两步聚合 — 先求每人首次登录日，再按日计数</text>

  <!-- ===== Left: Traffic table (raw) ===== -->
  <text x="80" y="54" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Traffic 表（原始）</text>
  <rect x="20" y="60" width="130" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="40" y="75" font-size="8.5" fill="#446688" font-weight="bold">user_id</text>
  <text x="78" y="75" font-size="8.5" fill="#446688" font-weight="bold">activity</text>
  <text x="125" y="75" font-size="8.5" fill="#446688" font-weight="bold">date</text>
  <line x1="62" y1="60" x2="62" y2="82" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="105" y1="60" x2="105" y2="82" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- row 1: user 1 login 05-01 (before range, will be excluded) -->
  <rect x="20" y="82" width="130" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="40" y="94" text-anchor="middle" font-size="8.5" fill="#333">1</text>
  <text x="78" y="94" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">login</text>
  <text x="125" y="94" text-anchor="middle" font-size="7.5" fill="#888">05-01</text>
  <line x1="62" y1="82" x2="62" y2="98" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="105" y1="82" x2="105" y2="98" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- row 2: user 1 logout -->
  <rect x="20" y="98" width="130" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="40" y="109" text-anchor="middle" font-size="8" fill="#888">1</text>
  <text x="78" y="109" text-anchor="middle" font-size="8" fill="#888">logout</text>
  <text x="125" y="109" text-anchor="middle" font-size="7" fill="#888">05-02</text>
  <line x1="62" y1="98" x2="62" y2="112" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="105" y1="98" x2="105" y2="112" stroke="#446688" stroke-width="0.5" filter="url(#rough2)"/>

  <!-- row 3: user 2 login 06-30 (in range) -->
  <rect x="20" y="112" width="130" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="40" y="124" text-anchor="middle" font-size="8.5" fill="#333">2</text>
  <text x="78" y="124" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">login</text>
  <text x="125" y="124" text-anchor="middle" font-size="7.5" fill="#4a7a3a" font-weight="bold">06-30</text>
  <line x1="62" y1="112" x2="62" y2="128" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="105" y1="112" x2="105" y2="128" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- row 4: user 3 login 07-02 -->
  <rect x="20" y="128" width="130" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="40" y="140" text-anchor="middle" font-size="8.5" fill="#333">3</text>
  <text x="78" y="140" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">login</text>
  <text x="125" y="140" text-anchor="middle" font-size="7.5" fill="#4a7a3a" font-weight="bold">07-02</text>
  <line x1="62" y1="128" x2="62" y2="144" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="105" y1="128" x2="105" y2="144" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- row 5: user 4 login 07-02 -->
  <rect x="20" y="144" width="130" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="40" y="156" text-anchor="middle" font-size="8.5" fill="#333">4</text>
  <text x="78" y="156" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">login</text>
  <text x="125" y="156" text-anchor="middle" font-size="7.5" fill="#4a7a3a" font-weight="bold">07-02</text>
  <line x1="62" y1="144" x2="62" y2="160" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="105" y1="144" x2="105" y2="160" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- row 6: user 6 login 07-04 -->
  <rect x="20" y="160" width="130" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="40" y="172" text-anchor="middle" font-size="8.5" fill="#333">6</text>
  <text x="78" y="172" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">login</text>
  <text x="125" y="172" text-anchor="middle" font-size="7.5" fill="#4a7a3a" font-weight="bold">07-04</text>
  <line x1="62" y1="160" x2="62" y2="176" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="105" y1="160" x2="105" y2="176" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- row 7: user 7 login 07-28 (after range) -->
  <rect x="20" y="176" width="130" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="40" y="188" text-anchor="middle" font-size="8.5" fill="#333">7</text>
  <text x="78" y="188" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">login</text>
  <text x="125" y="188" text-anchor="middle" font-size="7.5" fill="#888">07-28</text>
  <line x1="62" y1="176" x2="62" y2="192" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="105" y1="176" x2="105" y2="192" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- dots -->
  <text x="85" y="210" text-anchor="middle" font-size="10" fill="#888">...（含 logout / sessions）</text>

  <!-- arrow from Traffic to step 1 -->
  <path d="M150 140 L185 140" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="167" y="134" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">①</text>
  <text x="167" y="152" text-anchor="middle" font-size="7" fill="#d6a040">WHERE login</text>

  <!-- ===== Middle: Step 1 result (user_id -> install_date) ===== -->
  <text x="280" y="54" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">子查询：每人首次登录日</text>
  <rect x="210" y="60" width="140" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="245" y="75" font-size="9" fill="#4a7a3a" font-weight="bold">user_id</text>
  <text x="310" y="75" font-size="9" fill="#4a7a3a" font-weight="bold">install_date</text>
  <line x1="275" y1="60" x2="275" y2="82" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- user 1: 05-01, before range -->
  <rect x="210" y="82" width="140" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="245" y="94" text-anchor="middle" font-size="8.5" fill="#888">1</text>
  <text x="310" y="94" text-anchor="middle" font-size="8" fill="#888" text-decoration="line-through">05-01</text>
  <text x="345" y="94" font-size="7" fill="#b85450">✗</text>
  <line x1="275" y1="82" x2="275" y2="98" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- user 2: 06-30, in range -->
  <rect x="210" y="98" width="140" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="245" y="110" text-anchor="middle" font-size="8.5" fill="#333">2</text>
  <text x="310" y="110" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">06-30</text>
  <text x="345" y="110" font-size="7" fill="#4a7a3a">✓</text>
  <line x1="275" y1="98" x2="275" y2="114" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- user 3: 07-02 -->
  <rect x="210" y="114" width="140" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="245" y="126" text-anchor="middle" font-size="8.5" fill="#333">3</text>
  <text x="310" y="126" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">07-02</text>
  <text x="345" y="126" font-size="7" fill="#4a7a3a">✓</text>
  <line x1="275" y1="114" x2="275" y2="130" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- user 4: 07-02 -->
  <rect x="210" y="130" width="140" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="245" y="142" text-anchor="middle" font-size="8.5" fill="#333">4</text>
  <text x="310" y="142" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">07-02</text>
  <text x="345" y="142" font-size="7" fill="#4a7a3a">✓</text>
  <line x1="275" y1="130" x2="275" y2="146" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- user 6: 07-04 -->
  <rect x="210" y="146" width="140" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="245" y="158" text-anchor="middle" font-size="8.5" fill="#333">6</text>
  <text x="310" y="158" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">07-04</text>
  <text x="345" y="158" font-size="7" fill="#4a7a3a">✓</text>
  <line x1="275" y1="146" x2="275" y2="162" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- user 7: 07-28, after range -->
  <rect x="210" y="162" width="140" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="245" y="174" text-anchor="middle" font-size="8.5" fill="#888">7</text>
  <text x="310" y="174" text-anchor="middle" font-size="8" fill="#888" text-decoration="line-through">07-28</text>
  <text x="345" y="174" font-size="7" fill="#b85450">✗</text>
  <line x1="275" y1="162" x2="275" y2="178" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>

  <text x="280" y="196" text-anchor="middle" font-size="8" fill="#b85450">✗ = 日期在 [06-30, 07-27] 之外</text>

  <!-- arrow from step 1 to step 2 -->
  <path d="M350 140 L388 140" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="369" y="134" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">②</text>
  <text x="369" y="152" text-anchor="middle" font-size="7" fill="#d6a040">WHERE 日期</text>

  <!-- ===== Right: Final result (install_date -> installs) ===== -->
  <text x="475" y="54" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">最终结果</text>
  <rect x="395" y="60" width="160" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="440" y="75" font-size="9" fill="#b85450" font-weight="bold">install_date</text>
  <text x="515" y="75" font-size="9" fill="#b85450" font-weight="bold">installs</text>
  <line x1="475" y1="60" x2="475" y2="82" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="395" y="82" width="160" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="440" y="95" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">06-30</text>
  <text x="515" y="95" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <line x1="475" y1="82" x2="475" y2="100" stroke="#b85450" stroke-width="0.6" filter="url(#rough2)"/>

  <rect x="395" y="100" width="160" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="440" y="113" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">07-02</text>
  <text x="515" y="113" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">2</text>
  <line x1="475" y1="100" x2="475" y2="118" stroke="#b85450" stroke-width="0.6" filter="url(#rough2)"/>

  <rect x="395" y="118" width="160" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="440" y="131" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">07-04</text>
  <text x="515" y="131" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <line x1="475" y1="118" x2="475" y2="136" stroke="#b85450" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- date range filter box -->
  <rect x="375" y="155" width="200" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="475" y="173" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">日期过滤：BETWEEN '06-30' AND '07-27'</text>

  <!-- bottom summary -->
  <rect x="20" y="200" width="540" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="40" y="218" font-size="10" fill="#333">① 子查询：<tspan fill="#4a7a3a" font-weight="bold">WHERE activity='login'</tspan> + <tspan fill="#4a7a3a" font-weight="bold">GROUP BY user_id, MIN(date)</tspan> → 每人首次登录日</text>
  <text x="40" y="234" font-size="10" fill="#333">② 外查询：<tspan fill="#d6a040" font-weight="bold">WHERE BETWEEN</tspan> 日期范围 + <tspan fill="#b85450" font-weight="bold">GROUP BY install_date, COUNT</tspan> → 每日新用户数</text>

  <!-- Key insight box -->
  <rect x="20" y="255" width="540" height="145" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="275" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">关键洞察：MIN(date) = 首次登录日 = 用户"注册日"</text>

  <text x="40" y="295" font-size="9.5" fill="#333">• <tspan fill="#4a7a3a" font-weight="bold">login</tspan> 是众多 activity 之一（还有 logout / sessions），必须先 <tspan fill="#d6a040">WHERE</tspan> 过滤</text>
  <text x="40" y="312" font-size="9.5" fill="#333">• 同一用户可能有多条 <tspan fill="#4a7a3a">login</tspan> 记录 → <tspan fill="#4a7a3a" font-weight="bold">MIN(activity_date)</tspan> 取最早一条 = 注册日</text>
  <text x="40" y="329" font-size="9.5" fill="#333">• 注册日可能落在统计区间外 → 外层 <tspan fill="#d6a040" font-weight="bold">WHERE ... BETWEEN</tspan> 过滤掉区间外的用户</text>
  <text x="40" y="346" font-size="9.5" fill="#333">• 最终 <tspan fill="#b85450" font-weight="bold">GROUP BY install_date + COUNT(user_id)</tspan> → 每个注册日有多少新用户</text>
  <text x="40" y="363" font-size="9.5" fill="#333">• 两层聚合各管一事：内层求"行级最值"（每人首次登录日），外层做"组级计数"（每日人数）</text>
  <text x="40" y="380" font-size="9.5" fill="#333">• <tspan fill="#b85450" font-weight="bold">COUNT(user_id)</tspan> 而非 <tspan fill="#888">COUNT(*)</tspan>：子查询已 GROUP BY user_id 去重，但 COUNT(列名) 语义更清晰</text>
  <text x="40" y="395" font-size="9.5" fill="#333">• 同日注册多人时（如 07-02 有 user 3 + 4）→ GROUP BY 把同日用户合并计数为 2</text>
</svg>
