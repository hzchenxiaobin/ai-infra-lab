<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：root1=(b+b)+a 加计数，root2=b+(a+b) 减计数 → 归零</text>

  <!-- Column x boundaries: 20 / 150 / 240 / 310 / 380 / 540 -->
  <!-- Header row -->
  <rect x="20" y="40" width="520" height="28" fill="#446688" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="85" y="58" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">阶段</text>
  <text x="195" y="58" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">访问叶子</text>
  <text x="275" y="58" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">cnt[a]</text>
  <text x="345" y="58" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">cnt[b]</text>
  <text x="460" y="58" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">说明</text>

  <!-- vertical grid lines -->
  <line x1="150" y1="40" x2="150" y2="328" stroke="#cfd8e8" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="240" y1="40" x2="240" y2="328" stroke="#cfd8e8" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="310" y1="40" x2="310" y2="328" stroke="#cfd8e8" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="380" y1="40" x2="380" y2="328" stroke="#cfd8e8" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Row data: 8 rows, each height 34, starting y=68 -->
  <!-- Row 1: 初始 -->
  <rect x="20" y="68" width="520" height="32" fill="#f5f7fa" stroke="#dde3ee" stroke-width="0.6" filter="url(#rough2)"/>
  <text x="85" y="89" text-anchor="middle" font-size="11" fill="#555">初始</text>
  <text x="195" y="89" text-anchor="middle" font-size="11" fill="#888" font-family="monospace">—</text>
  <text x="275" y="89" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">0</text>
  <text x="345" y="89" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">0</text>
  <text x="460" y="89" text-anchor="middle" font-size="10.5" fill="#888">全零</text>

  <!-- Row 2: root1 +1, b -->
  <rect x="20" y="100" width="520" height="32" fill="#eaf3fb" stroke="#dde3ee" stroke-width="0.6" filter="url(#rough2)"/>
  <text x="85" y="121" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">root1 +1</text>
  <text x="195" y="121" text-anchor="middle" font-size="12" fill="#4a7a3a" font-family="monospace" font-weight="bold">b</text>
  <text x="275" y="121" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">0</text>
  <rect x="330" y="106" width="30" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="345" y="121" text-anchor="middle" font-size="12" fill="#b85450" font-family="monospace" font-weight="bold">1</text>
  <text x="460" y="121" text-anchor="middle" font-size="10.5" fill="#888">左子第一个 b</text>

  <!-- Row 3: root1 +1, b -->
  <rect x="20" y="132" width="520" height="32" fill="#eaf3fb" stroke="#dde3ee" stroke-width="0.6" filter="url(#rough2)"/>
  <text x="85" y="153" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">root1 +1</text>
  <text x="195" y="153" text-anchor="middle" font-size="12" fill="#4a7a3a" font-family="monospace" font-weight="bold">b</text>
  <text x="275" y="153" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">0</text>
  <rect x="330" y="138" width="30" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="345" y="153" text-anchor="middle" font-size="12" fill="#b85450" font-family="monospace" font-weight="bold">2</text>
  <text x="460" y="153" text-anchor="middle" font-size="10.5" fill="#888">左子第二个 b</text>

  <!-- Row 4: root1 +1, a -->
  <rect x="20" y="164" width="520" height="32" fill="#eaf3fb" stroke="#dde3ee" stroke-width="0.6" filter="url(#rough2)"/>
  <text x="85" y="185" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">root1 +1</text>
  <text x="195" y="185" text-anchor="middle" font-size="12" fill="#4a7a3a" font-family="monospace" font-weight="bold">a</text>
  <rect x="260" y="170" width="30" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="275" y="185" text-anchor="middle" font-size="12" fill="#b85450" font-family="monospace" font-weight="bold">1</text>
  <text x="345" y="185" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">2</text>
  <text x="460" y="185" text-anchor="middle" font-size="10.5" fill="#888">右子 a</text>

  <!-- Row 5: root2 -1, b -->
  <rect x="20" y="196" width="520" height="32" fill="#fcefef" stroke="#dde3ee" stroke-width="0.6" filter="url(#rough2)"/>
  <text x="85" y="217" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">root2 −1</text>
  <text x="195" y="217" text-anchor="middle" font-size="12" fill="#4a7a3a" font-family="monospace" font-weight="bold">b</text>
  <text x="275" y="217" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">1</text>
  <rect x="330" y="202" width="30" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="345" y="217" text-anchor="middle" font-size="12" fill="#b85450" font-family="monospace" font-weight="bold">1</text>
  <text x="460" y="217" text-anchor="middle" font-size="10.5" fill="#888">根左子 b</text>

  <!-- Row 6: root2 -1, a -->
  <rect x="20" y="228" width="520" height="32" fill="#fcefef" stroke="#dde3ee" stroke-width="0.6" filter="url(#rough2)"/>
  <text x="85" y="249" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">root2 −1</text>
  <text x="195" y="249" text-anchor="middle" font-size="12" fill="#4a7a3a" font-family="monospace" font-weight="bold">a</text>
  <rect x="260" y="234" width="30" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="275" y="249" text-anchor="middle" font-size="12" fill="#b85450" font-family="monospace" font-weight="bold">0</text>
  <text x="345" y="249" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">1</text>
  <text x="460" y="249" text-anchor="middle" font-size="10.5" fill="#888">右子左叶 a</text>

  <!-- Row 7: root2 -1, b -->
  <rect x="20" y="260" width="520" height="32" fill="#fcefef" stroke="#dde3ee" stroke-width="0.6" filter="url(#rough2)"/>
  <text x="85" y="281" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">root2 −1</text>
  <text x="195" y="281" text-anchor="middle" font-size="12" fill="#4a7a3a" font-family="monospace" font-weight="bold">b</text>
  <text x="275" y="281" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">0</text>
  <rect x="330" y="266" width="30" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="345" y="281" text-anchor="middle" font-size="12" fill="#b85450" font-family="monospace" font-weight="bold">0</text>
  <text x="460" y="281" text-anchor="middle" font-size="10.5" fill="#888">右子右叶 b</text>

  <!-- Row 8: 终态 -->
  <rect x="20" y="292" width="520" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="85" y="313" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">终态</text>
  <text x="195" y="313" text-anchor="middle" font-size="11" fill="#888" font-family="monospace">—</text>
  <text x="275" y="313" text-anchor="middle" font-size="12" fill="#4a7a3a" font-family="monospace" font-weight="bold">0</text>
  <text x="345" y="313" text-anchor="middle" font-size="12" fill="#4a7a3a" font-family="monospace" font-weight="bold">0</text>
  <text x="460" y="313" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">全零 → 等价 ✓</text>

  <!-- legend -->
  <rect x="20" y="336" width="14" height="10" fill="#eaf3fb" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="40" y="345" font-size="9.5" fill="#888">+1 (root1)</text>
  <rect x="110" y="336" width="14" height="10" fill="#fcefef" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="130" y="345" font-size="9.5" fill="#888">−1 (root2)</text>
  <rect x="200" y="336" width="14" height="10" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="220" y="345" font-size="9.5" fill="#888">本步变化</text>
</svg>
