<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：过两枚飞镖、半径为 r 的圆心恰有两个</text>

  <!-- Two candidate circles (context) -->
  <circle cx="280" cy="164" r="110" fill="#e8f0fe" fill-opacity="0.30" stroke="#446688" stroke-width="1.6" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <circle cx="280" cy="296" r="110" fill="#e6f4ea" fill-opacity="0.30" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5,4" filter="url(#rough2)"/>

  <!-- Perpendicular bisector (vertical dashed through M) -->
  <path d="M 280 120 L 280 340" stroke="#aaa" stroke-width="1.4" stroke-dasharray="4,4" filter="url(#rough2)"/>
  <text x="288" y="128" font-size="10.5" fill="#888">中垂线</text>

  <!-- Segment A-B -->
  <path d="M 192 230 L 368 230" stroke="#444" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="246" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">d = dist(A, B)</text>

  <!-- Right triangle M-A-C1 -->
  <path d="M 280 230 L 192 230" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <path d="M 280 230 L 280 164" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <path d="M 192 230 L 280 164" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>

  <!-- Right-angle marker at M -->
  <path d="M 270 230 L 270 220 L 280 220" fill="none" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- Labels on triangle sides -->
  <text x="236" y="244" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">d/2</text>
  <text x="266" y="200" text-anchor="end" font-size="10.5" fill="#4a7a3a" font-weight="bold">h</text>
  <text x="224" y="190" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">r（斜边）</text>

  <!-- Points A, B (darts) -->
  <circle cx="192" cy="230" r="6" fill="#b85450" filter="url(#rough2)"/>
  <text x="180" y="226" text-anchor="end" font-size="11.5" fill="#333" font-weight="bold">A（飞镖）</text>
  <circle cx="368" cy="230" r="6" fill="#b85450" filter="url(#rough2)"/>
  <text x="380" y="226" font-size="11.5" fill="#333" font-weight="bold">B（飞镖）</text>

  <!-- Midpoint M -->
  <circle cx="280" cy="230" r="4.5" fill="#555" filter="url(#rough2)"/>
  <text x="292" y="234" font-size="10.5" fill="#555" font-weight="bold">M（中点）</text>

  <!-- Centers C1, C2 -->
  <circle cx="280" cy="164" r="5.5" fill="#446688" filter="url(#rough2)"/>
  <text x="292" y="160" font-size="11.5" fill="#446688" font-weight="bold">C₁（圆心①）</text>
  <circle cx="280" cy="296" r="5.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="292" y="300" font-size="11.5" fill="#4a7a3a" font-weight="bold">C₂（圆心②）</text>

  <!-- Divider -->
  <path d="M 40 362 L 520 362" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Formula / explanation -->
  <text x="60" y="384" font-size="11.5" fill="#555">勾股定理解出圆心到中点的距离：<tspan fill="#4a7a3a" font-weight="bold">h = √( r² − (d/2)² )</tspan>（仅当 d ≤ 2r 时实数解存在）</text>
  <text x="60" y="404" font-size="11.5" fill="#555">两圆心在中垂线上、距 M 为 h：<tspan fill="#b85450" font-weight="bold">C₁,₂ = M ± h · (−Δy, Δx) / d</tspan>，d &gt; 2r 时无解（跳过该点对）</text>

  <!-- Conclusion box -->
  <rect x="60" y="416" width="440" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="429" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">结论：枚举所有点对 → 每对至多 2 个候选圆心 → 逐一计数</text>
</svg>
