<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：按值升序处理 + 同值批量更新（用 [[3,1],[3,4]] 演示）</text>

  <!-- Matrix -->
  <text x="48" y="56" font-size="11" fill="#888" filter="url(#rough2)">列 0</text>
  <text x="138" y="56" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">列 1</text>
  <text x="58" y="94" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">行 0</text>
  <text x="58" y="134" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">行 1</text>

  <rect x="70" y="70" width="70" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="105" y="96" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="140" y="70" width="70" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="175" y="96" text-anchor="middle" font-size="16" fill="#aaa" filter="url(#rough2)">1</text>

  <rect x="70" y="110" width="70" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="105" y="136" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="140" y="110" width="70" height="40" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="175" y="136" text-anchor="middle" font-size="16" fill="#aaa" filter="url(#rough2)">4</text>

  <!-- same-value bracket -->
  <path d="M 64,76 L 58,76 L 58,144 L 64,144" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="50" y="114" text-anchor="end" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">同值
v=3</text>

  <!-- Formula box -->
  <rect x="250" y="68" width="320" height="84" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="410" y="92" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">状态转移</text>
  <text x="410" y="116" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">dp[i][j] = 1 + max(rowMax[i], colMax[j])</text>
  <text x="410" y="138" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">rowMax[i]=行 i 已处理格的最大 dp，colMax[j] 同理</text>

  <!-- Processing flow table -->
  <text x="40" y="172" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">处理流程（值升序）</text>

  <!-- Header -->
  <rect x="40" y="182" width="70" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="75" y="203" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">值 v</text>
  <rect x="110" y="182" width="100" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="160" y="203" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">本批格子</text>
  <rect x="210" y="182" width="190" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="305" y="203" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">dp（用旧 rMax/cMax）</text>
  <rect x="400" y="182" width="160" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="480" y="203" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">更新后 rMax / cMax</text>

  <!-- Row 1: v=1 -->
  <rect x="40" y="216" width="70" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="75" y="240" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="110" y="216" width="100" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="160" y="240" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(0,1)</text>
  <rect x="210" y="216" width="190" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="305" y="240" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1+max(0,0)=1</text>
  <rect x="400" y="216" width="160" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="480" y="240" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">rMax[0]=1, cMax[1]=1</text>

  <!-- Row 2: v=3 batch (highlight) -->
  <rect x="40" y="256" width="70" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="282" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="75" y="300" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">(同值批)</text>
  <rect x="110" y="256" width="100" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="282" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(0,0)</text>
  <text x="160" y="300" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(1,0)</text>
  <rect x="210" y="256" width="190" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="305" y="278" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(0,0): 1+max(1,0)=2</text>
  <text x="305" y="298" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(1,0): 1+max(0,0)=1</text>
  <rect x="400" y="256" width="160" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="480" y="280" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">rMax[0]=2, rMax[1]=1</text>
  <text x="480" y="300" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">cMax[0]=2</text>

  <!-- arrow from rMax/cMax old -> batch uses old -->
  <text x="305" y="272" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">↑ 两格都用「旧」值，互不影响</text>

  <!-- Row 3: v=4 -->
  <rect x="40" y="314" width="70" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="75" y="338" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="110" y="314" width="100" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="160" y="338" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(1,1)</text>
  <rect x="210" y="314" width="190" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="305" y="338" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1+max(1,1)=2</text>
  <rect x="400" y="314" width="160" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="480" y="338" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">rMax[1]=2, cMax[1]=2</text>

  <!-- Key insight -->
  <rect x="40" y="368" width="520" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="52" y="388" font-size="12" fill="#333" filter="url(#rough2)"><tspan font-weight="bold" fill="#d6a040">为何批量？</tspan>同值格不能出现在同一条递增路径里（需「严格」更大），</text>
  <text x="52" y="405" font-size="12" fill="#333" filter="url(#rough2)">故整批先用「旧」rMax/cMax 算完 dp，再统一回写——避免同值格互相借用结果。</text>

  <rect x="40" y="424" width="520" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="52" y="446" font-size="12" fill="#333" filter="url(#rough2)"><tspan font-weight="bold" fill="#b85450">结果</tspan>：max dp = 2 ⭐（若不批量、让 (1,0) 借用 (0,0) 的 dp，会错算成更大值）</text>
</svg>
