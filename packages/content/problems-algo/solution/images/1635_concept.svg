<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">Hopper 公司查询 I：三表 → 月度活跃司机数 + 接单数</text>

  <!-- ===== 左侧三张表 ===== -->

  <!-- Drivers 表（左上） -->
  <text x="80" y="54" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Drivers 表</text>
  <rect x="18" y="60" width="124" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="42" y="75" text-anchor="middle" font-size="9" fill="#333">driver_id</text>
  <text x="95" y="75" text-anchor="middle" font-size="9" fill="#333">join_date</text>
  <line x1="60" y1="60" x2="60" y2="82" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="18" y="82" width="124" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="42" y="95" text-anchor="middle" font-size="9" fill="#333">10</text>
  <text x="95" y="95" text-anchor="middle" font-size="9" fill="#333">2019-12-10</text>
  <line x1="60" y1="82" x2="60" y2="100" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="18" y="100" width="124" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="42" y="113" text-anchor="middle" font-size="9" fill="#333">8</text>
  <text x="95" y="113" text-anchor="middle" font-size="9" fill="#333">2020-1-13</text>
  <line x1="60" y1="100" x2="60" y2="118" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="18" y="118" width="124" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="42" y="131" text-anchor="middle" font-size="9" fill="#333">5</text>
  <text x="95" y="131" text-anchor="middle" font-size="9" fill="#333">2020-2-16</text>
  <line x1="60" y1="118" x2="60" y2="136" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="80" y="151" text-anchor="middle" font-size="9" fill="#888">…（共 7 行）</text>

  <!-- Rides 表（左中） -->
  <text x="80" y="172" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Rides 表</text>
  <rect x="18" y="178" width="124" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="36" y="193" text-anchor="middle" font-size="8" fill="#333">ride_id</text>
  <text x="72" y="193" text-anchor="middle" font-size="8" fill="#333">user_id</text>
  <text x="106" y="193" text-anchor="middle" font-size="8" fill="#333">requested_at</text>
  <rect x="18" y="200" width="124" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="36" y="212" text-anchor="middle" font-size="8.5" fill="#333">10</text>
  <text x="72" y="212" text-anchor="middle" font-size="8.5" fill="#333">63</text>
  <text x="106" y="212" text-anchor="middle" font-size="8.5" fill="#333">2020-3-4</text>
  <rect x="18" y="216" width="124" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="36" y="228" text-anchor="middle" font-size="8.5" fill="#333">20</text>
  <text x="72" y="228" text-anchor="middle" font-size="8.5" fill="#333">81</text>
  <text x="106" y="228" text-anchor="middle" font-size="8.5" fill="#333">2020-11-2</text>
  <text x="80" y="244" text-anchor="middle" font-size="9" fill="#888">…（共 15 行）</text>

  <!-- AcceptedRides 表（左下） -->
  <text x="80" y="262" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">AcceptedRides 表</text>
  <rect x="18" y="268" width="124" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="36" y="283" text-anchor="middle" font-size="7.5" fill="#333">ride_id</text>
  <text x="66" y="283" text-anchor="middle" font-size="7.5" fill="#333">driver_id</text>
  <text x="95" y="283" text-anchor="middle" font-size="7.5" fill="#333">distance</text>
  <text x="121" y="283" text-anchor="middle" font-size="7.5" fill="#333">duration</text>
  <rect x="18" y="290" width="124" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="36" y="302" text-anchor="middle" font-size="8.5" fill="#333">10</text>
  <text x="66" y="302" text-anchor="middle" font-size="8.5" fill="#333">10</text>
  <text x="95" y="302" text-anchor="middle" font-size="8.5" fill="#333">63</text>
  <text x="121" y="302" text-anchor="middle" font-size="8.5" fill="#333">38</text>
  <rect x="18" y="306" width="124" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="36" y="318" text-anchor="middle" font-size="8.5" fill="#333">20</text>
  <text x="66" y="318" text-anchor="middle" font-size="8.5" fill="#333">1</text>
  <text x="95" y="318" text-anchor="middle" font-size="8.5" fill="#333">121</text>
  <text x="121" y="318" text-anchor="middle" font-size="8.5" fill="#333">92</text>
  <text x="80" y="334" text-anchor="middle" font-size="9" fill="#888">…（共 11 行）</text>

  <!-- ===== 中间 JOIN 区域 ===== -->

  <!-- Drivers → active_drivers 箭头 -->
  <path d="M145 110 L210 110" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="178" y="102" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">join_date</text>
  <text x="178" y="124" text-anchor="middle" font-size="9" fill="#446688">≤ 月末</text>

  <!-- active_drivers 计算框（右上） -->
  <rect x="212" y="62" width="180" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="302" y="84" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">活跃司机数（累积）</text>
  <text x="222" y="104" font-size="9.5" fill="#333">月末前 join 的司机数</text>
  <text x="222" y="122" font-size="9.5" fill="#446688">COUNT(driver_id)</text>
  <text x="222" y="138" font-size="9.5" fill="#446688">WHERE join_date ≤ 月末</text>
  <text x="302" y="152" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">逐月累积增长</text>

  <!-- Rides + AcceptedRides JOIN -->
  <path d="M145 210 L185 248" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M145 300 L185 265" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="172" y="240" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">JOIN</text>
  <text x="172" y="252" text-anchor="middle" font-size="8" fill="#888">ON ride_id</text>

  <!-- accepted_rides 计算框（右中下） -->
  <path d="M195 258 L212 258" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="212" y="200" width="180" height="96" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="302" y="222" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">接单数（按月）</text>
  <text x="222" y="242" font-size="9.5" fill="#333">2020 年每月已接单数</text>
  <text x="222" y="260" font-size="9.5" fill="#b85450">COUNT(ar.ride_id)</text>
  <text x="222" y="276" font-size="9.5" fill="#b85450">WHERE YEAR=2020</text>
  <text x="222" y="292" font-size="9.5" fill="#b85450">GROUP BY MONTH</text>

  <!-- ===== 12 个月时间轴（底部） ===== -->
  <rect x="30" y="318" width="580" height="108" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="340" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2020 年 12 个月输出（month: 1→12，格式：活跃司机/接单数）</text>

  <g filter="url(#rough2)">
    <rect x="46" y="350" width="42" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="67" y="364" text-anchor="middle" font-size="9" fill="#333">1月</text>
    <rect x="90" y="350" width="42" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="111" y="364" text-anchor="middle" font-size="9" fill="#333">2月</text>
    <rect x="134" y="350" width="42" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="155" y="364" text-anchor="middle" font-size="9" fill="#333">3月</text>
    <rect x="178" y="350" width="42" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="199" y="364" text-anchor="middle" font-size="9" fill="#333">4月</text>
    <rect x="222" y="350" width="42" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="243" y="364" text-anchor="middle" font-size="9" fill="#333">5月</text>
    <rect x="266" y="350" width="42" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="287" y="364" text-anchor="middle" font-size="9" fill="#333">6月</text>
    <rect x="310" y="350" width="42" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="331" y="364" text-anchor="middle" font-size="9" fill="#333">7月</text>
    <rect x="354" y="350" width="42" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="375" y="364" text-anchor="middle" font-size="9" fill="#333">8月</text>
    <rect x="398" y="350" width="42" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="419" y="364" text-anchor="middle" font-size="9" fill="#333">9月</text>
    <rect x="442" y="350" width="42" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="463" y="364" text-anchor="middle" font-size="9" fill="#333">10月</text>
    <rect x="486" y="350" width="42" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="507" y="364" text-anchor="middle" font-size="9" fill="#333">11月</text>
    <rect x="530" y="350" width="42" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="551" y="364" text-anchor="middle" font-size="9" fill="#333">12月</text>
  </g>

  <text x="67" y="384" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">2 / 0</text>
  <text x="111" y="384" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">3 / 0</text>
  <text x="155" y="384" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">4 / 1</text>
  <text x="199" y="384" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">4 / 0</text>
  <text x="243" y="384" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">5 / 0</text>
  <text x="287" y="384" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">5 / 1</text>
  <text x="331" y="384" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">5 / 1</text>
  <text x="375" y="384" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">5 / 1</text>
  <text x="419" y="384" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">5 / 0</text>
  <text x="463" y="384" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">6 / 0</text>
  <text x="507" y="384" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">6 / 2</text>
  <text x="551" y="384" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">6 / 1</text>

  <text x="320" y="412" text-anchor="middle" font-size="9" fill="#888">蓝色 = 无接单月 | 红色 = 有接单月（3/6/7/8/11/12 月）</text>
</svg>
