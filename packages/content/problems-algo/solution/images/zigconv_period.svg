<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">周期规律：cycle = 2·numRows − 2（numRows=4 示例）</text>

  <!-- Index axis -->
  <text x="30" y="62" font-size="11" fill="#888">下标:</text>
  <!-- Cycle brackets -->
  <text x="100" y="50" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">周期 0 (0..5)</text>
  <text x="292" y="50" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">周期 1 (6..11)</text>
  <text x="436" y="50" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">余项</text>

  <!-- index cells row -->
  <!-- cycle 0: 0 1 2 3 4 5 -->
  <rect x="70" y="56" width="30" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="85" y="72" text-anchor="middle" font-size="10" fill="#999">0</text>
  <rect x="100" y="56" width="30" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="115" y="72" text-anchor="middle" font-size="10" fill="#999">1</text>
  <rect x="130" y="56" width="30" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="145" y="72" text-anchor="middle" font-size="10" fill="#999">2</text>
  <rect x="160" y="56" width="30" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="175" y="72" text-anchor="middle" font-size="10" fill="#999">3</text>
  <rect x="190" y="56" width="30" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="205" y="72" text-anchor="middle" font-size="10" fill="#999">4</text>
  <rect x="220" y="56" width="30" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="235" y="72" text-anchor="middle" font-size="10" fill="#999">5</text>

  <!-- cycle 1: 6 7 8 9 10 11 -->
  <rect x="262" y="56" width="30" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="277" y="72" text-anchor="middle" font-size="10" fill="#999">6</text>
  <rect x="292" y="56" width="30" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="307" y="72" text-anchor="middle" font-size="10" fill="#999">7</text>
  <rect x="322" y="56" width="30" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="337" y="72" text-anchor="middle" font-size="10" fill="#999">8</text>
  <rect x="352" y="56" width="30" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="367" y="72" text-anchor="middle" font-size="10" fill="#999">9</text>
  <rect x="382" y="56" width="30" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="397" y="72" text-anchor="middle" font-size="10" fill="#999">10</text>
  <rect x="412" y="56" width="30" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="427" y="72" text-anchor="middle" font-size="10" fill="#999">11</text>

  <!-- remainder 12 13 -->
  <rect x="442" y="56" width="30" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="457" y="72" text-anchor="middle" font-size="10" fill="#999">12</text>
  <rect x="472" y="56" width="30" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="487" y="72" text-anchor="middle" font-size="10" fill="#999">13</text>

  <!-- Row mapping table -->
  <text x="30" y="112" font-size="12" fill="#555" font-weight="bold">每行的下标来源（cycle = 6）：</text>

  <!-- Row 0 -->
  <rect x="30" y="120" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="136" text-anchor="middle" font-size="11" fill="#333">行 0</text>
  <text x="92" y="136" font-size="11" fill="#666">i = 0</text>
  <rect x="70" y="148" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="85" y="164" text-anchor="middle" font-size="10" fill="#333">0</text>
  <rect x="262" y="148" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="277" y="164" text-anchor="middle" font-size="10" fill="#333">6</text>
  <rect x="442" y="148" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="457" y="164" text-anchor="middle" font-size="10" fill="#333">12</text>
  <text x="490" y="164" font-size="10" fill="#888">每周期 1 个</text>

  <!-- Row 1 -->
  <rect x="30" y="178" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="194" text-anchor="middle" font-size="11" fill="#333">行 1</text>
  <text x="92" y="194" font-size="11" fill="#666">i=1 与 cycle−1=5</text>
  <rect x="100" y="206" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="115" y="222" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="220" y="206" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="235" y="222" text-anchor="middle" font-size="10" fill="#333">5</text>
  <rect x="292" y="206" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="307" y="222" text-anchor="middle" font-size="10" fill="#333">7</text>
  <rect x="412" y="206" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="427" y="222" text-anchor="middle" font-size="10" fill="#333">11</text>
  <rect x="472" y="206" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="487" y="222" text-anchor="middle" font-size="10" fill="#333">13</text>
  <text x="510" y="222" font-size="10" fill="#888">每周期 2 个</text>

  <!-- Row 2 -->
  <rect x="30" y="236" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="252" text-anchor="middle" font-size="11" fill="#333">行 2</text>
  <text x="92" y="252" font-size="11" fill="#666">i=2 与 cycle−2=4</text>
  <rect x="130" y="264" width="30" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="145" y="280" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="190" y="264" width="30" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="205" y="280" text-anchor="middle" font-size="10" fill="#333">4</text>
  <rect x="322" y="264" width="30" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="337" y="280" text-anchor="middle" font-size="10" fill="#333">8</text>
  <rect x="382" y="264" width="30" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="397" y="280" text-anchor="middle" font-size="10" fill="#333">10</text>
  <text x="490" y="280" font-size="10" fill="#888">每周期 2 个</text>

  <!-- Row 3 -->
  <rect x="30" y="294" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="310" text-anchor="middle" font-size="11" fill="#333">行 3</text>
  <text x="92" y="310" font-size="11" fill="#666">i = 3</text>
  <rect x="160" y="322" width="30" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="175" y="338" text-anchor="middle" font-size="10" fill="#333">3</text>
  <rect x="352" y="322" width="30" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="367" y="338" text-anchor="middle" font-size="10" fill="#333">9</text>
  <text x="490" y="338" font-size="10" fill="#888">每周期 1 个</text>

  <!-- Summary box -->
  <rect x="30" y="354" width="500" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="368" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">首尾行每周期 1 字符；中间行每周期 2 字符（i 与 cycle−i）</text>
</svg>
