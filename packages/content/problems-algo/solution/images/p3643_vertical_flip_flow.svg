<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：双指针 l、r 相向而行，逐列交换对称行</text>

  <rect x="24" y="42" width="132" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="90" y="62" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">⚠ 奇数 k</text>
  <text x="90" y="80" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">l == r 自动退出</text>
  <text x="90" y="97" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">中间行无需特判</text>

  <rect x="210" y="42" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="61" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">输入 x, y, k</text>

  <path d="M 260 72 L 260 86" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="175" y="90" width="170" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="111" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">l = x, r = x + k − 1</text>

  <path d="M 260 124 L 260 136" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,140 352,180 260,220 168,180" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="185" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">l &lt; r ?</text>

  <path d="M 352 180 L 390 180" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="368" y="172" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="396" y="162" width="104" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="448" y="184" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 grid</text>

  <path d="M 260 220 L 260 242" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="236" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="150" y="244" width="220" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="263" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">c 从 y 到 y+k−1：</text>
  <text x="260" y="283" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">swap(grid[l][c], grid[r][c])</text>

  <path d="M 260 294 L 260 310" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="185" y="312" width="150" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="333" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">l++，r−−</text>

  <path d="M 185 329 L 64 329 L 64 180 L 160 180" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="260" y="357" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每个元素至多参与一次交换 → 时间 O(k²)、空间 O(1)</text>
</svg>
