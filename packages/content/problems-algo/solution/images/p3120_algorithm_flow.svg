<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一趟扫描置位，收尾 popcount(lower &amp; upper)</text>

  <rect x="205" y="38" width="110" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="260" y="57" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">开始</text>

  <path d="M 260 66 L 260 80" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="180" y="84" width="160" height="30" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="260" y="104" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">lower = 0，upper = 0</text>

  <path d="M 260 114 L 260 128" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="260,132 360,172 260,212 160,172" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="170" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">还有字符？</text>
  <text x="260" y="188" text-anchor="middle" font-size="9.5" fill="#b08040" filter="url(#rough2)">word 扫完了吗？</text>

  <path d="M 260 212 L 260 236" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="271" y="228" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="170" y="240" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="260" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">取出下一个字符 c</text>

  <path d="M 260 270 L 260 282" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="260,286 352,312 260,338 168,312" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="310" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">c 是小写？</text>
  <text x="260" y="327" text-anchor="middle" font-size="9.5" fill="#b08040" filter="url(#rough2)">写进哪张表？</text>

  <path d="M 168 312 L 110 340" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="118" y="320" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <path d="M 352 312 L 390 340" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="372" y="320" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="20" y="344" width="150" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="95" y="365" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">lower |= 1 &lt;&lt; (c−'a')</text>

  <rect x="350" y="344" width="150" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="425" y="365" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">upper |= 1 &lt;&lt; (c−'A')</text>

  <path d="M 425 376 L 425 398 L 8 398 L 8 172 L 146 172" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 95 376 L 95 398" stroke="#888" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="20" y="244" font-size="10" fill="#888" filter="url(#rough2)">下一轮</text>

  <path d="M 360 172 L 391 172" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="372" y="164" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="395" y="142" width="115" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="452" y="162" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = popcount</text>
  <text x="452" y="178" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(lower &amp; upper)</text>
  <text x="452" y="196" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <rect x="48" y="414" width="424" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="430" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">每字符 O(1) 置位 → 总时间 O(n)；两个 26 位 int → 空间 O(1)</text>
  <text x="260" y="446" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">popcount 直接用内置：__builtin_popcount / int.bit_count / Integer.bitCount</text>
</svg>
