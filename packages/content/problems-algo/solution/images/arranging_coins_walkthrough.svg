<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 8，求完整阶梯行数 = 3</text>

  <!-- ===== Table header ===== -->
  <rect x="40" y="48" width="500" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="67" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">轮次</text>
  <text x="148" y="67" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[lo, hi]</text>
  <text x="220" y="67" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">mid</text>
  <text x="298" y="67" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">mid(mid+1)/2</text>
  <text x="382" y="67" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">判定</text>
  <text x="484" y="67" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">动作</text>

  <!-- column separators -->
  <line x1="100" y1="48" x2="100" y2="208" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="196" y1="48" x2="196" y2="208" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="244" y1="48" x2="244" y2="208" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="352" y1="48" x2="352" y2="208" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="412" y1="48" x2="412" y2="208" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Row 1 ===== -->
  <rect x="40" y="80" width="500" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="99" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="148" y="99" text-anchor="middle" font-size="11" fill="#333">[1, 8]</text>
  <text x="220" y="99" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="298" y="99" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">10</text>
  <text x="382" y="99" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">10 &gt; 8 ✗</text>
  <text x="484" y="99" text-anchor="middle" font-size="11" fill="#b85450">hi = 3</text>

  <!-- ===== Row 2 ===== -->
  <rect x="40" y="112" width="500" height="30" fill="#fff" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="131" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="148" y="131" text-anchor="middle" font-size="11" fill="#333">[1, 3]</text>
  <text x="220" y="131" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="298" y="131" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="382" y="131" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3 ≤ 8 ✓</text>
  <text x="484" y="131" text-anchor="middle" font-size="11" fill="#4a7a3a">ans=2; lo=3</text>

  <!-- ===== Row 3 ===== -->
  <rect x="40" y="144" width="500" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="163" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="148" y="163" text-anchor="middle" font-size="11" fill="#333">[3, 3]</text>
  <text x="220" y="163" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="298" y="163" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">6</text>
  <text x="382" y="163" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">6 ≤ 8 ✓</text>
  <text x="484" y="163" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">ans=3; lo=4</text>

  <!-- ===== End row ===== -->
  <rect x="40" y="178" width="500" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="196" text-anchor="middle" font-size="11" fill="#333">lo=4 &gt; hi=3，循环结束 → 返回 ans = 3</text>

  <!-- ===== Bottom note ===== -->
  <rect x="40" y="226" width="500" height="112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="250" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">关键观察</text>
  <text x="60" y="272" font-size="11" fill="#555">• 第 2 轮 mid=2 可行（3 枚 ≤ 8）后，仍要继续向右试 mid=3，确保没有更大的可行 k</text>
  <text x="60" y="290" font-size="11" fill="#555">• 第 3 轮 mid=3 可行（6 枚 ≤ 8）记 ans=3；第 4 行需 10 枚 &gt; 8 被排除</text>
  <text x="60" y="308" font-size="11" fill="#555">• 验证：1+2+3 = 6 ≤ 8（前3行完整），1+2+3+4 = 10 &gt; 8（第4行不完整）→ 答案 3</text>
  <text x="60" y="326" font-size="11" fill="#d6a040" font-weight="bold">  对比 69 题：同属「求最大可行」的二分答案，只是验证函数从 r²≤x 换成 k(k+1)/2≤n</text>
</svg>
