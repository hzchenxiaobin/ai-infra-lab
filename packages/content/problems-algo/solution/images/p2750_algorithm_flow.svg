<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">
    算法流程：扫描一遍，累乘相邻 1 的下标差
  </text>

  <!-- Step 1 -->
  <rect x="60" y="50" width="520" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="80" y="72" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">1</text>
  <text x="320" y="72" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">扫描 nums，记录上一个 1 的下标 prev = -1</text>
  <text x="320" y="90" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">ans = 1（累乘器初值）</text>
  <path d="M 320 100 L 320 120" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#af)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="60" y="124" width="520" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="80" y="146" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">2</text>
  <text x="320" y="146" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">遇到 nums[i] == 1：</text>
  <text x="320" y="164" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">若 prev != -1，则 ans = ans * (i - prev) % MOD</text>
  <path d="M 320 174 L 320 194" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#af)" filter="url(#rough2)"/>

  <!-- Step 3 (loop back) -->
  <rect x="60" y="198" width="520" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="80" y="224" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">3</text>
  <text x="320" y="224" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">更新 prev = i，继续扫描直到数组末尾</text>

  <!-- loop arrow back up to step 2 -->
  <path d="M 580 220 Q 612 220 612 149 Q 612 78 580 149" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#af)" filter="url(#rough2)"/>
  <text x="600" y="180" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">下个 1</text>

  <path d="M 320 242 L 320 262" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#af)" filter="url(#rough2)"/>

  <!-- Decision: any 1 found? -->
  <polygon points="320,266 460,320 320,374 180,320" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="316" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">是否找到过 1？</text>
  <text x="320" y="334" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">(prev == -1 ?)</text>

  <!-- No branch -->
  <path d="M 180 320 L 120 320" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#af)" filter="url(#rough2)"/>
  <text x="150" y="312" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="40" y="304" width="76" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="78" y="324" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">return 0</text>

  <!-- Yes branch -->
  <path d="M 460 320 L 520 320" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#af)" filter="url(#rough2)"/>
  <text x="490" y="312" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="524" y="304" width="96" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="572" y="324" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">return ans</text>

  <text x="320" y="404" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">
    O(n) 时间 / O(1) 空间，只需记 prev 与 ans 两个变量
  </text>
</svg>
