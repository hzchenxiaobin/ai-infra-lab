<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="410" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：四条件 AND → 一趟扫描、三个状态、四分桶</text>

  <!-- 四条件卡片 -->
  <rect x="16" y="38" width="116" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="74" y="58" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① 长度 ≥ 3</text>
  <text x="74" y="76" text-anchor="middle" font-size="9.5" fill="#6a86a5" filter="url(#rough2)">len(word) ≥ 3</text>

  <rect x="144" y="38" width="116" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="202" y="58" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">② 字母+数字</text>
  <text x="202" y="76" text-anchor="middle" font-size="9.5" fill="#6a86a5" filter="url(#rough2)">@ # $ 一律非法</text>

  <rect x="272" y="38" width="116" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="330" y="58" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">③ 有元音</text>
  <text x="330" y="76" text-anchor="middle" font-size="9.5" fill="#7a9a6a" filter="url(#rough2)">a e i o u 及大写</text>

  <rect x="400" y="38" width="104" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="452" y="58" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">④ 有辅音</text>
  <text x="452" y="76" text-anchor="middle" font-size="9.5" fill="#7a9a6a" filter="url(#rough2)">元音外的字母</text>

  <path d="M 260 90 L 260 104" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="48" y="108" width="424" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="129" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">AND 关系 → 一趟扫描只维护三个状态：hasVowel、hasCons、合法性</text>

  <text x="46" y="164" font-size="12.5" fill="#555" font-weight="bold" filter="url(#rough2)">每个字符落进四桶之一：</text>

  <!-- 行1 元音 -->
  <rect x="36" y="172" width="216" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="144" y="193" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">元音字母（10 个）：aeiouAEIOU</text>
  <path d="M 254 189 L 278 189" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="282" y="172" width="200" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="382" y="193" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">hasVowel = true</text>

  <!-- 行2 辅音 -->
  <rect x="36" y="214" width="216" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="144" y="235" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">其它字母（42 个）：b c d … Z</text>
  <path d="M 254 231 L 278 231" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="282" y="214" width="200" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="382" y="235" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">hasCons = true</text>

  <!-- 行3 数字 -->
  <rect x="36" y="256" width="216" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="144" y="277" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">数字（10 个）：0 1 2 … 9</text>
  <path d="M 254 273 L 278 273" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="282" y="256" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="382" y="277" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">不置旗 —— 合法旁观者</text>

  <!-- 行4 非法 -->
  <rect x="36" y="298" width="216" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="144" y="319" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">其余字符：@ # $ 等非字母数字</text>
  <path d="M 254 315 L 278 315" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="282" y="298" width="200" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="382" y="319" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">立即 return false</text>

  <rect x="80" y="344" width="360" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="364" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">收尾：len ≥ 3 且 hasVowel 且 hasCons → 有效</text>

  <text x="260" y="394" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">⚠ 数字既非元音也非辅音："123" 长度合法、字符合法，却必然无效</text>
</svg>
