<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：规范化签名——把首字母归一到 'a'</text>

  <!-- formula box -->
  <rect x="60" y="44" width="420" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="12.5" fill="#444">key(s)：每个 c 映射为 (c − s[0]) mod 26，再 + 'a'</text>

  <!-- Row 1: abc -->
  <text x="40" y="120" font-size="11" fill="#888">abc</text>
  <rect x="70" y="100" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="87" y="120" text-anchor="middle" font-size="12" fill="#333">a</text>
  <rect x="108" y="100" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="120" text-anchor="middle" font-size="12" fill="#333">b</text>
  <rect x="146" y="100" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="163" y="120" text-anchor="middle" font-size="12" fill="#333">c</text>
  <path d="M 188 115 L 290 115" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="239" y="108" text-anchor="middle" font-size="10.5" fill="#888">s[0]=a，不移</text>
  <rect x="302" y="100" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="319" y="120" text-anchor="middle" font-size="12" fill="#333">a</text>
  <rect x="340" y="100" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="357" y="120" text-anchor="middle" font-size="12" fill="#333">b</text>
  <rect x="378" y="100" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="395" y="120" text-anchor="middle" font-size="12" fill="#333">c</text>

  <!-- Row 2: bcd -->
  <text x="40" y="165" font-size="11" fill="#888">bcd</text>
  <rect x="70" y="145" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="87" y="165" text-anchor="middle" font-size="12" fill="#333">b</text>
  <rect x="108" y="145" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="165" text-anchor="middle" font-size="12" fill="#333">c</text>
  <rect x="146" y="145" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="163" y="165" text-anchor="middle" font-size="12" fill="#333">d</text>
  <path d="M 188 160 L 290 160" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="239" y="153" text-anchor="middle" font-size="10.5" fill="#888">s[0]=b，各 −1</text>
  <rect x="302" y="145" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="319" y="165" text-anchor="middle" font-size="12" fill="#333">a</text>
  <rect x="340" y="145" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="357" y="165" text-anchor="middle" font-size="12" fill="#333">b</text>
  <rect x="378" y="145" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="395" y="165" text-anchor="middle" font-size="12" fill="#333">c</text>

  <!-- Row 3: xyz -->
  <text x="40" y="210" font-size="11" fill="#888">xyz</text>
  <rect x="70" y="190" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="87" y="210" text-anchor="middle" font-size="12" fill="#333">x</text>
  <rect x="108" y="190" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="210" text-anchor="middle" font-size="12" fill="#333">y</text>
  <rect x="146" y="190" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="163" y="210" text-anchor="middle" font-size="12" fill="#333">z</text>
  <path d="M 188 205 L 290 205" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="239" y="198" text-anchor="middle" font-size="10.5" fill="#888">s[0]=x，各 +3 回绕</text>
  <rect x="302" y="190" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="319" y="210" text-anchor="middle" font-size="12" fill="#333">a</text>
  <rect x="340" y="190" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="357" y="210" text-anchor="middle" font-size="12" fill="#333">b</text>
  <rect x="378" y="190" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="395" y="210" text-anchor="middle" font-size="12" fill="#333">c</text>

  <!-- bucket collecting outputs -->
  <path d="M 320 230 L 320 224 L 394 224 L 394 230" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <rect x="60" y="236" width="420" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="270" y="256" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">签名 key = "abc" → 同一桶 { "abc", "bcd", "xyz" }</text>
  <text x="270" y="272" text-anchor="middle" font-size="11" fill="#4a7a3a">三个串规范化后都是 "abc"，自动归组</text>

  <!-- insight -->
  <rect x="60" y="296" width="420" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="316" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">同一规范化签名 ⇒ 同一移位序列</text>
  <text x="270" y="332" text-anchor="middle" font-size="11.5" fill="#555">哈希表自动成组，一次遍历 O(n·L)</text>
</svg>
