<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#555"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：倒序一趟 —— 原地后缀和 + 打擂台</text>

  <!-- top-right annotation -->
  <rect x="368" y="36" width="140" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="438" y="56" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">原地改写：energy[i]</text>
  <text x="438" y="70" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">算完就是 dp[i]；读到的</text>
  <text x="438" y="84" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">energy[i+k] 已是 dp[i+k]</text>

  <!-- start -->
  <rect x="190" y="40" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="59" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">i = n − 1，ans = −∞</text>

  <path d="M 270 70 L 270 90" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 1 -->
  <polygon points="270,92 345,122 270,152 195,122" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="126" text-anchor="middle" font-size="11" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">i + k &lt; n ?</text>

  <!-- yes: accumulate -->
  <path d="M 345 122 L 375 122" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="357" y="114" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="378" y="106" width="130" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="443" y="126" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">energy[i] += energy[i+k]</text>
  <path d="M 443 138 L 443 170 L 288 170 L 288 176" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- no: chain tail, straight down -->
  <path d="M 270 152 L 270 174" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="167" font-size="8.5" fill="#8a6a1f" filter="url(#rough2)">否：链尾，保持原值</text>

  <!-- ans update -->
  <rect x="190" y="176" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="270" y="195" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">ans = max(ans, energy[i])</text>

  <path d="M 270 206 L 270 222" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="210" y="224" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="270" y="242" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">i = i − 1</text>

  <path d="M 270 252 L 270 264" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 2 -->
  <polygon points="270,266 335,292 270,318 205,292" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="296" text-anchor="middle" font-size="11" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">i &lt; 0 ?</text>

  <!-- yes: return -->
  <path d="M 335 292 L 363 292" stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="346" y="284" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="366" y="276" width="140" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="436" y="296" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <!-- no: loop back -->
  <path d="M 205 292 L 14 292 L 14 122 L 191 122" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="30" y="284" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否：继续向左</text>

  <!-- bottom note -->
  <rect x="12" y="330" width="496" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="346" text-anchor="middle" font-size="10" fill="#8a3a36" filter="url(#rough2)">依赖 dp[i+k] 在右侧 ⇒ 必须倒序；一趟 O(n)，原地 O(1) 额外空间</text>
</svg>
