<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：奇偶各建「去重桶」，平衡 ⟺ 两桶计数相等</text>

  <!-- 窗口括框 -->
  <rect x="124" y="38" width="272" height="58" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="134" y="33" font-size="11" fill="#4a7a3a" filter="url(#rough2)">窗口 [l..r]</text>

  <!-- 数组 3 2 2 5 4 -->
  <rect x="132" y="44" width="48" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="156" y="70" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">3</text>
  <rect x="184" y="44" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="208" y="70" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">2</text>
  <rect x="236" y="44" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="70" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">2</text>
  <rect x="288" y="44" width="48" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="312" y="70" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">5</text>
  <rect x="340" y="44" width="48" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="364" y="70" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">4</text>

  <!-- 元素流向桶的箭头 -->
  <path d="M 150 96 Q 118 126 124 156" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="92" y="132" font-size="11" fill="#d6a040" filter="url(#rough2)">奇数</text>
  <path d="M 372 96 Q 402 126 396 156" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="408" y="128" font-size="11" fill="#446688" filter="url(#rough2)">偶数</text>

  <!-- 重复的 2：不入桶计数 -->
  <path d="M 260 96 Q 286 130 320 152" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="292" y="122" font-size="10" fill="#b85450" filter="url(#rough2)">重复的 2：已在桶中</text>
  <text x="300" y="135" font-size="10" fill="#b85450" filter="url(#rough2)">计数不变</text>

  <!-- 奇数桶 -->
  <rect x="60" y="160" width="180" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="150" y="180" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">奇数桶（不同值集合）</text>
  <rect x="111" y="192" width="34" height="26" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="128" y="210" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="155" y="192" width="34" height="26" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="172" y="210" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="150" y="244" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">odd = 2</text>

  <!-- 偶数桶 -->
  <rect x="280" y="160" width="180" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="370" y="180" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">偶数桶（不同值集合）</text>
  <rect x="331" y="192" width="34" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="348" y="210" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="375" y="192" width="34" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="392" y="210" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="370" y="244" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">even = 2</text>

  <!-- 平衡判定 -->
  <rect x="105" y="272" width="310" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="291" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">odd == even ?  2 == 2  ⟹ 平衡 ✓</text>
  <text x="260" y="309" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">ans = max(ans, r − l + 1) = 5</text>

  <text x="260" y="340" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">注：单个元素必不平衡（1 ≠ 0），全偶 / 全奇数组答案为 0</text>
</svg>
