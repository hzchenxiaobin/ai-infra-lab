<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：两个例子分别覆盖两个分支</text>

  <!-- 面板 A：n=3, k=5 -->
  <rect x="16" y="42" width="238" height="256" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="135" y="66" text-anchor="middle" font-size="13.5" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 1：n = 3, k = 5</text>

  <rect x="38" y="78" width="194" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="135" y="95" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">T = 2 × (3 − 1) = 4</text>

  <rect x="38" y="110" width="194" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="135" y="127" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">r = 5 mod 4 = 1</text>

  <rect x="38" y="142" width="194" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="135" y="161" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1 &lt; 3 → 去程 → 答案 = 1</text>

  <text x="30" y="196" font-size="11.5" fill="#555" filter="url(#rough2)">t</text>
  <rect x="46" y="184" width="28" height="20" fill="#ffffff" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="198" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <rect x="78" y="184" width="28" height="20" fill="#ffffff" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="92" y="198" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <rect x="110" y="184" width="28" height="20" fill="#ffffff" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="124" y="198" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <rect x="142" y="184" width="28" height="20" fill="#ffffff" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="156" y="198" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>
  <rect x="174" y="184" width="28" height="20" fill="#ffffff" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="188" y="198" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4</text>
  <rect x="206" y="184" width="28" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="220" y="198" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>

  <text x="30" y="228" font-size="11.5" fill="#555" filter="url(#rough2)">位置</text>
  <rect x="46" y="216" width="28" height="20" fill="#ffffff" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="230" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <rect x="78" y="216" width="28" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="92" y="230" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="110" y="216" width="28" height="20" fill="#ffffff" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="124" y="230" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <rect x="142" y="216" width="28" height="20" fill="#ffffff" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="156" y="230" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <rect x="174" y="216" width="28" height="20" fill="#ffffff" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="188" y="230" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <rect x="206" y="216" width="28" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="220" y="230" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="135" y="262" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">t = 5 与 t = 1 位置相同</text>
  <text x="135" y="280" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">（5 ≡ 1 mod 4，周期折叠）</text>

  <!-- 面板 B：n=5, k=6 -->
  <rect x="266" y="42" width="238" height="256" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="385" y="66" text-anchor="middle" font-size="13.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">示例 2：n = 5, k = 6</text>

  <rect x="288" y="78" width="194" height="26" fill="#ffffff" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="385" y="95" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">T = 2 × (5 − 1) = 8</text>

  <rect x="288" y="110" width="194" height="26" fill="#ffffff" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="385" y="127" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">r = 6 mod 8 = 6</text>

  <rect x="288" y="142" width="194" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="385" y="161" text-anchor="middle" font-size="12" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">6 ≥ 5 → 回程 → 答案 = 8 − 6 = 2</text>

  <text x="278" y="196" font-size="11.5" fill="#555" filter="url(#rough2)">t</text>
  <rect x="292" y="184" width="24" height="20" fill="#ffffff" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="304" y="198" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <rect x="320" y="184" width="24" height="20" fill="#ffffff" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="332" y="198" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <rect x="348" y="184" width="24" height="20" fill="#ffffff" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="360" y="198" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <rect x="376" y="184" width="24" height="20" fill="#ffffff" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="388" y="198" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>
  <rect x="404" y="184" width="24" height="20" fill="#ffffff" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="416" y="198" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4</text>
  <rect x="432" y="184" width="24" height="20" fill="#ffffff" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="444" y="198" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">5</text>
  <rect x="460" y="184" width="24" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="472" y="198" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">6</text>

  <text x="278" y="228" font-size="11.5" fill="#555" filter="url(#rough2)">位置</text>
  <rect x="292" y="216" width="24" height="20" fill="#ffffff" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="304" y="230" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <rect x="320" y="216" width="24" height="20" fill="#ffffff" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="332" y="230" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <rect x="348" y="216" width="24" height="20" fill="#ffffff" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="360" y="230" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <rect x="376" y="216" width="24" height="20" fill="#ffffff" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="388" y="230" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>
  <rect x="404" y="216" width="24" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="416" y="230" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="432" y="216" width="24" height="20" fill="#ffffff" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="444" y="230" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>
  <rect x="460" y="216" width="24" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="472" y="230" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>

  <text x="385" y="262" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">0 → 4 去程用了 4 秒，</text>
  <text x="385" y="280" text-anchor="middle" font-size="11.5" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">剩下 2 秒从右端折回到 2 号</text>

  <text x="260" y="332" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">示例 3（n = 4, k = 2）：T = 6，r = 2 &lt; 4 → 去程 → 答案 = 2</text>
  <text x="260" y="352" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">一行公式：ans = r（r &lt; n），否则 ans = T − r</text>
</svg>
