<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：街道两侧相互独立</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">一侧放房不影响另一侧同号地块 → 总方式 = g(n) × g(n) = g(n)²</text>

  <!-- ===== Top side (plots 1..n) ===== -->
  <text x="50" y="96" font-size="10" fill="#888" font-weight="bold">一侧：</text>
  <g font-size="10" fill="#333">
    <rect x="100" y="76" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="122" y="98" text-anchor="middle" font-size="9" fill="#446688">1</text>
    <rect x="146" y="76" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="168" y="98" text-anchor="middle" font-size="9" fill="#446688">2</text>
    <rect x="192" y="76" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="214" y="98" text-anchor="middle" font-size="9" fill="#446688">3</text>
    <text x="244" y="98" font-size="12" fill="#888">…</text>
    <rect x="256" y="76" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="278" y="98" text-anchor="middle" font-size="9" fill="#446688">n-1</text>
    <rect x="302" y="76" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="324" y="98" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">n</text>
  </g>
  <path d="M 356 93 L 400 93" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="400" y="80" width="80" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="440" y="100" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">g(n) 种</text>

  <!-- ===== Bottom side (plots 1..n) ===== -->
  <text x="50" y="156" font-size="10" fill="#888" font-weight="bold">另一侧：</text>
  <g font-size="10" fill="#333">
    <rect x="100" y="136" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="122" y="158" text-anchor="middle" font-size="9" fill="#4a7a3a">1</text>
    <rect x="146" y="136" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="168" y="158" text-anchor="middle" font-size="9" fill="#4a7a3a">2</text>
    <rect x="192" y="136" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="214" y="158" text-anchor="middle" font-size="9" fill="#4a7a3a">3</text>
    <text x="244" y="158" font-size="12" fill="#888">…</text>
    <rect x="256" y="136" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="278" y="158" text-anchor="middle" font-size="9" fill="#4a7a3a">n-1</text>
    <rect x="302" y="136" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="324" y="158" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">n</text>
  </g>
  <path d="M 356 153 L 400 153" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="400" y="140" width="80" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="440" y="160" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">g(n) 种</text>

  <!-- independence note -->
  <text x="260" y="194" text-anchor="middle" font-size="10" fill="#888">两侧独立：乘法原理 → 总方式 = g(n) × g(n)</text>

  <!-- multiply node -->
  <circle cx="260" cy="226" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="232" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">×</text>

  <!-- formula box -->
  <rect x="70" y="262" width="380" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="286" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">ans = g(n)²  mod  (10⁹ + 7)</text>
  <text x="260" y="306" text-anchor="middle" font-size="10" fill="#888">先算「一侧 n 个地块、相邻不放房」的方式 g(n)，再平方</text>
  <text x="260" y="322" text-anchor="middle" font-size="9" fill="#888">g(n) 满足斐波那契递推 g(i) = g(i-1) + g(i-2)</text>
</svg>
