<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="900" height="620" fill="#fafafa"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">算法流程：push / pop / increment 均为 O(1)</text>
  <path d="M 280 40 Q 450 48 620 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ============ push 分支 ============ -->
  <text x="150" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e" filter="url(#sk)">push(x)</text>

  <!-- 判满菱形 -->
  <g filter="url(#sk)">
    <polygon points="150,92 240,124 150,156 60,124" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="150" y="120" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">len &lt; cap?</text>
  <text x="150" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">（栈满？）</text>

  <!-- 是 -->
  <path d="M 60 124 L 30 124 L 30 178" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="34" y="118" font-size="10" fill="#4a7a3a" filter="url(#sk)">是</text>
  <g filter="url(#sk)">
    <rect x="30" y="178" width="120" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="90" y="194" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#sk)">stack.append(x)</text>
  <text x="90" y="210" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#sk)">add.append(0)</text>

  <!-- 否 -->
  <path d="M 240 124 L 270 124 L 270 178" stroke="#b85450" stroke-width="1.8" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="248" y="118" font-size="10" fill="#b85450" filter="url(#sk)">否</text>
  <g filter="url(#sk)">
    <rect x="210" y="178" width="120" height="40" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="270" y="202" text-anchor="middle" font-size="11" fill="#7a2828" filter="url(#sk)">忽略（栈满）</text>

  <text x="150" y="240" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">O(1)：两次尾插</text>

  <!-- ============ pop 分支 ============ -->
  <text x="460" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#sk)">pop()</text>

  <!-- 判空菱形 -->
  <g filter="url(#sk)">
    <polygon points="460,92 550,124 460,156 370,124" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
  </g>
  <text x="460" y="120" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">stack 空?</text>
  <text x="460" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)"></text>

  <!-- 是 -->
  <path d="M 550 124 L 580 124 L 580 178" stroke="#b85450" stroke-width="1.8" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="558" y="118" font-size="10" fill="#b85450" filter="url(#sk)">是</text>
  <g filter="url(#sk)">
    <rect x="520" y="178" width="120" height="40" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="580" y="202" text-anchor="middle" font-size="11" fill="#7a2828" filter="url(#sk)">return -1</text>

  <!-- 否 -->
  <path d="M 370 124 L 340 124 L 340 178" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="316" y="118" font-size="10" fill="#4a7a3a" filter="url(#sk)">否</text>
  <g filter="url(#sk)">
    <rect x="270" y="178" width="200" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="370" y="194" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#sk)">i = len-1；if i&gt;0: add[i-1] += add[i]</text>
  <text x="370" y="210" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#sk)">（增量下传一层）</text>

  <path d="M 370 218 L 370 248" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="270" y="248" width="200" height="40" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <text x="370" y="264" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">val = stack.pop() + add.pop()</text>
  <text x="370" y="280" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">return val（结算并清理）</text>

  <text x="460" y="306" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">O(1)：一次下传 + 两次尾删</text>

  <!-- ============ increment 分支 ============ -->
  <text x="750" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415" filter="url(#sk)">increment(k, val)</text>

  <!-- 判空菱形 -->
  <g filter="url(#sk)">
    <polygon points="750,92 840,124 750,156 660,124" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="750" y="120" text-anchor="middle" font-size="11" fill="#333" filter="url(#sk)">stack 空?</text>

  <!-- 是 -->
  <path d="M 840 124 L 870 124 L 870 178" stroke="#b85450" stroke-width="1.8" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="848" y="118" font-size="10" fill="#b85450" filter="url(#sk)">是</text>
  <g filter="url(#sk)">
    <rect x="810" y="178" width="80" height="40" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="850" y="202" text-anchor="middle" font-size="11" fill="#7a2828" filter="url(#sk)">return</text>

  <!-- 否 -->
  <path d="M 660 124 L 630 124 L 630 178" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arG)" filter="url(#sk)"/>
  <text x="606" y="118" font-size="10" fill="#4a7a3a" filter="url(#sk)">否</text>
  <g filter="url(#sk)">
    <rect x="630" y="178" width="180" height="40" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="720" y="194" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#sk)">i = min(k, len) - 1</text>
  <text x="720" y="210" text-anchor="middle" font-size="11" fill="#2e6e2e" filter="url(#sk)">（定位前缀最大下标）</text>

  <path d="M 720 218 L 720 248" stroke="#3a3a3a" stroke-width="1.5" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="630" y="248" width="180" height="40" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="720" y="264" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold" filter="url(#sk)">add[i] += val</text>
  <text x="720" y="280" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">（只记账，不动 stack）</text>

  <text x="750" y="306" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">O(1)：一次加法</text>

  <!-- 底部小结 -->
  <g filter="url(#sk)">
    <rect x="60" y="340" width="780" height="260" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/>
  </g>
  <text x="450" y="366" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">三个操作的设计要点</text>

  <text x="84" y="392" font-size="11" fill="#2b6e9e" font-weight="bold" filter="url(#sk)">push：stack 与 add 严格等高</text>
  <text x="100" y="410" font-size="11" fill="#444" filter="url(#sk)">- 同步压入：stack 压 x，add 压 0（新元素暂无待结算增量）</text>
  <text x="100" y="426" font-size="11" fill="#444" filter="url(#sk)">- 栈满（len == cap）时静默忽略，两数组都不变</text>

  <text x="84" y="452" font-size="11" fill="#b85450" font-weight="bold" filter="url(#sk)">pop：结算当前层 + 下传给下一层</text>
  <text x="100" y="470" font-size="11" fill="#444" filter="url(#sk)">- 真实值 = stack[i] + add[i]（弹出元素拿走自己那份增量）</text>
  <text x="100" y="486" font-size="11" fill="#444" filter="url(#sk)">- add[i-1] += add[i]：剩余 0..i-1 仍需承受这笔增量，下传保证不变量</text>
  <text x="100" y="502" font-size="11" fill="#444" filter="url(#sk)">- i==0 时无下层可传，直接结算弹出</text>

  <text x="84" y="528" font-size="11" fill="#7a5415" font-weight="bold" filter="url(#sk)">increment：单点记账覆盖整段前缀</text>
  <text x="100" y="546" font-size="11" fill="#444" filter="url(#sk)">- i = min(k, n) - 1：k 超过栈大小就只标记到栈顶下标（等价全部加）</text>
  <text x="100" y="562" font-size="11" fill="#444" filter="url(#sk)">- add[i] += val：只改一个位置，O(k) 的展开推迟到未来 k 次 pop 逐点消化</text>
  <text x="100" y="578" font-size="11" fill="#4a7a3a" filter="url(#sk)">- 每个 add 标记一生只下传一次 → pop 均摊 O(1)</text>

  <text x="450" y="596" text-anchor="middle" font-size="10" fill="#888" font-style="italic" filter="url(#sk)">骨架同 155 最小栈：辅助数组随 push/pop 同步维护；只是这里缓存的是"增量"而非"最小值"</text>
</svg>
