<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：枚举区间 + 数位置位 + 查质数表</text>

  <!-- Step 1: init -->
  <rect x="180" y="48" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="70" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">初始化：count = 0</text>
  <path d="M 280 82 L 280 98" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: loop header -->
  <rect x="160" y="100" width="240" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="116" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">for n = left to right</text>
  <text x="280" y="132" text-anchor="middle" font-size="10" fill="#888">枚举区间 [left, right] 内每个整数</text>
  <path d="M 280 140 L 280 156" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: popcount box -->
  <rect x="150" y="158" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="174" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">k = popcount(n)</text>
  <text x="280" y="190" text-anchor="middle" font-size="10" fill="#888">用 n &amp;= n − 1 抹最低位，循环到 0</text>
  <path d="M 280 198 L 280 214" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: decision diamond -->
  <polygon points="280,216 360,256 280,296 200,256" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="252" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">k ∈ 质数集？</text>
  <text x="280" y="268" text-anchor="middle" font-size="10" fill="#888">{2,3,5,7,11,13,17,19}</text>

  <!-- Yes branch -->
  <path d="M 360 256 L 420 256" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="388" y="250" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="424" y="238" width="110" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="479" y="261" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">count += 1</text>

  <!-- No branch -->
  <path d="M 200 256 L 140 256" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="172" y="250" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="40" y="238" width="96" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="88" y="261" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">跳过</text>

  <!-- loop back -->
  <path d="M 479 274 L 479 318" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 88 274 L 88 318" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 88 318 L 479 318" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 280 318 L 280 138" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="332" font-size="10" fill="#888">↑ 取下一个 n</text>

  <!-- exit -->
  <path d="M 280 100 L 280 88 L 480 88 L 480 120" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <rect x="180" y="350" width="200" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="372" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">区间遍历结束</text>
  <path d="M 280 384 L 280 400" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="160" y="402" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="424" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">返回 count</text>

  <!-- side note -->
  <rect x="40" y="350" width="120" height="86" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="100" y="370" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">质数判定 O(1)</text>
  <text x="50" y="388" font-size="10" fill="#444">用位掩码一次比较：</text>
  <text x="50" y="404" font-size="9.5" fill="#444">mask = 665772</text>
  <text x="50" y="420" font-size="9.5" fill="#444">(mask &gt;&gt; k) &amp; 1 为真即质数</text>
</svg>
