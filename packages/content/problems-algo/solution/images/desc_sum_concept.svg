<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">值等于子节点和：后序返回子树总和，绿色✓满足 val == l+r</text>

  <!-- 连线 -->
  <line x1="268" y1="92" x2="192" y2="138" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="292" y1="92" x2="368" y2="138" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="168" y1="172" x2="132" y2="218" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="192" y1="172" x2="228" y2="218" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 根 10 (满足: 10 == 6+4) -->
  <circle cx="280" cy="80" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="280" y="85" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">10</text>
  <text x="306" y="68" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="300" y="92" font-size="9" fill="#4a7a3a">→20</text>

  <!-- 节点 3 (满足: 3 == 2+1) -->
  <circle cx="180" cy="155" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="180" y="160" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="204" y="146" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="200" y="168" font-size="9" fill="#4a7a3a">→6</text>

  <!-- 节点 4 (不满足: 4 != 0) -->
  <circle cx="380" cy="155" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="380" y="160" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <text x="402" y="146" font-size="10" fill="#b85450" font-weight="bold">✗</text>
  <text x="400" y="168" font-size="9" fill="#b85450">→4</text>

  <!-- 叶 2 (不满足: 2 != 0) -->
  <circle cx="125" cy="232" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="125" y="237" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="145" y="223" font-size="10" fill="#b85450" font-weight="bold">✗</text>
  <text x="143" y="243" font-size="9" fill="#b85450">→2</text>

  <!-- 叶 1 (不满足: 1 != 0) -->
  <circle cx="235" cy="232" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="235" y="237" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="255" y="223" font-size="10" fill="#b85450" font-weight="bold">✗</text>
  <text x="253" y="243" font-size="9" fill="#b85450">→1</text>

  <!-- 满足节点虚线圈 -->
  <ellipse cx="180" cy="200" rx="44" ry="58" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- 说明框 -->
  <rect x="40" y="285" width="480" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="309" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">判定规则（后序传递子树和）</text>
  <text x="60" y="331" font-size="11" fill="#555">dfs(node) 返回以 node 为根的子树所有节点值之和 = node.val + l + r</text>
  <text x="60" y="351" font-size="11" fill="#555">descendants_sum = l + r（左/右子树返回值之和 = 全部后代之和）</text>
  <text x="60" y="371" font-size="11" fill="#4a7a3a">绿色 ✓：node.val == l + r（节点 3 与 根 10）；红色 ✗：叶子的后代和为 0，val≠0 不计</text>
</svg>
