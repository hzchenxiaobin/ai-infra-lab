<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="760" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="380" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：五位成员的访问 / 购买 / 转化率 / 级别</text>

  <!-- ===== Column headers ===== -->
  <rect x="20" y="44" width="720" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50" y="62" font-size="9" fill="#446688" font-weight="bold">mid</text>
  <text x="110" y="62" font-size="9" fill="#446688" font-weight="bold">name</text>
  <text x="210" y="62" font-size="9" fill="#446688" font-weight="bold">visits（visit_id）</text>
  <text x="370" y="62" font-size="9" fill="#446688" font-weight="bold">purchases（vid→amt）</text>
  <text x="520" y="62" font-size="9" fill="#446688" font-weight="bold">COUNT计算</text>
  <text x="630" y="62" font-size="9" fill="#446688" font-weight="bold">rate</text>
  <text x="700" y="62" font-size="9" fill="#446688" font-weight="bold">级别</text>

  <!-- ===== Row 1: Alice (9) - Gold ===== -->
  <rect x="20" y="76" width="720" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="4" filter="url(#rough2)" opacity="0.5"/>
  <text x="50" y="100" font-size="10" fill="#555" font-weight="bold">9</text>
  <text x="110" y="100" font-size="10" fill="#d6a040" font-weight="bold">Alice</text>
  <text x="210" y="94" font-size="8" fill="#555">vid=18 (12-10)</text>
  <text x="210" y="108" font-size="8" fill="#555">vid=21 (05-12)</text>
  <text x="370" y="94" font-size="8" fill="#555">vid=18 → 9000 ✓</text>
  <text x="370" y="108" font-size="8" fill="#999">vid=21 → NULL</text>
  <text x="520" y="94" font-size="8" fill="#555">COUNT(vid) = 2</text>
  <text x="520" y="108" font-size="8" fill="#555">COUNT(amt) = 1</text>
  <text x="630" y="100" font-size="10" fill="#d6a040" font-weight="bold">50</text>
  <rect x="694" y="84" width="42" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="715" y="98" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">Gold</text>
  <text x="630" y="120" font-size="7" fill="#888">100×1/2=50</text>

  <!-- ===== Row 2: Bob (11) - Silver ===== -->
  <rect x="20" y="136" width="720" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="4" filter="url(#rough2)" opacity="0.45"/>
  <text x="50" y="160" font-size="10" fill="#555" font-weight="bold">11</text>
  <text x="110" y="160" font-size="10" fill="#4a7a3a" font-weight="bold">Bob</text>
  <text x="210" y="154" font-size="8" fill="#555">vid=22, 16, 12</text>
  <text x="210" y="168" font-size="8" fill="#999">(3 次访问)</text>
  <text x="370" y="154" font-size="8" fill="#555">vid=12 → 2000 ✓</text>
  <text x="370" y="168" font-size="8" fill="#999">vid=22/16 → NULL</text>
  <text x="520" y="154" font-size="8" fill="#555">COUNT(vid) = 3</text>
  <text x="520" y="168" font-size="8" fill="#555">COUNT(amt) = 1</text>
  <text x="630" y="160" font-size="10" fill="#4a7a3a" font-weight="bold">33.3</text>
  <rect x="692" y="144" width="46" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="715" y="158" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">Silver</text>
  <text x="630" y="180" font-size="7" fill="#888">100×1/3≈33</text>

  <!-- ===== Row 3: Winston (3) - Silver ===== -->
  <rect x="20" y="196" width="720" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="4" filter="url(#rough2)" opacity="0.45"/>
  <text x="50" y="222" font-size="10" fill="#555" font-weight="bold">3</text>
  <text x="110" y="222" font-size="10" fill="#4a7a3a" font-weight="bold">Winston</text>
  <text x="210" y="216" font-size="8" fill="#555">vid=19 (10-19)</text>
  <text x="210" y="232" font-size="8" fill="#999">(1 次访问)</text>
  <text x="370" y="216" font-size="8" fill="#999">vid=19 → NULL</text>
  <text x="370" y="232" font-size="8" fill="#999">(无购买)</text>
  <text x="520" y="216" font-size="8" fill="#555">COUNT(vid) = 1</text>
  <text x="520" y="232" font-size="8" fill="#555">COUNT(amt) = 0</text>
  <text x="630" y="222" font-size="10" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="692" y="210" width="46" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="715" y="224" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">Silver</text>
  <text x="630" y="238" font-size="7" fill="#888">100×0/1=0</text>

  <!-- ===== Row 4: Hercy (8) - Diamond ===== -->
  <rect x="20" y="248" width="720" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="4" filter="url(#rough2)" opacity="0.5"/>
  <text x="50" y="274" font-size="10" fill="#555" font-weight="bold">8</text>
  <text x="110" y="274" font-size="10" fill="#b85450" font-weight="bold">Hercy</text>
  <text x="210" y="268" font-size="8" fill="#555">vid=17 (05-07)</text>
  <text x="210" y="284" font-size="8" fill="#999">(1 次访问)</text>
  <text x="370" y="268" font-size="8" fill="#555">vid=17 → 7000 ✓</text>
  <text x="370" y="284" font-size="8" fill="#555">(有购买)</text>
  <text x="520" y="268" font-size="8" fill="#555">COUNT(vid) = 1</text>
  <text x="520" y="284" font-size="8" fill="#555">COUNT(amt) = 1</text>
  <text x="630" y="274" font-size="10" fill="#b85450" font-weight="bold">100</text>
  <rect x="688" y="262" width="54" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="715" y="276" text-anchor="middle" font-size="7" fill="#b85450" font-weight="bold">Diamond</text>
  <text x="630" y="290" font-size="7" fill="#888">100×1/1=100</text>

  <!-- ===== Row 5: Narihan (1) - Bronze ===== -->
  <rect x="20" y="300" width="720" height="48" fill="#f3e5e5" stroke="#999" stroke-width="0.8" rx="4" filter="url(#rough2)" opacity="0.5"/>
  <text x="50" y="326" font-size="10" fill="#555" font-weight="bold">1</text>
  <text x="110" y="326" font-size="10" fill="#999" font-weight="bold">Narihan</text>
  <text x="210" y="320" font-size="8" fill="#999">— 无访问记录 —</text>
  <text x="210" y="336" font-size="8" fill="#999">(Visits 表无匹配)</text>
  <text x="370" y="320" font-size="8" fill="#999">— 无购买 —</text>
  <text x="370" y="336" font-size="8" fill="#999">(vid=NULL, amt=NULL)</text>
  <text x="520" y="320" font-size="8" fill="#999">COUNT(vid) = 0</text>
  <text x="520" y="336" font-size="8" fill="#999">COUNT(amt) = 0</text>
  <text x="630" y="326" font-size="10" fill="#999" font-weight="bold">N/A</text>
  <rect x="692" y="314" width="46" height="20" fill="#f3e5e5" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="715" y="328" text-anchor="middle" font-size="8" fill="#999" font-weight="bold">Bronze</text>
  <text x="630" y="342" font-size="7" fill="#b85450">先判=0 防除零</text>

  <!-- ===== Decision logic summary ===== -->
  <rect x="20" y="360" width="720" height="62" fill="#fff" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="34" y="378" font-size="9" fill="#555" font-weight="bold">CASE WHEN 分级逻辑（顺序短路）：</text>
  <text x="34" y="394" font-size="8" fill="#999">WHEN COUNT(vid)=0 → Bronze</text>
  <text x="190" y="394" font-size="8" fill="#b85450">WHEN rate≥80 → Diamond</text>
  <text x="330" y="394" font-size="8" fill="#d6a040">WHEN rate≥50 → Gold</text>
  <text x="450" y="394" font-size="8" fill="#4a7a3a">ELSE → Silver</text>
  <text x="34" y="410" font-size="8" fill="#888">rate = 100 × COUNT(charged_amount) / COUNT(visit_id)</text>
  <text x="34" y="420" font-size="8" fill="#888">COUNT(列) 只计非 NULL 值 → LEFT JOIN 后用 NULL 区分"有/无购买"</text>

  <!-- ===== Bottom note ===== -->
  <rect x="20" y="430" width="720" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="380" y="448" text-anchor="middle" font-size="10" fill="#d6a040">⚠ Bronze 必须第一个判（COUNT(vid)=0 时除法会除零）；charged_amount 数值是干扰项，只看 NULL 与否</text>
  <text x="380" y="462" text-anchor="middle" font-size="9" fill="#d6a040">rate=50 属于 Gold（≥50 且 &lt;80）；rate=100 属于 Diamond（≥80）</text>
</svg>
