<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：先扫数位求 s，再一次取模判定</text>

  <!-- start -->
  <rect x="180" y="42" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">输入 x（1 ≤ x ≤ 100）</text>

  <path d="M 260 76 L 260 98" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="196" y="102" width="128" height="32" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="123" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">s = 0，t = x</text>

  <path d="M 260 134 L 260 158" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond: t > 0 ? -->
  <polygon points="260,162 336,200 260,238 184,200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="196" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">t &gt; 0 ?</text>
  <text x="260" y="212" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">还有数位没吃</text>

  <!-- yes: consume digit -->
  <path d="M 336 200 L 392 200" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="364" y="192" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="396" y="178" width="108" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="450" y="196" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">s += t mod 10</text>
  <text x="450" y="213" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">t = t ÷ 10</text>

  <!-- loop back -->
  <path d="M 450 178 L 450 118 L 328 118" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="458" y="150" font-size="9.5" fill="#888" filter="url(#rough2)">吃掉一位</text>

  <!-- no: go down -->
  <path d="M 260 238 L 260 266" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="270" y="256" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否（x 归零）</text>

  <!-- diamond: x % s == 0 ? -->
  <polygon points="260,270 348,310 260,350 172,310" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="306" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">x mod s == 0 ?</text>
  <text x="260" y="323" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">整除判定</text>

  <!-- yes: return s -->
  <path d="M 348 310 L 404 310" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="376" y="302" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="408" y="292" width="94" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="455" y="315" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return s</text>

  <!-- no: return -1 -->
  <path d="M 172 310 L 116 310" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="144" y="302" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="18" y="292" width="94" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="65" y="315" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">return −1</text>

  <!-- note -->
  <rect x="48" y="364" width="424" height="26" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="381" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">x ≥ 1 保证 s ≥ 1，取模不会除零；t 是 x 的副本，x 本身留到判定用</text>
</svg>
