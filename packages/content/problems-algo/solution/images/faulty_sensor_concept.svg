<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：掉落点 = 首个失配位置，末位随机不可比</text>

  <!-- Row 1: 正确数据 (true) -->
  <text x="50" y="74" font-size="11" fill="#4a7a3a" font-weight="bold">正确数据</text>
  <rect x="110" y="56" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="138" y="79" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="170" y="56" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="198" y="79" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <!-- dropped value 3 (red, highlighted) -->
  <rect x="230" y="52" width="60" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="260" y="79" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">3</text>
  <text x="260" y="46" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">掉落值</text>
  <rect x="294" y="56" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="322" y="79" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="354" y="56" width="56" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="382" y="79" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>

  <!-- index labels for true -->
  <text x="138" y="104" text-anchor="middle" font-size="9" fill="#888">i=0</text>
  <text x="198" y="104" text-anchor="middle" font-size="9" fill="#888">i=1</text>
  <text x="260" y="104" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">i=2</text>
  <text x="322" y="104" text-anchor="middle" font-size="9" fill="#888">i=3</text>
  <text x="382" y="104" text-anchor="middle" font-size="9" fill="#888">i=4</text>

  <!-- Arrow: drop 3, shift left -->
  <path d="M 260 112 L 260 138" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="300" y="132" font-size="10" fill="#b85450" font-weight="bold">丢弃 3，右侧左移</text>

  <!-- Row 2: 缺陷传感器输出 (defective output) -->
  <text x="50" y="170" font-size="11" fill="#446688" font-weight="bold">缺陷输出</text>
  <rect x="110" y="152" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="138" y="175" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="170" y="152" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="198" y="175" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="230" y="152" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="258" y="175" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="290" y="152" width="56" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="318" y="175" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <!-- last: random value 7 (orange, dashed) -->
  <rect x="350" y="148" width="60" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="380" y="175" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">7</text>
  <text x="380" y="142" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">随机值</text>

  <!-- index labels for defective -->
  <text x="138" y="200" text-anchor="middle" font-size="9" fill="#888">i=0</text>
  <text x="198" y="200" text-anchor="middle" font-size="9" fill="#888">i=1</text>
  <text x="258" y="200" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">i=2</text>
  <text x="318" y="200" text-anchor="middle" font-size="9" fill="#888">i=3</text>
  <text x="380" y="200" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">i=4</text>

  <!-- shift-left arrows: from true positions to defective positions -->
  <!-- 4 moves from i=3 to i=2 -->
  <path d="M 322 110 Q 300 130 268 148" stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- 5 moves from i=4 to i=3 -->
  <path d="M 382 110 Q 360 130 328 148" stroke="#888" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- vertical cut line at i=2 (mismatch point) -->
  <path d="M 258 210 L 258 250" stroke="#b85450" stroke-width="2" stroke-dasharray="6,4" fill="none" filter="url(#rough2)"/>
  <text x="258" y="244" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">首个失配点</text>

  <!-- Key idea box -->
  <rect x="40" y="262" width="520" height="124" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="288" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">关键直觉：「左移一位」是缺陷的唯一痕迹</text>
  <text x="60" y="312" font-size="11" fill="#666">• 掉落点 = 首个 sensor1[i] ≠ sensor2[i] 的位置（前段全等，从 i 起才错位）</text>
  <text x="60" y="332" font-size="11" fill="#666">• sensor1 缺陷 ⇔ sensor1[i..n-2] == sensor2[i+1..n-1]（左移一位）</text>
  <text x="60" y="352" font-size="11" fill="#666">• sensor2 缺陷 ⇔ sensor2[i..n-2] == sensor1[i+1..n-1]（左移一位）</text>
  <text x="60" y="372" font-size="11" fill="#b85450" font-weight="bold">• 末位是随机值，不可比较：定位与验证都只看下标 0 ~ n-2</text>
</svg>
