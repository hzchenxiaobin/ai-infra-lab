<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：最优窗口必「贴边」——左端贴某个 l，或右端贴某个 r</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">示例 1（k = 4）：区间 [1,3] 每袋 2 枚、[5,6] 每袋 4 枚、[8,10] 每袋 1 枚</text>

  <!-- Top row: per-bag coins -->
  <text x="20" y="76" font-size="11.5" fill="#333" filter="url(#rough2)">每袋硬币：</text>

  <rect x="100" y="58" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="117" y="77" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="134" y="58" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="151" y="77" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="168" y="58" width="34" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185" y="77" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="202" y="58" width="34" height="30" rx="4" fill="#f3f3f3" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="219" y="77" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>
  <rect x="236" y="58" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="253" y="77" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="270" y="58" width="34" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="287" y="77" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="304" y="58" width="34" height="30" rx="4" fill="#f3f3f3" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="321" y="77" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">0</text>
  <rect x="338" y="58" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="355" y="77" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="372" y="58" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="389" y="77" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="406" y="58" width="34" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="423" y="77" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <text x="117" y="102" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">1</text>
  <text x="151" y="102" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">2</text>
  <text x="185" y="102" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">3</text>
  <text x="219" y="102" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">4</text>
  <text x="253" y="102" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">5</text>
  <text x="287" y="102" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">6</text>
  <text x="321" y="102" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">7</text>
  <text x="355" y="102" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">8</text>
  <text x="389" y="102" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">9</text>
  <text x="423" y="102" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">10</text>

  <!-- Candidate 1: window anchored at l=5 -->
  <text x="20" y="130" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">① 左端对齐 l = 5：窗口 [5, 8]</text>
  <text x="236" y="131" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">l=5</text>
  <path d="M 236 133 L 236 139" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <rect x="100" y="142" width="34" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="117" y="160" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="134" y="142" width="34" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="151" y="160" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="168" y="142" width="34" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="185" y="160" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="202" y="142" width="34" height="28" rx="4" fill="#f3f3f3" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="219" y="160" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <rect x="236" y="142" width="34" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="253" y="160" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="270" y="142" width="34" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="287" y="160" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="304" y="142" width="34" height="28" rx="4" fill="#f3f3f3" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="321" y="160" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <rect x="338" y="142" width="34" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="355" y="160" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="372" y="142" width="34" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="389" y="160" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="406" y="142" width="34" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="423" y="160" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <rect x="232" y="138" width="144" height="36" rx="6" fill="none" stroke="#b85450" stroke-width="2.5" stroke-dasharray="7 4" filter="url(#rough2)"/>

  <path d="M 236 184 L 236 188 L 270 188 L 270 184" fill="none" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="253" y="200" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">整段 8</text>
  <path d="M 338 184 L 338 188 L 372 188 L 372 184" fill="none" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="355" y="200" text-anchor="middle" font-size="9.5" fill="#d6a040" filter="url(#rough2)">零头 1</text>

  <text x="20" y="220" font-size="11.5" fill="#333" filter="url(#rough2)">窗口合计 = 8 + 1 = 9（右缘切进区间 [8,10]，只吃到袋 8）</text>

  <!-- Candidate 2: window anchored at r=6 -->
  <text x="20" y="246" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">② 右端对齐 r = 6：窗口 [3, 6]</text>
  <text x="306" y="247" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">r=6</text>
  <path d="M 306 249 L 306 255" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <rect x="100" y="258" width="34" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="117" y="276" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="134" y="258" width="34" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="151" y="276" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="168" y="258" width="34" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="185" y="276" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="202" y="258" width="34" height="28" rx="4" fill="#f3f3f3" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="219" y="276" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <rect x="236" y="258" width="34" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="253" y="276" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="270" y="258" width="34" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="287" y="276" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="304" y="258" width="34" height="28" rx="4" fill="#f3f3f3" stroke="#999999" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="321" y="276" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <rect x="338" y="258" width="34" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="355" y="276" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="372" y="258" width="34" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="389" y="276" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="406" y="258" width="34" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="423" y="276" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <rect x="164" y="254" width="144" height="36" rx="6" fill="none" stroke="#b85450" stroke-width="2.5" stroke-dasharray="7 4" filter="url(#rough2)"/>

  <path d="M 168 300 L 168 304 L 202 304 L 202 300" fill="none" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="185" y="316" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">零头 2</text>
  <path d="M 236 300 L 236 304 L 270 304 L 270 300" fill="none" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="253" y="316" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">整段 8</text>

  <text x="20" y="336" font-size="11.5" fill="#333" filter="url(#rough2)">窗口合计 = 2 + 8 = 10 ✓ 全局最优（左缘切进区间 [1,3]，只吃到袋 3）</text>

  <!-- Bottom note -->
  <rect x="20" y="352" width="480" height="64" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="372" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">把任意最优窗口沿数轴滑动：硬币总数是分段线性的，</text>
  <text x="260" y="390" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">变化率只在窗口边缘跨过某个 l 或 r 时改变——</text>
  <text x="260" y="408" text-anchor="middle" font-size="10.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">最优解必在「贴边」位置取到，故只需枚举这 2n 个锚点</text>
</svg>
