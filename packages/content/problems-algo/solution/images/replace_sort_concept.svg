<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：从右向左贪心，上限 v 逐位左传；nums[i] &gt; v 时均匀切成 k 段</text>

  <!-- ============ 情形 ① nums[i] <= v ============ -->
  <text x="30" y="66" font-size="12.5" fill="#4a7a3a" font-weight="bold">情形 ① nums[i] ≤ v：无需切分</text>

  <!-- 上限 v 来自右邻（绿色箭头指向 nums[i] 右侧） -->
  <rect x="430" y="82" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="460" y="102" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">上限 v</text>
  <path d="M 430 97 L 340 97" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="385" y="89" text-anchor="middle" font-size="10.5" fill="#888">来自右邻</text>

  <!-- nums[i] cell -->
  <rect x="268" y="80" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="300" y="102" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">nums[i]</text>

  <!-- 左传箭头：新 v = nums[i] -->
  <path d="M 268 97 L 170 97" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="219" y="89" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">新 v = nums[i]</text>
  <text x="219" y="118" text-anchor="middle" font-size="10.5" fill="#4a7a3a">ops += 0</text>

  <text x="110" y="100" font-size="11" fill="#888">→ 左邻</text>

  <!-- divider -->
  <line x1="30" y1="140" x2="570" y2="140" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- ============ 情形 ② nums[i] > v ============ -->
  <text x="30" y="166" font-size="12.5" fill="#b85450" font-weight="bold">情形 ② nums[i] &gt; v：必须切分</text>

  <!-- 上限 v 来自右邻 -->
  <rect x="430" y="186" width="60" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="460" y="206" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">上限 v</text>
  <path d="M 430 201 L 340 201" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- nums[i] cell (red, emphasized) -->
  <rect x="268" y="184" width="64" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="300" y="206" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">nums[i]</text>

  <!-- 向下切分箭头 -->
  <path d="M 300 218 L 300 240" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="312" y="232" font-size="10.5" fill="#b85450">切 k 段</text>
  <text x="312" y="246" font-size="10.5" fill="#888">k = ⌈nums[i]/v⌉</text>

  <!-- k 段：均匀分布，最左段高亮为新 v -->
  <!-- 总宽 3*56=168，中心 300 → 起点 216 -->
  <rect x="216" y="248" width="56" height="30" fill="#fff8e1" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="244" y="268" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">⌊n/k⌋</text>
  <rect x="272" y="248" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="300" y="268" text-anchor="middle" font-size="12" fill="#888">…</text>
  <rect x="328" y="248" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="356" y="268" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">⌈n/k⌉</text>

  <!-- 左传箭头：新 v = ⌊n/k⌋ -->
  <path d="M 216 263 L 110 263" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="163" y="255" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">新 v = ⌊n/k⌋</text>
  <text x="163" y="284" text-anchor="middle" font-size="10.5" fill="#b85450">ops += k−1</text>

  <!-- 右侧说明 -->
  <text x="400" y="262" font-size="10.5" fill="#555">每段 ≤ v</text>
  <text x="400" y="278" font-size="10.5" fill="#555">最左段最小</text>
  <text x="400" y="294" font-size="10.5" fill="#4a7a3a">→ 左邻上限尽量高</text>

  <text x="55" y="266" font-size="11" fill="#888">→ 左邻</text>

  <!-- divider -->
  <line x1="30" y1="312" x2="570" y2="312" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- ============ 关键公式框 ============ -->
  <rect x="30" y="328" width="540" height="76" fill="#fff" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="350" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">关键公式</text>
  <text x="60" y="372" font-size="12.5" fill="#333">切分段数</text>
  <text x="160" y="372" font-size="13.5" fill="#446688" font-weight="bold">k = ⌈ nums[i] / v ⌉</text>
  <text x="320" y="372" font-size="12.5" fill="#333">本步操作</text>
  <text x="420" y="372" font-size="13.5" fill="#b85450" font-weight="bold">ops += k − 1</text>
  <text x="60" y="394" font-size="12.5" fill="#333">左传上限</text>
  <text x="160" y="394" font-size="13.5" fill="#4a7a3a" font-weight="bold">v = ⌊ nums[i] / k ⌋</text>
  <text x="320" y="394" font-size="10.5" fill="#999">均匀切分最大化最左段，把好处留给左邻</text>
</svg>
