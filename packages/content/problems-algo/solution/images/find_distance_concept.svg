<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：p→q 的路径必过 LCA，距离 = dist(LCA,p) + dist(LCA,q)</text>

  <!-- Tree -->
  <!-- root 3 (LCA) -->
  <circle cx="270" cy="70" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="270" y="75" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="270" y="46" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">LCA</text>

  <!-- 5 (p) -->
  <circle cx="190" cy="135" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="190" y="140" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <text x="168" y="125" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">p</text>
  <!-- edge 3-5 (path edge, red) -->
  <line x1="256" y1="84" x2="204" y2="121" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>

  <!-- 1 -->
  <circle cx="350" cy="135" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350" y="140" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <!-- edge 3-1 (path edge, red) -->
  <line x1="284" y1="84" x2="336" y2="121" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>

  <!-- 6 -->
  <circle cx="140" cy="210" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="214" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>
  <line x1="178" y1="149" x2="152" y2="196" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 2 -->
  <circle cx="240" cy="210" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240" y="214" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <line x1="202" y1="149" x2="228" y2="196" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 0 (q) -->
  <circle cx="320" cy="210" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="320" y="214" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="320" y="232" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">q</text>
  <!-- edge 1-0 (path edge, red) -->
  <line x1="346" y1="151" x2="326" y2="196" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>

  <!-- 8 -->
  <circle cx="390" cy="210" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="390" y="214" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">8</text>
  <line x1="362" y1="151" x2="382" y2="196" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 7 -->
  <circle cx="210" cy="280" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="210" y="284" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>
  <line x1="230" y1="224" x2="216" y2="266" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 4 -->
  <circle cx="280" cy="280" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <line x1="252" y1="224" x2="272" y2="266" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- Path edge labels -->
  <text x="220" y="100" font-size="10" fill="#b85450" font-weight="bold">边1</text>
  <text x="320" y="100" font-size="10" fill="#b85450" font-weight="bold">边2</text>
  <text x="345" y="178" font-size="10" fill="#b85450" font-weight="bold">边3</text>

  <!-- Formula box (right) -->
  <rect x="400" y="270" width="165" height="130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="482" y="292" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">路径拆分公式</text>
  <text x="412" y="312" font-size="10" fill="#555">dist(p, q)</text>
  <text x="412" y="328" font-size="10" fill="#555">= dist(LCA, p) + dist(LCA, q)</text>
  <text x="412" y="350" font-size="10" fill="#555">= 1 + 2</text>
  <text x="412" y="370" font-size="12" fill="#b85450" font-weight="bold">= 3 ✓</text>
  <text x="412" y="390" font-size="9" fill="#888">p↔LCA 1 边 + LCA↔q 2 边</text>

  <!-- Bottom note -->
  <text x="200" y="400" text-anchor="middle" font-size="11" fill="#888">红边为 p→q 路径，共 3 条边；路径在 LCA=3 处"折返"</text>
</svg>
