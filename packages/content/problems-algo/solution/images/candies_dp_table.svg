<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">DP 表：S(n, k) 递推值（行=糖果 n，列=手袋 k）</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">格子 = k·正上方 + 左上方；对角线全 1，k=0 列除 n=0 外全 0</text>

  <!-- 列标签 k=0..5 -->
  <g font-size="12" fill="#b85450" font-weight="bold">
    <text x="100" y="88" text-anchor="middle">k=0</text>
    <text x="160" y="88" text-anchor="middle">k=1</text>
    <text x="220" y="88" text-anchor="middle">k=2</text>
    <text x="280" y="88" text-anchor="middle">k=3</text>
    <text x="340" y="88" text-anchor="middle">k=4</text>
    <text x="400" y="88" text-anchor="middle">k=5</text>
  </g>

  <!-- n=0 行 -->
  <text x="62" y="118" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">n=0</text>
  <rect x="74" y="100" width="52" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="100" y="119" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <g font-size="12" fill="#999">
    <rect x="134" y="100" width="52" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="160" y="119" text-anchor="middle">0</text>
    <rect x="194" y="100" width="52" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="220" y="119" text-anchor="middle">0</text>
    <rect x="254" y="100" width="52" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="280" y="119" text-anchor="middle">0</text>
    <rect x="314" y="100" width="52" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="340" y="119" text-anchor="middle">0</text>
    <rect x="374" y="100" width="52" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="400" y="119" text-anchor="middle">0</text>
  </g>

  <!-- n=1 行 -->
  <text x="62" y="158" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">n=1</text>
  <rect x="74" y="140" width="52" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="100" y="159" text-anchor="middle" font-size="12" fill="#999">0</text>
  <rect x="134" y="140" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="160" y="159" text-anchor="middle" font-size="12" fill="#333">1</text>
  <g font-size="12" fill="#999">
    <rect x="194" y="140" width="52" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="220" y="159" text-anchor="middle">0</text>
    <rect x="254" y="140" width="52" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="280" y="159" text-anchor="middle">0</text>
    <rect x="314" y="140" width="52" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="340" y="159" text-anchor="middle">0</text>
    <rect x="374" y="140" width="52" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="400" y="159" text-anchor="middle">0</text>
  </g>

  <!-- n=2 行 -->
  <text x="62" y="198" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">n=2</text>
  <rect x="74" y="180" width="52" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="100" y="199" text-anchor="middle" font-size="12" fill="#999">0</text>
  <rect x="134" y="180" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="160" y="199" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="194" y="180" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="220" y="199" text-anchor="middle" font-size="12" fill="#333">1</text>
  <g font-size="12" fill="#999">
    <rect x="254" y="180" width="52" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="280" y="199" text-anchor="middle">0</text>
    <rect x="314" y="180" width="52" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="340" y="199" text-anchor="middle">0</text>
    <rect x="374" y="180" width="52" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="400" y="199" text-anchor="middle">0</text>
  </g>

  <!-- n=3 行（高亮 k=2 这一格的来源） -->
  <text x="62" y="238" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">n=3</text>
  <rect x="74" y="220" width="52" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="100" y="239" text-anchor="middle" font-size="12" fill="#999">0</text>
  <rect x="134" y="220" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="160" y="239" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="194" y="220" width="52" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="239" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">3</text>
  <rect x="254" y="220" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="280" y="239" text-anchor="middle" font-size="12" fill="#333">1</text>
  <g font-size="12" fill="#999">
    <rect x="314" y="220" width="52" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="340" y="239" text-anchor="middle">0</text>
    <rect x="374" y="220" width="52" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="400" y="239" text-anchor="middle">0</text>
  </g>

  <!-- n=4 行（答案行） -->
  <text x="62" y="278" text-anchor="end" font-size="12" fill="#b85450" font-weight="bold">n=4</text>
  <rect x="74" y="260" width="52" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="100" y="279" text-anchor="middle" font-size="12" fill="#999">0</text>
  <rect x="134" y="260" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="160" y="279" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="194" y="260" width="52" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="220" y="279" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">7</text>
  <rect x="254" y="260" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="280" y="279" text-anchor="middle" font-size="12" fill="#333">6</text>
  <rect x="314" y="260" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="340" y="279" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="374" y="260" width="52" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="400" y="279" text-anchor="middle" font-size="12" fill="#999">0</text>

  <!-- n=5 行 -->
  <text x="62" y="318" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">n=5</text>
  <rect x="74" y="300" width="52" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="100" y="319" text-anchor="middle" font-size="12" fill="#999">0</text>
  <rect x="134" y="300" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="160" y="319" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="194" y="300" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="220" y="319" text-anchor="middle" font-size="12" fill="#333">15</text>
  <rect x="254" y="300" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="280" y="319" text-anchor="middle" font-size="12" fill="#333">25</text>
  <rect x="314" y="300" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="340" y="319" text-anchor="middle" font-size="12" fill="#333">10</text>
  <rect x="374" y="300" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="400" y="319" text-anchor="middle" font-size="12" fill="#333">1</text>

  <!-- 递推箭头：S(4,2) 来自 S(3,2) 和 S(3,1) -->
  <!-- 正上方 S(3,2) → S(4,2) ：绿色 -->
  <path d="M 220 248 L 220 256" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="236" y="254" font-size="10" fill="#4a7a3a" font-weight="bold">×k=2</text>
  <!-- 左上方 S(3,1) → S(4,2) ：橙色 -->
  <path d="M 170 248 Q 195 256 196 260" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>
  <text x="150" y="258" font-size="10" fill="#d6a040" font-weight="bold">+1</text>

  <!-- 公式框 -->
  <rect x="90" y="348" width="380" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="372" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">递推式：S(n,k) = k·S(n−1,k) + S(n−1,k−1)</text>
  <text x="280" y="392" text-anchor="middle" font-size="11" fill="#555">验算 S(4,2) = 2×S(3,2) + S(3,1) = 2×3 + 1 = 7 ✓</text>
</svg>
