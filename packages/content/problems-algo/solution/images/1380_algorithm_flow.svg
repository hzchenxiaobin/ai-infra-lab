<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：预计算行最小 / 列最大 → 一遍扫描判定</text>

  <!-- Step 1: compute minRow -->
  <rect x="60" y="56" width="440" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="84" y="80" font-size="12" fill="#4a7a3a" font-weight="bold">① 预计算 minRow[i]</text>
  <text x="84" y="100" font-size="11" fill="#666">遍历每行取最小值，存入长度 m 的数组 minRow</text>
  <text x="430" y="92" font-size="10" fill="#888">O(m·n)</text>

  <path d="M 280 116 L 280 130" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 2: compute maxCol -->
  <rect x="60" y="132" width="440" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="84" y="156" font-size="12" fill="#d6a040" font-weight="bold">② 预计算 maxCol[j]</text>
  <text x="84" y="176" font-size="11" fill="#666">遍历每列取最大值，存入长度 n 的数组 maxCol</text>
  <text x="430" y="168" font-size="10" fill="#888">O(m·n)</text>

  <path d="M 280 192 L 280 206" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 3: scan and decide (diamond) -->
  <polygon points="280,210 440,270 280,330 120,270" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="262" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">遍历每个 (i,j)</text>
  <text x="280" y="280" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">matrix[i][j] == minRow[i]</text>
  <text x="280" y="296" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">且 == maxCol[j] ?</text>

  <!-- Yes branch -->
  <path d="M 440 270 L 470 270 L 470 350" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="452" y="262" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="410" y="350" width="120" height="46" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="470" y="372" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">收入 ans</text>
  <text x="470" y="388" text-anchor="middle" font-size="10" fill="#888">幸运数</text>

  <!-- No branch -->
  <path d="M 120 270 L 90 270 L 90 350" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="96" y="262" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="30" y="350" width="120" height="46" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="90" y="372" text-anchor="middle" font-size="11" fill="#777" font-weight="bold">跳过</text>
  <text x="90" y="388" text-anchor="middle" font-size="10" fill="#999">继续下一格</text>

  <!-- return -->
  <path d="M 470 396 L 470 410 L 280 410" stroke="#666" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 280 350 L 280 410" stroke="#666" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <rect x="220" y="410" width="160" height="22" rx="6" fill="#fafafa" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300" y="426" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">返回 ans</text>
</svg>
