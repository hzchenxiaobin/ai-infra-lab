<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">核心思路：log_id − ROW_NUMBER() = 岛屿标识（Gaps &amp; Islands）</text>

  <text x="40" y="54" font-size="11" fill="#446688" font-weight="bold">Logs.log_id 出现的整数（铺成 1~10 数轴，虚框=缺失）</text>

  <!-- 10 boxes width 50 gap 8 -->
  <!-- 1,2,3 green (island 1) -->
  <g filter="url(#rough2)">
    <rect x="40" y="70" width="50" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <text x="65" y="96" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <g filter="url(#rough2)">
    <rect x="98" y="70" width="50" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <text x="123" y="96" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>

  <g filter="url(#rough2)">
    <rect x="156" y="70" width="50" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <text x="181" y="96" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>

  <!-- 4,5,6 missing dashed -->
  <g filter="url(#rough2)">
    <rect x="214" y="70" width="50" height="40" fill="#fafafa" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" rx="4"/>
  </g>
  <text x="239" y="96" text-anchor="middle" font-size="12" fill="#bbb">4</text>

  <g filter="url(#rough2)">
    <rect x="272" y="70" width="50" height="40" fill="#fafafa" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" rx="4"/>
  </g>
  <text x="297" y="96" text-anchor="middle" font-size="12" fill="#bbb">5</text>

  <g filter="url(#rough2)">
    <rect x="330" y="70" width="50" height="40" fill="#fafafa" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" rx="4"/>
  </g>
  <text x="355" y="96" text-anchor="middle" font-size="12" fill="#bbb">6</text>

  <!-- 7,8 orange (island 2) -->
  <g filter="url(#rough2)">
    <rect x="388" y="70" width="50" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
  </g>
  <text x="413" y="96" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">7</text>

  <g filter="url(#rough2)">
    <rect x="446" y="70" width="50" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
  </g>
  <text x="471" y="96" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">8</text>

  <!-- 9 missing -->
  <g filter="url(#rough2)">
    <rect x="504" y="70" width="50" height="40" fill="#fafafa" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" rx="4"/>
  </g>
  <text x="529" y="96" text-anchor="middle" font-size="12" fill="#bbb">9</text>

  <!-- 10 red (island 3) -->
  <g filter="url(#rough2)">
    <rect x="562" y="70" width="50" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
  </g>
  <text x="587" y="96" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">10</text>

  <!-- gap labels above missing -->
  <text x="297" y="64" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">↑ 缺 4-6</text>
  <text x="529" y="64" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">↑ 缺 9</text>

  <!-- island brackets below -->
  <path d="M 40 116 L 40 126 L 206 126 L 206 116" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="123" y="141" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">岛屿 1：[1, 3]</text>

  <path d="M 388 116 L 388 126 L 496 126 L 496 116" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="442" y="141" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">岛屿 2：[7, 8]</text>

  <path d="M 562 116 L 562 126 L 612 126 L 612 116" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="587" y="141" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">岛屿 3：[10,10]</text>

  <!-- formula box -->
  <rect x="40" y="158" width="540" height="150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="310" y="182" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">关键公式：grp = log_id − ROW_NUMBER() OVER (ORDER BY log_id)</text>

  <text x="58" y="206" font-size="10.5" fill="#555">• 连续整数：log_id 与 rn 同步 +1 → grp 不变 → 归为同一岛屿</text>
  <text x="58" y="224" font-size="10.5" fill="#555">  （1,2,3 的 grp 都是 0；7,8 的 grp 都是 3）</text>
  <text x="58" y="246" font-size="10.5" fill="#555">• 出现断点：log_id 跳跃但 rn 只 +1 → grp 改变 → 开启新岛屿</text>
  <text x="58" y="264" font-size="10.5" fill="#555">  （3→7 跳过 4,5,6，grp 从 0 变 3；8→10 跳过 9，grp 从 3 变 4）</text>
  <text x="58" y="286" font-size="10.5" fill="#555">• 最后 GROUP BY grp 取 MIN/MAX → 每段得 [start_id, end_id]</text>

  <!-- summary -->
  <rect x="40" y="318" width="540" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="310" y="342" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">Gaps &amp; Islands：用「整数 − 行号」把连续整数归为同一组，断点处自然分裂</text>
</svg>
