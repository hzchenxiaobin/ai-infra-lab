<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">方法链：筛行 → 排序 → 投影，一条链一气呵成</text>

  <!-- Left: animals table -->
  <rect x="22" y="56" width="128" height="162" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="86" y="74" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">animals</text>

  <rect x="28" y="80" width="68" height="18" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="96" y="80" width="48" height="18" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="62" y="93" text-anchor="middle" font-size="9" fill="#ffffff" filter="url(#rough2)">name</text>
  <text x="120" y="93" text-anchor="middle" font-size="9" fill="#ffffff" filter="url(#rough2)">weight</text>

  <rect x="28" y="98" width="68" height="18" fill="#e6f4ea" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="96" y="98" width="48" height="18" fill="#e6f4ea" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="62" y="111" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Tatiana</text>
  <text x="120" y="111" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">464</text>

  <rect x="28" y="116" width="68" height="18" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="96" y="116" width="48" height="18" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="62" y="129" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">Khaled</text>
  <text x="120" y="129" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">41</text>

  <rect x="28" y="134" width="68" height="18" fill="#e6f4ea" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="96" y="134" width="48" height="18" fill="#e6f4ea" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="62" y="147" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Alex</text>
  <text x="120" y="147" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">328</text>

  <rect x="28" y="152" width="68" height="18" fill="#e6f4ea" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="96" y="152" width="48" height="18" fill="#e6f4ea" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="62" y="165" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Jonathan</text>
  <text x="120" y="165" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">463</text>

  <rect x="28" y="170" width="68" height="18" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="96" y="170" width="48" height="18" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="62" y="183" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">Stefan</text>
  <text x="120" y="183" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">50</text>

  <rect x="28" y="188" width="68" height="18" fill="#e6f4ea" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="96" y="188" width="48" height="18" fill="#e6f4ea" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="62" y="201" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Tommy</text>
  <text x="120" y="201" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">349</text>

  <text x="86" y="212" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">绿=weight&gt;100 留下</text>

  <!-- Arrow to stage 2 -->
  <path d="M 152 118 L 164 118" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Stage 2: filter -->
  <rect x="166" y="84" width="104" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="218" y="106" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">① 筛行</text>
  <text x="218" y="124" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">weight &gt; 100</text>
  <text x="218" y="140" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">6 行 → 4 行</text>

  <path d="M 272 118 L 284 118" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Stage 3: sort -->
  <rect x="286" y="84" width="116" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="344" y="106" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">② 排序</text>
  <text x="344" y="124" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">sort_values 降序</text>
  <text x="344" y="140" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">ascending=False</text>

  <path d="M 404 118 L 416 118" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Stage 4: project -->
  <rect x="418" y="84" width="112" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="474" y="106" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">③ 投影</text>
  <text x="474" y="124" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">[['name']]</text>
  <text x="474" y="140" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">4 列 → 1 列</text>

  <!-- Arrow down to output -->
  <path d="M 474 154 L 474 166" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Output table -->
  <rect x="418" y="168" width="112" height="118" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <rect x="428" y="182" width="92" height="18" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="474" y="195" text-anchor="middle" font-size="9" fill="#ffffff" filter="url(#rough2)">name</text>

  <rect x="428" y="200" width="92" height="18" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="474" y="213" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Tatiana</text>

  <rect x="428" y="218" width="92" height="18" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="474" y="231" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Jonathan</text>

  <rect x="428" y="236" width="92" height="18" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="474" y="249" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Tommy</text>

  <rect x="428" y="254" width="92" height="18" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="474" y="267" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Alex</text>

  <!-- One-liner code strip -->
  <rect x="22" y="238" width="380" height="48" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="212" y="258" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">animals[animals['weight'] &gt; 100]</text>
  <text x="212" y="274" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">.sort_values('weight', ascending=False)[['name']]</text>

  <text x="212" y="306" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">每一步都返回新 DataFrame —— 链因此成立</text>

  <!-- Bottom warning -->
  <rect x="22" y="322" width="514" height="66" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="279" y="344" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">⚠️ 两个坑</text>
  <text x="279" y="364" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">先投影再排序：weight 列已丢，.sort_values('weight') → KeyError</text>
  <text x="279" y="380" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">inplace=True 返回 None：None.sort_values(...) → AttributeError，链当场断</text>
</svg>
