<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="640" height="410" fill="#fafafa"/>

  <text x="320" y="28" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">示例演算：s = "bac"（→ ans = "abc"）</text>

  <!-- column headers -->
  <g font-size="11" fill="#666" filter="url(#rough2)">
    <text x="24" y="56" text-anchor="middle">步</text>
    <text x="150" y="56" text-anchor="middle">动作 / 判定</text>
    <text x="268" y="56" text-anchor="middle">s 剩余</text>
    <text x="392" y="56" text-anchor="middle">t（右为顶）</text>
    <text x="516" y="56" text-anchor="middle">ans</text>
  </g>
  <!-- header divider -->
  <path d="M16 64 L624 64" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1: init -->
  <text x="24" y="86" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="48" y="86" font-size="11" fill="#666" filter="url(#rough2)">初始</text>
  <g filter="url(#rough2)">
    <rect x="232" y="72" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <rect x="258" y="72" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <rect x="284" y="72" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
  </g>
  <g font-size="13" fill="#333" filter="url(#rough2)">
    <text x="244" y="89" text-anchor="middle">b</text><text x="270" y="89" text-anchor="middle">a</text><text x="296" y="89" text-anchor="middle">c</text>
  </g>
  <text x="392" y="89" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">∅</text>
  <text x="516" y="89" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">∅</text>

  <!-- Row 2: i=0 push b -->
  <text x="24" y="128" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="48" y="128" font-size="11" fill="#446688" filter="url(#rough2)">压 s[0]='b'；'b' &gt; suf[1]='a'，不出栈</text>
  <g filter="url(#rough2)">
    <rect x="258" y="114" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <rect x="284" y="114" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
  </g>
  <g font-size="13" fill="#333" filter="url(#rough2)"><text x="270" y="131" text-anchor="middle">a</text><text x="296" y="131" text-anchor="middle">c</text></g>
  <g filter="url(#rough2)">
    <rect x="380" y="114" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/>
  </g>
  <text x="392" y="131" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <text x="516" y="131" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">∅</text>

  <!-- Row 3: i=1 push a -->
  <text x="24" y="170" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="48" y="170" font-size="11" fill="#446688" filter="url(#rough2)">压 s[1]='a'；'a' ≤ suf[2]='c'，弹出</text>
  <g filter="url(#rough2)"><rect x="284" y="156" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/></g>
  <text x="296" y="173" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <g filter="url(#rough2)">
    <rect x="380" y="156" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <rect x="406" y="156" width="24" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3"/>
  </g>
  <g font-size="13" fill="#333" filter="url(#rough2)"><text x="392" y="173" text-anchor="middle">b</text><text x="418" y="173" text-anchor="middle" font-weight="bold">a</text></g>
  <text x="516" y="173" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">∅</text>

  <!-- Row 4: pop a -->
  <text x="24" y="212" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="48" y="212" font-size="11" fill="#b85450" filter="url(#rough2)">弹栈顶 'a'；'b' ≤ 'c'，续弹</text>
  <g filter="url(#rough2)"><rect x="284" y="198" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/></g>
  <text x="296" y="215" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <g filter="url(#rough2)"><rect x="380" y="198" width="24" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/></g>
  <text x="392" y="215" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <g filter="url(#rough2)"><rect x="504" y="198" width="24" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/></g>
  <text x="516" y="215" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>

  <!-- Row 5: pop b -->
  <text x="24" y="254" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="48" y="254" font-size="11" fill="#b85450" filter="url(#rough2)">弹栈顶 'b'；t 空，回主循环</text>
  <g filter="url(#rough2)"><rect x="284" y="240" width="24" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/></g>
  <text x="296" y="257" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <text x="392" y="257" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">∅</text>
  <g filter="url(#rough2)">
    <rect x="504" y="240" width="24" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3"/>
    <rect x="530" y="240" width="24" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/>
  </g>
  <g font-size="13" fill="#333" filter="url(#rough2)"><text x="516" y="257" text-anchor="middle">a</text><text x="542" y="257" text-anchor="middle">b</text></g>

  <!-- Row 6: i=2 push c -->
  <text x="24" y="296" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="48" y="296" font-size="11" fill="#446688" filter="url(#rough2)">压 s[2]='c'；'c' ≤ suf[3]='{'，弹出</text>
  <text x="296" y="299" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">∅</text>
  <g filter="url(#rough2)"><rect x="380" y="282" width="24" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3"/></g>
  <text x="392" y="299" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">c</text>
  <g filter="url(#rough2)">
    <rect x="504" y="282" width="24" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3"/>
    <rect x="530" y="282" width="24" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3"/>
  </g>
  <g font-size="13" fill="#333" filter="url(#rough2)"><text x="516" y="299" text-anchor="middle">a</text><text x="542" y="299" text-anchor="middle">b</text></g>

  <!-- Row 7: pop c done -->
  <text x="24" y="338" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <text x="48" y="338" font-size="11" fill="#b85450" filter="url(#rough2)">弹 'c'；s、t 均空，结束 ✓</text>
  <text x="296" y="341" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">∅</text>
  <text x="392" y="341" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">∅</text>
  <g filter="url(#rough2)">
    <rect x="504" y="324" width="24" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3"/>
    <rect x="530" y="324" width="24" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3"/>
    <rect x="556" y="324" width="24" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/>
  </g>
  <g font-size="13" fill="#333" filter="url(#rough2)"><text x="516" y="341" text-anchor="middle">a</text><text x="542" y="341" text-anchor="middle">b</text><text x="568" y="341" text-anchor="middle">c</text></g>

  <!-- summary -->
  <rect x="40" y="362" width="560" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="320" y="384" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">每步只压一个字符，但栈顶满足 ≤ 后缀最小值时连弹——把更小字符尽早写纸</text>
</svg>
