<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：统计频次 → 自定义排序 → 返回结果</text>

  <!-- 步骤 1: 统计频次 -->
  <rect x="30" y="56" width="160" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="110" y="78" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① 统计频次</text>
  <text x="110" y="98" text-anchor="middle" font-size="9.5" fill="#333">遍历 nums</text>
  <text x="110" y="114" text-anchor="middle" font-size="9.5" fill="#333">freq[x] += 1</text>
  <text x="110" y="130" text-anchor="middle" font-size="9" fill="#888">哈希表一次扫描</text>

  <path d="M192 96 L238 96" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 步骤 2: 构造排序键 -->
  <rect x="240" y="56" width="160" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="320" y="78" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">② 构造排序键</text>
  <text x="320" y="98" text-anchor="middle" font-size="9.5" fill="#333">key = (freq[x], -x)</text>
  <text x="320" y="114" text-anchor="middle" font-size="9" fill="#4a7a3a">第1键: freq ↑</text>
  <text x="320" y="130" text-anchor="middle" font-size="9" fill="#b85450">第2键: val ↓</text>

  <path d="M402 96 L448 96" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 步骤 3: 排序 -->
  <rect x="450" y="56" width="140" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="520" y="78" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">③ 排序</text>
  <text x="520" y="98" text-anchor="middle" font-size="9.5" fill="#333">sort(nums, key)</text>
  <text x="520" y="114" text-anchor="middle" font-size="9" fill="#333">稳定/不稳定均可</text>
  <text x="520" y="130" text-anchor="middle" font-size="9" fill="#888">O(n log n)</text>

  <!-- 步骤 4: 返回 -->
  <path d="M520 138 L520 166" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="450" y="168" width="140" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="520" y="190" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">④ 返回结果</text>
  <text x="520" y="210" text-anchor="middle" font-size="9.5" fill="#333">排序后的 nums</text>

  <!-- 决策菱形: 同频次? -->
  <path d="M320 168 L320 198 L250 230 L180 198 L180 168 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250" y="192" text-anchor="middle" font-size="9.5" fill="#333">freq 相同?</text>
  <text x="250" y="208" text-anchor="middle" font-size="9" fill="#888">(比较第2键)</text>
  <path d="M240 156 L240 168" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 是 / 否 分支 -->
  <path d="M180 230 L120 260" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="135" y="252" font-size="9" fill="#b85450" font-weight="bold">是</text>
  <path d="M320 230 L380 260" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="365" y="252" font-size="9" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- 是分支: val 降序 -->
  <rect x="50" y="264" width="140" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="120" y="286" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">按 val 降序</text>
  <text x="120" y="304" text-anchor="middle" font-size="9.5" fill="#333">-x 升序 = x 降序</text>

  <!-- 否分支: freq 决定 -->
  <rect x="310" y="264" width="140" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="380" y="286" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">由 freq 决定</text>
  <text x="380" y="304" text-anchor="middle" font-size="9.5" fill="#333">freq 小的排前</text>

  <!-- 合流到排序 -->
  <path d="M120 320 L120 348 L490 348 L490 136" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M380 320 L380 348" stroke="#446688" stroke-width="1.6" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="310" y="342" text-anchor="middle" font-size="9" fill="#888">汇入排序比较</text>

  <!-- 底部说明 -->
  <rect x="30" y="362" width="560" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="50" y="382" font-size="10" fill="#555">Python: sorted(nums, key=lambda x: (freq[x], -x))</text>
  <text x="50" y="400" font-size="10" fill="#555">C++: sort(nums.begin(), nums.end(), [&](int a, int b){ return tie(freq[a], b) &lt; tie(freq[b], a); });</text>
</svg>
