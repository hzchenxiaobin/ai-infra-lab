<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：建差分 → 前缀和 → 逐位移位</text>

  <!-- Step 1 -->
  <rect x="60" y="52" width="420" height="78" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="84" cy="76" r="13" fill="#446688" filter="url(#rough2)"/>
  <text x="84" y="80" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="106" y="80" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">建差分数组 diff[0..n]</text>
  <text x="76" y="100" font-size="11" fill="#444" filter="url(#rough2)">遍历每个 shifts[i] = [s, e, d]：</text>
  <text x="76" y="116" font-size="11" fill="#555" filter="url(#rough2)">δ = (d==1) ? +1 : −1；  diff[s] += δ；  diff[e+1] −= δ</text>

  <path d="M 270 134 L 270 152" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="60" y="156" width="420" height="78" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="84" cy="180" r="13" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="84" y="184" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="106" y="184" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">前缀和还原净移位 net</text>
  <text x="76" y="204" font-size="11" fill="#444" filter="url(#rough2)">running = 0；从 i=0 到 n−1：</text>
  <text x="76" y="220" font-size="11" fill="#555" filter="url(#rough2)">running += diff[i]；  net[i] = running</text>

  <path d="M 270 238 L 270 256" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="60" y="260" width="420" height="78" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <circle cx="84" cy="284" r="13" fill="#d6a040" filter="url(#rough2)"/>
  <text x="84" y="288" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="106" y="288" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">逐位应用移位得到答案</text>
  <text x="76" y="308" font-size="11" fill="#444" filter="url(#rough2)">对每个 i：</text>
  <text x="76" y="324" font-size="11" fill="#555" filter="url(#rough2)">res[i] = (s[i] − 'a' + net[i]) mod 26 + 'a'</text>

  <!-- complexity footer -->
  <rect x="60" y="352" width="420" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="374" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">每步 O(n) 或 O(m)；总体时间 O(n+m)，空间 O(n)</text>
</svg>
