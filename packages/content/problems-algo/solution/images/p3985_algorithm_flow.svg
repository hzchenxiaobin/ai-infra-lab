<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：数组版 Manacher + 前缀和收尾</text>

  <!-- ① 构造 -->
  <g filter="url(#rough2)">
    <rect x="60" y="40" width="290" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="205" y="54" text-anchor="middle" font-size="10.5" fill="#33506b">① 构造 t：t[2i+1] = nums[i]，其余 SEP = −1</text>
    <text x="205" y="69" text-anchor="middle" font-size="10" fill="#33506b">m = 2n+1；同趟攒前缀和 pre</text>
  </g>
  <path d="M 205 76 L 205 90" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ② Manacher 主循环 -->
  <g filter="url(#rough2)">
    <rect x="45" y="92" width="320" height="182" rx="10" fill="#ffffff" stroke="#999" stroke-width="1.4" stroke-dasharray="6 4"/>
    <text x="205" y="110" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">② Manacher 主循环：for i = 0 .. m−1</text>

    <polygon points="150,124 198,140 150,156 102,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="150" y="144" text-anchor="middle" font-size="10" fill="#8a6d1a" font-weight="bold">i &lt; r ?</text>

    <path d="M 198 140 L 212 140" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)"/>
    <rect x="214" y="126" width="142" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="285" y="144" text-anchor="middle" font-size="9" fill="#33506b">是：p[i] = min(r−i, p[2c−i])</text>

    <path d="M 150 156 L 150 172" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)"/>
    <text x="160" y="168" font-size="9" fill="#8a6d1a">否：p[i] = 0</text>

    <path d="M 285 154 L 285 172" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)"/>

    <rect x="95" y="176" width="250" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="220" y="195" text-anchor="middle" font-size="9.5" fill="#2f5d24">中心扩展：while t[i−p−1] == t[i+p+1] 则 p[i]++</text>

    <path d="M 150 206 L 150 222" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)"/>

    <polygon points="150,224 196,240 150,256 104,240" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="150" y="244" text-anchor="middle" font-size="9.5" fill="#8a6d1a" font-weight="bold">i+p[i] &gt; r ?</text>

    <path d="M 196 240 L 210 240" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)"/>
    <rect x="212" y="226" width="144" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <text x="284" y="244" text-anchor="middle" font-size="9" fill="#33506b">是：c = i，r = i+p[i]（右移）</text>

    <path d="M 150 256 L 150 262" stroke="#446688" stroke-width="1.6" fill="none"/>
    <path d="M 150 262 L 62 262 L 62 140 L 96 140" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)"/>
    <text x="96" y="256" font-size="9" fill="#777">i++ 下一轮</text>
  </g>
  <path d="M 205 274 L 205 288" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ③ 收尾映射 -->
  <g filter="url(#rough2)">
    <rect x="60" y="290" width="290" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="205" y="304" text-anchor="middle" font-size="10.5" fill="#33506b">③ 遍历全部 2n+1 个中心：奇 → R = (p−1)/2</text>
    <text x="205" y="319" text-anchor="middle" font-size="10" fill="#33506b">偶 → 对数 q = p/2（q = 0 跳过）</text>
  </g>
  <path d="M 205 326 L 205 340" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ④ 求和返回 -->
  <g filter="url(#rough2)">
    <rect x="60" y="342" width="290" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="205" y="356" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold">④ 前缀和区间求和，打擂台取最大</text>
    <text x="205" y="371" text-anchor="middle" font-size="10" fill="#2f5d24">返回 ans（C++ 必须 long long）</text>
  </g>

  <!-- 右侧注记 -->
  <g filter="url(#rough2)">
    <rect x="380" y="92" width="165" height="78" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="462" y="110" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold">💡 为何均摊 O(n)</text>
    <text x="462" y="126" text-anchor="middle" font-size="9" fill="#8a6d1a">r 单调不减、上限 m；</text>
    <text x="462" y="140" text-anchor="middle" font-size="9" fill="#8a6d1a">每次成功扩展都把 i+p[i]</text>
    <text x="462" y="154" text-anchor="middle" font-size="9" fill="#8a6d1a">顶过旧 r ⇒ 扩展总次数 O(m)</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="380" y="180" width="165" height="64" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="462" y="198" text-anchor="middle" font-size="10.5" fill="#8a3030" font-weight="bold">⚠️ 溢出红线</text>
    <text x="462" y="214" text-anchor="middle" font-size="9" fill="#8a3030">和上界 10⁵×10⁹ = 10¹⁴</text>
    <text x="462" y="228" text-anchor="middle" font-size="9" fill="#8a3030">约是 int 上限的 5 万倍</text>
    <text x="462" y="240" text-anchor="middle" font-size="9" fill="#8a3030">C++ 必须 long long</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="380" y="254" width="165" height="78" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="462" y="272" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">💡 镜像初值为何取 min</text>
    <text x="462" y="288" text-anchor="middle" font-size="9" fill="#33506b">镜像回文若越过 r，</text>
    <text x="462" y="302" text-anchor="middle" font-size="9" fill="#33506b">超出部分失去对称性保证</text>
    <text x="462" y="316" text-anchor="middle" font-size="9" fill="#33506b">先截断到 r−i，</text>
    <text x="462" y="328" text-anchor="middle" font-size="9" fill="#33506b">再靠中心扩展补齐</text>
  </g>

  <!-- 底部复杂度条 -->
  <g filter="url(#rough2)">
    <rect x="60" y="392" width="485" height="30" rx="8" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2"/>
    <text x="302" y="411" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">复杂度：时间 O(n)（Manacher 均摊线性）· 空间 O(n)（t / p / pre 三个线性数组）</text>
  </g>
</svg>
