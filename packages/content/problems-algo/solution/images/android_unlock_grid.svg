<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">手势点阵与 skip 矩阵：跳转中间点约束</text>

  <!-- ============ LEFT: 3x3 grid ============ -->
  <text x="30" y="56" font-size="12" fill="#444" font-weight="bold">3×3 点阵编号</text>

  <!-- grid lines -->
  <path d="M 80 86 L 200 86 M 80 146 L 200 146 M 80 206 L 200 206" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <path d="M 80 86 L 80 206 M 140 86 L 140 206 M 200 86 L 200 206" stroke="#bbb" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <!-- 9 points -->
  <circle cx="80" cy="86" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="90" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <circle cx="140" cy="86" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="90" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <circle cx="200" cy="86" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="90" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <circle cx="80" cy="146" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="150" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <circle cx="140" cy="146" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="140" y="150" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <circle cx="200" cy="146" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="150" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>

  <circle cx="80" cy="206" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="210" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
  <circle cx="140" cy="206" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="210" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>
  <circle cx="200" cy="206" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="210" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">9</text>

  <!-- skip arrows: horizontal 1-3 (via 2), 4-6 (via 5), 7-9 (via 8) -->
  <path d="M 96 86 L 184 86" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 96 146 L 184 146" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 96 206 L 184 206" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- vertical 1-7 (via 4), 2-8 (via 5), 3-9 (via 6) -->
  <path d="M 80 102 L 80 190" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 140 102 L 140 190" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 200 102 L 200 190" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- diagonal 1-9 (via 5), 3-7 (via 5) -->
  <path d="M 92 98 L 188 194" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 188 98 L 92 194" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <text x="140" y="240" text-anchor="middle" font-size="10" fill="#b85450">红色虚线 = 跨越中间点的跳转（需中间点已访问）</text>
  <text x="140" y="254" text-anchor="middle" font-size="10" fill="#888">其余点对无中间点，可直接跳转</text>

  <!-- ============ RIGHT: skip table ============ -->
  <text x="380" y="56" font-size="12" fill="#444" font-weight="bold">skip[a][b] 中间点约束表（共 8 对双向）</text>

  <!-- table header -->
  <rect x="380" y="72" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="440" y="88" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">跳转 a↔b</text>
  <rect x="500" y="72" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="560" y="88" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">必须经过</text>

  <!-- rows -->
  <g font-size="11" fill="#333">
    <rect x="380" y="96" width="120" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="440" y="111" text-anchor="middle">1 ↔ 3</text>
    <rect x="500" y="96" width="120" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="560" y="111" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>

    <rect x="380" y="118" width="120" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="440" y="133" text-anchor="middle">1 ↔ 7</text>
    <rect x="500" y="118" width="120" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="560" y="133" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>

    <rect x="380" y="140" width="120" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="440" y="155" text-anchor="middle">3 ↔ 9</text>
    <rect x="500" y="140" width="120" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="560" y="155" text-anchor="middle" fill="#b85450" font-weight="bold">6</text>

    <rect x="380" y="162" width="120" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="440" y="177" text-anchor="middle">7 ↔ 9</text>
    <rect x="500" y="162" width="120" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="560" y="177" text-anchor="middle" fill="#b85450" font-weight="bold">8</text>

    <rect x="380" y="184" width="120" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="440" y="199" text-anchor="middle">1 ↔ 9</text>
    <rect x="500" y="184" width="120" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="560" y="199" text-anchor="middle" fill="#d6a040" font-weight="bold">5</text>

    <rect x="380" y="206" width="120" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="440" y="221" text-anchor="middle">3 ↔ 7</text>
    <rect x="500" y="206" width="120" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="560" y="221" text-anchor="middle" fill="#d6a040" font-weight="bold">5</text>

    <rect x="380" y="228" width="120" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="440" y="243" text-anchor="middle">2 ↔ 8</text>
    <rect x="500" y="228" width="120" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="560" y="243" text-anchor="middle" fill="#d6a040" font-weight="bold">5</text>

    <rect x="380" y="250" width="120" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="440" y="265" text-anchor="middle">4 ↔ 6</text>
    <rect x="500" y="250" width="120" height="22" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="560" y="265" text-anchor="middle" fill="#d6a040" font-weight="bold">5</text>
  </g>

  <!-- key insight box -->
  <rect x="380" y="290" width="240" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="500" y="310" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">核心观察</text>
  <text x="500" y="328" text-anchor="middle" font-size="10" fill="#555">水平/垂直/对角线穿过格点</text>
  <text x="500" y="342" text-anchor="middle" font-size="10" fill="#555">时才有中间点约束</text>
  <text x="500" y="360" text-anchor="middle" font-size="10" fill="#4a7a3a">回溯时查表 O(1) 判合法性</text>
  <text x="500" y="374" text-anchor="middle" font-size="10" fill="#4a7a3a">skip==0 或 visited[mid]==true</text>

  <text x="320" y="430" text-anchor="middle" font-size="11" fill="#888">关键直觉：非法跳转只发生在「几何中点存在」的点对，预计算成 skip 矩阵即可 O(1) 查表剪枝</text>
</svg>
