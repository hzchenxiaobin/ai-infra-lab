<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 404" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="404" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：第一遍沿链表计数，第二遍沿哈希表建链</text>

  <!-- start -->
  <rect x="168" y="36" width="184" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="260" y="57" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">freq = {}，dummy = tail = 哑节点</text>
  <path d="M 260 68 L 260 84" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- cur = head -->
  <rect x="212" y="86" width="96" height="30" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="260" y="106" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">cur = head</text>
  <path d="M 260 116 L 260 132" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- phase labels -->
  <text x="40" y="150" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">第一遍：</text>
  <text x="40" y="166" font-size="10.5" fill="#446688" filter="url(#rough2)">计数循环</text>

  <!-- diamond 1 -->
  <polygon points="260,134 348,168 260,202 172,168" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="163" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">cur 非空？</text>
  <text x="260" y="180" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">（还没走完链表）</text>

  <!-- yes branch 1 -->
  <text x="356" y="160" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 348 168 L 366 168" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="368" y="146" width="148" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="442" y="163" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">freq[cur.val]++</text>
  <text x="442" y="181" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">cur = cur→next</text>

  <!-- loop back 1 -->
  <path d="M 442 146 L 442 124 L 270 124" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="452" y="136" font-size="10" fill="#888" filter="url(#rough2)">回到判断</text>

  <!-- no branch 1 -->
  <text x="268" y="218" font-size="11.5" fill="#555" filter="url(#rough2)">否</text>
  <path d="M 260 202 L 260 220" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- phase 2 label -->
  <text x="40" y="238" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">第二遍：</text>
  <text x="40" y="254" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">建链循环</text>

  <!-- iterate map -->
  <rect x="152" y="222" width="216" height="30" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="260" y="242" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">遍历 freq 的每个键值对 (val, cnt)</text>
  <path d="M 260 252 L 260 268" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 2 -->
  <polygon points="260,270 348,304 260,338 172,304" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="299" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">还有键值对？</text>
  <text x="260" y="316" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">（顺序任意）</text>

  <!-- yes branch 2 -->
  <text x="356" y="296" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 348 304 L 366 304" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="368" y="280" width="148" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="442" y="297" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">tail→next =</text>
  <text x="442" y="313" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">new ListNode(cnt)</text>
  <text x="442" y="329" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">tail = tail→next</text>

  <!-- loop back 2 -->
  <path d="M 442 280 L 442 260 L 270 260" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="452" y="272" font-size="10" fill="#888" filter="url(#rough2)">回到判断</text>

  <!-- no branch 2 -->
  <text x="268" y="354" font-size="11.5" fill="#555" filter="url(#rough2)">否</text>
  <path d="M 260 338 L 260 356" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- end -->
  <rect x="180" y="358" width="160" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="260" y="379" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">return dummy.next</text>
</svg>
