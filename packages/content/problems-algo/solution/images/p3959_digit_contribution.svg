<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：squareSum − digitSum = Σ d(d−1)（逐位贡献）</text>

  <!-- 左面板：题面直译 -->
  <g filter="url(#rough2)">
    <rect x="20" y="42" width="238" height="70" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="139" y="62" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold">题面直译：两个统计量</text>
    <text x="139" y="81" text-anchor="middle" font-size="10.5" fill="#33506b">squareSum = Σd²，digitSum = Σd</text>
    <text x="139" y="98" text-anchor="middle" font-size="10" fill="#33506b">两个累加器、扫两遍，最后作差</text>
  </g>

  <!-- 中间箭头 -->
  <g filter="url(#rough2)">
    <path d="M262,77 L290,77" stroke="#446688" stroke-width="2.2" marker-end="url(#arr)"/>
    <text x="276" y="66" text-anchor="middle" font-size="9" fill="#33506b">合并</text>
  </g>

  <!-- 右面板：逐位打包 -->
  <g filter="url(#rough2)">
    <rect x="294" y="42" width="246" height="70" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="417" y="62" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">逐位打包：一个统计量</text>
    <text x="417" y="81" text-anchor="middle" font-size="10.5" fill="#2f5d24">diff = Σ d(d−1)</text>
    <text x="417" y="98" text-anchor="middle" font-size="10" fill="#2f5d24">一个累加器、扫一遍搞定</text>
  </g>

  <!-- 恒等式条 -->
  <g filter="url(#rough2)">
    <rect x="20" y="124" width="520" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="280" y="144" text-anchor="middle" font-size="11.5" fill="#8a6d1a" font-weight="bold">squareSum − digitSum = Σd² − Σd = Σ(d² − d) = Σ d(d−1)（分配律）</text>
  </g>

  <!-- 贡献表 -->
  <text x="280" y="172" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold" filter="url(#rough2)">每个数位 d 的净贡献 d(d−1)：</text>

  <g filter="url(#rough2)">
    <rect x="42" y="180" width="44" height="54" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="64" y="200" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
    <text x="64" y="222" text-anchor="middle" font-size="12.5" fill="#2f5d24">0</text>

    <rect x="90" y="180" width="44" height="54" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="112" y="200" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
    <text x="112" y="222" text-anchor="middle" font-size="12.5" fill="#2f5d24">0</text>

    <rect x="138" y="180" width="44" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="160" y="200" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
    <text x="160" y="222" text-anchor="middle" font-size="12.5" fill="#33506b">2</text>

    <rect x="186" y="180" width="44" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="208" y="200" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
    <text x="208" y="222" text-anchor="middle" font-size="12.5" fill="#33506b">6</text>

    <rect x="234" y="180" width="44" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="256" y="200" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
    <text x="256" y="222" text-anchor="middle" font-size="12.5" fill="#33506b">12</text>

    <rect x="282" y="180" width="44" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="304" y="200" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
    <text x="304" y="222" text-anchor="middle" font-size="12.5" fill="#33506b">20</text>

    <rect x="330" y="180" width="44" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="352" y="200" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
    <text x="352" y="222" text-anchor="middle" font-size="12.5" fill="#33506b">30</text>

    <rect x="378" y="180" width="44" height="54" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="400" y="200" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
    <text x="400" y="222" text-anchor="middle" font-size="12.5" fill="#33506b">42</text>

    <rect x="426" y="180" width="44" height="54" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="448" y="200" text-anchor="middle" font-size="13" fill="#8a3030" font-weight="bold">8</text>
    <text x="448" y="222" text-anchor="middle" font-size="12.5" fill="#8a3030" font-weight="bold">56</text>

    <rect x="474" y="180" width="44" height="54" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="496" y="200" text-anchor="middle" font-size="13" fill="#8a3030" font-weight="bold">9</text>
    <text x="496" y="222" text-anchor="middle" font-size="12.5" fill="#8a3030" font-weight="bold">72</text>
  </g>

  <!-- 图例 -->
  <text x="280" y="252" text-anchor="middle" font-size="10" filter="url(#rough2)"><tspan fill="#4a7a3a">● 免费数位（贡献 0）</tspan><tspan fill="#446688">　　● 要凑组合</tspan><tspan fill="#b85450">　　● 单个即 ≥ 50</tspan></text>

  <!-- 左下：含 8/9 必好 -->
  <g filter="url(#rough2)">
    <rect x="20" y="264" width="252" height="126" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="146" y="286" text-anchor="middle" font-size="11.5" fill="#8a6d1a" font-weight="bold">含 8 或 9 ⇒ 必是好整数</text>
    <text x="146" y="306" text-anchor="middle" font-size="10" fill="#8a6d1a">8 一个就贡献 56 ≥ 50 ✓</text>
    <text x="146" y="324" text-anchor="middle" font-size="10" fill="#8a6d1a">9 一个就贡献 72 ≥ 50 ✓</text>
    <text x="146" y="342" text-anchor="middle" font-size="10" fill="#8a6d1a">7 单打独斗只有 42，需帮手：</text>
    <text x="146" y="360" text-anchor="middle" font-size="10" fill="#8a6d1a">7 + 4 = 54 ✓　　7 + 7 = 84 ✓</text>
    <text x="146" y="378" text-anchor="middle" font-size="10" fill="#8a6d1a">6 + 5 = 50 ✓ 恰好压线（是 ≥ 不是 >）</text>
  </g>

  <!-- 右下：免费数位 + 顺序无关 -->
  <g filter="url(#rough2)">
    <rect x="288" y="264" width="252" height="126" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="414" y="286" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold">免费数位 + 顺序无关</text>
    <text x="414" y="306" text-anchor="middle" font-size="10" fill="#2f5d24">0 和 1 贡献为 0，随便加不要钱</text>
    <text x="414" y="324" text-anchor="middle" font-size="10" fill="#2f5d24">1000 的差值 = 0，10⁹ 同理</text>
    <text x="414" y="342" text-anchor="middle" font-size="10" fill="#2f5d24">加法交换律 ⇒ 只看数字多重集</text>
    <text x="414" y="360" text-anchor="middle" font-size="10" fill="#2f5d24">19、91、901 的判定必然一致</text>
    <text x="414" y="378" text-anchor="middle" font-size="10" fill="#2f5d24">n ≥ 1 ⇒ 循环至少跑一轮，无 0 边界</text>
  </g>
</svg>
