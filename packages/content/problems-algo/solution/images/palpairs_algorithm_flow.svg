<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="520" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：哈希表 + 枚举切分点</text>

  <!-- Step 1: build map -->
  <rect x="150" y="46" width="240" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="68" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">建哈希表 wordMap: {word → index}</text>
  <path d="M270 84 L270 100" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: for each word -->
  <rect x="150" y="104" width="240" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="126" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">for i, w in enumerate(words):</text>
  <path d="M270 142 L270 158" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: for each split j -->
  <rect x="150" y="162" width="240" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="184" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">for j in 0..len(w):</text>
  <path d="M270 200 L270 214" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- split -->
  <rect x="130" y="218" width="280" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="238" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">prefix = w[:j],  suffix = w[j:]</text>

  <!-- branch lines -->
  <path d="M270 252 L270 264 L120 264 L120 280" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M270 252 L270 264 L420 264 L420 280" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Branch A: prefix is palindrome? -->
  <polygon points="120,280 200,280 220,310 200,340 120,340 100,310" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="306" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">prefix</text>
  <text x="160" y="322" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是回文?</text>

  <!-- Branch B: suffix is palindrome and j != len? -->
  <polygon points="420,280 500,280 520,310 500,340 420,340 400,310" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="460" y="302" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">suffix 回文</text>
  <text x="460" y="318" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">且 j ≠ len?</text>

  <!-- A: yes path -->
  <path d="M160 340 L160 360" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="178" y="354" font-size="10" fill="#4a7a3a">是</text>
  <rect x="60" y="362" width="200" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="160" y="383" text-anchor="middle" font-size="10.5" fill="#333">查 rev(suffix) ∈ map &amp; idx ≠ i</text>

  <path d="M160 396 L160 412" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="414" width="200" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="160" y="433" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">add (map[rev(suffix)], i)</text>

  <!-- A: no path -->
  <path d="M100 310 L60 310 L60 460" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="40" y="306" font-size="10" fill="#888">否</text>

  <!-- B: yes path -->
  <path d="M460 340 L460 360" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="478" y="354" font-size="10" fill="#d6a040">是</text>
  <rect x="360" y="362" width="200" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="460" y="383" text-anchor="middle" font-size="10.5" fill="#333">查 rev(prefix) ∈ map &amp; idx ≠ i</text>

  <path d="M460 396 L460 412" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="360" y="414" width="200" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="460" y="433" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">add (i, map[rev(prefix)])</text>

  <!-- B: no path -->
  <path d="M520 310 L510 310 L510 460" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="514" y="306" font-size="10" fill="#888">否</text>

  <!-- merge to next j -->
  <path d="M60 460 L510 460" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M270 460 L270 476" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="478" width="280" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="497" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">下一个 j / 下一个 i → 返回 result</text>
</svg>
