<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">贪心选择：射在「最早右端点」最划算</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">必须引爆 [1,6] ⇒ 箭位只能落在 [1,6]；取最靠右的 6 覆盖更多后续区间</text>

  <!-- valid arrow zone for [1,6]: x=1..6 -> 100..250 -->
  <rect x="100" y="104" width="150" height="158" fill="#fff8e1" fill-opacity="0.55" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="175" y="98" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">合法箭位 [1,6]</text>

  <!-- x axis -->
  <line x1="70" y1="284" x2="500" y2="284" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <g font-size="10" fill="#888" text-anchor="middle">
    <line x1="100" y1="284" x2="100" y2="290" stroke="#888"/><text x="100" y="302">1</text>
    <line x1="130" y1="284" x2="130" y2="290" stroke="#888"/><text x="130" y="302">2</text>
    <line x1="250" y1="284" x2="250" y2="290" stroke="#888"/><text x="250" y="302">6</text>
    <line x1="310" y1="284" x2="310" y2="290" stroke="#888"/><text x="310" y="302">8</text>
  </g>

  <!-- balloon [1,6] -->
  <rect x="100" y="122" width="150" height="22" rx="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="175" y="138" text-anchor="middle" font-size="11" fill="#2a4a66" font-weight="bold">[1,6]</text>
  <!-- balloon [2,8] -->
  <rect x="130" y="162" width="180" height="22" rx="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="178" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">[2,8]</text>

  <!-- GOOD arrow at x=6 (250) -->
  <line x1="250" y1="278" x2="250" y2="112" stroke="#4a7a3a" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="250" y="248" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓ x=6</text>
  <text x="250" y="232" text-anchor="middle" font-size="9" fill="#4a7a3a">覆盖两者</text>

  <!-- BAD arrow at x=1 (100) -->
  <line x1="100" y1="278" x2="100" y2="200" stroke="#b85450" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="86" y="248" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold">✗ x=1</text>
  <text x="86" y="232" text-anchor="end" font-size="9" fill="#b85450">错过 [2,8]</text>

  <!-- greedy note -->
  <rect x="40" y="320" width="480" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="280" y="338" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">贪心选择性质：当前区间必须被覆盖，箭位 ∈ [x_start, x_end]</text>
  <text x="280" y="355" text-anchor="middle" font-size="10" fill="#555">取最靠右的 x_end ⇒ 留给后续区间最大的覆盖机会 ⇒ 选「右端点最小」的区间先处理</text>
</svg>
