<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="500" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：二分答案 L + 滚动哈希验证</text>
  <text x="310" y="48" text-anchor="middle" font-size="11" fill="#888">单调性 → 二分最大可行 L；check(L) 用滚动哈希 O(S) 验证</text>

  <!-- Step 1: Preprocess -->
  <rect x="180" y="66" width="260" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="91" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">预处理：排序路径，求 minLen，预算 B^k</text>

  <path d="M 310 110 L 310 128" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 2: Binary search diamond -->
  <polygon points="310,132 430,172 310,212 190,172" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="168" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">二分 L ∈ [0, minLen]</text>
  <text x="310" y="186" text-anchor="middle" font-size="10" fill="#888">mid = (lo+hi+1)/2</text>

  <path d="M 310 212 L 310 230" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="322" y="226" font-size="10" fill="#888">调 check(mid)</text>

  <!-- Step 3: check(L) box -->
  <rect x="80" y="234" width="460" height="170" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="256" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">check(L)：是否存在长度 L 的公共子路径？</text>

  <!-- check sub-steps -->
  <rect x="100" y="268" width="420" height="28" rx="5" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="310" y="287" text-anchor="middle" font-size="11" fill="#444">① 路径 0：算所有长 L 窗口的双哈希 → 存入集合 S</text>

  <rect x="100" y="304" width="420" height="28" rx="5" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="310" y="323" text-anchor="middle" font-size="11" fill="#444">② 路径 i (1≤i&lt;m)：算所有长 L 窗口哈希 → S ← S ∩ 当前</text>

  <rect x="100" y="340" width="420" height="28" rx="5" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="310" y="359" text-anchor="middle" font-size="11" fill="#b85450">③ 若 S 为空 → return false；全部处理完非空 → return true</text>

  <text x="310" y="390" text-anchor="middle" font-size="10" fill="#888">每次 check 耗时 O(S)，S = Σ 路径长度 ≤ 10⁵</text>

  <!-- Branch: check true -->
  <path d="M 190 172 L 80 172 L 80 420 L 80 460" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5 3" fill="none" filter="url(#rough2)"/>
  <text x="56" y="300" font-size="11" fill="#4a7a3a" font-weight="bold">✓ true</text>
  <rect x="40" y="424" width="110" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="95" y="446" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">lo = mid</text>

  <!-- Branch: check false -->
  <path d="M 430 172 L 540 172 L 540 420 L 540 460" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 3" fill="none" filter="url(#rough2)"/>
  <text x="546" y="300" font-size="11" fill="#b85450" font-weight="bold">✗ false</text>
  <rect x="470" y="424" width="110" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="525" y="446" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">hi = mid − 1</text>

  <!-- Loop back arrow -->
  <path d="M 95 424 L 95 172 L 190 172" stroke="#4a7a3a" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 525 424 L 525 172 L 430 172" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Return -->
  <rect x="220" y="466" width="180" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="486" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">lo == hi → 返回 lo</text>
</svg>
