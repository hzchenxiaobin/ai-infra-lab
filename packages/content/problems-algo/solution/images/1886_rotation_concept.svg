<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：90° 顺时针旋转的下标映射</text>

  <!-- Left matrix label -->
  <text x="165" y="48" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">原始矩阵 old</text>

  <!-- Left matrix col labels -->
  <text x="115" y="58" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j=0</text>
  <text x="165" y="58" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="215" y="58" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>

  <!-- Left matrix row labels -->
  <text x="74" y="94" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=0</text>
  <text x="74" y="144" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="74" y="194" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>

  <!-- Left matrix cells: Row 0: 1, 2, 3 -->
  <rect x="90" y="66" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="140" y="66" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="190" y="66" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="98" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="165" y="98" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="215" y="98" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- Row 1: 4, 5, 6 -->
  <rect x="90" y="116" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="140" y="116" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="190" y="116" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="148" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="165" y="148" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="215" y="148" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>

  <!-- Row 2: 7(highlight), 8, 9 -->
  <rect x="90" y="166" width="50" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <rect x="140" y="166" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="190" y="166" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="198" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="165" y="198" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="215" y="198" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">9</text>

  <!-- Rotation arrow -->
  <path d="M 250 141 Q 295 115 340 141" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="295" y="108" text-anchor="middle" font-size="12" fill="#666" font-weight="bold" filter="url(#rough2)">90°顺时针</text>

  <!-- Right matrix label -->
  <text x="435" y="48" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">旋转后 new</text>

  <!-- Right matrix col labels -->
  <text x="385" y="58" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j=0</text>
  <text x="435" y="58" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="485" y="58" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>

  <!-- Right matrix row labels -->
  <text x="344" y="94" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i=0</text>
  <text x="344" y="144" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="344" y="194" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>

  <!-- Right matrix cells: Row 0: 7(highlight), 4, 1 -->
  <rect x="360" y="66" width="50" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <rect x="410" y="66" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="460" y="66" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="385" y="98" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="435" y="98" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="485" y="98" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- Row 1: 8, 5, 2 -->
  <rect x="360" y="116" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="410" y="116" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="460" y="116" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="385" y="148" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="435" y="148" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="485" y="148" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- Row 2: 9, 6, 3 -->
  <rect x="360" y="166" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="410" y="166" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="460" y="166" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="385" y="198" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="435" y="198" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="485" y="198" text-anchor="middle" font-size="18" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- Divider -->
  <path d="M 40 236 L 520 236" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Formula box -->
  <rect x="100" y="252" width="360" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="280" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">new[i][j] = old[n − 1 − j][i]</text>

  <!-- Annotation for highlighted cell -->
  <text x="280" y="316" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">例：i=0, j=0 → new[0][0] = old[3−1−0][0] = old[2][0] = 7</text>

  <!-- Cycle note -->
  <text x="280" y="346" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">旋转 4 次（360°）回到原矩阵 → 最多检查 0° / 90° / 180° / 270° 四种状态</text>
</svg>
