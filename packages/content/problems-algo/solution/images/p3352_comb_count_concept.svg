<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察②：数「x &lt; n 且 popcount(x)=c」——按第一个变小位拆解</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">以 s = 1 0 1 1 0 为例：x 与 s 前缀相同，在某位 s[i]=1 处放 0（首次变小），其后全自由</text>

  <!-- 顶行：s 本体 -->
  <g filter="url(#rough2)">
    <text x="36" y="66" font-size="11" fill="#666">s =</text>
    <rect x="66" y="52" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="110" y="52" width="44" height="34" fill="#f4f4f4" stroke="#999" stroke-width="1.5" rx="4"/>
    <rect x="154" y="52" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="198" y="52" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="242" y="52" width="44" height="34" fill="#f4f4f4" stroke="#999" stroke-width="1.5" rx="4"/>
    <text x="88" y="74" text-anchor="middle" font-size="15" font-weight="bold" fill="#33506b">1</text>
    <text x="132" y="74" text-anchor="middle" font-size="15" fill="#888">0</text>
    <text x="176" y="74" text-anchor="middle" font-size="15" font-weight="bold" fill="#33506b">1</text>
    <text x="220" y="74" text-anchor="middle" font-size="15" font-weight="bold" fill="#33506b">1</text>
    <text x="264" y="74" text-anchor="middle" font-size="15" fill="#888">0</text>
    <text x="88" y="98" text-anchor="middle" font-size="8.5" fill="#999">i=0</text>
    <text x="176" y="98" text-anchor="middle" font-size="8.5" fill="#999">i=2</text>
    <text x="220" y="98" text-anchor="middle" font-size="8.5" fill="#999">i=3</text>
  </g>
  <text x="384" y="74" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">只在 s[i]='1' 的位</text>
  <text x="384" y="88" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">才可能「变小」</text>

  <!-- 行 A：i=0 变小 -->
  <g filter="url(#rough2)">
    <text x="36" y="128" font-size="10" fill="#666">i=0：</text>
    <rect x="66" y="114" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <text x="88" y="134" text-anchor="middle" font-size="15" font-weight="bold" fill="#8f3b37">0</text>
    <rect x="110" y="114" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5 3" rx="4"/>
    <rect x="154" y="114" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5 3" rx="4"/>
    <rect x="198" y="114" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5 3" rx="4"/>
    <rect x="242" y="114" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5 3" rx="4"/>
    <text x="132" y="134" text-anchor="middle" font-size="13" fill="#2f5d24">?</text>
    <text x="176" y="134" text-anchor="middle" font-size="13" fill="#2f5d24">?</text>
    <text x="220" y="134" text-anchor="middle" font-size="13" fill="#2f5d24">?</text>
    <text x="264" y="134" text-anchor="middle" font-size="13" fill="#2f5d24">?</text>
  </g>
  <text x="330" y="134" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">后 4 位自由 → C(4, c−0)</text>

  <!-- 行 B：i=2 变小 -->
  <g filter="url(#rough2)">
    <text x="36" y="168" font-size="10" fill="#666">i=2：</text>
    <rect x="66" y="154" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="110" y="154" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="154" y="154" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <rect x="198" y="154" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5 3" rx="4"/>
    <rect x="242" y="154" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5 3" rx="4"/>
    <text x="88" y="174" text-anchor="middle" font-size="15" font-weight="bold" fill="#33506b">1</text>
    <text x="132" y="174" text-anchor="middle" font-size="15" fill="#33506b">0</text>
    <text x="176" y="174" text-anchor="middle" font-size="15" font-weight="bold" fill="#8f3b37">0</text>
    <text x="220" y="174" text-anchor="middle" font-size="13" fill="#2f5d24">?</text>
    <text x="264" y="174" text-anchor="middle" font-size="13" fill="#2f5d24">?</text>
  </g>
  <text x="330" y="174" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">后 2 位自由 → C(2, c−1)</text>

  <!-- 行 C：i=3 变小 -->
  <g filter="url(#rough2)">
    <text x="36" y="208" font-size="10" fill="#666">i=3：</text>
    <rect x="66" y="194" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="110" y="194" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="154" y="194" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="198" y="194" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <rect x="242" y="194" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5 3" rx="4"/>
    <text x="88" y="214" text-anchor="middle" font-size="15" font-weight="bold" fill="#33506b">1</text>
    <text x="132" y="214" text-anchor="middle" font-size="15" fill="#33506b">0</text>
    <text x="176" y="214" text-anchor="middle" font-size="15" font-weight="bold" fill="#33506b">1</text>
    <text x="220" y="214" text-anchor="middle" font-size="15" font-weight="bold" fill="#8f3b37">0</text>
    <text x="264" y="214" text-anchor="middle" font-size="13" fill="#2f5d24">?</text>
  </g>
  <text x="330" y="214" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">后 1 位自由 → C(1, c−2)</text>

  <path d="M 244 226 Q 260 236 258 246" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="368" y="240" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">蓝 = 前缀与 s 相同（已含 ones 个 1）</text>

  <!-- 公式框 -->
  <rect x="20" y="252" width="480" height="94" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="274" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">count(c) = Σ over i：s[i]='1' 　C( m , c − ones )</text>
  <text x="260" y="294" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">m = i 之后的位数 = L−1−i（自由位）；ones = s[0..i−1] 中 1 的个数</text>
  <text x="260" y="312" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">首个不同位必为「x 是 0、s 是 1」⇒ x &lt; n 严格成立，n 自身不会被计入</text>
  <text x="260" y="330" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">c ≥ 1 自动排除 x = 0；need 落在 [0, m] 外时组合数按 0 处理</text>
</svg>
