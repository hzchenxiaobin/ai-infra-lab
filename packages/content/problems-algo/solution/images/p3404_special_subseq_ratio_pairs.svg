<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="20" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">把交叉等式拆成左右两半的「比值配对」</text>

  <!-- cross arcs above the array -->
  <g filter="url(#rough2)">
    <path d="M 124 84 Q 228 30 332 84" fill="none" stroke="#446688" stroke-width="2" stroke-dasharray="5,4"/>
    <text x="228" y="58" text-anchor="middle" font-size="12" fill="#446688">nums[p]·nums[r]</text>
    <path d="M 228 84 Q 332 -20 436 84" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="5,4"/>
    <text x="332" y="18" text-anchor="middle" font-size="12" fill="#b85450">nums[q]·nums[s]</text>
  </g>

  <!-- array cells: nums = [1,2,3,4,3,6,1] -->
  <g filter="url(#rough2)">
    <rect x="104" y="90" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="156" y="90" width="40" height="34" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="208" y="90" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4"/>
    <rect x="260" y="90" width="40" height="34" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="312" y="90" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="364" y="90" width="40" height="34" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="416" y="90" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="124" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688">1</text>
    <text x="176" y="112" text-anchor="middle" font-size="14" fill="#888">2</text>
    <text x="228" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688">3</text>
    <text x="280" y="112" text-anchor="middle" font-size="14" fill="#888">4</text>
    <text x="332" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a">3</text>
    <text x="384" y="112" text-anchor="middle" font-size="14" fill="#888">6</text>
    <text x="436" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a">1</text>
  </g>

  <!-- index labels -->
  <g filter="url(#rough2)">
    <text x="124" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">p=0</text>
    <text x="176" y="142" text-anchor="middle" font-size="12" fill="#999">·</text>
    <text x="228" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688">q=2</text>
    <text x="280" y="142" text-anchor="middle" font-size="12" fill="#999">·</text>
    <text x="332" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">r=4</text>
    <text x="384" y="142" text-anchor="middle" font-size="12" fill="#999">·</text>
    <text x="436" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">s=6</text>
    <text x="280" y="158" text-anchor="middle" font-size="11" fill="#888">相邻下标至少隔 1 个格子（q−p, r−q, s−r ≥ 2）</text>
  </g>

  <!-- equivalence box -->
  <g filter="url(#rough2)">
    <rect x="60" y="166" width="440" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="280" y="184" text-anchor="middle" font-size="13" fill="#8a6d1a">交叉等式 nums[p]·nums[r] = nums[q]·nums[s]  两两耦合，没法独立拆 ✗</text>
    <text x="280" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1a">⟺  nums[p]/nums[q] = nums[s]/nums[r]  左右各带一个「比值签名」✓</text>
  </g>

  <!-- left pair box -->
  <g filter="url(#rough2)">
    <rect x="36" y="226" width="170" height="96" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="121" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">左半 · 对 (p, q)</text>
    <text x="121" y="268" text-anchor="middle" font-size="12" fill="#333">约束：q − p ≥ 2</text>
    <text x="121" y="286" text-anchor="middle" font-size="12" fill="#333">签名：nums[p]/nums[q] 约分</text>
    <text x="121" y="306" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">动作：入表 ✓</text>
  </g>

  <!-- hash table box -->
  <g filter="url(#rough2)">
    <rect x="228" y="238" width="106" height="72" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="281" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#8a6d1a">哈希表 cnt</text>
    <text x="281" y="276" text-anchor="middle" font-size="12" fill="#333">(1,3) → 1</text>
    <text x="281" y="294" text-anchor="middle" font-size="12" fill="#333">(1,1) → 2 ···</text>
  </g>

  <!-- right pair box -->
  <g filter="url(#rough2)">
    <rect x="356" y="226" width="170" height="96" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="441" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">右半 · 对 (r, s)</text>
    <text x="441" y="268" text-anchor="middle" font-size="12" fill="#333">约束：s − r ≥ 2</text>
    <text x="441" y="286" text-anchor="middle" font-size="12" fill="#333">签名：nums[s]/nums[r] 约分</text>
    <text x="441" y="306" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a">动作：查表计数 ✓</text>
  </g>

  <!-- arrows -->
  <g filter="url(#rough2)">
    <path d="M 206 274 L 224 274" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
    <path d="M 356 274 L 338 274" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  </g>

  <!-- conclusion box -->
  <g filter="url(#rough2)">
    <rect x="42" y="338" width="476" height="48" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="280" y="358" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d4d22">按 r 分界：q ≤ r−2 的左对先入表，s ≥ r+2 的右对再查表</text>
    <text x="280" y="378" text-anchor="middle" font-size="12" fill="#4a7a3a">比值用 gcd 约分成 (a, b) 作键，精确无浮点误差</text>
  </g>
</svg>
