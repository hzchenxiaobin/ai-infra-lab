<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 580" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="6" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="820" height="580" fill="#fdfcf7"/>

  <text x="410" y="30" text-anchor="middle" font-size="17" fill="#2b2b2b" font-weight="bold">示例演算：arr1=[1,5,3,6,7], arr2=[1,2,3,4]</text>
  <path d="M 200 40 Q 410 48 620 40" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>

  <text x="410" y="58" text-anchor="middle" font-size="11" fill="#888">蓝色=前一状态　绿色=保留　红色=替换　灰色=无效转移</text>

  <line x1="20" y1="72" x2="800" y2="72" stroke="#ddd" stroke-width="1" filter="url(#sk)"/>

  <text x="35" y="98" font-size="12" fill="#888" font-weight="bold">i=0</text>
  <text x="35" y="114" font-size="13" fill="#d6a040" font-weight="bold">x=1</text>
  <g filter="url(#sk)"><rect x="120" y="88" width="90" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="165" y="107" text-anchor="middle" font-size="11" fill="#2b2b2b">(-∞, 0)</text>
  <path d="M 210 102 L 470 102" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="300" y="96" font-size="10" fill="#4a8e4a" font-weight="bold">保留 1 &gt; -∞</text>
  <g filter="url(#sk)"><rect x="470" y="88" width="90" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="515" y="107" text-anchor="middle" font-size="11" fill="#2b2b2b">(1, 0)</text>

  <line x1="20" y1="130" x2="800" y2="130" stroke="#ddd" stroke-width="1" filter="url(#sk)"/>

  <text x="35" y="156" font-size="12" fill="#888" font-weight="bold">i=1</text>
  <text x="35" y="172" font-size="13" fill="#d6a040" font-weight="bold">x=5</text>
  <g filter="url(#sk)"><rect x="120" y="146" width="90" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="165" y="165" text-anchor="middle" font-size="11" fill="#2b2b2b">(1, 0)</text>
  <path d="M 210 152 L 470 150" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="280" y="144" font-size="10" fill="#4a8e4a" font-weight="bold">保留 5 &gt; 1</text>
  <g filter="url(#sk)"><rect x="470" y="136" width="90" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="515" y="155" text-anchor="middle" font-size="11" fill="#2b2b2b">(5, 0)</text>
  <path d="M 210 168 L 470 186" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#sk)" stroke-dasharray="5,3"/>
  <text x="270" y="190" font-size="10" fill="#b85450" font-weight="bold">替换→arr2[1]=2</text>
  <g filter="url(#sk)"><rect x="470" y="172" width="90" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="515" y="191" text-anchor="middle" font-size="11" fill="#2b2b2b">(2, 1)</text>

  <line x1="20" y1="214" x2="800" y2="214" stroke="#ddd" stroke-width="1" filter="url(#sk)"/>

  <text x="35" y="240" font-size="12" fill="#888" font-weight="bold">i=2</text>
  <text x="35" y="256" font-size="13" fill="#d6a040" font-weight="bold">x=3</text>
  <g filter="url(#sk)"><rect x="120" y="230" width="90" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="165" y="249" text-anchor="middle" font-size="11" fill="#2b2b2b">(5, 0)</text>
  <g filter="url(#sk)"><rect x="230" y="230" width="90" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="275" y="249" text-anchor="middle" font-size="11" fill="#2b2b2b">(2, 1)</text>
  <text x="130" y="276" font-size="10" fill="#999">✗ 5≥3 且无 arr2&gt;5</text>
  <path d="M 320 248 L 470 248" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="350" y="242" font-size="10" fill="#4a8e4a" font-weight="bold">保留 3 &gt; 2</text>
  <g filter="url(#sk)"><rect x="470" y="234" width="90" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="515" y="253" text-anchor="middle" font-size="11" fill="#2b2b2b">(3, 1)</text>

  <line x1="20" y1="278" x2="800" y2="278" stroke="#ddd" stroke-width="1" filter="url(#sk)"/>

  <text x="35" y="304" font-size="12" fill="#888" font-weight="bold">i=3</text>
  <text x="35" y="320" font-size="13" fill="#d6a040" font-weight="bold">x=6</text>
  <g filter="url(#sk)"><rect x="120" y="294" width="90" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="165" y="313" text-anchor="middle" font-size="11" fill="#2b2b2b">(3, 1)</text>
  <path d="M 210 300 L 470 298" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="280" y="292" font-size="10" fill="#4a8e4a" font-weight="bold">保留 6 &gt; 3</text>
  <g filter="url(#sk)"><rect x="470" y="284" width="90" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="515" y="303" text-anchor="middle" font-size="11" fill="#2b2b2b">(6, 1)</text>
  <path d="M 210 316 L 470 334" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#sk)" stroke-dasharray="5,3"/>
  <text x="270" y="338" font-size="10" fill="#b85450" font-weight="bold">替换→arr2[3]=4</text>
  <g filter="url(#sk)"><rect x="470" y="320" width="90" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="515" y="339" text-anchor="middle" font-size="11" fill="#2b2b2b">(4, 2)</text>

  <line x1="20" y1="362" x2="800" y2="362" stroke="#ddd" stroke-width="1" filter="url(#sk)"/>

  <text x="35" y="388" font-size="12" fill="#888" font-weight="bold">i=4</text>
  <text x="35" y="404" font-size="13" fill="#d6a040" font-weight="bold">x=7</text>
  <g filter="url(#sk)"><rect x="120" y="378" width="90" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="165" y="397" text-anchor="middle" font-size="11" fill="#2b2b2b">(6, 1)</text>
  <g filter="url(#sk)"><rect x="230" y="378" width="90" height="28" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="275" y="397" text-anchor="middle" font-size="11" fill="#2b2b2b">(4, 2)</text>
  <path d="M 210 388 L 470 388" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="300" y="382" font-size="10" fill="#4a8e4a" font-weight="bold">保留 7 &gt; 6, ops=1</text>
  <path d="M 320 396 L 470 396" stroke="#4a8e4a" stroke-width="1.2" fill="none" marker-end="url(#arg)" filter="url(#sk)" stroke-dasharray="3,2"/>
  <text x="340" y="416" font-size="10" fill="#888">保留 7 &gt; 4, ops=2 → 同值取 min</text>
  <g filter="url(#sk)"><rect x="470" y="378" width="90" height="28" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="2"/></g>
  <text x="515" y="397" text-anchor="middle" font-size="11" fill="#2b2b2b" font-weight="bold">(7, 1)</text>

  <line x1="20" y1="426" x2="800" y2="426" stroke="#ddd" stroke-width="1" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="250" y="446" width="320" height="50" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="410" y="468" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">最终 dp = {7: 1}</text>
  <text x="410" y="486" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">答案 = min(ops) = 1</text>

  <g filter="url(#sk)">
    <rect x="80" y="510" width="660" height="56" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5,3"/>
  </g>
  <text x="100" y="532" font-size="11" fill="#2b2b2b" font-weight="bold">关键观察：</text>
  <text x="100" y="550" font-size="10" fill="#444">i=2 时 (5,0) 状态死亡——5≥3 无法保留，arr2 中无元素 &gt;5 无法替换。只有 (2,1) 能继续。</text>
</svg>
