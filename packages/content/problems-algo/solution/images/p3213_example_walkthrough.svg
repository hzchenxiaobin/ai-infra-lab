<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 370"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="370" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：target = "abcdef"，dp[0] = 0</text>

  <!-- 表头 -->
  <rect x="46" y="38" width="34" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="63" y="54" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">j</text>
  <rect x="80" y="38" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="98" y="54" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">读入</text>
  <rect x="116" y="38" width="62" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="147" y="54" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">状态</text>
  <rect x="178" y="38" width="242" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="299" y="54" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">沿 dict 链命中的单词</text>
  <rect x="420" y="38" width="112" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="476" y="54" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">dp[j]</text>

  <!-- 行 j=1 -->
  <rect x="46" y="62" width="34" height="34" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="63" y="83" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="80" y="62" width="36" height="34" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="98" y="83" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a</text>
  <rect x="116" y="62" width="62" height="34" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="147" y="83" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a</text>
  <rect x="178" y="62" width="242" height="34" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="299" y="83" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">（无）</text>
  <rect x="420" y="62" width="112" height="34" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="476" y="83" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">∞</text>

  <!-- 行 j=2 -->
  <rect x="46" y="96" width="34" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="63" y="117" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="80" y="96" width="36" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="98" y="117" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">b</text>
  <rect x="116" y="96" width="62" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="147" y="117" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ab</text>
  <rect x="178" y="96" width="242" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="299" y="117" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">（无）</text>
  <rect x="420" y="96" width="112" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="476" y="117" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">∞</text>

  <!-- 行 j=3 -->
  <rect x="46" y="130" width="34" height="34" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="63" y="151" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="80" y="130" width="36" height="34" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="98" y="151" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">c</text>
  <rect x="116" y="130" width="62" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="147" y="151" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">abc ✓</text>
  <rect x="178" y="130" width="242" height="34" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="299" y="151" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">abc：|w|=3，¥1</text>
  <rect x="420" y="130" width="112" height="34" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="476" y="151" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">dp[0]+1 = 1</text>

  <!-- 行 j=4 -->
  <rect x="46" y="164" width="34" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="63" y="185" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="80" y="164" width="36" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="98" y="185" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">d</text>
  <rect x="116" y="164" width="62" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="147" y="185" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">d ✓</text>
  <rect x="178" y="164" width="242" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="299" y="185" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">d：|w|=1，¥1</text>
  <rect x="420" y="164" width="112" height="34" fill="#fafafa" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="476" y="185" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">dp[3]+1 = 2</text>

  <!-- 行 j=5 -->
  <rect x="46" y="198" width="34" height="34" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="63" y="219" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <rect x="80" y="198" width="36" height="34" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="98" y="219" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">e</text>
  <rect x="116" y="198" width="62" height="34" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="147" y="219" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">de</text>
  <rect x="178" y="198" width="242" height="34" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="299" y="219" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">fail(de)=e 非单词终点，dict 链空</text>
  <rect x="420" y="198" width="112" height="34" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="476" y="219" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">∞</text>

  <!-- 行 j=6（高亮） -->
  <rect x="46" y="232" width="34" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="63" y="258" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <rect x="80" y="232" width="36" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="98" y="258" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">f</text>
  <rect x="116" y="232" width="62" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="147" y="258" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">def ✓</text>
  <rect x="178" y="232" width="242" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="299" y="249" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">def：¥10 ⇒ dp[3]+10 = 11</text>
  <text x="299" y="266" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">ef（fail/dict 链）：¥5 ⇒ dp[4]+5 = 7 ✓</text>
  <rect x="420" y="232" width="112" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="476" y="258" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">min = 7</text>

  <!-- 结论框 -->
  <rect x="90" y="292" width="380" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="309" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">dp[6] = 7 ✓ = "abc"(1) + "d"(1) + "ef"(5)</text>
  <text x="280" y="325" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">dp[5] = ∅ 不影响：ef 跨过了位置 5，直接由 dp[4] 转移</text>

  <text x="280" y="354" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">关键一跳：状态 def 经 fail 指到 ef，把最优拆分「abc + d + ef」挖了出来</text>
</svg>
