<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#b85450" stroke-width="1.5"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#4a7a3a" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：cookies=[8,15,10,20,8], k=2 → 31</text>

  <!-- sorted descending note -->
  <rect x="40" y="40" width="460" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="57" text-anchor="middle" font-size="11" fill="#444">降序后 = [20, 15, 10, 8, 8]，总和 = 61，下界 ⌈61/2⌉ = 31</text>

  <!-- Child A bucket -->
  <text x="60" y="100" font-size="12" fill="#446688" font-weight="bold">孩子 A</text>
  <rect x="50" y="108" width="210" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <!-- bags in A: 8, 15, 8 -->
  <rect x="62" y="120" width="56" height="30" fill="#b8c8e8" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="139" text-anchor="middle" font-size="11" fill="#333">8</text>
  <rect x="126" y="120" width="56" height="30" fill="#b8c8e8" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="154" y="139" text-anchor="middle" font-size="11" fill="#333">15</text>
  <rect x="190" y="120" width="56" height="30" fill="#b8c8e8" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="218" y="139" text-anchor="middle" font-size="11" fill="#333">8</text>
  <text x="155" y="172" text-anchor="middle" font-size="11" fill="#555">合计</text>
  <rect x="100" y="180" width="110" height="34" fill="#446688" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="155" y="202" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">31</text>

  <!-- Child B bucket -->
  <text x="320" y="100" font-size="12" fill="#4a7a3a" font-weight="bold">孩子 B</text>
  <rect x="300" y="108" width="210" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <!-- bags in B: 10, 20 -->
  <rect x="316" y="120" width="80" height="30" fill="#c8dcb8" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="356" y="139" text-anchor="middle" font-size="11" fill="#333">10</text>
  <rect x="406" y="120" width="80" height="30" fill="#c8dcb8" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="446" y="139" text-anchor="middle" font-size="11" fill="#333">20</text>
  <text x="405" y="172" text-anchor="middle" font-size="11" fill="#555">合计</text>
  <rect x="350" y="180" width="110" height="34" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="405" y="202" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">30</text>

  <!-- result line -->
  <rect x="40" y="240" width="460" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="262" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">不公平程度 = max(31, 30) = 31 = 下界 → 最优 ✓</text>

  <!-- pruned branch example -->
  <text x="40" y="296" font-size="12" fill="#b85450" font-weight="bold">剪枝示例：</text>
  <rect x="40" y="304" width="460" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="324" text-anchor="middle" font-size="11" fill="#555">若把 20 与 15 分给同一孩子 → 20+15=35 ≥ best=31</text>
  <text x="270" y="342" text-anchor="middle" font-size="11" fill="#555">该分支直接剪掉，不再往下搜（省掉整棵子树）</text>
  <text x="270" y="360" text-anchor="middle" font-size="11" fill="#b85450">可见「降序 + 超限剪枝」让 best=31 一旦找到即挡住大量分支</text>
</svg>
