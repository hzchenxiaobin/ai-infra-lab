<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold">book(start, end) 算法流程</text>

  <rect x="180" y="46" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">入口：book(start, end)</text>

  <path d="M 280 82 L 280 104" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="108" width="280" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="126" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">差分增量：两处点修改</text>
  <text x="280" y="142" text-anchor="middle" font-size="10.5" fill="#555">diff[start] += 1 ; diff[end] −= 1</text>

  <path d="M 280 150 L 280 172" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="176" width="280" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="198" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">初始化 cur = 0, ans = 0</text>

  <path d="M 280 212 L 280 234" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="280,238 400,288 280,338 160,288" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="282" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">遍历 diff 的键</text>
  <text x="280" y="298" text-anchor="middle" font-size="10.5" fill="#555">（按时间升序）</text>
  <text x="280" y="314" text-anchor="middle" font-size="10.5" fill="#555">还有未处理端点？</text>

  <path d="M 400 288 L 440 288" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="282" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">否</text>

  <rect x="404" y="272" width="72" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="440" y="287" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">返回 ans</text>
  <text x="440" y="299" text-anchor="middle" font-size="9" fill="#888">= k-booking</text>

  <path d="M 280 338 L 280 358" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="350" font-size="10" fill="#888" font-weight="bold">是</text>

  <rect x="100" y="362" width="360" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="380" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">取下一个端点 t 及其增量 d</text>
  <text x="280" y="396" text-anchor="middle" font-size="10.5" fill="#555">cur += d ; ans = max(ans, cur)</text>

  <path d="M 100 384 L 60 384 L 60 288 L 160 288" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="56" y="336" font-size="10" fill="#888" font-weight="bold">回循环</text>

  <text x="260" y="414" text-anchor="middle" font-size="10" fill="#888">每次 book：O(n) 扫描（n = 当前端点数），整体 O(n²)</text>
</svg>
