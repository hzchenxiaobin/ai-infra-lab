<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="350" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：n = 10 → m = 12，答案 85</text>

  <!-- table header -->
  <rect x="46" y="46" width="64" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="78" y="65" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">步骤</text>
  <rect x="110" y="46" width="118" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="169" y="65" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">操作</text>
  <rect x="228" y="46" width="118" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="287" y="65" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">值变化</text>
  <rect x="346" y="46" width="118" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="405" y="65" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">累计代价</text>

  <!-- rows: step / op / change / cost -->
  <rect x="46" y="80" width="64" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="78" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">初始</text>
  <rect x="110" y="80" width="118" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="169" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">—</text>
  <rect x="228" y="80" width="118" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="287" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10</text>
  <rect x="346" y="80" width="118" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="405" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10</text>

  <rect x="46" y="114" width="64" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="78" y="134" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="110" y="114" width="118" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="169" y="134" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">十位 +1</text>
  <rect x="228" y="114" width="118" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="287" y="134" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10 → 20</text>
  <rect x="346" y="114" width="118" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="405" y="134" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10+20=30</text>

  <rect x="46" y="148" width="64" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="78" y="168" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="110" y="148" width="118" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="169" y="168" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">个位 +1</text>
  <rect x="228" y="148" width="118" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="287" y="168" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">20 → 21</text>
  <rect x="346" y="148" width="118" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="405" y="168" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">30+21=51</text>

  <rect x="46" y="182" width="64" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="78" y="202" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="110" y="182" width="118" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="169" y="202" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">个位 +1</text>
  <rect x="228" y="182" width="118" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="287" y="202" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">21 → 22</text>
  <rect x="346" y="182" width="118" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="405" y="202" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">51+22=73</text>

  <!-- final row highlighted -->
  <rect x="46" y="216" width="64" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="78" y="236" text-anchor="middle" font-size="12" fill="#8a6a1a" filter="url(#rough2)">4</text>
  <rect x="110" y="216" width="118" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="169" y="236" text-anchor="middle" font-size="12" fill="#8a6a1a" filter="url(#rough2)">十位 −1</text>
  <rect x="228" y="216" width="118" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="287" y="236" text-anchor="middle" font-size="12" fill="#8a6a1a" filter="url(#rough2)">22 → 12</text>
  <rect x="346" y="216" width="118" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="405" y="236" text-anchor="middle" font-size="12" fill="#8a6a1a" filter="url(#rough2)">73+12=85</text>

  <!-- result bar -->
  <rect x="80" y="262" width="360" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="284" text-anchor="middle" font-size="13" fill="#2a4a1e" filter="url(#rough2)">弹出 m=12 时 dis=85，返回 85 ✓</text>

  <!-- note -->
  <text x="260" y="322" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">旁注：10→11 的近路被质数 11 挡住，只能绕行 20；个位 9→? 同理受限</text>
</svg>
