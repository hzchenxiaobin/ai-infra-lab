<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="520" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：压缩建图 → Dijkstra → 计数</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">Dijkstra 主体同 743 模板；后处理分原始节点 / 新节点两段</text>

  <!-- ===== Step 1: build graph ===== -->
  <rect x="60" y="58" width="380" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="250" y="80" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">① 压缩建图</text>
  <text x="250" y="98" text-anchor="middle" font-size="10" fill="#555">邻接表 graph[u]={(v, cnt+1)}；不建任何新节点</text>

  <path d="M 250 110 L 250 132" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: init ===== -->
  <rect x="100" y="134" width="300" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="250" y="158" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">② dist[0]=0，其余=∞；堆=[(0,0)]</text>

  <path d="M 250 176 L 250 198" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Diamond: heap empty? ===== -->
  <polygon points="250,200 320,236 250,272 180,236" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250" y="232" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">堆为空?</text>
  <text x="250" y="248" text-anchor="middle" font-size="9" fill="#888">是 → 进 ④</text>

  <!-- yes arrow right to count phase -->
  <path d="M 320 236 L 416 236" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="368" y="228" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="418" y="214" width="108" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="472" y="234" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">④ 计数</text>
  <text x="472" y="250" text-anchor="middle" font-size="9" fill="#555">见下方两段</text>

  <!-- no down -->
  <path d="M 250 272 L 250 294" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="262" y="286" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- ===== Step 3a: pop ===== -->
  <rect x="110" y="296" width="280" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="250" y="320" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">③ 弹出 (d,u)；若 d&gt;dist[u] 懒删除跳过</text>

  <path d="M 250 334 L 250 352" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3b: relax ===== -->
  <rect x="90" y="354" width="320" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="250" y="378" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">遍历出边 u→v(w)：d+w&lt;dist[v] 则更新+入堆</text>

  <!-- loop back -->
  <path d="M 250 394 L 250 416" stroke="#888" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="250" y="412" text-anchor="middle" font-size="9" fill="#888">（虚线 = 回 ② 循环）</text>

  <!-- ===== Counting phase (right side) ===== -->
  <rect x="60" y="430" width="200" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="160" y="454" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">原始节点：dist[i]≤maxMoves 计 1</text>

  <rect x="280" y="430" width="200" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="380" y="454" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">新节点：每边 min(cnt, a+b)</text>

  <rect x="120" y="480" width="300" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="500" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">合计 = 原始节点数 + Σ 每边新节点</text>
</svg>
