<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold" filter="url(#rough2)">罚金 x 与上凸的 f(j)：切点随 x 增大而左移，最优值 = 切线纵截距</text>

  <!-- 坐标轴 -->
  <path d="M 70 60 L 70 305" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 62 300 L 485 300" fill="none" stroke="#666" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="46" y="72" font-size="11" fill="#666" filter="url(#rough2)">f(j)</text>
  <text x="485" y="322" text-anchor="end" font-size="11" fill="#666" filter="url(#rough2)">段数 j</text>
  <text x="95" y="318" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="180" y="318" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="265" y="318" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="350" y="318" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>
  <text x="435" y="318" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">5</text>

  <!-- 切线 B：x 大，切点 j=2 -->
  <path d="M 70 263 L 292 55" fill="none" stroke="#446688" stroke-width="1.8" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="124" y="232" font-size="10" fill="#33507a" filter="url(#rough2)">x₂ 大 → 切点靠左（少选段）</text>
  <text x="78" y="281" font-size="10.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">g(x₂)</text>

  <!-- 切线 A：x 小，切点 j=4 -->
  <path d="M 70 179 L 475 36" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="108" y="150" font-size="10" fill="#8a6d1f" filter="url(#rough2)">x₁ 小 → 切点靠右（多选段）</text>
  <text x="78" y="196" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">g(x₁)</text>

  <!-- 上凸曲线 f(j) -->
  <polyline points="95,240 180,160 265,110 350,80 435,74" fill="none" stroke="#4a7a3a" stroke-width="2.6" filter="url(#rough2)"/>
  <circle cx="95" cy="240" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="265" cy="110" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="435" cy="74" r="4" fill="#4a7a3a" filter="url(#rough2)"/>

  <!-- 切点强调 -->
  <circle cx="350" cy="80" r="8" fill="none" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="350" cy="80" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="350" y="64" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">切点 j=4</text>
  <circle cx="180" cy="160" r="8" fill="none" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <circle cx="180" cy="160" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="180" y="145" text-anchor="middle" font-size="10.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">切点 j=2</text>

  <!-- 说明框 -->
  <rect x="312" y="200" width="196" height="98" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="410" y="221" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">g(x) = max( f(j) − x·j )</text>
  <text x="410" y="243" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">x ↑ ⟹ count(x) ↓</text>
  <text x="410" y="265" text-anchor="middle" font-size="10.5" fill="#444" filter="url(#rough2)">x* = 最小的 x：count(x) ≤ m</text>
  <text x="410" y="287" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans = g(x*) + x*·m</text>

  <!-- 纵截距小点 -->
  <circle cx="70" cy="179" r="3" fill="#d6a040" filter="url(#rough2)"/>
  <circle cx="70" cy="263" r="3" fill="#446688" filter="url(#rough2)"/>
</svg>
