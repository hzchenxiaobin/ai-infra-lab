<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#b85450" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="17" fill="#333"
        filter="url(#rough2)">核心观察：左右得分相等 ⟺ 2 × 前缀和 = 总和</text>

  <!-- 字符串格子 adcb -->
  <text x="60" y="62" font-size="12" fill="#446688" filter="url(#rough2)">s =</text>
  <g filter="url(#rough2)">
    <rect x="96" y="44" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="124" y="66" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">a</text>
    <rect x="152" y="44" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="180" y="66" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">d</text>
    <rect x="244" y="44" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="272" y="66" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">c</text>
    <rect x="300" y="44" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="328" y="66" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">b</text>
  </g>
  <!-- 每个字符的得分 -->
  <g filter="url(#rough2)" font-size="12" text-anchor="middle" fill="#446688">
    <text x="124" y="94">1</text>
    <text x="180" y="94">4</text>
    <text x="272" y="94">3</text>
    <text x="328" y="94">2</text>
  </g>
  <!-- 分割虚线（剪刀线） -->
  <path d="M 224 34 L 224 104" stroke="#b85450" stroke-width="2" stroke-dasharray="6 5" filter="url(#rough2)"/>
  <text x="224" y="122" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">拆分点 i = 1 ✂</text>

  <!-- 左右得分 -->
  <g filter="url(#rough2)">
    <rect x="96" y="136" width="112" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8"/>
    <text x="152" y="158" text-anchor="middle" font-size="12.5" fill="#4a7a3a">左 "ad" = 1+4 = <tspan font-weight="bold">5</tspan></text>
    <rect x="244" y="136" width="112" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <text x="300" y="158" text-anchor="middle" font-size="12.5" fill="#d6a040">右 "cb" = 3+2 = <tspan font-weight="bold">5</tspan></text>
  </g>
  <text x="382" y="158" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">相等 ✓</text>

  <!-- 公式框 -->
  <rect x="52" y="188" width="416" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12.5" fill="#446688" text-anchor="middle">
    <text x="260" y="210">左 = pre（前缀和），右 = total − pre</text>
    <text x="260" y="232">左右相等 ⟺ pre = total − pre ⟺ <tspan fill="#b85450" font-weight="bold">2 × pre = total</tspan></text>
  </g>

  <!-- 前缀和演示 -->
  <text x="60" y="278" font-size="12" fill="#446688" filter="url(#rough2)">pre：</text>
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <rect x="96" y="262" width="56" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="124" y="280" fill="#446688">1</text>
    <rect x="152" y="262" width="56" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="180" y="280" fill="#4a7a3a" font-weight="bold">5</text>
    <rect x="244" y="262" width="56" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="272" y="280" fill="#446688">8</text>
    <rect x="300" y="262" width="56" height="26" fill="#fafafa" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="328" y="280" fill="#446688">10</text>
  </g>
  <text x="372" y="280" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">total = 10</text>
  <text x="372" y="296" font-size="11.5" fill="#b85450" filter="url(#rough2)">2×5 = 10 ✓ 命中！</text>

  <!-- 审题警示 -->
  <rect x="40" y="310" width="440" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="328" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">⚠️ 拆分点 i 只能取 0 到 n−2：i = n−1 时右侧为空，非法！</text>
  <text x="260" y="344" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">两侧必须是非空子字符串</text>
</svg>
