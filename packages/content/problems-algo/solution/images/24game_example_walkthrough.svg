<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="14" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2e8b57"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="760" height="580" fill="#fdfcf7"/>

  <text x="380" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：cards = [1, 2, 3, 4]</text>
  <path d="M 210 38 Q 380 46 550 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="380" y="56" text-anchor="middle" font-size="11" fill="#888">展示一条成功路径 + 一条失败回溯分支</text>

  <!-- ===== 成功路径 (左侧) ===== -->
  <text x="190" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e8b57">✓ 成功路径</text>

  <!-- Step 0: [1,2,3,4] -->
  <g filter="url(#sk)"><rect x="40" y="94" width="300" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="55" y="116" font-size="10" fill="#888">初始:</text>
  <g filter="url(#sk)"><rect x="90" y="98" width="36" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="108" y="116" text-anchor="middle" font-size="12" fill="#4a8edb" font-weight="bold">1</text>
  <g filter="url(#sk)"><rect x="132" y="98" width="36" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="150" y="116" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
  <g filter="url(#sk)"><rect x="174" y="98" width="36" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="192" y="116" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
  <g filter="url(#sk)"><rect x="216" y="98" width="36" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="234" y="116" text-anchor="middle" font-size="12" fill="#4a8edb" font-weight="bold">4</text>
  <text x="262" y="116" font-size="10" fill="#d6a040">挑 2,3</text>

  <path d="M 150 124 Q 150 136 150 148" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>

  <!-- Step 1: [1, 6, 4] (2*3=6) -->
  <g filter="url(#sk)"><rect x="40" y="150" width="300" height="34" rx="6" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.3"/></g>
  <text x="55" y="172" font-size="10" fill="#888">2×3=6:</text>
  <g filter="url(#sk)"><rect x="90" y="154" width="36" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="108" y="172" text-anchor="middle" font-size="12" fill="#4a8edb" font-weight="bold">1</text>
  <g filter="url(#sk)"><rect x="132" y="154" width="36" height="26" rx="4" fill="#e6f4ea" stroke="#2e8b57" stroke-width="2"/></g>
  <text x="150" y="172" text-anchor="middle" font-size="12" fill="#2e8b57" font-weight="bold">6</text>
  <g filter="url(#sk)"><rect x="174" y="154" width="36" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="192" y="172" text-anchor="middle" font-size="12" fill="#4a8edb" font-weight="bold">4</text>
  <text x="222" y="172" font-size="10" fill="#d6a040">挑 1,6</text>

  <path d="M 150 180 Q 150 192 150 204" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>

  <!-- Step 2: [6, 4] -> 1*6=6 (wait, that doesn't work. Let me reconsider) -->
  <!-- Actually: pick 1 and 6, 1*6=6, then [6,4], 6*4=24 -->
  <g filter="url(#sk)"><rect x="40" y="206" width="300" height="34" rx="6" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.3"/></g>
  <text x="55" y="228" font-size="10" fill="#888">1×6=6:</text>
  <g filter="url(#sk)"><rect x="90" y="210" width="36" height="26" rx="4" fill="#e6f4ea" stroke="#2e8b57" stroke-width="2"/></g>
  <text x="108" y="228" text-anchor="middle" font-size="12" fill="#2e8b57" font-weight="bold">6</text>
  <g filter="url(#sk)"><rect x="132" y="210" width="36" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="150" y="228" text-anchor="middle" font-size="12" fill="#4a8edb" font-weight="bold">4</text>
  <text x="180" y="228" font-size="10" fill="#d6a040">挑 6,4</text>

  <path d="M 150 236 Q 150 248 150 260" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>

  <!-- Step 3: [24] -->
  <g filter="url(#sk)"><rect x="40" y="262" width="300" height="34" rx="6" fill="#e6f4ea" stroke="#2e8b57" stroke-width="2"/></g>
  <text x="55" y="284" font-size="10" fill="#888">6×4=24:</text>
  <g filter="url(#sk)"><rect x="110" y="266" width="48" height="26" rx="4" fill="#e6f4ea" stroke="#2e8b57" stroke-width="2.5"/></g>
  <text x="134" y="284" text-anchor="middle" font-size="13" fill="#2e8b57" font-weight="bold">24</text>
  <text x="170" y="284" font-size="11" fill="#2e8b57" font-weight="bold">|24−24|&lt;ε → true ✓</text>

  <path d="M 190 296 Q 190 308 190 320" stroke="#2e8b57" stroke-width="1.6" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>

  <!-- 结论 -->
  <g filter="url(#sk)"><rect x="60" y="322" width="260" height="40" rx="8" fill="#e6f4ea" stroke="#2e8b57" stroke-width="2"/></g>
  <text x="190" y="340" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">等价表达式：(1×2)×3×4 = 24</text>
  <text x="190" y="356" text-anchor="middle" font-size="10" fill="#2e6e2e">归约顺序 2×3→6, 1×6→6, 6×4→24</text>

  <!-- ===== 失败回溯分支 (右侧) ===== -->
  <text x="580" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">✗ 失败回溯分支</text>

  <!-- Step 0: [1,2,3,4] -->
  <g filter="url(#sk)"><rect x="420" y="94" width="300" height="34" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="435" y="116" font-size="10" fill="#888">初始:</text>
  <g filter="url(#sk)"><rect x="470" y="98" width="36" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="488" y="116" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <g filter="url(#sk)"><rect x="512" y="98" width="36" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/></g>
  <text x="530" y="116" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
  <g filter="url(#sk)"><rect x="554" y="98" width="36" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="572" y="116" text-anchor="middle" font-size="12" fill="#4a8edb" font-weight="bold">3</text>
  <g filter="url(#sk)"><rect x="596" y="98" width="36" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="614" y="116" text-anchor="middle" font-size="12" fill="#4a8edb" font-weight="bold">4</text>
  <text x="642" y="116" font-size="10" fill="#d6a040">挑 1,2</text>

  <path d="M 530 124 Q 530 136 530 148" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>

  <!-- Step 1: [3, 3, 4] (1+2=3) -->
  <g filter="url(#sk)"><rect x="420" y="150" width="300" height="34" rx="6" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.3"/></g>
  <text x="435" y="172" font-size="10" fill="#888">1+2=3:</text>
  <g filter="url(#sk)"><rect x="470" y="154" width="36" height="26" rx="4" fill="#e6f4ea" stroke="#2e8b57" stroke-width="2"/></g>
  <text x="488" y="172" text-anchor="middle" font-size="12" fill="#2e8b57" font-weight="bold">3</text>
  <g filter="url(#sk)"><rect x="512" y="154" width="36" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="530" y="172" text-anchor="middle" font-size="12" fill="#4a8edb" font-weight="bold">3</text>
  <g filter="url(#sk)"><rect x="554" y="154" width="36" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="572" y="172" text-anchor="middle" font-size="12" fill="#4a8edb" font-weight="bold">4</text>
  <text x="600" y="172" font-size="10" fill="#d6a040">挑 3,3</text>

  <path d="M 530 180 Q 530 192 530 204" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>

  <!-- Step 2: [0, 4] (3-3=0) -->
  <g filter="url(#sk)"><rect x="420" y="206" width="300" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/></g>
  <text x="435" y="228" font-size="10" fill="#888">3−3=0:</text>
  <g filter="url(#sk)"><rect x="470" y="210" width="36" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="488" y="228" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0</text>
  <g filter="url(#sk)"><rect x="512" y="210" width="36" height="26" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="530" y="228" text-anchor="middle" font-size="12" fill="#4a8edb" font-weight="bold">4</text>
  <text x="560" y="228" font-size="10" fill="#d6a040">挑 0,4</text>

  <path d="M 530 236 Q 530 248 530 260" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>

  <!-- Step 3: 全部失败 -->
  <g filter="url(#sk)"><rect x="420" y="262" width="300" height="60" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="570" y="282" text-anchor="middle" font-size="10" fill="#b85450">0+4=4, 0−4=−4, 4−0=4</text>
  <text x="570" y="296" text-anchor="middle" font-size="10" fill="#b85450">0×4=0, 0÷4=0, 4÷0 跳过</text>
  <text x="570" y="312" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">无一等于 24 → 回溯 ↑</text>

  <!-- 回溯箭头 -->
  <path d="M 570 322 Q 690 322 690 172" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="5,3" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="700" y="250" font-size="10" fill="#b85450" font-weight="bold" transform="rotate(90 700 250)">回溯，试其他运算/其他对</text>

  <!-- 底部总结 -->
  <g filter="url(#sk)"><rect x="40" y="400" width="680" height="150" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="380" y="424" text-anchor="middle" font-size="13" fill="#2b6e9e" font-weight="bold">多条成功路径（仅列几条）</text>

  <text x="60" y="448" font-size="11" fill="#2e8b57" font-weight="bold">① (1×2)×3×4 = 24</text>
  <text x="60" y="466" font-size="10" fill="#888">归约: 2×3→6, 1×6→6, 6×4→24</text>

  <text x="60" y="488" font-size="11" fill="#2e8b57" font-weight="bold">② (1+2+3)×4 = 24</text>
  <text x="60" y="506" font-size="10" fill="#888">归约: 1+2→3, 3+3→6, 6×4→24</text>

  <text x="390" y="448" font-size="11" fill="#2e8b57" font-weight="bold">③ 2×(3+4+1) = 16 ✗（非24）</text>
  <text x="390" y="466" font-size="10" fill="#888">说明: 不是所有路径都成功，</text>
  <text x="390" y="480" font-size="10" fill="#888">需穷举所有可能</text>

  <text x="390" y="500" font-size="11" fill="#b85450" font-weight="bold">cards=[1,2,1,2] → false</text>
  <text x="390" y="518" font-size="10" fill="#888">穷举所有 3888 种归约均不命中 24</text>

  <text x="380" y="548" text-anchor="middle" font-size="10" fill="#2b6e9e">💡 DFS 会自动穷举所有「选对→运算→递归」组合，任一命中即短路返回 true</text>
</svg>
