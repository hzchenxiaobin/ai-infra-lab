<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：贪心从左到右，每个元素只需抬到「前一个 + 1」</text>

  <!-- Original array label -->
  <text x="50" y="70" font-size="12" fill="#888">原数组 nums = [1, 1, 1]</text>

  <!-- Original row: three cells -->
  <rect x="80" y="82" width="70" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="110" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>
  <text x="115" y="138" text-anchor="middle" font-size="10" fill="#446688">i=0 锚定</text>

  <rect x="170" y="82" width="70" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="205" y="110" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">1</text>
  <text x="205" y="138" text-anchor="middle" font-size="10" fill="#b85450">≤ 1 ✗</text>

  <rect x="260" y="82" width="70" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="295" y="110" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">1</text>
  <text x="295" y="138" text-anchor="middle" font-size="10" fill="#b85450">≤ 1 ✗</text>

  <!-- Arrow down -->
  <path d="M 205 150 L 205 168" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="215" y="164" font-size="10" fill="#888">+1 次</text>
  <path d="M 295 150 L 295 168" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- After processing row -->
  <text x="50" y="190" font-size="12" fill="#888">调整后：</text>

  <rect x="80" y="202" width="70" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="230" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>

  <rect x="170" y="202" width="70" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="205" y="230" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="205" y="258" text-anchor="middle" font-size="10" fill="#4a7a3a">= 1+1 ✓</text>

  <rect x="260" y="202" width="70" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="295" y="230" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">1</text>
  <text x="295" y="258" text-anchor="middle" font-size="10" fill="#d6a040">≤ 2 ✗</text>

  <!-- Arrow down -->
  <path d="M 295 270 L 295 288" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="305" y="284" font-size="10" fill="#888">+2 次</text>

  <!-- Final row -->
  <text x="50" y="310" font-size="12" fill="#888">最终：</text>

  <rect x="80" y="322" width="70" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="350" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>

  <rect x="170" y="322" width="70" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="205" y="350" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">2</text>

  <rect x="260" y="322" width="70" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="295" y="350" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="295" y="378" text-anchor="middle" font-size="10" fill="#4a7a3a">= 2+1 ✓</text>

  <!-- Core idea box -->
  <rect x="370" y="82" width="210" height="200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="475" y="108" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">贪心策略</text>
  <text x="475" y="132" text-anchor="middle" font-size="11" fill="#666">从左到右扫描：</text>
  <text x="475" y="152" text-anchor="middle" font-size="11" fill="#666">若 nums[i] ≤ nums[i-1]</text>
  <text x="475" y="172" text-anchor="middle" font-size="11" fill="#666">则抬到 nums[i-1]+1</text>
  <text x="475" y="194" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">多抬一点 = 浪费</text>
  <text x="475" y="212" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">少抬一点 = 不递增</text>
  <text x="475" y="236" text-anchor="middle" font-size="11" fill="#666">恰抬到 prev+1 最优</text>
  <text x="475" y="260" text-anchor="middle" font-size="10" fill="#888">ops = max(0, prev+1 - nums[i])</text>

  <!-- Total ops -->
  <rect x="370" y="300" width="210" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="475" y="325" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">总操作次数 = 1 + 2 = 3</text>
</svg>
