<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：一趟扫描 → 闭式一步出答案</text>

  <ellipse cx="200" cy="58" rx="48" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="63" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">开始</text>

  <path d="M 200 76 L 200 92" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="110" y="96" width="180" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="115" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">mx = 0，s = 0，i = 0</text>

  <path d="M 200 126 L 200 144" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="200,148 296,182 200,216 104,182" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="180" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i &lt; n ?</text>

  <path d="M 296 182 L 350 182" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="174" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="354" y="152" width="142" height="60" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="425" y="172" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">mx = max(mx, nums[i])</text>
  <text x="425" y="188" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">s += nums[i]</text>
  <text x="425" y="204" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">i += 1</text>

  <path d="M 425 152 L 425 84 L 64 84 L 64 182 L 100 182" fill="none" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="140" y="78" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">循环 n 次</text>

  <path d="M 200 216 L 200 240" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="212" y="233" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="90" y="244" width="220" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="264" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">ans = n · mx − s</text>
  <text x="200" y="284" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">= Σ (mx − nums[i])</text>

  <path d="M 200 294 L 200 310" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <ellipse cx="200" cy="330" rx="48" ry="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="335" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">返回 ans</text>

  <rect x="354" y="244" width="142" height="78" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="425" y="264" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">注意：值域放大时</text>
  <text x="425" y="281" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">n · mx 可达 10¹⁰</text>
  <text x="425" y="298" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">相乘前先转</text>
  <text x="425" y="315" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">long long</text>
</svg>
