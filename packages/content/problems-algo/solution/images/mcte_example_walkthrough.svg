<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：answerKey="TTFTTFTT", k=1</text>

  <!-- ============ header row: indices + chars ============ -->
  <text x="50" y="56" font-size="10" fill="#888">下标</text>
  <text x="120" y="56" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">0</text>
  <text x="160" y="56" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">1</text>
  <text x="200" y="56" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">2</text>
  <text x="240" y="56" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">3</text>
  <text x="280" y="56" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">4</text>
  <text x="320" y="56" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">5</text>
  <text x="360" y="56" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">6</text>
  <text x="400" y="56" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">7</text>

  <text x="50" y="78" font-size="11" fill="#555" font-weight="bold">字符</text>
  <!-- char cells -->
  <rect x="100" y="62" width="40" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="120" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">T</text>
  <rect x="140" y="62" width="40" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="160" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">T</text>
  <rect x="180" y="62" width="40" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="200" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">F</text>
  <rect x="220" y="62" width="40" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="240" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">T</text>
  <rect x="260" y="62" width="40" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="280" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">T</text>
  <rect x="300" y="62" width="40" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="320" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">F</text>
  <rect x="340" y="62" width="40" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="360" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">T</text>
  <rect x="380" y="62" width="40" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="400" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">T</text>

  <!-- ============ Pass 1 ============ -->
  <text x="50" y="118" font-size="12" fill="#446688" font-weight="bold">第一遍 longest('T')：窗口内 F ≤ 1</text>

  <!-- step right=4: window [0,4] peak -->
  <text x="50" y="142" font-size="10" fill="#666">right=4</text>
  <text x="110" y="142" font-size="10" fill="#888">窗口[0,4], flip=1, ans=5 ⭐</text>
  <!-- window highlight row -->
  <rect x="100" y="148" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="140" y="148" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="180" y="148" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="200" y="166" text-anchor="middle" font-size="11" fill="#b87a20" font-weight="bold">F↑</text>
  <rect x="220" y="148" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="260" y="148" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <!-- bracket -->
  <path d="M 100 180 Q 100 186 104 186 L 296 186 Q 300 186 300 180" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="200" y="200" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">"TTFTT" 1个F → 翻成 "TTTTT" 长度5</text>

  <!-- step right=5: shrink -->
  <text x="50" y="226" font-size="10" fill="#666">right=5</text>
  <text x="110" y="226" font-size="10" fill="#b85450">遇F, flip=2&gt;1 → 左缩 left 0→3</text>
  <!-- show window before shrink: [0,5] illegal -->
  <rect x="100" y="232" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="140" y="232" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="180" y="232" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="220" y="232" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="260" y="232" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="300" y="232" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="320" y="248" text-anchor="middle" font-size="10" fill="#b87a20" font-weight="bold">F↑</text>
  <!-- arrow down -->
  <path d="M 300 258 L 300 268" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="360" y="266" font-size="10" fill="#b85450">flip 2→1</text>

  <!-- after shrink: window [3,5] -->
  <rect x="100" y="272" width="120" height="22" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="160" y="288" text-anchor="middle" font-size="9" fill="#bbb">移出 (含1个F)</text>
  <rect x="220" y="272" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="260" y="272" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="300" y="272" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="320" y="288" text-anchor="middle" font-size="10" fill="#b87a20">F</text>
  <path d="M 220 298 Q 220 304 224 304 L 316 304 Q 320 304 320 298" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="270" y="318" text-anchor="middle" font-size="10" fill="#4a7a3a">窗口[3,5] flip=1 合法, ans仍=5</text>

  <!-- Pass 1 result -->
  <rect x="40" y="328" width="240" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="160" y="346" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">第一遍结果 = 5</text>

  <!-- ============ Pass 2 ============ -->
  <text x="320" y="118" font-size="12" fill="#b85450" font-weight="bold">第二遍 longest('F')：窗口内 T ≤ 1</text>

  <!-- step right=2: best window [1,2] -->
  <text x="320" y="142" font-size="10" fill="#666">right=2</text>
  <text x="380" y="142" font-size="10" fill="#888">窗口[1,2], flip=1, ans=2</text>
  <rect x="140" y="148" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="160" y="166" text-anchor="middle" font-size="11" fill="#b83a30" font-weight="bold">T↑</text>
  <rect x="180" y="148" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <path d="M 140 180 Q 140 186 144 186 L 216 186 Q 220 186 220 180" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="180" y="200" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">"TF" 1个T → 翻成 "FF" 长度2</text>

  <!-- note: T too dense -->
  <text x="320" y="226" font-size="10" fill="#888">right=3 遇T, flip=2&gt;1 → 左缩</text>
  <text x="320" y="242" font-size="10" fill="#888">right=4 遇T, flip=2&gt;1 → 再左缩</text>
  <text x="320" y="258" font-size="10" fill="#888">T 太密，k=1 只够翻1个</text>
  <text x="320" y="274" font-size="10" fill="#888">每加一个T都要缩掉一个T</text>
  <text x="320" y="290" font-size="10" fill="#888">窗口最多容纳 1T + 若干F</text>

  <!-- Pass 2 result -->
  <rect x="320" y="328" width="240" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="440" y="346" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">第二遍结果 = 2</text>

  <!-- ============ final answer ============ -->
  <rect x="80" y="384" width="440" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="12" filter="url(#rough2)"/>
  <text x="300" y="408" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">答案 = max(5, 2) = 5</text>
  <text x="300" y="428" text-anchor="middle" font-size="11" fill="#777">T 多 F 少 → 保留 T 的那一遍胜出</text>

  <!-- legend -->
  <rect x="80" y="456" width="440" height="60" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="300" y="474" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">图例</text>
  <rect x="96" y="482" width="14" height="14" fill="#e8f0fe" stroke="#446688" rx="2" filter="url(#rough2)"/>
  <text x="116" y="494" font-size="9" fill="#666">保留字符(T)</text>
  <rect x="196" y="482" width="14" height="14" fill="#fff8e1" stroke="#d6a040" rx="2" filter="url(#rough2)"/>
  <text x="216" y="494" font-size="9" fill="#666">需翻转(F)</text>
  <rect x="296" y="482" width="14" height="14" fill="#fce4ec" stroke="#b85450" rx="2" filter="url(#rough2)"/>
  <text x="316" y="494" font-size="9" fill="#666">需翻转(T)</text>
  <rect x="396" y="482" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" rx="2" filter="url(#rough2)"/>
  <text x="416" y="494" font-size="9" fill="#666">保留字符(F)</text>
  <text x="300" y="510" text-anchor="middle" font-size="9" fill="#999">↑ 标记入窗触发计数的字符</text>
</svg>
