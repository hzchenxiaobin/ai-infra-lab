<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：abaacbcbb → 5，aa → 2</text>
  <text x="210" y="48" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 1：s = "abaacbcbb"（a×3、b×4、c×2）</text>

  <!-- 表头 -->
  <rect x="30" y="60" width="50" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="81" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">字母</text>
  <rect x="80" y="60" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="81" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">频次</text>
  <rect x="140" y="60" width="80" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="81" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">≥ 3 ?</text>
  <rect x="220" y="60" width="110" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="275" y="81" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">削减轨迹</text>
  <rect x="330" y="60" width="60" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="81" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">残留</text>

  <!-- 行 a -->
  <rect x="30" y="92" width="50" height="32" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="55" y="113" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="80" y="92" width="60" height="32" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="113" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="140" y="92" width="80" height="32" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="113" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <rect x="220" y="92" width="110" height="32" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="275" y="113" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">3 → 1</text>
  <rect x="330" y="92" width="60" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="360" y="113" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- 行 b -->
  <rect x="30" y="124" width="50" height="32" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="55" y="145" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="80" y="124" width="60" height="32" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="145" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">4</text>
  <rect x="140" y="124" width="80" height="32" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="145" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <rect x="220" y="124" width="110" height="32" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="275" y="145" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">4 → 2</text>
  <rect x="330" y="124" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="360" y="145" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- 行 c -->
  <rect x="30" y="156" width="50" height="32" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="55" y="177" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="80" y="156" width="60" height="32" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="177" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="140" y="156" width="80" height="32" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="177" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <rect x="220" y="156" width="110" height="32" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="275" y="177" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">2（动不了）</text>
  <rect x="330" y="156" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="360" y="177" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- 合计行 -->
  <rect x="30" y="188" width="360" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="210" y="209" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">合计 ans = 1 + 2 + 2 = 5</text>

  <!-- 右：示例 2 -->
  <rect x="410" y="60" width="90" height="160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="455" y="82" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">示例 2</text>
  <text x="455" y="104" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">s = "aa"</text>
  <text x="455" y="128" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">a 频次 2 &lt; 3</text>
  <text x="455" y="148" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">一次也动不了</text>
  <text x="455" y="176" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2 − 2%2 = 2</text>
  <text x="455" y="202" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">答案 2</text>

  <!-- 官方操作还原 -->
  <rect x="30" y="236" width="470" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="265" y="258" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">官方操作还原：选 i=2 的 a，删下标 0、3 → "bacbcbb"</text>
  <text x="265" y="280" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">再选下标 3 的 b，删下标 0、5 → "acbcb"，长度 5 ✓</text>

  <!-- 结论核对 -->
  <rect x="30" y="312" width="470" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="265" y="335" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">结论核对：残留 a:1 + b:2 + c:2 = 5，公式与逐步模拟完全一致</text>
</svg>
