<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="360" fill="#fafafa"/>

  <text x="290" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：递归炸行 → 分组计数 → 双降序 Top-3</text>

  <rect x="18" y="50" width="100" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="68" y="70" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">① FROM/WHERE</text>
  <text x="68" y="86" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">含 # 的推文</text>
  <text x="68" y="100" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">7 行</text>

  <path d="M 118 81 L 130 81" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="132" y="50" width="104" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="184" y="70" text-anchor="middle" font-size="10" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">② 递归 CTE</text>
  <text x="184" y="86" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">炸行：一行一标签</text>
  <text x="184" y="100" text-anchor="middle" font-size="8.5" fill="#8a6d1a" filter="url(#rough2)">14 行提及 ★新增</text>

  <path d="M 236 81 L 248 81" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="250" y="50" width="100" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="70" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">③ GROUP BY</text>
  <text x="300" y="86" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">hashtag + COUNT(*)</text>
  <text x="300" y="100" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">14 行 → 11 组</text>

  <path d="M 350 81 L 362 81" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="364" y="50" width="98" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="413" y="70" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">④ ORDER BY</text>
  <text x="413" y="86" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">count↓, hashtag↓</text>
  <text x="413" y="100" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">9 个并列定序</text>

  <path d="M 462 81 L 474 81" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="476" y="50" width="88" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="520" y="70" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⑤ LIMIT 3</text>
  <text x="520" y="86" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">截断唯一确定</text>
  <text x="520" y="100" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">3 行输出</text>

  <text x="290" y="134" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">▼ 数据怎么变（示例 7 条推文，每条恰好 2 个标签）▼</text>

  <rect x="22" y="148" width="110" height="128" fill="#fff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="77" y="168" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">7 条推文</text>
  <text x="34" y="188" font-size="8.5" fill="#333" filter="url(#rough2)">13 | 02-01</text>
  <text x="34" y="202" font-size="8.5" fill="#333" filter="url(#rough2)">14 | 02-03</text>
  <text x="34" y="216" font-size="8.5" fill="#333" filter="url(#rough2)">15 | 02-04</text>
  <text x="34" y="230" font-size="8.5" fill="#333" filter="url(#rough2)">16 | 02-04</text>
  <text x="34" y="244" font-size="8.5" fill="#333" filter="url(#rough2)">17 | 02-05</text>
  <text x="34" y="258" font-size="8.5" fill="#333" filter="url(#rough2)">18 | 02-07</text>
  <text x="34" y="272" font-size="8.5" fill="#333" filter="url(#rough2)">19 | 02-09</text>

  <path d="M 134 212 L 156 212" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="145" y="202" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">炸行</text>

  <rect x="160" y="148" width="130" height="128" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="225" y="168" text-anchor="middle" font-size="10" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">14 行提及</text>
  <text x="172" y="188" font-size="8.5" fill="#b85450" filter="url(#rough2)">#HappyDay ×3</text>
  <text x="172" y="202" font-size="8.5" fill="#b85450" filter="url(#rough2)">#TechLife ×2</text>
  <text x="172" y="216" font-size="8.5" fill="#b85450" filter="url(#rough2)">#WorkLife ×1</text>
  <text x="172" y="230" font-size="8.5" fill="#b85450" filter="url(#rough2)">#ProductiveDay ×1</text>
  <text x="172" y="244" font-size="8.5" fill="#b85450" filter="url(#rough2)">#MorningVibes ×1</text>
  <text x="172" y="258" font-size="8.5" fill="#b85450" filter="url(#rough2)">#FeelGood ×1 …</text>
  <text x="172" y="272" font-size="8.5" fill="#8a6d1a" filter="url(#rough2)">（共 11 种标签）</text>

  <path d="M 292 212 L 314 212" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="303" y="202" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">分组</text>

  <rect x="318" y="148" width="120" height="128" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="378" y="168" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">11 组计数</text>
  <text x="330" y="192" font-size="9" fill="#333" filter="url(#rough2)">#HappyDay</text>
  <text x="426" y="192" text-anchor="end" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="330" y="216" font-size="9" fill="#333" filter="url(#rough2)">#TechLife</text>
  <text x="426" y="216" text-anchor="end" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="330" y="240" font-size="9" fill="#333" filter="url(#rough2)">9 个标签</text>
  <text x="426" y="240" text-anchor="end" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">各 1</text>
  <text x="378" y="266" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">3 + 2 + 9×1 = 14 ✓</text>

  <path d="M 440 212 L 458 212" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="449" y="202" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">Top-3</text>

  <rect x="462" y="148" width="100" height="128" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="512" y="168" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">输出 Top-3</text>
  <text x="512" y="192" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">#HappyDay 3</text>
  <text x="512" y="216" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">#TechLife 2</text>
  <text x="512" y="240" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">#WorkLife 1 ★</text>
  <text x="512" y="264" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">其余 8 个出局</text>

  <rect x="40" y="292" width="500" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="290" y="311" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">递归终止闸门：WHERE LOCATE('#', rest, 2) &gt; 0——rest 里没有下一个 # 就停止繁殖；</text>
  <text x="290" y="328" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">题面保证全在 2024-02 → 日期过滤可省（3087 必须写）；聚合后半段与前作完全一致，</text>
  <text x="290" y="342" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">Medium → Hard 的增量全在 ②：一行多标签 → 一行一标签的炸行</text>
</svg>
