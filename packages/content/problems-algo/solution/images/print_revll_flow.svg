<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">多趟遍历法流程：先计数，再倒序打印</text>

  <!-- Step 1: count -->
  <rect x="40" y="48" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">Step 1：计数</text>
  <text x="130" y="82" text-anchor="middle" font-size="10.5" fill="#888">遍历链表求长度 n</text>

  <!-- arrow -->
  <path d="M 130 92 L 130 106" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: loop init -->
  <rect x="40" y="110" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="128" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">Step 2：i = n</text>
  <text x="130" y="144" text-anchor="middle" font-size="10.5" fill="#888">从最后一个节点开始</text>

  <!-- arrow -->
  <path d="M 130 154 L 130 168" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Decision: i >= 1? -->
  <polygon points="130,172 220,210 130,248 40,210" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="130" y="206" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">i ≥ 1 ?</text>
  <text x="130" y="222" text-anchor="middle" font-size="10.5" fill="#888">还有节点要打印？</text>

  <!-- No branch (right) -->
  <path d="M 220 210 L 270 210" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="236" y="204" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="276" y="194" width="120" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="336" y="215" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">结束</text>

  <!-- Yes branch (down) -->
  <path d="M 130 248 L 130 262" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="138" y="260" font-size="11" fill="#b85450" font-weight="bold">是</text>

  <!-- Step 3: traverse to i-th -->
  <rect x="30" y="266" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="284" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">Step 3：走 i 步</text>
  <text x="130" y="300" text-anchor="middle" font-size="10.5" fill="#888">从 head 走 i−1 步到第 i 个</text>

  <!-- arrow -->
  <path d="M 130 310 L 130 324" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 4: print -->
  <rect x="30" y="328" width="200" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="346" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">Step 4：print(getValue())</text>
  <text x="130" y="362" text-anchor="middle" font-size="10.5" fill="#888">打印第 i 个节点的值</text>

  <!-- loop back: i-- then back to decision -->
  <!-- arrow from step4 right, then up -->
  <path d="M 230 348 L 290 348" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 290 348 L 290 210" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 290 210 L 220 210" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="244" y="352" width="92" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="368" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">i = i − 1</text>

  <!-- Side note box -->
  <rect x="350" y="270" width="170" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="435" y="292" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">关键洞察</text>
  <text x="358" y="312" font-size="10.5" fill="#555">链表不可变、无 prev</text>
  <text x="358" y="328" font-size="10.5" fill="#555">指针，只能从头走。</text>
  <text x="358" y="344" font-size="10.5" fill="#555">用「时间换空间」：</text>
  <text x="358" y="358" font-size="10.5" fill="#555">每趟重走一遍 = O(1) 空间</text>
</svg>
