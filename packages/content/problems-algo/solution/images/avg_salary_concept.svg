<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">
    两层聚合：公司级 vs 部门级（以 2017-03 为例）
  </text>

  <!-- ===== 左侧：公司级聚合 ===== -->
  <rect x="30" y="58" width="220" height="250" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="82" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">
    公司级：PARTITION BY pay_month
  </text>

  <!-- 三行工资 -->
  <rect x="55" y="100" width="170" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="70" y="120" font-size="12" fill="#333" filter="url(#rough2)">emp1·dept1</text>
  <text x="205" y="120" text-anchor="end" font-size="13" fill="#b85450" filter="url(#rough2)">9000</text>

  <rect x="55" y="138" width="170" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="70" y="158" font-size="12" fill="#333" filter="url(#rough2)">emp2·dept2</text>
  <text x="205" y="158" text-anchor="end" font-size="13" fill="#4a7a3a" filter="url(#rough2)">6000</text>

  <rect x="55" y="176" width="170" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="70" y="196" font-size="12" fill="#333" filter="url(#rough2)">emp3·dept2</text>
  <text x="205" y="196" text-anchor="end" font-size="13" fill="#4a7a3a" filter="url(#rough2)">10000</text>

  <!-- 求和线 -->
  <path d="M55,220 L225,220" stroke="#446688" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="140" y="244" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">
    AVG(9000,6000,10000)
  </text>
  <rect x="70" y="256" width="140" height="34" rx="6" fill="#446688" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="278" text-anchor="middle" font-size="15" fill="#fff" filter="url(#rough2)">
    公司 avg = 8333.33
  </text>

  <!-- ===== 右侧：部门级聚合 ===== -->
  <rect x="300" y="58" width="230" height="250" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="415" y="82" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">
    部门级：PARTITION BY 月份+部门
  </text>

  <!-- dept1 -->
  <rect x="320" y="100" width="190" height="62" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="332" y="120" font-size="12" fill="#d6a040" filter="url(#rough2)">dept1：[9000]</text>
  <text x="332" y="146" font-size="14" fill="#333" filter="url(#rough2)">AVG = 9000</text>

  <!-- dept2 -->
  <rect x="320" y="178" width="190" height="78" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="332" y="198" font-size="12" fill="#d6a040" filter="url(#rough2)">dept2：[6000, 10000]</text>
  <text x="332" y="224" font-size="14" fill="#333" filter="url(#rough2)">AVG = 8000</text>

  <!-- ===== 底部比较 ===== -->
  <text x="280" y="340" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    部门 avg 与 公司 avg 比较 → higher / lower / same
  </text>

  <!-- dept1 vs company -->
  <path d="M415,131 L210,273" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="430" y="330" width="120" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="350" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">dept1 ↑ higher</text>

  <!-- dept2 vs company -->
  <path d="M415,217 L210,273" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="10" y="330" width="120" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="350" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">dept2 ↓ lower</text>
</svg>
