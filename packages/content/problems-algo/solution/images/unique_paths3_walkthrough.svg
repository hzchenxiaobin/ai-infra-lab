<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M 0 0 L 7 3 L 0 6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="340" fill="#fafafa"/>

  <text x="360" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：3×4 网格，两条走遍全部 11 格的路径</text>
  <text x="360" y="44" text-anchor="middle" font-size="11" fill="#888">empty=10，target=11；格中数字 = 步号（0=起点 → 10=终点），无障碍格全走过</text>

  <!-- ===== Path 1 (left grid, x origin 40) ===== -->
  <text x="120" y="72" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">路径 1：先向右走顶行</text>
  <g font-size="11">
    <!-- row 0: step0(1) step1(0) step2(0) step3(0) -->
    <rect x="40" y="80" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="60" y="100" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <text x="60" y="114" text-anchor="middle" font-size="9" fill="#4a7a3a">1</text>
    <rect x="80" y="80" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="100" y="100" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <text x="100" y="114" text-anchor="middle" font-size="9" fill="#888">0</text>
    <rect x="120" y="80" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="140" y="100" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <text x="140" y="114" text-anchor="middle" font-size="9" fill="#888">0</text>
    <rect x="160" y="80" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="180" y="100" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <text x="180" y="114" text-anchor="middle" font-size="9" fill="#888">0</text>
    <!-- row 1: step7 step6 step5 step4 -->
    <rect x="40" y="120" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="60" y="140" text-anchor="middle" fill="#446688" font-weight="bold">7</text>
    <text x="60" y="154" text-anchor="middle" font-size="9" fill="#888">0</text>
    <rect x="80" y="120" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="100" y="140" text-anchor="middle" fill="#446688" font-weight="bold">6</text>
    <text x="100" y="154" text-anchor="middle" font-size="9" fill="#888">0</text>
    <rect x="120" y="120" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="140" y="140" text-anchor="middle" fill="#446688" font-weight="bold">5</text>
    <text x="140" y="154" text-anchor="middle" font-size="9" fill="#888">0</text>
    <rect x="160" y="120" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="180" y="140" text-anchor="middle" fill="#446688" font-weight="bold">4</text>
    <text x="180" y="154" text-anchor="middle" font-size="9" fill="#888">0</text>
    <!-- row 2: step8 step9 step10(2) obstacle -->
    <rect x="40" y="160" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="60" y="180" text-anchor="middle" fill="#446688" font-weight="bold">8</text>
    <text x="60" y="194" text-anchor="middle" font-size="9" fill="#888">0</text>
    <rect x="80" y="160" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="100" y="180" text-anchor="middle" fill="#446688" font-weight="bold">9</text>
    <text x="100" y="194" text-anchor="middle" font-size="9" fill="#888">0</text>
    <rect x="120" y="160" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
    <text x="140" y="180" text-anchor="middle" fill="#d6a040" font-weight="bold">10</text>
    <text x="140" y="194" text-anchor="middle" font-size="9" fill="#d6a040">2</text>
    <rect x="160" y="160" width="40" height="40" fill="#eeeeee" stroke="#999" stroke-width="1.2" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="180" y="180" text-anchor="middle" fill="#999">-1</text>
  </g>
  <!-- path 1 polyline through cell centers -->
  <polyline points="60,100 100,100 140,100 180,100 180,140 140,140 100,140 60,140 60,180 100,180 140,180"
            fill="none" stroke="#4a7a3a" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"
            marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="120" y="220" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">walked=10，walked+1=11==target ✓</text>

  <!-- divider -->
  <path d="M 300 90 L 300 200" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Path 2 (right grid, x origin 380) ===== -->
  <text x="460" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">路径 2：先向下走左列</text>
  <g font-size="11">
    <!-- row 0: step0(1) step5 step6 step7 -->
    <rect x="380" y="80" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="400" y="100" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <text x="400" y="114" text-anchor="middle" font-size="9" fill="#4a7a3a">1</text>
    <rect x="420" y="80" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="440" y="100" text-anchor="middle" fill="#446688" font-weight="bold">5</text>
    <text x="440" y="114" text-anchor="middle" font-size="9" fill="#888">0</text>
    <rect x="460" y="80" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="480" y="100" text-anchor="middle" fill="#446688" font-weight="bold">6</text>
    <text x="480" y="114" text-anchor="middle" font-size="9" fill="#888">0</text>
    <rect x="500" y="80" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="520" y="100" text-anchor="middle" fill="#446688" font-weight="bold">7</text>
    <text x="520" y="114" text-anchor="middle" font-size="9" fill="#888">0</text>
    <!-- row 1: step1 step4 step9 step8 -->
    <rect x="380" y="120" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="400" y="140" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <text x="400" y="154" text-anchor="middle" font-size="9" fill="#888">0</text>
    <rect x="420" y="120" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="440" y="140" text-anchor="middle" fill="#446688" font-weight="bold">4</text>
    <text x="440" y="154" text-anchor="middle" font-size="9" fill="#888">0</text>
    <rect x="460" y="120" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="480" y="140" text-anchor="middle" fill="#446688" font-weight="bold">9</text>
    <text x="480" y="154" text-anchor="middle" font-size="9" fill="#888">0</text>
    <rect x="500" y="120" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="520" y="140" text-anchor="middle" fill="#446688" font-weight="bold">8</text>
    <text x="520" y="154" text-anchor="middle" font-size="9" fill="#888">0</text>
    <!-- row 2: step2 step3 step10(2) obstacle -->
    <rect x="380" y="160" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="400" y="180" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <text x="400" y="194" text-anchor="middle" font-size="9" fill="#888">0</text>
    <rect x="420" y="160" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="440" y="180" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <text x="440" y="194" text-anchor="middle" font-size="9" fill="#888">0</text>
    <rect x="460" y="160" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
    <text x="480" y="180" text-anchor="middle" fill="#d6a040" font-weight="bold">10</text>
    <text x="480" y="194" text-anchor="middle" font-size="9" fill="#d6a040">2</text>
    <rect x="500" y="160" width="40" height="40" fill="#eeeeee" stroke="#999" stroke-width="1.2" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <text x="520" y="180" text-anchor="middle" fill="#999">-1</text>
  </g>
  <!-- path 2 polyline through cell centers -->
  <polyline points="400,100 400,140 400,180 440,180 440,140 440,100 480,100 520,100 520,140 480,140 480,180"
            fill="none" stroke="#446688" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"
            marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="460" y="220" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">walked=10，walked+1=11==target ✓</text>

  <!-- ===== legend / summary ===== -->
  <g font-size="10" fill="#444">
    <rect x="60" y="246" width="20" height="14" fill="#e6f4ea" stroke="#4a7a3a" rx="2" filter="url(#rough2)"/><text x="88" y="257" filter="url(#rough2)">起点 1</text>
    <rect x="150" y="246" width="20" height="14" fill="#fff8e1" stroke="#d6a040" rx="2" filter="url(#rough2)"/><text x="178" y="257" filter="url(#rough2)">终点 2</text>
    <rect x="240" y="246" width="20" height="14" fill="#e8f0fe" stroke="#446688" rx="2" filter="url(#rough2)"/><text x="268" y="257" filter="url(#rough2)">空格 0（已走）</text>
    <rect x="370" y="246" width="20" height="14" fill="#eeeeee" stroke="#999" stroke-dasharray="3 2" rx="2" filter="url(#rough2)"/><text x="398" y="257" filter="url(#rough2)">障碍 -1（不走）</text>
  </g>

  <rect x="60" y="276" width="600" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="80" y="296" font-size="11" fill="#4a7a3a" font-weight="bold">两条路径均走遍全部 11 个无障碍格（障碍 (2,3) 不走），到达终点时 walked=10 → walked+1=11==target</text>
  <text x="80" y="312" font-size="11" fill="#555">回溯穷尽所有分支：死路分支自动返回撤销标记 → 最终 ans = 2</text>
</svg>
