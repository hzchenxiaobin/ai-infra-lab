<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">操作只删前缀 ⇒ 保留的必是互异后缀，答案 = ⌈k/3⌉</text>

  <!-- group labels above the array -->
  <g filter="url(#rough2)">
    <rect x="40" y="60" width="150" height="76" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" rx="6"/>
    <text x="115" y="80" text-anchor="middle" font-size="11" fill="#b85450">操作①：删 3 个</text>
    <rect x="184" y="60" width="150" height="76" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" rx="6"/>
    <text x="259" y="80" text-anchor="middle" font-size="11" fill="#b85450">操作②：删 3 个</text>
    <rect x="328" y="60" width="150" height="76" fill="none" stroke="#4a7a3a" stroke-width="2" rx="6"/>
    <text x="403" y="80" text-anchor="middle" font-size="11" fill="#4a7a3a">保留：互异 ✓</text>
  </g>

  <!-- the array: [1,2,3,4,2,3 | 3,5,7] -->
  <g filter="url(#rough2)">
    <rect x="44" y="88" width="46" height="42" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="92" y="88" width="46" height="42" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="140" y="88" width="46" height="42" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="188" y="88" width="46" height="42" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="236" y="88" width="46" height="42" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="284" y="88" width="46" height="42" fill="#f0f0f0" stroke="#999" stroke-width="1" rx="4"/>
    <rect x="332" y="88" width="46" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="380" y="88" width="46" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="428" y="88" width="46" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>

    <text x="67" y="114" text-anchor="middle" font-size="14" fill="#888">1</text>
    <text x="115" y="114" text-anchor="middle" font-size="14" fill="#888">2</text>
    <text x="163" y="114" text-anchor="middle" font-size="14" fill="#888">3</text>
    <text x="211" y="114" text-anchor="middle" font-size="14" fill="#888">4</text>
    <text x="259" y="114" text-anchor="middle" font-size="14" fill="#888">2</text>
    <text x="307" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">3</text>
    <text x="355" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450">3</text>
    <text x="403" y="114" text-anchor="middle" font-size="14" fill="#2d4d22">5</text>
    <text x="451" y="114" text-anchor="middle" font-size="14" fill="#2d4d22">7</text>

    <text x="67" y="148" text-anchor="middle" font-size="10" fill="#999">0</text>
    <text x="115" y="148" text-anchor="middle" font-size="10" fill="#999">1</text>
    <text x="163" y="148" text-anchor="middle" font-size="10" fill="#999">2</text>
    <text x="211" y="148" text-anchor="middle" font-size="10" fill="#999">3</text>
    <text x="259" y="148" text-anchor="middle" font-size="10" fill="#999">4</text>
    <text x="307" y="148" text-anchor="middle" font-size="10" fill="#999">5</text>
    <text x="355" y="148" text-anchor="middle" font-size="10" fill="#999">6</text>
    <text x="403" y="148" text-anchor="middle" font-size="10" fill="#999">7</text>
    <text x="451" y="148" text-anchor="middle" font-size="10" fill="#999">8</text>
  </g>

  <!-- duplicate pair indicator -->
  <g filter="url(#rough2)">
    <path d="M307,156 Q331,172 355,156" fill="none" stroke="#b85450" stroke-width="2"/>
    <text x="331" y="190" text-anchor="middle" font-size="11" fill="#b85450">3 与 3 重复！</text>
    <text x="260" y="216" text-anchor="middle" font-size="12" fill="#333">起点 ≤ 5 的后缀必含这对 3 ⇒ 最长互异后缀起点 k = 6</text>
  </g>

  <!-- formula box -->
  <g filter="url(#rough2)">
    <rect x="55" y="234" width="410" height="126" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="260" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5c1e">答案 = ⌈k / 3⌉，k = 必须删除的前缀长度</text>
    <text x="260" y="290" text-anchor="middle" font-size="15" fill="#446688">本例 k = 6 ⇒ ⌈6/3⌉ = 2</text>
    <text x="260" y="314" text-anchor="middle" font-size="12" fill="#555">t 次操作后数组恰为 nums[3t:]（空数组也合法）</text>
    <text x="260" y="338" text-anchor="middle" font-size="12" fill="#555">互异后缀的子后缀仍互异 ⇒ 上取整「多删」无害</text>
  </g>
</svg>
