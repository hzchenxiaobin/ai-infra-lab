<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="340" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">防抖核心：每次调用 clearTimeout 旧定时器、setTimeout 新定时器，只留最后一个</text>

  <!-- timeline baseline -->
  <line x1="40" y1="190" x2="600" y2="190" stroke="#bbb" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="606" y="194" font-size="11" fill="#888" filter="url(#rough2)">时间</text>

  <!-- call1 -->
  <rect x="35" y="120" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="70" y="139" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">call1(args₁)</text>
  <path d="M 70 148 L 70 186" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- call2 -->
  <rect x="115" y="120" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="150" y="139" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">call2(args₂)</text>
  <path d="M 150 148 L 150 186" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- call3 -->
  <rect x="195" y="120" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="230" y="139" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">call3(args₃)</text>
  <path d="M 230 148 L 230 186" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- band1 (cancelled at call2 x=150) -->
  <rect x="70" y="198" width="80" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="214" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">pending</text>
  <text x="153" y="216" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="150" y="244" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">取消</text>

  <!-- band2 (cancelled at call3 x=230) -->
  <rect x="150" y="198" width="80" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="214" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">pending</text>
  <text x="233" y="216" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="230" y="244" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">取消</text>

  <!-- band3 (survives, fires at x=380) -->
  <rect x="230" y="198" width="150" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="305" y="214" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">pending → 到期</text>

  <!-- fire marker + box at 380 -->
  <line x1="380" y1="196" x2="380" y2="238" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="320" y="238" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="380" y="258" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ fn(args₃) 执行</text>

  <!-- t-window bracket under band1 -->
  <path d="M 70 270 L 70 276 L 220 276 L 220 270" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="145" y="292" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">t 毫秒（延迟窗口）</text>

  <!-- legend right -->
  <rect x="448" y="120" width="172" height="96" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="534" y="140" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">图例</text>
  <rect x="460" y="150" width="22" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="490" y="161" font-size="10" fill="#555" filter="url(#rough2)">待执行定时器 (pending)</text>
  <text x="471" y="182" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="490" y="183" font-size="10" fill="#555" filter="url(#rough2)">被新调用取消</text>
  <rect x="460" y="196" width="22" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="490" y="206" font-size="10" fill="#555" filter="url(#rough2)">✓ 到期执行 fn</text>

  <!-- bottom note -->
  <rect x="40" y="300" width="560" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="320" y="320" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">连续调用不断"清零"时钟；只有停顿 ≥ t 毫秒，才执行最后一次的参数</text>
</svg>
