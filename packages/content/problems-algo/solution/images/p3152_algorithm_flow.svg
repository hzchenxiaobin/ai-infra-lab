<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="450" fill="#fafafa"/>

  <text x="260" y="18" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：先 O(n) 预处理前缀和，再逐查询 O(1) 判定</text>

  <text x="36" y="46" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">① 预处理 O(n)</text>

  <rect x="36" y="56" width="150" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="111" y="77" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">pre[0] = 0</text>

  <path d="M 111 88 L 111 104" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="20" y="108" width="210" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="125" y="128" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">pre[i] = pre[i−1] + d</text>
  <text x="125" y="148" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">d = 1 ⟺ nums[i] 与 nums[i−1] 同奇偶</text>

  <path d="M 230 133 L 254 133 L 254 72 L 192 72" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="262" y="108" font-size="10.5" fill="#888" filter="url(#rough2)">对 i = 1 … n−1</text>

  <rect x="288" y="118" width="216" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="396" y="140" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">违规 bit d 挂在「间隙」上</text>
  <text x="396" y="157" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">查询 [l, r] 只看 (l, r] 的间隙</text>
  <text x="396" y="174" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">pre[r] − pre[l] 恰好截取这段</text>

  <text x="36" y="196" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">② 逐查询 O(1)</text>

  <rect x="36" y="206" width="150" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="111" y="227" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">取出查询 [l, r]</text>

  <path d="M 111 238 L 111 256" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="61,290 136,258 211,290 136,322" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="136" y="295" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">pre[r] == pre[l] ?</text>

  <path d="M 211 290 L 254 290" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="230" y="282" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="258" y="274" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="303" y="294" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">true</text>

  <path d="M 136 322 L 136 348" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="146" y="340" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="91" y="350" width="90" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="136" y="370" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">false</text>

  <path d="M 181 366 L 420 366 L 420 222 L 192 222" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 348 290 L 420 290" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="430" y="300" font-size="10.5" fill="#888" filter="url(#rough2)">下一个查询</text>

  <rect x="36" y="402" width="380" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="226" y="424" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">总复杂度 O(n + q)：预处理一趟 + 每查询 O(1)</text>
</svg>
