<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#4a7a3a" stroke-width="1.6"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#b85450" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="16" fill="#333"
        filter="url(#rough2)">算法流程：后缀背包只建一次，n 个 x 共享查询</text>

  <!-- ① 排序 -->
  <rect x="70" y="46" width="360" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="250" y="67" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold"
        filter="url(#rough2)">① nums 降序排序（&gt; x 的元素必为前缀）</text>

  <path d="M 250 78 L 250 92" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② 建表 -->
  <rect x="42" y="96" width="416" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="250" y="115" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold"
        filter="url(#rough2)">② 逆序背包建表：dp[i][s] = 后缀 nums[i:] 能否凑出和 s</text>
  <text x="250" y="133" text-anchor="middle" font-size="11" fill="#446688"
        filter="url(#rough2)">dp[i][s] = dp[i+1][s] ∨ dp[i+1][s − nums[i]]，O(n·k) 只算一次</text>

  <path d="M 250 142 L 250 154" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ 双指针 -->
  <rect x="42" y="158" width="416" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="250" y="179" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold"
        filter="url(#rough2)">③ x = 1..n：双指针维护 t = #{ nums[j] &gt; x }（x 增大 ⇒ t 只减不增）</text>

  <path d="M 250 190 L 250 202" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ④ 枚举 m -->
  <rect x="42" y="206" width="416" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="250" y="227" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold"
        filter="url(#rough2)">④ 枚举 m = 0, 1, …（m ≤ t 且 m·x ≤ k），检查 dp[t][k − m·x]</text>

  <!-- m++ 回环（左侧） -->
  <path d="M 38 214 C 22 218 22 230 38 230" fill="none" stroke="#446688" stroke-width="1.3"
        stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="16" y="226" font-size="10" fill="#446688" filter="url(#rough2)">m++</text>

  <path d="M 250 238 L 250 252" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="250,256 344,294 250,332 156,294" fill="#fafafa" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="250" y="290" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">存在 m 命中？</text>
  <text x="250" y="308" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">dp[t][k − m·x] = 1</text>

  <!-- 是 → true -->
  <path d="M 344 294 L 376 294" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="360" y="286" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="380" y="276" width="128" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="444" y="298" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold"
        filter="url(#rough2)">answer[x−1] = true</text>
  <text x="444" y="326" text-anchor="middle" font-size="10" fill="#4a7a3a"
        filter="url(#rough2)">凑出了 m·x ＋ s = k</text>

  <!-- 否 → false -->
  <path d="M 250 332 L 250 350" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="258" y="346" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="170" y="354" width="160" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="250" y="374" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold"
        filter="url(#rough2)">answer[x−1] = false</text>

  <text x="250" y="400" text-anchor="middle" font-size="10" fill="#888"
        filter="url(#rough2)">（无论真假，m 枚举完即回到 ③ 处理下一个 x）</text>

  <!-- 底部注记 -->
  <rect x="36" y="410" width="448" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" stroke-dasharray="5 4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="426" text-anchor="middle" font-size="11" fill="#b3541e"
        filter="url(#rough2)">总复杂度 O(n log n ＋ n·k)；查询 Σₓ (k/x ＋ 1) = O(k log n) —— 建表一次、共享 n 次</text>
</svg>
