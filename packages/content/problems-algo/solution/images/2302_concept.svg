<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：分数 = 和 × 长度，正数下随窗口扩展单调递增</text>

  <!-- nums label -->
  <text x="40" y="86" font-size="12" fill="#888">nums:</text>
  <text x="40" y="62" font-size="11" fill="#888">下标:</text>

  <!-- index labels -->
  <text x="138" y="62" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">0</text>
  <text x="198" y="62" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">1</text>
  <text x="258" y="62" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">2</text>
  <text x="318" y="62" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">3</text>
  <text x="378" y="62" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">4</text>

  <!-- cells -->
  <rect x="110" y="70" width="56" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="138" y="98" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="170" y="70" width="56" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="198" y="98" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="230" y="70" width="56" height="42" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="258" y="98" text-anchor="middle" font-size="14" fill="#999" font-weight="bold">4</text>
  <rect x="290" y="70" width="56" height="42" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="318" y="98" text-anchor="middle" font-size="14" fill="#999" font-weight="bold">3</text>
  <rect x="350" y="70" width="56" height="42" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="378" y="98" text-anchor="middle" font-size="14" fill="#999" font-weight="bold">5</text>

  <!-- left / right pointer labels -->
  <path d="M 138 120 L 138 116" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="138" y="134" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">left=0</text>
  <path d="M 198 120 L 198 116" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="198" y="134" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">right=1</text>

  <!-- score formula box -->
  <rect x="430" y="70" width="132" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="496" y="90" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">分数 = 和 × 长度</text>
  <text x="496" y="108" text-anchor="middle" font-size="11" fill="#666">= 3 × 2 = 6</text>
  <text x="496" y="122" text-anchor="middle" font-size="10" fill="#4a7a3a">6 &lt; 10 = k ✓</text>

  <!-- monotonicity arrows -->
  <text x="40" y="172" font-size="12" fill="#555" font-weight="bold">扩展 right →</text>
  <rect x="140" y="158" width="120" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="200" y="177" text-anchor="middle" font-size="11" fill="#333">和 ↑  且  长度 ↑</text>
  <path d="M 262 172 L 300 172" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="304" y="158" width="150" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="379" y="177" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">分数 ↑ (单调递增)</text>

  <!-- shrink arrows -->
  <text x="40" y="206" font-size="12" fill="#555" font-weight="bold">收缩 left →</text>
  <rect x="140" y="192" width="120" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="200" y="211" text-anchor="middle" font-size="11" fill="#333">和 ↓  且  长度 ↓</text>
  <path d="M 262 206 L 300 206" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="304" y="192" width="150" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="379" y="211" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">分数 ↓ (单调递减)</text>

  <!-- brackets: subarrays ending at right=1 -->
  <path d="M 170 238 Q 170 246 176 246 L 224 246 Q 230 246 230 238" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="200" y="262" text-anchor="middle" font-size="11" fill="#446688">[2,1] 分数=6 ✓</text>

  <path d="M 170 268 Q 170 276 176 276 L 224 276 Q 230 276 230 268" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="200" y="292" text-anchor="middle" font-size="11" fill="#446688">[1] 分数=1 ✓</text>

  <!-- count note box -->
  <rect x="304" y="240" width="160" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="384" y="262" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">以 right=1 结尾</text>
  <text x="384" y="280" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">新增 = right−left+1 = 2</text>
  <text x="384" y="294" text-anchor="middle" font-size="10" fill="#888">起点取 left..right</text>

  <!-- bottom callout -->
  <rect x="40" y="318" width="524" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="340" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">正数下「和」与「长度」同向变化，分数严格单调 ⇒ 可用滑动窗口</text>
  <text x="290" y="358" text-anchor="middle" font-size="11" fill="#666">按右端点 right 分组，合法子数组恰有 (right−left+1) 个，累加不重不漏</text>
</svg>
