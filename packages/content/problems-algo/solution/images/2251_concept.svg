<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：差分思想 — 盛开数 =「已开始」−「已结束」</text>
  <text x="280" y="40" text-anchor="middle" font-size="10.5" fill="#888">对查询时刻 t：#(start ≤ t) − #(end &lt; t) = 此刻盛开的花数</text>

  <!-- ===== Timeline with flower bars ===== -->
  <!-- x(t) = 70 + (t-1)*35,  t in [1,13] -->
  <!-- Flower 0 [1,6] -->
  <rect x="70" y="70" width="175" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="83" font-size="10" fill="#335">花0 [1,6]</text>
  <!-- Flower 1 [3,7] -->
  <rect x="140" y="95" width="140" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="108" font-size="10" fill="#335">花1 [3,7]</text>
  <!-- Flower 3 [4,13] -->
  <rect x="175" y="120" width="315" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="185" y="133" font-size="10" fill="#335">花3 [4,13]</text>
  <!-- Flower 2 [9,12] -->
  <rect x="350" y="145" width="105" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="158" font-size="10" fill="#335">花2 [9,12]</text>

  <!-- Person line at t=7 : x = 70 + 6*35 = 280 -->
  <line x1="280" y1="60" x2="280" y2="185" stroke="#b85450" stroke-width="2" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="288" y="58" font-size="11" fill="#b85450" font-weight="bold">人 t=7</text>

  <!-- Time axis -->
  <line x1="60" y1="180" x2="500" y2="180" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="70" y="195" text-anchor="middle" font-size="9.5" fill="#777">1</text>
  <text x="140" y="195" text-anchor="middle" font-size="9.5" fill="#777">3</text>
  <text x="210" y="195" text-anchor="middle" font-size="9.5" fill="#777">5</text>
  <text x="280" y="195" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">7</text>
  <text x="350" y="195" text-anchor="middle" font-size="9.5" fill="#777">9</text>
  <text x="420" y="195" text-anchor="middle" font-size="9.5" fill="#777">11</text>
  <text x="490" y="195" text-anchor="middle" font-size="9.5" fill="#777">13</text>

  <!-- ===== Sorted starts array ===== -->
  <text x="60" y="232" font-size="11" fill="#4a7a3a" font-weight="bold">开始时间排序 starts：</text>
  <!-- starts = [1,3,4,9], box w=40 gap=4 starting x=70 -->
  <!-- 1,3,4 are <=7 (green), 9 is not (grey) -->
  <rect x="200" y="218" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="236" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="244" y="218" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="264" y="236" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="288" y="218" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="308" y="236" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="332" y="218" width="40" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="352" y="236" text-anchor="middle" font-size="12" fill="#999">9</text>
  <!-- bracket: <=7 => 3 -->
  <path d="M 200 250 L 200 256 L 328 256 L 328 250" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="264" y="270" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">bisect_right(7) = 3</text>

  <!-- ===== Sorted ends array ===== -->
  <text x="60" y="300" font-size="11" fill="#d6a040" font-weight="bold">结束时间排序 ends：</text>
  <!-- ends = [6,7,12,13], only 6 is <7 (orange), others grey -->
  <rect x="200" y="286" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="304" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <rect x="244" y="286" width="40" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="264" y="304" text-anchor="middle" font-size="12" fill="#999">7</text>
  <rect x="288" y="286" width="40" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="308" y="304" text-anchor="middle" font-size="12" fill="#999">12</text>
  <rect x="332" y="286" width="40" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="352" y="304" text-anchor="middle" font-size="12" fill="#999">13</text>
  <!-- bracket: <7 => 1 -->
  <path d="M 200 318 L 200 324 L 240 324 L 240 318" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="220" y="338" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">bisect_left(7) = 1</text>

  <!-- ===== Formula box ===== -->
  <rect x="120" y="352" width="320" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="372" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">t=7 盛开数 = 3 − 1 = 2</text>
  <text x="280" y="387" text-anchor="middle" font-size="10" fill="#555">#(start ≤ t) − #(end &lt; t)</text>

  <!-- Footer -->
  <text x="280" y="402" text-anchor="middle" font-size="9.5" fill="#888">绿=已开始 | 橙=已结束 | 两次二分各 O(log n)，无需差分数组</text>
</svg>
