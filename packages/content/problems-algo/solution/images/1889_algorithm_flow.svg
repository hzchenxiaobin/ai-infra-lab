<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：排序 → 遍历供应商 → 二分分段累加</text>

  <!-- Step 1: sort packages + prefix sum -->
  <rect x="60" y="44" width="440" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">① 排序 packages + 预处理前缀和 prefix</text>
  <text x="280" y="78" text-anchor="middle" font-size="10" fill="#666">O(n log n)，全局只做一次</text>

  <!-- Arrow down -->
  <path d="M 280 88 L 280 102" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: init ans -->
  <rect x="60" y="104" width="440" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="127" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">② ans = +∞，遍历每个供应商 j</text>

  <!-- Arrow down -->
  <path d="M 280 142 L 280 156" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: sort boxes[j] -->
  <rect x="60" y="158" width="440" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="181" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">③ 排序 boxes[j]，令 prev = 0, waste = 0</text>

  <!-- Arrow down to decision -->
  <path d="M 280 196 L 280 210" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: max box < max package? -->
  <polygon points="280,212 410,252 280,292 150,252" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="248" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">max(boxes[j])</text>
  <text x="280" y="264" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">&lt; max(packages)?</text>

  <!-- Yes: skip (right) -->
  <path d="M 410 252 L 470 252" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="246" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">是</text>
  <rect x="472" y="238" width="72" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="508" y="257" text-anchor="middle" font-size="10.5" fill="#b85450">跳过 j</text>

  <!-- No: continue (left down) -->
  <path d="M 150 252 L 110 252 L 110 300" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="130" y="246" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- Step 4: for each box b -->
  <rect x="40" y="302" width="400" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="240" y="320" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">④ 对每个箱子 b（升序）：</text>
  <text x="240" y="336" text-anchor="middle" font-size="10" fill="#555">idx = upper_bound(packages, b)</text>
  <text x="240" y="348" text-anchor="middle" font-size="10" fill="#555">waste += b×(idx−prev) − (prefix[idx]−prefix[prev])；prev = idx</text>

  <!-- Arrow down -->
  <path d="M 240 350 L 240 364" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: prev == n? -->
  <polygon points="240,366 330,392 240,418 150,392" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="396" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">prev == n?</text>

  <!-- Yes: update ans -->
  <path d="M 330 392 L 380 392" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="355" y="386" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="382" y="378" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="442" y="397" text-anchor="middle" font-size="10" fill="#333">ans = min(ans, waste)</text>

  <!-- No: next box -->
  <path d="M 150 392 L 100 392 L 100 322 L 40 322" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="78" y="386" text-anchor="middle" font-size="10" fill="#888">否·下个 b</text>

  <!-- Final result -->
  <rect x="60" y="430" width="440" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="446" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">⑤ 返回 ans == +∞ ? −1 : ans % (10⁹+7)</text>
</svg>
