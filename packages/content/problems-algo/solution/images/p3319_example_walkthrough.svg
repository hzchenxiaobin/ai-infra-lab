<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：示例 1 的后序判定全过程（k = 2）</text>
  <text x="260" y="37" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">后序序列 1, 8, 5, 2, 3, 6, 8, 5, 7, 6, 5 —— 绿行记一项，红行判负返回 −1</text>

  <!-- 表头 -->
  <rect x="30" y="46" width="460" height="22" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="44" y="61" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">序</text>
  <text x="103" y="61" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">后序节点</text>
  <text x="170" y="61" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">hl</text>
  <text x="214" y="61" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">hr</text>
  <text x="291" y="61" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">判定</text>
  <text x="418" y="61" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">记录 / 返回</text>

  <!-- 行 1 -->
  <rect x="30" y="68" width="460" height="21" fill="#eef6ec" stroke="#9dc79a" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="44" y="82" text-anchor="middle" font-size="9.5" fill="#555" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="103" y="82" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">叶 1</text>
  <text x="170" y="82" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">0</text>
  <text x="214" y="82" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">0</text>
  <text x="291" y="82" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">0 = 0 ✓</text>
  <text x="418" y="82" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">记 1；h = 1</text>

  <!-- 行 2 -->
  <rect x="30" y="89" width="460" height="21" fill="#eef6ec" stroke="#9dc79a" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="44" y="103" text-anchor="middle" font-size="9.5" fill="#555" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="103" y="103" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">叶 8</text>
  <text x="170" y="103" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">0</text>
  <text x="214" y="103" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">0</text>
  <text x="291" y="103" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">0 = 0 ✓</text>
  <text x="418" y="103" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">记 1；h = 1</text>

  <!-- 行 3 -->
  <rect x="30" y="110" width="460" height="21" fill="#eef6ec" stroke="#9dc79a" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="44" y="124" text-anchor="middle" font-size="9.5" fill="#555" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="103" y="124" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">5（3 的左子）</text>
  <text x="170" y="124" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="214" y="124" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="291" y="124" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">1 = 1 ✓</text>
  <text x="418" y="124" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">记 3；h = 2</text>

  <!-- 行 4 -->
  <rect x="30" y="131" width="460" height="21" fill="#eef6ec" stroke="#9dc79a" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="44" y="145" text-anchor="middle" font-size="9.5" fill="#555" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="103" y="145" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">叶 2</text>
  <text x="170" y="145" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">0</text>
  <text x="214" y="145" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">0</text>
  <text x="291" y="145" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">0 = 0 ✓</text>
  <text x="418" y="145" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">记 1；h = 1</text>

  <!-- 行 5（判负） -->
  <rect x="30" y="152" width="460" height="21" fill="#fce4ec" stroke="#d9a0a0" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="44" y="166" text-anchor="middle" font-size="9.5" fill="#555" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="103" y="166" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">3</text>
  <text x="170" y="166" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">2</text>
  <text x="214" y="166" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="291" y="166" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">2 ≠ 1 ✗</text>
  <text x="418" y="166" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">返回 −1</text>

  <!-- 行 6 -->
  <rect x="30" y="173" width="460" height="21" fill="#eef6ec" stroke="#9dc79a" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="44" y="187" text-anchor="middle" font-size="9.5" fill="#555" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="103" y="187" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">叶 6</text>
  <text x="170" y="187" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">0</text>
  <text x="214" y="187" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">0</text>
  <text x="291" y="187" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">0 = 0 ✓</text>
  <text x="418" y="187" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">记 1；h = 1</text>

  <!-- 行 7 -->
  <rect x="30" y="194" width="460" height="21" fill="#eef6ec" stroke="#9dc79a" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="44" y="208" text-anchor="middle" font-size="9.5" fill="#555" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="103" y="208" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">叶 8′</text>
  <text x="170" y="208" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">0</text>
  <text x="214" y="208" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">0</text>
  <text x="291" y="208" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">0 = 0 ✓</text>
  <text x="418" y="208" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">记 1；h = 1</text>

  <!-- 行 8 -->
  <rect x="30" y="215" width="460" height="21" fill="#eef6ec" stroke="#9dc79a" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="44" y="229" text-anchor="middle" font-size="9.5" fill="#555" font-weight="bold" filter="url(#rough2)">8</text>
  <text x="103" y="229" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">5（6 的左子）</text>
  <text x="170" y="229" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="214" y="229" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="291" y="229" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">1 = 1 ✓</text>
  <text x="418" y="229" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">记 3；h = 2</text>

  <!-- 行 9 -->
  <rect x="30" y="236" width="460" height="21" fill="#eef6ec" stroke="#9dc79a" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="44" y="250" text-anchor="middle" font-size="9.5" fill="#555" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="103" y="250" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">叶 7</text>
  <text x="170" y="250" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">0</text>
  <text x="214" y="250" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">0</text>
  <text x="291" y="250" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">0 = 0 ✓</text>
  <text x="418" y="250" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">记 1；h = 1</text>

  <!-- 行 10（判负） -->
  <rect x="30" y="257" width="460" height="21" fill="#fce4ec" stroke="#d9a0a0" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="44" y="271" text-anchor="middle" font-size="9.5" fill="#555" font-weight="bold" filter="url(#rough2)">10</text>
  <text x="103" y="271" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">6</text>
  <text x="170" y="271" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">2</text>
  <text x="214" y="271" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="291" y="271" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">2 ≠ 1 ✗</text>
  <text x="418" y="271" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">返回 −1</text>

  <!-- 行 11（判负） -->
  <rect x="30" y="278" width="460" height="21" fill="#fce4ec" stroke="#d9a0a0" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="44" y="292" text-anchor="middle" font-size="9.5" fill="#555" font-weight="bold" filter="url(#rough2)">11</text>
  <text x="103" y="292" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">5（根）</text>
  <text x="170" y="292" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">−1</text>
  <text x="214" y="292" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">1</text>
  <text x="291" y="292" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">hl&lt;0 ✗</text>
  <text x="418" y="292" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">返回 −1</text>

  <!-- 列分隔线 -->
  <g stroke="#ccc" stroke-width="0.6" filter="url(#rough2)">
    <line x1="58" y1="46" x2="58" y2="299"/>
    <line x1="148" y1="46" x2="148" y2="299"/>
    <line x1="192" y1="46" x2="192" y2="299"/>
    <line x1="236" y1="46" x2="236" y2="299"/>
    <line x1="346" y1="46" x2="346" y2="299"/>
  </g>

  <!-- 收尾三步 -->
  <rect x="30" y="308" width="200" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="130" y="323" text-anchor="middle" font-size="9" fill="#33506b" font-weight="bold" filter="url(#rough2)">后序收集 sizes</text>
  <text x="130" y="340" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">[1,1,3,1,1,1,3,1] 共 8 项</text>

  <line x1="232" y1="328" x2="250" y2="328" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="254" y="308" width="106" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="307" y="323" text-anchor="middle" font-size="9" fill="#33506b" font-weight="bold" filter="url(#rough2)">降序排序</text>
  <text x="307" y="340" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">[3,3,1,1,1,1,1,1]</text>

  <line x1="362" y1="328" x2="380" y2="328" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="384" y="308" width="106" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="437" y="323" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">k = 2</text>
  <text x="437" y="340" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">第 2 大 = 3 ✓</text>

  <!-- 底注 -->
  <text x="260" y="366" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">判负的 3、6、根 5 不记录，但其子树内已入列的项（第 1–4、6–9 行）全部有效 —— −1 只向上传播</text>
  <text x="260" y="384" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">若项数 &lt; k（示例 3 只有 [1,1]，k = 3）→ 返回 −1；相同大小重复计数（两个 3 占第 1、2 名）</text>
</svg>
