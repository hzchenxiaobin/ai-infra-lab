<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：image = [[1,1,0],[1,0,1],[0,0,0]]</text>

  <!-- column headers -->
  <text x="50" y="58" font-size="11" fill="#888">行</text>
  <text x="120" y="58" font-size="11" fill="#888">原始行</text>
  <text x="290" y="58" font-size="11" fill="#888">对称对 (left, right)</text>
  <text x="500" y="58" font-size="11" fill="#888">结果行</text>

  <!-- ===== Row 0: [1,1,0] ===== -->
  <text x="50" y="92" font-size="12" fill="#333" font-weight="bold">0</text>
  <!-- original cells -->
  <rect x="96" y="76" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="96" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="130" y="76" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="146" y="96" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="164" y="76" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="96" text-anchor="middle" font-size="13" fill="#333">0</text>

  <!-- pair analysis -->
  <rect x="240" y="76" width="232" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="356" y="96" text-anchor="middle" font-size="11" fill="#444">(1,0) ≠ → 不变；中间(1)=1 → 取反 0</text>

  <!-- result cells -->
  <rect x="500" y="76" width="32" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="516" y="96" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="534" y="76" width="32" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="550" y="96" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">0</text>
  <rect x="568" y="76" width="32" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="584" y="96" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">0</text>

  <!-- ===== Row 1: [1,0,1] ===== -->
  <text x="50" y="156" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="96" y="140" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="160" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="130" y="140" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="146" y="160" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="164" y="140" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="160" text-anchor="middle" font-size="13" fill="#333">1</text>

  <rect x="240" y="140" width="232" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="356" y="160" text-anchor="middle" font-size="11" fill="#444">(1,1) = → 取反 0,0；中间(0)=0 → 取反 1</text>

  <rect x="500" y="140" width="32" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="516" y="160" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">0</text>
  <rect x="534" y="140" width="32" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="550" y="160" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="568" y="140" width="32" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="584" y="160" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">0</text>

  <!-- ===== Row 2: [0,0,0] ===== -->
  <text x="50" y="220" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="96" y="204" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="224" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="130" y="204" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="146" y="224" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="164" y="204" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="224" text-anchor="middle" font-size="13" fill="#333">0</text>

  <rect x="240" y="204" width="232" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="356" y="224" text-anchor="middle" font-size="11" fill="#444">(0,0) = → 取反 1,1；中间(0)=0 → 取反 1</text>

  <rect x="500" y="204" width="32" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="516" y="224" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="534" y="204" width="32" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="550" y="224" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <rect x="568" y="204" width="32" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="584" y="224" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>

  <!-- divider -->
  <line x1="40" y1="256" x2="600" y2="256" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- final result -->
  <text x="50" y="284" font-size="12" fill="#888">最终结果</text>
  <rect x="140" y="270" width="460" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="370" y="293" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">[[1,0,0], [0,1,0], [1,1,1]]</text>

  <!-- legend -->
  <rect x="60" y="324" width="20" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="88" y="337" font-size="11" fill="#444">对称对相等 → 取反（有改动）</text>
  <rect x="320" y="324" width="20" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="348" y="337" font-size="11" fill="#444">对称对不等 → 跳过（无改动）</text>

  <!-- key insight -->
  <rect x="60" y="362" width="500" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="384" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">关键：奇数行的中间元素（left==right）必然 a==a，</text>
  <text x="310" y="404" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">故恒取反——与「翻转不动 + 取反」完全一致</text>
</svg>
