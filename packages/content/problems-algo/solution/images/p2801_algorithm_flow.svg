<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">count(≤ s) 算法流程</text>

  <!-- Start -->
  <rect x="200" y="38" width="160" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="280" y="57" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">输入字符串 s，n = len(s)</text>

  <path d="M280 66 L280 80" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: s=="0"? -->
  <polygon points="280,84 370,116 280,148 190,116" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="114" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">s == "0" ?</text>
  <text x="280" y="128" text-anchor="middle" font-size="10" fill="#888">(low−1 退化为 0)</text>

  <!-- yes branch -->
  <path d="M190 116 L150 116" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="155" y="110" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="60" y="102" width="84" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="102" y="121" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return 0</text>

  <!-- no branch -->
  <path d="M280 148 L280 162" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="288" y="158" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- Part A -->
  <rect x="170" y="166" width="220" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="184" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Part A：累加短位数步进数</text>
  <text x="280" y="200" text-anchor="middle" font-size="10.5" fill="#555">for L in 1..n−1: Σ dp[L][d]，d=1..9</text>
  <text x="280" y="214" text-anchor="middle" font-size="10" fill="#888">用预处理的 dp 表 O(1) 查表</text>

  <path d="M280 216 L280 230" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Part B loop -->
  <rect x="100" y="234" width="360" height="138" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="252" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">Part B：逐位扫描 i = 0 .. n−1（prev = 上一位）</text>

  <!-- free branch -->
  <rect x="116" y="262" width="200" height="46" fill="#fff" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="216" y="278" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">自由分支：枚举 d &lt; s[i]</text>
  <text x="216" y="294" text-anchor="middle" font-size="10" fill="#555">首位 d≥1；i&gt;0 需 |d−prev|=1</text>
  <text x="216" y="306" text-anchor="middle" font-size="10" fill="#555">贡献 dp[n−i][d]（剩余自由填）</text>

  <!-- tight branch -->
  <rect x="328" y="262" width="118" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="387" y="278" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">收紧分支</text>
  <text x="387" y="294" text-anchor="middle" font-size="10" fill="#555">取 d = s[i]</text>
  <text x="387" y="306" text-anchor="middle" font-size="10" fill="#555">i&gt;0 需 |d−prev|=1</text>

  <!-- tight decision -->
  <polygon points="387,312 420,330 387,348 354,330" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="387" y="334" text-anchor="middle" font-size="9.5" fill="#333">合法?</text>
  <text x="424" y="334" font-size="9.5" fill="#b85450" font-weight="bold">否→break</text>

  <path d="M354 330 L326 330 L326 348 L160 348 L160 262 L116 262" stroke="#4a7a3a" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="240" y="344" font-size="9.5" fill="#4a7a3a" font-weight="bold">是→prev=s[i]，下一轮 i++</text>

  <path d="M280 372 L280 386" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- End check -->
  <rect x="150" y="390" width="260" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="409" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">未 break → s 本身是步进数，+1</text>

  <!-- dp table note -->
  <rect x="30" y="436" width="500" height="16" fill="#fafafa"/>
  <text x="280" y="450" text-anchor="middle" font-size="10" fill="#888">dp[L][d] 预处理：dp[1][d]=1，dp[L][d]=dp[L−1][d−1]+dp[L−1][d+1]，状态 O(100×10)</text>
</svg>
