<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：排序 → 每三个一组查首尾差</text>

  <!-- start -->
  <ellipse cx="260" cy="54" rx="44" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="58" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">开始</text>
  <path d="M 260 70 L 260 80" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- sort -->
  <rect x="165" y="84" width="190" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="104" text-anchor="middle" font-size="12.5" fill="#334" filter="url(#rough2)">sort(nums)：非降序排序</text>
  <path d="M 260 116 L 260 126" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- i = 0 -->
  <rect x="200" y="130" width="120" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="150" text-anchor="middle" font-size="12.5" fill="#334" filter="url(#rough2)">i ← 0（组起点）</text>
  <path d="M 260 162 L 260 172" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 1: i < n ? -->
  <polygon points="165,212 260,174 355,212 260,250" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="216" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">i &lt; n ?</text>

  <path d="M 355 212 L 396 212" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="374" y="204" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="400" y="194" width="96" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="448" y="216" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <path d="M 260 250 L 260 262" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="272" y="260" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">是</text>

  <!-- diamond 2: nums[i+2] - nums[i] <= k ? -->
  <polygon points="135,306 260,268 385,306 260,344" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="302" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">nums[i+2] − nums[i]</text>
  <text x="260" y="318" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">≤ k ?</text>

  <path d="M 385 306 L 396 306" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="374" y="298" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="400" y="288" width="96" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="448" y="310" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 [ ]</text>

  <path d="M 260 344 L 260 356" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="272" y="354" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- append group -->
  <rect x="130" y="360" width="260" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="380" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">收录 [nums[i], nums[i+1], nums[i+2]]</text>
  <path d="M 260 392 L 260 402" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- i += 3 -->
  <rect x="200" y="406" width="120" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="426" text-anchor="middle" font-size="12" fill="#334" filter="url(#rough2)">i ← i + 3</text>

  <!-- loop back -->
  <path d="M 200 422 L 92 422 L 92 212 L 157 212" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="132" y="414" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">下一组</text>

  <!-- bottom note -->
  <rect x="36" y="444" width="460" height="20" fill="#ffffff" stroke="#999" stroke-width="1" rx="8" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="266" y="458" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">n 是 3 的倍数 ⇒ i+1、i+2 永不越界；任一组失败立即空手而归</text>
</svg>
