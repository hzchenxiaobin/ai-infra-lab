<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：四个学生逐一过三关，输出 {1, 3}</text>

  <!-- header row -->
  <rect x="16" y="36" width="82" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="57" y="55" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">学生</text>
  <rect x="100" y="36" width="96" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="49" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">关① 必修</text>
  <text x="148" y="61" text-anchor="middle" font-size="8" fill="#446688" filter="url(#rough2)">全 A？</text>
  <rect x="198" y="36" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="238" y="49" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">关② 选修</text>
  <text x="238" y="61" text-anchor="middle" font-size="8" fill="#4a7a3a" filter="url(#rough2)">≥ 2 门？</text>
  <rect x="280" y="36" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="49" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">关② 选修</text>
  <text x="320" y="61" text-anchor="middle" font-size="8" fill="#4a7a3a" filter="url(#rough2)">全 ≥ B？</text>
  <rect x="362" y="36" width="96" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="49" text-anchor="middle" font-size="9" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">关③ 加权 GPA</text>
  <text x="410" y="61" text-anchor="middle" font-size="8" fill="#8a6d3b" filter="url(#rough2)">≥ 2.5？</text>
  <rect x="460" y="36" width="46" height="30" fill="#ffffff" stroke="#555" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="483" y="55" text-anchor="middle" font-size="9.5" fill="#555" font-weight="bold" filter="url(#rough2)">判定</text>

  <!-- Alice row -->
  <rect x="16" y="70" width="82" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="57" y="88" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Alice 1</text>
  <text x="57" y="102" text-anchor="middle" font-size="8" fill="#4a7a3a" filter="url(#rough2)">CS</text>
  <rect x="100" y="70" width="96" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="88" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">101 A · 102 A</text>
  <text x="148" y="104" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <rect x="198" y="70" width="80" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="238" y="88" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">ML + OS</text>
  <text x="238" y="104" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2 门 ✓</text>
  <rect x="280" y="70" width="80" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="88" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">A · B</text>
  <text x="320" y="104" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <rect x="362" y="70" width="96" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="88" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">46.5 / 12</text>
  <text x="410" y="104" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3.875 ✓</text>
  <rect x="460" y="70" width="46" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="483" y="96" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">输出</text>

  <!-- Bob row -->
  <rect x="16" y="118" width="82" height="44" fill="#ffffff" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="57" y="136" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">Bob 2</text>
  <text x="57" y="150" text-anchor="middle" font-size="8" fill="#b85450" filter="url(#rough2)">CS</text>
  <rect x="100" y="118" width="96" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="136" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">101 A · 102 B</text>
  <text x="148" y="152" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">B ✗</text>
  <rect x="198" y="118" width="80" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="238" y="136" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">无</text>
  <text x="238" y="152" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">0 门 ✗</text>
  <rect x="280" y="118" width="80" height="44" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="140" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">—</text>
  <rect x="362" y="118" width="96" height="44" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="136" text-anchor="middle" font-size="8.5" fill="#8a6d3b" filter="url(#rough2)">21 / 6</text>
  <text x="410" y="152" text-anchor="middle" font-size="9.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">3.5 ✓</text>
  <rect x="460" y="118" width="46" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="483" y="144" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <!-- Charlie row -->
  <rect x="16" y="166" width="82" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="57" y="184" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Charlie 3</text>
  <text x="57" y="198" text-anchor="middle" font-size="8" fill="#4a7a3a" filter="url(#rough2)">Math</text>
  <rect x="100" y="166" width="96" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="184" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">103 A · 104 A</text>
  <text x="148" y="200" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <rect x="198" y="166" width="80" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="238" y="184" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">Prob + Stat</text>
  <text x="238" y="200" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2 门 ✓</text>
  <rect x="280" y="166" width="80" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="184" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">A · B</text>
  <text x="320" y="200" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <rect x="362" y="166" width="96" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="184" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">54.5 / 14</text>
  <text x="410" y="200" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">≈3.89 ✓</text>
  <rect x="460" y="166" width="46" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="483" y="192" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">输出</text>

  <!-- David row -->
  <rect x="16" y="214" width="82" height="44" fill="#ffffff" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="57" y="232" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">David 4</text>
  <text x="57" y="246" text-anchor="middle" font-size="8" fill="#b85450" filter="url(#rough2)">Math</text>
  <rect x="100" y="214" width="96" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="232" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">103 B · 104 B</text>
  <text x="148" y="248" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">B ✗</text>
  <rect x="198" y="214" width="80" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="238" y="232" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">无</text>
  <text x="238" y="248" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">0 门 ✗</text>
  <rect x="280" y="214" width="80" height="44" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="236" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">—</text>
  <rect x="362" y="214" width="96" height="44" fill="#ffffff" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="232" text-anchor="middle" font-size="8.5" fill="#8a6d3b" filter="url(#rough2)">24 / 8</text>
  <text x="410" y="248" text-anchor="middle" font-size="9.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">3.0 ✓</text>
  <rect x="460" y="214" width="46" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="483" y="240" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <!-- bottom notes -->
  <rect x="16" y="270" width="490" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="261" y="290" text-anchor="middle" font-size="9.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">加权 GPA = Σ(credits × GPA) / Σcredits：Alice 的课全 3 学分 → (3×4 + 3×4 + 3×4 + 3×3.5)/12 = 3.875</text>
  <text x="261" y="308" text-anchor="middle" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">Charlie 学分为 4,4,3,3 → (16 + 16 + 12 + 10.5)/14 ≈ 3.89（学分不等权，AVG(GPA)=3.875 会偏）</text>
  <text x="261" y="326" text-anchor="middle" font-size="9" fill="#a08430" filter="url(#rough2)">Bob / David 栽在关①（必修非 A）——关② 也不达标；四人加权 GPA 都 ≥ 2.5，本例关③ 不淘汰人</text>
  <text x="261" y="341" text-anchor="middle" font-size="8.5" fill="#a08430" filter="url(#rough2)">输出按 student_id 升序 → {1, 3}，与前作 3182 的答案恰合同款（数据为平行设计）</text>
</svg>
