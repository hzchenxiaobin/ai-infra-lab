<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：BFS 逐层求和 + 滚动最小</text>

  <!-- ===== Init ===== -->
  <rect x="200" y="44" width="200" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="64" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">初始化：q = [root]</text>
  <text x="300" y="82" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">level = 0，minSum = +∞，ans = 0</text>

  <path d="M 300 92 L 300 112" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Diamond 1: queue empty? ===== -->
  <polygon points="300,116 370,140 300,164 230,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="145" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">队列空？</text>

  <text x="380" y="132" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 372 140 L 414 140" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="417" y="122" width="92" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="463" y="145" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <text x="309" y="182" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 300 164 L 300 190" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Level setup ===== -->
  <rect x="195" y="192" width="210" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="210" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">level++；size = len(q) 快照</text>
  <text x="300" y="228" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">sum = 0</text>

  <path d="M 300 236 L 300 256" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Inner loop ===== -->
  <rect x="170" y="258" width="260" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="276" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">for i &lt; size：node 出队</text>
  <text x="300" y="292" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">sum += node.val</text>
  <text x="300" y="308" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">非空子节点入队</text>

  <path d="M 300 314 L 300 334" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Diamond 2: sum < minSum? ===== -->
  <polygon points="300,338 378,362 300,386 222,362" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="367" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">sum &lt; minSum？</text>

  <text x="214" y="352" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 222 362 L 146 362" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="30" y="340" width="112" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="86" y="358" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">minSum = sum</text>
  <text x="86" y="374" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">ans = level</text>

  <!-- update box merges into return path -->
  <path d="M 86 384 L 86 410" stroke="#666" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- No-branch and loop back -->
  <text x="386" y="352" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 378 362 L 445 362 L 445 410" stroke="#666" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 445 410 L 20 410 L 20 140 L 222 140" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="248" y="424" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">一层处理完 → 回到队列判空，进入下一层</text>
</svg>
