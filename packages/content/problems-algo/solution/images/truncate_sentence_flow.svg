<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：计数空格，命中即截断</text>

  <!-- Start node -->
  <ellipse cx="280" cy="56" rx="110" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="12" fill="#333">开始: cnt = 0, i = 0</text>

  <!-- Arrow down to D1 -->
  <path d="M 280 76 L 280 92" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D1: i < n ? -->
  <polygon points="280,96 370,130 280,164 190,130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="134" text-anchor="middle" font-size="12" fill="#333">i &lt; n ?</text>

  <!-- D1 No -> return s (right) -->
  <path d="M 370 130 L 410 130" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="388" y="122" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <rect x="410" y="108" width="130" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="475" y="128" text-anchor="middle" font-size="10" fill="#333">k == 单词数</text>
  <text x="475" y="144" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 s</text>

  <!-- D1 Yes -> D2 (down) -->
  <path d="M 280 164 L 280 182" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="178" font-size="11" fill="#82b366">是</text>

  <!-- D2: s[i] == ' ' ? -->
  <polygon points="280,186 370,220 280,254 190,220" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="216" text-anchor="middle" font-size="11" fill="#333">s[i] == ' ' ?</text>
  <text x="280" y="232" text-anchor="middle" font-size="11" fill="#333">(空格?)</text>

  <!-- D2 No -> i++ box (right) -->
  <path d="M 370 220 L 415 220" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="212" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <rect x="415" y="198" width="80" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="455" y="224" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">i++</text>

  <!-- D2 Yes -> cnt++ (down) -->
  <path d="M 280 254 L 280 274" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="270" font-size="11" fill="#82b366">是</text>

  <!-- cnt++ box -->
  <rect x="232" y="278" width="96" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="299" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">cnt++</text>

  <!-- Arrow down to D3 -->
  <path d="M 280 310 L 280 326" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D3: cnt == k ? -->
  <polygon points="280,330 370,364 280,398 190,364" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="368" text-anchor="middle" font-size="12" fill="#333">cnt == k ?</text>

  <!-- D3 Yes -> return s[0..i-1] (right) -->
  <path d="M 370 364 L 410 364" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="388" y="356" text-anchor="middle" font-size="11" fill="#82b366">是</text>
  <rect x="410" y="342" width="135" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="477" y="362" text-anchor="middle" font-size="10" fill="#333">第 k 个空格命中</text>
  <text x="477" y="378" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回 s[0..i-1]</text>

  <!-- D3 No -> route to i++ box: right then up -->
  <path d="M 370 364 L 455 364 L 455 244" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="388" y="392" font-size="11" fill="#b85450">否</text>

  <!-- i++ loop back to D1: from top of i++ box up and left to D1 -->
  <path d="M 455 198 L 455 84 L 280 84 L 280 92" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="370" y="78" text-anchor="middle" font-size="10" fill="#888">继续下一字符</text>

  <!-- Summary note -->
  <text x="280" y="426" text-anchor="middle" font-size="10" fill="#888">关键：遇第 k 个空格立即 return；循环正常结束说明 k == 单词数，兜底返回 s</text>
  <text x="280" y="444" text-anchor="middle" font-size="10" fill="#888">辅助空间 O(1)，平均在第 k 个空格处提前停止</text>
</svg>
