<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：find(@) 分流 → 邮箱小写+首尾星号 / 电话抽数字+按位数套模板</text>

  <!-- start -->
  <rect x="250" y="44" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="15" filter="url(#rough2)"/>
  <text x="310" y="64" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">输入 s</text>
  <path d="M 310 74 L 310 92" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <path d="M 310 96 L 380 126 L 310 156 L 240 126 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="124" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">s.find('@')</text>
  <text x="310" y="140" text-anchor="middle" font-size="10" fill="#888">是否存在 @</text>

  <!-- yes arrow to email (left) -->
  <path d="M 240 126 L 130 126" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="180" y="120" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">是（邮箱）</text>

  <!-- no arrow to phone (right) -->
  <path d="M 380 126 L 490 126" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="435" y="120" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">否（电话）</text>

  <!-- ===== email column (left) ===== -->
  <rect x="40" y="150" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="130" y="170" text-anchor="middle" font-size="11" fill="#333">整串转小写</text>
  <path d="M 130 180 L 130 196" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="40" y="200" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="130" y="218" text-anchor="middle" font-size="11" fill="#333">取 s[0] + "*****"</text>
  <text x="130" y="232" text-anchor="middle" font-size="11" fill="#333">+ s[at-1] + s[at:]</text>
  <path d="M 130 240 L 130 256" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="40" y="260" width="180" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="130" y="278" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">返回邮箱结果</text>

  <!-- ===== phone column (right) ===== -->
  <rect x="400" y="150" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="490" y="170" text-anchor="middle" font-size="11" fill="#333">过滤出数字 d</text>
  <path d="M 490 180 L 490 196" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="400" y="200" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="490" y="220" text-anchor="middle" font-size="11" fill="#333">n = len(d)，last4 = d[-4:]</text>
  <path d="M 490 230 L 490 246" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- inner decision: n==10 ? -->
  <path d="M 490 250 L 540 272 L 490 294 L 440 272 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="276" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">n == 10 ?</text>

  <!-- n==10 -> left -->
  <path d="M 440 272 L 410 272" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="425" y="266" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="400" y="300" width="20" height="2" fill="#4a7a3a" filter="url(#rough2)"/>
  <rect x="330" y="296" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="370" y="313" text-anchor="middle" font-size="10" fill="#333">无 + 模板</text>
  <path d="M 370 322 L 370 338" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- n>10 -> right -->
  <path d="M 540 272 L 570 272" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="555" y="266" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="530" y="296" width="80" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="570" y="313" text-anchor="middle" font-size="10" fill="#333">+ 和 (n-10) 个 *</text>
  <path d="M 570 322 L 570 338" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="330" y="342" width="280" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="470" y="360" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">接 "-***-***-" + last4 返回</text>

  <!-- bottom legend -->
  <rect x="40" y="400" width="540" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="418" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">三个易错点</text>
  <text x="310" y="434" text-anchor="middle" font-size="10" fill="#444">① 邮箱星号固定 5 个（名字只有 2 字符也是 5）② n==10 不加 + ③ 反斜杠/转义无需关心，星号就是字面 '*'</text>
</svg>
