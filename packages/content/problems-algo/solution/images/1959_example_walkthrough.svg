    <rect x="170" y="118" width="40" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="190" y="132" text-anchor="middle" fill="#b85450" font-weight="bold">5</text>
    <rect x="210" y="118" width="40" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="230" y="132" text-anchor="middle">20</text>
    <rect x="250" y="118" width="40" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="270" y="132" text-anchor="middle">30</text>

    <!-- row l=2 -->
    <rect x="50" y="138" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="70" y="152" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">2</text>
    <rect x="90" y="138" width="40" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
    <text x="110" y="152" text-anchor="middle" fill="#ccc">—</text>
    <rect x="130" y="138" width="40" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
    <text x="150" y="152" text-anchor="middle" fill="#ccc">—</text>
    <rect x="170" y="138" width="40" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="190" y="152" text-anchor="middle">0</text>
    <rect x="210" y="138" width="40" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="230" y="152" text-anchor="middle">15</text>
    <rect x="250" y="138" width="40" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
