    <!-- row l=3 -->
    <rect x="50" y="158" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="70" y="172" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">3</text>
