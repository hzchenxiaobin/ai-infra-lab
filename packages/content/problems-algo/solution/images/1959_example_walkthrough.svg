<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：nums=[10,20,15,30,20], k=2</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">cost 表 → DP 表填表 → dp[5][2]=15</text>

  <!-- ===== cost table ===== -->
  <text x="30" y="72" font-size="11" fill="#446688" font-weight="bold">cost 表（cost[l][r] = max×len − sum）</text>

  <g font-size="9" fill="#333">
    <!-- header row: l\r -->
    <rect x="50" y="78" width="40" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="70" y="92" text-anchor="middle" font-size="8" fill="#888">l\r</text>
    <rect x="90" y="78" width="40" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="110" y="92" text-anchor="middle" font-size="8" fill="#888">0</text>
    <rect x="130" y="78" width="40" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="150" y="92" text-anchor="middle" font-size="8" fill="#888">1</text>
    <rect x="170" y="78" width="40" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
