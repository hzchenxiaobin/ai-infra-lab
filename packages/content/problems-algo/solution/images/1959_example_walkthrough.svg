    <!-- row l=1 -->
    <rect x="50" y="118" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="70" y="132" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">1</text>
    <rect x="90" y="118" width="40" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
