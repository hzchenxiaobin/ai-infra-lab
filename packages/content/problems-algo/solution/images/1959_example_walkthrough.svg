    <text x="270" y="92" text-anchor="middle" font-size="8" fill="#888">4</text>

    <!-- row l=0 -->
    <rect x="50" y="98" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="70" y="112" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">0</text>
    <rect x="90" y="98" width="40" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
