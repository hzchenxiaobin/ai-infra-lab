    <!-- row l=4 -->
    <rect x="50" y="178" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="70" y="192" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">4</text>
    <rect x="90" y="178" width="40" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
    <text x="110" y="192" text-anchor="middle" fill="#ccc">—</text>
    <rect x="130" y="178" width="40" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
    <text x="150" y="192" text-anchor="middle" fill="#ccc">—</text>
    <rect x="170" y="178" width="40" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
    <text x="190" y="192" text-anchor="middle" fill="#ccc">—</text>
    <rect x="210" y="178" width="40" height="20" fill="#f6f6f6" stroke="#ccc" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
    <text x="230" y="192" text-anchor="middle" fill="#ccc">—</text>
    <rect x="250" y="178" width="40" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="270" y="192" text-anchor="middle">0</text>
  </g>

  <!-- cost annotation -->
  <text x="300" y="112" font-size="9" fill="#888">cost[1][2]=5 ← 段[20,15]</text>
  <text x="300" y="124" font-size="8" fill="#888">max=20, len=2, sum=35</text>
  <text x="300" y="136" font-size="8" fill="#888">20×2−35=5</text>

  <!-- ===== DP table ===== -->
  <text x="30" y="216" font-size="11" fill="#d6a040" font-weight="bold">DP 表（dp[i][j] = 前 i 个用 j 次调整的最小浪费）</text>

  <g font-size="9" fill="#333">
    <!-- header -->
    <rect x="50" y="222" width="40" height="22" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="70" y="237" text-anchor="middle" font-size="8" fill="#888">i\j</text>
    <rect x="90" y="222" width="50" height="22" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="115" y="237" text-anchor="middle" font-size="8" fill="#888">0</text>
    <rect x="140" y="222" width="50" height="22" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="165" y="237" text-anchor="middle" font-size="8" fill="#888">1</text>
    <rect x="190" y="222" width="50" height="22" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="215" y="237" text-anchor="middle" font-size="8" fill="#888">2</text>

    <!-- row i=1 -->
    <rect x="50" y="244" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="70" y="259" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">1</text>
    <rect x="90" y="244" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="115" y="259" text-anchor="middle">0</text>
    <rect x="140" y="244" width="50" height="22" fill="#f6f6f6" stroke="#ccc" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
    <text x="165" y="259" text-anchor="middle" fill="#ccc">∞</text>
    <rect x="190" y="244" width="50" height="22" fill="#f6f6f6" stroke="#ccc" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
    <text x="215" y="259" text-anchor="middle" fill="#ccc">∞</text>

    <!-- row i=2 -->
    <rect x="50" y="266" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="70" y="281" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">2</text>
    <rect x="90" y="266" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="115" y="281" text-anchor="middle">10</text>
    <rect x="140" y="266" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="165" y="281" text-anchor="middle">0</text>
    <rect x="190" y="266" width="50" height="22" fill="#f6f6f6" stroke="#ccc" stroke-width="0.5" rx="2" filter="url(#rough2)"/>
    <text x="215" y="281" text-anchor="middle" fill="#ccc">∞</text>

    <!-- row i=3 -->
    <rect x="50" y="288" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="70" y="303" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">3</text>
    <rect x="90" y="288" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="115" y="303" text-anchor="middle">15</text>
    <rect x="140" y="288" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="165" y="303" text-anchor="middle">10</text>
    <rect x="190" y="288" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="215" y="303" text-anchor="middle">0</text>

    <!-- row i=4 -->
    <rect x="50" y="310" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="70" y="325" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">4</text>
    <rect x="90" y="310" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="115" y="325" text-anchor="middle">50</text>
    <rect x="140" y="310" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="165" y="325" text-anchor="middle">15</text>
    <rect x="190" y="310" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="215" y="325" text-anchor="middle">10</text>

    <!-- row i=5 -->
    <rect x="50" y="332" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="70" y="347" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">5</text>
    <rect x="90" y="332" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="115" y="347" text-anchor="middle">60</text>
    <rect x="140" y="332" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="165" y="347" text-anchor="middle">30</text>
    <rect x="190" y="332" width="50" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="2" filter="url(#rough2)"/>
    <text x="215" y="347" text-anchor="middle" fill="#b85450" font-weight="bold">15</text>
  </g>

  <!-- dp[5][2] transition annotation -->
  <rect x="260" y="290" width="270" height="90" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="395" y="308" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">dp[5][2] 转移详情</text>
  <text x="270" y="324" font-size="9" fill="#555">m=2: dp[2][1]+cost[2][4] = 0+25 = 25</text>
  <text x="270" y="338" font-size="9" fill="#555">m=3: dp[3][1]+cost[3][4] = 10+10 = 20</text>
  <text x="270" y="352" font-size="9" fill="#b85450" font-weight="bold">m=4: dp[4][1]+cost[4][4] = 15+0 = 15 ← min</text>
  <text x="270" y="368" font-size="8" fill="#888">前4个用1次调整 + 第5个单独1段</text>

  <!-- optimal solution -->
  <rect x="30" y="392" width="500" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="412" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">最优方案追溯：3 段 [10,20,15] [30] [20]</text>
  <text x="280" y="430" text-anchor="middle" font-size="10" fill="#555">段1: 20×3−45=15 | 段2: 30×1−30=0 | 段3: 20×1−20=0 → 总浪费=15</text>
  <text x="280" y="444" text-anchor="middle" font-size="9" fill="#888">与官方示例 [10] [20,15] [30,20]（0+5+10=15）殊途同归，最优值唯一方案不唯一</text>
</svg>
