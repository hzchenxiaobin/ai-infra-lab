<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="350" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：dfs(x) 的字符串 ＝ 全局后序串 T 的连续段</text>

  <!-- ===== 左侧：树 ===== -->
  <!-- 边 -->
  <line x1="148" y1="76" x2="94" y2="146" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="154" y1="76" x2="198" y2="146" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="90" y1="156" x2="62" y2="216" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="96" y1="156" x2="118" y2="216" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="200" y1="156" x2="200" y2="216" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="46" y="192" font-size="8.5" fill="#888" filter="url(#rough2)">孩子按编号升序访问</text>

  <!-- 节点 0（蓝） -->
  <circle cx="151" cy="66" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="151" y="70" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">0:a</text>
  <text x="151" y="96" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">完成@5</text>

  <!-- 节点 1、3、4（绿：子树1） -->
  <circle cx="92" cy="148" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="92" y="152" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1:a</text>
  <text x="92" y="178" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">完成@2</text>
  <circle cx="60" cy="228" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="232" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3:a</text>
  <text x="60" y="258" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">完成@0</text>
  <circle cx="122" cy="228" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="122" y="232" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">4:b</text>
  <text x="122" y="258" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">完成@1</text>

  <!-- 节点 2、5（橙：子树2） -->
  <circle cx="200" cy="148" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="200" y="152" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">2:b</text>
  <text x="200" y="178" text-anchor="middle" font-size="8.5" fill="#d6a040" filter="url(#rough2)">完成@4</text>
  <circle cx="200" cy="228" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="232" text-anchor="middle" font-size="9.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">5:a</text>
  <text x="200" y="258" text-anchor="middle" font-size="8.5" fill="#d6a040" filter="url(#rough2)">完成@3</text>

  <text x="130" y="292" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">圆圈内「编号:字符」，@k＝后序完成时刻</text>

  <!-- ===== 右侧：T 与区间 ===== -->
  <rect x="286" y="44" width="226" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="399" y="60" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">子树(0)：完成时刻 0…5 连续</text>
  <text x="399" y="75" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">区间 [0,5]，即整条 T</text>

  <!-- T 格子 -->
  <rect x="300" y="100" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="332" y="100" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="364" y="100" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="396" y="100" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="428" y="100" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="460" y="100" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="316" y="121" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="348" y="121" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="380" y="121" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="412" y="121" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="444" y="121" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="476" y="121" text-anchor="middle" font-size="13" fill="#33506b" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="316" y="146" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">0</text>
  <text x="348" y="146" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">1</text>
  <text x="380" y="146" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">2</text>
  <text x="412" y="146" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">3</text>
  <text x="444" y="146" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">4</text>
  <text x="476" y="146" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">5</text>
  <text x="286" y="80" font-size="9" fill="#888" filter="url(#rough2)">T＝</text>

  <!-- 绿色区间 [0,2] -->
  <path d="M 300 156 L 300 162 L 396 162 L 396 156" fill="none" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="302" y="178" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">子树(1)：[0..2]</text>
  <text x="302" y="193" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">"aba" ✓ 回文</text>

  <!-- 橙色区间 [3,4] -->
  <path d="M 396 156 L 396 162 L 460 162 L 460 156" fill="none" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="398" y="178" font-size="9.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">子树(2)：[3..4]</text>
  <text x="398" y="193" font-size="9.5" fill="#a07830" filter="url(#rough2)">"ab" ✗</text>

  <text x="286" y="218" font-size="8.5" fill="#888" filter="url(#rough2)">叶子 3、4、5：单格区间，天然回文</text>

  <!-- 关键结论框 -->
  <rect x="286" y="232" width="226" height="98" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="399" y="252" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">为什么子树＝连续段？</text>
  <text x="296" y="270" font-size="9" fill="#7a5a20" filter="url(#rough2)">dfs(x) 是一段不被打断的递归，</text>
  <text x="296" y="285" font-size="9" fill="#7a5a20" filter="url(#rough2)">它追加的字符在 T 中恰好连续；</text>
  <text x="296" y="300" font-size="9" fill="#7a5a20" filter="url(#rough2)">右端点就是 x 自己的完成时刻。</text>
  <text x="296" y="318" font-size="9.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">区间＝[pos(x)−size(x)+1, pos(x)]</text>
</svg>
