<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">为什么 dp 值必须是「集合」？—— 最优子结构被「和 &lt; t」破坏</text>

  <!-- 左列：反例 -->
  <text x="30" y="50" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">反例（t = 8）：</text>

  <rect x="28" y="60" width="100" height="24" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="78" y="76" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">前缀和 3</text>

  <rect x="142" y="60" width="100" height="24" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="192" y="76" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#446688" filter="url(#rough2)">前缀和 5</text>

  <path d="M 78 86 C 78 96, 110 96, 121 105" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 192 86 C 192 96, 154 96, 143 105" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <circle cx="132" cy="118" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="132" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a6020" filter="url(#rough2)">u</text>

  <path d="M 132 133 L 132 165" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="147" y="153" font-size="10" font-weight="bold" fill="#d6a040" filter="url(#rough2)">w = 4</text>

  <circle cx="132" cy="180" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="132" y="184" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a6020" filter="url(#rough2)">v</text>

  <path d="M 122 193 C 102 202, 90 205, 80 210" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 142 193 C 162 202, 174 205, 184 210" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <rect x="28" y="212" width="100" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="78" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">3 + 4 = 7</text>
  <text x="78" y="243" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">7 &lt; 8 ✓ 存活</text>

  <rect x="142" y="212" width="100" height="38" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="192" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">5 + 4 = 9</text>
  <text x="192" y="243" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">9 ≥ 8 ✗ 剪掉</text>

  <text x="135" y="266" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">只存最大值 5 ⇒ 到 v 无解（WA）</text>
  <text x="135" y="280" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">存集合 {3, 5} ⇒ 得到答案 7 ✓</text>

  <!-- 右列：bitset 视角 -->
  <text x="268" y="50" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">bitset 视角：第 s 位 = 「和 s 可达」</text>

  <text x="268" y="93" font-size="9.5" fill="#666" filter="url(#rough2)">dp[j][u]：</text>

  <!-- 第一行格子：和 0..9，置位 3、5 -->
  <rect x="334" y="78" width="18" height="22" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="343" y="92" text-anchor="middle" font-size="8.5" fill="#ccc" filter="url(#rough2)">0</text>
  <rect x="352" y="78" width="18" height="22" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="361" y="92" text-anchor="middle" font-size="8.5" fill="#ccc" filter="url(#rough2)">1</text>
  <rect x="370" y="78" width="18" height="22" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="379" y="92" text-anchor="middle" font-size="8.5" fill="#ccc" filter="url(#rough2)">2</text>
  <rect x="388" y="78" width="18" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="397" y="92" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#446688" filter="url(#rough2)">3</text>
  <rect x="406" y="78" width="18" height="22" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="415" y="92" text-anchor="middle" font-size="8.5" fill="#ccc" filter="url(#rough2)">4</text>
  <rect x="424" y="78" width="18" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="433" y="92" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#446688" filter="url(#rough2)">5</text>
  <rect x="442" y="78" width="18" height="22" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="451" y="92" text-anchor="middle" font-size="8.5" fill="#ccc" filter="url(#rough2)">6</text>
  <rect x="460" y="78" width="18" height="22" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="469" y="92" text-anchor="middle" font-size="8.5" fill="#ccc" filter="url(#rough2)">7</text>
  <rect x="478" y="78" width="18" height="22" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="487" y="92" text-anchor="middle" font-size="8.5" fill="#ccc" filter="url(#rough2)">8</text>
  <rect x="496" y="78" width="18" height="22" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="505" y="92" text-anchor="middle" font-size="8.5" fill="#ccc" filter="url(#rough2)">9</text>

  <path d="M 340 102 L 340 124" fill="none" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="350" y="117" font-size="9.5" font-weight="bold" fill="#d6a040" filter="url(#rough2)">左移 4 位</text>
  <text x="478" y="116" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">t = 8 界</text>

  <text x="268" y="141" font-size="9.5" fill="#666" filter="url(#rough2)">移位后：</text>

  <!-- 第二行格子：和 0..9，置位 7（存活）、9（被剪） -->
  <rect x="334" y="126" width="18" height="22" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="343" y="140" text-anchor="middle" font-size="8.5" fill="#ccc" filter="url(#rough2)">0</text>
  <rect x="352" y="126" width="18" height="22" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="361" y="140" text-anchor="middle" font-size="8.5" fill="#ccc" filter="url(#rough2)">1</text>
  <rect x="370" y="126" width="18" height="22" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="379" y="140" text-anchor="middle" font-size="8.5" fill="#ccc" filter="url(#rough2)">2</text>
  <rect x="388" y="126" width="18" height="22" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="397" y="140" text-anchor="middle" font-size="8.5" fill="#ccc" filter="url(#rough2)">3</text>
  <rect x="406" y="126" width="18" height="22" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="415" y="140" text-anchor="middle" font-size="8.5" fill="#ccc" filter="url(#rough2)">4</text>
  <rect x="424" y="126" width="18" height="22" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="433" y="140" text-anchor="middle" font-size="8.5" fill="#ccc" filter="url(#rough2)">5</text>
  <rect x="442" y="126" width="18" height="22" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="451" y="140" text-anchor="middle" font-size="8.5" fill="#ccc" filter="url(#rough2)">6</text>
  <rect x="460" y="126" width="18" height="22" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="469" y="140" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">7</text>
  <rect x="478" y="126" width="18" height="22" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="487" y="140" text-anchor="middle" font-size="8.5" fill="#ccc" filter="url(#rough2)">8</text>
  <rect x="496" y="126" width="18" height="22" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="505" y="140" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">9</text>

  <path d="M 478 120 L 478 154" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M 498 128 L 512 146" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 512 128 L 498 146" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>

  <text x="334" y="164" font-size="9.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">9 被 mask 剪掉 ⇒ dp[j+1][v] = {7}</text>

  <rect x="266" y="172" width="248" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="191" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a6020" filter="url(#rough2)">nxt[v] |= (dp[u] &lt;&lt; w) &amp; mask</text>

  <text x="268" y="218" font-size="9" fill="#666" filter="url(#rough2)">mask = 低 t 位全 1：一次与运算完成「≥ t 即剪」</text>
  <text x="268" y="234" font-size="9" fill="#666" filter="url(#rough2)">同一节点的多条入边用 |= 合并</text>
  <text x="268" y="250" font-size="9" fill="#666" filter="url(#rough2)">集合元素 ∈ [0, t) ⇒ 每个状态 ≤ t 位</text>

  <rect x="266" y="262" width="248" height="26" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="390" y="279" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">官方 hint：dp[i][j] = 「和 &lt; T 的权值集合」</text>

  <!-- 底部结论 -->
  <rect x="30" y="300" width="460" height="48" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="320" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f5527" filter="url(#rough2)">「和 &lt; t」破坏最优子结构 ⇒ dp 值 = 可达和的集合（非单个最大值）</text>
  <text x="260" y="339" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">正权 ⇒ 前缀和单调增 ⇒ ≥ t 永久不可行 ⇒ 剪枝安全，状态 ≤ t 位</text>
</svg>
