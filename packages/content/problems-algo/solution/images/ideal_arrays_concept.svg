<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：整除链 ⟺ 各质因子指数非降序列</text>

  <!-- Row 1: array chain -->
  <text x="28" y="56" font-size="10.5" fill="#666" filter="url(#rough2)">长度 n 的数组</text>

  <rect x="78" y="40" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="99" y="60" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a₀</text>

  <path d="M 124 55 L 144 55" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="134" y="49" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">|</text>

  <rect x="148" y="40" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="169" y="60" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a₁</text>

  <text x="208" y="60" text-anchor="middle" font-size="14" fill="#888" filter="url(#rough2)">…</text>

  <path d="M 222 55 L 242 55" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="246" y="40" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="60" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">aₙ₋₂</text>

  <path d="M 298 55 L 318 55" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="322" y="40" width="78" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="361" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">v = aₙ₋₁</text>

  <text x="416" y="58" font-size="10" fill="#888" filter="url(#rough2)">a₀|a₁|…|v</text>

  <!-- transitivity note -->
  <text x="260" y="88" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">传递性 ⟹ 每个 aᵢ 都整除 v ⟹ aᵢ 是 v 的因子</text>

  <!-- Row 2: prime factorization -->
  <rect x="120" y="98" width="280" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="118" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">v = p₁^e₁ · p₂^e₂ · … · pₖ^eₖ</text>

  <!-- Row 3: exponent sequence -->
  <text x="28" y="162" font-size="10.5" fill="#666" filter="url(#rough2)">p₁ 指数序列(长 n)</text>

  <rect x="108" y="148" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="123" y="167" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="140" y="148" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="167" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="172" y="148" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="187" y="167" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="204" y="148" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="219" y="167" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="236" y="148" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="251" y="167" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="268" y="148" width="30" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="283" y="167" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="306" y="167" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">= e₁</text>
  <text x="346" y="167" font-size="10" fill="#888" filter="url(#rough2)">非降 ↑</text>

  <!-- stars-and-bars box -->
  <rect x="70" y="194" width="380" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="213" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">长度 n、末位 = eⱼ、取值 ∈[0, eⱼ] 的非降序列</text>
  <text x="260" y="231" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">前 n−1 位自由非降 ⟹ C(n−1+eⱼ, eⱼ) 种（隔板法）</text>

  <!-- product formula -->
  <text x="260" y="266" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">cnt(v) = ∏ⱼ C(n−1+eⱼ, eⱼ)</text>

  <path d="M 260 278 L 260 290" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- sum formula -->
  <rect x="110" y="296" width="300" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="316" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 = Σ_{v=1}^{maxValue} cnt(v)</text>

  <text x="260" y="346" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">cnt 是积性函数：素数独立相乘，可逐值分解求和</text>
</svg>
