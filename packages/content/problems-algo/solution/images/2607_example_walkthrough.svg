<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：arr=[2,5,5,7], k=3, n=4</text>

  <!-- gcd box -->
  <rect x="40" y="42" width="520" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="62" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold">g = gcd(4, 3) = 1 → 仅 1 个等价类，全部下标同组</text>
  <text x="300" y="80" text-anchor="middle" font-size="10.5" fill="#555">约束 arr[i]=arr[(i+3)%4] 把 4 个位置串成一个环</text>

  <path d="M 40 96 L 560 96" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- original array -->
  <text x="40" y="124" font-size="11" fill="#888" font-weight="bold">原数组</text>
  <rect x="120" y="110" width="60" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="150" y="142" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">2</text>
  <rect x="184" y="110" width="60" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="214" y="142" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">5</text>
  <rect x="248" y="110" width="60" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="278" y="142" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">5</text>
  <rect x="312" y="110" width="60" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="342" y="142" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">7</text>

  <text x="150" y="174" text-anchor="middle" font-size="10" fill="#888">i=0</text>
  <text x="214" y="174" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="278" y="174" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="342" y="174" text-anchor="middle" font-size="10" fill="#888">3</text>

  <!-- arrow down to sorted -->
  <path d="M 300 186 L 300 206" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- sorted group -->
  <text x="40" y="232" font-size="11" fill="#888" font-weight="bold">排序后</text>
  <rect x="120" y="218" width="60" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="150" y="250" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">2</text>
  <rect x="184" y="218" width="60" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="214" y="250" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">5</text>
  <!-- median box highlighted -->
  <rect x="248" y="218" width="60" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="278" y="250" text-anchor="middle" font-size="18" font-weight="bold" fill="#b85450">5</text>
  <rect x="312" y="218" width="60" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="342" y="250" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">7</text>

  <text x="278" y="284" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">↑ median = group[m/2] = group[2] = 5</text>

  <path d="M 40 296 L 560 296" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- prefix sum + cost -->
  <text x="40" y="322" font-size="11.5" fill="#4a7a3a" font-weight="bold">前缀和 prefix = [0, 2, 7, 12, 19]，total = 19</text>

  <text x="40" y="350" font-size="11.5" fill="#333">mid = m/2 = 2，median = 5</text>
  <text x="40" y="372" font-size="11.5" fill="#333">左半 = median·mid − prefix[mid] = 5·2 − 7 = 10 − 7 = <tspan font-weight="bold" fill="#446688">3</tspan></text>
  <text x="40" y="394" font-size="11.5" fill="#333">右半 = (total − prefix[mid]) − median·(m−mid) = (19−7) − 5·2 = 12 − 10 = <tspan font-weight="bold" fill="#4a7a3a">2</tspan></text>

  <!-- answer box -->
  <rect x="40" y="410" width="520" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="430" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">answer = 左半 + 右半 = 3 + 2 = 5</text>
  <text x="300" y="450" text-anchor="middle" font-size="11" fill="#555">验证：|2−5|+|5−5|+|5−5|+|7−5| = 3+0+0+2 = 5 ✓</text>

  <defs>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>
</svg>
