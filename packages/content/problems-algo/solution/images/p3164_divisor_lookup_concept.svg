<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：整除条件换向 —— 枚举 x/k 的约数，查 nums2 频次表</text>

  <rect x="28" y="44" width="216" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="136" y="66" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">暴力：逐对判定 n·m 个下标对</text>
  <text x="136" y="86" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">10⁵ × 10⁵ = 10¹⁰ 次取模 → 必超时 ✗</text>

  <rect x="282" y="44" width="210" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="387" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">换向：值去重 + 频次表</text>
  <text x="387" y="86" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">下标对计数 → 约数查表</text>

  <path d="M387,98 L387,116 L260,116 L260,126" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="128" width="92" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="76" y="147" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">x = 12</text>
  <text x="76" y="161" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">cnt1[12] = 1</text>

  <path d="M122,148 L148,148" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="128" width="116" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="208" y="145" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">k = 3 整除 x ?</text>
  <text x="208" y="160" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">12 % 3 == 0 ✓</text>

  <path d="M266,148 L292,148" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="294" y="128" width="100" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="344" y="147" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">y = x/k = 4</text>
  <text x="344" y="161" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">试除到 √4 = 2</text>

  <text x="192" y="196" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">y = 4 的全部约数 d（一个 d 白得一个对称约数 y/d）</text>

  <path d="M344,168 C344,186 92,180 92,200" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M344,168 C344,188 192,182 192,200" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M344,168 C340,188 292,184 292,200" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="56" y="202" width="72" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="92" y="224" text-anchor="middle" font-size="13" fill="#777" filter="url(#rough2)">d = 1</text>

  <rect x="156" y="202" width="72" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="192" y="224" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">d = 2</text>

  <rect x="256" y="202" width="72" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="292" y="224" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">d = 4</text>

  <text x="92" y="254" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">cnt2[1] = 0 ✗</text>
  <text x="192" y="254" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">cnt2[2] = 1 ✓</text>
  <text x="292" y="254" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">cnt2[4] = 1 ✓</text>

  <rect x="368" y="196" width="122" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="429" y="214" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">cnt2（哈希表）</text>
  <text x="429" y="234" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">2 : 1</text>
  <text x="429" y="254" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">4 : 1</text>

  <path d="M228,219 L366,230" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M328,219 L366,250" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="282" width="460" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="306" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">x = 12 的贡献 = cnt1[12] × (cnt2[1] + cnt2[2] + cnt2[4]) = 1 × 2 = 2</text>

  <rect x="30" y="332" width="460" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="352" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">关键改写：nums2[j]·k | x ⟺ k | x 且 nums2[j] | x/k</text>
  <text x="260" y="371" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">先除后枚举：试除上界 √x → √(x/k)；答案必须 long long</text>
</svg>
