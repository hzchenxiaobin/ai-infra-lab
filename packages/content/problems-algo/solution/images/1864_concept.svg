<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#aaa"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
    <marker id="arrRs" markerWidth="9" markerHeight="9" refX="2" refY="4.5" orient="auto">
      <path d="M9,0 L0,4.5 L9,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心：一次交换修复两个错位 → swaps = mismatches / 2</text>

  <!-- index labels -->
  <g filter="url(#rough2)" font-size="9" fill="#aaa" text-anchor="middle">
    <text x="130" y="62">i=0</text>
    <text x="190" y="62">i=1</text>
    <text x="250" y="62">i=2</text>
    <text x="310" y="62">i=3</text>
    <text x="370" y="62">i=4</text>
    <text x="430" y="62">i=5</text>
  </g>

  <!-- s row -->
  <text x="50" y="91" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">s</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="102" y="70" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="130" y="91" fill="#333" font-weight="bold">1</text>
    <rect x="162" y="70" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="190" y="91" fill="#333" font-weight="bold">1</text>
    <rect x="222" y="70" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="250" y="91" fill="#333" font-weight="bold">1</text>
    <rect x="282" y="70" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="310" y="91" fill="#333" font-weight="bold">0</text>
    <rect x="342" y="70" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="370" y="91" fill="#333" font-weight="bold">0</text>
    <rect x="402" y="70" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="430" y="91" fill="#333" font-weight="bold">0</text>
  </g>
  <text x="510" y="91" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">cnt₀=3 cnt₁=3</text>

  <!-- Pattern B row: 1 0 1 0 1 0 ; mismatches at pos1(1vs0) and pos4(0vs1) -->
  <text x="42" y="146" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">目标B</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="102" y="125" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="130" y="146" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="162" y="125" width="56" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <text x="190" y="146" fill="#b85450" font-weight="bold">0</text>
    <rect x="222" y="125" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="250" y="146" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="282" y="125" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="310" y="146" fill="#4a7a3a" font-weight="bold">0</text>
    <rect x="342" y="125" width="56" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <text x="370" y="146" fill="#b85450" font-weight="bold">1</text>
    <rect x="402" y="125" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="430" y="146" fill="#4a7a3a" font-weight="bold">0</text>
  </g>

  <!-- mismatch annotations -->
  <g filter="url(#rough2)" font-size="9" text-anchor="middle">
    <text x="130" y="172" fill="#4a7a3a">✓</text>
    <text x="190" y="172" fill="#b85450" font-weight="bold">✗ 1在错位</text>
    <text x="250" y="172" fill="#4a7a3a">✓</text>
    <text x="310" y="172" fill="#4a7a3a">✓</text>
    <text x="370" y="172" fill="#b85450" font-weight="bold">✗ 0在错位</text>
    <text x="430" y="172" fill="#4a7a3a">✓</text>
  </g>

  <!-- Swap arrow between pos1 and pos4 -->
  <path d="M 190 182 Q 280 214 370 182" stroke="#b85450" stroke-width="2" fill="none"
        stroke-dasharray="5,3" marker-end="url(#arrR)" marker-start="url(#arrRs)" filter="url(#rough2)"/>
  <text x="280" y="220" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">交换 s[1] ↔ s[4]</text>

  <!-- After swap row -->
  <text x="42" y="251" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">交换后</text>
  <g filter="url(#rough2)" font-size="13" text-anchor="middle">
    <rect x="102" y="230" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="130" y="251" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="162" y="230" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="190" y="251" fill="#4a7a3a" font-weight="bold">0</text>
    <rect x="222" y="230" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="250" y="251" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="282" y="230" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="310" y="251" fill="#4a7a3a" font-weight="bold">0</text>
    <rect x="342" y="230" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="370" y="251" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="402" y="230" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="430" y="251" fill="#4a7a3a" font-weight="bold">0</text>
  </g>
  <text x="510" y="251" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 交替！</text>

  <!-- Formula box -->
  <rect x="60" y="288" width="520" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="320" y="310" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">错位的 0 数量 = 错位的 1 数量（交换不改频次，故成对出现）</text>
  <text x="320" y="332" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">swaps = mismatches / 2</text>

  <!-- Feasibility note -->
  <rect x="60" y="356" width="520" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="378" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">可行性前提：cnt₀ 和 cnt₁ 必须匹配目标模式的需求</text>
  <text x="320" y="396" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">n 偶：cnt₀ = cnt₁ = n/2      n 奇：|cnt₀ − cnt₁| = 1</text>
</svg>
