<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrL" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：环形距离 = min(顺时针步数 r, 逆时针步数 l)，且 r + l = n</text>

  <!-- Circular array: linear row of 5 cells for example1 words, with wrap hint -->
  <!-- indices labels -->
  <text x="80"  y="76" text-anchor="middle" font-size="11" fill="#888">下标 0</text>
  <text x="160" y="76" text-anchor="middle" font-size="11" fill="#888">下标 1</text>
  <text x="240" y="76" text-anchor="middle" font-size="11" fill="#888">下标 2</text>
  <text x="320" y="76" text-anchor="middle" font-size="11" fill="#888">下标 3</text>
  <text x="400" y="76" text-anchor="middle" font-size="11" fill="#888">下标 4</text>

  <!-- Cell 0: target (red) -->
  <rect x="56" y="86" width="48" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="112" text-anchor="middle" font-size="13" fill="#333">hello</text>
  <text x="80"  y="146" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">target</text>

  <!-- Cell 1: start (green, bold) -->
  <rect x="136" y="86" width="48" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="160" y="112" text-anchor="middle" font-size="13" fill="#333">i</text>
  <text x="160" y="146" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">← 起点 start</text>

  <!-- Cell 2 -->
  <rect x="216" y="86" width="48" height="40" fill="#fff" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="240" y="112" text-anchor="middle" font-size="13" fill="#666">am</text>

  <!-- Cell 3 -->
  <rect x="296" y="86" width="48" height="40" fill="#fff" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="320" y="112" text-anchor="middle" font-size="12" fill="#666">leetcode</text>

  <!-- Cell 4: target (red) -->
  <rect x="376" y="86" width="48" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="400" y="112" text-anchor="middle" font-size="13" fill="#333">hello</text>
  <text x="400" y="146" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">target</text>

  <!-- wrap-around hints: tail -> head -->
  <path d="M 424 96 Q 470 96 470 70 Q 470 48 250 48 Q 56 48 56 70 L 56 86"
        stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="250" y="42" text-anchor="middle" font-size="10.5" fill="#888">尾部 ↔ 首部相连（环形）</text>

  <!-- Divider -->
  <path d="M 40 168 L 520 168" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- To index 0: clockwise r=4 (green, going right wrapping around) and counter l=1 (red, going left) -->
  <text x="280" y="190" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">到下标 0 的两条路（起点 start=1，n=5）</text>

  <!-- clockwise path to index0: from 160 -> right -> wrap -> 80, r=4 -->
  <path d="M 160 220 L 392 220" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="276" y="214" text-anchor="middle" font-size="11" fill="#4a7a3a">顺时针 r = (0−1+5)%5 = 4</text>
  <path d="M 392 220 Q 440 220 440 240 Q 440 262 80 262 L 80 232" stroke="#4a7a3a" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="270" y="276" text-anchor="middle" font-size="10" fill="#4a7a3a">（绕大半圈，长）</text>

  <!-- counter-clockwise path to index0: from 160 -> left -> 80, l=1 -->
  <path d="M 160 300 L 96 300" stroke="#b85450" stroke-width="2.4" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="128" y="322" text-anchor="middle" font-size="11" fill="#b85450">逆时针 l = (1−0+5)%5 = 1</text>

  <!-- min result -->
  <rect x="360" y="284" width="150" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="435" y="302" text-anchor="middle" font-size="11" fill="#d6a040">取小</text>
  <text x="435" y="320" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">dist(0) = min(4,1) = 1</text>

  <!-- Bottom notes -->
  <text x="50" y="348" font-size="11" fill="#555">• 顺/逆两条路互补：i≠start 时 r + l = n，故 min(r,l) ≤ ⌊n/2⌋（最短不超半圈）</text>
</svg>
