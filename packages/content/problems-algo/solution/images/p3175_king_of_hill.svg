<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：前 n−1 场就是一个「打擂台」</text>

  <rect x="160" y="52" width="200" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="76" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">擂主 cur（队首）</text>
  <text x="260" y="97" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">开局 = 玩家 0</text>

  <path d="M 84 158 C 84 130, 150 112, 205 104" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 260 158 C 260 138, 260 128, 260 118" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 436 158 C 436 130, 370 112, 315 104" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="48" y="158" width="72" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="84" y="176" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">挑战者1</text>
  <text x="84" y="194" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">技能 2</text>
  <text x="84" y="222" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">败 → 队尾</text>

  <rect x="148" y="158" width="72" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="184" y="176" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">挑战者2</text>
  <text x="184" y="194" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">技能 6</text>
  <text x="184" y="222" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">胜 → 登基！</text>

  <rect x="248" y="158" width="72" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="284" y="176" text-anchor="middle" font-size="12" fill="#8a6a20" filter="url(#rough2)">挑战者3</text>
  <text x="284" y="194" text-anchor="middle" font-size="11" fill="#8a6a20" filter="url(#rough2)">技能 3</text>
  <text x="284" y="222" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">败 → 队尾</text>

  <rect x="348" y="158" width="88" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="392" y="176" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">挑战者4 …</text>
  <text x="392" y="194" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">技能 9</text>
  <text x="392" y="222" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">更强 → 换王</text>

  <path d="M 120 181 L 144 181" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 220 181 L 244 181" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 320 181 L 344 181" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="244" width="222" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="141" y="266" text-anchor="middle" font-size="12.5" fill="#8a3a34" font-weight="bold" filter="url(#rough2)">新王：skills[i] &gt; skills[cur]</text>
  <text x="141" y="288" text-anchor="middle" font-size="12" fill="#8a3a34" filter="url(#rough2)">→ cur = i，连胜重置为 1</text>

  <rect x="268" y="244" width="222" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="379" y="266" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">守擂：skills[i] &lt; skills[cur]</text>
  <text x="379" y="288" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">→ 连胜 +1（win++）</text>

  <text x="260" y="334" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">败者被甩到队尾，不影响出场顺序：</text>
  <text x="260" y="352" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">第 i 场 = 擂主 vs 原队列玩家 i（i = 1 … n−1）</text>
</svg>
