<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：二分窗口左边界</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">搜索范围 [0, n−k]，答案即最终 low</text>

  <!-- step 1: init -->
  <rect x="170" y="62" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="80" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">初始化</text>
  <text x="280" y="96" text-anchor="middle" font-size="11" fill="#555">low = 0,  high = n − k</text>
  <path d="M 280 102 L 280 120" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop condition -->
  <path d="M 280 122 L 360 156 L 280 190 L 200 156 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="152" text-anchor="middle" font-size="11.5" fill="#333">low &lt; high ?</text>
  <text x="280" y="168" text-anchor="middle" font-size="10.5" fill="#888">（循环条件）</text>

  <!-- yes branch down -->
  <path d="M 280 190 L 280 210" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="204" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- compute mid -->
  <rect x="170" y="214" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="236" text-anchor="middle" font-size="11.5" fill="#333">mid = (low + high) / 2   （下取整）</text>
  <path d="M 280 248 L 280 262" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- compare diamond -->
  <path d="M 280 264 L 392 304 L 280 344 L 168 304 Z" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="298" text-anchor="middle" font-size="10.8" fill="#333">x − arr[mid]</text>
  <text x="280" y="312" text-anchor="middle" font-size="10.8" fill="#333">≤ arr[mid+k] − x ?</text>
  <text x="280" y="326" text-anchor="middle" font-size="10" fill="#888">比较两端到 x 的距离</text>

  <!-- left: yes -> high = mid -->
  <path d="M 168 304 L 90 304" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="128" y="296" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="20" y="318" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="90" y="340" text-anchor="middle" font-size="11" fill="#333">high = mid</text>

  <!-- right: no -> low = mid+1 -->
  <path d="M 392 304 L 470 304" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="432" y="296" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="470" y="318" width="140" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="540" y="340" text-anchor="middle" font-size="11" fill="#333">low = mid + 1</text>

  <!-- loop back arrow -->
  <path d="M 90 352 L 90 156 L 200 156" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 540 352 L 540 156 L 360 156" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="60" y="258" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 60 258)">回到循环</text>

  <!-- no branch: exit -->
  <path d="M 360 156 L 460 156" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="148" text-anchor="middle" font-size="11" fill="#888">否 · 退出</text>

  <rect x="430" y="172" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="520" y="190" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">返回结果</text>
  <text x="520" y="206" text-anchor="middle" font-size="10.5" fill="#555">arr[low : low+k]</text>

  <!-- bottom invariant -->
  <rect x="30" y="384" width="500" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="404" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">循环不变量：答案左边界始终落在 [low, high] 内</text>
  <text x="280" y="422" text-anchor="middle" font-size="10.5" fill="#555">· 比较两端到 x 距离，等号取「保留左侧」 → 平局偏小数，符合题意</text>
  <text x="280" y="438" text-anchor="middle" font-size="10.5" fill="#555">· 范围每轮至少折半，low==high 时即为唯一答案</text>
</svg>
