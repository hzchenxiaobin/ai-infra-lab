<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="4" refY="8" orient="auto">
      <path d="M0,0 L4,8 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14.5" fill="#555" font-weight="bold">算法流程：精力一次公式 + 经验逐场贪心补足</text>

  <!-- Step 1: energy part -->
  <rect x="40" y="48" width="480" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="56" y="74" font-size="12.5" fill="#d6a040" font-weight="bold">① 精力部分</text>
  <text x="160" y="68" font-size="12" fill="#333">trainE = max(0, Σenergy + 1 − initialEnergy)</text>
  <text x="160" y="84" font-size="10.5" fill="#888">求和后一次公式，O(n)</text>

  <path d="M 280 92 L 280 108" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: init experience -->
  <rect x="40" y="112" width="480" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="56" y="134" font-size="12.5" fill="#446688" font-weight="bold">② 初始化</text>
  <text x="170" y="134" font-size="12" fill="#333">curExp = initialExperience; trainExp = 0</text>

  <path d="M 280 146 L 280 162" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 3: loop -->
  <rect x="40" y="166" width="480" height="110" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="56" y="188" font-size="12.5" fill="#4a7a3a" font-weight="bold">③ 遍历 i = 0 … n−1（经验贪心补足）</text>

  <!-- decision diamond -->
  <polygon points="280,196 360,214 280,232 200,214" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="210" text-anchor="middle" font-size="10.5" fill="#b85450">curExp ≤ exp[i]?</text>
  <text x="280" y="222" text-anchor="middle" font-size="9.5" fill="#b85450">（不足则补）</text>

  <!-- yes branch -->
  <path d="M 360 214 L 408 214" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="380" y="210" text-anchor="middle" font-size="10" fill="#b85450">是</text>
  <rect x="410" y="200" width="100" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="460" y="219" text-anchor="middle" font-size="10" fill="#d6a040">need = exp[i]+1−cur</text>
  <text x="460" y="247" text-anchor="middle" font-size="10" fill="#333">trainExp += need</text>
  <text x="460" y="261" text-anchor="middle" font-size="10" fill="#333">curExp = exp[i] + 1</text>

  <!-- no branch (skip) -->
  <path d="M 200 214 L 130 214 L 130 250" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="150" y="210" text-anchor="middle" font-size="10" fill="#4a7a3a">否</text>
  <text x="130" y="266" text-anchor="middle" font-size="10" fill="#888">无需训练</text>

  <!-- after decision: win -->
  <path d="M 280 232 L 280 258" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="190" y="260" width="180" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="276" text-anchor="middle" font-size="11" fill="#446688">击败：curExp += exp[i]</text>

  <!-- loop back arrow -->
  <path d="M 510 215 L 510 160 L 280 160" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="395" y="156" text-anchor="middle" font-size="9.5" fill="#888">下一场 i++</text>

  <path d="M 280 284 L 280 300" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 4: return -->
  <rect x="40" y="304" width="480" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="56" y="328" font-size="12.5" fill="#b85450" font-weight="bold">④ 返回</text>
  <text x="170" y="328" font-size="12.5" fill="#333" font-weight="bold">trainE + trainExp</text>
  <text x="320" y="328" font-size="11" fill="#888">= 精力训练 + 经验训练</text>

  <text x="40" y="366" font-size="10.5" fill="#555">精力：单调递减→总量约束→公式 O(n)；经验：单调递增→逐场判断→贪心 O(n)。两者解耦，各算各的。</text>
</svg>
