<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：dp[1..8] 逐格递推（n%2 规律自然显现）</text>

  <!-- 行标：n -->
  <text x="70" y="68" text-anchor="end" font-size="11" fill="#888" font-weight="bold">n</text>
  <!-- 8 个 n 格 -->
  <g font-size="12" fill="#333">
    <rect x="80"  y="52" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="106" y="72" text-anchor="middle" font-weight="bold">1</text>
    <rect x="132" y="52" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="158" y="72" text-anchor="middle" font-weight="bold">2</text>
    <rect x="184" y="52" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="210" y="72" text-anchor="middle" font-weight="bold">3</text>
    <rect x="236" y="52" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="262" y="72" text-anchor="middle" font-weight="bold">4</text>
    <rect x="288" y="52" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="314" y="72" text-anchor="middle" font-weight="bold">5</text>
    <rect x="340" y="52" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="366" y="72" text-anchor="middle" font-weight="bold">6</text>
    <rect x="392" y="52" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="418" y="72" text-anchor="middle" font-weight="bold">7</text>
    <rect x="444" y="52" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/><text x="470" y="72" text-anchor="middle" font-weight="bold">8</text>
  </g>

  <!-- 行标：dp[i] -->
  <text x="70" y="116" text-anchor="end" font-size="11" fill="#888" font-weight="bold">dp[i]</text>
  <!-- 偶=T 绿，奇=F 红 -->
  <rect x="80"  y="100" width="52" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="106" y="120" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">F</text>
  <rect x="132" y="100" width="52" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="158" y="120" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">T</text>
  <rect x="184" y="100" width="52" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="210" y="120" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">F</text>
  <rect x="236" y="100" width="52" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="262" y="120" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">T</text>
  <rect x="288" y="100" width="52" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="314" y="120" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">F</text>
  <rect x="340" y="100" width="52" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="366" y="120" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">T</text>
  <rect x="392" y="100" width="52" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="418" y="120" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">F</text>
  <rect x="444" y="100" width="52" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="470" y="120" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">T</text>

  <!-- 行标：制胜 x -->
  <text x="70" y="164" text-anchor="end" font-size="11" fill="#888" font-weight="bold">制胜 x</text>
  <g font-size="11.5" fill="#4a7a3a" font-weight="bold">
    <rect x="80"  y="148" width="52" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/><text x="106" y="168" text-anchor="middle" fill="#888">—</text>
    <rect x="132" y="148" width="52" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/><text x="158" y="168" text-anchor="middle">1</text>
    <rect x="184" y="148" width="52" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/><text x="210" y="168" text-anchor="middle" fill="#888">—</text>
    <rect x="236" y="148" width="52" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/><text x="262" y="168" text-anchor="middle">1</text>
    <rect x="288" y="148" width="52" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/><text x="314" y="168" text-anchor="middle" fill="#888">—</text>
    <rect x="340" y="148" width="52" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/><text x="366" y="168" text-anchor="middle">1</text>
    <rect x="392" y="148" width="52" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/><text x="418" y="168" text-anchor="middle" fill="#888">—</text>
    <rect x="444" y="148" width="52" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/><text x="470" y="168" text-anchor="middle">1</text>
  </g>

  <!-- n-x 落点（对手的数） -->
  <text x="70" y="212" text-anchor="end" font-size="11" fill="#888" font-weight="bold">对手得</text>
  <g font-size="11" fill="#333">
    <rect x="80"  y="196" width="52" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/><text x="106" y="216" text-anchor="middle" fill="#888">—</text>
    <rect x="132" y="196" width="52" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/><text x="158" y="216" text-anchor="middle">1</text>
    <rect x="184" y="196" width="52" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/><text x="210" y="216" text-anchor="middle" fill="#888">2</text>
    <rect x="236" y="196" width="52" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/><text x="262" y="216" text-anchor="middle">3</text>
    <rect x="288" y="196" width="52" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/><text x="314" y="216" text-anchor="middle" fill="#888">4</text>
    <rect x="340" y="196" width="52" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/><text x="366" y="216" text-anchor="middle">5</text>
    <rect x="392" y="196" width="52" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/><text x="418" y="216" text-anchor="middle" fill="#888">6</text>
    <rect x="444" y="196" width="52" height="30" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/><text x="470" y="216" text-anchor="middle">7</text>
  </g>

  <!-- 关键说明框 -->
  <rect x="80" y="244" width="416" height="98" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="288" y="264" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">逐格解读</text>
  <text x="96" y="282" font-size="10.5" fill="#333">• n=1：无真因数，dp=F（基例，谁遇到谁输）</text>
  <text x="96" y="298" font-size="10.5" fill="#333">• n=2：选 x=1 → 对手得 1（dp[1]=F）→ 我胜 dp=T</text>
  <text x="96" y="314" font-size="10.5" fill="#333">• n=3：唯一真因数 x=1 → 对手得 2（dp[2]=T）→ 无必败转移 dp=F</text>
  <text x="96" y="330" font-size="10.5" fill="#b85450" font-weight="bold">⇒ 偶数格恒 T、奇数格恒 F：每轮「自减 1」即可，规律即 n%2==0</text>
</svg>
