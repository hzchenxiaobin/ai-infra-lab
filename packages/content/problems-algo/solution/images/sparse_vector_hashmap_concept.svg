<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">稀疏向量：绝大多数分量为 0，只存非零项即可</text>

  <!-- ===== Left panel: dense array ===== -->
  <text x="120" y="60" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">朴素存法：原数组（n 个槽位）</text>

  <!-- index labels -->
  <text x="55" y="100" text-anchor="middle" font-size="10" fill="#aaa">idx</text>
  <text x="95" y="100" text-anchor="middle" font-size="10" fill="#aaa">0</text>
  <text x="135" y="100" text-anchor="middle" font-size="10" fill="#aaa">1</text>
  <text x="175" y="100" text-anchor="middle" font-size="10" fill="#aaa">2</text>
  <text x="215" y="100" text-anchor="middle" font-size="10" fill="#aaa">3</text>
  <text x="255" y="100" text-anchor="middle" font-size="10" fill="#aaa">4</text>

  <!-- value cells: 1, 0, 0, 2, 3 -->
  <rect x="75" y="110" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="132" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <rect x="115" y="110" width="40" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="135" y="132" text-anchor="middle" font-size="13" fill="#ccc">0</text>

  <rect x="155" y="110" width="40" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="175" y="132" text-anchor="middle" font-size="13" fill="#ccc">0</text>

  <rect x="195" y="110" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="215" y="132" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <rect x="235" y="110" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="132" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <text x="165" y="168" text-anchor="middle" font-size="10" fill="#aaa">5 个槽全存，3 个 0 是浪费</text>

  <!-- arrow -->
  <path d="M 305 127 L 345 127" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="325" y="119" text-anchor="middle" font-size="10" fill="#888">只存非零</text>

  <!-- ===== Right panel: hashmap ===== -->
  <text x="465" y="60" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">哈希表：{下标 : 值}</text>

  <!-- hashmap bucket rows -->
  <rect x="395" y="92" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="412" y="112" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="430" y="112" text-anchor="middle" font-size="11" fill="#888">:</text>
  <text x="465" y="112" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <rect x="395" y="128" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="412" y="148" text-anchor="middle" font-size="11" fill="#888">3</text>
  <text x="430" y="148" text-anchor="middle" font-size="11" fill="#888">:</text>
  <text x="465" y="148" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <rect x="395" y="164" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="412" y="184" text-anchor="middle" font-size="11" fill="#888">4</text>
  <text x="430" y="184" text-anchor="middle" font-size="11" fill="#888">:</text>
  <text x="465" y="184" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <text x="465" y="215" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">只存 3 项，省空间</text>

  <!-- ===== Bottom note ===== -->
  <rect x="40" y="235" width="480" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="257" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">点积 = Σ nums1[i] × nums2[i]，零分量贡献恒为 0</text>
  <text x="280" y="275" text-anchor="middle" font-size="11" fill="#555">故只需对「两边都非零」的下标做乘法累加即可</text>

  <!-- ===== Bottom: complexity comparison ===== -->
  <rect x="40" y="300" width="480" height="65" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">空间对比（n = 10^5，非零仅 10 个）</text>
  <text x="280" y="342" text-anchor="middle" font-size="11" fill="#555">原数组：O(n) = 10^5 槽  →  哈希表：O(L) = 10 槽</text>
  <text x="280" y="358" text-anchor="middle" font-size="11" fill="#555">点积从 O(n) 降到 O(min(L1, L2))</text>
</svg>
