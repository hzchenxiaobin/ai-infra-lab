<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums=[1,2,2] 的回溯过程</text>

  <!-- Table header -->
  <rect x="40" y="40" width="540" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="59" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">步骤</text>
  <text x="140" y="59" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">start</text>
  <text x="200" y="59" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">i</text>
  <text x="300" y="59" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">path</text>
  <text x="470" y="59" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">动作 / 收集</text>

  <!-- Row 1: collect [] -->
  <rect x="40" y="72" width="540" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="75" y="91" text-anchor="middle" font-size="11" fill="#333">①</text>
  <text x="140" y="91" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">0</text>
  <text x="200" y="91" text-anchor="middle" font-size="11" fill="#888" font-family="monospace">—</text>
  <text x="300" y="91" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">[]</text>
  <text x="470" y="91" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">入根收集 [] ⭐</text>

  <!-- Row 2: pick 1, collect [1] -->
  <rect x="40" y="104" width="540" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="75" y="123" text-anchor="middle" font-size="11" fill="#333">②</text>
  <text x="140" y="123" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">0→1</text>
  <text x="200" y="123" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">0</text>
  <text x="300" y="123" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">[1]</text>
  <text x="470" y="123" text-anchor="middle" font-size="11" fill="#333">选 1，收集 [1] ⭐</text>

  <!-- Row 3: pick 2(nums[1]), collect [1,2] -->
  <rect x="40" y="136" width="540" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="75" y="155" text-anchor="middle" font-size="11" fill="#333">③</text>
  <text x="140" y="155" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">1→2</text>
  <text x="200" y="155" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">1</text>
  <text x="300" y="155" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">[1,2]</text>
  <text x="470" y="155" text-anchor="middle" font-size="11" fill="#333">选 2(nums[1])，收集 [1,2] ⭐</text>

  <!-- Row 4: KEY NOT PRUNE - pick 2(nums[2]) deep level -->
  <rect x="40" y="168" width="540" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="190" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">④</text>
  <text x="140" y="190" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">2→3</text>
  <text x="200" y="190" text-anchor="middle" font-size="11" fill="#4a7a3a" font-family="monospace" font-weight="bold">2</text>
  <text x="300" y="190" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">[1,2,2]</text>
  <text x="470" y="186" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">i==start，不剪！选 2(nums[2])</text>
  <text x="470" y="200" text-anchor="middle" font-size="9" fill="#4a7a3a">纵深同值合法，收集 [1,2,2] ⭐</text>

  <!-- Row 5: KEY PRUNE - back to start=1, i=2 -->
  <rect x="40" y="206" width="540" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="228" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⑤</text>
  <text x="140" y="228" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">1</text>
  <text x="200" y="228" text-anchor="middle" font-size="11" fill="#b85450" font-family="monospace" font-weight="bold">2</text>
  <text x="300" y="228" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">[1]</text>
  <text x="470" y="224" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">i&gt;start 且 nums[2]==nums[1] → 剪枝 ✂</text>
  <text x="470" y="238" text-anchor="middle" font-size="9" fill="#b85450">同层重复，挡掉重复的 [1,2]</text>

  <!-- Row 6: back to root, pick 2(nums[1]), collect [2] -->
  <rect x="40" y="244" width="540" height="30" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="75" y="263" text-anchor="middle" font-size="11" fill="#333">⑥</text>
  <text x="140" y="263" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">0→2</text>
  <text x="200" y="263" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">1</text>
  <text x="300" y="263" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">[2]</text>
  <text x="470" y="263" text-anchor="middle" font-size="11" fill="#333">选 2(nums[1])，收集 [2] ⭐</text>

  <!-- Row 7: KEY NOT PRUNE - pick 2(nums[2]) deep level, [2,2] -->
  <rect x="40" y="276" width="540" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="298" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">⑦</text>
  <text x="140" y="298" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">2→3</text>
  <text x="200" y="298" text-anchor="middle" font-size="11" fill="#4a7a3a" font-family="monospace" font-weight="bold">2</text>
  <text x="300" y="298" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">[2,2]</text>
  <text x="470" y="294" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">i==start，不剪！选 2(nums[2])</text>
  <text x="470" y="308" text-anchor="middle" font-size="9" fill="#4a7a3a">纵深同值合法，收集 [2,2] ⭐</text>

  <!-- Row 8: KEY PRUNE - back to root start=0, i=2 -->
  <rect x="40" y="314" width="540" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="336" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⑧</text>
  <text x="140" y="336" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">0</text>
  <text x="200" y="336" text-anchor="middle" font-size="11" fill="#b85450" font-family="monospace" font-weight="bold">2</text>
  <text x="300" y="336" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">[]</text>
  <text x="470" y="332" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">i&gt;start 且 nums[2]==nums[1] → 剪枝 ✂</text>
  <text x="470" y="346" text-anchor="middle" font-size="9" fill="#b85450">同层重复，挡掉重复的 [2]</text>

  <!-- Contrast box -->
  <rect x="40" y="358" width="540" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="310" y="380" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">★ 核心对比：步骤 ④⑦（不剪）vs ⑤⑧（剪）</text>
  <text x="310" y="398" text-anchor="middle" font-size="11" fill="#4a7a3a">④⑦ i==start：本层首个，纵深方向同值（[1,2,2]、[2,2]）→ 合法，不剪！</text>
  <text x="310" y="416" text-anchor="middle" font-size="11" fill="#b85450">⑤⑧ i&gt;start：本层非首个，同层并列同值 → 重复，剪！</text>
  <text x="310" y="434" text-anchor="middle" font-size="10" fill="#888">最终结果：[[],[1],[1,2],[1,2,2],[2],[2,2]]（共 6 个，无重复无遗漏）</text>
</svg>
