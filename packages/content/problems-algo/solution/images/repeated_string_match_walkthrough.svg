<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：k 份 → k+1 份 → 结论</text>

  <!-- ===== Example 1 ===== -->
  <text x="30" y="54" font-size="12.5" fill="#446688" font-weight="bold">例 1：a = "abcd"，b = "cdabcdab"，k = ⌈8 / 4⌉ = 2</text>

  <!-- k=2 row -->
  <text x="30" y="76" font-size="11" fill="#888">k = 2 份：</text>
  <!-- 8 cells, width 32, height 28, x=100 -->
  <rect x="100" y="64" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="116" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="132" y="64" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="164" y="64" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>
  <rect x="196" y="64" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="212" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">d</text>
  <rect x="228" y="64" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="244" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="260" y="64" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="276" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="292" y="64" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="308" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>
  <rect x="324" y="64" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">d</text>
  <!-- position labels -->
  <text x="116" y="104" text-anchor="middle" font-size="8" fill="#aaa">0</text>
  <text x="148" y="104" text-anchor="middle" font-size="8" fill="#aaa">1</text>
  <text x="180" y="104" text-anchor="middle" font-size="8" fill="#aaa">2</text>
  <text x="212" y="104" text-anchor="middle" font-size="8" fill="#aaa">3</text>
  <text x="244" y="104" text-anchor="middle" font-size="8" fill="#aaa">4</text>
  <text x="276" y="104" text-anchor="middle" font-size="8" fill="#aaa">5</text>
  <text x="308" y="104" text-anchor="middle" font-size="8" fill="#aaa">6</text>
  <text x="340" y="104" text-anchor="middle" font-size="8" fill="#aaa">7</text>
  <!-- red X -->
  <text x="400" y="84" font-size="14" fill="#b85450" font-weight="bold">✗ 未命中</text>
  <text x="400" y="100" font-size="10" fill="#b85450">b 需到位置 9，越界</text>

  <!-- k+1=3 row -->
  <text x="30" y="128" font-size="11" fill="#888">k+1 = 3 份：</text>
  <!-- 12 cells, width 32, height 28, x=80 -->
  <rect x="80" y="116" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="96" y="136" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <rect x="112" y="116" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="128" y="136" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <rect x="144" y="116" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="136" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">c</text>
  <rect x="176" y="116" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="192" y="136" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">d</text>
  <rect x="208" y="116" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="224" y="136" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">a</text>
  <rect x="240" y="116" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="256" y="136" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">b</text>
  <rect x="272" y="116" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="288" y="136" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">c</text>
  <rect x="304" y="116" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="136" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">d</text>
  <rect x="336" y="116" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="352" y="136" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">a</text>
  <rect x="368" y="116" width="32" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="384" y="136" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">b</text>
  <rect x="400" y="116" width="32" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="416" y="136" text-anchor="middle" font-size="13" fill="#999">c</text>
  <rect x="432" y="116" width="32" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="448" y="136" text-anchor="middle" font-size="13" fill="#999">d</text>
  <!-- position labels -->
  <text x="96" y="156" text-anchor="middle" font-size="8" fill="#aaa">0</text>
  <text x="128" y="156" text-anchor="middle" font-size="8" fill="#aaa">1</text>
  <text x="160" y="156" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">2</text>
  <text x="192" y="156" text-anchor="middle" font-size="8" fill="#aaa">3</text>
  <text x="224" y="156" text-anchor="middle" font-size="8" fill="#aaa">4</text>
  <text x="256" y="156" text-anchor="middle" font-size="8" fill="#aaa">5</text>
  <text x="288" y="156" text-anchor="middle" font-size="8" fill="#aaa">6</text>
  <text x="320" y="156" text-anchor="middle" font-size="8" fill="#aaa">7</text>
  <text x="352" y="156" text-anchor="middle" font-size="8" fill="#aaa">8</text>
  <text x="384" y="156" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">9</text>
  <!-- green check -->
  <text x="480" y="136" font-size="14" fill="#4a7a3a" font-weight="bold">✓ 偏移 2</text>

  <rect x="30" y="166" width="500" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="184" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">k=2 未命中 → k+1=3 命中 → return 3</text>

  <!-- ===== Example 2 ===== -->
  <text x="30" y="218" font-size="12.5" fill="#446688" font-weight="bold">例 2：a = "a"，b = "aa"，k = ⌈2 / 1⌉ = 2</text>

  <text x="30" y="240" font-size="11" fill="#888">k = 2 份：</text>
  <rect x="100" y="228" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="248" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">a</text>
  <rect x="140" y="228" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="248" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">a</text>
  <text x="210" y="248" font-size="14" fill="#4a7a3a" font-weight="bold">✓ 命中</text>

  <rect x="30" y="266" width="500" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">k=2 即命中 → return 2（无需检查 k+1）</text>

  <!-- ===== Example 3 ===== -->
  <text x="30" y="318" font-size="12.5" fill="#b85450" font-weight="bold">例 3（不可能）：a = "abc"，b = "wxyz"，k = ⌈4 / 3⌉ = 2</text>

  <rect x="30" y="328" width="500" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="346" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">b 含字符 'w' ∉ a，无论重复多少次都不可能匹配</text>
  <text x="280" y="362" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">k=2 ✗，k+1=3 ✗ → return −1</text>

  <!-- ===== Insight ===== -->
  <rect x="30" y="386" width="500" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="406" text-anchor="middle" font-size="11.5" fill="#444">⚠️ 先查 k 份：若 b 起点恰好对齐（偏移 0），k 份即够</text>
  <text x="280" y="424" text-anchor="middle" font-size="11.5" fill="#444">再查 k+1 份：兜底 b 起点偏移到首份末尾的情况</text>

  <text x="280" y="462" text-anchor="middle" font-size="10" fill="#888">两步覆盖全部可能；橙色列 = b 匹配的字符位置</text>
</svg>
