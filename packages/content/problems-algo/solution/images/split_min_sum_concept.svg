<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：排序后按下标奇偶交替分配给 num1 / num2</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">重排不等式：最小数位配最大权重 → 均衡拆分 + 升序交替</text>

  <!-- ===== Panel A: num = 4325 ===== -->
  <text x="30" y="66" font-size="12" fill="#446688" font-weight="bold">num = 4325</text>
  <text x="30" y="94" font-size="10.5" fill="#888">排序后</text>

  <rect x="130" y="74" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="150" y="96" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <text x="150" y="122" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">num1</text>

  <rect x="176" y="74" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="196" y="96" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <text x="196" y="122" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">num2</text>

  <rect x="222" y="74" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="242" y="96" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <text x="242" y="122" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">num1</text>

  <rect x="268" y="74" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="288" y="96" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <text x="288" y="122" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">num2</text>

  <path d="M 209 126 L 209 144" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="225" y="140" font-size="9.5" fill="#666" font-weight="bold">交替拼接</text>

  <rect x="80" y="150" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="110" y="172" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">24</text>
  <text x="155" y="172" font-size="16" fill="#888" font-weight="bold">+</text>
  <rect x="170" y="150" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="200" y="172" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">35</text>
  <text x="245" y="172" font-size="16" fill="#888" font-weight="bold">=</text>
  <rect x="265" y="150" width="64" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="297" y="172" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">59</text>

  <line x1="30" y1="198" x2="530" y2="198" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Panel B: num = 687 ===== -->
  <text x="30" y="218" font-size="12" fill="#446688" font-weight="bold">num = 687</text>
  <text x="30" y="246" font-size="10.5" fill="#888">排序后</text>

  <rect x="130" y="226" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="150" y="248" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>
  <text x="150" y="274" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">num1</text>

  <rect x="176" y="226" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="196" y="248" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">7</text>
  <text x="196" y="274" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">num2</text>

  <rect x="222" y="226" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="242" y="248" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">8</text>
  <text x="242" y="274" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">num1</text>

  <path d="M 209 278 L 209 296" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="225" y="292" font-size="9.5" fill="#666" font-weight="bold">交替拼接</text>

  <rect x="80" y="302" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="110" y="324" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">68</text>
  <text x="155" y="324" font-size="16" fill="#888" font-weight="bold">+</text>
  <rect x="170" y="302" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="200" y="324" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">7</text>
  <text x="245" y="324" font-size="16" fill="#888" font-weight="bold">=</text>
  <rect x="265" y="302" width="64" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="297" y="324" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">75</text>

  <!-- ===== Bottom rule box ===== -->
  <rect x="30" y="350" width="500" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="368" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">策略：数位升序排序，按下标奇偶交替拼接进 num1 / num2</text>
  <text x="280" y="384" text-anchor="middle" font-size="10" fill="#888">n 为奇时 num1 多收末位；前导 0 落到最高位贡献为 0，天然等效于该数短一位</text>
</svg>
