<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="4.5" refY="8" orient="auto">
      <path d="M0,0 L4.5,8 L9,0 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">从国王向 8 方向射线：每条射线首个皇后即可攻击（示例 2）</text>

  <!-- ===== 8x8 Board ===== -->
  <!-- column labels -->
  <text x="87" y="74" text-anchor="middle" font-size="9" fill="#bbb">y=0</text>
  <text x="121" y="74" text-anchor="middle" font-size="9" fill="#bbb">1</text>
  <text x="155" y="74" text-anchor="middle" font-size="9" fill="#bbb">2</text>
  <text x="189" y="74" text-anchor="middle" font-size="9" fill="#bbb">3</text>
  <text x="223" y="74" text-anchor="middle" font-size="9" fill="#bbb">4</text>
  <text x="257" y="74" text-anchor="middle" font-size="9" fill="#bbb">5</text>
  <text x="291" y="74" text-anchor="middle" font-size="9" fill="#bbb">6</text>
  <text x="325" y="74" text-anchor="middle" font-size="9" fill="#bbb">7</text>
  <!-- row labels -->
  <text x="58" y="102" text-anchor="middle" font-size="9" fill="#bbb">x=0</text>
  <text x="58" y="136" text-anchor="middle" font-size="9" fill="#bbb">1</text>
  <text x="58" y="170" text-anchor="middle" font-size="9" fill="#bbb">2</text>
  <text x="58" y="204" text-anchor="middle" font-size="9" fill="#bbb">3</text>
  <text x="58" y="238" text-anchor="middle" font-size="9" fill="#bbb">4</text>
  <text x="58" y="272" text-anchor="middle" font-size="9" fill="#bbb">5</text>
  <text x="58" y="306" text-anchor="middle" font-size="9" fill="#bbb">6</text>
  <text x="58" y="340" text-anchor="middle" font-size="9" fill="#bbb">7</text>

  <!-- empty rays (faint) drawn first, under pieces -->
  <!-- Up to top edge -->
  <path d="M 189 199 L 189 82" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="2,4" fill="none" filter="url(#rough2)"/>
  <!-- Up-right to (291,97) corner area -->
  <path d="M 189 199 L 305 83" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="2,4" fill="none" filter="url(#rough2)"/>
  <!-- Left to left edge -->
  <path d="M 189 199 L 72 199" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="2,4" fill="none" filter="url(#rough2)"/>
  <!-- Down-left -->
  <path d="M 189 199 L 73 315" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="2,4" fill="none" filter="url(#rough2)"/>
  <!-- Down to bottom edge -->
  <path d="M 189 199 L 189 350" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="2,4" fill="none" filter="url(#rough2)"/>
  <!-- Down-right beyond (4,4) to edge -->
  <path d="M 223 233 L 341 351" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="2,4" fill="none" filter="url(#rough2)"/>

  <!-- board cells -->
  <g filter="url(#rough2)">
    <!-- row 0 -->
    <rect x="70" y="80" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3"/>
    <rect x="104" y="80" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="138" y="80" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="172" y="80" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="206" y="80" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="240" y="80" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="274" y="80" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="308" y="80" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <!-- row 1 -->
    <rect x="70" y="114" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="104" y="114" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3"/>
    <rect x="138" y="114" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="172" y="114" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="206" y="114" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="240" y="114" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="274" y="114" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="308" y="114" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <!-- row 2 -->
    <rect x="70" y="148" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="104" y="148" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="138" y="148" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3"/>
    <rect x="172" y="148" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="206" y="148" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="240" y="148" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="274" y="148" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="308" y="148" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <!-- row 3 -->
    <rect x="70" y="182" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="104" y="182" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="138" y="182" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="172" y="182" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="3"/>
    <rect x="206" y="182" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3"/>
    <rect x="240" y="182" width="34" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3"/>
    <rect x="274" y="182" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="308" y="182" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <!-- row 4 -->
    <rect x="70" y="216" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="104" y="216" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="138" y="216" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="172" y="216" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="206" y="216" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3"/>
    <rect x="240" y="216" width="34" height="34" fill="#eeeeee" stroke="#999" stroke-width="1.5" stroke-dasharray="3,2" rx="3"/>
    <rect x="274" y="216" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="308" y="216" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <!-- row 5 -->
    <rect x="70" y="250" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="104" y="250" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="138" y="250" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="172" y="250" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="206" y="250" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="240" y="250" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="274" y="250" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="308" y="250" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <!-- row 6 -->
    <rect x="70" y="284" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="104" y="284" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="138" y="284" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="172" y="284" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="206" y="284" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="240" y="284" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="274" y="284" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="308" y="284" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <!-- row 7 -->
    <rect x="70" y="318" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="104" y="318" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="138" y="318" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="172" y="318" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="206" y="318" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="240" y="318" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="274" y="318" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
    <rect x="308" y="318" width="34" height="34" fill="#fff" stroke="#ddd" stroke-width="1" rx="3"/>
  </g>

  <!-- ===== Attacking rays (solid green arrows, king -> first queen) ===== -->
  <!-- Up-left: king(189,199) -> (2,2)(155,165) -->
  <path d="M 189 199 L 158 168" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- Right: king -> (3,4)(223,199) -->
  <path d="M 189 199 L 220 199" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <!-- Down-right: king -> (4,4)(223,233) -->
  <path d="M 189 199 L 220 230" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== Blocked extensions (red dashed, first queen -> farther blocked queen) ===== -->
  <!-- up-left beyond (2,2) to (0,0): (155,165)->(87,97) -->
  <path d="M 152 162 L 90 100" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>
  <!-- right beyond (3,4) to (3,5): (223,199)->(257,199) -->
  <path d="M 226 199 L 254 199" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>

  <!-- ===== Pieces ===== -->
  <g filter="url(#rough2)">
    <!-- King (3,3) center (189,199) -->
    <text x="189" y="205" text-anchor="middle" font-size="20" fill="#d6a040" font-weight="bold">♔</text>
    <text x="189" y="224" text-anchor="middle" font-size="8.5" fill="#d6a040">王(3,3)</text>

    <!-- Attacking queens (green) -->
    <text x="155" y="171" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold">♛</text>
    <text x="223" y="205" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold">♛</text>
    <text x="223" y="239" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold">♛</text>

    <!-- Blocked queens (red) -->
    <text x="87" y="103" text-anchor="middle" font-size="18" fill="#b85450" font-weight="bold">♛</text>
    <text x="121" y="137" text-anchor="middle" font-size="18" fill="#b85450" font-weight="bold">♛</text>
    <text x="257" y="205" text-anchor="middle" font-size="18" fill="#b85450" font-weight="bold">♛</text>

    <!-- Not-on-ray queen (grey) (4,5) center (257,233) -->
    <text x="257" y="239" text-anchor="middle" font-size="18" fill="#888" font-weight="bold">♛</text>
  </g>

  <!-- annotation: blocked label along up-left -->
  <text x="110" y="125" font-size="9" fill="#b85450" font-weight="bold">被挡</text>
  <text x="245" y="194" font-size="9" fill="#b85450" font-weight="bold">被挡</text>
  <text x="262" y="252" font-size="8.5" fill="#888">不在射线上</text>

  <!-- ===== Legend (right side) ===== -->
  <rect x="362" y="92" width="166" height="186" fill="#fff" stroke="#ddd" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="445" y="112" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">图例</text>

  <text x="378" y="138" font-size="15" fill="#d6a040" font-weight="bold">♔</text>
  <text x="398" y="140" font-size="10.5" fill="#333">白国王（起点）</text>

  <text x="378" y="164" font-size="15" fill="#4a7a3a" font-weight="bold">♛</text>
  <text x="398" y="166" font-size="10.5" fill="#333">可攻击：射线首个</text>

  <text x="378" y="190" font-size="15" fill="#b85450" font-weight="bold">♛</text>
  <text x="398" y="192" font-size="10.5" fill="#333">被阻挡：同线更远</text>

  <text x="378" y="216" font-size="15" fill="#888" font-weight="bold">♛</text>
  <text x="398" y="218" font-size="10.5" fill="#333">不在任何射线上</text>

  <path d="M 372 240 L 392 240" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="398" y="244" font-size="10.5" fill="#333">攻击射线（实线）</text>

  <path d="M 372 262 L 392 262" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>
  <text x="398" y="266" font-size="10.5" fill="#333">阻挡延伸（虚线）</text>

  <!-- summary note -->
  <rect x="362" y="296" width="166" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="445" y="316" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">首个皇后前 = 全空</text>
  <text x="445" y="332" text-anchor="middle" font-size="9.5" fill="#555">故天然无阻挡，可直接攻击</text>
  <text x="445" y="346" text-anchor="middle" font-size="9.5" fill="#555">命中即停，远者皆被挡</text>
</svg>
