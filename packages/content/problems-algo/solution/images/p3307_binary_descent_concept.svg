<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：每次操作长度翻倍，k−1 的二进制就是第 k 个字符的「出生路径」</text>
  <text x="260" y="38" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">示例 2：k = 10，operations = [0,1,0,1]；橙色 = 移位新造的后半段，蓝色 = 复制新造的后半段</text>

  <!-- 各层后半段的左边界（所有行的分裂线都在 x=260） -->
  <path d="M 260 50 L 260 248" fill="none" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="266" y="50" text-anchor="start" font-size="8" fill="#b85450" filter="url(#rough2)">各层后半段的左边界</text>

  <!-- 行 0：初始，长 1 -->
  <text x="76" y="69" text-anchor="end" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">初始</text>
  <rect x="84" y="52" width="352" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="70" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="446" y="69" text-anchor="start" font-size="9" fill="#999" filter="url(#rough2)">长 1</text>

  <!-- 行 1：op0=0 复制，长 2 -->
  <text x="76" y="111" text-anchor="end" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">op₀=0 复制</text>
  <rect x="84" y="94" width="176" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="260" y="94" width="176" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="172" y="112" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">a</text>
  <text x="348" y="112" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="446" y="111" text-anchor="start" font-size="9" fill="#999" filter="url(#rough2)">长 2</text>

  <!-- 行 2：op1=1 移位，长 4 -->
  <text x="76" y="153" text-anchor="end" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">op₁=1 移位</text>
  <rect x="84" y="136" width="176" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="260" y="136" width="176" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="128" y="154" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">a</text>
  <text x="216" y="154" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">a</text>
  <text x="304" y="154" text-anchor="middle" font-size="11.5" fill="#a07830" filter="url(#rough2)">b</text>
  <text x="392" y="154" text-anchor="middle" font-size="11.5" fill="#a07830" filter="url(#rough2)">b</text>
  <text x="446" y="153" text-anchor="start" font-size="9" fill="#999" filter="url(#rough2)">长 4</text>

  <!-- 行 3：op2=0 复制，长 8 -->
  <text x="76" y="195" text-anchor="end" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">op₂=0 复制</text>
  <rect x="84" y="178" width="176" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="260" y="178" width="176" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="106" y="196" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">a</text>
  <text x="150" y="196" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">a</text>
  <text x="194" y="196" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">b</text>
  <text x="238" y="196" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">b</text>
  <text x="282" y="196" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">a</text>
  <text x="326" y="196" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">a</text>
  <text x="370" y="196" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">b</text>
  <text x="414" y="196" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">b</text>
  <text x="446" y="195" text-anchor="start" font-size="9" fill="#999" filter="url(#rough2)">长 8</text>

  <!-- 行 4：op3=1 移位，长 16 -->
  <text x="76" y="237" text-anchor="end" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">op₃=1 移位</text>
  <rect x="84" y="220" width="176" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="260" y="220" width="176" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="95" y="238" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">a</text>
  <text x="117" y="238" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">a</text>
  <text x="139" y="238" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">b</text>
  <text x="161" y="238" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">b</text>
  <text x="183" y="238" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">a</text>
  <text x="205" y="238" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">a</text>
  <text x="227" y="238" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">b</text>
  <text x="249" y="238" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">b</text>
  <text x="271" y="238" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">b</text>
  <text x="293" y="238" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">b</text>
  <text x="315" y="238" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">c</text>
  <text x="337" y="238" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">c</text>
  <text x="359" y="238" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">b</text>
  <text x="381" y="238" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">b</text>
  <text x="403" y="238" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">c</text>
  <text x="425" y="238" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">c</text>
  <text x="446" y="237" text-anchor="start" font-size="9" fill="#999" filter="url(#rough2)">长 16</text>

  <!-- 回溯路径上的高亮格子 -->
  <rect x="282" y="220" width="22" height="26" fill="#fff8e1" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="293" y="238" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="128" y="178" width="44" height="26" fill="#ffffff" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="196" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="172" y="136" width="88" height="26" fill="#ffffff" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="216" y="154" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="260" y="94" width="176" height="26" fill="#e8f0fe" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="348" y="112" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">a</text>

  <!-- 回溯箭头 -->
  <path d="M 293 218 L 152 206" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="235" y="212" text-anchor="start" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">10 → 2，＋op₃ = ＋1</text>
  <path d="M 148 176 L 214 164" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="192" y="172" text-anchor="start" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">2 → 2（前半，不变）</text>
  <path d="M 216 134 L 344 122" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="291" y="130" text-anchor="start" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">2 → 2（前半，不变）</text>
  <path d="M 348 92 L 262 80" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="313" y="88" text-anchor="start" font-size="9.5" fill="#446688" filter="url(#rough2)">2 → 1，＋op₀ = ＋0</text>

  <text x="293" y="259" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">第 10 个</text>

  <!-- 逐位读数表 -->
  <text x="48" y="262" text-anchor="start" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">k−1 = 9 = 1001₂ 的逐位读数</text>

  <rect x="110" y="268" width="46" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="156" y="268" width="46" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="202" y="268" width="46" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <rect x="248" y="268" width="46" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="104" y="280" text-anchor="end" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">位 i</text>
  <text x="133" y="280" text-anchor="middle" font-size="9.5" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="179" y="280" text-anchor="middle" font-size="9.5" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="225" y="280" text-anchor="middle" font-size="9.5" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="271" y="280" text-anchor="middle" font-size="9.5" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">0</text>

  <rect x="110" y="284" width="46" height="16" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="156" y="284" width="46" height="16" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="202" y="284" width="46" height="16" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="248" y="284" width="46" height="16" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="104" y="296" text-anchor="end" font-size="9.5" fill="#33506b" filter="url(#rough2)">第 i 位</text>
  <text x="133" y="296" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="179" y="296" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="225" y="296" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="271" y="296" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="110" y="300" width="46" height="16" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="156" y="300" width="46" height="16" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="202" y="300" width="46" height="16" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="248" y="300" width="46" height="16" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="104" y="312" text-anchor="end" font-size="9.5" fill="#33506b" filter="url(#rough2)">op[i]</text>
  <text x="133" y="312" text-anchor="middle" font-size="9.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="179" y="312" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="225" y="312" text-anchor="middle" font-size="9.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="271" y="312" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">0</text>

  <rect x="110" y="316" width="46" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="156" y="316" width="46" height="16" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="202" y="316" width="46" height="16" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="248" y="316" width="46" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="104" y="328" text-anchor="end" font-size="9.5" fill="#33506b" filter="url(#rough2)">贡献</text>
  <text x="133" y="328" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">+1</text>
  <text x="179" y="328" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">·</text>
  <text x="225" y="328" text-anchor="middle" font-size="9.5" fill="#aaa" filter="url(#rough2)">·</text>
  <text x="271" y="328" text-anchor="middle" font-size="9.5" fill="#555" font-weight="bold" filter="url(#rough2)">+0</text>

  <!-- 结果框 -->
  <rect x="316" y="268" width="190" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="411" y="284" text-anchor="middle" font-size="9.5" fill="#2f5424" filter="url(#rough2)">第 k 个字符 = 'a' + shift mod 26</text>
  <text x="411" y="302" text-anchor="middle" font-size="11.5" fill="#2f5424" font-weight="bold" filter="url(#rough2)">= 'a' + (1 + 0) = 'b' ✓</text>

  <rect x="316" y="318" width="190" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="411" y="333" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">mask 视角：mask = 1010₂</text>
  <text x="411" y="348" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">(k−1) &amp; mask = 1000₂ → popcount = 1</text>
</svg>
