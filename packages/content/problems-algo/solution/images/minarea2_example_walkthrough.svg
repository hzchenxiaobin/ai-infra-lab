<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：points = [[1,2],[2,1],[1,0],[0,1]]</text>

  <!-- coordinate axes -->
  <path d="M 60 360 L 280 360" stroke="#bbb" stroke-width="1.5" fill="none" filter="url(#rough)"/>
  <path d="M 80 380 L 80 70" stroke="#bbb" stroke-width="1.5" fill="none" filter="url(#rough)"/>
  <text x="286" y="364" font-size="11" fill="#aaa">x</text>
  <text x="76" y="66" font-size="11" fill="#aaa">y</text>

  <!-- grid ticks: x=0,1,2 ; y=0,1,2 -->
  <!-- origin (0,0)->(80,340), scale 60px/unit -->
  <text x="80" y="376" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="140" y="376" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="200" y="376" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="72" y="344" text-anchor="end" font-size="9" fill="#aaa">0</text>
  <text x="72" y="284" text-anchor="end" font-size="9" fill="#aaa">1</text>
  <text x="72" y="224" text-anchor="end" font-size="9" fill="#aaa">2</text>

  <!-- rectangle: (1,2),(2,1),(1,0),(0,1) -->
  <!-- (1,2)->(140,220), (2,1)->(200,280), (1,0)->(140,340), (0,1)->(80,280) -->
  <polygon points="140,220 200,280 140,340 80,280" fill="#e8f0fe" fill-opacity="0.4" stroke="#6a9acc" stroke-width="2" stroke-dasharray="6,3" filter="url(#rough2)"/>
  <text x="120" y="284" text-anchor="middle" font-size="10" fill="#6a9acc" font-weight="bold">area=2</text>

  <!-- diagonal 1: (1,2)->(1,0) vertical -->
  <path d="M 140 220 L 140 340" stroke="#d6a040" stroke-width="2.5" fill="none" filter="url(#rough2)"/>
  <!-- diagonal 2: (2,1)->(0,1) horizontal -->
  <path d="M 200 280 L 80 280" stroke="#b85450" stroke-width="2.5" fill="none" filter="url(#rough2)"/>

  <!-- midpoint M = (1,1) -> (140, 280) -->
  <circle cx="140" cy="280" r="5" fill="#82b366" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="276" font-size="10" fill="#4a7a3a" font-weight="bold">M(1,1)</text>

  <!-- points -->
  <circle cx="140" cy="220" r="6" fill="#446688" filter="url(#rough2)"/>
  <text x="148" y="216" font-size="10" fill="#446688" font-weight="bold">(1,2)</text>

  <circle cx="200" cy="280" r="6" fill="#446688" filter="url(#rough2)"/>
  <text x="208" y="278" font-size="10" fill="#446688" font-weight="bold">(2,1)</text>

  <circle cx="140" cy="340" r="6" fill="#446688" filter="url(#rough2)"/>
  <text x="148" y="338" font-size="10" fill="#446688" font-weight="bold">(1,0)</text>

  <circle cx="80" cy="280" r="6" fill="#446688" filter="url(#rough2)"/>
  <text x="48" y="278" font-size="10" fill="#446688" font-weight="bold">(0,1)</text>

  <!-- right side: pair table -->
  <rect x="300" y="50" width="250" height="370" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="425" y="72" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">6 对点的 key 分组</text>
  <line x1="312" y1="80" x2="538" y2="80" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>

  <!-- table header -->
  <text x="310" y="96" font-size="9" fill="#888" font-weight="bold">点对</text>
  <text x="372" y="96" font-size="9" fill="#888" font-weight="bold">key=(cx,cy,d²)</text>
  <text x="500" y="96" font-size="9" fill="#888" font-weight="bold">配对?</text>
  <line x1="310" y1="100" x2="538" y2="100" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 1 -->
  <text x="310" y="116" font-size="9.5" fill="#555">(1,2)-(2,1)</text>
  <text x="372" y="116" font-size="9.5" fill="#555">(3,3,2)</text>
  <text x="500" y="116" font-size="9.5" fill="#aaa">—</text>

  <!-- row 2: MATCH -->
  <rect x="305" y="122" width="230" height="18" fill="#e6f4ea" fill-opacity="0.6" stroke="none" filter="url(#rough2)"/>
  <text x="310" y="136" font-size="9.5" fill="#4a7a3a" font-weight="bold">(1,2)-(1,0)</text>
  <text x="372" y="136" font-size="9.5" fill="#4a7a3a" font-weight="bold">(2,2,4)</text>
  <text x="500" y="136" font-size="9.5" fill="#82b366" font-weight="bold">✓ 配</text>

  <!-- row 3 -->
  <text x="310" y="156" font-size="9.5" fill="#555">(1,2)-(0,1)</text>
  <text x="372" y="156" font-size="9.5" fill="#555">(1,3,2)</text>
  <text x="500" y="156" font-size="9.5" fill="#aaa">—</text>

  <!-- row 4 -->
  <text x="310" y="176" font-size="9.5" fill="#555">(2,1)-(1,0)</text>
  <text x="372" y="176" font-size="9.5" fill="#555">(3,1,2)</text>
  <text x="500" y="176" font-size="9.5" fill="#aaa">—</text>

  <!-- row 5: MATCH -->
  <rect x="305" y="182" width="230" height="18" fill="#e6f4ea" fill-opacity="0.6" stroke="none" filter="url(#rough2)"/>
  <text x="310" y="196" font-size="9.5" fill="#4a7a3a" font-weight="bold">(2,1)-(0,1)</text>
  <text x="372" y="196" font-size="9.5" fill="#4a7a3a" font-weight="bold">(2,2,4)</text>
  <text x="500" y="196" font-size="9.5" fill="#82b366" font-weight="bold">✓ 配</text>

  <!-- row 6 -->
  <text x="310" y="216" font-size="9.5" fill="#555">(1,0)-(0,1)</text>
  <text x="372" y="216" font-size="9.5" fill="#555">(1,1,2)</text>
  <text x="500" y="216" font-size="9.5" fill="#aaa">—</text>

  <line x1="310" y1="228" x2="538" y2="228" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- matched group detail -->
  <text x="310" y="246" font-size="10" fill="#d6a040" font-weight="bold">匹配组 key=(2,2,4)：</text>
  <text x="320" y="262" font-size="9.5" fill="#555">d₁ = (1,0)−(1,2) = (0,−2)</text>
  <text x="320" y="278" font-size="9.5" fill="#555">d₂ = (2,1)−(0,1) = (2,0)</text>

  <rect x="310" y="288" width="220" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="420" y="308" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">area = ½|d₁×d₂|</text>
  <text x="420" y="324" text-anchor="middle" font-size="9.5" fill="#555">= ½|0·0 − (−2)·2|</text>
  <text x="420" y="338" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">= ½·4 = 2.0</text>

  <!-- note -->
  <rect x="310" y="356" width="220" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="320" y="374" font-size="9" fill="#b85450">💡 key 用坐标和而非中点</text>
  <text x="320" y="388" font-size="9" fill="#b85450">　(1+1, 2+0)=(2,2)</text>
  <text x="320" y="400" font-size="9" fill="#b85450">　避免浮点除以 2</text>
</svg>
