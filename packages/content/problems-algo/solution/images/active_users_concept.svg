<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：login_date 减去行号 rn = 连续段的分组键 g</text>
  <text x="300" y="44" text-anchor="middle" font-size="10.5" fill="#888">同一连续段内的日期相减后得到相同的 g，跳天则 g 变化</text>

  <!-- ===== table header ===== -->
  <text x="170" y="74" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">id = 7 去重后登录日期（按 login_date 排序）</text>

  <rect x="80" y="84" width="140" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="100" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">login_date</text>

  <rect x="220" y="84" width="70" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="100" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">rn</text>

  <rect x="290" y="84" width="170" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="375" y="100" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">g = date − rn 天</text>

  <!-- ===== data rows : 5 consecutive (green) ===== -->
  <rect x="80" y="110" width="140" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="150" y="126" text-anchor="middle" font-size="10" fill="#333">2020-05-30</text>
  <rect x="220" y="110" width="70" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="255" y="126" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="290" y="110" width="170" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="375" y="126" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2020-05-29</text>

  <rect x="80" y="134" width="140" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="150" y="150" text-anchor="middle" font-size="10" fill="#333">2020-05-31</text>
  <rect x="220" y="134" width="70" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="255" y="150" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="290" y="134" width="170" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="375" y="150" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2020-05-29</text>

  <rect x="80" y="158" width="140" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="150" y="174" text-anchor="middle" font-size="10" fill="#333">2020-06-01</text>
  <rect x="220" y="158" width="70" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="255" y="174" text-anchor="middle" font-size="10" fill="#333">3</text>
  <rect x="290" y="158" width="170" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="375" y="174" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2020-05-29</text>

  <rect x="80" y="182" width="140" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="150" y="198" text-anchor="middle" font-size="10" fill="#333">2020-06-02</text>
  <rect x="220" y="182" width="70" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="255" y="198" text-anchor="middle" font-size="10" fill="#333">4</text>
  <rect x="290" y="182" width="170" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="375" y="198" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2020-05-29</text>

  <rect x="80" y="206" width="140" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="150" y="222" text-anchor="middle" font-size="10" fill="#333">2020-06-03</text>
  <rect x="220" y="206" width="70" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="255" y="222" text-anchor="middle" font-size="10" fill="#333">5</text>
  <rect x="290" y="206" width="170" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="375" y="222" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2020-05-29</text>

  <!-- gap row (red/orange) -->
  <rect x="80" y="230" width="140" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="150" y="246" text-anchor="middle" font-size="10" fill="#333">2020-06-10</text>
  <rect x="220" y="230" width="70" height="24" fill="#ffffff" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="255" y="246" text-anchor="middle" font-size="10" fill="#333">6</text>
  <rect x="290" y="230" width="170" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="375" y="246" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2020-06-04</text>

  <!-- ===== right-side brackets & annotations ===== -->
  <path d="M470,114 Q486,114 486,222 Q486,230 478,230" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <path d="M478,170 L500,170" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="505" y="160" font-size="10" fill="#4a7a3a" font-weight="bold">连续 5 天</text>
  <text x="505" y="174" font-size="10" fill="#4a7a3a" font-weight="bold">g 全相同</text>
  <text x="505" y="188" font-size="9.5" fill="#4a7a3a">COUNT = 5 ≥ 5</text>
  <text x="505" y="201" font-size="9.5" fill="#4a7a3a">→ 活跃 ✓</text>

  <path d="M478,242 L500,242" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="505" y="238" font-size="9.5" fill="#b85450" font-weight="bold">跳天</text>
  <text x="505" y="251" font-size="9.5" fill="#b85450">g 变 → 新组</text>
  <text x="505" y="264" font-size="9.5" fill="#b85450">(COUNT = 1)</text>

  <!-- ===== bottom invariant box ===== -->
  <rect x="60" y="300" width="480" height="104" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <rect x="60" y="300" width="480" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="300" y="317" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">不变式：日期每天 +1，行号 rn 也每天 +1，相减抵消 → g 不变</text>

  <text x="78" y="346" font-size="10" fill="#333">• 连续段（每天 +1）：date 与 rn 同步递增 ⇒</text>
  <text x="92" y="361" font-size="10" fill="#4a7a3a" font-weight="bold">date − rn 恒定 ⇒ 同一段日期共享同一个 g ⇒ 归为同组</text>
  <text x="78" y="380" font-size="10" fill="#333">• 跳天（date 多走 &gt;1 天）：date 跳得比 rn 多 ⇒</text>
  <text x="92" y="395" font-size="10" fill="#b85450" font-weight="bold">g 变大 ⇒ 与前一段断开 ⇒ 自然拆成新的连续组</text>
</svg>
