<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">算法流程图</text>

  <!-- 开始 -->
  <rect x="230" y="42" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="11" fill="#333">输入 root, p</text>
  <path d="M 280 72 L 280 88" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断1：p 有右子树？ -->
  <polygon points="280,90 380,128 280,166 180,128" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="125" text-anchor="middle" font-size="11" fill="#333">p 有右子树？</text>
  <text x="280" y="139" text-anchor="middle" font-size="10" fill="#666">p.right ≠ null</text>

  <!-- 左分支：是 -->
  <text x="170" y="124" text-anchor="end" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 180 128 L 110 128 L 110 150" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="152" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="168" text-anchor="middle" font-size="10" fill="#333">curr = p.right</text>
  <text x="110" y="180" text-anchor="middle" font-size="9" fill="#666">进入右子树</text>
  <path d="M 110 186 L 110 202" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断2：向左走 -->
  <polygon points="110,204 176,232 110,260 44,232" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="110" y="230" text-anchor="middle" font-size="10" fill="#333">有左孩子？</text>
  <text x="110" y="242" text-anchor="middle" font-size="9" fill="#666">curr.left≠null</text>

  <text x="190" y="228" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 176 232 L 200 232 L 200 252 L 110 252 L 110 204" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="178" y="218" width="44" height="20" fill="#fafafa" stroke="none"/>
  <text x="200" y="232" text-anchor="middle" font-size="9" fill="#446688">向左</text>

  <text x="110" y="278" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <path d="M 110 260 L 110 282" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="46" y="284" width="128" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="304" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">返回 curr</text>

  <!-- 右分支：否 -->
  <text x="390" y="124" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <path d="M 380 128 L 450 128 L 450 150" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="380" y="152" width="140" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="450" y="168" text-anchor="middle" font-size="10" fill="#333">succ = null, curr = root</text>
  <text x="450" y="180" text-anchor="middle" font-size="9" fill="#666">从根出发找祖先</text>
  <path d="M 450 186 L 450 202" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环判断 -->
  <polygon points="450,204 526,232 450,260 374,232" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="450" y="230" text-anchor="middle" font-size="10" fill="#333">curr ≠ null？</text>

  <path d="M 374 232 L 330 232 L 330 252" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="352" y="226" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- 判断3：curr.val > p.val -->
  <polygon points="330,254 410,282 330,310 250,282" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="280" text-anchor="middle" font-size="10" fill="#333">curr.val &gt; p.val？</text>

  <path d="M 250 282 L 230 282 L 230 310 L 285 310" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="240" y="276" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="222" y="312" width="116" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="280" y="328" text-anchor="middle" font-size="10" fill="#333">succ = curr</text>
  <text x="280" y="340" text-anchor="middle" font-size="9" fill="#666">curr = curr.left</text>
  <path d="M 280 346 L 280 360 L 450 360 L 450 204" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 410 282 L 430 282 L 430 312" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="424" y="276" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <rect x="372" y="314" width="116" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="430" y="330" text-anchor="middle" font-size="10" fill="#333">curr = curr.right</text>
  <text x="430" y="342" text-anchor="middle" font-size="9" fill="#666">值 ≤ p，向右走</text>
  <path d="M 430 348 L 430 360 L 450 360" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环出口：否 -->
  <text x="478" y="266" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <path d="M 526 232 L 540 232 L 540 282 L 510 282" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="392" y="392" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="452" y="412" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">返回 succ</text>
  <path d="M 450 360 L 450 392" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 底部说明 -->
  <rect x="30" y="392" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="130" y="412" text-anchor="middle" font-size="10" fill="#333">情况1 O(H) / 情况2 O(H)，总 O(1) 空间</text>
</svg>
