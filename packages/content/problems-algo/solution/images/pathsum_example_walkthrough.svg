<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#b85450"/>
    </marker>
    <marker id="arrF" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：target 逐层减 val，叶子处判相等</text>
  <text x="270" y="42" text-anchor="middle" font-size="11" fill="#888">例1　root = [5,4,8,11,null,13,4,7,2,null,null,null,1], targetSum = 22</text>

  <!-- root 5 -->
  <circle cx="230" cy="74" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="230" y="79" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="262" y="62" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="282" y="77" text-anchor="middle" font-size="10" fill="#333">t=22</text>

  <!-- 4 (on path) / 8 -->
  <circle cx="170" cy="124" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="170" y="129" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="200" y="114" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="220" y="129" text-anchor="middle" font-size="10" fill="#333">t=17</text>

  <circle cx="300" cy="124" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300" y="129" text-anchor="middle" font-size="12" fill="#333">8</text>
  <rect x="322" y="114" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="342" y="129" text-anchor="middle" font-size="10" fill="#333">t=14</text>

  <path d="M 218 87 L 184 109" stroke="#4a7a3a" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <path d="M 242 87 L 286 109" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 11 / 13 / 4 -->
  <circle cx="170" cy="176" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="170" y="181" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">11</text>
  <rect x="200" y="166" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="220" y="181" text-anchor="middle" font-size="10" fill="#333">t=13</text>

  <circle cx="262" cy="176" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="262" y="181" text-anchor="middle" font-size="12" fill="#333">13</text>
  <rect x="262" y="158" width="40" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="282" y="172" text-anchor="middle" font-size="9" fill="#b85450">14≠13</text>

  <circle cx="330" cy="176" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="330" y="181" text-anchor="middle" font-size="12" fill="#333">4</text>

  <path d="M 170 142 L 170 159" stroke="#4a7a3a" stroke-width="2.2" fill="none" filter="url(#rough2)"/>
  <path d="M 290 142 L 258 159" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 310 142 L 322 159" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- leaves: 7 (fail), 2 (hit), 1 (fail) -->
  <circle cx="118" cy="232" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="118" y="237" text-anchor="middle" font-size="12" fill="#333">7</text>
  <rect x="100" y="214" width="40" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="120" y="228" text-anchor="middle" font-size="9" fill="#b85450">2≠7</text>

  <circle cx="188" cy="232" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.8" filter="url(#rough2)"/>
  <text x="188" y="237" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="170" y="254" width="74" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="207" y="269" text-anchor="middle" font-size="10" fill="#8a6a20" font-weight="bold">2 == 2 ✓ true</text>

  <circle cx="360" cy="232" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="237" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="342" y="214" width="40" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="362" y="228" text-anchor="middle" font-size="9" fill="#b85450">10≠1</text>

  <path d="M 157 193 L 130 217" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 183 193 L 186 217" stroke="#4a7a3a" stroke-width="2.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 334 193 L 354 217" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- legend / examples 2 & 3 -->
  <path d="M 30 300 L 510 300" stroke="#dddddd" stroke-width="1.2" stroke-dasharray="3,4" filter="url(#rough2)"/>

  <rect x="30" y="312" width="150" height="76" fill="#fafafa" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="105" y="330" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">图例</text>
  <rect x="42" y="340" width="16" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="64" y="352" font-size="10" fill="#333">命中路径</text>
  <rect x="42" y="358" width="16" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="64" y="370" font-size="10" fill="#333">搜索分支</text>
  <rect x="42" y="374" width="16" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="64" y="386" font-size="10" fill="#333">叶子判定失败</text>

  <rect x="200" y="312" width="155" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="278" y="330" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">例2　[1,2,3], t=5</text>
  <text x="278" y="350" text-anchor="middle" font-size="10" fill="#333">1→2 : 3 ≠ 5 ✗</text>
  <text x="278" y="368" text-anchor="middle" font-size="10" fill="#333">1→3 : 4 ≠ 5 ✗</text>
  <text x="278" y="384" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">→ false</text>

  <rect x="375" y="312" width="155" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="452" y="330" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold">例3　[], t=0</text>
  <text x="452" y="352" text-anchor="middle" font-size="10" fill="#333">root == null</text>
  <text x="452" y="370" text-anchor="middle" font-size="10" fill="#333">无根到叶路径</text>
  <text x="452" y="386" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">→ false</text>
</svg>
