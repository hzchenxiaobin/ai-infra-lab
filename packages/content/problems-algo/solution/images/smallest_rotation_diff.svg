<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">差分数组：将每个元素的计分 k 区间批量标记为 O(1)</text>

  <!-- k-axis label -->
  <text x="30" y="56" font-size="11" fill="#888">k 轴</text>
  <!-- k-axis ticks 0..n-1 -->
  <line x1="60" y1="50" x2="510" y2="50" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="44" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="510" y="44" text-anchor="middle" font-size="9" fill="#aaa">n−1</text>

  <!-- ====== Case 1: a ≤ i ====== -->
  <rect x="30" y="70" width="500" height="155" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <rect x="30" y="70" width="160" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="87" font-size="12" fill="#446688" font-weight="bold">情形 1：a ≤ i</text>
  <text x="200" y="87" font-size="10" fill="#888">（k=0 时即计分，因为 j=i ≥ a）</text>

  <!-- k-axis for case 1 -->
  <line x1="60" y1="110" x2="510" y2="110" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- tick marks: 0, i-a, i, i+1, n-1 -->
  <circle cx="60" cy="110" r="3" fill="#446688" filter="url(#rough2)"/>
  <text x="60" y="128" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">0</text>

  <circle cx="180" cy="110" r="3" fill="#d6a040" filter="url(#rough2)"/>
  <text x="180" y="128" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">i−a</text>

  <circle cx="280" cy="110" r="3" fill="#446688" filter="url(#rough2)"/>
  <text x="280" y="128" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">i</text>

  <circle cx="320" cy="110" r="3" fill="#446688" filter="url(#rough2)"/>
  <text x="320" y="128" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">i+1</text>

  <circle cx="510" cy="110" r="3" fill="#446688" filter="url(#rough2)"/>
  <text x="510" y="128" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">n−1</text>

  <!-- Interval 1: [0, i-a] green -->
  <rect x="60" y="100" width="120" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="120" y="98" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">计分 ✓</text>

  <!-- Gap: [i-a+1, i] red -->
  <rect x="180" y="100" width="100" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="230" y="98" text-anchor="middle" font-size="9" fill="#b85450">不计分</text>

  <!-- Interval 2: [i+1, n-1] green -->
  <rect x="320" y="100" width="190" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="415" y="98" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">计分 ✓</text>

  <!-- diff marks -->
  <text x="60" y="152" font-size="10" fill="#4a7a3a" font-weight="bold">+1</text>
  <text x="180" y="152" font-size="10" fill="#b85450" font-weight="bold">−1</text>
  <text x="320" y="152" font-size="10" fill="#4a7a3a" font-weight="bold">+1</text>
  <text x="510" y="152" font-size="10" fill="#b85450" font-weight="bold">−1</text>
  <text x="40" y="152" font-size="9" fill="#888">diff:</text>
  <text x="40" y="168" font-size="9" fill="#888">位置:</text>
  <text x="60" y="168" font-size="9" fill="#666">0</text>
  <text x="180" y="168" font-size="9" fill="#666">i−a+1</text>
  <text x="320" y="168" font-size="9" fill="#666">i+1</text>
  <text x="510" y="168" font-size="9" fill="#666">n(越界)</text>

  <text x="200" y="195" font-size="10" fill="#666">→ 两段计分区间 [0, i−a] ∪ [i+1, n−1]，中间 [i−a+1, i] 不计分</text>

  <!-- ====== Case 2: a > i ====== -->
  <rect x="30" y="235" width="500" height="120" fill="#f5f5f5" stroke="#ddd" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <rect x="30" y="235" width="160" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="252" font-size="12" fill="#d6a040" font-weight="bold">情形 2：a &gt; i</text>
  <text x="200" y="252" font-size="10" fill="#888">（k=0 时 j=i &lt; a，不计分）</text>

  <!-- k-axis for case 2 -->
  <line x1="60" y1="275" x2="510" y2="275" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="60" cy="275" r="3" fill="#446688" filter="url(#rough2)"/>
  <text x="60" y="293" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">0</text>

  <circle cx="280" cy="275" r="3" fill="#446688" filter="url(#rough2)"/>
  <text x="280" y="293" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">i</text>

  <circle cx="320" cy="275" r="3" fill="#446688" filter="url(#rough2)"/>
  <text x="320" y="293" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">i+1</text>

  <circle cx="430" cy="275" r="3" fill="#d6a040" filter="url(#rough2)"/>
  <text x="430" y="293" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">i+n−a</text>

  <circle cx="510" cy="275" r="3" fill="#446688" filter="url(#rough2)"/>
  <text x="510" y="293" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">n−1</text>

  <!-- Gap: [0, i] red -->
  <rect x="60" y="265" width="220" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="170" y="263" text-anchor="middle" font-size="9" fill="#b85450">不计分</text>

  <!-- Interval: [i+1, i+n-a] green -->
  <rect x="320" y="265" width="110" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="375" y="263" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">计分 ✓</text>

  <!-- Gap: [i+n-a+1, n-1] red -->
  <rect x="430" y="265" width="80" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="470" y="263" text-anchor="middle" font-size="9" fill="#b85450">不计分</text>

  <!-- diff marks -->
  <text x="40" y="317" font-size="9" fill="#888">diff:</text>
  <text x="320" y="317" font-size="10" fill="#4a7a3a" font-weight="bold">+1</text>
  <text x="430" y="317" font-size="10" fill="#b85450" font-weight="bold">−1</text>
  <text x="40" y="333" font-size="9" fill="#888">位置:</text>
  <text x="320" y="333" font-size="9" fill="#666">i+1</text>
  <text x="430" y="333" font-size="9" fill="#666">i+n−a+1</text>

  <text x="200" y="348" font-size="10" fill="#666">→ 单段计分区间 [i+1, i+n−a]</text>

  <!-- Summary -->
  <rect x="30" y="370" width="500" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="50" y="390" font-size="11" fill="#446688" font-weight="bold">关键转化</text>
  <text x="50" y="404" font-size="10" fill="#444">对每个元素 O(1) 标记计分区间 → diff 数组前缀和 = 每个 k 的总得分 → 取最大值最小下标</text>
</svg>
