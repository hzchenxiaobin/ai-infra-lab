<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="18" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一次分桶，逐位 DP + 前缀和双指针</text>

  <text x="260" y="36" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">时间 O(5001·4 + n·M)，M ≤ 365；空间 O(5001 + M)</text>

  <rect x="195" y="46" width="130" height="30" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="65" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">读入 digitSum</text>

  <path d="M 260 76 L 260 86" fill="none" stroke="#888" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="105" y="88" width="310" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="106" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">① 预处理分桶：v = 0…5000 按数位和入桶</text>
  <text x="260" y="124" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">桶内天然升序（最大 365 个）</text>

  <path d="M 260 132 L 260 142" fill="none" stroke="#888" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,144 380,174 260,204 140,174" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="178" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">buckets[sᵢ] 为空？</text>

  <path d="M 380 174 L 404 174" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="392" y="166" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="406" y="156" width="96" height="36" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="454" y="178" text-anchor="middle" font-size="11" fill="#a0433f" font-weight="bold" filter="url(#rough2)">返回 0</text>

  <path d="M 260 204 L 260 228" fill="none" stroke="#888" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="222" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="80" y="232" width="360" height="60" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="250" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">② 桶内升序取 v：双指针推进 k（prev[k] ≤ v）</text>
  <text x="260" y="266" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">ways = pref[k−1]（首位 i=0 取 1）</text>
  <text x="260" y="282" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">累加 acc → 新前缀和 npref（滚动替换）</text>

  <path d="M 260 292 L 260 300" fill="none" stroke="#888" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="260,302 360,326 260,350 160,326" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="330" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">还有下一位？</text>

  <path d="M 160 326 L 58 326 L 58 174 L 136 174" fill="none" stroke="#d6a040" stroke-width="2.2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="148" y="318" text-anchor="end" font-size="10" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">是，i+1</text>

  <path d="M 360 326 L 384 326" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="372" y="318" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="386" y="308" width="124" height="38" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="448" y="324" text-anchor="middle" font-size="10.5" fill="#3a5f2e" font-weight="bold" filter="url(#rough2)">返回 pref 末项</text>
  <text x="448" y="340" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">（mod 10⁹+7）</text>
</svg>
