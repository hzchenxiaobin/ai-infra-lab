<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：两次二分，各取一段长度</text>

  <!-- top: sorted nums -->
  <rect x="200" y="44" width="140" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="67" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">nums（升序）</text>

  <!-- split arrows -->
  <path d="M 270 80 L 270 96 L 150 96 L 150 112" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 270 80 L 270 96 L 390 96 L 390 112" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- left column: lower_bound -->
  <rect x="80" y="116" width="140" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="150" y="134" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">bisect_left(nums, 0)</text>
  <text x="150" y="150" text-anchor="middle" font-size="10.5" fill="#888">首个 nums[i] ≥ 0 的下标</text>

  <path d="M 150 156 L 150 178" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="80" y="184" width="140" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="150" y="204" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">neg = 该下标</text>
  <text x="150" y="220" text-anchor="middle" font-size="10.5" fill="#446688">= nums[i] &lt; 0 的个数</text>

  <!-- right column: upper_bound -->
  <rect x="320" y="116" width="140" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="390" y="134" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">bisect_right(nums, 0)</text>
  <text x="390" y="150" text-anchor="middle" font-size="10.5" fill="#888">首个 nums[i] &gt; 0 的下标</text>

  <path d="M 390 156 L 390 178" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="320" y="184" width="140" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="390" y="204" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">pos = n − 该下标</text>
  <text x="390" y="220" text-anchor="middle" font-size="10.5" fill="#4a7a3a">= nums[i] &gt; 0 的个数</text>

  <!-- converge to answer -->
  <path d="M 150 228 L 150 252 L 270 252" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 390 228 L 390 252 L 270 252" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 270 252 L 270 272" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- answer -->
  <rect x="160" y="276" width="220" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="301" text-anchor="middle" font-size="13.5" fill="#b85450" font-weight="bold">return max(neg, pos)</text>

  <!-- note -->
  <rect x="40" y="330" width="460" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="345" text-anchor="middle" font-size="10.5" fill="#555">两次二分各 O(log n)，合计 O(log n)；空间 O(1)</text>
</svg>
