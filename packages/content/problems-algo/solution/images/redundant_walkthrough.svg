<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：edges = [[1,2],[1,3],[2,3]]</text>

  <!-- table header -->
  <rect x="24" y="48" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="59" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">步骤</text>
  <rect x="94" y="48" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="139" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">边 (u,v)</text>
  <rect x="184" y="48" width="150" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="259" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">parent [1,2,3]</text>
  <rect x="334" y="48" width="182" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="425" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">操作说明</text>

  <!-- row 0: init -->
  <rect x="24" y="74" width="70" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="59" y="94" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">init</text>
  <rect x="94" y="74" width="90" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="139" y="94" text-anchor="middle" font-size="12" fill="#888">—</text>
  <rect x="184" y="74" width="150" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="259" y="94" text-anchor="middle" font-size="12" fill="#333">[1, 2, 3]</text>
  <rect x="334" y="74" width="182" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="425" y="94" text-anchor="middle" font-size="11" fill="#666">各自为根</text>

  <!-- row 1: (1,2) -->
  <rect x="24" y="104" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="59" y="124" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">①</text>
  <rect x="94" y="104" width="90" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="139" y="124" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">(1,2)</text>
  <rect x="184" y="104" width="150" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="259" y="124" text-anchor="middle" font-size="12" fill="#333">[1, <tspan fill="#b85450" font-weight="bold">1</tspan>, 3]</text>
  <rect x="334" y="104" width="182" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="425" y="124" text-anchor="middle" font-size="11" fill="#4a7a3a">不同根 → union, parent[2]=1</text>

  <!-- row 2: (1,3) -->
  <rect x="24" y="134" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="59" y="154" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">②</text>
  <rect x="94" y="134" width="90" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="139" y="154" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">(1,3)</text>
  <rect x="184" y="134" width="150" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="259" y="154" text-anchor="middle" font-size="12" fill="#333">[1, 1, <tspan fill="#b85450" font-weight="bold">1</tspan>]</text>
  <rect x="334" y="134" width="182" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="425" y="154" text-anchor="middle" font-size="11" fill="#4a7a3a">不同根 → union, parent[3]=1</text>

  <!-- row 3: (2,3) redundant -->
  <rect x="24" y="164" width="70" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="59" y="184" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">③</text>
  <rect x="94" y="164" width="90" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="139" y="184" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">(2,3)</text>
  <rect x="184" y="164" width="150" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="259" y="184" text-anchor="middle" font-size="12" fill="#888">[1, 1, 1]</text>
  <rect x="334" y="164" width="182" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="425" y="184" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">find(2)=1=find(3) → 返回</text>

  <!-- result -->
  <rect x="24" y="206" width="492" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="232" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">返回 [2, 3] ⭐ 环 1→2→3→1 上最后出现的边</text>

  <!-- graph viz -->
  <text x="270" y="270" text-anchor="middle" font-size="11.5" fill="#888">环 1—2—3—1：(1,2) 最早、(2,3) 最晚 → 删 (2,3) 得树 1—2、1—3</text>

  <circle cx="180" cy="320" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="325" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <circle cx="270" cy="320" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="325" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <circle cx="360" cy="320" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="325" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <!-- green edges (1,2)(1,3) -->
  <line x1="198" y1="320" x2="252" y2="320" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <line x1="162" y1="336" x2="342" y2="336" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)" opacity="0.55"/>
  <line x1="186" y1="338" x2="342" y2="338" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <!-- red redundant edge (2,3) -->
  <path d="M 270 302 Q 315 280 360 302" stroke="#b85450" stroke-width="2.5" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>

  <text x="315" y="276" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">删 (2,3)</text>

  <rect x="40" y="352" width="460" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="270" y="368" text-anchor="middle" font-size="10.5" fill="#444">加边顺序决定结果：同一条边位置越靠后越容易被当作冗余边返回</text>
</svg>
