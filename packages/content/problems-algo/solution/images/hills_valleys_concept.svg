<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">峰与谷：先合并相邻相等元素，再逐点判定</text>

  <!-- ===== Original array ===== -->
  <text x="30" y="62" font-size="11" fill="#446688" font-weight="bold">原数组 nums = [2, 4, 1, 1, 6, 5]</text>
  <g font-size="12">
    <rect x="80" y="70" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="105" y="90" text-anchor="middle" fill="#446688" font-weight="bold">2</text>

    <rect x="140" y="70" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="165" y="90" text-anchor="middle" fill="#446688" font-weight="bold">4</text>

    <rect x="200" y="70" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="225" y="90" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>

    <rect x="260" y="70" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="285" y="90" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>

    <rect x="320" y="70" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="345" y="90" text-anchor="middle" fill="#446688" font-weight="bold">6</text>

    <rect x="380" y="70" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="405" y="90" text-anchor="middle" fill="#446688" font-weight="bold">5</text>
  </g>

  <!-- bracket showing the two 1's are the same group -->
  <path d="M 200 106 L 200 114 L 310 114 L 310 106" stroke="#d6a040" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="255" y="128" text-anchor="middle" font-size="10" fill="#d6a040">相邻相等 → 属同一峰/谷</text>

  <!-- Arrow down: compress -->
  <path d="M 280 138 L 280 156" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="152" font-size="10" fill="#666">去重</text>

  <!-- ===== Compressed array label ===== -->
  <text x="30" y="178" font-size="11" fill="#4a7a3a" font-weight="bold">压缩后 a = [2, 4, 1, 6, 5]</text>

  <!-- ===== Terrain chart ===== -->
  <line x1="70" y1="300" x2="450" y2="300" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- polyline: (100,270) (180,230) (260,290) (340,190) (420,210) -->
  <polyline points="100,270 180,230 260,290 340,190 420,210" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>

  <g>
    <!-- index 0: value 2, boundary -->
    <circle cx="100" cy="270" r="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="100" y="260" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
    <text x="100" y="320" text-anchor="middle" font-size="9" fill="#888">边界</text>

    <!-- index 1: value 4, hill -->
    <circle cx="180" cy="230" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="180" y="220" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
    <text x="180" y="320" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">峰</text>

    <!-- index 2: value 1, valley -->
    <circle cx="260" cy="290" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="260" y="308" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="260" y="332" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">谷</text>

    <!-- index 3: value 6, hill -->
    <circle cx="340" cy="190" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="340" y="180" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">6</text>
    <text x="340" y="320" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">峰</text>

    <!-- index 4: value 5, boundary -->
    <circle cx="420" cy="210" r="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="420" y="200" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">5</text>
    <text x="420" y="320" text-anchor="middle" font-size="9" fill="#888">边界</text>
  </g>

  <!-- comparison arrows for index 1 (hill: 4 > 2 and 4 > 1) -->
  <text x="140" y="246" font-size="9" fill="#b85450">4&gt;2</text>
  <text x="220" y="246" font-size="9" fill="#b85450">4&gt;1</text>

  <!-- comparison arrows for index 2 (valley: 1 < 4 and 1 < 6) -->
  <text x="220" y="278" font-size="9" fill="#4a7a3a">1&lt;4</text>
  <text x="300" y="278" font-size="9" fill="#4a7a3a">1&lt;6</text>

  <!-- ===== Legend ===== -->
  <rect x="40" y="348" width="480" height="40" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="6" filter="url(#rough2)"/>
  <text x="55" y="366" font-size="10" fill="#b85450">峰：a[i] &gt; a[i−1] 且 a[i] &gt; a[i+1]（两侧均小）</text>
  <text x="55" y="382" font-size="10" fill="#4a7a3a">谷：a[i] &lt; a[i−1] 且 a[i] &lt; a[i+1]（两侧均大）</text>
  <text x="320" y="366" font-size="10" fill="#888">首尾无两侧邻居 → 不计入</text>
  <text x="320" y="382" font-size="10" fill="#d6a040">相邻相等已合并 → 不重复计数</text>
</svg>
