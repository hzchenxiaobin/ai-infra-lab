<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">「前缀连接」= 前 k 位相同：连接组就是等价类（示例 k = 3）</text>

  <!-- 单词表：逐字符格子，前 3 格蓝色 -->
  <text x="130" y="50" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">单词表（蓝色 = 前 k 位）</text>

  <g filter="url(#rough2)">
    <rect x="40"  y="62" width="24" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="67"  y="62" width="24" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="94"  y="62" width="24" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="52"  y="81" text-anchor="middle" font-size="13" fill="#33506b">c</text>
    <text x="79"  y="81" text-anchor="middle" font-size="13" fill="#33506b">a</text>
    <text x="106" y="81" text-anchor="middle" font-size="13" fill="#33506b">r</text>

    <rect x="40"  y="104" width="24" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="67"  y="104" width="24" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="94"  y="104" width="24" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="52"  y="123" text-anchor="middle" font-size="13" fill="#33506b">c</text>
    <text x="79"  y="123" text-anchor="middle" font-size="13" fill="#33506b">a</text>
    <text x="106" y="123" text-anchor="middle" font-size="13" fill="#33506b">t</text>

    <rect x="40"  y="146" width="24" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="67"  y="146" width="24" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="94"  y="146" width="24" height="28" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="121" y="146" width="24" height="28" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <rect x="148" y="146" width="24" height="28" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <rect x="175" y="146" width="24" height="28" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <rect x="202" y="146" width="24" height="28" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="1.2"/>
    <text x="52"  y="165" text-anchor="middle" font-size="13" fill="#33506b">c</text>
    <text x="79"  y="165" text-anchor="middle" font-size="13" fill="#33506b">a</text>
    <text x="106" y="165" text-anchor="middle" font-size="13" fill="#33506b">r</text>
    <text x="133" y="165" text-anchor="middle" font-size="13" fill="#888">t</text>
    <text x="160" y="165" text-anchor="middle" font-size="13" fill="#888">o</text>
    <text x="187" y="165" text-anchor="middle" font-size="13" fill="#888">o</text>
    <text x="214" y="165" text-anchor="middle" font-size="13" fill="#888">n</text>

    <rect x="40"  y="188" width="24" height="28" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <rect x="67"  y="188" width="24" height="28" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="52"  y="207" text-anchor="middle" font-size="13" fill="#b85450">c</text>
    <text x="79"  y="207" text-anchor="middle" font-size="13" fill="#b85450">a</text>
    <path d="M 34 186 L 100 218" stroke="#b85450" stroke-width="2.5" fill="none"/>
    <text x="84" y="238" text-anchor="middle" font-size="11" fill="#b85450">长度 2 &lt; k = 3，出局</text>
  </g>

  <!-- 分桶箭头 -->
  <text x="273" y="58" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">按前 k 位分桶</text>
  <path d="M 245 76 C 275 82, 290 90, 303 99" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 245 160 C 275 155, 290 148, 303 141" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 245 118 C 275 150, 290 205, 303 238" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 桶 1：car -->
  <g filter="url(#rough2)">
    <rect x="305" y="48" width="220" height="125" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="415" y="70" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold">桶 key = "car"</text>
    <text x="415" y="94" text-anchor="middle" font-size="12" fill="#333">· car</text>
    <text x="415" y="116" text-anchor="middle" font-size="12" fill="#333">· cartoon</text>
    <text x="415" y="148" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold">cnt = 2 ≥ 2 ✓ 计入答案</text>
  </g>

  <!-- 桶 2：cat -->
  <g filter="url(#rough2)">
    <rect x="305" y="195" width="220" height="95" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="415" y="217" text-anchor="middle" font-size="12.5" fill="#8a6d1a" font-weight="bold">桶 key = "cat"</text>
    <text x="415" y="242" text-anchor="middle" font-size="12" fill="#333">· cat</text>
    <text x="415" y="272" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">cnt = 1 ✗ 不计入</text>
  </g>

  <!-- 底部要点框 -->
  <g filter="url(#rough2)">
    <rect x="30" y="300" width="500" height="50" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="280" y="320" text-anchor="middle" font-size="12" fill="#33506b">「每对都前缀连接」⇔ 组内共用同一个前 k 位 —— 传递性白送，连接组 = 等价类</text>
    <text x="280" y="340" text-anchor="middle" font-size="11.5" fill="#33506b">答案 = cnt 值 ≥ 2 的桶数；短词（len &lt; k）出局，重复单词各占一票</text>
  </g>
</svg>
