<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">DFS 记录 (depth, parent) 流程</text>

  <!-- 起点 -->
  <rect x="150" y="44" width="220" height="34" rx="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="66" text-anchor="middle" font-size="12" fill="#333">dfs(node, parent, depth)</text>

  <line x1="260" y1="78" x2="260" y2="100" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形1 node为空? -->
  <polygon points="260,104 340,140 260,176 180,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="144" text-anchor="middle" font-size="11" fill="#333">node 为空?</text>

  <line x1="340" y1="140" x2="388" y2="140" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="350" y="134" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="390" y="124" width="100" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="440" y="144" text-anchor="middle" font-size="11" fill="#333">return (回溯)</text>

  <line x1="260" y1="176" x2="260" y2="198" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="266" y="192" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- 记录步骤（条件副作用，不分支） -->
  <rect x="70" y="200" width="380" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="220" text-anchor="middle" font-size="11" fill="#333">若 val==x：记录 x_info = (depth, parent)</text>
  <text x="260" y="238" text-anchor="middle" font-size="11" fill="#333">若 val==y：记录 y_info = (depth, parent)</text>

  <line x1="260" y1="248" x2="260" y2="270" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 递归左右 -->
  <rect x="80" y="272" width="360" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="296" text-anchor="middle" font-size="11" fill="#333">dfs(left, node, depth+1) ; dfs(right, node, depth+1)</text>

  <line x1="260" y1="312" x2="260" y2="330" stroke="#666" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="324" font-size="9" fill="#999">遍历结束</text>

  <!-- 最终比较 -->
  <rect x="60" y="332" width="400" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="356" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">return depth_x == depth_y &amp;&amp; parent_x ≠ parent_y</text>
</svg>
