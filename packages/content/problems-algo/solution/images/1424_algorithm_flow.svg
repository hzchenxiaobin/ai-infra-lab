<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：按 i+j 分桶 + 自底向上填入 + 拼接</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888">三阶段：① 算最大桶号 ② 自底向上遍历填桶 ③ 按桶号拼接</text>

  <!-- ===== Phase 1: compute maxSum ===== -->
  <rect x="30" y="60" width="180" height="120" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" fill-opacity="0.35" filter="url(#rough2)"/>
  <text x="120" y="82" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">阶段 ① 算最大桶号</text>
  <rect x="60" y="94" width="120" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="120" y="114" text-anchor="middle" font-size="10" fill="#333">maxSum = 0</text>
  <path d="M 120 128 L 120 144" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="120,148 175,168 120,188 65,168" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="166" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">遍历每行 i</text>
  <text x="120" y="178" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">更新 maxSum</text>
  <rect x="60" y="196" width="120" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="120" y="214" text-anchor="middle" font-size="9" fill="#4a7a3a">maxSum = max(i+j)</text>

  <!-- arrow to phase 2 -->
  <path d="M 210 168 L 236 168" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Phase 2: bottom-up fill ===== -->
  <rect x="240" y="60" width="220" height="250" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" fill-opacity="0.35" filter="url(#rough2)"/>
  <text x="350" y="82" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">阶段 ② 自底向上填桶</text>
  <rect x="280" y="94" width="140" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="350" y="114" text-anchor="middle" font-size="10" fill="#333">建 groups[maxSum+1]</text>
  <path d="M 350 128 L 350 146" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- outer loop: i from R-1 down to 0 -->
  <rect x="270" y="150" width="160" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="350" y="170" text-anchor="middle" font-size="10" fill="#333">for i = R−1 → 0  ↓</text>
  <path d="M 350 182 L 350 200" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- inner loop: j from 0 -->
  <rect x="270" y="204" width="160" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="350" y="224" text-anchor="middle" font-size="10" fill="#333">for j = 0 → len(row)−1</text>
  <path d="M 350 236 L 350 254" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- fill action -->
  <rect x="270" y="258" width="160" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="350" y="276" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">groups[i+j]</text>
  <text x="350" y="290" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">.append(nums[i][j])</text>

  <!-- loop back arrows -->
  <path d="M 270 278 L 256 278 L 256 219 L 270 219" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="244" y="252" text-anchor="middle" font-size="8" fill="#888">下一 j</text>
  <path d="M 430 219 L 446 219 L 446 165 L 430 165" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="458" y="194" text-anchor="middle" font-size="8" fill="#888">下一 i</text>

  <!-- note about order -->
  <rect x="262" y="306" width="176" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" fill-opacity="0.5" filter="url(#rough2)"/>
  <text x="350" y="322" text-anchor="middle" font-size="9" fill="#b85450">i 降序 ⇒ 桶内 i 降序（自下而上）</text>

  <!-- arrow to phase 3 -->
  <path d="M 460 168 L 486 168" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Phase 3: concat ===== -->
  <rect x="490" y="60" width="100" height="180" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" fill-opacity="0.4" filter="url(#rough2)"/>
  <text x="540" y="82" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">阶段 ③ 拼接</text>
  <rect x="505" y="94" width="70" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="540" y="114" text-anchor="middle" font-size="9" fill="#333">ans = []</text>
  <path d="M 540 128 L 540 146" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="505" y="150" width="70" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="540" y="170" text-anchor="middle" font-size="9" fill="#333">for s: 0→max</text>
  <path d="M 540 182 L 540 200" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="505" y="204" width="70" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="540" y="222" text-anchor="middle" font-size="9" fill="#333">ans.extend</text>
  <text x="540" y="232" text-anchor="middle" font-size="8" fill="#888">(groups[s])</text>
  <path d="M 540 236 L 540 254" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="490" y="250" width="100" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="540" y="272" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return ans</text>

  <!-- ===== Bottom: complexity ===== -->
  <rect x="30" y="200" width="180" height="110" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="120" y="222" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">复杂度</text>
  <text x="40" y="242" font-size="10" fill="#333">时间 O(n)：</text>
  <text x="40" y="256" font-size="9" fill="#555">每元素入桶/出桶各一次</text>
  <text x="40" y="270" font-size="9" fill="#555">无排序，n = 元素总数</text>
  <text x="40" y="288" font-size="10" fill="#333">空间 O(n)：</text>
  <text x="40" y="302" font-size="9" fill="#555">groups 存全部 n 个元素</text>

  <!-- ===== Bottom: brute force contrast ===== -->
  <rect x="30" y="330" width="560" height="60" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="352" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">对比暴力 O((R+C)·R)</text>
  <text x="46" y="372" font-size="10" fill="#555">• 暴力：对每条对角线 s 扫所有行 i 找有效格 ⇒ 为找少量有效格扫描大量空位，R,C 可达 10⁵ ⇒ 约 10¹⁰ 次超时</text>
  <text x="46" y="386" font-size="10" fill="#555">• 分桶：让每个有效元素 O(1) 归位，"按元素归位"取代"按空位扫描"，平方级 → 线性 O(n)</text>

  <text x="310" y="418" text-anchor="middle" font-size="10" fill="#888">关键：遍历顺序即输出顺序 —— i+j 定全局序，i 降序定桶内序，一趟 O(n) 完成</text>

  <!-- legend -->
  <g font-size="9" fill="#555">
    <rect x="40" y="436" width="12" height="10" rx="2" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
    <text x="56" y="445">① 算桶号</text>
    <rect x="130" y="436" width="12" height="10" rx="2" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
    <text x="146" y="445">② 填桶</text>
    <rect x="200" y="436" width="12" height="10" rx="2" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
    <text x="216" y="445">③ 拼接</text>
  </g>
</svg>
