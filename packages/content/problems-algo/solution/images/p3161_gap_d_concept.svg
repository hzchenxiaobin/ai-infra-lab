<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：d[j] = j − prev(j)，查询变「区间最大值」</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#888">prev(j) = j 左侧最近的障碍（没有就取 0 当虚拟左墙）；能放 sz ⟺ max d[sz..x] ≥ sz</text>

  <!-- block placed in a gap -->
  <rect x="128" y="150" width="132" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="194" y="167" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">物块 [2,5]，长 3</text>

  <!-- number line -->
  <line x1="36" y1="218" x2="484" y2="218" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g font-size="9" fill="#888">
    <line x1="40" y1="213" x2="40" y2="223" stroke="#666" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="84" y1="213" x2="84" y2="223" stroke="#666" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="128" y1="213" x2="128" y2="223" stroke="#666" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="172" y1="213" x2="172" y2="223" stroke="#666" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="216" y1="213" x2="216" y2="223" stroke="#666" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="260" y1="213" x2="260" y2="223" stroke="#666" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="304" y1="213" x2="304" y2="223" stroke="#666" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="348" y1="213" x2="348" y2="223" stroke="#666" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="392" y1="213" x2="392" y2="223" stroke="#666" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="436" y1="213" x2="436" y2="223" stroke="#666" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="480" y1="213" x2="480" y2="223" stroke="#666" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="40" y="236" text-anchor="middle">0</text>
    <text x="84" y="236" text-anchor="middle">1</text>
    <text x="128" y="236" text-anchor="middle">2</text>
    <text x="172" y="236" text-anchor="middle">3</text>
    <text x="216" y="236" text-anchor="middle">4</text>
    <text x="260" y="236" text-anchor="middle">5</text>
    <text x="304" y="236" text-anchor="middle">6</text>
    <text x="348" y="236" text-anchor="middle">7</text>
    <text x="392" y="236" text-anchor="middle">8</text>
    <text x="436" y="236" text-anchor="middle">9</text>
    <text x="480" y="236" text-anchor="middle">10</text>
  </g>

  <!-- virtual wall at 0 -->
  <line x1="40" y1="200" x2="40" y2="238" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="40" y="194" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">0 虚拟墙</text>

  <!-- obstacles -->
  <rect x="122" y="206" width="12" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="128" y="202" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">障碍 2</text>
  <rect x="342" y="206" width="12" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="348" y="202" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">障碍 7</text>

  <!-- d layer 1 -->
  <g font-size="9">
    <line x1="40" y1="262" x2="128" y2="262" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <line x1="40" y1="256" x2="40" y2="268" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <line x1="128" y1="256" x2="128" y2="268" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="84" y="257" text-anchor="middle" fill="#4a7a3a" font-weight="bold">d[2]=2</text>

    <line x1="128" y1="262" x2="260" y2="262" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <line x1="260" y1="256" x2="260" y2="268" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="194" y="278" text-anchor="middle" fill="#4a7a3a" font-weight="bold">d[5]=3</text>

    <line x1="348" y1="262" x2="480" y2="262" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
    <line x1="348" y1="256" x2="348" y2="268" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <line x1="480" y1="256" x2="480" y2="268" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="414" y="257" text-anchor="middle" fill="#d6a040" font-weight="bold">d[10]=3</text>
  </g>

  <!-- d layer 2: the max -->
  <line x1="128" y1="294" x2="348" y2="294" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <line x1="128" y1="288" x2="128" y2="300" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <line x1="348" y1="288" x2="348" y2="300" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="238" y="289" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">d[7]=5 ← 间隙 [2,7]，全场最大</text>

  <!-- bottom note -->
  <rect x="40" y="318" width="440" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="260" y="339" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">查询 [2, 10, 3]：max d[3..10] = d[7] = 5 ≥ 3 → true</text>
  <text x="260" y="358" text-anchor="middle" font-size="10" fill="#888">物块塞进间隙 [2,7]，右端点最多到 j，d[j] 正是「以 j 收尾能塞多长」</text>
</svg>
