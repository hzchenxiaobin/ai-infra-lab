<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：5 笔订单的过滤与分组去重</text>

  <!-- 表头 -->
  <g filter="url(#rough2)">
    <rect x="40" y="52" width="58" height="24" fill="#f0ede6" stroke="#999" stroke-width="1.2" rx="3"/>
    <rect x="98" y="52" width="66" height="24" fill="#f0ede6" stroke="#999" stroke-width="1.2" rx="3"/>
    <rect x="164" y="52" width="58" height="24" fill="#f0ede6" stroke="#999" stroke-width="1.2" rx="3"/>
    <rect x="222" y="52" width="84" height="24" fill="#f0ede6" stroke="#999" stroke-width="1.2" rx="3"/>
    <rect x="306" y="52" width="100" height="24" fill="#f0ede6" stroke="#999" stroke-width="1.2" rx="3"/>
    <rect x="406" y="52" width="74" height="24" fill="#f0ede6" stroke="#999" stroke-width="1.2" rx="3"/>
  </g>
  <text x="69" y="68" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">order_id</text>
  <text x="131" y="68" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">seller_id</text>
  <text x="193" y="68" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">item_id</text>
  <text x="264" y="68" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">item_brand</text>
  <text x="356" y="68" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">favorite_brand</text>
  <text x="443" y="68" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">判定 ≠</text>

  <!-- 行 1：保留 -->
  <g filter="url(#rough2)">
    <rect x="40" y="76" width="58" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <rect x="98" y="76" width="66" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <rect x="164" y="76" width="58" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <rect x="222" y="76" width="84" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <rect x="306" y="76" width="100" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <rect x="406" y="76" width="74" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
  </g>
  <text x="69" y="94" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="131" y="94" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="193" y="94" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="264" y="94" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">HP</text>
  <text x="356" y="94" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Samsung</text>
  <text x="443" y="94" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓</text>

  <!-- 行 2：保留 -->
  <g filter="url(#rough2)">
    <rect x="40" y="103" width="58" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <rect x="98" y="103" width="66" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <rect x="164" y="103" width="58" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <rect x="222" y="103" width="84" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <rect x="306" y="103" width="100" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <rect x="406" y="103" width="74" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
  </g>
  <text x="69" y="121" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="131" y="121" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="193" y="121" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="264" y="121" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Lenovo</text>
  <text x="356" y="121" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">LG</text>
  <text x="443" y="121" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓</text>

  <!-- 行 3：删除（品牌 = 偏好） -->
  <g filter="url(#rough2)">
    <rect x="40" y="130" width="58" height="27" fill="#ffffff" stroke="#bbb" stroke-width="1.1" stroke-dasharray="5 4" rx="3"/>
    <rect x="98" y="130" width="66" height="27" fill="#ffffff" stroke="#bbb" stroke-width="1.1" stroke-dasharray="5 4" rx="3"/>
    <rect x="164" y="130" width="58" height="27" fill="#ffffff" stroke="#bbb" stroke-width="1.1" stroke-dasharray="5 4" rx="3"/>
    <rect x="222" y="130" width="84" height="27" fill="#ffffff" stroke="#bbb" stroke-width="1.1" stroke-dasharray="5 4" rx="3"/>
    <rect x="306" y="130" width="100" height="27" fill="#ffffff" stroke="#bbb" stroke-width="1.1" stroke-dasharray="5 4" rx="3"/>
    <rect x="406" y="130" width="74" height="27" fill="#ffffff" stroke="#bbb" stroke-width="1.1" stroke-dasharray="5 4" rx="3"/>
  </g>
  <text x="69" y="148" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">3</text>
  <text x="131" y="148" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">3</text>
  <text x="193" y="148" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">3</text>
  <text x="264" y="148" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">LG</text>
  <text x="356" y="148" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">LG</text>
  <text x="443" y="148" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <!-- 行 4：删除（品牌 = 偏好） -->
  <g filter="url(#rough2)">
    <rect x="40" y="157" width="58" height="27" fill="#ffffff" stroke="#bbb" stroke-width="1.1" stroke-dasharray="5 4" rx="3"/>
    <rect x="98" y="157" width="66" height="27" fill="#ffffff" stroke="#bbb" stroke-width="1.1" stroke-dasharray="5 4" rx="3"/>
    <rect x="164" y="157" width="58" height="27" fill="#ffffff" stroke="#bbb" stroke-width="1.1" stroke-dasharray="5 4" rx="3"/>
    <rect x="222" y="157" width="84" height="27" fill="#ffffff" stroke="#bbb" stroke-width="1.1" stroke-dasharray="5 4" rx="3"/>
    <rect x="306" y="157" width="100" height="27" fill="#ffffff" stroke="#bbb" stroke-width="1.1" stroke-dasharray="5 4" rx="3"/>
    <rect x="406" y="157" width="74" height="27" fill="#ffffff" stroke="#bbb" stroke-width="1.1" stroke-dasharray="5 4" rx="3"/>
  </g>
  <text x="69" y="175" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">4</text>
  <text x="131" y="175" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">2</text>
  <text x="193" y="175" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">1</text>
  <text x="264" y="175" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">Samsung</text>
  <text x="356" y="175" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">Samsung</text>
  <text x="443" y="175" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <!-- 行 5：保留（与行 1 同一件商品！） -->
  <g filter="url(#rough2)">
    <rect x="40" y="184" width="58" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <rect x="98" y="184" width="66" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <rect x="164" y="184" width="58" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <rect x="222" y="184" width="84" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <rect x="306" y="184" width="100" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <rect x="406" y="184" width="74" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
  </g>
  <text x="69" y="202" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="131" y="202" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="193" y="202" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="264" y="202" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">HP</text>
  <text x="356" y="202" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Samsung</text>
  <text x="443" y="202" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓</text>

  <text x="260" y="228" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">↑ 行 1 与行 5 卖的都是 item 4 —— 去重后只算 1 件！</text>

  <!-- 分组去重结果 -->
  <rect x="40" y="242" width="140" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="110" y="262" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">seller 2：{4,4}</text>
  <text x="110" y="280" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">DISTINCT → 1</text>

  <rect x="190" y="242" width="140" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="262" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">seller 3：{2}</text>
  <text x="260" y="280" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">DISTINCT → 1</text>

  <rect x="340" y="242" width="140" height="52" fill="#ffffff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="5 4" rx="8" filter="url(#rough2)"/>
  <text x="410" y="262" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">seller 1：无订单</text>
  <text x="410" y="280" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">不参评</text>

  <!-- 最终输出 -->
  <rect x="40" y="306" width="440" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="324" text-anchor="middle" font-size="11.5" fill="#8f3a36" filter="url(#rough2)">MAX(num_items) = 1，卖家 2 与 3 并列 ⇒ 全部保留</text>
  <text x="260" y="342" text-anchor="middle" font-size="11.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">输出：(2, 1)、(3, 1)</text>
</svg>
