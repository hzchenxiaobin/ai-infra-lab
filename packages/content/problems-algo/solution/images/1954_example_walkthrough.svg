<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算</text>
  <text x="300" y="48" text-anchor="middle" font-size="11" fill="#888">S(k) = 2k(k+1)(2k+1),  周长 = 8k</text>

  <!-- Table header -->
  <rect x="40" y="64" width="520" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="84" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">k</text>
  <text x="200" y="84" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">S(k)</text>
  <text x="340" y="84" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">周长 = 8k</text>
  <text x="480" y="84" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">neededApples</text>

  <!-- Row 1: k=0 -->
  <rect x="40" y="98" width="520" height="30" rx="0" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="100" y="118" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="200" y="118" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="340" y="118" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="480" y="118" text-anchor="middle" font-size="11" fill="#888">—</text>

  <!-- Row 2: k=1 (example 1: needed=1) -->
  <rect x="40" y="128" width="520" height="30" fill="#e6f4ea" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="100" y="148" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="200" y="148" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">12</text>
  <text x="340" y="148" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">8 ✓</text>
  <text x="480" y="148" text-anchor="middle" font-size="11" fill="#4a7a3a">1 (示例1)</text>

  <!-- Row 3: k=2 (example 2: needed=13) -->
  <rect x="40" y="158" width="520" height="30" fill="#e6f4ea" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="100" y="178" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="200" y="178" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">60</text>
  <text x="340" y="178" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">16 ✓</text>
  <text x="480" y="178" text-anchor="middle" font-size="11" fill="#4a7a3a">13 (示例2)</text>

  <!-- Row 4: k=3 -->
  <rect x="40" y="188" width="520" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="100" y="208" text-anchor="middle" font-size="11" fill="#888">3</text>
  <text x="200" y="208" text-anchor="middle" font-size="11" fill="#888">168</text>
  <text x="340" y="208" text-anchor="middle" font-size="11" fill="#888">24</text>
  <text x="480" y="208" text-anchor="middle" font-size="11" fill="#888">—</text>

  <!-- Row 5: k=630 (example 3: needed=10^9) -->
  <rect x="40" y="218" width="520" height="30" fill="#e6f4ea" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="100" y="238" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">630</text>
  <text x="200" y="238" text-anchor="middle" font-size="11" fill="#4a7a3a">≈ 10^9</text>
  <text x="340" y="238" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5040 ✓</text>
  <text x="480" y="238" text-anchor="middle" font-size="11" fill="#4a7a3a">10^9 (示例3)</text>

  <!-- explanation box -->
  <rect x="40" y="262" width="520" height="108" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="284" font-size="12" fill="#d6a040" font-weight="bold">关键推导</text>
  <text x="56" y="304" font-size="11" fill="#444">示例1: needed=1 → k=0 时 S(0)=0 &lt; 1, k=1 时 S(1)=12 ≥ 1 → 周长=8</text>
  <text x="56" y="324" font-size="11" fill="#444">示例2: needed=13 → k=1 时 S(1)=12 &lt; 13, k=2 时 S(2)=60 ≥ 13 → 周长=16</text>
  <text x="56" y="344" font-size="11" fill="#444">示例3: needed=10^9 → S(k)≈4k³, k≈630, S(630)≥10^9 → 周长=5040</text>
  <text x="56" y="362" font-size="10" fill="#888">S(630) = 2×630×631×1261 = 1,002,570,660 ≥ 10^9 ✓</text>
</svg>
