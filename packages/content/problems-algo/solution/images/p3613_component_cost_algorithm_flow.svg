<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：按权升序一趟 Kruskal</text>
  <text x="260" y="38" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">同权边按「组」处理；组前检查 comp ≤ k，一旦成立立即停</text>

  <!-- 开始框 -->
  <g filter="url(#rough2)">
    <rect x="150" y="50" width="200" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="250" y="67" text-anchor="middle" font-size="10.5" fill="#2a5a2a">边按权 w 升序排序</text>
    <text x="250" y="82" text-anchor="middle" font-size="10.5" fill="#2a5a2a">comp = n，ans = 0</text>
  </g>

  <path d="M 250 90 L 250 103" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取组框 -->
  <g filter="url(#rough2)">
    <rect x="150" y="106" width="200" height="28" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <text x="250" y="124" text-anchor="middle" font-size="10.5" fill="#33455e">取下一组同权为 w 的边</text>
  </g>

  <path d="M 250 134 L 250 146" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定1：comp ≤ k ? -->
  <g filter="url(#rough2)">
    <polygon points="250,150 338,183 250,216 162,183" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
    <text x="250" y="187" text-anchor="middle" font-size="11" fill="#33455e" font-weight="bold">comp ≤ k ?</text>
  </g>

  <path d="M 162 183 L 149 183" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="155" y="176" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- 左侧返回框 -->
  <g filter="url(#rough2)">
    <rect x="18" y="155" width="131" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="83" y="173" text-anchor="middle" font-size="10.5" fill="#2a5a2a" font-weight="bold">返回 ans</text>
    <text x="83" y="189" text-anchor="middle" font-size="9.5" fill="#2a5a2a">（最后实际用到的组权</text>
    <text x="83" y="205" text-anchor="middle" font-size="9.5" fill="#2a5a2a">w；从未合并则 0）</text>
  </g>

  <path d="M 250 216 L 250 229" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="258" y="227" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- 合并框 -->
  <g filter="url(#rough2)">
    <rect x="140" y="232" width="220" height="46" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="250" y="251" text-anchor="middle" font-size="10.5" fill="#6b5a1f">unite 组内每条边（并查集）</text>
    <text x="250" y="268" text-anchor="middle" font-size="10.5" fill="#6b5a1f">成功合并则 comp−−；ans = w</text>
  </g>

  <path d="M 250 278 L 250 289" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定2：还有剩余边 ? -->
  <g filter="url(#rough2)">
    <polygon points="250,292 333,322 250,352 167,322" fill="#ffffff" stroke="#446688" stroke-width="1.8"/>
    <text x="250" y="326" text-anchor="middle" font-size="11" fill="#33455e" font-weight="bold">还有剩余边 ?</text>
  </g>

  <!-- 循环回边 -->
  <path d="M 333 322 L 452 322 L 452 120 L 354 120" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="341" y="314" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <path d="M 250 352 L 250 361" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="258" y="359" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- 底部返回框 -->
  <g filter="url(#rough2)">
    <rect x="145" y="364" width="210" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="250" y="384" text-anchor="middle" font-size="10.5" fill="#2a5a2a">返回 ans（图连通 ⟹ 必有解）</text>
  </g>

  <!-- 不变式便签 -->
  <g filter="url(#rough2)">
    <rect x="18" y="226" width="132" height="104" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="84" y="246" text-anchor="middle" font-size="9.5" fill="#6b5a1f" font-weight="bold">不变式：</text>
    <text x="84" y="261" text-anchor="middle" font-size="9.5" fill="#6b5a1f">每组处理完后</text>
    <text x="84" y="276" text-anchor="middle" font-size="9.5" fill="#6b5a1f">comp = g(w)，恰为</text>
    <text x="84" y="291" text-anchor="middle" font-size="9.5" fill="#6b5a1f">只留权 ≤ w 的边</text>
    <text x="84" y="306" text-anchor="middle" font-size="9.5" fill="#6b5a1f">所得的分量数</text>
    <text x="84" y="321" text-anchor="middle" font-size="9.5" fill="#6b5a1f">⟹ 组前查 comp ≤ k</text>
  </g>

  <text x="498" y="390" text-anchor="end" font-size="9.5" fill="#888" filter="url(#rough2)">O(m log m + m·α(n))</text>
</svg>
