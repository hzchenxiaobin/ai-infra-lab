<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：n = 4 无论怎么拆，总代价都恒等于 6 = C(4,2)</text>

  <!-- ===================== 左panel：链式拆法 ===================== -->
  <g filter="url(#rough2)">
    <rect x="22" y="40" width="250" height="228" rx="10" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
  </g>
  <text x="147" y="60" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">拆法① 每次拆出 1</text>

  <g filter="url(#rough2)" stroke="#999" stroke-width="1.4">
    <line x1="140" y1="84" x2="85" y2="134"/>
    <line x1="140" y1="84" x2="208" y2="134"/>
    <line x1="85" y1="134" x2="55" y2="184"/>
    <line x1="85" y1="134" x2="120" y2="184"/>
    <line x1="55" y1="184" x2="38" y2="234"/>
    <line x1="55" y1="184" x2="88" y2="234"/>
  </g>

  <g filter="url(#rough2)">
    <circle cx="140" cy="84" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <circle cx="85" cy="134" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="55" cy="184" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="208" cy="134" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <circle cx="120" cy="184" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <circle cx="38" cy="234" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <circle cx="88" cy="234" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <g filter="url(#rough2)" text-anchor="middle" font-size="12" fill="#333">
    <text x="140" y="88">4</text>
    <text x="85" y="138">3</text>
    <text x="55" y="188">2</text>
    <text x="208" y="138">1</text>
    <text x="120" y="188">1</text>
    <text x="38" y="238">1</text>
    <text x="88" y="238">1</text>
  </g>
  <g filter="url(#rough2)" font-size="10.5" fill="#b85450" font-weight="bold">
    <text x="165" y="78">代价 3</text>
    <text x="108" y="126">代价 2</text>
    <text x="80" y="176">代价 1</text>
  </g>
  <text x="147" y="258" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">合计 3 + 2 + 1 = 6 ✓</text>

  <!-- ===================== 右panel：平衡拆法 ===================== -->
  <g filter="url(#rough2)">
    <rect x="288" y="40" width="250" height="228" rx="10" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2"/>
  </g>
  <text x="413" y="60" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">拆法② 对半拆</text>

  <g filter="url(#rough2)" stroke="#999" stroke-width="1.4">
    <line x1="413" y1="84" x2="338" y2="134"/>
    <line x1="413" y1="84" x2="488" y2="134"/>
    <line x1="338" y1="134" x2="308" y2="184"/>
    <line x1="338" y1="134" x2="368" y2="184"/>
    <line x1="488" y1="134" x2="458" y2="184"/>
    <line x1="488" y1="134" x2="518" y2="184"/>
  </g>

  <g filter="url(#rough2)">
    <circle cx="413" cy="84" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <circle cx="338" cy="134" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="488" cy="134" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <circle cx="308" cy="184" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <circle cx="368" cy="184" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <circle cx="458" cy="184" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <circle cx="518" cy="184" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <g filter="url(#rough2)" text-anchor="middle" font-size="12" fill="#333">
    <text x="413" y="88">4</text>
    <text x="338" y="138">2</text>
    <text x="488" y="138">2</text>
    <text x="308" y="188">1</text>
    <text x="368" y="188">1</text>
    <text x="458" y="188">1</text>
    <text x="518" y="188">1</text>
  </g>
  <g filter="url(#rough2)" font-size="10.5" fill="#b85450" font-weight="bold">
    <text x="438" y="78">代价 4</text>
    <text x="362" y="126">代价 1</text>
    <text x="514" y="126">代价 1</text>
  </g>
  <text x="413" y="258" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">合计 4 + 1 + 1 = 6 ✓</text>

  <!-- ===================== 底部：不变量解释 ===================== -->
  <g filter="url(#rough2)">
    <rect x="22" y="284" width="516" height="98" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="34" y="306" font-size="12" fill="#8a6a1a" font-weight="bold" filter="url(#rough2)">为什么必然相等？成对计数不变量</text>
  <g filter="url(#rough2)" font-size="10.5" fill="#444">
    <text x="34" y="326">① 拆 x = a + b 的代价 a×b，恰等于跨越这条切缝的点对数（a 侧 × b 侧）</text>
    <text x="34" y="344">② 任意两个 1 只在最近公共祖先处被分开一次 → 每对恰好计费一次</text>
    <text x="34" y="362">③ 总代价 ≡ C(n,2) = n(n−1)/2，与拆法完全无关</text>
  </g>

  <!-- 跨缝点对小图 -->
  <g filter="url(#rough2)">
    <circle cx="445" cy="334" r="5.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <circle cx="467" cy="334" r="5.5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
    <line x1="489" y1="316" x2="489" y2="352" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 3"/>
    <circle cx="511" cy="334" r="5.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <circle cx="533" cy="334" r="5.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="489" y="370" text-anchor="middle" font-size="9.5" fill="#b85450">2×2 = 4 对跨缝</text>
  </g>
</svg>
