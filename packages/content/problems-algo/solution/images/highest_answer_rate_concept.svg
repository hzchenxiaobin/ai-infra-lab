<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">核心观察：GROUP BY question_id + 条件聚合 SUM(IF) 算回答率</text>

  <!-- SurveyLog table (left) -->
  <text x="155" y="50" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">SurveyLog（原始表）</text>
  <rect x="30" y="56" width="250" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="73" font-size="9.5" fill="#333">action</text>
  <text x="160" y="73" font-size="9.5" fill="#b85450">question_id</text>
  <line x1="100" y1="56" x2="100" y2="82" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Row 1: show 285 -->
  <rect x="30" y="82" width="250" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="97" font-size="9.5" fill="#446688" font-weight="bold">show</text>
  <text x="160" y="97" font-size="9.5" fill="#b85450" font-weight="bold">285</text>
  <line x1="100" y1="82" x2="100" y2="104" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Row 2: answer 285 -->
  <rect x="30" y="104" width="250" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="119" font-size="9.5" fill="#d6a040" font-weight="bold">answer</text>
  <text x="160" y="119" font-size="9.5" fill="#b85450" font-weight="bold">285</text>
  <line x1="100" y1="104" x2="100" y2="126" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Row 3: show 369 -->
  <rect x="30" y="126" width="250" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="141" font-size="9.5" fill="#446688" font-weight="bold">show</text>
  <text x="160" y="141" font-size="9.5" fill="#b85450" font-weight="bold">369</text>
  <line x1="100" y1="126" x2="100" y2="148" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Row 4: skip 369 -->
  <rect x="30" y="148" width="250" height="22" fill="#f5f5f5" stroke="#888" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="163" font-size="9.5" fill="#888">skip</text>
  <text x="160" y="163" font-size="9.5" fill="#b85450" font-weight="bold">369</text>
  <line x1="100" y1="148" x2="100" y2="170" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Row 5: show 369 -->
  <rect x="30" y="170" width="250" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="185" font-size="9.5" fill="#446688" font-weight="bold">show</text>
  <text x="160" y="185" font-size="9.5" fill="#b85450" font-weight="bold">369</text>
  <line x1="100" y1="170" x2="100" y2="192" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Row 6: answer 369 -->
  <rect x="30" y="192" width="250" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="207" font-size="9.5" fill="#d6a040" font-weight="bold">answer</text>
  <text x="160" y="207" font-size="9.5" fill="#b85450" font-weight="bold">369</text>
  <line x1="100" y1="192" x2="100" y2="214" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="155" y="230" text-anchor="middle" font-size="9" fill="#888">↑ show=蓝、answer=橙、skip=灰（不计入分母）</text>

  <!-- Arrow: GROUP BY -->
  <path d="M280 145 L355 145" stroke="#446688" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="317" y="138" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">GROUP BY</text>
  <text x="317" y="158" text-anchor="middle" font-size="9" fill="#446688">question_id</text>

  <!-- Aggregated buckets (right) -->
  <text x="465" y="68" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">分桶聚合结果</text>

  <rect x="360" y="76" width="210" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="385" y="93" font-size="9.5" fill="#333">question</text>
  <text x="445" y="93" font-size="9.5" fill="#d6a040">answer</text>
  <text x="490" y="93" font-size="9.5" fill="#446688">show</text>
  <text x="535" y="93" font-size="9.5" fill="#b85450">rate</text>
  <line x1="425" y1="76" x2="425" y2="102" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="470" y1="76" x2="470" y2="102" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="515" y1="76" x2="515" y2="102" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Group 285: rate=1.0 (winner) -->
  <rect x="360" y="102" width="210" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="385" y="121" font-size="10" fill="#b85450" font-weight="bold">285</text>
  <text x="445" y="121" font-size="10" fill="#d6a040" font-weight="bold">1</text>
  <text x="490" y="121" font-size="10" fill="#446688" font-weight="bold">1</text>
  <text x="535" y="121" font-size="10" fill="#b85450" font-weight="bold">1.0</text>
  <line x1="425" y1="102" x2="425" y2="134" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="470" y1="102" x2="470" y2="134" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="515" y1="102" x2="515" y2="134" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Group 369: rate=0.5 -->
  <rect x="360" y="134" width="210" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="385" y="153" font-size="10" fill="#4a7a3a" font-weight="bold">369</text>
  <text x="445" y="153" font-size="10" fill="#d6a040" font-weight="bold">1</text>
  <text x="490" y="153" font-size="10" fill="#446688" font-weight="bold">2</text>
  <text x="535" y="153" font-size="10" fill="#446688" font-weight="bold">0.5</text>
  <line x1="425" y1="134" x2="425" y2="166" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="470" y1="134" x2="470" y2="166" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="515" y1="134" x2="515" y2="166" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="465" y="184" text-anchor="middle" font-size="9" fill="#4a7a3a">ORDER BY rate DESC → 285 胜出</text>

  <!-- Down arrow to result -->
  <path d="M465 192 L465 218" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="485" y="210" font-size="9" fill="#b85450">LIMIT 1</text>

  <!-- Formula callout -->
  <rect x="60" y="270" width="460" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="292" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">回答率公式</text>
  <text x="290" y="316" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">answer_rate = SUM(action='answer') / SUM(action='show')</text>
  <text x="290" y="338" text-anchor="middle" font-size="9.5" fill="#666">条件聚合：SUM(IF(action='answer',1,0)) 数回答次数，SUM(IF(action='show',1,0)) 数展示次数</text>

  <!-- skip note -->
  <rect x="60" y="365" width="460" height="55" fill="#f5f5f5" stroke="#888" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="80" y="385" font-size="10" fill="#888" font-weight="bold">⚠ skip 动作</text>
  <text x="80" y="402" font-size="9.5" fill="#666">action 枚举含 show / answer / skip。skip 既不算「展示」也不算「回答」，</text>
  <text x="80" y="414" font-size="9.5" fill="#666">条件聚合 SUM(IF(...)) 天然跳过 skip 行——无需额外过滤。</text>
</svg>
