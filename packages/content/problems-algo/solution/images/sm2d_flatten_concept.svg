<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：行首 &gt; 上行末 ⇒ 拼接后整体升序，可一维化二分</text>

  <!-- ===== Matrix grid (3 rows x 4 cols) ===== -->
  <text x="60" y="58" font-size="12" fill="#888" font-weight="bold">原始矩阵 matrix (m=3, n=4)</text>

  <!-- row 0 -->
  <rect x="60" y="66" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="120" y="66" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="180" y="66" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="240" y="66" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="88" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="150" y="88" text-anchor="middle" font-size="13" fill="#333">3</text>
  <text x="210" y="88" text-anchor="middle" font-size="13" fill="#333">5</text>
  <text x="270" y="88" text-anchor="middle" font-size="13" fill="#333">7</text>
  <text x="48" y="88" text-anchor="end" font-size="10" fill="#999">行0</text>

  <!-- row 1 -->
  <rect x="60" y="100" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="120" y="100" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="180" y="100" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="240" y="100" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="122" text-anchor="middle" font-size="13" fill="#333">10</text>
  <text x="150" y="122" text-anchor="middle" font-size="13" fill="#333">11</text>
  <text x="210" y="122" text-anchor="middle" font-size="13" fill="#333">16</text>
  <text x="270" y="122" text-anchor="middle" font-size="13" fill="#333">20</text>
  <text x="48" y="122" text-anchor="end" font-size="10" fill="#999">行1</text>

  <!-- row 2 -->
  <rect x="60" y="134" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="120" y="134" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="180" y="134" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="240" y="134" width="60" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="156" text-anchor="middle" font-size="13" fill="#333">23</text>
  <text x="150" y="156" text-anchor="middle" font-size="13" fill="#333">30</text>
  <text x="210" y="156" text-anchor="middle" font-size="13" fill="#333">34</text>
  <text x="270" y="156" text-anchor="middle" font-size="13" fill="#333">60</text>
  <text x="48" y="156" text-anchor="end" font-size="10" fill="#999">行2</text>

  <!-- col labels -->
  <text x="90" y="60" text-anchor="middle" font-size="9" fill="#aaa">列0</text>
  <text x="150" y="60" text-anchor="middle" font-size="9" fill="#aaa">列1</text>
  <text x="210" y="60" text-anchor="middle" font-size="9" fill="#aaa">列2</text>
  <text x="270" y="60" text-anchor="middle" font-size="9" fill="#aaa">列3</text>

  <!-- "行首>上行末" annotations between rows -->
  <text x="300" y="92" font-size="9.5" fill="#b85450">7 &lt; 10 ✓</text>
  <text x="300" y="126" font-size="9.5" fill="#b85450">20 &lt; 23 ✓</text>

  <!-- arrows: flatten rows into 1D -->
  <path d="M 180 178 L 180 200" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="196" y="194" font-size="10.5" fill="#888" font-weight="bold">按行拼接</text>

  <!-- ===== Flattened 1D array ===== -->
  <text x="60" y="218" font-size="12" fill="#888" font-weight="bold">一维展开（长度 N = m·n = 12）</text>

  <!-- 12 cells, width 38, starting x=60 -->
  <g font-size="12" fill="#333">
    <!-- values row -->
    <rect x="60" y="228" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="79" y="248" text-anchor="middle">1</text>
    <rect x="98" y="228" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="117" y="248" text-anchor="middle">3</text>
    <rect x="136" y="228" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="155" y="248" text-anchor="middle">5</text>
    <rect x="174" y="228" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="193" y="248" text-anchor="middle">7</text>
    <rect x="212" y="228" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="231" y="248" text-anchor="middle">10</text>
    <!-- highlight k=5 -->
    <rect x="250" y="228" width="38" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
    <text x="269" y="248" text-anchor="middle" font-weight="bold" fill="#b85450">11</text>
    <rect x="288" y="228" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="307" y="248" text-anchor="middle">16</text>
    <rect x="326" y="228" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="345" y="248" text-anchor="middle">20</text>
    <rect x="364" y="228" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="383" y="248" text-anchor="middle">23</text>
    <rect x="402" y="228" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="421" y="248" text-anchor="middle">30</text>
    <rect x="440" y="228" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="459" y="248" text-anchor="middle">34</text>
    <rect x="478" y="228" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="497" y="248" text-anchor="middle">60</text>
  </g>

  <!-- index row -->
  <g font-size="9.5" fill="#999">
    <text x="79" y="272" text-anchor="middle">0</text>
    <text x="117" y="272" text-anchor="middle">1</text>
    <text x="155" y="272" text-anchor="middle">2</text>
    <text x="193" y="272" text-anchor="middle">3</text>
    <text x="231" y="272" text-anchor="middle">4</text>
    <text x="269" y="272" text-anchor="middle" fill="#b85450" font-weight="bold">5</text>
    <text x="307" y="272" text-anchor="middle">6</text>
    <text x="345" y="272" text-anchor="middle">7</text>
    <text x="383" y="272" text-anchor="middle">8</text>
    <text x="421" y="272" text-anchor="middle">9</text>
    <text x="459" y="272" text-anchor="middle">10</text>
    <text x="497" y="272" text-anchor="middle">11</text>
  </g>
  <text x="48" y="248" text-anchor="end" font-size="10" fill="#888">值</text>
  <text x="48" y="272" text-anchor="end" font-size="10" fill="#888">k</text>

  <!-- highlight arrow for k=5 -->
  <path d="M 269 280 L 269 296" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Mapping formula box ===== -->
  <rect x="60" y="300" width="440" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">一维下标 k ↔ 二维坐标 (row, col)</text>
  <text x="280" y="350" text-anchor="middle" font-size="13" fill="#446688">row = k / n ，col = k % n</text>
  <text x="280" y="372" text-anchor="middle" font-size="11" fill="#777">（除数是列数 n，不是行数 m）</text>
  <text x="280" y="398" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">例：k = 5 → row = 5/4 = 1，col = 5%4 = 1 → matrix[1][1] = 11</text>
  <text x="280" y="416" text-anchor="middle" font-size="10" fill="#888">拿到 val 后就是普通闭区间二分：O(log(m·n))</text>
</svg>
