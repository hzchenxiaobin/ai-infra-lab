<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：arr = [3, 1, 2, 4]</text>

  <text x="30" y="54" font-size="12" fill="#888">预处理后 left = [−1, −1, 1, 2]，right = [1, 4, 4, 4]</text>

  <rect x="40" y="68" width="70" height="32" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="88" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">i</text>

  <rect x="115" y="68" width="70" height="32" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="88" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">arr[i]</text>

  <rect x="190" y="68" width="70" height="32" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="225" y="88" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">left[i]</text>

  <rect x="265" y="68" width="70" height="32" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="88" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">right[i]</text>

  <rect x="340" y="68" width="110" height="32" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="395" y="88" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">count=(i−L)(R−i)</text>

  <rect x="455" y="68" width="115" height="32" fill="#d6a040" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="512" y="88" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">贡献=arr×count</text>

  <rect x="40" y="104" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="124" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="115" y="104" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="124" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="190" y="104" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="225" y="124" text-anchor="middle" font-size="12" fill="#333">−1</text>
  <rect x="265" y="104" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="300" y="124" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="340" y="104" width="110" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="395" y="124" text-anchor="middle" font-size="12" fill="#333">1×1 = 1</text>
  <rect x="455" y="104" width="115" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="512" y="124" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3×1 = 3</text>

  <rect x="40" y="140" width="70" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="160" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="115" y="140" width="70" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="160" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="190" y="140" width="70" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="225" y="160" text-anchor="middle" font-size="12" fill="#333">−1</text>
  <rect x="265" y="140" width="70" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="160" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="340" y="140" width="110" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="395" y="160" text-anchor="middle" font-size="12" fill="#333">2×3 = 6</text>
  <rect x="455" y="140" width="115" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="512" y="160" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1×6 = 6</text>

  <rect x="40" y="176" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="196" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="115" y="176" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="196" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="190" y="176" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="225" y="196" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="265" y="176" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="196" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="340" y="176" width="110" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="395" y="196" text-anchor="middle" font-size="12" fill="#333">1×2 = 2</text>
  <rect x="455" y="176" width="115" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="512" y="196" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2×2 = 4</text>

  <rect x="40" y="212" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="232" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="115" y="212" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="232" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="190" y="212" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="225" y="232" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="265" y="212" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="300" y="232" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="340" y="212" width="110" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="395" y="232" text-anchor="middle" font-size="12" fill="#333">1×1 = 1</text>
  <rect x="455" y="212" width="115" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="512" y="232" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4×1 = 4</text>

  <rect x="40" y="256" width="530" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="280" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">总和 = 3 + 6 + 4 + 4 = 17</text>

  <text x="30" y="316" font-size="11" fill="#888" font-weight="bold">验证（枚举所有子数组）：</text>

  <rect x="40" y="328" width="530" height="76" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="55" y="348" font-size="10" fill="#666">[3]→3</text>
  <text x="135" y="348" font-size="10" fill="#666">[3,1]→1</text>
  <text x="220" y="348" font-size="10" fill="#666">[3,1,2]→1</text>
  <text x="320" y="348" font-size="10" fill="#666">[3,1,2,4]→1</text>
  <text x="440" y="348" font-size="10" fill="#666">[1]→1</text>
  <text x="55" y="368" font-size="10" fill="#666">[1,2]→1</text>
  <text x="135" y="368" font-size="10" fill="#666">[1,2,4]→1</text>
  <text x="240" y="368" font-size="10" fill="#666">[2]→2</text>
  <text x="310" y="368" font-size="10" fill="#666">[2,4]→2</text>
  <text x="400" y="368" font-size="10" fill="#666">[4]→4</text>
  <text x="55" y="392" font-size="11" fill="#b85450" font-weight="bold">和 = 3+1+1+1+1+1+1+2+2+4 = 17 ✓</text>
</svg>
