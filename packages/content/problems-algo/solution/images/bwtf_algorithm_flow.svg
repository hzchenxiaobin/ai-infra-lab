<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：排序 → 逐值 DP 找因子对 → 累加所有 dp 值</text>

  <!-- step 1 -->
  <rect x="160" y="44" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① 排序 arr（升序）</text>
  <text x="260" y="80" text-anchor="middle" font-size="10" fill="#666">保证算 x 时因子 a,b &lt; x 已就绪</text>

  <path d="M 260 88 L 260 100" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="160" y="102" width="200" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="122" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">② 建哈希集合 numSet</text>
  <text x="260" y="138" text-anchor="middle" font-size="10" fill="#666">O(1) 判断因子是否在 arr 中</text>

  <path d="M 260 146 L 260 158" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 3: main loop -->
  <rect x="60" y="160" width="400" height="140" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="182" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">③ 遍历 x ∈ sorted(arr)</text>
  <text x="80" y="206" font-size="11" fill="#444">dp[x] = 1                               // 单叶树</text>
  <text x="80" y="226" font-size="11" fill="#444">for a ∈ arr, a &lt; x:</text>
  <text x="100" y="244" font-size="11" fill="#444">if x % a == 0:</text>
  <text x="120" y="262" font-size="11" fill="#444">b = x / a</text>
  <text x="120" y="280" font-size="11" fill="#b85450" font-weight="bold">if b in numSet: dp[x] += dp[a] × dp[b]</text>
  <text x="340" y="226" font-size="10" fill="#888">遍历所有更小值</text>
  <text x="340" y="244" font-size="10" fill="#888">整除才是因子</text>
  <text x="340" y="280" font-size="10" fill="#888">dp[b] 已算好</text>

  <path d="M 260 300 L 260 312" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 4 -->
  <rect x="120" y="314" width="280" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="334" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">④ 返回 Σ dp[x]（mod 1e9+7）</text>
  <text x="260" y="350" text-anchor="middle" font-size="10" fill="#666">每个值均可作为树根，求和得总数</text>

  <text x="260" y="382" text-anchor="middle" font-size="10" fill="#888">复杂度：时间 O(n²)   空间 O(n)</text>
</svg>
