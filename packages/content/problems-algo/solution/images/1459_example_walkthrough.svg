<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    示例演算：3 个点 → 3 个配对 → 2 个有效矩形
  </text>

  <!-- ===== 左侧：坐标网格 ===== -->
  <!-- 网格线（x 方向 0..5） -->
  <g stroke="#e3e3e3" stroke-width="1" filter="url(#rough2)">
    <line x1="90"  y1="90"  x2="90"  y2="300"/>
    <line x1="122" y1="90"  x2="122" y2="300"/>
    <line x1="154" y1="90"  x2="154" y2="300"/>
    <line x1="186" y1="90"  x2="186" y2="300"/>
    <line x1="218" y1="90"  x2="218" y2="300"/>
    <line x1="250" y1="90"  x2="250" y2="300"/>
  </g>
  <!-- 网格线（y 方向 7..10） -->
  <g stroke="#e3e3e3" stroke-width="1" filter="url(#rough2)">
    <line x1="90" y1="153" x2="250" y2="153"/>
    <line x1="90" y1="132" x2="250" y2="132"/>
    <line x1="90" y1="111" x2="250" y2="111"/>
    <line x1="90" y1="90"  x2="250" y2="90"/>
  </g>

  <!-- 坐标轴 -->
  <line x1="90" y1="300" x2="262" y2="300" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="90" y1="300" x2="90" y2="82" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="304" font-size="11" fill="#446688" filter="url(#rough2)">x</text>
  <text x="84" y="80" text-anchor="end" font-size="11" fill="#446688" filter="url(#rough2)">y</text>
  <!-- 刻度数字 -->
  <text x="154" y="316" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">2</text>
  <text x="218" y="316" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">4</text>
  <text x="84" y="157" text-anchor="end" font-size="10" fill="#666" filter="url(#rough2)">7</text>
  <text x="84" y="136" text-anchor="end" font-size="10" fill="#666" filter="url(#rough2)">8</text>
  <text x="84" y="94" text-anchor="end" font-size="10" fill="#666" filter="url(#rough2)">10</text>

  <!-- 矩形 (2,3)：x154-218, y90-132，area=4 -->
  <rect x="154" y="90" width="64" height="42" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.8" rx="2" filter="url(#rough2)"/>
  <line x1="154" y1="132" x2="218" y2="90" stroke="#4a7a3a" stroke-width="1.4"
        stroke-dasharray="5 3" filter="url(#rough2)"/>

  <!-- 矩形 (1,2)：x154-218, y132-153，area=2 -->
  <rect x="154" y="132" width="64" height="21" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.8" rx="2" filter="url(#rough2)"/>
  <line x1="154" y1="153" x2="218" y2="132" stroke="#446688" stroke-width="1.4"
        stroke-dasharray="5 3" filter="url(#rough2)"/>

  <!-- 退化配对 (1,3)：x 相同 → 竖直红线 -->
  <line x1="154" y1="90" x2="154" y2="153" stroke="#b85450" stroke-width="2"
        stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- 三个点 -->
  <circle cx="154" cy="153" r="5" fill="#b85450" filter="url(#rough2)"/>
  <text x="148" y="168" text-anchor="end" font-size="11" fill="#b85450" filter="url(#rough2)">id1 (2,7)</text>
  <circle cx="218" cy="132" r="5" fill="#b85450" filter="url(#rough2)"/>
  <text x="224" y="128" font-size="11" fill="#b85450" filter="url(#rough2)">id2 (4,8)</text>
  <circle cx="154" cy="90" r="5" fill="#b85450" filter="url(#rough2)"/>
  <text x="148" y="84" text-anchor="end" font-size="11" fill="#b85450" filter="url(#rough2)">id3 (2,10)</text>

  <!-- 面积标注 -->
  <text x="186" y="125" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">area=4</text>
  <text x="186" y="146" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">area=2</text>

  <!-- ===== 右侧：配对结果表 ===== -->
  <text x="400" y="62" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">三个配对（p1&lt;p2）</text>

  <!-- 表头 -->
  <rect x="300" y="74" width="220" height="26" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="320" y="91" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">配对</text>
  <text x="370" y="91" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Δx</text>
  <text x="410" y="91" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Δy</text>
  <text x="450" y="91" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">area</text>
  <text x="498" y="91" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">输出?</text>

  <!-- 行 1： (1,2) -->
  <rect x="300" y="100" width="220" height="26" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="320" y="117" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(1,2)</text>
  <text x="370" y="117" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="410" y="117" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="450" y="117" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="498" y="117" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <!-- 行 2： (2,3) -->
  <rect x="300" y="126" width="220" height="26" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="320" y="143" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(2,3)</text>
  <text x="370" y="143" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="410" y="143" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="450" y="143" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="498" y="143" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <!-- 行 3： (1,3) -->
  <rect x="300" y="152" width="220" height="26" fill="#fce4ec" stroke="#b85450"
        stroke-width="1.2" filter="url(#rough2)"/>
  <text x="320" y="169" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(1,3)</text>
  <text x="370" y="169" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="410" y="169" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="450" y="169" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">0</text>
  <text x="498" y="169" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- 输出排序说明 -->
  <rect x="300" y="196" width="220" height="64" rx="8" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.6" filter="url(#rough2)"/>
  <text x="410" y="216" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">
    按 area DESC 排序：
  </text>
  <text x="410" y="234" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">
    (2, 3, 4)  ← area=4 居先
  </text>
  <text x="410" y="252" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">
    (1, 2, 2)  ← area=2 其后
  </text>
</svg>
