<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="470" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：每次 get 前的有序列表与返回值</text>
  <text x="290" y="48" text-anchor="middle" font-size="11" fill="#888">排序规则：评分降序，同分字典序升；红框=本次返回的第 i 佳</text>

  <!-- column headers -->
  <text x="48" y="78" font-size="11" fill="#888" font-weight="bold">第 i 次</text>
  <text x="118" y="78" font-size="11" fill="#888" font-weight="bold">get 前已加入景点（最好→最坏）</text>
  <text x="500" y="78" font-size="11" fill="#888" font-weight="bold">返回</text>

  <!-- ===== Row 1: get #1 ===== -->
  <text x="48" y="108" font-size="12" fill="#446688" font-weight="bold">#1</text>
  <g font-size="10">
    <rect x="118" y="92" width="78" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="157" y="104" text-anchor="middle" fill="#b85450" font-weight="bold">branford</text>
    <text x="157" y="115" text-anchor="middle" font-size="9" fill="#b85450">3</text>
    <rect x="198" y="92" width="74" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="235" y="104" text-anchor="middle" fill="#333">bradford</text>
    <text x="235" y="115" text-anchor="middle" font-size="9" fill="#888">2</text>
  </g>
  <path d="M 280 106 L 372 106" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="110" font-size="11" fill="#b85450" font-weight="bold">branford</text>

  <!-- ===== Row 2: get #2 (after add alps) ===== -->
  <text x="48" y="158" font-size="12" fill="#446688" font-weight="bold">#2</text>
  <g font-size="10">
    <rect x="118" y="142" width="78" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="157" y="154" text-anchor="middle" fill="#333">branford</text>
    <text x="157" y="165" text-anchor="middle" font-size="9" fill="#888">3</text>
    <rect x="198" y="142" width="52" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="224" y="154" text-anchor="middle" fill="#b85450" font-weight="bold">alps</text>
    <text x="224" y="165" text-anchor="middle" font-size="9" fill="#b85450">2</text>
    <rect x="252" y="142" width="74" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="289" y="154" text-anchor="middle" fill="#333">bradford</text>
    <text x="289" y="165" text-anchor="middle" font-size="9" fill="#888">2</text>
  </g>
  <path d="M 334 156 L 372 156" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="160" font-size="11" fill="#b85450" font-weight="bold">alps</text>

  <!-- ===== Row 3: get #3 (after add orland) ===== -->
  <text x="48" y="208" font-size="12" fill="#446688" font-weight="bold">#3</text>
  <g font-size="10">
    <rect x="118" y="192" width="78" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="157" y="204" text-anchor="middle" fill="#333">branford</text>
    <text x="157" y="215" text-anchor="middle" font-size="9" fill="#888">3</text>
    <rect x="198" y="192" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="224" y="204" text-anchor="middle" fill="#333">alps</text>
    <text x="224" y="215" text-anchor="middle" font-size="9" fill="#888">2</text>
    <rect x="252" y="192" width="74" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="289" y="204" text-anchor="middle" fill="#b85450" font-weight="bold">bradford</text>
    <text x="289" y="215" text-anchor="middle" font-size="9" fill="#b85450">2</text>
    <rect x="328" y="192" width="58" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="357" y="204" text-anchor="middle" fill="#333">orland</text>
    <text x="357" y="215" text-anchor="middle" font-size="9" fill="#888">2</text>
  </g>
  <path d="M 394 206 L 432 206" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="452" y="210" font-size="11" fill="#b85450" font-weight="bold">bradford</text>

  <!-- ===== Row 4: get #4 (after add orlando) ===== -->
  <text x="48" y="258" font-size="12" fill="#446688" font-weight="bold">#4</text>
  <g font-size="10">
    <rect x="118" y="242" width="78" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="157" y="254" text-anchor="middle" fill="#333">branford</text>
    <text x="157" y="265" text-anchor="middle" font-size="9" fill="#888">3</text>
    <rect x="198" y="242" width="66" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="231" y="254" text-anchor="middle" fill="#333">orlando</text>
    <text x="231" y="265" text-anchor="middle" font-size="9" fill="#888">3</text>
    <rect x="266" y="242" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="292" y="254" text-anchor="middle" fill="#333">alps</text>
    <text x="292" y="265" text-anchor="middle" font-size="9" fill="#888">2</text>
    <rect x="320" y="242" width="74" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="357" y="254" text-anchor="middle" fill="#b85450" font-weight="bold">bradford</text>
    <text x="357" y="265" text-anchor="middle" font-size="9" fill="#b85450">2</text>
    <rect x="396" y="242" width="58" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="425" y="254" text-anchor="middle" fill="#333">orland</text>
    <text x="425" y="265" text-anchor="middle" font-size="9" fill="#888">2</text>
  </g>
  <path d="M 462 256 L 488 256" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="508" y="260" font-size="11" fill="#b85450" font-weight="bold">bradford</text>

  <!-- ===== Row 5: get #5 (after add alpine) ===== -->
  <text x="48" y="308" font-size="12" fill="#446688" font-weight="bold">#5</text>
  <g font-size="9">
    <rect x="118" y="292" width="64" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="150" y="304" text-anchor="middle" fill="#333">branford</text>
    <text x="150" y="315" text-anchor="middle" font-size="8" fill="#888">3</text>
    <rect x="184" y="292" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="212" y="304" text-anchor="middle" fill="#333">orlando</text>
    <text x="212" y="315" text-anchor="middle" font-size="8" fill="#888">3</text>
    <rect x="242" y="292" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="268" y="304" text-anchor="middle" fill="#333">alpine</text>
    <text x="268" y="315" text-anchor="middle" font-size="8" fill="#888">2</text>
    <rect x="296" y="292" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="318" y="304" text-anchor="middle" fill="#333">alps</text>
    <text x="318" y="315" text-anchor="middle" font-size="8" fill="#888">2</text>
    <rect x="342" y="292" width="64" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="374" y="304" text-anchor="middle" fill="#b85450" font-weight="bold">bradford</text>
    <text x="374" y="315" text-anchor="middle" font-size="8" fill="#b85450">2</text>
    <rect x="408" y="292" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="433" y="304" text-anchor="middle" fill="#333">orland</text>
    <text x="433" y="315" text-anchor="middle" font-size="8" fill="#888">2</text>
  </g>
  <path d="M 468 306 L 488 306" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="508" y="310" font-size="11" fill="#b85450" font-weight="bold">bradford</text>

  <!-- ===== Row 6: get #6 (same list) ===== -->
  <text x="48" y="358" font-size="12" fill="#446688" font-weight="bold">#6</text>
  <g font-size="9">
    <rect x="118" y="342" width="64" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="150" y="354" text-anchor="middle" fill="#333">branford</text>
    <text x="150" y="365" text-anchor="middle" font-size="8" fill="#888">3</text>
    <rect x="184" y="342" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="212" y="354" text-anchor="middle" fill="#333">orlando</text>
    <text x="212" y="365" text-anchor="middle" font-size="8" fill="#888">3</text>
    <rect x="242" y="342" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="268" y="354" text-anchor="middle" fill="#333">alpine</text>
    <text x="268" y="365" text-anchor="middle" font-size="8" fill="#888">2</text>
    <rect x="296" y="342" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="318" y="354" text-anchor="middle" fill="#333">alps</text>
    <text x="318" y="365" text-anchor="middle" font-size="8" fill="#888">2</text>
    <rect x="342" y="342" width="64" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="374" y="354" text-anchor="middle" fill="#333">bradford</text>
    <text x="374" y="365" text-anchor="middle" font-size="8" fill="#888">2</text>
    <rect x="408" y="342" width="50" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="433" y="354" text-anchor="middle" fill="#b85450" font-weight="bold">orland</text>
    <text x="433" y="365" text-anchor="middle" font-size="8" fill="#b85450">2</text>
  </g>
  <path d="M 468 356 L 488 356" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="508" y="360" font-size="11" fill="#b85450" font-weight="bold">orland</text>

  <!-- ===== bottom note ===== -->
  <rect x="40" y="392" width="500" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="412" font-size="11" fill="#444" font-weight="bold">观察：</text>
  <text x="56" y="428" font-size="10" fill="#333">① 同分按字典序：alpine &lt; alps &lt; bradford &lt; orland（均 2 分），故 get #5 返回 bradford（第 5 佳）；</text>
  <text x="56" y="444" font-size="10" fill="#333">② 每次 get 使 k 增 1，分界右移一位，恰好返回越过分界的那一个景点。</text>
</svg>
