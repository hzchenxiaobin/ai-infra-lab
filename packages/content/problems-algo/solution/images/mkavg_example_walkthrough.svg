<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：m = 3, k = 1（mid 仅 1 个元素）</text>

  <!-- Column headers -->
  <text x="60" y="56" font-size="11" fill="#888" font-weight="bold">操作</text>
  <text x="160" y="56" font-size="11" fill="#888" font-weight="bold">窗口 q</text>
  <text x="290" y="56" font-size="11" fill="#888" font-weight="bold">lo (k=1)</text>
  <text x="370" y="56" font-size="11" fill="#888" font-weight="bold">mid (m−2k=1)</text>
  <text x="480" y="56" font-size="11" fill="#888" font-weight="bold">hi (k=1)</text>

  <!-- Separator -->
  <path d="M 40 64 L 540 64" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 0: addElement(3) -->
  <text x="60" y="84" font-size="11" fill="#333">add(3)</text>
  <text x="160" y="84" font-size="11" fill="#333">[3]</text>
  <text x="290" y="84" font-size="11" fill="#b85450" font-weight="bold">{3}</text>
  <text x="370" y="84" font-size="11" fill="#999">∅</text>
  <text x="480" y="84" font-size="11" fill="#999">∅</text>

  <!-- Row 1: addElement(1) -->
  <text x="60" y="108" font-size="11" fill="#333">add(1)</text>
  <text x="160" y="108" font-size="11" fill="#333">[3, 1]</text>
  <text x="290" y="108" font-size="11" fill="#b85450" font-weight="bold">{1}</text>
  <text x="370" y="108" font-size="11" fill="#446688" font-weight="bold">{3}</text>
  <text x="480" y="108" font-size="11" fill="#999">∅</text>
  <text x="200" y="108" font-size="10" fill="#d6a040">← 1 入 lo 溢出，3 移入 mid</text>

  <!-- Row 2: calculateMKAverage -> -1 -->
  <rect x="36" y="118" width="504" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="60" y="134" font-size="11" fill="#333">calc()</text>
  <text x="160" y="134" font-size="11" fill="#333">|q| = 2 &lt; m = 3</text>
  <text x="370" y="134" font-size="12" fill="#b85450" font-weight="bold">→ 返回 −1（数据不足）</text>

  <!-- Row 3: addElement(10) -->
  <text x="60" y="158" font-size="11" fill="#333">add(10)</text>
  <text x="160" y="158" font-size="11" fill="#333">[3, 1, 10]</text>
  <text x="290" y="158" font-size="11" fill="#b85450" font-weight="bold">{1}</text>
  <text x="370" y="158" font-size="11" fill="#446688" font-weight="bold">{3}</text>
  <text x="480" y="158" font-size="11" fill="#b85450" font-weight="bold">{10}</text>
  <text x="200" y="158" font-size="10" fill="#d6a040">← 10 ≥ max(lo)，落入 hi</text>

  <!-- Row 4: calculateMKAverage -> 3 -->
  <rect x="36" y="168" width="504" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="60" y="184" font-size="11" fill="#333">calc()</text>
  <text x="160" y="184" font-size="11" fill="#333">|q| = 3 = m</text>
  <text x="370" y="184" font-size="12" fill="#4a7a3a" font-weight="bold">→ ⌊ sum(mid) / (m−2k) ⌋ = ⌊ 3 / 1 ⌋ = 3 ✓</text>

  <!-- Row 5: addElement(5), evict 3 -->
  <text x="60" y="208" font-size="11" fill="#333">add(5)</text>
  <text x="160" y="208" font-size="11" fill="#333">[1, 10, 5]</text>
  <text x="290" y="208" font-size="11" fill="#b85450" font-weight="bold">{1}</text>
  <text x="370" y="208" font-size="11" fill="#446688" font-weight="bold">{5}</text>
  <text x="480" y="208" font-size="11" fill="#b85450" font-weight="bold">{10}</text>
  <text x="200" y="208" font-size="10" fill="#d6a040">← 5 入 mid；淘汰 old=3（在 mid）</text>

  <!-- Row 6: addElement(5), evict 1 -->
  <text x="60" y="232" font-size="11" fill="#333">add(5)</text>
  <text x="160" y="232" font-size="11" fill="#333">[10, 5, 5]</text>
  <text x="290" y="232" font-size="11" fill="#b85450" font-weight="bold">{5}</text>
  <text x="370" y="232" font-size="11" fill="#446688" font-weight="bold">{5}</text>
  <text x="480" y="232" font-size="11" fill="#b85450" font-weight="bold">{10}</text>
  <text x="200" y="232" font-size="10" fill="#d6a040">← 淘汰 old=1（在 lo），mid 最小值 5 补入 lo</text>

  <!-- Row 7: addElement(5), evict 10 -->
  <text x="60" y="256" font-size="11" fill="#333">add(5)</text>
  <text x="160" y="256" font-size="11" fill="#333">[5, 5, 5]</text>
  <text x="290" y="256" font-size="11" fill="#b85450" font-weight="bold">{5}</text>
  <text x="370" y="256" font-size="11" fill="#446688" font-weight="bold">{5}</text>
  <text x="480" y="256" font-size="11" fill="#b85450" font-weight="bold">{5}</text>
  <text x="200" y="256" font-size="10" fill="#d6a040">← 5 入 lo 溢出 → mid；淘汰 old=10（在 hi）</text>

  <!-- Row 8: calculateMKAverage -> 5 -->
  <rect x="36" y="266" width="504" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="60" y="282" font-size="11" fill="#333">calc()</text>
  <text x="160" y="282" font-size="11" fill="#333">|q| = 3 = m</text>
  <text x="370" y="282" font-size="12" fill="#4a7a3a" font-weight="bold">→ ⌊ 5 / 1 ⌋ = 5 ✓</text>

  <!-- Key insight box -->
  <rect x="40" y="304" width="480" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="328" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">关键观察</text>
  <text x="56" y="350" font-size="11" fill="#666">• mid 只需维护「和」mid_sum，无需遍历——calculateMKAverage 为 O(1)</text>
  <text x="56" y="370" font-size="11" fill="#666">• 淘汰 old 时按值定位桶：old ≤ max(lo) → lo；old ≥ min(hi) → hi；否则 mid</text>
  <text x="56" y="390" font-size="11" fill="#666">• lo/hi 删后不足 k 个，从 mid 端点补一个；mid 删后不补（本就多一个）</text>
  <text x="56" y="410" font-size="11" fill="#666">• 每次 addElement 仅 O(log m)（multiset 插入/删除），总计 O(n log m)</text>
</svg>
