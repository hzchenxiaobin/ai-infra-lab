<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">位掩码：用一个二进制数记录「哪些数字已放置」</text>

  <!-- number labels (n = 5) -->
  <text x="40" y="78" font-size="12" fill="#888">数字:</text>
  <rect x="80" y="62" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="84" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="150" y="62" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="84" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="220" y="62" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="84" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="290" y="62" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="84" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="360" y="62" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="390" y="84" text-anchor="middle" font-size="13" fill="#333">5</text>

  <!-- bit index -->
  <text x="40" y="118" font-size="11" fill="#888">bit 位:</text>
  <text x="110" y="118" text-anchor="middle" font-size="11" fill="#888">bit0</text>
  <text x="180" y="118" text-anchor="middle" font-size="11" fill="#888">bit1</text>
  <text x="250" y="118" text-anchor="middle" font-size="11" fill="#888">bit2</text>
  <text x="320" y="118" text-anchor="middle" font-size="11" fill="#888">bit3</text>
  <text x="390" y="118" text-anchor="middle" font-size="11" fill="#888">bit4</text>

  <!-- example mask = 01101 (numbers 1, 3, 4 used) -->
  <text x="40" y="150" font-size="12" fill="#888">mask 值:</text>
  <rect x="80" y="134" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="156" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="150" y="134" width="60" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="156" text-anchor="middle" font-size="14" fill="#999">0</text>
  <rect x="220" y="134" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="156" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="290" y="134" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="156" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="360" y="134" width="60" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="390" y="156" text-anchor="middle" font-size="14" fill="#999">0</text>

  <!-- annotation: 1 = used, 0 = unused -->
  <rect x="440" y="62" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="470" y="84" text-anchor="middle" font-size="11" fill="#4a7a3a">= 已用</text>
  <rect x="440" y="134" width="60" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="470" y="156" text-anchor="middle" font-size="11" fill="#b85450">= 未用</text>

  <!-- reading the mask -->
  <rect x="40" y="195" width="440" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="220" text-anchor="middle" font-size="12" fill="#444">mask = 01101₂ = 13 → 已放置 {1, 3, 4}，下一个待填位置 = 4</text>

  <!-- popcount -> position -->
  <rect x="40" y="250" width="210" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="145" y="274" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">已放个数 = popcount(mask)</text>
  <text x="145" y="294" text-anchor="middle" font-size="11" fill="#555">数一数 mask 里有几个 1</text>
  <text x="145" y="314" text-anchor="middle" font-size="11" fill="#555">例：01101 有 3 个 1</text>

  <path d="M 250 290 L 268 290" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="270" y="250" width="210" height="80" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="375" y="274" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">下一位置 pos = 个数 + 1</text>
  <text x="375" y="294" text-anchor="middle" font-size="11" fill="#555">填到第 3 + 1 = 4 号位</text>
  <text x="375" y="314" text-anchor="middle" font-size="11" fill="#b85450">数字 k 需满足 k|pos 互相整除</text>
</svg>
