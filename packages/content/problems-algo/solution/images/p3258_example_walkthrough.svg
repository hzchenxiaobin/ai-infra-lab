<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 372"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="372" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：s = "10101"，k = 1</text>

  <!-- 表头 -->
  <rect x="30" y="44" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="70" y="44" width="52" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="122" y="44" width="150" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="272" y="44" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="318" y="44" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="364" y="44" width="72" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="436" y="44" width="54" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50" y="63" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">right</text>
  <text x="96" y="63" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">s[right]</text>
  <text x="197" y="63" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">收敛窗口</text>
  <text x="295" y="63" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">zeros</text>
  <text x="341" y="63" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">ones</text>
  <text x="400" y="63" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">新增 r−l+1</text>
  <text x="463" y="63" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">ans</text>

  <!-- 行 0 -->
  <rect x="30" y="80" width="40" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="70" y="80" width="52" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="122" y="80" width="150" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="272" y="80" width="46" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="318" y="80" width="46" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="364" y="80" width="72" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="436" y="80" width="54" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="50" y="100" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="96" y="100" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="197" y="100" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[0,0]「1」</text>
  <text x="295" y="100" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="341" y="100" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="400" y="100" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">+1</text>
  <text x="463" y="100" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>

  <!-- 行 1 -->
  <rect x="30" y="114" width="40" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="70" y="114" width="52" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="122" y="114" width="150" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="272" y="114" width="46" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="318" y="114" width="46" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="364" y="114" width="72" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="436" y="114" width="54" height="30" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="50" y="134" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="96" y="134" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="197" y="134" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">[0,1]「10」</text>
  <text x="295" y="134" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="341" y="134" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="400" y="134" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">+2</text>
  <text x="463" y="134" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>

  <!-- 行 2：只超一边仍好 -->
  <rect x="30" y="148" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="70" y="148" width="52" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="122" y="148" width="150" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="272" y="148" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="318" y="148" width="46" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="364" y="148" width="72" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="436" y="148" width="54" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="50" y="168" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">2</text>
  <text x="96" y="168" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">1</text>
  <text x="197" y="168" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">[0,2]「101」（只超一边）</text>
  <text x="295" y="168" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">1</text>
  <text x="341" y="168" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">2</text>
  <text x="400" y="168" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">+3</text>
  <text x="463" y="168" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">6</text>

  <!-- 行 3：收缩 -->
  <rect x="30" y="182" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="70" y="182" width="52" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="122" y="182" width="150" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="272" y="182" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="318" y="182" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="364" y="182" width="72" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="436" y="182" width="54" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="50" y="202" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">3</text>
  <text x="96" y="202" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">0</text>
  <text x="197" y="202" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">[0,3]坏 → [1,3]「010」</text>
  <text x="295" y="202" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">2</text>
  <text x="341" y="202" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">1</text>
  <text x="400" y="202" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">+3</text>
  <text x="463" y="202" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">9</text>

  <!-- 行 4：收缩 -->
  <rect x="30" y="216" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="70" y="216" width="52" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="122" y="216" width="150" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="272" y="216" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="318" y="216" width="46" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="364" y="216" width="72" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <rect x="436" y="216" width="54" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="50" y="236" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">4</text>
  <text x="96" y="236" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">1</text>
  <text x="197" y="236" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">[1,4]坏 → [2,4]「101」</text>
  <text x="295" y="236" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">1</text>
  <text x="341" y="236" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">2</text>
  <text x="400" y="236" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">+3</text>
  <text x="463" y="236" text-anchor="middle" font-size="10.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">12</text>

  <!-- 结果 -->
  <rect x="60" y="262" width="400" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="283" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ans = 12 ✓（1+2+3+3+3，按右端点逐段计数）</text>

  <!-- 验证 -->
  <rect x="40" y="306" width="440" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="324" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">验证：子串总数 5×6/2 = 15 个</text>
  <text x="260" y="340" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">− 坏子串 3 个（「1010」「0101」「10101」）= 12 ✓</text>
</svg>
