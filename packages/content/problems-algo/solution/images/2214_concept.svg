<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 370"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="370" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    贪心：护甲用在伤害最大的关卡
  </text>

  <!-- damage = [2, 7, 4, 3], armor = 4 -->
  <!-- Level 1: 2 -->
  <rect x="55" y="70" width="80" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="93" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">关卡 1</text>
  <text x="95" y="116" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">2</text>

  <!-- Level 2: 7 (MAX, highlight) -->
  <rect x="160" y="68" width="80" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="91" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">关卡 2 ★</text>
  <text x="200" y="116" text-anchor="middle" font-size="18" fill="#b85450" filter="url(#rough2)">7</text>

  <!-- Level 3: 4 -->
  <rect x="265" y="70" width="80" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="305" y="93" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">关卡 3</text>
  <text x="305" y="116" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">4</text>

  <!-- Level 4: 3 -->
  <rect x="370" y="70" width="80" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="93" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">关卡 4</text>
  <text x="410" y="116" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">3</text>

  <!-- max label pointing to level 2 -->
  <text x="200" y="58" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">最大伤害 mx=7</text>

  <!-- Armor shield -->
  <ellipse cx="200" cy="185" rx="46" ry="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="180" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">护甲</text>
  <text x="200" y="198" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">armor=4</text>

  <!-- Arrow from armor up to level 2 -->
  <path d="M200,153 L200,134" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Savings explanation box -->
  <rect x="60" y="245" width="440" height="105" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="270" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    节省 = min( mx, armor ) = min(7, 4) = 4
  </text>
  <text x="280" y="295" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    实际总伤害 = Σdamage − 节省 = 16 − 4 = 12
  </text>
  <text x="280" y="320" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">
    生命须恒 &gt; 0 ⟹ 最低生命值 = 总伤害 + 1
  </text>
  <text x="280" y="340" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">
    = 12 + 1 = 13
  </text>
</svg>
