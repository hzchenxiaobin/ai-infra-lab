<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">算法流程：逆序 Trie + 叶子求和</text>

  <!-- Step 1 -->
  <rect x="60" y="54" width="440" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <circle cx="92" cy="82" r="16" fill="#446688" filter="url(#rough2)"/>
  <text x="92" y="87" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">1</text>
  <text x="120" y="78" font-size="11.5" fill="#333" font-weight="bold">逆序插入：对每个 word，反转后逐字符插入 Trie</text>
  <text x="120" y="96" font-size="10.5" fill="#555">time→emit, me→em, bell→lleb；共享前缀共用路径</text>

  <path d="M 280 112 L 280 130" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="60" y="132" width="440" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <circle cx="92" cy="160" r="16" fill="#446688" filter="url(#rough2)"/>
  <text x="92" y="165" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">2</text>
  <text x="120" y="156" font-size="11.5" fill="#333" font-weight="bold">DFS 遍历 Trie，识别「叶子节点」（无子节点）</text>
  <text x="120" y="174" font-size="10.5" fill="#555">叶子 = 没有任何更长单词以其为前缀 = 该词未被覆盖</text>

  <path d="M 280 190 L 280 208" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="60" y="210" width="440" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <circle cx="92" cy="238" r="16" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="92" y="243" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">3</text>
  <text x="120" y="234" font-size="11.5" fill="#333" font-weight="bold">累加：每遇到叶子，ans += (depth + 1)</text>
  <text x="120" y="252" font-size="10.5" fill="#555">depth = 从 root 到该叶子的边数 = 原单词长度；+1 给分隔符 #</text>

  <path d="M 280 268 L 280 286" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision -->
  <path d="M 280 288 L 380 330 L 280 372 L 180 330 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="326" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">节点有子节点?</text>
  <text x="280" y="342" text-anchor="middle" font-size="10" fill="#555">递归每个 child</text>

  <!-- yes / no branches -->
  <path d="M 180 330 L 120 330" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="322" font-size="10" fill="#2e8b57" font-weight="bold">否→叶子</text>
  <rect x="40" y="316" width="78" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="79" y="336" text-anchor="middle" font-size="10.5" fill="#2e6e2e" font-weight="bold">ans += d+1</text>

  <path d="M 380 330 L 440 330" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="398" y="322" font-size="10" fill="#b85450" font-weight="bold">是→内部</text>
  <rect x="442" y="316" width="86" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="485" y="336" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">不计入,继续DFS</text>

  <!-- return -->
  <path d="M 280 372 L 280 396" stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="180" y="398" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="420" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 ans</text>
</svg>
