<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：arr = [1,2,3,4] → "23:41"</text>

  <!-- 输入 -->
  <text x="40" y="58" font-size="11.5" fill="#888">输入 arr =</text>
  <rect x="120" y="44" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="137" y="62" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <rect x="156" y="44" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="173" y="62" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <rect x="192" y="44" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="209" y="62" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
  <rect x="228" y="44" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="245" y="62" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">4</text>

  <!-- 表头 -->
  <rect x="40" y="90" width="500" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="90" y="108" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">排列 (a,b,c,d)</text>
  <text x="190" y="108" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">hh</text>
  <text x="250" y="108" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">mm</text>
  <text x="330" y="108" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">有效?</text>
  <text x="470" y="108" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">时间串</text>

  <!-- 行 1: 1,2,3,4 -->
  <rect x="40" y="120" width="500" height="24" fill="#ffffff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="90" y="136" text-anchor="middle" font-size="11" fill="#555">1, 2, 3, 4</text>
  <text x="190" y="136" text-anchor="middle" font-size="11" fill="#555">12</text>
  <text x="250" y="136" text-anchor="middle" font-size="11" fill="#555">34</text>
  <text x="330" y="136" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="470" y="136" text-anchor="middle" font-size="11" fill="#555">12:34</text>

  <!-- 行 2: 1,4,3,2 -->
  <rect x="40" y="144" width="500" height="24" fill="#f7f7f7" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="90" y="160" text-anchor="middle" font-size="11" fill="#555">1, 4, 3, 2</text>
  <text x="190" y="160" text-anchor="middle" font-size="11" fill="#555">14</text>
  <text x="250" y="160" text-anchor="middle" font-size="11" fill="#555">32</text>
  <text x="330" y="160" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="470" y="160" text-anchor="middle" font-size="11" fill="#555">14:32</text>

  <!-- 行 3: 2,3,4,1 -->
  <rect x="40" y="168" width="500" height="24" fill="#ffffff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="90" y="184" text-anchor="middle" font-size="11" fill="#555">2, 3, 4, 1</text>
  <text x="190" y="184" text-anchor="middle" font-size="11" fill="#555">23</text>
  <text x="250" y="184" text-anchor="middle" font-size="11" fill="#555">41</text>
  <text x="330" y="184" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="470" y="184" text-anchor="middle" font-size="11" fill="#555">23:41</text>

  <!-- 行 4: 2,4,1,3 无效 -->
  <rect x="40" y="192" width="500" height="24" fill="#f7f7f7" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="90" y="208" text-anchor="middle" font-size="11" fill="#555">2, 4, 1, 3</text>
  <text x="190" y="208" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">24</text>
  <text x="250" y="208" text-anchor="middle" font-size="11" fill="#555">13</text>
  <text x="330" y="208" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗ hh≥24</text>
  <text x="470" y="208" text-anchor="middle" font-size="11" fill="#aaa">—</text>

  <!-- 行 5: 3,1,4,2 无效 -->
  <rect x="40" y="216" width="500" height="24" fill="#ffffff" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="90" y="232" text-anchor="middle" font-size="11" fill="#555">3, 1, 4, 2</text>
  <text x="190" y="232" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">31</text>
  <text x="250" y="232" text-anchor="middle" font-size="11" fill="#555">42</text>
  <text x="330" y="232" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗ hh≥24</text>
  <text x="470" y="232" text-anchor="middle" font-size="11" fill="#aaa">—</text>

  <!-- 行 6: 4,3,2,1 无效 -->
  <rect x="40" y="240" width="500" height="24" fill="#f7f7f7" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="90" y="256" text-anchor="middle" font-size="11" fill="#555">4, 3, 2, 1</text>
  <text x="190" y="256" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">43</text>
  <text x="250" y="256" text-anchor="middle" font-size="11" fill="#555">21</text>
  <text x="330" y="256" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗ hh≥24</text>
  <text x="470" y="256" text-anchor="middle" font-size="11" fill="#aaa">—</text>

  <text x="290" y="284" text-anchor="middle" font-size="10.5" fill="#888">⋯ 共 4!=24 种排列，仅列出 6 行示意 ⋯</text>

  <!-- 结论框 -->
  <rect x="40" y="300" width="500" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="60" y="322" font-size="12" fill="#b85450" font-weight="bold">有效时间集合（按字符串升序）：</text>
  <text x="60" y="340" font-size="10.5" fill="#555">12:34 &lt; 12:43 &lt; 13:24 &lt; 13:42 &lt; 14:23 &lt; 14:32 &lt; 21:34 &lt; 21:43 &lt; 23:14 &lt; 23:41</text>

  <!-- 最终答案 -->
  <path d="M 290 350 L 290 372" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="150" y="378" width="280" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="400" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">字符串最大 = 时间最大</text>
  <text x="290" y="418" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">best = "23:41" ✅</text>
</svg>
