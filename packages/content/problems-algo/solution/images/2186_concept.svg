<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心：只能「追加」⇒ 每个频率差都要单独补一步</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">操作 = 给 s 或 t 追加任一字符（只增不减），不像 1347 替换能「一减一加」</text>

  <text x="40" y="72" font-size="12" fill="#666" font-weight="bold" filter="url(#rough2)">示例：s = "leetcode"  t = "coats"  —— 只列频率不一致的 5 个字符</text>

  <!-- Table header -->
  <g filter="url(#rough2)">
    <rect x="70" y="84" width="45" height="24" fill="#f0f0f0" stroke="#888" stroke-width="1.3" rx="4"/>
    <text x="92.5" y="101" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">字符</text>
    <rect x="115" y="84" width="55" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="142.5" y="101" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">cntS</text>
    <rect x="170" y="84" width="55" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4"/>
    <text x="197.5" y="101" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">cntT</text>
    <rect x="225" y="84" width="55" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="252.5" y="101" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">|差|</text>
    <rect x="280" y="84" width="210" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="385" y="101" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">追加操作（只能加，不能删）</text>
  </g>

  <!-- Row 1: a -->
  <g filter="url(#rough2)">
    <rect x="70" y="108" width="45" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="92.5" y="125" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
    <rect x="115" y="108" width="55" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="142.5" y="125" text-anchor="middle" font-size="12" fill="#888">0</text>
    <rect x="170" y="108" width="55" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="197.5" y="125" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
    <rect x="225" y="108" width="55" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="252.5" y="125" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
    <rect x="280" y="108" width="210" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="385" y="125" text-anchor="middle" font-size="11" fill="#d6a040">追加 a → s</text>
  </g>

  <!-- Row 2: d -->
  <g filter="url(#rough2)">
    <rect x="70" y="132" width="45" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="92.5" y="149" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">d</text>
    <rect x="115" y="132" width="55" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="142.5" y="149" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
    <rect x="170" y="132" width="55" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="197.5" y="149" text-anchor="middle" font-size="12" fill="#888">0</text>
    <rect x="225" y="132" width="55" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="252.5" y="149" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
    <rect x="280" y="132" width="210" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="385" y="149" text-anchor="middle" font-size="11" fill="#d6a040">追加 d → t</text>
  </g>

  <!-- Row 3: e (highlighted, |diff|=3) -->
  <g filter="url(#rough2)">
    <rect x="70" y="156" width="45" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="92.5" y="173" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">e</text>
    <rect x="115" y="156" width="55" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="142.5" y="173" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
    <rect x="170" y="156" width="55" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="197.5" y="173" text-anchor="middle" font-size="12" fill="#888">0</text>
    <rect x="225" y="156" width="55" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <text x="252.5" y="173" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
    <rect x="280" y="156" width="210" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="385" y="173" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">追加 e, e, e → t（3 步）</text>
  </g>

  <!-- Row 4: l -->
  <g filter="url(#rough2)">
    <rect x="70" y="180" width="45" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="92.5" y="197" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">l</text>
    <rect x="115" y="180" width="55" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="142.5" y="197" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
    <rect x="170" y="180" width="55" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="197.5" y="197" text-anchor="middle" font-size="12" fill="#888">0</text>
    <rect x="225" y="180" width="55" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="252.5" y="197" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
    <rect x="280" y="180" width="210" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="385" y="197" text-anchor="middle" font-size="11" fill="#d6a040">追加 l → t</text>
  </g>

  <!-- Row 5: s -->
  <g filter="url(#rough2)">
    <rect x="70" y="204" width="45" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="92.5" y="221" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">s</text>
    <rect x="115" y="204" width="55" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4"/>
    <text x="142.5" y="221" text-anchor="middle" font-size="12" fill="#888">0</text>
    <rect x="170" y="204" width="55" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="197.5" y="221" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
    <rect x="225" y="204" width="55" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="252.5" y="221" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
    <rect x="280" y="204" width="210" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4"/>
    <text x="385" y="221" text-anchor="middle" font-size="11" fill="#d6a040">追加 s → s</text>
  </g>

  <!-- Formula box -->
  <g filter="url(#rough2)">
    <rect x="60" y="246" width="440" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="280" y="266" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">ans = Σ |cntS[c] − cntT[c]| = 1+1+3+1+1 = 7</text>
    <text x="280" y="282" text-anchor="middle" font-size="10.5" fill="#666">对每个字符取两串频率之差的绝对值，全部求和</text>
  </g>

  <!-- Insight box -->
  <g filter="url(#rough2)">
    <rect x="60" y="302" width="440" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="280" y="322" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">追加 = 只增不减 → 每个缺口单独补一步</text>
    <text x="280" y="340" text-anchor="middle" font-size="10.5" fill="#888">对比 1347：替换 = 一减一加 → 一步消两个差（正差 + 负差）</text>
    <text x="280" y="356" text-anchor="middle" font-size="10.5" fill="#888">故 2186 取 Σ|diff|，1347 只取 ½Σ|diff|</text>
  </g>
</svg>
