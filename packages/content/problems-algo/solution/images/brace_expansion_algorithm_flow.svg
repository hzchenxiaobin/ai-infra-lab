<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">花括号展开：算法流程</text>

  <!-- Start -->
  <rect x="210" y="44" width="140" height="34" rx="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#333">输入 s</text>

  <line x1="280" y1="78" x2="280" y2="96" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- parse loop header -->
  <rect x="170" y="96" width="220" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="118" text-anchor="middle" font-size="12" fill="#333">i = 0 .. n-1 扫描 s</text>

  <line x1="280" y1="130" x2="280" y2="146" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond: s[i] == '{' ? -->
  <polygon points="280,146 372,182 280,218 188,182" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="178" text-anchor="middle" font-size="11" fill="#444">s[i]</text>
  <text x="280" y="194" text-anchor="middle" font-size="11" fill="#444">== '{' ?</text>

  <!-- Yes branch (left): brace group -->
  <line x1="188" y1="182" x2="150" y2="182" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="156" y="176" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="40" y="164" width="110" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="95" y="180" text-anchor="middle" font-size="10" fill="#333">收集括号内字母</text>
  <text x="95" y="194" text-anchor="middle" font-size="10" fill="#333">跳过逗号与 '}'</text>

  <!-- sort box under brace path -->
  <line x1="95" y1="202" x2="95" y2="218" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="50" y="218" width="90" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="95" y="236" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">sort(g)</text>

  <!-- No branch (right): single letter -->
  <line x1="372" y1="182" x2="410" y2="182" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="176" font-size="11" fill="#446688" font-weight="bold">否</text>

  <rect x="410" y="164" width="110" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="465" y="180" text-anchor="middle" font-size="10" fill="#333">单字母归一化</text>
  <text x="465" y="194" text-anchor="middle" font-size="10" fill="#333">groups.append([ch])</text>

  <line x1="465" y1="202" x2="465" y2="218" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="410" y="218" width="110" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="465" y="236" text-anchor="middle" font-size="10" fill="#888">（单元素天然有序）</text>

  <!-- merge to groups list -->
  <line x1="95" y1="246" x2="95" y2="262" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="465" y1="246" x2="465" y2="262" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="95" y1="262" x2="465" y2="262" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="280" y1="262" x2="280" y2="278" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="190" y="278" width="180" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="298" text-anchor="middle" font-size="12" fill="#333">groups = [[a,b], [c], [d,e]]</text>

  <line x1="280" y1="308" x2="280" y2="324" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- DFS box -->
  <rect x="150" y="324" width="260" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="344" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">有序 DFS(idx, path)</text>
  <text x="280" y="360" text-anchor="middle" font-size="10" fill="#555">组内按序选 → path+c → 递归 → 回溯</text>

  <line x1="280" y1="368" x2="280" y2="384" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- collect -->
  <rect x="190" y="384" width="180" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="404" text-anchor="middle" font-size="11" fill="#333">idx == m → 收集 path</text>

  <line x1="280" y1="414" x2="280" y2="430" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- End -->
  <rect x="200" y="430" width="160" height="24" rx="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="446" text-anchor="middle" font-size="11" fill="#333">返回 res（天然字典序）</text>
</svg>
