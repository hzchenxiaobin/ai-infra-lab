<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：matrix 3×4, target = 3</text>

  <!-- flattened array header -->
  <text x="40" y="56" font-size="12" fill="#888" font-weight="bold">一维展开（k = 0..11）</text>

  <!-- 12 cells width 38, x start 40 -->
  <g font-size="12" fill="#333">
    <rect x="40" y="64" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="59" y="83" text-anchor="middle">1</text>
    <rect x="78" y="64" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="97" y="83" text-anchor="middle">3</text>
    <rect x="116" y="64" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="135" y="83" text-anchor="middle">5</text>
    <rect x="154" y="64" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="173" y="83" text-anchor="middle">7</text>
    <rect x="192" y="64" width="38" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="211" y="83" text-anchor="middle">10</text>
    <rect x="230" y="64" width="38" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="249" y="83" text-anchor="middle">11</text>
    <rect x="268" y="64" width="38" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="287" y="83" text-anchor="middle">16</text>
    <rect x="306" y="64" width="38" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="325" y="83" text-anchor="middle">20</text>
    <rect x="344" y="64" width="38" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="363" y="83" text-anchor="middle">23</text>
    <rect x="382" y="64" width="38" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="401" y="83" text-anchor="middle">30</text>
    <rect x="420" y="64" width="38" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="439" y="83" text-anchor="middle">34</text>
    <rect x="458" y="64" width="38" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="477" y="83" text-anchor="middle">60</text>
  </g>
  <!-- k labels -->
  <g font-size="9" fill="#999">
    <text x="59" y="106" text-anchor="middle">0</text>
    <text x="97" y="106" text-anchor="middle">1</text>
    <text x="135" y="106" text-anchor="middle">2</text>
    <text x="173" y="106" text-anchor="middle">3</text>
    <text x="211" y="106" text-anchor="middle">4</text>
    <text x="249" y="106" text-anchor="middle">5</text>
    <text x="287" y="106" text-anchor="middle">6</text>
    <text x="325" y="106" text-anchor="middle">7</text>
    <text x="363" y="106" text-anchor="middle">8</text>
    <text x="401" y="106" text-anchor="middle">9</text>
    <text x="439" y="106" text-anchor="middle">10</text>
    <text x="477" y="106" text-anchor="middle">11</text>
  </g>

  <!-- ===== Step rows ===== -->
  <text x="40" y="134" font-size="12" fill="#888" font-weight="bold">逐步二分（target = 3）</text>

  <!-- helper: each step occupies y from 146, height ~56 -->

  <!-- Step 1: lo=0 hi=11 mid=5 val=11 -->
  <text x="40" y="166" font-size="11" fill="#333" font-weight="bold">①</text>
  <text x="60" y="166" font-size="11" fill="#444">[0, 11] mid=5 → matrix[1][1]=11</text>
  <text x="60" y="182" font-size="11" fill="#b85450" font-weight="bold">11 &gt; 3 ⇒ hi = 4</text>
  <!-- bracket [0,11] -->
  <path d="M 44 198 L 44 204 L 478 204 L 478 198" stroke="#888" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="259" y="216" text-anchor="middle" font-size="9" fill="#999">lo=0</text>
  <text x="478" y="216" text-anchor="middle" font-size="9" fill="#999">hi=11</text>
  <!-- mid marker on k=5 -->
  <path d="M 249 196 L 249 188" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="249" y="184" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">mid</text>

  <!-- Step 2: lo=0 hi=4 mid=2 val=5 -->
  <text x="40" y="244" font-size="11" fill="#333" font-weight="bold">②</text>
  <text x="60" y="244" font-size="11" fill="#444">[0, 4] mid=2 → matrix[0][2]=5</text>
  <text x="60" y="260" font-size="11" fill="#b85450" font-weight="bold">5 &gt; 3 ⇒ hi = 1</text>
  <path d="M 44 276 L 44 282 L 192 282 L 192 276" stroke="#888" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="59" y="294" text-anchor="middle" font-size="9" fill="#999">lo=0</text>
  <text x="192" y="294" text-anchor="middle" font-size="9" fill="#999">hi=4</text>
  <path d="M 135 274 L 135 266" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="135" y="262" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">mid</text>

  <!-- Step 3: lo=0 hi=1 mid=0 val=1 -->
  <text x="40" y="322" font-size="11" fill="#333" font-weight="bold">③</text>
  <text x="60" y="322" font-size="11" fill="#444">[0, 1] mid=0 → matrix[0][0]=1</text>
  <text x="60" y="338" font-size="11" fill="#446688" font-weight="bold">1 &lt; 3 ⇒ lo = 1</text>
  <path d="M 44 354 L 44 360 L 78 360 L 78 354" stroke="#888" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="59" y="372" text-anchor="middle" font-size="9" fill="#999">lo=0</text>
  <text x="78" y="372" text-anchor="middle" font-size="9" fill="#999">hi=1</text>
  <path d="M 59 352 L 59 344" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="59" y="340" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">mid</text>

  <!-- Step 4: lo=1 hi=1 mid=1 val=3 hit -->
  <text x="40" y="398" font-size="11" fill="#333" font-weight="bold">④</text>
  <text x="60" y="398" font-size="11" fill="#444">[1, 1] mid=1 → matrix[0][1]=3</text>
  <text x="280" y="398" font-size="11.5" fill="#82b366" font-weight="bold">3 == 3 ⇒ 命中，return true ✓</text>
  <!-- highlight cell k=1 -->
  <rect x="78" y="64" width="38" height="28" fill="none" stroke="#82b366" stroke-width="2.6" rx="3" filter="url(#rough2)"/>

  <!-- footer note -->
  <text x="280" y="416" text-anchor="middle" font-size="10.5" fill="#888">4 次比较命中，复杂度 O(log(m·n)) ≈ log₂12 ≈ 3.6</text>
</svg>
