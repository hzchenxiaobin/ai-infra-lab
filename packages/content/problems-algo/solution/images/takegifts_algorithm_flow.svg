<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="500" height="470" fill="#fafafa"/>

  <text x="250" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：建大顶堆 → 循环 k 次（pop max + v←⌊√v⌋ + push 回堆）→ 返回 sum</text>

  <!-- 开始 -->
  <rect x="95" y="38" width="90" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="15" filter="url(#rough2)"/>
  <text x="140" y="58" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">开始</text>

  <path d="M 140 68 L 140 88" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 建堆 -->
  <rect x="30" y="88" width="220" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="140" y="107" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">建大顶堆 + 初始 sum</text>
  <text x="140" y="123" text-anchor="middle" font-size="10.5" fill="#333">gifts 全部入堆 O(n)；sum = Σ gifts[i]</text>

  <path d="M 140 130 L 140 150" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond center (140,200) -->
  <polygon points="140,150 225,200 140,250 55,200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="196" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">还剩 k &gt; 0 步?</text>
  <text x="140" y="212" text-anchor="middle" font-size="10" fill="#666">（已操作 &lt; k 次）</text>

  <!-- Yes: right to loop body -->
  <path d="M 225 200 L 293 200" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="259" y="194" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">是·继续</text>

  <!-- pop (right column) -->
  <rect x="293" y="180" width="180" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="383" y="198" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">pop 堆顶 v（当前最大）</text>
  <text x="383" y="214" text-anchor="middle" font-size="10" fill="#666">并列最大任选其一</text>

  <path d="M 383 220 L 383 240" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- sqrt -->
  <rect x="293" y="240" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="383" y="258" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">s = ⌊√v⌋；sum −= v − s</text>
  <text x="383" y="274" text-anchor="middle" font-size="10" fill="#666">向下取整；v=1 时 s=1、移走 0</text>

  <path d="M 383 280 L 383 300" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- push -->
  <rect x="293" y="300" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="383" y="318" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">push s 回堆；k−−</text>
  <text x="383" y="334" text-anchor="middle" font-size="10" fill="#666">弹一压一，堆大小恒为 n</text>

  <!-- loop back to diamond right vertex -->
  <path d="M 473 320 C 500 320 500 200 225 200" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4,3"/>

  <!-- No: down to sum -->
  <path d="M 140 250 L 140 282" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="152" y="272" font-size="10.5" fill="#4a7a3a" font-weight="bold">否·结束</text>

  <!-- return (no separate sum box: sum already maintained) -->
  <rect x="70" y="282" width="140" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="140" y="300" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">sum 已是剩余总量</text>
  <text x="140" y="316" text-anchor="middle" font-size="10" fill="#666">无需遍历堆求和</text>

  <path d="M 140 322 L 140 348" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return oval -->
  <rect x="85" y="348" width="110" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="15" filter="url(#rough2)"/>
  <text x="140" y="370" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">返回 sum</text>

  <text x="250" y="432" text-anchor="middle" font-size="11" fill="#666">复杂度：O(n) 建堆 + O(k log n) 模拟；空间 O(n)</text>
</svg>
