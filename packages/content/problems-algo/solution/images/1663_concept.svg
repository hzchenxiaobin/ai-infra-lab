<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">核心：贪心逐位填最小可行字符，保证后缀能凑出剩余和</text>

  <!-- ===== Top: the string slots ===== -->
  <text x="40" y="64" font-size="11" fill="#666">位置 i 的串：</text>

  <!-- filled prefix slots (green) -->
  <rect x="120" y="48" width="34" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="137" y="69" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">?</text>
  <rect x="154" y="48" width="34" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="171" y="69" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">?</text>

  <!-- current slot (red highlight) -->
  <rect x="188" y="44" width="42" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="209" y="70" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">v?</text>
  <text x="209" y="36" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">当前位 i</text>

  <!-- remaining suffix slots (blue, hollow) -->
  <rect x="234" y="48" width="30" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="264" y="48" width="30" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="294" y="48" width="30" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="279" y="98" text-anchor="middle" font-size="10" fill="#446688">后缀（剩 rest-1 位）</text>

  <!-- arrow down from current slot to feasibility bar -->
  <path d="M 209 92 L 209 116" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Middle: feasibility window ===== -->
  <text x="40" y="138" font-size="11" fill="#666">v 的取值窗口：</text>

  <!-- number line -->
  <line x1="60" y1="160" x2="420" y2="160" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- tick marks 1 and 26 -->
  <line x1="80" y1="154" x2="80" y2="166" stroke="#888" stroke-width="1.5"/>
  <text x="80" y="180" text-anchor="middle" font-size="11" fill="#555">1</text>
  <line x1="400" y1="154" x2="400" y2="166" stroke="#888" stroke-width="1.5"/>
  <text x="400" y="180" text-anchor="middle" font-size="11" fill="#555">26</text>
  <!-- labels -->
  <text x="50" y="164" font-size="10" fill="#888">a</text>
  <text x="412" y="164" font-size="10" fill="#888">z</text>

  <!-- feasibility range shading -->
  <rect x="80" y="152" width="320" height="16" fill="#e6f4ea" opacity="0.55" filter="url(#rough2)"/>
  <!-- the chosen v marker -->
  <line x1="140" y1="146" x2="140" y2="174" stroke="#b85450" stroke-width="2.5"/>
  <circle cx="140" cy="160" r="5" fill="#b85450" filter="url(#rough2)"/>
  <text x="140" y="142" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">v = max(1, k-26·(rest-1))</text>

  <!-- ===== Bottom: two constraints ===== -->
  <rect x="40" y="206" width="240" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="228" font-size="12" fill="#446688" font-weight="bold">下界：v ≥ 1</text>
  <text x="56" y="248" font-size="11" fill="#555">后缀每位至少 1，故 v 最多用</text>
  <text x="56" y="266" font-size="11" fill="#555">k - (rest-1)·1 = k - rest + 1</text>
  <text x="56" y="282" font-size="10" fill="#888">→ 但下限就是 1，不主动放大</text>

  <rect x="300" y="206" width="240" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="316" y="228" font-size="12" fill="#d6a040" font-weight="bold">上界：后缀能扛住</text>
  <text x="316" y="248" font-size="11" fill="#555">后缀每位最多 26，故留给后缀</text>
  <text x="316" y="266" font-size="11" fill="#555">的剩余 k-v ≤ 26·(rest-1)</text>
  <text x="316" y="282" font-size="10" fill="#b85450" font-weight="bold">→ v ≥ k - 26·(rest-1)（关键！）</text>

  <!-- summary arrow / formula -->
  <path d="M 160 300 L 160 318" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="50" y="322" width="460" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="68" y="346" font-size="12.5" fill="#b85450" font-weight="bold">贪心选择：取可行区间的最小端</text>
  <text x="68" y="368" font-size="12" fill="#555">v = max(1, k - 26·(rest-1))，即「留足后缀上限后能取的最小字符」</text>

</svg>
