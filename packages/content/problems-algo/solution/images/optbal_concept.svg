<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#666" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：净额归零分组，k 人一组只需 k−1 笔结算</text>

  <!-- Step 1: Transactions -->
  <rect x="20" y="50" width="130" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="85" y="72" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">① 原始交易列表</text>
  <rect x="20" y="90" width="130" height="76" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="34" y="110" font-size="10.5" fill="#333">[0,1,10]</text>
  <text x="34" y="128" font-size="10.5" fill="#333">[2,0,5]</text>
  <text x="34" y="146" font-size="10.5" fill="#888">[from,to,$]</text>
  <text x="34" y="162" font-size="10.5" fill="#888">每人净额求和</text>

  <!-- arrow 1->2 -->
  <path d="M 150 120 L 178 120" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: Net Balance -->
  <rect x="180" y="50" width="150" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="255" y="72" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">② 每人净额</text>
  <rect x="180" y="90" width="150" height="76" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="196" y="110" font-size="10.5" fill="#333">P0: −10+5 = −5</text>
  <text x="196" y="128" font-size="10.5" fill="#333">P1: +10</text>
  <text x="196" y="146" font-size="10.5" fill="#333">P2: −5</text>
  <text x="196" y="162" font-size="10.5" fill="#888">Σ = 0（恒成立）</text>

  <!-- arrow 2->3 -->
  <path d="M 330 120 L 358 120" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: Non-zero debts -->
  <rect x="360" y="50" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="420" y="72" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">③ 去零留非零</text>
  <rect x="360" y="90" width="120" height="76" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="380" y="112" font-size="11" fill="#b85450" font-weight="bold">debts =</text>
  <text x="380" y="132" font-size="11" fill="#333">[−5, +10, −5]</text>
  <text x="380" y="150" font-size="10" fill="#888">n = 3</text>
  <text x="380" y="164" font-size="10" fill="#888">(零额已剔除)</text>

  <!-- arrow 3->4 -->
  <path d="M 480 120 L 508 120" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: Zero-sum groups -->
  <rect x="510" y="50" width="110" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="565" y="72" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">④ 归零分组</text>
  <rect x="510" y="90" width="110" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="565" y="112" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">一组 {0,1,2}</text>
  <text x="565" y="130" text-anchor="middle" font-size="10.5" fill="#333">和 = 0, k = 3</text>
  <text x="565" y="150" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">→ 2 笔</text>

  <!-- Key formula -->
  <rect x="40" y="185" width="560" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.7" rx="8" filter="url(#rough2)"/>
  <text x="320" y="207" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">最少笔数 = n − (最大归零组数) = Σ(group_size − 1)</text>
  <text x="320" y="224" text-anchor="middle" font-size="10.8" fill="#666">k 人零和组 → 链式 k−1 笔结清；组越多越省</text>

  <!-- Splitting illustration title -->
  <text x="320" y="256" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">分组越细越省：4 人可拆 2 组则 4−2=2 笔，不拆则 4−1=3 笔</text>

  <!-- left: no split -->
  <rect x="40" y="270" width="270" height="86" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="175" y="292" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">不拆：1 组 {−5,+5,−3,+3}</text>
  <text x="175" y="312" text-anchor="middle" font-size="10.8" fill="#555">和 = 0, k = 4 → 3 笔</text>
  <text x="175" y="332" text-anchor="middle" font-size="10.5" fill="#888">链式：A→B→C→D 中转多</text>
  <text x="175" y="350" text-anchor="middle" font-size="10.5" fill="#b85450">dp[1111] = 4 − 1 = 3</text>

  <!-- right: split -->
  <rect x="330" y="270" width="270" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="465" y="292" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">拆 2 组：{−5,+5} + {−3,+3}</text>
  <text x="465" y="312" text-anchor="middle" font-size="10.8" fill="#555">各组 k = 2 → 各 1 笔，共 2 笔</text>
  <text x="465" y="332" text-anchor="middle" font-size="10.5" fill="#888">dp[sub] + dp[rest] = 1 + 1</text>
  <text x="465" y="350" text-anchor="middle" font-size="10.5" fill="#4a7a3a">dp[1111] = 2 ✓</text>

  <!-- DP transition -->
  <rect x="40" y="370" width="560" height="78" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="392" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">DP 转移：dp[mask] = min(dp[sub] + dp[mask∖sub])</text>
  <text x="320" y="411" text-anchor="middle" font-size="10.8" fill="#555">初始 dp[mask] = popcount(mask) − 1（当 sum[mask] = 0）</text>
  <text x="320" y="428" text-anchor="middle" font-size="10.8" fill="#555">枚举 mask 的归零真子集 sub，拆成两组更优则更新</text>
  <text x="320" y="445" text-anchor="middle" font-size="10.5" fill="#888">bitmask 状压，n ≤ ~12，O(3ⁿ) 子集枚举</text>
</svg>
