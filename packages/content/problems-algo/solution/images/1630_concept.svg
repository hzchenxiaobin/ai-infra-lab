<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="600" height="410" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：每个查询独立 = 截取子数组 → 排序 → 逐对验证（复用 1502）</text>

  <!-- ====== Left block: Query 0 (true) ====== -->
  <rect x="30" y="50" width="270" height="180" fill="none" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="4 3" rx="8" filter="url(#rough2)"/>
  <text x="165" y="68" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">查询 0：l=0, r=2</text>

  <!-- subarray label -->
  <text x="48" y="88" font-size="10" fill="#888">子数组（截取）</text>
  <!-- subarray cells [4,6,5] -->
  <g filter="url(#rough2)">
    <rect x="60" y="94" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="104" y="94" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="148" y="94" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="15" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="81" y="115">4</text>
    <text x="125" y="115">6</text>
    <text x="169" y="115">5</text>
  </g>

  <!-- sort arrow down -->
  <path d="M 125 130 L 125 150" stroke="#d6a040" stroke-width="2" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="140" y="144" font-size="10" fill="#d6a040" font-weight="bold">排序</text>

  <!-- sorted label -->
  <text x="48" y="166" font-size="10" fill="#888">排序后</text>
  <!-- sorted cells [4,5,6] green -->
  <g filter="url(#rough2)">
    <rect x="60" y="172" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="104" y="172" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="148" y="172" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="15" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="81" y="193">4</text>
    <text x="125" y="193">5</text>
    <text x="169" y="193">6</text>
  </g>

  <!-- diff brackets -->
  <path d="M 81 208 L 81 214 L 125 214 L 125 208" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="103" y="226" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">d=1</text>
  <path d="M 125 208 L 125 214 L 169 214 L 169 208" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="147" y="226" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">d=1</text>

  <!-- result -->
  <rect x="50" y="234" width="230" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="165" y="254" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">相邻差恒为 1 → true ✓</text>

  <!-- ====== Right block: Query 1 (false) ====== -->
  <rect x="320" y="50" width="260" height="180" fill="none" stroke="#b85450" stroke-width="1" stroke-dasharray="4 3" rx="8" filter="url(#rough2)"/>
  <text x="450" y="68" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">查询 1：l=0, r=3</text>

  <!-- subarray label -->
  <text x="338" y="88" font-size="10" fill="#888">子数组（截取）</text>
  <!-- subarray cells [4,6,5,9] -->
  <g filter="url(#rough2)">
    <rect x="348" y="94" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="392" y="94" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="436" y="94" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="480" y="94" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <g font-size="15" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="369" y="115">4</text>
    <text x="413" y="115">6</text>
    <text x="457" y="115">5</text>
    <text x="501" y="115">9</text>
  </g>

  <!-- sort arrow down -->
  <path d="M 435 130 L 435 150" stroke="#d6a040" stroke-width="2" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="450" y="144" font-size="10" fill="#d6a040" font-weight="bold">排序</text>

  <!-- sorted label -->
  <text x="338" y="166" font-size="10" fill="#888">排序后</text>
  <!-- sorted cells [4,5,6,9] -->
  <g filter="url(#rough2)">
    <rect x="348" y="172" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="392" y="172" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="436" y="172" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <rect x="480" y="172" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
  </g>
  <g font-size="15" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="369" y="193">4</text>
    <text x="413" y="193">5</text>
    <text x="457" y="193">6</text>
    <text x="501" y="193" fill="#b85450">9</text>
  </g>

  <!-- diff brackets -->
  <path d="M 369 208 L 369 214 L 413 214 L 413 208" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="391" y="226" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">d=1</text>
  <path d="M 413 208 L 413 214 L 457 214 L 457 208" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="435" y="226" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">d=1</text>
  <path d="M 457 208 L 457 214 L 501 214 L 501 208" stroke="#b85450" stroke-width="2.5" fill="none" filter="url(#rough2)"/>
  <text x="479" y="226" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">d=3 ✗</text>

  <!-- result -->
  <rect x="340" y="234" width="220" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="450" y="254" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">9−6=3 ≠ 1 → false ✗</text>

  <!-- ====== Insight box ====== -->
  <rect x="40" y="284" width="520" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="58" y="306" font-size="12" fill="#d6a040" font-weight="bold">关键洞察</text>
  <text x="58" y="326" font-size="11" fill="#555">• 每个查询 [l, r] 独立处理：截取 nums[l..r] → 排序 → 检查相邻差是否恒定</text>
  <text x="58" y="344" font-size="11" fill="#555">• 本质是 1502「判断能否形成等差数列」套用到每个子数组上（批量版）</text>
  <text x="58" y="362" font-size="11" fill="#555">• 排序消除了「可重排」的自由度：等差数列排序后必然均匀分布，把排列问题转为验证问题</text>
  <text x="58" y="380" font-size="11" fill="#b85450" font-weight="bold">• m 个查询互不影响，无需预处理，逐个判定即可</text>
</svg>
