<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：圆形赛道上只有起点和终点决定最多访问扇区</text>

  <!-- Circular track: center (170, 200), outer r=110, inner r=70 -->
  <!-- 4 sectors for n=4, each sector spans 90 degrees -->
  <!-- Sector 1: top-right (0°-90°), Sector 2: bottom-right (90°-180°) -->
  <!-- Sector 3: bottom-left (180°-270°), Sector 4: top-left (270°-360°) -->

  <!-- Track outer circle -->
  <circle cx="170" cy="200" r="110" fill="none" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <!-- Track inner circle -->
  <circle cx="170" cy="200" r="70" fill="none" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Sector dividers (4 lines from center) -->
  <line x1="170" y1="90" x2="170" y2="130" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="280" y1="200" x2="240" y2="200" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="170" y1="310" x2="170" y2="270" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="60" y1="200" x2="100" y2="200" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- Sector fills (using arcs) -->
  <!-- Sector 1: top-right quadrant (highlighted - most visited) -->
  <path d="M 170 90 A 110 110 0 0 1 280 200 L 240 200 A 70 70 0 0 0 170 130 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- Sector 2: bottom-right quadrant (highlighted - most visited) -->
  <path d="M 280 200 A 110 110 0 0 1 170 310 L 170 270 A 70 70 0 0 0 240 200 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- Sector 3: bottom-left quadrant -->
  <path d="M 170 310 A 110 110 0 0 1 60 200 L 100 200 A 70 70 0 0 0 170 270 Z" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <!-- Sector 4: top-left quadrant -->
  <path d="M 60 200 A 110 110 0 0 1 170 90 L 170 130 A 70 70 0 0 0 100 200 Z" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- Sector labels -->
  <text x="225" y="150" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">1</text>
  <text x="225" y="260" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">2</text>
  <text x="115" y="260" text-anchor="middle" font-size="14" fill="#446688">3</text>
  <text x="115" y="150" text-anchor="middle" font-size="14" fill="#446688">4</text>

  <!-- Start/End markers -->
  <!-- Start: sector 1 -->
  <circle cx="245" cy="115" r="6" fill="#b85450" filter="url(#rough2)"/>
  <text x="258" y="112" font-size="9" fill="#b85450" font-weight="bold">起点</text>
  <!-- End: sector 2 -->
  <circle cx="245" cy="290" r="6" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="258" y="295" font-size="9" fill="#4a7a3a" font-weight="bold">终点</text>

  <!-- Path arrows along the track (curved arrows) -->
  <!-- 1→2→3 (stage 1) -->
  <path d="M 255 130 A 85 85 0 0 1 255 270" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrRed)" stroke-dasharray="4,2" filter="url(#rough2)"/>
  <!-- 3→4→1 (stage 2) -->
  <path d="M 155 285 A 85 85 0 0 1 155 115" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" stroke-dasharray="4,2" filter="url(#rough2)"/>
  <!-- 1→2 (stage 3) -->
  <path d="M 260 140 A 80 80 0 0 1 260 260" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Visit count table on the right -->
  <text x="370" y="70" font-size="12" fill="#555" font-weight="bold">访问次数统计</text>

  <!-- Table header -->
  <rect x="360" y="80" width="180" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="385" y="97" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">扇区</text>
  <text x="445" y="97" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">次数</text>
  <text x="510" y="97" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">最多?</text>

  <!-- Row: sector 1 -->
  <rect x="360" y="104" width="180" height="24" fill="#fce4ec" stroke="#e0c0c0" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="385" y="121" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="445" y="121" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="510" y="121" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✓</text>

  <!-- Row: sector 2 -->
  <rect x="360" y="128" width="180" height="24" fill="#fce4ec" stroke="#e0c0c0" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="385" y="145" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="445" y="145" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="510" y="145" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✓</text>

  <!-- Row: sector 3 -->
  <rect x="360" y="152" width="180" height="24" fill="#e8f0fe" stroke="#c0d0e0" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="385" y="169" text-anchor="middle" font-size="11" fill="#446688">3</text>
  <text x="445" y="169" text-anchor="middle" font-size="11" fill="#446688">1</text>
  <text x="510" y="169" text-anchor="middle" font-size="11" fill="#aaa">—</text>

  <!-- Row: sector 4 -->
  <rect x="360" y="176" width="180" height="24" fill="#e8f0fe" stroke="#c0d0e0" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="385" y="193" text-anchor="middle" font-size="11" fill="#446688">4</text>
  <text x="445" y="193" text-anchor="middle" font-size="11" fill="#446688">1</text>
  <text x="510" y="193" text-anchor="middle" font-size="11" fill="#aaa">—</text>

  <!-- Path sequence -->
  <rect x="340" y="218" width="200" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="360" y="238" font-size="10" fill="#666" font-weight="bold">路径序列：</text>
  <text x="360" y="256" font-size="11" fill="#b85450" font-weight="bold">1→2→3→4→1→2</text>
  <text x="360" y="270" font-size="9" fill="#888">起点=1, 终点=2</text>

  <!-- Legend -->
  <rect x="340" y="286" width="10" height="10" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="1" filter="url(#rough2)"/>
  <text x="356" y="295" font-size="9" fill="#666">最多访问</text>
  <rect x="410" y="286" width="10" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="1" filter="url(#rough2)"/>
  <text x="426" y="295" font-size="9" fill="#666">普通访问</text>

  <!-- Key insight box -->
  <rect x="30" y="330" width="500" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="50" y="352" font-size="12" fill="#444" font-weight="bold">关键直觉：中间途径点不影响结果——它们只增加完整圈数</text>
  <text x="50" y="372" font-size="11" fill="#666">→ 完整圈每个扇区各访问一次；多出的「半圈」从起点到终点才是关键</text>
</svg>
