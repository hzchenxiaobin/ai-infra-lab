<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 5, bad = 4</text>

  <!-- ===== Part A: 版本好坏序列 ===== -->
  <text x="280" y="54" text-anchor="middle" font-size="11.5" fill="#888">① 版本好坏序列（单调切换：好→好→好→坏→坏）</text>

  <!-- 5 version cells, width 70, gap 12, x=90 -->
  <!-- v1 good -->
  <rect x="90" y="68" width="70" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="125" y="86" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">v1</text>
  <text x="125" y="102" text-anchor="middle" font-size="10" fill="#4a7a3a">good</text>

  <!-- v2 good -->
  <rect x="172" y="68" width="70" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="207" y="86" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">v2</text>
  <text x="207" y="102" text-anchor="middle" font-size="10" fill="#4a7a3a">good</text>

  <!-- v3 good -->
  <rect x="254" y="68" width="70" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="289" y="86" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">v3</text>
  <text x="289" y="102" text-anchor="middle" font-size="10" fill="#4a7a3a">good</text>

  <!-- v4 bad (ANSWER) -->
  <rect x="336" y="68" width="70" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="6" filter="url(#rough2)"/>
  <text x="371" y="86" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">v4</text>
  <text x="371" y="102" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">bad ←</text>

  <!-- v5 bad -->
  <rect x="418" y="68" width="70" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="453" y="86" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">v5</text>
  <text x="453" y="102" text-anchor="middle" font-size="10" fill="#b85450">bad</text>

  <!-- ===== Part B: 二分过程 ===== -->
  <text x="280" y="138" text-anchor="middle" font-size="11.5" fill="#888">② 二分查找过程（2 轮即锁定，仅 2 次 API 调用）</text>

  <!-- table header: 轮次 | left | right | mid | isBadVersion(mid) | 动作 -->
  <rect x="30" y="152" width="500" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="90" y1="152" x2="90" y2="182" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="150" y1="152" x2="150" y2="182" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="210" y1="152" x2="210" y2="182" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="270" y1="152" x2="270" y2="182" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="380" y1="152" x2="380" y2="182" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="172" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">轮次</text>
  <text x="120" y="172" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">left</text>
  <text x="180" y="172" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">right</text>
  <text x="240" y="172" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">mid</text>
  <text x="325" y="172" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">isBadVersion(mid)</text>
  <text x="450" y="172" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">动作</text>

  <!-- round 1: left=1, right=5, mid=3, false, left=mid+1=4 -->
  <rect x="30" y="182" width="500" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="90" y1="182" x2="90" y2="212" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="150" y1="182" x2="150" y2="212" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="210" y1="182" x2="210" y2="212" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="270" y1="182" x2="270" y2="212" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="380" y1="182" x2="380" y2="212" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="202" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="120" y="202" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="180" y="202" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="240" y="202" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="325" y="202" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">false（好）</text>
  <text x="450" y="202" text-anchor="middle" font-size="10.5" fill="#4a7a3a">left = mid+1 = 4</text>

  <!-- round 2: left=4, right=5, mid=4, true, right=mid=4 -->
  <rect x="30" y="212" width="500" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="90" y1="212" x2="90" y2="242" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="150" y1="212" x2="150" y2="242" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="210" y1="212" x2="210" y2="242" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="270" y1="212" x2="270" y2="242" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <line x1="380" y1="212" x2="380" y2="242" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="232" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="120" y="232" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="180" y="232" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="240" y="232" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="325" y="232" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">true（坏）</text>
  <text x="450" y="232" text-anchor="middle" font-size="10.5" fill="#b85450">right = mid = 4</text>

  <!-- end row -->
  <rect x="30" y="242" width="500" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="262" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">left == right == 4 → 返回 4 ✓（仅 2 次 API 调用）</text>

  <!-- ===== Part C: 区间收缩可视化 ===== -->
  <text x="280" y="296" text-anchor="middle" font-size="11.5" fill="#888">③ 区间收缩可视化</text>

  <!-- round 1: [1, 5] -> mid=3, false -> [4, 5] -->
  <text x="50" y="322" font-size="10.5" fill="#888">轮1:</text>
  <rect x="90" y="310" width="398" height="24" fill="none" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="289" y="326" text-anchor="middle" font-size="10" fill="#446688">[1, 5]  mid=3 → false → left=4</text>

  <path d="M 289 340 L 289 350" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- round 2: [4, 5] -> mid=4, true -> [4, 4] -->
  <text x="50" y="372" font-size="10.5" fill="#888">轮2:</text>
  <rect x="336" y="360" width="152" height="24" fill="none" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="412" y="376" text-anchor="middle" font-size="10" fill="#b85450">[4, 5]  mid=4 → true → right=4</text>

  <path d="M 412 390 L 412 400" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- result -->
  <text x="50" y="422" font-size="10.5" fill="#888">结果:</text>
  <rect x="336" y="410" width="36" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="354" y="426" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">[4]</text>
  <text x="386" y="426" font-size="10.5" fill="#d6a040" font-weight="bold">left == right → 首个坏版本 = 4</text>
</svg>
