<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)" font-weight="bold">核心直觉：递归精简子节点 → 过滤假值；容器恒真故空壳留存</text>

  <!-- 顶部输入 -->
  <rect x="240" y="44" width="140" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="66" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">obj (对象 / 数组)</text>

  <!-- 三条分派线 -->
  <path d="M 272 78 L 110 112" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 300 78 L 280 112" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 348 78 L 510 112" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 分支1: 原始类型 -->
  <rect x="40" y="114" width="140" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="110" y="136" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">原始类型（递归基）</text>
  <rect x="44" y="158" width="132" height="28" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="110" y="177" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">null/布尔/数字/串 原样返回</text>

  <!-- 分支2: 数组 -->
  <rect x="200" y="114" width="160" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="136" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">Array.isArray</text>
  <rect x="204" y="158" width="152" height="28" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="280" y="177" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">map(compact) → filter(Boolean)</text>

  <!-- 分支3: 对象 -->
  <rect x="440" y="114" width="140" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="510" y="136" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">普通对象</text>
  <rect x="444" y="158" width="132" height="28" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="510" y="177" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">{k:compact(v) 仅留 truthy}</text>

  <!-- 递归回环箭头：array 和 object 递归调用自身 -->
  <path d="M 280 188 C 280 232, 300 244, 300 44" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="190" y="248" font-size="10" fill="#b85450" filter="url(#rough2)" font-weight="bold">递归</text>
  <path d="M 510 188 C 510 232, 320 250, 312 44" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="540" y="248" font-size="10" fill="#446688" filter="url(#rough2)" font-weight="bold">递归</text>

  <!-- 两阶段示意区 -->
  <text x="310" y="272" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)" font-weight="bold">两阶段：先精简子节点，再按 Boolean 过滤</text>

  <!-- 输入数组 -->
  <rect x="40" y="288" width="540" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="58" y="310" font-size="11" fill="#d6a040" filter="url(#rough2)" font-weight="bold">输入</text>
  <text x="310" y="310" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[null, 0, 5, [0], [false,16]]</text>

  <path d="M 310 324 L 310 348" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="340" font-size="9" fill="#888" filter="url(#rough2)">①精简</text>

  <!-- 精简后 -->
  <rect x="40" y="352" width="540" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="58" y="374" font-size="11" fill="#4a7a3a" filter="url(#rough2)" font-weight="bold">精简</text>
  <text x="310" y="374" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[null, 0, 5, [], [16]]</text>

  <path d="M 310 388 L 310 412" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="404" font-size="9" fill="#888" filter="url(#rough2)">②过滤</text>

  <!-- 过滤后 -->
  <rect x="40" y="416" width="540" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="58" y="438" font-size="11" fill="#b85450" filter="url(#rough2)" font-weight="bold">输出</text>
  <text x="310" y="438" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[5, [], [16]]  ← null/0 被 Boolean 剔除，空数组 [] 留存</text>
</svg>
