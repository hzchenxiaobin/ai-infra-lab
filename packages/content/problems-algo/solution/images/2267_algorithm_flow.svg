<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：BFS 遍历状态 (i, j, balance) + 三类剪枝</text>

  <!-- P: early prune box -->
  <rect x="60" y="40" width="440" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">剪枝：m+n 为偶？或 grid[0][0]=')'？或 grid[m-1][n-1]='('？</text>
  <text x="280" y="76" text-anchor="middle" font-size="10" fill="#b85450">任一为真 → 直接 return false</text>

  <!-- arrow P -> A -->
  <line x1="280" y1="84" x2="280" y2="104" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- A: start -->
  <rect x="170" y="104" width="220" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="125" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">起点 (0,0) 入队，bal = 1</text>

  <line x1="280" y1="136" x2="280" y2="152" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B: queue empty? -->
  <rect x="170" y="152" width="220" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="178" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">队列空？</text>
  <!-- yes -> return false -->
  <line x1="390" y1="174" x2="438" y2="174" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="406" y="168" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">是</text>
  <rect x="438" y="158" width="102" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="489" y="178" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">return false</text>
  <!-- no down -->
  <text x="290" y="208" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">否</text>
  <line x1="280" y1="196" x2="280" y2="218" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- C: fetch -->
  <rect x="170" y="218" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="238" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">取出状态 (i, j, bal)</text>

  <line x1="280" y1="248" x2="280" y2="264" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D: terminal? -->
  <rect x="170" y="264" width="220" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="290" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">(i,j) == 终点 (m-1,n-1)？</text>
  <line x1="390" y1="286" x2="438" y2="286" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="406" y="280" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">是</text>
  <rect x="438" y="270" width="102" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="489" y="290" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">return true</text>
  <text x="489" y="302" text-anchor="middle" font-size="8.5" fill="#4a7a3a">(bal 必为 0)</text>
  <text x="290" y="320" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">否</text>
  <line x1="280" y1="308" x2="280" y2="330" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- E: directions -->
  <rect x="170" y="330" width="220" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="351" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">对 dir ∈ {右, 下} 取 (ni, nj)</text>

  <line x1="280" y1="362" x2="280" y2="378" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- F: balance prune -->
  <rect x="170" y="378" width="220" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="398" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">nb = bal ± 1；nb &lt; 0 或 nb &gt; 剩余？</text>
  <line x1="390" y1="400" x2="438" y2="400" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="406" y="394" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">是</text>
  <rect x="438" y="384" width="102" height="32" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="489" y="404" text-anchor="middle" font-size="10.5" fill="#666" font-weight="bold">丢弃该分支</text>
  <text x="290" y="434" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">否</text>
  <line x1="280" y1="422" x2="280" y2="444" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- G: visited? + enqueue combined -->
  <rect x="170" y="444" width="220" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="464" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">(ni,nj) 已含 nb？否→标记并入队</text>
  <text x="280" y="478" text-anchor="middle" font-size="9.5" fill="#888">是则跳过（去重）</text>

  <!-- loop back arrow from bottom to B -->
  <path d="M 170 464 H 60 V 174 H 168" fill="none" stroke="#4a7a3a" stroke-width="1.6"
        stroke-dasharray="6 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="70" y="320" font-size="9.5" fill="#4a7a3a" font-weight="bold" transform="rotate(-90 70 320)">继续出队下一状态</text>

  <!-- legend -->
  <rect x="438" y="444" width="102" height="40" fill="#fafafa" stroke="none"/>
  <rect x="442" y="448" width="14" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="460" y="457" font-size="9" fill="#666">动作</text>
  <rect x="442" y="464" width="14" height="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="460" y="473" font-size="9" fill="#666">判定</text>
</svg>
