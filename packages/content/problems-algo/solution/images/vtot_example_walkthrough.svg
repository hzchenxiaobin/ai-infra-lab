<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：[3,9,8,4,0,1,7] 的 BFS 逐轮分桶</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">7 次出队，每次把 (node,col) 的 val 追加到 col_to_nodes[col]，全程无 sort</text>

  <!-- ===== Round 1: (3,0) ===== -->
  <text x="20" y="74" font-size="11" fill="#4a7a3a" font-weight="bold">轮 1：出队 (3, col=0)，入队 (9,−1)、(8,1)</text>
  <g font-size="10">
    <rect x="20" y="84" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="50" y="100" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3,0</text>
    <path d="M 90 96 L 120 96" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
    <rect x="130" y="84" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="150" y="100" text-anchor="middle" font-size="9" fill="#4a7a3a">[3]</text>
    <text x="180" y="100" font-size="9" fill="#888">col_to_nodes[0] 追加 3</text>
    <text x="380" y="100" font-size="9" fill="#888">min_col=0, max_col=1</text>
  </g>

  <!-- ===== Round 2: (9,-1) ===== -->
  <text x="20" y="130" font-size="11" fill="#446688" font-weight="bold">轮 2：出队 (9, col=−1)，入队 (4,−2)、(0,0)</text>
  <g font-size="10">
    <rect x="20" y="140" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="50" y="156" text-anchor="middle" fill="#446688" font-weight="bold">9,−1</text>
    <path d="M 90 152 L 120 152" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
    <rect x="130" y="140" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="150" y="156" text-anchor="middle" font-size="9" fill="#446688">[9]</text>
    <text x="180" y="156" font-size="9" fill="#888">col_to_nodes[−1] 追加 9</text>
    <text x="380" y="156" font-size="9" fill="#888">min_col=−1, max_col=1</text>
  </g>

  <!-- ===== Round 3: (8,1) ===== -->
  <text x="20" y="186" font-size="11" fill="#d6a040" font-weight="bold">轮 3：出队 (8, col=1)，入队 (1,0)、(7,2)</text>
  <g font-size="10">
    <rect x="20" y="196" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="50" y="212" text-anchor="middle" fill="#d6a040" font-weight="bold">8,1</text>
    <path d="M 90 208 L 120 208" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
    <rect x="130" y="196" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="150" y="212" text-anchor="middle" font-size="9" fill="#d6a040">[8]</text>
    <text x="180" y="212" font-size="9" fill="#888">col_to_nodes[1] 追加 8</text>
    <text x="380" y="212" font-size="9" fill="#888">min_col=−1, max_col=2</text>
  </g>

  <!-- ===== Round 4: (4,-2) ===== -->
  <text x="20" y="242" font-size="11" fill="#b85450" font-weight="bold">轮 4：出队 (4, col=−2)，无子节点</text>
  <g font-size="10">
    <rect x="20" y="252" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="50" y="268" text-anchor="middle" fill="#b85450" font-weight="bold">4,−2</text>
    <path d="M 90 264 L 120 264" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
    <rect x="130" y="252" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="150" y="268" text-anchor="middle" font-size="9" fill="#b85450">[4]</text>
    <text x="180" y="268" font-size="9" fill="#888">col_to_nodes[−2] 追加 4</text>
    <text x="380" y="268" font-size="9" fill="#888">min_col=−2, max_col=2</text>
  </g>

  <!-- ===== Round 5: (0,0) — 关键 ===== -->
  <text x="20" y="298" font-size="11" fill="#446688" font-weight="bold">轮 5：出队 (0, col=0) ← 关键：col=0 桶再次追加，得到 [3,0]</text>
  <g font-size="10">
    <rect x="20" y="308" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="50" y="324" text-anchor="middle" fill="#446688" font-weight="bold">0,0</text>
    <path d="M 90 320 L 120 320" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
    <rect x="130" y="308" width="56" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="158" y="324" text-anchor="middle" font-size="9" fill="#4a7a3a">[3,0]</text>
    <text x="196" y="324" font-size="9" fill="#888">col_to_nodes[0] 再追加 0（3 已在上层先入）</text>
  </g>

  <!-- ===== Round 6: (1,0) — 关键 ===== -->
  <text x="20" y="354" font-size="11" fill="#446688" font-weight="bold">轮 6：出队 (1, col=0) ← 关键：0 与 1 同 (row=2,col=0)，0 先入 → [3,0,1]</text>
  <g font-size="10">
    <rect x="20" y="364" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="50" y="380" text-anchor="middle" fill="#446688" font-weight="bold">1,0</text>
    <path d="M 90 376 L 120 376" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
    <rect x="130" y="364" width="68" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="164" y="380" text-anchor="middle" font-size="9" fill="#4a7a3a">[3,0,1]</text>
    <text x="208" y="380" font-size="9" fill="#888">col_to_nodes[0] 再追加 1（左→右顺序天然满足）</text>
  </g>

  <!-- ===== Round 7: (7,2) ===== -->
  <text x="20" y="410" font-size="11" fill="#8a5a8a" font-weight="bold">轮 7：出队 (7, col=2)，无子节点</text>
  <g font-size="10">
    <rect x="20" y="420" width="60" height="24" fill="#f3e5f5" stroke="#8a5a8a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="50" y="436" text-anchor="middle" fill="#8a5a8a" font-weight="bold">7,2</text>
    <path d="M 90 432 L 120 432" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
    <rect x="130" y="420" width="40" height="22" fill="#f3e5f5" stroke="#8a5a8a" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="150" y="436" text-anchor="middle" font-size="9" fill="#8a5a8a">[7]</text>
    <text x="180" y="436" font-size="9" fill="#888">col_to_nodes[2] 追加 7</text>
  </g>

  <!-- ===== Final ===== -->
  <line x1="20" y1="460" x2="540" y2="460" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 280 468 L 280 478" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="60" y="482" width="440" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="502" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">按 col 从 −2 到 2 输出 → [[4],[9],[3,0,1],[8],[7]] ✓</text>
</svg>
