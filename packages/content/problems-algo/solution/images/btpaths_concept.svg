<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">二叉树的所有路径：根→叶全枚举</text>

  <!-- ===== 树结构 root = [1,2,3,null,5] ===== -->
  <!-- 根 1 -->
  <circle cx="280" cy="70" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="75" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <!-- 2 (左孩子) -->
  <circle cx="180" cy="140" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="145" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <line x1="266" y1="82" x2="192" y2="128" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 3 (右孩子) -->
  <circle cx="380" cy="140" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="145" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <line x1="294" y1="82" x2="368" y2="128" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 5 (2 的右孩子，叶子) -->
  <circle cx="180" cy="220" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="225" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <line x1="180" y1="156" x2="180" y2="204" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 叶子标记 -->
  <text x="140" y="252" font-size="10" fill="#4a7a3a" font-weight="bold">叶</text>
  <text x="362" y="172" font-size="10" fill="#d6a040" font-weight="bold">叶</text>

  <!-- ===== 路径高亮 ===== -->
  <!-- 路径① 1->2->5 蓝色 -->
  <path d="M 280 88 Q 220 110 196 124" stroke="#446688" stroke-width="3" fill="none" opacity="0.35" filter="url(#rough2)"/>
  <path d="M 180 156 L 180 204" stroke="#446688" stroke-width="3" fill="none" opacity="0.35" filter="url(#rough2)"/>

  <!-- 路径② 1->3 橙色 -->
  <path d="M 294 82 Q 340 110 368 124" stroke="#d6a040" stroke-width="3" fill="none" opacity="0.35" filter="url(#rough2)"/>

  <!-- ===== 路径结果 ===== -->
  <text x="280" y="288" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">两条根到叶路径</text>

  <rect x="120" y="300" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="195" y="320" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"1-&gt;2-&gt;5"</text>

  <rect x="290" y="300" width="100" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="340" y="320" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"1-&gt;3"</text>

  <path d="M 195 300 L 195 284 L 180 240" stroke="#446688" stroke-width="1.2" fill="none" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 340 300 L 340 284 L 380 160" stroke="#d6a040" stroke-width="1.2" fill="none" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="280" y="350" text-anchor="middle" font-size="10" fill="#888">叶子 = 无左右孩子；路径必须从根走到叶子</text>
</svg>
