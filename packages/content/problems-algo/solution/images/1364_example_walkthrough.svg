<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="560" fill="#fafafa"/>

  <text x="360" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：Invoice 77 (Alice) vs Invoice 99 (Bob)</text>

  <!-- Invoices relevant rows -->
  <text x="40" y="54" font-size="11" fill="#888" filter="url(#rough2)">Invoices（取 invoice 77 与 99）:</text>
  <rect x="40" y="60" width="280" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="52" y="78" font-size="10" fill="#333" filter="url(#rough2)">invoice_id=77  price=100  user_id=1 → Alice</text>
  <text x="52" y="95" font-size="10" fill="#333" filter="url(#rough2)">invoice_id=99  price=300  user_id=2 → Bob</text>

  <!-- Customers email set (reference) -->
  <text x="400" y="54" font-size="11" fill="#888" filter="url(#rough2)">Customers.email 集合:</text>
  <rect x="400" y="60" width="280" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="412" y="78" font-size="9" fill="#333" filter="url(#rough2)">{ alice@lc.com, bob@lc.com,</text>
  <text x="412" y="95" font-size="9" fill="#333" filter="url(#rough2)">  john@lc.com, alex@lc.com }</text>

  <!-- LEFT column: Invoice 77 / Alice -->
  <rect x="30" y="124" width="330" height="30" fill="#446688" rx="6" filter="url(#rough2)"/>
  <text x="195" y="143" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">Invoice 77 → user_id=1 (Alice)</text>

  <text x="40" y="172" font-size="10" fill="#888" filter="url(#rough2)">Alice 的联系人（Contacts where user_id=1）:</text>

  <!-- contact rows -->
  <rect x="40" y="180" width="310" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="195" font-size="9" fill="#333" filter="url(#rough2)">Bob        bob@lc.com    ✓ 在集合中 → 可信</text>

  <rect x="40" y="206" width="310" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="221" font-size="9" fill="#333" filter="url(#rough2)">John Doe   john@lc.com   ✓ 在集合中 → 可信</text>

  <rect x="40" y="232" width="310" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="247" font-size="9" fill="#333" filter="url(#rough2)">Alice      alice@lc.com  ✓ 在集合中 → 可信</text>

  <!-- result for Alice -->
  <rect x="40" y="266" width="310" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="195" y="285" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">contacts_cnt=3, trusted_contacts_cnt=3</text>

  <!-- RIGHT column: Invoice 99 / Bob -->
  <rect x="380" y="124" width="310" height="30" fill="#446688" rx="6" filter="url(#rough2)"/>
  <text x="535" y="143" text-anchor="middle" font-size="12" fill="#fff" filter="url(#rough2)">Invoice 99 → user_id=2 (Bob)</text>

  <text x="390" y="172" font-size="10" fill="#888" filter="url(#rough2)">Bob 的联系人（Contacts where user_id=2）:</text>

  <rect x="390" y="180" width="290" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="400" y="195" font-size="9" fill="#333" filter="url(#rough2)">Doe   doe@lc.com   ✗ 不在集合中</text>

  <!-- empty rows placeholder -->
  <text x="390" y="218" font-size="9" fill="#aaa" filter="url(#rough2)">(Bob 只有 1 个联系人)</text>

  <!-- result for Bob -->
  <rect x="390" y="266" width="290" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="535" y="285" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">contacts_cnt=1, trusted_contacts_cnt=0</text>

  <!-- Arrow down to final result -->
  <line x1="360" y1="300" x2="360" y2="322" stroke="#333" stroke-width="1.5" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Final result table -->
  <text x="360" y="338" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">最终结果（ORDER BY invoice_id）:</text>

  <!-- header -->
  <rect x="60" y="346" width="600" height="24" fill="#446688" rx="4" filter="url(#rough2)"/>
  <text x="110" y="362" text-anchor="middle" font-size="10" fill="#fff" filter="url(#rough2)">invoice_id</text>
  <text x="230" y="362" text-anchor="middle" font-size="10" fill="#fff" filter="url(#rough2)">customer_name</text>
  <text x="350" y="362" text-anchor="middle" font-size="10" fill="#fff" filter="url(#rough2)">price</text>
  <text x="480" y="362" text-anchor="middle" font-size="10" fill="#fff" filter="url(#rough2)">contacts_cnt</text>
  <text x="610" y="362" text-anchor="middle" font-size="10" fill="#fff" filter="url(#rough2)">trusted_cnt</text>

  <!-- rows -->
  <rect x="60" y="372" width="600" height="20" fill="#f5f5f5" stroke="#ccc" stroke-width="0.5" filter="url(#rough2)"/>
  <text x="110" y="386" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">44</text>
  <text x="230" y="386" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Alex</text>
  <text x="350" y="386" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">600</text>
  <text x="480" y="386" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">1</text>
  <text x="610" y="386" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">1</text>

  <rect x="60" y="392" width="600" height="20" fill="#fff" stroke="#ccc" stroke-width="0.5" filter="url(#rough2)"/>
  <text x="110" y="406" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">55</text>
  <text x="230" y="406" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">John</text>
  <text x="350" y="406" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">500</text>
  <text x="480" y="406" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">1</text>
  <text x="610" y="406" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">1</text>

  <rect x="60" y="412" width="600" height="20" fill="#f5f5f5" stroke="#ccc" stroke-width="0.5" filter="url(#rough2)"/>
  <text x="110" y="426" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">66</text>
  <text x="230" y="426" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Bob</text>
  <text x="350" y="426" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">400</text>
  <text x="480" y="426" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">1</text>
  <text x="610" y="426" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">0</text>

  <rect x="60" y="432" width="600" height="20" fill="#fff" stroke="#ccc" stroke-width="0.5" filter="url(#rough2)"/>
  <text x="110" y="446" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">77</text>
  <text x="230" y="446" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Alice</text>
  <text x="350" y="446" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">100</text>
  <text x="480" y="446" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">3</text>
  <text x="610" y="446" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="60" y="452" width="600" height="20" fill="#f5f5f5" stroke="#ccc" stroke-width="0.5" filter="url(#rough2)"/>
  <text x="110" y="466" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">88</text>
  <text x="230" y="466" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Alice</text>
  <text x="350" y="466" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">200</text>
  <text x="480" y="466" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">3</text>
  <text x="610" y="466" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="60" y="472" width="600" height="20" fill="#fff" stroke="#ccc" stroke-width="0.5" filter="url(#rough2)"/>
  <text x="110" y="486" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">99</text>
  <text x="230" y="486" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">Bob</text>
  <text x="350" y="486" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">300</text>
  <text x="480" y="486" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">1</text>
  <text x="610" y="486" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>

  <!-- Bottom note -->
  <rect x="60" y="506" width="600" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="360" y="522" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">💡 Bob 有 1 个联系人 Doe，但 doe@lc.com 不是已注册顾客 → trusted=0</text>
  <text x="360" y="538" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">   Alice 的 3 个联系人邮箱全部在 Customers 中 → trusted=3</text>
</svg>
