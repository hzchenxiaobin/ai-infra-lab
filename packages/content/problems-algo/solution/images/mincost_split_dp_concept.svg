<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心概念：拆分代价 = Σ 重要性，重要性 = k + trimmed(subarray).length</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888">trimmed 把子数组里"仅出现一次"的数全部删掉，只留下出现 ≥2 次的（含其全部出现）</text>

  <!-- nums array with split -->
  <text x="40" y="84" font-size="11" fill="#446688" font-weight="bold">nums（示例 1，k=2）：</text>
  <g font-size="13">
    <!-- subarray 1: [1,2] indices 0,1 -->
    <rect x="48" y="96" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="70" y="118" text-anchor="middle" fill="#333">1</text>
    <rect x="94" y="96" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="116" y="118" text-anchor="middle" fill="#333">2</text>
    <!-- split divider -->
    <path d="M 146 92 L 146 138" stroke="#b85450" stroke-width="2.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
    <text x="146" y="86" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">切分</text>
    <!-- subarray 2: [1,2,1,3,3] indices 2..6 -->
    <rect x="152" y="96" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="174" y="118" text-anchor="middle" fill="#333">1</text>
    <rect x="198" y="96" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="220" y="118" text-anchor="middle" fill="#333">2</text>
    <rect x="244" y="96" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="266" y="118" text-anchor="middle" fill="#333">1</text>
    <rect x="290" y="96" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="312" y="118" text-anchor="middle" fill="#333">3</text>
    <rect x="336" y="96" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="358" y="118" text-anchor="middle" fill="#333">3</text>
  </g>
  <text x="70" y="150" text-anchor="middle" font-size="10" fill="#446688">子数组 A=[1,2]</text>
  <text x="252" y="150" text-anchor="middle" font-size="10" fill="#d6a040">子数组 B=[1,2,1,3,3]</text>

  <!-- trim process for subarray B -->
  <text x="40" y="184" font-size="11" fill="#b85450" font-weight="bold">对 B 做 trimmed：</text>
  <text x="40" y="202" font-size="10" fill="#555">统计频次：1→2 次，2→1 次，3→2 次。2 只出现一次 → 删掉它的唯一一次出现。</text>

  <g font-size="13">
    <!-- B original -->
    <text x="40" y="232" font-size="10" fill="#888">B 原始：</text>
    <rect x="92" y="218" width="36" height="28" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="110" y="238" text-anchor="middle" fill="#333">1</text>
    <rect x="130" y="218" width="36" height="28" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="148" y="238" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <rect x="168" y="218" width="36" height="28" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="186" y="238" text-anchor="middle" fill="#333">1</text>
    <rect x="206" y="218" width="36" height="28" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="224" y="238" text-anchor="middle" fill="#333">3</text>
    <rect x="244" y="218" width="36" height="28" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="262" y="238" text-anchor="middle" fill="#333">3</text>

    <!-- arrow down: trim removes 2 -->
    <path d="M 148 250 L 148 274" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrRed)" fill="none" filter="url(#rough2)"/>
    <text x="158" y="266" font-size="9" fill="#b85450">删 2（仅 1 次）</text>

    <!-- trimmed result -->
    <text x="40" y="294" font-size="10" fill="#888">trimmed：</text>
    <rect x="92" y="280" width="36" height="28" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="110" y="300" text-anchor="middle" fill="#333">1</text>
    <rect x="130" y="280" width="36" height="28" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="148" y="300" text-anchor="middle" fill="#333">1</text>
    <rect x="168" y="280" width="36" height="28" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="186" y="300" text-anchor="middle" fill="#333">3</text>
    <rect x="206" y="280" width="36" height="28" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="224" y="300" text-anchor="middle" fill="#333">3</text>
    <text x="252" y="300" font-size="11" fill="#4a7a3a" font-weight="bold">length = 4</text>
  </g>

  <!-- importance formula box -->
  <rect x="320" y="184" width="270" height="118" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="340" y="208" font-size="12" fill="#444" font-weight="bold">重要性（importance）</text>
  <text x="340" y="232" font-size="12" fill="#333">importance = k + trimmed.length</text>
  <text x="340" y="252" font-size="11" fill="#555">A=[1,2]：trimmed.length=0</text>
  <text x="340" y="270" font-size="11" fill="#555">　→ importance_A = 2 + 0 = 2</text>
  <text x="340" y="288" font-size="11" fill="#555">B：importance_B = 2 + 4 = 6</text>

  <!-- total cost -->
  <rect x="40" y="320" width="540" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="310" y="346" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">总代价 = importance_A + importance_B = 2 + 6 = 8 ✓</text>

  <!-- dp recurrence -->
  <rect x="40" y="372" width="540" height="54" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="394" font-size="12" fill="#444" font-weight="bold">DP 转移：dp[i] = min{ dp[j] + k + trimmed.length(nums[j..i-1]) }，j &lt; i</text>
  <text x="60" y="414" font-size="10" fill="#888">dp[i] = 把前 i 个元素切成若干子数组的最小代价；固定右端 i，枚举左端 j，子数组重要性 O(1) 增量维护</text>
</svg>
