<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">单点修改的局部性：只动摇 idx−1、idx、idx+1 三个峰位</text>

  <!-- 更新前 -->
  <text x="30" y="72" font-size="11" fill="#888" filter="url(#rough2)">更新前</text>
  <rect x="100" y="52" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="74" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="160" y="52" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="185" y="74" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="220" y="52" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="245" y="74" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="280" y="52" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="305" y="74" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <path d="M 288 69 L 322 65" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <rect x="340" y="52" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="365" y="74" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>

  <text x="125" y="100" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">0</text>
  <text x="185" y="100" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1</text>
  <text x="245" y="100" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2</text>
  <text x="305" y="100" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">3</text>
  <text x="365" y="100" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">4</text>

  <!-- 改值标注 -->
  <text x="305" y="42" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">改为 4</text>
  <path d="M 305 45 L 305 50" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <!-- 更新箭头 -->
  <path d="M 260 106 L 260 138" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="274" y="126" font-size="10.5" fill="#b85450" filter="url(#rough2)">nums[3] ← 4</text>

  <!-- 更新后 -->
  <text x="30" y="166" font-size="11" fill="#888" filter="url(#rough2)">更新后</text>
  <rect x="100" y="145" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="167" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="160" y="145" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="185" y="167" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="220" y="145" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="245" y="167" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <rect x="280" y="145" width="50" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="305" y="167" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="340" y="145" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="365" y="167" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>

  <!-- 候选峰位虚线框 -->
  <rect x="214" y="139" width="182" height="46" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="302" y="204" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">只有这 3 个峰位可能变：j = idx−1, idx, idx+1</text>

  <!-- 三个重算结果 -->
  <rect x="24" y="220" width="152" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="100" y="240" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">p[2]：4&gt;1 ✓ 但 4&gt;4 ✗</text>
  <text x="100" y="262" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">1 → 0，Δ = −1</text>

  <rect x="188" y="220" width="152" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="264" y="240" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">p[3]：4&gt;4 ✗</text>
  <text x="264" y="262" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">0 → 0 不变</text>

  <rect x="352" y="220" width="144" height="60" fill="#f0f0f0" stroke="#aaa" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="424" y="240" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold" filter="url(#rough2)">p[4]：数组右端点</text>
  <text x="424" y="262" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">永远 0，跳过</text>

  <!-- 差值写回 -->
  <rect x="40" y="296" width="440" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="314" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">差值写回树状数组：add(j+1, Δ)，Δ ∈ {−1, +1}</text>
  <text x="260" y="332" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">每次修改 = O(1) 次重算 + 至多 3 次 O(log n) 单点加</text>

  <!-- 局部性说明 -->
  <rect x="40" y="352" width="440" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="377" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">窗口 [j−1, j+1] 不含 idx 的位置左右邻原封不动 → 峰值性不变</text>
</svg>
