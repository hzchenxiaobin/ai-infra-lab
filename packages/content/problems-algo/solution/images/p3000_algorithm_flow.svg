<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：单趟扫描维护字典序最大的 (d², area)</text>

  <!-- start -->
  <ellipse cx="260" cy="58" rx="44" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">开始</text>
  <path d="M 260 75 L 260 88" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="185" y="90" width="150" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="110" text-anchor="middle" font-size="12" fill="#334" filter="url(#rough2)">bestD²=−1，bestArea=0</text>
  <path d="M 260 122 L 260 134" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 1: more rectangles? -->
  <polygon points="170,172 260,138 350,172 260,206" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="176" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">还有矩形 i ?</text>

  <!-- no -> return -->
  <path d="M 350 172 L 400 172" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="374" y="164" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="404" y="154" width="102" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="455" y="176" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 bestArea</text>

  <!-- yes -> compute -->
  <path d="M 260 206 L 260 220" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="272" y="217" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="175" y="222" width="170" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="238" text-anchor="middle" font-size="12" fill="#334" filter="url(#rough2)">d² = l² + w²</text>
  <text x="260" y="254" text-anchor="middle" font-size="12" fill="#334" filter="url(#rough2)">area = l × w</text>
  <path d="M 260 262 L 260 274" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 2: lexicographic update? -->
  <polygon points="120,322 260,278 400,322 260,366" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="312" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">d² &gt; bestD²，或 d² = bestD²</text>
  <text x="260" y="330" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">且 area &gt; bestArea ?</text>

  <!-- yes -> update -->
  <path d="M 260 366 L 260 378" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="272" y="376" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="185" y="380" width="150" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="401" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">更新 best ← (d², area)</text>

  <!-- no -> i++ directly -->
  <path d="M 400 322 C 428 322 435 350 435 378" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="420" y="346" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- i++ -->
  <rect x="390" y="380" width="90" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="435" y="401" text-anchor="middle" font-size="12" fill="#334" filter="url(#rough2)">i ← i + 1</text>

  <!-- update -> i++ -->
  <path d="M 335 397 L 388 397" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- loop back -->
  <path d="M 435 414 L 435 428 L 84 428 L 84 172 L 164 172" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="160" y="423" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">下一轮判定</text>
</svg>
