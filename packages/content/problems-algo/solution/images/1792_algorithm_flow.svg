<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    算法流程：建堆 → 每次取最大增益 → 更新回堆
  </text>

  <!-- Step 1: build heap -->
  <rect x="60" y="48" width="160" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="140" y="68" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">① 对每个班 (p,t)</text>
  <text x="140" y="83" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">算 gain=(t−p)/(t(t+1)) 入堆</text>

  <path d="M140,94 L140,112" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: loop header (diamond) -->
  <polygon points="140,114 250,150 140,186 30,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="146" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">② 重复</text>
  <text x="140" y="161" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">extraStudents 次？</text>
  <text x="140" y="176" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">还剩 &gt; 0 → 是</text>

  <!-- yes branch down -->
  <path d="M140,186 L140,206" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="150" y="200" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- Step 3: pop max -->
  <rect x="60" y="208" width="160" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="140" y="226" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">③ 堆顶弹出 (p,t)</text>
  <text x="140" y="240" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">即当前增益最大的班</text>

  <path d="M140,248 L140,266" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: update -->
  <rect x="60" y="268" width="160" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="140" y="287" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">④ p++, t++</text>
  <text x="140" y="302" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">重算 gain 回推入堆</text>

  <!-- loop back arrow from step4 to diamond (left side up) -->
  <path d="M60,290 L24,290 L24,150 L28,150" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="20" y="220" text-anchor="middle" font-size="9" fill="#666" transform="rotate(-90 20 220)" filter="url(#rough2)">回到②</text>

  <!-- no branch right -->
  <path d="M250,150 L330,150" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="285" y="144" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否（用完）</text>

  <!-- Step 5: compute average -->
  <rect x="330" y="128" width="180" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="420" y="148" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">⑤ 汇总各班 p/t</text>
  <text x="420" y="163" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">平均 = Σ(p/t) / n</text>

  <path d="M420,172 L420,190" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="350" y="192" width="140" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="18" filter="url(#rough2)"/>
  <text x="420" y="215" text-anchor="middle" font-size="12" fill="#5a4a1a" filter="url(#rough2)">返回平均通过率</text>

  <!-- key notes box bottom -->
  <rect x="300" y="250" width="220" height="150" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="4 3" rx="8" filter="url(#rough2)"/>
  <text x="410" y="270" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">关键不变量</text>
  <text x="312" y="290" font-size="10" fill="#555" filter="url(#rough2)">• 堆顶永远是当前</text>
  <text x="312" y="304" font-size="10" fill="#555" filter="url(#rough2)">  “加一人收益最大”的班</text>
  <text x="312" y="322" font-size="10" fill="#555" filter="url(#rough2)">• 每次只改一个班，</text>
  <text x="312" y="336" font-size="10" fill="#555" filter="url(#rough2)">  改完立刻回推</text>
  <text x="312" y="354" font-size="10" fill="#555" filter="url(#rough2)">• t==p 的班增益=0，</text>
  <text x="312" y="368" font-size="10" fill="#555" filter="url(#rough2)">  自动沉到堆底不抢</text>
  <text x="312" y="386" font-size="10" fill="#555" filter="url(#rough2)">• 共 extraStudents 轮</text>

  <!-- complexity tag -->
  <rect x="60" y="332" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="160" y="352" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">
    每轮 O(log n)，共 O((n+E) log n)
  </text>
</svg>
