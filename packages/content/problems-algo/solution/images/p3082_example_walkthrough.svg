<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1,2,3]，k = 3</text>
  <text x="260" y="46" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">橙底 = 本步新写入的格子；只列长度 1 / 2 两行（dp[3] 全 0）</text>

  <!-- 表头第一行 -->
  <rect x="42" y="60" width="70" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="77" y="86" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">处理元素</text>
  <rect x="112" y="60" width="128" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="176" y="79" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">dp[1][s]</text>
  <text x="176" y="95" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">长度 1、和 s</text>
  <rect x="240" y="60" width="128" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="304" y="79" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">dp[2][s]</text>
  <text x="304" y="95" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">长度 2、和 s</text>
  <rect x="368" y="60" width="110" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="423" y="86" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">新产生的 S</text>

  <!-- s 下标 -->
  <text x="128" y="122" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">s=0</text>
  <text x="160" y="122" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="192" y="122" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="224" y="122" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="256" y="122" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">s=0</text>
  <text x="288" y="122" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="320" y="122" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="352" y="122" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>

  <!-- 行 1：初始 -->
  <text x="77" y="152" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">（初始）</text>
  <g font-size="13" fill="#333">
    <text x="128" y="152" text-anchor="middle" filter="url(#rough2)">0</text><text x="160" y="152" text-anchor="middle" filter="url(#rough2)">0</text><text x="192" y="152" text-anchor="middle" filter="url(#rough2)">0</text><text x="224" y="152" text-anchor="middle" filter="url(#rough2)">0</text>
    <text x="256" y="152" text-anchor="middle" filter="url(#rough2)">0</text><text x="288" y="152" text-anchor="middle" filter="url(#rough2)">0</text><text x="320" y="152" text-anchor="middle" filter="url(#rough2)">0</text><text x="352" y="152" text-anchor="middle" filter="url(#rough2)">0</text>
  </g>
  <text x="423" y="152" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">dp[0][0]=1</text>

  <!-- 行 2：+1 -->
  <text x="77" y="184" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">+ 1</text>
  <g font-size="13" fill="#333">
    <text x="128" y="184" text-anchor="middle" filter="url(#rough2)">0</text><text x="160" y="184" text-anchor="middle" filter="url(#rough2)">0</text><text x="192" y="184" text-anchor="middle" filter="url(#rough2)">0</text><text x="224" y="184" text-anchor="middle" filter="url(#rough2)">0</text>
    <text x="256" y="184" text-anchor="middle" filter="url(#rough2)">0</text><text x="288" y="184" text-anchor="middle" filter="url(#rough2)">0</text><text x="320" y="184" text-anchor="middle" filter="url(#rough2)">0</text><text x="352" y="184" text-anchor="middle" filter="url(#rough2)">0</text>
  </g>
  <rect x="146" y="166" width="28" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="160" y="184" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="423" y="184" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">{1}</text>

  <!-- 行 3：+2 -->
  <text x="77" y="216" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">+ 2</text>
  <g font-size="13" fill="#333">
    <text x="128" y="216" text-anchor="middle" filter="url(#rough2)">0</text><text x="160" y="216" text-anchor="middle" filter="url(#rough2)">1</text><text x="224" y="216" text-anchor="middle" filter="url(#rough2)">0</text>
    <text x="256" y="216" text-anchor="middle" filter="url(#rough2)">0</text><text x="288" y="216" text-anchor="middle" filter="url(#rough2)">0</text><text x="320" y="216" text-anchor="middle" filter="url(#rough2)">0</text>
  </g>
  <rect x="178" y="198" width="28" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="192" y="216" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="338" y="198" width="28" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="352" y="216" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="423" y="210" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">{2}，</text>
  <text x="423" y="226" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">{1,2} 和=3 ✓</text>

  <!-- 行 4：+3 -->
  <text x="77" y="248" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">+ 3</text>
  <g font-size="13" fill="#333">
    <text x="128" y="248" text-anchor="middle" filter="url(#rough2)">0</text><text x="160" y="248" text-anchor="middle" filter="url(#rough2)">1</text><text x="192" y="248" text-anchor="middle" filter="url(#rough2)">1</text>
    <text x="256" y="248" text-anchor="middle" filter="url(#rough2)">0</text><text x="288" y="248" text-anchor="middle" filter="url(#rough2)">0</text><text x="320" y="248" text-anchor="middle" filter="url(#rough2)">0</text><text x="352" y="248" text-anchor="middle" filter="url(#rough2)">1</text>
  </g>
  <rect x="210" y="230" width="28" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="224" y="248" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="423" y="248" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">{3}</text>

  <!-- 分隔虚线 -->
  <path d="M52,264 C200,268 320,268 468,264" fill="none" stroke="#999" stroke-width="1.2" stroke-dasharray="6 5" filter="url(#rough2)"/>
  <text x="423" y="284" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">dp[2][3] 需补 dp[1][0]=0，保持 1 不变</text>

  <!-- 聚合框 -->
  <rect x="42" y="296" width="436" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="316" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">聚合：答案 = cnt[1]·2² + cnt[2]·2¹ + cnt[3]·2⁰</text>
  <text x="260" y="337" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">= dp[1][3]·4 + dp[2][3]·2 + 0 = 1×4 + 1×2 = 6 ✓（{3} 罩 4 个 T，{1,2} 罩 2 个）</text>
</svg>
