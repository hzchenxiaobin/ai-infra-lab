<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：对 n 反复 %9 取余 / /9 缩小，按十进制权值累加</text>

  <!-- ===== start ===== -->
  <rect x="210" y="48" width="140" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">输入 n (n ≥ 1)</text>
  <path d="M 280 78 L 280 92" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== init ===== -->
  <rect x="180" y="94" width="200" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="114" text-anchor="middle" font-size="11.5" fill="#333">ans=0, base=1（=9⁰）</text>
  <path d="M 280 124 L 280 138" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== diamond: n > 0 ? ===== -->
  <polygon points="280,140 360,178 280,216 200,178" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="176" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">n &gt; 0 ?</text>
  <text x="280" y="190" text-anchor="middle" font-size="10" fill="#555">还有九进制位?</text>

  <!-- yes branch (down) -->
  <path d="M 280 216 L 280 230" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="292" y="226" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- no branch (right) -->
  <path d="M 360 178 L 430 178" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="172" font-size="10.5" fill="#888" font-weight="bold">否</text>

  <!-- ===== loop body: three steps ===== -->
  <rect x="120" y="232" width="320" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="252" text-anchor="middle" font-size="11.5" fill="#333">① d = n % 9    （取最低九进制位）</text>
  <path d="M 280 262 L 280 276" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="278" width="320" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="298" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">② ans += d * base   （按十进制位权拼入）</text>
  <path d="M 280 308 L 280 322" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="324" width="320" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="344" text-anchor="middle" font-size="11.5" fill="#333">③ n /= 9 ;  base *= 10   （舍低位，权值升一位）</text>

  <!-- loop back arrow to diamond -->
  <path d="M 120 339 L 80 339 L 80 178 L 200 178" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="58" y="260" font-size="10.5" fill="#4a7a3a" font-weight="bold">回到判定</text>

  <!-- ===== end: return ans ===== -->
  <rect x="432" y="162" width="110" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="487" y="182" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return ans</text>

  <!-- ===== notes ===== -->
  <rect x="40" y="386" width="240" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="160" y="406" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">与 504 七进制同构</text>
  <text x="160" y="422" text-anchor="middle" font-size="10.5" fill="#555">共享「除K取余」骨架</text>
  <text x="160" y="438" text-anchor="middle" font-size="10.5" fill="#555">仅基数 9 vs 7，且无负数</text>

  <rect x="300" y="386" width="240" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="420" y="406" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">数值版 vs 字符串版</text>
  <text x="420" y="422" text-anchor="middle" font-size="10.5" fill="#555">数值版：边取余边×10累加</text>
  <text x="420" y="438" text-anchor="middle" font-size="10.5" fill="#555">字符串版：收集后reverse+int</text>

  <text x="280" y="464" text-anchor="middle" font-size="10.5" fill="#b85450">⚠️ n≤5×10⁹ → 答案可达 10¹⁰，C++ 用 long long</text>
</svg>
