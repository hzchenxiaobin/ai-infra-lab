<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">转置 = 沿主对角线翻转，行列互换 (i,j) → (j,i)</text>

  <!-- ===== Input matrix 2x3 (m=2, n=3) ===== -->
  <text x="130" y="64" text-anchor="middle" font-size="12" fill="#888">输入  m × n = 2 × 3</text>
  <!-- row 0 -->
  <rect x="80" y="78" width="50" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="103" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">1</text>
  <rect x="132" y="78" width="50" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="157" y="103" text-anchor="middle" font-size="15" fill="#333">2</text>
  <rect x="184" y="78" width="50" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="209" y="103" text-anchor="middle" font-size="15" fill="#333">3</text>
  <!-- row 1 -->
  <rect x="80" y="120" width="50" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="145" text-anchor="middle" font-size="15" fill="#333">4</text>
  <rect x="132" y="120" width="50" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="157" y="145" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">5</text>
  <rect x="184" y="120" width="50" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="209" y="145" text-anchor="middle" font-size="15" fill="#333">6</text>

  <!-- index labels for input -->
  <text x="105" y="172" text-anchor="middle" font-size="10" fill="#aaa">(0,0)</text>
  <text x="157" y="172" text-anchor="middle" font-size="10" fill="#aaa">(0,1)</text>
  <text x="209" y="172" text-anchor="middle" font-size="10" fill="#aaa">(0,2)</text>

  <!-- main diagonal dashed line on input -->
  <path d="M 105 78 L 182 158" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4 4" fill="none" filter="url(#rough2)"/>
  <text x="78" y="60" font-size="10" fill="#d6a040">主对角线</text>

  <!-- ===== Arrow in middle ===== -->
  <path d="M 250 116 L 360 116" stroke="#666" stroke-width="2.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="305" y="106" text-anchor="middle" font-size="12" fill="#666">转置 T</text>
  <text x="305" y="134" text-anchor="middle" font-size="11" fill="#888">行列互换</text>

  <!-- ===== Output matrix 3x2 (n=3, m=2) ===== -->
  <text x="455" y="64" text-anchor="middle" font-size="12" fill="#888">输出  n × m = 3 × 2</text>
  <!-- row 0 -->
  <rect x="430" y="78" width="50" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="455" y="103" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">1</text>
  <rect x="482" y="78" width="50" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="507" y="103" text-anchor="middle" font-size="15" fill="#333">4</text>
  <!-- row 1 -->
  <rect x="430" y="120" width="50" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="455" y="145" text-anchor="middle" font-size="15" fill="#333">2</text>
  <rect x="482" y="120" width="50" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="507" y="145" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">5</text>
  <!-- row 2 -->
  <rect x="430" y="162" width="50" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="455" y="187" text-anchor="middle" font-size="15" fill="#333">3</text>
  <rect x="482" y="162" width="50" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="507" y="187" text-anchor="middle" font-size="15" fill="#333">6</text>

  <!-- index labels for output -->
  <text x="455" y="214" text-anchor="middle" font-size="10" fill="#aaa">(0,0)</text>
  <text x="507" y="214" text-anchor="middle" font-size="10" fill="#aaa">(0,1)</text>

  <!-- main diagonal dashed line on output -->
  <path d="M 455 78 L 532 158" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4 4" fill="none" filter="url(#rough2)"/>

  <!-- ===== Mapping arrows (two examples) ===== -->
  <!-- (0,1)=2 in input -> (1,0) in output -->
  <path d="M 182 97 Q 300 60 432 139" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 3" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)" opacity="0.75"/>
  <text x="296" y="52" text-anchor="middle" font-size="10" fill="#b85450">(0,1)→(1,0)</text>

  <!-- (0,2)=3 in input -> (2,0) in output -->
  <path d="M 234 97 Q 330 36 432 181" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 3" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)" opacity="0.6"/>
  <text x="330" y="30" text-anchor="middle" font-size="10" fill="#b85450">(0,2)→(2,0)</text>

  <!-- divider -->
  <line x1="40" y1="244" x2="580" y2="244" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Key observation box ===== -->
  <rect x="40" y="262" width="540" height="160" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="310" y="288" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">核心观察</text>

  <text x="64" y="316" font-size="13" fill="#333">① 元素映射：result[j][i] = matrix[i][j]  —— 行列下标互换</text>
  <text x="64" y="340" font-size="13" fill="#333">② 形状变化：m × n  →  n × m  —— 行数变列数、列数变行数</text>
  <text x="64" y="364" font-size="13" fill="#333">③ 主对角线元素不动：(i,i) 映射到 (i,i)，原地保持</text>
  <text x="64" y="388" font-size="13" fill="#333">④ 非方阵无法原地：形状 m×n≠n×m，必须开新矩阵</text>
  <text x="64" y="410" font-size="12" fill="#888">↳ 方阵 (m=n) 才能原地转置，交换 matrix[i][j] 与 matrix[j][i]（i&lt;j）即可</text>
</svg>
