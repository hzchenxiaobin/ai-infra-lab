<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：计数 → 差值 → 阈值判定</text>

  <!-- Step 1: init -->
  <rect x="160" y="42" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">初始化 delta[26] = {0}</text>
  <path d="M 260 76 L 260 94" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 2: count word1 -->
  <rect x="130" y="96" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="118" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">遍历 word1：delta[c − 'a'] += 1</text>
  <path d="M 260 130 L 260 148" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 3: count word2 -->
  <rect x="130" y="150" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="172" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">遍历 word2：delta[c − 'a'] −= 1</text>
  <path d="M 260 184 L 260 202" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 4: scan 26 letters -->
  <rect x="150" y="204" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="226" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">遍历 i = 0..25：计算 |delta[i]|</text>
  <path d="M 260 238 L 260 258" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="260,262 400,300 260,338 120,300" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="294" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">存在 i 使</text>
  <text x="260" y="310" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">|delta[i]| &gt; 3 ?</text>

  <!-- Yes -> false -->
  <path d="M 400 300 L 424 300" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="412" y="293" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="428" y="284" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="468" y="304" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 false</text>

  <!-- No -> true -->
  <path d="M 260 338 L 260 360" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="276" y="354" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="180" y="362" width="160" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="384" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">全部 ≤ 3 → 返回 true</text>

  <!-- Bottom note -->
  <text x="260" y="418" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">两趟计数 O(n) + 一趟 26 检查 O(26) = O(n)；空间 O(1)</text>
</svg>
