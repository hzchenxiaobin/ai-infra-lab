<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：排序 → 分半 → 交错填充</text>

  <!-- ===== Example 1 ===== -->
  <text x="40" y="54" font-size="12.5" fill="#555" font-weight="bold">示例 1：nums = [1,2,3,4,5]</text>

  <!-- Step 1: sort -->
  <text x="40" y="78" font-size="10.5" fill="#888">① 排序后:</text>
  <g font-size="11.5" fill="#333" text-anchor="middle">
    <rect x="120" y="64" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="138" y="82">1</text>
    <rect x="156" y="64" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="174" y="82">2</text>
    <rect x="192" y="64" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="210" y="82">3</text>
    <rect x="228" y="64" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="246" y="82">4</text>
    <rect x="264" y="64" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="282" y="82">5</text>
  </g>

  <!-- split marker -->
  <path d="M 228 60 L 228 92" stroke="#888" stroke-width="1.5" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="232" y="58" font-size="9" fill="#888">mid=3</text>

  <!-- Step 2: split -->
  <text x="40" y="112" font-size="10.5" fill="#888">② 分半:</text>
  <text x="120" y="112" font-size="10" fill="#4a7a3a" font-weight="bold">小半 [1,2,3]</text>
  <text x="240" y="112" font-size="10" fill="#d6a040" font-weight="bold">大半 [4,5]</text>

  <!-- Step 3: interleave -->
  <text x="40" y="142" font-size="10.5" fill="#888">③ 交错:</text>

  <!-- index ruler -->
  <text x="40" y="160" font-size="9" fill="#aaa">idx:</text>
  <g font-size="9" fill="#aaa" text-anchor="middle">
    <text x="138" y="160">0</text>
    <text x="174" y="160">1</text>
    <text x="210" y="160">2</text>
    <text x="246" y="160">3</text>
    <text x="282" y="160">4</text>
  </g>

  <!-- result -->
  <g font-size="11.5" fill="#333" text-anchor="middle">
    <rect x="120" y="166" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="138" y="184">1</text>
    <rect x="156" y="166" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="174" y="184">4</text>
    <rect x="192" y="166" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="210" y="184">2</text>
    <rect x="228" y="166" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="246" y="184">5</text>
    <rect x="264" y="166" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="282" y="184">3</text>
  </g>

  <text x="320" y="184" font-size="10.5" fill="#555">= [1,4,2,5,3]</text>

  <!-- verify -->
  <text x="40" y="210" font-size="10" fill="#4a7a3a">✓ i=1: avg(1,2)=1.5≠4</text>
  <text x="200" y="210" font-size="10" fill="#4a7a3a">✓ i=2: avg(4,5)=4.5≠2</text>
  <text x="360" y="210" font-size="10" fill="#4a7a3a">✓ i=3: avg(2,3)=2.5≠5</text>

  <!-- Divider -->
  <path d="M 40 232 L 560 232" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Example 2 ===== -->
  <text x="40" y="258" font-size="12.5" fill="#555" font-weight="bold">示例 2：nums = [6,2,0,9,7]</text>

  <!-- Step 1: sort -->
  <text x="40" y="282" font-size="10.5" fill="#888">① 排序后:</text>
  <g font-size="11.5" fill="#333" text-anchor="middle">
    <rect x="120" y="268" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="138" y="286">0</text>
    <rect x="156" y="268" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="174" y="286">2</text>
    <rect x="192" y="268" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="210" y="286">6</text>
    <rect x="228" y="268" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="246" y="286">7</text>
    <rect x="264" y="268" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="282" y="286">9</text>
  </g>

  <!-- split marker -->
  <path d="M 228 264 L 228 296" stroke="#888" stroke-width="1.5" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="232" y="262" font-size="9" fill="#888">mid=3</text>

  <!-- Step 2: split -->
  <text x="40" y="316" font-size="10.5" fill="#888">② 分半:</text>
  <text x="120" y="316" font-size="10" fill="#4a7a3a" font-weight="bold">小半 [0,2,6]</text>
  <text x="240" y="316" font-size="10" fill="#d6a040" font-weight="bold">大半 [7,9]</text>

  <!-- Step 3: interleave -->
  <text x="40" y="346" font-size="10.5" fill="#888">③ 交错:</text>

  <!-- index ruler -->
  <text x="40" y="364" font-size="9" fill="#aaa">idx:</text>
  <g font-size="9" fill="#aaa" text-anchor="middle">
    <text x="138" y="364">0</text>
    <text x="174" y="364">1</text>
    <text x="210" y="364">2</text>
    <text x="246" y="364">3</text>
    <text x="282" y="364">4</text>
  </g>

  <!-- result -->
  <g font-size="11.5" fill="#333" text-anchor="middle">
    <rect x="120" y="370" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="138" y="388">0</text>
    <rect x="156" y="370" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="174" y="388">7</text>
    <rect x="192" y="370" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="210" y="388">2</text>
    <rect x="228" y="370" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="246" y="388">9</text>
    <rect x="264" y="370" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="282" y="388">6</text>
  </g>

  <text x="320" y="388" font-size="10.5" fill="#555">= [0,7,2,9,6]</text>

  <!-- verify -->
  <text x="40" y="414" font-size="10" fill="#4a7a3a">✓ i=1: avg(0,2)=1≠7</text>
  <text x="200" y="414" font-size="10" fill="#4a7a3a">✓ i=2: avg(7,9)=8≠2</text>
  <text x="360" y="414" font-size="10" fill="#4a7a3a">✓ i=3: avg(2,6)=4≠9</text>

  <!-- ===== Summary ===== -->
  <path d="M 40 442 L 560 442" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <rect x="78" y="456" width="480" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="318" y="472" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">规律：偶数位←小半（谷），奇数位←大半（峰），峰谷交替使邻居同侧</text>

  <rect x="78" y="488" width="480" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="318" y="504" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">邻居同侧 → 平均值偏向一侧 → 恒 ≠ 中间元素（和为奇数时更天然免疫）</text>
</svg>
