<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：分流 ⟹ 调和级数造桥 ⟹ 数根</text>

  <!-- A: preprocess -->
  <rect x="145" y="40" width="230" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="59" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">预处理：x ≤ T ⟹ has[x]=1</text>
  <text x="260" y="77" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">x &gt; T ⟹ big++（孤点计数）</text>
  <path d="M260,84 L260,98" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B: outer loop d -->
  <rect x="165" y="100" width="190" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="120" text-anchor="middle" font-size="12" fill="#2a4a1e" filter="url(#rough2)">外层枚举 d = 1..T</text>
  <path d="M260,130 L260,146" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D1: has[d]? -->
  <polygon points="260,148 337,178 260,208 183,178" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="183" text-anchor="middle" font-size="12" fill="#8a6a1a" filter="url(#rough2)">d 在 nums 中？</text>
  <path d="M260,208 L260,224" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="220" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M183,178 Q100,178 100,116 L161,116" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="92" y="152" text-anchor="middle" font-size="11" fill="#b85450" transform="rotate(-90 92 152)" filter="url(#rough2)">否，d+1</text>

  <!-- C: inner loop m -->
  <rect x="140" y="226" width="240" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="246" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">内层枚举 m = d, 2d, 3d, … ≤ T</text>
  <path d="M260,256 L260,272" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D2: first[m]? -->
  <polygon points="260,274 348,306 260,338 172,306" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="311" text-anchor="middle" font-size="12" fill="#8a6a1a" filter="url(#rough2)">first[m] 为空？</text>

  <!-- yes: set anchor -->
  <path d="M348,306 Q378,306 396,306" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="372" y="298" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="400" y="290" width="104" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="452" y="311" text-anchor="middle" font-size="12" fill="#2a4a1e" filter="url(#rough2)">first[m]=d</text>

  <!-- no: union -->
  <path d="M260,338 L260,356" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="272" y="352" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="140" y="358" width="240" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="379" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">union(first[m], d)（锚点合并）</text>

  <!-- loop back: m loop and d loop -->
  <path d="M380,374 Q460,374 460,241 L384,241" fill="none" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="478" y="308" text-anchor="middle" font-size="11" fill="#d6a040" transform="rotate(90 478 308)" filter="url(#rough2)">下一个 m</text>
  <path d="M504,306 Q504,306 504,306" fill="none" filter="url(#rough2)"/>
  <path d="M138,374 Q40,374 40,115 L161,115" fill="none" stroke="#b85450" stroke-width="1.3" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="30" y="250" text-anchor="middle" font-size="11" fill="#777" transform="rotate(-90 30 250)" filter="url(#rough2)">m 用尽 ⟹ d+1</text>

  <!-- count roots -->
  <rect x="145" y="404" width="230" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="425" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">统计：ans = big + 满足 has[d] 的根数</text>
  <path d="M260,398 L260,402" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>

  <text x="260" y="458" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">（枚举完所有 d 后返回 ans）</text>
</svg>
