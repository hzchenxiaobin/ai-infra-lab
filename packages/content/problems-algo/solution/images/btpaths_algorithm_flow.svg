<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">二叉树的所有路径：DFS + 回溯流程</text>

  <!-- 入口 -->
  <rect x="200" y="46" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="68" text-anchor="middle" font-size="12" fill="#333">dfs(node, path)</text>
  <path d="M 290 80 L 290 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判空 -->
  <polygon points="290,98 410,140 290,182 170,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="136" text-anchor="middle" font-size="12" fill="#333">node == null ?</text>
  <text x="290" y="154" text-anchor="middle" font-size="11" fill="#888">空子树</text>

  <path d="M 410 140 L 470 140 L 470 86" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="432" y="132" font-size="10" fill="#b85450">是</text>
  <rect x="410" y="70" width="120" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="470" y="91" text-anchor="middle" font-size="12" fill="#888">直接返回</text>

  <path d="M 290 182 L 290 202" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="198" font-size="10" fill="#82b366">否</text>

  <!-- 选择：append -->
  <rect x="170" y="206" width="240" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="220" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">选择：path.append(node.val)</text>
  <text x="290" y="235" text-anchor="middle" font-size="10" fill="#888">把当前节点压入共享路径</text>
  <path d="M 290 242 L 290 258" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判叶子 -->
  <polygon points="290,260 420,304 290,348 160,304" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="300" text-anchor="middle" font-size="12" fill="#333">是叶子？</text>
  <text x="290" y="318" text-anchor="middle" font-size="10" fill="#888">left==null &amp;&amp; right==null</text>

  <!-- 是叶子 → 收集 -->
  <path d="M 160 304 L 100 304 L 100 250" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="108" y="296" font-size="10" fill="#b85450">是</text>
  <rect x="36" y="214" width="128" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="100" y="228" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">收集 join(path,"-&gt;")</text>
  <text x="100" y="242" text-anchor="middle" font-size="10" fill="#888">拷贝成字符串入结果</text>
  <path d="M 100 214 L 100 196 L 250 196 L 250 168" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 否 → 递归左右 -->
  <path d="M 290 348 L 290 368" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="364" font-size="10" fill="#82b366">否</text>
  <rect x="110" y="372" width="170" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="195" y="394" text-anchor="middle" font-size="11" fill="#333">dfs(node.left, path)</text>

  <rect x="300" y="372" width="170" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="385" y="394" text-anchor="middle" font-size="11" fill="#333">dfs(node.right, path)</text>

  <!-- 撤销：pop -->
  <path d="M 195 406 L 195 416 L 385 416 L 385 406" stroke="#666" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 290 416 L 290 424" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="170" y="424" width="240" height="0" fill="none"/>

  <!-- 撤销框（右下） -->
  <rect x="410" y="370" width="150" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="485" y="388" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">撤销：path.pop()</text>
  <text x="485" y="404" text-anchor="middle" font-size="10" fill="#888">回溯，兄弟分支拿干净 path</text>
  <path d="M 470 406 L 470 395 L 410 395" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="290" y="432" text-anchor="middle" font-size="10" fill="#888">选（append）→ 递归左右 → 撤销（pop）= 回溯三步</text>
</svg>
