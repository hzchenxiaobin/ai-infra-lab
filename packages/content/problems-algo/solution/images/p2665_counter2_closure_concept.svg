<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心直觉：一个闭包状态 + 三个方法 = 带状态的小对象</text>

  <!-- Outer scope: createCounter(init) -->
  <rect x="36" y="54" width="360" height="340" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="56" y="78" font-size="13" fill="#446688" font-weight="bold">createCounter(init)  ← 外层函数</text>

  <!-- captured state: init (immutable) + current (mutable) -->
  <rect x="66" y="98" width="120" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="126" y="116" text-anchor="middle" font-size="11" fill="#888">不可变快照</text>
  <text x="126" y="132" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">init</text>

  <rect x="196" y="98" width="140" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="266" y="116" text-anchor="middle" font-size="11" fill="#888">可变当前值</text>
  <text x="266" y="132" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">current</text>

  <text x="342" y="118" font-size="11" fill="#888">三方法</text>
  <text x="342" y="132" font-size="11" fill="#888">共享它</text>

  <!-- three inner methods -->
  <rect x="66" y="168" width="120" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="126" y="188" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">increment()</text>
  <text x="126" y="206" text-anchor="middle" font-size="11" fill="#333">++current 后返回</text>

  <rect x="196" y="168" width="120" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="256" y="188" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">decrement()</text>
  <text x="256" y="206" text-anchor="middle" font-size="11" fill="#333">−−current 后返回</text>

  <rect x="326" y="168" width="60" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="356" y="188" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">reset()</text>
  <text x="356" y="206" text-anchor="middle" font-size="11" fill="#333">=init</text>

  <!-- arrows from methods up to current (shared) -->
  <path d="M 126 168 L 246 138" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="5,3" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <path d="M 256 168 L 266 138" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="5,3" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <path d="M 356 168 L 286 138" stroke="#4a7a3a" stroke-width="1.6" fill="none" stroke-dasharray="5,3" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="206" y="160" font-size="10" fill="#4a7a3a">读+写</text>

  <!-- return arrow -->
  <text x="402" y="190" font-size="11" fill="#b85450" font-weight="bold">return →</text>
  <path d="M 396 193 L 466 193" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <!-- returned object -->
  <rect x="466" y="120" width="140" height="170" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="536" y="142" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回的对象</text>
  <text x="536" y="158" text-anchor="middle" font-size="10" fill="#888">{increment,</text>
  <text x="536" y="170" text-anchor="middle" font-size="10" fill="#888"> decrement, reset}</text>
  <text x="536" y="192" text-anchor="middle" font-size="10" fill="#888">三方法共享</text>
  <text x="536" y="206" text-anchor="middle" font-size="10" fill="#888">同一私有状态</text>
  <text x="536" y="220" text-anchor="middle" font-size="10" fill="#888">（init + current）</text>
  <text x="536" y="246" text-anchor="middle" font-size="10" fill="#b85450">外部只能通过</text>
  <text x="536" y="260" text-anchor="middle" font-size="10" fill="#b85450">这三个方法操作</text>

  <!-- key insight box -->
  <rect x="56" y="248" width="340" height="130" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="226" y="270" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">对比 2620：从「一个函数」到「一组方法」</text>
  <text x="76" y="290" font-size="11" fill="#666">• 2620 计数器：返回单个 counter()，只能 +1</text>
  <text x="76" y="308" font-size="11" fill="#666">• 2665 计数器 II：返回对象，含 +1 / −1 / 重置</text>
  <text x="76" y="326" font-size="11" fill="#666">• 本质相同：状态封进闭包，方法只是暴露口</text>
  <text x="76" y="344" font-size="11" fill="#888">  这正是 JS 模块模式 / Python「对象+nonlocal」的雏形</text>
  <text x="76" y="362" font-size="11" fill="#b85450">⚠️ 别用全局变量：多个 counter 会共享 current 串台</text>

  <text x="310" y="412" text-anchor="middle" font-size="11" fill="#888">状态私有、方法共享 → 封装 = 隐藏可变状态，只留受控接口</text>
</svg>
