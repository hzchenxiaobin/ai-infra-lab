<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [1, 3, 2, 2, 3, 1]</text>

  <!-- ====== Step 1: original ====== -->
  <text x="36" y="56" font-size="10.5" fill="#888" font-weight="bold">原始</text>
  <g filter="url(#rough2)">
    <rect x="80" y="44" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="120" y="44" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="160" y="44" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="200" y="44" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="240" y="44" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="280" y="44" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <text x="100" y="64" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="140" y="64" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="180" y="64" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="220" y="64" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="260" y="64" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="300" y="64" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="350" y="60" font-size="10" fill="#888">n = 6</text>

  <path d="M 280 78 L 280 92" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ====== Step 2: sorted ====== -->
  <text x="36" y="112" font-size="10.5" fill="#446688" font-weight="bold">排序后</text>
  <g filter="url(#rough2)">
    <rect x="80" y="100" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="120" y="100" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="160" y="100" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4"/>
    <rect x="200" y="100" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
    <rect x="240" y="100" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="280" y="100" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
  </g>
  <text x="100" y="120" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <text x="140" y="120" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <text x="180" y="120" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <text x="220" y="120" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>
  <text x="260" y="120" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <text x="300" y="120" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>

  <!-- S and L bracket labels -->
  <path d="M 80 134 L 80 140 L 200 140 L 200 134" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="140" y="154" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">小半 S = [1,1,2]</text>
  <path d="M 200 134 L 200 140 L 320 140 L 320 134" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="260" y="154" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">大半 L = [2,3,3]</text>

  <text x="350" y="116" font-size="10" fill="#888">mid = (6+1)//2 = 3</text>
  <text x="350" y="130" font-size="10" fill="#b85450" font-weight="bold">中位数 m = 2</text>

  <path d="M 280 160 L 280 174" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ====== Step 3: reversed ====== -->
  <text x="36" y="194" font-size="10.5" fill="#d6a040" font-weight="bold">反转两半</text>
  <g filter="url(#rough2)">
    <rect x="80" y="182" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="4"/>
    <rect x="120" y="182" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="160" y="182" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>
  <text x="100" y="202" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <text x="140" y="202" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <text x="180" y="202" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <text x="100" y="226" text-anchor="middle" font-size="9" fill="#446688">S'</text>

  <g filter="url(#rough2)">
    <rect x="240" y="182" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="280" y="182" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <rect x="320" y="182" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4"/>
  </g>
  <text x="260" y="202" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <text x="300" y="202" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <text x="340" y="202" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>
  <text x="300" y="226" text-anchor="middle" font-size="9" fill="#b85450">L'</text>

  <!-- arrows showing S' fills even, L' fills odd -->
  <path d="M 100 232 L 100 252" stroke="#446688" stroke-width="1.3" fill="none" stroke-dasharray="3,2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 140 232 L 140 252" stroke="#446688" stroke-width="1.3" fill="none" stroke-dasharray="3,2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 180 232 L 180 252" stroke="#446688" stroke-width="1.3" fill="none" stroke-dasharray="3,2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 260 232 L 260 252" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="3,2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 300 232 L 300 252" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="3,2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 340 232 L 340 252" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="3,2" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ====== Step 4: result ====== -->
  <text x="36" y="270" font-size="10.5" fill="#4a7a3a" font-weight="bold">交叉填入</text>
  <g filter="url(#rough2)">
    <rect x="80" y="258" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="120" y="258" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="160" y="258" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="200" y="258" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <rect x="240" y="258" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <rect x="280" y="258" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
  </g>
  <text x="100" y="278" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="140" y="278" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
  <text x="180" y="278" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="220" y="278" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
  <text x="260" y="278" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="300" y="278" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>

  <!-- index labels -->
  <text x="100" y="304" text-anchor="middle" font-size="9" fill="#888">0(谷)</text>
  <text x="140" y="304" text-anchor="middle" font-size="9" fill="#888">1(峰)</text>
  <text x="180" y="304" text-anchor="middle" font-size="9" fill="#888">2(谷)</text>
  <text x="220" y="304" text-anchor="middle" font-size="9" fill="#888">3(峰)</text>
  <text x="260" y="304" text-anchor="middle" font-size="9" fill="#888">4(谷)</text>
  <text x="300" y="304" text-anchor="middle" font-size="9" fill="#888">5(峰)</text>

  <!-- verification -->
  <path d="M 280 310 L 280 326" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="60" y="330" width="420" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="350" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">验证：2 &lt; 3 &gt; 1 &lt; 3 &gt; 1 &lt; 2 ✓</text>
  <text x="270" y="368" text-anchor="middle" font-size="10.5" fill="#555">中位数 2 在下标 0（谷）和下标 5（峰），两端分离无碰撞</text>

  <!-- summary -->
  <rect x="60" y="388" width="420" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="270" y="406" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">关键：S'=[2,1,1] 填偶数位，L'=[3,3,2] 填奇数位</text>
  <text x="270" y="422" text-anchor="middle" font-size="10.5" fill="#555">两半各自逆序 → 中位数推到两端 → 中间隔开非中位数</text>
</svg>
