<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">示例 1 · y 方向演算：4 个 y 区间，扫出 3 块 → true</text>
  <text x="260" y="48" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">y 投影 [0,2] [2,4] [2,3] [4,5] → 排序后 [0,2] [2,3] [2,4] [4,5]</text>

  <!-- value v -> px = 50 + v*80 : 0→50, 1→130, 2→210, 3→290, 4→370, 5→450 -->
  <!-- cut lines at y=2 (px 210) and y=4 (px 370) -->
  <g filter="url(#rough2)">
    <line x1="210" y1="58" x2="210" y2="326" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4"/>
    <text x="210" y="54" text-anchor="middle" font-size="13" fill="#b85450">✂ y=2</text>
    <line x1="370" y1="58" x2="370" y2="326" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4"/>
    <text x="370" y="54" text-anchor="middle" font-size="13" fill="#b85450">✂ y=4</text>
  </g>

  <!-- row 1: [0,2] block 1 -->
  <g filter="url(#rough2)">
    <rect x="44" y="68" width="172" height="30" fill="none" stroke="#446688" stroke-width="1.6" stroke-dasharray="6 4" rx="6"/>
    <text x="130" y="64" text-anchor="middle" font-size="10.5" fill="#446688">块 1</text>
    <rect x="50" y="76" width="160" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <text x="42" y="89" text-anchor="end" font-size="11" fill="#333">① [0,2]</text>
    <text x="462" y="89" font-size="11" fill="#446688">开块 1</text>
  </g>

  <!-- row 2: [2,3] block 2 (touching) -->
  <g filter="url(#rough2)">
    <rect x="204" y="108" width="172" height="68" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6 4" rx="6"/>
    <text x="290" y="105" text-anchor="middle" font-size="10.5" fill="#a0761e">块 2</text>
    <rect x="210" y="116" width="80" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <text x="42" y="129" text-anchor="end" font-size="11" fill="#333">② [2,3]</text>
    <text x="462" y="129" font-size="11" fill="#a0761e">开块 2</text>
    <text x="250" y="112" text-anchor="middle" font-size="10" fill="#b85450">2 ≥ 2 贴边 ✓</text>
  </g>

  <!-- row 3: [2,4] merged into block 2 -->
  <g filter="url(#rough2)">
    <rect x="210" y="156" width="160" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <text x="42" y="169" text-anchor="end" font-size="11" fill="#333">③ [2,4]</text>
    <text x="462" y="169" font-size="11" fill="#a0761e">并入块 2</text>
    <text x="250" y="152" text-anchor="middle" font-size="10" fill="#8a6d1a">2 &lt; 3 并入</text>
  </g>

  <!-- row 4: [4,5] block 3 (touching) -->
  <g filter="url(#rough2)">
    <rect x="364" y="188" width="94" height="30" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6 4" rx="6"/>
    <text x="410" y="185" text-anchor="middle" font-size="10.5" fill="#4a7a3a">块 3</text>
    <rect x="370" y="196" width="80" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <text x="42" y="209" text-anchor="end" font-size="11" fill="#333">④ [4,5]</text>
    <text x="462" y="209" font-size="11" fill="#4a7a3a">开块 3</text>
    <text x="410" y="232" text-anchor="middle" font-size="10" fill="#b85450">4 ≥ 4 贴边 ✓</text>
  </g>

  <!-- axis -->
  <g filter="url(#rough2)">
    <line x1="50" y1="330" x2="450" y2="330" stroke="#666" stroke-width="1.5"/>
    <line x1="50" y1="326" x2="50" y2="334" stroke="#666" stroke-width="1.2"/>
    <line x1="130" y1="327" x2="130" y2="333" stroke="#666" stroke-width="1"/>
    <line x1="210" y1="326" x2="210" y2="334" stroke="#b85450" stroke-width="1.8"/>
    <line x1="290" y1="327" x2="290" y2="333" stroke="#666" stroke-width="1"/>
    <line x1="370" y1="326" x2="370" y2="334" stroke="#b85450" stroke-width="1.8"/>
    <line x1="450" y1="326" x2="450" y2="334" stroke="#666" stroke-width="1.2"/>
    <text x="50" y="350" text-anchor="middle" font-size="12" fill="#666">0</text>
    <text x="130" y="350" text-anchor="middle" font-size="12" fill="#666">1</text>
    <text x="210" y="350" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">2</text>
    <text x="290" y="350" text-anchor="middle" font-size="12" fill="#666">3</text>
    <text x="370" y="350" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">4</text>
    <text x="450" y="350" text-anchor="middle" font-size="12" fill="#666">5</text>
  </g>

  <!-- conclusion -->
  <g filter="url(#rough2)">
    <rect x="45" y="362" width="430" height="48" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="260" y="382" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2d4d22">块数 = 3 ≥ 3 → 在 y=2、y=4 各切一刀，三部分都有矩形 → true ✓</text>
    <text x="260" y="402" text-anchor="middle" font-size="11" fill="#8a6d1a">y=2 恰是上下矩形的公共边界：贴边也能切（判定用 ≥）</text>
  </g>
</svg>
