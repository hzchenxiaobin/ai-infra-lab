<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：各城市均价逐个对标全国基准 5,574,304.91</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">GROUP BY city 分组后逐组验算（AVG ＝ Σprice ÷ 套数，数字为按示例数据精确实算）</text>

  <!-- 表头 -->
  <rect x="30" y="48" width="106" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="136" y="48" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="180" y="48" width="102" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="282" y="48" width="112" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="394" y="48" width="54" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="448" y="48" width="74" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="83" y="65" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">city</text>
  <text x="158" y="65" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">套数</text>
  <text x="231" y="65" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">Σ price</text>
  <text x="338" y="65" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">AVG(price)</text>
  <text x="421" y="65" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">vs 基准</text>
  <text x="485" y="65" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">判定</text>

  <!-- Chicago -->
  <rect x="30" y="74" width="106" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="136" y="74" width="44" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="180" y="74" width="102" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="282" y="74" width="112" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="394" y="74" width="54" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="448" y="74" width="74" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="83" y="92" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">Chicago</text>
  <text x="158" y="92" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="231" y="92" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">28,194,827</text>
  <text x="338" y="92" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">7,048,706.75</text>
  <text x="421" y="92" text-anchor="middle" font-size="10.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">＞</text>
  <text x="485" y="92" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓ 入选</text>

  <!-- LosAngeles -->
  <rect x="30" y="101" width="106" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="136" y="101" width="44" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="180" y="101" width="102" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="282" y="101" width="112" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="394" y="101" width="54" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="448" y="101" width="74" height="27" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="83" y="119" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">LosAngeles</text>
  <text x="158" y="119" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="231" y="119" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">12,525,509</text>
  <text x="338" y="119" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">6,262,754.50</text>
  <text x="421" y="119" text-anchor="middle" font-size="10.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">＞</text>
  <text x="485" y="119" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓ 入选</text>

  <!-- NewYork -->
  <rect x="30" y="128" width="106" height="27" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="136" y="128" width="44" height="27" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="180" y="128" width="102" height="27" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="282" y="128" width="112" height="27" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="394" y="128" width="54" height="27" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="448" y="128" width="74" height="27" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="83" y="146" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">NewYork</text>
  <text x="158" y="146" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="231" y="146" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">8,845,478</text>
  <text x="338" y="146" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">4,422,739.00</text>
  <text x="421" y="146" text-anchor="middle" font-size="10.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">＜</text>
  <text x="485" y="146" text-anchor="middle" font-size="10.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">✗ 淘汰</text>

  <!-- SanFrancisco -->
  <rect x="30" y="155" width="106" height="27" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="136" y="155" width="44" height="27" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="180" y="155" width="102" height="27" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="282" y="155" width="112" height="27" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="394" y="155" width="54" height="27" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="448" y="155" width="74" height="27" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="83" y="173" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">SanFrancisco</text>
  <text x="158" y="173" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="231" y="173" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">11,751,540</text>
  <text x="338" y="173" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3,917,180.00</text>
  <text x="421" y="173" text-anchor="middle" font-size="10.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">＜</text>
  <text x="485" y="173" text-anchor="middle" font-size="10.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">✗ 淘汰</text>

  <!-- 全国基准行 -->
  <rect x="30" y="182" width="106" height="27" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="136" y="182" width="44" height="27" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="180" y="182" width="102" height="27" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="282" y="182" width="112" height="27" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="394" y="182" width="54" height="27" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="448" y="182" width="74" height="27" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="83" y="200" text-anchor="middle" font-size="10.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">全国（基准）</text>
  <text x="158" y="200" text-anchor="middle" font-size="10.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">11</text>
  <text x="231" y="200" text-anchor="middle" font-size="10.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">61,317,354</text>
  <text x="338" y="200" text-anchor="middle" font-size="10.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">5,574,304.91</text>
  <text x="421" y="200" text-anchor="middle" font-size="10.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">—</text>
  <text x="485" y="200" text-anchor="middle" font-size="10.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">（基准）</text>

  <rect x="30" y="48" width="492" height="161" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- 底部解释 -->
  <rect x="30" y="228" width="492" height="118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="276" y="252" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">Chicago：28,194,827 ÷ 4 = 7,048,706.75 ＞ 基准 → 入选</text>
  <text x="276" y="276" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">LosAngeles：12,525,509 ÷ 2 = 6,262,754.50 ＞ 基准 → 入选</text>
  <text x="276" y="300" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">NewYork 4,422,739 ／ SanFrancisco 3,917,180 均低于基准 → 淘汰</text>
  <text x="276" y="324" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">按 city 升序输出：Chicago → LosAngeles</text>
  <text x="276" y="341" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">注：官方解释印全国均价为 6,122,059.45，与按数据实算的 5,574,304.91 不符（编辑笔误，不影响结论）</text>
</svg>
