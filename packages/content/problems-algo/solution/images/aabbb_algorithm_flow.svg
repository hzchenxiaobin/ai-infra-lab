<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一次遍历 + seen_b 标志位</text>

  <!-- Start node -->
  <ellipse cx="270" cy="62" rx="110" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="12" fill="#333">开始: seen_b = false</text>

  <!-- Arrow down -->
  <path d="M 270 82 L 270 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop box -->
  <rect x="170" y="104" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="125" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">for each char c in s</text>

  <!-- Arrow down -->
  <path d="M 270 136 L 270 152" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: c == 'b'? -->
  <polygon points="270,156 390,202 270,248 150,202" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="198" text-anchor="middle" font-size="12" fill="#333">c == 'b' ?</text>

  <!-- Yes branch (right): seen_b = true -->
  <path d="M 390 202 L 430 202" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="194" text-anchor="middle" font-size="11" fill="#d6a040">是</text>
  <rect x="430" y="180" width="84" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="472" y="198" text-anchor="middle" font-size="10" fill="#333">标记遇到 b</text>
  <text x="472" y="214" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">seen_b = true</text>

  <!-- Loop back from seen_b=true to loop box -->
  <path d="M 472 180 L 472 120 L 370 120" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- No branch (down): c == 'a', check seen_b -->
  <path d="M 270 248 L 270 268" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="264" font-size="11" fill="#82b366">否 (c == 'a')</text>

  <!-- Decision 2: seen_b? -->
  <polygon points="270,272 390,318 270,364 150,318" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="314" text-anchor="middle" font-size="12" fill="#333">seen_b == true ?</text>

  <!-- Yes branch (left): a appears after b → return false -->
  <path d="M 150 318 L 90 318" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="310" text-anchor="middle" font-size="11" fill="#b85450">是</text>
  <rect x="30" y="296" width="60" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="60" y="314" text-anchor="middle" font-size="10" fill="#333">a 出现在</text>
  <text x="60" y="328" text-anchor="middle" font-size="10" fill="#333">b 之后</text>

  <!-- Arrow from box to return false -->
  <path d="M 60 340 L 60 380" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="60" cy="400" rx="70" ry="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="404" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return false</text>

  <!-- No branch (right): a before any b, continue -->
  <path d="M 390 318 L 430 318" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="310" text-anchor="middle" font-size="11" fill="#82b366">否</text>
  <rect x="430" y="296" width="84" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="472" y="314" text-anchor="middle" font-size="10" fill="#333">a 在 b 之前</text>
  <text x="472" y="330" text-anchor="middle" font-size="10" fill="#4a7a3a">继续遍历</text>

  <!-- Loop back from continue to loop box -->
  <path d="M 472 296 L 472 120 L 370 120" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- After loop ends: return true -->
  <path d="M 270 120 L 270 120" stroke="#666" stroke-width="1.5" fill="none"/>
  <path d="M 270 136 L 400 136 L 400 400 L 200 400" stroke="#82b366" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="270" text-anchor="middle" font-size="10" fill="#82b366">遍历结束</text>

  <!-- return true node -->
  <ellipse cx="130" cy="400" rx="70" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="404" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return true</text>

  <!-- Summary note -->
  <text x="270" y="440" text-anchor="middle" font-size="10" fill="#888">关键：一旦见过 b，后续再遇 a 即非法；遍历全程未触发即合法</text>
</svg>
