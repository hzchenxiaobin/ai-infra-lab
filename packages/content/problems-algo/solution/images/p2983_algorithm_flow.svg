<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="560" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：预处理一次，每个查询 O(26) 判定</text>

  <!-- step 1: preprocess -->
  <rect x="140" y="44" width="280" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="63" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">预处理 O(26n)</text>
  <text x="280" y="81" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">失配前缀 preBad ＋ 每字母前缀 preX / preY</text>

  <path d="M 280 90 L 280 106" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2: take query -->
  <rect x="170" y="108" width="220" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="128" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">取出查询 [a, b, c, d]</text>

  <path d="M 280 138 L 280 154" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 3: mirror -->
  <rect x="120" y="156" width="320" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="175" text-anchor="middle" font-size="11.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">镜像统一：A = n−1−d，B = n−1−c</text>
  <text x="280" y="193" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">交集 I = [max(a,A), min(b,B)]（可能为空）</text>

  <path d="M 280 202 L 280 218" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision 1: condition A -->
  <polygon points="280,220 400,258 280,296 160,258" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="253" text-anchor="middle" font-size="11" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">条件 A：U1∪U2 之外</text>
  <text x="280" y="270" text-anchor="middle" font-size="11" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">失配数 = 0 ？</text>

  <path d="M 400 258 L 436 258" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="418" y="250" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="440" y="244" width="62" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="471" y="263" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">false</text>

  <path d="M 280 296 L 280 312" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="292" y="308" text-anchor="start" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- step 4: per-letter counts -->
  <rect x="90" y="314" width="340" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="333" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">逐字母 v（共 26 个，前缀和区间计数）</text>
  <text x="260" y="351" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">Xᵥ = cntX[a,b]　Yᵥ = cntY[A,B]</text>
  <text x="260" y="367" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">Dxᵥ = cntY([a,b]∖I)　Dyᵥ = cntX([A,B]∖I)</text>

  <path d="M 260 372 L 260 388" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision 2: condition B+C -->
  <polygon points="260,390 390,428 260,466 130,428" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="423" text-anchor="middle" font-size="11" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">∀v：Xᵥ ≥ Dxᵥ 且</text>
  <text x="260" y="440" text-anchor="middle" font-size="11" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">Xᵥ − Dxᵥ = Yᵥ − Dyᵥ ？</text>

  <path d="M 390 428 L 436 428" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="414" y="420" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="440" y="414" width="62" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="471" y="433" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">false</text>

  <path d="M 260 466 L 260 482" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="272" y="478" text-anchor="start" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="228" y="484" width="64" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="503" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">true</text>

  <!-- loop back -->
  <path d="M 502 258 L 524 258 L 524 123 L 396 123" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 502 428 L 524 428 L 524 262" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <path d="M 292 498 L 524 498 L 524 432" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4" fill="none" filter="url(#rough2)"/>
  <text x="540" y="330" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 540 330)" filter="url(#rough2)">下一个查询</text>

  <!-- bottom note -->
  <rect x="48" y="516" width="464" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="280" y="531" text-anchor="middle" font-size="10.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">⚠️ 条件 A 用「总失配 − 容斥并集失配」一步完成；条件 B+C 的 4 个量全靠前缀和 O(1) 读出</text>
  <text x="280" y="545" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">总复杂度 O(26·(n+q))，n, q ≤ 10⁵ → 约 5×10⁶ 次基本操作</text>
</svg>
