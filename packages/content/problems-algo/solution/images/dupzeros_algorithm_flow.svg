<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="300" y="26" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">
    算法流程：先数（正向）→ 特判 → 后填（反向）
  </text>

  <!-- ===== 阶段标签 ===== -->
  <rect x="40" y="44" width="220" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="150" y="60" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">第一趟：计数（i、j 正向）</text>

  <rect x="340" y="44" width="220" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="450" y="60" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">第二趟：回填（反向）</text>

  <!-- ===== 左列：第一趟 ===== -->
  <!-- 1. 初始化 -->
  <rect x="100" y="80" width="100" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="150" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i = 0, j = 0</text>

  <path d="M 150 112 L 150 134" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. 菱形 j < n ? -->
  <polygon points="150,136 206,168 150,200 94,168" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="172" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">j &lt; n ?</text>

  <!-- Yes 向下 -->
  <text x="158" y="216" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 150 200 L 150 222" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. 菱形 arr[i]==0 ? -->
  <polygon points="150,224 212,256 150,288 88,256" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="150" y="260" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">arr[i]==0?</text>

  <!-- Yes: j+=2 -->
  <text x="220" y="252" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 212 256 L 248 256" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="248" y="242" width="72" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="284" y="260" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">j += 2</text>

  <!-- No: j+=1 -->
  <text x="60" y="252" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 88 256 L 52 256" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="20" y="242" width="72" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="56" y="260" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">j += 1</text>

  <!-- 两分支汇合到 i+=1 -->
  <path d="M 284 270 L 284 300 L 150 300" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 56 270 L 56 300 L 150 300" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <rect x="110" y="300" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="150" y="318" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i += 1</text>

  <!-- 回环到 j<n -->
  <path d="M 150 300 L 150 308" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 230 314 L 230 168 L 206 168" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 150 328 L 230 328 L 230 314" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="240" y="346" font-size="10" fill="#888" filter="url(#rough2)">循环</text>

  <!-- j<n 的 否 分支 → 过渡到第二趟 -->
  <text x="214" y="166" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 206 168 L 300 168" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 过渡区：i/j 回退 + 特判 -->
  <rect x="300" y="152" width="36" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="318" y="167" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">i--</text>
  <text x="318" y="178" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">j--</text>

  <path d="M 318 184 L 318 204" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 特判菱形 j == n ? -->
  <polygon points="318,206 374,234 318,262 262,234" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="318" y="238" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">j == n?</text>

  <!-- 特判 Yes -->
  <text x="382" y="230" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 374 234 L 410 234" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="410" y="218" width="120" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="470" y="233" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">arr[n-1]=0</text>
  <text x="470" y="245" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">i--; j -= 2</text>
  <path d="M 470 252 L 470 286 L 450 286" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 特判 No → 直接到第二趟 -->
  <text x="326" y="276" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 318 262 L 318 286 L 322 286" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 右列：第二趟 ===== -->
  <!-- 菱形 i >= 0 ? -->
  <polygon points="396,288 452,318 396,348 340,318" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="396" y="322" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i ≥ 0 ?</text>

  <!-- No → 结束 -->
  <text x="462" y="314" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 452 318 L 502 318" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="540" cy="318" rx="34" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="540" y="322" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">结束</text>

  <!-- Yes → arr[i]==0 ? -->
  <text x="404" y="362" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 396 348 L 396 368" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="396,370 458,400 396,430 334,400" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="396" y="404" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">arr[i]==0?</text>

  <!-- Yes: 写两个0 -->
  <text x="466" y="396" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 458 400 L 494 400" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="494" y="382" width="92" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="540" y="397" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">arr[j]=arr[j-1]=0</text>
  <text x="540" y="410" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">j -= 2</text>

  <!-- No: 写 arr[i] -->
  <text x="306" y="396" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 334 400 L 300 400" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="208" y="382" width="92" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="254" y="397" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">arr[j]=arr[i]</text>
  <text x="254" y="410" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">j -= 1</text>

  <!-- 两分支汇合 → i 回退 → 回环到 i>=0 -->
  <path d="M 540 418 L 540 440 L 396 440" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 254 418 L 254 440 L 396 440" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <rect x="366" y="440" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="396" y="455" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i -= 1</text>
  <path d="M 396 440 L 396 432 L 460 432 L 460 318 L 452 318" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="468" y="290" font-size="10" fill="#888" filter="url(#rough2)">循环</text>
</svg>
