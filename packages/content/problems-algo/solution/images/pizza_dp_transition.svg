<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">记忆化 DP：dp[cuts][r][c] = Σ 水平切 + Σ 垂直切</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">送走块有苹果才递归；基准 dp[0][r][c] = [ g[r][c] &gt; 0 ]</text>

  <!-- ===== Transition diagram ===== -->
  <!-- top box -->
  <rect x="210" y="64" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="86" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">dp[cuts][r][c]</text>

  <!-- arrows to two branches -->
  <path d="M 250 98 Q 180 120 130 150" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 98 Q 380 120 430 150" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- left branch label -->
  <text x="150" y="120" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">水平切 i ∈ [r, m−2]</text>
  <text x="150" y="133" text-anchor="middle" font-size="9" fill="#555">送行 r..i，须 g[r][c] − g[i+1][c] &gt; 0</text>
  <!-- left result box -->
  <rect x="60" y="150" width="140" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="130" y="172" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">dp[cuts−1][i+1][c]</text>
  <text x="130" y="200" text-anchor="middle" font-size="9" fill="#888">保留下半，行下移</text>

  <!-- right branch label -->
  <text x="410" y="120" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">垂直切 j ∈ [c, n−2]</text>
  <text x="410" y="133" text-anchor="middle" font-size="9" fill="#555">送列 c..j，须 g[r][c] − g[r][j+1] &gt; 0</text>
  <!-- right result box -->
  <rect x="360" y="150" width="140" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="430" y="172" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">dp[cuts−1][r][j+1]</text>
  <text x="430" y="200" text-anchor="middle" font-size="9" fill="#888">保留右半，列右移</text>

  <!-- base case note -->
  <rect x="150" y="214" width="260" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="280" y="231" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">基准 cuts=0：dp[0][r][c] = 1 若 g[r][c] &gt; 0，否则 0</text>

  <!-- ===== Suffix sum section ===== -->
  <text x="280" y="262" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">后缀和 g[r][c]：子披萨 (r,c) → (m−1,n−1) 的苹果数</text>

  <!-- grid 3x3 with g values, cell 38, origin (70,278) -->
  <!-- region for g[1][0] = rows1-2, cols0-2 shaded -->
  <rect x="64" y="316" width="120" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <!-- row0 -->
  <rect x="70" y="278" width="38" height="38" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="89" y="303" text-anchor="middle" font-size="13" fill="#666">4</text>
  <rect x="108" y="278" width="38" height="38" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="127" y="303" text-anchor="middle" font-size="13" fill="#666">2</text>
  <rect x="146" y="278" width="38" height="38" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="165" y="303" text-anchor="middle" font-size="13" fill="#666">1</text>
  <!-- row1 -->
  <rect x="70" y="316" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="89" y="341" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="108" y="316" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="127" y="341" text-anchor="middle" font-size="13" fill="#4a7a3a">2</text>
  <rect x="146" y="316" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="165" y="341" text-anchor="middle" font-size="13" fill="#4a7a3a">1</text>
  <!-- row2 -->
  <rect x="70" y="354" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="89" y="379" text-anchor="middle" font-size="13" fill="#4a7a3a">0</text>
  <rect x="108" y="354" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="127" y="379" text-anchor="middle" font-size="13" fill="#4a7a3a">0</text>
  <rect x="146" y="354" width="38" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="165" y="379" text-anchor="middle" font-size="13" fill="#4a7a3a">0</text>

  <!-- axis labels -->
  <text x="56" y="303" text-anchor="end" font-size="9" fill="#888">r=0</text>
  <text x="56" y="341" text-anchor="end" font-size="9" fill="#888" font-weight="bold">r=1</text>
  <text x="56" y="379" text-anchor="end" font-size="9" fill="#888">r=2</text>
  <text x="89" y="272" text-anchor="middle" font-size="9" fill="#888">c=0</text>
  <text x="127" y="272" text-anchor="middle" font-size="9" fill="#888" font-weight="bold">c=1</text>
  <text x="165" y="272" text-anchor="middle" font-size="9" fill="#888">c=2</text>

  <!-- annotation for g[1][0] -->
  <text x="190" y="335" font-size="10" fill="#4a7a3a" font-weight="bold">↑ g[1][0]=3</text>
  <text x="190" y="348" font-size="9" fill="#888">(绿区苹果总数)</text>

  <!-- formula boxes on right -->
  <rect x="290" y="278" width="250" height="30" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="305" y="298" font-size="10" fill="#555" font-weight="bold">整个子披萨：</text>
  <text x="412" y="298" font-size="11" fill="#446688" font-weight="bold">g[r][c]</text>

  <rect x="290" y="314" width="250" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="305" y="334" font-size="10" fill="#555" font-weight="bold">上半（行 r..i）：</text>
  <text x="412" y="334" font-size="11" fill="#d6a040" font-weight="bold">g[r][c] − g[i+1][c]</text>

  <rect x="290" y="350" width="250" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="5" filter="url(#rough2)"/>
  <text x="305" y="370" font-size="10" fill="#555" font-weight="bold">左半（列 c..j）：</text>
  <text x="412" y="370" font-size="11" fill="#d6a040" font-weight="bold">g[r][c] − g[r][j+1]</text>
</svg>
