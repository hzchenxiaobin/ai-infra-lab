<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">容斥原理：x 以内「神奇数」个数 = ⌊x/a⌋ + ⌊x/b⌋ − ⌊x/L⌋</text>

  <!-- ===== Venn diagram (left) ===== -->
  <text x="44" y="56" font-size="11" fill="#888">神奇数 = a 的倍数 ∪ b 的倍数</text>

  <!-- Blue circle: multiples of a -->
  <ellipse cx="160" cy="130" rx="74" ry="56" fill="#e8f0fe" fill-opacity="0.75" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="118" y="106" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">a 的倍数</text>
  <text x="118" y="124" text-anchor="middle" font-size="11" fill="#555">个数 = ⌊x/a⌋</text>
  <text x="118" y="146" text-anchor="middle" font-size="10" fill="#888">2,4,6,8…</text>

  <!-- Green circle: multiples of b -->
  <ellipse cx="252" cy="130" rx="74" ry="56" fill="#e6f4ea" fill-opacity="0.75" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="294" y="106" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">b 的倍数</text>
  <text x="294" y="124" text-anchor="middle" font-size="11" fill="#555">个数 = ⌊x/b⌋</text>
  <text x="294" y="146" text-anchor="middle" font-size="10" fill="#888">3,6,9,12…</text>

  <!-- Overlap label -->
  <text x="206" y="128" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">重复</text>
  <text x="206" y="144" text-anchor="middle" font-size="10" fill="#b85450">⌊x/L⌋</text>

  <!-- arrow from overlap to subtraction -->
  <path d="M 206 188 L 206 210" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- minus note -->
  <rect x="118" y="214" width="176" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="206" y="232" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">交集被算了两次</text>
  <text x="206" y="248" text-anchor="middle" font-size="11" fill="#555">故减去 ⌊x/L⌋ 修正</text>

  <!-- ===== Formula box (right) ===== -->
  <rect x="340" y="62" width="200" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="440" y="86" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">计数函数 f(x)</text>
  <line x1="360" y1="96" x2="520" y2="96" stroke="#d6a040" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="440" y="118" text-anchor="middle" font-size="12" fill="#333">f(x) = ⌊x/a⌋ + ⌊x/b⌋</text>
  <text x="440" y="138" text-anchor="middle" font-size="12" fill="#333">         − ⌊x/L⌋</text>
  <text x="440" y="160" text-anchor="middle" font-size="10" fill="#888">L = lcm(a, b)</text>
  <text x="440" y="176" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">= x 以内神奇数个数</text>

  <!-- ===== Number line (bottom) ===== -->
  <text x="40" y="290" font-size="11" fill="#888">数轴 (a=2, b=3)：神奇数用 ▼ 标记</text>
  <line x1="56" y1="320" x2="524" y2="320" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 524 320 L 516 316 L 516 324 z" fill="#888" filter="url(#rough2)"/>

  <!-- ticks 1..12 -->
  <g font-size="10" fill="#999" filter="url(#rough2)">
    <line x1="64" y1="316" x2="64" y2="324" stroke="#999" stroke-width="1"/>
    <text x="64" y="340" text-anchor="middle">1</text>
    <line x1="104" y1="316" x2="104" y2="324" stroke="#999" stroke-width="1"/>
    <text x="104" y="340" text-anchor="middle">2</text>
    <line x1="144" y1="316" x2="144" y2="324" stroke="#999" stroke-width="1"/>
    <text x="144" y="340" text-anchor="middle">3</text>
    <line x1="184" y1="316" x2="184" y2="324" stroke="#999" stroke-width="1"/>
    <text x="184" y="340" text-anchor="middle">4</text>
    <line x1="224" y1="316" x2="224" y2="324" stroke="#999" stroke-width="1"/>
    <text x="224" y="340" text-anchor="middle">5</text>
    <line x1="264" y1="316" x2="264" y2="324" stroke="#999" stroke-width="1"/>
    <text x="264" y="340" text-anchor="middle">6</text>
    <line x1="304" y1="316" x2="304" y2="324" stroke="#999" stroke-width="1"/>
    <text x="304" y="340" text-anchor="middle">7</text>
    <line x1="344" y1="316" x2="344" y2="324" stroke="#999" stroke-width="1"/>
    <text x="344" y="340" text-anchor="middle">8</text>
    <line x1="384" y1="316" x2="384" y2="324" stroke="#999" stroke-width="1"/>
    <text x="384" y="340" text-anchor="middle">9</text>
    <line x1="424" y1="316" x2="424" y2="324" stroke="#999" stroke-width="1"/>
    <text x="424" y="340" text-anchor="middle">10</text>
    <line x1="464" y1="316" x2="464" y2="324" stroke="#999" stroke-width="1"/>
    <text x="464" y="340" text-anchor="middle">11</text>
    <line x1="504" y1="316" x2="504" y2="324" stroke="#999" stroke-width="1"/>
    <text x="504" y="340" text-anchor="middle">12</text>
  </g>

  <!-- magical markers: 2,3,4,6,8,9,10,12 -->
  <g filter="url(#rough2)">
    <path d="M 104 308 L 100 300 L 108 300 z" fill="#446688"/>
    <path d="M 144 308 L 140 300 L 148 300 z" fill="#4a7a3a"/>
    <path d="M 184 308 L 180 300 L 188 300 z" fill="#446688"/>
    <path d="M 264 308 L 260 300 L 268 300 z" fill="#b85450"/>
    <path d="M 344 308 L 340 300 L 348 300 z" fill="#446688"/>
    <path d="M 384 308 L 380 300 L 388 300 z" fill="#4a7a3a"/>
    <path d="M 424 308 L 420 300 L 428 300 z" fill="#446688"/>
    <path d="M 504 308 L 500 300 L 508 300 z" fill="#b85450"/>
  </g>

  <!-- legend for markers -->
  <rect x="340" y="270" width="12" height="10" fill="#446688" rx="2" filter="url(#rough2)"/>
  <text x="358" y="280" font-size="9" fill="#666">仅 a 的倍数</text>
  <rect x="420" y="270" width="12" height="10" fill="#4a7a3a" rx="2" filter="url(#rough2)"/>
  <text x="438" y="280" font-size="9" fill="#666">仅 b 的倍数</text>
  <rect x="340" y="356" width="12" height="10" fill="#b85450" rx="2" filter="url(#rough2)"/>
  <text x="358" y="366" font-size="9" fill="#666">既是 a 又是 b（=L 的倍数）</text>

  <!-- bottom note -->
  <rect x="40" y="370" width="290" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="185" y="386" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">f(x) 随 x 单调不减 ⇒ 可二分！</text>
</svg>
