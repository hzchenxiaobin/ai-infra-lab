<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：命中型 vs 无解型</text>

  <!-- ============ Example 1 ============ -->
  <rect x="24" y="40" width="552" height="186" fill="#f4f8ff" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="40" y="60" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 1：nums=[2,3,2,4,3]，numsDivide=[9,6,9,3,15] → 输出 2</text>

  <!-- numsDivide row -->
  <text x="40" y="82" font-size="10.5" fill="#888" filter="url(#rough2)">gcd(9,6,9,3,15) =</text>
  <rect x="180" y="68" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="205" y="85" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">g=3</text>

  <!-- sorted nums cells -->
  <text x="40" y="116" font-size="10.5" fill="#888" filter="url(#rough2)">排序后 nums:</text>
  <rect x="140" y="100" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="162" y="120" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="188" y="100" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="210" y="120" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="236" y="100" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="258" y="120" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="284" y="100" width="44" height="30" fill="#f4f8ff" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="306" y="120" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="332" y="100" width="44" height="30" fill="#f4f8ff" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="354" y="120" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>

  <!-- index labels -->
  <text x="162" y="148" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">i=0</text>
  <text x="210" y="148" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">i=1</text>
  <text x="258" y="148" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i=2</text>
  <text x="306" y="148" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">i=3</text>
  <text x="354" y="148" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">i=4</text>

  <!-- checks -->
  <text x="162" y="166" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">3%2=1 ✗</text>
  <text x="210" y="166" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">3%2=1 ✗</text>
  <text x="258" y="166" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3%3=0 ✓</text>
  <text x="306" y="166" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">停</text>
  <text x="354" y="166" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">停</text>

  <!-- bracket: first 2 deleted -->
  <path d="M140,176 L140,188 L280,188 L280,176" stroke="#b85450" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="210" y="204" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">删除前 i=2 个（均 &lt; 命中值 3）</text>

  <text x="420" y="120" font-size="11" fill="#333" filter="url(#rough2)">最小元素 3 整除</text>
  <text x="420" y="136" font-size="11" fill="#333" filter="url(#rough2)">numsDivide 全部 →</text>
  <text x="420" y="158" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">删除次数 = 2 ✓</text>

  <!-- ============ Example 2 ============ -->
  <rect x="24" y="244" width="552" height="172" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="40" y="264" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">示例 2：nums=[4,3,6]，numsDivide=[8,2,6,10] → 输出 -1</text>

  <text x="40" y="288" font-size="10.5" fill="#888" filter="url(#rough2)">gcd(8,2,6,10) =</text>
  <rect x="180" y="272" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="205" y="289" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">g=2</text>

  <text x="40" y="320" font-size="10.5" fill="#888" filter="url(#rough2)">排序后 nums:</text>
  <rect x="140" y="304" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="162" y="324" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="188" y="304" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="210" y="324" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="236" y="304" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="258" y="324" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">6</text>

  <text x="162" y="352" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">2%3=2 ✗</text>
  <text x="210" y="352" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">2%4=2 ✗</text>
  <text x="258" y="352" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">2%6=2 ✗</text>

  <text x="420" y="316" font-size="11" fill="#333" filter="url(#rough2)">遍历完无元素</text>
  <text x="420" y="332" font-size="11" fill="#333" filter="url(#rough2)">整除 g=2</text>
  <text x="420" y="356" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 -1 ✓</text>

  <text x="40" y="398" font-size="10.5" fill="#888" filter="url(#rough2)">注：g=2 是偶数，nums 全为 ≥3 的奇/偶但无一整除 2（3 不行、4 不行、6 不行）</text>

  <!-- footnote -->
  <text x="300" y="446" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">关键：g % x == 0 用「大数对小数取余」判定；命中即返回下标，否则 -1</text>
</svg>
