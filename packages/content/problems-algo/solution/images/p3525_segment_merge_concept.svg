<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="410" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">线段树节点 (prod, cnt) 的合并 —— 以 k = 3 为例</text>

  <!-- 左段 -->
  <rect x="22" y="42" width="185" height="178" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="114" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">左段 L = [2, 2]</text>
  <rect x="38" y="72" width="34" height="26" rx="4" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="55" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="80" y="72" width="34" height="26" rx="4" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="97" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="114" y="120" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">前缀积 mod 3 → 2, 1</text>
  <text x="114" y="142" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">prod_L = 2·2 mod 3 = 1</text>
  <text x="44" y="181" font-size="10" fill="#446688" filter="url(#rough2)">cnt_L:</text>
  <rect x="88" y="164" width="30" height="24" rx="4" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="103" y="181" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="124" y="164" width="30" height="24" rx="4" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="139" y="181" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="160" y="164" width="30" height="24" rx="4" fill="#fff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="175" y="181" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="103" y="204" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">x=0</text>
  <text x="139" y="204" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">x=1</text>
  <text x="175" y="204" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">x=2</text>

  <!-- 右段 -->
  <rect x="313" y="42" width="185" height="178" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="405" y="62" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">右段 R = [3, 5]</text>
  <rect x="329" y="72" width="34" height="26" rx="4" fill="#fff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="346" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="371" y="72" width="34" height="26" rx="4" fill="#fff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="388" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="405" y="120" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">前缀积 mod 3 → 0, 0</text>
  <text x="405" y="142" text-anchor="middle" font-size="10.5" fill="#8a6d3a" filter="url(#rough2)">prod_R = 3·5 mod 3 = 0</text>
  <text x="335" y="181" font-size="10" fill="#8a6d3a" filter="url(#rough2)">cnt_R:</text>
  <rect x="379" y="164" width="30" height="24" rx="4" fill="#fff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="394" y="181" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="415" y="164" width="30" height="24" rx="4" fill="#fff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="430" y="181" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="451" y="164" width="30" height="24" rx="4" fill="#fff" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="466" y="181" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="394" y="204" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">x=0</text>
  <text x="430" y="204" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">x=1</text>
  <text x="466" y="204" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">x=2</text>

  <!-- 汇合箭头 -->
  <path d="M 114 224 L 190 250" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 405 224 L 330 250" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 父段 -->
  <rect x="105" y="254" width="310" height="98" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="274" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">父段 S = [2, 2, 3, 5]</text>
  <text x="260" y="292" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">四个前缀积 mod 3：2, 1, 0, 0</text>
  <text x="260" y="308" text-anchor="middle" font-size="10.5" fill="#2a5a2a" filter="url(#rough2)">prod_S = 1 · 0 mod 3 = 0</text>
  <text x="128" y="339" font-size="10" fill="#2a5a2a" filter="url(#rough2)">cnt_S:</text>
  <text x="181" y="321" text-anchor="middle" font-size="7.5" fill="#999" filter="url(#rough2)">x=0</text>
  <text x="217" y="321" text-anchor="middle" font-size="7.5" fill="#999" filter="url(#rough2)">x=1</text>
  <text x="253" y="321" text-anchor="middle" font-size="7.5" fill="#999" filter="url(#rough2)">x=2</text>
  <rect x="166" y="324" width="30" height="22" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="181" y="340" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">2</text>
  <rect x="202" y="324" width="30" height="22" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="217" y="340" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">1</text>
  <rect x="238" y="324" width="30" height="22" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="253" y="340" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">1</text>
  <text x="285" y="332" font-size="8.5" fill="#2a5a2a" filter="url(#rough2)">← 2 个来自右段映射（1·0≡0）</text>
  <text x="285" y="346" font-size="8.5" fill="#2a5a2a" filter="url(#rough2)">← 各 1 个来自左段直传</text>

  <!-- 公式 -->
  <rect x="30" y="362" width="460" height="40" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="380" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">cnt_S[x] = cnt_L[x] + Σ_z [prod_L·z ≡ x (mod k)] · cnt_R[z]</text>
  <text x="260" y="395" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">prod_S = prod_L·prod_R mod k　·　合并顺序固定「左前右后」，不可交换</text>
</svg>
