<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：nums = [999, 19, 199]</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">ans 初始 +∞；每算完一个元素的数位和，立刻在线比较</text>

  <!-- 表头 -->
  <rect x="55" y="62" width="410" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="75" y="81" text-anchor="middle" font-size="11" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="125" y="81" text-anchor="middle" font-size="11" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">x</text>
  <text x="230" y="81" text-anchor="middle" font-size="11" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">取位轨迹（x）</text>
  <text x="335" y="81" text-anchor="middle" font-size="11" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">s</text>
  <text x="415" y="81" text-anchor="middle" font-size="11" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">ans（更新后）</text>

  <!-- 行 1 -->
  <rect x="55" y="94" width="410" height="34" fill="#ffffff" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="75" y="115" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <text x="125" y="115" text-anchor="middle" font-size="11.5" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">999</text>
  <text x="230" y="115" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">999 → 99 → 9 → 0</text>
  <text x="335" y="115" text-anchor="middle" font-size="11.5" fill="#2f5424" filter="url(#rough2)">27</text>
  <text x="415" y="115" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">min(∞, 27) = 27</text>

  <!-- 行 2（高亮：min 被更新） -->
  <rect x="55" y="130" width="410" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="75" y="151" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="125" y="151" text-anchor="middle" font-size="11.5" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">19</text>
  <text x="230" y="151" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">19 → 1 → 0</text>
  <text x="335" y="151" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">10</text>
  <text x="415" y="151" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">min(27, 10) = 10 ✓</text>

  <!-- 行 3 -->
  <rect x="55" y="166" width="410" height="34" fill="#ffffff" stroke="#999999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="75" y="187" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <text x="125" y="187" text-anchor="middle" font-size="11.5" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">199</text>
  <text x="230" y="187" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">199 → 19 → 1 → 0</text>
  <text x="335" y="187" text-anchor="middle" font-size="11.5" fill="#2f5424" filter="url(#rough2)">19</text>
  <text x="415" y="187" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">min(10, 19) = 10</text>

  <!-- 结果 -->
  <path d="M 260 200 L 260 212" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <rect x="55" y="216" width="410" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="237" text-anchor="middle" font-size="12" fill="#2f5424" font-weight="bold" filter="url(#rough2)">扫描结束，返回 ans = 10 ✓</text>

  <!-- 要点框 -->
  <rect x="55" y="264" width="410" height="76" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="284" text-anchor="middle" font-size="10.5" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">要点</text>
  <text x="260" y="302" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">① 最小值在第 1 步被 19 锁定：在线维护下，ans 始终是已见前缀的最优解</text>
  <text x="260" y="320" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">② 校验技巧：数位和与原数模 9 同余（999≡27≡0，19≡10≡1，199≡19≡1 mod 9）✓</text>
  <text x="260" y="334" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">（mod 9 同余可用来 O(1) 快速验证手算的数位和，见题解第 5 节）</text>
</svg>
