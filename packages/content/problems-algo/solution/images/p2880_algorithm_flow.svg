<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 390"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="390" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：一次 .loc 完成行筛 + 列投</text>

  <!-- Step 1 -->
  <rect x="145" y="46" width="230" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="71" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① 输入 students（3 列 × n 行）</text>

  <path d="M 260 88 L 260 102" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="145" y="106" width="230" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="131" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② 整列比较：student_id == 101</text>

  <path d="M 260 148 L 260 162" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="145" y="166" width="230" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="191" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ 得到布尔掩码 Series（索引对齐）</text>

  <path d="M 260 208 L 260 222" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: hero -->
  <rect x="145" y="226" width="230" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="248" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">④ students.loc[mask,</text>
  <text x="260" y="266" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">['name', 'age']]</text>

  <path d="M 260 280 L 260 294" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5 -->
  <rect x="145" y="298" width="230" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="323" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">⑤ 输出：name、age 两列子表</text>

  <!-- Side: mask mini column -->
  <text x="445" y="104" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">掩码逐行求值</text>
  <path d="M 377 130 L 411 130" fill="none" stroke="#888" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="415" y="112" width="60" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="445" y="126" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">True ✔</text>

  <rect x="415" y="134" width="60" height="20" fill="#ffffff" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="445" y="148" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">False ✘</text>

  <rect x="415" y="156" width="60" height="20" fill="#ffffff" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="445" y="170" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">False ✘</text>

  <rect x="415" y="178" width="60" height="20" fill="#ffffff" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="445" y="192" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">False ✘</text>

  <!-- Side: loc two dimensions -->
  <rect x="400" y="234" width="96" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="448" y="249" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">行维度：留 True</text>

  <rect x="400" y="260" width="96" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="448" y="275" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">列维度：按列表序</text>

  <!-- Bottom note -->
  <rect x="95" y="350" width="330" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" stroke-dasharray="5 3" rx="6" filter="url(#rough2)"/>
  <text x="260" y="369" text-anchor="middle" font-size="9.5" fill="#d6a040" filter="url(#rough2)">边界：一行都不中 → 仍返回带 name/age 列的空表</text>
</svg>
