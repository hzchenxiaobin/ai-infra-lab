<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2706a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：买最便宜的两块，花费最小，余钱最多</text>

  <!-- chocolate price array -->
  <text x="70" y="88" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">价格</text>

  <rect x="110" y="60" width="50" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="135" y="89" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold">1</text>
  <text x="135" y="124" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">最小</text>

  <rect x="160" y="60" width="50" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="185" y="89" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">2</text>

  <rect x="210" y="60" width="50" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="235" y="89" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="235" y="124" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">次小</text>

  <rect x="260" y="60" width="50" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="285" y="89" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">5</text>

  <rect x="310" y="60" width="50" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="335" y="89" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">3</text>

  <text x="360" y="124" text-anchor="middle" font-size="9" fill="#aaa">…其余都比次小贵，不选</text>

  <!-- pick the two cheapest -->
  <path d="M135,130 Q150,160 160,168" fill="none" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M235,130 Q220,160 210,168" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- cost box -->
  <rect x="110" y="168" width="250" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="235" y="186" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">两块花费 = 1 + 2 = 3</text>
  <text x="235" y="202" text-anchor="middle" font-size="11" fill="#d6a040">最小化总花费 ⇒ 最大化剩余</text>

  <!-- compare with money -->
  <path d="M235,216 L235,240" stroke="#d6a040" stroke-width="2" marker-end="url(#arr2706a)" filter="url(#rough2)"/>

  <!-- money bar -->
  <rect x="110" y="246" width="250" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="235" y="271" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">money = 3</text>

  <!-- verdict -->
  <rect x="80" y="304" width="400" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">花费 ≤ money ? money − 花费 : money</text>
  <text x="280" y="342" text-anchor="middle" font-size="11" fill="#446688">3 ≤ 3 ✓ ⇒ 余 3 − 3 = 0</text>
</svg>
