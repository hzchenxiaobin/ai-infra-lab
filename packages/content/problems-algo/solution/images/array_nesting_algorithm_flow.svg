<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrowO" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="460" height="500" fill="#fafafa"/>
  <text x="230" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">原地标记法流程：扫到未访问下标就沿环标记</text>

  <!-- init -->
  <rect x="130" y="44" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="64" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i = 0, ans = 0</text>
  <text x="230" y="78" text-anchor="middle" font-size="10" fill="#555">n = len(nums)</text>

  <path d="M 230 84 L 230 98" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- diamond 1: i < n ? -->
  <polygon points="230,102 332,140 230,178 128,140" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="136" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i &lt; n ?</text>
  <text x="230" y="152" text-anchor="middle" font-size="10" fill="#777">还没扫完？</text>

  <!-- No -> return -->
  <path d="M 332 140 L 408 140" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <text x="350" y="132" font-size="11" fill="#b85450" font-weight="bold">No</text>
  <rect x="408" y="124" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="145" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return</text>
  <text x="430" y="156" text-anchor="middle" font-size="9" fill="#4a7a3a">ans</text>

  <!-- Yes down -->
  <path d="M 230 178 L 230 198" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="246" y="194" font-size="11" fill="#82b366" font-weight="bold">Yes</text>

  <!-- diamond 2: nums[i] == -1 ? -->
  <polygon points="230,202 340,238 230,274 120,238" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="234" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">nums[i] == −1 ?</text>
  <text x="230" y="250" text-anchor="middle" font-size="10" fill="#777">已访问过？</text>

  <!-- Yes (skip) -> right then down to i+=1 -->
  <path d="M 340 238 L 380 238 L 380 432" stroke="#888" stroke-width="1.6" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="356" y="230" font-size="11" fill="#82b366" font-weight="bold">Yes</text>
  <text x="386" y="252" font-size="9.5" fill="#888">跳过</text>

  <!-- No down -->
  <path d="M 230 274 L 230 294" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="246" y="290" font-size="11" fill="#b85450" font-weight="bold">No</text>

  <!-- init inner: j = i, cnt = 0 -->
  <rect x="130" y="298" width="200" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="230" y="321" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">j = i, cnt = 0</text>

  <path d="M 230 334 L 230 348" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrowO)" filter="url(#rough2)"/>

  <!-- inner loop action box -->
  <rect x="80" y="352" width="300" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="230" y="372" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">nxt = nums[j]</text>
  <text x="230" y="388" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">nums[j] = −1;  j = nxt;  cnt += 1</text>
  <text x="230" y="402" text-anchor="middle" font-size="9.5" fill="#888">读出下个下标 → 标记本位 → 跳过去 → 计数</text>

  <!-- inner loop back: while nums[j] != -1 -->
  <path d="M 80 381 L 48 381 L 48 311 L 128 311" stroke="#d6a040" stroke-width="1.6" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <text x="52" y="350" font-size="10" fill="#d6a040" font-weight="bold">nums[j]</text>
  <text x="52" y="362" font-size="10" fill="#d6a040" font-weight="bold">!= −1 ?</text>

  <!-- exit inner -> ans = max -->
  <path d="M 230 410 L 230 422" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="244" y="420" font-size="9" fill="#888">走到已标记</text>

  <rect x="80" y="426" width="220" height="0" fill="none"/>

  <!-- ans update + i+=1 combined -->
  <rect x="130" y="424" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="230" y="442" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">ans = max(ans, cnt)</text>
  <text x="230" y="456" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">i += 1</text>

  <!-- loop back to diamond 1 -->
  <path d="M 130 444 L 40 444 L 40 140 L 128 140" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <text x="44" y="294" font-size="9.5" fill="#888">回到外循环</text>
</svg>
