<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="18" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">示例 2 演算：nums1 = [0,1,0,1] 作行 i，nums2 = [1,0,0,1] 作列 j</text>
  <text x="260" y="37" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">边界（黄）= 单数组贪心链；内部每格 = 左 / 上两个候选取 min；答案 f[4][4] = 9</text>

  <!-- 表头：角格 + j 列头 -->
  <rect x="64" y="54" width="78" height="32" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="103" y="75" text-anchor="middle" font-size="11" fill="#666" font-weight="bold" filter="url(#rough2)">f[i][j]</text>
  <rect x="142" y="54" width="58" height="32" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="200" y="54" width="58" height="32" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="258" y="54" width="58" height="32" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="316" y="54" width="58" height="32" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="374" y="54" width="58" height="32" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="171" y="75" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">j=0</text>
  <text x="229" y="75" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">j=1 (1)</text>
  <text x="287" y="75" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">j=2 (0)</text>
  <text x="345" y="75" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">j=3 (0)</text>
  <text x="403" y="75" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">j=4 (1)</text>

  <!-- 行头：i 列 -->
  <rect x="64" y="86" width="78" height="42" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="64" y="128" width="78" height="42" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="64" y="170" width="78" height="42" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="64" y="212" width="78" height="42" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="64" y="254" width="78" height="42" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="103" y="112" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">i=0</text>
  <text x="103" y="154" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">i=1 (0)</text>
  <text x="103" y="196" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">i=2 (1)</text>
  <text x="103" y="238" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">i=3 (0)</text>
  <text x="103" y="280" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">i=4 (1)</text>

  <!-- 数据格：第 0 行（边界，黄） -->
  <rect x="142" y="86" width="58" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="200" y="86" width="58" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="258" y="86" width="58" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="316" y="86" width="58" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="374" y="86" width="58" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="171" y="112" text-anchor="middle" font-size="12" fill="#a07830" filter="url(#rough2)">0</text>
  <text x="229" y="112" text-anchor="middle" font-size="12" fill="#a07830" filter="url(#rough2)">1</text>
  <text x="287" y="112" text-anchor="middle" font-size="12" fill="#a07830" filter="url(#rough2)">2</text>
  <text x="345" y="112" text-anchor="middle" font-size="12" fill="#a07830" filter="url(#rough2)">4</text>
  <text x="403" y="112" text-anchor="middle" font-size="12" fill="#a07830" filter="url(#rough2)">5</text>

  <!-- 第 1 行：j=0 黄边界 + 内部 -->
  <rect x="142" y="128" width="58" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="200" y="128" width="58" height="42" fill="#eef4fb" stroke="#7a93ad" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="258" y="128" width="58" height="42" fill="#eef4fb" stroke="#7a93ad" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="316" y="128" width="58" height="42" fill="#eef4fb" stroke="#7a93ad" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="374" y="128" width="58" height="42" fill="#eef4fb" stroke="#7a93ad" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="171" y="154" text-anchor="middle" font-size="12" fill="#a07830" filter="url(#rough2)">2</text>
  <text x="229" y="154" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">2</text>
  <text x="287" y="154" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">4</text>
  <text x="345" y="154" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">6</text>
  <text x="403" y="154" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">6</text>

  <!-- 第 2 行 -->
  <rect x="142" y="170" width="58" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="200" y="170" width="58" height="42" fill="#eef4fb" stroke="#7a93ad" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="258" y="170" width="58" height="42" fill="#eef4fb" stroke="#7a93ad" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="316" y="170" width="58" height="42" fill="#eef4fb" stroke="#7a93ad" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="374" y="170" width="58" height="42" fill="#eef4fb" stroke="#7a93ad" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="171" y="196" text-anchor="middle" font-size="12" fill="#a07830" filter="url(#rough2)">3</text>
  <text x="229" y="196" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">3</text>
  <text x="287" y="196" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="345" y="196" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">6</text>
  <text x="403" y="196" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">7</text>

  <!-- 第 3 行 -->
  <rect x="142" y="212" width="58" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="200" y="212" width="58" height="42" fill="#eef4fb" stroke="#7a93ad" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="258" y="212" width="58" height="42" fill="#eef4fb" stroke="#7a93ad" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="316" y="212" width="58" height="42" fill="#eef4fb" stroke="#7a93ad" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="374" y="212" width="58" height="42" fill="#eef4fb" stroke="#7a93ad" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="171" y="238" text-anchor="middle" font-size="12" fill="#a07830" filter="url(#rough2)">4</text>
  <text x="229" y="238" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">4</text>
  <text x="287" y="238" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">6</text>
  <text x="345" y="238" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">8</text>
  <text x="403" y="238" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">8</text>

  <!-- 第 4 行：答案格红色 -->
  <rect x="142" y="254" width="58" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="200" y="254" width="58" height="42" fill="#eef4fb" stroke="#7a93ad" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="258" y="254" width="58" height="42" fill="#eef4fb" stroke="#7a93ad" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="316" y="254" width="58" height="42" fill="#eef4fb" stroke="#7a93ad" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="374" y="254" width="58" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="171" y="280" text-anchor="middle" font-size="12" fill="#a07830" filter="url(#rough2)">5</text>
  <text x="229" y="280" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">5</text>
  <text x="287" y="280" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">6</text>
  <text x="345" y="280" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">8</text>
  <text x="403" y="280" text-anchor="middle" font-size="13.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">9</text>

  <!-- 虚线圈标注 f[2][2] -->
  <circle cx="287" cy="191" r="19" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="446" y="191" font-size="9.5" fill="#b85450" filter="url(#rough2)">←</text>
  <text x="456" y="188" font-size="9.5" fill="#b85450" filter="url(#rough2)">看</text>
  <text x="456" y="200" font-size="9.5" fill="#b85450" filter="url(#rough2)">它</text>

  <!-- 底部说明框 -->
  <rect x="30" y="306" width="472" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="266" y="322" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">边界链（黄）：f[0][·]：0→1→2→4→5；f[·][0]：0→2→3→4→5</text>
  <text x="266" y="337" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">虚线圈：f[2][2] = min( nxt(f[1][2]=4, nums1[1]=1), nxt(f[2][1]=3, nums2[1]=0) ) = min(5, 4) = 4</text>
  <text x="266" y="351" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">（两个候选 = 最后一个数落在哪个数组的末位，各做一次 nxt 再取小）</text>
</svg>
