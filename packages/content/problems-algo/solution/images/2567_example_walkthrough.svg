<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [1,4,7,8,5]，可改 2 个元素</text>

  <!-- table outline -->
  <rect x="40" y="44" width="480" height="320" fill="none" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <!-- column dividers -->
  <line x1="150" y1="44" x2="150" y2="364" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="430" y1="44" x2="430" y2="364" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <!-- header -->
  <rect x="40" y="44" width="480" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="95" y="64" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">步骤</text>
  <text x="290" y="64" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">计算</text>
  <text x="495" y="64" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">结果</text>

  <!-- row1: 输入 -->
  <text x="95" y="96" text-anchor="middle" font-size="11.5" fill="#555">① 输入</text>
  <text x="170" y="96" font-size="11.5" fill="#333">nums = [1, 4, 7, 8, 5]</text>
  <text x="495" y="96" text-anchor="middle" font-size="11" fill="#888">—</text>
  <line x1="40" y1="108" x2="520" y2="108" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- row2: 排序 -->
  <text x="95" y="134" text-anchor="middle" font-size="11.5" fill="#555">② 排序</text>
  <text x="170" y="134" font-size="11.5" fill="#333">a = [1, 4, 5, 7, 8]　(n = 5)</text>
  <text x="495" y="134" text-anchor="middle" font-size="11" fill="#888">—</text>
  <line x1="40" y1="146" x2="520" y2="146" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- row3: c1 -->
  <text x="95" y="172" text-anchor="middle" font-size="11.5" fill="#555">③ c₁ (左1右1)</text>
  <text x="170" y="172" font-size="11.5" fill="#333">a[n−2] − a[1] = a[3] − a[1] = 7 − 4</text>
  <rect x="460" y="160" width="62" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="491" y="176" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
  <line x1="40" y1="186" x2="520" y2="186" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- row4: c2 -->
  <text x="95" y="212" text-anchor="middle" font-size="11.5" fill="#555">④ c₂ (左2)</text>
  <text x="170" y="212" font-size="11.5" fill="#333">a[n−1] − a[2] = a[4] − a[2] = 8 − 5</text>
  <rect x="460" y="200" width="62" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="491" y="216" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
  <line x1="40" y1="226" x2="520" y2="226" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- row5: c3 -->
  <text x="95" y="252" text-anchor="middle" font-size="11.5" fill="#555">⑤ c₃ (右2)</text>
  <text x="170" y="252" font-size="11.5" fill="#333">a[n−3] − a[0] = a[2] − a[0] = 5 − 1</text>
  <rect x="460" y="240" width="62" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="491" y="256" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">4</text>
  <line x1="40" y1="266" x2="520" y2="266" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- row6: answer -->
  <text x="95" y="302" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">⑥ 取最小</text>
  <text x="170" y="302" font-size="11.5" fill="#333">min(c₁, c₂, c₃) = min(3, 3, 4)</text>
  <rect x="452" y="288" width="76" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="490" y="306" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">3 ✓</text>

  <!-- footer note -->
  <text x="280" y="392" text-anchor="middle" font-size="10.5" fill="#888">三种方案 min_gap 均归 0，故 score = 范围本身；取最小范围即答案</text>
</svg>
