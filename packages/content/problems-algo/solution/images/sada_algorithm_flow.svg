<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：前缀和一次扫描 O(n)</text>

  <!-- Step 1: compute total -->
  <rect x="60" y="50" width="420" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="80" y="72" font-size="12" fill="#446688" font-weight="bold">① 求总和</text>
  <text x="270" y="82" text-anchor="middle" font-size="12.5" fill="#333">total = Σ nums[j]，O(n)</text>

  <path d="M 270 100 L 270 120" stroke="#888" stroke-width="1.5" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: compute prefix sums -->
  <rect x="60" y="124" width="420" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="80" y="146" font-size="12" fill="#4a7a3a" font-weight="bold">② 求前缀和</text>
  <text x="270" y="156" text-anchor="middle" font-size="12.5" fill="#333">prefix[i] = nums[0]+…+nums[i−1]，prefix[0]=0</text>

  <path d="M 270 174 L 270 194" stroke="#888" stroke-width="1.5" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 3: iterate -->
  <rect x="60" y="198" width="420" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="80" y="220" font-size="12" fill="#a87020" font-weight="bold">③ 逐位套公式</text>
  <text x="270" y="240" text-anchor="middle" font-size="13" fill="#a87020" font-weight="bold">result[i] = total − 2·prefix[i] + (2i−n)·nums[i]</text>

  <path d="M 270 258 L 270 278" stroke="#888" stroke-width="1.5" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 4: return -->
  <rect x="60" y="282" width="420" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="80" y="304" font-size="12" fill="#b85450" font-weight="bold">④ 返回</text>
  <text x="270" y="310" text-anchor="middle" font-size="12.5" fill="#333">返回 result 数组</text>

  <!-- divider -->
  <path d="M 40 345 L 500 345" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Complexity box -->
  <rect x="80" y="360" width="380" height="84" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="384" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">复杂度</text>
  <text x="270" y="406" text-anchor="middle" font-size="12" fill="#333">时间 O(n)：两次线性扫描（求和 + 填结果）</text>
  <text x="270" y="426" text-anchor="middle" font-size="12" fill="#333">空间 O(n)：prefix 数组（可优化至 O(1)）</text>
</svg>
