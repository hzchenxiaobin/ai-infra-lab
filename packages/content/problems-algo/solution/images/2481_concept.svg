<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：一条直径 = 2 条分割线，一条半径 = 1 条分割线</text>

  <!-- ====== LEFT: diameter cut = 2 boundary lines ====== -->
  <circle cx="135" cy="150" r="62" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <!-- center dot -->
  <circle cx="135" cy="150" r="3" fill="#446688" filter="url(#rough2)"/>
  <!-- diameter (horizontal through center) -->
  <line x1="73" y1="150" x2="197" y2="150" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <!-- two boundary line dots at both ends -->
  <circle cx="73" cy="150" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="197" cy="150" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <!-- arrows pointing to the two boundary lines -->
  <path d="M 50 100 Q 60 120 70 144" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 50 200 Q 60 180 70 156" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="135" y="240" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">直径切割</text>
  <rect x="55" y="252" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="135" y="272" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">1 次切割 → 2 条分割线</text>

  <!-- ====== RIGHT: radius cut = 1 boundary line ====== -->
  <circle cx="405" cy="150" r="62" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <!-- center dot -->
  <circle cx="405" cy="150" r="3" fill="#d6a040" filter="url(#rough2)"/>
  <!-- radius (vertical from center up) -->
  <line x1="405" y1="150" x2="405" y2="88" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <!-- one boundary line dot at top end -->
  <circle cx="405" cy="88" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <!-- arrow pointing to the boundary line -->
  <path d="M 470 60 Q 440 70 410 84" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="405" y="240" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">半径切割</text>
  <rect x="325" y="252" width="160" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="405" y="272" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">1 次切割 → 1 条分割线</text>

  <!-- ====== BOTTOM: conclusion ====== -->
  <rect x="40" y="300" width="460" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="322" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">n 等分需 n 条分割线（从圆心出发等角分布，间隔 360°/n）</text>
  <text x="270" y="344" text-anchor="middle" font-size="11.5" fill="#333">最大化「直径（贡献 2 条）」可使切割次数最少；</text>
  <text x="270" y="362" text-anchor="middle" font-size="11.5" fill="#333">但等角分布要求对径成对 → 仅 n 为偶数时线才两两对径</text>
  <text x="270" y="380" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">n 偶 → n/2 条直径；n 奇 → n 条半径；n = 1 → 0</text>
</svg>
