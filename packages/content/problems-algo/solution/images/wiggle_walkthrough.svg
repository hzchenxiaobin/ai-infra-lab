<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [1, 17, 5, 10, 13, 15, 10, 5, 16, 8]</text>
  <text x="270" y="44" text-anchor="middle" font-size="10.5" fill="#888">初始 count = 1（首元素 1），prevDiff = 0</text>

  <!-- ===== header row ===== -->
  <rect x="30" y="56" width="480" height="26" fill="#446688" rx="4" filter="url(#rough2)"/>
  <text x="50" y="73" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">i</text>
  <text x="105" y="73" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">nums[i]</text>
  <text x="175" y="73" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">diff</text>
  <text x="260" y="73" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">prevDiff(前)</text>
  <text x="380" y="73" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">操作</text>
  <text x="490" y="73" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">count</text>

  <!-- ===== data rows ===== -->
  <!-- row height 28, start y=84 -->

  <!-- i=1: diff=+16, prevDiff=0, turn up, count=2 -->
  <rect x="30" y="84" width="480" height="28" fill="#e6f4ea" rx="3" filter="url(#rough2)"/>
  <text x="50" y="102" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="105" y="102" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">17</text>
  <text x="175" y="102" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+16</text>
  <text x="260" y="102" text-anchor="middle" font-size="11" fill="#555">0</text>
  <text x="310" y="102" font-size="11" fill="#4a7a3a" font-weight="bold">↑ 转升，count++</text>
  <text x="490" y="102" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- i=2: diff=-12, prevDiff=+, turn down, count=3 -->
  <rect x="30" y="112" width="480" height="28" fill="#fce4ec" rx="3" filter="url(#rough2)"/>
  <text x="50" y="130" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="105" y="130" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="175" y="130" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−12</text>
  <text x="260" y="130" text-anchor="middle" font-size="11" fill="#555">+</text>
  <text x="310" y="130" font-size="11" fill="#b85450" font-weight="bold">↓ 转降，count++</text>
  <text x="490" y="130" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>

  <!-- i=3: diff=+5, prevDiff=-, turn up, count=4 -->
  <rect x="30" y="140" width="480" height="28" fill="#e6f4ea" rx="3" filter="url(#rough2)"/>
  <text x="50" y="158" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="105" y="158" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">10</text>
  <text x="175" y="158" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+5</text>
  <text x="260" y="158" text-anchor="middle" font-size="11" fill="#555">−</text>
  <text x="310" y="158" font-size="11" fill="#4a7a3a" font-weight="bold">↑ 转升，count++</text>
  <text x="490" y="158" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4</text>

  <!-- i=4: diff=+3, prevDiff=+, same sign, skip -->
  <rect x="30" y="168" width="480" height="28" fill="#f5f5f5" rx="3" filter="url(#rough2)"/>
  <text x="50" y="186" text-anchor="middle" font-size="11" fill="#999">4</text>
  <text x="105" y="186" text-anchor="middle" font-size="11" fill="#999">13</text>
  <text x="175" y="186" text-anchor="middle" font-size="11" fill="#aaa">+3</text>
  <text x="260" y="186" text-anchor="middle" font-size="11" fill="#999">+</text>
  <text x="310" y="186" font-size="11" fill="#999">同号，跳过</text>
  <text x="490" y="186" text-anchor="middle" font-size="12" fill="#999">4</text>

  <!-- i=5: diff=+2, prevDiff=+, same sign, skip (peak 15) -->
  <rect x="30" y="196" width="480" height="28" fill="#f5f5f5" rx="3" filter="url(#rough2)"/>
  <text x="50" y="214" text-anchor="middle" font-size="11" fill="#999">5</text>
  <text x="105" y="214" text-anchor="middle" font-size="11" fill="#999">15</text>
  <text x="175" y="214" text-anchor="middle" font-size="11" fill="#aaa">+2</text>
  <text x="260" y="214" text-anchor="middle" font-size="11" fill="#999">+</text>
  <text x="310" y="214" font-size="11" fill="#999">同号，跳过（取峰 15）</text>
  <text x="490" y="214" text-anchor="middle" font-size="12" fill="#999">4</text>

  <!-- i=6: diff=-5, prevDiff=+, turn down, count=5 -->
  <rect x="30" y="224" width="480" height="28" fill="#fce4ec" rx="3" filter="url(#rough2)"/>
  <text x="50" y="242" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="105" y="242" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">10</text>
  <text x="175" y="242" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−5</text>
  <text x="260" y="242" text-anchor="middle" font-size="11" fill="#555">+</text>
  <text x="310" y="242" font-size="11" fill="#b85450" font-weight="bold">↓ 转降，count++</text>
  <text x="490" y="242" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">5</text>

  <!-- i=7: diff=-5, prevDiff=-, same sign, skip (valley 5) -->
  <rect x="30" y="252" width="480" height="28" fill="#f5f5f5" rx="3" filter="url(#rough2)"/>
  <text x="50" y="270" text-anchor="middle" font-size="11" fill="#999">7</text>
  <text x="105" y="270" text-anchor="middle" font-size="11" fill="#999">5</text>
  <text x="175" y="270" text-anchor="middle" font-size="11" fill="#aaa">−5</text>
  <text x="260" y="270" text-anchor="middle" font-size="11" fill="#999">−</text>
  <text x="310" y="270" font-size="11" fill="#999">同号，跳过（取谷 5）</text>
  <text x="490" y="270" text-anchor="middle" font-size="12" fill="#999">5</text>

  <!-- i=8: diff=+11, prevDiff=-, turn up, count=6 -->
  <rect x="30" y="280" width="480" height="28" fill="#e6f4ea" rx="3" filter="url(#rough2)"/>
  <text x="50" y="298" text-anchor="middle" font-size="11" fill="#333">8</text>
  <text x="105" y="298" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">16</text>
  <text x="175" y="298" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+11</text>
  <text x="260" y="298" text-anchor="middle" font-size="11" fill="#555">−</text>
  <text x="310" y="298" font-size="11" fill="#4a7a3a" font-weight="bold">↑ 转升，count++</text>
  <text x="490" y="298" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">6</text>

  <!-- i=9: diff=-8, prevDiff=+, turn down, count=7 -->
  <rect x="30" y="308" width="480" height="28" fill="#fce4ec" rx="3" filter="url(#rough2)"/>
  <text x="50" y="326" text-anchor="middle" font-size="11" fill="#333">9</text>
  <text x="105" y="326" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">8</text>
  <text x="175" y="326" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−8</text>
  <text x="260" y="326" text-anchor="middle" font-size="11" fill="#555">+</text>
  <text x="310" y="326" font-size="11" fill="#b85450" font-weight="bold">↓ 转降，count++</text>
  <text x="490" y="326" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">7</text>

  <!-- result -->
  <text x="270" y="352" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 9 步中 6 次方向反转 → count = 1 + 6 = 7，峰谷序列 [1,17,5,15,5,16,8]</text>
</svg>
