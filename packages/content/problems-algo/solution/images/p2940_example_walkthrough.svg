<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="410" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14.5" fill="#333" filter="url(#rough2)">示例 1 演算：heights = [6,4,8,5,2,7]（栈按下标从小到大书写）</text>

  <!-- 表格：x=26 w=468，表头 h=28，数据行 h=32 -->
  <rect x="26" y="48" width="468" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="59" y="66" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">查询</text>
  <text x="118" y="66" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(x,y)</text>
  <text x="163" y="66" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">情况</text>
  <text x="196" y="66" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">h</text>
  <text x="275" y="66" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">扫到 y 时的栈</text>
  <text x="384" y="66" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">栈上二分</text>
  <text x="461" y="66" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">答案</text>

  <path d="M 26 76 L 494 76" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 26 108 L 494 108" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 26 140 L 494 140" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 26 172 L 494 172" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 26 204 L 494 204" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 26 236 L 494 236" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <path d="M 92 48 L 92 236" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 144 48 L 144 236" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 182 48 L 182 236" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 210 48 L 210 236" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 340 48 L 340 236" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 428 48 L 428 236" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <!-- 行 1：[0,1] -->
  <text x="59" y="96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[0,1]</text>
  <text x="118" y="96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(0,1)</text>
  <text x="163" y="96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">③</text>
  <text x="196" y="96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <text x="275" y="96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[2:8]</text>
  <text x="384" y="96" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8 &gt; 6 → 2</text>
  <text x="461" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <!-- 行 2：[0,3] -->
  <text x="59" y="128" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[0,3]</text>
  <text x="118" y="128" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(0,3)</text>
  <text x="163" y="128" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">③</text>
  <text x="196" y="128" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <text x="275" y="128" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[4:2, 5:7]</text>
  <text x="384" y="128" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">首个 &gt; 6 是 5</text>
  <text x="461" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">5</text>

  <!-- 行 3：[2,4] -->
  <text x="59" y="160" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[2,4]</text>
  <text x="118" y="160" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(2,4)</text>
  <text x="163" y="160" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">③</text>
  <text x="196" y="160" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>
  <text x="275" y="160" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[5:7]</text>
  <text x="384" y="160" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7 ≤ 8 → 无</text>
  <text x="461" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">−1</text>

  <!-- 行 4：[3,4] -->
  <text x="59" y="192" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[3,4]</text>
  <text x="118" y="192" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(3,4)</text>
  <text x="163" y="192" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">③</text>
  <text x="196" y="192" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="275" y="192" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[5:7]</text>
  <text x="384" y="192" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7 &gt; 5 → 5</text>
  <text x="461" y="192" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">5</text>

  <!-- 行 5：[2,2] -->
  <text x="59" y="224" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[2,2]</text>
  <text x="118" y="224" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(2,2)</text>
  <text x="163" y="224" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">①</text>
  <text x="196" y="224" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <text x="275" y="224" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">（特判，不入桶）</text>
  <text x="384" y="224" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">—</text>
  <text x="461" y="224" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">2</text>

  <!-- 栈演化 -->
  <text x="260" y="264" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">栈的演化（i 从 5 扫到 0，括号内为 下标:高度）：</text>
  <text x="260" y="284" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[5:7] → [4:2, 5:7] → [3:5, 5:7] → [2:8] → [1:4, 2:8] → [0:6, 2:8]</text>

  <!-- 底部要点 -->
  <rect x="30" y="300" width="460" height="90" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="44" y="322" font-size="10.5" fill="#333" filter="url(#rough2)">要点① 可见性随视角变：y=3 看 5(7) 可见；y=1 看被 2(8) 挡住 → 必须按 y 离线</text>
  <text x="44" y="344" font-size="10.5" fill="#333" filter="url(#rough2)">要点② [2,4]：h=8 是全场最高，栈仅 [5:7]，7 ≤ 8 → 无人能接 → −1</text>
  <text x="44" y="366" font-size="10.5" fill="#333" filter="url(#rough2)">要点③ [0,3]：栈 [4:2, 5:7] 中 4(2) 被 2≤6 跳过，首个 &gt; 6 的是 5</text>
  <text x="44" y="384" font-size="10" fill="#b85450" filter="url(#rough2)">（情况①② 的查询在预处理时就写好答案，不进入扫描流程）</text>
</svg>
