<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：两个出现位掩码相与 → 最高置位即「最好」字母</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#999">例 s = "arRAzFif"：小写 a/f/i/r/z，大写 A/F/R</text>

  <!-- ===== letter ruler A..Z, 26 cells width 16 ===== -->
  <g filter="url(#rough2)">
    <rect x="110" y="62" width="416" height="20" fill="#f0f0f0" stroke="#cccccc" stroke-width="1"/>
  </g>
  <!-- letters -->
  <g font-size="10.5" fill="#888" text-anchor="middle">
    <text x="118" y="76">A</text><text x="134" y="76">B</text><text x="150" y="76">C</text><text x="166" y="76">D</text>
    <text x="182" y="76">E</text><text x="198" y="76">F</text><text x="214" y="76">G</text><text x="230" y="76">H</text>
    <text x="246" y="76">I</text><text x="262" y="76">J</text><text x="278" y="76">K</text><text x="294" y="76">L</text>
    <text x="310" y="76">M</text><text x="326" y="76">N</text><text x="342" y="76">O</text><text x="358" y="76">P</text>
    <text x="374" y="76">Q</text><text x="390" y="76" fill="#4a7a3a" font-weight="bold">R</text><text x="406" y="76">S</text>
    <text x="422" y="76">T</text><text x="438" y="76">U</text><text x="454" y="76">V</text><text x="470" y="76">W</text>
    <text x="486" y="76">X</text><text x="502" y="76">Y</text><text x="518" y="76">Z</text>
  </g>

  <!-- ===== lower_mask row: bits 0,5,8,17,25 ===== -->
  <rect x="110" y="92" width="416" height="26" fill="#f0f0f0" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="110" y="92" width="16" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="190" y="92" width="16" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="238" y="92" width="16" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="382" y="92" width="16" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="510" y="92" width="16" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="104" y="109" text-anchor="end" font-size="11.5" fill="#446688" font-weight="bold">lower</text>

  <!-- ===== upper_mask row: bits 0,5,17 ===== -->
  <rect x="110" y="128" width="416" height="26" fill="#f0f0f0" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="110" y="128" width="16" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="190" y="128" width="16" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <rect x="382" y="128" width="16" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="104" y="145" text-anchor="end" font-size="11.5" fill="#d6a040" font-weight="bold">upper</text>

  <!-- AND arrow -->
  <line x1="280" y1="156" x2="280" y2="180" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="172" font-size="11" fill="#888" font-weight="bold">lower &amp; upper</text>

  <!-- ===== both row: bits 0,5,17 ; R(17) highlighted green as highest ===== -->
  <rect x="110" y="184" width="416" height="28" fill="#f0f0f0" stroke="#cccccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="110" y="184" width="16" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
  <rect x="190" y="184" width="16" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="2" filter="url(#rough2)"/>
  <rect x="382" y="184" width="16" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="2" filter="url(#rough2)"/>
  <text x="104" y="203" text-anchor="end" font-size="11.5" fill="#4a7a3a" font-weight="bold">both</text>

  <!-- highlight band over R column -->
  <rect x="376" y="58" width="28" height="158" fill="#4a7a3a" fill-opacity="0.07"/>
  <!-- arrow from R(both) down to answer -->
  <line x1="390" y1="214" x2="390" y2="244" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="234" font-size="10.5" fill="#4a7a3a" font-weight="bold">最高置位</text>

  <!-- answer box -->
  <rect x="200" y="248" width="380" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="390" y="274" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold">最高置位 = bit 17 → 字母 'R' → 返回 "R"</text>

  <!-- footnote -->
  <text x="280" y="312" text-anchor="middle" font-size="11" fill="#555">both 的每个 1 = 该字母大小写都在 s 中出现；取「最大下标」即字母表最靠后 = 最好</text>

  <!-- bottom comparison box -->
  <rect x="40" y="328" width="480" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="350" font-size="11" fill="#b85450" font-weight="bold">A(bit0) 与 F(bit5) 同样「兼具大小写」，但 bit17 &gt; bit5 &gt; bit0</text>
  <text x="56" y="370" font-size="11" fill="#b85450" font-weight="bold">→ 字母表越靠后越「好」，故最高置位 = 最好字母</text>
</svg>
