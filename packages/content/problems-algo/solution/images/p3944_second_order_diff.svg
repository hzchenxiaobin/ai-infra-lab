<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="24" y="28" font-size="16" fill="#333" filter="url(#rough2)">观察三：帐篷函数 + 二阶差分，O(n+k) 建整张代价表</text>

  <!-- ============ 左 panel：帐篷函数 ============ -->
  <text x="157" y="54" font-size="12.5" fill="#446688" text-anchor="middle" filter="url(#rough2)">k = 7 时单个余数 r 的 dist(r, t)（t 顺时针绕一圈）</text>

  <!-- 坐标轴 -->
  <line x1="56" y1="140" x2="56" y2="252" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="56" y1="252" x2="262" y2="252" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="48" y="256" font-size="10" fill="#888" text-anchor="end" filter="url(#rough2)">0</text>
  <text x="48" y="224" font-size="10" fill="#888" text-anchor="end" filter="url(#rough2)">1</text>
  <text x="48" y="192" font-size="10" fill="#888" text-anchor="end" filter="url(#rough2)">2</text>
  <text x="48" y="160" font-size="10" fill="#888" text-anchor="end" filter="url(#rough2)">3</text>

  <!-- 帐篷折线 -->
  <polyline points="64,252 95,220 126,188 157,156 188,156 219,188 250,220"
            fill="none" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>

  <!-- 斜率标注 -->
  <text x="82" y="233" font-size="10" fill="#888" filter="url(#rough2)">+1</text>
  <text x="113" y="201" font-size="10" fill="#888" filter="url(#rough2)">+1</text>
  <text x="144" y="169" font-size="10" fill="#888" filter="url(#rough2)">+1</text>
  <text x="171" y="149" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <text x="206" y="169" font-size="10" fill="#888" filter="url(#rough2)">−1</text>
  <text x="237" y="201" font-size="10" fill="#888" filter="url(#rough2)">−1</text>

  <!-- 数据点 -->
  <circle cx="64" cy="252" r="4" fill="#d6a040" filter="url(#rough2)"/>
  <circle cx="95" cy="220" r="5.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="126" cy="188" r="4" fill="#446688" filter="url(#rough2)"/>
  <circle cx="157" cy="156" r="4" fill="#446688" filter="url(#rough2)"/>
  <circle cx="188" cy="156" r="5.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="219" cy="188" r="5.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="250" cy="220" r="4" fill="#446688" filter="url(#rough2)"/>

  <!-- 锚点标签 -->
  <text x="95" y="245" font-size="11.5" font-weight="bold" fill="#4a7a3a" text-anchor="middle" filter="url(#rough2)">+2c</text>
  <text x="197" y="144" font-size="11.5" font-weight="bold" fill="#b85450" text-anchor="middle" filter="url(#rough2)">−c</text>
  <text x="233" y="181" font-size="11.5" font-weight="bold" fill="#b85450" text-anchor="middle" filter="url(#rough2)">−c</text>

  <!-- x 轴刻度 -->
  <text x="64" y="270" font-size="10.5" fill="#666" text-anchor="middle" filter="url(#rough2)">r</text>
  <text x="95" y="270" font-size="10.5" fill="#666" text-anchor="middle" filter="url(#rough2)">r+1</text>
  <text x="126" y="270" font-size="10.5" fill="#666" text-anchor="middle" filter="url(#rough2)">r+2</text>
  <text x="157" y="270" font-size="10.5" fill="#666" text-anchor="middle" filter="url(#rough2)">r+3</text>
  <text x="188" y="270" font-size="10.5" fill="#666" text-anchor="middle" filter="url(#rough2)">r+4</text>
  <text x="219" y="270" font-size="10.5" fill="#666" text-anchor="middle" filter="url(#rough2)">r+5</text>
  <text x="250" y="270" font-size="10.5" fill="#666" text-anchor="middle" filter="url(#rough2)">r+6</text>

  <!-- 回绕箭头 -->
  <path d="M 246 280 Q 157 302 70 280" fill="none" stroke="#999" stroke-width="1.4"
        stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="157" y="302" font-size="10" fill="#888" text-anchor="middle" filter="url(#rough2)">回绕 mod k（斜率仍 −1）</text>

  <!-- 图例 -->
  <circle cx="70" cy="320" r="4.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="80" y="324" font-size="10.5" fill="#555" filter="url(#rough2)">谷底拐弯（斜率 −1 → +1）：dd[r+1] += 2c</text>
  <circle cx="70" cy="340" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <text x="80" y="344" font-size="10.5" fill="#555" filter="url(#rough2)">平台两端（+1→0、0→−1）：各 −c（k 偶则合并 −2c）</text>

  <!-- 左 panel 底注 -->
  <rect x="24" y="358" width="262" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="155" y="373" font-size="10.5" fill="#7a5c1e" text-anchor="middle" filter="url(#rough2)">每个余数只改 O(1) 个 dd 锚点，</text>
  <text x="155" y="387" font-size="10.5" fill="#7a5c1e" text-anchor="middle" filter="url(#rough2)">锚点总数 ≤ O(不同余数个数) ≤ O(n)</text>

  <!-- ============ 右 panel：批量流水线 ============ -->
  <text x="424" y="54" font-size="12.5" fill="#446688" text-anchor="middle" filter="url(#rough2)">整表批量计算流水线</text>

  <rect x="306" y="66" width="236" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="424" y="82" font-size="11" fill="#8a3a36" text-anchor="middle" filter="url(#rough2)">朴素建表：每个元素 × 每个 t</text>
  <text x="424" y="97" font-size="11" fill="#8a3a36" text-anchor="middle" filter="url(#rough2)">逐格累加 —— O(n·k) ✗</text>
  <line x1="316" y1="72" x2="530" y2="102" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>

  <line x1="424" y1="106" x2="424" y2="116" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="306" y="120" width="236" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="424" y="140" font-size="11.5" fill="#33475e" text-anchor="middle" filter="url(#rough2)">① cnt[r] 余数计数（O(n)）</text>

  <line x1="424" y1="152" x2="424" y2="162" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="306" y="166" width="236" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="424" y="186" font-size="11.5" fill="#33475e" text-anchor="middle" filter="url(#rough2)">② 每个余数放 O(1) 个锚点 → dd[]</text>

  <line x1="424" y1="198" x2="424" y2="208" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="306" y="212" width="236" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="424" y="232" font-size="11.5" fill="#33475e" text-anchor="middle" filter="url(#rough2)">③ 前缀和①：dd → Δcost（斜率）</text>

  <line x1="424" y1="244" x2="424" y2="254" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="306" y="258" width="236" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="424" y="278" font-size="11.5" fill="#33475e" text-anchor="middle" filter="url(#rough2)">④ 前缀和②：Δcost → cost[0..k−1]</text>

  <line x1="424" y1="290" x2="424" y2="300" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="306" y="304" width="236" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="424" y="322" font-size="11.5" fill="#2e4d24" text-anchor="middle" filter="url(#rough2)">种子 cost[0]、Δcost[0] 直接算，</text>
  <text x="424" y="338" font-size="11.5" fill="#2e4d24" text-anchor="middle" filter="url(#rough2)">整张代价表 O(n+k) 到手 ✓</text>

  <text x="424" y="372" font-size="10.5" fill="#888" text-anchor="middle" filter="url(#rough2)">两张表：evenCost、oddCost 各建一次</text>
</svg>
