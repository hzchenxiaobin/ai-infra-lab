<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="16.5" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：往返传球 = 周期 2(n−1) 的三角波（n = 5）</text>

  <!-- 孩子一排 -->
  <rect x="76" y="42" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="104" y="59" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">孩子 0</text>
  <rect x="144" y="42" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="172" y="59" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">孩子 1</text>
  <rect x="212" y="42" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="59" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">孩子 2</text>
  <rect x="280" y="42" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="308" y="59" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">孩子 3</text>
  <rect x="348" y="42" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="376" y="59" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">孩子 4</text>

  <!-- 去程 / 回程底色 -->
  <rect x="80" y="122" width="160" height="168" fill="#e6f4ea" opacity="0.45" filter="url(#rough2)"/>
  <rect x="240" y="122" width="160" height="168" fill="#fff8e1" opacity="0.6" filter="url(#rough2)"/>

  <!-- 纵轴虚线网格 -->
  <path d="M 62 130 L 492 130" stroke="#d8d8d8" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <path d="M 62 170 L 492 170" stroke="#d8d8d8" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <path d="M 62 210 L 492 210" stroke="#d8d8d8" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <path d="M 62 250 L 492 250" stroke="#d8d8d8" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <path d="M 62 290 L 492 290" stroke="#b0b0b0" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="56" y="134" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">4</text>
  <text x="56" y="174" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="56" y="214" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="56" y="254" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="56" y="294" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="66" y="118" font-size="11" fill="#888" filter="url(#rough2)">纵轴 = 拿球孩子的编号</text>

  <!-- 时间刻度 -->
  <text x="80" y="306" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="120" y="306" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="160" y="306" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="200" y="306" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="240" y="306" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">4</text>
  <text x="280" y="306" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">5</text>
  <text x="320" y="306" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">6</text>
  <text x="360" y="306" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">7</text>
  <text x="400" y="306" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">8</text>
  <text x="440" y="306" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">9</text>
  <text x="480" y="306" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">10</text>
  <text x="496" y="306" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">t(秒)</text>

  <!-- 三角波轨迹：一个周期 -->
  <path d="M 80 290 L 120 250 L 160 210 L 200 170 L 240 130 L 280 170 L 320 210 L 360 250 L 400 290"
        stroke="#446688" stroke-width="2.4" fill="none" filter="url(#rough2)"/>
  <!-- 下一个周期（重放，红色虚线） -->
  <path d="M 400 290 L 440 250 L 480 210"
        stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" fill="none" filter="url(#rough2)"/>

  <!-- 轨迹点 -->
  <circle cx="80" cy="290" r="4" fill="#446688" filter="url(#rough2)"/>
  <circle cx="120" cy="250" r="4" fill="#446688" filter="url(#rough2)"/>
  <circle cx="160" cy="210" r="4" fill="#446688" filter="url(#rough2)"/>
  <circle cx="200" cy="170" r="4" fill="#446688" filter="url(#rough2)"/>
  <circle cx="240" cy="130" r="4.5" fill="#d6a040" filter="url(#rough2)"/>
  <circle cx="280" cy="170" r="4" fill="#446688" filter="url(#rough2)"/>
  <circle cx="320" cy="210" r="4" fill="#446688" filter="url(#rough2)"/>
  <circle cx="360" cy="250" r="4" fill="#446688" filter="url(#rough2)"/>
  <circle cx="400" cy="290" r="4.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="440" cy="250" r="4" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="480" cy="210" r="4" fill="#b85450" filter="url(#rough2)"/>

  <!-- 分段标注 -->
  <text x="160" y="152" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">去程：位置 = t</text>
  <text x="240" y="96" text-anchor="middle" font-size="11.5" fill="#8a6a20" filter="url(#rough2)">到达右端 n−1，折返！</text>
  <path d="M 240 104 C 240 116, 240 120, 240 126" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="152" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">回程：位置 = T − t</text>
  <text x="452" y="168" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">t ≥ 8：下一周期</text>
  <text x="452" y="184" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">完全重放 ↺</text>

  <!-- 周期大括号 -->
  <path d="M 80 314 C 80 322, 82 324, 90 324 L 390 324 C 398 324, 400 322, 400 314"
        stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="240" y="344" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">周期 T = 2(n−1) = 8：球回到孩子 0，方向复原 → p(k) = p(k mod T)</text>
</svg>
