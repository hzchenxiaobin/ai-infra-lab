<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrup" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 8 0 L 0 4 L 8 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">归并排序：递归对半切分 → 合并两个有序段</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">分治：先排左半、再排右半，最后用双指针线性合并（稳定，最坏仍 O(n log n)）</text>

  <!-- ===== Top: split phase (divide) ===== -->
  <text x="30" y="74" font-size="11" fill="#446688" font-weight="bold">① 分（Divide）—— 递归对半切</text>

  <!-- level 0: full array -->
  <rect x="180" y="84" width="200" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="103" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">[5,2,3,1]  (n=4)</text>

  <!-- split arrows -->
  <path d="M 250 112 L 200 132" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 310 112 L 360 132" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- level 1 -->
  <rect x="120" y="136" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="165" y="154" text-anchor="middle" font-size="10" fill="#446688">[5,2]</text>
  <rect x="330" y="136" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="375" y="154" text-anchor="middle" font-size="10" fill="#446688">[3,1]</text>

  <!-- split arrows -->
  <path d="M 150 162 L 120 182" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 180 162 L 210 182" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 360 162 L 330 182" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 390 162 L 420 182" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- level 2: singletons -->
  <rect x="100" y="186" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="203" text-anchor="middle" font-size="10" fill="#333">[5]</text>
  <rect x="190" y="186" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="203" text-anchor="middle" font-size="10" fill="#333">[2]</text>
  <rect x="310" y="186" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="330" y="203" text-anchor="middle" font-size="10" fill="#333">[3]</text>
  <rect x="400" y="186" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="420" y="203" text-anchor="middle" font-size="10" fill="#333">[1]</text>

  <!-- ===== Bottom: merge phase (conquer) ===== -->
  <text x="30" y="230" font-size="11" fill="#b85450" font-weight="bold">② 治（Conquer）—— 双指针合并两个有序段</text>

  <!-- merge arrows up -->
  <path d="M 120 214 L 150 234" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arrup)" filter="url(#rough2)"/>
  <path d="M 210 214 L 180 234" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arrup)" filter="url(#rough2)"/>
  <path d="M 330 214 L 360 234" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arrup)" filter="url(#rough2)"/>
  <path d="M 420 214 L 390 234" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arrup)" filter="url(#rough2)"/>

  <!-- level 1 merged -->
  <rect x="120" y="238" width="90" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="165" y="256" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">[2,5]</text>
  <rect x="330" y="238" width="90" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="375" y="256" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">[1,3]</text>

  <!-- merge arrows -->
  <path d="M 200 264 L 250 284" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arrup)" filter="url(#rough2)"/>
  <path d="M 360 264 L 310 284" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arrup)" filter="url(#rough2)"/>

  <!-- level 0 merged -->
  <rect x="180" y="288" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="308" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">[1,2,3,5]  ✓</text>

  <!-- ===== Merge detail box ===== -->
  <text x="30" y="340" font-size="11" fill="#446688" font-weight="bold">③ 合并细节：i 指左半、j 指右半，取较小者写入 tmp</text>

  <rect x="30" y="350" width="500" height="80" fill="#f6f6f6" stroke="#aaa" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="50" y="372" font-size="10" fill="#446688" font-weight="bold">左半 [2,5]</text>
  <rect x="50" y="378" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="70" y="395" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="94" y="378" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="114" y="395" text-anchor="middle" font-size="10" fill="#333">5</text>
  <text x="70" y="416" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">i ↓</text>

  <text x="200" y="372" font-size="10" fill="#b85450" font-weight="bold">右半 [1,3]</text>
  <rect x="200" y="378" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="220" y="395" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="244" y="378" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="264" y="395" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="220" y="416" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">j ↓</text>

  <text x="320" y="372" font-size="10" fill="#4a7a3a" font-weight="bold">→ tmp</text>
  <rect x="320" y="378" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="340" y="395" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="340" y="416" text-anchor="middle" font-size="9" fill="#888">2&lt;5 取左? 否，1&lt;2 取右</text>

  <text x="380" y="372" font-size="9" fill="#888">相等时取左半</text>
  <text x="380" y="386" font-size="9" fill="#888">→ 保证稳定性</text>
</svg>
