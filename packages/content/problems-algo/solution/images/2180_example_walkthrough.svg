<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：num = 30 与 num = 4</text>

  <!-- ===== Example 1: num = 30 ===== -->
  <text x="280" y="54" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">例 1：num = 30 → q=3, r=0, p=digit_sum(3)=1（奇）</text>

  <!-- full blocks row: [0..9][10..19][20..29] -->
  <text x="40" y="92" font-size="10.5" fill="#888">完整块</text>
  <rect x="80" y="76" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="140" y="96" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[0..9] → 5</text>
  <rect x="210" y="76" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="270" y="96" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[10..19] → 5</text>
  <rect x="340" y="76" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="400" y="96" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[20..29] → 5</text>
  <text x="478" y="96" font-size="11" fill="#4a7a3a" font-weight="bold">full=15</text>

  <!-- tail row: [30..30] -->
  <text x="40" y="132" font-size="10.5" fill="#888">尾部</text>
  <rect x="80" y="116" width="60" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="110" y="136" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">30</text>
  <text x="110" y="158" text-anchor="middle" font-size="9.5" fill="#b85450">ds=3 奇</text>
  <text x="160" y="136" font-size="10.5" fill="#888">p=1 → 数 d∈[0,0] 中奇数个数 = (0+1)//2 = 0</text>
  <text x="478" y="136" font-size="11" fill="#b85450" font-weight="bold">tail=0</text>

  <!-- combine -->
  <path d="M 280 164 L 280 184" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="188" width="320" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="208" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">f(30) = 15 + 0 = 15 → ans = 15 − 1 = 14 ✓</text>

  <!-- divider -->
  <line x1="40" y1="236" x2="520" y2="236" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Example 2: num = 4 ===== -->
  <text x="280" y="262" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">例 2：num = 4 → q=0, r=4, p=digit_sum(0)=0（偶）</text>

  <!-- full blocks: none -->
  <text x="40" y="300" font-size="10.5" fill="#888">完整块</text>
  <rect x="80" y="284" width="120" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" stroke-dasharray="3 2" rx="4" filter="url(#rough2)"/>
  <text x="140" y="304" text-anchor="middle" font-size="11" fill="#aaa" font-weight="bold">无完整块</text>
  <text x="220" y="304" font-size="10.5" fill="#888">q=0 → full = 0</text>
  <text x="478" y="304" font-size="11" fill="#4a7a3a" font-weight="bold">full=0</text>

  <!-- tail: [0..4] -->
  <text x="40" y="346" font-size="10.5" fill="#888">尾部</text>
  <!-- 0..4, even ds: 0,2,4 (p=0 even, d even) -->
  <rect x="80" y="328" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="100" y="348" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="120" y="328" width="40" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="140" y="348" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">1</text>
  <rect x="160" y="328" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="180" y="348" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="200" y="328" width="40" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="348" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">3</text>
  <rect x="240" y="328" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="348" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <text x="300" y="344" font-size="10.5" fill="#888">p=0 → 数 d∈[0,4]</text>
  <text x="300" y="358" font-size="10.5" fill="#888">中偶数个数 = 4//2+1 = 3</text>
  <text x="478" y="348" font-size="11" fill="#4a7a3a" font-weight="bold">tail=3</text>

  <!-- combine -->
  <rect x="120" y="372" width="320" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="280" y="387" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">f(4) = 0 + 3 = 3 → ans = 3 − 1 = 2 ✓</text>
</svg>
