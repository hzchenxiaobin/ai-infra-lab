<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="340" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：root = [5,10,10,null,null,2,3]，S = 30，target = 15</text>

  <!-- 表头 -->
  <rect x="30" y="48" width="80" height="34" fill="#446688" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="70" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">后序序</text>

  <rect x="110" y="48" width="120" height="34" fill="#446688" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="70" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">访问节点</text>

  <rect x="230" y="48" width="110" height="34" fill="#446688" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="285" y="70" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">子树和</text>

  <rect x="340" y="48" width="170" height="34" fill="#446688" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="425" y="70" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">== target(15)?</text>

  <!-- 行 1: 左 10 -->
  <rect x="30" y="82" width="80" height="34" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="104" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="110" y="82" width="120" height="34" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="170" y="104" text-anchor="middle" font-size="12" fill="#333">10（左叶）</text>
  <rect x="230" y="82" width="110" height="34" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="285" y="104" text-anchor="middle" font-size="12" fill="#333">10</text>
  <rect x="340" y="82" width="170" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="425" y="104" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗（10 ≠ 15）</text>

  <!-- 行 2: 2 -->
  <rect x="30" y="116" width="80" height="34" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="138" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="110" y="116" width="120" height="34" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="170" y="138" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="230" y="116" width="110" height="34" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="285" y="138" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="340" y="116" width="170" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="425" y="138" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗（2 ≠ 15）</text>

  <!-- 行 3: 3 -->
  <rect x="30" y="150" width="80" height="34" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="172" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="110" y="150" width="120" height="34" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="170" y="172" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="230" y="150" width="110" height="34" fill="#fff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="285" y="172" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="340" y="150" width="170" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="425" y="172" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗（3 ≠ 15）</text>

  <!-- 行 4: 右 10 (命中!) -->
  <rect x="30" y="184" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="206" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="110" y="184" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="206" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">10（右内）</text>
  <rect x="230" y="184" width="110" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="285" y="206" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">10+2+3 = 15</text>
  <rect x="340" y="184" width="170" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="425" y="206" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 命中 → 返回 true</text>

  <!-- 行 5: 根 5 (跳过) -->
  <rect x="30" y="218" width="80" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="70" y="240" text-anchor="middle" font-size="12" fill="#888">5</text>
  <rect x="110" y="218" width="120" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="170" y="240" text-anchor="middle" font-size="12" fill="#888">5（根，is_root）</text>
  <rect x="230" y="218" width="110" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="285" y="240" text-anchor="middle" font-size="12" fill="#888">30（整树）</text>
  <rect x="340" y="218" width="170" height="34" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="425" y="240" text-anchor="middle" font-size="12" fill="#888">— 跳过（不能删根上方的边）</text>

  <!-- 结论框 -->
  <rect x="30" y="270" width="480" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="292" font-size="12" fill="#333" font-weight="bold">关键观察：</text>
  <text x="50" y="312" font-size="11" fill="#555">删一条边 ⟺ 取出某棵「真子树」（非整树）。该子树和 = target 时，剩余部分和 = S − target = S/2 = target，两半相等。</text>
</svg>
