<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 396" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="396" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：一切拿法都折算成「到站位的步数」</text>

  <!-- Alice marker -->
  <text x="214" y="48" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Alice 站 p=2</text>
  <path d="M 214 52 L 214 60" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- cells: values [0,1,1,0,0,1,0], w=44, x=100+46i, y=64 -->
  <rect x="100" y="64" width="44" height="36" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="122" y="87" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">0</text>

  <rect x="146" y="64" width="44" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="168" y="87" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="192" y="64" width="44" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="214" y="87" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="238" y="64" width="44" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="260" y="87" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">0</text>

  <rect x="284" y="64" width="44" height="36" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="306" y="87" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">0</text>

  <rect x="330" y="64" width="44" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="352" y="87" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="376" y="64" width="44" height="36" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="398" y="87" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">0</text>

  <!-- index labels -->
  <text x="80" y="116" font-size="10" fill="#888" filter="url(#rough2)">下标</text>
  <text x="122" y="116" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="168" y="116" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="214" y="116" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="260" y="116" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="306" y="116" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>
  <text x="352" y="116" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">5</text>
  <text x="398" y="116" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">6</text>

  <!-- price tags -->
  <text x="168" y="140" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">1 步</text>
  <text x="214" y="140" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0 步</text>
  <text x="260" y="140" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">造 1 → 2 步</text>
  <text x="352" y="140" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">d=3 → 3 步</text>

  <!-- legend boxes 2x2 -->
  <rect x="36" y="160" width="220" height="54" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="146" y="182" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">脚下的 1：0 步</text>
  <text x="146" y="200" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">开局站上去自动拾起，不算行动</text>

  <rect x="264" y="160" width="220" height="54" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="374" y="182" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">相邻的 1：1 步</text>
  <text x="374" y="200" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">一次交换直接换到手里</text>

  <rect x="36" y="232" width="220" height="54" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="146" y="254" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">造一个 1（change）：2 步</text>
  <text x="146" y="272" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">隔壁空位造 1 步 + 换入 1 步</text>

  <rect x="264" y="232" width="220" height="54" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="374" y="254" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">距离 d 的 1：d 步</text>
  <text x="374" y="272" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">一次交换挪一格，共挪 d 次</text>

  <!-- formula box -->
  <rect x="60" y="310" width="400" height="66" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="338" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">统一记价：总步数 = Σ|x − p| + 2 × c</text>
  <text x="260" y="360" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">c = 造 1 的个数（≤ maxChanges）；p 取「被拿走的 1」的中位数最省</text>
</svg>
