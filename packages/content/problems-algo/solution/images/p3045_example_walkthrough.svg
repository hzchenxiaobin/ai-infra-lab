<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：words = ["a","aba","ababa","aa"] → 4</text>

  <!-- table frame -->
  <rect x="20" y="40" width="520" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="20" y1="40" x2="540" y2="40" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="56" y="57" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">单词</text>
  <text x="192" y="57" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">配对路径（复合字符）</text>
  <text x="350" y="57" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">沿途 cnt 求和</text>
  <text x="435" y="57" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">ans</text>
  <text x="501" y="57" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">终点登记</text>

  <rect x="20" y="66" width="520" height="176" fill="#ffffff" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="92" y1="40" x2="92" y2="242" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="292" y1="40" x2="292" y2="242" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="408" y1="40" x2="408" y2="242" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="462" y1="40" x2="462" y2="242" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="20" y1="110" x2="540" y2="110" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="20" y1="154" x2="540" y2="154" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="20" y1="198" x2="540" y2="198" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- row 1 -->
  <text x="56" y="92" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">"a"</text>
  <text x="192" y="92" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">root → (a,a)</text>
  <text x="350" y="92" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="435" y="92" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="501" y="92" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">(a,a): 0→1</text>

  <!-- row 2 -->
  <text x="56" y="136" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">"aba"</text>
  <text x="192" y="136" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">root → (a,a) → (b,b)</text>
  <text x="350" y="136" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0 + 1</text>
  <text x="435" y="136" text-anchor="middle" font-size="11.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="501" y="136" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">(b,b): 0→1</text>

  <!-- row 3 -->
  <text x="56" y="180" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">"ababa"</text>
  <text x="192" y="180" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">root → (a,a) → (b,b) → (a,a)</text>
  <text x="350" y="180" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1 + 1 + 0</text>
  <text x="435" y="180" text-anchor="middle" font-size="11.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="501" y="180" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">新节点: 0→1</text>

  <!-- row 4 -->
  <text x="56" y="224" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">"aa"</text>
  <text x="192" y="224" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">root → (a,a)</text>
  <text x="350" y="224" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="435" y="224" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="501" y="224" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">(a,a): 1→2</text>

  <!-- note -->
  <rect x="20" y="256" width="520" height="70" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="280" y="276" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">💡 新增对：第 2 行 +1 ⇒ (0,1)；第 3 行 +2 ⇒ (0,2)、(1,2)；第 4 行 +1 ⇒ (0,3)，累计 4 ✓</text>
  <text x="280" y="294" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">「ababa」第三层是新节点（cnt=0 不贡献）——同一复合字符 (a,a) 在不同深度是不同节点；</text>
  <text x="280" y="312" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">「aa」与「a」同停深 1 的 (a,a)，故直接吃到 cnt=1；插入后 cnt 涨到 2，供后续更长的词吃</text>
</svg>
