<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="540" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：网格版堆优化 Dijkstra</text>

  <!-- start -->
  <rect x="240" y="34" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="14" filter="url(#rough2)"/>
  <text x="290" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">开始</text>
  <path d="M 290 62 L 290 76" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="170" y="78" width="220" height="32" fill="#ffffff" stroke="#666" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="280" y="98" text-anchor="middle" font-size="10.5" fill="#333">dist[0][0] = 0；堆放 (0, 0, 0)</text>
  <path d="M 280 110 L 280 124" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 1: heap empty? -->
  <polygon points="222,152 280,126 338,152 280,178" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="157" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold">堆空 ?</text>
  <path d="M 338 152 L 366 152" stroke="#999" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="352" y="145" font-size="9" fill="#999">是</text>
  <rect x="368" y="138" width="178" height="28" fill="#f6f6f6" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="457" y="156" text-anchor="middle" font-size="9.5" fill="#888">返回 -1（本题不发生）</text>
  <path d="M 280 178 L 280 192" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="190" font-size="9" fill="#666">否</text>

  <!-- pop min -->
  <rect x="170" y="194" width="220" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="214" text-anchor="middle" font-size="10.5" fill="#333">弹出堆顶 (d, x, y)（时间最小）</text>
  <path d="M 280 226 L 280 240" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 2: stale? -->
  <polygon points="205,268 280,242 355,268 280,294" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="272" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold">d &gt; dist[x][y] ?</text>
  <path d="M 205 268 L 177 268" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="190" y="260" font-size="9" fill="#b85450">是</text>
  <rect x="60" y="254" width="115" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="117" y="272" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">懒删除，跳过</text>
  <!-- lazy-delete loop back to diamond 1 -->
  <path d="M 117 254 L 117 152 L 218 152" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arr)" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <path d="M 280 294 L 280 308" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="306" font-size="9" fill="#666">否</text>

  <!-- diamond 3: target? -->
  <polygon points="210,336 280,310 350,336 280,362" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="341" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold">(x, y) 是终点 ?</text>
  <path d="M 350 336 L 380 336" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="362" y="328" font-size="9" fill="#4a7a3a">是</text>
  <rect x="382" y="322" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="442" y="340" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回 d ✓</text>
  <path d="M 280 362 L 280 376" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="374" font-size="9" fill="#666">否</text>

  <!-- relax -->
  <rect x="95" y="378" width="370" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="392" text-anchor="middle" font-size="10" fill="#333">枚举四方向邻居 (nx, ny)</text>
  <text x="280" y="407" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">nd = max(d, moveTime[nx][ny]) + 1</text>
  <path d="M 280 414 L 280 428" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond 4: improve? -->
  <polygon points="200,456 280,430 360,456 280,482" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="461" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold">nd &lt; dist[nx][ny] ?</text>
  <path d="M 360 456 L 390 456" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="371" y="448" font-size="9" fill="#4a7a3a">是</text>
  <rect x="392" y="442" width="150" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="467" y="460" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">dist 更新，入堆</text>

  <!-- push loop back to pop -->
  <path d="M 467 442 L 467 510 L 30 510 L 30 210 L 166 210" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="250" y="504" font-size="9.5" fill="#446688" font-weight="bold">入堆后回到主循环</text>

  <!-- no: next neighbor, back to relax box -->
  <path d="M 200 456 L 75 456 L 75 396 L 91 396" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arr)" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="96" y="448" font-size="9" fill="#999">否：下一邻居</text>

  <text x="280" y="532" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">弹出即确定：终点一旦出堆，d 就是最终答案</text>
</svg>
