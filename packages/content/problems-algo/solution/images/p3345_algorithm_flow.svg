<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：从 n 起逐个试，至多 10 轮必命中</text>

  <!-- 开始 -->
  <rect x="200" y="50" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="71" text-anchor="middle" font-size="12.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">x = n</text>

  <path d="M 260 82 L 260 100" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 求数位乘积 -->
  <rect x="165" y="104" width="190" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="122" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">求 x 的数位乘积 p</text>
  <text x="260" y="139" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">p = 1; 逐位剥落：p *= y % 10; y /= 10</text>

  <path d="M 260 148 L 260 166" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="260,170 350,212 260,254 170,212" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="260" y="217" text-anchor="middle" font-size="12" fill="#a07830" font-weight="bold" filter="url(#rough2)">p % t == 0 ?</text>

  <!-- 是 -->
  <path d="M 350 212 L 388 212" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="368" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="392" y="194" width="108" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="446" y="217" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 x ✓</text>

  <!-- 否 -->
  <path d="M 260 254 L 260 282" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="272" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="200" y="286" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="260" y="307" text-anchor="middle" font-size="12.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">x ← x + 1</text>

  <!-- 回环 -->
  <path d="M 200 302 C 140 302, 128 240, 128 170 C 128 138, 140 126, 163 126" fill="none" stroke="#446688" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="112" y="215" font-size="10" fill="#446688" filter="url(#rough2)">继续试下一个</text>

  <!-- 底部说明 -->
  <rect x="20" y="336" width="480" height="52" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="356" font-size="10.5" fill="#333" filter="url(#rough2)">循环至多 10 轮必命中：[n, n+9] 中必有一个末位 0 的数，其数位乘积为 0，</text>
  <text x="34" y="374" font-size="10.5" fill="#333" filter="url(#rough2)">而 0 可被任何 t 整除 —— 上界 n + 9 就是正确性的内置证明（官方 hint 同款）。</text>
</svg>
