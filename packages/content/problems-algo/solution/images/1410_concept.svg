<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：实体映射表 + 单趟扫描避免「&amp; 产物被重扫」</text>
  <text x="310" y="46" text-anchor="middle" font-size="11" fill="#888">6 种实体均以 &amp; 开头 ; 结尾，唯独 &amp;amp; → &amp; 会产生新的实体起点</text>

  <!-- entity mapping table: 2 rows x 3 cols -->
  <!-- Row 1 -->
  <rect x="30" y="62" width="180" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="90" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">&amp;quot;  →  "</text>

  <rect x="220" y="62" width="180" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="90" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">&amp;apos;  →  '</text>

  <rect x="410" y="62" width="180" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="500" y="90" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">&amp;amp;  →  &amp;  ⚠️</text>

  <!-- Row 2 -->
  <rect x="30" y="112" width="180" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="140" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">&amp;gt;  →  &gt;</text>

  <rect x="220" y="112" width="180" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="140" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">&amp;lt;  →  &lt;</text>

  <rect x="410" y="112" width="180" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="500" y="140" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">&amp;frasl;  →  /</text>

  <!-- highlight note for &amp; -->
  <rect x="410" y="162" width="180" height="22" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="500" y="177" text-anchor="middle" font-size="10" fill="#b85450">替换结果含 &amp; → 催生新实体起点</text>

  <!-- contrast section title -->
  <text x="310" y="206" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">陷阱对比：输入 &amp;amp;quot; 的两种处理</text>

  <!-- Left: wrong (chain replace, &amp; first) -->
  <rect x="30" y="216" width="270" height="224" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="50" y="238" font-size="12" fill="#b85450" font-weight="bold">链式 replace（&amp;amp; 先替换）✗</text>

  <!-- input -->
  <rect x="50" y="250" width="110" height="30" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="105" y="270" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">&amp;amp;quot;</text>
  <text x="172" y="270" font-size="10" fill="#888">输入</text>

  <!-- arrow down with label -->
  <path d="M 105 284 L 105 300" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="118" y="296" font-size="10" fill="#b85450">replace &amp;amp;→&amp;</text>

  <!-- intermediate: &quot; (the trap!) -->
  <rect x="50" y="306" width="110" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="105" y="326" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">&amp;quot;</text>
  <text x="172" y="326" font-size="10" fill="#d6a040" font-weight="bold">新生 &amp; 拼成实体</text>

  <!-- arrow down -->
  <path d="M 105 340 L 105 356" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="118" y="352" font-size="10" fill="#b85450">replace &amp;quot;→"</text>

  <!-- result: wrong -->
  <rect x="65" y="362" width="80" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="105" y="382" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">"</text>
  <text x="155" y="382" font-size="11" fill="#b85450" font-weight="bold">✗ 错误</text>

  <text x="165" y="412" font-size="10" fill="#888" text-anchor="middle"></text>
  <text x="165" y="424" text-anchor="middle" font-size="10" fill="#b85450">每趟 replace 重扫上一趟产物</text>

  <!-- Right: correct (single pass) -->
  <rect x="320" y="216" width="270" height="224" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="340" y="238" font-size="12" fill="#4a7a3a" font-weight="bold">单趟扫描 ✓</text>

  <!-- input with two colored parts -->
  <text x="340" y="270" font-size="10" fill="#888">输入：</text>
  <rect x="378" y="250" width="60" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="408" y="270" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">&amp;amp;</text>
  <rect x="442" y="250" width="62" height="30" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="473" y="270" text-anchor="middle" font-size="12" fill="#888">quot;</text>

  <!-- arrows down from both parts -->
  <path d="M 408 284 L 408 300" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="418" y="296" font-size="10" fill="#4a7a3a">命中→输出 &amp;</text>
  <path d="M 473 284 L 473 300" stroke="#999" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="483" y="296" font-size="10" fill="#888">原样</text>

  <!-- output: two parts -->
  <text x="340" y="326" font-size="10" fill="#888">输出：</text>
  <rect x="378" y="306" width="36" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="396" y="326" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">&amp;</text>
  <rect x="418" y="306" width="62" height="30" rx="4" fill="#fafafa" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="449" y="326" text-anchor="middle" font-size="12" fill="#888">quot;</text>

  <!-- arrow down to result -->
  <path d="M 455 340 L 455 356" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>

  <!-- result: correct -->
  <rect x="378" y="362" width="102" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="429" y="382" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">&amp;quot;</text>
  <text x="490" y="382" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 正确</text>

  <text x="455" y="424" text-anchor="middle" font-size="10" fill="#4a7a3a">i 跳过整个 &amp;amp;，产出的 &amp; 不回扫</text>
</svg>
