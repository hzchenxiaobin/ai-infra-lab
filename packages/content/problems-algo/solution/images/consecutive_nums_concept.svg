<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">自连接：三行副本按 id 错位 1 对齐成"一行三列"</text>

  <!-- Three stacked copies of Logs table -->
  <text x="100" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">l1（基行）</text>
  <rect x="60" y="62" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="78" y="77" font-size="10" fill="#333">id</text>
  <text x="112" y="77" font-size="10" fill="#333">num</text>
  <line x1="92" y1="62" x2="92" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="60" y="84" width="80" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="78" y="98" font-size="10" fill="#333">1</text>
  <text x="112" y="98" font-size="10" fill="#333">1</text>
  <line x1="92" y1="84" x2="92" y2="104" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="60" y="104" width="80" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="78" y="118" font-size="10" fill="#333">2</text>
  <text x="112" y="118" font-size="10" fill="#333">1</text>
  <line x1="92" y1="104" x2="92" y2="124" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="60" y="124" width="80" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="78" y="138" font-size="10" fill="#333">3</text>
  <text x="112" y="138" font-size="10" fill="#333">1</text>
  <line x1="92" y1="124" x2="92" y2="144" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="60" y="144" width="80" height="20" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="78" y="158" font-size="10" fill="#333">4</text>
  <text x="112" y="158" font-size="10" fill="#333">2</text>
  <line x1="92" y1="144" x2="92" y2="164" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- l2 copy shifted -->
  <text x="250" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">l2（id = l1.id+1）</text>
  <rect x="210" y="84" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="228" y="99" font-size="10" fill="#333">id</text>
  <text x="262" y="99" font-size="10" fill="#333">num</text>
  <line x1="242" y1="84" x2="242" y2="106" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="210" y="106" width="80" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="228" y="120" font-size="10" fill="#333">2</text>
  <text x="262" y="120" font-size="10" fill="#333">1</text>
  <line x1="242" y1="106" x2="242" y2="126" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="210" y="126" width="80" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="228" y="140" font-size="10" fill="#333">3</text>
  <text x="262" y="140" font-size="10" fill="#333">1</text>
  <line x1="242" y1="126" x2="242" y2="146" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="210" y="146" width="80" height="20" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="228" y="160" font-size="10" fill="#333">4</text>
  <text x="262" y="160" font-size="10" fill="#333">2</text>
  <line x1="242" y1="146" x2="242" y2="166" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- l3 copy shifted -->
  <text x="400" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">l3（id = l1.id+2）</text>
  <rect x="360" y="106" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="378" y="121" font-size="10" fill="#333">id</text>
  <text x="412" y="121" font-size="10" fill="#333">num</text>
  <line x1="392" y1="106" x2="392" y2="128" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="360" y="128" width="80" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="378" y="142" font-size="10" fill="#333">3</text>
  <text x="412" y="142" font-size="10" fill="#333">1</text>
  <line x1="392" y1="128" x2="392" y2="148" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="360" y="148" width="80" height="20" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="378" y="162" font-size="10" fill="#333">4</text>
  <text x="412" y="162" font-size="10" fill="#333">2</text>
  <line x1="392" y1="148" x2="392" y2="168" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Highlighted alignment row: id=1,2,3 all num=1 -->
  <rect x="60" y="84" width="80" height="60" fill="none" stroke="#b85450" stroke-width="2.5" stroke-dasharray="4,2" rx="6" filter="url(#rough2)"/>
  <rect x="210" y="106" width="80" height="40" fill="none" stroke="#b85450" stroke-width="2.5" stroke-dasharray="4,2" rx="6" filter="url(#rough2)"/>
  <rect x="360" y="128" width="80" height="20" fill="none" stroke="#b85450" stroke-width="2.5" stroke-dasharray="4,2" rx="6" filter="url(#rough2)"/>

  <!-- alignment arrows -->
  <path d="M145 114 L205 114" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="175" y="110" text-anchor="middle" font-size="9" fill="#4a7a3a">id+1</text>
  <path d="M295 136 L355 136" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="325" y="132" text-anchor="middle" font-size="9" fill="#4a7a3a">id+2</text>

  <!-- Result row -->
  <text x="280" y="200" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">对齐后：l1.num=1, l2.num=1, l3.num=1 → 三连相同 ✓</text>

  <!-- Result table -->
  <text x="280" y="232" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">结果（DISTINCT 去重）</text>
  <rect x="220" y="240" width="120" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="256" text-anchor="middle" font-size="10" fill="#333">ConsecutiveNums</text>
  <rect x="220" y="264" width="120" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="280" y="279" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>

  <!-- Bottom insight box -->
  <rect x="40" y="302" width="480" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">核心观察：自连接 = 把"连续三行"拍扁成"一行三列"</text>
  <text x="60" y="340" font-size="10" fill="#333">① l1 JOIN l2 ON l2.id = l1.id + 1：让相邻行并排</text>
  <text x="60" y="356" font-size="10" fill="#333">② 再 JOIN l3 ON l3.id = l1.id + 2：三行并排，WHERE 三列相等即"连续三次相同"</text>
</svg>
