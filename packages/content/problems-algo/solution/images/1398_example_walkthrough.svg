<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="360" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：条件聚合 SUM(IF(...)) 的逐顾客计数</text>
  <text x="330" y="46" text-anchor="middle" font-size="11" fill="#888">GROUP BY 顾客后，三个条件聚合值决定 HAVING 是否放行</text>

  <!-- header -->
  <rect x="24" y="62" width="612" height="30" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="125" y="82" text-anchor="end" font-size="11" fill="#555" font-weight="bold">顾客</text>
  <text x="195" y="82" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">购买产品</text>
  <text x="360" y="82" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">SUM(A)</text>
  <text x="410" y="82" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">SUM(B)</text>
  <text x="460" y="82" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">SUM(C)</text>
  <text x="545" y="82" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">A&gt;0? B&gt;0? C=0?</text>
  <text x="625" y="82" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">输出</text>

  <!-- Daniel -->
  <text x="125" y="120" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">Daniel(1)</text>
  <rect x="150" y="106" width="28" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="164" y="123" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">A</text>
  <rect x="180" y="106" width="28" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="194" y="123" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">B</text>
  <rect x="210" y="106" width="28" height="24" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="224" y="123" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">D</text>
  <rect x="240" y="106" width="28" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="254" y="123" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">C</text>
  <text x="360" y="123" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
  <text x="410" y="123" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="460" y="123" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <text x="510" y="124" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="545" y="124" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="580" y="124" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">✗</text>
  <text x="625" y="122" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>

  <!-- Diana -->
  <text x="125" y="158" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">Diana(2)</text>
  <rect x="150" y="144" width="28" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="164" y="161" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">A</text>
  <text x="360" y="161" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
  <text x="410" y="161" text-anchor="middle" font-size="13" fill="#aaa" font-weight="bold">0</text>
  <text x="460" y="161" text-anchor="middle" font-size="13" fill="#aaa" font-weight="bold">0</text>
  <text x="510" y="162" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="545" y="162" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">✗</text>
  <text x="580" y="162" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="625" y="160" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>

  <!-- Elizabeth (highlight) -->
  <rect x="24" y="178" width="612" height="30" rx="4" fill="#e6f4ea" fill-opacity="0.5" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="125" y="197" text-anchor="end" font-size="12" fill="#4a7a3a" font-weight="bold">Elizabeth(3)</text>
  <rect x="150" y="183" width="28" height="24" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="164" y="200" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">A</text>
  <rect x="180" y="183" width="28" height="24" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="194" y="200" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">B</text>
  <rect x="210" y="183" width="28" height="24" rx="3" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="224" y="200" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">D</text>
  <text x="360" y="200" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
  <text x="410" y="200" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="460" y="200" text-anchor="middle" font-size="13" fill="#aaa" font-weight="bold">0</text>
  <text x="510" y="201" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="545" y="201" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="580" y="201" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="625" y="199" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- Jhon -->
  <text x="125" y="235" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">Jhon(4)</text>
  <rect x="150" y="221" width="28" height="24" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="164" y="238" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">C</text>
  <text x="360" y="238" text-anchor="middle" font-size="13" fill="#aaa" font-weight="bold">0</text>
  <text x="410" y="238" text-anchor="middle" font-size="13" fill="#aaa" font-weight="bold">0</text>
  <text x="460" y="238" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <text x="510" y="239" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">✗</text>
  <text x="545" y="239" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">✗</text>
  <text x="580" y="239" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">✗</text>
  <text x="625" y="237" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>

  <!-- note -->
  <rect x="40" y="270" width="580" height="76" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="330" y="292" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">守恒校验：只有 Elizabeth 三条件同时为真</text>
  <text x="330" y="312" text-anchor="middle" font-size="11" fill="#666">Daniel 买了 C ⇒ SUM(C)=1 ≠ 0 ⇒ 被 HAVING 拦掉；Diana 没买 B ⇒ SUM(B)=0</text>
  <text x="330" y="330" text-anchor="middle" font-size="11" fill="#666">条件聚合把"存在性"转成"计数正 / 零"，一次 GROUP BY 即可判定全部顾客</text>
</svg>
