<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：dominoes = [[1,2],[1,2],[1,1],[1,2],[2,2]]</text>

  <!-- ===== Phase A: normalize & count table ===== -->
  <text x="40" y="50" font-size="11" fill="#446688" font-weight="bold">阶段一：逐张归一化并计数</text>

  <!-- column headers -->
  <text x="30" y="72" text-anchor="middle" font-size="10" fill="#888">i</text>
  <text x="100" y="72" text-anchor="middle" font-size="10" fill="#888">多米诺 [a,b]</text>
  <text x="220" y="72" text-anchor="middle" font-size="10" fill="#888">归一化(min,max)</text>
  <text x="340" y="72" text-anchor="middle" font-size="10" fill="#888">key</text>
  <text x="450" y="72" text-anchor="middle" font-size="10" fill="#888">cnt[key] 处理后</text>

  <line x1="16" y1="78" x2="524" y2="78" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- row i=0 : [1,2] -> (1,2) -> 12 -> cnt[12]=1 -->
  <text x="30" y="102" text-anchor="middle" font-size="11" fill="#999">0</text>
  <rect x="80" y="88" width="40" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="100" y="100" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="80" y="104" width="40" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="100" y="116" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="170" y="106" font-size="11" fill="#888">→</text>
  <rect x="200" y="88" width="40" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="220" y="100" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="200" y="104" width="40" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="220" y="116" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="290" y="106" font-size="11" fill="#888">→</text>
  <rect x="320" y="92" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="340" y="108" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">12</text>
  <text x="390" y="106" font-size="11" fill="#888">→</text>
  <text x="450" y="106" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">cnt[12] = 1</text>

  <!-- row i=1 : [1,2] -> (1,2) -> 12 -> cnt[12]=2 -->
  <text x="30" y="134" text-anchor="middle" font-size="11" fill="#999">1</text>
  <rect x="80" y="120" width="40" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="100" y="132" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="80" y="136" width="40" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="100" y="148" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="170" y="138" font-size="11" fill="#888">→</text>
  <rect x="200" y="120" width="40" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="220" y="132" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="200" y="136" width="40" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="220" y="148" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="290" y="138" font-size="11" fill="#888">→</text>
  <rect x="320" y="124" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="340" y="140" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">12</text>
  <text x="390" y="138" font-size="11" fill="#888">→</text>
  <text x="450" y="138" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">cnt[12] = 2</text>

  <!-- row i=2 : [1,1] -> (1,1) -> 11 -> cnt[11]=1 -->
  <text x="30" y="166" text-anchor="middle" font-size="11" fill="#999">2</text>
  <rect x="80" y="152" width="40" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="100" y="164" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="80" y="168" width="40" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="100" y="180" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="170" y="170" font-size="11" fill="#888">→</text>
  <rect x="200" y="152" width="40" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="220" y="164" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="200" y="168" width="40" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="220" y="180" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="290" y="170" font-size="11" fill="#888">→</text>
  <rect x="320" y="156" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="340" y="172" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">11</text>
  <text x="390" y="170" font-size="11" fill="#888">→</text>
  <text x="450" y="170" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">cnt[11] = 1</text>

  <!-- row i=3 : [1,2] -> (1,2) -> 12 -> cnt[12]=3 -->
  <text x="30" y="198" text-anchor="middle" font-size="11" fill="#999">3</text>
  <rect x="80" y="184" width="40" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="100" y="196" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="80" y="200" width="40" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="100" y="212" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="170" y="202" font-size="11" fill="#888">→</text>
  <rect x="200" y="184" width="40" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="220" y="196" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="200" y="200" width="40" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="220" y="212" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="290" y="202" font-size="11" fill="#888">→</text>
  <rect x="320" y="188" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="340" y="204" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">12</text>
  <text x="390" y="202" font-size="11" fill="#888">→</text>
  <text x="450" y="202" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">cnt[12] = 3</text>

  <!-- row i=4 : [2,2] -> (2,2) -> 22 -> cnt[22]=1 -->
  <text x="30" y="230" text-anchor="middle" font-size="11" fill="#999">4</text>
  <rect x="80" y="216" width="40" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="100" y="228" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="80" y="232" width="40" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="100" y="244" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="170" y="234" font-size="11" fill="#888">→</text>
  <rect x="200" y="216" width="40" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="220" y="228" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="200" y="232" width="40" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="220" y="244" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="290" y="234" font-size="11" fill="#888">→</text>
  <rect x="320" y="220" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="340" y="236" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">22</text>
  <text x="390" y="234" font-size="11" fill="#888">→</text>
  <text x="450" y="234" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">cnt[22] = 1</text>

  <line x1="16" y1="256" x2="524" y2="256" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- ===== Phase B: final cnt + pairs ===== -->
  <text x="40" y="280" font-size="11" fill="#4a7a3a" font-weight="bold">阶段二：最终 cnt = {12:3, 11:1, 22:1}，逐桶求组合数</text>

  <!-- bucket 12 -->
  <rect x="40" y="296" width="150" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="115" y="314" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">桶 12 : c = 3</text>
  <text x="115" y="330" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">C(3,2) = 3</text>

  <!-- bucket 11 -->
  <rect x="210" y="296" width="150" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="285" y="314" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">桶 11 : c = 1</text>
  <text x="285" y="330" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">C(1,2) = 0</text>

  <!-- bucket 22 -->
  <rect x="380" y="296" width="150" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="455" y="314" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">桶 22 : c = 1</text>
  <text x="455" y="330" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">C(1,2) = 0</text>

  <!-- arrows converging -->
  <path d="M 115 336 L 115 352 L 270 352" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 285 336 L 285 352 L 270 352" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 455 336 L 455 352 L 270 352" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 270 352 L 270 366" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- total -->
  <rect x="150" y="370" width="240" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="390" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">答案 = 3 + 0 + 0 = 3</text>

  <!-- note -->
  <rect x="60" y="412" width="420" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="428" text-anchor="middle" font-size="11" fill="#444">注：i=0,1,3 三张牌两两等价 → 3 对：(0,1)、(0,3)、(1,3)</text>
  <text x="270" y="442" text-anchor="middle" font-size="10" fill="#888">cnt[12]=3 恰好对应 C(3,2)=3，无需枚举每对</text>
</svg>
