<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "havefunonleetcode"，K = 5</text>

  <!-- Table header -->
  <rect x="30" y="42" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="65" y="60" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">right</text>
  <rect x="100" y="42" width="150" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="175" y="60" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">窗口 [r−4, r]</text>
  <rect x="250" y="42" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="290" y="60" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">distinct</text>
  <rect x="330" y="42" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="360" y="60" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">合法?</text>
  <rect x="390" y="42" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="415" y="60" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans</text>

  <!-- Row data: right, window, distinct, valid, ans -->
  <!-- rows: y starts at 72, step 22 -->
  <!-- 4:  havef  5  ✓ 1 -->
  <!-- 5:  avefu  5  ✓ 2 -->
  <!-- 6:  vefun  5  ✓ 3 -->
  <!-- 7:  efuno  5  ✓ 4 -->
  <!-- 8:  funon  4  ✗ 4 -->
  <!-- 11: onlee  4  ✗ 4 -->
  <!-- 15: etcod  5  ✓ 5 -->
  <!-- 16: tcode  5  ✓ 6 -->

  <!-- Row 1: right=4 havef -->
  <rect x="30" y="72" width="70" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="65" y="88" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="100" y="72" width="150" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="175" y="88" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">havef</text>
  <rect x="250" y="72" width="80" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="290" y="88" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="330" y="72" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="360" y="88" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="390" y="72" width="50" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="415" y="88" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>

  <!-- Row 2: right=5 avefu -->
  <rect x="30" y="94" width="70" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="65" y="110" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="100" y="94" width="150" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="175" y="110" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">avefu</text>
  <rect x="250" y="94" width="80" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="290" y="110" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="330" y="94" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="360" y="110" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="390" y="94" width="50" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="415" y="110" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>

  <!-- Row 3: right=6 vefun -->
  <rect x="30" y="116" width="70" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="65" y="132" text-anchor="middle" font-size="11" fill="#333">6</text>
  <rect x="100" y="116" width="150" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="175" y="132" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">vefun</text>
  <rect x="250" y="116" width="80" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="290" y="132" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="330" y="116" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="360" y="132" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="390" y="116" width="50" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="415" y="132" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>

  <!-- Row 4: right=7 efuno -->
  <rect x="30" y="138" width="70" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="65" y="154" text-anchor="middle" font-size="11" fill="#333">7</text>
  <rect x="100" y="138" width="150" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="175" y="154" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">efuno</text>
  <rect x="250" y="138" width="80" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="290" y="154" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="330" y="138" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="360" y="154" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="390" y="138" width="50" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="415" y="154" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>

  <!-- Row 5: right=8 funon (invalid) -->
  <rect x="30" y="160" width="70" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="65" y="176" text-anchor="middle" font-size="11" fill="#333">8</text>
  <rect x="100" y="160" width="150" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="175" y="176" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">funon (n重复)</text>
  <rect x="250" y="160" width="80" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="290" y="176" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <rect x="330" y="160" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="360" y="176" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <rect x="390" y="160" width="50" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="415" y="176" text-anchor="middle" font-size="11" fill="#333">4</text>

  <!-- ellipsis rows 9-10 -->
  <rect x="30" y="182" width="70" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="65" y="198" text-anchor="middle" font-size="11" fill="#999">9–10</text>
  <rect x="100" y="182" width="150" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="175" y="198" text-anchor="middle" font-size="11" fill="#b85450">unonl / nonle</text>
  <rect x="250" y="182" width="80" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="290" y="198" text-anchor="middle" font-size="11" fill="#b85450">4</text>
  <rect x="330" y="182" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="360" y="198" text-anchor="middle" font-size="11" fill="#b85450">✗</text>
  <rect x="390" y="182" width="50" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="415" y="198" text-anchor="middle" font-size="11" fill="#333">4</text>

  <!-- ellipsis rows 11-14 -->
  <rect x="30" y="204" width="70" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="65" y="220" text-anchor="middle" font-size="11" fill="#999">11–14</text>
  <rect x="100" y="204" width="150" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="175" y="220" text-anchor="middle" font-size="11" fill="#b85450">onlee … eetco (e重复)</text>
  <rect x="250" y="204" width="80" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="290" y="220" text-anchor="middle" font-size="11" fill="#b85450">4</text>
  <rect x="330" y="204" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="360" y="220" text-anchor="middle" font-size="11" fill="#b85450">✗</text>
  <rect x="390" y="204" width="50" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="415" y="220" text-anchor="middle" font-size="11" fill="#333">4</text>

  <!-- Row: right=15 etcod -->
  <rect x="30" y="226" width="70" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="65" y="242" text-anchor="middle" font-size="11" fill="#333">15</text>
  <rect x="100" y="226" width="150" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="175" y="242" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">etcod</text>
  <rect x="250" y="226" width="80" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="290" y="242" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="330" y="226" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="360" y="242" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="390" y="226" width="50" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="415" y="242" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>

  <!-- Row: right=16 tcode -->
  <rect x="30" y="248" width="70" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="65" y="264" text-anchor="middle" font-size="11" fill="#333">16</text>
  <rect x="100" y="248" width="150" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="175" y="264" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">tcode</text>
  <rect x="250" y="248" width="80" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="290" y="264" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="330" y="248" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="360" y="264" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="390" y="248" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="415" y="264" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">6</text>

  <!-- Note box -->
  <rect x="30" y="296" width="540" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="318" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">关键观察：distinct == K ⟺ 窗口内 K 个字符全不同</text>
  <text x="50" y="340" font-size="11" fill="#666">• right=4→7：窗口在 "havef…efuno" 段无重复，distinct 恒为 5，连计 4 个；</text>
  <text x="50" y="358" font-size="11" fill="#666">• right=8→14：窗口滑入 "n…ee" 重复区，distinct 跌到 4，连续 7 个窗口全部非法；</text>
  <text x="50" y="376" font-size="11" fill="#666">• right=15→16：窗口移出重复区，distinct 回升到 5，再计 2 个。</text>
  <text x="50" y="394" font-size="11" fill="#888">最终 ans = 6。distinct 的增减只与进出窗口的两个字符有关，每步 O(1)。</text>
</svg>
