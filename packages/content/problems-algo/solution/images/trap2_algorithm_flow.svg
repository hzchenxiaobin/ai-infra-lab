<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：最小堆 + 从边界向内 BFS</text>

  <g filter="url(#rough2)" font-size="11">
    <!-- 1. init -->
    <rect x="160" y="48" width="240" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8"/>
    <text x="280" y="68" text-anchor="middle" fill="#446688" font-weight="bold">初始化</text>
    <text x="280" y="84" text-anchor="middle" fill="#555" font-family="monospace" font-size="10">所有边界格入最小堆(按高度)，标记 visited</text>

    <path d="M 280 98 L 280 112" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>

    <!-- 2. loop header -->
    <polygon points="280,114 400,150 280,186 160,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="280" y="146" text-anchor="middle" fill="#d6a040" font-weight="bold">堆非空？</text>
    <text x="280" y="162" text-anchor="middle" fill="#888" font-size="10">while heap not empty</text>

    <!-- no -> end -->
    <path d="M 400 150 L 430 150 L 430 410" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)"/>
    <text x="412" y="144" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

    <!-- yes -> pop -->
    <path d="M 280 186 L 280 200" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)"/>
    <text x="294" y="196" font-size="10" fill="#b85450" font-weight="bold">是</text>

    <rect x="160" y="202" width="240" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8"/>
    <text x="280" y="222" text-anchor="middle" fill="#b85450" font-weight="bold">弹出堆顶 (h, i, j)</text>
    <text x="280" y="238" text-anchor="middle" fill="#555" font-family="monospace" font-size="10">h = 当前最低边界高度 = 水位</text>

    <path d="M 280 246 L 280 260" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>

    <!-- 3. neighbor loop -->
    <polygon points="280,262 380,290 280,318 180,290" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="280" y="288" text-anchor="middle" fill="#d6a040" font-weight="bold">有未访问邻居?</text>
    <text x="280" y="302" text-anchor="middle" fill="#888" font-size="10">(ni, nj) 四方向</text>

    <path d="M 280 318 L 280 332" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>

    <!-- 4. decision: height[ni][nj] < h ? -->
    <polygon points="280,334 400,362 280,390 160,362" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="280" y="360" text-anchor="middle" fill="#d6a040" font-weight="bold">height[ni][nj] &lt; h ?</text>

    <!-- yes (lower) -> fill water -->
    <path d="M 160 362 L 70 362 L 70 392" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)"/>
    <text x="84" y="356" font-size="10" fill="#b85450" font-weight="bold">是(低洼)</text>
    <rect x="20" y="394" width="150" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6"/>
    <text x="95" y="414" text-anchor="middle" fill="#b85450" font-weight="bold">注水</text>
    <text x="95" y="430" text-anchor="middle" fill="#555" font-family="monospace" font-size="10">ans += h − nh</text>
    <text x="95" y="444" text-anchor="middle" fill="#555" font-family="monospace" font-size="10">push(h, ni, nj)</text>

    <!-- no (higher) -> push its own height -->
    <path d="M 400 362 L 490 362 L 490 392" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrB)"/>
    <text x="430" y="356" font-size="10" fill="#446688" font-weight="bold">否(墙壁)</text>
    <rect x="410" y="394" width="150" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6"/>
    <text x="485" y="414" text-anchor="middle" fill="#446688" font-weight="bold">当新墙入堆</text>
    <text x="485" y="430" text-anchor="middle" fill="#555" font-family="monospace" font-size="10">push(nh, ni, nj)</text>
    <text x="485" y="444" text-anchor="middle" fill="#555" font-size="10">它可能挡住更深的水</text>

    <!-- both -> mark visited, back to neighbor loop -->
    <path d="M 95 450 L 95 462 L 485 462 L 485 450" stroke="#4a7a3a" stroke-width="1.2" fill="none"/>
    <path d="M 290 462 L 290 318 L 280 318" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arrG)"/>
    <text x="300" y="458" font-size="9" fill="#4a7a3a">visited[ni][nj]=1 后回邻居循环</text>

    <!-- neighbor loop done -> back to while -->
    <path d="M 180 290 L 120 290 L 120 150 L 160 150" stroke="#666" stroke-width="1.2" fill="none" stroke-dasharray="3 3" marker-end="url(#arr)"/>
    <text x="92" y="220" font-size="9" fill="#888">邻居遍历完</text>

    <!-- end -->
    <rect x="370" y="408" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6"/>
    <text x="430" y="430" text-anchor="middle" fill="#4a7a3a" font-weight="bold">返回 ans</text>
  </g>
</svg>
