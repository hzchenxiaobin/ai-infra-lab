<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：窗口编号 → 定位第三笔 → 花费门槛 → 升序输出</text>

  <rect x="70" y="40" width="420" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="58" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">① ranked CTE：一次分区排序，三个窗口函数共享</text>
  <text x="280" y="76" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY transaction_date) AS rn</text>
  <text x="280" y="90" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">LAG(spend,1) AS prev1、LAG(spend,2) AS prev2 —— 同一窗口定义</text>

  <path d="M 280 98 L 280 110" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="110" width="420" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="128" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">② 定位第三笔：WHERE rn = 3</text>
  <text x="280" y="145" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">不足 3 笔的用户没有 rn=3 的行，天然出局（编号即筛选）</text>

  <path d="M 280 154 L 280 166" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="166" width="420" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="184" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">③ 花费门槛：前两笔严格更低</text>
  <text x="280" y="201" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">prev1 &lt; spend AND prev2 &lt; spend ⟺ max(prev1, prev2) &lt; spend</text>

  <path d="M 280 210 L 280 222" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="222" width="420" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="240" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">④ 升序输出</text>
  <text x="280" y="257" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">SELECT user_id, spend, transaction_date ORDER BY user_id</text>

  <path d="M 280 266 L 280 278" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="278" width="420" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="296" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">结果：仅 user 1 的第三笔入选</text>
  <text x="280" y="313" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">1 | 65.56 | 2023-11-18 13:49:42</text>
</svg>
