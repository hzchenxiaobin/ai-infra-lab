<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n=4, k=9  →  "2314"</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#888">每步：index=(k−1)//fact → 取候选 → 更新 k 与候选集</text>

  <!-- ============ Table header ============ -->
  <rect x="40" y="58" width="540" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="76" font-size="11" fill="#446688" font-weight="bold">轮次 i</text>
  <text x="140" y="76" font-size="11" fill="#446688" font-weight="bold">fact</text>
  <text x="210" y="76" font-size="11" fill="#446688" font-weight="bold">candidates</text>
  <text x="350" y="76" font-size="11" fill="#446688" font-weight="bold">k</text>
  <text x="410" y="76" font-size="11" fill="#446688" font-weight="bold">index</text>
  <text x="490" y="76" font-size="11" fill="#446688" font-weight="bold">选 / 结果</text>

  <!-- ============ Row 1: i=0 ============ -->
  <rect x="40" y="90" width="540" height="44" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="116" font-size="12" fill="#333" font-weight="bold">0</text>
  <text x="140" y="116" font-size="11" fill="#666">3!=6</text>
  <!-- candidates [1,2,3,4], highlight index 1 -->
  <rect x="208" y="104" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="219" y="120" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="232" y="104" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="243" y="120" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="256" y="104" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="267" y="120" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="280" y="104" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="291" y="120" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="350" y="116" font-size="11" fill="#333">9</text>
  <text x="410" y="116" font-size="11" fill="#b85450" font-weight="bold">(8)//6=1</text>
  <text x="490" y="116" font-size="12" fill="#4a7a3a" font-weight="bold">选 2</text>
  <text x="528" y="116" font-size="11" fill="#888">[2_ _ _]</text>

  <!-- ============ Row 2: i=1 ============ -->
  <rect x="40" y="138" width="540" height="44" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="164" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="140" y="164" font-size="11" fill="#666">2!=2</text>
  <!-- candidates [1,3,4], highlight index 1 -->
  <rect x="208" y="152" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="219" y="168" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="232" y="152" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="243" y="168" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="256" y="152" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="267" y="168" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="350" y="164" font-size="11" fill="#333">3</text>
  <text x="410" y="164" font-size="11" fill="#b85450" font-weight="bold">(2)//2=1</text>
  <text x="490" y="164" font-size="12" fill="#4a7a3a" font-weight="bold">选 3</text>
  <text x="528" y="164" font-size="11" fill="#888">[2 3_ _]</text>

  <!-- ============ Row 3: i=2 ============ -->
  <rect x="40" y="186" width="540" height="44" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="212" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="140" y="212" font-size="11" fill="#666">1!=1</text>
  <!-- candidates [1,4], highlight index 0 -->
  <rect x="208" y="200" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="219" y="216" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="232" y="200" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="243" y="216" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="350" y="212" font-size="11" fill="#333">1</text>
  <text x="410" y="212" font-size="11" fill="#b85450" font-weight="bold">(0)//1=0</text>
  <text x="490" y="212" font-size="12" fill="#4a7a3a" font-weight="bold">选 1</text>
  <text x="528" y="212" font-size="11" fill="#888">[2 3 1_]</text>

  <!-- ============ Row 4: i=3 ============ -->
  <rect x="40" y="234" width="540" height="44" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="70" y="260" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="140" y="260" font-size="11" fill="#666">0!=1</text>
  <!-- candidates [4], highlight index 0 -->
  <rect x="208" y="248" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="219" y="264" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="350" y="260" font-size="11" fill="#333">1</text>
  <text x="410" y="260" font-size="11" fill="#b85450" font-weight="bold">(0)//1=0</text>
  <text x="490" y="260" font-size="12" fill="#4a7a3a" font-weight="bold">选 4</text>
  <text x="528" y="260" font-size="11" fill="#888">[2 3 1 4]</text>

  <!-- ============ Result box ============ -->
  <rect x="160" y="296" width="300" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="190" y="322" font-size="12" fill="#555">结果 =</text>
  <text x="310" y="324" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold">"2314"</text>

  <!-- ============ Note box ============ -->
  <rect x="40" y="356" width="540" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="60" y="380" font-size="12" fill="#444" font-weight="bold">关键：每轮 k 先减 1 再除以 fact</text>
  <text x="60" y="398" font-size="11" fill="#666">k 是 1-indexed，而候选下标 index 是 0-indexed；(k−1) 把"第 k 个"对齐到"第 index 组"。</text>
  <text x="60" y="414" font-size="11" fill="#666">更新后 k −= index · fact：去掉前 index 整组，落在剩余子段的第 k 个（仍 1-indexed）。</text>
</svg>
