<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="500" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：双层循环 + 平方距离判定</text>

  <!-- Start node -->
  <ellipse cx="220" cy="58" rx="120" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="62" text-anchor="middle" font-size="12" fill="#333">answer = [],  j = 0</text>

  <!-- Arrow down to D1 -->
  <path d="M 220 78 L 220 94" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D1: j < m ? -->
  <polygon points="220,94 300,118 220,142 140,118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="122" text-anchor="middle" font-size="12" fill="#333">j &lt; m ?</text>

  <!-- D1 No -> return answer (right) -->
  <path d="M 300 118 L 390 118" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="345" y="110" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <rect x="390" y="98" width="140" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="460" y="123" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 answer</text>

  <!-- D1 Yes -> count=0 (down) -->
  <path d="M 220 142 L 220 158" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="232" y="154" font-size="11" fill="#82b366">是</text>

  <!-- count=0, i=0 box -->
  <rect x="155" y="158" width="130" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="220" y="181" text-anchor="middle" font-size="12" fill="#333">count = 0,  i = 0</text>

  <!-- Arrow down to D2 -->
  <path d="M 220 194 L 220 210" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D2: i < n ? -->
  <polygon points="220,210 300,234 220,258 140,234" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="238" text-anchor="middle" font-size="12" fill="#333">i &lt; n ?</text>

  <!-- D2 No -> answer[j]=count, j++ (right) -->
  <path d="M 300 234 L 390 234" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="345" y="226" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <rect x="390" y="212" width="160" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="470" y="232" text-anchor="middle" font-size="11" fill="#333">answer[j] = count</text>
  <text x="470" y="250" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">j++  → 外层循环</text>

  <!-- D2 Yes -> compute (down) -->
  <path d="M 220 258 L 220 274" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="232" y="270" font-size="11" fill="#82b366">是</text>

  <!-- Compute box -->
  <rect x="105" y="274" width="230" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="220" y="299" text-anchor="middle" font-size="12" fill="#333">d² = (px−xj)² + (py−yj)²</text>

  <!-- Arrow down to D3 -->
  <path d="M 220 314 L 220 330" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D3: d² ≤ rj² ? -->
  <polygon points="220,330 340,358 220,386 100,358" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="220" y="355" text-anchor="middle" font-size="11" fill="#333">d² ≤ rj² ?</text>
  <text x="220" y="372" text-anchor="middle" font-size="10" fill="#888">(含边界)</text>

  <!-- D3 No -> i++ (right) -->
  <path d="M 340 358 L 390 358" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="365" y="350" text-anchor="middle" font-size="11" fill="#82b366">否</text>

  <!-- D3 Yes -> count++ (down) -->
  <path d="M 220 386 L 220 402" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="232" y="398" font-size="11" fill="#b85450">是</text>

  <!-- count++ box -->
  <rect x="165" y="402" width="110" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="220" y="425" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">count++</text>

  <!-- i++ box (shared by D3 No and count++) -->
  <rect x="390" y="340" width="100" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="440" y="363" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">i++</text>

  <!-- Arrow from count++ to i++ -->
  <path d="M 275 420 L 440 420 L 440 378" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop-back: i++ -> D2 (far right) -->
  <path d="M 490 358 L 560 358 L 560 198 L 220 198 L 220 210" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="570" y="280" font-size="10" fill="#888" transform="rotate(-90 570 280)">i++ 后继续内层</text>

  <!-- Loop-back: answer[j]/j++ -> D1 (further right) -->
  <path d="M 550 235 L 585 235 L 585 76 L 220 76 L 220 94" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="595" y="160" font-size="10" fill="#888" transform="rotate(-90 595 160)">j++ 后继续外层</text>

  <!-- Summary note -->
  <rect x="40" y="452" width="520" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="476" text-anchor="middle" font-size="11" fill="#666">关键：用 d² ≤ r² 代替 √d ≤ r，全程整数运算无浮点误差　·　时间 O(mn)，空间 O(1)</text>
</svg>
