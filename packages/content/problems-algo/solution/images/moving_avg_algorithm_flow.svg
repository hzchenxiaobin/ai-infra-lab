<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：next(val) 的四步</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">先判满出队 → 再入队 → 更新 sum → 返回均值</text>

  <!-- ===== 入口 ===== -->
  <rect x="200" y="58" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="80" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">调用 next(val)</text>
  <line x1="280" y1="92" x2="280" y2="106" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 判满菱形 ===== -->
  <polygon points="280,110 400,154 280,198 160,154" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">q.size() == size ?</text>
  <text x="280" y="168" text-anchor="middle" font-size="10" fill="#888">（窗口是否已满）</text>

  <!-- 是 → 出队（左侧分支） -->
  <line x1="160" y1="154" x2="100" y2="154" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="110" y="146" font-size="11" fill="#b85450" font-weight="bold">是</text>

  <rect x="40" y="138" width="60" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="70" y="159" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">满</text>

  <text x="70" y="188" text-anchor="middle" font-size="10" fill="#888">出队最老</text>

  <!-- 出队操作框 -->
  <rect x="20" y="196" width="100" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="70" y="216" text-anchor="middle" font-size="10" fill="#333">sum −= q.front()</text>
  <text x="70" y="232" text-anchor="middle" font-size="10" fill="#333">q.pop()</text>

  <!-- 否 → 跳过出队（右侧分支） -->
  <line x1="400" y1="154" x2="460" y2="154" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="416" y="146" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>

  <rect x="460" y="138" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="500" y="159" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">未满</text>

  <text x="500" y="188" text-anchor="middle" font-size="10" fill="#888">跳过出队</text>

  <rect x="450" y="196" width="100" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="500" y="222" text-anchor="middle" font-size="10" fill="#4a7a3a">sum 不变</text>
  <text x="500" y="236" text-anchor="middle" font-size="10" fill="#888">(无 old 减去)</text>

  <!-- 两分支汇合到入队 -->
  <line x1="70" y1="244" x2="70" y2="280" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="70" y1="280" x2="280" y2="280" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="500" y1="244" x2="500" y2="280" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="500" y1="280" x2="280" y2="280" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="280" y1="280" x2="280" y2="294" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 入队 ===== -->
  <rect x="160" y="298" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="11" fill="#333"><tspan font-weight="bold" fill="#446688">①</tspan> q.push(val)</text>
  <line x1="280" y1="332" x2="280" y2="346" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 更新 sum ===== -->
  <rect x="160" y="350" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="372" text-anchor="middle" font-size="11" fill="#333"><tspan font-weight="bold" fill="#d6a040">②</tspan> sum += val</text>
  <line x1="280" y1="384" x2="280" y2="398" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 返回 ===== -->
  <rect x="140" y="402" width="280" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="425" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold"><tspan font-weight="bold">③</tspan> return sum / q.size()</text>

  <!-- ===== 关键提示 ===== -->
  <rect x="40" y="450" width="490" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="54" y="465" font-size="10" fill="#b85450" font-weight="bold">⚠️ 顺序：先出队（满时）再入队——环形缓冲区原地覆盖时尤其不能反过来</text>
</svg>
