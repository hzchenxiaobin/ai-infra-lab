<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：两级哈希 —— 值→频次→频次唯一性</text>

  <!-- ===== Section A: input array ===== -->
  <text x="40" y="54" font-size="11" fill="#888" font-weight="bold">输入数组 arr：</text>

  <rect x="120" y="44" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="63" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="160" y="44" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="63" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="200" y="44" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="63" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="240" y="44" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="63" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="280" y="44" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="63" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="320" y="44" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="63" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <!-- arrow down to stage 1 -->
  <path d="M 230 72 L 230 92" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="246" y="86" font-size="10" fill="#888">计数</text>

  <!-- ===== Section B: stage 1 — frequency map ===== -->
  <text x="40" y="112" font-size="11" fill="#446688" font-weight="bold">第一级：值 → 出现次数（哈希表 freq）</text>

  <rect x="40" y="124" width="460" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>

  <rect x="60" y="138" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="155" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="140" y="155" font-size="11" fill="#888">→</text>
  <rect x="160" y="138" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="190" y="155" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3 次</text>

  <rect x="250" y="138" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="155" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="330" y="155" font-size="11" fill="#888">→</text>
  <rect x="350" y="138" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="155" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2 次</text>

  <rect x="60" y="170" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="187" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="140" y="187" font-size="11" fill="#888">→</text>
  <rect x="160" y="170" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="190" y="187" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1 次</text>

  <!-- arrow down to stage 2 -->
  <path d="M 270 202 L 270 222" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="286" y="216" font-size="10" fill="#888">查重</text>

  <!-- ===== Section C: stage 2 — uniqueness set ===== -->
  <text x="40" y="242" font-size="11" fill="#4a7a3a" font-weight="bold">第二级：次数 → 是否互不相同（哈希集合 seen）</text>

  <rect x="40" y="254" width="460" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>

  <rect x="70" y="268" width="50" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="95" y="286" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <text x="135" y="286" font-size="10" fill="#888">加入</text>

  <rect x="180" y="268" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="205" y="286" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <text x="245" y="286" font-size="10" fill="#888">加入</text>

  <rect x="290" y="268" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="315" y="286" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <text x="355" y="286" font-size="10" fill="#888">加入</text>

  <text x="410" y="286" font-size="11" fill="#4a7a3a" font-weight="bold">seen = {3,2,1}</text>

  <!-- arrow down to result -->
  <path d="M 270 310 L 270 326" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Section D: result ===== -->
  <rect x="150" y="328" width="240" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="348" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">三个次数互不相同 → true</text>

  <!-- ===== Section E: contrast example 2 ===== -->
  <text x="40" y="372" font-size="11" fill="#b85450" font-weight="bold">反例 arr=[1,2]：1→1次, 2→1次，次数 1 重复 → false</text>
  <rect x="380" y="360" width="120" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="440" y="378" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">seen 命中即返回</text>
</svg>
