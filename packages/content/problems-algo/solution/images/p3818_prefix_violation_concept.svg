<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：最右「违规对」一锤定音</text>

  <!-- 区域标签 -->
  <text x="205" y="66" text-anchor="middle" font-size="11.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">移除前缀 · 长度 = i*+1 = 4</text>
  <text x="380" y="66" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">保留后缀 · 严格递增 ✓</text>

  <!-- 最右违规强调 -->
  <text x="305" y="96" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 最右违规对：3 ≥ 3</text>
  <text x="305" y="112" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">（相等也算违规）</text>

  <!-- 切割线 -->
  <path d="M 305.5 118 L 305.5 258" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" fill="none" filter="url(#rough2)"/>

  <!-- 相邻对标记行 -->
  <text x="155" y="160" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗ 1≥−1</text>
  <text x="205" y="160" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="255" y="160" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="355" y="160" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="405" y="160" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <!-- 数组格子：移除部分（橙） -->
  <g filter="url(#rough2)">
    <rect x="107" y="185" width="46" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="157" y="185" width="46" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="207" y="185" width="46" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <rect x="257" y="185" width="46" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <!-- 数组格子：保留部分（绿） -->
  <g filter="url(#rough2)">
    <rect x="307" y="185" width="46" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="357" y="185" width="46" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="407" y="185" width="46" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>

  <!-- 元素值 -->
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="130" y="213">1</text>
    <text x="180" y="213">−1</text>
    <text x="230" y="213">2</text>
    <text x="280" y="213">3</text>
    <text x="330" y="213">3</text>
    <text x="380" y="213">4</text>
    <text x="430" y="213">5</text>
  </g>

  <!-- 下标 -->
  <g filter="url(#rough2)" font-size="10" fill="#999" text-anchor="middle">
    <text x="130" y="246">0</text>
    <text x="180" y="246">1</text>
    <text x="230" y="246">2</text>
    <text x="280" y="246">3</text>
    <text x="330" y="246">4</text>
    <text x="380" y="246">5</text>
    <text x="430" y="246">6</text>
  </g>

  <!-- 底部解释框 -->
  <g filter="url(#rough2)">
    <rect x="30" y="268" width="500" height="118" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="290" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold">答案 = i* + 1，其中 i* = 最右违规对的下标（本例 i* = 3）</text>
    <text x="280" y="312" text-anchor="middle" font-size="10.5" fill="#33506b">① k ≤ i*：后缀仍含相邻对 (i*, i*+1)，nums[i*] ≥ nums[i*+1] → 不严格递增</text>
    <text x="280" y="330" text-anchor="middle" font-size="10.5" fill="#33506b">② k = i*+1：i* 右侧再无任何违规对 → 后缀干净，严格递增 ✓</text>
    <text x="280" y="348" text-anchor="middle" font-size="10.5" fill="#33506b">③ 更靠左的违规（1 ≥ −1）随前缀一并移除，不碍事</text>
    <rect x="178" y="355" width="204" height="24" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="280" y="371" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold">最小移除长度 = i*+1 = 4</text>
  </g>
</svg>
