<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：start=3, dest=6</text>

  <!-- Step 1: find paths -->
  <rect x="30" y="44" width="500" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="64" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">步骤 ① 找两条根路径</text>

  <rect x="50" y="74" width="220" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="160" y="92" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">root → start(3)</text>
  <text x="160" y="112" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">pathStart = "LL"</text>

  <rect x="290" y="74" width="220" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="400" y="92" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">root → dest(6)</text>
  <text x="400" y="112" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">pathDest = "RL"</text>

  <!-- Step 2: strip common prefix -->
  <rect x="30" y="148" width="500" height="110" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="168" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">步骤 ② 逐字符比较，剥公共前缀</text>

  <!-- character comparison table -->
  <text x="90" y="194" font-size="11" fill="#666" filter="url(#rough2)">pathStart:</text>
  <rect x="170" y="180" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="199" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">L</text>
  <rect x="210" y="180" width="32" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="226" y="199" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">L</text>

  <text x="90" y="228" font-size="11" fill="#666" filter="url(#rough2)">pathDest:</text>
  <rect x="170" y="214" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="233" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">R</text>
  <rect x="210" y="214" width="32" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="226" y="233" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">L</text>

  <text x="270" y="204" font-size="20" fill="#b85450" font-weight="bold" filter="url(#rough2)">≠</text>
  <text x="320" y="200" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">首字符就不同</text>
  <text x="320" y="218" font-size="11" fill="#d6a040" filter="url(#rough2)">⇒ LCA = root(5)</text>
  <text x="320" y="236" font-size="11" fill="#333" filter="url(#rough2)">startRemain = "LL"</text>
  <text x="320" y="252" font-size="11" fill="#333" filter="url(#rough2)">destRemain = "RL"</text>

  <!-- Step 3: build answer -->
  <rect x="30" y="270" width="500" height="90" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="50" y="290" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">步骤 ③ 拼接答案</text>

  <rect x="50" y="300" width="120" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="110" y="318" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">'U' × len("LL")</text>
  <text x="110" y="338" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">"UU"</text>

  <text x="180" y="328" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">+</text>

  <rect x="195" y="300" width="100" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="245" y="318" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">destRemain</text>
  <text x="245" y="338" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">"RL"</text>

  <text x="305" y="328" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">=</text>

  <rect x="325" y="300" width="180" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="415" y="318" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">answer</text>
  <text x="415" y="338" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">"UURL"</text>

  <text x="280" y="384" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">3 →(U)→ 1 →(U)→ 5 →(R)→ 2 →(L)→ 6</text>
  <text x="280" y="404" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">O(n) 时间 · O(h) 空间 · 两次 DFS + 一次前缀比较</text>
</svg>
