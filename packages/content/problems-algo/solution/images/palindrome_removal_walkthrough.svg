<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：arr = [1, 3, 2, 2, 1]，答案 = 2</text>

  <!-- DP table header -->
  <text x="30" y="52" font-size="12" fill="#666" filter="url(#rough2)">dp 表（行 i，列 j）：</text>

  <!-- Column headers j=0..4 -->
  <rect x="100" y="58" width="50" height="26" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="125" y="76" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">j=0</text>
  <rect x="150" y="58" width="50" height="26" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="175" y="76" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">j=1</text>
  <rect x="200" y="58" width="50" height="26" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="225" y="76" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">j=2</text>
  <rect x="250" y="58" width="50" height="26" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="275" y="76" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">j=3</text>
  <rect x="300" y="58" width="50" height="26" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="325" y="76" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">j=4</text>

  <!-- Row i=0 -->
  <rect x="60" y="86" width="40" height="26" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="80" y="104" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=0</text>
  <rect x="100" y="86" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="125" y="104" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="150" y="86" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="175" y="104" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="200" y="86" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="225" y="104" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="250" y="86" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="275" y="104" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="300" y="86" width="50" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="325" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">2</text>

  <!-- Row i=1 -->
  <rect x="60" y="114" width="40" height="26" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="80" y="132" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=1</text>
  <rect x="100" y="114" width="50" height="26" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="125" y="132" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">—</text>
  <rect x="150" y="114" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="175" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="200" y="114" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="225" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="250" y="114" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="275" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="300" y="114" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="325" y="132" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <!-- Row i=2 -->
  <rect x="60" y="142" width="40" height="26" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="80" y="160" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=2</text>
  <rect x="100" y="142" width="50" height="26" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="125" y="160" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">—</text>
  <rect x="150" y="142" width="50" height="26" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="175" y="160" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">—</text>
  <rect x="200" y="142" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="225" y="160" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="250" y="142" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="275" y="160" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="300" y="142" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="325" y="160" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <!-- Row i=3 -->
  <rect x="60" y="170" width="40" height="26" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="80" y="188" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=3</text>
  <rect x="100" y="170" width="50" height="26" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="125" y="188" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">—</text>
  <rect x="150" y="170" width="50" height="26" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="175" y="188" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">—</text>
  <rect x="200" y="170" width="50" height="26" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="225" y="188" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">—</text>
  <rect x="250" y="170" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="275" y="188" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="300" y="170" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="325" y="188" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>

  <!-- Row i=4 -->
  <rect x="60" y="198" width="40" height="26" fill="#f5f5f5" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="80" y="216" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">i=4</text>
  <rect x="100" y="198" width="50" height="26" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="125" y="216" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">—</text>
  <rect x="150" y="198" width="50" height="26" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="175" y="216" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">—</text>
  <rect x="200" y="198" width="50" height="26" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="225" y="216" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">—</text>
  <rect x="250" y="198" width="50" height="26" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="275" y="216" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">—</text>
  <rect x="300" y="198" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="325" y="216" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>

  <!-- Legend -->
  <rect x="380" y="86" width="12" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="398" y="96" font-size="10" fill="#555" filter="url(#rough2)">len=1 或配对</text>
  <rect x="380" y="102" width="12" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="398" y="112" font-size="10" fill="#555" filter="url(#rough2)">分割得来</text>
  <rect x="380" y="118" width="12" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="398" y="128" font-size="10" fill="#555" filter="url(#rough2)">最终答案</text>

  <!-- Key cell annotation -->
  <path d="M325,108 L325,240 L200,240" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="210" y="255" font-size="11" fill="#b85450" filter="url(#rough2)">dp[0][4] = dp[1][3] = 2</text>
  <text x="210" y="270" font-size="11" fill="#b85450" filter="url(#rough2)">(arr[0]==arr[4], 配对！)</text>

  <!-- Removal steps -->
  <text x="30" y="300" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">最优删除序列：</text>

  <!-- Step 1 -->
  <rect x="30" y="312" width="500" height="55" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="45" y="332" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">第 1 步：</text>
  <rect x="110" y="320" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="128" y="339" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="146" y="320" width="36" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="164" y="339" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="200" y="339" font-size="12" fill="#555" filter="url(#rough2)">← 回文子数组 [2, 2]，删除后 →</text>
  <rect x="380" y="320" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="398" y="339" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="416" y="320" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="434" y="339" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="452" y="320" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="470" y="339" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="45" y="358" font-size="11" fill="#666" filter="url(#rough2)">数组变为 [1, 3, 1]</text>

  <!-- Step 2 -->
  <rect x="30" y="378" width="500" height="55" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="45" y="398" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">第 2 步：</text>
  <rect x="110" y="386" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="128" y="405" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="146" y="386" width="36" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="164" y="405" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="182" y="386" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="405" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="240" y="405" font-size="12" fill="#555" filter="url(#rough2)">← 整段 [1, 3, 1] 是回文，一次删完</text>
  <text x="45" y="424" font-size="11" fill="#666" filter="url(#rough2)">数组清空，总共 2 次操作 ✓</text>

  <!-- Arrow between steps -->
  <path d="M280,369 L280,378" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Bottom note -->
  <text x="280" y="458" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">💡 dp[0][4] 命中 arr[0]==arr[4]，取 dp[1][3]=2，无需额外分割</text>
</svg>
