<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrC" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：最大子串必是后缀 → 双指针求最大后缀</text>

  <!-- ===== Section A: 最大子串必是后缀 ===== -->
  <text x="40" y="58" font-size="12" fill="#888" font-weight="bold">① 任意子串延伸到末尾只增不减：</text>

  <text x="40" y="84" font-size="11" fill="#888">子串 s[i..j]：</text>
  <!-- leet (substring) over leetcode, i=0 j=3 -->
  <rect x="120" y="68" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="137" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">l</text>
  <rect x="154" y="68" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="171" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">e</text>
  <rect x="188" y="68" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="205" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">e</text>
  <rect x="222" y="68" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="239" y="88" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">t</text>
  <rect x="256" y="68" width="34" height="30" fill="#f2f2f2" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3" rx="4" filter="url(#rough2)"/>
  <text x="273" y="88" text-anchor="middle" font-size="11" fill="#aaa">…</text>

  <text x="300" y="88" font-size="11" fill="#888">「leet」</text>

  <!-- extension arrow -->
  <path d="M 200 108 Q 200 122 240 122" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrC)" filter="url(#rough2)"/>
  <text x="246" y="126" font-size="10" fill="#d6a040" font-weight="bold">延伸到末尾</text>

  <text x="40" y="150" font-size="11" fill="#888">后缀 s[i..n-1]：</text>
  <!-- full suffix leetcode -->
  <rect x="120" y="134" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="137" y="154" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">l</text>
  <rect x="154" y="134" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="171" y="154" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">e</text>
  <rect x="188" y="134" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="205" y="154" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">e</text>
  <rect x="222" y="134" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="239" y="154" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">t</text>
  <rect x="256" y="134" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="273" y="154" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">c</text>
  <rect x="290" y="134" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="307" y="154" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">o</text>
  <rect x="324" y="134" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="341" y="154" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">d</text>
  <rect x="358" y="134" width="34" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="375" y="154" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">e</text>

  <text x="300" y="154" font-size="11" fill="#4a7a3a" font-weight="bold">「leetcode」&gt; 「leet」</text>

  <text x="120" y="178" font-size="10" fill="#888" font-style="italic">原串是后缀的真前缀 → 后缀必更大，故答案必落在某个后缀上</text>

  <line x1="30" y1="196" x2="530" y2="196" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Section B: 双指针比较两个后缀 ===== -->
  <text x="40" y="218" font-size="12" fill="#888" font-weight="bold">② 双指针 i、j 比较两个候选后缀（偏移 k 对齐字符）：</text>

  <!-- string abab, compare suffix i=0 vs j=1 -->
  <text x="40" y="246" font-size="11" fill="#888">s =</text>
  <rect x="80" y="230" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="251" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="120" y="230" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="140" y="251" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
  <rect x="160" y="230" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="251" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="200" y="230" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="251" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>

  <!-- pointer labels -->
  <text x="100" y="276" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">i</text>
  <text x="140" y="276" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">j</text>

  <!-- k=0 offset markers: compare s[i+k] vs s[j+k] -->
  <path d="M 100 284 Q 100 296 120 296" stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 140 284 Q 140 296 120 296" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="120" y="310" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold">k=0 对齐</text>

  <text x="260" y="246" font-size="11" fill="#555">比较 s[i+k] 与 s[j+k]：</text>
  <text x="260" y="266" font-size="10.5" fill="#b85450">s[0]='a'</text>
  <text x="318" y="266" font-size="11" fill="#888">&lt;</text>
  <text x="332" y="266" font-size="10.5" fill="#4a7a3a">s[1]='b'</text>
  <text x="380" y="266" font-size="10.5" fill="#d6a040" font-weight="bold">→ i 落败，i = i+k+1</text>

  <text x="260" y="290" font-size="10" fill="#888">i 指向的后缀较小，且 i..i+k 内任一</text>
  <text x="260" y="304" font-size="10" fill="#888">起点都败给对应 j 偏移 → 整段跳过</text>

  <!-- bottom takeaway box -->
  <rect x="30" y="330" width="500" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="352" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">两个关键结论</text>
  <line x1="50" y1="360" x2="510" y2="360" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="44" y="378" font-size="10.5" fill="#555">① 答案必是某个后缀（延伸只增不减）→ 在 n 个后缀里找最大者</text>
  <text x="44" y="394" font-size="10.5" fill="#555">② 失配时 i..i+k（或 j..j+k）整段不可能胜出 → 一次跳 k+1 步，均摊 O(n)</text>
</svg>
