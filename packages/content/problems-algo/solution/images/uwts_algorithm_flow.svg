<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：合并两句 → 计数 → 过滤 == 1</text>

  <!-- Step 1: merge two sentences -->
  <rect x="150" y="48" width="260" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">合并 s1 + " " + s2</text>
  <text x="280" y="84" text-anchor="middle" font-size="10" fill="#666">拼接成统一词流（中间补空格防粘连）</text>
  <path d="M 280 94 L 280 114" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: split -->
  <rect x="150" y="118" width="260" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="138" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">切分为单词序列</text>
  <text x="280" y="154" text-anchor="middle" font-size="10" fill="#666">istringstream / split() 按空格切词</text>
  <path d="M 280 164 L 280 184" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: loop box -->
  <rect x="80" y="188" width="400" height="100" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="208" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">遍历每个单词 w：</text>

  <rect x="180" y="220" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="280" y="238" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">cnt[w] += 1</text>
  <text x="280" y="252" text-anchor="middle" font-size="10" fill="#666">哈希表聚合总频次</text>

  <!-- loop back arrow -->
  <path d="M 380 240 C 420 240, 430 206, 280 206" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="200" font-size="10" fill="#4a7a3a">下一个单词</text>

  <!-- step 4: filter -->
  <path d="M 280 290 L 280 312" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="120" y="316" width="320" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="336" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">过滤：收集 cnt[w] == 1 的词</text>
  <text x="280" y="352" text-anchor="middle" font-size="10" fill="#666">总频次为 1 ⟺ 不常见（见归约）</text>

  <!-- output -->
  <path d="M 280 368 L 280 390" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="180" y="394" width="200" height="34" fill="#446688" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="416" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">返回 ["sweet","sour"]</text>
</svg>
