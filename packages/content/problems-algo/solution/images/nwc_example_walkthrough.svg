<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="360" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：properties = [[1,5],[10,4],[4,3]]</text>

  <!-- sorted hint -->
  <rect x="150" y="40" width="300" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">排序后：[10,4] → [4,3] → [1,5]</text>

  <!-- table header -->
  <rect x="40" y="76" width="520" height="28" fill="#446688" filter="url(#rough2)"/>
  <text x="80" y="94" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">步骤</text>
  <text x="180" y="94" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">角色 (攻, 防)</text>
  <text x="300" y="94" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">max_def (前)</text>
  <text x="420" y="94" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">判定</text>
  <text x="520" y="94" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">max_def (后)</text>

  <!-- column separators -->
  <line x1="120" y1="76" x2="120" y2="240" stroke="#fff" stroke-width="1" filter="url(#rough2)"/>
  <line x1="240" y1="76" x2="240" y2="240" stroke="#fff" stroke-width="1" filter="url(#rough2)"/>
  <line x1="360" y1="76" x2="360" y2="240" stroke="#fff" stroke-width="1" filter="url(#rough2)"/>
  <line x1="480" y1="76" x2="480" y2="240" stroke="#fff" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 1 -->
  <rect x="40" y="104" width="520" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="130" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <text x="180" y="130" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">10, 4</text>
  <text x="300" y="130" text-anchor="middle" font-size="12" fill="#888">0</text>
  <text x="420" y="130" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4 &gt; 0，非弱</text>
  <text x="520" y="130" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4</text>

  <!-- row 2 -->
  <rect x="40" y="148" width="520" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="174" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>
  <text x="180" y="174" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4, 3</text>
  <text x="300" y="174" text-anchor="middle" font-size="12" fill="#888">4</text>
  <text x="420" y="174" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3 &lt; 4，弱!</text>
  <text x="520" y="174" text-anchor="middle" font-size="12" fill="#888">4</text>

  <!-- row 3 -->
  <rect x="40" y="192" width="520" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="218" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
  <text x="180" y="218" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1, 5</text>
  <text x="300" y="218" text-anchor="middle" font-size="12" fill="#888">4</text>
  <text x="420" y="218" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">5 &gt; 4，非弱</text>
  <text x="520" y="218" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">5</text>

  <!-- explanation -->
  <rect x="60" y="252" width="480" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="272" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">第 2 步：max_def=4 来自 [10,4]（攻击 10 &gt; 4 严格更大）</text>
  <text x="300" y="288" text-anchor="middle" font-size="11" fill="#444">故 [4,3] 被 [10,4] 双属性严格压制，记为弱角色</text>

  <!-- result -->
  <rect x="210" y="308" width="180" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="330" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">ans = 1</text>
</svg>
