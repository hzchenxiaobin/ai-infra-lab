<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">湍流子数组：相邻元素比较符号交替翻转（ &gt; &lt; &gt; &lt; … ）</text>

  <!-- ===== Row 1: Turbulent (valid) ===== -->
  <text x="40" y="62" font-size="12" fill="#4a7a3a" font-weight="bold">湍流 ✓</text>

  <!-- value labels -->
  <text x="120" y="58" text-anchor="middle" font-size="11" fill="#4a7a3a">4</text>
  <text x="180" y="58" text-anchor="middle" font-size="11" fill="#4a7a3a">2</text>
  <text x="240" y="58" text-anchor="middle" font-size="11" fill="#4a7a3a">10</text>
  <text x="300" y="58" text-anchor="middle" font-size="11" fill="#4a7a3a">7</text>
  <text x="360" y="58" text-anchor="middle" font-size="11" fill="#4a7a3a">8</text>

  <!-- zigzag path: 4→2(down) 2→10(up) 10→7(down) 7→8(up) -->
  <path d="M 120 70 L 180 110 L 240 50 L 300 90 L 360 78"
        stroke="#4a7a3a" stroke-width="2.2" fill="none" filter="url(#rough2)"/>

  <!-- points -->
  <circle cx="120" cy="70" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="180" cy="110" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="240" cy="50" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="300" cy="90" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="360" cy="78" r="4" fill="#4a7a3a" filter="url(#rough2)"/>

  <!-- comparison signs between points -->
  <text x="150" y="130" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">&gt;</text>
  <text x="210" y="44" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">&lt;</text>
  <text x="270" y="106" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">&gt;</text>
  <text x="330" y="70" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">&lt;</text>

  <text x="430" y="90" font-size="11" fill="#4a7a3a">符号交替 → 长度 5</text>

  <!-- ===== Row 2: Non-turbulent (monotonic) ===== -->
  <text x="40" y="162" font-size="12" fill="#b85450" font-weight="bold">非湍流 ✗</text>

  <text x="120" y="158" text-anchor="middle" font-size="11" fill="#888">4</text>
  <text x="180" y="158" text-anchor="middle" font-size="11" fill="#888">8</text>
  <text x="240" y="158" text-anchor="middle" font-size="11" fill="#888">12</text>
  <text x="300" y="158" text-anchor="middle" font-size="11" fill="#888">16</text>

  <!-- straight upward line -->
  <path d="M 120 170 L 180 150 L 240 130 L 300 110"
        stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>

  <circle cx="120" cy="170" r="4" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="180" cy="150" r="4" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="240" cy="130" r="4" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="300" cy="110" r="4" fill="#b85450" filter="url(#rough2)"/>

  <text x="150" y="184" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">&lt;</text>
  <text x="210" y="164" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">&lt;</text>
  <text x="270" y="144" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">&lt;</text>

  <text x="360" y="150" font-size="11" fill="#b85450">符号相同（全 &lt;）→ 中断</text>

  <!-- ===== Row 3: Non-turbulent (equal) ===== -->
  <text x="40" y="232" font-size="12" fill="#b85450" font-weight="bold">非湍流 ✗</text>

  <text x="120" y="228" text-anchor="middle" font-size="11" fill="#888">8</text>
  <text x="180" y="228" text-anchor="middle" font-size="11" fill="#888">8</text>
  <text x="240" y="228" text-anchor="middle" font-size="11" fill="#888">1</text>

  <!-- flat then down -->
  <path d="M 120 240 L 180 240 L 240 260"
        stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>

  <circle cx="120" cy="240" r="4" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="180" cy="240" r="4" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="240" cy="260" r="4" fill="#b85450" filter="url(#rough2)"/>

  <text x="150" y="256" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">=</text>
  <text x="210" y="276" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">&gt;</text>

  <text x="300" y="250" font-size="11" fill="#b85450">相等 → 立即中断</text>

  <!-- ===== Key insight box ===== -->
  <rect x="40" y="300" width="460" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="324" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">核心：湍流 = 比较符号交替（ &gt;&lt;&gt;&lt; 或 &lt;&gt;&lt;&gt; ）</text>
  <text x="270" y="344" text-anchor="middle" font-size="11" fill="#666">相邻元素相等 → 窗口重置为单元素（left = right）</text>
  <text x="270" y="362" text-anchor="middle" font-size="11" fill="#666">符号未翻转（同向） → 从 right−1 重新开始（left = right−1）</text>
</svg>
