<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：每个 str1 字符有 2 个候选值，逐字符贪心匹配 str2</text>

  <!-- cyclic increment strip -->
  <text x="40" y="66" font-size="11" fill="#888">循环递增：</text>
  <rect x="110" y="52" width="34" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="127" y="71" text-anchor="middle" font-size="12" fill="#999">x</text>
  <rect x="148" y="52" width="34" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="165" y="71" text-anchor="middle" font-size="12" fill="#999">y</text>
  <rect x="186" y="52" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="203" y="71" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">z</text>
  <rect x="224" y="52" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="241" y="71" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">a</text>
  <rect x="262" y="52" width="34" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="279" y="71" text-anchor="middle" font-size="12" fill="#999">b</text>

  <!-- wrap-around arc z -> a -->
  <path d="M203,50 Q212,32 241,50" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="222" y="30" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">绕回</text>

  <!-- str1 row -->
  <text x="40" y="148" font-size="12" fill="#888">str1:</text>
  <rect x="110" y="130" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="135" y="153" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">z</text>
  <rect x="300" y="130" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="325" y="153" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">c</text>

  <!-- candidate boxes under z -->
  <text x="100" y="186" font-size="9" fill="#aaa">不变</text>
  <rect x="110" y="190" width="40" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="130" y="208" text-anchor="middle" font-size="12" fill="#999">z</text>
  <text x="170" y="186" font-size="9" fill="#aaa">+1</text>
  <rect x="170" y="190" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="190" y="208" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">a</text>

  <!-- candidate boxes under c -->
  <text x="290" y="186" font-size="9" fill="#aaa">不变</text>
  <rect x="300" y="190" width="40" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="320" y="208" text-anchor="middle" font-size="12" fill="#999">c</text>
  <text x="360" y="186" font-size="9" fill="#aaa">+1</text>
  <rect x="360" y="190" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="380" y="208" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">d</text>

  <!-- arrows from chosen candidates to str2 -->
  <path d="M190,218 L190,260 L160,278" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M380,218 L380,260 L360,278" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- str2 row -->
  <text x="40" y="296" font-size="12" fill="#888">str2:</text>
  <rect x="130" y="278" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="301" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">a</text>
  <rect x="330" y="278" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="355" y="301" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">d</text>

  <!-- key idea box -->
  <rect x="40" y="330" width="460" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="350" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">str1[i] == str2[j] 或 next(str1[i]) == str2[j] 即匹配，j 前进</text>
  <text x="270" y="366" text-anchor="middle" font-size="11" fill="#555">每位独立决定是否递增 → 贪心取最早匹配，剩余空间更大</text>
</svg>
