<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 320"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="320" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：items = [[50,1],[10,8]], capacity = 5</text>

  <!-- 排序说明 -->
  <rect x="60" y="40" width="420" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="270" y="58" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">单价：50/1 = 50 &gt; 10/8 = 1.25 → 排序后仍为 [[50,1],[10,8]]</text>

  <!-- 表格 x=20..520, y=78..230 -->
  <!-- 列边界：20,80,180,270,370,460,520 -->
  <g stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)">
    <rect x="20" y="78" width="500" height="152" rx="4"/>
    <line x1="80" y1="78" x2="80" y2="230"/>
    <line x1="180" y1="78" x2="180" y2="230"/>
    <line x1="270" y1="78" x2="270" y2="230"/>
    <line x1="370" y1="78" x2="370" y2="230"/>
    <line x1="460" y1="78" x2="460" y2="230"/>
    <line x1="20" y1="110" x2="520" y2="110"/>
    <line x1="20" y1="150" x2="520" y2="150"/>
    <line x1="20" y1="190" x2="520" y2="190"/>
  </g>

  <!-- 表头 -->
  <text x="50" y="100" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">步骤</text>
  <text x="130" y="100" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">物品 [p, w]</text>
  <text x="225" y="100" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">单价 p/w</text>
  <text x="320" y="100" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">取 v=min(w,cap)</text>
  <text x="415" y="100" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">价格 v/w·p</text>
  <text x="490" y="100" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">剩余cap</text>

  <!-- 第 1 行：物品 [50,1] 整块取 -->
  <text x="50" y="134" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="130" y="134" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">[50, 1]</text>
  <text x="225" y="134" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">50</text>
  <text x="320" y="134" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">min(1, 5) = 1</text>
  <text x="415" y="134" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1/1×50 = 50</text>
  <text x="490" y="134" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>

  <!-- 第 2 行：物品 [10,8] 切一部分 -->
  <text x="50" y="174" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="130" y="174" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">[10, 8]</text>
  <text x="225" y="174" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1.25</text>
  <text x="320" y="174" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">min(8, 4) = 4</text>
  <text x="415" y="174" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4/8×10 = 5</text>
  <text x="490" y="174" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>

  <!-- 结果行 -->
  <text x="50" y="214" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">结果</text>
  <text x="130" y="214" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">capacity = 0</text>
  <text x="320" y="214" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">恰好装满 ✓</text>
  <text x="415" y="214" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans = 50 + 5 = 55</text>
  <text x="490" y="214" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">→55</text>

  <!-- 切分注释 -->
  <rect x="20" y="244" width="500" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="270" y="266" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">物品 [10,8] 被切下 4/8：剩余容量仅差 4，取 v=4 恰好填满，价 4/8×10=5</text>

  <!-- 示例 2 -->
  <rect x="20" y="284" width="500" height="28" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="270" y="302" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">示例 2：[[100,30]], cap=50 → 总重 30 &lt; 50，装不满，return -1</text>
</svg>
