<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：两次线性扫描 O(n)</text>

  <!-- Start -->
  <ellipse cx="260" cy="56" rx="42" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="61" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">开始</text>

  <path d="M 260 74 L 260 92" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init -->
  <rect x="130" y="96" width="260" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="117" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">answer = [0] × n</text>
  <text x="260" y="133" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">leftCount = 0, leftOps = 0</text>

  <path d="M 260 142 L 260 162" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Pass 1: left to right -->
  <rect x="60" y="166" width="400" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="186" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">Pass 1（左→右）　i = 0 → n−1</text>
  <text x="260" y="206" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">leftOps += leftCount</text>
  <text x="260" y="222" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">answer[i] = leftOps</text>
  <text x="260" y="238" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">if boxes[i]=='1': leftCount += 1</text>

  <!-- left-right arrow for pass 1 -->
  <path d="M 40 206 L 56 206" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <path d="M 260 246 L 260 266" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Pass 2: right to left -->
  <rect x="60" y="270" width="400" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="290" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Pass 2（右→左）　i = n−1 → 0</text>
  <text x="260" y="310" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">rightOps += rightCount</text>
  <text x="260" y="326" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">answer[i] += rightOps</text>
  <text x="260" y="342" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">if boxes[i]=='1': rightCount += 1</text>

  <!-- right-left arrow for pass 2 -->
  <path d="M 56 310 L 40 310" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)" transform="rotate(180 48 310)"/>

  <path d="M 260 350 L 260 370" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Return -->
  <ellipse cx="260" cy="396" rx="92" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="401" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return answer</text>
</svg>
