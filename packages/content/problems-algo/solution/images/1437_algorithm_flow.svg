<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：遍历记上一个 1 的下标 prev，遇新 1 判间距 ≥ k</text>

  <!-- Start -->
  <ellipse cx="170" cy="44" rx="36" ry="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="48" text-anchor="middle" font-size="12" fill="#333">开始</text>
  <path d="M 170 57 L 170 67" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box: prev = -1; i = 0 -->
  <rect x="100" y="69" width="140" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="88" text-anchor="middle" font-size="11.5" fill="#333">prev = -1；i = 0</text>
  <path d="M 170 99 L 170 109" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: i < n ? -->
  <polygon points="170,111 238,137 170,163 102,137" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="141" text-anchor="middle" font-size="12" fill="#333">i &lt; n ?</text>

  <!-- No branch left -> return true -->
  <path d="M 102 137 L 90 137" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="98" y="131" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <rect x="10" y="121" width="80" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="50" y="141" text-anchor="middle" font-size="11.5" fill="#333">返回 true</text>
  <path d="M 50 153 L 50 165" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="50" cy="178" rx="30" ry="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="50" y="182" text-anchor="middle" font-size="11.5" fill="#333">结束</text>

  <!-- Yes branch down -->
  <path d="M 170 163 L 170 173" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="178" y="170" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Diamond: nums[i] == 1 ? -->
  <polygon points="170,175 238,201 170,227 102,201" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="205" text-anchor="middle" font-size="11.5" fill="#333">nums[i] == 1 ?</text>

  <!-- No branch right -> i += 1 -->
  <path d="M 238 201 L 318 201" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="250" y="195" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <rect x="318" y="187" width="80" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="358" y="205" text-anchor="middle" font-size="11.5" fill="#333">i += 1</text>

  <!-- loop back from i+=1 to i<n? diamond (right side up) -->
  <path d="M 358 187 L 358 137 L 238 137" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="300" y="131" font-size="10" fill="#4a7a3a">回到判断</text>

  <!-- Yes branch down -->
  <path d="M 170 227 L 170 237" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="178" y="234" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Diamond: 间距 < k ? -->
  <polygon points="170,239 244,271 170,303 100,271" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="268" text-anchor="middle" font-size="11.5" fill="#333">间距 &lt; k ?</text>
  <text x="170" y="282" text-anchor="middle" font-size="9.5" fill="#888">i − prev − 1</text>

  <!-- side note: first 1 -->
  <text x="252" y="262" font-size="9.5" fill="#888">prev = -1 即首个 1：</text>
  <text x="252" y="274" font-size="9.5" fill="#888">间距视为 +∞，必通过</text>

  <!-- Yes branch left -> return false -->
  <path d="M 100 271 L 90 271" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="98" y="265" font-size="10.5" fill="#b85450" font-weight="bold">是</text>
  <rect x="10" y="255" width="80" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="50" y="275" text-anchor="middle" font-size="11.5" fill="#333">返回 false</text>
  <path d="M 50 287 L 50 299" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="50" cy="312" rx="30" ry="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="50" y="316" text-anchor="middle" font-size="11.5" fill="#333">结束</text>

  <!-- No branch down -> prev = i -->
  <path d="M 170 303 L 170 313" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="178" y="310" font-size="10.5" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="120" y="315" width="100" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="333" text-anchor="middle" font-size="11.5" fill="#333">prev = i</text>

  <!-- join prev=i to i+=1 (right side, around return-false which is on left) -->
  <path d="M 170 343 L 358 343 L 358 215" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="244" y="338" font-size="10" fill="#4a7a3a">接着 i += 1</text>

  <!-- footer note -->
  <rect x="60" y="372" width="440" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="392" text-anchor="middle" font-size="11" fill="#555">一趟遍历 O(n)；额外仅用 prev 一个变量，空间 O(1)</text>
  <text x="280" y="408" text-anchor="middle" font-size="10.5" fill="#888">间距 = i − prev − 1（两个 1 之间的元素个数），需 ≥ k</text>
  <text x="280" y="420" text-anchor="middle" font-size="10" fill="#888">首个 1 无前驱，prev = -1 时跳过判定</text>
</svg>
