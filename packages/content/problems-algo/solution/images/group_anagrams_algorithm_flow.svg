<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 350" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="350" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一次遍历，按签名入桶</text>

  <!-- Start ellipse -->
  <ellipse cx="270" cy="54" rx="74" ry="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="59" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">map = {}</text>

  <!-- arrow down -->
  <path d="M 270 71 L 270 80" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- 取出 s -->
  <rect x="200" y="82" width="140" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="101" text-anchor="middle" font-size="12" fill="#333">遍历每个字符串 s</text>

  <!-- arrow down -->
  <path d="M 270 112 L 270 121" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- 计算 key -->
  <rect x="180" y="123" width="180" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="143" text-anchor="middle" font-size="12" fill="#333">计算签名 key（排序 / 计数）</text>

  <!-- arrow down to diamond -->
  <path d="M 270 155 L 270 166" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Diamond 1: key 在 map 中？ -->
  <polygon points="270,168 370,196 270,224 170,196" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="270" y="200" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">key 在 map 中？</text>

  <!-- Yes branch (left) -->
  <text x="150" y="190" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 170 196 L 158 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <rect x="20" y="181" width="138" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="89" y="200" text-anchor="middle" font-size="11.5" fill="#333">map[key].push(s)</text>

  <!-- No branch (right) -->
  <text x="390" y="190" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M 370 196 L 382 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <rect x="384" y="181" width="132" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="450" y="200" text-anchor="middle" font-size="11.5" fill="#333">map[key] = [s]</text>

  <!-- merge arrows down to diamond 2 -->
  <path d="M 89 211 L 89 240 L 270 240 L 270 250" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <path d="M 450 211 L 450 240 L 270 240" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- Diamond 2: 遍历完？ -->
  <polygon points="270,252 350,276 270,300 190,276" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="270" y="280" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">遍历完？</text>

  <!-- No: loop back to 取出 s -->
  <text x="172" y="270" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M 190 276 L 14 276 L 14 97 L 198 97" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrF)" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- Yes: down to return -->
  <text x="282" y="316" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 270 300 L 270 310" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <rect x="190" y="312" width="160" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="6" filter="url(#rough2)"/>
  <text x="270" y="331" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 map.values()</text>
</svg>
