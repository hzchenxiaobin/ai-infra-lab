<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="480" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">公式推导：S(k) = 2k(k+1)(2k+1)</text>
  <text x="300" y="48" text-anchor="middle" font-size="11" fill="#888">正方形 [-k,k]×[-k,k] 内的苹果总数</text>

  <!-- Step 1: definition -->
  <rect x="40" y="66" width="520" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="88" font-size="12" fill="#446688" font-weight="bold">① 定义</text>
  <text x="56" y="108" font-size="13" fill="#333">S(k) = ΣΣ (|i|+|j|),  i,j ∈ [-k, k]</text>

  <!-- arrow down -->
  <path d="M 300 126 L 300 142" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 2: split sum -->
  <rect x="40" y="148" width="520" height="74" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="170" font-size="12" fill="#d6a040" font-weight="bold">② 拆分：|i|+|j| 拆成两个独立求和</text>
  <text x="56" y="190" font-size="12" fill="#333">= ΣΣ |i|  +  ΣΣ |j|</text>
  <text x="56" y="210" font-size="12" fill="#333">= (2k+1)·Σ|i|  +  (2k+1)·Σ|j|</text>

  <!-- arrow down -->
  <path d="M 300 226 L 300 242" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 3: symmetry -->
  <rect x="40" y="248" width="520" height="74" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="270" font-size="12" fill="#d6a040" font-weight="bold">③ 对称性：|i| 与 |j| 同构</text>
  <text x="56" y="290" font-size="12" fill="#333">= 2·(2k+1)·Σ|i|,  i ∈ [-k, k]</text>
  <text x="56" y="310" font-size="12" fill="#333">Σ|i| = 0 + 2·(1+2+...+k) = k(k+1)</text>

  <!-- arrow down -->
  <path d="M 300 326 L 300 342" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 4: final -->
  <rect x="40" y="348" width="520" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="56" y="370" font-size="12" fill="#4a7a3a" font-weight="bold">④ 代入求和公式</text>
  <text x="56" y="390" font-size="14" fill="#b85450" font-weight="bold">S(k) = 2·(2k+1)·k(k+1) = 2k(k+1)(2k+1)</text>

  <!-- verify box -->
  <rect x="40" y="418" width="520" height="50" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="56" y="438" font-size="11" fill="#b85450" font-weight="bold">✓ 验证：k=1 → S(1)=2×1×2×3=12 ✓   k=2 → S(2)=2×2×3×5=60 ✓</text>
  <text x="56" y="456" font-size="11" fill="#888">周长 = 4 × 边长 = 4 × 2k = 8k</text>
</svg>
