<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：FROM → JOIN → WHERE → SELECT DISTINCT</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888">SQL 逻辑执行顺序（一次 JOIN 扫描同时完成连接与过滤）</text>

  <!-- Step 1: FROM -->
  <rect x="180" y="64" width="200" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="82" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">① FROM TVProgram</text>
  <text x="280" y="96" text-anchor="middle" font-size="9" fill="#555">读取 6 行节目播出记录</text>
  <path d="M 280 104 L 280 120" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: JOIN -->
  <rect x="150" y="122" width="260" height="48" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="141" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">② JOIN Content ON content_id</text>
  <text x="280" y="158" text-anchor="middle" font-size="9" fill="#555">按 content_id 把「播出记录」拼上「内容属性」</text>
  <text x="280" y="170" text-anchor="middle" font-size="9" fill="#888" font-family="'Comic Sans MS', monospace">date | cid | channel | title | Kids | type</text>
  <path d="M 280 170 L 280 186" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: WHERE (decision diamond-ish) -->
  <rect x="120" y="188" width="320" height="86" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="207" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">③ WHERE 三条件 AND 过滤</text>
  <text x="140" y="225" font-size="9.5" fill="#446688" font-family="'Comic Sans MS', monospace">① DATE_FORMAT(program_date,'%Y-%m')='2020-06'</text>
  <text x="140" y="240" font-size="9.5" fill="#4a7a3a" font-family="'Comic Sans MS', monospace">② Kids_content = 'Y'</text>
  <text x="140" y="255" font-size="9.5" fill="#d6a040" font-family="'Comic Sans MS', monospace">③ content_type = 'Movies'</text>
  <text x="280" y="269" text-anchor="middle" font-size="9" fill="#888">6 行 → 仅 06-18 的 content_id=4 (Aladdin) 留下</text>
  <path d="M 280 274 L 280 290" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: SELECT DISTINCT -->
  <rect x="180" y="292" width="200" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="311" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">④ SELECT DISTINCT title</text>
  <text x="280" y="326" text-anchor="middle" font-size="9" fill="#555">投影 title 列 + 去重（同名只留一次）</text>
  <path d="M 280 336 L 280 352" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Result -->
  <rect x="200" y="354" width="160" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="372" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">结果</text>
  <text x="280" y="390" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">Aladdin</text>

  <!-- side annotations -->
  <text x="470" y="146" text-anchor="middle" font-size="9.5" fill="#446688">内连接</text>
  <text x="470" y="158" text-anchor="middle" font-size="9" fill="#888">ON 匹配</text>
  <text x="470" y="231" text-anchor="middle" font-size="9.5" fill="#d6a040">短路 AND</text>
  <text x="470" y="243" text-anchor="middle" font-size="9" fill="#888">逐行判定</text>
  <text x="470" y="316" text-anchor="middle" font-size="9.5" fill="#4a7a3a">投影去重</text>

  <!-- footer -->
  <text x="280" y="424" text-anchor="middle" font-size="10" fill="#888">FROM 取源表 → JOIN 拼属性 → WHERE 三条件 AND → SELECT DISTINCT 投影去重</text>
  <text x="280" y="442" text-anchor="middle" font-size="9.5" fill="#aaa">JOIN 与 WHERE 在同一趟扫描中完成，无需先物化笛卡尔积</text>
</svg>
