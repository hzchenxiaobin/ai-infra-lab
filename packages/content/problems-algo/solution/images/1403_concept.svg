<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L8 5 L0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L8 5 L0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：降序排序 → 贪心取前缀 → 累加超过半和即停</text>

  <!-- 原数组 -->
  <text x="40" y="56" font-size="12" fill="#666" font-weight="bold">原数组</text>
  <g filter="url(#rough2)">
    <rect x="100" y="64" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="124" y="84" text-anchor="middle" font-size="12" fill="#333">4</text>
    <rect x="148" y="64" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="172" y="84" text-anchor="middle" font-size="12" fill="#333">3</text>
    <rect x="196" y="64" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="220" y="84" text-anchor="middle" font-size="12" fill="#333">10</text>
    <rect x="244" y="64" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="268" y="84" text-anchor="middle" font-size="12" fill="#333">9</text>
    <rect x="292" y="64" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="316" y="84" text-anchor="middle" font-size="12" fill="#333">8</text>
  </g>
  <text x="370" y="80" font-size="12" fill="#b85450" font-weight="bold">总和 total = 34</text>

  <!-- 排序箭头 -->
  <path d="M 220 98 L 220 118" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="300" y="112" font-size="11" fill="#446688" font-weight="bold">排序(降序)</text>

  <!-- 排序后数组 -->
  <text x="40" y="136" font-size="12" fill="#666" font-weight="bold">排序后</text>
  <g filter="url(#rough2)">
    <rect x="100" y="144" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="124" y="164" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">10</text>
    <rect x="148" y="144" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="172" y="164" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>
    <rect x="196" y="144" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="220" y="164" text-anchor="middle" font-size="12" fill="#999">8</text>
    <rect x="244" y="144" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="268" y="164" text-anchor="middle" font-size="12" fill="#999">4</text>
    <rect x="292" y="144" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="316" y="164" text-anchor="middle" font-size="12" fill="#999">3</text>
  </g>
  <text x="370" y="160" font-size="12" fill="#b85450" font-weight="bold">阈值 = total/2 = 17</text>

  <!-- 取前2个 标注 -->
  <path d="M 100 182 L 100 188 L 196 188 L 196 182" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="148" y="200" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">取前 2 个</text>

  <!-- 前缀和 -->
  <text x="40" y="224" font-size="12" fill="#666" font-weight="bold">前缀和</text>
  <g filter="url(#rough2)">
    <rect x="100" y="212" width="48" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="124" y="232" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">10</text>
    <rect x="148" y="212" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4"/>
    <text x="172" y="232" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">19</text>
    <rect x="196" y="212" width="48" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4"/>
    <text x="220" y="232" text-anchor="middle" font-size="12" fill="#aaa">27</text>
    <rect x="244" y="212" width="48" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4"/>
    <text x="268" y="232" text-anchor="middle" font-size="12" fill="#aaa">31</text>
    <rect x="292" y="212" width="48" height="30" fill="#f0f0f0" stroke="#bbb" stroke-width="1.3" rx="4"/>
    <text x="316" y="232" text-anchor="middle" font-size="12" fill="#aaa">34</text>
  </g>

  <!-- 前缀和判定标注 -->
  <text x="124" y="262" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">10 &lt; 17 ✗</text>
  <text x="172" y="262" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">19 &gt; 17 ✓</text>

  <!-- 答案框 -->
  <rect x="100" y="280" width="96" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="148" y="303" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">答案 [10, 9]</text>

  <!-- 贪心说明 -->
  <text x="280" y="290" font-size="11" fill="#555" font-weight="bold">贪心策略</text>
  <text x="280" y="308" font-size="11" fill="#555">从最大开始取</text>
  <text x="280" y="324" font-size="11" fill="#555">前缀和首次 &gt; total/2 即停</text>
  <text x="280" y="340" font-size="11" fill="#b85450">（严格大于，等于时继续）</text>
</svg>
