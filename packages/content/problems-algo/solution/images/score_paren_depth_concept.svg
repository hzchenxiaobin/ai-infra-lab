<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
  </defs>

  <rect width="780" height="460" fill="#fdfcf7"/>

  <text x="390" y="32" text-anchor="middle" font-size="17" fill="#2b2b2b" font-weight="bold">深度计数法：每个 "()" 贡献 2^(depth−1)</text>
  <path d="M 240 42 Q 390 50 540 42" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <text x="390" y="56" text-anchor="middle" font-size="11" fill="#888">只关心原子 "()"：它在第 depth 层嵌套里，就把分数翻 depth−1 次倍</text>

  <!-- 字符串 + 下标 -->
  <text x="60" y="92" font-size="12" fill="#888" font-weight="bold">S =</text>
  <g filter="url(#sk)">
    <rect x="100" y="76" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="142" y="76" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="184" y="76" width="40" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <rect x="226" y="76" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="268" y="76" width="40" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <rect x="310" y="76" width="40" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <rect x="352" y="76" width="40" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
    <rect x="394" y="76" width="40" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.3"/>
  </g>
  <text x="120" y="98" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">(</text>
  <text x="162" y="98" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">(</text>
  <text x="204" y="98" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">)</text>
  <text x="246" y="98" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">(</text>
  <text x="288" y="98" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">(</text>
  <text x="330" y="98" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">)</text>
  <text x="372" y="98" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">)</text>
  <text x="414" y="98" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">)</text>
  <text x="120" y="122" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="162" y="122" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="204" y="122" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="246" y="122" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="288" y="122" text-anchor="middle" font-size="9" fill="#888">4</text>
  <text x="330" y="122" text-anchor="middle" font-size="9" fill="#888">5</text>
  <text x="372" y="122" text-anchor="middle" font-size="9" fill="#888">6</text>
  <text x="414" y="122" text-anchor="middle" font-size="9" fill="#888">7</text>

  <!-- 两个原子高亮 -->
  <g filter="url(#sk)">
    <rect x="140" y="72" width="84" height="42" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="5,3" rx="6"/>
    <rect x="266" y="72" width="84" height="42" fill="none" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="5,3" rx="6"/>
  </g>
  <text x="182" y="136" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">depth=2 的 "()"</text>
  <text x="308" y="136" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">depth=3 的 "()"</text>

  <!-- 深度折线图 -->
  <text x="60" y="170" font-size="12" fill="#2b2b2b" font-weight="bold">嵌套深度 depth（遇 ( +1，遇 ) −1）：</text>

  <!-- 坐标轴 -->
  <line x1="100" y1="300" x2="460" y2="300" stroke="#888" stroke-width="1.4" filter="url(#sk)"/>
  <line x1="100" y1="190" x2="100" y2="300" stroke="#888" stroke-width="1.4" filter="url(#sk)"/>
  <text x="80" y="194" font-size="9" fill="#888">3</text>
  <text x="80" y="228" font-size="9" fill="#888">2</text>
  <text x="80" y="262" font-size="9" fill="#888">1</text>
  <text x="80" y="304" font-size="9" fill="#888">0</text>

  <!-- 深度折线: 起点(100,300) depth0
       i=0 '(' depth1 -> 262 ; i=1 '(' depth2 -> 228 ; i=2 ')' depth1 -> 262
       i=3 '(' depth2 -> 228 ; i=4 '(' depth3 -> 194 ; i=5 ')' depth2 -> 228
       i=6 ')' depth1 -> 262 ; i=7 ')' depth0 -> 300
       横坐标: 字符中心 120,162,204,246,288,330,372,414 -->
  <path d="M 100 300 L 120 262 L 162 228 L 204 262 L 246 228 L 288 194 L 330 228 L 372 262 L 414 300"
        stroke="#446688" stroke-width="2.2" fill="none" filter="url(#sk)"/>

  <!-- 关键点标注: i=2 处 depth=2 的 "()"; i=5 处 depth=3 的 "()" -->
  <circle cx="204" cy="262" r="4" fill="#4a7a3a" filter="url(#sk)"/>
  <text x="204" y="252" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">d=2</text>
  <circle cx="330" cy="228" r="4" fill="#4a7a3a" filter="url(#sk)"/>
  <text x="330" y="218" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">d=3</text>

  <!-- 贡献计算 -->
  <text x="500" y="170" font-size="12" fill="#2b2b2b" font-weight="bold">贡献累加：</text>
  <g filter="url(#sk)">
    <rect x="490" y="180" width="250" height="130" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.3"/>
  </g>
  <text x="506" y="204" font-size="11" fill="#444" font-weight="bold">i=2 "()"，depth=2</text>
  <text x="506" y="222" font-size="11" fill="#4a7a3a">+ 2^(2−1) = 2</text>
  <text x="506" y="248" font-size="11" fill="#444" font-weight="bold">i=5 "()"，depth=3</text>
  <text x="506" y="266" font-size="11" fill="#4a7a3a">+ 2^(3−1) = 4</text>
  <line x1="506" y1="278" x2="724" y2="278" stroke="#888" stroke-width="1" filter="url(#sk)"/>
  <text x="506" y="298" font-size="13" fill="#b85450" font-weight="bold">ans = 2 + 4 = 6 ✓</text>

  <!-- 公式说明 -->
  <g filter="url(#sk)">
    <rect x="60" y="330" width="660" height="84" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="80" y="354" font-size="12" fill="#2b2b2b" font-weight="bold">为什么是 2^(depth−1)？</text>
  <text x="80" y="374" font-size="10.5" fill="#444">一个 "()" 原子若被 depth 层括号包裹，规则 3 的「翻倍」会作用 depth−1 次（最内层那次是 ()→1，</text>
  <text x="80" y="390" font-size="10.5" fill="#444">不翻倍；每往外一层乘 2）。故贡献 = 1 × 2 × … × 2 = 2^(depth−1)。</text>
  <text x="80" y="406" font-size="10.5" fill="#4a7a3a" font-weight="bold">整串分数 = Σ（每个 "()" 的 2^(depth−1)），只需一个 depth 计数器，O(1) 空间。</text>

  <text x="390" y="442" text-anchor="middle" font-size="10.5" fill="#888">时间 O(n)　空间 O(1)　仅当 S[i]=')' 且 S[i−1]='(' 时才累加</text>
</svg>
