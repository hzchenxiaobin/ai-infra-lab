<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <pattern id="wallHatch2" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#5a5a5a"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#3a3a3a" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：start=(0,4) → dest=(4,4)</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888">7 殡滚动依次到达终点：左→下→左→下→右→下→右</text>

  <!-- 5x5 maze grid: origin (90,72), cell 56x56 -->
  <g filter="url(#rough2)" font-size="13">
    <!-- row 0: 0 0 1 0 0 -->
    <rect x="92" y="74" width="56" height="56" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="148" y="74" width="56" height="56" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="204" y="74" width="56" height="56" fill="url(#wallHatch2)" stroke="#3a3a3a" stroke-width="1.4" rx="3"/>
    <rect x="260" y="74" width="56" height="56" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="316" y="74" width="56" height="56" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <!-- row 1: 0 0 0 0 0 -->
    <rect x="92" y="130" width="56" height="56" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="148" y="130" width="56" height="56" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="204" y="130" width="56" height="56" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="260" y="130" width="56" height="56" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="316" y="130" width="56" height="56" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <!-- row 2: 0 0 0 1 0 -->
    <rect x="92" y="186" width="56" height="56" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="148" y="186" width="56" height="56" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="204" y="186" width="56" height="56" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="260" y="186" width="56" height="56" fill="url(#wallHatch2)" stroke="#3a3a3a" stroke-width="1.4" rx="3"/>
    <rect x="316" y="186" width="56" height="56" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <!-- row 3: 1 1 0 1 1 -->
    <rect x="92" y="242" width="56" height="56" fill="url(#wallHatch2)" stroke="#3a3a3a" stroke-width="1.4" rx="3"/>
    <rect x="148" y="242" width="56" height="56" fill="url(#wallHatch2)" stroke="#3a3a3a" stroke-width="1.4" rx="3"/>
    <rect x="204" y="242" width="56" height="56" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="260" y="242" width="56" height="56" fill="url(#wallHatch2)" stroke="#3a3a3a" stroke-width="1.4" rx="3"/>
    <rect x="316" y="242" width="56" height="56" fill="url(#wallHatch2)" stroke="#3a3a3a" stroke-width="1.4" rx="3"/>
    <!-- row 4: 0 0 0 0 0 -->
    <rect x="92" y="298" width="56" height="56" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="148" y="298" width="56" height="56" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="204" y="298" width="56" height="56" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="260" y="298" width="56" height="56" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
    <rect x="316" y="298" width="56" height="56" fill="#ffffff" stroke="#888" stroke-width="1.3" rx="3"/>
  </g>

  <!-- rolling trajectories (drawn under markers) -->
  <g filter="url(#rough2)" stroke="#4a7a3a" stroke-width="2.2" fill="none">
    <!-- 1: (0,4)->(0,3) left -->
    <path d="M 330 102 L 300 102" marker-end="url(#arrG)"/>
    <!-- 2: (0,3)->(1,3) down -->
    <path d="M 288 130 L 288 158" marker-end="url(#arrG)"/>
    <!-- 3: (1,3)->(1,0) left (long) -->
    <path d="M 274 158 L 132 158" marker-end="url(#arrG)"/>
    <!-- 4: (1,0)->(2,0) down -->
    <path d="M 120 186 L 120 214" marker-end="url(#arrG)"/>
    <!-- 5: (2,0)->(2,2) right -->
    <path d="M 132 214 L 218 214" marker-end="url(#arrG)"/>
    <!-- 6: (2,2)->(4,2) down (passes (3,2)) -->
    <path d="M 232 242 L 232 326" marker-end="url(#arrG)"/>
    <!-- 7: (4,2)->(4,4) right -->
    <path d="M 244 326 L 330 326" marker-end="url(#arrG)"/>
  </g>

  <!-- direction labels along segments -->
  <g filter="url(#rough2)" font-size="10" fill="#4a7a3a" font-weight="bold">
    <text x="316" y="94">←左</text>
    <text x="294" y="148">↓下</text>
    <text x="200" y="150">←左（穿 3 格）</text>
    <text x="126" y="204">↓下</text>
    <text x="160" y="210">→右</text>
    <text x="238" y="288">↓下（穿 (3,2)）</text>
    <text x="270" y="320">→右</text>
  </g>

  <!-- Start ball at (0,4) center (344, 102) -->
  <g filter="url(#rough2)">
    <circle cx="344" cy="102" r="12" fill="#b85450" stroke="#7a3030" stroke-width="1.6"/>
    <text x="344" y="106" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">S</text>
  </g>

  <!-- Stop position markers (green numbered) -->
  <g filter="url(#rough2)" font-size="11" font-weight="bold">
    <!-- 1: (0,3) center (288,102) -->
    <circle cx="288" cy="102" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="288" y="106" text-anchor="middle" fill="#4a7a3a">1</text>
    <!-- 2: (1,3) center (288,158) -->
    <circle cx="288" cy="158" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="288" y="162" text-anchor="middle" fill="#4a7a3a">2</text>
    <!-- 3: (1,0) center (120,158) -->
    <circle cx="120" cy="158" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="120" y="162" text-anchor="middle" fill="#4a7a3a">3</text>
    <!-- 4: (2,0) center (120,214) -->
    <circle cx="120" cy="214" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="120" y="218" text-anchor="middle" fill="#4a7a3a">4</text>
    <!-- 5: (2,2) center (232,214) -->
    <circle cx="232" cy="214" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="232" y="218" text-anchor="middle" fill="#4a7a3a">5</text>
    <!-- 6: (4,2) center (232,326) -->
    <circle cx="232" cy="326" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="232" y="330" text-anchor="middle" fill="#4a7a3a">6</text>
  </g>

  <!-- Destination flag at (4,4) center (344,326) -->
  <g filter="url(#rough2)">
    <circle cx="344" cy="326" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="344" y="331" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">★</text>
  </g>

  <!-- legend -->
  <g filter="url(#rough2)" font-size="10">
    <circle cx="100" cy="392" r="7" fill="#b85450" stroke="#7a3030" stroke-width="1.2"/>
    <text x="112" y="396" fill="#555">起点 S</text>
    <circle cx="170" cy="392" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="182" y="396" fill="#555">停止状态 1-6</text>
    <circle cx="270" cy="392" r="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
    <text x="282" y="396" fill="#555">终点 ★ dest</text>
    <rect x="350" y="386" width="14" height="12" fill="url(#wallHatch2)" stroke="#3a3a3a" stroke-width="1.2" rx="2"/>
    <text x="368" y="396" fill="#555">墙</text>
  </g>

  <text x="280" y="420" text-anchor="middle" font-size="11" fill="#888">绿箭头=一次滚动段（中间不停）｜数字=球的停止状态（BFS 节点）</text>
</svg>
