<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold">核心观察：员工关系是一棵树，求 id 子树的重要度之和</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">employees[i] = [id, importance, [subordinates]] → 建哈希表 → 从 id 起 DFS 累加</text>

  <!-- ===== Left: input employee cards (vertical) ===== -->
  <text x="30" y="68" font-size="11" fill="#446688" font-weight="bold">输入 employees</text>

  <rect x="30" y="74" width="160" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="40" y="90" font-size="10" fill="#333">id=1  imp=<tspan fill="#4a7a3a" font-weight="bold">5</tspan>  sub=[2,3]</text>

  <rect x="30" y="100" width="160" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="40" y="116" font-size="10" fill="#333">id=2  imp=<tspan fill="#4a7a3a" font-weight="bold">3</tspan>  sub=[4]</text>

  <rect x="30" y="126" width="160" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="40" y="142" font-size="10" fill="#333">id=3  imp=<tspan fill="#4a7a3a" font-weight="bold">3</tspan>  sub=[]</text>

  <rect x="30" y="152" width="160" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="40" y="168" font-size="10" fill="#333">id=4  imp=<tspan fill="#4a7a3a" font-weight="bold">1</tspan>  sub=[]</text>

  <!-- arrow from cards to tree -->
  <path d="M 110 178 L 110 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="192" font-size="9.5" fill="#666">建 emp_map</text>

  <!-- ===== Middle: tree ===== -->
  <text x="30" y="214" font-size="11" fill="#446688" font-weight="bold">员工树（id : 重要度）</text>

  <!-- subtree shade box (queried id=1 整棵子树) -->
  <rect x="42" y="226" width="150" height="148" fill="none" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4 3" rx="8" filter="url(#rough2)"/>
  <text x="48" y="222" font-size="9.5" fill="#b85450" font-weight="bold">id=1 子树</text>

  <g font-size="12">
    <!-- node 1 (queried) -->
    <circle cx="105" cy="252" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.6" filter="url(#rough2)"/>
    <text x="105" y="257" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <rect x="120" y="236" width="22" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="7" filter="url(#rough2)"/>
    <text x="131" y="247" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">5</text>

    <!-- node 2 (direct sub) -->
    <circle cx="68" cy="306" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="68" y="311" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <rect x="82" y="293" width="20" height="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="7" filter="url(#rough2)"/>
    <text x="92" y="303" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">3</text>

    <!-- node 3 (direct sub) -->
    <circle cx="155" cy="306" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="155" y="311" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <rect x="169" y="293" width="20" height="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="7" filter="url(#rough2)"/>
    <text x="179" y="303" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">3</text>

    <!-- node 4 (indirect sub) -->
    <circle cx="68" cy="360" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="68" y="365" text-anchor="middle" fill="#d6a040" font-weight="bold">4</text>
    <rect x="82" y="348" width="20" height="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="7" filter="url(#rough2)"/>
    <text x="92" y="358" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">1</text>

    <!-- edges -->
    <line x1="93" y1="265" x2="78" y2="293" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="118" y1="265" x2="143" y2="293" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="68" y1="321" x2="68" y2="346" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

    <!-- legend -->
    <text x="150" y="345" font-size="9" fill="#b85450" font-weight="bold">查询 id=1</text>
    <text x="150" y="358" font-size="9" fill="#446688">■ 直接下属</text>
    <text x="150" y="370" font-size="9" fill="#d6a040">■ 间接下属</text>
  </g>

  <!-- ===== Right: three steps ===== -->
  <text x="300" y="68" font-size="11" fill="#444" font-weight="bold">思路三步</text>

  <rect x="300" y="76" width="210" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="312" y="96" font-size="11" fill="#446688" font-weight="bold">① 建哈希表 emp_map</text>
  <text x="312" y="114" font-size="9.5" fill="#555">emp_map[id] = {importance, subordinates}</text>

  <rect x="300" y="138" width="210" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="312" y="158" font-size="11" fill="#4a7a3a" font-weight="bold">② 从 id 起 DFS/BFS</text>
  <text x="312" y="176" font-size="9.5" fill="#555">遍历子树：直接 + 间接下属</text>

  <rect x="300" y="200" width="210" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="312" y="220" font-size="11" fill="#d6a040" font-weight="bold">③ 累加 importance</text>
  <text x="312" y="238" font-size="9.5" fill="#555">total += emp_map[cur].importance</text>

  <!-- bottom note -->
  <rect x="30" y="376" width="490" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="270" y="390" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">结果 = 5 + 3 + 3 + 1 = 12（自身 + 直接下属 2,3 + 间接下属 4）</text>
</svg>
