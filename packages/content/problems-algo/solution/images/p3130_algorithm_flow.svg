<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>

  <text x="280" y="20" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：双层循环，每格 (i,j) 依次做四个动作</text>

  <!-- start -->
  <rect x="155" y="32" width="250" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="51" text-anchor="middle" font-size="11.5" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">初始化：dp / s0 / s1 清零</text>
  <text x="280" y="69" text-anchor="middle" font-size="11" fill="#2c4a6b" filter="url(#rough2)">哨兵 dp[0][0][0] = dp[0][0][1] = 1（空数组）</text>

  <line x1="280" y1="80" x2="280" y2="100" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- loop container -->
  <rect x="36" y="102" width="488" height="256" fill="#ffffff" stroke="#999" stroke-width="1.5" stroke-dasharray="7 5" rx="12" filter="url(#rough2)"/>
  <text x="280" y="126" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">双层循环：i = 0..zero，j = 0..one（跳过 (0,0)）</text>

  <!-- box 1 -->
  <rect x="56" y="140" width="216" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="164" y="160" text-anchor="middle" font-size="11.5" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">① 若 i &gt; 0：dp[i][j][0] =</text>
  <text x="164" y="178" text-anchor="middle" font-size="11" fill="#2c4a6b" filter="url(#rough2)">s1[i−1][j] − s1[i−limit−1][j]</text>
  <text x="164" y="196" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">（i−limit−1 &lt; 0 时取 0）</text>

  <!-- box 2 -->
  <rect x="288" y="140" width="216" height="68" fill="#ffffff" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="396" y="160" text-anchor="middle" font-size="11.5" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">② 更新行前缀和</text>
  <text x="396" y="178" text-anchor="middle" font-size="11" fill="#2c4a6b" filter="url(#rough2)">s0[i][j] = s0[i][j−1] + dp[i][j][0]</text>
  <text x="396" y="196" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">（j=0 时 s0 = dp[i][0][0]）</text>

  <!-- box 3 -->
  <rect x="288" y="250" width="216" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="396" y="270" text-anchor="middle" font-size="11.5" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">③ 若 j &gt; 0：dp[i][j][1] =</text>
  <text x="396" y="288" text-anchor="middle" font-size="11" fill="#2d5a24" filter="url(#rough2)">s0[i][j−1] − s0[i][j−limit−1]</text>
  <text x="396" y="306" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">（j−limit−1 &lt; 0 时取 0）</text>

  <!-- box 4 -->
  <rect x="56" y="250" width="216" height="68" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="164" y="270" text-anchor="middle" font-size="11.5" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">④ 更新列前缀和</text>
  <text x="164" y="288" text-anchor="middle" font-size="11" fill="#2d5a24" filter="url(#rough2)">s1[i][j] = s1[i−1][j] + dp[i][j][1]</text>
  <text x="164" y="306" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">（i=0 时 s1 = dp[0][j][1]）</text>

  <!-- clockwise arrows -->
  <line x1="272" y1="174" x2="286" y2="174" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <line x1="396" y1="208" x2="396" y2="248" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <line x1="288" y1="284" x2="274" y2="284" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <line x1="164" y1="250" x2="164" y2="212" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="178" y="236" font-size="10" fill="#4a7a3a" filter="url(#rough2)">本格完成</text>

  <!-- exit -->
  <line x1="280" y1="358" x2="280" y2="392" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="293" y="378" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">所有格子遍历完</text>

  <!-- return -->
  <rect x="140" y="396" width="280" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="417" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">返回 (dp[zero][one][0]</text>
  <text x="280" y="436" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">+ dp[zero][one][1]) mod (10⁹+7)</text>

  <!-- side note -->
  <rect x="36" y="460" width="488" height="46" fill="#ffffff" stroke="#999" stroke-width="1.4" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="479" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">每格 O(1)（两次前缀和相减），共 (zero+1)(one+1) ≈ 10⁶ 格 → 总 O(z·o)</text>
  <text x="280" y="497" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">⚠️ 模意义下相减可能为负：C++ 先 +MOD 再取模；Python 的 % 天然非负</text>
</svg>
