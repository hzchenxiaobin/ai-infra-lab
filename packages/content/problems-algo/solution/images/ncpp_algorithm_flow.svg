<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">SQL 执行流程：帖子驱动 + LEFT JOIN + COUNT DISTINCT</text>

  <!-- ===== ① 提取帖子集合 ===== -->
  <rect x="50" y="44" width="480" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="64" y="62" font-size="11.5" fill="#446688" font-weight="bold">① 提取帖子集合</text>
  <text x="64" y="80" font-size="10.5" fill="#333" font-family="'Comic Sans MS', monospace">SELECT DISTINCT sub_id FROM Submissions WHERE parent_id IS NULL</text>
  <text x="64" y="94" font-size="10" fill="#888">→ 帖子集合 p = {1, 2, 12}（重复帖已去重）</text>

  <path d="M 290 102 L 290 120" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== ② LEFT JOIN 评论 ===== -->
  <rect x="50" y="124" width="480" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="64" y="142" font-size="11.5" fill="#4a7a3a" font-weight="bold">② LEFT JOIN 评论（以帖子为驱动表）</text>
  <text x="64" y="160" font-size="10.5" fill="#333" font-family="'Comic Sans MS', monospace">LEFT JOIN Submissions c ON c.parent_id = p.sub_id</text>
  <text x="64" y="174" font-size="10" fill="#888">→ 只匹配 parent_id 指向真实帖子的评论；悬空评论自动排除</text>

  <path d="M 290 182 L 290 200" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== ③ 分组聚合计数 ===== -->
  <rect x="50" y="204" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="64" y="222" font-size="11.5" fill="#d6a040" font-weight="bold">③ 分组聚合计数</text>
  <text x="64" y="240" font-size="10.5" fill="#333" font-family="'Comic Sans MS', monospace">GROUP BY p.sub_id  →  COUNT(DISTINCT c.sub_id) AS number_of_comments</text>
  <text x="64" y="254" font-size="10" fill="#888">→ 每帖统计唯一评论数；LEFT JOIN 保证无评论的帖子也出现（COUNT 得 0）</text>

  <path d="M 290 262 L 290 280" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== ④ 排序输出 ===== -->
  <rect x="50" y="284" width="480" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="64" y="302" font-size="11.5" fill="#b85450" font-weight="bold">④ 排序输出</text>
  <text x="64" y="320" font-size="10.5" fill="#333" font-family="'Comic Sans MS', monospace">ORDER BY post_id ASC</text>

  <path d="M 290 330 L 290 348" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 输出预览 ===== -->
  <text x="40" y="362" font-size="11" fill="#888">输出结果</text>
  <rect x="190" y="350" width="200" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <line x1="190" y1="374" x2="390" y2="374" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="290" y1="350" x2="290" y2="418" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="240" y="367" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">post_id</text>
  <text x="340" y="367" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">number_of_comments</text>
  <text x="240" y="390" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <text x="340" y="390" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <text x="240" y="406" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <text x="340" y="406" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <text x="240" y="416" text-anchor="middle" font-size="9" fill="#888">12</text>
  <text x="340" y="416" text-anchor="middle" font-size="9" fill="#888">0</text>

  <!-- 右侧关键提示 -->
  <text x="400" y="362" font-size="10" fill="#888">💡 LEFT JOIN</text>
  <text x="400" y="376" font-size="10" fill="#888">　保证无评论</text>
  <text x="400" y="390" font-size="10" fill="#888">　的帖子也出现</text>
  <text x="400" y="404" font-size="10" fill="#888">　（COUNT=0）</text>
</svg>
