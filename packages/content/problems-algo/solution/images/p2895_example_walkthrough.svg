<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="360" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：processorTime = [8,10]，tasks = [2,2,3,1,8,7,4,5]</text>

  <!-- Step 1: sort -->
  <text x="20" y="58" font-size="12" fill="#446688" font-weight="bold">① 排序</text>
  <rect x="80" y="44" width="230" height="28" fill="#fff" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="92" y="63" font-size="11" fill="#333">p 升序：[8, 10]</text>
  <rect x="320" y="44" width="240" height="28" fill="#fff" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="332" y="63" font-size="11" fill="#333">t 降序：[8,7,5,4, 3,2,2,1]</text>

  <!-- Step 2: groups -->
  <text x="20" y="106" font-size="12" fill="#446688" font-weight="bold">② 按 4 个一组切分</text>

  <rect x="80" y="92" width="192" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="176" y="112" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">第 0 组：8 | 7 | 5 | 4</text>
  <text x="288" y="112" font-size="10" fill="#446688">→ 处理器 p=8</text>

  <rect x="80" y="130" width="192" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="176" y="150" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">第 1 组：3 | 2 | 2 | 1</text>
  <text x="288" y="150" font-size="10" fill="#4a7a3a">→ 处理器 p=10</text>

  <!-- Step 3: compute -->
  <text x="20" y="196" font-size="12" fill="#446688" font-weight="bold">③ 逐处理器求完成时间</text>

  <rect x="80" y="182" width="440" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="96" y="204" font-size="11" fill="#333">p=8：组内最长 t=8 → 8 + 8 =</text>
  <text x="300" y="204" font-size="13" fill="#b85450" font-weight="bold">16</text>
  <text x="340" y="204" font-size="10" fill="#b85450">← 全局瓶颈！</text>

  <rect x="80" y="224" width="440" height="34" fill="#fff" stroke="#888" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="96" y="246" font-size="11" fill="#333">p=10：组内最长 t=3 → 10 + 3 =</text>
  <text x="312" y="246" font-size="13" fill="#666" font-weight="bold">13</text>

  <!-- Step 4: answer -->
  <text x="20" y="296" font-size="12" fill="#446688" font-weight="bold">④ 汇总</text>
  <rect x="80" y="280" width="440" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="96" y="305" font-size="12" fill="#333">ans = max(16, 13) =</text>
  <text x="240" y="306" font-size="16" fill="#b85450" font-weight="bold">16</text>
  <text x="280" y="305" font-size="11" fill="#666">（与官方示例一致 ✓）</text>

  <!-- Verification note -->
  <rect x="20" y="330" width="540" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="32" y="346" font-size="10" fill="#4a7a3a" font-weight="bold">验证：把 p=8 的 8 换给 p=10 → max(8+3, 10+8)=18 &gt; 16，交叉配对果然更差</text>
</svg>
