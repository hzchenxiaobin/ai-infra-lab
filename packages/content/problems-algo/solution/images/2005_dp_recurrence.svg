<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">SG 值递推 + 周期 6 规律</text>

  <!-- recurrence box -->
  <rect x="30" y="44" width="500" height="74" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">递推式（n ≥ 3）</text>
  <text x="280" y="90" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">f(n) = ( f(n−2) + 1 ) ⊕ ( f(n−1) + 1 )</text>
  <text x="280" y="108" text-anchor="middle" font-size="11" fill="#555">边界：f(1)=0（单节点，无可删非根节点）；f(2)=1（左空，右 order(1) → 0⊕1=1）</text>

  <!-- table header -->
  <text x="280" y="142" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">前 13 项 SG 值（红框 = 0，即 Bob 胜）</text>

  <!-- table: n row and f(n) row, 13 columns -->
  <g font-size="11" fill="#333" text-anchor="middle">
    <!-- n labels -->
    <text x="60" y="168">n</text>
    <text x="60" y="196">f(n)</text>
  </g>
  <!-- cells for n=1..13 -->
  <g filter="url(#rough2)">
    <!-- column index i -> x = 96 + i*34 -->
    <!-- n=1 -->
    <rect x="92" y="156" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3"/>
    <rect x="92" y="184" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3"/>
    <!-- n=2 -->
    <rect x="126" y="156" width="34" height="24" fill="#fff" stroke="#888" stroke-width="1" rx="3"/>
    <rect x="126" y="184" width="34" height="24" fill="#fff" stroke="#888" stroke-width="1" rx="3"/>
    <!-- n=3 -->
    <rect x="160" y="156" width="34" height="24" fill="#fff" stroke="#888" stroke-width="1" rx="3"/>
    <rect x="160" y="184" width="34" height="24" fill="#fff" stroke="#888" stroke-width="1" rx="3"/>
    <!-- n=4 -->
    <rect x="194" y="156" width="34" height="24" fill="#fff" stroke="#888" stroke-width="1" rx="3"/>
    <rect x="194" y="184" width="34" height="24" fill="#fff" stroke="#888" stroke-width="1" rx="3"/>
    <!-- n=5 -->
    <rect x="228" y="156" width="34" height="24" fill="#fff" stroke="#888" stroke-width="1" rx="3"/>
    <rect x="228" y="184" width="34" height="24" fill="#fff" stroke="#888" stroke-width="1" rx="3"/>
    <!-- n=6 -->
    <rect x="262" y="156" width="34" height="24" fill="#fff" stroke="#888" stroke-width="1" rx="3"/>
    <rect x="262" y="184" width="34" height="24" fill="#fff" stroke="#888" stroke-width="1" rx="3"/>
    <!-- n=7 -->
    <rect x="296" y="156" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3"/>
    <rect x="296" y="184" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3"/>
    <!-- n=8 -->
    <rect x="330" y="156" width="34" height="24" fill="#fff" stroke="#888" stroke-width="1" rx="3"/>
    <rect x="330" y="184" width="34" height="24" fill="#fff" stroke="#888" stroke-width="1" rx="3"/>
    <!-- n=9 -->
    <rect x="364" y="156" width="34" height="24" fill="#fff" stroke="#888" stroke-width="1" rx="3"/>
    <rect x="364" y="184" width="34" height="24" fill="#fff" stroke="#888" stroke-width="1" rx="3"/>
    <!-- n=10 -->
    <rect x="398" y="156" width="34" height="24" fill="#fff" stroke="#888" stroke-width="1" rx="3"/>
    <rect x="398" y="184" width="34" height="24" fill="#fff" stroke="#888" stroke-width="1" rx="3"/>
    <!-- n=11 -->
    <rect x="432" y="156" width="34" height="24" fill="#fff" stroke="#888" stroke-width="1" rx="3"/>
    <rect x="432" y="184" width="34" height="24" fill="#fff" stroke="#888" stroke-width="1" rx="3"/>
    <!-- n=12 -->
    <rect x="466" y="156" width="34" height="24" fill="#fff" stroke="#888" stroke-width="1" rx="3"/>
    <rect x="466" y="184" width="34" height="24" fill="#fff" stroke="#888" stroke-width="1" rx="3"/>
    <!-- n=13 -->
    <rect x="500" y="156" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3"/>
    <rect x="500" y="184" width="34" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3"/>
  </g>
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="109" y="172">1</text><text x="143" y="172">2</text><text x="177" y="172">3</text><text x="211" y="172">4</text><text x="245" y="172">5</text><text x="279" y="172">6</text><text x="313" y="172">7</text><text x="347" y="172">8</text><text x="381" y="172">9</text><text x="415" y="172">10</text><text x="449" y="172">11</text><text x="483" y="172">12</text><text x="517" y="172">13</text>
    <text x="109" y="200">0</text><text x="143" y="200">1</text><text x="177" y="200">3</text><text x="211" y="200">6</text><text x="245" y="200">3</text><text x="279" y="200">3</text><text x="313" y="200">0</text><text x="347" y="200">5</text><text x="381" y="200">7</text><text x="415" y="200">14</text><text x="449" y="200">7</text><text x="483" y="200">7</text><text x="517" y="200">0</text>
  </g>

  <!-- n mod 6 row -->
  <text x="60" y="232" font-size="11" fill="#555" text-anchor="middle">n%6</text>
  <g font-size="10.5" fill="#4a7a3a" text-anchor="middle">
    <text x="109" y="232">1</text><text x="143" y="232">2</text><text x="177" y="232">3</text><text x="211" y="232">4</text><text x="245" y="232">5</text><text x="279" y="232">0</text><text x="313" y="232">1</text><text x="347" y="232">2</text><text x="381" y="232">3</text><text x="415" y="232">4</text><text x="449" y="232">5</text><text x="483" y="232">0</text><text x="517" y="232">1</text>
  </g>

  <!-- pattern observation -->
  <rect x="30" y="252" width="500" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="274" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">观察：f(n)=0 恰出现在 n ≡ 1 (mod 6)</text>
  <text x="280" y="294" text-anchor="middle" font-size="11" fill="#555">n = 1, 7, 13, 19, 25, … → SG=0 → Bob 胜 → 返回 false</text>
  <text x="280" y="312" text-anchor="middle" font-size="11" fill="#555">其余 n → SG≠0 → Alice 胜 → 返回 true</text>

  <!-- proof sketch -->
  <rect x="30" y="342" width="500" height="112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="364" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">为何周期为 6？（归纳验证）</text>
  <text x="50" y="384" font-size="11" fill="#555">设第 k 个周期起点 n=6k+1 时 f=0。由递推向后展开 6 步：</text>
  <text x="50" y="402" font-size="10.5" fill="#555">f(6k+2)=(0⊕1)⊕(a⊕1)，… 逐项异或后，到 f(6k+7) 必再次归 0</text>
  <text x="50" y="420" font-size="10.5" fill="#555">• 关键不变式：每个周期内 f(n+2)=f(n+4)=f(n+5)（位置 3/5/6 相等）</text>
  <text x="50" y="438" font-size="10.5" fill="#b85450">• 数学上可证：⊕1 作用 6 次后回到原点 → 周期 6 严格成立（n≤100 已穷举验证）</text>
</svg>
