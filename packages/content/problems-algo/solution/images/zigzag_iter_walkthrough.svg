<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    示例演算：v1=[1,2]，v2=[3,4,5,6] 的队列轮转快照
  </text>

  <!-- column headers -->
  <text x="40" y="56" font-size="11" fill="#888" filter="url(#rough2)">阶段</text>
  <text x="92" y="56" font-size="11" fill="#888" filter="url(#rough2)">队列状态（front→back）</text>
  <text x="430" y="56" font-size="11" fill="#888" filter="url(#rough2)">输出</text>

  <!-- snapshot 0: init -->
  <text x="44" y="86" font-size="11" fill="#446688" filter="url(#rough2)">init</text>
  <rect x="92" y="72" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="152" y="91" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">v1→1</text>
  <rect x="216" y="72" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="276" y="91" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">v2→3</text>

  <path d="M152,100 L152,116" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="160" y="112" font-size="10" fill="#b85450" filter="url(#rough2)">next() → 1，v1 推进后回尾</text>

  <!-- snapshot 1 -->
  <text x="44" y="146" font-size="11" fill="#446688" filter="url(#rough2)">①</text>
  <rect x="92" y="132" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="152" y="151" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">v2→3</text>
  <rect x="216" y="132" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="276" y="151" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">v1→2</text>
  <rect x="430" y="132" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="447" y="151" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <path d="M152,160 L152,176" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="160" y="172" font-size="10" fill="#b85450" filter="url(#rough2)">next() → 3，v2 推进后回尾</text>

  <!-- snapshot 2 -->
  <text x="44" y="206" font-size="11" fill="#446688" filter="url(#rough2)">②</text>
  <rect x="92" y="192" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="152" y="211" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">v1→2</text>
  <rect x="216" y="192" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="276" y="211" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">v2→4</text>
  <rect x="430" y="192" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="447" y="211" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>

  <path d="M152,220 L152,236" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="160" y="232" font-size="10" fill="#b85450" filter="url(#rough2)">next() → 2，v1 耗尽不回队</text>

  <!-- snapshot 3 -->
  <text x="44" y="266" font-size="11" fill="#446688" filter="url(#rough2)">③</text>
  <rect x="92" y="252" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="152" y="271" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">v2→4</text>
  <rect x="430" y="252" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="447" y="271" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>

  <path d="M152,280 L152,296" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="160" y="292" font-size="10" fill="#b85450" filter="url(#rough2)">v2 独占队列，连出 4, 5, 6</text>

  <!-- snapshot 4: empty -->
  <text x="44" y="326" font-size="11" fill="#b85450" filter="url(#rough2)">④</text>
  <rect x="92" y="312" width="120" height="28" fill="#fafafa" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5,3" rx="5" filter="url(#rough2)"/>
  <text x="152" y="331" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">（空）</text>
  <rect x="430" y="312" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="447" y="331" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>

  <text x="270" y="372" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    v1 先耗尽 → 队列只剩 v2 → v2 独占输出至结束；长度不等天然处理，无需特判
  </text>
</svg>
