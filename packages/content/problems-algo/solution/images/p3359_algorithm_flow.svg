<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrBlue" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="230" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：run 预处理 + 按列单调栈</text>
  <text x="230" y="38" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">O(mn) 时间；h 可覆写回 grid，额外空间仅 O(m)</text>

  <!-- 开始 -->
  <rect x="180" y="46" width="100" height="26" rx="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="63" text-anchor="middle" font-size="11" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">开始 grid, k</text>
  <path d="M 230 72 L 230 88" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 阶段 1 -->
  <rect x="96" y="90" width="268" height="58" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="108" text-anchor="middle" font-size="11" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">阶段① 逐行扫描求 h（hint 2）</text>
  <text x="230" y="124" text-anchor="middle" font-size="10" fill="#2c4a6b" filter="url(#rough2)">run = (g[i][j] ≥ g[i][j−1]) ? run+1 : 1</text>
  <text x="230" y="140" text-anchor="middle" font-size="10" fill="#2c4a6b" filter="url(#rough2)">h[i][j] = (g[i][j] ≤ k) ? run : 0</text>
  <path d="M 230 148 L 230 164" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 阶段 2 循环头 -->
  <rect x="96" y="166" width="268" height="26" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="183" text-anchor="middle" font-size="11" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">阶段② for c₂ = 0 .. n−1（枚举右端点列）</text>
  <path d="M 230 192 L 230 208" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 阶段 2 主体 -->
  <rect x="96" y="210" width="268" height="56" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="228" text-anchor="middle" font-size="10.5" fill="#2c4a6b" filter="url(#rough2)">取列向量 col[i] = h[i][c₂]</text>
  <text x="230" y="244" text-anchor="middle" font-size="10.5" fill="#2c4a6b" filter="url(#rough2)">单调栈求「子数组最小值之和」S(col)</text>
  <text x="230" y="259" text-anchor="middle" font-size="10.5" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">ans += S(col)</text>

  <!-- 循环回边 -->
  <path d="M 96 238 L 60 238 L 60 179 L 92 179" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="54" y="212" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">下一列</text>

  <!-- 汇合到返回 -->
  <path d="M 230 266 L 230 300" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="244" y="288" font-size="9.5" fill="#555" filter="url(#rough2)">所有列处理完</text>

  <!-- 返回 -->
  <rect x="150" y="302" width="160" height="30" rx="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="321" text-anchor="middle" font-size="11" fill="#2f5424" font-weight="bold" filter="url(#rough2)">返回 ans（long long）</text>

  <!-- 右侧卡片：907 贡献法 -->
  <rect x="384" y="166" width="122" height="152" rx="8" fill="#ffffff" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="445" y="186" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">S(col)：贡献法</text>
  <text x="445" y="204" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">（907 子数组最小值之和）</text>
  <text x="445" y="226" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">left[i] = i − 左侧</text>
  <text x="445" y="240" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">严格更小元素下标</text>
  <text x="445" y="262" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">right[i] = 右侧更小</text>
  <text x="445" y="276" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">或相等元素下标 − i</text>
  <text x="445" y="296" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">贡献 = col[i]·left·right</text>
  <text x="445" y="312" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">左严右宽，等值不重不漏</text>
  <path d="M 364 238 L 380 238" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <text x="230" y="352" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">★ 两个条件都被 h 编码 → 一次 O(mn) 扫描收工</text>
</svg>
