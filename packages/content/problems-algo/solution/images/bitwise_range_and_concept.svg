<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：AND 结果 = 二进制「公共前缀」+ 低位全 0</text>

  <!-- 区间端点说明 -->
  <text x="60" y="64" font-size="12" fill="#888">区间 [5, 7] 逐数 AND</text>

  <!-- 三行二进制：5=101  6=110  7=111 -->
  <!-- 公共前缀列用绿；变化位用橙 -->

  <!-- 5 -->
  <text x="100" y="80" text-anchor="end" font-size="13" fill="#446688" font-weight="bold">5</text>
  <rect x="180" y="62" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="202" y="86" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="232" y="62" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="254" y="86" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <rect x="284" y="62" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="306" y="86" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>

  <!-- 6 -->
  <text x="100" y="120" text-anchor="end" font-size="13" fill="#446688" font-weight="bold">6</text>
  <rect x="180" y="102" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="202" y="126" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="232" y="102" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="254" y="126" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="284" y="102" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="306" y="126" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>

  <!-- 7 = right，强调 -->
  <text x="100" y="160" text-anchor="end" font-size="13" fill="#b85450" font-weight="bold">7</text>
  <rect x="180" y="142" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="202" y="166" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="232" y="142" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="254" y="166" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="284" y="142" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="306" y="166" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>

  <!-- 分隔虚线 -->
  <path d="M 228 56 L 228 186" stroke="#888" stroke-width="1.4" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>

  <!-- 上方括号标注 -->
  <path d="M 180 50 Q 180 44 186 44 L 220 44 Q 226 44 226 50" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="203" y="38" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">公共前缀</text>
  <text x="203" y="50" text-anchor="middle" font-size="10" fill="#4a7a3a">保留</text>

  <path d="M 232 50 Q 232 44 238 44 L 322 44 Q 328 44 328 50" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="280" y="38" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">变化位（区间内必出现 0）</text>

  <!-- 位权标注 -->
  <text x="202" y="200" text-anchor="middle" font-size="10" fill="#888">2²</text>
  <text x="254" y="200" text-anchor="middle" font-size="10" fill="#888">2¹</text>
  <text x="306" y="200" text-anchor="middle" font-size="10" fill="#888">2⁰</text>

  <!-- 向下箭头 -->
  <path d="M 254 214 Q 254 226 254 236" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="274" y="230" font-size="11" fill="#4a7a3a" font-weight="bold">逐位 AND</text>

  <!-- 结果行 -->
  <text x="100" y="272" text-anchor="end" font-size="13" fill="#b85450" font-weight="bold">AND</text>
  <rect x="180" y="254" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="202" y="278" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="232" y="254" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="254" y="278" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">0</text>
  <rect x="284" y="254" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="306" y="278" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">0</text>

  <text x="346" y="278" font-size="13" fill="#b85450" font-weight="bold">= 4</text>

  <!-- 结论框 -->
  <rect x="50" y="312" width="460" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="336" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">区间内某位「会变」 ⇔ 该位跨越 2ᵏ 边界 ⇒ AND 该位必为 0</text>
  <text x="280" y="356" text-anchor="middle" font-size="11.5" fill="#555">只有 left 与 right 完全相同的最高若干位（公共前缀）才不会被任何数改成 0</text>
  <text x="280" y="372" text-anchor="middle" font-size="11" fill="#888">→ 把这些公共位保留，其余位清零，即为答案</text>
</svg>
