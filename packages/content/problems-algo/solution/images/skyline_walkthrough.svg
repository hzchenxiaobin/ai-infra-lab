<svg xmlns="http://www.w3.org/2000/svg" width="780" height="470" viewBox="0 0 780 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2"/>
    </filter>
  </defs>

  <rect width="780" height="470" fill="#fafafa"/>
  <text x="390" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：五栋建筑逐 x 扫描</text>
  <path d="M 260 40 Q 390 48 520 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="390" y="56" text-anchor="middle" font-size="11" fill="#888">buildings = [[2,9,10],[3,7,15],[5,12,12],[15,20,10],[19,24,8]]</text>

  <!-- 表格外框 -->
  <g filter="url(#sk)">
    <rect x="30" y="66" width="720" height="334" fill="#ffffff" stroke="#3a3a3a" stroke-width="1.8"/>
  </g>
  <!-- 表头背景 -->
  <g filter="url(#sk)">
    <rect x="30" y="66" width="720" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4"/>
  </g>
  <!-- 表头文字 -->
  <g font-size="12" font-weight="bold" fill="#446688">
    <text x="60"  y="88" text-anchor="middle">x</text>
    <text x="145" y="88" text-anchor="middle">事件</text>
    <text x="270" y="88" text-anchor="middle">动作</text>
    <text x="430" y="88" text-anchor="middle">活跃高度集合</text>
    <text x="550" y="88" text-anchor="middle">max</text>
    <text x="665" y="88" text-anchor="middle">输出</text>
  </g>
  <!-- 竖线 -->
  <g stroke="#9aa" stroke-width="1" filter="url(#sk)">
    <line x1="90"  y1="66" x2="90"  y2="400"/>
    <line x1="200" y1="66" x2="200" y2="400"/>
    <line x1="340" y1="66" x2="340" y2="400"/>
    <line x1="520" y1="66" x2="520" y2="400"/>
    <line x1="580" y1="66" x2="580" y2="400"/>
  </g>
  <!-- 横线（表头下 + 行间） -->
  <g stroke="#bbb" stroke-width="1" filter="url(#sk)">
    <line x1="30" y1="100" x2="750" y2="100"/>
    <line x1="30" y1="130" x2="750" y2="130"/>
    <line x1="30" y1="160" x2="750" y2="160"/>
    <line x1="30" y1="190" x2="750" y2="190"/>
    <line x1="30" y1="220" x2="750" y2="220"/>
    <line x1="30" y1="250" x2="750" y2="250"/>
    <line x1="30" y1="280" x2="750" y2="280"/>
    <line x1="30" y1="310" x2="750" y2="310"/>
    <line x1="30" y1="340" x2="750" y2="340"/>
    <line x1="30" y1="370" x2="750" y2="370"/>
  </g>

  <!-- 数据行（行中心 y = 115,145,...,385） -->
  <g font-size="11" fill="#333">
    <!-- 行1 x=2 -->
    <text x="60"  y="119" text-anchor="middle">2</text>
    <text x="145" y="119" text-anchor="middle" fill="#4a7a3a">(2,−10)</text>
    <text x="270" y="119" text-anchor="middle">push 10</text>
    <text x="430" y="119" text-anchor="middle">{0, 10}</text>
    <text x="550" y="119" text-anchor="middle" font-weight="bold">10</text>
    <text x="665" y="119" text-anchor="middle" font-weight="bold" fill="#b85450">[2,10]</text>
    <!-- 行2 x=3 -->
    <text x="60"  y="149" text-anchor="middle">3</text>
    <text x="145" y="149" text-anchor="middle" fill="#4a7a3a">(3,−15)</text>
    <text x="270" y="149" text-anchor="middle">push 15</text>
    <text x="430" y="149" text-anchor="middle">{0,10,15}</text>
    <text x="550" y="149" text-anchor="middle" font-weight="bold">15</text>
    <text x="665" y="149" text-anchor="middle" font-weight="bold" fill="#b85450">[3,15]</text>
    <!-- 行3 x=5 -->
    <text x="60"  y="179" text-anchor="middle">5</text>
    <text x="145" y="179" text-anchor="middle" fill="#4a7a3a">(5,−12)</text>
    <text x="270" y="179" text-anchor="middle">push 12</text>
    <text x="430" y="179" text-anchor="middle">{0,10,12,15}</text>
    <text x="550" y="179" text-anchor="middle" font-weight="bold">15</text>
    <text x="665" y="179" text-anchor="middle" fill="#888">—</text>
    <!-- 行4 x=7 -->
    <text x="60"  y="209" text-anchor="middle">7</text>
    <text x="145" y="209" text-anchor="middle" fill="#d6a040">(7,+15)</text>
    <text x="270" y="209" text-anchor="middle">del 15</text>
    <text x="430" y="209" text-anchor="middle">{0,10,12}</text>
    <text x="550" y="209" text-anchor="middle" font-weight="bold">12</text>
    <text x="665" y="209" text-anchor="middle" font-weight="bold" fill="#b85450">[7,12]</text>
    <!-- 行5 x=9 -->
    <text x="60"  y="239" text-anchor="middle">9</text>
    <text x="145" y="239" text-anchor="middle" fill="#d6a040">(9,+10)</text>
    <text x="270" y="239" text-anchor="middle">del 10</text>
    <text x="430" y="239" text-anchor="middle">{0,12}</text>
    <text x="550" y="239" text-anchor="middle" font-weight="bold">12</text>
    <text x="665" y="239" text-anchor="middle" fill="#888">—</text>
    <!-- 行6 x=12 -->
    <text x="60"  y="269" text-anchor="middle">12</text>
    <text x="145" y="269" text-anchor="middle" fill="#d6a040">(12,+12)</text>
    <text x="270" y="269" text-anchor="middle">del 12</text>
    <text x="430" y="269" text-anchor="middle">{0}</text>
    <text x="550" y="269" text-anchor="middle" font-weight="bold">0</text>
    <text x="665" y="269" text-anchor="middle" font-weight="bold" fill="#b85450">[12,0]</text>
    <!-- 行7 x=15 -->
    <text x="60"  y="299" text-anchor="middle">15</text>
    <text x="145" y="299" text-anchor="middle" fill="#4a7a3a">(15,−10)</text>
    <text x="270" y="299" text-anchor="middle">push 10</text>
    <text x="430" y="299" text-anchor="middle">{0,10}</text>
    <text x="550" y="299" text-anchor="middle" font-weight="bold">10</text>
    <text x="665" y="299" text-anchor="middle" font-weight="bold" fill="#b85450">[15,10]</text>
    <!-- 行8 x=19 -->
    <text x="60"  y="329" text-anchor="middle">19</text>
    <text x="145" y="329" text-anchor="middle" fill="#4a7a3a">(19,−8)</text>
    <text x="270" y="329" text-anchor="middle">push 8</text>
    <text x="430" y="329" text-anchor="middle">{0,8,10}</text>
    <text x="550" y="329" text-anchor="middle" font-weight="bold">10</text>
    <text x="665" y="329" text-anchor="middle" fill="#888">—</text>
    <!-- 行9 x=20 -->
    <text x="60"  y="359" text-anchor="middle">20</text>
    <text x="145" y="359" text-anchor="middle" fill="#d6a040">(20,+10)</text>
    <text x="270" y="359" text-anchor="middle">del 10</text>
    <text x="430" y="359" text-anchor="middle">{0,8}</text>
    <text x="550" y="359" text-anchor="middle" font-weight="bold">8</text>
    <text x="665" y="359" text-anchor="middle" font-weight="bold" fill="#b85450">[20,8]</text>
    <!-- 行10 x=24 -->
    <text x="60"  y="389" text-anchor="middle">24</text>
    <text x="145" y="389" text-anchor="middle" fill="#d6a040">(24,+8)</text>
    <text x="270" y="389" text-anchor="middle">del 8</text>
    <text x="430" y="389" text-anchor="middle">{0}</text>
    <text x="550" y="389" text-anchor="middle" font-weight="bold">0</text>
    <text x="665" y="389" text-anchor="middle" font-weight="bold" fill="#b85450">[24,0]</text>
  </g>

  <!-- 结论 -->
  <g filter="url(#sk)">
    <rect x="120" y="416" width="540" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="390" y="440" text-anchor="middle" font-size="12" fill="#333">最终输出 = [[2,10],[3,15],[7,12],[12,0],[15,10],[20,8],[24,0]]  ✓</text>
</svg>
