<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：子树含苹果才下探，被走的边往返成对（×2）</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">苹果在 2、4、5 — 仅 0-1, 1-4, 1-5, 0-2 四条边各往返一次 = 4×2 = 8</text>

  <!-- Edges (traversed, green bold) drawn first so nodes overlay -->
  <line x1="280" y1="70" x2="160" y2="160" stroke="#4a7a3a" stroke-width="2.6" filter="url(#rough2)"/>
  <line x1="280" y1="70" x2="400" y2="160" stroke="#4a7a3a" stroke-width="2.6" filter="url(#rough2)"/>
  <line x1="160" y1="160" x2="95" y2="260" stroke="#4a7a3a" stroke-width="2.6" filter="url(#rough2)"/>
  <line x1="160" y1="160" x2="225" y2="260" stroke="#4a7a3a" stroke-width="2.6" filter="url(#rough2)"/>
  <!-- Edges (skipped, gray dashed) -->
  <line x1="400" y1="160" x2="335" y2="260" stroke="#bbb" stroke-width="1.4" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <line x1="400" y1="160" x2="465" y2="260" stroke="#bbb" stroke-width="1.4" stroke-dasharray="5,4" filter="url(#rough2)"/>

  <!-- x2 labels on traversed edges -->
  <text x="208" y="120" font-size="11" fill="#4a7a3a" font-weight="bold">×2</text>
  <text x="352" y="120" font-size="11" fill="#4a7a3a" font-weight="bold">×2</text>
  <text x="112" y="220" font-size="11" fill="#4a7a3a" font-weight="bold">×2</text>
  <text x="205" y="220" font-size="11" fill="#4a7a3a" font-weight="bold">×2</text>
  <!-- skip labels on dashed edges -->
  <text x="350" y="220" font-size="10" fill="#999">跳过</text>
  <text x="445" y="220" font-size="10" fill="#999">跳过</text>

  <!-- Nodes: 0 (root, no apple) -->
  <circle cx="280" cy="70" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="75" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <!-- 1 (no apple) -->
  <circle cx="160" cy="160" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="160" y="165" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <!-- 2 (apple) -->
  <circle cx="400" cy="160" r="19" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="400" y="165" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <!-- 4 (apple) -->
  <circle cx="95" cy="260" r="19" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="95" y="265" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <!-- 5 (apple) -->
  <circle cx="225" cy="260" r="19" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="225" y="265" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <!-- 3 (no apple) -->
  <circle cx="335" cy="260" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="335" y="265" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <!-- 6 (no apple) -->
  <circle cx="465" cy="260" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="465" y="265" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>

  <!-- Apple leaf markers above apple nodes -->
  <path d="M 400 142 q 5 -8 12 -6" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 95 242 q 5 -8 12 -6" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 225 242 q 5 -8 12 -6" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <!-- Legend / annotation -->
  <rect x="60" y="310" width="440" height="74" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="332" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">绿色实线 = 子树含苹果，必走往返 (+2)；灰色虚线 = 子树无苹果，不进入</text>
  <text x="280" y="352" text-anchor="middle" font-size="10.5" fill="#555">节点 2 自身有苹果 → 父边 0-2 往返，但其子节点 3、6 子树空 → 不深入</text>
  <text x="280" y="370" text-anchor="middle" font-size="10.5" fill="#555">DFS 自底向上汇总「子树是否含苹果」，含苹果的子树贡献 childTime + 2</text>
</svg>
