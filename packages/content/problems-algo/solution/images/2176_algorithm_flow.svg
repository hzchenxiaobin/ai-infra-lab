<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：建表分组 → 同组枚举 → 整除判定</text>

  <!-- ===== Step 1: Build hash map ===== -->
  <rect x="160" y="40" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="61" text-anchor="middle" font-size="11.5" fill="#333">① 建哈希表 pos：值 → 下标列表</text>

  <path d="M 260 76 L 260 92" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: Iterate each value group ===== -->
  <polygon points="260,94 370,130 260,166 150,130" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="126" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">② 遍历每个值分组</text>
  <text x="260" y="142" text-anchor="middle" font-size="10.5" fill="#555">还有未处理的组?</text>

  <!-- No branch: return count -->
  <path d="M 370 130 L 430 130" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="396" y="124" text-anchor="middle" font-size="10" fill="#888">否</text>
  <rect x="430" y="114" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="470" y="136" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">返回 ans</text>

  <!-- Yes branch down -->
  <path d="M 260 166 L 260 184" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="178" font-size="10" fill="#888">是</text>

  <!-- ===== Step 3: Enumerate pairs in group ===== -->
  <polygon points="260,186 370,222 260,258 150,222" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="218" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">③ 组内枚举数对 (i, j)</text>
  <text x="260" y="234" text-anchor="middle" font-size="10.5" fill="#555">i &lt; j, 同组下标两两组合</text>

  <!-- Yes branch down -->
  <path d="M 260 258 L 260 276" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="270" font-size="10" fill="#888">是</text>

  <!-- ===== Step 4: Check divisibility ===== -->
  <polygon points="260,278 380,312 260,346 140,312" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="308" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">④ (i · j) % k == 0 ?</text>
  <text x="260" y="324" text-anchor="middle" font-size="10" fill="#555">整除判定</text>

  <!-- Yes: ans++ -->
  <path d="M 140 312 L 70 312" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="105" y="306" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>
  <rect x="10" y="296" width="62" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="41" y="316" text-anchor="middle" font-size="10.5" fill="#333">ans += 1</text>

  <!-- No: skip -->
  <path d="M 380 312 L 440 312" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="306" text-anchor="middle" font-size="10" fill="#888">否</text>
  <rect x="440" y="296" width="60" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="470" y="316" text-anchor="middle" font-size="10" fill="#888">跳过</text>

  <!-- Loop back: from ans++ and skip up to step 3 -->
  <path d="M 41 296 L 41 222 L 150 222" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <path d="M 470 296 L 470 222" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="484" y="260" font-size="9.5" fill="#888">下一对</text>

  <!-- Loop back from step 3 (no more pairs) to step 2 -->
  <path d="M 370 222 L 400 222 L 400 130 L 370 130" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="408" y="180" font-size="9.5" fill="#888">下一组</text>

  <!-- ===== Bottom note ===== -->
  <rect x="40" y="352" width="440" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="260" y="367" text-anchor="middle" font-size="10" fill="#555">分组后跳过所有「值不同」的对 → 只对同值对做一次取模判定</text>
</svg>
