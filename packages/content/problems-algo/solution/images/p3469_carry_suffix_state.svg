<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">任意时刻：当前数组 = 1 个幸存者 + 一段连续后缀</text>

  <!-- Row A: 原数组视角 -->
  <text x="36" y="62" font-size="12" fill="#666" filter="url(#rough2)">① 原数组视角（× 为已删除）</text>

  <rect x="60" y="72" width="54" height="34" fill="#eeeeee" stroke="#999999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="87" y="94" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">6</text>
  <path d="M68,78 L106,100" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M68,100 L106,78" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <rect x="122" y="72" width="54" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="149" y="94" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>

  <rect x="184" y="72" width="54" height="34" fill="#eeeeee" stroke="#999999" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="211" y="94" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">8</text>
  <path d="M192,78 L230,100" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M192,100 L230,78" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <rect x="246" y="72" width="54" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="273" y="94" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>

  <rect x="308" y="72" width="54" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="335" y="94" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>

  <rect x="370" y="72" width="54" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="397" y="94" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <text x="87" y="118" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <text x="149" y="118" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">i</text>
  <text x="211" y="118" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <text x="273" y="118" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">j</text>
  <text x="335" y="118" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j+1</text>
  <text x="397" y="118" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j+2</text>

  <path d="M60,128 Q153,144 246,128" fill="none" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="153" y="150" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">已处理区（只剩幸存者）</text>
  <path d="M246,128 Q335,144 424,128" fill="none" stroke="#666" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="335" y="150" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">未处理后缀 nums[j:]</text>

  <!-- Row B: 当前数组视角 -->
  <text x="36" y="188" font-size="12" fill="#666" filter="url(#rough2)">② 当前数组（把幸存者拼到后缀前面）</text>

  <rect x="100" y="200" width="54" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="127" y="222" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>

  <rect x="162" y="200" width="54" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="189" y="222" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>

  <rect x="224" y="200" width="54" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="251" y="222" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>

  <rect x="286" y="200" width="54" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="313" y="222" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <rect x="92" y="192" width="194" height="50" rx="8" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="7 5" filter="url(#rough2)"/>

  <text x="127" y="262" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">a = nums[i]</text>
  <text x="189" y="262" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">b = nums[j]</text>
  <text x="251" y="262" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">c = nums[j+1]</text>
  <text x="313" y="262" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">后续…</text>
  <text x="189" y="281" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">每步只看前三个，从中删掉两个</text>

  <!-- Row C: 三种删法 -->
  <text x="36" y="312" font-size="12" fill="#666" filter="url(#rough2)">③ 三种删法（代价 = 被删两者的最大值）</text>

  <rect x="30" y="322" width="160" height="86" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="110" y="344" text-anchor="middle" font-size="13" fill="#2d4d24" filter="url(#rough2)">删 {a, b}</text>
  <text x="110" y="364" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">代价 max(a, b)</text>
  <text x="110" y="381" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">幸存 c = nums[j+1]</text>
  <text x="110" y="398" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">新状态 (j+1, j+2)</text>

  <rect x="200" y="322" width="160" height="86" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="344" text-anchor="middle" font-size="13" fill="#7a5a10" filter="url(#rough2)">删 {a, c}</text>
  <text x="280" y="364" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">代价 max(a, c)</text>
  <text x="280" y="381" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">幸存 b = nums[j]</text>
  <text x="280" y="398" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">新状态 (j, j+2)</text>

  <rect x="370" y="322" width="160" height="86" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="450" y="344" text-anchor="middle" font-size="13" fill="#8a3a34" filter="url(#rough2)">删 {b, c}</text>
  <text x="450" y="364" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">代价 max(b, c)</text>
  <text x="450" y="381" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">幸存 a = nums[i]</text>
  <text x="450" y="398" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">新状态 (i, j+2)</text>

  <text x="280" y="424" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">后缀起点每步恰好 +2 ⇒ 状态只需 (i, j) 两个下标</text>
</svg>
