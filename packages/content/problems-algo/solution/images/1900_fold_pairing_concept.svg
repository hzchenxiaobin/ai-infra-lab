<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    折半配对机制：第 i 名 ↔ 倒数第 i 名（n = 11）
  </text>

  <!-- ===== Pairing arcs (above boxes) ===== -->
  <!-- Box positions: x = 73 + i*38, cx = 90 + i*38, y=185, h=34 -->
  <!-- Pair (0,10) = (1,11): blue dashed, uncertain -->
  <path d="M90,185 Q280,50 470,185" fill="none" stroke="#446688" stroke-width="1.5"
        stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="280" y="48" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">1 vs 11 ?</text>

  <!-- Pair (1,9) = (2,10): green solid, special wins -->
  <path d="M128,185 Q280,68 432,185" fill="none" stroke="#4a7a3a" stroke-width="2.5"
        filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">2 vs 10 → 2 ✓</text>

  <!-- Pair (2,8) = (3,9): blue dashed -->
  <path d="M166,185 Q280,86 394,185" fill="none" stroke="#446688" stroke-width="1.5"
        stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="280" y="84" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">3 vs 9 ?</text>

  <!-- Pair (3,7) = (4,8): green solid, special wins -->
  <path d="M204,185 Q280,104 356,185" fill="none" stroke="#4a7a3a" stroke-width="2.5"
        filter="url(#rough2)"/>
  <text x="280" y="102" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">4 vs 8 → 4 ✓</text>

  <!-- Pair (4,6) = (5,7): blue dashed -->
  <path d="M242,185 Q280,122 318,185" fill="none" stroke="#446688" stroke-width="1.5"
        stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="280" y="120" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">5 vs 7 ?</text>

  <!-- ===== Player boxes (y=185, h=34, w=34) ===== -->
  <!-- Player 1 -->
  <rect x="73" y="185" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="207" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <!-- Player 2 — special -->
  <rect x="111" y="185" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="128" y="207" text-anchor="middle" font-size="13" fill="#2a4a1a" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- Player 3 -->
  <rect x="149" y="185" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="166" y="207" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <!-- Player 4 — special -->
  <rect x="187" y="185" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="207" text-anchor="middle" font-size="13" fill="#2a4a1a" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- Player 5 -->
  <rect x="225" y="185" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="242" y="207" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>

  <!-- Player 6 — bye -->
  <rect x="263" y="185" width="34" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="207" text-anchor="middle" font-size="13" fill="#5a4a1a" font-weight="bold" filter="url(#rough2)">6</text>

  <!-- Player 7 -->
  <rect x="301" y="185" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="318" y="207" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>

  <!-- Player 8 -->
  <rect x="339" y="185" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="356" y="207" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>

  <!-- Player 9 -->
  <rect x="377" y="185" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="394" y="207" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9</text>

  <!-- Player 10 -->
  <rect x="415" y="185" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="432" y="207" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10</text>

  <!-- Player 11 -->
  <rect x="453" y="185" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="470" y="207" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">11</text>

  <!-- Bye arrow (downward from player 6) -->
  <path d="M280,219 L280,245" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="294" y="240" font-size="10" fill="#d6a040" filter="url(#rough2)">轮空晋级</text>

  <!-- ===== Explanation box ===== -->
  <rect x="50" y="265" width="460" height="95" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="68" y="290" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">配对规则</text>
  <text x="68" y="310" font-size="11" fill="#444" filter="url(#rough2)">• 第 i 名与倒数第 i 名配对，获胜者进入下一回合</text>
  <text x="68" y="328" font-size="11" fill="#444" filter="url(#rough2)">• 总人数为奇数时，中间选手轮空自动晋级</text>
  <text x="68" y="346" font-size="11" fill="#444" filter="url(#rough2)">
    <tspan fill="#4a7a3a" font-weight="bold">绿色</tspan> = 必胜选手（firstPlayer/secondPlayer）　
    <tspan fill="#446688">蓝色虚线</tspan> = 胜负未定　
    <tspan fill="#d6a040" font-weight="bold">橙色</tspan> = 轮空
  </text>
</svg>
