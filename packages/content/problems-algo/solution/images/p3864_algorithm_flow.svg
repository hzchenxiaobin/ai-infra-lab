<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：前缀和 + 对半分治取 min</text>

  <!-- step 1: prefix sums -->
  <g filter="url(#rough2)">
    <rect x="130" y="36" width="260" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="260" y="55" text-anchor="middle" font-size="11" fill="#33506b">预处理前缀和 pre[i+1] = pre[i] + (s[i]=='1')</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 260 66 L 260 78" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)"/>
  </g>

  <!-- step 2: recursion entry -->
  <g filter="url(#rough2)">
    <rect x="130" y="78" width="260" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="260" y="97" text-anchor="middle" font-size="11" fill="#33506b">递归 solve(i, L) —— 初始调用 solve(0, n)</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 260 108 L 260 120" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)"/>
  </g>

  <!-- step 3: X via prefix sum -->
  <g filter="url(#rough2)">
    <rect x="130" y="120" width="260" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="260" y="139" text-anchor="middle" font-size="11" fill="#33506b">X = pre[i+L] − pre[i] （O(1) 取段内 1 数）</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 260 150 L 260 162" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)"/>
  </g>

  <!-- decision 1: X == 0? -->
  <g filter="url(#rough2)">
    <polygon points="260,162 330,190 260,218 190,190" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="260" y="194" text-anchor="middle" font-size="11" fill="#8a6a1a" font-weight="bold">X == 0 ?</text>
    <path d="M 330 190 L 384 190" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)"/>
    <text x="352" y="183" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
    <path d="M 260 218 L 260 230" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)"/>
    <text x="270" y="228" font-size="10.5" fill="#446688" font-weight="bold">否</text>
  </g>

  <!-- terminal: return flatCost -->
  <g filter="url(#rough2)">
    <rect x="388" y="172" width="118" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="447" y="188" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold">返回 flatCost</text>
    <text x="447" y="204" text-anchor="middle" font-size="9.5" fill="#4a7a3a">（全零段剪枝：拆开更贵）</text>
  </g>

  <!-- step 4: no-split cost -->
  <g filter="url(#rough2)">
    <rect x="130" y="230" width="260" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="260" y="249" text-anchor="middle" font-size="11" fill="#33506b">best = L × X × encCost</text>
  </g>

  <g filter="url(#rough2)">
    <path d="M 260 260 L 260 272" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)"/>
  </g>

  <!-- decision 2: even length? -->
  <g filter="url(#rough2)">
    <polygon points="260,272 334,300 260,328 186,300" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="260" y="304" text-anchor="middle" font-size="11" fill="#8a6a1a" font-weight="bold">L 为偶数 ?</text>
    <path d="M 334 300 L 384 300" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)"/>
    <text x="354" y="293" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
    <path d="M 260 328 L 260 344" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)"/>
    <text x="270" y="340" font-size="10.5" fill="#446688" font-weight="bold">否</text>
  </g>

  <!-- side action: try split -->
  <g filter="url(#rough2)">
    <rect x="388" y="276" width="118" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="447" y="292" text-anchor="middle" font-size="10" fill="#2f5d24">best = min(best,</text>
    <text x="447" y="306" text-anchor="middle" font-size="10" fill="#2f5d24">solve(i, L/2) +</text>
    <text x="447" y="320" text-anchor="middle" font-size="10" fill="#2f5d24">solve(i+L/2, L/2))</text>
    <path d="M 402 328 L 394 342" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrg)"/>
  </g>

  <!-- terminal: return best -->
  <g filter="url(#rough2)">
    <rect x="130" y="344" width="260" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="260" y="364" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold">返回 best</text>
  </g>

  <!-- left side note: no memo needed -->
  <g filter="url(#rough2)">
    <rect x="20" y="244" width="100" height="98" rx="8" fill="#ffffff" stroke="#888" stroke-width="1.4" stroke-dasharray="5 3"/>
    <text x="70" y="264" text-anchor="middle" font-size="11" fill="#8a6a1a" font-weight="bold">免记忆化</text>
    <text x="70" y="282" text-anchor="middle" font-size="10" fill="#557">递归树就是</text>
    <text x="70" y="296" text-anchor="middle" font-size="10" fill="#557">拆分树本身：</text>
    <text x="70" y="310" text-anchor="middle" font-size="10" fill="#557">每段恰访问</text>
    <text x="70" y="324" text-anchor="middle" font-size="10" fill="#557">一次 ⇒ O(n)</text>
  </g>

  <!-- bottom notes -->
  <g filter="url(#rough2)" text-anchor="middle" font-size="10.5" fill="#777">
    <text x="260" y="404">段数 2^(ν₂(n)+1) − 1 ≤ 2n − 1，每段 O(1) ⇒ 时间 O(n) · 空间 O(n)（栈深 O(log n)）</text>
    <text x="260" y="424">单段费用上界 L·X·encCost ≤ 10^15 —— C++ 必须 long long（1LL 起乘）</text>
  </g>
</svg>
