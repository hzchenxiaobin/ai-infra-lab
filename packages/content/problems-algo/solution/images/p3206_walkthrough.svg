<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 390"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="390" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">示例演算：colors = [0,1,0,0,1]，n = 5</text>

  <!-- 行背景（斑马纹） -->
  <rect x="25" y="70" width="470" height="44" fill="#f7f7f5"/>
  <rect x="25" y="158" width="470" height="44" fill="#f7f7f5"/>
  <rect x="25" y="246" width="470" height="44" fill="#f7f7f5"/>

  <!-- 表头 -->
  <rect x="25" y="40" width="470" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="45" y="59" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">i</text>
  <text x="115" y="59" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">左邻居</text>
  <text x="215" y="59" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">中间 colors[i]</text>
  <text x="315" y="59" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">右邻居</text>
  <text x="390" y="59" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">判定</text>
  <text x="455" y="59" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">交替组</text>

  <!-- 网格线 -->
  <g stroke="#bbb" stroke-width="1" filter="url(#rough2)">
    <line x1="65" y1="40" x2="65" y2="290"/>
    <line x1="165" y1="40" x2="165" y2="290"/>
    <line x1="265" y1="40" x2="265" y2="290"/>
    <line x1="365" y1="40" x2="365" y2="290"/>
    <line x1="415" y1="40" x2="415" y2="290"/>
    <line x1="25" y1="114" x2="495" y2="114"/>
    <line x1="25" y1="158" x2="495" y2="158"/>
    <line x1="25" y1="202" x2="495" y2="202"/>
    <line x1="25" y1="246" x2="495" y2="246"/>
    <line x1="25" y1="290" x2="495" y2="290"/>
  </g>
  <rect x="25" y="40" width="470" height="250" fill="none" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 行 1：i=0 -->
  <text x="45" y="97" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <rect x="83" y="77" width="64" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115" y="94" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1 蓝</text>
  <text x="115" y="111" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">colors[4]</text>
  <rect x="183" y="77" width="64" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="215" y="94" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0 红</text>
  <text x="215" y="111" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">colors[0]</text>
  <rect x="283" y="77" width="64" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="315" y="94" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1 蓝</text>
  <text x="315" y="111" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">colors[1]</text>
  <text x="390" y="99" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="455" y="97" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">(4,0,1)</text>

  <!-- 行 2：i=1 -->
  <text x="45" y="141" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="83" y="121" width="64" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115" y="138" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0 红</text>
  <text x="115" y="155" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">colors[0]</text>
  <rect x="183" y="121" width="64" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="215" y="138" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1 蓝</text>
  <text x="215" y="155" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">colors[1]</text>
  <rect x="283" y="121" width="64" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="315" y="138" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0 红</text>
  <text x="315" y="155" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">colors[2]</text>
  <text x="390" y="143" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="455" y="141" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">(0,1,2)</text>

  <!-- 行 3：i=2 -->
  <text x="45" y="185" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="83" y="165" width="64" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115" y="182" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1 蓝</text>
  <text x="115" y="199" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">colors[1]</text>
  <rect x="183" y="165" width="64" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="215" y="182" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0 红</text>
  <text x="215" y="199" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">colors[2]</text>
  <rect x="283" y="165" width="64" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="315" y="182" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0 红</text>
  <text x="315" y="199" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">colors[3]</text>
  <text x="390" y="187" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="455" y="185" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">右=中</text>

  <!-- 行 4：i=3 -->
  <text x="45" y="229" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="83" y="209" width="64" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115" y="226" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0 红</text>
  <text x="115" y="243" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">colors[2]</text>
  <rect x="183" y="209" width="64" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="215" y="226" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0 红</text>
  <text x="215" y="243" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">colors[3]</text>
  <rect x="283" y="209" width="64" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="315" y="226" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1 蓝</text>
  <text x="315" y="243" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">colors[4]</text>
  <text x="390" y="231" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="455" y="229" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">左=中</text>

  <!-- 行 5：i=4 -->
  <text x="45" y="273" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <rect x="83" y="253" width="64" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115" y="270" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0 红</text>
  <text x="115" y="287" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">colors[3]</text>
  <rect x="183" y="253" width="64" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="215" y="270" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1 蓝</text>
  <text x="215" y="287" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">colors[4]</text>
  <rect x="283" y="253" width="64" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="315" y="270" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0 红</text>
  <text x="315" y="287" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">colors[0]</text>
  <text x="390" y="275" text-anchor="middle" font-size="16" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>
  <text x="455" y="273" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">(3,4,0)</text>

  <!-- 结论 -->
  <rect x="60" y="310" width="400" height="58" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="335" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f5d27" filter="url(#rough2)">ans = 3</text>
  <text x="260" y="356" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">交替组 (4,0,1)、(0,1,2)、(3,4,0)，其中两个跨过首尾接缝</text>
</svg>
