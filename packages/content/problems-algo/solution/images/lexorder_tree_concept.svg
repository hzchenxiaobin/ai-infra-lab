<svg xmlns="http://www.w3.org/2000/svg" width="860" height="540" viewBox="0 0 860 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.2"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="ar2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="860" height="540" fill="#fdfcf7"/>

  <!-- Title -->
  <text x="430" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">字典序 = 10 叉树的前序遍历（n = 13）</text>
  <path d="M 230 42 Q 430 50 630 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="430" y="62" text-anchor="middle" font-size="11" fill="#888">每个节点 cur 的子节点 = cur×10 + d（d=0..9），只保留 ≤ n 的节点</text>

  <!-- Virtual root label -->
  <text x="430" y="100" text-anchor="middle" font-size="11" fill="#aaa" font-style="italic">（虚拟根：数字不以 0 开头，故根层从 1 开始）</text>

  <!-- ===== ROOT LAYER: nodes 1..9 at y=140 ===== -->
  <!-- node 1 (blue, has children) -->
  <g filter="url(#sk)">
    <rect x="92" y="126" width="56" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="2.2"/>
  </g>
  <text x="120" y="152" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b6e9e">1</text>
  <!-- visit badge for 1 -->
  <g filter="url(#sk2)">
    <circle cx="156" cy="132" r="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="156" y="136" text-anchor="middle" font-size="10" font-weight="bold" fill="#a07020">①</text>

  <!-- nodes 2..9 (green leaves) -->
  <g font-size="14" font-weight="bold" fill="#2e6e2e">
    <!-- positions: 280, 351, 422, 493, 564, 635, 706, 777 -->
    <g filter="url(#sk)"><rect x="256" y="126" width="48" height="40" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
    <text x="280" y="152" text-anchor="middle">2</text>
    <g filter="url(#sk2)"><circle cx="300" cy="132" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
    <text x="300" y="136" text-anchor="middle" font-size="9" font-weight="bold" fill="#a07020">⑥</text>

    <g filter="url(#sk)"><rect x="327" y="126" width="48" height="40" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
    <text x="351" y="152" text-anchor="middle">3</text>
    <g filter="url(#sk2)"><circle cx="371" cy="132" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
    <text x="371" y="136" text-anchor="middle" font-size="9" font-weight="bold" fill="#a07020">⑦</text>

    <g filter="url(#sk)"><rect x="398" y="126" width="48" height="40" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
    <text x="422" y="152" text-anchor="middle">4</text>
    <g filter="url(#sk2)"><circle cx="442" cy="132" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
    <text x="442" y="136" text-anchor="middle" font-size="9" font-weight="bold" fill="#a07020">⑧</text>

    <g filter="url(#sk)"><rect x="469" y="126" width="48" height="40" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
    <text x="493" y="152" text-anchor="middle">5</text>
    <g filter="url(#sk2)"><circle cx="513" cy="132" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
    <text x="513" y="136" text-anchor="middle" font-size="9" font-weight="bold" fill="#a07020">⑨</text>

    <g filter="url(#sk)"><rect x="540" y="126" width="48" height="40" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
    <text x="564" y="152" text-anchor="middle">6</text>
    <g filter="url(#sk2)"><circle cx="584" cy="132" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
    <text x="584" y="136" text-anchor="middle" font-size="9" font-weight="bold" fill="#a07020">⑩</text>

    <g filter="url(#sk)"><rect x="611" y="126" width="48" height="40" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
    <text x="635" y="152" text-anchor="middle">7</text>
    <g filter="url(#sk2)"><circle cx="655" cy="132" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
    <text x="655" y="136" text-anchor="middle" font-size="9" font-weight="bold" fill="#a07020">⑪</text>

    <g filter="url(#sk)"><rect x="682" y="126" width="48" height="40" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
    <text x="706" y="152" text-anchor="middle">8</text>
    <g filter="url(#sk2)"><circle cx="726" cy="132" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
    <text x="726" y="136" text-anchor="middle" font-size="9" font-weight="bold" fill="#a07020">⑫</text>

    <g filter="url(#sk)"><rect x="753" y="126" width="48" height="40" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
    <text x="777" y="152" text-anchor="middle">9</text>
    <g filter="url(#sk2)"><circle cx="797" cy="132" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
    <text x="797" y="136" text-anchor="middle" font-size="9" font-weight="bold" fill="#a07020">⑬</text>
  </g>

  <!-- ===== CHILDREN of node 1: 10,11,12,13 at y=250 ===== -->
  <!-- edges from 1 down to children -->
  <g stroke="#4a8edb" stroke-width="1.4" fill="none" filter="url(#sk)">
    <path d="M 108 166 Q 90 200 70 234"/>
    <path d="M 116 166 Q 110 200 105 234"/>
    <path d="M 128 166 Q 140 200 155 234"/>
    <path d="M 136 166 Q 160 200 200 234"/>
  </g>

  <!-- child nodes 10..13 -->
  <g filter="url(#sk)">
    <rect x="46" y="234" width="48" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
  </g>
  <text x="70" y="260" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">10</text>
  <g filter="url(#sk2)"><circle cx="90" cy="240" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="90" y="244" text-anchor="middle" font-size="9" font-weight="bold" fill="#a07020">②</text>

  <g filter="url(#sk)">
    <rect x="105" y="234" width="48" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
  </g>
  <text x="129" y="260" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">11</text>
  <g filter="url(#sk2)"><circle cx="149" cy="240" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="149" y="244" text-anchor="middle" font-size="9" font-weight="bold" fill="#a07020">③</text>

  <g filter="url(#sk)">
    <rect x="155" y="234" width="48" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
  </g>
  <text x="179" y="260" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">12</text>
  <g filter="url(#sk2)"><circle cx="199" cy="240" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="199" y="244" text-anchor="middle" font-size="9" font-weight="bold" fill="#a07020">④</text>

  <g filter="url(#sk)">
    <rect x="200" y="234" width="48" height="40" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
  </g>
  <text x="224" y="260" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6e9e">13</text>
  <g filter="url(#sk2)"><circle cx="244" cy="240" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="244" y="244" text-anchor="middle" font-size="9" font-weight="bold" fill="#a07020">⑤</text>

  <!-- dotted expansion hint under 2 -->
  <g stroke="#bbb" stroke-width="1" stroke-dasharray="3 3" fill="none" filter="url(#sk)">
    <path d="M 280 166 L 280 220"/>
  </g>
  <text x="280" y="238" text-anchor="middle" font-size="10" fill="#aaa" font-style="italic">2×10=20&gt;13</text>
  <text x="280" y="252" text-anchor="middle" font-size="10" fill="#aaa" font-style="italic">无子节点</text>

  <!-- ===== Pre-order traversal path (curved red arrows) ===== -->
  <text x="430" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#b03a3a">↑ 前序遍历路径（根 → 子节点）</text>

  <!-- path: 1 -> 10 -> 11 -> 12 -> 13 -> back up to 2 -> 3 -> ... -> 9 -->
  <g stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#sk)">
    <!-- 1 down to 10 -->
    <path d="M 120 166 Q 95 195 70 234" marker-end="url(#ar)"/>
    <!-- 10 -> 11 -->
    <path d="M 94 254 L 105 254" marker-end="url(#ar)"/>
    <!-- 11 -> 12 -->
    <path d="M 153 254 L 155 254" marker-end="url(#ar)"/>
    <!-- 12 -> 13 -->
    <path d="M 203 254 L 200 254" marker-end="url(#ar)"/>
    <!-- 13 back up to 1 then to 2 (big curve) -->
    <path d="M 248 240 Q 300 180 256 146" marker-end="url(#ar)"/>
    <!-- 2 -> 3 -->
    <path d="M 304 146 L 327 146" marker-end="url(#ar)"/>
    <!-- 3 -> 4 -->
    <path d="M 375 146 L 398 146" marker-end="url(#ar)"/>
    <!-- 4 -> 5 -->
    <path d="M 446 146 L 469 146" marker-end="url(#ar)"/>
    <!-- 5 -> 6 -->
    <path d="M 517 146 L 540 146" marker-end="url(#ar)"/>
    <!-- 6 -> 7 -->
    <path d="M 588 146 L 611 146" marker-end="url(#ar)"/>
    <!-- 7 -> 8 -->
    <path d="M 659 146 L 682 146" marker-end="url(#ar)"/>
    <!-- 8 -> 9 -->
    <path d="M 730 146 L 753 146" marker-end="url(#ar)"/>
  </g>

  <!-- ===== Result sequence bar ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="350" width="780" height="56" rx="10" fill="#fffdf3" stroke="#c9a93a" stroke-width="1.8"/>
  </g>
  <text x="60" y="335" font-size="11" fill="#888">前序遍历结果 = 字典序：</text>
  <g font-size="13" fill="#2b2b2b" font-weight="bold">
    <text x="70" y="384">[</text>
    <text x="84" y="384" fill="#2b6e9e">1</text>
    <text x="100" y="384" fill="#2b6e9e">10</text>
    <text x="126" y="384" fill="#2b6e9e">11</text>
    <text x="152" y="384" fill="#2b6e9e">12</text>
    <text x="178" y="384" fill="#2b6e9e">13</text>
    <text x="206" y="384" fill="#888">,</text>
    <text x="220" y="384" fill="#2e6e2e">2</text>
    <text x="236" y="384" fill="#2e6e2e">3</text>
    <text x="252" y="384" fill="#2e6e2e">4</text>
    <text x="268" y="384" fill="#2e6e2e">5</text>
    <text x="284" y="384" fill="#2e6e2e">6</text>
    <text x="300" y="384" fill="#2e6e2e">7</text>
    <text x="316" y="384" fill="#2e6e2e">8</text>
    <text x="332" y="384" fill="#2e6e2e">9</text>
    <text x="348" y="384">]</text>
  </g>

  <!-- ===== Bottom notes ===== -->
  <g filter="url(#sk)">
    <rect x="40" y="424" width="780" height="98" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="430" y="448" text-anchor="middle" font-size="12" fill="#444">
    <tspan font-weight="bold" fill="#2b6e9e">前序遍历</tspan>：先访问根 cur，再依次访问子节点 cur×10+0, +1, …, +9
  </text>
  <text x="430" y="468" text-anchor="middle" font-size="11.5" fill="#555">
    <tspan fill="#888">为什么前序 = 字典序？</tspan>
    <tspan fill="#2b6e9e" font-weight="bold"> cur 是子节点的前缀</tspan>
    <tspan fill="#888">，前缀更小（"1" &lt; "10"）；子节点按末位 0-9 升序 = 字符串升序</tspan>
  </text>
  <text x="430" y="488" text-anchor="middle" font-size="11" fill="#666">
    根层从 <tspan font-weight="bold" fill="#b03a3a">1</tspan> 开始（数字不以 0 开头），子层从 <tspan font-weight="bold" fill="#b03a3a">0</tspan> 开始（0 可作中间位/末位，如 10、205）
  </text>
  <text x="430" y="508" text-anchor="middle" font-size="10.5" fill="#b03a3a" font-weight="bold">
    这棵树本质上是一棵隐式字典树（Trie）—— 与 208 题 Trie 的前序遍历同构
  </text>
</svg>
