<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">快速排序递归流程（随机主元 + 三向切分）</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">入口 quickSort(lo, hi) → 跳过空段 → 随机主元 → 切分 → 递归左右</text>

  <!-- 1: entry -->
  <rect x="200" y="60" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="85" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">quickSort(lo, hi)</text>

  <!-- arrow down -->
  <path d="M 280 100 L 280 120" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2: decision lo>=hi -->
  <polygon points="280,124 380,164 280,204 180,164" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="160" text-anchor="middle" font-size="11" fill="#333">lo ≥ hi?</text>
  <text x="280" y="176" text-anchor="middle" font-size="9" fill="#888">区间长度 ≤ 1</text>

  <!-- yes branch: return -->
  <path d="M 380 164 L 430 164" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="158" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="430" y="148" width="90" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="475" y="170" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return</text>

  <!-- no branch -->
  <path d="M 280 204 L 280 224" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="218" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- 3: random pivot -->
  <rect x="170" y="228" width="220" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="248" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">随机选主元 r = lo + rand()%(hi-lo+1)</text>
  <text x="280" y="266" text-anchor="middle" font-size="10" fill="#555">swap(nums[lo], nums[r]);  pivot = nums[lo]</text>

  <path d="M 280 276 L 280 296" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4: three-way partition -->
  <rect x="150" y="300" width="260" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">三向切分 (lt, i, gt)</text>
  <text x="280" y="340" text-anchor="middle" font-size="10" fill="#555">扫到 i &gt; gt，得 [lo..lt-1] &lt; / [lt..gt] == / [gt+1..hi] &gt;</text>

  <!-- split to two recursions -->
  <path d="M 280 356 L 280 372" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 180 372 L 380 372" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 180 372 L 180 392" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 380 372 L 380 392" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 5a: recurse left -->
  <rect x="80" y="396" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="180" y="416" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">quickSort(lo, lt − 1)</text>
  <text x="180" y="432" text-anchor="middle" font-size="9" fill="#888">递归排序 &lt; pivot 段</text>

  <!-- 5b: recurse right -->
  <rect x="300" y="396" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="400" y="416" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">quickSort(gt + 1, hi)</text>
  <text x="400" y="432" text-anchor="middle" font-size="9" fill="#888">递归排序 &gt; pivot 段</text>

  <!-- note: == segment skipped -->
  <rect x="60" y="448" width="460" height="0" fill="none"/>
  <text x="280" y="452" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">★ [lt..gt] == pivot 已归位，跳过不递归</text>
</svg>
