<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">分组背包计数：每枚骰子选且仅选一个面值</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">dp[i][j] = Σ dp[i-1][j-f]，f = 1..k，第 i 枚骰子选面值 f</text>

  <!-- ===== TOP: dp[i][j] target ===== -->
  <rect x="220" y="68" width="120" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="90" text-anchor="middle" font-size="13" fill="#2d4d22" font-weight="bold">dp[i][j]</text>
  <text x="280" y="106" text-anchor="middle" font-size="10" fill="#5a8a5a">i 枚骰子凑出和 j</text>

  <!-- ===== MIDDLE: die i with face choices ===== -->
  <text x="280" y="142" text-anchor="middle" font-size="11" fill="#888">↓ 第 i 枚骰子选哪个面值？</text>

  <!-- face 1 -->
  <rect x="60" y="158" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="178" text-anchor="middle" font-size="12" fill="#2a3f55" font-weight="bold">f = 1</text>
  <!-- face 2 -->
  <rect x="170" y="158" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="205" y="178" text-anchor="middle" font-size="12" fill="#2a3f55" font-weight="bold">f = 2</text>
  <!-- face f (generic) -->
  <rect x="280" y="158" width="70" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="315" y="178" text-anchor="middle" font-size="12" fill="#a07820" font-weight="bold">f = f</text>
  <!-- dots -->
  <text x="380" y="178" text-anchor="middle" font-size="14" fill="#aaa" font-weight="bold">···</text>
  <!-- face k -->
  <rect x="430" y="158" width="70" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="465" y="178" text-anchor="middle" font-size="12" fill="#7a3a38" font-weight="bold">f = k</text>

  <!-- ===== BOTTOM: dp[i-1][j-f] cells ===== -->
  <!-- arrows from faces to dp[i-1] cells -->
  <path d="M 95 192 L 95 220" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 205 192 L 205 220" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 315 192 L 315 220" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 465 192 L 465 220" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- dp[i-1][j-1] -->
  <rect x="60" y="226" width="70" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="245" text-anchor="middle" font-size="10" fill="#2a3f55" font-weight="bold">dp[i-1]</text>
  <text x="95" y="259" text-anchor="middle" font-size="10" fill="#2a3f55">[j-1]</text>
  <!-- dp[i-1][j-2] -->
  <rect x="170" y="226" width="70" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="205" y="245" text-anchor="middle" font-size="10" fill="#2a3f55" font-weight="bold">dp[i-1]</text>
  <text x="205" y="259" text-anchor="middle" font-size="10" fill="#2a3f55">[j-2]</text>
  <!-- dp[i-1][j-f] -->
  <rect x="280" y="226" width="70" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="315" y="245" text-anchor="middle" font-size="10" fill="#a07820" font-weight="bold">dp[i-1]</text>
  <text x="315" y="259" text-anchor="middle" font-size="10" fill="#a07820">[j-f]</text>
  <!-- dots -->
  <text x="380" y="250" text-anchor="middle" font-size="14" fill="#aaa" font-weight="bold">···</text>
  <!-- dp[i-1][j-k] -->
  <rect x="430" y="226" width="70" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="465" y="245" text-anchor="middle" font-size="10" fill="#7a3a38" font-weight="bold">dp[i-1]</text>
  <text x="465" y="259" text-anchor="middle" font-size="10" fill="#7a3a38">[j-k]</text>

  <!-- ===== SUM bar ===== -->
  <path d="M 95 270 L 95 285 L 465 285 L 465 270" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 280 285 L 280 300" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="180" y="300" width="200" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="318" text-anchor="middle" font-size="11" fill="#2d4d22" font-weight="bold">Σ 求和 → dp[i][j]</text>

  <!-- ===== bottom note ===== -->
  <rect x="30" y="340" width="500" height="32" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="11" fill="#555">每组（骰子）恰选一个面值 → 分组背包，区别于完全背包（可重复选）</text>
</svg>
