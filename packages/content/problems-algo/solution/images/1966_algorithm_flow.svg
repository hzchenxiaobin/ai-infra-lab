<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：双趟扫描 — 前缀最大判左侧，后缀最小判右侧</text>

  <!-- Start -->
  <rect x="200" y="40" width="120" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">ok = [1] · n</text>
  <path d="M 260 70 L 260 86" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Pass 1 header -->
  <rect x="100" y="86" width="320" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="105" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">第一趟  左 → 右   （mx = −∞）</text>
  <path d="M 260 114 L 260 128" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond 1 -->
  <polygon points="260,128 340,158 260,188 180,158" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="162" text-anchor="middle" font-size="12" fill="#7a5a20" font-weight="bold" filter="url(#rough2)">nums[i] &lt; mx ?</text>

  <!-- Branch labels -->
  <text x="168" y="150" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <text x="352" y="150" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- Branch arrows -->
  <path d="M 180 158 L 115 200" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 340 158 L 405 200" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Branch boxes -->
  <rect x="40" y="200" width="150" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="115" y="220" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">ok[i] = 0</text>

  <rect x="330" y="200" width="150" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="405" y="220" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">mx = nums[i]</text>

  <!-- Merge -->
  <path d="M 115 232 L 115 258 L 255 258" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 405 232 L 405 258 L 265 258" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop annotation 1 -->
  <text x="260" y="274" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">↻ 对每个 i = 0 … n−1 重复</text>
  <path d="M 260 280 L 260 296" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Pass 2 header -->
  <rect x="100" y="296" width="320" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="315" text-anchor="middle" font-size="12" fill="#7a5a20" font-weight="bold" filter="url(#rough2)">第二趟  右 → 左   （mi = +∞, ans = 0）</text>
  <path d="M 260 324 L 260 338" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond 2 -->
  <polygon points="260,338 340,368 260,398 180,368" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="372" text-anchor="middle" font-size="12" fill="#7a5a20" font-weight="bold" filter="url(#rough2)">nums[i] &gt; mi ?</text>

  <text x="168" y="360" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <text x="352" y="360" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <path d="M 180 368 L 115 410" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 340 368 L 405 410" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="30" y="410" width="170" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="115" y="430" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">ok[i] = 0；ans += ok[i]</text>

  <rect x="320" y="410" width="170" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="405" y="430" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">mi = nums[i]；ans += ok[i]</text>

  <!-- Merge 2 -->
  <path d="M 115 442 L 115 468 L 255 468" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 405 442 L 405 468 L 265 468" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="260" y="484" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">↻ 对每个 i = n−1 … 0 重复</text>
  <path d="M 260 490 L 260 504" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- End -->
  <rect x="200" y="504" width="120" height="30" rx="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="524" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return ans</text>
</svg>
