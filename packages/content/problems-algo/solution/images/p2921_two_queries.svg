<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：条件最大值搬进值域（扫描方向管下标，Fenwick 管价格）</text>

  <!-- 面板一：左扫 -->
  <rect x="30" y="38" width="500" height="186" fill="#ffffff" stroke="#446688" stroke-width="1.5" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="58" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① 左扫求 left[j]：先查后插，BIT 里只有下标 &lt; j 的元素</text>

  <rect x="96" y="70" width="52" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="150" y="70" width="52" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="204" y="70" width="52" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="258" y="70" width="52" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="312" y="70" width="52" height="24" fill="#ffffff" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="366" y="70" width="52" height="24" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="122" y="87" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="176" y="87" text-anchor="middle" font-size="11" fill="#333">7</text>
  <text x="230" y="87" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="284" y="87" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="338" y="87" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="392" y="87" text-anchor="middle" font-size="11" fill="#333">8</text>
  <text x="122" y="108" text-anchor="middle" font-size="9" fill="#999">0</text>
  <text x="176" y="108" text-anchor="middle" font-size="9" fill="#999">1</text>
  <text x="230" y="108" text-anchor="middle" font-size="9" fill="#999">2</text>
  <text x="284" y="108" text-anchor="middle" font-size="9" fill="#999">3</text>
  <text x="338" y="108" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">4(j)</text>
  <text x="392" y="108" text-anchor="middle" font-size="9" fill="#999">5</text>
  <rect x="428" y="72" width="12" height="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="446" y="82" font-size="9" fill="#446688">已插入</text>
  <rect x="428" y="90" width="12" height="12" fill="#ffffff" stroke="#aaa" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="446" y="100" font-size="9" fill="#999">未插入</text>

  <text x="88" y="137" text-anchor="end" font-size="10" fill="#999">值域</text>
  <rect x="96" y="122" width="44" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="140" y="122" width="44" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="184" y="122" width="44" height="22" fill="#ffffff" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="228" y="122" width="44" height="22" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="272" y="122" width="44" height="22" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="316" y="122" width="44" height="22" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="360" y="122" width="44" height="22" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="404" y="122" width="44" height="22" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="118" y="137" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="162" y="137" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="206" y="137" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3</text>
  <text x="250" y="137" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="294" y="137" text-anchor="middle" font-size="10" fill="#333">5</text>
  <text x="338" y="137" text-anchor="middle" font-size="10" fill="#333">6</text>
  <text x="382" y="137" text-anchor="middle" font-size="10" fill="#333">7</text>
  <text x="426" y="137" text-anchor="middle" font-size="10" fill="#333">8</text>
  <path d="M 334 96 C 310 108, 245 108, 212 119" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="280" y="176" text-anchor="middle" font-size="10" fill="#555">left[j] = t1.query(p − 1)：已插入元素中「价格 ∈ [1, p−1]」的最大利润</text>
  <text x="280" y="194" text-anchor="middle" font-size="10" fill="#555">随后 t1.update(p, profits[j]) 把自己挂上——查询端点开区间，同价不会被选中</text>

  <!-- 面板二：右扫 + 翻转 -->
  <rect x="30" y="234" width="500" height="186" fill="#ffffff" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="254" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">② 右扫求 right[j]：翻转 v′ = M + 1 − v，「价格更大」变前缀 max</text>

  <rect x="96" y="266" width="52" height="24" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="150" y="266" width="52" height="24" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="204" y="266" width="52" height="24" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="258" y="266" width="52" height="24" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="312" y="266" width="52" height="24" fill="#ffffff" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="366" y="266" width="52" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="283" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="176" y="283" text-anchor="middle" font-size="11" fill="#333">7</text>
  <text x="230" y="283" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="284" y="283" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="338" y="283" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="392" y="283" text-anchor="middle" font-size="11" fill="#333">8</text>
  <text x="122" y="304" text-anchor="middle" font-size="9" fill="#999">0</text>
  <text x="176" y="304" text-anchor="middle" font-size="9" fill="#999">1</text>
  <text x="230" y="304" text-anchor="middle" font-size="9" fill="#999">2</text>
  <text x="284" y="304" text-anchor="middle" font-size="9" fill="#999">3</text>
  <text x="338" y="304" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">4(j)</text>
  <text x="392" y="304" text-anchor="middle" font-size="9" fill="#999">5</text>
  <rect x="428" y="268" width="12" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="446" y="278" font-size="9" fill="#b85450">已插入</text>
  <rect x="428" y="286" width="12" height="12" fill="#ffffff" stroke="#aaa" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="446" y="296" font-size="9" fill="#999">未插入</text>

  <text x="88" y="333" text-anchor="end" font-size="10" fill="#999">v′ 域</text>
  <rect x="96" y="318" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="140" y="318" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="184" y="318" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="228" y="318" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="272" y="318" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="316" y="318" width="44" height="22" fill="#ffffff" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="360" y="318" width="44" height="22" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="404" y="318" width="44" height="22" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="118" y="333" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="162" y="333" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="206" y="333" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="250" y="333" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="294" y="333" text-anchor="middle" font-size="10" fill="#333">5</text>
  <text x="338" y="333" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">6</text>
  <text x="382" y="333" text-anchor="middle" font-size="10" fill="#333">7</text>
  <text x="426" y="333" text-anchor="middle" font-size="10" fill="#333">8</text>
  <path d="M 338 292 L 338 314" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="280" y="372" text-anchor="middle" font-size="10" fill="#555">right[j] = t2.query(M − p)：翻转域前缀 [1, M−p] ⇔ 原值域后缀 (p, M]</text>
  <text x="280" y="390" text-anchor="middle" font-size="10" fill="#555">插入同样翻转：t2.update(M+1−p, profits[j])；从右往左，BIT 里只有下标 &gt; j 的元素</text>

  <!-- 底部要点 -->
  <rect x="30" y="428" width="500" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="443" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">下标约束（i &lt; j &lt; k）由扫描先后顺序隐式编码，查询只剩价格条件</text>
  <text x="280" y="459" text-anchor="middle" font-size="10" fill="#555">每遍 n 次 query + n 次 update，各 O(log M)，两遍共 O(n log M)</text>
</svg>
