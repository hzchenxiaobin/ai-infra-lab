<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">示例演算：三次查询</text>

  <!-- arr label -->
  <text x="50" y="60" font-size="11" fill="#666" filter="url(#rough2)">arr:</text>

  <!-- index labels -->
  <text x="170" y="44" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">0</text>
  <text x="214" y="44" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">1</text>
  <text x="258" y="44" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">2</text>
  <text x="302" y="44" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">3</text>
  <text x="346" y="44" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">4</text>
  <text x="390" y="44" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">5</text>

  <!-- cells: 1,1,2,2,1,1 ; width 44 starting x=148 -->
  <rect x="148" y="50" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="68" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="192" y="50" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="214" y="68" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="236" y="50" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="258" y="68" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="280" y="50" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="302" y="68" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="324" y="50" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="346" y="68" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="368" y="50" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="390" y="68" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <!-- positions map -->
  <text x="50" y="92" font-size="10" fill="#666" filter="url(#rough2)">下标表:</text>
  <rect x="110" y="82" width="130" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="175" y="96" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1 → [0, 1, 4, 5]</text>
  <rect x="250" y="82" width="90" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="295" y="96" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2 → [2, 3]</text>

  <!-- divider -->
  <path d="M 40 112 Q 280 109 520 112" stroke="#ccc" stroke-width="1" stroke-dasharray="5,3" fill="none" filter="url(#rough2)"/>

  <!-- ===== Query 1 ===== -->
  <rect x="40" y="120" width="480" height="56" fill="#f0f7f0" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="3,2" rx="6" filter="url(#rough2)"/>
  <text x="54" y="138" font-size="11" fill="#4a7a3a" filter="url(#rough2)">query(0, 5, 4)</text>
  <text x="54" y="156" font-size="10" fill="#666" filter="url(#rough2)">采样 idx=0 → 1, 二分 [0,1,4,5] ∩ [0,5] = 4 ≥ 4 ✓</text>
  <rect x="430" y="130" width="78" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="469" y="146" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">return 1</text>

  <!-- ===== Query 2 ===== -->
  <rect x="40" y="184" width="480" height="74" fill="#fdf0f0" stroke="#b85450" stroke-width="1" stroke-dasharray="3,2" rx="6" filter="url(#rough2)"/>
  <text x="54" y="202" font-size="11" fill="#b85450" filter="url(#rough2)">query(0, 3, 3)</text>
  <text x="54" y="218" font-size="10" fill="#666" filter="url(#rough2)">采样 idx=0 → 1, count = upper(3)−lower(0) = 2 − 0 = 2 &lt; 3</text>
  <text x="54" y="234" font-size="10" fill="#666" filter="url(#rough2)">采样 idx=2 → 2, count = 2 − 0 = 2 &lt; 3</text>
  <text x="54" y="250" font-size="10" fill="#888" filter="url(#rough2)">… K 轮均未命中</text>
  <rect x="430" y="212" width="78" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="469" y="228" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">return -1</text>

  <!-- ===== Query 3 ===== -->
  <rect x="40" y="266" width="480" height="56" fill="#f0f7f0" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="3,2" rx="6" filter="url(#rough2)"/>
  <text x="54" y="284" font-size="11" fill="#4a7a3a" filter="url(#rough2)">query(2, 3, 2)</text>
  <text x="54" y="302" font-size="10" fill="#666" filter="url(#rough2)">采样 idx=2 → 2, 二分 [2,3] ∩ [2,3] = 2 ≥ 2 ✓</text>
  <rect x="430" y="276" width="78" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="469" y="292" text-anchor="middle" font-size="11" fill="#3a5a2a" filter="url(#rough2)">return 2</text>

  <!-- Summary -->
  <rect x="80" y="334" width="400" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="352" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">命中概率 &gt; 1/2，K = 20 轮</text>
  <text x="280" y="370" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">漏检 &lt; (1/2)²⁰ ≈ 10⁻⁶，覆盖 10⁴ 次查询</text>
</svg>
