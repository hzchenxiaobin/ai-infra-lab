<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 600" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="4.5" refY="8" orient="auto">
      <path d="M0,0 L9,0 L4.5,8 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="600" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">搜索长度未知的有序数组 — 算法流程</text>

  <!-- Phase 1 banner -->
  <rect x="30" y="44" width="190" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="125" y="61" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">阶段一：指数扩界</text>

  <!-- start -->
  <rect x="200" y="76" width="140" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="96" text-anchor="middle" font-size="11.5" fill="#333">left=0, right=1</text>
  <path d="M 270 108 L 270 126" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- loop cond diamond -->
  <polygon points="270,130 380,175 270,220 160,175" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="172" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">get(right) &lt; target ?</text>
  <text x="270" y="190" text-anchor="middle" font-size="10" fill="#888">含越界哨兵 2³¹−1</text>

  <!-- yes branch (down) -->
  <path d="M 270 220 L 270 240" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="282" y="234" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- doubling box -->
  <rect x="150" y="244" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="262" text-anchor="middle" font-size="11.5" fill="#333">left = right</text>
  <text x="270" y="278" text-anchor="middle" font-size="11.5" fill="#333">right = right × 2 （翻倍）</text>

  <!-- loop back arrow to diamond -->
  <path d="M 390 264 L 430 264 L 430 175 L 380 175" stroke="#888" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="452" y="220" text-anchor="middle" font-size="9.5" fill="#888">回循环</text>

  <!-- no branch (right) -> to phase 2 -->
  <path d="M 380 175 L 470 175 L 470 300 L 270 300 L 270 320" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="410" y="167" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <text x="478" y="240" font-size="9.5" fill="#888">区间已定</text>
  <text x="478" y="254" font-size="9.5" fill="#888">[left, right]</text>

  <!-- Phase 2 banner -->
  <rect x="30" y="310" width="190" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="125" y="327" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">阶段二：二分查找</text>

  <!-- binary search loop cond -->
  <polygon points="270,336 370,376 270,416 170,376" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="374" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">left ≤ right ?</text>

  <!-- no -> return -1 -->
  <path d="M 370 376 L 460 376" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="402" y="368" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="410" y="388" width="110" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="465" y="406" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">return −1</text>

  <!-- yes -> mid -->
  <path d="M 270 416 L 270 434" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="282" y="428" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="170" y="438" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="458" text-anchor="middle" font-size="11.5" fill="#333">mid = left + (right−left)/2</text>
  <path d="M 270 468 L 270 484" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- compare diamond -->
  <polygon points="270,488 360,522 270,556 180,522" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="518" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">get(mid) vs target</text>

  <!-- equal -> return mid (left) -->
  <path d="M 180 522 L 120 522 L 120 564" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="146" y="514" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">==</text>
  <rect x="60" y="568" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="120" y="585" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">return mid ✅</text>

  <!-- less -> left=mid+1 (down-left) -->
  <path d="M 230 556 L 200 576 L 200 568" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="205" y="548" font-size="9.5" fill="#446688" font-weight="bold">&lt;t</text>

  <!-- greater -> right=mid-1 (down-right) -->
  <path d="M 310 556 L 340 576 L 340 568" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="335" y="548" font-size="9.5" fill="#b85450" font-weight="bold">&gt;t</text>

  <rect x="150" y="568" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="200" y="585" text-anchor="middle" font-size="10.5" fill="#446688">left=mid+1</text>

  <rect x="290" y="568" width="100" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="340" y="585" text-anchor="middle" font-size="10.5" fill="#b85450">right=mid−1</text>
</svg>
