<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：nums=[3,4,9,1,3,9,5], key=9, k=1</text>
  <text x="270" y="42" text-anchor="middle" font-size="10.5" fill="#888">差分数组法三步：收集 key → 差分标记 → 前缀求并集</text>

  <!-- ===== Step 1: collect key positions ===== -->
  <text x="30" y="68" font-size="11" fill="#d6a040" font-weight="bold">① 收集 key 位置</text>

  <!-- nums row with key highlighted -->
  <text x="30" y="92" font-size="10" fill="#888">nums:</text>
  <rect x="70" y="78" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="92" y="97" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
  <rect x="114" y="78" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="136" y="97" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">4</text>
  <rect x="158" y="78" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="97" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">9</text>
  <rect x="202" y="78" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="224" y="97" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <rect x="246" y="78" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="268" y="97" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
  <rect x="290" y="78" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="312" y="97" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">9</text>
  <rect x="334" y="78" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="356" y="97" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">5</text>

  <!-- index labels -->
  <text x="92" y="120" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="136" y="120" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="180" y="120" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="224" y="120" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="268" y="120" text-anchor="middle" font-size="9" fill="#aaa">4</text>
  <text x="312" y="120" text-anchor="middle" font-size="9" fill="#aaa">5</text>
  <text x="356" y="120" text-anchor="middle" font-size="9" fill="#aaa">6</text>

  <text x="400" y="97" font-size="10.5" fill="#d6a040" font-weight="bold">→ keys=[2, 5]</text>

  <!-- ===== Step 2: diff marking ===== -->
  <text x="30" y="150" font-size="11" fill="#d6a040" font-weight="bold">② 差分标记区间</text>

  <!-- table header: j, [L,R], diff ops -->
  <rect x="30" y="158" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="174" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">key 位置 j</text>
  <rect x="110" y="158" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="174" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">裁剪 [L, R]</text>
  <rect x="210" y="158" width="200" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="174" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">diff 操作</text>

  <!-- row 1: j=2 -->
  <rect x="30" y="182" width="80" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="197" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">j = 2</text>
  <rect x="110" y="182" width="100" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="197" text-anchor="middle" font-size="10" fill="#555">[1, 3]</text>
  <rect x="210" y="182" width="200" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="197" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">diff[1]+=1, diff[4]−=1</text>

  <!-- row 2: j=5 -->
  <rect x="30" y="204" width="80" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="219" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">j = 5</text>
  <rect x="110" y="204" width="100" height="22" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="219" text-anchor="middle" font-size="10" fill="#555">[4, 6]</text>
  <rect x="210" y="204" width="200" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="219" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">diff[4]+=1, diff[7]−=1</text>

  <!-- diff array after marking -->
  <text x="30" y="248" font-size="10" fill="#888">diff:</text>
  <rect x="70" y="234" width="44" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="92" y="250" text-anchor="middle" font-size="10" fill="#888">0</text>
  <rect x="114" y="234" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="136" y="250" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">+1</text>
  <rect x="158" y="234" width="44" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="250" text-anchor="middle" font-size="10" fill="#888">0</text>
  <rect x="202" y="234" width="44" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="224" y="250" text-anchor="middle" font-size="10" fill="#888">0</text>
  <rect x="246" y="234" width="44" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="268" y="250" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">0</text>
  <rect x="290" y="234" width="44" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="312" y="250" text-anchor="middle" font-size="10" fill="#888">0</text>
  <rect x="334" y="234" width="44" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="356" y="250" text-anchor="middle" font-size="10" fill="#888">0</text>
  <rect x="378" y="234" width="44" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="400" y="250" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">−1</text>

  <text x="92" y="272" text-anchor="middle" font-size="8.5" fill="#aaa">0</text>
  <text x="136" y="272" text-anchor="middle" font-size="8.5" fill="#aaa">1</text>
  <text x="180" y="272" text-anchor="middle" font-size="8.5" fill="#aaa">2</text>
  <text x="224" y="272" text-anchor="middle" font-size="8.5" fill="#aaa">3</text>
  <text x="268" y="272" text-anchor="middle" font-size="8.5" fill="#aaa">4</text>
  <text x="312" y="272" text-anchor="middle" font-size="8.5" fill="#aaa">5</text>
  <text x="356" y="272" text-anchor="middle" font-size="8.5" fill="#aaa">6</text>
  <text x="400" y="272" text-anchor="middle" font-size="8.5" fill="#aaa">7</text>

  <text x="440" y="250" font-size="9.5" fill="#888">diff[4]: −1+1=0</text>
  <text x="440" y="264" font-size="9" fill="#aaa">两区间在 4 处衔接</text>

  <!-- ===== Step 3: prefix sum ===== -->
  <text x="30" y="296" font-size="11" fill="#d6a040" font-weight="bold">③ 前缀求并集 (running &gt; 0 → 计入)</text>

  <!-- running row -->
  <text x="30" y="322" font-size="10" fill="#888">running:</text>
  <rect x="70" y="308" width="44" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="92" y="324" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">0</text>
  <rect x="114" y="308" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="136" y="324" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="158" y="308" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="324" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="202" y="308" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="224" y="324" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="246" y="308" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="268" y="324" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="290" y="308" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="312" y="324" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="334" y="308" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="356" y="324" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- answer markers -->
  <text x="92" y="350" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <text x="136" y="350" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="180" y="350" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="224" y="350" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="268" y="350" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="312" y="350" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="356" y="350" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- answer annotation -->
  <rect x="400" y="308" width="130" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="465" y="327" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">ans = [1,2,3,4,5,6]</text>

  <!-- Footer -->
  <text x="270" y="372" text-anchor="middle" font-size="10" fill="#888">下标 4 处 diff=0（−1+1 抵消），running 维持 1 → 两区间无缝衔接</text>
</svg>
