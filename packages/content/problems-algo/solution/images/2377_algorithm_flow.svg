<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="820" height="360" fill="#fafafa"/>

  <text x="410" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：FROM → ORDER BY（多键比较器）→ SELECT 输出</text>

  <!-- ===== Step 1: FROM Olympic ===== -->
  <text x="90" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① FROM Olympic</text>
  <rect x="20" y="62" width="150" height="200" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <rect x="20" y="62" width="150" height="20" fill="#446688" rx="6" filter="url(#rough2)"/>
  <text x="36" y="76" font-size="9" fill="#fff">country</text>
  <text x="86" y="76" font-size="9" fill="#fff">gold</text>
  <text x="126" y="76" font-size="9" fill="#fff">sil/brz</text>
  <text x="40" y="92" font-size="9" fill="#333">China</text>
  <text x="40" y="108" font-size="9" fill="#333">South Sudan</text>
  <text x="40" y="124" font-size="9" fill="#333">USA</text>
  <text x="40" y="140" font-size="9" fill="#333">Israel</text>
  <text x="40" y="156" font-size="9" fill="#333">Egypt</text>
  <text x="86" y="92" font-size="9" fill="#b85450" font-weight="bold">10</text>
  <text x="86" y="108" font-size="9" fill="#333">0</text>
  <text x="86" y="124" font-size="9" fill="#b85450" font-weight="bold">10</text>
  <text x="86" y="140" font-size="9" fill="#333">2</text>
  <text x="86" y="156" font-size="9" fill="#333">2</text>
  <text x="126" y="92" font-size="9" fill="#333">10/20</text>
  <text x="126" y="108" font-size="9" fill="#333">0/1</text>
  <text x="126" y="124" font-size="9" fill="#333">10/20</text>
  <text x="126" y="140" font-size="9" fill="#333">2/3</text>
  <text x="126" y="156" font-size="9" fill="#333">2/2</text>

  <!-- arrow 1 -> 2 -->
  <path d="M180 160 L222 160" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ===== Step 2: ORDER BY comparator ===== -->
  <text x="400" y="56" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">② ORDER BY（多键比较器）</text>
  <rect x="232" y="62" width="336" height="200" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>

  <rect x="248" y="74" width="304" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="89" font-size="10" fill="#d6a040" font-weight="bold">gold_medals DESC</text>
  <text x="540" y="89" text-anchor="end" font-size="9" fill="#888">主键</text>

  <rect x="248" y="100" width="304" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="115" font-size="10" fill="#d6a040" font-weight="bold">silver_medals DESC</text>
  <text x="540" y="115" text-anchor="end" font-size="9" fill="#888">并列时</text>

  <rect x="248" y="126" width="304" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="141" font-size="10" fill="#d6a040" font-weight="bold">bronze_medals DESC</text>
  <text x="540" y="141" text-anchor="end" font-size="9" fill="#888">再并列时</text>

  <rect x="248" y="152" width="304" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="167" font-size="10" fill="#4a7a3a" font-weight="bold">country ASC</text>
  <text x="540" y="167" text-anchor="end" font-size="9" fill="#888">终局兜底</text>

  <text x="400" y="200" text-anchor="middle" font-size="10" fill="#666">比较器逐对元素判定次序：</text>
  <text x="400" y="218" text-anchor="middle" font-size="10" fill="#666">先比金，金同比银，银同比铜，</text>
  <text x="400" y="236" text-anchor="middle" font-size="10" fill="#666">全同则按 country 字母升序</text>
  <text x="400" y="254" text-anchor="middle" font-size="9" fill="#888">（稳定排序：三键全并列时 ASC 决定先后）</text>

  <!-- arrow 2 -> 3 -->
  <path d="M580 160 L622 160" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== Step 3: SELECT output ===== -->
  <text x="720" y="56" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">③ SELECT 输出</text>
  <rect x="632" y="62" width="170" height="200" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <rect x="632" y="62" width="170" height="20" fill="#4a7a3a" rx="6" filter="url(#rough2)"/>
  <text x="648" y="76" font-size="9" fill="#fff">country</text>
  <text x="700" y="76" font-size="9" fill="#fff">gold</text>
  <text x="740" y="76" font-size="9" fill="#fff">sil/brz</text>

  <text x="648" y="92" font-size="9" fill="#4a7a3a" font-weight="bold">China</text>
  <text x="648" y="108" font-size="9" fill="#4a7a3a" font-weight="bold">USA</text>
  <text x="648" y="124" font-size="9" fill="#4a7a3a" font-weight="bold">Israel</text>
  <text x="648" y="140" font-size="9" fill="#4a7a3a" font-weight="bold">Egypt</text>
  <text x="648" y="156" font-size="9" fill="#4a7a3a" font-weight="bold">South Sudan</text>
  <text x="700" y="92" font-size="9" fill="#333">10</text>
  <text x="700" y="108" font-size="9" fill="#333">10</text>
  <text x="700" y="124" font-size="9" fill="#333">2</text>
  <text x="700" y="140" font-size="9" fill="#333">2</text>
  <text x="700" y="156" font-size="9" fill="#333">0</text>
  <text x="740" y="92" font-size="9" fill="#333">10/20</text>
  <text x="740" y="108" font-size="9" fill="#333">10/20</text>
  <text x="740" y="124" font-size="9" fill="#333">2/3</text>
  <text x="740" y="140" font-size="9" fill="#333">2/2</text>
  <text x="740" y="156" font-size="9" fill="#333">0/1</text>

  <text x="717" y="180" font-size="8" fill="#888">China&lt;USA: C</text>
  <text x="717" y="192" font-size="8" fill="#888">Isr&gt;Egy: 铜多</text>

  <!-- ===== Bottom note ===== -->
  <rect x="20" y="282" width="782" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="410" y="304" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">ORDER BY 子句把多个键组成「字典序比较器」：前键判不出胜负才问下一键</text>
  <text x="410" y="324" text-anchor="middle" font-size="10" fill="#666">列方向独立：DESC 与 ASC 可在同一句中混用，互不影响（前三键降序，末键升序）</text>
  <text x="410" y="340" text-anchor="middle" font-size="10" fill="#666">SELECT 只决定「输出哪些列」，排序逻辑完全由 ORDER BY 承担</text>
</svg>
