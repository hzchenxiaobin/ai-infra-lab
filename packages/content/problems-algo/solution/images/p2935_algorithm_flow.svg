<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 590" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="590" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：排序 → 双指针滑窗 → Trie 增删与查询</text>

  <!-- 开始 -->
  <rect x="165" y="44" width="270" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="300" y="62" text-anchor="middle" font-size="11.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">排序 nums（升序）</text>
  <text x="300" y="80" text-anchor="middle" font-size="11" fill="#33507a" filter="url(#rough2)">ans = 0，left = 0，Trie 为空</text>
  <path d="M 300 88 L 300 112" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- y = nums[right] -->
  <rect x="195" y="114" width="210" height="40" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="300" y="139" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">y = nums[right]（right 右移）</text>
  <path d="M 300 154 L 300 178" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形：收缩判断 -->
  <polygon points="300,182 392,224 300,266 208,224" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="228" text-anchor="middle" font-size="11.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">y &gt; 2·nums[left] ?</text>

  <!-- 是：删除分支 -->
  <path d="M 208 224 L 164 224" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="186" y="215" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="32" y="200" width="130" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="97" y="220" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">Trie 删除 nums[left]</text>
  <text x="97" y="238" text-anchor="middle" font-size="11" fill="#8a3a36" filter="url(#rough2)">（cnt−−），left++</text>
  <!-- 回到菱形 -->
  <path d="M 97 200 V 170 H 262 V 190" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <!-- 否：查询 -->
  <path d="M 300 266 L 300 294" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="285" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="195" y="296" width="210" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="300" y="317" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ans = max(ans, query(y))</text>
  <text x="300" y="337" text-anchor="middle" font-size="10.5" fill="#669a5a" filter="url(#rough2)">Trie 内现存 [left, right−1]</text>
  <path d="M 300 348 L 300 372" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 插入 -->
  <rect x="205" y="374" width="190" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="300" y="399" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">Trie 插入 y（cnt++）</text>
  <path d="M 300 414 L 300 438" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形：循环判断 -->
  <polygon points="300,442 382,478 300,514 218,478" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="482" text-anchor="middle" font-size="11.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">right 遍历完 ?</text>

  <!-- 否：下一轮 -->
  <path d="M 382 478 H 468 V 134 H 409" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="394" y="469" font-size="11" fill="#a8842e" font-weight="bold" filter="url(#rough2)">否</text>
  <text x="470" y="300" font-size="10" fill="#a8842e" filter="url(#rough2)">下一轮</text>

  <!-- 是：返回 -->
  <path d="M 300 514 L 300 536" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="528" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="215" y="538" width="170" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="300" y="562" text-anchor="middle" font-size="12" fill="#33507a" font-weight="bold" filter="url(#rough2)">返回 ans</text>
</svg>
