<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心概念：网络秩 = deg(u) + deg(v) − [u↔v 直接相连?]</text>

  <!-- Pair annotation (above the highlighted edge) -->
  <text x="260" y="74" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">城市对 (0, 1)</text>

  <!-- Edges (draw first so nodes overlay) -->
  <!-- 0-1 highlighted (the pair being evaluated) -->
  <line x1="140" y1="130" x2="380" y2="130" stroke="#b85450" stroke-width="3" filter="url(#rough2)"/>
  <!-- 0-3 -->
  <line x1="140" y1="130" x2="140" y2="250" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <!-- 1-2 -->
  <line x1="380" y1="130" x2="380" y2="250" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <!-- 1-3 diagonal -->
  <line x1="380" y1="130" x2="140" y2="250" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>

  <!-- Nodes -->
  <!-- City 0 -->
  <circle cx="140" cy="130" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="135" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <text x="140" y="170" text-anchor="middle" font-size="10" fill="#888">deg = 2</text>

  <!-- City 1 (max degree, highlighted) -->
  <circle cx="380" cy="130" r="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="380" y="135" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <text x="380" y="170" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">deg = 3 (max)</text>

  <!-- City 2 -->
  <circle cx="380" cy="250" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="380" y="255" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <text x="380" y="290" text-anchor="middle" font-size="10" fill="#888">deg = 1</text>

  <!-- City 3 -->
  <circle cx="140" cy="250" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="255" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <text x="140" y="290" text-anchor="middle" font-size="10" fill="#888">deg = 2</text>

  <!-- "直连，减 1" annotation on the highlighted edge -->
  <text x="260" y="122" text-anchor="middle" font-size="9" fill="#b85450">0↔1 直连 → 这条边只算一次</text>

  <!-- Formula box -->
  <rect x="40" y="312" width="440" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="336" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">rank(0,1) = deg(0) + deg(1) − 1 = 2 + 3 − 1 = 4</text>
</svg>
