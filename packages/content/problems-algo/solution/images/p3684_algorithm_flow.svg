<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：去重 → 降序 → 截取 min(k, m)</text>

  <!-- 开始 -->
  <rect x="190" y="42" width="140" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="63" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">输入 nums, k</text>

  <path d="M 260 74 L 260 86" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤1 -->
  <rect x="145" y="90" width="230" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="111" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">① 哈希集合去重 → m 个不同值</text>

  <path d="M 260 122 L 260 134" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤2 -->
  <rect x="145" y="138" width="230" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="159" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">② 降序排序</text>

  <path d="M 260 170 L 260 182" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="260,184 335,216 260,248 185,216" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="221" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">m &gt; k ?</text>

  <!-- 是：右分支 -->
  <path d="M 335 216 L 365 216" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="348" y="206" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="369" y="200" width="118" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="428" y="221" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">截取前 k 个</text>

  <!-- 否：下分支 -->
  <path d="M 260 248 L 260 258" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="256" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="205" y="262" width="110" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="283" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">保留全部 m 个</text>

  <!-- 汇合 -->
  <path d="M 428 232 L 428 327 L 368 327" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 260 294 L 260 306" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结束 -->
  <rect x="160" y="310" width="204" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="262" y="332" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">返回数组（天然严格递减）</text>

  <text x="260" y="358" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">💡 两条分支合起来就是「取前 min(k, m) 个」；正数保证选满不吃亏</text>
</svg>
