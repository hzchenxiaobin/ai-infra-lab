<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：nums=[4,2,1,4,3,4,5,8,15], k=3</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">dp[v] = 以值 v 结尾的最长 LIS；查询区间 [x−k, x−1]</text>

  <!-- ===== table header ===== -->
  <g filter="url(#rough2)">
    <rect x="30" y="56" width="500" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g font-size="10.5" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="55" y="73">步</text>
    <text x="95" y="73">x</text>
    <text x="165" y="73">查询 [x−3, x−1]</text>
    <text x="265" y="73">best</text>
    <text x="310" y="73">cur=best+1</text>
    <text x="390" y="73">dp 变化</text>
    <text x="485" y="73">ans</text>
  </g>

  <!-- vertical separators for header -->
  <g stroke="#446688" stroke-width="1" filter="url(#rough2)">
    <line x1="75" y1="56" x2="75" y2="82"/>
    <line x1="115" y1="56" x2="115" y2="82"/>
    <line x1="215" y1="56" x2="215" y2="82"/>
    <line x1="290" y1="56" x2="290" y2="82"/>
    <line x1="345" y1="56" x2="345" y2="82"/>
    <line x1="455" y1="56" x2="455" y2="82"/>
  </g>

  <!-- ===== rows ===== -->
  <g font-size="10" fill="#444" text-anchor="middle">
    <!-- row 1: x=4 -->
    <rect x="30" y="82" width="500" height="24" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="55" y="98">1</text><text x="95" y="98">4</text>
    <text x="165" y="98">[1, 3]</text><text x="265" y="98">0</text><text x="310" y="98">1</text>
    <text x="390" y="98">dp[4]=1</text><text x="485" y="98">1</text>

    <!-- row 2: x=2 -->
    <rect x="30" y="106" width="500" height="24" fill="#f7f9fc" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="55" y="122">2</text><text x="95" y="122">2</text>
    <text x="165" y="122">[1, 1]</text><text x="265" y="122">0</text><text x="310" y="122">1</text>
    <text x="390" y="122">dp[2]=1</text><text x="485" y="122">1</text>

    <!-- row 3: x=1 -->
    <rect x="30" y="130" width="500" height="24" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="55" y="146">3</text><text x="95" y="146">1</text>
    <text x="165" y="146">[1, 0] 空</text><text x="265" y="146">0</text><text x="310" y="146">1</text>
    <text x="390" y="146">dp[1]=1</text><text x="485" y="146">1</text>

    <!-- row 4: x=4 -->
    <rect x="30" y="154" width="500" height="24" fill="#f7f9fc" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="55" y="170">4</text><text x="95" y="170">4</text>
    <text x="165" y="170">[1, 3]</text><text x="265" y="170" fill="#4a7a3a" font-weight="bold">1</text><text x="310" y="170">2</text>
    <text x="390" y="170">dp[4]: 1→2</text><text x="485" y="170" font-weight="bold">2</text>

    <!-- row 5: x=3 -->
    <rect x="30" y="178" width="500" height="24" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="55" y="194">5</text><text x="95" y="194">3</text>
    <text x="165" y="194">[1, 2]</text><text x="265" y="194" fill="#4a7a3a" font-weight="bold">1</text><text x="310" y="194">2</text>
    <text x="390" y="194">dp[3]=2</text><text x="485" y="194">2</text>

    <!-- row 6: x=4 -->
    <rect x="30" y="202" width="500" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="55" y="218">6</text><text x="95" y="218">4</text>
    <text x="165" y="218">[1, 3]</text><text x="265" y="218" fill="#4a7a3a" font-weight="bold">2</text><text x="310" y="218" fill="#d6a040" font-weight="bold">3</text>
    <text x="390" y="218" fill="#d6a040" font-weight="bold">dp[4]: 2→3</text><text x="485" y="218" font-weight="bold">3</text>

    <!-- row 7: x=5 -->
    <rect x="30" y="226" width="500" height="24" fill="#f7f9fc" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="55" y="242">7</text><text x="95" y="242">5</text>
    <text x="165" y="242">[2, 4]</text><text x="265" y="242" fill="#4a7a3a" font-weight="bold">3</text><text x="310" y="242" fill="#d6a040" font-weight="bold">4</text>
    <text x="390" y="242">dp[5]=4</text><text x="485" y="242" font-weight="bold">4</text>

    <!-- row 8: x=8 -->
    <rect x="30" y="250" width="500" height="24" fill="#ffffff" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
    <text x="55" y="266">8</text><text x="95" y="266">8</text>
    <text x="165" y="266">[5, 7]</text><text x="265" y="266" fill="#4a7a3a" font-weight="bold">4</text><text x="310" y="266" fill="#d6a040" font-weight="bold">5</text>
    <text x="390" y="266" fill="#d6a040" font-weight="bold">dp[8]=5</text><text x="485" y="266" font-weight="bold" fill="#b85450">5</text>

    <!-- row 9: x=15 -->
    <rect x="30" y="274" width="500" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="55" y="290">9</text><text x="95" y="290">15</text>
    <text x="165" y="290">[12, 14]</text><text x="265" y="290">0</text><text x="310" y="290">1</text>
    <text x="390" y="290">dp[15]=1</text><text x="485" y="290" fill="#b85450" font-weight="bold">5</text>
  </g>

  <!-- vertical separators across rows -->
  <g stroke="#ddd" stroke-width="1" filter="url(#rough2)">
    <line x1="75" y1="82" x2="75" y2="298"/>
    <line x1="115" y1="82" x2="115" y2="298"/>
    <line x1="215" y1="82" x2="215" y2="298"/>
    <line x1="290" y1="82" x2="290" y2="298"/>
    <line x1="345" y1="82" x2="345" y2="298"/>
    <line x1="455" y1="82" x2="455" y2="298"/>
  </g>

  <!-- ===== bottom note ===== -->
  <rect x="30" y="312" width="500" height="140" fill="#f4f4f4" stroke="#bbb" stroke-width="1.3" rx="8" filter="url(#rough2)"/>

  <text x="46" y="334" font-size="11" fill="#4a7a3a" font-weight="bold">最优子序列 [1, 3, 4, 5, 8]，长度 5</text>

  <!-- dp value bar visualization -->
  <text x="46" y="356" font-size="10" fill="#555">最终 dp 表（值 → LIS 长度）：</text>
  <g font-size="9.5" text-anchor="middle">
    <rect x="46" y="364" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="66" y="379" fill="#446688" font-weight="bold">dp[1]=1</text>
    <rect x="90" y="364" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="110" y="379" fill="#446688" font-weight="bold">dp[2]=1</text>
    <rect x="134" y="364" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="154" y="379" fill="#4a7a3a" font-weight="bold">dp[3]=2</text>
    <rect x="178" y="364" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="198" y="379" fill="#d6a040" font-weight="bold">dp[4]=3</text>
    <rect x="222" y="364" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="242" y="379" fill="#4a7a3a" font-weight="bold">dp[5]=4</text>
    <rect x="266" y="364" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
    <text x="286" y="379" fill="#b85450" font-weight="bold">dp[8]=5</text>
    <rect x="310" y="364" width="48" height="22" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="334" y="379" fill="#888">dp[15]=1</text>
  </g>

  <text x="46" y="406" font-size="10" fill="#b85450" font-weight="bold">为何 15 接不上？</text>
  <text x="46" y="422" font-size="9.5" fill="#555">查询 [12,14]，但 dp[12..14] 全为 0（无值落入），best=0 → cur=1。</text>
  <text x="46" y="436" font-size="9.5" fill="#555">15−8=7 &gt; k=3，故 [1,3,4,5,8,15] 不合法——区间 [x−k,x−1] 精确过滤了差值约束。</text>
</svg>
