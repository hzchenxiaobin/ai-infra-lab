<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="880" height="560" fill="#fdfcf7"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">把「覆盖所有密码」建模成「de Bruijn 图上的欧拉回路」</text>
  <path d="M 300 42 Q 440 50 580 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== LEFT: 问题本质 + 长度下界 ===== -->
  <g filter="url(#sk)">
    <rect x="24" y="74" width="404" height="466" rx="10" fill="#eef3fb" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="226" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#34506e">① 串要包含全部 k^n 个 n 位密码</text>

  <!-- sliding window illustration: string 0 0 1 1 0, window size n=2 -->
  <text x="226" y="132" text-anchor="middle" font-size="11.5" fill="#5a5a5a">滑动窗口：每输入 1 位最多新增 1 个 n 位子串</text>
  <g font-size="16" font-weight="bold" text-anchor="middle" fill="#34506e">
    <g filter="url(#sk)"><rect x="86" y="148" width="34" height="34" rx="5" fill="#fff" stroke="#446688" stroke-width="1.4"/></g>
    <text x="103" y="171">0</text>
    <g filter="url(#sk)"><rect x="124" y="148" width="34" height="34" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
    <text x="141" y="171">0</text>
    <g filter="url(#sk)"><rect x="162" y="148" width="34" height="34" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/></g>
    <text x="179" y="171">1</text>
    <g filter="url(#sk)"><rect x="200" y="148" width="34" height="34" rx="5" fill="#fff" stroke="#446688" stroke-width="1.4"/></g>
    <text x="217" y="171">1</text>
    <g filter="url(#sk)"><rect x="238" y="148" width="34" height="34" rx="5" fill="#fff" stroke="#446688" stroke-width="1.4"/></g>
    <text x="255" y="171">0</text>
  </g>
  <!-- window bracket -->
  <path d="M 124 192 L 124 200 L 196 200 L 196 192" stroke="#4a8e4a" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="160" y="216" text-anchor="middle" font-size="10.5" fill="#2e6e2e">窗口 = "01"（新密码）</text>

  <!-- 4 passwords as chips -->
  <text x="226" y="248" text-anchor="middle" font-size="11.5" fill="#5a5a5a">n=2, k=2 → 4 个密码需覆盖：</text>
  <g font-size="12" font-weight="bold" fill="#34506e" text-anchor="middle">
    <g filter="url(#sk)"><rect x="60" y="262" width="56" height="24" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
    <text x="88" y="279">00</text>
    <g filter="url(#sk)"><rect x="124" y="262" width="56" height="24" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
    <text x="152" y="279">01</text>
    <g filter="url(#sk)"><rect x="188" y="262" width="56" height="24" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
    <text x="216" y="279">11</text>
    <g filter="url(#sk)"><rect x="252" y="262" width="56" height="24" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
    <text x="280" y="279">10</text>
  </g>

  <!-- length lower bound derivation -->
  <g filter="url(#sk)">
    <rect x="44" y="308" width="364" height="98" rx="8" fill="#fffdf3" stroke="#c9a93a" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="226" y="330" text-anchor="middle" font-size="12" fill="#7a5415">头 n−1 位「暖机」不构成完整密码</text>
  <text x="226" y="350" text-anchor="middle" font-size="12" fill="#7a5415">之后每 1 位恰好新增 1 个 n 位窗口</text>
  <text x="226" y="372" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">最短长度 ≥ k^n + (n−1)</text>
  <text x="226" y="394" text-anchor="middle" font-size="11" fill="#7a5415">本题 2²+1 = 5，若能取到即最优</text>

  <!-- key insight box -->
  <g filter="url(#sk)">
    <rect x="44" y="420" width="364" height="100" rx="8" fill="#fdecee" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="226" y="444" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">关键：让每个密码只出现一次</text>
  <text x="226" y="466" text-anchor="middle" font-size="11.5" fill="#7a5a5a">若 k^n 个密码各出现 1 次、首尾相接</text>
  <text x="226" y="484" text-anchor="middle" font-size="11.5" fill="#7a5a5a">→ 恰好用 k^n 个窗口 + n−1 暖机位</text>
  <text x="226" y="506" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">= 「每条边走一次」的欧拉回路</text>

  <!-- ===== RIGHT: de Bruijn 图 B(2,2) ===== -->
  <g filter="url(#sk)">
    <rect x="448" y="74" width="408" height="466" rx="10" fill="#eef6ef" stroke="#4a7e4a" stroke-width="1.6"/>
  </g>
  <text x="652" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e6e2e">② de Bruijn 图：节点= (n−1) 位串，边= n 位密码</text>

  <text x="652" y="124" text-anchor="middle" font-size="11" fill="#5a5a5a">B(k,n)：k^(n−1) 个节点，每个节点 k 条出边</text>

  <!-- node 0 (left) -->
  <g filter="url(#sk)">
    <ellipse cx="540" cy="300" rx="40" ry="26" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="540" y="306" text-anchor="middle" font-size="17" font-weight="bold" fill="#34506e">"0"</text>
  <text x="540" y="344" text-anchor="middle" font-size="10" fill="#7a7a7a">节点</text>

  <!-- node 1 (right) -->
  <g filter="url(#sk)">
    <ellipse cx="764" cy="300" rx="40" ry="26" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="764" y="306" text-anchor="middle" font-size="17" font-weight="bold" fill="#34506e">"1"</text>
  <text x="764" y="344" text-anchor="middle" font-size="10" fill="#7a7a7a">节点</text>

  <!-- self-loop on "0" labeled 00 (top-left loop) -->
  <path d="M 524 276 C 480 226, 470 226, 516 270" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arb)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="438" y="226" width="40" height="20" rx="5" fill="#fff" stroke="#446688" stroke-width="1.2"/></g>
  <text x="458" y="240" text-anchor="middle" font-size="11" font-weight="bold" fill="#34506e">00</text>

  <!-- self-loop on "1" labeled 11 (top-right loop) -->
  <path d="M 780 276 C 824 226, 834 226, 788 270" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arb)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="826" y="226" width="40" height="20" rx="5" fill="#fff" stroke="#446688" stroke-width="1.2"/></g>
  <text x="846" y="240" text-anchor="middle" font-size="11" font-weight="bold" fill="#34506e">11</text>

  <!-- edge 0->1 labeled 01 (upper arc) -->
  <path d="M 578 290 Q 652 248 726 290" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="632" y="248" width="40" height="20" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="652" y="262" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">01</text>

  <!-- edge 1->0 labeled 10 (lower arc) -->
  <path d="M 726 312 Q 652 356 578 312" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="632" y="344" width="40" height="20" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="652" y="358" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">10</text>

  <!-- edge = password note -->
  <text x="652" y="384" text-anchor="middle" font-size="10.5" fill="#5a5a5a">边标签 = n 位密码；边 u --d→ u[1:]+d</text>

  <!-- Euler conditions -->
  <g filter="url(#sk)">
    <rect x="468" y="402" width="368" height="118" rx="8" fill="#fffdf3" stroke="#c9a93a" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="652" y="424" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">欧拉回路存在条件（均满足）</text>
  <text x="486" y="448" font-size="11" fill="#7a5415">✓ 入度 = 出度 = k（每节点 k 进 k 出）</text>
  <text x="486" y="468" font-size="11" fill="#7a5415">✓ 强连通（补位可互通任意串）</text>
  <text x="486" y="492" font-size="11.5" font-weight="bold" fill="#b85450">→ 必存在经过每条边恰一次的回路</text>
  <text x="486" y="510" font-size="11" fill="#7a5415">走遍 k^n 条边 → 拼出长度 k^n+n−1 的串</text>

  <!-- bottom legend -->
  <text x="440" y="548" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">每条边 = 一个密码，欧拉回路让密码各出现一次 → 长度恰好取到下界，即为最短</text>
</svg>
