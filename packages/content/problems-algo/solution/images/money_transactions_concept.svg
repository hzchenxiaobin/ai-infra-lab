<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：亏交易先做压低钱数，赚交易后做无济于事</text>

  <!-- 分类两框 -->
  <rect x="36" y="44" width="240" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="156" y="62" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">亏交易：cashback &lt; cost</text>
  <text x="156" y="78" text-anchor="middle" font-size="10.5" fill="#d6a040">净变化 Δ &lt; 0，钱变少</text>

  <rect x="288" y="44" width="236" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="406" y="62" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">赚交易：cashback ≥ cost</text>
  <text x="406" y="78" text-anchor="middle" font-size="10.5" fill="#4a7a3a">净变化 Δ ≥ 0，钱不变多</text>

  <!-- 交易块（最坏顺序：亏在前 cashback↑，赚在后 cost↓） -->
  <text x="120" y="110" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">亏阶段（cashback 升序）</text>
  <rect x="64" y="116" width="52" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="90" y="133" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">亏₁</text>
  <rect x="120" y="116" width="52" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="146" y="133" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">亏₂</text>
  <rect x="176" y="116" width="52" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="202" y="133" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">亏₃(cb大)</text>

  <text x="350" y="110" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">赚阶段（cost 降序）</text>
  <rect x="312" y="116" width="52" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="338" y="133" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">赚₁(cost大)</text>
  <rect x="368" y="116" width="52" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="394" y="133" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">赚₂</text>

  <line x1="240" y1="129" x2="300" y2="129" stroke="#888" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="123" text-anchor="middle" font-size="9.5" fill="#888">钱最少</text>

  <!-- 钱数阶梯曲线 -->
  <line x1="44" y1="170" x2="488" y2="170" stroke="#888" stroke-width="1" stroke-dasharray="4,4" filter="url(#rough2)"/>
  <text x="40" y="174" text-anchor="end" font-size="11" fill="#888" font-weight="bold">M</text>
  <line x1="44" y1="262" x2="488" y2="262" stroke="#b85450" stroke-width="1" stroke-dasharray="4,4" filter="url(#rough2)"/>
  <text x="40" y="266" text-anchor="end" font-size="11" fill="#b85450" font-weight="bold">M−T</text>

  <polyline points="52,170 116,170 116,196 180,196 180,222 244,222 244,262 338,262 338,240 402,240 402,214 470,214"
            fill="none" stroke="#446688" stroke-width="2.2" stroke-linejoin="round" filter="url(#rough2)"/>

  <text x="160" y="190" font-size="9.5" fill="#b85450">↓ 钱被亏交易不断压低</text>
  <text x="350" y="232" font-size="9.5" fill="#4a7a3a">↑ 赚交易让钱回升（太晚了）</text>

  <!-- 标注峰值需求点 -->
  <circle cx="244" cy="262" r="3.5" fill="#b85450" filter="url(#rough2)"/>
  <text x="252" y="278" font-size="10" fill="#b85450" font-weight="bold">亏₃需求 = cashback+T</text>
  <circle cx="338" cy="262" r="3.5" fill="#446688" filter="url(#rough2)"/>
  <text x="346" y="278" font-size="10" fill="#446688" font-weight="bold">赚₁需求 = cost+T</text>

  <!-- 公式框 -->
  <rect x="36" y="300" width="488" height="82" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">💡 ans = T + max( max(亏 cashback),  max(赚 cost) )</text>
  <text x="280" y="346" text-anchor="middle" font-size="11" fill="#b85450">T = 所有亏交易的总亏损 Σ(cost−cashback)</text>
  <text x="280" y="366" text-anchor="middle" font-size="11" fill="#b85450">亏取 cashback、赚取 cost 作代表值，一次遍历同时求 T 与 max(val)</text>
</svg>
