<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">贪心算法流程：逐段延伸，值超 k 即断开</text>

  <!-- Start: i=0, count=0 -->
  <rect x="190" y="40" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="61" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">初始化 i=0, count=0</text>

  <!-- Arrow down to decision -->
  <path d="M 260 76 L 260 92" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: i < n? -->
  <polygon points="260,94 360,132 260,170 160,132" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="128" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i &lt; n?</text>

  <!-- No → return count -->
  <path d="M 360 132 L 420 132" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="372" y="126" font-size="10.5" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="420" y="116" width="84" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="462" y="137" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">返回 count</text>

  <!-- Yes → down -->
  <path d="M 260 170 L 260 186" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="182" font-size="10.5" fill="#666" font-weight="bold">是</text>

  <!-- Init inner: value=0, j=i -->
  <rect x="170" y="188" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="209" text-anchor="middle" font-size="11.5" fill="#333">value = 0,  j = i</text>

  <!-- Arrow down to inner decision -->
  <path d="M 260 222 L 260 238" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Inner decision: j < n and value*10+digit <= k? -->
  <polygon points="260,240 400,278 260,316 120,278" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="274" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">j &lt; n 且</text>
  <text x="260" y="288" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">value×10+digit ≤ k?</text>

  <!-- Yes → extend -->
  <path d="M 120 278 L 60 278" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="90" y="272" font-size="10.5" fill="#666" font-weight="bold">是</text>
  <rect x="16" y="260" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="38" y="276" text-anchor="middle" font-size="9.5" fill="#333">value=</text>
  <text x="38" y="290" text-anchor="middle" font-size="9.5" fill="#333">value×10</text>
  <text x="38" y="300" text-anchor="middle" font-size="9" fill="#333">+digit,</text>
  <text x="38" y="310" text-anchor="middle" font-size="9" fill="#333">j++</text>

  <!-- Arrow back up to inner decision (loop) -->
  <path d="M 38 260 L 38 200 L 170 200" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- No → check j==i? -->
  <path d="M 400 278 L 440 278" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="272" font-size="10.5" fill="#666" font-weight="bold">否</text>

  <!-- Decision: j == i? (single char > k) -->
  <polygon points="470,246 500,278 470,310 440,278" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470" y="282" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">j==i?</text>

  <!-- Yes → return -1 -->
  <path d="M 470 246 L 470 226" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="478" y="240" font-size="10.5" fill="#b85450" font-weight="bold">是</text>
  <rect x="418" y="198" width="104" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="470" y="217" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">返回 -1</text>

  <!-- No → count++, i=j, loop back -->
  <path d="M 470 310 L 470 340 L 260 340 L 260 188" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="478" y="318" font-size="10.5" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="300" y="326" width="140" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="370" y="345" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">count++, i = j</text>

  <!-- Footer note -->
  <text x="260" y="368" text-anchor="middle" font-size="10" fill="#aaa">内层 while 至多循环 10 次（k ≤ 10⁹ 封顶子串长度），总 O(n)</text>
</svg>
