<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：binary = "1010"</text>

  <!-- String cells -->
  <text x="40" y="64" font-size="11" fill="#888">binary</text>
  <rect x="96" y="48" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="116" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="138" y="48" width="40" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="158" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="180" y="48" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="222" y="48" width="40" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="242" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <text x="282" y="64" font-size="11" fill="#888">手算好子序列 = 8 个</text>

  <line x1="280" y1="82" x2="280" y2="100" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Table header -->
  <rect x="24" y="104" width="512" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="60" y="122" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">步骤</text>
  <text x="116" y="122" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">字符</text>
  <text x="178" y="122" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">end0</text>
  <text x="238" y="122" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">end1</text>
  <text x="300" y="122" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">total</text>
  <text x="356" y="122" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">has0</text>
  <text x="448" y="122" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">说明</text>

  <!-- Row 0: init -->
  <rect x="24" y="136" width="512" height="30" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="156" text-anchor="middle" font-size="11" fill="#888">初</text>
  <text x="116" y="156" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="178" y="156" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="238" y="156" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="300" y="156" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="356" y="156" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="392" y="156" font-size="10" fill="#888">空串无好子序列</text>

  <!-- Row 1: '1' -->
  <rect x="24" y="168" width="512" height="30" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="188" text-anchor="middle" font-size="11" fill="#333">①</text>
  <rect x="104" y="174" width="24" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="116" y="188" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="178" y="188" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="238" y="188" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <text x="300" y="188" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="356" y="188" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="392" y="188" font-size="10" fill="#446688">end1←0+0+1，新增 "1"</text>

  <!-- Row 2: '0' -->
  <rect x="24" y="200" width="512" height="30" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="220" text-anchor="middle" font-size="11" fill="#333">②</text>
  <rect x="104" y="206" width="24" height="20" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="116" y="220" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="178" y="220" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <text x="238" y="220" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="300" y="220" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="356" y="220" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <text x="392" y="220" font-size="10" fill="#b85450">end0←0+1，新增 "10"；has0=1</text>

  <!-- Row 3: '1' -->
  <rect x="24" y="232" width="512" height="30" rx="4" fill="#fff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="60" y="252" text-anchor="middle" font-size="11" fill="#333">③</text>
  <rect x="104" y="238" width="24" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="116" y="252" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="178" y="252" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="238" y="252" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
  <text x="300" y="252" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="356" y="252" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="392" y="252" font-size="10" fill="#446688">end1←1+1+1，重生成 {"1","11","101"}</text>

  <!-- Row 4: '0' terminal -->
  <rect x="24" y="264" width="512" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="284" text-anchor="middle" font-size="11" fill="#333">④</text>
  <rect x="104" y="270" width="24" height="20" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="116" y="284" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="178" y="284" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="238" y="284" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="300" y="284" text-anchor="middle" font-size="12" fill="#333">7</text>
  <text x="356" y="284" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="392" y="284" font-size="10" fill="#4a7a3a">end0←1+3，重生成 4 个以 0 结尾</text>

  <!-- Result -->
  <rect x="24" y="308" width="512" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="40" y="328" font-size="12" fill="#555" font-weight="bold">结果：</text>
  <text x="92" y="328" font-size="13" fill="#4a7a3a" font-weight="bold">end0 + end1 + has0</text>
  <text x="270" y="328" font-size="13" fill="#555">=</text>
  <text x="290" y="328" font-size="13" fill="#333" font-weight="bold">4 + 3 + 1</text>
  <text x="380" y="328" font-size="13" fill="#555">=</text>
  <text x="400" y="328" font-size="14" fill="#b85450" font-weight="bold">8</text>
  <text x="40" y="344" font-size="10" fill="#888">手算验证：{"0","1","10","11","101","100","110","1010"} 共 8 个 ✓</text>

  <!-- insight -->
  <rect x="24" y="358" width="512" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="40" y="378" font-size="11" fill="#446688" font-weight="bold">观察：</text>
  <text x="88" y="378" font-size="11" fill="#555">③ end1 从 1→3（非 1+3=4），旧 "1" 被重生成覆盖；</text>
  <text x="88" y="394" font-size="11" fill="#555">④ end0 ← 旧 total=4，"用当前 '0' 重生成整桶" 的体现。</text>
</svg>
