<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>

  <g filter="url(#rough2)">
    <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：配对同余式 + 13 个二值特征 + 循环自卷积</text>
    <text x="310" y="42" text-anchor="middle" font-size="11" fill="#888">例：s = "abc"（n = 3）；Part I 的 O(n²) 逐旋转求和在 n = 10⁵ 下必须整体加速</text>

    <!-- ===== left column: pairing congruence ===== -->
    <text x="30" y="74" text-anchor="start" font-size="11.5" fill="#446688" font-weight="bold">① 镜像对 ⇔ p + q ≡ 2r − 1 (mod n)</text>

    <text x="72" y="108" text-anchor="middle" font-size="10" fill="#555">s =</text>
    <rect x="96" y="84" width="42" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="117" y="108" text-anchor="middle" font-size="14" fill="#33506b" font-weight="bold">a</text>
    <rect x="142" y="84" width="42" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="163" y="108" text-anchor="middle" font-size="14" fill="#33506b" font-weight="bold">b</text>
    <rect x="188" y="84" width="42" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="209" y="108" text-anchor="middle" font-size="14" fill="#33506b" font-weight="bold">c</text>

    <text x="117" y="136" text-anchor="middle" font-size="8.5" fill="#446688">p = 0</text>
    <text x="163" y="136" text-anchor="middle" font-size="8.5" fill="#446688">p = 1</text>
    <text x="209" y="136" text-anchor="middle" font-size="8.5" fill="#446688">p = 2</text>

    <!-- congruence table -->
    <rect x="30" y="150" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="48" y="166" text-anchor="middle" font-size="9" fill="#33506b" font-weight="bold">r</text>
    <rect x="66" y="150" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="116" y="166" text-anchor="middle" font-size="9" fill="#33506b" font-weight="bold">c=(2r−1)%3</text>
    <rect x="166" y="150" width="166" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="249" y="166" text-anchor="middle" font-size="9" fill="#33506b" font-weight="bold">镜像对 {p, q}（p≠q）</text>

    <rect x="30" y="174" width="36" height="26" fill="#fafafa" stroke="#9aa7b5" stroke-width="1.2" rx="4"/>
    <text x="48" y="191" text-anchor="middle" font-size="9" fill="#33506b">0</text>
    <rect x="66" y="174" width="100" height="26" fill="#fafafa" stroke="#9aa7b5" stroke-width="1.2" rx="4"/>
    <text x="116" y="191" text-anchor="middle" font-size="9" fill="#a87020" font-weight="bold">2</text>
    <rect x="166" y="174" width="166" height="26" fill="#fafafa" stroke="#9aa7b5" stroke-width="1.2" rx="4"/>
    <text x="249" y="191" text-anchor="middle" font-size="9" fill="#33506b">{0, 2}: a↔c（中位 1）</text>

    <rect x="30" y="200" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="48" y="217" text-anchor="middle" font-size="9" fill="#7a5c1a">1</text>
    <rect x="66" y="200" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="116" y="217" text-anchor="middle" font-size="9" fill="#a87020" font-weight="bold">1</text>
    <rect x="166" y="200" width="166" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="249" y="217" text-anchor="middle" font-size="9" fill="#7a5c1a">{0, 1}: a↔b（中位 2）</text>

    <rect x="30" y="226" width="36" height="26" fill="#fafafa" stroke="#9aa7b5" stroke-width="1.2" rx="4"/>
    <text x="48" y="243" text-anchor="middle" font-size="9" fill="#33506b">2</text>
    <rect x="66" y="226" width="100" height="26" fill="#fafafa" stroke="#9aa7b5" stroke-width="1.2" rx="4"/>
    <text x="116" y="243" text-anchor="middle" font-size="9" fill="#a87020" font-weight="bold">0</text>
    <rect x="166" y="226" width="166" height="26" fill="#fafafa" stroke="#9aa7b5" stroke-width="1.2" rx="4"/>
    <text x="249" y="243" text-anchor="middle" font-size="9" fill="#33506b">{1, 2}: b↔c（中位 0）</text>

    <text x="30" y="272" text-anchor="start" font-size="9.5" fill="#2f5d24" font-weight="bold">⇒ 旋转 r 的回文代价只由 c 决定，记作 P[c]</text>
    <text x="30" y="288" text-anchor="start" font-size="9" fill="#33506b">答案 = min ( r + P[(2r−1) mod n] )，0 ≤ r &lt; n</text>
    <text x="30" y="302" text-anchor="start" font-size="8" fill="#889">（n 偶数时 c 恒为奇数，r 与 r+n/2 同 c，min 自动选小的 r）</text>

    <!-- ===== right column: 13 binary features ===== -->
    <rect x="358" y="56" width="238" height="240" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
    <text x="477" y="76" text-anchor="middle" font-size="10.5" fill="#7a5c1a" font-weight="bold">② f_k(x) = 1 ⟺ x ∈ {k, …, k+12}</text>
    <text x="477" y="90" text-anchor="middle" font-size="8.5" fill="#a87020">（循环字母表上长 13 的「半圈」区间）</text>

    <circle cx="460" cy="160" r="46" fill="none" stroke="#b8c4d0" stroke-width="1.2" stroke-dasharray="4,4"/>

    <path d="M 460 107 A 53 53 0 0 1 472.6 211.5" stroke="#4a7a3a" stroke-width="3" fill="none"/>

    <circle cx="420.2" cy="137" r="1.5" fill="#b8c4d0"/>
    <circle cx="414" cy="160" r="1.5" fill="#b8c4d0"/>
    <circle cx="420.2" cy="183" r="1.5" fill="#b8c4d0"/>
    <circle cx="437" cy="199.8" r="1.5" fill="#b8c4d0"/>

    <text x="460" y="118" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold">a</text>
    <text x="472" y="119.5" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold">b</text>
    <text x="472" y="209" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold">m</text>
    <text x="460" y="211" text-anchor="middle" font-size="11" fill="#889">n</text>
    <text x="449" y="119.5" text-anchor="middle" font-size="11" fill="#889">z</text>
    <text x="438.5" y="123.5" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">y</text>
    <text x="460" y="164" text-anchor="middle" font-size="7" fill="#a8a8a8">· · ·</text>

    <text x="521" y="152" text-anchor="start" font-size="9" fill="#4a7a3a" font-weight="bold">特征 k = 0</text>
    <text x="521" y="165" text-anchor="start" font-size="8.5" fill="#4a7a3a">{a, …, m}</text>
    <text x="521" y="178" text-anchor="start" font-size="8" fill="#4a7a3a">13 个字母</text>

    <text x="477" y="234" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">pair(y, b) = 相异特征数：</text>
    <text x="477" y="249" text-anchor="middle" font-size="8.5" fill="#7a5c1a">k=0, 1: b 在、y 不在；k=12: y 在、b 不在</text>
    <text x="477" y="263" text-anchor="middle" font-size="8.5" fill="#7a5c1a">其余 10 个 k：两者同进同出 ⇒ 不计</text>
    <text x="477" y="282" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">共 3 个 = min(23, 3) ✓（绕圈更短）</text>

    <!-- ===== bottom: convolution formulas ===== -->
    <rect x="30" y="306" width="558" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
    <text x="309" y="326" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold">③ 循环自卷积：一次 FFT 批量算出全部 n 个 c 的代价</text>
    <text x="48" y="346" text-anchor="start" font-size="9.5" fill="#2f5d24">0/1 数组 a_k[i] = f_k(s[i])，cnt_k = Σ a_k；对每个 c：conv_k[c] = Σᵢ a_k[i] · a_k[(c − i) mod n]</text>
    <text x="48" y="364" text-anchor="start" font-size="9" fill="#2f5d24">「特征 k 一异一同」的镜像对数 = cnt_k − conv_k[c]（异值有序对恰 2·(cnt_k − conv_k[c]) 个，除 2 即无序对）</text>
    <text x="48" y="382" text-anchor="start" font-size="9.5" fill="#2f5d24" font-weight="bold">P[c] = Σ_k (cnt_k − conv_k[c]) = Σ_k cnt_k − Σ_k conv_k[c] —— 13 趟循环自卷积，每趟 O(n log n)</text>
    <text x="48" y="402" text-anchor="start" font-size="9.5" fill="#2f5d24">ans = min ( r + P[(2r − 1) mod n] )；零填充至 L ≥ 2n−1 做线性卷积后折叠：conv[c] = lin[c] + lin[c+n]</text>
    <text x="48" y="424" text-anchor="start" font-size="9" fill="#557">总复杂度 O(13·n log n)：n = 10⁵ 约 26 次 2¹⁸ 点变换，C++ 实测 &lt; 0.5s —— Part I 的 O(n²)（约 5×10⁹ 次）彻底退休</text>
  </g>
</svg>
