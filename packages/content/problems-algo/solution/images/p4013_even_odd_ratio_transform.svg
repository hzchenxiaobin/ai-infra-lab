<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：偶数记 +b、奇数记 −a ⇒ 合法 ⟺ 子数组变换和 ≤ 0</text>

  <!-- 左上：原数组与变换 -->
  <text x="24" y="42" font-size="10" fill="#555" filter="url(#rough2)">示例 nums = [1, 2, 1, 2]，a = 3，b = 2：</text>

  <rect x="40" y="50" width="32" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="74" y="50" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="108" y="50" width="32" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="142" y="50" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>

  <text x="56" y="71" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="90" y="71" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="124" y="71" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="158" y="71" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>

  <text x="56" y="96" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold" filter="url(#rough2)">奇</text>
  <text x="90" y="96" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">偶</text>
  <text x="124" y="96" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold" filter="url(#rough2)">奇</text>
  <text x="158" y="96" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">偶</text>

  <path d="M 56 104 L 56 126" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 90 104 L 90 126" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 124 104 L 124 126" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 158 104 L 158 126" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="192" y="118" font-size="9" fill="#999" filter="url(#rough2)">变换</text>

  <rect x="40" y="130" width="32" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="74" y="130" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="108" y="130" width="32" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="142" y="130" width="32" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>

  <text x="56" y="151" text-anchor="middle" font-size="13" fill="#7a5c1a" font-weight="bold" filter="url(#rough2)">−3</text>
  <text x="90" y="151" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">+2</text>
  <text x="124" y="151" text-anchor="middle" font-size="13" fill="#7a5c1a" font-weight="bold" filter="url(#rough2)">−3</text>
  <text x="158" y="151" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">+2</text>

  <text x="24" y="180" font-size="9.5" fill="#333" filter="url(#rough2)">子数组变换和 = x·b − y·a（x 个偶、y 个奇）</text>
  <text x="24" y="197" font-size="8.5" fill="#999" filter="url(#rough2)">只依赖计数不依赖顺序 ⇒ 前缀和可整体记账</text>
  <text x="24" y="214" font-size="8.5" fill="#999" filter="url(#rough2)">如 [1,2,1]：−3+2−3 = −4 ≤ 0 ⇒ 合法（比 1/2 ≤ 3/2）</text>

  <!-- 右侧：三个面板 -->
  <rect x="236" y="44" width="260" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="366" y="61" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">变换规则：偶数 → +b（示例 +2）</text>
  <text x="366" y="79" text-anchor="middle" font-size="10" fill="#7a5c1a" font-weight="bold" filter="url(#rough2)">奇数 → −a（示例 −3）</text>

  <rect x="236" y="98" width="260" height="66" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="366" y="116" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">引理：x/y ≤ a/b（y&gt;0）⟺ x·b − y·a ≤ 0</text>
  <text x="366" y="133" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">交叉相乘：y&gt;0、b&gt;0，不等号方向不变</text>
  <text x="366" y="148" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">分数比较坍缩成整数加权和的符号判定</text>

  <rect x="236" y="172" width="260" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="366" y="190" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">y &gt; 0 免检：全偶子数组变换和 = x·b ≥ b &gt; 0</text>
  <text x="366" y="207" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">永不可能 ≤ 0，自动出局</text>
  <text x="366" y="219" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">⇒「和 ≤ 0」已隐含排除了 y = 0，无需特判</text>

  <!-- 底部：前缀和条 -->
  <text x="24" y="248" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">前缀和 pref[0..n]：子数组 [l..r] 合法 ⟺ pref[r+1] ≤ pref[l]</text>

  <rect x="40" y="260" width="44" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="88" y="260" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="136" y="260" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="184" y="260" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="232" y="260" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>

  <text x="62" y="281" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="110" y="281" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">−3</text>
  <text x="158" y="281" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">−1</text>
  <text x="206" y="281" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">−4</text>
  <text x="254" y="281" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">−2</text>

  <text x="62" y="306" text-anchor="middle" font-size="7.5" fill="#999" filter="url(#rough2)">pref[0]</text>
  <text x="110" y="306" text-anchor="middle" font-size="7.5" fill="#999" filter="url(#rough2)">pref[1]</text>
  <text x="158" y="306" text-anchor="middle" font-size="7.5" fill="#999" filter="url(#rough2)">pref[2]</text>
  <text x="206" y="306" text-anchor="middle" font-size="7.5" fill="#999" filter="url(#rough2)">pref[3]</text>
  <text x="254" y="306" text-anchor="middle" font-size="7.5" fill="#999" filter="url(#rough2)">pref[4]</text>

  <rect x="300" y="260" width="196" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="398" y="278" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">答案 = #{ i&lt;j : pref[j] ≤ pref[i] }</text>
  <text x="398" y="296" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">「非严格逆序对」计数 = 7（示例 1）</text>

  <text x="24" y="328" font-size="9" fill="#333" filter="url(#rough2)">示例 1 的 7 对：(0,1) (0,2) (0,3) (0,4) (1,3) (2,3) (2,4)——每对 (i,j) 恰对应子数组 nums[i..j−1]</text>
  <text x="24" y="348" font-size="8.5" fill="#999" filter="url(#rough2)">⚠️ 是 ≤（含等号）：pref 相等的前缀对同样合法，计数时不能漏掉「等于」</text>
</svg>
