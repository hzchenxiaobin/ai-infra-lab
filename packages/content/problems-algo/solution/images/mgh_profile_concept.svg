<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">轮廓线 DP：逐格填充，只记 n 格状态</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">3×3 网格示意，当前填到 (1,1)，轮廓线 = 已填部分 + 上一行未覆盖</text>

  <!-- ===== 网格 ===== -->
  <!-- 行 0：已填 -->
  <g font-size="14" fill="#333">
    <!-- (0,0) 内向 -->
    <rect x="100" y="80" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="128" y="106" text-anchor="middle">■</text>
    <!-- (0,1) 空 -->
    <rect x="160" y="80" width="56" height="40" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="188" y="106" text-anchor="middle" fill="#aaa">·</text>
    <!-- (0,2) 外向 -->
    <rect x="220" y="80" width="56" height="40" fill="#f3e8f5" stroke="#884488" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="248" y="106" text-anchor="middle">◆</text>
  </g>

  <!-- 行 1：当前行 -->
  <g font-size="14" fill="#333">
    <!-- (1,0) 空 -->
    <rect x="100" y="124" width="56" height="40" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="128" y="150" text-anchor="middle" fill="#aaa">·</text>
    <!-- (1,1) 当前格 高亮 -->
    <rect x="160" y="124" width="56" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
    <text x="188" y="150" text-anchor="middle" fill="#d6a040" font-weight="bold">?</text>
    <!-- (1,2) 未填 -->
    <rect x="220" y="124" width="56" height="40" fill="#fafafa" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
    <text x="248" y="150" text-anchor="middle" fill="#ccc">—</text>
  </g>

  <!-- 行 2：未填 -->
  <g font-size="14" fill="#ccc">
    <rect x="100" y="168" width="56" height="40" fill="#fafafa" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
    <text x="128" y="194" text-anchor="middle">—</text>
    <rect x="160" y="168" width="56" height="40" fill="#fafafa" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
    <text x="188" y="194" text-anchor="middle">—</text>
    <rect x="220" y="168" width="56" height="40" fill="#fafafa" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
    <text x="248" y="194" text-anchor="middle">—</text>
  </g>

  <!-- 行列标签 -->
  <g font-size="10" fill="#888">
    <text x="92" y="104" text-anchor="end">r=0</text>
    <text x="92" y="148" text-anchor="end">r=1</text>
    <text x="92" y="192" text-anchor="end">r=2</text>
    <text x="128" y="74" text-anchor="middle">c=0</text>
    <text x="188" y="74" text-anchor="middle">c=1</text>
    <text x="248" y="74" text-anchor="middle">c=2</text>
  </g>

  <!-- ===== 轮廓线标注 ===== -->
  <!-- top 箭头：从 (0,1) 指向 (1,1) -->
  <path d="M 188 124 L 188 120" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="200" y="118" font-size="11" fill="#b85450" font-weight="bold">top</text>
  <text x="200" y="106" font-size="9" fill="#b85450">mask[c]=0</text>

  <!-- left 箭头：从 (1,0) 指向 (1,1) -->
  <path d="M 156 144 L 160 144" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="128" y="136" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">left</text>
  <text x="128" y="124" text-anchor="middle" font-size="9" fill="#4a7a3a">mask[c-1]</text>

  <!-- 轮廓线波浪线 -->
  <path d="M 100 80 Q 98 72 106 70 L 156 68 Q 164 66 172 70 L 220 76 Q 228 74 236 78 L 276 82 Q 284 84 282 92 L 282 124 Q 284 132 276 134 L 220 136 Q 212 138 204 134 L 160 130 Q 152 128 150 120 L 150 80" 
        stroke="#446688" stroke-width="1.8" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="310" y="100" font-size="11" fill="#446688" font-weight="bold">轮廓线</text>
  <text x="310" y="114" font-size="10" fill="#888">（n=3 格三进制）</text>

  <!-- ===== 3 进制 mask 编码 ===== -->
  <rect x="340" y="130" width="200" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="440" y="150" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">mask = 3 进制 n 位数</text>
  <g font-size="13" fill="#333">
    <rect x="360" y="162" width="40" height="28" fill="#f5f5f5" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="380" y="181" text-anchor="middle">0</text>
    <text x="380" y="202" text-anchor="middle" font-size="9" fill="#4a7a3a">c-1</text>

    <rect x="410" y="162" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
    <text x="430" y="181" text-anchor="middle" fill="#b85450" font-weight="bold">?</text>
    <text x="430" y="202" text-anchor="middle" font-size="9" fill="#b85450">c（当前）</text>

    <rect x="460" y="162" width="40" height="28" fill="#f3e8f5" stroke="#884488" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="480" y="181" text-anchor="middle">2</text>
    <text x="480" y="202" text-anchor="middle" font-size="9" fill="#884488">c+1</text>
  </g>
  <text x="440" y="218" text-anchor="middle" font-size="10" fill="#888">0=空, 1=内向, 2=外向</text>

  <!-- ===== 分解说明 ===== -->
  <rect x="40" y="240" width="480" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="54" y="262" font-size="12" fill="#4a7a3a" font-weight="bold">幸福感分解</text>
  <text x="54" y="280" font-size="11" fill="#333">总幸福感 = Σ(每人基础值) + Σ(每对相邻交互)</text>
  <text x="54" y="294" font-size="10" fill="#888">基础：内向 120 / 外向 40；交互：内-内 −60, 内-外 −10, 外-外 +40</text>

  <!-- ===== 图例 ===== -->
  <rect x="40" y="312" width="480" height="112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="54" y="334" font-size="12" fill="#d6a040" font-weight="bold">增量计算（填到当前格时）</text>
  <text x="54" y="352" font-size="11" fill="#333">· 当前格 = 空 → 增量 0</text>
  <text x="54" y="368" font-size="11" fill="#333">· 当前格 = 内向 → +120 + score[1][top] + score[1][left]</text>
  <text x="54" y="384" font-size="11" fill="#333">· 当前格 = 外向 → +40 + score[2][top] + score[2][left]</text>
  <text x="54" y="400" font-size="10" fill="#888">右方/下方邻居的交互在它们被填充时增量计入（交互对称）</text>
  <text x="54" y="414" font-size="10" fill="#888">→ 无需回溯修改已填格的累计值，DP 子结构干净闭合</text>
</svg>
