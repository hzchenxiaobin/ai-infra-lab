<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：分割点 i 合法 ⇔ inc[i] 且 dec[i+1]</text>

  <!-- split labels above lines -->
  <text x="220" y="50" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">i=0 ✗</text>
  <text x="280" y="50" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i=1 ✓</text>
  <text x="340" y="50" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i=2 ✓</text>

  <!-- nums row -->
  <text x="152" y="84" text-anchor="end" font-size="11.5" fill="#888" filter="url(#rough2)">nums[i]</text>
  <g font-size="13" fill="#333" text-anchor="middle">
    <rect x="160" y="60" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="190" y="82">1</text>
    <rect x="220" y="60" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="250" y="82">2</text>
    <rect x="280" y="60" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="310" y="82">4</text>
    <rect x="340" y="60" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="370" y="82">3</text>
  </g>
  <g font-size="10.5" fill="#888" text-anchor="middle">
    <text x="190" y="110">0</text>
    <text x="250" y="110">1</text>
    <text x="310" y="110">2</text>
    <text x="370" y="110">3</text>
  </g>

  <!-- inc row -->
  <text x="152" y="150" text-anchor="end" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">inc[i]</text>
  <g font-size="12.5" text-anchor="middle" font-weight="bold">
    <rect x="160" y="132" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="190" y="150" fill="#4a7a3a">✓</text>
    <rect x="220" y="132" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="250" y="150" fill="#4a7a3a">✓</text>
    <rect x="280" y="132" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="310" y="150" fill="#4a7a3a">✓</text>
    <rect x="340" y="132" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="370" y="150" fill="#b85450">✗</text>
  </g>
  <text x="418" y="150" font-size="10" fill="#4a7a3a" filter="url(#rough2)">← 前缀严格递增</text>

  <!-- dec row -->
  <text x="152" y="192" text-anchor="end" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">dec[i]</text>
  <g font-size="12.5" text-anchor="middle" font-weight="bold">
    <rect x="160" y="174" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="190" y="192" fill="#b85450">✗</text>
    <rect x="220" y="174" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="250" y="192" fill="#b85450">✗</text>
    <rect x="280" y="174" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="310" y="192" fill="#4a7a3a">✓</text>
    <rect x="340" y="174" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="370" y="192" fill="#4a7a3a">✓</text>
  </g>
  <text x="418" y="192" font-size="10" fill="#4a7a3a" filter="url(#rough2)">后缀严格递减 →</text>

  <!-- split dashed lines -->
  <path d="M 220 56 L 220 206" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5,4" fill="none" filter="url(#rough2)"/>
  <path d="M 280 56 L 280 206" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="5,4" fill="none" filter="url(#rough2)"/>
  <path d="M 340 56 L 340 206" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="5,4" fill="none" filter="url(#rough2)"/>

  <!-- example annotation -->
  <text x="60" y="228" font-size="11.5" fill="#555" filter="url(#rough2)">例：分割点 i=1 → 查 <tspan fill="#4a7a3a" font-weight="bold">inc[1]=✓</tspan> 与 <tspan fill="#4a7a3a" font-weight="bold">dec[2]=✓</tspan> → 合法，差 = |2×3 − 10| = 4</text>

  <!-- recurrences -->
  <text x="60" y="254" font-size="11.5" fill="#555" filter="url(#rough2)">• inc[i] = inc[i−1] 且 nums[i] &gt; nums[i−1]（正向递推）</text>
  <text x="60" y="274" font-size="11.5" fill="#555" filter="url(#rough2)">• dec[i] = dec[i+1] 且 nums[i] &gt; nums[i+1]（反向递推）</text>

  <!-- conclusion box -->
  <rect x="60" y="292" width="440" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="311" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">分割点合法性 O(1) 查表：inc[i] &amp;&amp; dec[i+1]</text>
  <text x="280" y="330" text-anchor="middle" font-size="11.5" fill="#a87020" font-weight="bold">和差 = |2·pref[i+1] − total|，全程 O(n)</text>
</svg>
