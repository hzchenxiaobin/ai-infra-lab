<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：哈希定位根 → DFS 合并 → 区间验证</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">O(n) 时间 | O(n) 空间 | 核心利用根值唯一 + 每树 ≤ 3 节点</text>

  <!-- Step 1: n==1? -->
  <g font-size="11" filter="url(#rough2)">
    <path d="M 280 60 L 340 82 L 280 104 L 220 82 z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="280" y="80" text-anchor="middle" fill="#d6a040" font-weight="bold">n == 1 ?</text>
    <text x="280" y="94" text-anchor="middle" font-size="9" fill="#888">特判</text>
    <!-- yes -->
    <path d="M 220 82 L 150 82" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>
    <text x="185" y="76" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">是</text>
    <rect x="60" y="70" width="90" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="105" y="86" text-anchor="middle" fill="#4a7a3a" font-weight="bold">return trees[0]</text>
    <!-- no -->
    <path d="M 280 104 L 280 122" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>
    <text x="295" y="116" font-size="9" fill="#b85450" font-weight="bold">否</text>
  </g>

  <!-- Step 2: build hash -->
  <g font-size="11" filter="url(#rough2)">
    <rect x="170" y="124" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="280" y="140" text-anchor="middle" fill="#446688" font-weight="bold">建哈希表 val_to_tree</text>
    <text x="280" y="153" text-anchor="middle" font-size="9" fill="#888">根值 → 树，O(n)</text>
    <path d="M 280 158 L 280 172" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- Step 3: collect leaf vals -->
  <g font-size="11" filter="url(#rough2)">
    <rect x="170" y="174" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="280" y="190" text-anchor="middle" fill="#446688" font-weight="bold">收集所有叶值 leaf_vals</text>
    <text x="280" y="203" text-anchor="middle" font-size="9" fill="#888">根/左子/右子的叶值汇总</text>
    <path d="M 280 208 L 280 222" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- Step 4: find root -->
  <g font-size="11" filter="url(#rough2)">
    <path d="M 280 224 L 370 250 L 280 276 L 190 250 z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="280" y="248" text-anchor="middle" fill="#d6a040" font-weight="bold">根值 ∉ leaf_vals ?</text>
    <text x="280" y="262" text-anchor="middle" font-size="9" fill="#888">找唯一最终根</text>
    <!-- no -->
    <path d="M 370 250 L 430 250" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arrR)"/>
    <text x="398" y="244" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">0或多个</text>
    <rect x="430" y="238" width="90" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <text x="475" y="254" text-anchor="middle" fill="#b85450" font-weight="bold">return null</text>
    <!-- yes -->
    <path d="M 280 276 L 280 292" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>
    <text x="295" y="286" font-size="9" fill="#4a7a3a" font-weight="bold">唯一</text>
  </g>

  <!-- Step 5: DFS merge -->
  <g font-size="11" filter="url(#rough2)">
    <rect x="130" y="294" width="300" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="280" y="312" text-anchor="middle" fill="#446688" font-weight="bold">DFS 合并：从根出发遍历</text>
    <text x="280" y="326" text-anchor="middle" font-size="9" fill="#555">叶子值 ∈ val_to_tree 且未 used → 替换 → 递归</text>
    <path d="M 280 338 L 280 352" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- Step 6: check used count -->
  <g font-size="11" filter="url(#rough2)">
    <path d="M 280 354 L 370 378 L 280 402 L 190 378 z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="280" y="376" text-anchor="middle" fill="#d6a040" font-weight="bold">used.size() == n ?</text>
    <text x="280" y="390" text-anchor="middle" font-size="9" fill="#888">所有树都用上了？</text>
    <!-- no -->
    <path d="M 370 378 L 430 378" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arrR)"/>
    <text x="398" y="372" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">否</text>
    <rect x="430" y="366" width="90" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <text x="475" y="382" text-anchor="middle" fill="#b85450" font-weight="bold">return null</text>
    <!-- yes -->
    <path d="M 280 402 L 280 416" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>
    <text x="295" y="410" font-size="9" fill="#4a7a3a" font-weight="bold">是</text>
  </g>

  <!-- Step 7: validate BST -->
  <g font-size="11" filter="url(#rough2)">
    <rect x="130" y="418" width="220" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="240" y="434" text-anchor="middle" fill="#4a7a3a" font-weight="bold">validate(root, -∞, +∞)</text>
    <text x="240" y="447" text-anchor="middle" font-size="9" fill="#555">上下界递归验证 BST</text>
    <!-- result -->
    <path d="M 350 435 L 400 435" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)"/>
    <rect x="400" y="423" width="110" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="455" y="439" text-anchor="middle" fill="#4a7a3a" font-weight="bold">return root ✓</text>
  </g>
</svg>
