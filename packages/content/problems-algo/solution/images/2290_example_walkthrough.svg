<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例 1 演算：grid=[[0,1,1],[1,1,0],[1,1,0]] → dist[2][2]=2</text>

  <!-- ===== LEFT: final dist grid ===== -->
  <text x="120" y="56" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">最终 dist 矩阵（最小障碍数）</text>

  <!-- 3x3 grid, cell=64px, origin (56, 70) -->
  <!-- Row 0: dist 0,1,2 -->
  <rect x="56" y="70" width="64" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="88" y="104" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="64" y="84" font-size="9" fill="#4a7a3a">S</text>
  <rect x="120" y="70" width="64" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="152" y="104" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold">1</text>
  <rect x="184" y="70" width="64" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="216" y="104" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold">2</text>

  <!-- Row 1: 1,2,2 -->
  <rect x="56" y="134" width="64" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="88" y="168" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold">1</text>
  <rect x="120" y="134" width="64" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="152" y="168" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold">2</text>
  <rect x="184" y="134" width="64" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="216" y="168" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold">2</text>

  <!-- Row 2: 2,3,2 -->
  <rect x="56" y="198" width="64" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="88" y="232" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold">2</text>
  <rect x="120" y="198" width="64" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="152" y="232" text-anchor="middle" font-size="18" fill="#b85450" font-weight="bold">3</text>
  <rect x="184" y="198" width="64" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="216" y="232" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="216" y="276" text-anchor="middle" font-size="9" fill="#4a7a3a">T</text>

  <!-- optimal path highlight arrows -->
  <path d="M 120 102 L 184 102" stroke="#b85450" stroke-width="2.4" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <path d="M 184 134 L 184 134 L 216 134 L 216 198" stroke="#4a7a3a" stroke-width="2.4" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="236" y="120" font-size="9" fill="#b85450" font-weight="bold">移除×1</text>
  <text x="236" y="160" font-size="9" fill="#4a7a3a" font-weight="bold">空格</text>

  <text x="152" y="296" text-anchor="middle" font-size="9.5" fill="#888">颜色：绿=0 障碍 / 黄=1~2 / 红=3</text>

  <!-- ===== RIGHT: step table ===== -->
  <text x="430" y="56" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">扩展步骤（取队首 → 松弛邻居）</text>

  <!-- table header -->
  <rect x="300" y="68" width="248" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="316" y="82" font-size="9" fill="#446688" font-weight="bold">队首(i,j)</text>
  <text x="380" y="82" font-size="9" fill="#446688" font-weight="bold">d</text>
  <text x="418" y="82" font-size="9" fill="#446688" font-weight="bold">邻居</text>
  <text x="478" y="82" font-size="9" fill="#446688" font-weight="bold">w</text>
  <text x="520" y="82" font-size="9" fill="#446688" font-weight="bold">入队</text>

  <!-- rows -->
  <g font-size="9.5" fill="#444">
    <text x="316" y="100">(0,0)</text><text x="380" y="100">0</text><text x="418" y="100">(0,1)</text><text x="478" y="100" fill="#b85450">1</text><text x="520" y="100">尾</text>
    <text x="316" y="116">·</text><text x="380" y="116">0</text><text x="418" y="116">(1,0)</text><text x="478" y="116" fill="#b85450">1</text><text x="520" y="116">尾</text>
    <text x="316" y="132">(0,1)</text><text x="380" y="132">1</text><text x="418" y="132">(0,2)</text><text x="478" y="132" fill="#b85450">1</text><text x="520" y="132">尾</text>
    <text x="316" y="148">(1,0)</text><text x="380" y="148">1</text><text x="418" y="148">(2,0)</text><text x="478" y="148" fill="#b85450">1</text><text x="520" y="148">尾</text>
    <text x="316" y="164">(0,2)</text><text x="380" y="164">2</text><text x="418" y="164">(1,2)</text><text x="478" y="164" fill="#4a7a3a">0</text><text x="520" y="164">首</text>
    <text x="316" y="180">(1,2)</text><text x="380" y="180">2</text><text x="418" y="180">(2,2)</text><text x="478" y="180" fill="#4a7a3a">0</text><text x="520" y="180">首</text>
    <text x="316" y="196" fill="#4a7a3a" font-weight="bold">(2,2)</text><text x="380" y="196" fill="#4a7a3a" font-weight="bold">2</text><text x="418" y="196" fill="#4a7a3a">到终点</text>
  </g>

  <!-- highlight: w=0 push_front key insight box -->
  <rect x="300" y="214" width="248" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="424" y="232" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">关键：w=0 边入队首</text>
  <text x="424" y="248" text-anchor="middle" font-size="9" fill="#555">(0,2)→(1,2) 空格：nd=2=d 同层</text>
  <text x="424" y="262" text-anchor="middle" font-size="9" fill="#555">优先于队尾 k+1 处理 → dist 不漏更优解</text>

  <!-- legend -->
  <rect x="300" y="290" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="320" y="302" font-size="9.5" fill="#666">空格 (0)</text>
  <rect x="370" y="290" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="390" y="302" font-size="9.5" fill="#666">代价 1~2</text>
  <rect x="440" y="290" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="460" y="302" font-size="9.5" fill="#666">代价 3</text>

  <!-- ===== Bottom summary ===== -->
  <rect x="30" y="340" width="500" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="362" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">结论：dist[2][2] = 2，即至少移除 2 个障碍</text>
  <text x="280" y="380" text-anchor="middle" font-size="10.5" fill="#555">最优路径 (0,0)→(0,1)[拆]→(0,2)[拆]→(1,2)[空]→(2,2)[空]</text>
  <text x="280" y="396" text-anchor="middle" font-size="10.5" fill="#555">移除障碍数 = 路径边权和 = 1+1+0+0 = 2 ✓</text>
</svg>
