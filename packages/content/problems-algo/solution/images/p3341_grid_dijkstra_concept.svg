<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：等待语义下的边权</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">到达时刻 = 等目标房间开启 + 走 1 秒</text>

  <!-- ===== 2x2 grid (example 1) ===== -->
  <text x="36" y="72" font-size="9" fill="#888" font-weight="bold">moveTime：</text>

  <rect x="36" y="80" width="70" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="71" y="106" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <text x="71" y="124" text-anchor="middle" font-size="9" fill="#4a7a3a">起点 (0,0)</text>

  <rect x="140" y="80" width="70" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="106" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">4</text>
  <text x="175" y="124" text-anchor="middle" font-size="9" fill="#888">mt=4</text>

  <rect x="36" y="154" width="70" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="71" y="180" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">4</text>
  <text x="71" y="198" text-anchor="middle" font-size="9" fill="#888">mt=4</text>

  <rect x="140" y="154" width="70" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="175" y="180" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">4</text>
  <text x="175" y="198" text-anchor="middle" font-size="9" fill="#d6a040">终点 (1,1)</text>

  <!-- move arrows -->
  <path d="M 71 137 L 71 151" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="82" y="147" font-size="8.5" fill="#b85450" font-weight="bold">max(0,4)+1=5</text>

  <path d="M 108 181 L 136 181" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="36" y="226" font-size="9.5" fill="#b85450" font-weight="bold">路径：(0,0) —t=5→ (1,0) —t=6→ (1,1) ✓</text>

  <!-- ===== formula box ===== -->
  <rect x="250" y="80" width="240" height="88" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="370" y="104" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">到达时刻转移</text>
  <text x="370" y="128" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">t' = max(t, mt[nx][ny]) + 1</text>
  <text x="370" y="150" text-anchor="middle" font-size="9.5" fill="#888">早到门口 → 等；晚到 → 直接进</text>

  <!-- ===== monotonicity box ===== -->
  <rect x="250" y="184" width="240" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="370" y="208" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">max 单调不减</text>
  <text x="370" y="227" text-anchor="middle" font-size="10.5" fill="#333">早出发 → 不会晚到</text>
  <text x="370" y="246" text-anchor="middle" font-size="10.5" fill="#333">→ Dijkstra 贪心依然成立</text>

  <!-- ===== bottom three boxes ===== -->
  <rect x="20" y="272" width="155" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="97" y="294" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">BFS ✗</text>
  <text x="97" y="312" text-anchor="middle" font-size="9" fill="#666">边权随 t 变化</text>
  <text x="97" y="326" text-anchor="middle" font-size="9" fill="#666">层数 ≠ 时间</text>

  <rect x="188" y="272" width="145" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="294" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">逐格 DP ✗</text>
  <text x="260" y="312" text-anchor="middle" font-size="9" fill="#666">四方向来回走</text>
  <text x="260" y="326" text-anchor="middle" font-size="9" fill="#666">无拓扑序、有后效性</text>

  <rect x="346" y="272" width="154" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="423" y="294" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">Dijkstra ✓</text>
  <text x="423" y="312" text-anchor="middle" font-size="9" fill="#666">堆取时间最小者</text>
  <text x="423" y="326" text-anchor="middle" font-size="9" fill="#666">弹出即最终确定</text>

  <text x="260" y="354" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">起点 t=0 已在 (0,0) 房间内，无需等 mt[0][0]</text>
</svg>
