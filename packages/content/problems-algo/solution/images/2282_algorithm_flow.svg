<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：行趟 f(row) + 列趟 f(col) → answer += 列贡献</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">f(nums) 内部：从右向左，单调递减栈，四步结算</text>

  <!-- ====== Top: outer two-pass structure ====== -->
  <!-- Start: answer = [] -->
  <rect x="40" y="58" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="100" y="80" text-anchor="middle" font-size="11.5" fill="#333">answer = []</text>

  <path d="M 160 75 L 188 75" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Row pass -->
  <rect x="190" y="58" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="80" text-anchor="middle" font-size="11.5" fill="#333">① 行趟：ans[i] = f(row_i)</text>

  <path d="M 350 75 L 378 75" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Column pass -->
  <rect x="380" y="58" width="160" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="460" y="80" text-anchor="middle" font-size="11.5" fill="#333">② 列趟：ans[i][j] += f(col_j)[i]</text>

  <!-- Return -->
  <path d="M 460 92 L 460 110" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="380" y="112" width="160" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="460" y="132" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">return answer</text>

  <!-- divider -->
  <path d="M 40 162 L 540 162" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="280" y="158" text-anchor="middle" font-size="10" fill="#aaa">─── f(nums) 内部流程（从右向左 i = n-1 … 0）───</text>

  <!-- ====== Bottom: f(nums) internal flow ====== -->
  <!-- Step 1: while pop < -->
  <rect x="60" y="180" width="440" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="198" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1. 弹栈累加：while stk 非空且 stk.top() &lt; nums[i]</text>
  <text x="280" y="214" text-anchor="middle" font-size="10.5" fill="#555">ans[i] += 1, stk.pop()　→　结算「严格矮于 h[i] 的递增阶梯」</text>

  <path d="M 280 220 L 280 238" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: if non-empty +1 -->
  <rect x="60" y="240" width="440" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="258" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2. 首个更高者 +1：if stk 非空　→　ans[i] += 1</text>
  <text x="280" y="274" text-anchor="middle" font-size="10.5" fill="#555">栈顶是右侧第一个 ≥ h[i] 者，可见；弹空则不 +1</text>

  <path d="M 280 280 L 280 298" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: clear equal -->
  <rect x="60" y="300" width="440" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="318" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3. 清等高：while stk 非空且 stk.top() == nums[i]　→　stk.pop()</text>
  <text x="280" y="334" text-anchor="middle" font-size="10.5" fill="#555">不计入 ans；维持「顶到底严格递增」，防止等高重复堆积</text>

  <path d="M 280 340 L 280 358" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: push -->
  <rect x="60" y="360" width="440" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="378" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4. 入栈：stk.push(nums[i])</text>
  <text x="280" y="394" text-anchor="middle" font-size="10.5" fill="#555">当前身高作为更左起点的可见候选；继续 i −1</text>

  <!-- loop back arrow -->
  <path d="M 60 380 L 30 380 L 30 200 L 58 200" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="20" y="294" font-size="10" fill="#888" font-weight="bold" transform="rotate(-90 20 294)">i −1，回到步骤 1</text>

  <!-- bottom note -->
  <rect x="60" y="420" width="440" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="440" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">关键不变式：栈从顶到底严格递增（= 从底到顶严格递减）</text>
  <text x="280" y="456" text-anchor="middle" font-size="10.5" fill="#555">每个元素入栈 1 次、出栈 1 次（含清等高）→ while 总弹栈 ≤ n → f 均 O(n)</text>
  <text x="280" y="472" text-anchor="middle" font-size="10" fill="#aaa">与 1944 唯一差别：第 3 步「清等高」（1944 身高互不相同，无此步）</text>
</svg>
