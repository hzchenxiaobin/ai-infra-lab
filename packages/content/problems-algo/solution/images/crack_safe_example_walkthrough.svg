<svg xmlns="http://www.w3.org/2000/svg" width="880" height="660" viewBox="0 0 880 660" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#446688"/>
    </marker>
    <marker id="arg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8e4a"/>
    </marker>
    <marker id="aro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#c98a2b"/>
    </marker>
  </defs>
  <rect width="880" height="660" fill="#fdfcf7"/>
  <text x="440" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：n=2, k=2 → 构造 "00110"</text>
  <path d="M 310 40 Q 440 48 570 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ===== TOP: de Bruijn graph with traversal order ===== -->
  <text x="34" y="72" font-size="13" font-weight="bold" fill="#2e6e2e">① de Bruijn 图 B(2,2)：边的访问顺序（①②③④）</text>

  <!-- node 0 -->
  <g filter="url(#sk)">
    <ellipse cx="170" cy="200" rx="38" ry="24" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="170" y="206" text-anchor="middle" font-size="16" font-weight="bold" fill="#34506e">"0"</text>

  <!-- node 1 -->
  <g filter="url(#sk)">
    <ellipse cx="470" cy="200" rx="38" ry="24" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="470" y="206" text-anchor="middle" font-size="16" font-weight="bold" fill="#34506e">"1"</text>

  <!-- self-loop on "0" labeled 00, order ① -->
  <path d="M 156 178 C 118 138, 108 138, 148 172" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arb)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="80" y="134" width="44" height="22" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="102" y="149" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">00</text>
  <g filter="url(#sk)"><circle cx="64" cy="145" r="11" fill="#4a8e4a" stroke="#2e6e2e" stroke-width="1.4"/></g>
  <text x="64" y="149" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">①</text>

  <!-- edge 0->1 labeled 01, order ② -->
  <path d="M 206 192 Q 320 162 434 192" stroke="#4a8e4a" stroke-width="1.8" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="298" y="160" width="44" height="22" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="320" y="175" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">01</text>
  <g filter="url(#sk)"><circle cx="282" cy="171" r="11" fill="#4a8e4a" stroke="#2e6e2e" stroke-width="1.4"/></g>
  <text x="282" y="175" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">②</text>

  <!-- edge 1->0 labeled 10, order ③ -->
  <path d="M 434 210 Q 320 244 206 210" stroke="#c98a2b" stroke-width="1.8" fill="none" marker-end="url(#aro)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="298" y="236" width="44" height="22" rx="5" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="320" y="251" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">10</text>
  <g filter="url(#sk)"><circle cx="282" cy="247" r="11" fill="#c98a2b" stroke="#7a5415" stroke-width="1.4"/></g>
  <text x="282" y="251" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">③</text>

  <!-- self-loop on "1" labeled 11, order ④ -->
  <path d="M 484 178 C 522 138, 532 138, 492 172" stroke="#c98a2b" stroke-width="1.8" fill="none" marker-end="url(#aro)" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="516" y="134" width="44" height="22" rx="5" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.4"/></g>
  <text x="538" y="149" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">11</text>
  <g filter="url(#sk)"><circle cx="566" cy="145" r="11" fill="#c98a2b" stroke="#7a5415" stroke-width="1.4"/></g>
  <text x="566" y="149" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">④</text>

  <!-- right side: legend of order colors -->
  <g filter="url(#sk)">
    <rect x="620" y="120" width="236" height="124" rx="8" fill="#fffdf3" stroke="#c9a93a" stroke-width="1.2" stroke-dasharray="5 3"/>
  </g>
  <text x="738" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">DFS 进入边的顺序</text>
  <g font-size="11" fill="#5a5a5a">
    <text x="636" y="166">① "00"：0 的自环</text>
    <text x="636" y="184">② "01"：0→1</text>
    <text x="636" y="202">③ "10"：1→0（0 卡住）</text>
    <text x="636" y="220">④ "11"：1 的自环（1 卡住）</text>
  </g>
  <text x="738" y="236" text-anchor="middle" font-size="10.5" fill="#b85450">绿=前半程  橙=回溯前半程</text>

  <!-- ===== MIDDLE: post-order append table ===== -->
  <text x="34" y="284" font-size="13" font-weight="bold" fill="#7a5415">② 后序追加：回溯时把边标签压入 ans（最先卡住的先进）</text>

  <!-- table header -->
  <g font-size="11" font-weight="bold" fill="#34506e" text-anchor="middle">
    <g filter="url(#sk)"><rect x="34" y="300" width="812" height="26" rx="4" fill="#eef3fb" stroke="#446688" stroke-width="1.2"/></g>
    <text x="84" y="317">回溯序</text>
    <text x="194" y="317">边（密码）</text>
    <text x="324" y="317">从哪个节点</text>
    <text x="448" y="317">下一节点</text>
    <text x="560" y="317">append(d)</text>
    <text x="700" y="317">ans 累积</text>
  </g>

  <!-- row 1: edge 10 -> append 0 -->
  <g font-size="11.5" text-anchor="middle">
    <g filter="url(#sk)"><rect x="34" y="326" width="812" height="26" fill="#fff8e1" stroke="#e6d09a" stroke-width="1"/></g>
    <text x="84" y="343" fill="#7a5415" font-weight="bold">1</text>
    <text x="194" y="343" fill="#7a5415" font-weight="bold">10</text>
    <text x="324" y="343" fill="#5a5a5a">"1"</text>
    <text x="448" y="343" fill="#5a5a5a">"0"（卡住）</text>
    <text x="560" y="343" fill="#7a5415" font-weight="bold">append "0"</text>
    <text x="700" y="343" fill="#7a5415" font-weight="bold">["0"]</text>
  </g>
  <!-- row 2: edge 11 -> append 1 -->
  <g font-size="11.5" text-anchor="middle">
    <g filter="url(#sk)"><rect x="34" y="352" width="812" height="26" fill="#fff8e1" stroke="#e6d09a" stroke-width="1"/></g>
    <text x="84" y="369" fill="#7a5415" font-weight="bold">2</text>
    <text x="194" y="369" fill="#7a5415" font-weight="bold">11</text>
    <text x="324" y="369" fill="#5a5a5a">"1"</text>
    <text x="448" y="369" fill="#5a5a5a">"1"（卡住）</text>
    <text x="560" y="369" fill="#7a5415" font-weight="bold">append "1"</text>
    <text x="700" y="369" fill="#7a5415" font-weight="bold">["0","1"]</text>
  </g>
  <!-- row 3: edge 01 -> append 1 -->
  <g font-size="11.5" text-anchor="middle">
    <g filter="url(#sk)"><rect x="34" y="378" width="812" height="26" fill="#eaf6ee" stroke="#9ec9a0" stroke-width="1"/></g>
    <text x="84" y="395" fill="#2e6e2e" font-weight="bold">3</text>
    <text x="194" y="395" fill="#2e6e2e" font-weight="bold">01</text>
    <text x="324" y="395" fill="#5a5a5a">"0"</text>
    <text x="448" y="395" fill="#5a5a5a">"1"</text>
    <text x="560" y="395" fill="#2e6e2e" font-weight="bold">append "1"</text>
    <text x="700" y="395" fill="#2e6e2e" font-weight="bold">["0","1","1"]</text>
  </g>
  <!-- row 4: edge 00 -> append 0 -->
  <g font-size="11.5" text-anchor="middle">
    <g filter="url(#sk)"><rect x="34" y="404" width="812" height="26" fill="#eaf6ee" stroke="#9ec9a0" stroke-width="1"/></g>
    <text x="84" y="421" fill="#2e6e2e" font-weight="bold">4</text>
    <text x="194" y="421" fill="#2e6e2e" font-weight="bold">00</text>
    <text x="324" y="421" fill="#5a5a5a">"0"（起点）</text>
    <text x="448" y="421" fill="#5a5a5a">"0"</text>
    <text x="560" y="421" fill="#2e6e2e" font-weight="bold">append "0"</text>
    <text x="700" y="421" fill="#2e6e2e" font-weight="bold">["0","1","1","0"]</text>
  </g>

  <text x="440" y="450" text-anchor="middle" font-size="11.5" fill="#5a5a5a">ans（后序）= "0110"（回文，反转不变）；<tspan font-weight="bold" fill="#b85450">"0" + "0110"[::-1] = "0" + "0110" = "00110"</tspan></text>

  <!-- ===== BOTTOM: final string with 4 highlighted substrings ===== -->
  <text x="34" y="482" font-size="13" font-weight="bold" fill="#b85450">③ 结果串 "00110"：4 个长度为 2 的窗口各对应一个密码（全覆盖）</text>

  <!-- string cells: 0 0 1 1 0, indices 0..4 -->
  <g font-size="16" font-weight="bold" text-anchor="middle" fill="#34506e">
    <g filter="url(#sk)"><rect x="120" y="500" width="40" height="40" rx="6" fill="#fff" stroke="#446688" stroke-width="1.4"/></g>
    <text x="140" y="526">0</text>
    <g filter="url(#sk)"><rect x="160" y="500" width="40" height="40" rx="6" fill="#fff" stroke="#446688" stroke-width="1.4"/></g>
    <text x="180" y="526">0</text>
    <g filter="url(#sk)"><rect x="200" y="500" width="40" height="40" rx="6" fill="#fff" stroke="#446688" stroke-width="1.4"/></g>
    <text x="220" y="526">1</text>
    <g filter="url(#sk)"><rect x="240" y="500" width="40" height="40" rx="6" fill="#fff" stroke="#446688" stroke-width="1.4"/></g>
    <text x="260" y="526">1</text>
    <g filter="url(#sk)"><rect x="280" y="500" width="40" height="40" rx="6" fill="#fff" stroke="#446688" stroke-width="1.4"/></g>
    <text x="300" y="526">0</text>
  </g>
  <text x="160" y="556" text-anchor="middle" font-size="10" fill="#7a7a7a">起点 "0"</text>
  <text x="300" y="556" text-anchor="middle" font-size="10" fill="#7a7a7a">末位</text>

  <!-- 4 window brackets below, each a different color -->
  <!-- window 1: indices 0-1 "00" green -->
  <path d="M 120 548 L 116 556 L 196 556 L 200 548" stroke="#4a8e4a" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="158" y="574" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e">"00" ✓</text>
  <!-- window 2: indices 1-2 "01" green -->
  <path d="M 160 586 L 156 594 L 236 594 L 240 586" stroke="#4a8e4a" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="198" y="612" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2e6e2e">"01" ✓</text>
  <!-- window 3: indices 2-3 "11" orange -->
  <path d="M 200 586 L 204 594 L 284 594 L 280 586" stroke="#c98a2b" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="242" y="574" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5415">"11" ✓</text>
  <!-- window 4: indices 3-4 "10" orange -->
  <path d="M 240 548 L 244 556 L 324 556 L 320 548" stroke="#c98a2b" stroke-width="1.6" fill="none" filter="url(#sk)"/>
  <text x="282" y="612" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#7a5415">"10" ✓</text>

  <!-- right summary box -->
  <g filter="url(#sk)">
    <rect x="400" y="500" width="446" height="120" rx="8" fill="#fdecee" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="623" y="524" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450">验证</text>
  <text x="420" y="548" font-size="11.5" fill="#5a5a5a">• 4 个密码 00 / 01 / 11 / 10 各出现 1 次 ✓</text>
  <text x="420" y="568" font-size="11.5" fill="#5a5a5a">• 串长 = 5 = k^n + (n−1) = 2² + 1 ✓</text>
  <text x="420" y="588" font-size="11.5" fill="#5a5a5a">• 取到长度下界 → 必为最短 ✓</text>
  <text x="420" y="610" font-size="11.5" font-weight="bold" fill="#b85450">欧拉回路 = de Bruijn 序列 B(2,2)</text>

  <!-- bottom note -->
  <text x="440" y="648" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">每个密码恰出现一次 + 暖机 1 位 = 5 位 → 这就是 de Bruijn 序列，也是最短答案</text>
</svg>
