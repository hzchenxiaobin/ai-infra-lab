<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：单趟扫描 + 哈希表「先查后加」统计相等前缀配对</text>

  <rect x="70" y="38" width="400" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="60" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">① 初始化：cur = 0，ans = 0，cnt = {0:1}</text>
  <text x="270" y="78" text-anchor="middle" font-size="10.5" fill="#888">（空前缀 F(0)=0 先入表，保证只与「之前」的前缀配对）</text>

  <path d="M270 88 L270 104" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="106" width="440" height="74" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="128" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">② 遍历 i = 0 … n−1（逐字符推进 cur）</text>
  <text x="270" y="148" text-anchor="middle" font-size="12" fill="#333">cur += (s[i]=='0') ? +num2 : −num1</text>
  <text x="270" y="166" text-anchor="middle" font-size="12" fill="#333">ans += cnt[cur]　；　cnt[cur]++</text>

  <path d="M270 180 L270 196" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="50" y="198" width="440" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="220" text-anchor="middle" font-size="11.5" fill="#888">键 = 前缀 F 值，值 = 该 F 已出现次数</text>
  <text x="270" y="240" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">「先查后加」⇒ 每个结尾 r 只与 l &lt; r 的等值前缀配对</text>

  <path d="M270 256 L270 272" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="274" width="400" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="299" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">③ 返回 ans</text>

  <rect x="40" y="324" width="460" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="270" y="342" text-anchor="middle" font-size="11" fill="#a87020">无需显式存 Z/O：cur 由前一值增量更新，'0' 增 num2、'1' 减 num1</text>
</svg>
