<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16.5" fill="#333" font-weight="bold" filter="url(#rough2)">元音、辅音两组各取最大频次，再相加</text>
  <text x="142" y="66" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">s = "successes"</text>

  <!-- 元音组 -->
  <rect x="30" y="82" width="225" height="110" rx="10" fill="#f0f5fc" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="142" y="103" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">元音（a e i o u）</text>
  <rect x="48" y="114" width="82" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="89" y="138" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">u : 1</text>
  <rect x="158" y="114" width="82" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="199" y="138" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">e : 2</text>
  <text x="199" y="176" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">取最大 ★</text>

  <!-- 辅音组 -->
  <rect x="30" y="202" width="225" height="95" rx="10" fill="#fdf6e5" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="142" y="223" text-anchor="middle" font-size="12" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">辅音（其余 21 个字母）</text>
  <rect x="48" y="232" width="82" height="38" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="89" y="256" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c : 2</text>
  <rect x="158" y="232" width="82" height="38" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="199" y="256" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">s : 4</text>
  <text x="199" y="288" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">取最大 ★</text>

  <!-- 右侧答案面板 -->
  <rect x="285" y="82" width="210" height="215" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="122" text-anchor="middle" font-size="15" fill="#446688" font-weight="bold" filter="url(#rough2)">maxV = 2</text>
  <text x="390" y="156" text-anchor="middle" font-size="15" fill="#a07020" font-weight="bold" filter="url(#rough2)">maxC = 4</text>
  <path d="M 310 180 L 470 180" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="390" y="210" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">ans = maxV + maxC</text>
  <text x="390" y="243" text-anchor="middle" font-size="17" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">= 2 + 4 = 6</text>
  <text x="390" y="274" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">两组互不影响</text>

  <!-- 箭头：e:2 → maxV -->
  <path d="M 242 133 C 256 133, 264 120, 277 118" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- 箭头：s:4 → maxC -->
  <path d="M 242 251 C 256 251, 264 168, 277 156" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 底部提示框 -->
  <rect x="30" y="310" width="465" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="262" y="335" text-anchor="middle" font-size="12.5" fill="#8a3a36" filter="url(#rough2)">⚠️ 某组为空时记 0：如 "aeiaeia" 无辅音 → 3 + 0 = 3</text>
</svg>
