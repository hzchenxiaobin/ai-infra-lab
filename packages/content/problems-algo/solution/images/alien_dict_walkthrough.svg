<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：wrt/wrf/er/ett/rftt → 剥洋葱得 "wertf"</text>

  <!-- ====== DAG (y=50-130) ====== -->
  <text x="280" y="52" text-anchor="middle" font-size="11" fill="#888">初始 DAG + 入度（角标）</text>

  <!-- Edges -->
  <path d="M 104 100 L 158 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 204 100 L 258 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 304 100 L 358 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 404 100 L 458 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Nodes -->
  <circle cx="80" cy="100" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="80" y="105" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">w</text>
  <circle cx="180" cy="100" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="105" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">e</text>
  <circle cx="280" cy="100" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="105" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">r</text>
  <circle cx="380" cy="100" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="105" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">t</text>
  <circle cx="480" cy="100" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="480" y="105" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">f</text>

  <!-- Indegree badges -->
  <circle cx="98" cy="82" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="98" y="86" text-anchor="middle" font-size="9" fill="#444" font-weight="bold">0</text>
  <circle cx="198" cy="82" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="198" y="86" text-anchor="middle" font-size="9" fill="#444" font-weight="bold">1</text>
  <circle cx="298" cy="82" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="298" y="86" text-anchor="middle" font-size="9" fill="#444" font-weight="bold">1</text>
  <circle cx="398" cy="82" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="398" y="86" text-anchor="middle" font-size="9" fill="#444" font-weight="bold">1</text>
  <circle cx="498" cy="82" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="498" y="86" text-anchor="middle" font-size="9" fill="#444" font-weight="bold">1</text>

  <!-- callout -->
  <text x="80" y="142" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">入度0 起点</text>

  <!-- ====== Step Table (y=160-360) ====== -->
  <!-- Header -->
  <rect x="40" y="158" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="70" y="174" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">步骤</text>
  <rect x="100" y="158" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="125" y="174" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">出队</text>
  <rect x="150" y="158" width="170" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="235" y="174" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">入度变化</text>
  <rect x="320" y="158" width="90" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="365" y="174" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">队列</text>
  <rect x="410" y="158" width="110" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="465" y="174" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">result</text>

  <!-- Row 0: initial -->
  <rect x="40" y="184" width="60" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="199" text-anchor="middle" font-size="10" fill="#666">初始</text>
  <rect x="100" y="184" width="50" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="125" y="199" text-anchor="middle" font-size="10" fill="#888">—</text>
  <rect x="150" y="184" width="170" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="235" y="199" text-anchor="middle" font-size="9" fill="#666">w:0 e:1 r:1 t:1 f:1</text>
  <rect x="320" y="184" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="365" y="199" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">[w]</text>
  <rect x="410" y="184" width="110" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="465" y="199" text-anchor="middle" font-size="10" fill="#888">""</text>

  <!-- Row 1: pop w -->
  <rect x="40" y="208" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="223" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">1</text>
  <rect x="100" y="208" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="125" y="223" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">w</text>
  <rect x="150" y="208" width="170" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="235" y="223" text-anchor="middle" font-size="9" fill="#b85450">e: 1→0</text>
  <rect x="320" y="208" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="365" y="223" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">[e]</text>
  <rect x="410" y="208" width="110" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="465" y="223" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">"w"</text>

  <!-- Row 2: pop e -->
  <rect x="40" y="232" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="247" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">2</text>
  <rect x="100" y="232" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="125" y="247" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">e</text>
  <rect x="150" y="232" width="170" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="235" y="247" text-anchor="middle" font-size="9" fill="#b85450">r: 1→0</text>
  <rect x="320" y="232" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="365" y="247" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">[r]</text>
  <rect x="410" y="232" width="110" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="465" y="247" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">"we"</text>

  <!-- Row 3: pop r -->
  <rect x="40" y="256" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="271" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3</text>
  <rect x="100" y="256" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="125" y="271" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">r</text>
  <rect x="150" y="256" width="170" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="235" y="271" text-anchor="middle" font-size="9" fill="#b85450">t: 1→0</text>
  <rect x="320" y="256" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="365" y="271" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">[t]</text>
  <rect x="410" y="256" width="110" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="465" y="271" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">"wer"</text>

  <!-- Row 4: pop t -->
  <rect x="40" y="280" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="295" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">4</text>
  <rect x="100" y="280" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="125" y="295" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">t</text>
  <rect x="150" y="280" width="170" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="235" y="295" text-anchor="middle" font-size="9" fill="#b85450">f: 1→0</text>
  <rect x="320" y="280" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="365" y="295" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">[f]</text>
  <rect x="410" y="280" width="110" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="465" y="295" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">"wert"</text>

  <!-- Row 5: pop f -->
  <rect x="40" y="304" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="319" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">5</text>
  <rect x="100" y="304" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="125" y="319" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">f</text>
  <rect x="150" y="304" width="170" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="235" y="319" text-anchor="middle" font-size="9" fill="#888">—</text>
  <rect x="320" y="304" width="90" height="22" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="365" y="319" text-anchor="middle" font-size="10" fill="#888">[]</text>
  <rect x="410" y="304" width="110" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="465" y="319" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">"wertf"</text>

  <!-- Bottom note -->
  <rect x="40" y="340" width="480" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="358" text-anchor="middle" font-size="11" fill="#444">result.length = 5 == 节点数 → 无环 → 返回 "wertf" ✓</text>
  <text x="280" y="372" text-anchor="middle" font-size="10" fill="#888">每步只有一个入度 0 节点，拓扑序唯一确定</text>
</svg>
