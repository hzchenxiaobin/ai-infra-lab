<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：长度短路 + 单趟逐位比对</text>

  <!-- 侧注：短路点 -->
  <rect x="15" y="80" width="100" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="65" y="99" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">短路点①</text>
  <text x="65" y="114" text-anchor="middle" font-size="10" fill="#8a6d1a" filter="url(#rough2)">长度不等</text>
  <text x="65" y="129" text-anchor="middle" font-size="10" fill="#8a6d1a" filter="url(#rough2)">直接 false</text>

  <rect x="15" y="240" width="100" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="65" y="259" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">短路点②</text>
  <text x="65" y="274" text-anchor="middle" font-size="10" fill="#8a6d1a" filter="url(#rough2)">任一位失配</text>
  <text x="65" y="289" text-anchor="middle" font-size="10" fill="#8a6d1a" filter="url(#rough2)">立即 false</text>

  <!-- 开始 -->
  <rect x="200" y="44" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">开始</text>

  <path d="M 260 72 L 260 88" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形1：长度检查 -->
  <polygon points="160,126 260,92 360,126 260,160" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="122" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">len(words)</text>
  <text x="260" y="137" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">== len(s) ?</text>

  <path d="M 360 126 L 446 126" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="395" y="118" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="450" y="111" width="90" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="495" y="130" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 false</text>

  <path d="M 260 160 L 260 180" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="174" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 循环框 -->
  <rect x="180" y="182" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="201" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">逐位比较第 i 位（i = 0 … n−1）</text>

  <path d="M 260 212 L 260 230" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形2：逐位比较 -->
  <polygon points="155,268 260,234 365,268 260,302" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="264" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">words[i][0]</text>
  <text x="260" y="279" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">== s[i] ?</text>

  <path d="M 365 268 L 485 268 L 485 143" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="260" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <path d="M 260 302 L 260 322" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="316" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- i++ -->
  <rect x="195" y="324" width="130" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="342" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">i++，比下一位</text>

  <path d="M 260 352 L 260 370" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形3：是否比完 -->
  <polygon points="170,404 260,372 350,404 260,436" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="409" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">i == n ?</text>

  <path d="M 350 404 L 446 404" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="385" y="396" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="450" y="389" width="90" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="495" y="408" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 true</text>

  <!-- 回边 -->
  <path d="M 170 404 L 130 404 L 130 268 L 151 268" stroke="#446688" stroke-width="1.3" stroke-dasharray="5,4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="136" y="396" font-size="11" fill="#446688" filter="url(#rough2)">否</text>
</svg>
