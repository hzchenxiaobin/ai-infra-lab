<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：外层枚举位，内层计数，达标置位</text>

  <!-- 开始 -->
  <rect x="100" y="34" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="140" y="53" text-anchor="middle" font-size="12" fill="#33507a" filter="url(#rough2)">开始</text>
  <path d="M 140 62 L 140 80" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i = 0 -->
  <rect x="40" y="84" width="200" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="105" text-anchor="middle" font-size="11.5" fill="#33507a" filter="url(#rough2)">i = 0（枚举二进制位 0 ~ 31）</text>
  <path d="M 140 116 L 140 132" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- cnt = 0 -->
  <rect x="40" y="136" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="156" text-anchor="middle" font-size="11.5" fill="#33507a" filter="url(#rough2)">cnt = 0</text>
  <path d="M 140 166 L 140 184" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 内层统计 -->
  <rect x="40" y="188" width="210" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="145" y="206" text-anchor="middle" font-size="11.5" fill="#2f5d24" filter="url(#rough2)">内层遍历每个 x ∈ nums</text>
  <text x="145" y="223" text-anchor="middle" font-size="11.5" fill="#2f5d24" filter="url(#rough2)">cnt += (x &gt;&gt; i) &amp; 1</text>
  <path d="M 140 230 L 140 246" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 cnt >= k ? -->
  <polygon points="140,250 214,280 140,310 66,280" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="285" text-anchor="middle" font-size="12" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">cnt ≥ k ?</text>

  <!-- 是 → 置位 -->
  <path d="M 214 280 L 276 280" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="240" y="272" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="280" y="260" width="156" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="358" y="278" text-anchor="middle" font-size="11.5" fill="#2f5d24" filter="url(#rough2)">ans |= 1 &lt;&lt; i</text>
  <text x="358" y="294" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">（点亮该位）</text>

  <!-- 否 → 直接到 i<32 -->
  <path d="M 140 310 L 140 332" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="324" font-size="10.5" fill="#888" filter="url(#rough2)">否：跳过（该位保持 0）</text>
  <!-- 置位框汇入 -->
  <path d="M 358 300 L 358 321 L 150 321" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- 菱形 i < 32 ? -->
  <polygon points="140,336 206,364 140,392 74,364" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="369" text-anchor="middle" font-size="12" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">i &lt; 32 ?</text>

  <!-- 是：回环 -->
  <path d="M 206 364 L 470 364 L 470 151 L 244 151" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="356" text-anchor="middle" font-size="11" fill="#33507a" filter="url(#rough2)">是：i++，枚举下一位</text>

  <!-- 否 → 返回 -->
  <path d="M 140 392 L 140 396" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="152" y="390" font-size="11" fill="#888" filter="url(#rough2)">否</text>
  <rect x="100" y="400" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="140" y="418" text-anchor="middle" font-size="12" fill="#33507a" filter="url(#rough2)">返回 ans</text>

  <!-- 右上要点框 -->
  <rect x="300" y="84" width="190" height="96" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="395" y="108" text-anchor="middle" font-size="11.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">要点</text>
  <text x="395" y="128" text-anchor="middle" font-size="10.5" fill="#8f3a36" filter="url(#rough2)">位与位互不影响，</text>
  <text x="395" y="145" text-anchor="middle" font-size="10.5" fill="#8f3a36" filter="url(#rough2)">每一位独立判定；</text>
  <text x="395" y="162" text-anchor="middle" font-size="10.5" fill="#8f3a36" filter="url(#rough2)">达标即置位，互不干扰</text>
</svg>
