<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心思想：按 '.' 切分成修订号数组，再逐段比较</text>

  <!-- version1 string: 1 . 0 . 1 -->
  <text x="40" y="76" font-size="12" fill="#888">version1:</text>
  <rect x="110" y="56" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="77" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="156" y="56" width="28" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="78" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">.</text>
  <rect x="186" y="56" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="208" y="77" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="232" y="56" width="28" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="246" y="78" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">.</text>
  <rect x="262" y="56" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="284" y="77" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <!-- version2 string: 1 . 0 -->
  <text x="40" y="120" font-size="12" fill="#888">version2:</text>
  <rect x="110" y="100" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="132" y="121" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="156" y="100" width="28" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="122" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">.</text>
  <rect x="186" y="100" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="208" y="121" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>

  <!-- split hint -->
  <text x="330" y="90" font-size="11" fill="#888">按 '.' 切分</text>
  <path d="M 322 72 L 322 56" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 322 108 L 322 100" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- column headers -->
  <text x="162" y="156" text-anchor="middle" font-size="10" fill="#aaa">rev0</text>
  <text x="242" y="156" text-anchor="middle" font-size="10" fill="#aaa">rev1</text>
  <text x="322" y="156" text-anchor="middle" font-size="10" fill="#aaa">rev2</text>

  <!-- v1 segment array -->
  <text x="40" y="182" font-size="12" fill="#888">v1 修订号:</text>
  <rect x="130" y="166" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="162" y="188" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="210" y="166" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="242" y="188" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="290" y="166" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="322" y="188" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <!-- v2 segment array (padded) -->
  <text x="40" y="226" font-size="12" fill="#888">v2 修订号:</text>
  <rect x="130" y="210" width="64" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="162" y="232" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="210" y="210" width="64" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="242" y="232" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="290" y="210" width="64" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="322" y="232" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">0(补)</text>

  <!-- comparison verdicts -->
  <text x="162" y="206" text-anchor="middle" font-size="10" fill="#82b366">相等 ✓</text>
  <text x="242" y="206" text-anchor="middle" font-size="10" fill="#82b366">相等 ✓</text>
  <text x="322" y="206" text-anchor="middle" font-size="10" fill="#b85450">1 &gt; 0</text>

  <!-- result box -->
  <rect x="400" y="166" width="140" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="470" y="190" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">前两段相等</text>
  <text x="470" y="210" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">第三段 1 &gt; 0</text>
  <text x="470" y="232" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">→ 返回 1</text>

  <!-- core idea box -->
  <rect x="40" y="270" width="480" height="112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="294" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">两个关键点</text>
  <text x="60" y="318" font-size="12" fill="#666">① 按分隔符 '.' 切分后，逐位（修订号）比较；段数不等时短的用 0 补齐</text>
  <text x="60" y="340" font-size="12" fill="#666">② 每段当作「整数」比较，自动忽略前导零：1.01 == 1.001 == 1.0</text>
  <text x="60" y="364" font-size="12" fill="#888">   → parse 成 int 即可天然处理前导零，无需单独去零</text>
</svg>
