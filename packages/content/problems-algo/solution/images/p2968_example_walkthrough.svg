<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 372" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="372" fill="#fafafa"/>

  <text x="280" y="20" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [1,2,6,4]，k = 3 → 排序后 [1,2,4,6]</text>
  <text x="280" y="38" text-anchor="middle" font-size="11" fill="#888">每行先算 cost(left, right)，超预算就收缩 left，直到可行再更新 ans</text>

  <!-- 表头 -->
  <rect x="10" y="48" width="540" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="30" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">right</text>
  <text x="121" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">窗口（排序后）</text>
  <text x="221" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">中位数 m</text>
  <text x="285" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">cost</text>
  <text x="390" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">动作</text>
  <text x="506" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">ans</text>

  <!-- 行 0 -->
  <rect x="10" y="76" width="540" height="27" fill="#ffffff" filter="url(#rough2)"/>
  <text x="30" y="94" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="121" y="94" text-anchor="middle" font-size="11" fill="#333">[1]</text>
  <text x="221" y="94" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="285" y="94" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="390" y="94" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="506" y="94" text-anchor="middle" font-size="11" fill="#333">1</text>

  <!-- 行 1 -->
  <rect x="10" y="103" width="540" height="27" fill="#f4f7fb" filter="url(#rough2)"/>
  <text x="30" y="121" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="121" y="121" text-anchor="middle" font-size="11" fill="#333">[1,2]</text>
  <text x="221" y="121" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="285" y="121" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="390" y="121" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="506" y="121" text-anchor="middle" font-size="11" fill="#333">2</text>

  <!-- 行 2：恰好 k -->
  <rect x="10" y="130" width="540" height="27" fill="#ffffff" filter="url(#rough2)"/>
  <text x="30" y="148" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="121" y="148" text-anchor="middle" font-size="11" fill="#333">[1,2,4]</text>
  <text x="221" y="148" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="285" y="148" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3 = k</text>
  <text x="390" y="148" text-anchor="middle" font-size="11" fill="#4a7a3a">可行，入窗</text>
  <text x="506" y="148" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>

  <!-- 行 3：收缩 1 -->
  <rect x="10" y="157" width="540" height="27" fill="#fce4ec" filter="url(#rough2)"/>
  <text x="30" y="175" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="121" y="175" text-anchor="middle" font-size="11" fill="#333">[1,2,4,6]</text>
  <text x="221" y="175" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="285" y="175" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">7 &gt; k</text>
  <text x="390" y="175" text-anchor="middle" font-size="11" fill="#b85450">收缩，left 0→1</text>
  <text x="506" y="175" text-anchor="middle" font-size="11" fill="#333">3</text>

  <!-- 行 4：收缩 2 -->
  <rect x="10" y="184" width="540" height="27" fill="#fce4ec" filter="url(#rough2)"/>
  <text x="30" y="202" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="121" y="202" text-anchor="middle" font-size="11" fill="#333">[2,4,6]</text>
  <text x="221" y="202" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="285" y="202" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4 &gt; k</text>
  <text x="390" y="202" text-anchor="middle" font-size="11" fill="#b85450">收缩，left 1→2</text>
  <text x="506" y="202" text-anchor="middle" font-size="11" fill="#333">3</text>

  <!-- 行 5：稳定 -->
  <rect x="10" y="211" width="540" height="27" fill="#ffffff" filter="url(#rough2)"/>
  <text x="30" y="229" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="121" y="229" text-anchor="middle" font-size="11" fill="#333">[4,6]</text>
  <text x="221" y="229" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="285" y="229" text-anchor="middle" font-size="11" fill="#4a7a3a">2 ≤ k</text>
  <text x="390" y="229" text-anchor="middle" font-size="11" fill="#4a7a3a">稳定，长度 2</text>
  <text x="506" y="229" text-anchor="middle" font-size="11" fill="#333">3</text>

  <!-- 表格外框与列线 -->
  <path d="M 10 48 L 550 48 L 550 238 L 10 238 Z" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 52 48 L 52 238" fill="none" stroke="#99aabb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 190 48 L 190 238" fill="none" stroke="#99aabb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 252 48 L 252 238" fill="none" stroke="#99aabb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 318 48 L 318 238" fill="none" stroke="#99aabb" stroke-width="1" filter="url(#rough2)"/>
  <path d="M 462 48 L 462 238" fill="none" stroke="#99aabb" stroke-width="1" filter="url(#rough2)"/>

  <!-- 结论 -->
  <rect x="10" y="256" width="540" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="278" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">最终 ans = 3</text>
  <text x="280" y="298" text-anchor="middle" font-size="11" fill="#333">最优方案：把排序后 [1,2,4] 全改成 2，花费 1+0+2 = 3 次 ±1 操作</text>
  <text x="280" y="316" text-anchor="middle" font-size="11" fill="#333">偶数窗口 [2,4] 也可全改成 3（两个正中间之间任取），代价同为 2</text>
</svg>
