<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：正难则反 —— 最大分数 = 总分 − 最小「保留分」</text>
  <text x="280" y="45" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">示例 2：最优保留 {1, 5, 6}（和 18），取走 {0, 2, 3, 4} 得 40 分</text>

  <!-- tree edges -->
  <g filter="url(#rough2)" stroke="#999" stroke-width="1.5">
    <line x1="165" y1="92" x2="95" y2="165"/>
    <line x1="165" y1="92" x2="245" y2="165"/>
    <line x1="95" y1="165" x2="55" y2="245"/>
    <line x1="95" y1="165" x2="135" y2="245"/>
    <line x1="245" y1="165" x2="205" y2="245"/>
    <line x1="245" y1="165" x2="290" y2="245"/>
  </g>

  <!-- nodes: taken = blue, kept = orange -->
  <g filter="url(#rough2)" font-size="12" fill="#333">
    <circle cx="165" cy="92" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="165" y="97" text-anchor="middle">0</text>
    <text x="165" y="124" text-anchor="middle" font-size="11" fill="#555">20</text>

    <circle cx="95" cy="165" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <text x="95" y="170" text-anchor="middle">1</text>
    <text x="95" y="197" text-anchor="middle" font-size="11" fill="#8a6414">10</text>

    <circle cx="245" cy="165" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="245" y="170" text-anchor="middle">2</text>
    <text x="245" y="197" text-anchor="middle" font-size="11" fill="#555">9</text>

    <circle cx="55" cy="245" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="55" y="250" text-anchor="middle">3</text>
    <text x="55" y="277" text-anchor="middle" font-size="11" fill="#555">7</text>

    <circle cx="135" cy="245" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="135" y="250" text-anchor="middle">4</text>
    <text x="135" y="277" text-anchor="middle" font-size="11" fill="#555">4</text>

    <circle cx="205" cy="245" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <text x="205" y="250" text-anchor="middle">5</text>
    <text x="205" y="277" text-anchor="middle" font-size="11" fill="#8a6414">3</text>

    <circle cx="290" cy="245" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>
    <text x="290" y="250" text-anchor="middle">6</text>
    <text x="290" y="277" text-anchor="middle" font-size="11" fill="#8a6414">5</text>
  </g>

  <!-- path hit annotations under leaves -->
  <g filter="url(#rough2)" font-size="10.5" fill="#2e5c22">
    <text x="55" y="293" text-anchor="middle">0-1-3 ✓</text>
    <text x="135" y="293" text-anchor="middle">0-1-4 ✓</text>
    <text x="205" y="293" text-anchor="middle">0-2-5 ✓</text>
    <text x="290" y="293" text-anchor="middle">0-2-6 ✓</text>
    <text x="165" y="315" text-anchor="middle" font-size="11.5" fill="#2e5c22">每条根→叶路径都撞上 ≥1 个橙色节点 → 健康 ✓</text>
  </g>

  <!-- legend -->
  <g filter="url(#rough2)" font-size="10.5" fill="#555">
    <rect x="68" y="329" width="13" height="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="2"/>
    <text x="86" y="339">保留（守门，不计分）</text>
    <rect x="205" y="329" width="13" height="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="2"/>
    <text x="223" y="339">取走（计入分数）</text>
  </g>

  <!-- right box 1 -->
  <rect x="345" y="58" width="200" height="108" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#2c4a6e">
    <text x="445" y="80" text-anchor="middle" font-size="12" font-weight="bold">观察 ①：值全为正</text>
    <text x="445" y="102" text-anchor="middle">路径和 = 0 ⟺ 路上节点全被取走</text>
    <text x="445" y="124" text-anchor="middle">⟹ 健康 ⟺ 每条根→叶路径</text>
    <text x="445" y="146" text-anchor="middle">至少保留 1 个节点</text>
  </g>

  <!-- right box 2 -->
  <rect x="345" y="178" width="200" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#8a6414">
    <text x="445" y="198" text-anchor="middle" font-size="12" font-weight="bold">观察 ②：正难则反</text>
    <text x="445" y="220" text-anchor="middle">最大取走分 = 总分 − 最小保留分</text>
    <text x="445" y="238" text-anchor="middle">求 max 取走 ⇔ 求 min 保留</text>
  </g>

  <!-- right box 3 -->
  <rect x="345" y="254" width="200" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#2e5c22">
    <text x="445" y="274" text-anchor="middle" font-size="12" font-weight="bold">转移：后序树形 DP</text>
    <text x="445" y="294" text-anchor="middle">叶子：keep[x] = values[x]</text>
    <text x="445" y="312" text-anchor="middle" font-size="10.5">内部：min(values[x], Σ keep[y])</text>
    <text x="445" y="332" text-anchor="middle" font-size="10.5">答案 = Σ values − keep[0]</text>
  </g>

  <path d="M 315 205 L 341 205" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)" marker-end="url(#arr)"/>
</svg>
