<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算</text>

  <text x="260" y="46" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">示例 1：n = 5, limit = 2（lo = max(0, 5−4) = 1，hi = min(2, 5) = 2）</text>

  <rect x="45" y="58" width="436" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="69" y="77" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">x₁</text>
  <text x="129" y="77" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">m = n−x₁</text>
  <text x="224" y="77" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">x₂ 区间</text>
  <text x="312" y="77" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">c(m)</text>
  <text x="411" y="77" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">方案</text>

  <rect x="45" y="88" width="436" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="69" y="107" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="129" y="107" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="224" y="107" text-anchor="middle" font-size="11" fill="#333">[2, 2]</text>
  <text x="312" y="107" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <text x="411" y="107" text-anchor="middle" font-size="11" fill="#333">(1, 2, 2)</text>

  <rect x="45" y="118" width="436" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="69" y="137" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="129" y="137" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="224" y="137" text-anchor="middle" font-size="11" fill="#333">[1, 2]</text>
  <text x="312" y="137" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>
  <text x="411" y="137" text-anchor="middle" font-size="10.5" fill="#333">(2,1,2), (2,2,1)</text>

  <line x1="93" y1="58" x2="93" y2="148" stroke="#ccc" stroke-width="1" stroke-dasharray="2,3"/>
  <line x1="165" y1="58" x2="165" y2="148" stroke="#ccc" stroke-width="1" stroke-dasharray="2,3"/>
  <line x1="283" y1="58" x2="283" y2="148" stroke="#ccc" stroke-width="1" stroke-dasharray="2,3"/>
  <line x1="341" y1="58" x2="341" y2="148" stroke="#ccc" stroke-width="1" stroke-dasharray="2,3"/>

  <rect x="45" y="148" width="436" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="263" y="169" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">ans = 1 + 2 = 3 ✓</text>

  <text x="260" y="212" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">示例 2：n = 3, limit = 3（lo = 0，hi = 3）—— c(m) 依次为 4, 3, 2, 1</text>

  <line x1="90" y1="385" x2="90" y2="248" stroke="#888" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="96" y="254" font-size="11" fill="#888">c(m)</text>
  <line x1="90" y1="385" x2="430" y2="385" stroke="#888" stroke-width="1.8" filter="url(#rough2)"/>

  <rect x="120" y="257" width="44" height="128" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="190" y="289" width="44" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="260" y="321" width="44" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <rect x="330" y="353" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>

  <text x="142" y="250" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="212" y="282" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="282" y="314" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="352" y="346" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>

  <text x="142" y="402" text-anchor="middle" font-size="10.5" fill="#888">x₁=0</text>
  <text x="212" y="402" text-anchor="middle" font-size="10.5" fill="#888">x₁=1</text>
  <text x="282" y="402" text-anchor="middle" font-size="10.5" fill="#888">x₁=2</text>
  <text x="352" y="402" text-anchor="middle" font-size="10.5" fill="#888">x₁=3</text>

  <rect x="398" y="268" width="112" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="454" y="288" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">4+3+2+1</text>
  <text x="454" y="306" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">= 10 ✓</text>
  <text x="454" y="324" text-anchor="middle" font-size="10" fill="#999">limit ≥ n，上限失效</text>

  <text x="260" y="424" text-anchor="middle" font-size="10.5" fill="#888">固定 x₁ 后每个 c(m) 都是 O(1) 的区间长度，求和即答案</text>
</svg>
