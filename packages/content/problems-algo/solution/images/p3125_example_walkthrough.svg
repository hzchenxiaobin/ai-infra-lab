<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：从 n 向下连与，首次归零即答案</text>

  <rect x="48" y="38" width="424" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="55" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">n = 7 = 0b111（x = 2，预期 ans = 2^2 − 1 = 3）</text>

  <!-- table header -->
  <text x="76" y="78" text-anchor="end" font-size="11.5" fill="#888" font-weight="bold" filter="url(#rough2)">m</text>
  <text x="230" y="78" text-anchor="middle" font-size="11.5" fill="#888" font-weight="bold" filter="url(#rough2)">本步连与</text>
  <text x="336" y="78" text-anchor="middle" font-size="11.5" fill="#888" font-weight="bold" filter="url(#rough2)">A_m</text>
  <text x="430" y="78" text-anchor="middle" font-size="11.5" fill="#888" font-weight="bold" filter="url(#rough2)">变化</text>

  <!-- row m=7 -->
  <rect x="48" y="86" width="424" height="26" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="76" y="104" text-anchor="end" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="230" y="104" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">起点</text>
  <text x="336" y="104" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">111</text>
  <text x="430" y="104" text-anchor="middle" font-size="10.5" fill="#aaa" filter="url(#rough2)">—</text>

  <!-- row m=6 -->
  <rect x="48" y="114" width="424" height="26" fill="#fafaf5" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="76" y="132" text-anchor="end" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="230" y="132" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">111 &amp; 110</text>
  <text x="336" y="132" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">110</text>
  <text x="430" y="132" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">第 0 位熄灭</text>

  <!-- row m=5 -->
  <rect x="48" y="142" width="424" height="26" fill="#ffffff" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="76" y="160" text-anchor="end" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="230" y="160" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">110 &amp; 101</text>
  <text x="336" y="160" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">100</text>
  <text x="430" y="160" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">第 1 位熄灭</text>

  <!-- row m=4 -->
  <rect x="48" y="170" width="424" height="26" fill="#fafaf5" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="76" y="188" text-anchor="end" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="230" y="188" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">100 &amp; 100</text>
  <text x="336" y="188" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">100</text>
  <text x="430" y="188" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">不动（旗还站着）</text>

  <!-- row m=3 -->
  <rect x="48" y="198" width="424" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="76" y="216" text-anchor="end" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="230" y="216" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">100 &amp; 011</text>
  <text x="336" y="216" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">000</text>
  <text x="430" y="216" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">旗倒下 → ans</text>

  <!-- compact examples -->
  <rect x="48" y="238" width="424" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="256" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">n = 9 = 0b1001：1001 → 1000 → 0000，ans = 7 = 2^3 − 1</text>

  <rect x="48" y="272" width="424" height="28" fill="#ffffff" stroke="#bbb" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="290" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">n = 17 = 0b10001：10001 → 10000 → 00000，ans = 15 = 2^4 − 1</text>

  <!-- insight -->
  <rect x="48" y="312" width="424" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="330" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">共同模式：降到 2^x 时，连与已缩成 100…0（只剩最后一面旗）</text>
  <text x="260" y="348" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">跨过 2^x − 1 = 011…1，最高位熄灭，AND 归零</text>

  <rect x="48" y="368" width="424" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="384" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">按位与只清位不置位：一旦归零，继续下降恒为零 → 最大 m = 首次归零点</text>
</svg>
