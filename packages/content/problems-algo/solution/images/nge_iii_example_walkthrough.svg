<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 127431</text>

  <!-- Row 0: original -->
  <text x="40" y="62" font-size="11" fill="#888" font-weight="bold">原数组</text>
  <rect x="120" y="48" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="73" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="164" y="48" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="186" y="73" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="208" y="48" width="44" height="38" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="230" y="73" text-anchor="middle" font-size="13" fill="#333">7</text>
  <rect x="252" y="48" width="44" height="38" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="274" y="73" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="296" y="48" width="44" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="318" y="73" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="340" y="48" width="44" height="38" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="362" y="73" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="400" y="66" font-size="10.5" fill="#446688" font-weight="bold">i=1 (2&lt;7)</text>
  <text x="400" y="80" font-size="10.5" fill="#4a7a3a" font-weight="bold">j=4 (3&gt;2)</text>

  <path d="M 280 92 L 280 108" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="290" y="104" font-size="10" fill="#888">③ swap</text>

  <!-- Row 1: after swap -->
  <text x="40" y="132" font-size="11" fill="#888" font-weight="bold">交换后</text>
  <rect x="120" y="118" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="143" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="164" y="118" width="44" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="186" y="143" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="208" y="118" width="44" height="38" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="230" y="143" text-anchor="middle" font-size="13" fill="#333">7</text>
  <rect x="252" y="118" width="44" height="38" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="274" y="143" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="296" y="118" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="318" y="143" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="340" y="118" width="44" height="38" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="362" y="143" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="400" y="138" font-size="10.5" fill="#666">右侧 [7,4,2,1]</text>
  <text x="400" y="152" font-size="10.5" fill="#666">仍降序</text>

  <path d="M 280 162 L 280 178" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="290" y="174" font-size="10" fill="#888">④ reverse</text>

  <!-- Row 2: after reverse -->
  <text x="40" y="202" font-size="11" fill="#888" font-weight="bold">反转后</text>
  <rect x="120" y="188" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="213" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="164" y="188" width="44" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="213" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="208" y="188" width="44" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="213" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="252" y="188" width="44" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="274" y="213" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="296" y="188" width="44" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="318" y="213" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="340" y="188" width="44" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="362" y="213" text-anchor="middle" font-size="13" fill="#333">7</text>
  <text x="400" y="202" font-size="10.5" fill="#4a7a3a" font-weight="bold">右侧升序</text>
  <text x="400" y="216" font-size="10.5" fill="#666">= 该前缀最小</text>

  <path d="M 280 232 L 280 248" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="290" y="244" font-size="10" fill="#888">⑤ 拼回</text>

  <!-- Row 3: answer + overflow check -->
  <rect x="80" y="258" width="400" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="278" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">ans = 131247</text>
  <text x="280" y="295" text-anchor="middle" font-size="10.5" fill="#555">131247 &gt; 127431 ✓  且  131247 ≤ 2^31−1 ✓</text>

  <path d="M 280 308 L 280 324" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="290" y="320" font-size="10" fill="#888">⑥ 越界检查</text>

  <!-- final return -->
  <rect x="160" y="334" width="240" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="10" filter="url(#rough2)"/>
  <text x="280" y="362" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold">返回 131247</text>

  <!-- overflow contrast note -->
  <rect x="30" y="392" width="500" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="410" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">对照：n = 1999999999 → 9199999999 &gt; 2^31−1 → 返回 -1</text>
  <text x="280" y="424" text-anchor="middle" font-size="10" fill="#888">同一算法，仅步骤 ⑥ 越界检查命中而返回 -1</text>
</svg>
