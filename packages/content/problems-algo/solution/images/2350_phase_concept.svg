<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">阶段切分：每凑齐 k 个不同点数，就“服役”一个目标字符</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888">rolls = [4,2,1,2,3,3,2,4,1]，k = 4（示例 1）</text>

  <!-- ===== rolls row ===== box w=36 pitch=42 start x=36 ===== -->
  <g font-size="13">
    <!-- phase 1 rolls: 4 2 1 2 3 -->
    <rect x="36" y="74" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="54" y="98" text-anchor="middle" fill="#333">4</text>
    <rect x="78" y="74" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="96" y="98" text-anchor="middle" fill="#333">2</text>
    <rect x="120" y="74" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="138" y="98" text-anchor="middle" fill="#333">1</text>
    <rect x="162" y="74" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="180" y="98" text-anchor="middle" fill="#333">2</text>
    <rect x="204" y="74" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="222" y="98" text-anchor="middle" fill="#4a7a3a" font-weight="bold">3</text>
    <!-- phase 2 rolls: 3 2 4 1 -->
    <rect x="246" y="74" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="264" y="98" text-anchor="middle" fill="#333">3</text>
    <rect x="288" y="74" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="306" y="98" text-anchor="middle" fill="#333">2</text>
    <rect x="330" y="74" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="348" y="98" text-anchor="middle" fill="#333">4</text>
    <rect x="372" y="74" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="390" y="98" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
  </g>

  <!-- phase brackets -->
  <path d="M 36 128 L 36 138 L 240 138 L 240 128" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 246 128 L 246 138 L 408 138 L 408 128" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>

  <text x="138" y="156" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">阶段 1：凑齐 {1,2,3,4}</text>
  <text x="327" y="156" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">阶段 2：凑齐 {1,2,3,4}</text>

  <!-- count badges -->
  <rect x="96" y="172" width="84" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="138" y="192" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">count = 1</text>
  <rect x="285" y="172" width="84" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="327" y="192" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">count = 2</text>

  <!-- why one phase serves one char -->
  <rect x="30" y="226" width="500" height="120" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="250" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">为什么“一个阶段 = 服役一个目标字符”？</text>
  <text x="280" y="272" text-anchor="middle" font-size="11" fill="#333">阶段内出现 k 个不同点数 → 无论目标这一位是几，都能在该阶段内找到</text>
  <text x="280" y="290" text-anchor="middle" font-size="11" fill="#333">且该阶段整体位于之前所有阶段之后，不破坏已匹配前缀的顺序</text>
  <text x="280" y="312" text-anchor="middle" font-size="11" fill="#333">有 count 个完整阶段 ⇒ 任意长度 count 的序列都能匹配 ⇒ 答案 = count + 1</text>
  <text x="280" y="332" text-anchor="middle" font-size="10" fill="#888">最后一段凑不齐 k 个 ⇒ 存在点数不在剩余后缀 ⇒ 长度 count+1 的序列不可匹配</text>
</svg>
