<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：双指针 i、j + 偏移 k（i &lt; j，k=已匹配长度）</text>

  <!-- init box -->
  <rect x="210" y="46" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">初始化 i=0, j=1, k=0</text>

  <line x1="280" y1="80" x2="280" y2="98" stroke="#666" stroke-width="1.4" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- loop cond -->
  <rect x="206" y="100" width="148" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="122" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">while j + k &lt; n ?</text>

  <text x="362" y="118" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <line x1="354" y1="117" x2="386" y2="117" stroke="#666" stroke-width="1.4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="386" y="100" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="446" y="115" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">返回 s[i:]</text>
  <text x="446" y="129" text-anchor="middle" font-size="9.5" fill="#888">（i 即最大后缀起点）</text>

  <text x="284" y="146" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <line x1="280" y1="134" x2="280" y2="156" stroke="#666" stroke-width="1.4" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="280,158 360,206 280,254 200,206" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="200" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">比较</text>
  <text x="280" y="216" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">s[i+k] vs s[j+k]</text>

  <!-- three branches -->
  <!-- left: equal -->
  <line x1="200" y1="206" x2="150" y2="206" stroke="#666" stroke-width="1.4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="175" y="200" text-anchor="middle" font-size="9.5" fill="#888">相等</text>
  <rect x="46" y="190" width="104" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="98" y="205" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">k += 1</text>
  <text x="98" y="218" text-anchor="middle" font-size="9" fill="#888">继续对齐下一字符</text>

  <!-- right: s[i+k] > s[j+k] : j loses -->
  <line x1="360" y1="206" x2="410" y2="206" stroke="#666" stroke-width="1.4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="385" y="200" text-anchor="middle" font-size="9.5" fill="#888">&gt;</text>
  <rect x="410" y="190" width="118" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="469" y="205" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">j 落败</text>
  <text x="469" y="218" text-anchor="middle" font-size="9.5" fill="#888">j = j + k + 1 ; k=0</text>

  <!-- down: s[i+k] < s[j+k] : i loses -->
  <line x1="280" y1="254" x2="280" y2="276" stroke="#666" stroke-width="1.4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="298" y="268" font-size="9.5" fill="#888">&lt;</text>
  <rect x="222" y="278" width="116" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="293" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i 落败</text>
  <text x="280" y="306" text-anchor="middle" font-size="9.5" fill="#888">i = i + k + 1 ; k=0</text>

  <!-- ensure i < j box -->
  <line x1="280" y1="312" x2="280" y2="330" stroke="#666" stroke-width="1.4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="196" y="332" width="168" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="354" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">若 i ≥ j 则 j = i + 1</text>

  <line x1="280" y1="366" x2="280" y2="384" stroke="#666" stroke-width="1.4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="290" y="378" font-size="9.5" fill="#888">回循环顶部</text>

  <!-- side note about skip -->
  <rect x="40" y="400" width="470" height="30" fill="#f2f2f2" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3" rx="6" filter="url(#rough2)"/>
  <text x="275" y="419" text-anchor="middle" font-size="10" fill="#666" font-style="italic">每次失配 i 或 j 一次性跳 k+1 步，二者总位移 ≤ 2n → 整体均摊 O(n)</text>
</svg>
