<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#446688" stroke-width="1.8"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="17" fill="#333"
        filter="url(#rough2)">算法流程：求和定起点 → 哈希跳已现</text>

  <!-- 开始 -->
  <rect x="160" y="46" width="240" height="38" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.8" rx="18" filter="url(#rough2)"/>
  <text x="280" y="70" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M 280 84 L 280 102" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ① 求和 -->
  <rect x="140" y="106" width="280" height="42" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="132" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">① sum = Σnums，n = len(nums)</text>
  <path d="M 280 148 L 280 166" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② 起点 -->
  <rect x="140" y="170" width="280" height="42" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="196" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">② x = max(1, floor(sum/n) + 1)</text>
  <path d="M 280 212 L 280 230" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ 建集合 -->
  <rect x="140" y="234" width="280" height="42" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="260" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">③ S = set(nums) 哈希集合</text>
  <path d="M 280 276 L 280 294" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="230,298 330,336 230,374 130,336" fill="#e8f0fe" stroke="#446688"
           stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="341" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">x ∈ S ?</text>

  <!-- 否 → 返回 -->
  <path d="M 330 336 L 398 336" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="362" y="326" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="402" y="314" width="118" height="44" fill="#fce4ec" stroke="#b85450"
        stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="461" y="341" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 x</text>

  <!-- 是 → x+=1 -->
  <path d="M 230 374 L 230 390" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="246" y="388" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="170" y="394" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="230" y="419" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">x += 1</text>

  <!-- 回边 -->
  <path d="M 170 414 L 84 414 L 84 336 L 124 336" stroke="#446688" stroke-width="1.5"
        fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 鸽笼注记 -->
  <rect x="392" y="392" width="152" height="58" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="468" y="414" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">鸽笼保证至多</text>
  <text x="468" y="432" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">n+1 步跳出循环</text>

  <!-- 底注 -->
  <text x="280" y="460" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">avg &lt; 0 时 floor(sum/n)+1 ≤ 0，起点被 max(1, ·) 拉回 1</text>
</svg>
