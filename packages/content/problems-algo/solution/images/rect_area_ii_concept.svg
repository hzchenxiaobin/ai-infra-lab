<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">扫描线 + 坐标压缩：连续 y 轴 → 离散条带</text>

  <!-- ===== Left: 2D plane with rectangles ===== -->
  <!-- Y axis -->
  <line x1="60" y1="290" x2="60" y2="70" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <!-- X axis -->
  <line x1="60" y1="290" x2="310" y2="290" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- Y-band separator lines (dashed) -->
  <line x1="60" y1="80" x2="310" y2="80" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <line x1="60" y1="150" x2="310" y2="150" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <line x1="60" y1="220" x2="310" y2="220" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Rectangles (semi-transparent) -->
  <!-- R1 [0,0,2,2]: blue -->
  <rect x="60" y="150" width="140" height="140" fill="#e8f0fe" fill-opacity="0.5" stroke="#446688" stroke-width="1.8" rx="2" filter="url(#rough2)"/>
  <text x="85" y="230" font-size="11" fill="#446688" font-weight="bold">R1</text>

  <!-- R2 [1,0,2,3]: green -->
  <rect x="130" y="80" width="70" height="210" fill="#e6f4ea" fill-opacity="0.45" stroke="#4a7a3a" stroke-width="1.8" rx="2" filter="url(#rough2)"/>
  <text x="152" y="100" font-size="11" fill="#4a7a3a" font-weight="bold">R2</text>

  <!-- R3 [1,0,3,1]: orange -->
  <rect x="130" y="220" width="140" height="70" fill="#fff8e1" fill-opacity="0.55" stroke="#d6a040" stroke-width="1.8" rx="2" filter="url(#rough2)"/>
  <text x="230" y="262" font-size="11" fill="#d6a040" font-weight="bold">R3</text>

  <!-- Sweep line at x=1.5 -->
  <line x1="165" y1="62" x2="165" y2="295" stroke="#b85450" stroke-width="2" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="165" y="56" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">扫描线</text>

  <!-- sweep direction arrow -->
  <path d="M 90 44 L 250 44" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="170" y="38" text-anchor="middle" font-size="9" fill="#b85450">扫描方向</text>

  <!-- Axis labels -->
  <text x="52" y="84" text-anchor="end" font-size="10" fill="#888">3</text>
  <text x="52" y="154" text-anchor="end" font-size="10" fill="#888">2</text>
  <text x="52" y="224" text-anchor="end" font-size="10" fill="#888">1</text>
  <text x="52" y="294" text-anchor="end" font-size="10" fill="#888">0</text>
  <text x="60" y="306" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="130" y="306" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="200" y="306" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="270" y="306" text-anchor="middle" font-size="10" fill="#888">3</text>

  <!-- ===== Right: y-band count array ===== -->
  <text x="460" y="56" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">y 条带计数 (扫描线处)</text>

  <!-- Band [2,3): count=1 -->
  <rect x="360" y="80" width="200" height="70" fill="#e6f4ea" fill-opacity="0.65" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="108" font-size="11" fill="#333">条带 [2, 3)</text>
  <text x="380" y="128" font-size="11" fill="#4a7a3a" font-weight="bold">count = 1  ✓ 覆盖</text>

  <!-- Band [1,2): count=2 -->
  <rect x="360" y="150" width="200" height="70" fill="#e8f0fe" fill-opacity="0.65" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="178" font-size="11" fill="#333">条带 [1, 2)</text>
  <text x="380" y="198" font-size="11" fill="#446688" font-weight="bold">count = 2  ✓ 覆盖</text>

  <!-- Band [0,1): count=3 -->
  <rect x="360" y="220" width="200" height="70" fill="#fff8e1" fill-opacity="0.65" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="248" font-size="11" fill="#333">条带 [0, 1)</text>
  <text x="380" y="268" font-size="11" fill="#d6a040" font-weight="bold">count = 3  ✓ 覆盖</text>

  <!-- Summary box -->
  <rect x="340" y="310" width="240" height="56" fill="#fce4ec" fill-opacity="0.65" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="460" y="332" text-anchor="middle" font-size="11" fill="#444">覆盖 y 长度 = 1+1+1 = 3</text>
  <text x="460" y="352" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">面积 += 3 × Δx</text>

  <!-- Left side note -->
  <rect x="40" y="320" width="270" height="46" fill="#e8f0fe" fill-opacity="0.5" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="175" y="340" text-anchor="middle" font-size="10" fill="#444">两条 x 事件之间，活跃集不变</text>
  <text x="175" y="356" text-anchor="middle" font-size="10" fill="#444">→ 覆盖 y 长度恒定，面积 = y_len × Δx</text>
</svg>
