<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    资产总量 = 每行求和，最富有客户 = max(行和)
  </text>

  <!-- column headers -->
  <text x="142" y="64" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">银行0</text>
  <text x="202" y="64" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">银行1</text>
  <text x="305" y="64" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">资产总量</text>

  <!-- Row 0: 1, 5 -> 6 -->
  <text x="48" y="103" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">客户0</text>
  <rect x="118" y="80" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="103" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="178" y="80" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="103" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <path d="M232,97 L278,97" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="238" y="90" font-size="10" fill="#888" filter="url(#rough2)">sum</text>
  <rect x="282" y="80" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="306" y="103" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">6</text>

  <!-- Row 1: 7, 3 -> 10 (max) -->
  <text x="48" y="153" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">客户1</text>
  <rect x="118" y="130" width="48" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="142" y="153" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>
  <rect x="178" y="130" width="48" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="202" y="153" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <path d="M232,147 L278,147" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="282" y="130" width="48" height="34" fill="#fff8e1" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="306" y="153" text-anchor="middle" font-size="15" font-weight="bold" fill="#b85450" filter="url(#rough2)">10</text>

  <!-- Row 2: 3, 5 -> 8 -->
  <text x="48" y="203" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">客户2</text>
  <rect x="118" y="180" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="203" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="178" y="180" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="203" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>
  <path d="M232,197 L278,197" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="282" y="180" width="48" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="306" y="203" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">8</text>

  <!-- max callout -->
  <path d="M336,147 L372,147" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="378" y="131" width="116" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="436" y="153" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">max = 10 ✓</text>

  <!-- bottom insight -->
  <rect x="60" y="250" width="400" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="273" text-anchor="middle" font-size="12" fill="#5a4a1a" filter="url(#rough2)">
    一个客户 = 一行；行和 = 资产总量；
  </text>
  <text x="260" y="293" text-anchor="middle" font-size="12" fill="#5a4a1a" filter="url(#rough2)">
    取所有行和的最大值即答案（map-sum → reduce-max）
  </text>
</svg>
