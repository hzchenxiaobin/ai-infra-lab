<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 340"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="340" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">map：每个元素独立变换，一一映射（n → n）</text>

  <!-- input row -->
  <text x="50" y="82" font-size="13" fill="#4a7a3a" filter="url(#rough2)">arr[i]</text>
  <rect x="109" y="64" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="133" y="85" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="229" y="64" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="253" y="85" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="349" y="64" width="48" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="373" y="85" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <text x="173" y="55" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i=0</text>
  <text x="293" y="55" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i=1</text>
  <text x="413" y="55" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i=2</text>

  <!-- parallel down arrows with fn labels -->
  <path d="M133,97 L133,168" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M253,97 L253,168" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M373,97 L373,168" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="108" y="112" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="133" y="128" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">fn</text>
  <rect x="228" y="112" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="253" y="128" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">fn</text>
  <rect x="348" y="112" width="50" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="373" y="128" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">fn</text>

  <!-- output row -->
  <text x="50" y="192" font-size="13" fill="#446688" filter="url(#rough2)">res[i]</text>
  <rect x="109" y="174" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="133" y="195" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="229" y="174" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="253" y="195" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="349" y="174" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="373" y="195" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>

  <!-- annotation box: independence -->
  <rect x="430" y="100" width="135" height="100" fill="none" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="5,3" rx="6" filter="url(#rough2)"/>
  <text x="497" y="124" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">各元素互不依赖</text>
  <text x="497" y="142" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">天然可并行</text>
  <text x="497" y="162" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">fn(1)=2</text>
  <text x="497" y="178" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">fn(2)=3</text>
  <text x="497" y="194" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">fn(3)=4</text>

  <!-- contrast with reduce -->
  <rect x="40" y="240" width="500" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="266" font-size="12" fill="#333" filter="url(#rough2)">vs reduce (2626)：</text>
  <text x="60" y="286" font-size="11" fill="#888" filter="url(#rough2)">reduce：n → 1，累加器串行依赖，每步依赖上一步</text>
  <text x="60" y="306" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">map：n → n，长度不变，各元素独立映射，天然可并行</text>
</svg>
