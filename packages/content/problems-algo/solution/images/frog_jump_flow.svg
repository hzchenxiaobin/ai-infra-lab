<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">前向 DP：从每块石头向可达石头传播跳距</text>

  <!-- init -->
  <rect x="160" y="48" width="260" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="68" text-anchor="middle" font-size="12" fill="#333">建 pos→idx 映射；dp[0]={0}</text>
  <text x="290" y="84" text-anchor="middle" font-size="10" fill="#888">起点「上次跳 0」→ 首跳必为 1</text>

  <path d="M 290 92 L 290 108" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- outer loop diamond -->
  <polygon points="290,110 390,152 290,194 190,152" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="150" text-anchor="middle" font-size="12" fill="#333">还有未处理石头 i？</text>
  <text x="290" y="168" text-anchor="middle" font-size="10" fill="#888">i = 0 … n−1</text>

  <path d="M 290 194 L 290 210" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="206" font-size="10" fill="#82b366">是</text>

  <!-- process box with pseudocode -->
  <rect x="100" y="214" width="380" height="116" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="120" y="238" font-size="12" fill="#333" font-weight="bold">for k in dp[i]:</text>
  <text x="140" y="258" font-size="11" fill="#333">→ for step in {k−1, k, k+1}, step &gt; 0:</text>
  <text x="160" y="278" font-size="11" fill="#333">→ if stones[i]+step 是石头 j:</text>
  <text x="180" y="298" font-size="11" fill="#4a7a3a" font-weight="bold">→ dp[j].add(step)   ← 传播跳距</text>
  <text x="120" y="320" font-size="10" fill="#888">dp[i] 大小 ≤ i，总状态 O(n²)</text>

  <!-- feedback to diamond (left side) -->
  <path d="M 100 272 L 70 272 L 70 152 L 190 152" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="78" y="266" font-size="10" fill="#888">继续下一块</text>

  <!-- 否 -> end (right side) -->
  <path d="M 390 152 L 470 152 L 470 232" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="398" y="144" font-size="10" fill="#b85450">否</text>
  <rect x="410" y="236" width="120" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="470" y="256" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">返回</text>
  <text x="470" y="272" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">dp[n−1] 非空</text>

  <!-- bottom notes -->
  <text x="290" y="372" text-anchor="middle" font-size="11" fill="#888">状态 = (石头位置, 到达该石头的跳距)；跳距随位置前向传播，不回看</text>
  <text x="290" y="392" text-anchor="middle" font-size="11" fill="#888">首跳强制 1 ⇒ 由 dp[0]={0} 自然导出 dp[1]={1}</text>
</svg>
