<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">堂兄弟节点 = 同深度 ∧ 不同父</text>

  <!-- 左：示例2 [1,2,3,null,4,null,5] x=5,y=4 → true -->
  <text x="150" y="54" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">示例2：x=5, y=4 → true</text>

  <line x1="142" y1="95" x2="124" y2="128" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="158" y1="95" x2="176" y2="128" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="150" cy="82" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="86" text-anchor="middle" font-size="11" fill="#333">1</text>

  <line x1="126" y1="152" x2="138" y2="184" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="190" y1="152" x2="202" y2="184" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="120" cy="140" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="120" y="144" text-anchor="middle" font-size="11" fill="#333">2</text>
  <circle cx="184" cy="140" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="184" y="144" text-anchor="middle" font-size="11" fill="#333">3</text>

  <circle cx="142" cy="196" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="142" y="200" text-anchor="middle" font-size="11" fill="#333">4</text>
  <circle cx="206" cy="196" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="206" y="200" text-anchor="middle" font-size="11" fill="#333">5</text>

  <text x="34" y="86" font-size="9" fill="#999">depth 0</text>
  <text x="34" y="144" font-size="9" fill="#999">depth 1</text>
  <text x="34" y="200" font-size="9" fill="#999">depth 2</text>

  <text x="120" y="162" text-anchor="middle" font-size="9" fill="#d6a040">父=2</text>
  <text x="184" y="162" text-anchor="middle" font-size="9" fill="#d6a040">父=3</text>

  <text x="150" y="230" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">同层(2) + 异父(2≠3) ✓</text>

  <!-- 右：示例3 [1,2,3,null,4] x=2,y=3 → false -->
  <text x="415" y="54" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">示例3：x=2, y=3 → false</text>

  <line x1="407" y1="95" x2="389" y2="128" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="423" y1="95" x2="441" y2="128" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="415" cy="82" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="415" y="86" text-anchor="middle" font-size="11" fill="#333">1</text>

  <line x1="386" y1="152" x2="398" y2="184" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="385" cy="140" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="385" y="144" text-anchor="middle" font-size="11" fill="#333">2</text>
  <circle cx="449" cy="140" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="449" y="144" text-anchor="middle" font-size="11" fill="#333">3</text>

  <circle cx="402" cy="196" r="12" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.4" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="402" y="200" text-anchor="middle" font-size="10" fill="#999">4</text>

  <text x="385" y="162" text-anchor="middle" font-size="9" fill="#d6a040">父=1</text>
  <text x="449" y="162" text-anchor="middle" font-size="9" fill="#d6a040">父=1</text>

  <path d="M 385 126 Q 400 110 410 96" fill="none" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 449 126 Q 432 110 420 96" fill="none" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="415" y="230" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">同层(1) + 同父(1=1) ✗</text>

  <!-- 说明框 -->
  <rect x="40" y="262" width="480" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="286" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">核心定义</text>
  <text x="60" y="308" font-size="11" fill="#555">堂兄弟(cousins) ⟺ depth(x) == depth(y) 且 parent(x) ≠ parent(y)</text>
  <text x="60" y="328" font-size="11" fill="#4a7a3a">只需一次遍历同时记录 x、y 的「深度 + 父节点」，两值都拿到即可比较</text>
  <text x="60" y="348" font-size="11" fill="#b85450">注意：根节点深度 0 且无父节点；题给 x、y 为不同节点、值唯一</text>
</svg>
