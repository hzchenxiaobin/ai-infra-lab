<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：hours = [12, 12, 30, 24, 24]</text>

  <!-- 表头 -->
  <rect x="15" y="40" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="32" y="59" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">j</text>
  <rect x="49" y="40" width="66" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="82" y="59" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">hours[j]</text>
  <rect x="115" y="40" width="58" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="144" y="59" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">r=h%24</text>
  <rect x="173" y="40" width="96" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="221" y="59" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">补集(24−r)%24</text>
  <rect x="269" y="40" width="92" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="315" y="59" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">查表 cnt[补集]</text>
  <rect x="361" y="40" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="383" y="59" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">ans</text>
  <rect x="405" y="40" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="455" y="59" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">入桶后</text>

  <!-- 行 0 -->
  <rect x="15" y="70" width="34" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="32" y="90" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="49" y="70" width="66" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="82" y="90" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">12</text>
  <rect x="115" y="70" width="58" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="144" y="90" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">12</text>
  <rect x="173" y="70" width="96" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="221" y="90" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">12</text>
  <rect x="269" y="70" width="92" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="315" y="90" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="361" y="70" width="44" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="383" y="90" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="405" y="70" width="100" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="455" y="90" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">cnt[12]=1</text>

  <!-- 行 1（命中） -->
  <rect x="15" y="102" width="34" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="32" y="122" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">1</text>
  <rect x="49" y="102" width="66" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="82" y="122" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">12</text>
  <rect x="115" y="102" width="58" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="144" y="122" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">12</text>
  <rect x="173" y="102" width="96" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="221" y="122" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">12</text>
  <rect x="269" y="102" width="92" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="315" y="122" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1 ✓</text>
  <rect x="361" y="102" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="383" y="122" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="405" y="102" width="100" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="455" y="122" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">cnt[12]=2</text>

  <!-- 行 2 -->
  <rect x="15" y="134" width="34" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="32" y="154" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="49" y="134" width="66" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="82" y="154" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">30</text>
  <rect x="115" y="134" width="58" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="144" y="154" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">6</text>
  <rect x="173" y="134" width="96" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="221" y="154" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">18</text>
  <rect x="269" y="134" width="92" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="315" y="154" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="361" y="134" width="44" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="383" y="154" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="405" y="134" width="100" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="455" y="154" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">cnt[6]=1</text>

  <!-- 行 3 -->
  <rect x="15" y="166" width="34" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="32" y="186" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">3</text>
  <rect x="49" y="166" width="66" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="82" y="186" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">24</text>
  <rect x="115" y="166" width="58" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="144" y="186" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="173" y="166" width="96" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="221" y="186" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="269" y="166" width="92" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="315" y="186" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="361" y="166" width="44" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="383" y="186" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="405" y="166" width="100" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="455" y="186" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">cnt[0]=1</text>

  <!-- 行 4（命中） -->
  <rect x="15" y="198" width="34" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="32" y="218" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">4</text>
  <rect x="49" y="198" width="66" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="82" y="218" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">24</text>
  <rect x="115" y="198" width="58" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="144" y="218" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">0</text>
  <rect x="173" y="198" width="96" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="221" y="218" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">0</text>
  <rect x="269" y="198" width="92" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="315" y="218" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1 ✓</text>
  <rect x="361" y="198" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="383" y="218" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="405" y="198" width="100" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="455" y="218" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">cnt[0]=2</text>

  <!-- 结论框 -->
  <rect x="60" y="252" width="400" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="276" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = 2 ✓ —— 对应下标对 (0, 1) 和 (3, 4)</text>

  <!-- 两个注释框 -->
  <rect x="24" y="308" width="230" height="66" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="139" y="330" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">j=1 命中：r=12 自配对</text>
  <text x="139" y="348" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">查到 1 个此前的 12</text>
  <text x="139" y="364" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">（12 + 12 = 24 ✓）</text>

  <rect x="266" y="308" width="230" height="66" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="381" y="330" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">j=4 命中：r=0 自配对</text>
  <text x="381" y="348" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">24 mod 24 = 0，补集也是 0</text>
  <text x="381" y="364" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">（24 + 24 = 48 = 2 天 ✓）</text>
</svg>
