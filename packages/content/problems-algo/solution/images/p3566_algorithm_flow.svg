<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：位掩码枚举 + 乘积剪枝</text>

  <!-- 右上说明框 -->
  <rect x="340" y="30" width="162" height="52" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="421" y="49" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">n ≤ 12 ⟹ 子集 2¹² = 4096 个</text>
  <text x="421" y="68" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">O(2ⁿ·n) ≈ 5×10⁴ 次乘法</text>

  <!-- ① 总乘积 -->
  <rect x="95" y="28" width="210" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="44" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① total = ∏ nums[i]</text>
  <text x="200" y="59" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">(C++ 用 __int128 防溢出)</text>
  <path d="M200,66 L200,80" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 判 total -->
  <polygon points="200,80 290,116 200,152 110,116" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="121" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">total == target² ?</text>
  <path d="M290,116 L336,116" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="312" y="108" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="338" y="98" width="104" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="390" y="112" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">返回 false</text>
  <text x="390" y="127" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">(乘积对不上)</text>
  <path d="M200,152 L200,166" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="209" y="163" font-size="11" fill="#446688" filter="url(#rough2)">是</text>

  <!-- ② mask -->
  <rect x="125" y="168" width="150" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="186" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② mask = 1（非空）</text>
  <path d="M200,196 L200,210" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 判 mask -->
  <polygon points="200,210 290,246 200,282 110,246" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="243" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">mask &lt; 2ⁿ − 1 ?</text>
  <text x="200" y="259" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">(补集也非空)</text>
  <path d="M290,246 L336,246" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="312" y="238" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="338" y="228" width="104" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="390" y="242" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">返回 false</text>
  <text x="390" y="257" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">(枚举完仍无解)</text>
  <path d="M200,282 L200,296" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="209" y="293" font-size="11" fill="#446688" filter="url(#rough2)">是</text>

  <!-- ③ 累乘 -->
  <rect x="85" y="298" width="230" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="314" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ prod = 1，逐位累乘</text>
  <text x="200" y="331" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">prod ×= nums[i]，一旦 &gt; target 即 break</text>
  <path d="M200,338 L200,352" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 判 prod -->
  <polygon points="200,352 285,382 200,412 115,382" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="200" y="387" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">prod == target ?</text>
  <path d="M285,382 L336,382" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="310" y="374" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="338" y="362" width="126" height="42" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="401" y="379" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">返回 true ✓</text>
  <text x="401" y="395" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">(补集自动 = target)</text>

  <!-- 否 → mask++ → 回边 -->
  <path d="M115,382 L96,382" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="106" y="373" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">否</text>
  <rect x="20" y="364" width="72" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="386" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">mask++</text>
  <path d="M56,364 L56,246 L106,246" fill="none" stroke="#446688" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="64" y="280" font-size="10" fill="#446688" filter="url(#rough2)">下一个子集</text>
</svg>
