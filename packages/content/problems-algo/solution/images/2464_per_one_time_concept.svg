<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 322" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="322" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：每个 1 的到达时间 = max(上一个 1 的时间 + 1, 其左侧 0 的个数)</text>

  <!-- Swap mechanism box -->
  <rect x="40" y="40" width="480" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="60" y="62" font-size="12" fill="#333" font-weight="bold">一秒内所有 "01" 同时原地互换 → "10"</text>
  <text x="60" y="80" font-size="11" fill="#555">即每个 1 每秒至多向左跨过 1 个 0，最终 1 全聚左、0 全聚右</text>
  <!-- tiny swap visual on right -->
  <g font-size="13" text-anchor="middle" fill="#333">
    <rect x="386" y="50" width="22" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="397" y="67">0</text>
    <rect x="410" y="50" width="22" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="421" y="67">1</text>
    <path d="M 442 62 L 472 62" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
    <rect x="478" y="50" width="22" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="489" y="67">1</text>
    <rect x="502" y="50" width="22" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="513" y="67">0</text>
  </g>

  <!-- string example s = 0110101 -->
  <text x="40" y="132" font-size="12" fill="#888">s =</text>
  <g font-size="14" text-anchor="middle" fill="#333">
    <rect x="150" y="118" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="169" y="139">0</text>
    <rect x="188" y="118" width="38" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="207" y="139">1</text>
    <rect x="226" y="118" width="38" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="245" y="139">1</text>
    <rect x="264" y="118" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="283" y="139">0</text>
    <rect x="302" y="118" width="38" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="321" y="139">1</text>
    <rect x="340" y="118" width="38" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="359" y="139">0</text>
    <rect x="378" y="118" width="38" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="397" y="139">1</text>
  </g>

  <!-- thin connectors from each 1 down to its box -->
  <g stroke="#bbb" stroke-width="1" stroke-dasharray="2,2">
    <path d="M 207 150 L 207 160" filter="url(#rough2)"/>
    <path d="M 245 150 L 245 160" filter="url(#rough2)"/>
    <path d="M 321 150 L 321 160" filter="url(#rough2)"/>
    <path d="M 397 150 L 397 160" filter="url(#rough2)"/>
  </g>

  <!-- per-1 annotation boxes (only under the 1s): z = 左侧 0 数, t = 到达时间 -->
  <g font-size="10.5" text-anchor="middle">
    <rect x="188" y="160" width="38" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="207" y="175" fill="#555">z=1</text>
    <text x="207" y="191" fill="#b85450" font-weight="bold">t=1</text>

    <rect x="226" y="160" width="38" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="245" y="175" fill="#555">z=1</text>
    <text x="245" y="191" fill="#b85450" font-weight="bold">t=2</text>

    <rect x="302" y="160" width="38" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="321" y="175" fill="#555">z=2</text>
    <text x="321" y="191" fill="#b85450" font-weight="bold">t=3</text>

    <rect x="378" y="160" width="38" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
    <text x="397" y="175" fill="#555">z=3</text>
    <text x="397" y="191" fill="#b85450" font-weight="bold">t=4</text>
  </g>

  <!-- formula box -->
  <rect x="40" y="214" width="480" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="234" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">t_i = max(t_{i-1} + 1, z_i)，z_i = 第 i 个 1 左侧 0 的个数</text>
  <text x="280" y="251" text-anchor="middle" font-size="10.5" fill="#555">z_i 是下界（每秒至多跨 1 个 0）；t_{i-1}+1 是「相邻 1 成串，后者要等前者先走 1 秒」</text>

  <!-- answer box -->
  <rect x="40" y="270" width="480" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="292" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">答案 = max_i t_i（= 最后一个 1 的 t）= 4</text>
</svg>
