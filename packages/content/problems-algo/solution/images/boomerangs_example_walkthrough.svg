<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：points = [[0,0],[1,0],[2,0]]</text>

  <!-- coordinate axis: three points on a line -->
  <text x="40" y="58" font-size="12" fill="#446688" font-weight="bold">点的位置（x 轴）</text>
  <line x1="60" y1="80" x2="300" y2="80" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- point 0 -->
  <circle cx="80" cy="80" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="80" y="66" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">0</text>
  <text x="80" y="100" text-anchor="middle" font-size="9" fill="#888">(0,0)</text>
  <!-- point 1 -->
  <circle cx="170" cy="80" r="7" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="170" y="66" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">1</text>
  <text x="170" y="100" text-anchor="middle" font-size="9" fill="#888">(1,0)</text>
  <!-- point 2 -->
  <circle cx="260" cy="80" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="66" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">2</text>
  <text x="260" y="100" text-anchor="middle" font-size="9" fill="#888">(2,0)</text>

  <!-- divider -->
  <line x1="40" y1="116" x2="540" y2="116" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <!-- center = 0 -->
  <rect x="40" y="128" width="500" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="148" font-size="11" fill="#446688" font-weight="bold">中心 i = 0</text>
  <text x="56" y="166" font-size="10.5" fill="#333">→ dist(0,1) = 1²+0² = 1</text>
  <text x="56" y="180" font-size="10.5" fill="#333">→ dist(0,2) = 2²+0² = 4</text>
  <!-- hash table mini -->
  <rect x="300" y="138" width="100" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="350" y="154" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">哈希表</text>
  <text x="312" y="170" font-size="9.5" fill="#333">1→1</text>
  <text x="370" y="170" font-size="9.5" fill="#333">4→1</text>
  <text x="420" y="160" font-size="11" fill="#888">每组 m=1</text>
  <text x="420" y="176" font-size="11" fill="#b85450" font-weight="bold">贡献 0</text>

  <!-- center = 1 (the key one) -->
  <rect x="40" y="196" width="500" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="56" y="216" font-size="11" fill="#d6a040" font-weight="bold">中心 i = 1 ★</text>
  <text x="56" y="234" font-size="10.5" fill="#333">→ dist(1,0) = (−1)²+0² = 1</text>
  <text x="56" y="250" font-size="10.5" fill="#333">→ dist(1,2) = 1²+0² = 1</text>
  <text x="56" y="264" font-size="10.5" fill="#d6a040" font-weight="bold">两个距离相同！</text>
  <!-- hash table mini -->
  <rect x="300" y="210" width="100" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="350" y="226" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">哈希表</text>
  <text x="350" y="248" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1 → 2</text>
  <text x="420" y="232" font-size="11" fill="#333">m = 2</text>
  <text x="420" y="250" font-size="12" fill="#b85450" font-weight="bold">2×1 = 2</text>
  <!-- boomerang tuples -->
  <text x="420" y="266" font-size="9.5" fill="#888">(1,0,2) (1,2,0)</text>

  <!-- center = 2 -->
  <rect x="40" y="280" width="500" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="300" font-size="11" fill="#446688" font-weight="bold">中心 i = 2</text>
  <text x="56" y="318" font-size="10.5" fill="#333">→ dist(2,0) = (−2)²+0² = 4</text>
  <text x="56" y="332" font-size="10.5" fill="#333">→ dist(2,1) = (−1)²+0² = 1</text>
  <rect x="300" y="290" width="100" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="350" y="306" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">哈希表</text>
  <text x="312" y="322" font-size="9.5" fill="#333">4→1</text>
  <text x="370" y="322" font-size="9.5" fill="#333">1→1</text>
  <text x="420" y="312" font-size="11" fill="#888">每组 m=1</text>
  <text x="420" y="328" font-size="11" fill="#b85450" font-weight="bold">贡献 0</text>

  <!-- total -->
  <rect x="120" y="354" width="340" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="378" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">答案 = 0 + 2 + 0 = 2</text>
  <text x="290" y="396" text-anchor="middle" font-size="10.5" fill="#555">仅中心 1 周围有两个等距点，贡献全部回旋镖</text>

  <!-- footer -->
  <text x="290" y="428" text-anchor="middle" font-size="10" fill="#888">三点共线时，中间点天然两侧等距 → 必为回旋镖中心</text>
</svg>
