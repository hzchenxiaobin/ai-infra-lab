<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [2,4,8,2], maxOps = 4</text>

  <!-- Input row -->
  <text x="30" y="52" font-size="11" fill="#888">初始数组:</text>
  <rect x="90" y="38" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="108" y="56" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="128" y="38" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="146" y="56" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="166" y="38" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="184" y="56" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">8</text>
  <rect x="204" y="38" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="222" y="56" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <text x="250" y="56" font-size="11" fill="#888">max(nums) = 8 → hi = 8, lo = 1</text>

  <!-- Table header -->
  <rect x="30" y="76" width="60" height="24" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="92" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">轮次</text>
  <rect x="92" y="76" width="70" height="24" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="127" y="92" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">[lo, hi]</text>
  <rect x="164" y="76" width="50" height="24" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="189" y="92" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">mid</text>
  <rect x="216" y="76" width="200" height="24" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="316" y="92" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">ops = Σ(n−1)/mid</text>
  <rect x="418" y="76" width="120" height="24" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="478" y="92" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">判定 &amp; 动作</text>

  <!-- Row 1: mid=4 -->
  <rect x="30" y="102" width="60" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="120" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="92" y="102" width="70" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="127" y="120" text-anchor="middle" font-size="11" fill="#333">[1, 8]</text>
  <rect x="164" y="102" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="189" y="120" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <rect x="216" y="102" width="200" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="316" y="120" text-anchor="middle" font-size="10" fill="#555">1/4+3/4+7/4+1/4 = 0+0+1+0 = 1</text>
  <rect x="418" y="102" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="478" y="120" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓ ans=4, hi=3</text>

  <!-- Row 2: mid=2 -->
  <rect x="30" y="132" width="60" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="150" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="92" y="132" width="70" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="127" y="150" text-anchor="middle" font-size="11" fill="#333">[1, 3]</text>
  <rect x="164" y="132" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="189" y="150" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="216" y="132" width="200" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="316" y="150" text-anchor="middle" font-size="10" fill="#555">1/2+3/2+7/2+1/2 = 0+1+3+0 = 4</text>
  <rect x="418" y="132" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="478" y="150" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓ ans=2, hi=1</text>

  <!-- Row 3: mid=1 -->
  <rect x="30" y="162" width="60" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="180" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="92" y="162" width="70" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="127" y="180" text-anchor="middle" font-size="11" fill="#333">[1, 1]</text>
  <rect x="164" y="162" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="189" y="180" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="216" y="162" width="200" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="316" y="180" text-anchor="middle" font-size="10" fill="#555">1+3+7+1 = 12</text>
  <rect x="418" y="162" width="120" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="478" y="180" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✗ lo=2</text>

  <!-- Row 4: end -->
  <rect x="30" y="192" width="60" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="60" y="210" text-anchor="middle" font-size="11" fill="#333">结束</text>
  <rect x="92" y="192" width="70" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="127" y="210" text-anchor="middle" font-size="11" fill="#333">lo&gt;hi</text>
  <rect x="164" y="192" width="350" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="339" y="210" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">返回 ans = 2</text>

  <!-- Detail: ops calculation for mid=2 -->
  <path d="M 280 224 L 280 240" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="244" width="480" height="140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="266" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">关键轮次详解：mid = 2 时的分拆方案</text>

  <!-- nums[0]=2: already ≤ 2, no op -->
  <rect x="56" y="280" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="76" y="298" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="76" y="318" text-anchor="middle" font-size="9" fill="#888">≤2, 0 次</text>

  <!-- nums[1]=4: split to [2,2], 1 op -->
  <rect x="110" y="280" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="298" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <path d="M 130 308 L 130 322 L 105 330 L 105 344" stroke="#d6a040" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 130 322 L 155 330 L 155 344" stroke="#d6a040" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="85" y="346" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="105" y="361" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="135" y="346" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="155" y="361" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="130" y="318" text-anchor="middle" font-size="9" fill="#888" dx="20">→1 次</text>

  <!-- nums[2]=8: split to [2,2,2,2], 3 ops -->
  <rect x="200" y="280" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="298" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">8</text>
  <path d="M 220 308 L 220 322" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="180" y="326" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="200" y="341" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="225" y="326" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="245" y="341" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="180" y="352" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="200" y="367" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="225" y="352" width="40" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="245" y="367" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="220" y="318" text-anchor="middle" font-size="9" fill="#888" dx="30">→3 次</text>

  <!-- nums[3]=2: already ≤ 2, no op -->
  <rect x="290" y="280" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="298" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="310" y="318" text-anchor="middle" font-size="9" fill="#888">≤2, 0 次</text>

  <!-- Summary -->
  <rect x="360" y="280" width="140" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="302" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">总操作数</text>
  <text x="430" y="322" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0 + 1 + 3 + 0 = 4</text>
  <text x="430" y="340" text-anchor="middle" font-size="10" fill="#666">≤ maxOps = 4 ✓</text>
</svg>
