<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：位置独立 + 环上只有两个方向</text>
  <text x="260" y="44" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">把 a→b 的两种代价画在字母环上（示例 1 的下标 0：a → b）</text>

  <!-- 字母环 -->
  <circle cx="158" cy="208" r="106" fill="none" stroke="#bbb" stroke-width="1.4" filter="url(#rough2)"/>

  <!-- 普通字母 -->
  <text x="207.3" y="118.1" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">c</text>
  <text x="228.3" y="132.7" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">d</text>
  <text x="245.2" y="151.8" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">e</text>
  <text x="257.1" y="174.4" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">f</text>
  <text x="263.2" y="199.2" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">g</text>
  <text x="263.2" y="224.8" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">h</text>
  <text x="257.1" y="249.6" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">i</text>
  <text x="245.2" y="272.2" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">j</text>
  <text x="228.3" y="291.3" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">k</text>
  <text x="207.3" y="305.9" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">l</text>
  <text x="183.4" y="314.9" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">m</text>
  <text x="158.0" y="318.0" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">n</text>
  <text x="132.6" y="314.9" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">o</text>
  <text x="108.7" y="305.9" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">p</text>
  <text x="87.7" y="291.3" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">q</text>
  <text x="70.8" y="272.2" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">r</text>
  <text x="58.9" y="249.6" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">s</text>
  <text x="52.8" y="224.8" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">t</text>
  <text x="52.8" y="199.2" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">u</text>
  <text x="58.9" y="174.4" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">v</text>
  <text x="70.8" y="151.8" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">w</text>
  <text x="87.7" y="132.7" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">x</text>
  <text x="108.7" y="118.1" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">y</text>
  <text x="132.6" y="109.1" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">z</text>

  <!-- 起点 a、终点 b 高亮 -->
  <circle cx="158" cy="102" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="158" y="106.5" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <circle cx="183.4" cy="105.1" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="183.4" y="109.6" text-anchor="middle" font-size="12" fill="#a07830" font-weight="bold" filter="url(#rough2)">b</text>

  <!-- 绿色短弧：next 方向（顺时针 1 步） -->
  <path d="M 162.5 78.1 A 130 130 0 0 1 185.0 80.8" fill="none" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="233" y="66" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">next：走 1 步</text>
  <text x="233" y="80" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">nextCost[a] = 100</text>

  <!-- 红色长弧：prev 方向（逆时针 25 步） -->
  <path d="M 143.8 127.2 A 82 82 0 1 0 191.4 133.1" fill="none" stroke="#b85450" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="158" y="222" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">prev：走 25 步</text>
  <text x="158" y="238" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">prevCost[a]+prevCost[z]+…+prevCost[c] = 1</text>

  <!-- 环心结论 -->
  <rect x="96" y="160" width="124" height="0" fill="none"/>
  <text x="158" y="186" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">取较小者：</text>
  <text x="158" y="203" text-anchor="middle" font-size="12.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">min(100, 1) = 1</text>

  <!-- 右侧要点面板 -->
  <rect x="300" y="108" width="204" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="312" y="130" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 位置彼此独立</text>
  <text x="312" y="148" font-size="10" fill="#333" filter="url(#rough2)">总代价 = Σ min( s[i] → t[i] )</text>
  <text x="312" y="164" font-size="10" fill="#333" filter="url(#rough2)">每个下标单独求最优，互不牵连</text>
  <text x="312" y="182" font-size="9.5" fill="#666" filter="url(#rough2)">（操作只动一个下标）</text>

  <rect x="300" y="204" width="204" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="312" y="226" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">② 最优走法只有两种</text>
  <text x="312" y="244" font-size="10" fill="#333" filter="url(#rough2)">一路 next 顺时针，或</text>
  <text x="312" y="260" font-size="10" fill="#333" filter="url(#rough2)">一路 prev 逆时针；折返绕路不优</text>
  <text x="312" y="278" font-size="9.5" fill="#666" filter="url(#rough2)">（代价非负，回头路白花钱）</text>

  <rect x="300" y="300" width="204" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="312" y="322" font-size="11.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">③ 两种代价 = 环形区间和</text>
  <text x="312" y="340" font-size="10" fill="#333" filter="url(#rough2)">next 版：nextCost[a..b) 之和</text>
  <text x="312" y="356" font-size="10" fill="#333" filter="url(#rough2)">prev 版：prevCost[b+1..a] 之和</text>
  <text x="312" y="374" font-size="9.5" fill="#666" filter="url(#rough2)">（下标对 26 取模）→ 前缀和 O(1)</text>
</svg>
