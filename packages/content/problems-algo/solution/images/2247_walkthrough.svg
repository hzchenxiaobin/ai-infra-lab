<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#b85450" stroke-width="1.8"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n=5, k=3，两条最优路径均得 17</text>

  <!-- ===== Path 1: 0→1→4→3 ===== -->
  <text x="130" y="48" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">路径①  0 → 1 → 4 → 3</text>

  <!-- Step 0: start at city 0 -->
  <rect x="20" y="60" width="90" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="65" y="78" text-anchor="middle" font-size="10" fill="#555">mask=00001</text>
  <text x="65" y="94" text-anchor="middle" font-size="10" fill="#555">j=0</text>
  <text x="65" y="106" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">f=0</text>

  <!-- arrow -->
  <path d="M 110 85 L 128 85" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="119" y="78" text-anchor="middle" font-size="9" fill="#b85450">+4</text>

  <!-- Step 1: city 1 -->
  <rect x="130" y="60" width="90" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="175" y="78" text-anchor="middle" font-size="10" fill="#555">mask=00011</text>
  <text x="175" y="94" text-anchor="middle" font-size="10" fill="#555">j=1</text>
  <text x="175" y="106" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">f=4</text>

  <!-- arrow -->
  <path d="M 220 85 L 238 85" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="229" y="78" text-anchor="middle" font-size="9" fill="#b85450">+11</text>

  <!-- Step 2: city 4 -->
  <rect x="240" y="60" width="90" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="285" y="78" text-anchor="middle" font-size="10" fill="#555">mask=10011</text>
  <text x="285" y="94" text-anchor="middle" font-size="10" fill="#555">j=4</text>
  <text x="285" y="106" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">f=15</text>

  <!-- arrow -->
  <path d="M 330 85 L 348 85" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="339" y="78" text-anchor="middle" font-size="9" fill="#b85450">+2</text>

  <!-- Step 3: city 3 (answer) -->
  <rect x="350" y="60" width="100" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="400" y="78" text-anchor="middle" font-size="10" fill="#555">mask=11011</text>
  <text x="400" y="94" text-anchor="middle" font-size="10" fill="#555">j=3, popcnt=4</text>
  <text x="400" y="106" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">f=17 ★</text>

  <!-- ===== Path 2: 4→1→2→3 ===== -->
  <text x="130" y="138" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">路径②  4 → 1 → 2 → 3</text>

  <!-- Step 0: start at city 4 -->
  <rect x="20" y="150" width="90" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="65" y="168" text-anchor="middle" font-size="10" fill="#555">mask=10000</text>
  <text x="65" y="184" text-anchor="middle" font-size="10" fill="#555">j=4</text>
  <text x="65" y="196" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">f=0</text>

  <!-- arrow -->
  <path d="M 110 175 L 128 175" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="119" y="168" text-anchor="middle" font-size="9" fill="#446688">+11</text>

  <!-- Step 1: city 1 -->
  <rect x="130" y="150" width="90" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="175" y="168" text-anchor="middle" font-size="10" fill="#555">mask=10010</text>
  <text x="175" y="184" text-anchor="middle" font-size="10" fill="#555">j=1</text>
  <text x="175" y="196" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">f=11</text>

  <!-- arrow -->
  <path d="M 220 175 L 238 175" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="229" y="168" text-anchor="middle" font-size="9" fill="#446688">+3</text>

  <!-- Step 2: city 2 -->
  <rect x="240" y="150" width="90" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="285" y="168" text-anchor="middle" font-size="10" fill="#555">mask=10110</text>
  <text x="285" y="184" text-anchor="middle" font-size="10" fill="#555">j=2</text>
  <text x="285" y="196" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">f=14</text>

  <!-- arrow -->
  <path d="M 330 175 L 348 175" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="339" y="168" text-anchor="middle" font-size="9" fill="#446688">+3</text>

  <!-- Step 3: city 3 (answer) -->
  <rect x="350" y="150" width="100" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="400" y="168" text-anchor="middle" font-size="10" fill="#555">mask=11110</text>
  <text x="400" y="184" text-anchor="middle" font-size="10" fill="#555">j=3, popcnt=4</text>
  <text x="400" y="196" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">f=17 ★</text>

  <!-- ===== Summary ===== -->
  <rect x="30" y="220" width="460" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="240" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">两条路径的 popcount(mask) 均为 4 = k+1，均更新答案 ans = 17</text>
  <text x="260" y="258" text-anchor="middle" font-size="11" fill="#555">f[11011][3] = max(f[10011][4]+2, …) = 15+2 = 17</text>

  <!-- ===== Example 2 note ===== -->
  <rect x="30" y="282" width="460" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="302" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">示例 2：n=4, highways=[[0,1,3],[2,3,2]], k=2 → 返回 −1</text>
  <text x="260" y="320" text-anchor="middle" font-size="11" fill="#555">图有两个连通分量 {0,1} 和 {2,3}，各只有 1 条边</text>
  <text x="260" y="334" text-anchor="middle" font-size="11" fill="#555">无法走 2 条公路，所有 popcount==3 的状态 f 值均为 −∞</text>
</svg>
