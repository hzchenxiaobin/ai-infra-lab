<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [5, 1, 6] 的 8 个子集异或和</text>
  <text x="290" y="42" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">n = 3 → 2³ = 8 个子集（含空集）</text>

  <!-- Column headers -->
  <text x="130" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">子集</text>
  <text x="220" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">异或</text>
  <text x="330" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">子集</text>
  <text x="420" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">异或</text>

  <!-- ===== Left column: 4 subsets ===== -->
  <!-- {} -> 0 -->
  <rect x="70" y="80" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{ }  (空集)</text>
  <text x="210" y="100" text-anchor="middle" font-size="13" fill="#888" font-weight="bold" filter="url(#rough2)">0</text>

  <!-- {5} -> 5 -->
  <rect x="70" y="116" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="136" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{ 5 }</text>
  <text x="210" y="136" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5</text>

  <!-- {1} -> 1 -->
  <rect x="70" y="152" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="172" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{ 1 }</text>
  <text x="210" y="172" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- {6} -> 6 -->
  <rect x="70" y="188" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="208" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{ 6 }</text>
  <text x="210" y="208" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">6</text>

  <!-- ===== Right column: 4 subsets ===== -->
  <!-- {5,1} -> 4 -->
  <rect x="270" y="80" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="100" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{ 5, 1 }</text>
  <text x="410" y="100" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- {5,6} -> 3 -->
  <rect x="270" y="116" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="136" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{ 5, 6 }</text>
  <text x="410" y="136" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- {1,6} -> 7 -->
  <rect x="270" y="152" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="172" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{ 1, 6 }</text>
  <text x="410" y="172" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">7</text>

  <!-- {5,1,6} -> 2 -->
  <rect x="270" y="188" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="208" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">{ 5, 1, 6 }</text>
  <text x="410" y="208" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- divider -->
  <path d="M 40 232 L 540 232" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Sum -->
  <text x="130" y="252" font-size="11" fill="#555" filter="url(#rough2)">求和：0+5+1+6</text>
  <text x="330" y="252" font-size="11" fill="#555" filter="url(#rough2)">+4+3+7+2</text>
  <rect x="160" y="262" width="260" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="286" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">总和 = 28</text>

  <!-- divider -->
  <path d="M 40 312 L 540 312" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Formula verification -->
  <text x="290" y="334" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">公式验证</text>

  <!-- Step 1: OR -->
  <rect x="60" y="346" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="160" y="367" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">OR = 5 | 1 | 6 = 7</text>

  <!-- arrow -->
  <path d="M 260 363 L 290 363" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: 2^(n-1) -->
  <rect x="290" y="346" width="160" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="370" y="367" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2^(n−1) = 2² = 4</text>

  <!-- arrow down -->
  <path d="M 370 380 L 370 396" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Result -->
  <rect x="120" y="398" width="340" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="416" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">ans = OR × 2^(n−1) = 7 × 4</text>
  <text x="290" y="432" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">= 28  ✓ 与枚举一致</text>

  <!-- Legend -->
  <text x="290" y="458" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">绿=单元素子集  橙=双元素子集  红=全集  蓝=空集</text>
</svg>
