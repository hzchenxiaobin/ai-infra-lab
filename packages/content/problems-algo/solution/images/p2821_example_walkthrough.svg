<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">三个示例时间线演算</text>

  <!-- 示例 1：单个 resolve -->
  <text x="40" y="60" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">示例1 ms=50  resolve</text>
  <line x1="80" y1="85" x2="480" y2="85" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="485" y="89" font-size="10" fill="#999" filter="url(#rough2)">ms</text>
  <!-- 原始 resolve 30 -->
  <circle cx="170" cy="85" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="170" y="76" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">30</text>
  <text x="170" y="102" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">原始 resolve</text>
  <!-- delay -->
  <line x1="175" y1="85" x2="300" y2="85" stroke="#d6a040" stroke-width="3" filter="url(#rough2)"/>
  <!-- 延迟 resolve 80 -->
  <circle cx="310" cy="85" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="310" y="76" text-anchor="middle" font-size="9" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">80</text>
  <text x="310" y="102" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">延迟 resolve ✓</text>

  <!-- 示例 2：两个 resolve -->
  <text x="40" y="140" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">示例2 ms=70  两个 resolve</text>
  <line x1="80" y1="165" x2="480" y2="165" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="485" y="169" font-size="10" fill="#999" filter="url(#rough2)">ms</text>
  <!-- fn1: resolve 50 → 120 -->
  <circle cx="200" cy="165" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="156" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">50</text>
  <line x1="205" y1="165" x2="340" y2="165" stroke="#d6a040" stroke-width="3" filter="url(#rough2)"/>
  <circle cx="350" cy="165" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="350" y="156" text-anchor="middle" font-size="9" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">120</text>
  <!-- fn2: resolve 80 → 150 -->
  <circle cx="260" cy="178" r="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="258" y="195" text-anchor="middle" font-size="8" fill="#4a7a3a" filter="url(#rough2)">80</text>
  <line x1="264" y1="178" x2="394" y2="178" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="400" cy="178" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="195" text-anchor="middle" font-size="8" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">150</text>

  <!-- 示例 3：两个 reject -->
  <text x="40" y="225" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">示例3 ms=30  两个 reject</text>
  <line x1="80" y1="250" x2="480" y2="250" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="485" y="254" font-size="10" fill="#999" filter="url(#rough2)">ms</text>
  <!-- fn1: reject 20 → 50 -->
  <circle cx="150" cy="250" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="241" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">20</text>
  <line x1="155" y1="250" x2="260" y2="250" stroke="#d6a040" stroke-width="3" filter="url(#rough2)"/>
  <circle cx="270" cy="250" r="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="270" y="241" text-anchor="middle" font-size="9" font-weight="bold" fill="#b85450" filter="url(#rough2)">50</text>
  <text x="150" y="267" text-anchor="middle" font-size="8" fill="#b85450" filter="url(#rough2)">原始 reject</text>
  <text x="270" y="267" text-anchor="middle" font-size="8" fill="#b85450" filter="url(#rough2)">延迟 reject ✗</text>
  <!-- fn2: reject 100 → 130 -->
  <circle cx="330" cy="263" r="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="330" y="280" text-anchor="middle" font-size="8" fill="#b85450" filter="url(#rough2)">100</text>
  <line x1="334" y1="263" x2="394" y2="263" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="400" cy="263" r="5" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="280" text-anchor="middle" font-size="8" font-weight="bold" fill="#b85450" filter="url(#rough2)">130</text>

  <!-- 汇总表 -->
  <rect x="40" y="300" width="480" height="105" fill="none" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="55" y="322" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">汇总</text>

  <text x="55" y="342" font-size="10" fill="#4a7a3a" filter="url(#rough2)">示例1：1 个 fn，resolve@30 → 延迟@30+50=80ms</text>
  <text x="55" y="360" font-size="10" fill="#4a7a3a" filter="url(#rough2)">示例2：2 个 fn，resolve@50→120, resolve@80→150</text>
  <text x="55" y="378" font-size="10" fill="#b85450" filter="url(#rough2)">示例3：2 个 fn，reject@20→50, reject@100→130</text>
  <text x="55" y="396" font-size="10" fill="#d6a040" filter="url(#rough2)">公式：延迟 settle 时间 = 原始 settle 时间 + ms</text>
</svg>
