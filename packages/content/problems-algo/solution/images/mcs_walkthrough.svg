<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="none" stroke="#4a7a3a" stroke-width="1.8"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="none" stroke="#b85450" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 的状压 DP 演算（m=3，节点 = mask (dp值)，边 = 配对 + 得分）</text>

  <!-- level labels -->
  <text x="30" y="72" font-size="11" fill="#888">配了0人</text>
  <text x="30" y="152" font-size="11" fill="#888">配了1人</text>
  <text x="30" y="244" font-size="11" fill="#888">配了2人</text>
  <text x="30" y="344" font-size="11" fill="#888">配了3人</text>

  <!-- Level 0: 000 (optimal path start) -->
  <rect x="240" y="52" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="78" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">000 (0)</text>

  <!-- Level 1: 001, 010, 100 -->
  <rect x="80" y="132" width="80" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="120" y="158" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">001 (2)</text>
  <rect x="240" y="132" width="80" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="158" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">010 (0)</text>
  <rect x="400" y="132" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="440" y="158" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">100 (3)</text>

  <!-- edges level0 -> level1 -->
  <path d="M 250 92 L 140 130" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="158" y="112" font-size="10" fill="#446688">S0→M0 +2</text>
  <path d="M 280 92 L 280 130" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="4,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="290" y="114" font-size="10" fill="#b85450">S0→M1 +0</text>
  <path d="M 310 92 L 420 130" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="360" y="112" font-size="10" fill="#4a7a3a" font-weight="bold">S0→M2 +3</text>

  <!-- Level 2: 011, 101, 110 -->
  <rect x="80" y="224" width="80" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="120" y="250" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">011 (4)</text>
  <rect x="240" y="224" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="250" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">101 (5)</text>
  <rect x="400" y="224" width="80" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="440" y="250" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">110 (5)</text>

  <!-- edges level1 -> level2 -->
  <path d="M 120 172 L 120 222" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="128" y="200" font-size="10" fill="#446688">S1→M1 +2</text>
  <path d="M 140 172 L 240 222" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="4,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="170" y="200" font-size="10" fill="#b85450">S1→M2 +1</text>
  <path d="M 260 172 L 140 222" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="4,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="170" y="186" font-size="9" fill="#b85450">+2 输</text>
  <path d="M 300 172 L 420 222" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="4,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="350" y="200" font-size="10" fill="#b85450">S1→M2 +1</text>
  <path d="M 420 172 L 320 222" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="350" y="186" font-size="10" fill="#4a7a3a" font-weight="bold">S1→M0 +2</text>
  <path d="M 440 172 L 440 222" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="448" y="200" font-size="10" fill="#446688">S1→M1 +2</text>

  <!-- Level 3: 111 (optimal) -->
  <rect x="240" y="324" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">111 (8) ⭐</text>

  <!-- edges level2 -> level3 -->
  <path d="M 140 264 L 250 322" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="4,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="150" y="300" font-size="10" fill="#b85450">S2→M2 +0</text>
  <path d="M 280 264 L 280 322" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="290" y="298" font-size="10" fill="#4a7a3a" font-weight="bold">S2→M1 +3</text>
  <path d="M 420 264 L 310 322" stroke="#b85450" stroke-width="1.3" fill="none" stroke-dasharray="4,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="360" y="300" font-size="10" fill="#b85450">S2→M0 +1</text>

  <!-- footnote -->
  <rect x="30" y="384" width="500" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="404" text-anchor="middle" font-size="11" fill="#555">最优路径：000 → 100 → 101 → 111（S0→M2 +3, S1→M0 +2, S2→M1 +3）</text>
  <text x="280" y="420" text-anchor="middle" font-size="10" fill="#888">绿线 = 最优路径，蓝线 = 有效转移，红虚线 = 被更优值覆盖的转移</text>
</svg>
