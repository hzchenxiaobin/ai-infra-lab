<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 455"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="455" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：预处理 total / med + 子集状压 DP</text>

  <!-- ① 预处理 -->
  <rect x="80" y="36" width="360" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="55" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">① 预处理：每个 mask 收集元素并排序 → total[mask]、med[mask]</text>

  <path d="M 260 66 L 260 80" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② 初始化 -->
  <rect x="80" y="80" width="360" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="99" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">② 初始化：dp[单 bit mask] = 0，其余 = +∞</text>

  <path d="M 260 110 L 260 124" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ 枚举 mask -->
  <rect x="80" y="124" width="360" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="143" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">③ 按 mask 从小到大枚举（popcount ≥ 2）</text>

  <path d="M 260 154 L 260 168" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ④ 枚举划分 -->
  <rect x="50" y="168" width="420" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="184" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">④ lb = mask &amp; −mask（最低位）</text>
  <text x="260" y="199" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">u 依次取 rest = mask^lb 的真子集（含 0）：s = lb|u，t = mask^s</text>

  <path d="M 260 204 L 260 218" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ⑤ 松弛 -->
  <rect x="50" y="218" width="420" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="260" y="240" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">⑤ dp[mask] ← min( dp[s]+dp[t]+total[mask]+|med[s]−med[t]| )</text>

  <path d="M 260 252 L 260 266" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 1：u 枚举完？ -->
  <polygon points="260,266 340,296 260,326 180,296" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="300" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">子集 u 枚举完？</text>

  <!-- 否：回到 ④ -->
  <path d="M 180 296 L 34 296 L 34 186 L 47 186" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="105" y="289" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否 · 下一个 u</text>

  <path d="M 260 326 L 260 340" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="338" font-size="10" fill="#2f5d24" filter="url(#rough2)">是</text>

  <!-- 菱形 2：mask 枚举到 full？ -->
  <polygon points="260,340 345,371 260,402 175,371" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="375" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">mask 枚举到 full？</text>

  <!-- 否：回到 ③ -->
  <path d="M 345 371 L 486 371 L 486 139 L 443 139" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="415" y="364" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否 · 下一个 mask</text>

  <path d="M 260 402 L 260 416" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="413" font-size="10" fill="#2f5d24" filter="url(#rough2)">是</text>

  <!-- 返回 -->
  <rect x="160" y="416" width="200" height="30" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="436" text-anchor="middle" font-size="11.5" fill="#8a3a3a" font-weight="bold" filter="url(#rough2)">⑥ 返回 dp[(1&lt;&lt;n)−1]</text>
</svg>
