<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="340" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：枚举 1440 个合法时间</text>

  <!-- 1. start ellipse -->
  <ellipse cx="260" cy="58" rx="40" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">开始</text>

  <path d="M260 74 L260 84" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. loop header rect -->
  <rect x="120" y="86" width="280" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="260" y="108" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">对 t = 0, 1, …, 1439 逐一遍历</text>

  <path d="M260 122 L260 132" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. format rect -->
  <rect x="100" y="134" width="320" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="260" y="153" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">hour = t / 60， min = t % 60</text>
  <text x="260" y="170" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">s = f"{hour:02d}:{min:02d}"</text>

  <path d="M260 178 L260 190" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4. decision diamond -->
  <polygon points="260,192 350,228 260,264 170,228" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="222" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">逐位匹配</text>
  <text x="260" y="238" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">pattern ?</text>
  <text x="260" y="253" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">'?' 通配</text>

  <!-- yes branch -> ans++ (right) -->
  <path d="M350 228 L386 228" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="368" y="220" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是 ✓</text>
  <rect x="386" y="212" width="92" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="432" y="233" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">ans += 1</text>

  <!-- no branch label -->
  <text x="152" y="222" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否 ✗</text>

  <!-- merge: ans++ down then left ; diamond-no down -->
  <path d="M432 244 L432 282 L260 282" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M260 264 L260 282" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4,3" fill="none" filter="url(#rough2)"/>
  <!-- loop back arrow: from merge up the left side to loop header -->
  <path d="M150 282 L150 103 L118 103" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M260 282 L150 282" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="110" y="200" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">下一个 t</text>

  <!-- exit: when t > 1439 (loop ends) -> 返回 ans -->
  <path d="M260 282 L260 294" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170" y="296" width="180" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="260" y="317" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">返回 ans</text>
</svg>
