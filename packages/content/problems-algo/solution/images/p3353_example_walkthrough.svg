<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1,4,2]，两步把 d[2]、d[1] 依次归零</text>
  <text x="260" y="38" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">非零相邻差 2 个（1≠4、4≠2）→ ans = 2</text>

  <!-- 面板 1：初始 -->
  <rect x="36" y="48" width="448" height="86" rx="8" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="48" y="68" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">初始</text>
  <rect x="170" y="74" width="46" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="193" y="91" text-anchor="middle" font-size="12" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="220" y="74" width="46" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="243" y="91" text-anchor="middle" font-size="12" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="270" y="74" width="46" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="293" y="91" text-anchor="middle" font-size="12" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="195" y="106" width="46" height="24" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="218" y="122" text-anchor="middle" font-size="11.5" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="245" y="106" width="46" height="24" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="268" y="122" text-anchor="middle" font-size="11.5" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">−2</text>
  <text x="404" y="80" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">差分 d = [3, −2]</text>
  <text x="404" y="96" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">非零差 2 个 → 至少 2 步</text>
  <text x="404" y="120" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">相邻对：1≠4、4≠2</text>

  <path d="M 260 136 L 260 144" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 面板 2：操作 1 -->
  <rect x="36" y="146" width="448" height="86" rx="8" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="48" y="166" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">操作① 前缀长 2，k = −2</text>
  <rect x="170" y="172" width="46" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="193" y="189" text-anchor="middle" font-size="12" fill="#2f5424" font-weight="bold" filter="url(#rough2)">−1</text>
  <rect x="220" y="172" width="46" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="243" y="189" text-anchor="middle" font-size="12" fill="#2f5424" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="270" y="172" width="46" height="26" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="293" y="189" text-anchor="middle" font-size="12" fill="#2c4a6b" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="195" y="204" width="46" height="24" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="218" y="220" text-anchor="middle" font-size="11.5" fill="#7a5c1e" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="245" y="204" width="46" height="24" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="268" y="220" text-anchor="middle" font-size="11" fill="#2f5424" font-weight="bold" filter="url(#rough2)">0 ✓</text>
  <text x="404" y="178" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">只有跨界差 d[2] 被改写</text>
  <text x="404" y="194" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">d[2] = −2 −(−2) = 0</text>
  <text x="404" y="218" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">数组 → [−1, 2, 2]</text>

  <path d="M 260 234 L 260 242" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 面板 3：操作 2 -->
  <rect x="36" y="244" width="448" height="86" rx="8" fill="#ffffff" stroke="#c9c9c9" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="48" y="264" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">操作② 前缀长 1，k = +3</text>
  <rect x="170" y="270" width="46" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="193" y="287" text-anchor="middle" font-size="12" fill="#2f5424" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="220" y="270" width="46" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="243" y="287" text-anchor="middle" font-size="12" fill="#2f5424" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="270" y="270" width="46" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="293" y="287" text-anchor="middle" font-size="12" fill="#2f5424" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="195" y="302" width="46" height="24" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="218" y="318" text-anchor="middle" font-size="11" fill="#2f5424" font-weight="bold" filter="url(#rough2)">0 ✓</text>
  <rect x="245" y="302" width="46" height="24" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="268" y="318" text-anchor="middle" font-size="11" fill="#2f5424" font-weight="bold" filter="url(#rough2)">0 ✓</text>
  <text x="404" y="276" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">d[1] = 3 − 3 = 0</text>
  <text x="404" y="292" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">差分全零 → 全等 ✓</text>
  <text x="404" y="316" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">终值 = nums[2] = 2（从未被动过）</text>

  <text x="260" y="350" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">★ 每步恰好归零一个差分、互不影响 → 2 步全等</text>
</svg>
