<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="480" height="340" fill="#fafafa"/>

  <text x="240" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">核心观察：相邻翻转 = 负号沿路径“游走”</text>

  <!-- Row 1: [-3, 1, 2, 4] -->
  <text x="40" y="92" font-size="12" fill="#888" filter="url(#rough2)">状态①</text>
  <g font-size="13" filter="url(#rough2)">
    <rect x="140" y="68" width="48" height="48" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="164" y="98" text-anchor="middle" fill="#b85450" font-weight="bold">−3</text>
    <rect x="191" y="68" width="48" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="215" y="98" text-anchor="middle" fill="#333">1</text>
    <rect x="242" y="68" width="48" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="266" y="98" text-anchor="middle" fill="#333">2</text>
    <rect x="293" y="68" width="48" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="317" y="98" text-anchor="middle" fill="#333">4</text>
  </g>

  <!-- arrow row1 -> row2 -->
  <path d="M 240 120 L 240 152" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="252" y="140" font-size="11" fill="#446688" filter="url(#rough2)">翻转相邻 (0,0) 与 (0,1)</text>

  <!-- Row 2: [3, -1, 2, 4] -->
  <text x="40" y="188" font-size="12" fill="#888" filter="url(#rough2)">状态②</text>
  <g font-size="13" filter="url(#rough2)">
    <rect x="140" y="164" width="48" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="164" y="194" text-anchor="middle" fill="#333">3</text>
    <rect x="191" y="164" width="48" height="48" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="215" y="194" text-anchor="middle" fill="#b85450" font-weight="bold">−1</text>
    <rect x="242" y="164" width="48" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="266" y="194" text-anchor="middle" fill="#333">2</text>
    <rect x="293" y="164" width="48" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="317" y="194" text-anchor="middle" fill="#333">4</text>
  </g>

  <!-- arrow row2 -> row3 -->
  <path d="M 240 216 L 240 248" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="252" y="236" font-size="11" fill="#446688" filter="url(#rough2)">翻转相邻 (0,1) 与 (0,2)</text>

  <!-- Row 3: [3, 1, -2, 4] -->
  <text x="40" y="284" font-size="12" fill="#888" filter="url(#rough2)">状态③</text>
  <g font-size="13" filter="url(#rough2)">
    <rect x="140" y="260" width="48" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="164" y="290" text-anchor="middle" fill="#333">3</text>
    <rect x="191" y="260" width="48" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="215" y="290" text-anchor="middle" fill="#333">1</text>
    <rect x="242" y="260" width="48" height="48" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/>
    <text x="266" y="290" text-anchor="middle" fill="#b85450" font-weight="bold">−2</text>
    <rect x="293" y="260" width="48" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="317" y="290" text-anchor="middle" fill="#333">4</text>
  </g>

  <!-- bottom note -->
  <rect x="30" y="318" width="420" height="18" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="240" y="331" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">网格连通 → 负号可游走到任意格子；但负号总数奇偶性不变（每次 ±0 或 ±2）</text>
</svg>
