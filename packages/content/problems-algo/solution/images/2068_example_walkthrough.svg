<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：word1 = "aaaa", word2 = "bccb"</text>

  <!-- word1 row -->
  <text x="210" y="63" text-anchor="end" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">word1</text>
  <rect x="220" y="44" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="235" y="64" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="250" y="44" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="265" y="64" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="280" y="44" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="295" y="64" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="310" y="44" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="325" y="64" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>

  <!-- word2 row -->
  <text x="210" y="107" text-anchor="end" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">word2</text>
  <rect x="220" y="88" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="235" y="108" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <rect x="250" y="88" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="265" y="108" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <rect x="280" y="88" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="295" y="108" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <rect x="310" y="88" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="325" y="108" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>

  <!-- down arrow to table -->
  <path d="M 280 120 L 280 138" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Frequency table -->
  <!-- Header row -->
  <rect x="100" y="140" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="140" y="158" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">字母</text>
  <rect x="180" y="140" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="210" y="158" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">freq1</text>
  <rect x="240" y="140" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="270" y="158" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">freq2</text>
  <rect x="300" y="140" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="340" y="158" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">Δ = f1−f2</text>
  <rect x="380" y="140" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="430" y="158" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">|Δ| ≤ 3 ?</text>

  <!-- Row a: FAIL -->
  <rect x="100" y="166" width="80" height="26" fill="#fff" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="140" y="184" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="180" y="166" width="60" height="26" fill="#fff" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="210" y="184" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="240" y="166" width="60" height="26" fill="#fff" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="270" y="184" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="300" y="166" width="80" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="340" y="184" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">+4</text>
  <rect x="380" y="166" width="100" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="430" y="184" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ (&gt;3)</text>

  <!-- Row b -->
  <rect x="100" y="192" width="80" height="26" fill="#fff" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="140" y="210" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">b</text>
  <rect x="180" y="192" width="60" height="26" fill="#fff" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="210" y="210" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="240" y="192" width="60" height="26" fill="#fff" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="270" y="210" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="300" y="192" width="80" height="26" fill="#fff" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="340" y="210" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">−2</text>
  <rect x="380" y="192" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="430" y="210" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <!-- Row c -->
  <rect x="100" y="218" width="80" height="26" fill="#fff" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="140" y="236" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">c</text>
  <rect x="180" y="218" width="60" height="26" fill="#fff" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="210" y="236" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <rect x="240" y="218" width="60" height="26" fill="#fff" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="270" y="236" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="300" y="218" width="80" height="26" fill="#fff" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="340" y="236" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">−2</text>
  <rect x="380" y="218" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="430" y="236" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <!-- Row rest -->
  <rect x="100" y="244" width="80" height="26" fill="#fff" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="140" y="262" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">其余 23 个</text>
  <rect x="180" y="244" width="60" height="26" fill="#fff" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="210" y="262" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <rect x="240" y="244" width="60" height="26" fill="#fff" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="270" y="262" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <rect x="300" y="244" width="80" height="26" fill="#fff" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="340" y="262" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <rect x="380" y="244" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="430" y="262" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <!-- Result box -->
  <rect x="120" y="286" width="340" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="307" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">字母 a：|4 − 0| = 4 &gt; 3 ⟹ 返回 false</text>

  <!-- Note -->
  <text x="280" y="340" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">只要有一个字母超标即整体判否；可短路：发现即返回</text>
</svg>
