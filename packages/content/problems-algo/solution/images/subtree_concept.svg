<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 8 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 8 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">子树 = 某节点 + 其全部后代（结构与值完全相同）</text>

  <!-- ====== Left: root tree ====== -->
  <text x="150" y="56" text-anchor="middle" font-size="12" fill="#888">root</text>

  <!-- Highlight box around matching subtree (4,1,2) -->
  <rect x="48" y="92" width="140" height="120" fill="#fce4ec" fill-opacity="0.45" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,3" rx="10" filter="url(#rough2)"/>

  <!-- edges root -->
  <line x1="150" y1="78" x2="100" y2="128" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="150" y1="78" x2="210" y2="128" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="100" y1="128" x2="70" y2="188" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="100" y1="128" x2="135" y2="188" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- root node 3 -->
  <circle cx="150" cy="78" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="83" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <!-- node 4 (subtree root, highlighted) -->
  <circle cx="100" cy="128" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="100" y="133" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>

  <!-- node 5 -->
  <circle cx="210" cy="128" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="133" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>

  <!-- node 1 (leaf) -->
  <circle cx="70" cy="188" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="70" y="193" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <!-- node 2 (leaf) -->
  <circle cx="135" cy="188" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="135" y="193" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <!-- matching subtree label -->
  <text x="118" y="232" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">以节点 4 为根的子树</text>

  <!-- ====== Right: subRoot tree ====== -->
  <text x="420" y="56" text-anchor="middle" font-size="12" fill="#888">subRoot</text>

  <rect x="345" y="92" width="150" height="120" fill="#e6f4ea" fill-opacity="0.45" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="5,3" rx="10" filter="url(#rough2)"/>

  <!-- edges subRoot -->
  <line x1="420" y1="108" x2="380" y2="158" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <line x1="420" y1="108" x2="460" y2="158" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- subRoot node 4 -->
  <circle cx="420" cy="108" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="420" y="113" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>

  <!-- node 1 -->
  <circle cx="380" cy="158" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="163" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <!-- node 2 -->
  <circle cx="460" cy="158" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="460" y="163" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <!-- ====== Match arrow ====== -->
  <path d="M 190 150 L 342 130" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <rect x="220" y="108" width="92" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="266" y="126" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">完全相同 ✓</text>

  <!-- ====== Bottom notes ====== -->
  <rect x="40" y="262" width="480" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="282" text-anchor="middle" font-size="11" fill="#333">判定：对 root 每个节点 node，检查 isSame(node, subRoot)</text>

  <rect x="40" y="302" width="480" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⚠️ 子树含「全部后代」，非子结构（LC 572 ≠ LC 100 部分匹配）</text>

  <rect x="40" y="342" width="480" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="10" fill="#4a7a3a">isSame：值相等 + 左子相同 + 右子相同（结构与值完全一致）</text>
</svg>
