<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：一次操作 = 某字母频次 −2，最终残留只看奇偶</text>

  <!-- 左：一次操作示意 -->
  <rect x="20" y="44" width="290" height="168" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="165" y="66" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">一次操作示意：s = "abaacbcbb"</text>

  <rect x="34" y="80" width="26" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="47" y="98" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="60" y="80" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="73" y="98" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">b</text>
  <rect x="86" y="80" width="26" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="99" y="98" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="112" y="80" width="26" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="125" y="98" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="138" y="80" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="151" y="98" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">c</text>
  <rect x="164" y="80" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="177" y="98" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">b</text>
  <rect x="190" y="80" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="203" y="98" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">c</text>
  <rect x="216" y="80" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="229" y="98" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">b</text>
  <rect x="242" y="80" width="26" height="26" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="255" y="98" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">b</text>

  <text x="47" y="124" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">0</text>
  <text x="73" y="124" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">1</text>
  <text x="99" y="124" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">2</text>
  <text x="125" y="124" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">3</text>
  <text x="151" y="124" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">4</text>
  <text x="177" y="124" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">5</text>
  <text x="203" y="124" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">6</text>
  <text x="229" y="124" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">7</text>
  <text x="255" y="124" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">8</text>

  <path d="M 38 84 L 56 102" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 116 84 L 134 102" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <text x="47" y="142" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">删</text>
  <text x="99" y="142" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">选 i=2</text>
  <text x="125" y="142" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">删</text>

  <text x="165" y="166" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">选中的 a 保留，删它左右最近的两个 a</text>
  <text x="165" y="186" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">a 的频次 3 → 1，其它字母频次不变</text>

  <!-- 右：频次能削到哪 -->
  <rect x="322" y="44" width="178" height="168" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="411" y="66" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">频次能削到哪？</text>

  <rect x="336" y="78" width="150" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="411" y="97" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">a：3 → 1（−2）✓</text>
  <rect x="336" y="112" width="150" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="411" y="131" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b：4 → 2（−2）✓</text>
  <rect x="336" y="146" width="150" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="411" y="165" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">c：2 ✗ &lt; 3 动不了</text>

  <text x="411" y="196" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">频次 ≥ 3 才能操作，每次 −2 保奇偶</text>

  <!-- 汇聚箭头 -->
  <path d="M 165 214 C 165 226, 210 226, 240 234" stroke="#446688" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 411 214 C 411 226, 320 226, 288 234" stroke="#446688" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 中部：不变量 -->
  <rect x="20" y="238" width="480" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="261" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">不变量：一次操作恰让一个字母频次 −2，且 26 个字母互不干扰</text>

  <!-- 底部：公式 -->
  <rect x="20" y="292" width="480" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="317" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = Σ(2 − freq mod 2)：奇数次残留 1 个，偶数次残留 2 个</text>
</svg>
