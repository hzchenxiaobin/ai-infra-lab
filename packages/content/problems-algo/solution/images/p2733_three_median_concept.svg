<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2733c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：任意三个互异数的中位数，必非全局极值</text>

  <!-- full array -->
  <text x="70" y="74" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">数组</text>
  <rect x="110" y="56" width="50" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="135" y="84" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">3</text>

  <rect x="160" y="56" width="50" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="5" filter="url(#rough2)"/>
  <text x="185" y="84" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="185" y="118" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">中位（答案）</text>

  <rect x="210" y="56" width="50" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="235" y="84" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold">1</text>
  <text x="235" y="118" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">全局最小</text>

  <rect x="260" y="56" width="50" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="285" y="84" text-anchor="middle" font-size="18" fill="#b85450" font-weight="bold">4</text>
  <text x="285" y="118" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">全局最大</text>

  <text x="330" y="84" font-size="10" fill="#888">（取前三个 [3,2,1]）</text>

  <!-- arrow down -->
  <path d="M185,128 L185,158" stroke="#446688" stroke-width="2" marker-end="url(#arr2733c)" filter="url(#rough2)"/>
  <text x="200" y="150" font-size="10" fill="#446688">排序</text>

  <!-- three sorted -->
  <text x="70" y="186" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">取前三个</text>
  <rect x="110" y="168" width="50" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="135" y="196" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold">1</text>
  <text x="135" y="226" text-anchor="middle" font-size="9" fill="#d6a040">a</text>

  <rect x="160" y="168" width="50" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="5" filter="url(#rough2)"/>
  <text x="185" y="196" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="185" y="226" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">b（中位）</text>

  <rect x="210" y="168" width="50" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="235" y="196" text-anchor="middle" font-size="18" fill="#b85450" font-weight="bold">3</text>
  <text x="235" y="226" text-anchor="middle" font-size="9" fill="#b85450">c</text>

  <!-- reasoning box -->
  <rect x="60" y="250" width="440" height="130" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="272" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">为何中位数 b 一定合法？</text>
  <text x="80" y="294" font-size="11" fill="#446688">• 全局最小 ≤ a &lt; b  ⇒  b 严格大于全局最小，故 b ≠ 全局最小</text>
  <text x="80" y="316" font-size="11" fill="#446688">• 全局最大 ≥ c &gt; b  ⇒  b 严格小于全局最大，故 b ≠ 全局最大</text>
  <text x="80" y="342" font-size="11" fill="#4a7a3a" font-weight="bold">⇒ 只需看任意三个数，中位数即为合法答案，O(1) 搞定</text>
  <text x="80" y="364" font-size="10" fill="#888">前提：n ≥ 3（否则所有元素非最小即最大，返回 -1）</text>
</svg>
