<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="430" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：weights=[1,3,5,1], k=2 ⇒ 差值 4</text>
  <text x="300" y="46" text-anchor="middle" font-size="11" fill="#888">k−1=1 个切点，固定项 weights[0]+weights[3]=2 恒定</text>

  <!-- three cut options table -->
  <text x="40" y="78" font-size="11" fill="#446688" font-weight="bold">枚举 3 个切点位置：</text>

  <!-- Cut i=0 -->
  <text x="40" y="106" font-size="11" fill="#333">切点 i=0：</text>
  <g font-size="12">
    <rect x="120" y="92" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="140" y="111" text-anchor="middle" fill="#333">1</text>
    <text x="168" y="110" font-size="14" fill="#b85450" font-weight="bold">|</text>
    <rect x="180" y="92" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="200" y="111" text-anchor="middle" fill="#333">3</text>
    <rect x="220" y="92" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="240" y="111" text-anchor="middle" fill="#333">5</text>
    <rect x="260" y="92" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="280" y="111" text-anchor="middle" fill="#333">1</text>
  </g>
  <text x="320" y="110" font-size="11" fill="#555">p₀=1+3=4</text>
  <text x="440" y="110" font-size="11" fill="#446688" font-weight="bold">score=2+4=6</text>

  <!-- Cut i=1 (max) -->
  <text x="40" y="146" font-size="11" fill="#333">切点 i=1：</text>
  <g font-size="12">
    <rect x="120" y="132" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="140" y="151" text-anchor="middle" fill="#333">1</text>
    <rect x="160" y="132" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="180" y="151" text-anchor="middle" fill="#333">3</text>
    <text x="208" y="150" font-size="14" fill="#b85450" font-weight="bold">|</text>
    <rect x="220" y="132" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="240" y="151" text-anchor="middle" fill="#333">5</text>
    <rect x="260" y="132" width="40" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="280" y="151" text-anchor="middle" fill="#333">1</text>
  </g>
  <text x="320" y="150" font-size="11" fill="#555">p₁=3+5=8</text>
  <text x="440" y="150" font-size="11" fill="#b85450" font-weight="bold">score=2+8=10★max</text>

  <!-- Cut i=2 -->
  <text x="40" y="186" font-size="11" fill="#333">切点 i=2：</text>
  <g font-size="12">
    <rect x="120" y="172" width="40" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="140" y="191" text-anchor="middle" fill="#333">1</text>
    <rect x="160" y="172" width="40" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="180" y="191" text-anchor="middle" fill="#333">3</text>
    <rect x="200" y="172" width="40" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="220" y="191" text-anchor="middle" fill="#333">5</text>
    <text x="248" y="190" font-size="14" fill="#b85450" font-weight="bold">|</text>
    <rect x="260" y="172" width="40" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="280" y="191" text-anchor="middle" fill="#333">1</text>
  </g>
  <text x="320" y="190" font-size="11" fill="#555">p₂=5+1=6</text>
  <text x="440" y="190" font-size="11" fill="#446688" font-weight="bold">score=2+6=8</text>

  <!-- separator -->
  <path d="M 40 220 L 560 220" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- sorted p -->
  <text x="40" y="248" font-size="12" fill="#4a7a3a" font-weight="bold">排序 p：</text>
  <g font-size="12">
    <rect x="120" y="234" width="44" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="142" y="253" text-anchor="middle" fill="#333">4</text>
    <rect x="164" y="234" width="44" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="186" y="253" text-anchor="middle" fill="#333">6</text>
    <rect x="208" y="234" width="44" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="230" y="253" text-anchor="middle" fill="#333">8</text>
  </g>

  <!-- brackets -->
  <path d="M 120 272 Q 120 282 142 282" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="142" y="298" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">minSum = 4</text>
  <text x="142" y="312" text-anchor="middle" font-size="9" fill="#446688">首 k−1=1 个</text>

  <path d="M 252 272 Q 252 282 230 282" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="230" y="328" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">maxSum = 8</text>
  <text x="230" y="342" text-anchor="middle" font-size="9" fill="#b85450">末 k−1=1 个</text>

  <!-- result -->
  <rect x="180" y="360" width="240" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="384" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">答案 = maxSum − minSum</text>
  <text x="300" y="404" text-anchor="middle" font-size="13" fill="#333">8 − 4 = 4  ✓</text>

  <path d="M 142 316 Q 142 340 240 360" stroke="#446688" stroke-width="1.3" stroke-dasharray="3 2" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <path d="M 230 346 Q 230 355 240 360" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3 2" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>

  <!-- note -->
  <text x="440" y="372" font-size="10" fill="#888">固定项 2 在 max、min</text>
  <text x="440" y="386" font-size="10" fill="#888">中相同，求差抵消</text>
  <text x="440" y="400" font-size="10" fill="#888">不必显式计算它</text>
</svg>
