<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "(2+3)-(1+2)"，求值结果 = 2</text>

  <!-- table header -->
  <text x="26" y="56" font-size="12" fill="#444" font-weight="bold">步</text>
  <text x="84" y="56" font-size="12" fill="#444" font-weight="bold">字符 c</text>
  <text x="162" y="56" font-size="12" fill="#444" font-weight="bold">num</text>
  <text x="232" y="56" font-size="12" fill="#444" font-weight="bold">sign</text>
  <text x="296" y="56" font-size="12" fill="#444" font-weight="bold">动作</text>
  <text x="560" y="56" font-size="12" fill="#444" font-weight="bold">res / 栈</text>

  <line x1="20" y1="62" x2="624" y2="62" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1: ( -->
  <text x="26" y="82" font-size="11" fill="#333">1</text>
  <text x="84" y="82" font-size="11" fill="#b85450" font-weight="bold">'('</text>
  <text x="162" y="82" font-size="11" fill="#888">0</text>
  <text x="232" y="82" font-size="11" fill="#888">+1</text>
  <text x="296" y="82" font-size="11" fill="#b85450">push(0,+1)；res=0;sign=+1</text>
  <text x="560" y="82" font-size="11" fill="#333">res=0 / [(0,+1)]</text>

  <!-- Row 2: 2 -->
  <text x="26" y="102" font-size="11" fill="#333">2</text>
  <text x="84" y="102" font-size="11" fill="#333" font-weight="bold">'2'</text>
  <text x="162" y="102" font-size="11" fill="#333">0→2</text>
  <text x="232" y="102" font-size="11" fill="#888">+1</text>
  <text x="296" y="102" font-size="11" fill="#888">数字，累加 num</text>
  <text x="560" y="102" font-size="11" fill="#333">res=0</text>

  <!-- Row 3: + -->
  <text x="26" y="122" font-size="11" fill="#333">3</text>
  <text x="84" y="122" font-size="11" fill="#d6a040" font-weight="bold">'+'</text>
  <text x="162" y="122" font-size="11" fill="#333">2</text>
  <text x="232" y="122" font-size="11" fill="#333">+1</text>
  <text x="296" y="122" font-size="11" fill="#4a7a3a">res += 1×2 = 2；sign=+1</text>
  <text x="560" y="122" font-size="11" fill="#333" font-weight="bold">res=2</text>

  <!-- Row 4: 3 -->
  <text x="26" y="142" font-size="11" fill="#333">4</text>
  <text x="84" y="142" font-size="11" fill="#333" font-weight="bold">'3'</text>
  <text x="162" y="142" font-size="11" fill="#333">0→3</text>
  <text x="232" y="142" font-size="11" fill="#888">+1</text>
  <text x="296" y="142" font-size="11" fill="#888">数字，累加 num</text>
  <text x="560" y="142" font-size="11" fill="#333">res=2</text>

  <!-- Row 5: ) -->
  <text x="26" y="162" font-size="11" fill="#333">5</text>
  <text x="84" y="162" font-size="11" fill="#b85450" font-weight="bold">')'</text>
  <text x="162" y="162" font-size="11" fill="#333">3</text>
  <text x="232" y="162" font-size="11" fill="#888">+1</text>
  <text x="296" y="162" font-size="11" fill="#b85450" font-weight="bold">res=2+3=5；pop→0+1×5=5</text>
  <text x="560" y="162" font-size="11" fill="#b85450" font-weight="bold">res=5 / []</text>

  <!-- Row 6: - -->
  <text x="26" y="182" font-size="11" fill="#333">6</text>
  <text x="84" y="182" font-size="11" fill="#d6a040" font-weight="bold">'-'</text>
  <text x="162" y="182" font-size="11" fill="#333">0</text>
  <text x="232" y="182" font-size="11" fill="#333">+1</text>
  <text x="296" y="182" font-size="11" fill="#4a7a3a">res += 1×0 = 5；sign=−1</text>
  <text x="560" y="182" font-size="11" fill="#333">res=5</text>

  <!-- Row 7: ( -->
  <text x="26" y="202" font-size="11" fill="#333">7</text>
  <text x="84" y="202" font-size="11" fill="#b85450" font-weight="bold">'('</text>
  <text x="162" y="202" font-size="11" fill="#888">0</text>
  <text x="232" y="202" font-size="11" fill="#b85450" font-weight="bold">−1</text>
  <text x="296" y="202" font-size="11" fill="#b85450">push(5,−1)；res=0;sign=+1</text>
  <text x="560" y="202" font-size="11" fill="#333">res=0 / [(5,−1)]</text>

  <!-- Row 8: 1 -->
  <text x="26" y="222" font-size="11" fill="#333">8</text>
  <text x="84" y="222" font-size="11" fill="#333" font-weight="bold">'1'</text>
  <text x="162" y="222" font-size="11" fill="#333">0→1</text>
  <text x="232" y="222" font-size="11" fill="#888">+1</text>
  <text x="296" y="222" font-size="11" fill="#888">数字，累加 num</text>
  <text x="560" y="222" font-size="11" fill="#333">res=0</text>

  <!-- Row 9: + -->
  <text x="26" y="242" font-size="11" fill="#333">9</text>
  <text x="84" y="242" font-size="11" fill="#d6a040" font-weight="bold">'+'</text>
  <text x="162" y="242" font-size="11" fill="#333">1</text>
  <text x="232" y="242" font-size="11" fill="#333">+1</text>
  <text x="296" y="242" font-size="11" fill="#4a7a3a">res += 1×1 = 1；sign=+1</text>
  <text x="560" y="242" font-size="11" fill="#333" font-weight="bold">res=1</text>

  <!-- Row 10: 2 -->
  <text x="26" y="262" font-size="11" fill="#333">10</text>
  <text x="84" y="262" font-size="11" fill="#333" font-weight="bold">'2'</text>
  <text x="162" y="262" font-size="11" fill="#333">0→2</text>
  <text x="232" y="262" font-size="11" fill="#888">+1</text>
  <text x="296" y="262" font-size="11" fill="#888">数字，累加 num</text>
  <text x="560" y="262" font-size="11" fill="#333">res=1</text>

  <!-- Row 11: ) -->
  <text x="26" y="282" font-size="11" fill="#333">11</text>
  <text x="84" y="282" font-size="11" fill="#b85450" font-weight="bold">')'</text>
  <text x="162" y="282" font-size="11" fill="#333">2</text>
  <text x="232" y="282" font-size="11" fill="#888">+1</text>
  <text x="296" y="282" font-size="11" fill="#b85450" font-weight="bold">res=1+2=3；pop→5+(−1)×3=2</text>
  <text x="560" y="282" font-size="11" fill="#b85450" font-weight="bold">res=2 / []</text>

  <!-- Row 12: end -->
  <text x="26" y="302" font-size="11" fill="#333">12</text>
  <text x="84" y="302" font-size="11" fill="#888" font-weight="bold">结束</text>
  <text x="162" y="302" font-size="11" fill="#333">0</text>
  <text x="232" y="302" font-size="11" fill="#888">+1</text>
  <text x="296" y="302" font-size="11" fill="#4a7a3a">res += 1×0 = 2</text>
  <text x="560" y="302" font-size="11" fill="#b85450" font-weight="bold">res=2</text>

  <line x1="20" y1="312" x2="624" y2="312" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- result box -->
  <rect x="60" y="326" width="520" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="320" y="346" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">最终结果：(2+3) − (1+2) = 5 − 3 = 2 ⭐</text>
  <text x="320" y="361" text-anchor="middle" font-size="11" fill="#888">关键在第 7 步：'-' 把 sign=−1 压入栈，第 11 步 ')' 用 −1 合并得 5+(−1)×3=2</text>

  <!-- unary minus note -->
  <rect x="60" y="376" width="520" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="320" y="393" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">一元负号：开头 '-' 或 '(-' 时 num=0，res += sign×0 不变，sign 置 −1</text>
  <text x="320" y="407" text-anchor="middle" font-size="10" fill="#888">如 "-2+1" → −1；"1-(-2)" → 3；本算法天然支持，无需特判</text>
</svg>
