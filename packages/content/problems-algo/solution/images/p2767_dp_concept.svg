<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">DP 状态转移：把 s 切成最少的「5 的幂」段</text>

  <!-- String s = 1011 -->
  <text x="30" y="60" font-size="12" fill="#888">s =</text>
  <rect x="64" y="46" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="84" y="65" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="104" y="46" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="124" y="65" text-anchor="middle" font-size="13" fill="#333">0</text>
  <rect x="144" y="46" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="164" y="65" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="188" y="46" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="208" y="65" text-anchor="middle" font-size="13" fill="#333">1</text>

  <!-- index labels -->
  <text x="84" y="88" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="124" y="88" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="164" y="88" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="208" y="88" text-anchor="middle" font-size="9" fill="#aaa">3</text>

  <!-- split markers under segments -->
  <path d="M 64 100 L 184 100" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="124" y="115" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">"101"=5</text>
  <path d="M 188 100 L 228 100" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="208" y="115" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">"1"=1</text>

  <!-- Beautiful dictionary box (left) -->
  <rect x="24" y="150" width="226" height="138" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="137" y="170" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">美丽字典（5^k 的二进制）</text>
  <text x="40" y="190" font-size="11" fill="#444">5^0 = 1   → "1" ✓</text>
  <text x="40" y="206" font-size="11" fill="#444">5^1 = 5   → "101" ✓</text>
  <text x="40" y="222" font-size="11" fill="#444">5^2 = 25  → "11001"</text>
  <text x="40" y="238" font-size="11" fill="#444">5^3 = 125 → "1111101"</text>
  <text x="40" y="254" font-size="11" fill="#444">5^4 = 625 → "1001110001"</text>
  <text x="40" y="270" font-size="11" fill="#888">… 共 7 个（≤15 位）</text>

  <!-- arrows from segments to dict -->
  <path d="M 124 118 Q 122 150 132 200" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 208 118 Q 196 150 150 184" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- DP formula box (right) -->
  <rect x="280" y="150" width="216" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="388" y="172" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">dp[i] = 前 i 字符最少段数</text>
  <text x="388" y="194" text-anchor="middle" font-size="11" fill="#555">枚举 j：若 s[j:i] 美丽</text>
  <text x="388" y="214" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">dp[i] = min(dp[j] + 1)</text>

  <!-- arrow from dict to dp -->
  <path d="M 250 200 Q 268 200 280 192" stroke="#888" stroke-width="1.6" fill="none" stroke-dasharray="3,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="266" y="186" font-size="9" fill="#888">查表</text>

  <!-- conditions box -->
  <rect x="280" y="244" width="216" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="388" y="264" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">美丽 = 两个条件</text>
  <text x="294" y="282" font-size="10" fill="#555">① 无前导 0（s[j] ≠ '0'）</text>
  <text x="294" y="296" font-size="10" fill="#555">② 数值 ∈ {5^0 … 5^6}</text>

  <!-- summary -->
  <rect x="24" y="316" width="472" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="336" text-anchor="middle" font-size="11" fill="#333">dp[0]=0；每段须命中美丽字典，取 dp[j]+1 的最小；不可达返回 -1</text>
</svg>
