<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：arr=[3,0,1,1,9,7], a=7, b=2, c=3</text>

  <!-- ===== Table header ===== -->
  <rect x="30" y="38" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="54" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">(i, j)</text>

  <rect x="90" y="38" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="120" y="54" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">|ai−aj|≤a?</text>

  <rect x="150" y="38" width="300" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="300" y="54" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">k 枚举结果（②=cond2失败, ③=cond3失败, ✓=全过）</text>

  <rect x="450" y="38" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="490" y="54" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">好三元组</text>

  <!-- ===== Row (0,1) ===== -->
  <rect x="30" y="64" width="60" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="80" text-anchor="middle" font-size="10" fill="#333">(0,1)</text>
  <rect x="90" y="64" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="120" y="80" text-anchor="middle" font-size="9" fill="#4a7a3a">|3−0|=3✓</text>
  <rect x="150" y="64" width="300" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="300" y="80" text-anchor="middle" font-size="9" fill="#333">k=2:✓  k=3:✓  k=4:②  k=5:②</text>
  <rect x="450" y="64" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="490" y="80" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">(0,1,2)(0,1,3)</text>

  <!-- ===== Row (0,2) ===== -->
  <rect x="30" y="90" width="60" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="106" text-anchor="middle" font-size="10" fill="#333">(0,2)</text>
  <rect x="90" y="90" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="120" y="106" text-anchor="middle" font-size="9" fill="#4a7a3a">|3−1|=2✓</text>
  <rect x="150" y="90" width="300" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="300" y="106" text-anchor="middle" font-size="9" fill="#333">k=3:✓  k=4:②  k=5:②</text>
  <rect x="450" y="90" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="490" y="106" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">(0,2,3)</text>

  <!-- ===== Row (0,3) ===== -->
  <rect x="30" y="116" width="60" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="132" text-anchor="middle" font-size="10" fill="#333">(0,3)</text>
  <rect x="90" y="116" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="120" y="132" text-anchor="middle" font-size="9" fill="#4a7a3a">|3−1|=2✓</text>
  <rect x="150" y="116" width="300" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="300" y="132" text-anchor="middle" font-size="9" fill="#333">k=4:②  k=5:②</text>
  <rect x="450" y="116" width="80" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="490" y="132" text-anchor="middle" font-size="9" fill="#888">—</text>

  <!-- ===== Row (0,4) ===== -->
  <rect x="30" y="142" width="60" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="158" text-anchor="middle" font-size="10" fill="#333">(0,4)</text>
  <rect x="90" y="142" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="120" y="158" text-anchor="middle" font-size="9" fill="#4a7a3a">|3−9|=6✓</text>
  <rect x="150" y="142" width="300" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="300" y="158" text-anchor="middle" font-size="9" fill="#333">k=5:②过 ③失败</text>
  <rect x="450" y="142" width="80" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="490" y="158" text-anchor="middle" font-size="9" fill="#888">—</text>

  <!-- ===== Row (1,2) ===== -->
  <rect x="30" y="168" width="60" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="60" y="184" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">(1,2)</text>
  <rect x="90" y="168" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="120" y="184" text-anchor="middle" font-size="9" fill="#4a7a3a">|0−1|=1✓</text>
  <rect x="150" y="168" width="300" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="300" y="184" text-anchor="middle" font-size="9" fill="#333">k=3:✓  k=4:②  k=5:②</text>
  <rect x="450" y="168" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="490" y="184" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">(1,2,3)</text>

  <!-- ===== Row (1,3) ===== -->
  <rect x="30" y="194" width="60" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="210" text-anchor="middle" font-size="10" fill="#333">(1,3)</text>
  <rect x="90" y="194" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="120" y="210" text-anchor="middle" font-size="9" fill="#4a7a3a">|0−1|=1✓</text>
  <rect x="150" y="194" width="300" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="300" y="210" text-anchor="middle" font-size="9" fill="#333">k=4:②  k=5:②</text>
  <rect x="450" y="194" width="80" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="490" y="210" text-anchor="middle" font-size="9" fill="#888">—</text>

  <!-- ===== Row (2,3) ===== -->
  <rect x="30" y="220" width="60" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="236" text-anchor="middle" font-size="10" fill="#333">(2,3)</text>
  <rect x="90" y="220" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="120" y="236" text-anchor="middle" font-size="9" fill="#4a7a3a">|1−1|=0✓</text>
  <rect x="150" y="220" width="300" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="300" y="236" text-anchor="middle" font-size="9" fill="#333">k=4:②  k=5:②</text>
  <rect x="450" y="220" width="80" height="24" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="490" y="236" text-anchor="middle" font-size="9" fill="#888">—</text>

  <!-- ===== Pruned rows separator ===== -->
  <line x1="30" y1="252" x2="530" y2="252" stroke="#eee" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="30" y="268" font-size="10" fill="#b85450" font-weight="bold">条件① 剪枝（跳过整个 k 循环）：</text>

  <!-- Pruned (1,4) -->
  <rect x="30" y="274" width="60" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="289" text-anchor="middle" font-size="10" fill="#888">(1,4)</text>
  <rect x="90" y="274" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="120" y="289" text-anchor="middle" font-size="9" fill="#b85450">|0−9|=9✗</text>
  <rect x="150" y="274" width="300" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="300" y="289" text-anchor="middle" font-size="9" fill="#b85450">跳过 k=5（省 1 次枚举）</text>
  <rect x="450" y="274" width="80" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="490" y="289" text-anchor="middle" font-size="9" fill="#888">—</text>

  <!-- Pruned (2,4) -->
  <rect x="30" y="298" width="60" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="313" text-anchor="middle" font-size="10" fill="#888">(2,4)</text>
  <rect x="90" y="298" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="120" y="313" text-anchor="middle" font-size="9" fill="#b85450">|1−9|=8✗</text>
  <rect x="150" y="298" width="300" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="300" y="313" text-anchor="middle" font-size="9" fill="#b85450">跳过 k=5（省 1 次枚举）</text>
  <rect x="450" y="298" width="80" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="490" y="313" text-anchor="middle" font-size="9" fill="#888">—</text>

  <!-- Pruned (3,4) -->
  <rect x="30" y="322" width="60" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="337" text-anchor="middle" font-size="10" fill="#888">(3,4)</text>
  <rect x="90" y="322" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="120" y="337" text-anchor="middle" font-size="9" fill="#b85450">|1−9|=8✗</text>
  <rect x="150" y="322" width="300" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="300" y="337" text-anchor="middle" font-size="9" fill="#b85450">跳过 k=5（省 1 次枚举）</text>
  <rect x="450" y="322" width="80" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="490" y="337" text-anchor="middle" font-size="9" fill="#888">—</text>

  <!-- ===== Summary box ===== -->
  <rect x="60" y="358" width="440" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="378" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">剪枝效果：C(6,3)=20 个三元组 → 17 个过 cond① → 5 个过 cond② → 4 个过 cond③</text>
  <text x="280" y="396" text-anchor="middle" font-size="11" fill="#666">cond① 省去 3 次 k 循环；cond② 省去 12 次 cond③ 比较</text>
  <text x="280" y="416" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">→ ans = 4 ⭐</text>
</svg>
