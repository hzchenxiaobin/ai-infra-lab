<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrK" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#888888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：单趟扫描 + 三分支状态转移（滚动标量版）</text>

  <!-- 初始化 -->
  <rect x="150" y="34" width="220" height="42" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="51" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">初始化（i = 0）：dp0 = nums[0]</text>
  <text x="260" y="67" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">dp1 = dp2 = dp3 = ans = −∞</text>

  <path d="M 260 76 L 260 82" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="165" y="86" width="190" height="22" rx="6" fill="#fafafa" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="260" y="101" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">i 从 1 到 n−1：取 x = nums[i]</text>

  <path d="M 260 108 L 260 114" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="260,114 312,136 260,158 208,136" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="140" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">x 与 prev ？</text>

  <!-- 三分支箭头 -->
  <path d="M 208 136 C 170 148, 135 160, 108 178" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="132" y="156" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">升（x &gt; prev）</text>
  <path d="M 260 158 L 260 176" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="322" y="172" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">降（x &lt; prev）</text>
  <path d="M 312 136 C 350 148, 385 160, 412 178" fill="none" stroke="#888888" stroke-width="1.8" marker-end="url(#arrK)" filter="url(#rough2)"/>
  <text x="428" y="156" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">平（x = prev）</text>

  <!-- 升分支 -->
  <rect x="30" y="180" width="150" height="88" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="105" y="197" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">升分支</text>
  <text x="105" y="215" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">dp3 ← max(dp3, dp2) + x</text>
  <text x="105" y="230" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">dp2 ← −∞</text>
  <text x="105" y="245" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">dp1 ← max(dp1, dp0) + x</text>
  <text x="105" y="260" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">dp0 ← max(dp0 + x, x)</text>

  <!-- 降分支 -->
  <rect x="185" y="180" width="150" height="88" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="197" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">降分支</text>
  <text x="260" y="215" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">dp3 ← −∞</text>
  <text x="260" y="230" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">dp2 ← max(dp2, dp1) + x</text>
  <text x="260" y="245" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">dp1 ← −∞</text>
  <text x="260" y="260" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">dp0 ← x</text>

  <!-- 平分支 -->
  <rect x="340" y="180" width="150" height="88" rx="6" fill="#f5f5f5" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="415" y="197" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">平分支</text>
  <text x="415" y="215" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">dp1 ← −∞</text>
  <text x="415" y="230" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">dp2 ← −∞</text>
  <text x="415" y="245" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">dp3 ← −∞</text>
  <text x="415" y="260" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">dp0 ← x（重启）</text>

  <!-- 汇聚 -->
  <path d="M 105 268 C 105 280, 150 282, 175 288" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 260 268 L 260 284" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 415 268 C 415 280, 370 282, 345 288" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="170" y="288" width="180" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="306" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ans ← max(ans, dp3)</text>
  <text x="260" y="328" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">每个有限 dp3 都已是完整三段式</text>

  <!-- 循环判断 -->
  <polygon points="260,334 305,346 260,358 215,346" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="350" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">还有 i？</text>

  <path d="M 215 346 L 18 346 L 18 97 L 160 97" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="110" y="340" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">是</text>
  <path d="M 305 346 L 394 346" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="330" y="338" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">否</text>

  <rect x="398" y="334" width="92" height="24" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="444" y="350" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">返回 ans</text>

  <!-- 顺序警告 -->
  <rect x="385" y="84" width="128" height="48" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="449" y="101" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">⚠ 更新顺序</text>
  <text x="449" y="116" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">dp3→dp2→dp1→dp0</text>
  <text x="449" y="128" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">先算依赖旧值者</text>
</svg>
