<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">满二叉树：节点数必为奇数 + 递归分解</text>

  <!-- ===== Left section: Parity ===== -->
  <text x="140" y="54" text-anchor="middle" font-size="12" fill="#888">奇偶性观察</text>

  <!-- Small full binary tree (3 nodes) -->
  <circle cx="140" cy="88" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="112" cy="126" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="168" cy="126" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="134" y1="96" x2="117" y2="119" stroke="#666" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="146" y1="96" x2="163" y2="119" stroke="#666" stroke-width="1.3" filter="url(#rough2)"/>

  <text x="112" y="148" text-anchor="middle" font-size="9" fill="#4a7a3a">叶(0子)</text>
  <text x="168" y="148" text-anchor="middle" font-size="9" fill="#4a7a3a">叶(0子)</text>
  <text x="140" y="78" text-anchor="middle" font-size="9" fill="#b85450">内部(2子)</text>

  <!-- Formula box -->
  <rect x="40" y="168" width="200" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="140" y="190" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">n = 2k + 1（奇数）</text>
  <text x="140" y="210" text-anchor="middle" font-size="11" fill="#555">k = 内部节点数，叶 = k+1</text>
  <text x="140" y="232" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">偶数 n → 返回 [ ]</text>

  <!-- ===== Right section: Recursive decomposition ===== -->
  <text x="410" y="54" text-anchor="middle" font-size="12" fill="#888">递归分解</text>

  <!-- Root node -->
  <circle cx="410" cy="88" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="410" y="76" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">root (1节点)</text>

  <!-- Left subtree box -->
  <rect x="335" y="118" width="90" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="380" y="138" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">左子树</text>
  <text x="380" y="156" text-anchor="middle" font-size="11" fill="#446688">i 个节点</text>

  <!-- Right subtree box -->
  <rect x="445" y="118" width="90" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="490" y="138" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">右子树</text>
  <text x="490" y="156" text-anchor="middle" font-size="11" fill="#4a7a3a">n−1−i 个节点</text>

  <!-- Edges from root to subtrees -->
  <line x1="402" y1="96" x2="385" y2="116" stroke="#666" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="418" y1="96" x2="435" y2="116" stroke="#666" stroke-width="1.3" filter="url(#rough2)"/>

  <!-- Formula box for i -->
  <rect x="320" y="190" width="180" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="410" y="212" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i = 1, 3, 5, …, n−2</text>
  <text x="410" y="232" text-anchor="middle" font-size="11" fill="#555">步长 2（i 与 n−1−i 均为奇）</text>
  <text x="410" y="254" text-anchor="middle" font-size="11" fill="#d6a040">左右各自递归 → 笛卡尔积</text>

  <!-- ===== Bottom note ===== -->
  <rect x="40" y="288" width="480" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="280" y="310" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">💡 记忆化：dp[n] 缓存 n 个节点的所有满二叉树列表</text>
  <text x="280" y="328" text-anchor="middle" font-size="11" fill="#555">子问题重叠——如 n=7 时 dp[3] 被 (1,5) 和 (3,3) 共同复用</text>
</svg>
