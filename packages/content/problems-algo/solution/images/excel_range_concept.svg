<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    范围 = [col1..col2] × [row1..row2] 的矩形块
  </text>

  <!-- column headers A..G -->
  <g filter="url(#rough2)" font-size="13" fill="#446688" text-anchor="middle">
    <text x="131" y="76">A</text>
    <text x="173" y="76">B</text>
    <text x="215" y="76">C</text>
    <text x="257" y="76">D</text>
    <text x="299" y="76">E</text>
    <text x="341" y="76">F</text>
    <text x="383" y="76">G</text>
  </g>

  <!-- row headers 1..4 -->
  <g filter="url(#rough2)" font-size="13" fill="#446688" text-anchor="middle">
    <text x="108" y="103">1</text>
    <text x="108" y="137">2</text>
    <text x="108" y="171">3</text>
    <text x="108" y="205">4</text>
  </g>

  <!-- grid cells (7 cols x 4 rows), cell 42x34, start x=110 y=86 -->
  <g filter="url(#rough2)" stroke="#446688" stroke-width="1.2" fill="none">
    <rect x="110" y="86" width="294" height="136"/>
    <line x1="152" y1="86" x2="152" y2="222"/>
    <line x1="194" y1="86" x2="194" y2="222"/>
    <line x1="236" y1="86" x2="236" y2="222"/>
    <line x1="278" y1="86" x2="278" y2="222"/>
    <line x1="320" y1="86" x2="320" y2="222"/>
    <line x1="362" y1="86" x2="362" y2="222"/>
    <line x1="110" y1="120" x2="404" y2="120"/>
    <line x1="110" y1="154" x2="404" y2="154"/>
    <line x1="110" y1="188" x2="404" y2="188"/>
  </g>

  <!-- highlighted range C2:E3 -->
  <rect x="194" y="120" width="126" height="68" fill="#e6f4ea" stroke="#4a7a3a"
        stroke-width="2.2" rx="3" filter="url(#rough2)"/>

  <!-- corner labels -->
  <g filter="url(#rough2)" font-size="12" fill="#4a7a3a" text-anchor="middle">
    <text x="215" y="141">C2</text>
    <text x="257" y="141">D2</text>
    <text x="299" y="141">E2</text>
    <text x="215" y="175">C3</text>
    <text x="257" y="175">D3</text>
    <text x="299" y="175">E3</text>
  </g>

  <!-- arrows pointing to corners -->
  <path d="M 460,120 L 322,120" stroke="#b85450" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="464" y="116" font-size="12" fill="#b85450" filter="url(#rough2)">左上 (c1,r1)</text>

  <path d="M 460,222 L 322,188" stroke="#b85450" stroke-width="1.6" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="464" y="232" font-size="12" fill="#b85450" filter="url(#rough2)">右下 (c2,r2)</text>

  <!-- note box -->
  <rect x="40" y="250" width="440" height="86" rx="8" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="58" y="276" font-size="13" fill="#333" filter="url(#rough2)">
    字符串 s = "&lt;col1&gt;&lt;row1&gt;:&lt;col2&gt;&lt;row2&gt;"，如 "C2:E3"
  </text>
  <text x="58" y="298" font-size="13" fill="#333" filter="url(#rough2)">
    • 列用字母 A–Z：'A'→1 … 'Z'→26（本题单字母，直接比字符序）
  </text>
  <text x="58" y="318" font-size="13" fill="#333" filter="url(#rough2)">
    • 行用数字 1–9：直接比数值。c1≤c2、r1≤r2 已保证。
  </text>
</svg>
