<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：time = [30, 20, 150, 100, 40]</text>

  <!-- table header -->
  <rect x="20" y="44" width="520" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="50"  y="61" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">步骤</text>
  <text x="110" y="61" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">t</text>
  <text x="170" y="61" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">r=t%60</text>
  <text x="250" y="61" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">comp=(60−r)%60</text>
  <text x="350" y="61" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">命中 count[comp]</text>
  <text x="430" y="61" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">累计 ans</text>
  <text x="510" y="61" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">count 更新</text>

  <!-- column dividers -->
  <line x1="80"  y1="44" x2="80"  y2="360" stroke="#cdd6e4" stroke-width="1" filter="url(#rough2)"/>
  <line x1="140" y1="44" x2="140" y2="360" stroke="#cdd6e4" stroke-width="1" filter="url(#rough2)"/>
  <line x1="210" y1="44" x2="210" y2="360" stroke="#cdd6e4" stroke-width="1" filter="url(#rough2)"/>
  <line x1="300" y1="44" x2="300" y2="360" stroke="#cdd6e4" stroke-width="1" filter="url(#rough2)"/>
  <line x1="390" y1="44" x2="390" y2="360" stroke="#cdd6e4" stroke-width="1" filter="url(#rough2)"/>
  <line x1="470" y1="44" x2="470" y2="360" stroke="#cdd6e4" stroke-width="1" filter="url(#rough2)"/>

  <!-- row: init -->
  <rect x="20" y="72" width="520" height="22" fill="#f4f6f8" stroke="#dde3ec" stroke-width="1" filter="url(#rough2)"/>
  <text x="50"  y="87" text-anchor="middle" font-size="11" fill="#888">初始</text>
  <text x="110" y="87" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="170" y="87" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="250" y="87" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="350" y="87" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="430" y="87" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="510" y="87" text-anchor="middle" font-size="11" fill="#888">全 0</text>

  <!-- row 1: t=30 -->
  <text x="50"  y="111" text-anchor="middle" font-size="11" fill="#333">i=0</text>
  <text x="110" y="111" text-anchor="middle" font-size="11" fill="#333">30</text>
  <text x="170" y="111" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">30</text>
  <text x="250" y="111" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">30</text>
  <text x="350" y="111" text-anchor="middle" font-size="11" fill="#b85450">0</text>
  <text x="430" y="111" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="510" y="111" text-anchor="middle" font-size="11" fill="#333">count[30]=1</text>

  <!-- row 2: t=20 -->
  <rect x="20" y="116" width="520" height="22" fill="#f4f6f8" stroke="#dde3ec" stroke-width="1" filter="url(#rough2)"/>
  <text x="50"  y="131" text-anchor="middle" font-size="11" fill="#333">i=1</text>
  <text x="110" y="131" text-anchor="middle" font-size="11" fill="#333">20</text>
  <text x="170" y="131" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">20</text>
  <text x="250" y="131" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">40</text>
  <text x="350" y="131" text-anchor="middle" font-size="11" fill="#b85450">0</text>
  <text x="430" y="131" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="510" y="131" text-anchor="middle" font-size="11" fill="#333">count[20]=1</text>

  <!-- row 3: t=150 -->
  <text x="50"  y="155" text-anchor="middle" font-size="11" fill="#333">i=2</text>
  <text x="110" y="155" text-anchor="middle" font-size="11" fill="#333">150</text>
  <text x="170" y="155" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">30</text>
  <text x="250" y="155" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">30</text>
  <text x="350" y="155" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="430" y="155" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="510" y="155" text-anchor="middle" font-size="11" fill="#333">count[30]=2</text>

  <!-- row 4: t=100 -->
  <rect x="20" y="160" width="520" height="22" fill="#f4f6f8" stroke="#dde3ec" stroke-width="1" filter="url(#rough2)"/>
  <text x="50"  y="175" text-anchor="middle" font-size="11" fill="#333">i=3</text>
  <text x="110" y="175" text-anchor="middle" font-size="11" fill="#333">100</text>
  <text x="170" y="175" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">40</text>
  <text x="250" y="175" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">20</text>
  <text x="350" y="175" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="430" y="175" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="510" y="175" text-anchor="middle" font-size="11" fill="#333">count[40]=1</text>

  <!-- row 5: t=40 -->
  <text x="50"  y="199" text-anchor="middle" font-size="11" fill="#333">i=4</text>
  <text x="110" y="199" text-anchor="middle" font-size="11" fill="#333">40</text>
  <text x="170" y="199" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">40</text>
  <text x="250" y="199" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">20</text>
  <text x="350" y="199" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="430" y="199" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="510" y="199" text-anchor="middle" font-size="11" fill="#333">count[40]=2</text>

  <!-- pairing explanation -->
  <rect x="20" y="232" width="520" height="150" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="254" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">配对解读（i &lt; j，先查再写自然保证）</text>

  <text x="40" y="278" font-size="11.5" fill="#333">• i=2 (r=30) 命中 1 → 与 i=0 (r=30) 配对：30+150 = 180 ✓</text>
  <text x="40" y="298" font-size="11.5" fill="#333">• i=3 (r=40, comp=20) 命中 1 → 与 i=1 (r=20) 配对：100+20 = 120 ✓</text>
  <text x="40" y="318" font-size="11.5" fill="#333">• i=4 (r=40, comp=20) 命中 1 → 与 i=1 (r=20) 配对：40+20 = 60 ✓</text>

  <text x="40" y="344" font-size="11.5" fill="#b85450" font-weight="bold">最终 ans = 3</text>
  <text x="40" y="366" font-size="10.5" fill="#888">注：r=0 自配对 comp=0；r=30 自配对 comp=30；(60−r)%60 统一覆盖全部 60 类。</text>
</svg>
