<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：Horner 累乘加——合成方向无需减 1</text>

  <!-- ===== Row 1: Excel 字母表（1-indexed，无 0，但合成不取余 → 无所谓）===== -->
  <text x="36" y="68" font-size="12" fill="#446688" font-weight="bold">Excel 列</text>
  <text x="36" y="82" font-size="10" fill="#888">1-indexed</text>

  <rect x="120" y="52" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="138" y="73" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">A</text>
  <text x="138" y="98" text-anchor="middle" font-size="10" fill="#888">1</text>

  <rect x="166" y="52" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="184" y="73" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">B</text>
  <text x="184" y="98" text-anchor="middle" font-size="10" fill="#888">2</text>

  <text x="220" y="73" font-size="14" fill="#bbb" font-weight="bold">···</text>

  <rect x="250" y="52" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="268" y="73" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">Y</text>
  <text x="268" y="98" text-anchor="middle" font-size="10" fill="#888">25</text>

  <rect x="296" y="52" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="314" y="73" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">Z</text>
  <text x="314" y="98" text-anchor="middle" font-size="10" fill="#888">26</text>

  <!-- 无 0 但无所谓的说明 -->
  <rect x="356" y="50" width="170" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="441" y="68" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">数码 1~26，不含 0</text>
  <text x="441" y="82" text-anchor="middle" font-size="10.5" fill="#4a7a3a">合成只用乘加，不取余</text>

  <!-- arrow down -->
  <path d="M 280 108 Q 280 120 280 130" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row 2: 按位权展开 → Horner 改写 ===== -->
  <text x="34" y="160" font-size="12" fill="#446688" font-weight="bold">以 "AB" 为例</text>

  <!-- 左：按位权展开 -->
  <rect x="34" y="170" width="240" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="154" y="190" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">按位权展开</text>
  <text x="154" y="212" text-anchor="middle" font-size="12" fill="#333">A×26¹ + B×26⁰</text>
  <text x="154" y="232" text-anchor="middle" font-size="12" fill="#333">= 1×26 + 2×1</text>
  <text x="154" y="250" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">= 28</text>

  <!-- 中间箭头：Horner 改写 -->
  <path d="M 282 212 L 318 212" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="300" y="204" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">Horner</text>
  <text x="300" y="228" text-anchor="middle" font-size="10" fill="#4a7a3a">改写</text>

  <!-- 右：累乘加 -->
  <rect x="326" y="170" width="200" height="84" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="426" y="190" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">累乘加（从左到右）</text>
  <text x="426" y="212" text-anchor="middle" font-size="11.5" fill="#333">((0×26+1)×26+2)</text>
  <text x="426" y="231" text-anchor="middle" font-size="11" fill="#888">先 A：0×26+1=1</text>
  <text x="426" y="247" text-anchor="middle" font-size="11" fill="#888">再 B：1×26+2=28</text>

  <!-- arrow down to formula -->
  <path d="M 280 262 Q 280 274 280 284" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- formula box -->
  <rect x="50" y="288" width="460" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="310" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">res = 0;  for ch:  res = res × 26 + (ord(ch) − 'A' + 1);  digit ∈ [1,26]</text>

  <!-- ===== Row 3: 168 vs 171 对照 ===== -->
  <rect x="40" y="338" width="240" height="78" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="160" y="358" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">168 分解（整数→串）</text>
  <text x="160" y="378" text-anchor="middle" font-size="10.5" fill="#555">n % 26 取余抠低位</text>
  <text x="160" y="394" text-anchor="middle" font-size="10.5" fill="#555">余 0 时无字母对应</text>
  <text x="160" y="410" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">→ 每轮必须先 n--</text>

  <rect x="290" y="338" width="240" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="410" y="358" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">171 合成（串→整数）</text>
  <text x="410" y="378" text-anchor="middle" font-size="10.5" fill="#555">res×26 + digit 累加</text>
  <text x="410" y="394" text-anchor="middle" font-size="10.5" fill="#555">只用乘加，不取余</text>
  <text x="410" y="410" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">→ 无须修正</text>
</svg>
