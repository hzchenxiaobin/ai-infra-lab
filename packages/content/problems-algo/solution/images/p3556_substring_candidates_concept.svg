<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">n ≤ 10：候选至多 55 个，枚举 + 试除就是最优解</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">以 s = "12234"（n = 5）为例，全部 15 个子串数值化后排成三角：</text>

  <!-- 行 i=0 -->
  <text x="30" y="75" font-size="11" fill="#888" filter="url(#rough2)">i=0</text>
  <rect x="62" y="58" width="66" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="95" y="76" text-anchor="middle" font-size="12" fill="#8a6d3a" filter="url(#rough2)">1</text>
  <rect x="134" y="58" width="66" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="167" y="76" text-anchor="middle" font-size="12" fill="#8a6d3a" filter="url(#rough2)">12</text>
  <rect x="206" y="58" width="66" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="239" y="76" text-anchor="middle" font-size="12" fill="#8a6d3a" filter="url(#rough2)">122</text>
  <rect x="278" y="58" width="66" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="311" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">1223</text>
  <rect x="350" y="58" width="66" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="383" y="76" text-anchor="middle" font-size="12" fill="#8a6d3a" filter="url(#rough2)">12234</text>

  <!-- 行 i=1 -->
  <text x="30" y="108" font-size="11" fill="#888" filter="url(#rough2)">i=1</text>
  <rect x="134" y="91" width="66" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="167" y="109" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">2</text>
  <rect x="206" y="91" width="66" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="239" y="109" text-anchor="middle" font-size="12" fill="#8a6d3a" filter="url(#rough2)">22</text>
  <rect x="278" y="91" width="66" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="311" y="109" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">223</text>
  <rect x="350" y="91" width="66" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="383" y="109" text-anchor="middle" font-size="12" fill="#8a6d3a" filter="url(#rough2)">2234</text>

  <!-- 行 i=2 -->
  <text x="30" y="141" font-size="11" fill="#888" filter="url(#rough2)">i=2</text>
  <rect x="206" y="124" width="66" height="26" rx="4" fill="#e6f4ea" stroke="#446688" stroke-width="2.2" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="239" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="278" y="124" width="66" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="311" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">23</text>
  <rect x="350" y="124" width="66" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="383" y="142" text-anchor="middle" font-size="12" fill="#8a6d3a" filter="url(#rough2)">234</text>

  <!-- 行 i=3 -->
  <text x="30" y="174" font-size="11" fill="#888" filter="url(#rough2)">i=3</text>
  <rect x="278" y="157" width="66" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="311" y="175" text-anchor="middle" font-size="12" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">3</text>
  <rect x="350" y="157" width="66" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="383" y="175" text-anchor="middle" font-size="12" fill="#8a6d3a" filter="url(#rough2)">34</text>

  <!-- 行 i=4 -->
  <text x="30" y="207" font-size="11" fill="#888" filter="url(#rough2)">i=4</text>
  <rect x="350" y="190" width="66" height="26" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="383" y="208" text-anchor="middle" font-size="12" fill="#8a6d3a" filter="url(#rough2)">4</text>

  <!-- 图例 -->
  <text x="60" y="234" font-size="10.5" fill="#2a5a2a" filter="url(#rough2)">■ 绿 = 质数</text>
  <text x="160" y="234" font-size="10.5" fill="#8a6d3a" filter="url(#rough2)">■ 黄 = 非质数</text>
  <text x="270" y="234" font-size="10.5" fill="#446688" filter="url(#rough2)">■ 蓝虚线 = 数值重复，去重只算一个</text>

  <!-- 质数集合结论 -->
  <rect x="46" y="242" width="428" height="26" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="260" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">不同质数 {2, 3, 23, 223, 1223}，最大 3 个：1223 + 223 + 23 = 1469</text>

  <!-- 规模账 -->
  <rect x="46" y="276" width="428" height="46" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="294" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">子串 ≤ 10×11/2 = 55 个，数值 ≤ 9999999999 → 试除 ≤ √x &lt; 10^5 步</text>
  <text x="260" y="312" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">总账 55 × 10^5 ≈ 5.5×10^6 次整除 —— 毫秒级，暴力即正解</text>

  <!-- 溢出警告 -->
  <rect x="46" y="330" width="428" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="346" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">⚠ 9999999999 已超出 int32 上限 2^31−1 ≈ 2.1×10^9</text>
  <text x="260" y="363" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">C++ 必须用 long long + stoll；Python 整数无位宽限制</text>
</svg>
