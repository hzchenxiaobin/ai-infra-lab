<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一趟扫描求每个设备的最小值与次小值，直接拼出答案</text>

  <!-- 起点 -->
  <rect x="185" y="44" width="150" height="32" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="10.5" fill="#2f5527" filter="url(#rough2)">输入 units（m × n）</text>
  <path d="M 260 76 L 260 92" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 判定 n == 1 ? -->
  <polygon points="260,96 322,128 260,160 198,128" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="132" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">n == 1 ?</text>

  <!-- 左分支：n == 1 -->
  <path d="M 197 128 L 184 128" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="192" y="118" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="28" y="104" width="152" height="52" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="104" y="122" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 Σ units[i][0]</text>
  <text x="104" y="137" text-anchor="middle" font-size="8.5" fill="#a04540" filter="url(#rough2)">任何操作都会清空源设备、</text>
  <text x="104" y="149" text-anchor="middle" font-size="8.5" fill="#a04540" filter="url(#rough2)">还压低接收方 → 什么都不做</text>

  <!-- 主分支 -->
  <path d="M 260 160 L 260 174" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="270" y="171" font-size="9" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="155" y="178" width="210" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="195" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">每个设备一趟扫描，同时求：</text>
  <text x="260" y="212" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">a = 最小，b = 次小（允许相等）</text>
  <path d="M 260 222 L 260 236" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="155" y="240" width="210" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="259" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">sumB += b；minB = min(minB, b)</text>
  <text x="260" y="276" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">g = min(g, a)（全局最小容量）</text>
  <path d="M 260 288 L 260 302" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="165" y="306" width="190" height="36" rx="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="329" text-anchor="middle" font-size="11" fill="#2f5527" font-weight="bold" filter="url(#rough2)">返回 sumB − minB + g</text>

  <!-- 右侧小抄 -->
  <rect x="382" y="96" width="126" height="150" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="445" y="114" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">小抄</text>
  <text x="445" y="132" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">· 次小 = 排序后第 2 个</text>
  <text x="445" y="148" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">· Σb 最大约 10¹⁰，</text>
  <text x="445" y="162" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">  C++ 要用 long long</text>
  <text x="445" y="178" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">· m = 1 时无法操作，</text>
  <text x="445" y="192" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">  公式自然退化为 a₁</text>
  <text x="445" y="208" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">· 时间 O(m·n)，空间 O(1)</text>
  <text x="445" y="230" text-anchor="middle" font-size="8.5" fill="#7a5c1a" filter="url(#rough2)">（m·n ≤ 2×10⁵）</text>
</svg>
