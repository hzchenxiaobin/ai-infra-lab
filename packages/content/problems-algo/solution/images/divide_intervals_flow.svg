<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：差分数组 —— 区间标记 → 前缀和 → 取峰值</text>

  <!-- Step 1 -->
  <rect x="150" y="48" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="73" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① 找 maxR = max(right_i)，开 diff[1..maxR+1]</text>
  <line x1="280" y1="90" x2="280" y2="110" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="120" y="112" width="320" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="132" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">② 遍历每个区间 [l, r]：差分标记</text>
  <text x="280" y="150" text-anchor="middle" font-size="11" fill="#4a7a3a">diff[l] += 1，diff[r+1] -= 1</text>
  <line x1="280" y1="164" x2="280" y2="184" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="100" y="186" width="360" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="208" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">③ 前缀和扫描，逐点累加活跃数</text>
  <text x="280" y="226" text-anchor="middle" font-size="11" fill="#d6a040">cur += diff[i]；ans = max(ans, cur)</text>
  <text x="280" y="240" text-anchor="middle" font-size="10.5" fill="#a07820">cur 即坐标 i 处正在重叠的区间数</text>
  <line x1="280" y1="246" x2="280" y2="266" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4 -->
  <rect x="150" y="268" width="260" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="293" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">④ 返回 ans（峰值 = 最少组数）</text>

  <!-- why r+1 note -->
  <rect x="40" y="328" width="480" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="56" y="350" font-size="12" fill="#446688" font-weight="bold">⚠️ 为什么 -1 标在 r+1 而不是 r？</text>
  <text x="56" y="368" font-size="11" fill="#446688">闭区间 [l,r] 在点 r 仍活跃；前缀和到 r+1 时才减去，保证 r 这一位被计入</text>
  <text x="56" y="386" font-size="11" fill="#446688">例：[1,5] 与 [5,8] 在点 5 相交 ⟹ diff[1]+=1, diff[6]-=1（[1,5] 活跃到 5）</text>
</svg>
