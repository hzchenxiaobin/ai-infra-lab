<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">二分找右界：最后一个 snap_id ≤ target</text>

  <!-- snap_id array -->
  <text x="60" y="74" font-size="12" fill="#888">arr[0].snap:</text>
  <rect x="160" y="58" width="70" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="195" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="230" y="58" width="70" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="265" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="300" y="58" width="70" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="335" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <text x="195" y="110" text-anchor="middle" font-size="9" fill="#aaa">idx 0</text>
  <text x="265" y="110" text-anchor="middle" font-size="9" fill="#aaa">idx 1</text>
  <text x="335" y="110" text-anchor="middle" font-size="9" fill="#aaa">idx 2</text>

  <!-- val array -->
  <text x="60" y="138" font-size="12" fill="#888">arr[0].val:</text>
  <rect x="160" y="122" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="195" y="141" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="230" y="122" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="265" y="141" text-anchor="middle" font-size="11" fill="#333">6</text>
  <rect x="300" y="122" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="335" y="141" text-anchor="middle" font-size="11" fill="#333">9</text>

  <!-- target -->
  <rect x="160" y="166" width="210" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="265" y="186" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">target = snap_id = 1   （找 ≤ 1 的最大）</text>

  <!-- step 1: mid = 1, value 1 <= 1 -> ans=1, lo=2 -->
  <text x="60" y="224" font-size="11" fill="#555" font-weight="bold">轮 1</text>
  <rect x="100" y="208" width="340" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="228" text-anchor="middle" font-size="11" fill="#444">mid = 1 → snap[1] = 1 ≤ 1 ✓  记 ans = 1，lo = 2</text>

  <!-- step 2: mid = 2, value 2 > 1 -> hi=1 -->
  <text x="60" y="260" font-size="11" fill="#555" font-weight="bold">轮 2</text>
  <rect x="100" y="244" width="340" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="264" text-anchor="middle" font-size="11" fill="#444">mid = 2 → snap[2] = 2 &gt; 1 ✗  hi = 1</text>

  <!-- terminate -->
  <text x="60" y="296" font-size="11" fill="#555" font-weight="bold">终止</text>
  <rect x="100" y="280" width="340" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="300" text-anchor="middle" font-size="11" fill="#333">lo = 2 &gt; hi = 1 → 退出，ans = 1</text>

  <!-- highlight chosen cell: idx1 -->
  <rect x="230" y="58" width="70" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="265" y="82" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>

  <path d="M 265 96 L 265 158" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4,2" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="80" y="322" width="360" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="342" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">等价于 upper_bound(snap_id) − 1  →  返回 val = 6</text>
</svg>
