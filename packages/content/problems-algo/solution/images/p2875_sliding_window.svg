<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="360" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">翻倍数组上的滑动窗口：找和恰好为 r 的最短窗口</text>
  <text x="310" y="48" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">示例 2：nums = [1,1,1,2,3]，target = 4 → S = 8，k = 0，r = 4</text>

  <!-- brackets above the two candidate windows -->
  <path d="M 116 88 L 116 74 L 256 74 L 256 88" fill="none" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="186" y="66" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">候选① [1,1,2]</text>
  <path d="M 260 88 L 260 74 L 352 74 L 352 88" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="306" y="66" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">最优 [3,1]</text>

  <!-- doubled array cells -->
  <rect x="68" y="96" width="44" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="90" y="123" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <rect x="116" y="96" width="44" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="138" y="123" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="164" y="96" width="44" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="186" y="123" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="212" y="96" width="44" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="234" y="123" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>

  <rect x="260" y="96" width="44" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="282" y="123" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="308" y="96" width="44" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="330" y="123" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>

  <rect x="356" y="96" width="44" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="378" y="123" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="404" y="96" width="44" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="426" y="123" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="452" y="96" width="44" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="474" y="123" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="500" y="96" width="44" height="42" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="522" y="123" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>

  <!-- boundary between the two copies -->
  <path d="M 306 84 L 306 152" stroke="#999" stroke-width="1.2" stroke-dasharray="5,4" fill="none" filter="url(#rough2)"/>

  <!-- copy labels -->
  <text x="186" y="170" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">第 1 份 nums</text>
  <text x="426" y="170" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">第 2 份 nums</text>

  <!-- window annotations -->
  <text x="186" y="196" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">和 = 4，长 = 3（非最优）</text>
  <text x="306" y="220" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">和 = 4，长 = 2 ✓ 跨副本边界 = 环上窗口！</text>

  <!-- rule box -->
  <rect x="70" y="242" width="480" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="268" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">全正数 ⇒ 窗口和随扩张 / 收缩严格单调：s &gt; r 时左缩，s == r 时记录候选</text>
  <text x="310" y="292" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">任何和为 r 的窗口长度 &lt; n：连续 n 个元素恰是一整份，和为 S &gt; r</text>

  <text x="310" y="338" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">扫完 2n 格都凑不出 r ⇒ 返回 −1（如示例 3：r = 3 无解）</text>
</svg>
