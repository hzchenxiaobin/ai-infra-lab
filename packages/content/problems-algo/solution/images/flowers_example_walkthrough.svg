<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：flowerbed = [1,0,0,0,0,0,1], n = 2</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">逐位置决策，种过就原地改 1，最终 count = 2 ≥ n</text>

  <g filter="url(#rough2)">
    <rect x="30" y="58" width="500" height="24" fill="#446688" stroke="#446688" stroke-width="1" rx="3"/>
    <text x="55" y="74" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">步骤</text>
    <text x="96" y="74" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">i</text>
    <text x="132" y="74" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">值</text>
    <text x="196" y="74" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">左 / 右</text>
    <text x="282" y="74" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">决策</text>
    <text x="398" y="74" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">bed 变化</text>
    <text x="501" y="74" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">count</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="82" width="500" height="22" fill="#e8f0fe" stroke="#c0d0e8" stroke-width="0.8"/>
    <text x="55" y="97" text-anchor="middle" font-size="10" fill="#333">1</text>
    <text x="96" y="97" text-anchor="middle" font-size="10" fill="#333">0</text>
    <text x="132" y="97" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">1</text>
    <text x="196" y="97" text-anchor="middle" font-size="10" fill="#888">—</text>
    <text x="282" y="97" text-anchor="middle" font-size="10" fill="#446688">跳过</text>
    <text x="398" y="97" text-anchor="middle" font-size="10" fill="#888">—</text>
    <text x="501" y="97" text-anchor="middle" font-size="10" fill="#333">0</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="104" width="500" height="22" fill="#fce4ec" stroke="#e8b0b0" stroke-width="0.8"/>
    <text x="55" y="119" text-anchor="middle" font-size="10" fill="#333">2</text>
    <text x="96" y="119" text-anchor="middle" font-size="10" fill="#333">1</text>
    <text x="132" y="119" text-anchor="middle" font-size="10" fill="#888">0</text>
    <text x="196" y="119" text-anchor="middle" font-size="10" fill="#b85450">左=1</text>
    <text x="282" y="119" text-anchor="middle" font-size="10" fill="#b85450">× 左堵</text>
    <text x="398" y="119" text-anchor="middle" font-size="10" fill="#888">—</text>
    <text x="501" y="119" text-anchor="middle" font-size="10" fill="#333">0</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="126" width="500" height="22" fill="#e6f4ea" stroke="#a0c0a0" stroke-width="0.8"/>
    <text x="55" y="141" text-anchor="middle" font-size="10" fill="#333">3</text>
    <text x="96" y="141" text-anchor="middle" font-size="10" fill="#333">2</text>
    <text x="132" y="141" text-anchor="middle" font-size="10" fill="#888">0</text>
    <text x="196" y="141" text-anchor="middle" font-size="10" fill="#4a7a3a">0 / 0</text>
    <text x="282" y="141" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">种 ✓</text>
    <text x="398" y="141" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">bed[2] = 1</text>
    <text x="501" y="141" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="148" width="500" height="22" fill="#fce4ec" stroke="#e8b0b0" stroke-width="0.8"/>
    <text x="55" y="163" text-anchor="middle" font-size="10" fill="#333">4</text>
    <text x="96" y="163" text-anchor="middle" font-size="10" fill="#333">3</text>
    <text x="132" y="163" text-anchor="middle" font-size="10" fill="#888">0</text>
    <text x="196" y="163" text-anchor="middle" font-size="10" fill="#b85450">左=1</text>
    <text x="282" y="163" text-anchor="middle" font-size="10" fill="#b85450">× 左堵</text>
    <text x="398" y="163" text-anchor="middle" font-size="10" fill="#888">—</text>
    <text x="501" y="163" text-anchor="middle" font-size="10" fill="#333">1</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="170" width="500" height="22" fill="#e6f4ea" stroke="#a0c0a0" stroke-width="0.8"/>
    <text x="55" y="185" text-anchor="middle" font-size="10" fill="#333">5</text>
    <text x="96" y="185" text-anchor="middle" font-size="10" fill="#333">4</text>
    <text x="132" y="185" text-anchor="middle" font-size="10" fill="#888">0</text>
    <text x="196" y="185" text-anchor="middle" font-size="10" fill="#4a7a3a">0 / 0</text>
    <text x="282" y="185" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">种 ✓</text>
    <text x="398" y="185" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">bed[4] = 1</text>
    <text x="501" y="185" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="192" width="500" height="22" fill="#fce4ec" stroke="#e8b0b0" stroke-width="0.8"/>
    <text x="55" y="207" text-anchor="middle" font-size="10" fill="#333">6</text>
    <text x="96" y="207" text-anchor="middle" font-size="10" fill="#333">5</text>
    <text x="132" y="207" text-anchor="middle" font-size="10" fill="#888">0</text>
    <text x="196" y="207" text-anchor="middle" font-size="10" fill="#b85450">左=1</text>
    <text x="282" y="207" text-anchor="middle" font-size="10" fill="#b85450">× 左堵</text>
    <text x="398" y="207" text-anchor="middle" font-size="10" fill="#888">—</text>
    <text x="501" y="207" text-anchor="middle" font-size="10" fill="#333">2</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="214" width="500" height="22" fill="#e8f0fe" stroke="#c0d0e8" stroke-width="0.8"/>
    <text x="55" y="229" text-anchor="middle" font-size="10" fill="#333">7</text>
    <text x="96" y="229" text-anchor="middle" font-size="10" fill="#333">6</text>
    <text x="132" y="229" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">1</text>
    <text x="196" y="229" text-anchor="middle" font-size="10" fill="#888">—</text>
    <text x="282" y="229" text-anchor="middle" font-size="10" fill="#446688">跳过</text>
    <text x="398" y="229" text-anchor="middle" font-size="10" fill="#888">—</text>
    <text x="501" y="229" text-anchor="middle" font-size="10" fill="#333">2</text>
  </g>

  <g filter="url(#rough2)">
    <rect x="30" y="248" width="500" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8"/>
    <text x="280" y="270" text-anchor="middle" font-size="12" fill="#a07820" font-weight="bold">最终：bed = [1,0,1,0,1,0,1]，count = 2</text>
    <text x="280" y="288" text-anchor="middle" font-size="11" fill="#888">count = 2 ≥ n = 2 → 返回 true</text>
  </g>

  <text x="280" y="324" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">规律：种满后呈现 1,0,1,0,1,… 的交替模式，正是"每隔一个种一个"</text>
</svg>
