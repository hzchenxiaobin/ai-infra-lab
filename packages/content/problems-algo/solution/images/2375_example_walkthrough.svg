<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="480" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="240" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：pattern = "IIIDIDDD"，逐段翻转 D 连续区</text>

  <!-- pattern row label -->
  <text x="42" y="50" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">pattern</text>
  <!-- pattern chars between cells : I I I D I D D D at x=110,150,190,230,270,310,350,390 -->
  <g filter="url(#rough2)">
    <text x="110" y="52" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">I</text>
    <text x="150" y="52" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">I</text>
    <text x="190" y="52" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">I</text>
    <text x="230" y="52" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">D</text>
    <text x="270" y="52" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">I</text>
    <text x="310" y="52" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">D</text>
    <text x="350" y="52" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">D</text>
    <text x="390" y="52" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">D</text>
  </g>

  <!-- ===== State A : base "123456789" ; highlight D-run1 [3,4] ===== -->
  <text x="42" y="84" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">初始基串</text>
  <g filter="url(#rough2)">
    <rect x="90"  y="64" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="110" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
    <rect x="130" y="64" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="150" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
    <rect x="170" y="64" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="190" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
    <rect x="210" y="64" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="230" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
    <rect x="250" y="64" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="270" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
    <rect x="290" y="64" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="310" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
    <rect x="330" y="64" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="350" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
    <rect x="370" y="64" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="390" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>
    <rect x="410" y="64" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="430" y="84" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">9</text>
  </g>

  <!-- op1 arrow -->
  <path d="M 230 96 L 230 116" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="246" y="110" font-size="11" fill="#d6a040" font-weight="bold">reverse num[3..4]（D 段①）</text>

  <!-- ===== State B : "123546789" ; highlight D-run2 [5,6,7,8] ===== -->
  <text x="42" y="146" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">翻转①后</text>
  <g filter="url(#rough2)">
    <rect x="90"  y="126" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="110" y="146" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
    <rect x="130" y="126" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="150" y="146" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
    <rect x="170" y="126" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="190" y="146" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
    <rect x="210" y="126" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="230" y="146" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">5</text>
    <rect x="250" y="126" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="270" y="146" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">4</text>
    <rect x="290" y="126" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="310" y="146" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
    <rect x="330" y="126" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="350" y="146" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
    <rect x="370" y="126" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="390" y="146" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>
    <rect x="410" y="126" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="430" y="146" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">9</text>
  </g>

  <!-- op2 arrow -->
  <path d="M 330 158 L 330 178" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="346" y="172" font-size="11" fill="#b85450" font-weight="bold">reverse num[5..8]（D 段②）</text>

  <!-- ===== State C : result "123549876" ===== -->
  <text x="42" y="208" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">翻转②后</text>
  <g filter="url(#rough2)">
    <rect x="90"  y="188" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="110" y="208" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
    <rect x="130" y="188" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="150" y="208" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
    <rect x="170" y="188" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="190" y="208" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
    <rect x="210" y="188" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="230" y="208" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">5</text>
    <rect x="250" y="188" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4"/>
    <text x="270" y="208" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">4</text>
    <rect x="290" y="188" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="310" y="208" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">9</text>
    <rect x="330" y="188" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="350" y="208" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">8</text>
    <rect x="370" y="188" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="390" y="208" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">7</text>
    <rect x="410" y="188" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="430" y="208" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">6</text>
  </g>

  <!-- summary box -->
  <rect x="40" y="240" width="400" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="240" y="262" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">校验：I 处升序，D 处降序，全部满足</text>
  <text x="240" y="282" text-anchor="middle" font-size="11" fill="#444">idx2: 3 &lt; 5 ✓ ｜ idx4: 4 &lt; 9 ✓  （I 边界仍升序）</text>
  <text x="240" y="300" text-anchor="middle" font-size="11" fill="#444">idx3: 5 &gt; 4 ✓ ｜ idx5..7: 9 &gt; 8 &gt; 7 &gt; 6 ✓ （D 段已降序）</text>
  <text x="240" y="320" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">结果 "123549876" = 字典序最小解</text>
</svg>
