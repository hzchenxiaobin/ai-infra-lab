<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：grid=[[1,5],[7,3]], x=2</text>
  <text x="270" y="40" text-anchor="middle" font-size="10.5" fill="#888">余数全=1 → 步数 [0,2,3,1] → 排序 [0,1,2,3] → 中位 2 → 操作 4</text>

  <!-- Step 1: take remainder -->
  <text x="40" y="72" font-size="11" fill="#666" font-weight="bold">① 余数</text>
  <rect x="120" y="56" width="300" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="74" text-anchor="middle" font-size="11" fill="#333">r = 1 mod 2 = 1</text>

  <path d="M 270 86 L 270 98" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: check same remainder -->
  <text x="40" y="116" font-size="11" fill="#666" font-weight="bold">② 判同余</text>
  <rect x="120" y="100" width="300" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="118" text-anchor="middle" font-size="11" fill="#4a7a3a">5,7,3 mod 2 全=1 ✓ 可行</text>

  <path d="M 270 130 L 270 142" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: compute steps b (highlight) -->
  <text x="40" y="160" font-size="11" fill="#b85450" font-weight="bold">③ 步数</text>
  <rect x="120" y="144" width="300" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="270" y="162" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">b = [0, 2, 3, 1]  （(a−1)/2）</text>

  <path d="M 270 174 L 270 186" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: sort -->
  <text x="40" y="204" font-size="11" fill="#666" font-weight="bold">④ 排序</text>
  <rect x="120" y="188" width="300" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="270" y="206" text-anchor="middle" font-size="11" fill="#333">b = [0, 1, 2, 3]</text>

  <path d="M 270 218 L 270 230" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: median (highlight) -->
  <text x="40" y="248" font-size="11" fill="#b85450" font-weight="bold">⑤ 中位</text>
  <rect x="120" y="232" width="300" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="270" y="250" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">t = b[4/2] = b[2] = 2</text>

  <path d="M 270 262 L 270 276" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 6: compute ops with b cells -->
  <text x="40" y="298" font-size="11" fill="#666" font-weight="bold">⑥ 求和</text>

  <!-- b cells with |b-t| below -->
  <rect x="110" y="284" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="134" y="305" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <text x="134" y="328" text-anchor="middle" font-size="9.5" fill="#666">|0−2|=2</text>

  <rect x="170" y="284" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="194" y="305" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="194" y="328" text-anchor="middle" font-size="9.5" fill="#666">|1−2|=1</text>

  <rect x="230" y="284" width="48" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="254" y="305" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2</text>
  <text x="254" y="328" text-anchor="middle" font-size="9.5" fill="#b85450">|2−2|=0</text>

  <rect x="290" y="284" width="48" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="314" y="305" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="314" y="328" text-anchor="middle" font-size="9.5" fill="#666">|3−2|=1</text>

  <!-- plus signs -->
  <text x="162" y="305" text-anchor="middle" font-size="14" fill="#888" font-weight="bold">+</text>
  <text x="222" y="305" text-anchor="middle" font-size="14" fill="#888" font-weight="bold">+</text>
  <text x="282" y="305" text-anchor="middle" font-size="14" fill="#888" font-weight="bold">+</text>

  <!-- equals -->
  <text x="350" y="305" text-anchor="middle" font-size="16" fill="#666" font-weight="bold">=</text>

  <!-- result -->
  <rect x="366" y="288" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="394" y="307" text-anchor="middle" font-size="15" fill="#4a7a3a" font-weight="bold">4</text>

  <!-- verify box -->
  <rect x="80" y="346" width="380" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="362" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">验证：目标 v = r + t·x = 1 + 2×2 = 5</text>
  <text x="270" y="376" text-anchor="middle" font-size="10" fill="#888">1→3→5(2次), 5(0次), 7→5(1次), 3→5(1次) = 4 ✓</text>

  <!-- footer -->
  <text x="270" y="404" text-anchor="middle" font-size="10" fill="#aaa">偶数长度 N=4，中位数区间 [1,2] 都最优，取 b[2]=2 保证目标是网格内可达值</text>
</svg>
