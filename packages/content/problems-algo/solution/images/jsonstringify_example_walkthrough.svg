<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="520" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)" font-weight="bold">示例演算：自底向上拼装 {"key":{"a":1,"b":[{},null,"Hello"]}}</text>

  <!-- 第4层（最深叶子）：数组的三个元素 -->
  <text x="40" y="62" font-size="11" fill="#888" filter="url(#rough2)">L3 叶子</text>
  <rect x="100" y="46" width="80" height="30" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="140" y="66" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{}</text>
  <text x="140" y="92" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">→ '{}'</text>

  <rect x="210" y="46" width="80" height="30" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="250" y="66" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">null</text>
  <text x="250" y="92" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">→ 'null'</text>

  <rect x="320" y="46" width="100" height="30" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="370" y="66" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">"Hello"</text>
  <text x="370" y="92" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">→ '"Hello"'</text>

  <!-- 第3层：数组 b -->
  <path d="M 140 100 L 250 120" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 250 100 L 250 120" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 370 100 L 290 120" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="240" y="112" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">join ","</text>

  <text x="40" y="142" font-size="11" fill="#888" filter="url(#rough2)">L2 数组</text>
  <rect x="150" y="126" width="220" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="148" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">[ {} , null , "Hello" ]</text>
  <text x="260" y="178" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)" font-weight="bold">→ '[{},null,"Hello"]'</text>

  <!-- 同时 L2：a=1 叶子 -->
  <rect x="440" y="126" width="100" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="490" y="148" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a: 1</text>
  <text x="490" y="178" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)" font-weight="bold">→ '"a":1'</text>

  <!-- 第2层：内层对象 {"a":1,"b":[...]} -->
  <path d="M 260 184 L 300 210" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 490 184 L 360 210" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="200" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">join ","</text>

  <text x="40" y="232" font-size="11" fill="#888" filter="url(#rough2)">L1 对象</text>
  <rect x="180" y="216" width="300" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="238" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{ "a":1 , "b":[{},null,"Hello"] }</text>
  <text x="330" y="268" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)" font-weight="bold">→ '{"a":1,"b":[{},null,"Hello"]}'</text>

  <!-- 第1层：最外层对象 {"key":{...}} -->
  <path d="M 330 274 L 320 296" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="290" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">"key": + 内层</text>

  <text x="40" y="318" font-size="11" fill="#888" filter="url(#rough2)">L0 根对象</text>
  <rect x="120" y="302" width="420" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="324" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">{ "key": {"a":1,"b":[{},null,"Hello"]} }</text>

  <!-- 最终输出 -->
  <path d="M 330 336 L 330 358" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="360" y="352" font-size="10" fill="#4a7a3a" filter="url(#rough2)" font-weight="bold">return</text>

  <rect x="60" y="360" width="540" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="382" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)" font-family="'Comic Sans MS',monospace">{"key":{"a":1,"b":[{},null,"Hello"]}}</text>

  <!-- 图例 -->
  <rect x="30" y="420" width="580" height="86" rx="8" fill="#fff" stroke="#ddd" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="46" y="442" font-size="12" fill="#333" filter="url(#rough2)" font-weight="bold">读图要点：</text>
  <text x="46" y="460" font-size="11" fill="#555" filter="url(#rough2)">① 递归先钻到最深的叶子，把每个原始值先转成字符串片段；</text>
  <text x="46" y="476" font-size="11" fill="#555" filter="url(#rough2)">② 每层把子片段用 "," 拼接，再套上 []（数组）或 {}（对象）；</text>
  <text x="46" y="492" font-size="11" fill="#555" filter="url(#rough2)">③ 层层向上回传，根节点拼出完整 JSON 字符串——一次遍历搞定。</text>
</svg>
