<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="410" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">数据范围对照：I 版放行暴力，II 版只留 KMP</text>

  <!-- card 1 : problem 3023 -->
  <rect x="28" y="40" width="464" height="126" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="48" y="64" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">3023 · I 版</text>
  <text x="472" y="64" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">m ≤ 100 · 命中在前 10<tspan dy="-4" font-size="8">5</tspan> 位内</text>

  <rect x="40" y="76" width="144" height="80" fill="#ffffff" stroke="#bbb" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="112" y="97" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">滑动窗口整窗重比</text>
  <text x="112" y="117" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">O(n·m) ≈ 10<tspan dy="-4" font-size="8">7</tspan></text>
  <text x="112" y="142" text-anchor="middle" font-size="12" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">✓ 能过</text>

  <rect x="188" y="76" width="144" height="80" fill="#ffffff" stroke="#bbb" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="260" y="97" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">位掩码滚动窗口</text>
  <text x="260" y="117" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">m 位整数，双字可扛</text>
  <text x="260" y="142" text-anchor="middle" font-size="12" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">✓ 能过</text>

  <rect x="336" y="76" width="144" height="80" fill="#ffffff" stroke="#bbb" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="408" y="97" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">KMP</text>
  <text x="408" y="117" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">O(n+m) ≈ 10<tspan dy="-4" font-size="8">5</tspan></text>
  <text x="408" y="142" text-anchor="middle" font-size="12" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">✓ 可选</text>

  <!-- card 2 : problem 3037 -->
  <rect x="28" y="178" width="464" height="150" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="48" y="202" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">3037 · II 版（本题）</text>
  <text x="472" y="202" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">m ≤ 10<tspan dy="-4" font-size="8">4</tspan> · 命中在前 10<tspan dy="-4" font-size="8">5</tspan> 位内</text>

  <rect x="40" y="214" width="144" height="96" fill="#ffffff" stroke="#bbb" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="112" y="235" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">滑动窗口整窗重比</text>
  <text x="112" y="257" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">10<tspan dy="-4" font-size="8">5</tspan><tspan dy="4"> × 10</tspan><tspan dy="-4" font-size="8">4</tspan><tspan dy="4"> ≈ 10</tspan><tspan dy="-4" font-size="8">9</tspan></text>
  <text x="112" y="288" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 超时</text>

  <rect x="188" y="214" width="144" height="96" fill="#ffffff" stroke="#bbb" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="260" y="235" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">位掩码滚动窗口</text>
  <text x="260" y="257" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">10<tspan dy="-4" font-size="8">4</tspan><tspan dy="4"> 位 ≫ 64 位机器字</tspan></text>
  <text x="260" y="288" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 装不下</text>

  <rect x="336" y="214" width="144" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="6" filter="url(#rough2)"/>
  <text x="408" y="235" text-anchor="middle" font-size="11.5" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">KMP ★</text>
  <text x="408" y="257" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">O(n+m) ≈ 10<tspan dy="-4" font-size="8">5</tspan></text>
  <text x="408" y="288" text-anchor="middle" font-size="13" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">唯一正解</text>

  <!-- bottom note -->
  <rect x="28" y="340" width="464" height="54" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="362" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">同一份代码，一行不改：m 放大 100 倍</text>
  <text x="260" y="382" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">「可选优化」被数据范围逼成「唯一解」——官方 hint 直接点名 KMP</text>
</svg>
