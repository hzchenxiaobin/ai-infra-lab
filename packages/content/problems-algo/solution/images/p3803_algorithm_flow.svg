<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一趟扫描 + 集合维护 d，逐前缀比较 L%3</text>

  <!-- 开始 -->
  <rect x="222" y="34" width="156" height="28" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="52" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">开始：i=0, d=0, ans=0</text>
  <path d="M 300 62 L 300 84" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 读入 -->
  <rect x="200" y="88" width="200" height="30" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="107" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">读入 s[i]，前缀长度 L = i+1</text>
  <path d="M 300 118 L 300 142" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 判定1：新字符？ -->
  <polygon points="300,146 396,178 300,210 204,178" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="182" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">s[i] 是新字符？</text>
  <text x="196" y="172" text-anchor="end" font-size="10" fill="#2d5a24" filter="url(#rough2)">是</text>
  <path d="M 204 178 L 182 178" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 左分支：更新集合 -->
  <rect x="30" y="161" width="148" height="34" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="104" y="176" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">seen[c] ← true</text>
  <text x="104" y="190" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">d ← d + 1</text>
  <path d="M 104 195 L 104 240 L 296 240" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 判定1 否 → 下 -->
  <text x="310" y="230" font-size="10" fill="#b85450" filter="url(#rough2)">否（老字符）</text>
  <path d="M 300 210 L 300 236" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 300 240 L 300 254" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 判定2：d == L%3 ? -->
  <polygon points="300,258 396,290 300,322 204,290" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="294" text-anchor="middle" font-size="11.5" fill="#8a6d1f" filter="url(#rough2)">d == L % 3 ?</text>
  <text x="404" y="284" font-size="10" fill="#2d5a24" filter="url(#rough2)">是</text>
  <path d="M 396 290 L 416 290" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 右分支：ans++ -->
  <rect x="420" y="274" width="88" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="464" y="294" text-anchor="middle" font-size="12" fill="#2d5a24" font-weight="bold" filter="url(#rough2)">ans++</text>
  <path d="M 464 306 L 464 350 L 304 350" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 判定2 否 → 下 -->
  <text x="310" y="338" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 300 322 L 300 346" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 300 350 L 300 364" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 判定3：还有字符？ -->
  <polygon points="300,368 375,398 300,428 225,398" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="402" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">还有字符吗？(i+1&lt;n)</text>
  <text x="215" y="390" text-anchor="end" font-size="10" fill="#2d5a24" filter="url(#rough2)">是</text>

  <!-- 回边：i++，回到读入 -->
  <path d="M 225 398 L 12 398 L 12 103 L 196 103" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="22" y="250" font-size="10" fill="#4a7a3a" transform="rotate(-90 22 250)" filter="url(#rough2)">i++，回到读入</text>

  <!-- 判定3 否 → 返回 -->
  <text x="382" y="390" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 375 398 L 395 398" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="400" y="383" width="132" height="30" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="466" y="402" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <!-- 右上注记 -->
  <rect x="424" y="110" width="118" height="96" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="483" y="128" text-anchor="middle" font-size="10" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">注</text>
  <text x="483" y="146" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">d 只增不减，</text>
  <text x="483" y="160" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">新字符恰 +1；</text>
  <text x="483" y="178" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">L%3==0 时 d≥1</text>
  <text x="483" y="192" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">自动不成立</text>

  <!-- 左下注记 -->
  <text x="30" y="296" font-size="10" fill="#33506b" filter="url(#rough2)">一趟 O(n)；</text>
  <text x="30" y="310" font-size="10" fill="#33506b" filter="url(#rough2)">集合至多 26 字符，空间 O(1)</text>
</svg>
