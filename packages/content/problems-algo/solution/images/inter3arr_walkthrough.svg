<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">示例演算：arr1=[1,2,3,4,5]，arr2=[1,2,5,7,9]，arr3=[1,3,4,5,8]</text>

  <!-- header row -->
  <g filter="url(#rough2)">
    <rect x="30" y="56" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <rect x="70" y="56" width="90" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <rect x="160" y="56" width="90" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <rect x="250" y="56" width="120" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
    <rect x="370" y="56" width="200" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
  </g>
  <g font-size="11.5" fill="#444" font-weight="bold">
    <text x="50" y="75" text-anchor="middle">步</text>
    <text x="115" y="75" text-anchor="middle">i, j, k</text>
    <text x="205" y="75" text-anchor="middle">a, b, c</text>
    <text x="310" y="75" text-anchor="middle">判定</text>
    <text x="470" y="75" text-anchor="middle">操作</text>
  </g>

  <!-- Step 1: all equal 1 -->
  <g filter="url(#rough2)">
    <rect x="30" y="88" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3"/>
    <rect x="70" y="88" width="90" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3"/>
    <rect x="160" y="88" width="90" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3"/>
    <rect x="250" y="88" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3"/>
    <rect x="370" y="88" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3"/>
  </g>
  <g font-size="11.5" fill="#333">
    <text x="50" y="107" text-anchor="middle">1</text>
    <text x="115" y="107" text-anchor="middle">0, 0, 0</text>
    <text x="205" y="107" text-anchor="middle" font-weight="bold">1, 1, 1</text>
    <text x="310" y="107" text-anchor="middle" fill="#4a7a3a" font-weight="bold">全等 ✓</text>
    <text x="470" y="107" text-anchor="middle" fill="#4a7a3a" font-weight="bold">加入 1，i++ j++ k++</text>
  </g>

  <!-- Step 2: 2,2,3 min=2 -->
  <g filter="url(#rough2)">
    <rect x="30" y="120" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3"/>
    <rect x="70" y="120" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3"/>
    <rect x="160" y="120" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3"/>
    <rect x="250" y="120" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3"/>
    <rect x="370" y="120" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3"/>
  </g>
  <g font-size="11.5" fill="#333">
    <text x="50" y="139" text-anchor="middle">2</text>
    <text x="115" y="139" text-anchor="middle">1, 1, 1</text>
    <text x="205" y="139" text-anchor="middle" font-weight="bold">2, 2, 3</text>
    <text x="310" y="139" text-anchor="middle" fill="#446688">min=2</text>
    <text x="470" y="139" text-anchor="middle" fill="#446688">i++，j++</text>
  </g>

  <!-- Step 3: 3,5,3 min=3 -->
  <g filter="url(#rough2)">
    <rect x="30" y="152" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3"/>
    <rect x="70" y="152" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3"/>
    <rect x="160" y="152" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3"/>
    <rect x="250" y="152" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3"/>
    <rect x="370" y="152" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3"/>
  </g>
  <g font-size="11.5" fill="#333">
    <text x="50" y="171" text-anchor="middle">3</text>
    <text x="115" y="171" text-anchor="middle">2, 2, 1</text>
    <text x="205" y="171" text-anchor="middle" font-weight="bold">3, 5, 3</text>
    <text x="310" y="171" text-anchor="middle" fill="#446688">min=3</text>
    <text x="470" y="171" text-anchor="middle" fill="#446688">i++，k++</text>
  </g>

  <!-- Step 4: 4,5,4 min=4 -->
  <g filter="url(#rough2)">
    <rect x="30" y="184" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3"/>
    <rect x="70" y="184" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3"/>
    <rect x="160" y="184" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3"/>
    <rect x="250" y="184" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3"/>
    <rect x="370" y="184" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="0.8" rx="3"/>
  </g>
  <g font-size="11.5" fill="#333">
    <text x="50" y="203" text-anchor="middle">4</text>
    <text x="115" y="203" text-anchor="middle">3, 2, 2</text>
    <text x="205" y="203" text-anchor="middle" font-weight="bold">4, 5, 4</text>
    <text x="310" y="203" text-anchor="middle" fill="#446688">min=4</text>
    <text x="470" y="203" text-anchor="middle" fill="#446688">i++，k++</text>
  </g>

  <!-- Step 5: 5,5,5 all equal -->
  <g filter="url(#rough2)">
    <rect x="30" y="216" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3"/>
    <rect x="70" y="216" width="90" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3"/>
    <rect x="160" y="216" width="90" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3"/>
    <rect x="250" y="216" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3"/>
    <rect x="370" y="216" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="3"/>
  </g>
  <g font-size="11.5" fill="#333">
    <text x="50" y="235" text-anchor="middle">5</text>
    <text x="115" y="235" text-anchor="middle">4, 2, 3</text>
    <text x="205" y="235" text-anchor="middle" font-weight="bold">5, 5, 5</text>
    <text x="310" y="235" text-anchor="middle" fill="#4a7a3a" font-weight="bold">全等 ✓</text>
    <text x="470" y="235" text-anchor="middle" fill="#4a7a3a" font-weight="bold">加入 5，i++ j++ k++</text>
  </g>

  <!-- Step 6: end -->
  <g filter="url(#rough2)">
    <rect x="30" y="248" width="40" height="30" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3"/>
    <rect x="70" y="248" width="90" height="30" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3"/>
    <rect x="160" y="248" width="90" height="30" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3"/>
    <rect x="250" y="248" width="120" height="30" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3"/>
    <rect x="370" y="248" width="200" height="30" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="3"/>
  </g>
  <g font-size="11.5" fill="#888">
    <text x="50" y="267" text-anchor="middle">—</text>
    <text x="115" y="267" text-anchor="middle">5, 3, 4</text>
    <text x="205" y="267" text-anchor="middle">—</text>
    <text x="310" y="267" text-anchor="middle">i ≥ n₁</text>
    <text x="470" y="267" text-anchor="middle">循环结束</text>
  </g>

  <!-- Result -->
  <rect x="150" y="300" width="300" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="300" y="322" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">结果（升序、天然去重）</text>
  <text x="300" y="340" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">[1, 5]</text>

  <!-- note -->
  <rect x="60" y="356" width="480" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="378" text-anchor="middle" font-size="11" fill="#555">每个数组内部元素互不相同，故无需额外去重；三指针同步前进保证结果升序</text>
</svg>
