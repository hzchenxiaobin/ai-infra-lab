<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">凸 vs 凹：相邻边叉积符号是否一致</text>

  <!-- ===== 左：凸多边形 ===== -->
  <text x="140" y="58" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">凸多边形（全同号）</text>

  <!-- 正方形顶点 BL->TL->TR->BR -->
  <polygon points="60,290 60,120 220,120 220,290" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>

  <!-- 顶点圆点 -->
  <circle cx="60" cy="290" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="60" cy="120" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="220" cy="120" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="220" cy="290" r="5" fill="#4a7a3a" filter="url(#rough2)"/>

  <!-- 顶点标签 -->
  <text x="48" y="306" font-size="11" fill="#555">p0</text>
  <text x="48" y="114" font-size="11" fill="#555">p1</text>
  <text x="228" y="114" font-size="11" fill="#555">p2</text>
  <text x="228" y="306" font-size="11" fill="#555">p3</text>

  <!-- 叉积符号标注（全负） -->
  <rect x="108" y="200" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="130" y="216" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">−</text>
  <rect x="150" y="146" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="172" y="162" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">−</text>
  <rect x="150" y="248" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="172" y="264" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">−</text>
  <rect x="74" y="200" width="44" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="96" y="216" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">−</text>

  <text x="140" y="340" text-anchor="middle" font-size="11" fill="#4a7a3a">四个拐弯全为右转 → true</text>

  <!-- 分隔虚线 -->
  <path d="M 290 50 L 290 360" stroke="#ddd" stroke-width="1.5" stroke-dasharray="6,5" filter="url(#rough2)"/>

  <!-- ===== 右：凹多边形 ===== -->
  <text x="430" y="58" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">凹多边形（异号）</text>

  <!-- 凹形顶点 BL->TL->中凹->TR->BR -->
  <polygon points="350,290 350,120 430,200 510,120 510,290" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <!-- 顶点圆点 -->
  <circle cx="350" cy="290" r="5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="350" cy="120" r="5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="430" cy="200" r="6" fill="#d6a040" filter="url(#rough2)"/>
  <circle cx="510" cy="120" r="5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="510" cy="290" r="5" fill="#b85450" filter="url(#rough2)"/>

  <!-- 顶点标签 -->
  <text x="338" y="306" font-size="11" fill="#555">p0</text>
  <text x="338" y="114" font-size="11" fill="#555">p1</text>
  <text x="438" y="196" font-size="11.5" fill="#d6a040" font-weight="bold">p2★</text>
  <text x="518" y="114" font-size="11" fill="#555">p3</text>
  <text x="518" y="306" font-size="11" fill="#555">p4</text>

  <!-- 叉积符号标注：p1处负、p2处正（异常）、p3负、p4负、p0负 -->
  <rect x="378" y="146" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="398" y="162" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−</text>

  <!-- 异号突出标注 -->
  <rect x="446" y="166" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="466" y="182" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">+</text>
  <path d="M 436 198 L 444 178" stroke="#d6a040" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="448" y="146" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="468" y="162" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−</text>
  <rect x="466" y="230" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="486" y="246" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−</text>
  <rect x="368" y="248" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="388" y="264" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">−</text>

  <text x="430" y="340" text-anchor="middle" font-size="11" fill="#b85450">p2 处左转，与其余右转冲突 → false</text>

  <!-- 底部结论 -->
  <rect x="24" y="360" width="532" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="290" y="382" text-anchor="middle" font-size="11.5" fill="#7a5415">叉积 = x₁·y₂ − y₁·x₂；全 ≥ 0 或全 ≤ 0（允许 0）即凸，正负同时出现即凹</text>
</svg>
