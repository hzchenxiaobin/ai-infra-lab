<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="660" height="400" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：obj={arr:[1,2,3]}，写入 arr[0]=5、newVal=7</text>

  <!-- 左：原对象 -->
  <rect x="20" y="50" width="150" height="150" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="95" y="44" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">原对象 obj</text>
  <rect x="36" y="70" width="118" height="28" fill="#fff" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="95" y="89" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">arr → [1,2,3]</text>
  <text x="95" y="120" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">（无 newVal）</text>
  <text x="95" y="150" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">全程只读</text>
  <text x="95" y="168" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">零写入</text>

  <!-- 中：覆盖树（逐步生长） -->
  <rect x="190" y="50" width="280" height="200" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="330" y="44" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">覆盖树（随写入生长）</text>

  <!-- root -->
  <rect x="288" y="64" width="84" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="330" y="82" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">root (obj)</text>

  <!-- arr node -->
  <rect x="240" y="104" width="76" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="278" y="122" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">arr (obj)</text>
  <path d="M 318 80 L 290 104" stroke="#d6a040" stroke-width="1.3" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>

  <!-- "0" val = 5 -->
  <rect x="226" y="146" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" rx="4" filter="url(#rough2)"/>
  <text x="256" y="164" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">"0"=5</text>
  <path d="M 268 130 L 256 146" stroke="#d6a040" stroke-width="1.3" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>

  <!-- newVal val = 7 -->
  <rect x="360" y="104" width="84" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.7" rx="4" filter="url(#rough2)"/>
  <text x="402" y="122" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">newVal=7</text>
  <path d="M 350 80 L 390 104" stroke="#d6a040" stroke-width="1.3" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>

  <text x="330" y="196" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">① set arr[0]=5 → 建 arr→"0" 链</text>
  <text x="330" y="214" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">② 读 arr[0]=5、arr[1]=2 → 5+2=7</text>
  <text x="330" y="232" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">③ set newVal=7 → 叶 val 节点</text>

  <!-- 右：结果 -->
  <rect x="490" y="50" width="150" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="565" y="44" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">结果</text>
  <rect x="506" y="70" width="118" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="565" y="89" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">arr → [5,2,3]</text>
  <rect x="506" y="108" width="118" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="565" y="127" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">newVal → 7</text>
  <text x="565" y="156" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">arr 重建为 [5,2,3]</text>
  <text x="565" y="174" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">arr[1]、arr[2] 复用原引用</text>

  <!-- arrows -->
  <path d="M 170 110 L 190 110" stroke="#d6a040" stroke-width="1.6" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="180" y="102" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">写</text>
  <path d="M 470 110 L 490 110" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="480" y="102" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">建</text>

  <!-- 步骤表 -->
  <rect x="20" y="266" width="620" height="118" fill="#fff" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="34" y="286" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">步骤</text>
  <text x="120" y="286" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">操作</text>
  <text x="340" y="286" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">覆盖树变化</text>
  <text x="560" y="286" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">说明</text>
  <line x1="110" y1="272" x2="110" y2="382" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="470" y1="272" x2="470" y2="382" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <text x="34" y="308" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="120" y="308" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">set arr[0]=5</text>
  <text x="340" y="308" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">root→arr(obj)→"0"(val 5)</text>
  <text x="560" y="308" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">沿路径建 obj 到 arr</text>

  <text x="34" y="332" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="120" y="332" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">读 arr[0]、arr[1]</text>
  <text x="340" y="332" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">（无变化）</text>
  <text x="560" y="332" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">5 + 2 = 7</text>

  <text x="34" y="356" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="120" y="356" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">set newVal=7</text>
  <text x="340" y="356" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">root→newVal(val 7)</text>
  <text x="560" y="356" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">新增键，叶放 val</text>

  <text x="34" y="378" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="120" y="378" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">buildObj(root,[])</text>
  <text x="340" y="378" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">浅拷贝→递归重建</text>
  <text x="560" y="378" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">{arr:[5,2,3],newVal:7}</text>
</svg>
