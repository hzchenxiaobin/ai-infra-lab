<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14.5" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：滚动数组 + 每层「前缀和 → 平移抄写」</text>

  <!-- 开始 -->
  <rect x="50" y="32" width="200" height="32" rx="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="150" y="53" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">开始：dp[0..nums[0]] 全置 1</text>
  <path d="M 150 64 L 150 80" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- i = 1 -->
  <rect x="50" y="84" width="200" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="104" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">i = 1（从第二个位置开始）</text>
  <path d="M 150 114 L 150 130" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="78,168 145,138 212,168 145,198" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="145" y="172" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">i ≤ n−1 ?</text>

  <!-- 是 → 三个步骤 -->
  <path d="M 145 198 L 145 218" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="155" y="213" font-size="10" fill="#446688" filter="url(#rough2)">是</text>

  <rect x="50" y="220" width="260" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="240" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">求前缀和 pre[t] = dp[0] + … + dp[t−1]</text>
  <path d="M 180 252 L 180 266" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="50" y="268" width="260" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="288" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">d = max(0, nums[i] − nums[i−1])</text>
  <path d="M 180 298 L 180 312" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="50" y="314" width="260" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="330" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">dp[j] = pre[j−d+1]（O(1) 抄写）</text>
  <text x="180" y="344" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">j &lt; d 或 j &gt; nums[i] 的格子置 0</text>

  <!-- 循环回路 -->
  <path d="M 310 332 L 470 332 L 470 168 L 218 168" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="392" y="324" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">i ← i + 1</text>
  <text x="352" y="158" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">回到判断</text>

  <!-- 否 → 答案 -->
  <path d="M 212 168 L 294 168" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="240" y="160" font-size="10" fill="#446688" filter="url(#rough2)">否</text>

  <rect x="298" y="150" width="150" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="373" y="166" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">答案 = Σ dp[j]</text>
  <text x="373" y="181" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">（mod 1e9+7）</text>
  <path d="M 373 188 L 373 204" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="298" y="206" width="150" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="373" y="226" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">返回答案</text>
</svg>
