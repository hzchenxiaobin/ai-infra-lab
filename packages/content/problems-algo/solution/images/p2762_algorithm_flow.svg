<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2762f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arr2762g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：维护双队列 → 极差 &gt; 2 收缩 → 累加计数</text>

  <!-- init -->
  <rect x="200" y="44" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">left=0, ans=0, maxq/minq 空</text>

  <path d="M280,82 L280,104" stroke="#446688" stroke-width="2" marker-end="url(#arr2762f)" filter="url(#rough2)"/>

  <!-- loop header diamond -->
  <path d="M280,108 L380,152 L280,196 L180,152 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="150" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">r &lt; n ?</text>
  <text x="280" y="166" text-anchor="middle" font-size="10" fill="#d6a040">取 x = nums[r]</text>

  <!-- yes branch down -->
  <text x="290" y="212" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M280,196 L280,218" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr2762g)" filter="url(#rough2)"/>

  <!-- maintain maxq box -->
  <rect x="180" y="222" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="242" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">① 弹 maxq 尾部 ≤ x 的，入 r</text>

  <path d="M280,252 L280,266" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr2762g)" filter="url(#rough2)"/>

  <!-- maintain minq box -->
  <rect x="180" y="266" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="286" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">② 弹 minq 尾部 ≥ x 的，入 r</text>

  <path d="M280,296 L280,312" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr2762g)" filter="url(#rough2)"/>

  <!-- shrink condition diamond -->
  <path d="M280,314 L400,348 L280,382 L160,348 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="346" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">maxq头 − minq头</text>
  <text x="280" y="362" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">&gt; 2 ?</text>

  <!-- yes: shrink -->
  <text x="408" y="344" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <path d="M400,348 L430,348" stroke="#b85450" stroke-width="2" marker-end="url(#arr2762f)" filter="url(#rough2)"/>
  <rect x="430" y="332" width="120" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="490" y="350" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">left++</text>
  <text x="490" y="365" text-anchor="middle" font-size="10" fill="#d6a040">弹两队过期头</text>

  <path d="M490,332 L490,318 L280,318 L280,314" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arr2762f)" filter="url(#rough2)"/>
  <text x="380" y="312" font-size="9" fill="#b85450">重复收缩</text>

  <!-- no: count -->
  <text x="120" y="344" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <path d="M160,348 L110,348 L110,402" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr2762g)" filter="url(#rough2)"/>

  <!-- count box -->
  <rect x="40" y="404" width="180" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="130" y="425" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">③ ans += r − left + 1</text>

  <!-- shrink also flows to count -->
  <path d="M490,374 L490,420 L220,420" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr2762f)" filter="url(#rough2)"/>

  <!-- loop back -->
  <path d="M40,420 L20,420 L20,152 L180,152" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr2762f)" filter="url(#rough2)"/>
  <text x="30" y="290" font-size="10" fill="#446688" transform="rotate(-90 30 290)">r++，回到循环</text>

  <!-- exit branch -->
  <text x="392" y="146" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M380,152 L460,152 L460,124" stroke="#b85450" stroke-width="2" marker-end="url(#arr2762f)" filter="url(#rough2)"/>
  <rect x="410" y="90" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="470" y="112" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">return ans</text>
</svg>
