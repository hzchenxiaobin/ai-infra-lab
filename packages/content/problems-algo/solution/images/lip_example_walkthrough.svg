<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrU" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：从 (2,1)=1 出发的递归与回填顺序</text>

  <!-- left grid -->
  <text x="120" y="56" text-anchor="middle" font-size="12" fill="#888">matrix</text>
  <!-- row 0 -->
  <rect x="60" y="64" width="60" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="96" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">9</text>
  <text x="90" y="116" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">④ memo=1</text>
  <rect x="124" y="64" width="60" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="96" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">9</text>
  <text x="154" y="116" text-anchor="middle" font-size="10" fill="#446688">memo=1</text>
  <rect x="188" y="64" width="60" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="96" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">4</text>
  <text x="218" y="116" text-anchor="middle" font-size="10" fill="#446688">memo=2</text>
  <!-- row 1 -->
  <rect x="60" y="128" width="60" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="160" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">6</text>
  <text x="90" y="180" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">③ memo=2</text>
  <rect x="124" y="128" width="60" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="154" y="160" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">6</text>
  <text x="154" y="180" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">memo=2</text>
  <rect x="188" y="128" width="60" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="160" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">8</text>
  <text x="218" y="180" text-anchor="middle" font-size="10" fill="#446688">memo=1</text>
  <!-- row 2 -->
  <rect x="60" y="192" width="60" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="224" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">2</text>
  <text x="90" y="244" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">② memo=3</text>
  <rect x="124" y="192" width="60" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="154" y="224" text-anchor="middle" font-size="18" fill="#b85450" font-weight="bold">1</text>
  <text x="154" y="244" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">① 起点</text>
  <rect x="188" y="192" width="60" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="224" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">1</text>
  <text x="218" y="244" text-anchor="middle" font-size="10" fill="#446688">memo=2</text>

  <!-- path arrows -->
  <path d="M 138 222 L 124 222" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 90 192 L 90 188" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 90 128 L 90 124" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <text x="154" y="276" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">绿色链 1→2→6→9 = 最长递增路径，长度 4</text>

  <!-- right: call stack -->
  <text x="420" y="56" text-anchor="middle" font-size="12" fill="#888">递归调用栈（下行 = 更深）</text>
  <rect x="320" y="64" width="220" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="430" y="86" text-anchor="middle" font-size="11.5" fill="#333">dfs(2,1) 值=1</text>
  <path d="M 430 98 L 430 110" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="438" y="108" font-size="9.5" fill="#4a7a3a">更大邻居 2,6</text>

  <rect x="320" y="112" width="220" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="430" y="134" text-anchor="middle" font-size="11.5" fill="#333">dfs(2,0) 值=2</text>
  <path d="M 430 146 L 430 158" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="320" y="160" width="220" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="430" y="182" text-anchor="middle" font-size="11.5" fill="#333">dfs(1,0) 值=6</text>
  <path d="M 430 194 L 430 206" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <rect x="320" y="208" width="220" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="430" y="230" text-anchor="middle" font-size="11.5" fill="#333">dfs(0,0) 值=9（无更大邻居）</text>

  <!-- return arrows up -->
  <path d="M 370 230 L 350 230 L 350 178 L 330 178" stroke="#d6a040" stroke-width="1.6" fill="none" stroke-dasharray="5,3" marker-end="url(#arrU)" filter="url(#rough2)"/>
  <path d="M 370 182 L 350 182 L 350 130 L 330 130" stroke="#d6a040" stroke-width="1.6" fill="none" stroke-dasharray="5,3" marker-end="url(#arrU)" filter="url(#rough2)"/>
  <path d="M 370 134 L 350 134 L 350 82 L 330 82" stroke="#d6a040" stroke-width="1.6" fill="none" stroke-dasharray="5,3" marker-end="url(#arrU)" filter="url(#rough2)"/>

  <text x="430" y="262" text-anchor="middle" font-size="10" fill="#d6a040">虚线 = 返回值回填 memo</text>

  <!-- bottom summary box -->
  <rect x="50" y="290" width="480" height="104" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="312" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">回填顺序（自底向上）：先到最深的 9，再逐层 6→2→1</text>
  <text x="290" y="332" text-anchor="middle" font-size="11" fill="#666">dfs(0,0)=1 → dfs(1,0)=1+1=2 → dfs(2,0)=1+2=3</text>
  <text x="290" y="350" text-anchor="middle" font-size="11" fill="#666">dfs(1,1)=1+dfs(0,1)=1+1=2（另一分支，同样命中 memo）</text>
  <text x="290" y="368" text-anchor="middle" font-size="11" fill="#666">dfs(2,1)=1+max(dfs(2,0), dfs(1,1))=1+max(3,2)=4</text>
  <text x="290" y="386" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">每格只算一次 → 全表 O(mn)，答案 = 4</text>
</svg>
