<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">astype：一次只动一列的 dtype 手术</text>

  <!-- Left: input DataFrame -->
  <rect x="30" y="58" width="220" height="196" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="140" y="80" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">students（输入）</text>

  <rect x="44" y="92" width="58" height="24" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="73" y="109" text-anchor="middle" font-size="10" fill="#ffffff" filter="url(#rough2)">student_id</text>
  <rect x="104" y="92" width="46" height="24" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="127" y="109" text-anchor="middle" font-size="10" fill="#ffffff" filter="url(#rough2)">name</text>
  <rect x="152" y="92" width="38" height="24" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="171" y="109" text-anchor="middle" font-size="10" fill="#ffffff" filter="url(#rough2)">age</text>
  <rect x="192" y="92" width="44" height="24" fill="#d6a040" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="214" y="109" text-anchor="middle" font-size="10" fill="#ffffff" filter="url(#rough2)">grade</text>

  <rect x="44" y="118" width="58" height="24" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="73" y="135" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="104" y="118" width="46" height="24" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="127" y="135" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Ava</text>
  <rect x="152" y="118" width="38" height="24" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="171" y="135" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <rect x="192" y="118" width="44" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="214" y="135" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">73.0</text>

  <rect x="44" y="144" width="58" height="24" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="73" y="161" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="104" y="144" width="46" height="24" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="127" y="161" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Kate</text>
  <rect x="152" y="144" width="38" height="24" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="171" y="161" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">15</text>
  <rect x="192" y="144" width="44" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="214" y="161" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">87.0</text>

  <text x="140" y="196" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">grade 列 dtype: float64 ❌</text>
  <text x="140" y="220" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">其余三列不动：int / object / int</text>

  <!-- Middle: astype -->
  <path d="M 254 150 L 300 150" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="258" y="168" width="130" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="323" y="190" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">students.astype(</text>
  <text x="323" y="210" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">{'grade': int})</text>
  <text x="323" y="138" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">字典指定列</text>
  <text x="323" y="248" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">只转 grade，别的列不碰</text>

  <!-- Right: output DataFrame -->
  <rect x="310" y="58" width="220" height="196" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="420" y="80" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">students（输出）</text>

  <rect x="324" y="92" width="58" height="24" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="353" y="109" text-anchor="middle" font-size="10" fill="#ffffff" filter="url(#rough2)">student_id</text>
  <rect x="384" y="92" width="46" height="24" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="407" y="109" text-anchor="middle" font-size="10" fill="#ffffff" filter="url(#rough2)">name</text>
  <rect x="432" y="92" width="38" height="24" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="451" y="109" text-anchor="middle" font-size="10" fill="#ffffff" filter="url(#rough2)">age</text>
  <rect x="472" y="92" width="44" height="24" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="494" y="109" text-anchor="middle" font-size="10" fill="#ffffff" filter="url(#rough2)">grade</text>

  <rect x="324" y="118" width="58" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="353" y="135" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="384" y="118" width="46" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="407" y="135" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Ava</text>
  <rect x="432" y="118" width="38" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="451" y="135" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <rect x="472" y="118" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="494" y="135" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">73</text>

  <rect x="324" y="144" width="58" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="353" y="161" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="384" y="144" width="46" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="407" y="161" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Kate</text>
  <rect x="432" y="144" width="38" height="24" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="451" y="161" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">15</text>
  <rect x="472" y="144" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="494" y="161" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">87</text>

  <text x="420" y="196" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">grade 列 dtype: int64 ✅</text>
  <text x="420" y="220" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">小数点消失：73.0 → 73</text>

  <!-- Bottom note -->
  <rect x="55" y="286" width="450" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="310" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">💡 dtype 是列的属性，不是单元格的属性</text>
  <text x="280" y="332" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">改类型 = 对整列做一次向量化转换，一趟 C 级循环搞定</text>
  <text x="280" y="354" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">不需要（也不应该）逐行 int(x) 地手写 Python 循环</text>
</svg>
