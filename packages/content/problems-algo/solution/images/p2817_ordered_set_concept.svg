<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">有序集合 + lower_bound：前后夹击找最近值</text>

  <text x="36" y="84" font-size="12" fill="#999" font-weight="bold" filter="url(#rough2)">有序集合</text>

  <rect x="60" y="96" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="86" y="117" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>

  <rect x="128" y="96" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="117" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>

  <rect x="196" y="96" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="222" y="117" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">8</text>

  <rect x="264" y="96" width="52" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="117" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">12</text>

  <rect x="332" y="96" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="358" y="117" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">20</text>

  <text x="36" y="180" font-size="12" fill="#999" font-weight="bold" filter="url(#rough2)">nums[j]</text>
  <rect x="232" y="158" width="48" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="256" y="179" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">10</text>

  <path d="M 272 158 L 290 132" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arro)" filter="url(#rough2)"/>
  <text x="306" y="148" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">lower_bound → 12</text>

  <path d="M 240 158 L 222 132" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="120" y="148" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">it−1 → 8</text>

  <path d="M 222 130 L 180 226" stroke="#4a7a3a" stroke-width="1.3" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 290 130 L 380 226" stroke="#d6a040" stroke-width="1.3" marker-end="url(#arro)" filter="url(#rough2)"/>

  <rect x="100" y="226" width="160" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="180" y="244" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">左侧候选 (it−1)</text>
  <text x="180" y="262" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">|10 − 8| = 2</text>

  <rect x="300" y="226" width="160" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="380" y="244" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">右侧候选 (it)</text>
  <text x="380" y="262" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">|12 − 10| = 2</text>

  <path d="M 180 270 L 220 300" stroke="#4a7a3a" stroke-width="1.3" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 380 270 L 340 300" stroke="#d6a040" stroke-width="1.3" marker-end="url(#arro)" filter="url(#rough2)"/>

  <rect x="140" y="300" width="300" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="326" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">ans = min(2, 2) = 2</text>

  <text x="290" y="362" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">只需检查 lower_bound 及其前驱，更远的元素差值只会更大</text>
</svg>
