<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：枚举项数 k，用等差求和公式解出起点 a</text>

  <!-- ===== Row 1: k 个连续正整数 ===== -->
  <text x="34" y="62" font-size="12" fill="#446688" font-weight="bold">k 个连续正整数</text>

  <g filter="url(#rough2)">
    <rect x="110" y="50" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="132" y="70" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
    <rect x="160" y="50" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="182" y="70" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a+1</text>
    <rect x="210" y="50" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <text x="232" y="70" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a+2</text>
  </g>
  <text x="270" y="70" font-size="16" fill="#bbb" font-weight="bold">···</text>
  <g filter="url(#rough2)">
    <rect x="296" y="50" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="324" y="70" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">a+k−1</text>
  </g>
  <text x="368" y="70" font-size="11" fill="#888">共 k 项</text>

  <!-- arrow down -->
  <path d="M 200 86 Q 200 96 200 106" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row 2: 等差求和公式 ===== -->
  <text x="34" y="126" font-size="12" fill="#446688" font-weight="bold">等差求和</text>
  <rect x="100" y="112" width="380" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="136" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">n = k·a + k(k−1)/2</text>

  <!-- arrow down -->
  <path d="M 290 152 Q 290 162 290 172" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row 3: 解出 a ===== -->
  <text x="34" y="192" font-size="12" fill="#446688" font-weight="bold">解出起点 a</text>
  <rect x="100" y="178" width="380" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="202" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">a = (n − k(k−1)/2) / k</text>

  <!-- arrow down -->
  <path d="M 290 218 Q 290 228 290 238" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row 4: 两个条件 ===== -->
  <text x="34" y="258" font-size="12" fill="#446688" font-weight="bold">a 为正整数 ⟹</text>

  <rect x="40" y="272" width="250" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="165" y="292" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">条件①：整除</text>
  <text x="165" y="312" text-anchor="middle" font-size="11" fill="#333">(n − k(k−1)/2) mod k = 0</text>

  <rect x="310" y="272" width="230" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="425" y="292" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">条件②：a ≥ 1</text>
  <text x="425" y="312" text-anchor="middle" font-size="11" fill="#333">k(k+1)/2 ≤ n</text>

  <!-- arrow down -->
  <path d="M 290 332 Q 290 342 290 352" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row 5: 枚举 k ===== -->
  <rect x="60" y="360" width="460" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="380" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">枚举 k = 1, 2, 3, …  直到 k(k+1)/2 &gt; n</text>
  <text x="290" y="398" text-anchor="middle" font-size="11" fill="#4a7a3a">k 上界 ≈ √(2n)，时间 O(√n)</text>

  <!-- bottom note -->
  <text x="290" y="436" text-anchor="middle" font-size="11" fill="#888">每个满足两条件的 k 贡献一种写法</text>
</svg>
