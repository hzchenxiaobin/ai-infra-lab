<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：一趟扫描，栈顶消对</text>

  <!-- 初始化 -->
  <rect x="150" y="32" width="220" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="51" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">初始化：空栈 st，i = 0</text>
  <path d="M260,62 L260,78" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 判断 i < n -->
  <polygon points="260,82 345,118 260,154 175,118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="122" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i &lt; n ?</text>

  <!-- 否：返回 -->
  <path d="M345,118 L383,118" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="360" y="110" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="385" y="100" width="118" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="444" y="115" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">返回栈中字符串</text>
  <text x="444" y="130" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">(底→顶，无需反转)</text>

  <!-- 是：读字符 -->
  <path d="M260,154 L260,170" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="268" y="166" font-size="11" fill="#446688" filter="url(#rough2)">是</text>
  <rect x="140" y="172" width="240" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="191" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">c = s[i]；i++</text>
  <path d="M260,202 L260,218" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 判断相邻 -->
  <polygon points="260,222 360,260 260,298 160,260" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="256" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">栈非空 且</text>
  <text x="260" y="272" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">|st.top()−c| ∈ {1,25}?</text>

  <!-- 是：消对 -->
  <path d="M160,260 L128,260" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="143" y="252" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="26" y="244" width="100" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="259" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">st.pop()</text>
  <text x="76" y="273" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">c 作废不入栈</text>

  <!-- 否：压栈 -->
  <path d="M360,260 L394,260" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="375" y="252" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="396" y="244" width="106" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="449" y="259" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">st.push(c)</text>
  <text x="449" y="273" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">c 暂留栈中</text>

  <!-- 回边 -->
  <path d="M76,278 L76,312" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M449,278 L449,312 L76,312" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M76,312 L16,312 L16,118 L171,118" fill="none" stroke="#446688" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="240" y="306" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">处理下一字符</text>

  <!-- 底部注记 -->
  <rect x="120" y="332" width="280" height="32" rx="6" fill="#f5f5f5" stroke="#999" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="260" y="352" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">每字符至多一进一出 → 整体 O(n)</text>
</svg>
