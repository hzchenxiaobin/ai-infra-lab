<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold" filter="url(#rough2)">状态转移：dp[mask][last] → dp[mask|1&lt;&lt;j][j]</text>

  <!-- from state node -->
  <rect x="40" y="150" width="190" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="135" y="174" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">当前状态</text>
  <text x="135" y="194" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">(mask, last)</text>
  <text x="135" y="210" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">末位 = nums[last]</text>

  <!-- to state node -->
  <rect x="330" y="150" width="190" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="425" y="174" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">新状态</text>
  <text x="425" y="194" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">(mask | 1&lt;&lt;j, j)</text>
  <text x="425" y="210" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">末位换为 nums[j]</text>

  <!-- transition arrow -->
  <path d="M 232 185 L 326 185" stroke="#b85450" stroke-width="2.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="280" y="178" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">放 j</text>

  <!-- conditions box -->
  <rect x="120" y="100" width="320" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="118" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">转移条件（两条同时满足）：</text>
  <text x="280" y="132" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">j 未用  且  nums[last]%nums[j]==0 ∨ nums[j]%nums[last]==0</text>

  <!-- formula -->
  <rect x="80" y="236" width="400" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="261" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">dp[mask|1&lt;&lt;j][j] += dp[mask][last]</text>

  <!-- base / answer -->
  <rect x="40" y="294" width="230" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="155" y="312" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">初始（起点）</text>
  <text x="155" y="330" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">dp[1&lt;&lt;i][i] = 1</text>
  <text x="155" y="346" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">任意元素都可作首位</text>

  <rect x="290" y="294" width="230" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="405" y="312" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案</text>
  <text x="405" y="330" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Σ dp[full][i]  (mod 1e9+7)</text>
  <text x="405" y="346" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">全用完时，末位任意</text>

  <text x="280" y="370" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">每条转移只检查「末位与新位」这一对相邻，天然只增不回头 → 无后效性</text>
</svg>
