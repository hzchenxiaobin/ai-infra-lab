<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">规模鸿沟：m, n ≤ 10⁵ 把区间 DP 逼死，只剩贪心</text>

  <!-- 左：区间 DP 已死 -->
  <rect x="22" y="40" width="230" height="158" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="137" y="64" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">区间 DP（3218 的解法）</text>
  <text x="137" y="90" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">状态 O(m²n²) = (10⁵)⁴ = 10²⁰ 个</text>
  <text x="137" y="110" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">每个状态枚举 O(m+n) 种切法</text>
  <text x="137" y="130" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">总运算量 ~10²⁵，状态都存不下</text>
  <text x="137" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">10⁹ 次/秒也要跑上亿年 ✗</text>
  <text x="137" y="182" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（3218 的 m, n ≤ 20 才养得起它）</text>

  <!-- 右：贪心存活 -->
  <rect x="268" y="40" width="230" height="158" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="383" y="64" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">降序排序 + 一趟归并（本题解法）</text>
  <text x="383" y="90" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">排序 O(m log m + n log n) ≈ 2×10⁶</text>
  <text x="383" y="110" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">双指针归并 O(m + n) ≈ 2×10⁵</text>
  <text x="383" y="130" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">空间 O(1)，只扫一遍数组</text>
  <text x="383" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">毫秒级出答案 ✓</text>
  <text x="383" y="182" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（与 m, n 规模近乎线性）</text>

  <!-- VS -->
  <text x="260" y="125" text-anchor="middle" font-size="16" font-weight="bold" fill="#888" filter="url(#rough2)">vs</text>

  <!-- 底部：两个必答点 -->
  <rect x="22" y="214" width="476" height="132" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="238" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">规模放大逼出的两个新考点</text>

  <text x="36" y="262" font-size="11" fill="#333" filter="url(#rough2)">① 刀数不变量：每切一刀块数 +1，从 1 块到 mn 块</text>
  <text x="48" y="280" font-size="11" fill="#555" filter="url(#rough2)">→ 恰好 mn − 1 刀，与顺序无关；顺序只决定这些刀</text>
  <text x="48" y="298" font-size="11" fill="#555" filter="url(#rough2)">怎么分摊给各条线（单价 × 刀数的分配）</text>

  <text x="36" y="322" font-size="11" fill="#333" filter="url(#rough2)">② 溢出：每刀单价 ≤ 10³ → ans ≤ 10³ × (mn−1) ≈ 10¹³</text>
  <text x="48" y="340" font-size="11" fill="#b85450" filter="url(#rough2)">远超 int32（≈2.1×10⁹）→ 必须用 long long！</text>
</svg>
