<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：三状态 + 贪心（叶不设摄像头，父节点兜底）</text>

  <!-- 左侧：展示贪心原则的小树 G-P-L -->
  <text x="130" y="52" text-anchor="middle" font-size="11" fill="#888">贪心放置示意</text>

  <!-- G: grandparent, 已覆盖 -->
  <line x1="130" y1="92" x2="130" y2="128" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="130" cy="78" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="130" y="82" text-anchor="middle" font-size="13" fill="#333">G</text>
  <text x="156" y="72" font-size="10" fill="#4a7a3a" font-weight="bold">已覆盖</text>

  <!-- P: parent, 有摄像头 -->
  <line x1="130" y1="160" x2="130" y2="196" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="130" cy="146" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="130" y="150" text-anchor="middle" font-size="13" fill="#333">P</text>
  <text x="156" y="140" font-size="10" fill="#d6a040" font-weight="bold">有摄像头</text>

  <!-- L: leaf, 未覆盖 -->
  <circle cx="130" cy="214" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="130" y="218" text-anchor="middle" font-size="13" fill="#333">L</text>
  <text x="156" y="208" font-size="10" fill="#b85450" font-weight="bold">未覆盖</text>

  <!-- P 的摄像头覆盖范围（虚线弧指向 G 和 L） -->
  <path d="M 148 146 Q 196 112 150 84" stroke="#d6a040" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 148 146 Q 196 182 150 208" stroke="#d6a040" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="104" font-size="9" fill="#d6a040">照到 G</text>
  <text x="200" y="186" font-size="9" fill="#d6a040">照到 L</text>

  <!-- 右侧：三状态图例 -->
  <rect x="270" y="52" width="250" height="200" fill="none" stroke="#ccc" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="395" y="74" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">三状态定义</text>

  <rect x="286" y="90" width="26" height="20" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="322" y="104" font-size="11" fill="#b85450" font-weight="bold">未覆盖 (0)</text>
  <text x="322" y="118" font-size="10" fill="#666">无人监控，需父节点设摄像头</text>

  <rect x="286" y="138" width="26" height="20" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="322" y="152" font-size="11" fill="#4a7a3a" font-weight="bold">已覆盖 (1)</text>
  <text x="322" y="166" font-size="10" fill="#666">被子节点摄像头照到，自身无摄像头</text>

  <rect x="286" y="186" width="26" height="20" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="322" y="200" font-size="11" fill="#d6a040" font-weight="bold">有摄像头 (2)</text>
  <text x="322" y="214" font-size="10" fill="#666">监控自身 + 父 + 直接子节点</text>

  <!-- 底部说明框 -->
  <rect x="40" y="270" width="480" height="112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="294" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">贪心策略（后序自底向上）</text>
  <text x="60" y="316" font-size="11" fill="#555">① 叶子尽量不设摄像头——让父节点设，一颗摄像头覆盖「叶 + 父 + 祖父」三层；</text>
  <text x="60" y="336" font-size="11" fill="#555">② 后序遍历：若任一子节点「未覆盖」→ 当前节点必须设摄像头；</text>
  <text x="60" y="356" font-size="11" fill="#555">③ 否则若任一子节点「有摄像头」→ 当前「已覆盖」；否则当前「未覆盖」。</text>
  <text x="60" y="374" font-size="11" fill="#b85450">④ 根节点若最终「未覆盖」，补一颗。</text>
</svg>
