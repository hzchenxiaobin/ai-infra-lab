<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="410" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：6 个候选三元组 → 3 个通过「名字两两不同」</text>

  <rect x="30" y="50" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="70" y="70" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">A.name</text>
  <rect x="110" y="50" width="80" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="150" y="70" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">B.name</text>
  <rect x="190" y="50" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="230" y="70" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">C.name</text>
  <rect x="270" y="50" width="60" height="30" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="300" y="70" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">A≠B</text>
  <rect x="330" y="50" width="60" height="30" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="360" y="70" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">B≠C</text>
  <rect x="390" y="50" width="60" height="30" fill="#f5f5f5" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="420" y="70" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">A≠C</text>
  <rect x="450" y="50" width="80" height="30" fill="#f5f5f5" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="490" y="70" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">有效?</text>

  <rect x="30" y="82" width="500" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="102" text-anchor="middle" font-size="10" fill="#333">Alice</text>
  <text x="150" y="102" text-anchor="middle" font-size="10" fill="#333">Tom</text>
  <text x="230" y="102" text-anchor="middle" font-size="10" fill="#333">Tom</text>
  <text x="300" y="102" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="360" y="102" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <text x="420" y="102" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="490" y="102" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>

  <rect x="30" y="114" width="500" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="70" y="134" text-anchor="middle" font-size="10" fill="#333">Alice</text>
  <text x="150" y="134" text-anchor="middle" font-size="10" fill="#333">Tom</text>
  <text x="230" y="134" text-anchor="middle" font-size="10" fill="#333">Jerry</text>
  <text x="300" y="134" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="360" y="134" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="420" y="134" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="490" y="134" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <rect x="30" y="146" width="500" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="166" text-anchor="middle" font-size="10" fill="#333">Alice</text>
  <text x="150" y="166" text-anchor="middle" font-size="10" fill="#333">Tom</text>
  <text x="230" y="166" text-anchor="middle" font-size="10" fill="#333">Alice</text>
  <text x="300" y="166" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="360" y="166" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="420" y="166" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <text x="490" y="166" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>

  <rect x="30" y="178" width="500" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="198" text-anchor="middle" font-size="10" fill="#333">Bob</text>
  <text x="150" y="198" text-anchor="middle" font-size="10" fill="#333">Tom</text>
  <text x="230" y="198" text-anchor="middle" font-size="10" fill="#333">Tom</text>
  <text x="300" y="198" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="360" y="198" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <text x="420" y="198" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="490" y="198" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>

  <rect x="30" y="210" width="500" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="70" y="230" text-anchor="middle" font-size="10" fill="#333">Bob</text>
  <text x="150" y="230" text-anchor="middle" font-size="10" fill="#333">Tom</text>
  <text x="230" y="230" text-anchor="middle" font-size="10" fill="#333">Jerry</text>
  <text x="300" y="230" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="360" y="230" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="420" y="230" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="490" y="230" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <rect x="30" y="242" width="500" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="70" y="262" text-anchor="middle" font-size="10" fill="#333">Bob</text>
  <text x="150" y="262" text-anchor="middle" font-size="10" fill="#333">Tom</text>
  <text x="230" y="262" text-anchor="middle" font-size="10" fill="#333">Alice</text>
  <text x="300" y="262" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="360" y="262" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="420" y="262" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="490" y="262" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>

  <rect x="60" y="295" width="460" height="95" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="320" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">6 个候选 → 3 个有效（去掉任意两人同名的组合）</text>
  <text x="290" y="342" text-anchor="middle" font-size="10" fill="#b85450">过滤：① Tom=Tom（B 与 C 同名）  ③ Alice=Alice（A 与 C 同名）  ④ Tom=Tom</text>
  <text x="290" y="362" text-anchor="middle" font-size="10" fill="#4a7a3a">保留：②(Alice,Tom,Jerry)  ⑤(Bob,Tom,Jerry)  ⑥(Bob,Tom,Alice)</text>
  <text x="290" y="380" text-anchor="middle" font-size="9.5" fill="#666">注：A 与 C 同名（如 Alice）也会被过滤——条件是「两两」不同，不只相邻</text>
</svg>
