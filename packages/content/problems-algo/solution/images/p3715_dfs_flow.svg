<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 436"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="436" fill="#fafafa"/>

  <text x="28" y="20" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：SPF 筛求核 → 显式栈 DFS（进 / 出双事件）</text>

  <!-- 主流程 -->
  <rect x="126" y="32" width="78" height="26" rx="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="165" y="50" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">开始</text>

  <path d="M 165 58 L 165 68" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="48" y="72" width="234" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="165" y="92" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">① SPF 筛到 M = max(nums)</text>

  <path d="M 165 104 L 165 114" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="48" y="118" width="234" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="165" y="136" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">② sq[i] ← nums[i] 的核</text>
  <text x="165" y="154" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">（奇数次素因子之积，O(log M)）</text>

  <path d="M 165 164 L 165 174" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="48" y="178" width="234" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="165" y="198" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">③ 建邻接表；栈 = [0]；cnt 清零</text>

  <path d="M 165 210 L 165 220" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 栈空判断 -->
  <polygon points="165,224 233,252 165,280 97,252" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="165" y="256" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">栈空？</text>

  <path d="M 233 252 L 294 252" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="258" y="244" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">是</text>

  <rect x="298" y="236" width="100" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="348" y="256" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <path d="M 165 280 L 165 292" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="173" y="291" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">否</text>

  <!-- 弹出事件判断 -->
  <polygon points="165,296 247,326 165,356 83,326" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="165" y="323" text-anchor="middle" font-size="11" fill="#8a6d1f" filter="url(#rough2)">弹出 u</text>
  <text x="165" y="339" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">u ≥ 0 ?</text>

  <path d="M 247 326 L 286 326" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="265" y="318" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">进入</text>

  <!-- 进入事件 -->
  <rect x="290" y="296" width="215" height="76" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="316" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">u ≠ 0：ans += cnt[sq[u]]</text>
  <text x="300" y="334" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">cnt[sq[u]] += 1</text>
  <text x="300" y="352" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">压入 ~u 与各子节点</text>

  <path d="M 165 356 L 165 368" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="175" y="367" font-size="10" fill="#b85450" filter="url(#rough2)">u &lt; 0（退出）</text>

  <!-- 退出事件 -->
  <rect x="88" y="372" width="160" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="168" y="392" text-anchor="middle" font-size="10.5" fill="#7a3b37" filter="url(#rough2)">cnt[sq[~u]] −= 1（回溯）</text>

  <!-- 回路 -->
  <path d="M 397 372 L 397 410 L 44 410 L 44 252 L 93 252" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 168 404 L 168 410" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- 侧注 -->
  <rect x="300" y="60" width="232" height="100" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="312" y="80" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">⚠ 为什么显式栈？</text>
  <text x="312" y="100" font-size="10" fill="#8a6d1f" filter="url(#rough2)">链状树深达 10⁵，递归会爆栈；</text>
  <text x="312" y="118" font-size="10" fill="#8a6d1f" filter="url(#rough2)">进入时先压 ~u 再压子节点：</text>
  <text x="312" y="136" font-size="10" fill="#8a6d1f" filter="url(#rough2)">LIFO ⇒ 子树处理完才轮到退出</text>

  <rect x="300" y="168" width="232" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="316" y="192" font-size="10" fill="#8a6d1f" filter="url(#rough2)">cnt 开 M+1 数组即可（核 ≤ 10⁵），免哈希</text>
</svg>
