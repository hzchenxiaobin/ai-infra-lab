<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：排序 + 双指针夹窗口</text>

  <!-- Step 1: sort -->
  <rect x="190" y="44" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 对 products 字典序排序</text>
  <path d="M 280 82 L 280 96" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: init -->
  <rect x="190" y="100" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="122" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② left=0, right=n−1</text>
  <path d="M 280 138 L 280 152" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 3: loop header (diamond) -->
  <polygon points="280,156 380,196 280,236 180,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="190" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">③ 遍历 i = 0..m−1</text>
  <text x="280" y="206" text-anchor="middle" font-size="11" fill="#888">c = searchWord[i]</text>

  <!-- arrow down to shrink left -->
  <path d="M 280 240 L 280 254" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 4: shrink left -->
  <rect x="60" y="258" width="200" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="160" y="278" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">④ 收缩 left</text>
  <text x="160" y="294" text-anchor="middle" font-size="10.5" fill="#555">while left[i] ≠ c : left++</text>

  <!-- Step 5: shrink right -->
  <rect x="300" y="258" width="200" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="400" y="278" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">⑤ 收缩 right</text>
  <text x="400" y="294" text-anchor="middle" font-size="10.5" fill="#555">while right[i] ≠ c : right−−</text>

  <!-- arrows from diamond to both -->
  <path d="M 230 220 Q 200 236 170 256" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 330 220 Q 360 236 390 256" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- merge down -->
  <path d="M 160 304 L 160 320 L 400 320 L 400 304" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 280 320 L 280 338" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 6: collect top 3 -->
  <rect x="150" y="342" width="260" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="362" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">⑥ 取窗口前 3 个</text>
  <text x="280" y="378" text-anchor="middle" font-size="10.5" fill="#555">ans[i] = products[left .. min(left+2,right)]</text>

  <!-- loop back arrow -->
  <path d="M 410 364 Q 470 364 470 196 Q 470 196 384 196" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrD)" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="478" y="282" font-size="10.5" fill="#b85450">下一字符</text>

  <!-- final arrow down -->
  <path d="M 280 388 L 280 402" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 7: return -->
  <rect x="190" y="406" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="428" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">⑦ 返回 ans</text>

  <!-- Side note -->
  <rect x="40" y="342" width="100" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="90" y="361" text-anchor="middle" font-size="9.5" fill="#666">指针只朝内移</text>
  <text x="90" y="375" text-anchor="middle" font-size="9.5" fill="#666">总移动 O(n)</text>
</svg>
