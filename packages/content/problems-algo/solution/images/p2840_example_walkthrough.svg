<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="430" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：奇偶分组多重集比较——整体异位词只是必要条件</text>

  <!-- panel 1: example 1 -->
  <rect x="28" y="42" width="564" height="152" fill="#f5f9fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="310" y="66" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 1：s1 = "abcdba"，s2 = "cabdab" → true</text>

  <!-- row: even positions -->
  <text x="44" y="96" font-size="11.5" fill="#446688" filter="url(#rough2)">偶数位 {0,2,4}：s1</text>
  <rect x="160" y="80" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="171" y="96" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="186" y="80" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="197" y="96" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <rect x="212" y="80" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="223" y="96" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <text x="248" y="96" font-size="11.5" fill="#446688" filter="url(#rough2)">s2</text>
  <rect x="274" y="80" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="285" y="96" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c</text>
  <rect x="300" y="80" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="311" y="96" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <rect x="326" y="80" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="337" y="96" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <text x="368" y="96" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ 相等 ✓</text>

  <!-- row: odd positions -->
  <text x="44" y="128" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">奇数位 {1,3,5}：s1</text>
  <rect x="160" y="112" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="171" y="128" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <rect x="186" y="112" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="197" y="128" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">d</text>
  <rect x="212" y="112" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="223" y="128" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <text x="248" y="128" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">s2</text>
  <rect x="274" y="112" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="285" y="128" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="300" y="112" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="311" y="128" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">d</text>
  <rect x="326" y="112" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="337" y="128" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <text x="368" y="128" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ 相等 ✓</text>

  <text x="310" y="162" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">两组全过 → true（如 swap(0,2) → swap(2,4) → swap(1,5)）</text>

  <!-- panel 2: example 2 -->
  <rect x="28" y="210" width="564" height="172" fill="#fdf4f5" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="310" y="234" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">示例 2：s1 = "abe"，s2 = "bea" → false</text>

  <!-- row: overall anagram (necessary only) -->
  <text x="44" y="262" font-size="11.5" fill="#888" filter="url(#rough2)">整体排序后同为 "abe"：{a,b,e} = {b,e,a} ✓ 但只是必要条件</text>

  <!-- row: even positions -->
  <text x="44" y="294" font-size="11.5" fill="#446688" filter="url(#rough2)">偶数位 {0,2}：s1</text>
  <rect x="160" y="278" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="171" y="294" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <rect x="186" y="278" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="197" y="294" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">e</text>
  <text x="248" y="294" font-size="11.5" fill="#446688" filter="url(#rough2)">s2</text>
  <rect x="274" y="278" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="285" y="294" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <rect x="300" y="278" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="311" y="294" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>
  <text x="368" y="294" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ 不相等 ✗</text>

  <!-- row: odd positions -->
  <text x="44" y="326" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">奇数位 {1}：s1</text>
  <rect x="160" y="310" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="171" y="326" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">b</text>
  <text x="248" y="326" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">s2</text>
  <rect x="274" y="310" width="22" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="285" y="326" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">e</text>
  <text x="368" y="326" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ 不相等 ✗</text>

  <text x="310" y="358" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">false：'e' 在 s1 偶位、s2 奇位，隔着奇偶墙换不过去</text>

  <text x="310" y="414" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">判定只认两条轨道的多重集合；整体异位词 = 必要不充分</text>
</svg>
