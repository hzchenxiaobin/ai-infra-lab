<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 580" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="580" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：二维 DP 四选一填表</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">逐行从左到右填，每格依赖左上/正上/左方</text>

  <!-- step 1: init -->
  <rect x="110" y="58" width="300" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="82" text-anchor="middle" font-size="12" fill="#333">① 初始化 dp[0..m][0..n] = −∞（含边界）</text>
  <path d="M 260 98 L 260 116" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- step 2: outer loop -->
  <rect x="110" y="118" width="300" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="142" text-anchor="middle" font-size="12" fill="#333">② for i = 1 … m</text>
  <path d="M 260 158 L 260 176" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- step 3: inner loop -->
  <rect x="110" y="178" width="300" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="202" text-anchor="middle" font-size="12" fill="#333">③ for j = 1 … n</text>
  <path d="M 260 218 L 260 236" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- step 4: compute p -->
  <rect x="130" y="238" width="260" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="262" text-anchor="middle" font-size="12" fill="#333">④ p = nums1[i−1] × nums2[j−1]</text>
  <path d="M 260 278 L 260 296" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- decision: four-way max -->
  <polygon points="260,298 390,346 260,394 130,346" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="340" text-anchor="middle" font-size="11" fill="#333">四选一取 max</text>
  <text x="260" y="356" text-anchor="middle" font-size="10" fill="#888">dp[i][j] = ?</text>

  <!-- four branches -->
  <!-- ① -->
  <text x="60" y="316" font-size="10" fill="#b85450" font-weight="bold">① p</text>
  <path d="M 130 346 L 60 346 L 60 320" stroke="#b85450" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <!-- ② -->
  <text x="60" y="386" font-size="10" fill="#4a7a3a" font-weight="bold">② p+dp[i−1][j−1]</text>
  <path d="M 130 346 L 60 346 L 60 372" stroke="#4a7a3a" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <!-- ③ -->
  <text x="400" y="316" font-size="10" fill="#446688" font-weight="bold">③ dp[i−1][j]</text>
  <path d="M 390 346 L 460 346 L 460 320" stroke="#446688" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <!-- ④ -->
  <text x="400" y="386" font-size="10" fill="#d6a040" font-weight="bold">④ dp[i][j−1]</text>
  <path d="M 390 346 L 460 346 L 460 372" stroke="#d6a040" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <path d="M 260 396 L 260 414" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- step 5: write cell -->
  <rect x="130" y="416" width="260" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="440" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">⑤ 写入 dp[i][j]</text>

  <!-- loop back: inner -->
  <path d="M 390 435 L 470 435 L 470 197 L 410 197" stroke="#666" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="478" y="320" font-size="9" fill="#888">j++</text>
  <text x="478" y="332" font-size="9" fill="#888">回 ③</text>

  <!-- loop back: outer -->
  <path d="M 130 435 L 50 435 L 50 137 L 110 137" stroke="#666" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="42" y="290" font-size="9" fill="#888">j 结束</text>
  <text x="42" y="302" font-size="9" fill="#888">i++ 回 ②</text>

  <path d="M 260 456 L 260 474" stroke="#666" stroke-width="1.3" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="130" y="476" width="260" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="14" filter="url(#rough2)"/>
  <text x="260" y="501" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">⑥ return dp[m][n]</text>

  <text x="260" y="540" text-anchor="middle" font-size="10" fill="#888">时间 O(m×n) · 空间 O(m×n)，滚动数组可压到 O(n)</text>
  <text x="260" y="556" text-anchor="middle" font-size="9" fill="#888">填表顺序：行从上到下、列从左到右（依赖左上/正上/左方）</text>
</svg>
