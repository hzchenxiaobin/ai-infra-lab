<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="560" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">重排链表算法流程图</text>

  <!-- B1 开始 -->
  <rect x="245" y="42" width="110" height="28" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="61" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始</text>
  <line x1="300" y1="70" x2="300" y2="80" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B2 diamond: 边界判断 -->
  <polygon points="300,80 420,106 300,132 180,106" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="110" text-anchor="middle" font-size="11" fill="#333">head 为空或 next 为空?</text>
  <!-- 是 → 直接返回 -->
  <line x1="420" y1="106" x2="450" y2="106" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="435" y="100" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="450" y="92" width="110" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="505" y="111" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">直接返回</text>
  <!-- 否 ↓ -->
  <line x1="300" y1="132" x2="300" y2="150" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="146" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- B3: slow=fast=head -->
  <rect x="200" y="152" width="200" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="172" text-anchor="middle" font-size="12" fill="#333">slow = fast = head</text>
  <line x1="300" y1="182" x2="300" y2="194" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B4 diamond: 找中点循环条件 -->
  <polygon points="300,196 432,222 300,248 168,222" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="219" text-anchor="middle" font-size="10" fill="#333">fast.next 且</text>
  <text x="300" y="233" text-anchor="middle" font-size="10" fill="#333">fast.next.next 非空?</text>
  <!-- 是 → B5 body -->
  <line x1="432" y1="222" x2="460" y2="222" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="446" y="216" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="460" y="204" width="120" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="520" y="222" text-anchor="middle" font-size="10" fill="#333">slow = slow.next</text>
  <text x="520" y="236" text-anchor="middle" font-size="10" fill="#333">fast = fast.next.next</text>
  <!-- loop back: B5 top up, left, down into B4 top -->
  <path d="M 520 204 L 520 176 L 300 176 L 300 194" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="170" text-anchor="middle" font-size="9" fill="#888">回到判断</text>
  <!-- 否 ↓ -->
  <line x1="300" y1="248" x2="300" y2="266" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="262" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- B6: reverse + cut -->
  <rect x="170" y="268" width="260" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="286" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">second = reverse(slow.next)</text>
  <text x="300" y="303" text-anchor="middle" font-size="11" fill="#333">slow.next = null  （断开前后半）</text>
  <line x1="300" y1="312" x2="300" y2="324" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B7: init merge pointers -->
  <rect x="200" y="326" width="200" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="346" text-anchor="middle" font-size="12" fill="#333">first = head;  second = 反转头</text>
  <line x1="300" y1="356" x2="300" y2="370" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- B8 diamond: 合并循环条件 -->
  <polygon points="300,370 390,398 300,426 210,398" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="402" text-anchor="middle" font-size="11" fill="#333">second 非空?</text>
  <!-- 否 → 结束 -->
  <line x1="390" y1="398" x2="430" y2="398" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="392" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="430" y="384" width="110" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="485" y="403" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">结束 ✓</text>
  <!-- 是 ↓ -->
  <line x1="300" y1="426" x2="300" y2="442" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="438" font-size="10" fill="#b85450" font-weight="bold">是</text>

  <!-- B9: merge body (3 lines) -->
  <rect x="150" y="444" width="300" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="464" text-anchor="middle" font-size="11" fill="#333">tmp1 = first.next;  tmp2 = second.next</text>
  <text x="300" y="481" text-anchor="middle" font-size="11" fill="#333">first.next = second;  second.next = tmp1</text>
  <text x="300" y="498" text-anchor="middle" font-size="11" fill="#333">first = tmp1;  second = tmp2</text>
  <!-- loop back: B9 left, up left channel, into B8 left vertex -->
  <path d="M 150 473 L 70 473 L 70 398 L 208 398" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="80" y="438" font-size="9" fill="#888">继续合并</text>

  <!-- footer -->
  <rect x="30" y="520" width="540" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="300" y="540" text-anchor="middle" font-size="10" fill="#555">两个循环 + 一次反转，全程 O(1) 额外空间；while(second) 保证右半先耗尽</text>
</svg>
