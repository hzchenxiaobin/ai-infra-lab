<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="480" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：两次单调栈预处理 + 一次遍历求和</text>

  <rect x="190" y="44" width="220" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">输入 arr[0..n-1]，MOD = 10⁹+7</text>

  <path d="M 300 82 L 300 94" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="98" width="300" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="120" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">第一遍：从左到右，求 left[i]</text>
  <text x="300" y="138" text-anchor="middle" font-size="11" fill="#333">维护递增栈，弹出所有 ≥ arr[i] 的元素</text>
  <text x="300" y="154" text-anchor="middle" font-size="11" fill="#b85450">left[i] = 栈顶（严格更小）或 −1</text>
  <text x="300" y="166" text-anchor="middle" font-size="10" fill="#888">栈中保留严格更小的元素</text>

  <path d="M 300 172 L 300 184" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="150" y="188" width="300" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="210" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">第二遍：从右到左，求 right[i]</text>
  <text x="300" y="228" text-anchor="middle" font-size="11" fill="#333">维护递增栈，弹出所有 &gt; arr[i] 的元素</text>
  <text x="300" y="244" text-anchor="middle" font-size="11" fill="#4a7a3a">right[i] = 栈顶（更小或相等）或 n</text>
  <text x="300" y="256" text-anchor="middle" font-size="10" fill="#888">注意：这里弹 &gt; 不弹 ≥</text>

  <path d="M 300 262 L 300 274" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="278" width="360" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="300" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">第三遍：遍历每个元素，累加贡献</text>
  <text x="300" y="318" text-anchor="middle" font-size="12" fill="#333">sum += arr[i] × (i − left[i]) × (right[i] − i)</text>

  <path d="M 300 336 L 300 348" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="200" y="352" width="200" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="374" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">返回 sum % MOD</text>

  <text x="30" y="408" font-size="11" fill="#888" font-weight="bold">关键对比：</text>

  <rect x="30" y="418" width="270" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="165" y="438" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">左边界：弹 ≥（严格更小留下）</text>
  <text x="165" y="454" text-anchor="middle" font-size="10" fill="#888">等号保证相等元素不留在栈中</text>

  <rect x="310" y="418" width="270" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="445" y="438" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">右边界：弹 &gt;（更小或相等留下）</text>
  <text x="445" y="454" text-anchor="middle" font-size="10" fill="#888">等号保证相等元素留在栈中</text>
</svg>
