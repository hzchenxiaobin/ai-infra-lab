<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums=[1,2,3,4,5], requests=[[1,3],[0,1]]</text>

  <!-- 第一步标题 -->
  <text x="30" y="52" font-size="12" fill="#446688" font-weight="bold">第一步：差分标记 + 前缀和还原</text>

  <!-- diff 行标签 -->
  <text x="30" y="80" font-size="11" fill="#888">diff[0..5]：</text>

  <!-- 步骤1: 查询[1,3] -->
  <text x="30" y="104" font-size="10" fill="#4a7a3a">[1,3]→</text>
  <rect x="110" y="88" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="134" y="106" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="158" y="88" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="182" y="106" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+1</text>
  <rect x="206" y="88" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="230" y="106" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="254" y="88" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="278" y="106" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="302" y="88" width="48" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="326" y="106" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−1</text>
  <rect x="350" y="88" width="48" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3" rx="3" filter="url(#rough2)"/>
  <text x="374" y="106" text-anchor="middle" font-size="10" fill="#bbb">哨兵</text>

  <!-- 步骤2: 查询[0,1] -->
  <text x="30" y="134" font-size="10" fill="#b85450">[0,1]→</text>
  <rect x="110" y="118" width="48" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="134" y="136" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">+1</text>
  <rect x="158" y="118" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="182" y="136" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">+1</text>
  <rect x="206" y="118" width="48" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="230" y="136" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−1</text>
  <rect x="254" y="118" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="278" y="136" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="302" y="118" width="48" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="326" y="136" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−1</text>
  <rect x="350" y="118" width="48" height="26" fill="#f5f5f5" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3" rx="3" filter="url(#rough2)"/>
  <text x="374" y="136" text-anchor="middle" font-size="10" fill="#bbb">哨兵</text>

  <!-- 下标标注 -->
  <text x="134" y="156" text-anchor="middle" font-size="8" fill="#aaa">0</text>
  <text x="182" y="156" text-anchor="middle" font-size="8" fill="#aaa">1</text>
  <text x="230" y="156" text-anchor="middle" font-size="8" fill="#aaa">2</text>
  <text x="278" y="156" text-anchor="middle" font-size="8" fill="#aaa">3</text>
  <text x="326" y="156" text-anchor="middle" font-size="8" fill="#aaa">4</text>
  <text x="374" y="156" text-anchor="middle" font-size="8" fill="#aaa">5</text>

  <!-- arrow down -->
  <path d="M 242 162 L 242 178" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="254" y="174" font-size="9" fill="#446688">前缀和</text>

  <!-- cnt 行 -->
  <text x="30" y="196" font-size="11" fill="#888">频次 cnt：</text>
  <rect x="110" y="180" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="134" y="199" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="158" y="180" width="48" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="182" y="199" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>
  <rect x="206" y="180" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="230" y="199" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="254" y="180" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="278" y="199" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="302" y="180" width="48" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3" rx="3" filter="url(#rough2)"/>
  <text x="326" y="199" text-anchor="middle" font-size="12" fill="#bbb">0</text>

  <text x="182" y="224" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">位置1被覆盖两次</text>
  <text x="326" y="224" text-anchor="middle" font-size="9" fill="#999">位置4未被覆盖</text>

  <!-- 分隔线 -->
  <path d="M 40 238 L 520 238" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <!-- 第二步标题 -->
  <text x="30" y="258" font-size="12" fill="#d6a040" font-weight="bold">第二步：排序贪心配对（同序相乘）</text>

  <!-- nums 排序后 -->
  <text x="30" y="290" font-size="11" fill="#888">nums 升序：</text>
  <rect x="110" y="272" width="48" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3" rx="3" filter="url(#rough2)"/>
  <text x="134" y="291" text-anchor="middle" font-size="12" fill="#bbb">1</text>
  <rect x="158" y="272" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="182" y="291" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="206" y="272" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="230" y="291" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="254" y="272" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="278" y="291" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="302" y="272" width="48" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="326" y="291" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">5</text>

  <!-- cnt 排序后 -->
  <text x="30" y="324" font-size="11" fill="#888">cnt 升序：</text>
  <rect x="110" y="306" width="48" height="28" fill="#f5f5f5" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3" rx="3" filter="url(#rough2)"/>
  <text x="134" y="325" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <rect x="158" y="306" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="182" y="325" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="206" y="306" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="230" y="325" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="254" y="306" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="278" y="325" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="302" y="306" width="48" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="326" y="325" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>

  <!-- 乘积行 -->
  <text x="30" y="360" font-size="11" fill="#888">乘积：</text>
  <text x="134" y="360" text-anchor="middle" font-size="12" fill="#bbb">0</text>
  <text x="182" y="360" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="230" y="360" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="278" y="360" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="326" y="360" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">10</text>

  <!-- 加号连线 -->
  <text x="200" y="360" font-size="10" fill="#999">+</text>
  <text x="248" y="360" font-size="10" fill="#999">+</text>
  <text x="296" y="360" font-size="10" fill="#999">+</text>
  <text x="346" y="360" font-size="10" fill="#999">=</text>

  <!-- 结果框 -->
  <rect x="160" y="378" width="240" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="400" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">ans = 0+2+3+4+10 = 19</text>
  <text x="280" y="416" text-anchor="middle" font-size="10" fill="#999">最大数 5 配最高频次 2 → 贡献 10 最大</text>

  <!-- 右侧注释 -->
  <rect x="380" y="272" width="150" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="455" y="292" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">排序不等式</text>
  <text x="455" y="308" text-anchor="middle" font-size="9" fill="#666">同序 ≥ 乱序 ≥ 反序</text>
  <text x="455" y="324" text-anchor="middle" font-size="9" fill="#b85450">大配大 → 最大和</text>
</svg>
