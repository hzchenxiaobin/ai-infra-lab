<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="430" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：二进制分解 = 最少 2 的幂；区间乘积 = 2^(区间指数和)</text>

  <!-- ===== n ===== -->
  <rect x="235" y="44" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="270" y="64" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">n = 15</text>

  <!-- arrow down + label -->
  <line x1="270" y1="76" x2="270" y2="98" stroke="#666" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="356" y="90" font-size="10.5" fill="#888">二进制 1111</text>

  <!-- powers label -->
  <text x="270" y="116" text-anchor="middle" font-size="11.5" fill="#888">powers（最少 2 的幂，升序唯一）</text>

  <!-- ===== powers chips: 1 2 4 8 ===== -->
  <rect x="138" y="122" width="54" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="165" y="143" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="208" y="122" width="54" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="235" y="143" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="278" y="122" width="54" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="305" y="143" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">4</text>
  <rect x="348" y="122" width="54" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="375" y="143" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">8</text>

  <!-- exponent annotations -->
  <text x="165" y="174" text-anchor="middle" font-size="10.5" fill="#888">= 2⁰</text>
  <text x="235" y="174" text-anchor="middle" font-size="10.5" fill="#888">= 2¹</text>
  <text x="305" y="174" text-anchor="middle" font-size="10.5" fill="#888">= 2²</text>
  <text x="375" y="174" text-anchor="middle" font-size="10.5" fill="#888">= 2³</text>

  <!-- arrow down + label -->
  <line x1="270" y1="182" x2="270" y2="204" stroke="#666" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="356" y="196" font-size="10.5" fill="#888">取指数 e</text>

  <!-- ===== exponents chips: 0 1 2 3 ===== -->
  <text x="270" y="222" text-anchor="middle" font-size="11.5" fill="#888">exponents</text>
  <rect x="138" y="228" width="54" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="165" y="248" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">0</text>
  <rect x="208" y="228" width="54" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="235" y="248" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">1</text>
  <rect x="278" y="228" width="54" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="305" y="248" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">2</text>
  <rect x="348" y="228" width="54" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="375" y="248" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">3</text>

  <!-- arrow down -->
  <line x1="270" y1="262" x2="270" y2="282" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== insight box ===== -->
  <rect x="64" y="286" width="412" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="307" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">∏ 2^{e_j} = 2^{Σ e_j}</text>
  <text x="270" y="323" text-anchor="middle" font-size="11" fill="#4a7a3a">区间乘积查询 ⟶ 区间指数和查询（前缀和 O(1)）</text>

  <!-- ===== example: query [0,3] ===== -->
  <text x="270" y="350" text-anchor="middle" font-size="11" fill="#888">查询 [0,3]：Σ e = 0+1+2+3 = 6</text>
  <line x1="270" y1="356" x2="270" y2="376" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="200" y="380" width="140" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="402" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2⁶ = 64</text>
</svg>
