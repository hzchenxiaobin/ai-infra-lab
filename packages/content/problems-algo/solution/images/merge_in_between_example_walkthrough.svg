<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="940" height="520" fill="#fdfcf7"/>

  <text x="470" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算：list1 = [10,1,13,6,9,5], a=3, b=4, list2 = [1000000,1000001,1000002]</text>
  <path d="M 280 38 Q 470 46 660 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Phase 1: prevA -->
  <text x="50" y="70" font-size="13" font-weight="bold" fill="#2b6e9e">① prevA 走 a−1 = 2 步 → 停在下标 2（值 13）</text>
  <g filter="url(#sk)"><rect x="50" y="86" width="50" height="34" rx="4" fill="#fff" stroke="#ddd" stroke-width="1.2"/></g>
  <text x="75" y="108" text-anchor="middle" font-size="12" fill="#444">10</text>
  <g filter="url(#sk)"><rect x="110" y="86" width="40" height="34" rx="4" fill="#fff" stroke="#ddd" stroke-width="1.2"/></g>
  <text x="130" y="108" text-anchor="middle" font-size="12" fill="#444">1</text>
  <g filter="url(#sk)"><rect x="160" y="86" width="50" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="185" y="108" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">13</text>
  <g filter="url(#sk)"><rect x="220" y="86" width="40" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="240" y="108" text-anchor="middle" font-size="12" fill="#b85450">6</text>
  <g filter="url(#sk)"><rect x="270" y="86" width="40" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="290" y="108" text-anchor="middle" font-size="12" fill="#b85450">9</text>
  <g filter="url(#sk)"><rect x="320" y="86" width="40" height="34" rx="4" fill="#fff" stroke="#ddd" stroke-width="1.2"/></g>
  <text x="340" y="108" text-anchor="middle" font-size="12" fill="#444">5</text>
  <text x="375" y="108" font-size="11" fill="#888">→ null</text>
  <path d="M 100 103 L 106 103" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 150 103 L 156 103" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 210 103 L 216 103" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 260 103 L 266 103" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 310 103 L 316 103" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="185" y="74" text-anchor="middle" font-size="10" fill="#2b6e9e" font-weight="bold">prevA</text>
  <path d="M 185 76 L 185 84" stroke="#2b6e9e" stroke-width="1" fill="none" stroke-dasharray="3 2" filter="url(#sk)"/>

  <!-- Phase 2: nodeB -->
  <text x="50" y="158" font-size="13" font-weight="bold" fill="#a07020">② nodeB 从 prevA 再走 b−a+1 = 2 步 → 停在下标 4（值 9）</text>
  <g filter="url(#sk)"><rect x="50" y="174" width="50" height="34" rx="4" fill="#fff" stroke="#ddd" stroke-width="1.2"/></g>
  <text x="75" y="196" text-anchor="middle" font-size="12" fill="#444">10</text>
  <g filter="url(#sk)"><rect x="110" y="174" width="40" height="34" rx="4" fill="#fff" stroke="#ddd" stroke-width="1.2"/></g>
  <text x="130" y="196" text-anchor="middle" font-size="12" fill="#444">1</text>
  <g filter="url(#sk)"><rect x="160" y="174" width="50" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="185" y="196" text-anchor="middle" font-size="12" fill="#2b6e9e">13</text>
  <g filter="url(#sk)"><rect x="220" y="174" width="40" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="240" y="196" text-anchor="middle" font-size="12" fill="#b85450">6</text>
  <g filter="url(#sk)"><rect x="270" y="174" width="40" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="290" y="196" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">9</text>
  <g filter="url(#sk)"><rect x="320" y="174" width="40" height="34" rx="4" fill="#fff" stroke="#ddd" stroke-width="1.2"/></g>
  <text x="340" y="196" text-anchor="middle" font-size="12" fill="#444">5</text>
  <text x="375" y="196" font-size="11" fill="#888">→ null</text>
  <path d="M 100 191 L 106 191" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 150 191 L 156 191" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 210 191 L 216 191" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 260 191 L 266 191" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 310 191 L 316 191" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="290" y="162" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">nodeB</text>
  <path d="M 290 164 L 290 172" stroke="#b85450" stroke-width="1" fill="none" stroke-dasharray="3 2" filter="url(#sk)"/>

  <!-- Phase 3: prevA.next = list2 -->
  <text x="50" y="246" font-size="13" font-weight="bold" fill="#2e6e2e">③ prevA.next = list2（断开 [a,b] 段，接入 list2 头）</text>
  <g filter="url(#sk)"><rect x="50" y="262" width="50" height="34" rx="4" fill="#fff" stroke="#ddd" stroke-width="1.2"/></g>
  <text x="75" y="284" text-anchor="middle" font-size="12" fill="#444">10</text>
  <g filter="url(#sk)"><rect x="110" y="262" width="40" height="34" rx="4" fill="#fff" stroke="#ddd" stroke-width="1.2"/></g>
  <text x="130" y="284" text-anchor="middle" font-size="12" fill="#444">1</text>
  <g filter="url(#sk)"><rect x="160" y="262" width="50" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.6"/></g>
  <text x="185" y="284" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">13</text>
  <!-- crossed-out 6, 9 -->
  <g filter="url(#sk)"><rect x="220" y="262" width="40" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" opacity="0.45"/></g>
  <text x="240" y="284" text-anchor="middle" font-size="12" fill="#b85450" opacity="0.5">6</text>
  <path d="M 222 264 L 258 294" stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="270" y="262" width="40" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" opacity="0.45"/></g>
  <text x="290" y="284" text-anchor="middle" font-size="12" fill="#b85450" opacity="0.5">9</text>
  <path d="M 272 264 L 308 294" stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#sk)"/>
  <g filter="url(#sk)"><rect x="320" y="262" width="40" height="34" rx="4" fill="#fff" stroke="#ddd" stroke-width="1.2"/></g>
  <text x="340" y="284" text-anchor="middle" font-size="12" fill="#444">5</text>
  <path d="M 100 279 L 106 279" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 150 279 L 156 279" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <!-- new arrow 13 -> list2 head -->
  <path d="M 210 279 Q 250 250 290 268" stroke="#2e6e2e" stroke-width="1.8" fill="none" stroke-dasharray="4 2" marker-end="url(#arG)" filter="url(#sk)"/>

  <!-- list2 below -->
  <g filter="url(#sk)"><rect x="290" y="308" width="70" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="325" y="330" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">1000000</text>
  <g filter="url(#sk)"><rect x="370" y="308" width="70" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="405" y="330" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">1000001</text>
  <g filter="url(#sk)"><rect x="450" y="308" width="70" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="485" y="330" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">1000002</text>
  <text x="535" y="330" font-size="11" fill="#888">→ null</text>
  <path d="M 360 325 L 366 325" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 440 325 L 446 325" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Phase 4: tail.next = nodeB.next -->
  <text x="50" y="372" font-size="13" font-weight="bold" fill="#b85450">④ tail 走到 list2 末尾，tail.next = nodeB.next（接回 5）</text>
  <g filter="url(#sk)"><rect x="50" y="388" width="50" height="34" rx="4" fill="#fff" stroke="#ddd" stroke-width="1.2"/></g>
  <text x="75" y="410" text-anchor="middle" font-size="12" fill="#444">10</text>
  <g filter="url(#sk)"><rect x="110" y="388" width="40" height="34" rx="4" fill="#fff" stroke="#ddd" stroke-width="1.2"/></g>
  <text x="130" y="410" text-anchor="middle" font-size="12" fill="#444">1</text>
  <g filter="url(#sk)"><rect x="160" y="388" width="50" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="185" y="410" text-anchor="middle" font-size="12" fill="#2b6e9e">13</text>
  <g filter="url(#sk)"><rect x="220" y="388" width="70" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="255" y="410" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">1000000</text>
  <g filter="url(#sk)"><rect x="300" y="388" width="70" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="335" y="410" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">1000001</text>
  <g filter="url(#sk)"><rect x="380" y="388" width="70" height="34" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.6"/></g>
  <text x="415" y="410" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">1000002</text>
  <g filter="url(#sk)"><rect x="460" y="388" width="40" height="34" rx="4" fill="#fff" stroke="#ddd" stroke-width="1.4"/></g>
  <text x="480" y="410" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">5</text>
  <text x="515" y="410" font-size="11" fill="#888">→ null</text>
  <path d="M 100 405 L 106 405" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 150 405 L 156 405" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 210 405 L 216 405" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 290 405 L 296 405" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 370 405 L 376 405" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 450 405 Q 455 395 458 388" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="4 2" marker-end="url(#arR)" filter="url(#sk)"/>
  <text x="415" y="436" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">tail</text>
  <path d="M 415 432 L 415 422" stroke="#2e6e2e" stroke-width="1" fill="none" stroke-dasharray="3 2" filter="url(#sk)"/>

  <!-- Result -->
  <text x="50" y="468" font-size="13" font-weight="bold" fill="#7a5415">结果：10 → 1 → 13 → 1000000 → 1000001 → 1000002 → 5</text>
  <text x="470" y="500" text-anchor="middle" font-size="11" fill="#888">返回 list1 头指针即可，无新建节点</text>
</svg>
