<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：排序 → 判退化 → 余弦定理 → 转度排序</text>
  <text x="260" y="36" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">全程 O(1)：3 个元素排序 + 3 次 arccos</text>

  <!-- start -->
  <rect x="185" y="52" width="150" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="71" text-anchor="middle" font-size="10.5" fill="#33507a" font-weight="bold" filter="url(#rough2)">输入 sides（3 个正整数）</text>
  <path d="M 260 82 L 260 94" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- sort -->
  <rect x="185" y="96" width="150" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="115" text-anchor="middle" font-size="10.5" fill="#33507a" filter="url(#rough2)">排序：a ≤ b ≤ c</text>
  <path d="M 260 126 L 260 138" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="260,140 345,172 260,204 175,172" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="168" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">a + b &gt; c ?</text>
  <text x="260" y="184" text-anchor="middle" font-size="8.5" fill="#a08030" filter="url(#rough2)">（必须严格大于）</text>

  <!-- invalid branch -->
  <path d="M 345 172 L 395 172" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="362" y="164" text-anchor="start" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="400" y="155" width="105" height="34" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="452" y="169" text-anchor="middle" font-size="10.5" fill="#8a3a36" font-weight="bold" filter="url(#rough2)">返回 []</text>
  <text x="452" y="182" text-anchor="middle" font-size="8" fill="#8a3a36" filter="url(#rough2)">退化：三点共线</text>
  <text x="452" y="201" text-anchor="middle" font-size="8" fill="#b85450" filter="url(#rough2)">a + b = c 也算否</text>

  <!-- valid branch -->
  <path d="M 260 204 L 260 220" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="268" y="218" text-anchor="start" font-size="9" fill="#2a5a1e" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- law of cosines -->
  <rect x="160" y="222" width="200" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="240" text-anchor="middle" font-size="10.5" fill="#33507a" filter="url(#rough2)">余弦定理求三个内角（弧度）</text>
  <text x="260" y="257" text-anchor="middle" font-size="9.5" fill="#33507a" filter="url(#rough2)">θ(x) = arccos( (y² + z² − x²) / (2yz) )</text>
  <path d="M 260 266 L 260 278" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- radians to degrees -->
  <rect x="160" y="280" width="200" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="299" text-anchor="middle" font-size="10.5" fill="#33507a" filter="url(#rough2)">弧度 → 度：× 180 / π</text>
  <path d="M 260 310 L 260 322" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- sort angles -->
  <rect x="160" y="324" width="200" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="343" text-anchor="middle" font-size="10.5" fill="#33507a" filter="url(#rough2)">三个角度按非递减排序</text>
  <path d="M 260 354 L 260 362" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- end -->
  <rect x="185" y="364" width="150" height="30" rx="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="383" text-anchor="middle" font-size="10.5" fill="#2a5a1e" font-weight="bold" filter="url(#rough2)">返回 [A, B, C]</text>

  <!-- left note: big side big angle -->
  <rect x="26" y="150" width="120" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="86" y="170" text-anchor="middle" font-size="9.5" fill="#2a5a1e" font-weight="bold" filter="url(#rough2)">大边对大角</text>
  <text x="86" y="186" text-anchor="middle" font-size="8.5" fill="#3a4a3a" filter="url(#rough2)">边升序 ⇒ 角升序</text>
  <text x="86" y="202" text-anchor="middle" font-size="8.5" fill="#3a4a3a" filter="url(#rough2)">显式排序只是兜底</text>

  <!-- right note: precision -->
  <rect x="386" y="222" width="112" height="88" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="442" y="240" text-anchor="middle" font-size="9.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">精度账</text>
  <text x="442" y="256" text-anchor="middle" font-size="8" fill="#7a6420" filter="url(#rough2)">分子为整数 ≤ 2×10⁶</text>
  <text x="442" y="270" text-anchor="middle" font-size="8" fill="#7a6420" filter="url(#rough2)">double 精确表示</text>
  <text x="442" y="284" text-anchor="middle" font-size="8" fill="#7a6420" filter="url(#rough2)">arccos 单次舍入</text>
  <text x="442" y="298" text-anchor="middle" font-size="8" fill="#7a6420" filter="url(#rough2)">误差 ≪ 10⁻⁵ 度</text>
</svg>
