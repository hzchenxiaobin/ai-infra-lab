<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：逐字母数位和 + 循环 k 次</text>

  <!-- Input -->
  <rect x="140" y="46" width="240" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="70" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">输入：字符串 s，整数 k</text>

  <path d="M 260 90 L 260 108" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 1: compute R1 -->
  <rect x="60" y="114" width="400" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="136" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">步骤 1：求第一次数位和 R₁</text>
  <text x="260" y="154" text-anchor="middle" font-size="11" fill="#555">R = 0；for c in s: v = c−'a'+1; R += v/10 + v%10</text>
  <text x="260" y="170" text-anchor="middle" font-size="10" fill="#888">逐字母求数位和累加，避免构造大整数；O(n)</text>

  <path d="M 260 180 L 260 196" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: loop k-1 times -->
  <rect x="60" y="202" width="400" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="222" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">步骤 2：循环 k−1 次</text>
  <text x="260" y="240" text-anchor="middle" font-size="11" fill="#555">R = digit_sum(R)（逐位取余求和）</text>

  <path d="M 260 252 L 260 268" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 3: diamond - k iterations done? -->
  <path d="M 260 274 L 360 308 L 260 342 L 160 308 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="302" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">已做 k 次？</text>
  <text x="260" y="318" text-anchor="middle" font-size="10.5" fill="#555">（第 1 次 + k−1 次）</text>

  <!-- Left branch: no, loop back -->
  <path d="M 160 308 L 100 308 L 100 226" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="110" y="300" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">否</text>
  <path d="M 100 226 L 60 226" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Right branch: yes, return -->
  <path d="M 360 308 L 440 308" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="400" y="300" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="436" y="296" width="68" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="470" y="316" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return R</text>

  <!-- note -->
  <text x="60" y="376" font-size="10.5" fill="#888">R₁ ≤ 1000，后续每轮 R ≤ 27（999 的数位和），</text>
  <text x="60" y="392" font-size="10.5" fill="#888">故循环体 O(log R) = O(1)，总时间 O(n + k)。</text>
</svg>
