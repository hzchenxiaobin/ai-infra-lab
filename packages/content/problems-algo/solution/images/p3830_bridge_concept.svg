<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：删掉一格，用「新比较号」焊接前后两段</text>

  <!-- 区域标签 -->
  <text x="180" y="58" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">左段：以 r−1 结尾</text>
  <text x="280" y="58" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 删除 nums[3]</text>
  <text x="405" y="58" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">右段：从 r+1 开始</text>

  <!-- 焊接弧线箭头 -->
  <path d="M 233 172 C 233 118, 327 118, 327 168" stroke="#d6a040" stroke-width="2.2" fill="none"
        marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="106" text-anchor="middle" font-size="11.5" fill="#a07020" font-weight="bold" filter="url(#rough2)">新比较号：1 &lt; 3（升）</text>

  <!-- 相邻比较号行 -->
  <g filter="url(#rough2)" text-anchor="middle">
    <text x="155" y="160" font-size="11" fill="#aaa">&gt;</text>
    <text x="205" y="160" font-size="12.5" fill="#446688" font-weight="bold">&gt;</text>
    <text x="255" y="160" font-size="11" fill="#ccc"><tspan text-decoration="line-through">&lt;</tspan></text>
    <text x="305" y="160" font-size="11" fill="#ccc"><tspan text-decoration="line-through">&lt;</tspan></text>
    <text x="355" y="160" font-size="12.5" fill="#4a7a3a" font-weight="bold">&gt;</text>
    <text x="405" y="160" font-size="11" fill="#aaa">&gt;</text>
  </g>
  <text x="280" y="176" text-anchor="middle" font-size="9" fill="#bbb" filter="url(#rough2)">（与被删元素相关的两个比较号随之消失）</text>

  <!-- 数组格子 -->
  <g filter="url(#rough2)">
    <rect x="107" y="190" width="46" height="44" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
    <rect x="157" y="190" width="46" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="207" y="190" width="46" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <rect x="257" y="190" width="46" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 3"/>
    <rect x="307" y="190" width="46" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="357" y="190" width="46" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <rect x="407" y="190" width="46" height="44" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
  </g>

  <!-- 元素值 -->
  <g filter="url(#rough2)" font-size="13" fill="#333" text-anchor="middle">
    <text x="130" y="218">3</text>
    <text x="180" y="218">2</text>
    <text x="230" y="218">1</text>
    <text x="280" y="218" fill="#b85450">2</text>
    <text x="330" y="218">3</text>
    <text x="380" y="218">2</text>
    <text x="430" y="218">1</text>
  </g>
  <text x="280" y="240" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <!-- 下标 -->
  <g filter="url(#rough2)" font-size="10" fill="#999" text-anchor="middle">
    <text x="130" y="252">0</text>
    <text x="180" y="252">1</text>
    <text x="230" y="252">2 = r−1</text>
    <text x="280" y="252" fill="#b85450" font-weight="bold">3 = r</text>
    <text x="330" y="252">4 = r+1</text>
    <text x="380" y="252">5</text>
    <text x="430" y="252">6</text>
  </g>

  <!-- 方向模式条 -->
  <g filter="url(#rough2)">
    <rect x="120" y="266" width="120" height="28" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="180" y="285" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold">↓ 左段收尾是降</text>
    <rect x="220" y="266" width="120" height="28" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="280" y="285" text-anchor="middle" font-size="11.5" fill="#a07020" font-weight="bold">↑ 焊接步是升</text>
    <rect x="320" y="266" width="120" height="28" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="380" y="285" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold">↓ 右段起手是降</text>
  </g>

  <!-- 底部解释框 -->
  <g filter="url(#rough2)">
    <rect x="30" y="304" width="500" height="82" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="326" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold">焊接合法 ⟺ 新比较号与两侧各自的「下一步方向」都相反（或该侧只有单元素）</text>
    <text x="280" y="346" text-anchor="middle" font-size="10.5" fill="#33506b">nums[r−1] &lt; nums[r+1]（升）⟹ 候选 = down[r−1] + sdown[r+1]，方向序列 ↓↑↓</text>
    <text x="280" y="364" text-anchor="middle" font-size="10.5" fill="#33506b">nums[r−1] &gt; nums[r+1]（降）⟹ 候选 = up[r−1] + sup[r+1]，方向序列 ↑↓↑</text>
    <rect x="170" y="371" width="220" height="22" rx="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="280" y="386" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold">本例：down[2] + sdown[4] = 2 + 2 = 4 ✓</text>
  </g>
</svg>
