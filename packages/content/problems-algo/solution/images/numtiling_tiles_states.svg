<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">两种瓷砖 与 三种轮廓状态</text>

  <!-- ===== Band 1: Tiles ===== -->
  <text x="40" y="56" font-size="12" fill="#888" font-weight="bold">① 多米诺 domino（2 格，可旋转）</text>

  <!-- vertical domino: two stacked cells -->
  <rect x="60" y="70" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="60" y="98" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="74" y="146" text-anchor="middle" font-size="10" fill="#446688">竖向</text>

  <!-- horizontal domino: two side-by-side cells -->
  <rect x="120" y="84" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="148" y="84" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="148" y="146" text-anchor="middle" font-size="10" fill="#4a7a3a">横向</text>

  <text x="210" y="56" font-size="12" fill="#888" font-weight="bold">② 托米诺 tromino（3 格，L 形 4 朝向）</text>

  <!-- 4 L-trominoes, each 2x2 minus one cell, cell 26x26 -->
  <!-- T1 missing bottom-right -->
  <rect x="210" y="72" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="236" y="72" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="210" y="98" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- T2 missing bottom-left -->
  <rect x="290" y="72" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="316" y="72" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="316" y="98" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- T3 missing top-right -->
  <rect x="370" y="72" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="370" y="98" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="396" y="98" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- T4 missing top-left -->
  <rect x="450" y="98" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="476" y="72" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="476" y="98" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="280" y="146" text-anchor="middle" font-size="10" fill="#888">L 形：2×2 去掉一格，共 4 种朝向</text>

  <!-- divider -->
  <path d="M 40 168 L 520 168" stroke="#ddd" stroke-width="1" stroke-dasharray="5,3" filter="url(#rough2)"/>

  <!-- ===== Band 2: three profile states ===== -->
  <text x="40" y="190" font-size="12" fill="#888" font-weight="bold">按「右边界轮廓」定义状态（列从左往右推进，瓷砖至多跨 1 列）</text>

  <!-- State f[i]: 2x3 fully filled, flat right boundary -->
  <text x="74" y="214" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">f[i]</text>
  <!-- 2x3 grid, cell 28x28, origin (30,224) -->
  <rect x="30" y="224" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="58" y="224" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="86" y="224" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="30" y="252" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="58" y="252" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="86" y="252" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="72" y="298" text-anchor="middle" font-size="10" fill="#555">2×i 完整填满</text>
  <text x="72" y="312" text-anchor="middle" font-size="9" fill="#888">右边界齐平</text>

  <!-- State g_top[i]: 2x3 full + top of next column filled (top protrusion) -->
  <text x="232" y="214" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">g[i]（上凸）</text>
  <!-- cols 1..3 full -->
  <rect x="190" y="224" width="28" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="218" y="224" width="28" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="246" y="224" width="28" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="190" y="252" width="28" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="218" y="252" width="28" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="246" y="252" width="28" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- protrusion: top cell of col 4 (dashed outline, filled) -->
  <rect x="274" y="224" width="28" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" stroke-dasharray="4,2" filter="url(#rough2)"/>
  <!-- empty bottom cell of col 4 -->
  <rect x="274" y="252" width="28" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="232" y="298" text-anchor="middle" font-size="10" fill="#555">2×i 填满 + 下一列上方</text>
  <text x="232" y="312" text-anchor="middle" font-size="9" fill="#888">底部缺一格</text>

  <!-- State g_bot[i]: symmetric, bottom protrusion -->
  <text x="392" y="214" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">g[i]（下凸）</text>
  <rect x="350" y="224" width="28" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="378" y="224" width="28" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="406" y="224" width="28" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="350" y="252" width="28" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="378" y="252" width="28" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="406" y="252" width="28" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- empty top of col 4 -->
  <rect x="434" y="224" width="28" height="28" fill="#fafafa" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <!-- protrusion bottom -->
  <rect x="434" y="252" width="28" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" stroke-dasharray="4,2" filter="url(#rough2)"/>
  <text x="392" y="298" text-anchor="middle" font-size="10" fill="#555">2×i 填满 + 下一列下方</text>
  <text x="392" y="312" text-anchor="middle" font-size="9" fill="#888">与上凸对称，方案数相同</text>

  <!-- ===== summary box ===== -->
  <rect x="30" y="332" width="500" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="354" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">关键：只看右边界轮廓 → 状态有限（齐平 / 上凸 / 下凸）</text>
  <text x="280" y="372" text-anchor="middle" font-size="10.5" fill="#555">f[i]：前 i 列完整；g[i]：前 i 列完整 + 第 i+1 列凸出一格</text>
  <text x="280" y="388" text-anchor="middle" font-size="10.5" fill="#888">上凸与下凸方案数恒等（上下镜像对称）→ 统一记作 g[i]</text>
</svg>
