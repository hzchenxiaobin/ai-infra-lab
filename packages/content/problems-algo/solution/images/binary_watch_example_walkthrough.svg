<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>
  <text x="270" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：turnedOn = 1 → 恰好 1 个 LED 亮</text>

  <!-- Left column header -->
  <rect x="40" y="50" width="210" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="145" y="69" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">小时亮 1 位（4 种）</text>

  <!-- Left cards: h=1,2,4,8 ; m=0 -->
  <!-- h=1 -->
  <rect x="40" y="86" width="210" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="55" y="109" font-size="11" fill="#333" font-weight="bold">h=1</text>
  <text x="95" y="109" font-size="10.5" fill="#888">0001</text>
  <text x="160" y="109" font-size="11" fill="#d6a040" font-weight="bold">→ 1:00</text>

  <!-- h=2 -->
  <rect x="40" y="128" width="210" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="55" y="151" font-size="11" fill="#333" font-weight="bold">h=2</text>
  <text x="95" y="151" font-size="10.5" fill="#888">0010</text>
  <text x="160" y="151" font-size="11" fill="#d6a040" font-weight="bold">→ 2:00</text>

  <!-- h=4 -->
  <rect x="40" y="170" width="210" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="55" y="193" font-size="11" fill="#333" font-weight="bold">h=4</text>
  <text x="95" y="193" font-size="10.5" fill="#888">0100</text>
  <text x="160" y="193" font-size="11" fill="#d6a040" font-weight="bold">→ 4:00</text>

  <!-- h=8 -->
  <rect x="40" y="212" width="210" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="55" y="235" font-size="11" fill="#333" font-weight="bold">h=8</text>
  <text x="95" y="235" font-size="10.5" fill="#888">1000</text>
  <text x="160" y="235" font-size="11" fill="#d6a040" font-weight="bold">→ 8:00</text>

  <!-- Left note -->
  <text x="145" y="266" text-anchor="middle" font-size="10" fill="#446688">m = 0 = 000000（0 个 1）</text>
  <text x="145" y="280" text-anchor="middle" font-size="10" fill="#555">每个 h 恰好 1 个 1 → cnt = 1+0 = 1 ✓</text>

  <!-- Right column header -->
  <rect x="290" y="50" width="210" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="395" y="69" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">分钟亮 1 位（6 种）</text>

  <!-- Right cards: h=0 ; m=1,2,4,8,16,32 -->
  <!-- m=1 -->
  <rect x="290" y="86" width="210" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="305" y="109" font-size="11" fill="#333" font-weight="bold">m=1</text>
  <text x="345" y="109" font-size="10.5" fill="#888">000001</text>
  <text x="420" y="109" font-size="11" fill="#4a7a3a" font-weight="bold">→ 0:01</text>

  <!-- m=2 -->
  <rect x="290" y="128" width="210" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="305" y="151" font-size="11" fill="#333" font-weight="bold">m=2</text>
  <text x="345" y="151" font-size="10.5" fill="#888">000010</text>
  <text x="420" y="151" font-size="11" fill="#4a7a3a" font-weight="bold">→ 0:02</text>

  <!-- m=4 -->
  <rect x="290" y="170" width="210" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="305" y="193" font-size="11" fill="#333" font-weight="bold">m=4</text>
  <text x="345" y="193" font-size="10.5" fill="#888">000100</text>
  <text x="420" y="193" font-size="11" fill="#4a7a3a" font-weight="bold">→ 0:04</text>

  <!-- m=8 -->
  <rect x="290" y="212" width="210" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="305" y="235" font-size="11" fill="#333" font-weight="bold">m=8</text>
  <text x="345" y="235" font-size="10.5" fill="#888">001000</text>
  <text x="420" y="235" font-size="11" fill="#4a7a3a" font-weight="bold">→ 0:08</text>

  <!-- m=16 -->
  <rect x="290" y="254" width="210" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="305" y="277" font-size="11" fill="#333" font-weight="bold">m=16</text>
  <text x="340" y="277" font-size="10.5" fill="#888">010000</text>
  <text x="420" y="277" font-size="11" fill="#4a7a3a" font-weight="bold">→ 0:16</text>

  <!-- m=32 -->
  <rect x="290" y="296" width="210" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="305" y="319" font-size="11" fill="#333" font-weight="bold">m=32</text>
  <text x="340" y="319" font-size="10.5" fill="#888">100000</text>
  <text x="420" y="319" font-size="11" fill="#4a7a3a" font-weight="bold">→ 0:32</text>

  <!-- Right note -->
  <text x="395" y="350" text-anchor="middle" font-size="10" fill="#4a7a3a">h = 0 = 0000（0 个 1）</text>
  <text x="395" y="364" text-anchor="middle" font-size="10" fill="#555">每个 m 恰好 1 个 1 → cnt = 0+1 = 1 ✓</text>

  <!-- Total footer -->
  <rect x="80" y="378" width="380" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="400" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">合计：4 + 6 = 10 种合法时间 ✓</text>
</svg>
