<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 374" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="374" fill="#fafafa"/>

  <text x="290" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心思路：k 既是加数又是进位——逐位折叠，k%10 写位，k/10 向左</text>

  <text x="196" y="96" font-size="12" fill="#888">num</text>

  <rect x="224" y="72" width="52" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="97" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <rect x="300" y="72" width="52" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="326" y="97" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="376" y="72" width="52" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="402" y="97" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">5</text>

  <text x="446" y="52" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">k=806</text>
  <path d="M 460 62 L 432 62" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <text x="365" y="52" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">k=81</text>
  <path d="M 376 62 L 354 62" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <text x="289" y="52" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">k=8</text>
  <path d="M 300 62 L 278 62" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <text x="210" y="52" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">k=1</text>
  <path d="M 224 62 L 196 62" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <text x="326" y="130" text-anchor="middle" font-size="11" fill="#666">每位运算：k ← k + digit，写入 k % 10，k ← k / 10</text>

  <text x="150" y="186" font-size="12" fill="#888">结果</text>

  <rect x="170" y="164" width="52" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="196" y="189" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="224" y="164" width="52" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="189" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <rect x="300" y="164" width="52" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="326" y="189" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <rect x="376" y="164" width="52" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="402" y="189" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>

  <text x="196" y="222" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">k=1&gt;0，首位补 1</text>
  <text x="326" y="222" text-anchor="middle" font-size="10" fill="#4a7a3a">绿色 = 发生变化的位</text>

  <rect x="60" y="240" width="460" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="262" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">k 的角色：进入当前位时是「加数」，离开时变成「进位」</text>

  <rect x="60" y="284" width="460" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="306" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">与 66 题「加一」同构——66 是 k=1 的特例（进位恒为 0 或 1）</text>

  <rect x="60" y="330" width="460" height="28" fill="none" stroke="#bbb" stroke-width="0.8" stroke-dasharray="3 3" rx="4" filter="url(#rough2)"/>
  <text x="290" y="348" text-anchor="middle" font-size="10" fill="#888">每位只需一次 k+digit 运算，k 单调递减，至多 O(log k) 次后归零</text>
</svg>
