<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">最小堆解法流程</text>

  <!-- step 1: sort -->
  <rect x="190" y="44" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">按 start 升序排序</text>
  <text x="270" y="77" text-anchor="middle" font-size="10.5" fill="#666">start 相同按 end 排序</text>
  <line x1="270" y1="84" x2="270" y2="104" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2: loop -->
  <rect x="170" y="104" width="200" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="125" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">遍历每个会议 [s, e)</text>
  <line x1="270" y1="138" x2="270" y2="158" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision -->
  <path d="M 270 158 L 380 200 L 270 242 L 160 200 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="196" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">堆非空 且</text>
  <text x="270" y="212" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">heap[0] ≤ s ?</text>

  <!-- yes branch: pop then push -->
  <text x="400" y="196" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <line x1="380" y1="200" x2="410" y2="200" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="410" y="180" width="110" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="465" y="198" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">heappop()</text>
  <text x="465" y="213" text-anchor="middle" font-size="10" fill="#4a7a3a">腾出最早房间</text>

  <!-- no branch: directly push -->
  <text x="120" y="196" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M 160 200 L 120 200 L 120 270" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="60" y="216" font-size="10" fill="#888">仍被占用，</text>
  <text x="60" y="230" font-size="10" fill="#888">须新开房间</text>

  <!-- push box (common) -->
  <line x1="465" y1="220" x2="465" y2="248" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 120 270 L 120 270" stroke="#888" stroke-width="1.6" fill="none"/>
  <path d="M 120 270 Q 270 270 410 270" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="180" y="290" width="180" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="308" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">heappush(e)</text>
  <text x="270" y="322" text-anchor="middle" font-size="10" fill="#666">记录该房间新的结束时刻</text>

  <!-- back to loop -->
  <path d="M 270 328 Q 270 350 100 350 L 100 121 L 170 121" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="108" y="344" font-size="10" fill="#888">处理下一个会议</text>

  <!-- end -->
  <line x1="360" y1="309" x2="450" y2="309" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4 3"/>
  <rect x="450" y="290" width="80" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="490" y="307" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">返回</text>
  <text x="490" y="321" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">len(heap)</text>
</svg>
