<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：LEFT JOIN → IS NULL → GROUP BY → COUNT</text>

  <!-- ===== Start: FROM Visits ===== -->
  <rect x="170" y="40" width="180" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">FROM Visits v</text>

  <!-- Arrow down -->
  <path d="M 260 78 L 260 92" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== LEFT JOIN Transactions ===== -->
  <rect x="130" y="96" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="114" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">LEFT JOIN Transactions t</text>
  <text x="260" y="128" text-anchor="middle" font-size="9" fill="#888">ON v.visit_id = t.visit_id</text>

  <!-- Arrow down -->
  <path d="M 260 138 L 260 152" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Decision: t.transaction_id IS NULL? ===== -->
  <polygon points="260,156 380,200 260,244 140,200" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="196" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">t.transaction_id</text>
  <text x="260" y="212" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">IS NULL?</text>

  <!-- No branch (right) - has transaction -->
  <path d="M 380 200 L 440 200" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="194" text-anchor="middle" font-size="9" fill="#b85450">否</text>
  <rect x="440" y="184" width="72" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="476" y="204" text-anchor="middle" font-size="9" fill="#b85450">有交易</text>
  <text x="476" y="214" text-anchor="middle" font-size="8" fill="#b85450">丢弃</text>

  <!-- Yes branch (down) - no transaction -->
  <path d="M 260 244 L 260 258" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="254" font-size="9" fill="#4a7a3a">是</text>

  <!-- ===== GROUP BY customer_id ===== -->
  <rect x="140" y="262" width="240" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="280" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">GROUP BY v.customer_id</text>
  <text x="260" y="296" text-anchor="middle" font-size="9" fill="#888">按顾客折叠无交易的访问</text>

  <!-- Arrow down -->
  <path d="M 260 308 L 260 322" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== SELECT aggregate ===== -->
  <rect x="100" y="326" width="320" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="344" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">SELECT customer_id, COUNT(*)</text>
  <text x="260" y="360" text-anchor="middle" font-size="9" fill="#555">AS count_no_trans</text>

  <!-- Arrow down -->
  <path d="M 260 372 L 260 384" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Output ===== -->
  <rect x="150" y="388" width="220" height="10" fill="none" stroke="none"/>
  <text x="260" y="396" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">customer_id, count_no_trans</text>

  <!-- ===== Side note: execution order ===== -->
  <rect x="20" y="96" width="96" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="68" y="114" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">执行顺序</text>
  <text x="28" y="130" font-size="8" fill="#666">FROM</text>
  <text x="28" y="144" font-size="8" fill="#666">→ JOIN</text>
  <text x="28" y="158" font-size="8" fill="#666">→ WHERE</text>
  <text x="28" y="172" font-size="8" fill="#666">→ GROUP BY</text>
  <text x="28" y="186" font-size="8" fill="#666">→ SELECT</text>

  <!-- ===== Side note: why IS NULL ===== -->
  <rect x="400" y="262" width="112" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="456" y="280" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">为何 IS NULL?</text>
  <text x="408" y="296" font-size="8" fill="#666">LEFT JOIN 无匹配</text>
  <text x="408" y="310" font-size="8" fill="#666">时右表列填 NULL</text>
  <text x="408" y="318" font-size="7" fill="#888">判定"无交易"关键</text>
</svg>
