<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#5a5a5a"/>
    </marker>
  </defs>

  <rect width="720" height="470" fill="#fafafa"/>

  <text x="360" y="28" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：频率得分 = Σ v^频次，滑窗一步只需增量</text>
  <text x="360" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">示例数组 [5, 4, 5, 7, 4, 4]</text>

  <!-- 数组格子 -->
  <g font-size="9" fill="#bbb" text-anchor="middle" filter="url(#rough2)">
    <text x="235" y="74">0</text><text x="285" y="74">1</text><text x="335" y="74">2</text>
    <text x="385" y="74">3</text><text x="435" y="74">4</text><text x="485" y="74">5</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="210" y="82" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="260" y="82" width="50" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="310" y="82" width="50" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4"/>
    <rect x="360" y="82" width="50" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <rect x="410" y="82" width="50" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <rect x="460" y="82" width="50" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
  </g>
  <g font-size="16" font-weight="bold" text-anchor="middle" filter="url(#rough2)">
    <text x="235" y="108" fill="#3a4e7a">5</text>
    <text x="285" y="108" fill="#3a5a2a">4</text>
    <text x="335" y="108" fill="#3a4e7a">5</text>
    <text x="385" y="108" fill="#7a5415">7</text>
    <text x="435" y="108" fill="#3a5a2a">4</text>
    <text x="485" y="108" fill="#3a5a2a">4</text>
  </g>
  <text x="360" y="140" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">同色 = 同值；频次 = 该值在窗口里的出现次数</text>

  <!-- 频率得分计算 -->
  <rect x="40" y="154" width="640" height="86" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="176" font-size="12" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">频率得分 = 各不同值的「幂次」之和（对 10⁹ + 7 取模）</text>
  <g font-size="12" fill="#333" filter="url(#rough2)">
    <text x="60" y="198">值 4 出现 3 次 → 4³ = 64　　　值 5 出现 2 次 → 5² = 25　　　值 7 出现 1 次 → 7¹ = 7</text>
    <text x="60" y="220" fill="#2e6e2e" font-weight="bold">合计 = 64 + 25 + 7 = 96　(mod 10⁹ + 7)</text>
  </g>

  <!-- 公式框 -->
  <rect x="40" y="250" width="640" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="360" y="272" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">关键公式</text>
  <text x="360" y="292" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">score = Σ<tspan font-size="9" dy="-2">v ∈ distinct</tspan><tspan dy="2"> </tspan>v^cnt[v]　(mod p)，p = 10⁹ + 7</text>

  <!-- 增量推导 -->
  <rect x="40" y="310" width="640" height="84" fill="#fffdf3" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="332" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">滑窗增量：某值 v 的频次 c → c + 1 时</text>
  <text x="60" y="354" font-size="12" fill="#333" filter="url(#rough2)">其贡献 v^c → v^(c+1)，增量 Δ = v^(c+1) − v^c = (v − 1) · v^c</text>
  <text x="60" y="376" font-size="11.5" fill="#555" filter="url(#rough2)">特例：c = 0（新值入窗）贡献 0 → v¹，Δ = v；c = 1 → 0（旧值离窗）贡献 v → 0，Δ = −v</text>

  <!-- 结算 -->
  <rect x="40" y="402" width="640" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="360" y="424" text-anchor="middle" font-size="12.5" fill="#3a4e7a" font-weight="bold" filter="url(#rough2)">移除 a、加入 b：cur += Δ_b − Δ_a，配合快速幂 O(log k)</text>
  <text x="360" y="444" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">每步只改两个值的频次 → 增量更新，无需重算整个窗口 O(k)</text>
</svg>
