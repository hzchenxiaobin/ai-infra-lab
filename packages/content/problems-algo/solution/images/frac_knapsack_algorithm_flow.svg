<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="340" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：排序 → 贪心取 → 判满</text>

  <!-- ① 排序 -->
  <rect x="140" y="42" width="260" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">① 按 单价 = price ÷ weight 降序排</text>
  <text x="270" y="76" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">比较器：a.w·b.p &lt; a.p·b.w（交叉乘，免浮点）</text>

  <path d="M270,86 L270,102" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- ②③ 初始化 + 贪心循环 -->
  <rect x="105" y="102" width="330" height="90" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="122" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">② ans = 0；③ 遍历每个物品 [p, w]：</text>
  <text x="130" y="142" font-size="11" fill="#555" filter="url(#rough2)">v = min(w, capacity)            ← 取不超过剩余容量</text>
  <text x="130" y="160" font-size="11" fill="#555" filter="url(#rough2)">ans += v ÷ w × p                ← 按比例计价</text>
  <text x="130" y="178" font-size="11" fill="#555" filter="url(#rough2)">capacity -= v</text>
  <text x="412" y="150" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">↻ 下一个</text>
  <path d="M410,134 C432,134 432,120 410,120" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <path d="M270,192 L270,210" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- ④ 判定菱形 -->
  <polygon points="270,210 360,250 270,290 180,250" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="254" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">④ capacity &gt; 0?</text>

  <!-- 左分支：装不满 -->
  <path d="M180,250 L120,250" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="150" y="242" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="30" y="234" width="90" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="75" y="254" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">return -1</text>
  <text x="75" y="276" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">总重不足</text>

  <!-- 右分支：装满 -->
  <path d="M360,250 L420,250" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="390" y="242" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="420" y="234" width="100" height="32" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="470" y="254" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return ans</text>
  <text x="470" y="276" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">恰好装满</text>

  <text x="270" y="324" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">排序 O(n log n) 主导；贪心遍历 O(n)，总 O(n log n)</text>
</svg>
