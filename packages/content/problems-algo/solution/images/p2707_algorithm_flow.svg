<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程</text>

  <!-- Step 1: init -->
  <rect x="170" y="42" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="67" text-anchor="middle" font-size="12" fill="#333">字典转 set，dp[0]=0</text>
  <path d="M 260 82 L 260 100" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 2: loop i=1..n (diamond) -->
  <polygon points="260,104 340,140 260,176 180,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="136" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">i ≤ n ?</text>
  <text x="260" y="152" text-anchor="middle" font-size="10" fill="#888">遍历每个位置</text>

  <!-- No -> return -->
  <path d="M 340 140 L 420 140" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="378" y="134" text-anchor="middle" font-size="10" fill="#4a7a3a">否</text>
  <rect x="420" y="124" width="86" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="463" y="146" text-anchor="middle" font-size="11" fill="#333">返回 dp[n]</text>

  <!-- Yes -> down -->
  <path d="M 260 176 L 260 196" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="270" y="190" font-size="10" fill="#4a7a3a">是</text>

  <!-- Step 3: dp[i] = dp[i-1]+1 -->
  <rect x="150" y="200" width="220" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="225" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">先按丢弃：dp[i] = dp[i-1]+1</text>
  <path d="M 260 240 L 260 258" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 4: inner loop j (diamond) -->
  <polygon points="260,262 340,298 260,334 180,298" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="294" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">j &lt; i ?</text>
  <text x="260" y="310" text-anchor="middle" font-size="10" fill="#888">枚举起点 j</text>

  <!-- Yes B: match check -->
  <path d="M 180 298 L 110 298" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="146" y="292" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>
  <rect x="20" y="278" width="90" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="65" y="295" text-anchor="middle" font-size="10" fill="#333">s[j:i] ∈ 字典?</text>
  <text x="65" y="310" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">→ dp[i]=min</text>
  <!-- back to j loop -->
  <path d="M 65 278 L 65 262 L 180 262 L 180 280" stroke="#999" stroke-width="1.3" fill="none" stroke-dasharray="3,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="120" y="256" font-size="9" fill="#999">下一个 j</text>

  <!-- No B: i++ -->
  <path d="M 340 298 L 420 298" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="378" y="292" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <rect x="400" y="280" width="100" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="450" y="304" text-anchor="middle" font-size="11" fill="#333">i++</text>
  <!-- back to top diamond -->
  <path d="M 450 280 L 450 140 L 342 140" stroke="#999" stroke-width="1.3" fill="none" stroke-dasharray="3,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="458" y="210" font-size="9" fill="#999">回到 i 循环</text>

  <!-- note -->
  <rect x="150" y="356" width="220" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="376" text-anchor="middle" font-size="10" fill="#555">先「全丢弃」兜底，再用匹配尝试压低</text>
</svg>
