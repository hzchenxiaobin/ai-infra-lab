<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#6a9acc"/>
    </marker>
    <marker id="arrBack" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="340" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">Gray 码连接：操作序列即反射 Gray 码</text>

  <!-- 8 个状态节点：值序列 0,1,3,2,6,7,5,4 -->
  <!-- 节点宽度40, 间距60, 起点 x=50 -->
  <g filter="url(#rough2)">
    <!-- 0 -->
    <circle cx="70" cy="100" r="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2"/>
    <text x="70" y="105" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
    <text x="70" y="78" text-anchor="middle" font-size="9.5" fill="#888">000</text>
    <!-- 1 -->
    <circle cx="130" cy="100" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="130" y="105" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
    <text x="130" y="78" text-anchor="middle" font-size="9.5" fill="#888">001</text>
    <!-- 3 -->
    <circle cx="190" cy="100" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="190" y="105" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
    <text x="190" y="78" text-anchor="middle" font-size="9.5" fill="#888">011</text>
    <!-- 2 -->
    <circle cx="250" cy="100" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="250" y="105" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
    <text x="250" y="78" text-anchor="middle" font-size="9.5" fill="#888">010</text>
    <!-- 6 -->
    <circle cx="310" cy="100" r="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="310" y="105" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
    <text x="310" y="78" text-anchor="middle" font-size="9.5" fill="#888">110</text>
    <!-- 7 -->
    <circle cx="370" cy="100" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="370" y="105" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
    <text x="370" y="78" text-anchor="middle" font-size="9.5" fill="#888">111</text>
    <!-- 5 -->
    <circle cx="430" cy="100" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="430" y="105" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
    <text x="430" y="78" text-anchor="middle" font-size="9.5" fill="#888">101</text>
    <!-- 4 -->
    <circle cx="490" cy="100" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <text x="490" y="105" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
    <text x="490" y="78" text-anchor="middle" font-size="9.5" fill="#888">100</text>
  </g>

  <!-- 前向箭头 (Gray 码生成方向) -->
  <g filter="url(#rough2)">
    <path d="M 92 100 L 108 100" stroke="#6a9acc" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <path d="M 152 100 L 168 100" stroke="#6a9acc" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <path d="M 212 100 L 228 100" stroke="#6a9acc" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <path d="M 272 100 L 288 100" stroke="#6a9acc" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <path d="M 332 100 L 348 100" stroke="#6a9acc" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <path d="M 392 100 L 408 100" stroke="#6a9acc" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <path d="M 452 100 L 468 100" stroke="#6a9acc" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- 位置标签 f(n) -->
  <text x="70" y="148" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">f=0</text>
  <text x="130" y="148" text-anchor="middle" font-size="11" fill="#555">f=1</text>
  <text x="190" y="148" text-anchor="middle" font-size="11" fill="#555">f=2</text>
  <text x="250" y="148" text-anchor="middle" font-size="11" fill="#555">f=3</text>
  <text x="310" y="148" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">f=4</text>
  <text x="370" y="148" text-anchor="middle" font-size="11" fill="#555">f=5</text>
  <text x="430" y="148" text-anchor="middle" font-size="11" fill="#555">f=6</text>
  <text x="490" y="148" text-anchor="middle" font-size="11" fill="#555">f=7</text>

  <!-- 从 n=6 回退到 0 的红色路径标注 -->
  <path d="M 288 174 L 92 174" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrBack)" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="200" y="192" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">n=6 回退 4 步到 0 → f(6)=4</text>

  <!-- 说明 -->
  <rect x="40" y="208" width="460" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="270" y="228" text-anchor="middle" font-size="11.5" fill="#333">每个状态只翻转 1 位 = 题目定义的操作；序列正是反射 Gray 码</text>
  <text x="270" y="246" text-anchor="middle" font-size="11.5" fill="#333">n 在序列中的位置 = 把 n 归零的步数 = f(n)</text>

  <!-- 公式 -->
  <rect x="80" y="272" width="380" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="270" y="294" text-anchor="middle" font-size="13" fill="#a87020" font-weight="bold">f(n) = n ⊕ f(n &gt;&gt; 1)   （逆 Gray 码递推）</text>
  <text x="270" y="312" text-anchor="middle" font-size="11" fill="#555">等价：g=n; while n&gt;0: n&gt;&gt;=1; g^=n</text>
</svg>
