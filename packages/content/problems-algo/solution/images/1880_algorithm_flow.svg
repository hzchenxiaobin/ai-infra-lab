<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 510" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="510" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：Horner 求值 + 三数比较</text>

  <!-- ====== Left: wordValue helper ====== -->
  <text x="160" y="52" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">wordValue(s)  ——  Horner 法</text>

  <!-- N1: val = 0 -->
  <rect x="100" y="60" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="160" y="80" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">val = 0</text>
  <path d="M 160 90 L 160 106" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- N2: 取下一个 ch -->
  <rect x="100" y="106" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="160" y="126" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">取下一个 ch ∈ s</text>
  <path d="M 160 136 L 160 152" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- N3: diamond 还有字符? center (160,167) -->
  <polygon points="160,152 216,167 160,182 104,167" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="160" y="171" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">还有字符?</text>
  <!-- N3 No -> right: return val -->
  <path d="M 216 167 L 300 167" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="258" y="162" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="300" y="152" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="355" y="172" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return val</text>
  <!-- N3 Yes -> down -->
  <path d="M 160 182 L 160 208" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="174" y="200" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- N4: val = val*10 + (ch-'a') -->
  <rect x="70" y="208" width="180" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="160" y="230" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">val = val × 10 + (ch − 'a')</text>
  <!-- loop back to N2: right to x=300, up to y=121, left to N2 right (220,121) -->
  <path d="M 250 225 L 300 225 L 300 121 L 226 121" stroke="#666" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="306" y="180" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">循环</text>

  <!-- Divider between helper and main -->
  <path d="M 40 268 L 540 268" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ====== Right/Bottom: main flow ====== -->
  <text x="290" y="292" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">isSumEqual  ——  主流程</text>

  <!-- Three compute boxes side by side -->
  <rect x="40" y="304" width="150" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="115" y="326" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">v1 = wordValue(firstWord)</text>

  <rect x="215" y="304" width="150" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="290" y="326" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">v2 = wordValue(secondWord)</text>

  <rect x="390" y="304" width="150" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="465" y="326" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">vt = wordValue(targetWord)</text>

  <!-- arrows down converge -->
  <path d="M 115 338 L 115 356 L 290 356" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 465 338 L 465 356 L 290 356" stroke="#666" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 290 338 L 290 372" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: v1 + v2 == vt ? center (290, 387) -->
  <polygon points="290,372 372,387 290,402 208,387" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="391" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">v1 + v2 == vt ?</text>

  <!-- Yes -> left: return true -->
  <path d="M 208 387 L 130 387" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="170" y="382" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="20" y="372" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="75" y="392" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return true</text>

  <!-- No -> right: return false -->
  <path d="M 372 387 L 450 387" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="382" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="450" y="372" width="110" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="505" y="392" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">return false</text>

  <!-- Legend -->
  <path d="M 40 432 L 540 432" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="290" y="452" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">蓝=处理框  橙=判定/累加  绿=返回 true  红=返回 false  虚线=循环回边</text>
  <text x="290" y="472" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">Horner：val = val×10 + digit，一次遍历完成求值，无需拼接字符串</text>
</svg>
