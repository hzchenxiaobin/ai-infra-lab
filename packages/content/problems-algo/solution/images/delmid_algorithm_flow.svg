<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="720" height="540" fill="#fdfcf7"/>

  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b">算法流程：哑节点 + 快慢指针删中间节点</text>
  <path d="M 200 38 Q 360 46 520 38" stroke="#2b2b2b" stroke-width="1.4" fill="none" filter="url(#sk)"/>

  <!-- 1. 建哑节点 -->
  <g filter="url(#sk)"><rect x="250" y="58" width="220" height="44" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="360" y="84" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">① dummy.next = head；slow = dummy，fast = head</text>
  <path d="M 360 102 L 360 122" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 2. 判断 -->
  <g filter="url(#sk)"><path d="M 360 122 L 470 168 L 360 214 L 250 168 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="360" y="162" text-anchor="middle" font-size="12" fill="#8a6a20" font-weight="bold">fast &amp;&amp; fast.next</text>
  <text x="360" y="180" text-anchor="middle" font-size="11" fill="#8a6a20">都非空？</text>
  <text x="368" y="206" text-anchor="middle" font-size="10" fill="#888">（fast 未到尾且未越尾）</text>

  <!-- 否分支 -->
  <path d="M 250 168 L 170 168 L 170 320" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="178" y="160" font-size="11" fill="#b85450" font-weight="bold">否</text>

  <!-- 是分支 -->
  <path d="M 470 168 L 560 168 L 560 232" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="540" y="160" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- 3. 推进 -->
  <g filter="url(#sk)"><rect x="430" y="232" width="260" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="560" y="256" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">② slow = slow.next（+1）</text>
  <text x="560" y="276" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">fast = fast.next.next（+2）</text>
  <path d="M 560 294 L 560 320 L 470 320 L 470 168" stroke="#5a5a5a" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="500" y="312" font-size="10" fill="#888">回到判断</text>

  <!-- 4. 删除 -->
  <g filter="url(#sk)"><rect x="70" y="320" width="240" height="50" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="190" y="350" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">③ slow.next = slow.next.next</text>
  <path d="M 190 370 L 190 396" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- 5. 返回 -->
  <g filter="url(#sk)"><rect x="110" y="396" width="160" height="44" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="190" y="422" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">④ return dummy.next</text>

  <!-- 说明框 -->
  <g filter="url(#sk)"><rect x="350" y="396" width="340" height="120" rx="8" fill="#fff" stroke="#ddd" stroke-width="1.2"/></g>
  <text x="362" y="418" font-size="11" fill="#444" font-weight="bold">为什么 slow 起点是 dummy 而非 head？</text>
  <text x="362" y="438" font-size="10" fill="#666">876 找中点：slow=fast=head，fast 到尾时 slow 正好是中间节点。</text>
  <text x="362" y="456" font-size="10" fill="#666">本题要删中间节点，必须拿到它的前驱。</text>
  <text x="362" y="474" font-size="10" fill="#666">让 slow 从 dummy 起步 → 全程落后 876 的 slow 一步</text>
  <text x="362" y="492" font-size="10" fill="#666">→ fast 到尾时 slow 停在「中间节点的前驱」。</text>
  <text x="362" y="510" font-size="10" fill="#b85450" font-weight="bold">循环条件沿用 876 的 fast &amp;&amp; fast.next，无需改动。</text>
</svg>
