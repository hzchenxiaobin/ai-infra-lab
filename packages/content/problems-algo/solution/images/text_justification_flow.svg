<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 600" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="600" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">文本左右对齐：贪心收集 + 分情况填充空格流程</text>

  <!-- Start -->
  <ellipse cx="280" cy="56" rx="120" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="12" fill="#333">开始: i = 0, ans = []</text>
  <path d="M 280 76 L 280 90" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: i < n -->
  <polygon points="280,92 420,140 280,188 140,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="136" text-anchor="middle" font-size="12" fill="#333">i &lt; n ?</text>
  <text x="280" y="154" text-anchor="middle" font-size="10" fill="#888">还有单词？</text>

  <!-- No -> return -->
  <path d="M 420 140 L 489 140 L 489 156" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="442" y="132" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <rect x="430" y="158" width="118" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="489" y="176" text-anchor="middle" font-size="11" fill="#333">ans 已含全部行</text>
  <text x="489" y="192" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">返回 ans</text>

  <!-- Yes -> down -->
  <path d="M 280 188 L 280 212" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="204" font-size="11" fill="#82b366">是</text>

  <!-- Process: greedy collect -->
  <rect x="100" y="214" width="360" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="236" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">贪心收集本行单词</text>
  <text x="280" y="254" text-anchor="middle" font-size="10" fill="#666">j = i+1, lineLen = len(words[i])</text>
  <text x="280" y="270" text-anchor="middle" font-size="10" fill="#666">while lineLen + 1 + len(words[j]) ≤ maxWidth: 收入 j</text>

  <path d="M 280 282 L 280 298" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: last line or single word -->
  <polygon points="280,300 440,356 280,412 120,356" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="346" text-anchor="middle" font-size="11" fill="#333">j == n（末行）</text>
  <text x="280" y="364" text-anchor="middle" font-size="11" fill="#333">|| gaps == 0 ?</text>
  <text x="280" y="382" text-anchor="middle" font-size="10" fill="#888">gaps = j−i−1</text>

  <!-- Yes (left) -> left justify -->
  <path d="M 120 356 L 80 356 L 80 392" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="348" text-anchor="middle" font-size="11" fill="#82b366">是</text>
  <rect x="20" y="394" width="180" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="110" y="414" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">左对齐</text>
  <text x="110" y="432" text-anchor="middle" font-size="10" fill="#666">join(words[i..j], " ")</text>
  <text x="110" y="448" text-anchor="middle" font-size="10" fill="#666">+ " " × (maxWidth − len)</text>
  <text x="110" y="462" text-anchor="middle" font-size="9" fill="#888">单间隔 + 行末补满</text>

  <!-- No (right) -> two-end justify -->
  <path d="M 440 356 L 480 356 L 480 392" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="460" y="348" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <rect x="360" y="394" width="190" height="98" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="455" y="414" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">两端对齐</text>
  <text x="455" y="432" text-anchor="middle" font-size="10" fill="#666">spaces = maxWidth − Σlen</text>
  <text x="455" y="448" text-anchor="middle" font-size="10" fill="#666">base = spaces // gaps</text>
  <text x="455" y="464" text-anchor="middle" font-size="10" fill="#666">extra = spaces % gaps</text>
  <text x="455" y="480" text-anchor="middle" font-size="9" fill="#b85450">前 extra 个 gap 填 base+1</text>

  <!-- merge to ans.push -->
  <path d="M 110 468 L 110 520 L 270 520" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 455 492 L 455 520 L 290 520" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="180" y="510" width="200" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="528" text-anchor="middle" font-size="11" fill="#333">ans.push_back(line)</text>
  <text x="280" y="544" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i = j（下一行起点）</text>

  <!-- loop back to i<n -->
  <path d="M 280 550 L 280 568 L 40 568 L 40 140 L 140 140" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="30" y="356" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 30 356)">下一行</text>

  <!-- bottom note -->
  <rect x="120" y="572" width="320" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="280" y="587" text-anchor="middle" font-size="10" fill="#444">gaps==0 时 spaces//0 会除零，故合并到左对齐分支</text>
</svg>
