<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">排序后贪心：顶到 prev+1</text>

  <!-- Before sort -->
  <text x="30" y="52" font-size="12" fill="#888">排序前</text>
  <rect x="80" y="60" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="99" y="78" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="122" y="60" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="141" y="78" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="164" y="60" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="183" y="78" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="206" y="60" width="38" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="225" y="78" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="248" y="60" width="38" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="267" y="78" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="290" y="60" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="309" y="78" text-anchor="middle" font-size="11" fill="#333">7</text>

  <!-- Sort arrow -->
  <text x="350" y="78" font-size="11" fill="#888">→ 排序</text>
  <path d="M 388 73 L 410 73" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- After sort -->
  <text x="30" y="112" font-size="12" fill="#4a7a3a" font-weight="bold">排序后（重复相邻）</text>
  <rect x="80" y="120" width="38" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="99" y="138" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="122" y="120" width="38" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="141" y="138" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="164" y="120" width="38" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="183" y="138" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="206" y="120" width="38" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="225" y="138" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="248" y="120" width="38" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="267" y="138" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="290" y="120" width="38" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="309" y="138" text-anchor="middle" font-size="11" fill="#333">7</text>

  <!-- Greedy push arrows -->
  <text x="30" y="174" font-size="12" fill="#d6a040" font-weight="bold">贪心顶升（红色=需增量）</text>

  <!-- Result row -->
  <rect x="80" y="182" width="38" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="99" y="200" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="122" y="182" width="38" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="141" y="200" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="164" y="182" width="38" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="183" y="200" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="206" y="182" width="38" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="225" y="200" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <rect x="248" y="182" width="38" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="267" y="200" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <rect x="290" y="182" width="38" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="309" y="200" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7</text>

  <!-- Increment labels -->
  <text x="99" y="222" text-anchor="middle" font-size="10" fill="#4a7a3a">+0</text>
  <text x="141" y="222" text-anchor="middle" font-size="10" fill="#d6a040">+1</text>
  <text x="183" y="222" text-anchor="middle" font-size="10" fill="#d6a040">+1</text>
  <text x="225" y="222" text-anchor="middle" font-size="10" fill="#d6a040">+2</text>
  <text x="267" y="222" text-anchor="middle" font-size="10" fill="#d6a040">+2</text>
  <text x="309" y="222" text-anchor="middle" font-size="10" fill="#4a7a3a">+0</text>

  <!-- Push arrows from sorted to result -->
  <path d="M 141 148 L 141 178" stroke="#d6a040" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 183 148 L 183 178" stroke="#d6a040" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 225 148 L 225 178" stroke="#d6a040" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 267 148 L 267 178" stroke="#d6a040" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Formula box -->
  <rect x="40" y="240" width="440" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="262" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b_i = max(a_i, prev + 1) ， moves += b_i − a_i</text>
  <text x="260" y="278" text-anchor="middle" font-size="11" fill="#888">能小则小：只顶到刚好比前一个唯一值大 1</text>

  <!-- Summary -->
  <rect x="40" y="300" width="440" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="322" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">总增量 = 0+1+1+2+2+0 = 6</text>
  <text x="260" y="338" text-anchor="middle" font-size="11" fill="#888">排序让重复相邻，贪心递推形成 1,2,3,4,5 阶梯</text>
</svg>
