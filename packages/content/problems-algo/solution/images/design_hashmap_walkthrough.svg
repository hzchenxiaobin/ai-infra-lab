<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="860" height="470" fill="#fdfcf7"/>

  <text x="430" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">示例演算（BASE = 7）</text>
  <path d="M 290 42 Q 430 50 570 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- table header -->
  <g filter="url(#sk)">
    <rect x="40" y="64" width="780" height="34" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="120" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">操作</text>
  <text x="270" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">h(key)</text>
  <text x="430" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">命中?</text>
  <text x="640" y="86" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">桶内链表 / 结果</text>

  <!-- row 1: put(1,1) -->
  <g filter="url(#sk)"><rect x="40" y="100" width="780" height="34" fill="#eaf6ee" stroke="#cfe3cf" stroke-width="1"/></g>
  <text x="120" y="122" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">put(1, 1)</text>
  <text x="270" y="122" text-anchor="middle" font-size="12" fill="#444">1%7=1</text>
  <text x="430" y="122" text-anchor="middle" font-size="12" fill="#888">否</text>
  <text x="640" y="122" text-anchor="middle" font-size="12" fill="#2e6e2e">b[1]: 尾插 (1,1)</text>

  <!-- row 2: put(2,2) -->
  <g filter="url(#sk)"><rect x="40" y="136" width="780" height="34" fill="#eaf6ee" stroke="#cfe3cf" stroke-width="1"/></g>
  <text x="120" y="158" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">put(2, 2)</text>
  <text x="270" y="158" text-anchor="middle" font-size="12" fill="#444">2%7=2</text>
  <text x="430" y="158" text-anchor="middle" font-size="12" fill="#888">否</text>
  <text x="640" y="158" text-anchor="middle" font-size="12" fill="#2e6e2e">b[2]: 尾插 (2,2)</text>

  <!-- row 3: get(1) -->
  <g filter="url(#sk)"><rect x="40" y="172" width="780" height="34" fill="#fff8e1" stroke="#f0e0b0" stroke-width="1"/></g>
  <text x="120" y="194" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">get(1)</text>
  <text x="270" y="194" text-anchor="middle" font-size="12" fill="#444">1%7=1</text>
  <text x="430" y="194" text-anchor="middle" font-size="12" fill="#2e6e2e">是</text>
  <text x="640" y="194" text-anchor="middle" font-size="12" fill="#7a5415">b[1] 找到 → 返回 1</text>

  <!-- row 4: get(3) -->
  <g filter="url(#sk)"><rect x="40" y="208" width="780" height="34" fill="#fff8e1" stroke="#f0e0b0" stroke-width="1"/></g>
  <text x="120" y="230" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">get(3)</text>
  <text x="270" y="230" text-anchor="middle" font-size="12" fill="#444">3%7=3</text>
  <text x="430" y="230" text-anchor="middle" font-size="12" fill="#b85450">否</text>
  <text x="640" y="230" text-anchor="middle" font-size="12" fill="#b85450">b[3] 为空 → 返回 -1</text>

  <!-- row 5: put(2,1) update -->
  <g filter="url(#sk)"><rect x="40" y="244" width="780" height="34" fill="#eaf6ee" stroke="#cfe3cf" stroke-width="1"/></g>
  <text x="120" y="266" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">put(2, 1)</text>
  <text x="270" y="266" text-anchor="middle" font-size="12" fill="#444">2%7=2</text>
  <text x="430" y="266" text-anchor="middle" font-size="12" fill="#2e6e2e">是</text>
  <text x="640" y="266" text-anchor="middle" font-size="12" fill="#2e6e2e">b[2] 命中 → 改 v 为 1</text>

  <!-- row 6: get(2) -->
  <g filter="url(#sk)"><rect x="40" y="280" width="780" height="34" fill="#fff8e1" stroke="#f0e0b0" stroke-width="1"/></g>
  <text x="120" y="302" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">get(2)</text>
  <text x="270" y="302" text-anchor="middle" font-size="12" fill="#444">2%7=2</text>
  <text x="430" y="302" text-anchor="middle" font-size="12" fill="#2e6e2e">是</text>
  <text x="640" y="302" text-anchor="middle" font-size="12" fill="#7a5415">b[2] 找到 → 返回 1</text>

  <!-- row 7: remove(2) -->
  <g filter="url(#sk)"><rect x="40" y="316" width="780" height="34" fill="#fce4ec" stroke="#f0c0cc" stroke-width="1"/></g>
  <text x="120" y="338" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">remove(2)</text>
  <text x="270" y="338" text-anchor="middle" font-size="12" fill="#444">2%7=2</text>
  <text x="430" y="338" text-anchor="middle" font-size="12" fill="#2e6e2e">是</text>
  <text x="640" y="338" text-anchor="middle" font-size="12" fill="#b85450">b[2] 摘除 → 空链表</text>

  <!-- row 8: get(2) -->
  <g filter="url(#sk)"><rect x="40" y="352" width="780" height="34" fill="#fff8e1" stroke="#f0e0b0" stroke-width="1"/></g>
  <text x="120" y="374" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">get(2)</text>
  <text x="270" y="374" text-anchor="middle" font-size="12" fill="#444">2%7=2</text>
  <text x="430" y="374" text-anchor="middle" font-size="12" fill="#b85450">否</text>
  <text x="640" y="374" text-anchor="middle" font-size="12" fill="#b85450">b[2] 已删 → 返回 -1</text>

  <!-- note -->
  <g filter="url(#sk)">
    <rect x="40" y="406" width="780" height="46" rx="10" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/>
  </g>
  <text x="60" y="430" font-size="12" fill="#444"><tspan font-weight="bold" fill="#2e6e2e">规律：</tspan>同一 key 永远落到同一桶 b = key%7，故 put/get/remove 只需在该桶内处理。</text>
  <text x="60" y="446" font-size="11" fill="#888">⚠️ put 已存在时是「改值」而非新增；remove 不存在的 key 静默返回。</text>
</svg>
