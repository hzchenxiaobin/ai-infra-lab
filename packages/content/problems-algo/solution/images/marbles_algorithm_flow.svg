<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：构造 p → 排序 → 取末 k−1 与首 k−1 之和 → 求差</text>

  <!-- Step 1: construct p -->
  <rect x="40" y="56" width="200" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="80" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 构造配对数组</text>
  <text x="140" y="100" text-anchor="middle" font-size="10" fill="#555">p[i]=w[i]+w[i+1], i=0..n−2</text>

  <path d="M 240 85 L 270 85" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 2: sort -->
  <rect x="270" y="56" width="160" height="58" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="350" y="80" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 排序 p（升序）</text>
  <text x="350" y="100" text-anchor="middle" font-size="10" fill="#555">O(n log n)</text>

  <path d="M 430 85 L 460 85" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 3: branch to min/max -->
  <rect x="460" y="56" width="120" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="520" y="80" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 取首末</text>
  <text x="520" y="100" text-anchor="middle" font-size="10" fill="#555">各 k−1 个之和</text>

  <!-- p sorted bar -->
  <text x="40" y="150" font-size="11" fill="#4a7a3a" font-weight="bold">排序后 p：</text>
  <g font-size="12">
    <rect x="120" y="138" width="36" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="138" y="156" text-anchor="middle" fill="#333">4</text>
    <rect x="156" y="138" width="36" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="174" y="156" text-anchor="middle" fill="#333">6</text>
    <rect x="192" y="138" width="36" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="210" y="156" text-anchor="middle" fill="#333">8</text>
  </g>

  <!-- min bracket left -->
  <path d="M 120 176 Q 120 186 138 186" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="138" y="200" text-anchor="middle" font-size="9" fill="#446688">最小 k−1=1 个</text>
  <text x="138" y="212" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">minSum=4</text>

  <!-- max bracket right -->
  <path d="M 228 176 Q 228 186 210 186" stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="210" y="228" text-anchor="middle" font-size="9" fill="#b85450">最大 k−1=1 个</text>
  <text x="210" y="240" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">maxSum=8</text>

  <!-- subtract box -->
  <rect x="200" y="262" width="200" height="50" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="285" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">④ 返回 maxSum − minSum</text>
  <text x="300" y="303" text-anchor="middle" font-size="11" fill="#555">8 − 4 = 4</text>

  <!-- arrows down to subtract -->
  <path d="M 138 218 Q 138 240 230 262" stroke="#446688" stroke-width="1.3" stroke-dasharray="3 2" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>
  <path d="M 210 246 Q 210 255 250 262" stroke="#b85450" stroke-width="1.3" stroke-dasharray="3 2" fill="none" filter="url(#rough2)" marker-end="url(#arr)"/>

  <!-- edge note -->
  <rect x="40" y="330" width="540" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="60" y="352" font-size="11" fill="#555">边界：k=1 ⇒ 0 个切点，max=min，返回 0；k=n ⇒ n−1 个切点全取，max=min，返回 0</text>
  <text x="60" y="372" font-size="11" fill="#555">weights[i] ≤ 10⁹，p_i ≤ 2×10⁹，累加和需 long long（C++ 必须转 64 位）</text>
</svg>
