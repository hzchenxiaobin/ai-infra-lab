<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">示例 2 演算：n=7, edges=[[0,2],[0,5],[2,4],[1,6],[5,4]]</text>

  <!-- Left: union-find merge table -->
  <text x="30" y="50" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">并查集逐边合并（按规模）</text>

  <!-- Table header -->
  <rect x="30" y="58" width="250" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="55" y="73" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">边</text>
  <text x="115" y="73" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">find(u),find(v)</text>
  <text x="210" y="73" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">size 变化</text>

  <!-- Row 1: (0,2) -->
  <rect x="30" y="80" width="250" height="22" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="55" y="95" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">(0,2)</text>
  <text x="115" y="95" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0, 2</text>
  <text x="210" y="95" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">size[0]=1→2</text>

  <!-- Row 2: (0,5) -->
  <rect x="30" y="102" width="250" height="22" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="55" y="117" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">(0,5)</text>
  <text x="115" y="117" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0, 5</text>
  <text x="210" y="117" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">size[0]=2→3</text>

  <!-- Row 3: (2,4) -->
  <rect x="30" y="124" width="250" height="22" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="55" y="139" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">(2,4)</text>
  <text x="115" y="139" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">0, 4</text>
  <text x="210" y="139" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">size[0]=3→4</text>

  <!-- Row 4: (1,6) -->
  <rect x="30" y="146" width="250" height="22" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="55" y="161" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">(1,6)</text>
  <text x="115" y="161" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1, 6</text>
  <text x="210" y="161" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">size[1]=1→2</text>

  <!-- Row 5: (5,4) -->
  <rect x="30" y="168" width="250" height="22" fill="#fff" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="55" y="183" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">(5,4)</text>
  <text x="115" y="183" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">0, 0（同根）</text>
  <text x="210" y="183" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">跳过</text>

  <!-- Arrow to components -->
  <line x1="155" y1="194" x2="155" y2="214" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Result: three components -->
  <text x="30" y="232" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">最终三个连通分量</text>
  <rect x="30" y="240" width="80" height="46" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="258" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">A</text>
  <text x="70" y="274" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">{0,2,4,5} s=4</text>
  <rect x="115" y="240" width="80" height="46" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="155" y="258" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">B</text>
  <text x="155" y="274" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">{1,6} s=2</text>
  <rect x="200" y="240" width="80" height="46" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240" y="258" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">C</text>
  <text x="240" y="274" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">{3} s=1</text>

  <!-- Right side: prefix accumulation -->
  <text x="320" y="50" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">前缀累加求跨分量点对数</text>

  <!-- Table header -->
  <rect x="320" y="58" width="200" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="345" y="73" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">分量</text>
  <text x="380" y="73" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">s</text>
  <text x="430" y="73" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">seen</text>
  <text x="490" y="73" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">贡献</text>

  <!-- Row A -->
  <rect x="320" y="80" width="200" height="22" fill="#fff" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="345" y="95" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">A</text>
  <text x="380" y="95" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4</text>
  <text x="430" y="95" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">0</text>
  <text x="490" y="95" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">4×0=0</text>

  <!-- Row B -->
  <rect x="320" y="102" width="200" height="22" fill="#fafafa" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="345" y="117" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">B</text>
  <text x="380" y="117" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="430" y="117" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">4</text>
  <text x="490" y="117" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">2×4=8</text>

  <!-- Row C -->
  <rect x="320" y="124" width="200" height="22" fill="#fff" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="345" y="139" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">C</text>
  <text x="380" y="139" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1</text>
  <text x="430" y="139" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">6</text>
  <text x="490" y="139" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">1×6=6</text>

  <!-- Sum -->
  <rect x="320" y="146" width="200" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="345" y="164" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans</text>
  <text x="460" y="164" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">= 0+8+6 = 14</text>

  <!-- Verification box -->
  <rect x="320" y="190" width="200" height="96" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="420" y="212" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">代数法验证</text>
  <text x="330" y="232" font-size="11" fill="#333" filter="url(#rough2)">n² = 7² = 49</text>
  <text x="330" y="250" font-size="11" fill="#333" filter="url(#rough2)">Σsᵢ² = 4²+2²+1² = 21</text>
  <text x="330" y="270" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">(49 − 21) / 2 = 14 ✓</text>

  <!-- Bottom note -->
  <rect x="30" y="310" width="490" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="50" y="332" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">为什么 (5,4) 跳过？</text>
  <text x="50" y="350" font-size="11" fill="#333" filter="url(#rough2)">5 和 4 在前面三轮已并入根 0，find(5)=find(4)=0，同根即已在同一分量，再 union 无意义。</text>
  <text x="50" y="400" font-size="11" fill="#666" filter="url(#rough2)">遍历顺序不影响结果：前缀累加对求和满足交换性，A/B/C 任意顺序都得到 14。</text>
</svg>
