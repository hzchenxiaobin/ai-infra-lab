<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：按 (viewer_id, view_date) 分组，数不同文章数</text>

  <!-- Table header -->
  <g filter="url(#rough2)">
    <rect x="40" y="60" width="160" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <rect x="200" y="60" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <rect x="310" y="60" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <rect x="420" y="60" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
  </g>
  <g font-size="10" fill="#446688" filter="url(#rough2)">
    <text x="120" y="77" text-anchor="middle">分组 (viewer, date)</text>
    <text x="255" y="77" text-anchor="middle">不同 article_id</text>
    <text x="365" y="77" text-anchor="middle">COUNT(DISTINCT)</text>
    <text x="455" y="77" text-anchor="middle">&gt; 1 ?</text>
  </g>

  <!-- Row 1: viewer5@08-01 {1,3} 2 ✓ -->
  <g filter="url(#rough2)">
    <rect x="40" y="86" width="160" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3"/>
    <rect x="200" y="86" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3"/>
    <rect x="310" y="86" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3"/>
    <rect x="420" y="86" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
  </g>
  <g font-size="11" fill="#333" filter="url(#rough2)">
    <text x="120" y="105" text-anchor="middle">viewer 5 @ 08-01</text>
    <text x="255" y="105" text-anchor="middle">{ 1, 3 }</text>
    <text x="365" y="105" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="455" y="105" text-anchor="middle" fill="#4a7a3a" font-weight="bold">✓</text>
  </g>

  <!-- Row 2: viewer6@08-02 {1,2} 2 ✓ -->
  <g filter="url(#rough2)">
    <rect x="40" y="116" width="160" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3"/>
    <rect x="200" y="116" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3"/>
    <rect x="310" y="116" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3"/>
    <rect x="420" y="116" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/>
  </g>
  <g font-size="11" fill="#333" filter="url(#rough2)">
    <text x="120" y="135" text-anchor="middle">viewer 6 @ 08-02</text>
    <text x="255" y="135" text-anchor="middle">{ 1, 2 }</text>
    <text x="365" y="135" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="455" y="135" text-anchor="middle" fill="#4a7a3a" font-weight="bold">✓</text>
  </g>

  <!-- Row 3: viewer7@08-01 {2} 1 ✗ -->
  <g filter="url(#rough2)">
    <rect x="40" y="146" width="160" height="30" fill="#f5f5f5" stroke="#888" stroke-width="0.8" rx="3"/>
    <rect x="200" y="146" width="110" height="30" fill="#f5f5f5" stroke="#888" stroke-width="0.8" rx="3"/>
    <rect x="310" y="146" width="110" height="30" fill="#f5f5f5" stroke="#888" stroke-width="0.8" rx="3"/>
    <rect x="420" y="146" width="70" height="30" fill="#f5f5f5" stroke="#888" stroke-width="0.8" rx="3"/>
  </g>
  <g font-size="11" fill="#888" filter="url(#rough2)">
    <text x="120" y="165" text-anchor="middle">viewer 7 @ 08-01</text>
    <text x="255" y="165" text-anchor="middle">{ 2 }</text>
    <text x="365" y="165" text-anchor="middle">1</text>
    <text x="455" y="165" text-anchor="middle" fill="#b85450">✗</text>
  </g>

  <!-- Row 4: viewer1@07-22 {4} 1 ✗ -->
  <g filter="url(#rough2)">
    <rect x="40" y="176" width="160" height="30" fill="#f5f5f5" stroke="#888" stroke-width="0.8" rx="3"/>
    <rect x="200" y="176" width="110" height="30" fill="#f5f5f5" stroke="#888" stroke-width="0.8" rx="3"/>
    <rect x="310" y="176" width="110" height="30" fill="#f5f5f5" stroke="#888" stroke-width="0.8" rx="3"/>
    <rect x="420" y="176" width="70" height="30" fill="#f5f5f5" stroke="#888" stroke-width="0.8" rx="3"/>
  </g>
  <g font-size="11" fill="#888" filter="url(#rough2)">
    <text x="120" y="195" text-anchor="middle">viewer 1 @ 07-22</text>
    <text x="255" y="195" text-anchor="middle">{ 4 }</text>
    <text x="365" y="195" text-anchor="middle">1</text>
    <text x="455" y="195" text-anchor="middle" fill="#b85450">✗</text>
  </g>

  <!-- Row 5: viewer4@07-21 {3} 1 ✗ (2 rows dup) -->
  <g filter="url(#rough2)">
    <rect x="40" y="206" width="160" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3"/>
    <rect x="200" y="206" width="110" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3"/>
    <rect x="310" y="206" width="110" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3"/>
    <rect x="420" y="206" width="70" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3"/>
  </g>
  <g font-size="11" fill="#8a6a20" filter="url(#rough2)">
    <text x="120" y="225" text-anchor="middle">viewer 4 @ 07-21</text>
    <text x="255" y="225" text-anchor="middle">{ 3 }</text>
    <text x="365" y="225" text-anchor="middle">1</text>
    <text x="455" y="225" text-anchor="middle" fill="#b85450">✗</text>
  </g>
  <!-- annotation for viewer4 duplicate -->
  <text x="495" y="222" font-size="8" fill="#d6a040" filter="url(#rough2)">⚠ 2 行</text>
  <text x="495" y="232" font-size="8" fill="#d6a040" filter="url(#rough2)">同文章</text>

  <!-- Rule box -->
  <rect x="40" y="256" width="450" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="265" y="278" text-anchor="middle" font-size="12" fill="#3a5a2a" filter="url(#rough2)">HAVING COUNT(DISTINCT article_id) &gt; 1</text>

  <!-- arrow to result -->
  <path d="M 265 290 L 265 304" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Result box -->
  <rect x="120" y="306" width="290" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="265" y="324" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">入选分组的 viewer_id → 去重升序</text>
  <text x="265" y="342" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold" filter="url(#rough2)">id = [5, 6]</text>

  <!-- bottom note -->
  <rect x="40" y="356" width="500" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="290" y="372" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">关键：「浏览多于一篇」= 不同 article_id 数 &gt; 1，须用 COUNT(DISTINCT)</text>
  <text x="290" y="385" text-anchor="middle" font-size="10" fill="#8a6a20" filter="url(#rough2)">viewer 4 有两行但同属文章 3 → 去重后仅 1 篇，不入选</text>
</svg>
