<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：异位词 ⟺ 频次多重集相同</text>

  <!-- ====== Two strings ====== -->
  <text x="20" y="68" font-size="12" fill="#888">s =</text>
  <g font-size="13">
    <rect x="56" y="52" width="28" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="70" y="72" text-anchor="middle" fill="#333">a</text>
    <rect x="86" y="52" width="28" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="100" y="72" text-anchor="middle" fill="#333">n</text>
    <rect x="116" y="52" width="28" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="130" y="72" text-anchor="middle" fill="#333">a</text>
    <rect x="146" y="52" width="28" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="160" y="72" text-anchor="middle" fill="#333">g</text>
    <rect x="176" y="52" width="28" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="190" y="72" text-anchor="middle" fill="#333">r</text>
    <rect x="206" y="52" width="28" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="220" y="72" text-anchor="middle" fill="#333">a</text>
    <rect x="236" y="52" width="28" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="250" y="72" text-anchor="middle" fill="#333">m</text>
  </g>

  <text x="20" y="112" font-size="12" fill="#888">t =</text>
  <g font-size="13">
    <rect x="56" y="96" width="28" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="70" y="116" text-anchor="middle" fill="#333">n</text>
    <rect x="86" y="96" width="28" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="100" y="116" text-anchor="middle" fill="#333">a</text>
    <rect x="116" y="96" width="28" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="130" y="116" text-anchor="middle" fill="#333">g</text>
    <rect x="146" y="96" width="28" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="160" y="116" text-anchor="middle" fill="#333">a</text>
    <rect x="176" y="96" width="28" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="190" y="116" text-anchor="middle" fill="#333">r</text>
    <rect x="206" y="96" width="28" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="220" y="116" text-anchor="middle" fill="#333">a</text>
    <rect x="236" y="96" width="28" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="250" y="116" text-anchor="middle" fill="#333">m</text>
  </g>

  <text x="300" y="84" font-size="11" fill="#888">顺序不同，但</text>
  <text x="300" y="100" font-size="11" fill="#4a7a3a" font-weight="bold">字母多重集相同</text>

  <!-- ====== Arrow down to frequency table ====== -->
  <path d="M 140 138 L 140 158" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="160" y="152" font-size="10" fill="#888">统计频次</text>

  <!-- ====== Frequency table ====== -->
  <text x="20" y="180" font-size="11" fill="#446688" font-weight="bold">频次表 cnt[26]（只列涉及字母）</text>

  <g font-size="12">
    <!-- header letters -->
    <rect x="56" y="190" width="44" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="78" y="207" text-anchor="middle" font-size="11" fill="#888">a</text>
    <rect x="104" y="190" width="44" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="126" y="207" text-anchor="middle" font-size="11" fill="#888">g</text>
    <rect x="152" y="190" width="44" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="174" y="207" text-anchor="middle" font-size="11" fill="#888">m</text>
    <rect x="200" y="190" width="44" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="222" y="207" text-anchor="middle" font-size="11" fill="#888">n</text>
    <rect x="248" y="190" width="44" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
    <text x="270" y="207" text-anchor="middle" font-size="11" fill="#888">r</text>

    <!-- s counts row -->
    <text x="40" y="235" text-anchor="end" font-size="10" fill="#446688">扫 s：</text>
    <rect x="56" y="220" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="78" y="237" text-anchor="middle" fill="#333">3</text>
    <rect x="104" y="220" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="126" y="237" text-anchor="middle" fill="#333">1</text>
    <rect x="152" y="220" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="174" y="237" text-anchor="middle" fill="#333">1</text>
    <rect x="200" y="220" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="222" y="237" text-anchor="middle" fill="#333">1</text>
    <rect x="248" y="220" width="44" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="270" y="237" text-anchor="middle" fill="#333">1</text>

    <!-- t decrement row -->
    <text x="40" y="263" text-anchor="end" font-size="10" fill="#b85450">扫 t：</text>
    <rect x="56" y="248" width="44" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="78" y="265" text-anchor="middle" fill="#333">−3</text>
    <rect x="104" y="248" width="44" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="126" y="265" text-anchor="middle" fill="#333">−1</text>
    <rect x="152" y="248" width="44" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="174" y="265" text-anchor="middle" fill="#333">−1</text>
    <rect x="200" y="248" width="44" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="222" y="265" text-anchor="middle" fill="#333">−1</text>
    <rect x="248" y="248" width="44" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="270" y="265" text-anchor="middle" fill="#333">−1</text>

    <!-- final zero row -->
    <text x="40" y="291" text-anchor="end" font-size="10" fill="#4a7a3a" font-weight="bold">归零：</text>
    <rect x="56" y="276" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="78" y="293" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <rect x="104" y="276" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="126" y="293" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <rect x="152" y="276" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="174" y="293" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <rect x="200" y="276" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="222" y="293" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <rect x="248" y="276" width="44" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="270" y="293" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
  </g>

  <!-- ====== Key insight box ====== -->
  <rect x="320" y="190" width="200" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="420" y="212" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">s 计数 +1，t 抵消 −1</text>
  <text x="420" y="232" text-anchor="middle" font-size="10.5" fill="#555">共用一张表</text>
  <text x="420" y="248" text-anchor="middle" font-size="10.5" fill="#555">把「比对」融入「计数」</text>
  <text x="420" y="268" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">全归零 ⟺ 异位词</text>

  <!-- ====== Conclusion ====== -->
  <path d="M 296 288 L 314 288" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="320" y="290" width="200" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="420" y="310" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">cnt 全为 0 → true ✓</text>
  <text x="420" y="326" text-anchor="middle" font-size="10" fill="#555">任一格非零 → false ✗</text>

  <rect x="20" y="320" width="280" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="160" y="340" text-anchor="middle" font-size="10.5" fill="#446688">26 字母定长数组 → O(n) 时间 / O(1) 空间</text>
</svg>
