<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L8,0 L4,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrDo" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L8,0 L4,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">挡板方向与逐行转移规则</text>

  <text x="40" y="58" font-size="12" fill="#444" font-weight="bold">挡板方向：</text>

  <rect x="120" y="44" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="120" y1="44" x2="164" y2="88" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="125" y="58" font-size="9" fill="#446688">1</text>
  <path d="M 164 88 L 188 88" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="142" y="108" text-anchor="middle" font-size="11" fill="#446688">"\" 球向右</text>

  <rect x="290" y="44" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="334" y1="44" x2="290" y2="88" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="295" y="58" font-size="9" fill="#b85450">-1</text>
  <path d="M 290 88 L 266 88" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="312" y="108" text-anchor="middle" font-size="11" fill="#b85450">"/" 球向左</text>

  <line x1="30" y1="122" x2="490" y2="122" stroke="#bbb" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <text x="40" y="144" font-size="12" fill="#444" font-weight="bold">逐行转移：在 (r, col)，next_col = col + grid[r][col]</text>

  <text x="40" y="174" font-size="12" fill="#4a7a3a" font-weight="bold">① 通畅：同向相邻 → 下落到 next_col</text>
  <rect x="70" y="186" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="70" y1="186" x2="120" y2="236" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="77" y="200" font-size="9" fill="#446688">1</text>
  <rect x="120" y="186" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="120" y1="186" x2="170" y2="236" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="127" y="200" font-size="9" fill="#446688">1</text>
  <path d="M 95 168 L 95 186" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 95 236 L 145 236" stroke="#4a7a3a" stroke-width="2" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 145 236 L 145 262" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="95" y="278" text-anchor="middle" font-size="10" fill="#4a7a3a">col j</text>
  <text x="145" y="278" text-anchor="middle" font-size="10" fill="#4a7a3a">col j+1</text>

  <text x="220" y="174" font-size="12" fill="#b85450" font-weight="bold">② V形卡住：异向相邻</text>
  <rect x="250" y="186" width="50" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="250" y1="186" x2="300" y2="236" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="257" y="200" font-size="9" fill="#b85450">1</text>
  <rect x="300" y="186" width="50" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="350" y1="186" x2="300" y2="236" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="307" y="200" font-size="9" fill="#b85450">-1</text>
  <path d="M 275 168 L 275 186" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <circle cx="300" cy="236" r="6" fill="#b85450" filter="url(#rough2)"/>
  <text x="300" y="278" text-anchor="middle" font-size="10" fill="#b85450">相向成V</text>

  <text x="395" y="174" font-size="12" fill="#d6a040" font-weight="bold">③ 撞边墙：越界</text>
  <line x1="418" y1="176" x2="418" y2="248" stroke="#888" stroke-width="3" filter="url(#rough2)"/>
  <rect x="424" y="186" width="50" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="474" y1="186" x2="424" y2="236" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="431" y="200" font-size="9" fill="#d6a040">-1</text>
  <path d="M 449 168 L 449 186" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrDo)" filter="url(#rough2)"/>
  <path d="M 449 236 L 428 236" stroke="#d6a040" stroke-width="2" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="449" y="278" text-anchor="middle" font-size="10" fill="#d6a040">导向列-1</text>

  <rect x="30" y="300" width="460" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="48" y="324" font-size="12" fill="#444" font-weight="bold">每行判定（O(1)）：</text>
  <text x="48" y="346" font-size="11" fill="#444">d = grid[r][col]；next_col = col + d</text>
  <text x="48" y="364" font-size="11" fill="#b85450">若 next_col 越界  或  grid[r][next_col] ≠ d → 卡住，返回 -1</text>
  <text x="48" y="380" font-size="11" fill="#4a7a3a">否则 col ← next_col 进入下一行；走完所有行返回 col</text>
</svg>
