<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：两端同字符时，整段连续同字符一并删除</text>

  <!-- string label -->
  <text x="56" y="74" font-size="12" fill="#888" filter="url(#rough2)">s = "aabccabba"（n = 9）</text>

  <!-- 9 cells: left run a,a (blue), middle b,c,c,a (neutral), right run a (green) -->
  <g font-size="14" fill="#333" text-anchor="middle">
    <rect x="88" y="66" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="110" y="90" filter="url(#rough2)">a</text>
    <rect x="132" y="66" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="154" y="90" filter="url(#rough2)">a</text>
    <rect x="176" y="66" width="44" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="198" y="90" filter="url(#rough2)">b</text>
    <rect x="220" y="66" width="44" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="242" y="90" filter="url(#rough2)">c</text>
    <rect x="264" y="66" width="44" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="286" y="90" filter="url(#rough2)">c</text>
    <rect x="308" y="66" width="44" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="330" y="90" filter="url(#rough2)">a</text>
    <rect x="352" y="66" width="44" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="374" y="90" filter="url(#rough2)">b</text>
    <rect x="396" y="66" width="44" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="418" y="90" filter="url(#rough2)">b</text>
    <rect x="440" y="66" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
    <text x="462" y="90" filter="url(#rough2)">a</text>
  </g>

  <!-- pointer labels l and r -->
  <text x="121" y="120" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">↑ l</text>
  <text x="462" y="120" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">↑ r</text>

  <!-- brackets spanning left run and right run -->
  <path d="M 88 112 L 88 108 L 176 108 L 176 112" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="132" y="100" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">左段 "aa"</text>
  <path d="M 484 112 L 484 108 L 440 108 L 440 112" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="462" y="100" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">右段 "a"</text>

  <!-- both ends are 'a' note -->
  <rect x="160" y="134" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="156" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">s[l] == s[r] == <tspan fill="#b85450" font-weight="bold">'a'</tspan> → 整段删左 + 整段删右</text>

  <!-- down arrow -->
  <path d="M 280 172 L 280 190" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- resulting string bccabb (6 cells) -->
  <text x="56" y="216" font-size="12" fill="#888" filter="url(#rough2)">删除后：</text>
  <g font-size="14" fill="#333" text-anchor="middle">
    <rect x="132" y="204" width="44" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="154" y="228" filter="url(#rough2)">b</text>
    <rect x="176" y="204" width="44" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="198" y="228" filter="url(#rough2)">c</text>
    <rect x="220" y="204" width="44" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="242" y="228" filter="url(#rough2)">c</text>
    <rect x="264" y="204" width="44" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="286" y="228" filter="url(#rough2)">a</text>
    <rect x="308" y="204" width="44" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="330" y="228" filter="url(#rough2)">b</text>
    <rect x="352" y="204" width="44" height="36" fill="#f5f5f5" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="374" y="228" filter="url(#rough2)">b</text>
  </g>
  <text x="412" y="228" font-size="12" fill="#888" filter="url(#rough2)">= "bccabb"</text>

  <!-- new pointers -->
  <text x="154" y="258" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">↑ l</text>
  <text x="374" y="258" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">↑ r</text>

  <!-- key insight -->
  <path d="M 40 278 L 520 278" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="56" y="300" font-size="11.5" fill="#555" filter="url(#rough2)">• 只有 <tspan fill="#446688" font-weight="bold">s[l] == s[r]</tspan> 才能删；不同则停（内部够不着）</text>
  <text x="56" y="318" font-size="11.5" fill="#555" filter="url(#rough2)">• 同字符则 <tspan fill="#b85450" font-weight="bold">整段删</tspan> 左右两段连续同字符，指针单调收拢、无回溯</text>
</svg>
