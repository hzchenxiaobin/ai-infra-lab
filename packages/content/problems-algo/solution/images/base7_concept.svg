<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="470" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：除 7 取余抠位 + 符号单独处理</text>

  <!-- ===== Row 1: positive num = 100 ===== -->
  <text x="40" y="62" font-size="12" fill="#446688" font-weight="bold">正数 num = 100</text>

  <!-- step boxes: 100 --%7--> 2, /7--> 14 --%7--> 0, /7--> 2 --%7--> 2, /7--> 0 -->
  <!-- n boxes (top row) -->
  <rect x="60"  y="72" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="88"  y="91" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">100</text>
  <rect x="180" y="72" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="208" y="91" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">14</text>
  <rect x="300" y="72" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="328" y="91" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">2</text>
  <rect x="420" y="72" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="448" y="91" text-anchor="middle" font-size="12.5" fill="#888" font-weight="bold">0</text>

  <!-- /7 arrows between n boxes -->
  <path d="M 116 86 L 180 86" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="148" y="80" text-anchor="middle" font-size="9.5" fill="#888">/7</text>
  <path d="M 236 86 L 300 86" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="80" text-anchor="middle" font-size="9.5" fill="#888">/7</text>
  <path d="M 356 86 L 420 86" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="388" y="80" text-anchor="middle" font-size="9.5" fill="#888">/7</text>

  <!-- %7 remainder boxes (bottom row), highlighted orange -->
  <rect x="60"  y="110" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="88"  y="129" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">2</text>
  <rect x="180" y="110" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="208" y="129" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">0</text>
  <rect x="300" y="110" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="328" y="129" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">2</text>

  <!-- %7 labels -->
  <text x="88"  y="108" text-anchor="middle" font-size="9" fill="#d6a040">%7</text>
  <text x="208" y="108" text-anchor="middle" font-size="9" fill="#d6a040">%7</text>
  <text x="328" y="108" text-anchor="middle" font-size="9" fill="#d6a040">%7</text>

  <!-- produce sequence + reverse -->
  <path d="M 328 142 L 328 156" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="190" y="158" width="200" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="290" y="176" text-anchor="middle" font-size="11" fill="#555">产出 [2,0,2] → 反转 → "202" ✓</text>

  <!-- ===== arrow down to row 2 ===== -->
  <path d="M 290 190 L 290 204" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Row 2: negative num = -7 ===== -->
  <text x="40" y="226" font-size="12" fill="#b85450" font-weight="bold">负数 num = -7</text>

  <!-- sign extraction box -->
  <rect x="60" y="214" width="120" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="120" y="233" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">符号 '-' 记下</text>
  <path d="M 180 228 L 220 228" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="222" text-anchor="middle" font-size="9.5" fill="#888">abs</text>

  <!-- n boxes: 7 -> 1 -> 0 -->
  <rect x="220" y="214" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="248" y="233" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">7</text>
  <rect x="340" y="214" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="368" y="233" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">1</text>
  <rect x="460" y="214" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="488" y="233" text-anchor="middle" font-size="12.5" fill="#888" font-weight="bold">0</text>

  <path d="M 276 228 L 340 228" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="308" y="222" text-anchor="middle" font-size="9.5" fill="#888">/7</text>
  <path d="M 396 228 L 460 228" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="428" y="222" text-anchor="middle" font-size="9.5" fill="#888">/7</text>

  <!-- remainders -->
  <rect x="220" y="252" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="248" y="271" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">0</text>
  <rect x="340" y="252" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="368" y="271" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">1</text>
  <text x="248" y="250" text-anchor="middle" font-size="9" fill="#d6a040">%7</text>
  <text x="368" y="250" text-anchor="middle" font-size="9" fill="#d6a040">%7</text>

  <!-- append '-' then reverse -->
  <path d="M 368 284 L 368 298" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="180" y="300" width="280" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="320" y="318" text-anchor="middle" font-size="11" fill="#555">产出 [0,1] → 追加 '-' → 反转 → "-10" ✓</text>

  <!-- ===== formula box ===== -->
  <rect x="40" y="346" width="500" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="368" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">每轮：d = n % 7 → '0'+d；n /= 7；直到 n == 0；负数末尾补 '-'；反转</text>

  <!-- ===== key insight notes ===== -->
  <rect x="40" y="398" width="240" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="160" y="418" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">7 非 2 幂 → 算术 % 7 / 7</text>
  <text x="160" y="436" text-anchor="middle" font-size="10.5" fill="#555">无法位运算抠位（对比 405）</text>
  <text x="160" y="450" text-anchor="middle" font-size="10.5" fill="#555">退回「除 K 取余」母模板</text>

  <rect x="300" y="398" width="240" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="420" y="418" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">负数 → abs + 末尾 '-'</text>
  <text x="420" y="436" text-anchor="middle" font-size="10.5" fill="#555">非补码！带符号绝对值</text>
  <text x="420" y="450" text-anchor="middle" font-size="10.5" fill="#555">符号随字符串一起反转</text>
</svg>
