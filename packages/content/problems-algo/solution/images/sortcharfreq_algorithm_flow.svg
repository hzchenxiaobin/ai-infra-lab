<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="500" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="250" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">根据字符出现频率排序：算法流程</text>

  <!-- Start -->
  <ellipse cx="250" cy="62" rx="90" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="66" text-anchor="middle" font-size="12" fill="#333">开始: 输入字符串 s</text>

  <path d="M 250 82 L 250 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 1: Count frequencies -->
  <rect x="130" y="104" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="250" y="126" text-anchor="middle" font-size="12" fill="#333">① 哈希表统计每个字符频率 cnt</text>

  <path d="M 250 138 L 250 156" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: Extract pairs -->
  <rect x="130" y="160" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="250" y="182" text-anchor="middle" font-size="12" fill="#333">② 提取 (freq, char) 对到列表</text>

  <path d="M 250 194 L 250 212" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: sort or bucket? -->
  <polygon points="250,216 370,260 250,304 130,260" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="252" text-anchor="middle" font-size="12" fill="#333">选择排序</text>
  <text x="250" y="268" text-anchor="middle" font-size="12" fill="#333">策略?</text>

  <!-- Left: sort -->
  <path d="M 130 260 L 112 260" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="121" y="252" text-anchor="middle" font-size="10" fill="#82b366">排序</text>
  <rect x="20" y="240" width="90" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="65" y="258" text-anchor="middle" font-size="10" fill="#333">按 freq 降序</text>
  <text x="65" y="272" text-anchor="middle" font-size="10" fill="#888">O(k log k)</text>

  <!-- Right: bucket -->
  <path d="M 370 260 L 388 260" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="379" y="252" text-anchor="middle" font-size="10" fill="#82b366">桶排</text>
  <rect x="390" y="240" width="90" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="435" y="258" text-anchor="middle" font-size="10" fill="#333">桶[freq] 分组</text>
  <text x="435" y="272" text-anchor="middle" font-size="10" fill="#888">O(n)</text>

  <!-- Merge back -->
  <path d="M 65 284 L 65 322 L 248 322" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 435 284 L 435 322 L 252 322" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>

  <path d="M 250 322 L 250 340" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: Build result -->
  <rect x="100" y="344" width="300" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="250" y="366" text-anchor="middle" font-size="12" fill="#333">③ 按序展开: result += char × freq</text>

  <path d="M 250 378 L 250 396" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Return -->
  <ellipse cx="250" cy="412" rx="90" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="416" text-anchor="middle" font-size="12" fill="#333">返回 result</text>

  <!-- Summary -->
  <text x="250" y="434" text-anchor="middle" font-size="10" fill="#888">k ≤ 62 时两种策略实际差异极小，排序法更简洁</text>
</svg>
