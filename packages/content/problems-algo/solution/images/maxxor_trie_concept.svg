<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#aaa"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="470" fill="#fafafa"/>

  <text x="380" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">二进制 Trie + 逐位贪心：为 num=5 寻找最大异或伙伴</text>
  <text x="380" y="44" text-anchor="middle" font-size="11" fill="#888">nums = [3,10,5,25,2,8]，5 位二进制；每层「优先走相反位」→ 该位异或为 1</text>

  <!-- level labels -->
  <text x="24" y="74" font-size="11" fill="#aaa">root</text>
  <text x="24" y="128" font-size="11" fill="#aaa">bit4</text>
  <text x="24" y="188" font-size="11" fill="#aaa">bit3</text>
  <text x="24" y="248" font-size="11" fill="#aaa">bit2</text>
  <text x="24" y="308" font-size="11" fill="#aaa">bit1</text>
  <text x="24" y="368" font-size="11" fill="#aaa">bit0</text>

  <!-- ===== non-path edges (light) ===== -->
  <path d="M 360 78 L 226 116" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 220 138 L 146 174" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 230 138 L 294 174" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 134 198 L 86 234" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 150 198 L 194 234" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 300 198 L 300 234" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 80 258 L 80 294" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 200 258 L 200 294" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 296 258 L 290 294" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 306 258 L 346 294" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 80 318 L 56 354" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 86 318 L 114 354" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 200 318 L 200 354" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 290 318 L 290 354" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 350 318 L 350 354" stroke="#bbb" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- edge bit labels (non-path) -->
  <text x="240" y="100" font-size="9" fill="#888">0</text>
  <text x="280" y="166" font-size="9" fill="#888">1</text>
  <text x="160" y="166" font-size="9" fill="#888">0</text>
  <text x="92" y="222" font-size="9" fill="#888">0</text>
  <text x="184" y="222" font-size="9" fill="#888">1</text>
  <text x="308" y="222" font-size="9" fill="#888">0</text>

  <!-- ===== highlighted path edges (root→1→1→0→0→1) ===== -->
  <path d="M 366 78 L 476 116" stroke="#b85450" stroke-width="2.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 480 140 L 480 174" stroke="#b85450" stroke-width="2.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 480 200 L 480 234" stroke="#b85450" stroke-width="2.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 480 260 L 480 294" stroke="#d6a040" stroke-width="2.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 480 320 L 480 354" stroke="#d6a040" stroke-width="2.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="412" y="100" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <text x="488" y="166" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <text x="488" y="226" font-size="10" fill="#b85450" font-weight="bold">0</text>
  <text x="488" y="286" font-size="10" fill="#d6a040" font-weight="bold">0</text>
  <text x="488" y="346" font-size="10" fill="#d6a040" font-weight="bold">1</text>

  <!-- ===== nodes ===== -->
  <!-- root -->
  <g filter="url(#rough2)">
    <circle cx="360" cy="66" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2" />
  </g>
  <text x="360" y="70" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">root</text>

  <!-- bit4=0 -->
  <g filter="url(#rough2)"><circle cx="220" cy="120" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="220" y="124" text-anchor="middle" font-size="11" fill="#446688">0</text>
  <!-- bit4=1 [path] -->
  <g filter="url(#rough2)"><circle cx="480" cy="120" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/></g>
  <text x="480" y="124" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>

  <!-- bit3=0 (under 0) -->
  <g filter="url(#rough2)"><circle cx="140" cy="180" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="140" y="184" text-anchor="middle" font-size="10" fill="#446688">0</text>
  <!-- bit3=1 (under 0) -->
  <g filter="url(#rough2)"><circle cx="300" cy="180" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="300" y="184" text-anchor="middle" font-size="10" fill="#446688">1</text>
  <!-- bit3=1 (under 1) [path] -->
  <g filter="url(#rough2)"><circle cx="480" cy="180" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/></g>
  <text x="480" y="184" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>

  <!-- bit2=0 (under 00) -->
  <g filter="url(#rough2)"><circle cx="80" cy="240" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="80" y="244" text-anchor="middle" font-size="10" fill="#446688">0</text>
  <!-- bit2=1 (under 00) -->
  <g filter="url(#rough2)"><circle cx="200" cy="240" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="200" y="244" text-anchor="middle" font-size="10" fill="#446688">1</text>
  <!-- bit2=0 (under 01) -->
  <g filter="url(#rough2)"><circle cx="300" cy="240" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="300" y="244" text-anchor="middle" font-size="10" fill="#446688">0</text>
  <!-- bit2=0 (under 11) [path] -->
  <g filter="url(#rough2)"><circle cx="480" cy="240" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/></g>
  <text x="480" y="244" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>

  <!-- bit1=1 (under 000) -->
  <g filter="url(#rough2)"><circle cx="80" cy="300" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="80" y="304" text-anchor="middle" font-size="10" fill="#446688">1</text>
  <!-- bit1=0 (under 001) -->
  <g filter="url(#rough2)"><circle cx="200" cy="300" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="200" y="304" text-anchor="middle" font-size="10" fill="#446688">0</text>
  <!-- bit1=0 (under 010) -->
  <g filter="url(#rough2)"><circle cx="290" cy="300" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="290" y="304" text-anchor="middle" font-size="10" fill="#446688">0</text>
  <!-- bit1=1 (under 010) -->
  <g filter="url(#rough2)"><circle cx="350" cy="300" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/></g>
  <text x="350" y="304" text-anchor="middle" font-size="10" fill="#446688">1</text>
  <!-- bit1=0 (under 110) [path] -->
  <g filter="url(#rough2)"><circle cx="480" cy="300" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/></g>
  <text x="480" y="304" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">0</text>

  <!-- bit0 leaves -->
  <g filter="url(#rough2)"><circle cx="55" cy="360" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="55" y="364" text-anchor="middle" font-size="9" fill="#4a7a3a">0</text>
  <text x="55" y="384" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">=2</text>

  <g filter="url(#rough2)"><circle cx="115" cy="360" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="115" y="364" text-anchor="middle" font-size="9" fill="#4a7a3a">1</text>
  <text x="115" y="384" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">=3</text>

  <g filter="url(#rough2)"><circle cx="200" cy="360" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="200" y="364" text-anchor="middle" font-size="9" fill="#4a7a3a">1</text>
  <text x="200" y="384" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">=5</text>

  <g filter="url(#rough2)"><circle cx="290" cy="360" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="290" y="364" text-anchor="middle" font-size="9" fill="#4a7a3a">0</text>
  <text x="290" y="384" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">=8</text>

  <g filter="url(#rough2)"><circle cx="350" cy="360" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2"/></g>
  <text x="350" y="364" text-anchor="middle" font-size="9" fill="#4a7a3a">0</text>
  <text x="350" y="384" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">=10</text>

  <!-- bit0=1 (path, =25) -->
  <g filter="url(#rough2)"><circle cx="480" cy="360" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2.5"/></g>
  <text x="480" y="364" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="480" y="386" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">=25 ✓</text>

  <!-- ===== side annotation panel ===== -->
  <rect x="570" y="78" width="180" height="200" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="660" y="100" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">num = 5 = 00101</text>
  <text x="660" y="116" text-anchor="middle" font-size="10" fill="#888">逐位走 Trie，优先相反位</text>

  <text x="586" y="140" font-size="10" fill="#4a7a3a" font-weight="bold">bit4: 取1 (相反) ✓</text>
  <text x="586" y="156" font-size="9" fill="#888">→ 异或该位 = 1</text>

  <text x="586" y="178" font-size="10" fill="#4a7a3a" font-weight="bold">bit3: 取1 (相反) ✓</text>
  <text x="586" y="194" font-size="9" fill="#888">→ 异或该位 = 1</text>

  <text x="586" y="216" font-size="10" fill="#4a7a3a" font-weight="bold">bit2: 取0 (相反) ✓</text>
  <text x="586" y="232" font-size="9" fill="#888">→ 异或该位 = 1</text>

  <text x="586" y="254" font-size="10" fill="#b85450" font-weight="bold">bit1: 取0 (相同) ✗</text>
  <text x="586" y="270" font-size="9" fill="#888">→ 异或该位 = 0</text>

  <!-- result -->
  <rect x="570" y="288" width="180" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="660" y="310" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">5 XOR 25 = 11100₂</text>
  <text x="660" y="330" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">= 28</text>

  <!-- legend -->
  <rect x="40" y="416" width="680" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="58" y="438" font-size="10" fill="#4a7a3a" font-weight="bold">● 相反位(红)</text>
  <text x="58" y="450" font-size="9" fill="#888">该位异或=1，贪心优先</text>
  <text x="230" y="438" font-size="10" fill="#d6a040" font-weight="bold">● 相同位(橙)</text>
  <text x="230" y="450" font-size="9" fill="#888">无相反位时退而求其次，异或=0</text>
  <text x="470" y="438" font-size="10" fill="#446688" font-weight="bold">● 普通节点(蓝)</text>
  <text x="470" y="450" font-size="9" fill="#888">Trie 中已插入的所有数共享路径</text>
</svg>
