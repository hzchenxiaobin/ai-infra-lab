<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：折扣是「可选维度」——命中带出数值，未命中补 NULL</text>

  <rect x="22" y="50" width="230" height="184" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="137" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">Products（主体表，n 行）</text>

  <rect x="38" y="82" width="198" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="137" y="101" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1 · Electronics · 1000</text>

  <rect x="38" y="120" width="198" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="137" y="139" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2 · Clothing · 50</text>

  <rect x="38" y="158" width="198" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="137" y="177" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3 · Electronics · 1200</text>

  <rect x="38" y="196" width="198" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="137" y="215" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4 · Home · 500</text>

  <rect x="356" y="74" width="142" height="104" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="427" y="96" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">Discounts（维度表）</text>

  <rect x="372" y="106" width="110" height="28" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="427" y="124" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Electronics → 10</text>

  <rect x="372" y="140" width="110" height="28" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="427" y="158" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Clothing → 20</text>

  <rect x="356" y="196" width="142" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" rx="6" filter="url(#rough2)"/>
  <text x="427" y="215" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">Home：discount = NULL</text>

  <path d="M 236 97 C 290 100, 322 110, 368 117" stroke="#446688" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 236 173 C 292 168, 322 142, 368 129" stroke="#446688" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 236 135 C 292 140, 322 148, 368 152" stroke="#446688" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 236 211 C 284 214, 318 211, 352 211" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrr)" fill="none" filter="url(#rough2)"/>

  <text x="284" y="92" font-size="10" fill="#446688" filter="url(#rough2)">命中</text>
  <text x="282" y="204" font-size="10" fill="#b85450" filter="url(#rough2)">未命中</text>

  <rect x="48" y="262" width="424" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="284" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">final_price = price × (100 − IFNULL(discount, 0)) / 100</text>
  <text x="260" y="306" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">NULL 先被「翻译」成 0：未命中 ≡ 折扣 0%，价格不变</text>

  <text x="260" y="352" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">LEFT JOIN 保住每一个产品行：折扣带得出来就带上，带不出来就补 NULL</text>
</svg>
