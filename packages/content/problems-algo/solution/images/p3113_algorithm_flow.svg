<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 432" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="432" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：单调栈存 (值, 个数)，一趟扫描</text>

  <rect x="215" y="36" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="12" filter="url(#rough2)"/>
  <text x="260" y="52" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">开始</text>

  <path d="M 260 60 L 260 70" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="150" y="74" width="220" height="30" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="93" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">取下一个元素 x = nums[i]</text>

  <path d="M 370 89 L 400 89" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="381" y="80" text-anchor="middle" font-size="9.5" fill="#8a6a1f" filter="url(#rough2)">用尽</text>

  <rect x="404" y="74" width="104" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="456" y="93" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">返回 ans</text>

  <path d="M 260 104 L 260 114" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="140" y="118" width="240" height="34" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="139" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">cnt = 1（子数组 [i, i] 天然合法）</text>

  <path d="M 260 152 L 260 164" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="190,196 260,168 330,196 260,224" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="190" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">栈非空 且</text>
  <text x="260" y="206" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">栈顶值 ≤ x ?</text>

  <path d="M 332 196 L 356 196" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="342" y="186" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">是</text>

  <rect x="360" y="172" width="148" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="434" y="191" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">弹出 (v, c)</text>
  <text x="434" y="209" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">v == x ⇒ cnt += c</text>

  <path d="M 434 222 L 434 240 L 300 240 L 300 212" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="396" y="234" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">继续检查新栈顶</text>

  <path d="M 260 224 L 260 248" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="270" y="240" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <rect x="135" y="252" width="250" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="273" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">ans += cnt；压栈 (x, cnt)</text>

  <path d="M 135 269 L 60 269 L 60 89 L 146 89" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="60" y="78" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">下一个 x</text>

  <rect x="12" y="306" width="240" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="132" y="326" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">栈自底向上：值严格递减</text>
  <text x="132" y="344" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">(v, c)：c = 窗口内 v 的等值个数</text>
  <text x="132" y="360" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">压栈 (x, cnt)：等值段自动合并</text>

  <rect x="264" y="306" width="244" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="386" y="326" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">弹出的小值被 x 遮蔽</text>
  <text x="386" y="344" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">之后任何「左侧第一个更大」查询：</text>
  <text x="386" y="360" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">x 挡在中间，丢弃不影响正确性</text>

  <rect x="12" y="378" width="496" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="402" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">复杂度：每个元素至多进栈、出栈一次 ⇒ O(n) 时间、O(n) 空间</text>
</svg>
