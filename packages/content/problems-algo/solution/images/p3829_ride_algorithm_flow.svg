<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">算法流程：先清幽灵 → 判空 → 双队首出队</text>

  <!-- 左列：matchDriverWithRider -->
  <rect x="35" y="38" width="210" height="28" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="56" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">matchDriverWithRider()</text>

  <path d="M 140 66 L 140 80" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="35" y="84" width="210" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="106" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">① 清幽灵：while 队首 ∉ waiting</text>
  <text x="140" y="124" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">riders.popleft()（幽灵离队）</text>

  <path d="M 247 100 C 266 98, 266 80, 243 84" fill="none" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="272" y="88" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">循环</text>

  <path d="M 140 136 L 140 152" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <polygon points="140,156 218,192 140,228 62,192" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="188" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">riders 空 或</text>
  <text x="140" y="204" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">drivers 空？</text>

  <text x="150" y="244" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M 140 228 L 140 248" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="48" y="252" width="184" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="272" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">return [-1, -1]</text>
  <text x="140" y="288" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">（不消耗任何一侧）</text>

  <text x="228" y="186" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <path d="M 218 192 C 264 192, 264 312, 250 318" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="35" y="300" width="210" height="52" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="322" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">③ d、r 双队首出队</text>
  <text x="140" y="340" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">waiting.erase(r)（销账）</text>

  <path d="M 140 352 L 140 368" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="55" y="372" width="170" height="28" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="390" text-anchor="middle" font-size="11" fill="#2e5a24" filter="url(#rough2)">return [d, r]</text>

  <!-- 右列：其余接口 -->
  <rect x="290" y="38" width="200" height="28" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="56" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">其余接口（全部 O(1)）</text>

  <path d="M 390 66 L 390 80" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="290" y="84" width="200" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="390" y="102" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">addRider(id)</text>
  <text x="390" y="119" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">riders 尾入队 + waiting 入账</text>

  <path d="M 390 128 L 390 142" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="290" y="146" width="200" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="390" y="164" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">addDriver(id)</text>
  <text x="390" y="181" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">drivers 尾入队</text>

  <path d="M 390 190 L 390 204" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="290" y="208" width="200" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="226" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">cancelRider(id)</text>
  <text x="390" y="243" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">waiting.erase(id) —— 懒删除</text>
  <text x="390" y="258" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">幂等：不存在 / 已匹配 → no-op</text>

  <rect x="290" y="284" width="200" height="96" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="390" y="304" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">两处顺序雷区</text>
  <text x="390" y="322" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">① 先清幽灵再判空——</text>
  <text x="390" y="336" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">只剩幽灵时会误判有人等</text>
  <text x="390" y="354" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">② 判空后才 pop——</text>
  <text x="390" y="368" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">失败必须零副作用</text>

  <text x="260" y="416" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">1000 次操作全 O(1)（match 均摊）：队列条目至多进出各一次</text>
</svg>
