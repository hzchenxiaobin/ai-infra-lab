<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrUp" markerWidth="8" markerHeight="8" refX="4" refY="2" orient="auto">
      <path d="M0,7 L4,0 L8,7 Z" fill="#6a9acc"/>
    </marker>
    <marker id="arrDn" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：grid = [[1,1,1],[1,1,1]] → 答案 2</text>

  <!-- ===== Left: f table (pyramid, bottom-up) ===== -->
  <text x="130" y="48" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">f 表（金字塔，自底向上）</text>

  <!-- Row labels -->
  <text x="48" y="82" text-anchor="middle" font-size="10" fill="#888">r=0</text>
  <text x="48" y="122" text-anchor="middle" font-size="10" fill="#888">r=1</text>

  <!-- Row 0: [1, 2, 1] -->
  <rect x="72" y="62" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough)"/>
  <text x="90" y="85" text-anchor="middle" font-size="13" fill="#446688">1</text>
  <rect x="112" y="62" width="36" height="36" fill="#6c8ebf" fill-opacity="0.75" stroke="#446688" stroke-width="2.5" rx="4" filter="url(#rough)"/>
  <text x="130" y="85" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">2</text>
  <rect x="152" y="62" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough)"/>
  <text x="170" y="85" text-anchor="middle" font-size="13" fill="#446688">1</text>

  <!-- Row 1: [1, 1, 1] -->
  <rect x="72" y="102" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough)"/>
  <text x="90" y="125" text-anchor="middle" font-size="13" fill="#446688">1</text>
  <rect x="112" y="102" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough)"/>
  <text x="130" y="125" text-anchor="middle" font-size="13" fill="#446688">1</text>
  <rect x="152" y="102" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough)"/>
  <text x="170" y="125" text-anchor="middle" font-size="13" fill="#446688">1</text>

  <!-- Computation arrows for f[0][1] -->
  <path d="M 90 102 L 125 100" stroke="#6a9acc" stroke-width="1" fill="none" stroke-dasharray="3,2" marker-end="url(#arrUp)" filter="url(#rough2)"/>
  <path d="M 130 102 L 130 100" stroke="#6a9acc" stroke-width="1" fill="none" marker-end="url(#arrUp)" filter="url(#rough2)"/>
  <path d="M 170 102 L 135 100" stroke="#6a9acc" stroke-width="1" fill="none" stroke-dasharray="3,2" marker-end="url(#arrUp)" filter="url(#rough2)"/>

  <!-- Contribution -->
  <text x="130" y="158" text-anchor="middle" font-size="10.5" fill="#555">f−1: [0,1,0]+[0,0,0] = 1</text>

  <!-- Divider -->
  <line x1="245" y1="45" x2="245" y2="165" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Right: g table (inverted, top-down) ===== -->
  <text x="385" y="48" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">g 表（倒金字塔，自顶向下）</text>

  <!-- Row labels -->
  <text x="303" y="82" text-anchor="middle" font-size="10" fill="#888">r=0</text>
  <text x="303" y="122" text-anchor="middle" font-size="10" fill="#888">r=1</text>

  <!-- Row 0: [1, 1, 1] -->
  <rect x="327" y="62" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough)"/>
  <text x="345" y="85" text-anchor="middle" font-size="13" fill="#d6a040">1</text>
  <rect x="367" y="62" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough)"/>
  <text x="385" y="85" text-anchor="middle" font-size="13" fill="#d6a040">1</text>
  <rect x="407" y="62" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough)"/>
  <text x="425" y="85" text-anchor="middle" font-size="13" fill="#d6a040">1</text>

  <!-- Row 1: [1, 2, 1] -->
  <rect x="327" y="102" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough)"/>
  <text x="345" y="125" text-anchor="middle" font-size="13" fill="#d6a040">1</text>
  <rect x="367" y="102" width="36" height="36" fill="#d6a040" fill-opacity="0.75" stroke="#b8860b" stroke-width="2.5" rx="4" filter="url(#rough)"/>
  <text x="385" y="125" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">2</text>
  <rect x="407" y="102" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough)"/>
  <text x="425" y="125" text-anchor="middle" font-size="13" fill="#d6a040">1</text>

  <!-- Computation arrows for g[1][1] -->
  <path d="M 345 100 L 380 102" stroke="#d6a040" stroke-width="1" fill="none" stroke-dasharray="3,2" marker-end="url(#arrDn)" filter="url(#rough2)"/>
  <path d="M 385 100 L 385 102" stroke="#d6a040" stroke-width="1" fill="none" marker-end="url(#arrDn)" filter="url(#rough2)"/>
  <path d="M 425 100 L 390 102" stroke="#d6a040" stroke-width="1" fill="none" stroke-dasharray="3,2" marker-end="url(#arrDn)" filter="url(#rough2)"/>

  <!-- Contribution -->
  <text x="385" y="158" text-anchor="middle" font-size="10.5" fill="#555">g−1: [0,0,0]+[0,1,0] = 1</text>

  <!-- ===== Bottom: computation details ===== -->
  <rect x="40" y="178" width="210" height="80" fill="#e8f0fe" fill-opacity="0.4" stroke="#446688" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="145" y="198" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">f[0][1] 的计算</text>
  <text x="50" y="216" font-size="10" fill="#444">= min(f[1][0], f[1][1], f[1][2]) + 1</text>
  <text x="50" y="232" font-size="10" fill="#444">= min(1, 1, 1) + 1 = 2</text>
  <text x="50" y="250" font-size="10" fill="#6a9acc">→ 贡献 f−1 = 1 个金字塔</text>

  <rect x="270" y="178" width="210" height="80" fill="#fff8e1" fill-opacity="0.5" stroke="#d6a040" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="375" y="198" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">g[1][1] 的计算</text>
  <text x="280" y="216" font-size="10" fill="#444">= min(g[0][0], g[0][1], g[0][2]) + 1</text>
  <text x="280" y="232" font-size="10" fill="#444">= min(1, 1, 1) + 1 = 2</text>
  <text x="280" y="250" font-size="10" fill="#d6a040">→ 贡献 g−1 = 1 个倒金字塔</text>

  <!-- Total -->
  <rect x="120" y="278" width="280" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="301" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">总计 = 1 + 1 = 2</text>

  <!-- Note -->
  <text x="260" y="336" text-anchor="middle" font-size="10" fill="#888">f[0][1]=2 → 1 个高度 2 的金字塔（apex 在 (0,1)）</text>
  <text x="260" y="352" text-anchor="middle" font-size="10" fill="#888">g[1][1]=2 → 1 个高度 2 的倒金字塔（apex 在 (1,1)）</text>
</svg>
