<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="500" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">冠军 = 入度 0：没有边指向它 ⇔ 没有队伍强于它</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">示例 2：n = 4，edges = [[0,2],[1,3],[1,2]] → 返回 −1</text>

  <!-- 队 0 与队 1 之间：无胜负关系 -->
  <line x1="152" y1="150" x2="308" y2="150" stroke="#999" stroke-width="1.4" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="230" y="142" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">互相没有强弱关系</text>

  <!-- 边 0→2 -->
  <path d="M 136 180 L 212 277" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- 边 1→2 -->
  <path d="M 324 180 L 248 277" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- 边 1→3 -->
  <path d="M 360 177 L 476 279" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 节点：队 0（冠军候选，绿） -->
  <circle cx="120" cy="160" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="120" y="165" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="120" y="124" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">队 0</text>
  <circle cx="137" cy="143" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="137" y="147" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>

  <!-- 节点：队 1（冠军候选，绿） -->
  <circle cx="340" cy="160" r="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="340" y="165" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="340" y="124" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">队 1</text>
  <circle cx="357" cy="143" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="357" y="147" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>

  <!-- 节点：队 2（被压制，红） -->
  <circle cx="230" cy="300" r="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="305" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="184" y="306" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">队 2</text>
  <circle cx="247" cy="317" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="247" y="321" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- 节点：队 3（被压制，红） -->
  <circle cx="500" cy="300" r="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="500" y="305" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="500" y="264" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">队 3</text>
  <circle cx="517" cy="317" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="517" y="321" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- 图例 -->
  <circle cx="462" cy="78" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="480" y="82" font-size="10.5" fill="#555" filter="url(#rough2)">小圆 = 入度（被几条边指向）</text>

  <!-- 左右对照框 -->
  <rect x="36" y="362" width="250" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="161" y="384" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">入度 = 0：没有边指进来</text>
  <text x="161" y="402" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">→ 没有任何队伍强于它 → 冠军候选</text>
  <text x="161" y="418" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">队 0、队 1 两个候选</text>

  <rect x="306" y="362" width="250" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="431" y="384" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">入度 &gt; 0：至少一条边指进来</text>
  <text x="431" y="402" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">→ 被直接压制，无缘冠军</text>
  <text x="431" y="418" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">队 2（入度 2）、队 3（入度 1）</text>

  <!-- 总结框 -->
  <rect x="36" y="442" width="520" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="296" y="462" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">候选有 2 个 → 冠军不唯一 → 返回 −1；全图只有 1 个入度 0 时，它就是唯一冠军</text>
  <text x="296" y="480" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">（DAG 保证入度 0 至少存在一个：否则沿入边不断回走，必然成环）</text>
</svg>
