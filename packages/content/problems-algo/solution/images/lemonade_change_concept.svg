<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：5 元最稀缺 → 20 元优先用 10+5 找零</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">5 元是万能零钱（能给 10/20 找零），10 元是专用零钱（只能给 20）</text>

  <!-- Scenario 1: pay 5 -->
  <rect x="24" y="56" width="150" height="170" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="99" y="76" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">付 $5</text>
  <text x="99" y="93" text-anchor="middle" font-size="10" fill="#888">无需找零</text>
  <rect x="69" y="102" width="60" height="34" fill="#fff" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="99" y="124" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">$5</text>
  <path d="M 99 140 L 99 156" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="99" y="176" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">直接收下</text>
  <text x="99" y="194" text-anchor="middle" font-size="10" fill="#555">five++</text>
  <rect x="59" y="202" width="80" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="99" y="216" text-anchor="middle" font-size="10" fill="#4a7a3a">库存 +$5</text>

  <!-- Scenario 2: pay 10 -->
  <rect x="185" y="56" width="150" height="170" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="76" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">付 $10</text>
  <text x="260" y="93" text-anchor="middle" font-size="10" fill="#888">找零 $5</text>
  <rect x="230" y="102" width="60" height="34" fill="#fff" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="124" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">$10</text>
  <path d="M 260 140 L 260 156" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="260" y="176" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">退一张 $5</text>
  <text x="260" y="194" text-anchor="middle" font-size="10" fill="#555">five--, ten++</text>
  <rect x="220" y="202" width="80" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="260" y="216" text-anchor="middle" font-size="10" fill="#b85450">five ≥ 1 ?</text>

  <!-- Scenario 3: pay 20 -->
  <rect x="346" y="56" width="150" height="170" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="421" y="76" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">付 $20</text>
  <text x="421" y="93" text-anchor="middle" font-size="10" fill="#888">找零 $15</text>
  <rect x="391" y="102" width="60" height="34" fill="#fff" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="421" y="124" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">$20</text>
  <path d="M 421 140 L 421 156" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Option A (greedy, highlighted) -->
  <rect x="354" y="160" width="64" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="386" y="177" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">10+5 ✓贪心</text>
  <!-- Option B -->
  <rect x="424" y="160" width="64" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="456" y="177" text-anchor="middle" font-size="10" fill="#b85450">5+5+5 备选</text>

  <text x="421" y="200" text-anchor="middle" font-size="10" fill="#555">优先 10+5</text>
  <text x="421" y="216" text-anchor="middle" font-size="10" fill="#555">否则 5+5+5</text>

  <!-- Bottom explanation -->
  <rect x="24" y="242" width="472" height="104" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="264" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">为什么 20 元优先用 10+5 而非 5+5+5？</text>
  <text x="260" y="284" text-anchor="middle" font-size="10.5" fill="#555">$5 钞票是「万能零钱」：既能给 $10 找零，又能给 $20 找零</text>
  <text x="260" y="302" text-anchor="middle" font-size="10.5" fill="#555">$10 钞票是「专用零钱」：只能给 $20 找零，别无用处</text>
  <text x="260" y="322" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">→ 尽早消耗专用零钱（10），保留万能零钱（5）应对未来</text>
  <text x="260" y="340" text-anchor="middle" font-size="9.5" fill="#aaa">交换论证：若最优解用了 5+5+5，把一张 5 换成 10 不影响合法性但更省 5</text>
</svg>
