<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：mat1(2×3) × mat2(3×3)</text>

  <!-- 输入矩阵 -->
  <text x="70" y="50" text-anchor="middle" font-size="11" fill="#888">mat1</text>
  <!-- mat1 2x3 -->
  <rect x="36" y="58" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="50" y="77" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <rect x="64" y="58" width="28" height="28" fill="#f2f2f2" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="78" y="77" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="92" y="58" width="28" height="28" fill="#f2f2f2" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="106" y="77" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="36" y="86" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="50" y="105" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">−1</text>
  <rect x="64" y="86" width="28" height="28" fill="#f2f2f2" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="78" y="105" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="92" y="86" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="106" y="105" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>

  <!-- × -->
  <text x="140" y="92" text-anchor="middle" font-size="18" fill="#888" font-weight="bold">×</text>

  <text x="232" y="50" text-anchor="middle" font-size="11" fill="#888">mat2</text>
  <!-- mat2 3x3 -->
  <rect x="170" y="58" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="184" y="77" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">7</text>
  <rect x="198" y="58" width="28" height="28" fill="#f2f2f2" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="212" y="77" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="226" y="58" width="28" height="28" fill="#f2f2f2" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="240" y="77" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="170" y="86" width="28" height="28" fill="#f2f2f2" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="184" y="105" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="198" y="86" width="28" height="28" fill="#f2f2f2" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="212" y="105" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="226" y="86" width="28" height="28" fill="#f2f2f2" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="240" y="105" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="170" y="114" width="28" height="28" fill="#f2f2f2" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="184" y="133" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="198" y="114" width="28" height="28" fill="#f2f2f2" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="212" y="133" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="226" y="114" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="240" y="133" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- 稀疏表示 -->
  <rect x="290" y="58" width="230" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="405" y="80" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">稀疏表示</text>
  <text x="300" y="100" font-size="11" fill="#444">rs1 = {0:[(0,1)],</text>
  <text x="300" y="116" font-size="11" fill="#444">　　1:[(0,−1),(2,3)]}</text>
  <text x="300" y="134" font-size="11" fill="#444">rs2 = {0:[(0,7)],2:[(2,1)]}</text>

  <!-- 分隔 -->
  <path d="M30 158 H510" stroke="#ccc" stroke-width="1.2" stroke-dasharray="5,4" filter="url(#rough2)"/>

  <text x="270" y="178" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">逐步累加 C：</text>

  <!-- 快照 1 -->
  <rect x="30" y="190" width="28" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="44" y="209" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">7</text>
  <rect x="58" y="190" width="28" height="28" fill="#f7f7f7" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="72" y="209" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="86" y="190" width="28" height="28" fill="#f7f7f7" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="100" y="209" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="30" y="218" width="28" height="28" fill="#f7f7f7" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="44" y="237" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="58" y="218" width="28" height="28" fill="#f7f7f7" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="72" y="237" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="86" y="218" width="28" height="28" fill="#f7f7f7" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="100" y="237" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <text x="72" y="266" text-anchor="middle" font-size="10" fill="#555">① i=0</text>
  <text x="72" y="280" text-anchor="middle" font-size="10" fill="#555">k=0,v=1</text>
  <text x="72" y="294" text-anchor="middle" font-size="10" fill="#b85450">C[0][0]+=1·7</text>

  <path d="M125 232 H175" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 快照 2 -->
  <rect x="180" y="190" width="28" height="28" fill="#f7f7f7" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="194" y="209" text-anchor="middle" font-size="11" fill="#888">7</text>
  <rect x="208" y="190" width="28" height="28" fill="#f7f7f7" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="222" y="209" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="236" y="190" width="28" height="28" fill="#f7f7f7" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="250" y="209" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="180" y="218" width="28" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="194" y="237" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−7</text>
  <rect x="208" y="218" width="28" height="28" fill="#f7f7f7" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="222" y="237" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="236" y="218" width="28" height="28" fill="#f7f7f7" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="250" y="237" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <text x="222" y="266" text-anchor="middle" font-size="10" fill="#555">② i=1</text>
  <text x="222" y="280" text-anchor="middle" font-size="10" fill="#555">k=0,v=−1</text>
  <text x="222" y="294" text-anchor="middle" font-size="10" fill="#b85450">C[1][0]+=−1·7</text>

  <path d="M275 232 H325" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 快照 3 -->
  <rect x="330" y="190" width="28" height="28" fill="#f7f7f7" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="344" y="209" text-anchor="middle" font-size="11" fill="#888">7</text>
  <rect x="358" y="190" width="28" height="28" fill="#f7f7f7" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="372" y="209" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="386" y="190" width="28" height="28" fill="#f7f7f7" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="400" y="209" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="330" y="218" width="28" height="28" fill="#f7f7f7" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="344" y="237" text-anchor="middle" font-size="11" fill="#888">−7</text>
  <rect x="358" y="218" width="28" height="28" fill="#f7f7f7" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="372" y="237" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="386" y="218" width="28" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="400" y="237" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <text x="372" y="266" text-anchor="middle" font-size="10" fill="#555">③ i=1</text>
  <text x="372" y="280" text-anchor="middle" font-size="10" fill="#555">k=2,v=3</text>
  <text x="372" y="294" text-anchor="middle" font-size="10" fill="#b85450">C[1][2]+=3·1</text>

  <!-- 最终结果 -->
  <rect x="60" y="320" width="420" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="346" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">最终 C = [[7,0,0], [−7,0,3]]　✓</text>

  <text x="270" y="388" text-anchor="middle" font-size="11" fill="#888">只做了 3 次非零乘加（密集法需 2·3·3 = 18 次）</text>
</svg>
