<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="470" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    示例演算：nums=[1,4,2,7], low=2, high=6
  </text>
  <text x="290" y="40" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    3 位二进制演示；实际代码用 15 位（bit14→bit0）
  </text>

  <!-- ===== Column headers ===== -->
  <text x="90" y="64" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">步骤1: x=1</text>
  <text x="230" y="64" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">步骤2: x=4</text>
  <text x="370" y="64" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">步骤3: x=2</text>
  <text x="510" y="64" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">步骤4: x=7</text>

  <!-- separator lines -->
  <line x1="160" y1="52" x2="160" y2="240" stroke="#dddddd" stroke-width="1" stroke-dasharray="3 4" filter="url(#rough2)"/>
  <line x1="300" y1="52" x2="300" y2="240" stroke="#dddddd" stroke-width="1" stroke-dasharray="3 4" filter="url(#rough2)"/>
  <line x1="440" y1="52" x2="440" y2="240" stroke="#dddddd" stroke-width="1" stroke-dasharray="3 4" filter="url(#rough2)"/>

  <!-- ===== Row: binary ===== -->
  <text x="24" y="86" font-size="10" fill="#888" filter="url(#rough2)">3位</text>
  <rect x="60" y="74" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="90" y="89" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">001</text>
  <rect x="200" y="74" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="230" y="89" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">100</text>
  <rect x="340" y="74" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="370" y="89" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">010</text>
  <rect x="480" y="74" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="510" y="89" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">111</text>

  <!-- ===== Row: Trie before ===== -->
  <text x="24" y="116" font-size="10" fill="#888" filter="url(#rough2)">Trie</text>
  <text x="24" y="128" font-size="9" fill="#aaa" filter="url(#rough2)">(先查)</text>
  <rect x="62" y="110" width="56" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2" rx="3" filter="url(#rough2)"/>
  <text x="90" y="126" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">∅ 空</text>
  <rect x="190" y="110" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="230" y="126" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">{1}</text>
  <rect x="324" y="110" width="92" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="370" y="126" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">{1, 4}</text>
  <rect x="464" y="110" width="92" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="510" y="126" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">{1,4,2}</text>

  <!-- ===== Row: countLE(x, high=6) ===== -->
  <text x="24" y="152" font-size="10" fill="#888" filter="url(#rough2)">cLE</text>
  <text x="24" y="164" font-size="9" fill="#aaa" filter="url(#rough2)">(x,6)</text>
  <text x="90" y="160" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="230" y="160" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="370" y="160" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="478" y="146" width="64" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="510" y="161" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">3</text>

  <!-- ===== Row: countLE(x, low-1=1) ===== -->
  <text x="24" y="184" font-size="10" fill="#888" filter="url(#rough2)">cLE</text>
  <text x="24" y="196" font-size="9" fill="#aaa" filter="url(#rough2)">(x,1)</text>
  <text x="90" y="192" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="230" y="192" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="370" y="192" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="510" y="192" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>

  <!-- ===== Row: add = diff ===== -->
  <text x="24" y="218" font-size="10" fill="#888" filter="url(#rough2)">add</text>
  <text x="24" y="230" font-size="9" fill="#aaa" filter="url(#rough2)">=差</text>
  <text x="90" y="224" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">0</text>
  <text x="230" y="224" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="370" y="224" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">2</text>
  <text x="510" y="224" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">3</text>

  <!-- ===== Row: ans ===== -->
  <text x="24" y="252" font-size="10" fill="#888" filter="url(#rough2)">ans</text>
  <text x="90" y="252" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="230" y="252" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="370" y="252" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="478" y="240" width="64" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="510" y="255" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">6</text>

  <!-- arrow showing ans accumulation -->
  <path d="M120,248 L188,248" stroke="#446688" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M260,248 L328,248" stroke="#446688" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M400,248 L468,248" stroke="#446688" stroke-width="1" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Bottom: step 4 detail: countLE(7, 6) "一刀切" trace ===== -->
  <rect x="30" y="272" width="520" height="180" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="292" text-anchor="middle" font-size="12" fill="#5a4a1a" filter="url(#rough2)">
    步骤4 详查：countLE(x=7=111, limit=6=110) on Trie {1,4,2}
  </text>

  <!-- Trie visual: bit2 split -->
  <text x="50" y="316" font-size="10" fill="#333" filter="url(#rough2)">bit2: x_b=1, l_b=1</text>
  <!-- child[1] = {4,2} (y bit2=1) -->
  <rect x="50" y="324" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="340" text-anchor="middle" font-size="10" fill="#2a4a1a" filter="url(#rough2)">{4,2} cnt=2</text>
  <text x="90" y="360" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">XOR位=0&lt;1</text>
  <text x="90" y="372" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">ans += 2 ✓</text>

  <!-- child[0] = {1} (y bit2=0) -->
  <path d="M130,336 L170,336" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="150" y="330" text-anchor="middle" font-size="8" fill="#d6a040" filter="url(#rough2)">下钻</text>
  <rect x="172" y="324" width="80" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="212" y="340" text-anchor="middle" font-size="10" fill="#5a4a1a" filter="url(#rough2)">{1} cnt=1</text>
  <text x="212" y="360" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">XOR位=1=l_b</text>
  <text x="212" y="372" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">继续匹配 ↘</text>

  <!-- bit1 -->
  <path d="M252,336 L292,336" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="300" y="316" font-size="10" fill="#333" filter="url(#rough2)">bit1: x_b=1, l_b=1</text>
  <text x="300" y="332" font-size="9" fill="#888" filter="url(#rough2)">child[1] 不存在(1的bit1=0)</text>
  <text x="300" y="348" font-size="10" fill="#888" filter="url(#rough2)">ans += 0</text>
  <text x="300" y="364" font-size="9" fill="#d6a040" filter="url(#rough2)">下钻 child[0] (1的bit1=0)</text>

  <!-- bit0 -->
  <text x="300" y="392" font-size="10" fill="#333" filter="url(#rough2)">bit0: x_b=1, l_b=0</text>
  <text x="300" y="408" font-size="9" fill="#d6a040" filter="url(#rough2)">只能走 child[1] (1的bit0=1)</text>
  <text x="300" y="424" font-size="10" fill="#d6a040" filter="url(#rough2)">末位 cur.cnt=1, ans += 1</text>

  <!-- total -->
  <rect x="430" y="392" width="110" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="485" y="410" text-anchor="middle" font-size="10" fill="#5a1a1a" filter="url(#rough2)">total = 2+0+1</text>
  <text x="485" y="428" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">= 3</text>

  <!-- footnote -->
  <text x="290" y="456" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    绿=「一刀切」计入；橙=下钻精确匹配；红色=最终合计
  </text>
  <text x="290" y="468" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">
    每步要么整棵子树累加，要么继续下钻 → O(log max) = O(15)
  </text>
</svg>
