<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">插入最大数 i：不同位置产生 0..i−1 个新逆序对</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">在 [1..i−1] 的排列中插入 i（当前最大），i 后面有几个数就产生几个新逆序对</text>

  <text x="30" y="72" font-size="11" fill="#446688" font-weight="bold">以 i=4 插入 [1,2,3] 为例：</text>

  <!-- ===== Row 1: insert at end → 0 new pairs ===== -->
  <g font-size="13">
    <text x="30" y="100" font-size="10" fill="#888">末尾</text>
    <!-- [1] [2] [3] [4] -->
    <rect x="70" y="84" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="88" y="106" text-anchor="middle" fill="#446688">1</text>
    <rect x="106" y="84" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="124" y="106" text-anchor="middle" fill="#446688">2</text>
    <rect x="142" y="84" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="160" y="106" text-anchor="middle" fill="#446688">3</text>
    <rect x="178" y="84" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="196" y="106" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>
    <text x="240" y="106" font-size="11" fill="#4a7a3a">4 后面 0 个数 → +0 逆序对</text>
  </g>

  <!-- ===== Row 2: insert at 3rd pos → 1 new pair ===== -->
  <g font-size="13">
    <text x="30" y="148" font-size="10" fill="#888">第3位</text>
    <rect x="70" y="132" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="88" y="154" text-anchor="middle" fill="#446688">1</text>
    <rect x="106" y="132" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="124" y="154" text-anchor="middle" fill="#446688">2</text>
    <rect x="142" y="132" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="160" y="154" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>
    <rect x="178" y="132" width="36" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="196" y="154" text-anchor="middle" fill="#b85450">3</text>
    <path d="M 196 140 L 196 128 L 210 128" stroke="#b85450" stroke-width="1" fill="none" stroke-dasharray="2,2" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="240" y="154" font-size="11" fill="#b85450">4 &gt; 3 → +1 逆序对</text>
  </g>

  <!-- ===== Row 3: insert at 2nd pos → 2 new pairs ===== -->
  <g font-size="13">
    <text x="30" y="196" font-size="10" fill="#888">第2位</text>
    <rect x="70" y="180" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="88" y="202" text-anchor="middle" fill="#446688">1</text>
    <rect x="106" y="180" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="124" y="202" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>
    <rect x="142" y="180" width="36" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="160" y="202" text-anchor="middle" fill="#b85450">2</text>
    <rect x="178" y="180" width="36" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="196" y="202" text-anchor="middle" fill="#b85450">3</text>
    <path d="M 124 188 L 124 176 L 196 176 L 196 180" stroke="#b85450" stroke-width="1" fill="none" stroke-dasharray="2,2" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="240" y="202" font-size="11" fill="#b85450">4 &gt; 2, 4 &gt; 3 → +2 逆序对</text>
  </g>

  <!-- ===== Row 4: insert at front → 3 new pairs ===== -->
  <g font-size="13">
    <text x="30" y="244" font-size="10" fill="#888">首位</text>
    <rect x="70" y="228" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="88" y="250" text-anchor="middle" fill="#4a7a3a" font-weight="bold">4</text>
    <rect x="106" y="228" width="36" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="124" y="250" text-anchor="middle" fill="#b85450">1</text>
    <rect x="142" y="228" width="36" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="160" y="250" text-anchor="middle" fill="#b85450">2</text>
    <rect x="178" y="228" width="36" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="196" y="250" text-anchor="middle" fill="#b85450">3</text>
    <path d="M 88 236 L 88 224 L 196 224 L 196 228" stroke="#b85450" stroke-width="1" fill="none" stroke-dasharray="2,2" marker-end="url(#arr)" filter="url(#rough2)"/>
    <text x="240" y="250" font-size="11" fill="#b85450">4 &gt; 1, 2, 3 → +3 逆序对</text>
  </g>

  <!-- ===== Summary box ===== -->
  <line x1="20" y1="284" x2="540" y2="284" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <rect x="30" y="296" width="500" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="318" font-size="11" fill="#4a7a3a" font-weight="bold">核心递推：dp[i][j] = Σ dp[i−1][j−p]，p ∈ {0, 1, …, min(i−1, j)}</text>
  <text x="50" y="338" font-size="10.5" fill="#555">• i 是当前最大数，插在第 p+1 位（末尾算第 1 位）时，后面有 p 个比它小的数</text>
  <text x="50" y="356" font-size="10.5" fill="#555">• 每个 p ∈ [0, i−1] 对应一种插入方式，产生 p 个新逆序对</text>
  <text x="50" y="374" font-size="10.5" fill="#4a7a3a" font-weight="bold">→ 枚举所有 p 求和，即得 dp[i][j]</text>
</svg>
