<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：a = 48 与 a = 15</text>

  <!-- ===== Example 1: a = 48 ===== -->
  <text x="40" y="54" font-size="12.5" fill="#446688" font-weight="bold">示例 1：a = 48 → 输出 68</text>

  <!-- Step table header -->
  <rect x="40" y="64" width="48" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="64" y="79" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">i</text>
  <rect x="88" y="64" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="118" y="79" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">a</text>
  <rect x="148" y="64" width="70" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="183" y="79" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">a%i==0?</text>
  <rect x="218" y="64" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="258" y="79" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">动作</text>
  <rect x="298" y="64" width="70" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="333" y="79" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">res</text>

  <!-- Row 1: i=9 -->
  <rect x="40" y="88" width="48" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="64" y="103" text-anchor="middle" font-size="10.5" fill="#333">9</text>
  <rect x="88" y="88" width="60" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="118" y="103" text-anchor="middle" font-size="10.5" fill="#333">48</text>
  <rect x="148" y="88" width="70" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="183" y="103" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <rect x="218" y="88" width="80" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="258" y="103" text-anchor="middle" font-size="10" fill="#888">i--</text>
  <rect x="298" y="88" width="70" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="333" y="103" text-anchor="middle" font-size="10.5" fill="#333">0</text>

  <!-- Row 2: i=8 -->
  <rect x="40" y="112" width="48" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="64" y="127" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">8</text>
  <rect x="88" y="112" width="60" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="118" y="127" text-anchor="middle" font-size="10.5" fill="#333">48</text>
  <rect x="148" y="112" width="70" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="183" y="127" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>
  <rect x="218" y="112" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="258" y="127" text-anchor="middle" font-size="9.5" fill="#4a7a3a">res+=8,a=6</text>
  <rect x="298" y="112" width="70" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="333" y="127" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">8</text>

  <!-- Row 3: i=8 again (6%8!=0) -->
  <rect x="40" y="136" width="48" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="64" y="151" text-anchor="middle" font-size="10.5" fill="#333">8</text>
  <rect x="88" y="136" width="60" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="118" y="151" text-anchor="middle" font-size="10.5" fill="#333">6</text>
  <rect x="148" y="136" width="70" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="183" y="151" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <rect x="218" y="136" width="80" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="258" y="151" text-anchor="middle" font-size="10" fill="#888">i--</text>
  <rect x="298" y="136" width="70" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="333" y="151" text-anchor="middle" font-size="10.5" fill="#333">8</text>

  <!-- Row 4: i=7,6 skip to i=6 -->
  <rect x="40" y="160" width="48" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="64" y="175" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">6</text>
  <rect x="88" y="160" width="60" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="118" y="175" text-anchor="middle" font-size="10.5" fill="#333">6</text>
  <rect x="148" y="160" width="70" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="183" y="175" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>
  <rect x="218" y="160" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="258" y="175" text-anchor="middle" font-size="9.5" fill="#4a7a3a">res+=6,a=1</text>
  <rect x="298" y="160" width="70" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="333" y="175" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">86</text>

  <!-- Result row -->
  <rect x="40" y="186" width="328" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="56" y="204" font-size="10.5" fill="#d6a040" font-weight="bold">a=1 ✓ → res=86 → 反转 →</text>
  <rect x="250" y="190" width="50" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="275" y="204" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">68</text>
  <text x="310" y="204" font-size="10.5" fill="#4a7a3a" font-weight="bold">✓ 6×8=48</text>

  <!-- ===== Example 2: a = 15 ===== -->
  <text x="40" y="232" font-size="12.5" fill="#446688" font-weight="bold">示例 2：a = 15 → 输出 35</text>

  <!-- table header -->
  <rect x="40" y="242" width="48" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="64" y="257" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">i</text>
  <rect x="88" y="242" width="60" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="118" y="257" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">a</text>
  <rect x="148" y="242" width="70" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="183" y="257" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">a%i==0?</text>
  <rect x="218" y="242" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="258" y="257" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">动作</text>
  <rect x="298" y="242" width="70" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="333" y="257" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">res</text>

  <!-- Row: i=9..6 skip -->
  <rect x="40" y="266" width="48" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="64" y="281" text-anchor="middle" font-size="10" fill="#b85450">9~6</text>
  <rect x="88" y="266" width="60" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="118" y="281" text-anchor="middle" font-size="10.5" fill="#333">15</text>
  <rect x="148" y="266" width="70" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="183" y="281" text-anchor="middle" font-size="10" fill="#b85450">全否</text>
  <rect x="218" y="266" width="80" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="258" y="281" text-anchor="middle" font-size="10" fill="#888">i-- 跳过</text>
  <rect x="298" y="266" width="70" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="333" y="281" text-anchor="middle" font-size="10.5" fill="#333">0</text>

  <!-- Row: i=5 -->
  <rect x="40" y="290" width="48" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="64" y="305" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">5</text>
  <rect x="88" y="290" width="60" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="118" y="305" text-anchor="middle" font-size="10.5" fill="#333">15</text>
  <rect x="148" y="290" width="70" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="183" y="305" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>
  <rect x="218" y="290" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="258" y="305" text-anchor="middle" font-size="9.5" fill="#4a7a3a">res+=5,a=3</text>
  <rect x="298" y="290" width="70" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="333" y="305" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">5</text>

  <!-- Row: i=4 skip, i=3 -->
  <rect x="40" y="314" width="48" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="64" y="329" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="88" y="314" width="60" height="22" fill="#fff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="118" y="329" text-anchor="middle" font-size="10.5" fill="#333">3</text>
  <rect x="148" y="314" width="70" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="183" y="329" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>
  <rect x="218" y="314" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="258" y="329" text-anchor="middle" font-size="9.5" fill="#4a7a3a">res+=3,a=1</text>
  <rect x="298" y="314" width="70" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="333" y="329" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">53</text>

  <!-- Result -->
  <rect x="40" y="340" width="328" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="56" y="358" font-size="10.5" fill="#d6a040" font-weight="bold">a=1 ✓ → res=53 → 反转 →</text>
  <rect x="250" y="344" width="50" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="275" y="358" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">35</text>
  <text x="310" y="358" font-size="10.5" fill="#4a7a3a" font-weight="bold">✓ 3×5=15</text>

  <!-- ===== Edge case: a = 13 ===== -->
  <line x1="40" y1="378" x2="520" y2="378" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <text x="40" y="396" font-size="12" fill="#b85450" font-weight="bold">边界：a = 13（质数 &gt; 9）→ 无解</text>

  <rect x="44" y="406" width="460" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="274" y="423" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">13 无法被 2~9 整除 → 循环后 a≠1 → return 0</text>
</svg>
