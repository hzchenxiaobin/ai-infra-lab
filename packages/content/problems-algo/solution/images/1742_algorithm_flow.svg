<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：遍历球号 → 求数位和 → 数组计数 → 同步取最大</text>

  <!-- Start oval -->
  <ellipse cx="260" cy="56" rx="42" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="61" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">开始</text>

  <!-- arrow start -> init -->
  <path d="M 260 74 L 260 92" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init rect -->
  <rect x="150" y="96" width="220" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="116" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">cnt[46] = {0}, ans = 0</text>
  <text x="260" y="132" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">定长数组，下标 = 数位和</text>

  <!-- arrow init -> diamond -->
  <path d="M 260 138 L 260 158" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: 还有球号? center (260, 195) -->
  <polygon points="260,166 340,195 260,224 180,195" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="193" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">x ≤ highLimit</text>
  <text x="260" y="208" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">？</text>

  <!-- 是: diamond bottom -> process top -->
  <path d="M 260 224 L 260 252" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="274" y="242" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- Process rect: digit sum -->
  <rect x="110" y="256" width="300" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="276" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">s = digitsum(x)</text>
  <text x="260" y="294" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">逐位取模：while t: s += t%10; t //= 10</text>

  <!-- arrow digit sum -> count -->
  <path d="M 260 304 L 260 322" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Process rect: count + max -->
  <rect x="120" y="326" width="280" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="346" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">cnt[s] += 1</text>
  <text x="260" y="364" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = max(ans, cnt[s])</text>

  <!-- loop back: count right -> right -> up -> diamond right -->
  <path d="M 400 350 L 448 350 L 448 195 L 340 195" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="458" y="280" font-size="10" fill="#888" filter="url(#rough2)">x++</text>
  <text x="458" y="294" font-size="10" fill="#888" filter="url(#rough2)">重复</text>

  <!-- 否: diamond left -> left -> down -> end -->
  <path d="M 180 195 L 100 195 L 100 392 L 200 392" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="114" y="189" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <text x="54" y="300" font-size="9.5" fill="#b85450" filter="url(#rough2)">遍历完</text>

  <!-- End oval -->
  <ellipse cx="260" cy="392" rx="64" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="397" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans</text>
</svg>
