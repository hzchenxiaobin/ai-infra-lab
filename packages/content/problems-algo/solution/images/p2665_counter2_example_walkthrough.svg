<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="320" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：createCounter(5)，calls = ["increment","reset","decrement"]</text>

  <!-- table outer border -->
  <rect x="30" y="50" width="560" height="174" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <!-- header -->
  <rect x="30" y="50" width="560" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">步</text>
  <text x="170" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">操作</text>
  <text x="320" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">调用前 current</text>
  <text x="450" y="72" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回值</text>
  <text x="560" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">调用后 current</text>

  <!-- column separators (below header) -->
  <path d="M 110 84 L 110 224 M 230 84 L 230 224 M 390 84 L 390 224 M 510 84 L 510 224" stroke="#ccc" stroke-width="1" fill="none" filter="url(#rough2)"/>
  <!-- row separators -->
  <path d="M 30 116 L 590 116 M 30 152 L 590 152 M 30 188 L 590 188" stroke="#eee" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <!-- row 0 -->
  <text x="60" y="104" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="170" y="104" text-anchor="middle" font-size="12" fill="#333">createCounter(5)</text>
  <text x="320" y="104" text-anchor="middle" font-size="12" fill="#888">—</text>
  <text x="450" y="104" text-anchor="middle" font-size="12" fill="#888">—</text>
  <text x="560" y="104" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">5</text>

  <!-- row 1 -->
  <text x="60" y="140" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="170" y="140" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">increment()</text>
  <text x="320" y="140" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="450" y="140" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">6</text>
  <text x="560" y="140" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">6</text>

  <!-- row 2 -->
  <text x="60" y="176" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="170" y="176" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">reset()</text>
  <text x="320" y="176" text-anchor="middle" font-size="12" fill="#333">6</text>
  <text x="450" y="176" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">5</text>
  <text x="560" y="176" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">5</text>

  <!-- row 3 -->
  <text x="60" y="212" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="170" y="212" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">decrement()</text>
  <text x="320" y="212" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="450" y="212" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">4</text>
  <text x="560" y="212" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">4</text>

  <!-- output -->
  <rect x="150" y="250" width="320" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="310" y="275" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">输出：[6, 5, 4]</text>

  <text x="310" y="308" text-anchor="middle" font-size="11" fill="#888">每次调用即时返回操作后的 current；reset 用 init 把 current 拉回初值</text>
</svg>
