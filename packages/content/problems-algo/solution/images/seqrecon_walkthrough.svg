<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：org=[1,2,3]，seqs=[[1,2],[1,3],[2,3]]</text>

  <!-- ===== Small DAG at top ===== -->
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888">约束图：1→2, 1→3, 2→3</text>
  <circle cx="180" cy="86" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="180" y="91" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <circle cx="290" cy="70" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="75" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <circle cx="400" cy="86" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="400" y="91" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <!-- edges -->
  <path d="M 196 82 L 274 72" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 194 92 L 384 88" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 306 74 L 384 84" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- indeg badges -->
  <circle cx="194" cy="74" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="194" y="78" text-anchor="middle" font-size="9" fill="#444" font-weight="bold">0</text>
  <circle cx="304" cy="58" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="304" y="62" text-anchor="middle" font-size="9" fill="#444" font-weight="bold">1</text>
  <circle cx="414" cy="74" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="414" y="78" text-anchor="middle" font-size="9" fill="#444" font-weight="bold">2</text>

  <!-- ===== Table ===== -->
  <!-- header -->
  <rect x="40" y="120" width="480" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="70"  y="137" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">步骤</text>
  <text x="135" y="137" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">队列</text>
  <text x="210" y="137" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">弹出 u</text>
  <text x="290" y="137" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">org[i]</text>
  <text x="390" y="137" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">入度变化</text>
  <text x="485" y="137" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i</text>
  <!-- column separators -->
  <line x1="100" y1="120" x2="100" y2="288" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="170" y1="120" x2="170" y2="288" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="250" y1="120" x2="250" y2="288" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="330" y1="120" x2="330" y2="288" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="450" y1="120" x2="450" y2="288" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 0: 初始 -->
  <rect x="40" y="146" width="480" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="70"  y="164" text-anchor="middle" font-size="11" fill="#888">初始</text>
  <text x="135" y="164" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[1]</text>
  <text x="210" y="164" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="290" y="164" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="390" y="164" text-anchor="middle" font-size="11" fill="#555">1:0  2:1  3:2</text>
  <text x="485" y="164" text-anchor="middle" font-size="11" fill="#555">0</text>

  <!-- row 1 -->
  <rect x="40" y="172" width="480" height="26" fill="#fffce8" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="70"  y="190" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="135" y="190" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[1]</text>
  <text x="210" y="190" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <text x="290" y="190" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1 ✓</text>
  <text x="390" y="190" text-anchor="middle" font-size="11" fill="#555">2:0↓  3:1↓</text>
  <text x="485" y="190" text-anchor="middle" font-size="11" fill="#555">1</text>

  <!-- row 2 -->
  <rect x="40" y="198" width="480" height="26" fill="#fffce8" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="70"  y="216" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="135" y="216" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[2]</text>
  <text x="210" y="216" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>
  <text x="290" y="216" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2 ✓</text>
  <text x="390" y="216" text-anchor="middle" font-size="11" fill="#555">3:0↓</text>
  <text x="485" y="216" text-anchor="middle" font-size="11" fill="#555">2</text>

  <!-- row 3 -->
  <rect x="40" y="224" width="480" height="26" fill="#fffce8" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="70"  y="242" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="135" y="242" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[3]</text>
  <text x="210" y="242" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3</text>
  <text x="290" y="242" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3 ✓</text>
  <text x="390" y="242" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="485" y="242" text-anchor="middle" font-size="11" fill="#555">3</text>

  <!-- bottom note -->
  <rect x="40" y="262" width="480" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="282" text-anchor="middle" font-size="11" fill="#333">每步队列恰 1 个节点（size==1）→ 拓扑序唯一</text>
  <text x="280" y="294" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">i = 3 = n，弹出顺序 [1,2,3] = org ⇒ return true</text>
</svg>
