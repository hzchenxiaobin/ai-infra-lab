<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：邻居是行/列上的连续区间</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">从 (i,j) 向右可达行 i 上 [j+1, j+g] 一段，向下可达列 j 上 [i+1, i+g] 一块</text>

  <!-- ===== 4x4 grid, cell 54x54, start x=150, y=72 ===== -->
  <!-- col labels -->
  <g font-size="9" fill="#888">
    <text x="177" y="66" text-anchor="middle">j=0</text>
    <text x="231" y="66" text-anchor="middle">1</text>
    <text x="285" y="66" text-anchor="middle">2</text>
    <text x="339" y="66" text-anchor="middle">3</text>
  </g>
  <!-- row labels -->
  <g font-size="9" fill="#888">
    <text x="142" y="105" text-anchor="end">i=0</text>
    <text x="142" y="159" text-anchor="end">1</text>
    <text x="142" y="213" text-anchor="end">2</text>
    <text x="142" y="267" text-anchor="end">3</text>
  </g>

  <!-- rightward bracket above row0 cols1..3 -->
  <path d="M 231 56 L 231 50 L 339 50 L 339 56" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="285" y="44" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">向右 [j+1, j+g]</text>

  <!-- downward bracket left of col0 rows1..3 -->
  <path d="M 148 153 L 142 153 L 142 267 L 148 267" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="124" y="213" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" transform="rotate(-90 124 213)">向下 [i+1, i+g]</text>

  <!-- cells -->
  <g font-size="14">
    <!-- row0 -->
    <rect x="150" y="72" width="54" height="54" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
    <text x="177" y="104" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
    <text x="177" y="118" text-anchor="middle" font-size="8" fill="#b85450">(i,j)</text>

    <rect x="204" y="72" width="54" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
    <text x="231" y="104" text-anchor="middle" fill="#4a7a3a">·</text>
    <rect x="258" y="72" width="54" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
    <text x="285" y="104" text-anchor="middle" fill="#4a7a3a">·</text>
    <rect x="312" y="72" width="54" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
    <text x="339" y="104" text-anchor="middle" fill="#4a7a3a">·</text>

    <!-- row1 -->
    <rect x="150" y="126" width="54" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
    <text x="177" y="158" text-anchor="middle" fill="#d6a040">·</text>
    <rect x="204" y="126" width="54" height="54" fill="#f0f0f0" stroke="#aaa" stroke-width="1" rx="5" filter="url(#rough2)"/>
    <rect x="258" y="126" width="54" height="54" fill="#f0f0f0" stroke="#aaa" stroke-width="1" rx="5" filter="url(#rough2)"/>
    <rect x="312" y="126" width="54" height="54" fill="#f0f0f0" stroke="#aaa" stroke-width="1" rx="5" filter="url(#rough2)"/>

    <!-- row2 -->
    <rect x="150" y="180" width="54" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
    <text x="177" y="212" text-anchor="middle" fill="#d6a040">·</text>
    <rect x="204" y="180" width="54" height="54" fill="#f0f0f0" stroke="#aaa" stroke-width="1" rx="5" filter="url(#rough2)"/>
    <rect x="258" y="180" width="54" height="54" fill="#f0f0f0" stroke="#aaa" stroke-width="1" rx="5" filter="url(#rough2)"/>
    <rect x="312" y="180" width="54" height="54" fill="#f0f0f0" stroke="#aaa" stroke-width="1" rx="5" filter="url(#rough2)"/>

    <!-- row3 -->
    <rect x="150" y="234" width="54" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
    <text x="177" y="266" text-anchor="middle" fill="#d6a040">·</text>
    <rect x="204" y="234" width="54" height="54" fill="#f0f0f0" stroke="#aaa" stroke-width="1" rx="5" filter="url(#rough2)"/>
    <rect x="258" y="234" width="54" height="54" fill="#f0f0f0" stroke="#aaa" stroke-width="1" rx="5" filter="url(#rough2)"/>
    <rect x="312" y="234" width="54" height="54" fill="#f0f0f0" stroke="#aaa" stroke-width="1" rx="5" filter="url(#rough2)"/>
  </g>

  <!-- arrows from (0,0): right & down -->
  <path d="M 206 99 L 312 99" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <path d="M 177 128 L 177 234" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrO)" fill="none" filter="url(#rough2)"/>

  <text x="259" y="93" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">向右 g=3 步</text>
  <text x="168" y="185" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold" transform="rotate(-90 168 185)">向下 g 步</text>

  <!-- legend -->
  <g font-size="10">
    <rect x="392" y="80" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="412" y="91" fill="#444">起点 (i,j)</text>
    <rect x="392" y="102" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="412" y="113" fill="#444">向右可达</text>
    <rect x="392" y="124" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="412" y="135" fill="#444">向下可达</text>
  </g>

  <!-- ===== Bottom: DSU skip concept ===== -->
  <text x="40" y="318" font-size="11" fill="#446688" font-weight="bold">并查集跳表：find(c) 跳过已访问列，直达下个未访问</text>

  <!-- row of cols: 0..4, representing row i; cols 1,2 visited -->
  <g font-size="13">
    <rect x="60" y="334" width="56" height="40" fill="#f0f0f0" stroke="#aaa" stroke-width="1.1" rx="5" filter="url(#rough2)"/>
    <text x="88" y="360" text-anchor="middle" fill="#999">j</text>
    <text x="88" y="386" text-anchor="middle" font-size="9" fill="#888">起点列</text>

    <rect x="128" y="334" width="56" height="40" fill="#eee" stroke="#bbb" stroke-width="1.1" stroke-dasharray="4 3" rx="5" filter="url(#rough2)"/>
    <text x="156" y="360" text-anchor="middle" fill="#bbb">✓</text>
    <text x="156" y="386" text-anchor="middle" font-size="9" fill="#888">已访问</text>

    <rect x="196" y="334" width="56" height="40" fill="#eee" stroke="#bbb" stroke-width="1.1" stroke-dasharray="4 3" rx="5" filter="url(#rough2)"/>
    <text x="224" y="360" text-anchor="middle" fill="#bbb">✓</text>
    <text x="224" y="386" text-anchor="middle" font-size="9" fill="#888">已访问</text>

    <rect x="264" y="334" width="56" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
    <text x="292" y="360" text-anchor="middle" fill="#4a7a3a" font-weight="bold">k</text>
    <text x="292" y="386" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">未访问⭐</text>

    <rect x="332" y="334" width="56" height="40" fill="#f7f7f7" stroke="#ccc" stroke-width="1" rx="5" filter="url(#rough2)"/>
    <text x="360" y="360" text-anchor="middle" fill="#ccc">n</text>
    <text x="360" y="386" text-anchor="middle" font-size="9" fill="#aaa">哨兵</text>
  </g>

  <!-- pointer chain: parent[1]->2, parent[2]->3 (small arrows under visited) -->
  <path d="M 156 378 L 220 378" stroke="#aaa" stroke-width="1.2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 224 378 L 288 378" stroke="#aaa" stroke-width="1.2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="250" y="372" text-anchor="middle" font-size="8" fill="#aaa">链向下一个</text>

  <!-- big find(1) jump in red -->
  <path d="M 156 332 Q 224 304 292 332" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="224" y="300" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">find(j+1) = k</text>
  <text x="224" y="314" text-anchor="middle" font-size="9" fill="#b85450">一路折叠，跳过已访问段</text>

  <text x="408" y="356" font-size="10" fill="#446688">每个已访问列 c</text>
  <text x="408" y="372" font-size="10" fill="#446688">令 parent[c]=find(c+1)</text>
  <text x="408" y="392" font-size="10" fill="#b85450" font-weight="bold">→ find 均摊 O(α)</text>
</svg>
