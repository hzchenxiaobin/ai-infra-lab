<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：用第一个项目的完成时刻 f 切分第二列表</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">第一项目尽早开始 ⇒ f = s₁ + d₁；第二列表按 start 排序后被 f 一分为二</text>

  <path d="M 60 112 L 445 112" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="466" y="116" font-size="10.5" fill="#446688" filter="url(#rough2)">时间</text>

  <path d="M 230 74 L 230 142" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="230" y="66" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">f = s₁ + d₁</text>

  <text x="162" y="90" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">已开放（start ≤ f）</text>
  <text x="340" y="90" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">未开放（start &gt; f）</text>

  <circle cx="111" cy="112" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="111" y="115.5" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="111" y="134" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">d=5</text>
  <circle cx="179" cy="112" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="179" y="115.5" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="179" y="134" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">d=2</text>
  <circle cx="213" cy="112" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="213" y="115.5" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="213" y="134" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">d=8</text>

  <circle cx="264" cy="112" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="264" y="115.5" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">12</text>
  <text x="264" y="134" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">d=6</text>
  <circle cx="366" cy="112" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="366" y="115.5" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">18</text>
  <text x="366" y="134" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">d=1</text>
  <circle cx="400" cy="112" r="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="400" y="115.5" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">20</text>
  <text x="400" y="134" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">d=4</text>

  <rect x="28" y="150" width="212" height="112" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="134" y="170" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">已开放组 start ≤ f</text>
  <text x="134" y="189" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">f 时刻已开门 → 立即上车</text>
  <text x="134" y="205" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">完成 = f + d，只由 d 决定</text>
  <text x="134" y="221" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">→ 取前缀最小 duration</text>
  <text x="134" y="242" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">候选① = f + preMinDur[lo]</text>
  <text x="134" y="256" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">例：min(5,2,8)=2 ⇒ f+2</text>

  <rect x="280" y="150" width="212" height="112" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="386" y="170" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">未开放组 start &gt; f</text>
  <text x="386" y="189" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">只能等门开，开门即玩</text>
  <text x="386" y="205" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">完成 = s + d，与 f 无关</text>
  <text x="386" y="221" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">→ 取后缀最小 finish</text>
  <text x="386" y="242" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">候选② = sufMinFin[lo+1]</text>
  <text x="386" y="256" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">例：min(18,19,24)=18</text>

  <rect x="50" y="282" width="420" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="302" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">本方向候选 = min(候选①, 候选②)</text>
  <text x="260" y="322" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">交换 land ↔ water 再跑一遍，答案 = 两个方向的全局最小</text>

  <text x="260" y="350" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">⚠️ 推迟第一个项目只会让 f 变大 ⇒ 没有理由不在 s₁ 时刻就开玩</text>
</svg>
