<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="480" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：带符号化 → PARTITION 分窗 → ORDER 定向 → 滚动累加</text>

  <!-- Step 1 -->
  <rect x="40" y="50" width="520" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="56" y="72" font-size="12" fill="#446688" font-weight="bold">① 带符号化：CASE WHEN type='Deposit' THEN amount ELSE -amount END</text>
  <text x="56" y="90" font-size="10.5" fill="#555">存入取正、取出取负，统一成「净流入」列（type 是 ENUM，无第三值，ELSE 安全）</text>
  <text x="56" y="104" font-size="9.5" fill="#888">+2000 / −1000 / +3000 / −5000 / +7000 / −7000</text>

  <path d="M 300 110 L 300 128" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="40" y="132" width="520" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="56" y="154" font-size="12" fill="#4a7a3a" font-weight="bold">② PARTITION BY account_id：按账户分窗，互不干扰</text>
  <text x="56" y="172" font-size="10.5" fill="#555">账户 1 的窗口与账户 2 独立；累加器在账户边界自动清零（不压缩行，每行仍输出）</text>

  <path d="M 300 186 L 300 204" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="40" y="208" width="520" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="56" y="230" font-size="12" fill="#d6a040" font-weight="bold">③ ORDER BY day：窗内按日期升序，默认 frame = 起点到当前行（含）</text>
  <text x="56" y="248" font-size="10.5" fill="#555">带 ORDER BY 后 frame 自动变为 RANGE UNBOUNDED PRECEDING → CURRENT ROW</text>
  <text x="56" y="264" font-size="9.5" fill="#888">⚠️ 去掉 ORDER BY 会变成全窗总额（每行相同值）——想累计必须带 ORDER BY</text>

  <path d="M 300 278 L 300 296" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4 -->
  <rect x="40" y="300" width="520" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="56" y="322" font-size="12" fill="#b85450" font-weight="bold">④ SUM(带符号列) OVER (②+③)：一趟有序扫描，维护累加器边走边输出</text>
  <text x="56" y="340" font-size="10.5" fill="#555">账户 1：2000 → 1000 → 4000 → −1000；账户 2：7000 → 0（窗口切换时清零）</text>
  <text x="56" y="354" font-size="9.5" fill="#888">优化器走排序 O(n log n) + 单趟扫描 O(n)，远优于相关子查询的 O(n²)</text>

  <path d="M 300 360 L 300 378" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Output -->
  <rect x="150" y="382" width="300" height="86" fill="#fafafa" stroke="#666" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="400" text-anchor="middle" font-size="10.5" fill="#888">输出结果（ORDER BY account_id, day）</text>
  <line x1="160" y1="406" x2="440" y2="406" stroke="#888" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="165" y="420" font-size="9.5" fill="#888">account_id</text>
  <text x="245" y="420" font-size="9.5" fill="#888">day</text>
  <text x="360" y="420" font-size="9.5" fill="#888">balance</text>
  <text x="170" y="436" font-size="10" fill="#333">1</text><text x="245" y="436" font-size="10" fill="#333">11-07</text><text x="365" y="436" font-size="10" fill="#b85450" font-weight="bold">2000</text>
  <text x="170" y="450" font-size="10" fill="#333">1</text><text x="245" y="450" font-size="10" fill="#333">11-13</text><text x="365" y="450" font-size="10" fill="#b85450" font-weight="bold">−1000</text>
  <text x="170" y="464" font-size="10" fill="#333">2</text><text x="245" y="464" font-size="10" fill="#333">12-12</text><text x="365" y="464" font-size="10" fill="#b85450" font-weight="bold">0</text>
</svg>
