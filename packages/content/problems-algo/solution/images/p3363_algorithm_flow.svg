<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="18" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：一次对角线求和 ＋ 两趟楔形 DP（B 与 C 共用同一函数）</text>
  <text x="260" y="34" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">C 的问题 = 矩阵转置后 B 的问题，原地转置再跑一遍即可</text>
  <ellipse cx="144.0" cy="52" rx="40" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="144.0" y="56" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M 144.0 67 L 144.0 80" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="36" y="82" width="216" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="144.0" y="101" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① ans = Σ fruits[i][i]</text>
  <text x="144.0" y="117" text-anchor="middle" font-size="8.8" fill="#555" filter="url(#rough2)">A 被钉死在主对角线，贡献固定</text>
  <path d="M 144.0 126 L 144.0 144" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="36" y="146" width="216" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="144.0" y="165" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 楔形 DP 求 bestB</text>
  <text x="144.0" y="181" text-anchor="middle" font-size="8.8" fill="#555" filter="url(#rough2)">B 从 (0, n−1) 出发逐行下行</text>
  <path d="M 144.0 190 L 144.0 208" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="36" y="210" width="216" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="144.0" y="229" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">③ 矩阵原地转置</text>
  <text x="144.0" y="245" text-anchor="middle" font-size="8.8" fill="#555" filter="url(#rough2)">沿主对角线 swap，O(n²) 但常数极小</text>
  <path d="M 144.0 254 L 144.0 272" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="36" y="274" width="216" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="144.0" y="293" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">④ 楔形 DP 求 bestC</text>
  <text x="144.0" y="309" text-anchor="middle" font-size="8.8" fill="#555" filter="url(#rough2)">同一函数对转置矩阵再跑一遍</text>
  <path d="M 144.0 318 L 144.0 336" fill="none" stroke="#a07830" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="36" y="338" width="216" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="144.0" y="357" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">⑤ 返回 ans ＋ bestB ＋ bestC</text>
  <text x="144.0" y="373" text-anchor="middle" font-size="8.8" fill="#8a4440" filter="url(#rough2)">不重不漏：对角线水果只在 A 段计一次</text>
  <rect x="284" y="82" width="224" height="232" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="396.0" y="100" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">楔形 DP 细节（B 与 C 共用）</text>
  <text x="298" y="120" text-anchor="start" font-size="9.2" fill="#555" filter="url(#rough2)">dp[0][n−1] = g[0][n−1]</text>
  <text x="298" y="137" text-anchor="start" font-size="9.2" fill="#555" filter="url(#rough2)">for i = 1 … n−1:</text>
  <text x="298" y="154" text-anchor="start" font-size="9.2" fill="#a07830" filter="url(#rough2)">    lo = max(i, n−1−i)</text>
  <text x="298" y="171" text-anchor="start" font-size="9.2" fill="#555" filter="url(#rough2)">    for j = lo … n−1:</text>
  <text x="298" y="188" text-anchor="start" font-size="9.2" fill="#555" filter="url(#rough2)">        best = max(dp[i−1][j−1..j+1])</text>
  <text x="298" y="205" text-anchor="start" font-size="9.2" fill="#555" filter="url(#rough2)">        val = g[i][j]   (j > i)</text>
  <text x="298" y="222" text-anchor="start" font-size="9.2" fill="#b85450" filter="url(#rough2)">            = 0        (j = i，归 A)</text>
  <text x="298" y="239" text-anchor="start" font-size="9.2" fill="#555" filter="url(#rough2)">        dp[i][j] = best + val</text>
  <text x="298" y="256" text-anchor="start" font-size="9.2" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 dp[n−1][n−1]</text>
  <text x="298" y="292" text-anchor="start" font-size="8.5" fill="#888" filter="url(#rough2)">行左边界 lo 内的格子才可能出现在</text>
  <text x="298" y="305" text-anchor="start" font-size="8.5" fill="#888" filter="url(#rough2)">合法路径上 —— 区外格子直接不枚举</text>
  <rect x="284" y="326" width="224" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="296" y="344" text-anchor="start" font-size="9.2" fill="#a07830" filter="url(#rough2)">复杂度：楔形约 n²/4 个格子 × 每格 3 个前驱</text>
  <text x="296" y="359" text-anchor="start" font-size="9.2" fill="#a07830" filter="url(#rough2)">两趟合计 O(n²)；dp 按行滚动成一维 →</text>
  <text x="296" y="374" text-anchor="start" font-size="9.2" fill="#a07830" font-weight="bold" filter="url(#rough2)">额外空间仅 O(n)</text>
</svg>
