<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">算法流程：写操作统一「查旧 → 删旧键 → 写新」，查询取最大元</text>

  <!-- Left column: write ops -->
  <rect x="35" y="42" width="210" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="61" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">写操作：add / update / remove</text>

  <path d="M 140 72 L 140 86" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="35" y="90" width="210" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="140" y="110" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">① 查哈希 amt[itemId][userId]</text>
  <text x="140" y="128" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">得旧出价 old（O(1)，add 新用户则无）</text>

  <path d="M 140 138 L 140 152" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="35" y="156" width="210" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="140" y="176" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">② 有 old ⇒ bids[itemId]</text>
  <text x="140" y="194" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">erase((old, userId)) —— 删旧键</text>

  <path d="M 140 204 L 140 218" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <polygon points="140,222 205,252 140,282 75,252" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="256" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">removeBid?</text>

  <!-- 是 → erase -->
  <text x="48" y="296" font-size="10" fill="#446688" filter="url(#rough2)">是</text>
  <path d="M 75 252 L 60 252 L 60 296" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="14" y="300" width="122" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="75" y="320" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">③a amt[itemId]</text>
  <text x="75" y="338" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">erase(userId)</text>

  <!-- 否 → replace -->
  <text x="222" y="296" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <path d="M 205 252 L 225 252 L 225 296" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="156" y="300" width="138" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="225" y="318" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">③b amt[u] = a</text>
  <text x="225" y="336" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">bids 插新键 (a, u)</text>

  <path d="M 75 348 L 75 372 L 128 372" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 225 348 L 225 372 L 172 372" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="45" y="376" width="190" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="395" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">单次写操作 O(log n)</text>

  <!-- Right column: getHighestBidder -->
  <rect x="290" y="42" width="200" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="61" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">getHighestBidder(itemId)</text>

  <path d="M 390 72 L 390 88" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="390,92 465,128 390,164 315,128" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="390" y="124" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">bids[itemId]</text>
  <text x="390" y="140" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">存在且非空？</text>

  <!-- 否 → -1 -->
  <text x="399" y="180" font-size="10" fill="#b85450" filter="url(#rough2)">否（无任何出价）</text>
  <path d="M 390 164 L 390 188" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="310" y="192" width="160" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="390" y="213" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">return −1</text>

  <!-- 是 → max -->
  <text x="470" y="112" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 465 128 L 485 128 L 485 250 L 458 250" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="290" y="228" width="168" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="374" y="247" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">return 最大元的 userId</text>
  <text x="374" y="264" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">rbegin() O(1) / SortedList[-1]</text>

  <rect x="290" y="292" width="200" height="70" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="390" y="312" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">最大元 = (最高金额, 并列最大 userId)</text>
  <text x="390" y="330" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">平局规则由字典序白送，零特判</text>
  <text x="390" y="348" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">哈希表管定位，有序集合管名次</text>

  <text x="260" y="420" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">5×10⁴ 次操作 × O(log n) ≈ 8×10⁵ 次运算，瞬间出解</text>
</svg>
