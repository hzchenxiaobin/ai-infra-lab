<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold" filter="url(#rough2)">自底向上剥叶：翻不翻由叶子被迫决定，影响异或上传</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">示例 2（n = 7）：红节点 = 初始失配（diff = 1），蓝节点 = diff = 0</text>

  <!-- ============ 树（以 0 为根） ============ -->
  <!-- 边（红 = 被迫要翻的边） -->
  <g filter="url(#rough2)">
    <line x1="120" y1="93"  x2="120" y2="123" stroke="#446688" stroke-width="1.5"/>
    <line x1="113" y1="151" x2="93"  y2="185" stroke="#b85450" stroke-width="2.5"/>
    <line x1="201" y1="164" x2="134" y2="143" stroke="#b85450" stroke-width="2.5"/>
    <line x1="85"  y1="213" x2="85"  y2="243" stroke="#b85450" stroke-width="2.5"/>
    <line x1="78"  y1="271" x2="62"  y2="305" stroke="#446688" stroke-width="1.5"/>
    <line x1="96"  y1="268" x2="144" y2="308" stroke="#446688" stroke-width="1.5"/>
  </g>

  <!-- 边下标徽章 -->
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle">
    <rect x="125" y="100" width="24" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="137" y="112" fill="#33506b">e0</text>
    <rect x="64"  y="155" width="24" height="16" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="76"  y="167" fill="#8a3030">e1</text>
    <rect x="160" y="174" width="24" height="16" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="172" y="186" fill="#8a3030">e5</text>
    <rect x="90"  y="220" width="24" height="16" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="102" y="232" fill="#8a3030">e2</text>
    <rect x="34"  y="283" width="24" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="46"  y="295" fill="#33506b">e3</text>
    <rect x="140" y="276" width="24" height="16" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="152" y="288" fill="#33506b">e4</text>
  </g>

  <!-- 节点 -->
  <g filter="url(#rough2)" font-size="12" text-anchor="middle">
    <circle cx="120" cy="78"  r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="120" cy="138" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="85"  cy="198" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="215" cy="168" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <circle cx="85"  cy="258" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <circle cx="55"  cy="318" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="155" cy="318" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="120" y="83"  fill="#33506b">0</text>
    <text x="120" y="143" fill="#33506b">1</text>
    <text x="85"  y="203" fill="#33506b">2</text>
    <text x="215" y="173" fill="#8a3030">6</text>
    <text x="85"  y="263" fill="#8a3030">3</text>
    <text x="55"  y="323" fill="#33506b">4</text>
    <text x="155" y="323" fill="#33506b">5</text>
  </g>

  <!-- 子树异或和绿标 -->
  <g filter="url(#rough2)" font-size="10.5" text-anchor="middle" fill="#2f5d24" font-weight="bold">
    <text x="58"  y="200">⊕1</text>
    <text x="114" y="252">⊕1</text>
    <text x="216" y="144">⊕1</text>
  </g>

  <!-- 图例 -->
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="128" y="354" fill="#b85450">红边 = 被迫要翻的边 → 答案 [1, 2, 5]</text>
    <text x="128" y="371" fill="#4a7a3a">绿标 ⊕1 = 该点子树 diff 的异或和</text>
  </g>

  <!-- ============ 右侧三步面板 ============ -->
  <g filter="url(#rough2)">
    <rect x="245" y="56" width="295" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="392" y="76" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold">① 叶子：唯一邻边 → 翻不翻被迫</text>
    <text x="392" y="95" text-anchor="middle" font-size="11" fill="#33506b">叶子 4、5 的 diff = 0 → e3、e4 不翻</text>
    <text x="392" y="111" text-anchor="middle" font-size="11" fill="#33506b">叶子 6 的 diff = 1 → e5 必翻</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="245" y="132" width="295" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="392" y="152" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold">② 剥叶上传：need[parent] ⊕= 1</text>
    <text x="392" y="171" text-anchor="middle" font-size="11" fill="#8a6d1a">3 号 need=1 → 翻 e2，2 号被带成 1</text>
    <text x="392" y="187" text-anchor="middle" font-size="11" fill="#8a6d1a">2 号 need=1 → 翻 e1，1 号又抵消回 0</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="245" y="208" width="295" height="78" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="392" y="228" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold">③ 树无环 → n−1 条边全被迫</text>
    <text x="392" y="247" text-anchor="middle" font-size="11" fill="#2f5d24">每条边翻不翻都被唯一确定：解若存在必唯一</text>
    <text x="392" y="264" text-anchor="middle" font-size="11" fill="#2f5d24">唯一解天然就是最短方案——</text>
    <text x="392" y="280" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold">「最少操作数」是白送的</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="245" y="300" width="295" height="88" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="392" y="321" text-anchor="middle" font-size="12" fill="#8a3030" font-weight="bold">无解 ⟺ 全体 diff 的异或和 = 1</text>
    <text x="392" y="340" text-anchor="middle" font-size="11" fill="#8a3030">每次操作恰好翻转 2 个节点，</text>
    <text x="392" y="357" text-anchor="middle" font-size="11" fill="#8a3030">失配节点数的奇偶性永远不变；</text>
    <text x="392" y="376" text-anchor="middle" font-size="11" fill="#8a3030">扫描到根时 need[0]=1 → 返回 [−1]</text>
  </g>
</svg>
