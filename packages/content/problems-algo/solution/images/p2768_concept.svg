<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2768c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：每个黑格至多属于 4 个 2×2 块</text>

  <!-- central black cell -->
  <text x="75" y="170" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">黑格</text>
  <rect x="40" y="180" width="74" height="74" fill="#333" stroke="#222" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="77" y="214" text-anchor="middle" font-size="15" fill="#fff" font-weight="bold">黑</text>
  <text x="77" y="234" text-anchor="middle" font-size="11" fill="#fff">(x, y)</text>

  <!-- 4 thumbnails: each a 2x2 block, black cell in a different corner -->
  <!-- A: block top-left (x, y), black at top-left -->
  <g filter="url(#rough2)">
    <rect x="300" y="110" width="52" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3"/>
    <line x1="326" y1="110" x2="326" y2="162" stroke="#446688" stroke-width="1"/>
    <line x1="300" y1="136" x2="352" y2="136" stroke="#446688" stroke-width="1"/>
    <rect x="300" y="110" width="26" height="26" fill="#333" stroke="#222" stroke-width="1.4" rx="2"/>
  </g>
  <text x="326" y="178" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">块(x, y) · 黑格在左上</text>

  <!-- B: block top-left (x-1, y), black at top-right -->
  <g filter="url(#rough2)">
    <rect x="392" y="110" width="52" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3"/>
    <line x1="418" y1="110" x2="418" y2="162" stroke="#4a7a3a" stroke-width="1"/>
    <line x1="392" y1="136" x2="444" y2="136" stroke="#4a7a3a" stroke-width="1"/>
    <rect x="418" y="110" width="26" height="26" fill="#333" stroke="#222" stroke-width="1.4" rx="2"/>
  </g>
  <text x="418" y="178" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">块(x−1, y) · 黑格在右上</text>

  <!-- C: block top-left (x, y-1), black at bottom-left -->
  <g filter="url(#rough2)">
    <rect x="300" y="202" width="52" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3"/>
    <line x1="326" y1="202" x2="326" y2="254" stroke="#d6a040" stroke-width="1"/>
    <line x1="300" y1="228" x2="352" y2="228" stroke="#d6a040" stroke-width="1"/>
    <rect x="300" y="228" width="26" height="26" fill="#333" stroke="#222" stroke-width="1.4" rx="2"/>
  </g>
  <text x="326" y="270" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">块(x, y−1) · 黑格在左下</text>

  <!-- D: block top-left (x-1, y-1), black at bottom-right -->
  <g filter="url(#rough2)">
    <rect x="392" y="202" width="52" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3"/>
    <line x1="418" y1="202" x2="418" y2="254" stroke="#b85450" stroke-width="1"/>
    <line x1="392" y1="228" x2="444" y2="228" stroke="#b85450" stroke-width="1"/>
    <rect x="418" y="228" width="26" height="26" fill="#333" stroke="#222" stroke-width="1.4" rx="2"/>
  </g>
  <text x="418" y="270" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">块(x−1, y−1) · 黑格在右下</text>

  <!-- arrows from black cell to each thumbnail -->
  <path d="M114,200 Q200,150 296,136" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr2768c)" filter="url(#rough2)"/>
  <path d="M114,210 Q200,160 388,136" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr2768c)" filter="url(#rough2)"/>
  <path d="M114,228 Q200,250 296,228" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr2768c)" filter="url(#rough2)"/>
  <path d="M114,238 Q200,260 388,228" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr2768c)" filter="url(#rough2)"/>

  <!-- bottom note -->
  <rect x="30" y="300" width="500" height="78" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">候选块左上角 ∈ {x−1, x} × {y−1, y}，至多 4 个；越界的候选直接丢弃</text>
  <text x="280" y="345" text-anchor="middle" font-size="11" fill="#446688">受影响块数 ≤ 4·|coordinates| ≪ (m−1)(n−1)，故只对受影响块用哈希表计数</text>
  <text x="280" y="365" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">块总数可达 10^10，但“有黑格的块”只有 O(|coordinates|) 个 → 这是稀疏的关键</text>
</svg>
