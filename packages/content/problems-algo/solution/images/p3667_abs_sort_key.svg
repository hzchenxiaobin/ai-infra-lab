<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：排序键 = 二元组 ( |x| , x )</text>

  <text x="260" y="50" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">nums = [3, −1, −4, 1, 5]，把每个元素 x 映射成键 ( |x| , x )</text>

  <!-- 输入行 -->
  <rect x="114" y="60" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="81" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="174" y="60" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="81" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">−1</text>
  <rect x="234" y="60" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="81" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">−4</text>
  <rect x="294" y="60" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="81" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="354" y="60" width="52" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="81" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>

  <!-- 映射箭头 -->
  <path d="M 140 92 L 140 108" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 200 92 L 200 108" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 260 92 L 260 108" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 320 92 L 320 108" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 380 92 L 380 108" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 键行 -->
  <rect x="114" y="112" width="52" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="137" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(3, 3)</text>
  <rect x="174" y="112" width="52" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="137" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(1, −1)</text>
  <rect x="234" y="112" width="52" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="137" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(4, −4)</text>
  <rect x="294" y="112" width="52" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="137" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(1, 1)</text>
  <rect x="354" y="112" width="52" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="137" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(5, 5)</text>

  <text x="260" y="170" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">按键的字典序排序：主键 |x|，次键 x</text>

  <path d="M 260 176 L 260 186" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 排序后的键行（前两个为并列，红色强调） -->
  <rect x="114" y="190" width="52" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="215" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(1, −1)</text>
  <rect x="174" y="190" width="52" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="215" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(1, 1)</text>
  <rect x="234" y="190" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="215" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(3, 3)</text>
  <rect x="294" y="190" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="215" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(4, −4)</text>
  <rect x="354" y="190" width="52" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="215" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">(5, 5)</text>

  <text x="260" y="248" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">红色两个主键并列（|−1| = |1| = 1）→ 次键 −1 &lt; 1 定先后</text>

  <path d="M 260 254 L 260 264" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结果行 -->
  <rect x="114" y="270" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="291" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">−1</text>
  <rect x="174" y="270" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="291" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="234" y="270" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="291" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="294" y="270" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="291" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">−4</text>
  <rect x="354" y="270" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="291" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">5</text>

  <text x="260" y="326" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">💡 只用单键 |x| 时，并列顺序随排序的「稳定性」漂移（C++ sort 不稳定 / Python sorted 稳定）</text>
  <text x="260" y="344" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">双键 ( |x| , x ) 把并列顺序钉死，结果与语言无关；示例 2 同理：(100,−100) &lt; (100,100)</text>
</svg>
