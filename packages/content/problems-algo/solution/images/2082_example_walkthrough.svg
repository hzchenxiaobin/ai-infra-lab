<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：逐账单判定</text>

  <!-- ===== Table ===== -->
  <!-- Header row -->
  <rect x="30" y="40" width="520" height="28" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="58" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">bill_id</text>
  <text x="160" y="58" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">customer_id</text>
  <text x="260" y="58" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">amount</text>
  <text x="360" y="58" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">amount &gt; 500?</text>
  <text x="480" y="58" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">富客户?</text>

  <!-- Column separators -->
  <line x1="110" y1="40" x2="110" y2="260" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="210" y1="40" x2="210" y2="260" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="310" y1="40" x2="310" y2="260" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="410" y1="40" x2="410" y2="260" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1: bill 6, cust 1, 549 → rich -->
  <rect x="30" y="68" width="520" height="36" fill="#fce4ec" stroke="#eee" stroke-width="1" filter="url(#rough2)" opacity="0.6"/>
  <text x="70" y="90" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">6</text>
  <text x="160" y="90" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <text x="260" y="90" text-anchor="middle" font-size="10" fill="#555">549</text>
  <text x="360" y="90" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="480" y="90" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✓</text>

  <!-- Row 2: bill 8, cust 1, 834 → rich -->
  <rect x="30" y="104" width="520" height="36" fill="#fce4ec" stroke="#eee" stroke-width="1" filter="url(#rough2)" opacity="0.6"/>
  <text x="70" y="126" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">8</text>
  <text x="160" y="126" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1</text>
  <text x="260" y="126" text-anchor="middle" font-size="10" fill="#555">834</text>
  <text x="360" y="126" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="480" y="126" text-anchor="middle" font-size="9" fill="#999">同 cust 1，去重</text>

  <!-- Row 3: bill 4, cust 2, 394 → not rich -->
  <rect x="30" y="140" width="520" height="36" fill="#fff" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="162" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">4</text>
  <text x="160" y="162" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">2</text>
  <text x="260" y="162" text-anchor="middle" font-size="10" fill="#555">394</text>
  <text x="360" y="162" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <text x="480" y="162" text-anchor="middle" font-size="11" fill="#999" font-weight="bold">✗</text>

  <!-- Row 4: bill 11, cust 3, 657 → rich -->
  <rect x="30" y="176" width="520" height="36" fill="#fce4ec" stroke="#eee" stroke-width="1" filter="url(#rough2)" opacity="0.6"/>
  <text x="70" y="198" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">11</text>
  <text x="160" y="198" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3</text>
  <text x="260" y="198" text-anchor="middle" font-size="10" fill="#555">657</text>
  <text x="360" y="198" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="480" y="198" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✓</text>

  <!-- Row 5: bill 13, cust 3, 257 → not rich -->
  <rect x="30" y="212" width="520" height="36" fill="#fff" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="70" y="234" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">13</text>
  <text x="160" y="234" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">3</text>
  <text x="260" y="234" text-anchor="middle" font-size="10" fill="#555">257</text>
  <text x="360" y="234" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <text x="480" y="234" text-anchor="middle" font-size="9" fill="#999">cust 3 仍富（有 657）</text>

  <!-- Table border -->
  <rect x="30" y="40" width="520" height="208" fill="none" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- ===== Summary ===== -->
  <rect x="30" y="262" width="520" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="280" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">判定逻辑</text>
  <text x="290" y="296" text-anchor="middle" font-size="9" fill="#666">① 行级过滤 amount &gt; 500 → 留 3 行富账单（bill 6, 8, 11）</text>
  <text x="290" y="310" text-anchor="middle" font-size="9" fill="#666">② 对 customer_id 去重 → {1, 3}（cust 1 有两张富账单，只计一次）</text>

  <!-- ===== Result ===== -->
  <rect x="180" y="338" width="220" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="356" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">rich_count</text>
  <line x1="200" y1="362" x2="380" y2="362" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="290" y="380" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- Notes -->
  <text x="60" y="406" font-size="8" fill="#b85450">红行：富账单（amount &gt; 500）</text>
  <text x="300" y="406" font-size="8" fill="#999">白行：普通账单（不贡献）</text>
  <text x="430" y="406" font-size="8" fill="#888">⚠ 549 &gt; 500 ✓</text>
</svg>
