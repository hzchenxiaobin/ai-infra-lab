<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2724c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arr2724o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">fn 是键提取器：把每个元素映射成可比较的数字</text>

  <!-- Row 1: arr elements -->
  <text x="36" y="86" font-size="11" fill="#888" font-weight="bold">① arr 元素</text>
  <rect x="120" y="60" width="80" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="160" y="85" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">[3,4]</text>
  <rect x="240" y="60" width="80" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="280" y="85" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">[5,2]</text>
  <rect x="360" y="60" width="80" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="400" y="85" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">[10,1]</text>

  <!-- fn arrows down -->
  <path d="M160,104 L160,128" stroke="#446688" stroke-width="1.6" marker-end="url(#arr2724c)" filter="url(#rough2)"/>
  <path d="M280,104 L280,128" stroke="#446688" stroke-width="1.6" marker-end="url(#arr2724c)" filter="url(#rough2)"/>
  <path d="M400,104 L400,128" stroke="#446688" stroke-width="1.6" marker-end="url(#arr2724c)" filter="url(#rough2)"/>
  <text x="470" y="120" font-size="11" fill="#446688" font-style="italic">fn(x) = x[1]</text>

  <!-- Row 2: extracted keys -->
  <text x="36" y="146" font-size="11" fill="#888" font-weight="bold">② 提取键</text>
  <rect x="120" y="132" width="80" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="160" y="154" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">4</text>
  <rect x="240" y="132" width="80" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="280" y="154" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">2</text>
  <rect x="360" y="132" width="80" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="400" y="154" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">1</text>

  <!-- big arrow: sort by key -->
  <path d="M280,170 L280,206" stroke="#d6a040" stroke-width="2.4" marker-end="url(#arr2724o)" filter="url(#rough2)"/>
  <text x="300" y="192" font-size="11" fill="#b85450" font-weight="bold">按键升序</text>

  <!-- Row 3: sorted keys -->
  <text x="36" y="232" font-size="11" fill="#888" font-weight="bold">③ 键排序</text>
  <rect x="120" y="210" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="160" y="232" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="240" y="210" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="280" y="232" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="360" y="210" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="400" y="232" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">4</text>

  <!-- element follows key arrow -->
  <path d="M160,246 L160,284" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arr2724c)" filter="url(#rough2)"/>
  <path d="M280,246 L280,284" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arr2724c)" filter="url(#rough2)"/>
  <path d="M400,246 L400,284" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arr2724c)" filter="url(#rough2)"/>
  <text x="470" y="270" font-size="11" fill="#4a7a3a" font-style="italic">元素跟随键</text>

  <!-- Row 4: output -->
  <text x="36" y="312" font-size="11" fill="#888" font-weight="bold">④ 输出</text>
  <rect x="120" y="290" width="80" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="160" y="315" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">[10,1]</text>
  <rect x="240" y="290" width="80" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="280" y="315" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">[5,2]</text>
  <rect x="360" y="290" width="80" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="400" y="315" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">[3,4]</text>

  <text x="280" y="356" text-anchor="middle" font-size="11" fill="#888">fn 不改元素本身，只决定谁该排前面</text>
</svg>
