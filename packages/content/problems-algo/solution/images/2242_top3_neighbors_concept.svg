<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
    <marker id="arro" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：固定中间边 (b,c)，每个节点只保留分数最高的 3 个邻居</text>

  <!-- ===== Upper: path a-b-c-d ===== -->
  <text x="310" y="56" text-anchor="middle" font-size="11" fill="#888">合法序列 = 长度 4 的简单路径 a − b − c − d（相邻有边、互异）</text>

  <!-- path nodes a b c d -->
  <ellipse cx="80" cy="110" rx="26" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="115" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <text x="80" y="148" text-anchor="middle" font-size="9" fill="#888">b 的邻居</text>

  <ellipse cx="220" cy="110" rx="26" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="220" y="115" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>

  <ellipse cx="400" cy="110" rx="26" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="400" y="115" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">c</text>

  <ellipse cx="540" cy="110" rx="26" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="540" y="115" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">d</text>
  <text x="540" y="148" text-anchor="middle" font-size="9" fill="#888">c 的邻居</text>

  <!-- edges a-b, c-d (normal) -->
  <path d="M 106 110 L 194 110" stroke="#888" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 426 110 L 514 110" stroke="#888" stroke-width="2" fill="none" filter="url(#rough2)"/>

  <!-- middle edge b-c (highlighted) -->
  <path d="M 246 110 L 374 110" stroke="#b85450" stroke-width="3" fill="none" filter="url(#rough2)"/>
  <text x="310" y="100" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">中间边 (b,c)</text>
  <text x="310" y="130" text-anchor="middle" font-size="9" fill="#b85450">枚举每条边作中间边</text>

  <!-- ===== Lower-left: node b's neighbors sorted, keep top 3 ===== -->
  <rect x="36" y="180" width="270" height="250" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="171" y="202" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">节点 b 的邻居按分数降序</text>

  <text x="60" y="228" font-size="10" fill="#888">邻居</text>
  <text x="160" y="228" font-size="10" fill="#888">score</text>
  <text x="252" y="228" font-size="10" fill="#888">保留?</text>

  <!-- row 1: kept -->
  <rect x="48" y="238" width="246" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="78" y="255" font-size="11" fill="#333" font-weight="bold">x₁</text>
  <text x="174" y="255" font-size="11" fill="#333">95</text>
  <text x="262" y="255" font-size="11" fill="#4a7a3a" font-weight="bold">✓ top1</text>

  <!-- row 2: kept -->
  <rect x="48" y="264" width="246" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="78" y="281" font-size="11" fill="#333" font-weight="bold">x₂</text>
  <text x="174" y="281" font-size="11" fill="#333">80</text>
  <text x="262" y="281" font-size="11" fill="#4a7a3a" font-weight="bold">✓ top2</text>

  <!-- row 3: kept -->
  <rect x="48" y="290" width="246" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="78" y="307" font-size="11" fill="#333" font-weight="bold">x₃</text>
  <text x="174" y="307" font-size="11" fill="#333">70</text>
  <text x="262" y="307" font-size="11" fill="#4a7a3a" font-weight="bold">✓ top3</text>

  <!-- cutoff line -->
  <path d="M 60 326 L 282 326" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5,3" fill="none" filter="url(#rough2)"/>
  <text x="290" y="330" font-size="9" fill="#b85450">截断</text>

  <!-- row 4: discarded -->
  <rect x="48" y="334" width="246" height="24" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="78" y="351" font-size="11" fill="#aaa">x₄</text>
  <text x="174" y="351" font-size="11" fill="#aaa">40</text>
  <text x="262" y="351" font-size="11" fill="#aaa">✗ 丢弃</text>

  <!-- row 5: discarded -->
  <rect x="48" y="360" width="246" height="24" fill="#f0f0f0" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="78" y="377" font-size="11" fill="#aaa">x₅</text>
  <text x="174" y="377" font-size="11" fill="#aaa">10</text>
  <text x="262" y="377" font-size="11" fill="#aaa">✗ 丢弃</text>

  <text x="171" y="412" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">只留前 3，其余不可能贡献更优解</text>

  <!-- ===== Lower-right: why 3 is enough ===== -->
  <rect x="330" y="180" width="256" height="250" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="458" y="202" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">为什么 3 个就够？</text>

  <!-- forbidden set for a -->
  <text x="350" y="232" font-size="11" fill="#333" font-weight="bold">选 a（b 的邻居）需避开：</text>
  <rect x="352" y="242" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="372" y="258" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">c</text>
  <rect x="398" y="242" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="418" y="258" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">d</text>
  <text x="448" y="258" font-size="10" fill="#888">≤ 2 个禁区</text>

  <!-- top3 vs 2 forbidden -->
  <text x="350" y="292" font-size="11" fill="#333">top3 候选里至多 2 个被禁</text>
  <rect x="352" y="302" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="369" y="318" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="390" y="302" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="407" y="318" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="428" y="302" width="34" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="445" y="318" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="472" y="318" font-size="11" fill="#4a7a3a" font-weight="bold">→ 必剩 ≥1 个可用</text>

  <!-- key formula -->
  <rect x="346" y="338" width="224" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="458" y="356" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3 候选 − 2 禁区 = ≥1 合法</text>
  <text x="458" y="372" text-anchor="middle" font-size="9" fill="#888">d 同理（避开 {a,b}），故 3 即充分</text>

  <!-- cost note -->
  <rect x="346" y="388" width="224" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="458" y="408" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">每条边枚举 3×3×2 = 18 组 → O(E)</text>
</svg>
