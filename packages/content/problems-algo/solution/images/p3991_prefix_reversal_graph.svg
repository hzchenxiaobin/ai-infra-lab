<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#778899"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：排列即节点、前缀反转即边 —— 8! 状态的隐式图 BFS</text>
  <text x="260" y="38" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">示例 1：nums = [2,0,1]，pre = [2,3] —— BFS 逐层扩展，第 2 层命中目标 [0,1,2]</text>

  <text x="48" y="74" text-anchor="middle" font-size="10.5" fill="#778899" font-weight="bold" filter="url(#rough2)">第 0 层</text>
  <text x="48" y="88" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">0 步</text>
  <text x="48" y="164" text-anchor="middle" font-size="10.5" fill="#778899" font-weight="bold" filter="url(#rough2)">第 1 层</text>
  <text x="48" y="178" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">1 步</text>
  <text x="48" y="254" text-anchor="middle" font-size="10.5" fill="#778899" font-weight="bold" filter="url(#rough2)">第 2 层</text>
  <text x="48" y="268" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">2 步</text>

  <rect x="216" y="58" width="88" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="260" y="78" text-anchor="middle" font-size="13" fill="#33507a" font-weight="bold" filter="url(#rough2)">2 0 1</text>
  <text x="260" y="92" text-anchor="middle" font-size="8.5" fill="#778899" filter="url(#rough2)">起点</text>

  <rect x="88" y="148" width="88" height="40" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="132" y="168" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">0 2 1</text>

  <rect x="344" y="148" width="88" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="388" y="168" text-anchor="middle" font-size="13" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">1 0 2</text>

  <rect x="88" y="238" width="88" height="40" rx="6" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="132" y="258" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">1 2 0</text>

  <rect x="344" y="238" width="88" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="388" y="258" text-anchor="middle" font-size="13" fill="#3a6a2a" font-weight="bold" filter="url(#rough2)">0 1 2</text>
  <text x="388" y="272" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">目标 ✓</text>

  <path d="M 232 100 L 158 146" fill="none" stroke="#778899" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="186" y="118" text-anchor="middle" font-size="9" fill="#778899" filter="url(#rough2)">反转前 2</text>

  <path d="M 288 100 L 362 146" fill="none" stroke="#d6a040" stroke-width="2.4" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="334" y="118" text-anchor="middle" font-size="9" fill="#a07020" font-weight="bold" filter="url(#rough2)">反转前 3</text>

  <path d="M 132 190 L 132 233" fill="none" stroke="#778899" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="124" y="216" text-anchor="end" font-size="9" fill="#778899" filter="url(#rough2)">反转前 3</text>

  <path d="M 388 190 L 388 233" fill="none" stroke="#b85450" stroke-width="2.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="398" y="216" text-anchor="start" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">反转前 2</text>

  <text x="132" y="292" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">rev 3 → 回到 [0,2,1]，已访问不入队</text>

  <rect x="30" y="300" width="460" height="52" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="316" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">n ≤ 8 ⟹ 状态总数 ≤ 8! = 40320，单位边权 BFS 首达即最少操作数</text>
  <text x="260" y="332" text-anchor="middle" font-size="9.5" fill="#7a5c1a" filter="url(#rough2)">红色路径：[2,0,1] —反转前 3→ [1,0,2] —反转前 2→ [0,1,2]，共 2 步 ✓</text>
  <text x="260" y="346" text-anchor="middle" font-size="9.5" fill="#7a5c1a" filter="url(#rough2)">队列耗尽仍未命中目标 ⟹ 返回 −1（不可排序，如示例 2）</text>
</svg>
