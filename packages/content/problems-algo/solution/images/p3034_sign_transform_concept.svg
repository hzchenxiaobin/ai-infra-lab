<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：差分符号化——把「相邻比较」翻译成「子串匹配」</text>

  <!-- nums row -->
  <text x="44" y="74" font-size="11.5" fill="#888" filter="url(#rough2)">nums =</text>
  <rect x="92" y="52" width="38" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="111" y="75" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="138" y="52" width="38" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="157" y="75" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="184" y="52" width="38" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="203" y="75" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="230" y="52" width="38" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="249" y="75" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="276" y="52" width="38" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="295" y="75" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="322" y="52" width="38" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="341" y="75" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="368" y="52" width="38" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="387" y="75" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="414" y="52" width="38" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="433" y="75" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- relation symbols under gaps -->
  <text x="134" y="106" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">&gt;</text>
  <text x="180" y="106" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">=</text>
  <text x="226" y="106" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">&lt;</text>
  <text x="272" y="106" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">&gt;</text>
  <text x="318" y="106" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">&gt;</text>
  <text x="364" y="106" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">=</text>
  <text x="410" y="106" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">&lt;</text>

  <!-- hit frames behind b boxes -->
  <rect x="110" y="108" width="140" height="46" fill="none" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <rect x="294" y="108" width="140" height="46" fill="none" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>

  <!-- b row -->
  <text x="76" y="134" font-size="11.5" fill="#888" filter="url(#rough2)">b =</text>
  <rect x="116" y="112" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="134" y="134" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="162" y="112" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="134" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="208" y="112" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="226" y="134" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">−1</text>
  <rect x="254" y="112" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="272" y="134" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="300" y="112" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="318" y="134" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="346" y="112" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="364" y="134" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="392" y="112" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="410" y="134" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">−1</text>

  <!-- b indices -->
  <text x="134" y="166" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="180" y="166" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="226" y="166" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="272" y="166" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="318" y="166" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">4</text>
  <text x="364" y="166" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">5</text>
  <text x="410" y="166" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">6</text>

  <!-- hit labels -->
  <text x="180" y="182" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 命中①</text>
  <text x="364" y="182" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 命中②</text>
  <text x="265" y="182" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">b[1..3]=[0,−1,1] ✗</text>

  <!-- pattern row -->
  <text x="44" y="216" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">pattern =</text>
  <rect x="116" y="194" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="134" y="216" text-anchor="middle" font-size="13" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="162" y="194" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="216" text-anchor="middle" font-size="13" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="208" y="194" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="226" y="216" text-anchor="middle" font-size="13" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">−1</text>
  <text x="278" y="216" font-size="11" fill="#555" filter="url(#rough2)">→ 在 b 中数 pattern 的出现次数</text>

  <!-- insight box -->
  <rect x="36" y="240" width="448" height="118" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="264" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① b[i] = sign(nums[i+1] − nums[i])：升 = 1、平 = 0、降 = −1，长度 n−1</text>
  <text x="260" y="288" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">② 子数组 nums[i..i+m] 匹配 ⟺ b[i..i+m−1] 与 pattern 逐位相等</text>
  <text x="260" y="312" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">③ 答案 = pattern 在 b 中的出现次数（允许重叠，本例 2 次 ✓）</text>
  <text x="260" y="336" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">④ 中间窗口 b[1..3] = [0,−1,1] ≠ pattern，不计数</text>

  <!-- bottom note -->
  <rect x="36" y="366" width="448" height="28" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="384" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">对比暴力：每个起点重算 m 对比较 O(n·m)；符号化后每对只算一次</text>
</svg>
