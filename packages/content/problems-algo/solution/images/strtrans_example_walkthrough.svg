<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#666" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算</text>

  <!-- ============ 示例 1：aabcc → ccdee = true ============ -->
  <rect x="20" y="44" width="560" height="200" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)" opacity="0.3"/>
  <text x="300" y="66" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">示例 1：str1="aabcc" , str2="ccdee" → true</text>
  <text x="300" y="84" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">映射 a→c, b→d, c→e（合法函数）| str2 用 {c,d,e} 3 个 < 26 | 逆拓扑序执行</text>

  <!-- 4 步转换卡片 -->
  <!-- 初始 -->
  <rect x="30" y="98" width="110" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="85" y="116" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">初始</text>
  <text x="85" y="136" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a a b c c</text>
  <text x="85" y="152" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">str1 原样</text>

  <line x1="142" y1="129" x2="158" y2="129" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤1: c→e -->
  <rect x="162" y="98" width="110" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="217" y="116" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">c → e</text>
  <text x="217" y="136" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a a b e e</text>
  <text x="217" y="152" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">先转 c：a 尚未变</text>

  <line x1="274" y1="129" x2="290" y2="129" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤2: b→d -->
  <rect x="294" y="98" width="110" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="349" y="116" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">b → d</text>
  <text x="349" y="136" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a a d e e</text>
  <text x="349" y="152" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">b 归位，不影响 c</text>

  <line x1="406" y1="129" x2="422" y2="129" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤3: a→c -->
  <rect x="426" y="98" width="110" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="481" y="116" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">a → c</text>
  <text x="481" y="136" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">c c d e e</text>
  <text x="481" y="152" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">a 归位 = str2 ✓</text>

  <!-- 说明 -->
  <rect x="40" y="176" width="520" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="300" y="194" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">关键：先转 c→e 再转 a→c —— 若先做 a→c，则 a 变 c 后被 c→e 误伤</text>

  <text x="300" y="224" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">|set(str2)| = 3 < 26 → 有空闲字符 → return true ✓</text>

  <!-- ============ 示例 2：aa → ab = false ============ -->
  <rect x="20" y="250" width="270" height="170" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)" opacity="0.3"/>
  <text x="155" y="272" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">示例 2：str1="aa" , str2="ab"</text>

  <text x="155" y="298" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">位置 0：a → a</text>
  <text x="155" y="316" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">位置 1：a → b  ✗</text>

  <rect x="44" y="332" width="222" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="155" y="350" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">a 已映到 a，又要求 a→b</text>
  <text x="155" y="366" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">批量替换无法分别处理</text>

  <text x="155" y="400" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">映射非函数 → return false</text>

  <!-- ============ 示例 3：ab → ba = true（环+空闲） ============ -->
  <rect x="310" y="250" width="270" height="170" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)" opacity="0.3"/>
  <text x="445" y="272" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">示例 3：str1="ab" , str2="ba"</text>

  <text x="445" y="298" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">映射 a→b, b→a（成环）</text>
  <text x="445" y="316" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">|set(str2)| = 2 < 26</text>

  <rect x="334" y="332" width="222" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="445" y="350" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">有空闲 x：a→x, b→a, x→b</text>
  <text x="445" y="366" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">逆拓扑序 + 断环</text>

  <text x="445" y="400" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">环可拆 → return true ✓</text>
</svg>
