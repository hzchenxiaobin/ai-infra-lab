<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：统计频次 → 按频次升序 → 贪心删小频次桶（每删一整桶少一种）</text>

  <!-- ============ Section 1: count frequency ============ -->
  <text x="40" y="58" font-size="12" fill="#446688" font-weight="bold">① 统计频次</text>
  <text x="40" y="73" font-size="10" fill="#888">HashMap 计数</text>

  <!-- arr label -->
  <text x="120" y="92" font-size="11" fill="#555">arr</text>

  <!-- arr cells: 4,3,1,1,3,3,2 -->
  <rect x="160" y="74" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="94" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">4</text>

  <rect x="202" y="74" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="222" y="94" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">3</text>

  <rect x="244" y="74" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="264" y="94" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">1</text>

  <rect x="286" y="74" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="306" y="94" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">1</text>

  <rect x="328" y="74" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="348" y="94" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">3</text>

  <rect x="370" y="74" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="390" y="94" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">3</text>

  <rect x="412" y="74" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="432" y="94" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">2</text>

  <!-- down arrow -->
  <path d="M 296 108 L 296 124" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- freq pairs: 4:1, 3:3, 1:2, 2:1 -->
  <rect x="170" y="126" width="74" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="207" y="144" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">4 → 1</text>

  <rect x="262" y="126" width="74" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="299" y="144" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">3 → 3</text>

  <rect x="354" y="126" width="74" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="391" y="144" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">1 → 2</text>

  <rect x="446" y="126" width="74" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="483" y="144" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">2 → 1</text>

  <!-- ============ Section 2+3: sort ascending + greedy removal ============ -->
  <text x="40" y="184" font-size="12" fill="#446688" font-weight="bold">② 按频次升序排列</text>
  <text x="40" y="199" font-size="10" fill="#888">频次小的先删</text>

  <text x="40" y="216" font-size="12" fill="#b85450" font-weight="bold">③ 贪心删除 k = 3</text>
  <text x="40" y="231" font-size="10" fill="#888">k ≥ 频次才整桶删</text>

  <!-- baseline -->
  <path d="M 140 332 L 540 332" stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- bar1: int 4, freq 1 (REMOVED) -->
  <rect x="160" y="304" width="56" height="28" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 168 308 L 208 332 M 208 308 L 168 332" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="188" y="296" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">频1</text>
  <text x="188" y="350" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">整数4</text>
  <text x="188" y="366" text-anchor="middle" font-size="10" fill="#b85450">k:3→2 ✗删</text>

  <!-- bar2: int 2, freq 1 (REMOVED) -->
  <rect x="252" y="304" width="56" height="28" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 260 308 L 300 332 M 300 308 L 260 332" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="280" y="296" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">频1</text>
  <text x="280" y="350" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">整数2</text>
  <text x="280" y="366" text-anchor="middle" font-size="10" fill="#b85450">k:2→1 ✗删</text>

  <!-- bar3: int 1, freq 2 (CANNOT, partial) -->
  <rect x="344" y="276" width="56" height="56" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="372" y="268" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">频2</text>
  <text x="372" y="350" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">整数1</text>
  <text x="372" y="366" text-anchor="middle" font-size="10" fill="#d6a040">k=1&lt;2 停</text>

  <!-- bar4: int 3, freq 3 (KEPT) -->
  <rect x="436" y="248" width="56" height="84" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="464" y="240" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">频3</text>
  <text x="464" y="350" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">整数3</text>
  <text x="464" y="366" text-anchor="middle" font-size="10" fill="#446688">✓留</text>

  <!-- arrow showing removal order -->
  <path d="M 188 376 Q 280 396 372 376" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="404" text-anchor="middle" font-size="10.5" fill="#b85450">删到第 3 桶：预算不足，停止</text>

  <!-- result note -->
  <rect x="60" y="416" width="520" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="320" y="436" text-anchor="middle" font-size="11.5" fill="#555">删完整桶 4、2（耗 k=2），第 3 桶需 2 但只剩 k=1</text>
  <text x="320" y="454" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">剩余不同整数 = {1, 3} → 答案 2</text>
</svg>
