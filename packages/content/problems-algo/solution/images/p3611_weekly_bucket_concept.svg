<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：日期归到「周一锚点」，(员工, 周) 分桶求和</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">归周公式：DATE_SUB(d, INTERVAL WEEKDAY(d) DAY) → d 所在周的周一</text>

  <text x="26" y="68" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">员工 1（Alice）：每周都超 20h</text>

  <rect x="20" y="76" width="140" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="93" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">06-05（一）· 8h</text>

  <rect x="20" y="106" width="140" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="123" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">06-06（二）· 6h</text>

  <rect x="20" y="136" width="140" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="153" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">06-07（三）· 7h</text>

  <rect x="20" y="166" width="140" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="183" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">06-12（一）· 12h</text>

  <rect x="20" y="196" width="140" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="213" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">06-13（二）· 9h</text>

  <rect x="214" y="84" width="168" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="298" y="106" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">周 06-05 ~ 06-11</text>
  <text x="298" y="126" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8+6+7 = 21h &gt; 20 ✅</text>

  <rect x="214" y="170" width="168" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="298" y="192" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">周 06-12 ~ 06-18</text>
  <text x="298" y="212" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">12+9 = 21h &gt; 20 ✅</text>

  <path d="M 160 89 Q 188 92 212 100" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>
  <path d="M 160 119 Q 188 116 212 110" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>
  <path d="M 160 149 Q 188 136 212 120" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>
  <path d="M 160 179 Q 188 182 212 190" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>
  <path d="M 160 209 Q 188 204 212 198" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>

  <rect x="404" y="112" width="100" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="454" y="134" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Alice</text>
  <text x="454" y="154" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">密集周 2 个</text>
  <text x="454" y="174" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">≥ 2 → 保留 ✓</text>

  <path d="M 382 112 Q 394 126 402 140" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>
  <path d="M 382 198 Q 394 184 402 164" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>

  <path d="M 30 240 L 490 240" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="8 6" filter="url(#rough2)"/>

  <text x="26" y="264" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">员工 2（Bob）：只有 1 周超 20h</text>

  <rect x="20" y="272" width="140" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="289" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">06-05（一）· 15h</text>

  <rect x="20" y="302" width="140" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="319" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">06-06（二）· 8h</text>

  <rect x="20" y="332" width="140" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="349" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">06-12（一）· 10h</text>

  <rect x="214" y="278" width="168" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="298" y="300" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">周 06-05 ~ 06-11</text>
  <text x="298" y="320" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">15+8 = 23h &gt; 20 ✅</text>

  <rect x="214" y="352" width="168" height="56" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="298" y="374" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">周 06-12 ~ 06-18</text>
  <text x="298" y="394" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">10h &lt; 20 ✗ 非密集周</text>

  <path d="M 160 285 Q 188 288 212 296" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>
  <path d="M 160 315 Q 188 312 212 304" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>
  <path d="M 160 345 Q 188 356 212 370" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrr)" fill="none" filter="url(#rough2)"/>

  <rect x="404" y="306" width="100" height="76" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="454" y="328" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">Bob</text>
  <text x="454" y="348" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">密集周 1 个</text>
  <text x="454" y="368" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">&lt; 2 → 剔除 ✗</text>

  <path d="M 382 306 Q 394 318 402 330" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>
  <path d="M 382 380 Q 394 372 402 352" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrr)" fill="none" filter="url(#rough2)"/>

  <text x="260" y="430" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">两级聚合：第一级 (员工, 周) SUM 判 &gt; 20h；第二级 (员工) COUNT 判 ≥ 2</text>
</svg>
