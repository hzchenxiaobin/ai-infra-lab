<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：以 i 结尾的合法子数组 = lastValid − lastInvalid</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">nums = [2, 9, 2, 5, 6]，left = 2，right = 8，考察 i = 4</text>

  <!-- legend -->
  <rect x="36" y="58" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="56" y="69" font-size="10" fill="#4a7a3a">在 [left,right] 内</text>
  <rect x="156" y="58" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="176" y="69" font-size="10" fill="#d6a040">&lt; left（中性）</text>
  <rect x="276" y="58" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="296" y="69" font-size="10" fill="#b85450">&gt; right（墙）</text>

  <!-- index labels -->
  <text x="44" y="110" font-size="11" fill="#888">下标:</text>
  <text x="138" y="110" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">0</text>
  <text x="198" y="110" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">1</text>
  <text x="258" y="110" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">2</text>
  <text x="318" y="110" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">3</text>
  <text x="378" y="110" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">4</text>

  <!-- nums label -->
  <text x="44" y="138" font-size="11" fill="#888">nums:</text>

  <!-- cells -->
  <!-- idx0: 2 in range -> green -->
  <rect x="110" y="120" width="56" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="138" y="148" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <!-- idx1: 9 > right -> red wall -->
  <rect x="170" y="120" width="56" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="198" y="148" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">9</text>
  <!-- idx2: 2 in range -> green -->
  <rect x="230" y="120" width="56" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="258" y="148" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <!-- idx3: 5 in range -> green -->
  <rect x="290" y="120" width="56" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="318" y="148" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">5</text>
  <!-- idx4: 6 in range -> green (current i, thicker) -->
  <rect x="350" y="120" width="56" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="378" y="148" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">6</text>

  <!-- wall note for idx1 -->
  <text x="198" y="178" text-anchor="middle" font-size="10" fill="#b85450">9 &gt; 8 = 墙</text>

  <!-- lastInvalid pointer (red, at idx1) pointing up -->
  <path d="M 198 196 L 198 174" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="198" y="210" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">lastInvalid=1</text>

  <!-- lastValid pointer (green, at idx4) pointing up -->
  <path d="M 378 196 L 378 174" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="378" y="210" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">lastValid=4</text>

  <!-- valid start range bracket: from idx2 (258) to idx4 (378) -->
  <path d="M 258 232 Q 252 240 258 244 L 318 244 Q 324 244 324 240 Q 324 244 330 244 L 378 244 Q 384 240 378 232" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="318" y="260" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">合法起点 ∈ [2, 4]</text>

  <!-- the three subarrays -->
  <text x="318" y="284" text-anchor="middle" font-size="11" fill="#333">[6]、[5,6]、[2,5,6]</text>

  <!-- formula box (right) -->
  <rect x="420" y="196" width="160" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="500" y="218" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">以 i=4 结尾</text>
  <text x="500" y="238" text-anchor="middle" font-size="11" fill="#666">合法子数组共 3 个</text>
  <text x="500" y="258" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">= lastValid − lastInvalid</text>
  <text x="500" y="274" text-anchor="middle" font-size="11" fill="#888">= 4 − 1 = 3</text>

  <!-- bottom callout: two constraints -->
  <rect x="28" y="300" width="544" height="104" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="322" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">合法子数组必须同时满足两个约束</text>
  <text x="300" y="344" text-anchor="middle" font-size="11" fill="#b85450">① 不含任何 &gt; right 的元素 ⇒ 起点 &gt; lastInvalid（墙之后）</text>
  <text x="300" y="364" text-anchor="middle" font-size="11" fill="#4a7a3a">② 至少含一个 ∈ [left,right] 的元素 ⇒ 起点 ≤ lastValid（含合法元素）</text>
  <text x="300" y="386" text-anchor="middle" font-size="11" fill="#888">起点取 lastInvalid+1 … lastValid，共 lastValid − lastInvalid 个</text>
  <text x="300" y="400" text-anchor="middle" font-size="10" fill="#888">按右端点 i 分组累加，不重复也不遗漏</text>
</svg>
