<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：gcd(x,y) &gt; threshold  ⟺  ∃ d &gt; threshold, d|x 且 d|y</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">共同因子 d&gt;阈值 → d 的所有倍数两两相连（团）→ 不同 d 的团通过共享倍数合并</text>

  <!-- Equivalence box -->
  <rect x="40" y="56" width="480" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="78" text-anchor="middle" font-size="11.5" fill="#333">gcd(x,y) ≥ d &gt; threshold，故只需枚举 d &gt; threshold，合并 d 的所有倍数</text>

  <!-- Left clique: d=6, multiples {6,12,18} -->
  <text x="120" y="116" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">d=6 的倍数（团）</text>
  <text x="120" y="130" text-anchor="middle" font-size="10" fill="#888">{6, 12, 18}</text>

  <circle cx="80" cy="170" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="174" text-anchor="middle" font-size="11.5" fill="#333">6</text>
  <circle cx="160" cy="170" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="160" y="174" text-anchor="middle" font-size="11.5" fill="#333">12</text>
  <circle cx="120" cy="220" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="120" y="224" text-anchor="middle" font-size="11.5" fill="#333">18</text>

  <!-- clique edges (blue) -->
  <line x1="80" y1="170" x2="160" y2="170" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="80" y1="170" x2="120" y2="220" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="160" y1="170" x2="120" y2="220" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- Right clique: d=4, multiples {4,8,12} -->
  <text x="420" y="116" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">d=4 的倍数（团）</text>
  <text x="420" y="130" text-anchor="middle" font-size="10" fill="#888">{4, 8, 12}</text>

  <circle cx="380" cy="170" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="380" y="174" text-anchor="middle" font-size="11.5" fill="#333">4</text>
  <circle cx="460" cy="170" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="460" y="174" text-anchor="middle" font-size="11.5" fill="#333">8</text>
  <circle cx="420" cy="220" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="420" y="224" text-anchor="middle" font-size="11.5" fill="#333">12</text>

  <!-- clique edges (green) -->
  <line x1="380" y1="170" x2="460" y2="170" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="380" y1="170" x2="420" y2="220" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="460" y1="170" x2="420" y2="220" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- Shared node 12 highlight: both cliques contain 12 -->
  <path d="M 178 170 Q 290 150 402 220" stroke="#b85450" stroke-width="2.2" fill="none" stroke-dasharray="6 4" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="290" y="158" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">12 同属两团 → 合并！</text>

  <!-- Bottom: merged component -->
  <rect x="50" y="256" width="460" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="278" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">合并后的连通分量</text>
  <text x="280" y="296" text-anchor="middle" font-size="11" fill="#555">{3, 4, 6, 8, 12, 18} 全部连通（经 12 桥接，3↔6↔12↔4↔8）</text>
  <text x="280" y="310" text-anchor="middle" font-size="10" fill="#888">d=3 把 {3,6,12,18} 也并进来 → 范围继续扩大</text>

  <!-- Footer note -->
  <text x="280" y="342" text-anchor="middle" font-size="10.5" fill="#888">每个 d&gt;threshold 处理一遍倍数，总边数 ≈ n·ln(n/threshold)</text>
  <text x="280" y="360" text-anchor="middle" font-size="10" fill="#aaa">对照朴素枚举 O(n²) 对——倍数法把建图从平方降到准线性</text>
</svg>
