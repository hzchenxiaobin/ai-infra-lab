<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：v1 = "1.01" vs v2 = "1.001"（前导零）</text>

  <!-- split hint -->
  <text x="40" y="56" font-size="11" fill="#888">切分后：a = ["1","01"]，b = ["1","001"]，max(len) = 2</text>

  <!-- table header -->
  <text x="40" y="92" font-size="12" fill="#444" font-weight="bold">步骤</text>
  <text x="110" y="92" font-size="12" fill="#444" font-weight="bold">i</text>
  <text x="170" y="92" font-size="12" fill="#444" font-weight="bold">a[i] 原文</text>
  <text x="270" y="92" font-size="12" fill="#444" font-weight="bold">r1=int</text>
  <text x="350" y="92" font-size="12" fill="#444" font-weight="bold">b[i] 原文</text>
  <text x="450" y="92" font-size="12" fill="#444" font-weight="bold">r2=int</text>
  <text x="530" y="92" font-size="12" fill="#444" font-weight="bold">判定</text>

  <line x1="30" y1="100" x2="580" y2="100" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Step 1 -->
  <text x="40" y="124" font-size="11" fill="#333">1</text>
  <text x="110" y="124" font-size="11" fill="#333">0</text>
  <rect x="150" y="110" width="56" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="178" y="126" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"1"</text>
  <text x="270" y="124" font-size="12" fill="#446688" font-weight="bold">1</text>
  <rect x="330" y="110" width="56" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="358" y="126" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"1"</text>
  <text x="450" y="124" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="530" y="124" font-size="11" fill="#82b366">相等 → i++</text>

  <!-- Step 2 -->
  <text x="40" y="160" font-size="11" fill="#333">2</text>
  <text x="110" y="160" font-size="11" fill="#333">1</text>
  <rect x="150" y="146" width="56" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="178" y="162" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"01"</text>
  <text x="270" y="160" font-size="12" fill="#446688" font-weight="bold">1</text>
  <rect x="330" y="146" width="56" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="358" y="162" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"001"</text>
  <text x="450" y="160" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="530" y="160" font-size="11" fill="#82b366">相等 → i++</text>

  <!-- annotation: leading zeros dropped -->
  <text x="178" y="182" text-anchor="middle" font-size="10" fill="#d6a040">↑ 前导零</text>
  <text x="358" y="182" text-anchor="middle" font-size="10" fill="#d6a040">↑ 前导零</text>
  <text x="270" y="182" text-anchor="middle" font-size="10" fill="#888">int("01")=int("001")=1，自动忽略</text>

  <!-- Step 3: loop ends -->
  <text x="40" y="210" font-size="11" fill="#333">3</text>
  <text x="110" y="210" font-size="11" fill="#333">2</text>
  <text x="178" y="210" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="270" y="210" font-size="11" fill="#999">—</text>
  <text x="358" y="210" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="450" y="210" font-size="11" fill="#999">—</text>
  <text x="530" y="210" font-size="11" fill="#b85450">i≥max → 结束</text>

  <!-- result box -->
  <rect x="60" y="230" width="480" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="252" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">所有修订号均相等 → 返回 0（"1.01" == "1.001"）</text>
  <text x="300" y="268" text-anchor="middle" font-size="11" fill="#888">前导零不影响整数大小，转 int 一行搞定</text>

  <!-- Second example: padding -->
  <text x="40" y="302" font-size="13" fill="#555" font-weight="bold">再演示段数不等（补零）：v1 = "1.0" vs v2 = "1.0.0"</text>

  <text x="40" y="328" font-size="11" fill="#888">a = ["1","0"]，b = ["1","0","0"]，max = 3</text>

  <!-- mini steps -->
  <text x="40" y="356" font-size="11" fill="#333">i=0:</text>
  <text x="90" y="356" font-size="11" fill="#446688" font-weight="bold">1</text>
  <text x="120" y="356" font-size="11" fill="#82b366">==</text>
  <text x="150" y="356" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="40" y="378" font-size="11" fill="#333">i=1:</text>
  <text x="90" y="378" font-size="11" fill="#446688" font-weight="bold">0</text>
  <text x="120" y="378" font-size="11" fill="#82b366">==</text>
  <text x="150" y="378" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="40" y="400" font-size="11" fill="#333">i=2:</text>
  <text x="90" y="400" font-size="11" fill="#b85450" font-weight="bold">0(补)</text>
  <text x="130" y="400" font-size="11" fill="#82b366">==</text>
  <text x="160" y="400" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>

  <rect x="220" y="346" width="320" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="380" y="370" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">a 短一段 → r1 缺省为 0</text>
  <text x="380" y="390" text-anchor="middle" font-size="12" fill="#444">0 == 0 → 三段全相等</text>
  <text x="380" y="406" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">→ 返回 0</text>
</svg>
