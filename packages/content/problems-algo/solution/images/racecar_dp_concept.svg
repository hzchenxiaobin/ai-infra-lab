<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arro" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">连续 k 个 A：速度翻倍，位置 = 2^k − 1（1, 3, 7, 15 …）</text>

  <!-- number line -->
  <line x1="50" y1="110" x2="520" y2="110" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 520 110 L 512 106 L 512 114 Z" fill="#446688" filter="url(#rough2)"/>

  <!-- ticks for 2^k-1 positions -->
  <g filter="url(#rough2)">
    <line x1="70" y1="104" x2="70" y2="116" stroke="#446688" stroke-width="1.5"/>
    <line x1="120" y1="104" x2="120" y2="116" stroke="#446688" stroke-width="1.5"/>
    <line x1="200" y1="104" x2="200" y2="116" stroke="#446688" stroke-width="1.5"/>
    <line x1="320" y1="104" x2="320" y2="116" stroke="#4a7a3a" stroke-width="2.2"/>
    <line x1="470" y1="104" x2="470" y2="116" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="70" y="132" text-anchor="middle" font-size="11" fill="#555">0</text>
  <text x="120" y="132" text-anchor="middle" font-size="11" fill="#555">1</text>
  <text x="200" y="132" text-anchor="middle" font-size="11" fill="#555">3</text>
  <text x="320" y="132" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">7</text>
  <text x="470" y="132" text-anchor="middle" font-size="11" fill="#555">15</text>

  <!-- k labels above ticks -->
  <text x="120" y="92" text-anchor="middle" font-size="10" fill="#888">k=1</text>
  <text x="200" y="92" text-anchor="middle" font-size="10" fill="#888">k=2</text>
  <text x="320" y="92" text-anchor="middle" font-size="10" fill="#888">k=3</text>
  <text x="470" y="92" text-anchor="middle" font-size="10" fill="#888">k=4</text>

  <!-- target flag between 3 and 7 -->
  <line x1="270" y1="88" x2="270" y2="116" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 270 88 L 288 92 L 270 96 Z" fill="#b85450" filter="url(#rough2)"/>
  <text x="276" y="84" font-size="11" fill="#b85450" font-weight="bold">target t</text>
  <text x="232" y="160" font-size="10" fill="#b85450">2^(k−1)−1</text>
  <text x="296" y="160" font-size="10" fill="#b85450">2^k−1</text>

  <!-- two branch arrows -->
  <path d="M 270 120 Q 200 145 165 165" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arro)" filter="url(#rough2)"/>
  <path d="M 270 120 Q 330 145 365 165" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="180" y="150" font-size="10" fill="#d6a040" font-weight="bold">不足</text>
  <text x="345" y="150" font-size="10" fill="#4a7a3a" font-weight="bold">过头</text>

  <!-- overshoot branch (right) -->
  <rect x="300" y="170" width="240" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="420" y="192" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">策略①过头再回头</text>
  <text x="420" y="214" text-anchor="middle" font-size="11" fill="#444">k 个 A → 2^k−1 &gt; t</text>
  <text x="420" y="232" text-anchor="middle" font-size="11" fill="#444">R 反向，距离 = 2^k−1−t</text>
  <text x="420" y="252" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">k + 1 + dp[2^k−1−t]</text>

  <!-- undershoot branch (left) -->
  <rect x="30" y="170" width="250" height="118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="155" y="192" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">策略②不足+回退+再走</text>
  <text x="155" y="214" text-anchor="middle" font-size="11" fill="#444">k−1 个 A → 2^(k−1)−1 &lt; t</text>
  <text x="155" y="232" text-anchor="middle" font-size="11" fill="#444">R，再 j 个 A 回退 2^j−1</text>
  <text x="155" y="250" text-anchor="middle" font-size="11" fill="#444">R，剩余 = t−2^(k−1)+2^j</text>
  <text x="155" y="272" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">k + j + 1 + dp[剩余]</text>

  <!-- bottom hint -->
  <rect x="30" y="312" width="510" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="285" y="336" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">关键：只考虑「刚好过头 2^k−1」与「刚好不足 2^(k−1)−1」两种终点</text>
  <text x="285" y="358" text-anchor="middle" font-size="11" fill="#555">更远的多余加速必被更优解支配；k = bit_length(t) 锁定唯一考察窗口</text>
  <text x="285" y="374" text-anchor="middle" font-size="11" fill="#888">回退后再 R：重置速度为 ±1，才能精确「微调」剩余小段</text>
</svg>
