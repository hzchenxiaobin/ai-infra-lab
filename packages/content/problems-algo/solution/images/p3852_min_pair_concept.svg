<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrW" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#999"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="18" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：有解时 x 恒为数组最小值</text>
  <text x="260" y="34" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">v₁ 无搭档 ⟺ 全员同频 ⟺ 全局无解 —— 逆否：有解 ⇒ x = v₁，只需为它找最小异频 y</text>

  <!-- nums row -->
  <text x="84" y="56" text-anchor="start" font-size="9.5" fill="#888" filter="url(#rough2)">示例 1：nums = [1, 1, 2, 2, 3, 4]</text>

  <rect x="84" y="64" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="110" y="84" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="148" y="64" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="174" y="84" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="212" y="64" width="52" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="238" y="84" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="276" y="64" width="52" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="302" y="84" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="340" y="64" width="52" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="366" y="84" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="404" y="64" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="430" y="84" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>

  <!-- pass 1 arrow -->
  <path d="M 110 98 L 110 114" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <text x="122" y="110" text-anchor="start" font-size="9" fill="#666" filter="url(#rough2)">数出现次数 → freq</text>

  <!-- freq row -->
  <text x="76" y="146" text-anchor="end" font-size="10" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">freq</text>

  <rect x="84" y="126" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="102" y="146" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="120" y="126" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="138" y="146" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>

  <rect x="164" y="126" width="36" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="182" y="146" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="200" y="126" width="36" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="218" y="146" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>

  <rect x="244" y="126" width="36" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="262" y="146" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="280" y="126" width="36" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="298" y="146" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <rect x="324" y="126" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="342" y="146" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="360" y="126" width="36" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="378" y="146" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <text x="408" y="146" text-anchor="start" font-size="9" fill="#888" filter="url(#rough2)">值 → 出现次数</text>

  <!-- pass 2 arrow -->
  <path d="M 110 160 L 110 176" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <text x="122" y="172" text-anchor="start" font-size="9" fill="#666" filter="url(#rough2)">x ← 最小值 1；y 从小到大找异频搭档</text>

  <!-- judgment row -->
  <rect x="22" y="188" width="142" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="93" y="204" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">x = 1（最小值）</text>
  <text x="93" y="218" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">freq[x] = 2</text>

  <path d="M 164 207 L 186 207" stroke="#999" stroke-width="1.3" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>

  <rect x="189" y="188" width="142" height="38" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="204" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">y = 2 → ✗</text>
  <text x="260" y="218" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">freq 2 = 2，同频</text>

  <path d="M 331 207 L 353 207" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="356" y="188" width="142" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="427" y="204" text-anchor="middle" font-size="11" fill="#2a5a1e" font-weight="bold" filter="url(#rough2)">y = 3 → ✓</text>
  <text x="427" y="218" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">freq 1 ≠ 2，异频</text>

  <!-- bottom proof box -->
  <rect x="22" y="244" width="476" height="92" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="266" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">反证：v₁ 无搭档 ⇒ 所有值的频率都被锁死成 freq[v₁] ⇒ 全员同频 ⇒ 全局无解</text>
  <text x="260" y="288" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">示例 2：1 与 5 同频，v₁ = 1 无搭档 → 直接返回 [-1,-1]，换更大的 x 再试也没用</text>
  <text x="260" y="314" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">逆否：存在合法数对 ⇒ v₁ 必有搭档 ⇒ x = v₁；y 取大于 v₁ 的最小异频值 → [1, 3]</text>
</svg>
