<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 396" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="396" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">排序贪心：第 i 小的坐标配第 i 个目标（绝不交叉）</text>

  <!-- 上：行指派演示 -->
  <text x="40" y="48" font-size="11" fill="#888" filter="url(#rough2)">示例 1 的行坐标：排序后 x = [0, 1, 1]，目标行 = [0, 1, 2]</text>

  <text x="84" y="78" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">行坐标</text>
  <rect x="92" y="58" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="78" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="182" y="58" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="78" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="272" y="58" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="78" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>

  <path d="M 120 90 L 120 118" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="128" y="108" font-size="9.5" fill="#446688" filter="url(#rough2)">|0−0|=0</text>
  <path d="M 210 90 L 210 118" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="218" y="108" font-size="9.5" fill="#446688" filter="url(#rough2)">|1−1|=0</text>
  <path d="M 300 90 L 300 118" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>
  <text x="308" y="108" font-size="9.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">|1−2|=1</text>

  <text x="84" y="144" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">目标行</text>
  <rect x="92" y="124" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="144" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="182" y="124" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="144" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="272" y="124" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="144" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="376" y="62" width="124" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="438" y="84" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">行代价</text>
  <text x="438" y="104" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">= 0+0+1 = 1</text>

  <path d="M 40 172 L 480 172" stroke="#ddd" stroke-width="1.2" stroke-dasharray="6 4" fill="none" filter="url(#rough2)"/>

  <!-- 下：交换论证 -->
  <text x="40" y="196" font-size="11" fill="#888" filter="url(#rough2)">为什么不能交叉？交换论证：数轴上比两条线段的总长</text>

  <!-- 左图：不交叉 -->
  <line x1="56" y1="288" x2="248" y2="288" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="80" y1="283" x2="80" y2="293" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="140" y1="283" x2="140" y2="293" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="80" y="307" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">a=80</text>
  <text x="140" y="307" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">b=140</text>
  <circle cx="100" cy="222" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="180" cy="222" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="100" y="212" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">c=100</text>
  <text x="180" y="212" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">d=180</text>
  <path d="M 80 284 L 99 228" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <path d="M 140 284 L 178 228" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="152" y="336" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">不交叉：20 + 40 = 60 ✓</text>

  <!-- 右图：交叉 -->
  <line x1="296" y1="288" x2="488" y2="288" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="320" y1="283" x2="320" y2="293" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="380" y1="283" x2="380" y2="293" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="307" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">a=80</text>
  <text x="380" y="307" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">b=140</text>
  <circle cx="340" cy="222" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="420" cy="222" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="340" y="212" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">c=100</text>
  <text x="420" y="212" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">d=180</text>
  <path d="M 320 284 L 417 228" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <path d="M 380 284 L 343 228" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="392" y="336" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">交叉：100 + 40 = 140 ✗</text>

  <!-- 引理框 -->
  <rect x="40" y="348" width="440" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="364" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">引理：a ≤ b、c ≤ d ⇒ |a−c| + |b−d| ≤ |a−d| + |b−c|</text>
  <text x="260" y="381" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">任何交叉指派交换后代价不增 → 反复消交叉 = 排序同位配对</text>
</svg>
