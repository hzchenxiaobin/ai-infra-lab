<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">稀疏矩阵乘法算法流程：预处理 + 稀疏三重循环</text>

  <!-- ① 预处理 -->
  <text x="40" y="58" font-size="12" fill="#4a7a3a" font-weight="bold">① 预处理　O(nnz₁ + nnz₂)</text>

  <rect x="60" y="68" width="400" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="90" text-anchor="middle" font-size="12" fill="#333">扫描 mat1：rs1[i] = [(k, v) | v ≠ 0]</text>

  <path d="M260 102 V124" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="128" width="400" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="150" text-anchor="middle" font-size="12" fill="#333">扫描 mat2：rs2[k] = [(j, v) | v ≠ 0]</text>

  <!-- 分隔 -->
  <path d="M40 184 H480" stroke="#ccc" stroke-width="1.2" stroke-dasharray="5,4" filter="url(#rough2)"/>

  <!-- ② 计算 -->
  <text x="40" y="208" font-size="12" fill="#b85450" font-weight="bold">② 计算　O(nnz₁ · avg)</text>

  <rect x="60" y="218" width="400" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="240" text-anchor="middle" font-size="12" fill="#333">result = 0 　(m × n)</text>

  <path d="M260 252 V274" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="278" width="440" height="104" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="302" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">for i in 0..m−1:</text>
  <text x="260" y="322" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">　for (k, v1) in rs1[i]:</text>
  <text x="260" y="342" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">　　for (j, v2) in rs2[k]:</text>
  <text x="260" y="362" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">　　　result[i][j] += v1 · v2</text>

  <path d="M260 382 V404" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="408" width="400" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="430" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return result 　✓</text>
</svg>
