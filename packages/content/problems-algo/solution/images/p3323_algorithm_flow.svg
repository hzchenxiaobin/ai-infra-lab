<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：排序 → 合并成组 → 逐组求最远可达 → m − 最大跨度</text>

  <!-- ============ 主流程（左列，中心 x=185） ============ -->
  <rect x="105" y="40" width="160" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="185" y="60" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">intervals 按起点排序</text>
  <path d="M 185 72 L 185 84" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="70" y="88" width="230" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="185" y="108" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">线性合并：s ≤ 上一组 end ⇒ 并入</text>
  <path d="M 185 120 L 185 132" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <rect x="95" y="136" width="180" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="185" y="156" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">组数组 s[]、e[]，组数 m</text>
  <path d="M 185 168 L 185 182" stroke="#446688" stroke-width="1.5" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="185,174 300,212 185,250 70,212" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="185" y="217" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">i &lt; m ?</text>

  <path d="M 185 250 L 185 266" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="196" y="262" font-size="10" fill="#2f5d24" filter="url(#rough2)">是</text>

  <rect x="55" y="270" width="260" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="185" y="287" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">j = 二分：最后一个 s[j] ≤ eᵢ + k</text>
  <text x="185" y="303" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">（可换双指针：j(i) 单调不减）</text>
  <path d="M 185 314 L 185 336" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <rect x="95" y="340" width="180" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="185" y="360" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">best = max(best, j − i)；i++</text>

  <!-- 循环回边 -->
  <path d="M 95 356 L 40 356 L 40 212 L 64 212" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="50" y="290" font-size="9" fill="#2f5d24" filter="url(#rough2)">下一轮</text>

  <!-- 否 → 返回 -->
  <path d="M 300 212 L 334 212" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="204" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="338" y="195" width="120" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="398" y="216" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 m − best</text>

  <!-- ============ 右侧备注列 ============ -->
  <rect x="340" y="40" width="160" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="420" y="58" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">单调性链</text>
  <text x="420" y="74" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">组互不相交 ⇒ e 严格递增</text>
  <text x="420" y="88" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">⇒ eᵢ + k 单调 ⇒ j(i) 不减</text>
  <text x="420" y="102" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">⇒ 双指针可替换二分</text>

  <rect x="340" y="122" width="160" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="420" y="140" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">溢出提醒</text>
  <text x="420" y="156" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">eᵢ + k 可达 2×10⁹</text>
  <text x="420" y="171" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">C++ 记得用 long long</text>

  <rect x="340" y="245" width="160" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="420" y="263" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">保底性质</text>
  <text x="420" y="279" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">sᵢ ≤ eᵢ &lt; eᵢ + k</text>
  <text x="420" y="294" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">⇒ j(i) ≥ i 恒成立</text>
  <text x="420" y="309" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">⇒ best ≥ 0</text>
  <text x="420" y="326" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">「插了白插」答案 = m ✓</text>

  <text x="260" y="392" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">复杂度：排序 O(n log n) 主导；合并 O(n)；二分 O(m log m) / 双指针 O(m)</text>
</svg>
