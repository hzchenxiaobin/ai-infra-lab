<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">两趟后序 DFS：① 求 total → ② 枚举每个子树和 S，更新 best</text>

  <!-- Entry -->
  <rect x="205" y="42" width="150" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">maxProduct(root)</text>

  <path d="M 280 72 L 280 88" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ===== Pass 1: compute total ===== -->
  <rect x="40" y="90" width="480" height="92" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="114" font-size="12" fill="#446688" font-weight="bold">第一趟：求整棵树的 total（后序 DFS，返回子树和）</text>
  <text x="60" y="138" font-size="11" fill="#333" font-family="monospace">dfs_sum(node):</text>
  <text x="60" y="155" font-size="11" fill="#333" font-family="monospace">    if !node: return 0</text>
  <text x="60" y="172" font-size="11" fill="#333" font-family="monospace">    return node.val + dfs_sum(left) + dfs_sum(right)   // 根返回值 = total</text>

  <path d="M 280 182 L 280 198" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ===== Pass 2: enumerate subtree sums ===== -->
  <rect x="40" y="200" width="480" height="148" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="224" font-size="12" fill="#d6a040" font-weight="bold">第二趟：再后序 DFS，每个节点算子树和 S，更新 best</text>
  <text x="60" y="248" font-size="11" fill="#333" font-family="monospace">dfs_prod(node):</text>
  <text x="60" y="265" font-size="11" fill="#333" font-family="monospace">    if !node: return 0</text>
  <text x="60" y="282" font-size="11" fill="#333" font-family="monospace">    s = node.val + dfs_prod(left) + dfs_prod(right)</text>
  <text x="60" y="299" font-size="11" fill="#b85450" font-family="monospace" font-weight="bold">    best = max(best, s * (total - s))   // 这条边的乘积候选</text>
  <text x="60" y="316" font-size="11" fill="#333" font-family="monospace">    return s</text>
  <text x="60" y="336" font-size="10" fill="#888">根节点 s = total → s·(total−s) = 0，天然不参与 max，无需特判</text>

  <path d="M 280 348 L 280 364" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- ===== Exit: mod ===== -->
  <rect x="150" y="366" width="260" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="388" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return best % (10^9 + 7)</text>

  <!-- bottom notes -->
  <rect x="40" y="412" width="480" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="280" y="432" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⚠️ 溢出防护：total ≤ 5×10^8，乘积 ≤ 6.25×10^16，用 long long 存</text>
  <text x="280" y="450" text-anchor="middle" font-size="10" fill="#888">取模只在最后做一次；比较必须在取模前（取模会破坏大小关系）</text>
</svg>
