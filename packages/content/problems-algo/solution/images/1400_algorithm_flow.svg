<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：数奇频 → 比对 k 与 n</text>

  <rect x="200" y="46" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="68" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">输入 s, k</text>
  <path d="M260,80 L260,100" stroke="#446688" stroke-width="1.5" marker-end="url(#arr2)" fill="none" filter="url(#rough2)"/>

  <rect x="180" y="102" width="160" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="124" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">统计频率 cnt[26]（一趟扫描）</text>
  <path d="M260,136 L260,156" stroke="#446688" stroke-width="1.5" marker-end="url(#arr2)" fill="none" filter="url(#rough2)"/>

  <rect x="170" y="158" width="180" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="180" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">oddCount = Σ(cnt[i] % 2 == 1)</text>
  <path d="M260,192 L260,212" stroke="#446688" stroke-width="1.5" marker-end="url(#arr2)" fill="none" filter="url(#rough2)"/>

  <polygon points="260,214 410,262 260,310 110,262" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="256" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">oddCount ≤ k 且 k ≤ n ?</text>
  <text x="260" y="274" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">(n = s.length)</text>

  <path d="M110,262 L60,262 L60,324" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="78" y="254" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="10" y="326" width="100" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="60" y="348" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">return false</text>

  <path d="M410,262 L460,262 L460,324" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>
  <text x="425" y="254" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="410" y="326" width="100" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="460" y="348" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return true</text>
</svg>
