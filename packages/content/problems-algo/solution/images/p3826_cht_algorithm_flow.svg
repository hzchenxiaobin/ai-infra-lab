<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 486"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="560" height="486" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="30" y="30" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：逐层划分 DP + 单调队列斜率优化（O(k·n)）</text>

  <!-- 初始化 -->
  <rect x="100" y="48" width="360" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="70" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">P[0..n] 前缀和；prev = dp₀（prev[0]=0，其余 ∞）</text>
  <path d="M 280,84 L 280,98" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 外层循环框架 -->
  <rect x="66" y="102" width="430" height="308" rx="10" fill="#f4f7fb" stroke="#8899aa" stroke-width="1.2" stroke-dasharray="6,4" filter="url(#rough2)"/>
  <text x="80" y="122" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">外层 for t = 1..k（段数）</text>

  <rect x="100" y="130" width="360" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="149" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">新建空队列（存直线，按斜率递减）</text>
  <path d="M 280,160 L 280,170" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 内层循环框架 -->
  <rect x="92" y="172" width="380" height="178" rx="10" fill="#fcfbf4" stroke="#b0a880" stroke-width="1.2" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="106" y="191" font-size="12" font-weight="bold" fill="#8a7a30" filter="url(#rough2)">内层 for i = t..n（前 i 个元素）</text>

  <rect x="112" y="198" width="340" height="32" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="282" y="218" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">① 入线 j=i−1：m=−P[j]，b=prev[j]+(P[j]²−P[j])/2</text>
  <path d="M 282,230 L 282,236" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="112" y="238" width="340" height="32" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="282" y="258" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">② 队尾维护：交点交叉相乘比较，无用线弹出，新线入队</text>
  <path d="M 282,270 L 282,276" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="112" y="278" width="340" height="32" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="282" y="298" font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">③ 队首维护：while 队首在 x=P[i] 处不优 → 弹出</text>
  <path d="M 282,310 L 282,316" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="112" y="318" width="340" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="282" y="337" font-size="11.5" font-weight="bold" fill="#2f5a25" text-anchor="middle" filter="url(#rough2)">④ cur[i] = (P[i]²+P[i])/2 + 队首线(P[i])</text>

  <!-- 内层回边 -->
  <path d="M 472,244 L 490,244 L 490,188 L 476,188" stroke="#8899aa" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 280,350 L 280,358" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="362" width="360" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="381" font-size="12" fill="#333" text-anchor="middle" filter="url(#rough2)">prev ← cur（滚动数组）</text>

  <!-- 外层回边 -->
  <path d="M 496,254 L 516,254 L 516,116 L 500,116" stroke="#8899aa" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 280,410 L 280,418" stroke="#555" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 返回 -->
  <rect x="100" y="422" width="360" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="444" font-size="13" font-weight="bold" fill="#2f5a25" text-anchor="middle" filter="url(#rough2)">返回 prev[n]</text>

  <!-- 脚注 -->
  <text x="30" y="476" font-size="11" fill="#888" filter="url(#rough2)">每条直线至多入队一次、出队一次 ⇒ 每层均摊 O(n)，总时间 O(k·n)；滚动数组空间 O(n)</text>
</svg>
