<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="880" height="360" fill="#fdfcf7"/>

  <text x="440" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">翻倍链表：算法流程</text>
  <path d="M 300 40 Q 440 48 580 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Step 1 -->
  <g filter="url(#sk)"><rect x="60" y="64" width="760" height="44" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="80" y="84" font-size="13" font-weight="bold" fill="#2b6e9e">① 反转链表</text>
  <text x="80" y="100" font-size="11" fill="#555" font-family="monospace">rev = reverse(head)   # 头变成个位，加法方向与遍历方向对齐</text>
  <text x="640" y="92" font-size="10" fill="#888">O(n) 原地反转</text>

  <!-- Step 2 -->
  <g filter="url(#sk)"><rect x="60" y="118" width="760" height="44" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/></g>
  <text x="80" y="138" font-size="13" font-weight="bold" fill="#2e6e2e">② 逐位翻倍 + 进位</text>
  <text x="80" y="154" font-size="11" fill="#555" font-family="monospace">while cur: v = cur.val*2 + carry; cur.val = v%10; carry = v/10</text>
  <text x="640" y="146" font-size="10" fill="#888">carry ∈ {0,1}（≤9×2+1=19）</text>

  <!-- Step 3 -->
  <g filter="url(#sk)"><rect x="60" y="172" width="760" height="44" rx="8" fill="#fffdf3" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="80" y="192" font-size="13" font-weight="bold" fill="#7a5415">③ 判定最高位进位</text>
  <text x="80" y="208" font-size="11" fill="#555" font-family="monospace">head = reverse(rev)   # 先反转回正序</text>
  <text x="640" y="200" font-size="10" fill="#b85450" font-weight="bold">★ carry=1 则前插 1</text>

  <!-- Step 4 -->
  <g filter="url(#sk)"><rect x="60" y="226" width="760" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="80" y="246" font-size="13" font-weight="bold" fill="#b85450">④ 前插新最高位（若有进位）</text>
  <text x="80" y="262" font-size="11" fill="#555" font-family="monospace">if carry: return ListNode(carry, head)   # 999×2=1998 的首位 1</text>
  <text x="640" y="254" font-size="10" fill="#888">否则直接返回 head</text>

  <!-- Step 5 -->
  <g filter="url(#sk)"><rect x="60" y="280" width="760" height="44" rx="8" fill="#fef6e6" stroke="#c98a2b" stroke-width="1.5"/></g>
  <text x="80" y="300" font-size="13" font-weight="bold" fill="#7a5415">⑤ 返回头节点</text>
  <text x="80" y="316" font-size="11" fill="#555" font-family="monospace">return head   # 正序结果链表</text>
  <text x="640" y="308" font-size="10" fill="#888">两次反转 + 一趟翻倍</text>

  <!-- key notes -->
  <g filter="url(#sk)"><rect x="60" y="334" width="760" height="20" rx="6" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/></g>
  <text x="80" y="348" font-size="11" fill="#b85450" font-weight="bold">⚠ 进位只在翻转后沿"个位→最高位"传递，反转回来后若仍有 carry 必须前插</text>
</svg>
