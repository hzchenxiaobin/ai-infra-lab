<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心概念：后缀 tokens → 表达式树（叶=操作数，内部节点=运算符）</text>

  <!-- Postfix tokens row -->
  <text x="40" y="60" font-size="11" fill="#888">后缀 =</text>
  <g filter="url(#rough2)">
    <rect x="78"  y="44" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="124" y="44" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="170" y="44" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <rect x="216" y="44" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="262" y="44" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <rect x="308" y="44" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="354" y="44" width="46" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
  </g>
  <g font-size="15" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="101" y="66">3</text>
    <text x="147" y="66">4</text>
    <text x="193" y="66">+</text>
    <text x="239" y="66">2</text>
    <text x="285" y="66">*</text>
    <text x="331" y="66">5</text>
    <text x="377" y="66">−</text>
  </g>

  <!-- Build arrow from tokens to tree -->
  <path d="M 300 86 L 300 104" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="100" font-size="10" fill="#888">建树</text>

  <!-- Tree edges (drawn first so nodes cover endpoints) -->
  <g stroke="#666" stroke-width="2" fill="none" filter="url(#rough2)">
    <path d="M 300 150 L 200 222"/>
    <path d="M 300 150 L 410 222"/>
    <path d="M 200 222 L 110 300"/>
    <path d="M 200 222 L 270 300"/>
    <path d="M 110 300 L 60 372"/>
    <path d="M 110 300 L 165 372"/>
  </g>

  <!-- Tree nodes -->
  <!-- root: '-' -->
  <g filter="url(#rough2)">
    <circle cx="300" cy="150" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <text x="300" y="156" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">−</text>

  <!-- '*' -->
  <g filter="url(#rough2)">
    <circle cx="200" cy="222" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <text x="200" y="228" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">*</text>

  <!-- '5' (right child of root) -->
  <g filter="url(#rough2)">
    <circle cx="410" cy="222" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="410" y="228" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>

  <!-- '+' -->
  <g filter="url(#rough2)">
    <circle cx="110" cy="300" r="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
  </g>
  <text x="110" y="306" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">+</text>

  <!-- '2' (right child of '*') -->
  <g filter="url(#rough2)">
    <circle cx="270" cy="300" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="270" y="306" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- '3' -->
  <g filter="url(#rough2)">
    <circle cx="60" cy="372" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="60" y="378" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- '4' -->
  <g filter="url(#rough2)">
    <circle cx="165" cy="372" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
  </g>
  <text x="165" y="378" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- Legend / node-type box -->
  <rect x="450" y="120" width="140" height="92" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="520" y="140" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">节点类型</text>
  <g filter="url(#rough2)">
    <circle cx="468" cy="160" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <circle cx="468" cy="186" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="486" y="164" font-size="11" fill="#555" filter="url(#rough2)">叶子 NumberNode</text>
  <text x="486" y="190" font-size="11" fill="#555" filter="url(#rough2)">内部 OperatorNode</text>

  <!-- Evaluate annotation: post-order -->
  <rect x="40" y="404" width="520" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="58" y="424" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">evaluate() = 后序遍历：先递归算左右子树，再用节点运算符合并 → (3+4)×2 − 5 = 9</text>
</svg>
