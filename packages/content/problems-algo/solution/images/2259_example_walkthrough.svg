<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：贪心判定两种情况</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">示例 2（有增益→左删）与示例 3（无增益→删最后）</text>

  <!-- ===== Example 2: number="1231", digit='1' ===== -->
  <text x="28" y="72" font-size="11.5" fill="#4a7a3a" font-weight="bold">示例 2：number = "1231"，digit = '1'</text>

  <!-- index labels -->
  <text x="102" y="92" text-anchor="middle" font-size="9" fill="#888">i=0</text>
  <text x="162" y="92" text-anchor="middle" font-size="9" fill="#888">i=1</text>
  <text x="222" y="92" text-anchor="middle" font-size="9" fill="#888">i=2</text>
  <text x="282" y="92" text-anchor="middle" font-size="9" fill="#888">i=3</text>

  <!-- row: number -->
  <text x="28" y="114" font-size="10" fill="#666">number</text>
  <rect x="82" y="96" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="102" y="118" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="142" y="96" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="162" y="118" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="202" y="96" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="222" y="118" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="262" y="96" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="282" y="118" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <!-- scan annotation: i=0 is '1', check next -->
  <path d="M 122 112 L 138 112" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="130" y="104" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2&gt;1</text>

  <!-- step text -->
  <rect x="320" y="100" width="220" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="430" y="118" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">i=0：number[1]='2'&gt;'1' → 增益！</text>

  <!-- result -->
  <text x="28" y="150" font-size="10" fill="#666">删除 i=0</text>
  <rect x="82" y="132" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="102" y="154" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="122" y="132" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="154" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="162" y="132" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="182" y="154" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="320" y="136" width="180" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="410" y="154" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">结果 = "231" ✓ 最大</text>

  <!-- divider -->
  <line x1="40" y1="184" x2="520" y2="184" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Example 3: number="551", digit='5' ===== -->
  <text x="28" y="210" font-size="11.5" fill="#d6a040" font-weight="bold">示例 3：number = "551"，digit = '5'</text>

  <!-- index labels -->
  <text x="112" y="230" text-anchor="middle" font-size="9" fill="#888">i=0</text>
  <text x="172" y="230" text-anchor="middle" font-size="9" fill="#888">i=1</text>
  <text x="232" y="230" text-anchor="middle" font-size="9" fill="#888">i=2</text>

  <!-- row: number -->
  <text x="28" y="252" font-size="10" fill="#666">number</text>
  <rect x="92" y="234" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="256" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <rect x="132" y="234" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="256" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <rect x="172" y="234" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="256" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <!-- step i=0: '5', next '5'==5, no gain, lastPos=0 -->
  <path d="M 132 250 L 148 250" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="242" text-anchor="middle" font-size="9" fill="#888">5=5</text>
  <rect x="320" y="238" width="220" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="430" y="256" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">i=0：number[1]='5'=='5' → 不赚，lastPos=0</text>

  <!-- step i=1: '5', next '1'<5, no gain, lastPos=1 -->
  <rect x="132" y="278" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="300" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <path d="M 172 294 L 188 294" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="180" y="286" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1&lt;5</text>
  <rect x="320" y="282" width="220" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="430" y="300" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">i=1：number[2]='1'&lt;'5' → 亏，lastPos=1</text>

  <!-- loop ends, remove lastPos=1 -->
  <text x="28" y="338" font-size="10" fill="#666">循环结束</text>
  <rect x="92" y="320" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="342" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <!-- highlight removed position -->
  <rect x="132" y="320" width="40" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="342" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">5</text>
  <text x="152" y="362" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">删</text>
  <rect x="172" y="320" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="342" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <rect x="320" y="324" width="180" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="410" y="342" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">删 lastPos=1 → "51" ✓</text>

  <!-- ===== Summary table ===== -->
  <line x1="40" y1="378" x2="520" y2="378" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <rect x="40" y="388" width="480" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="408" font-size="10.5" fill="#333" font-weight="bold">对比小结</text>
  <text x="60" y="426" font-size="10" fill="#4a7a3a" font-weight="bold">示例2 "1231": 删 i=0 → "231"（位置 0 由 '1' 变 '2'，变大了，且最左 → 最大）</text>
  <text x="60" y="444" font-size="10" fill="#d6a040" font-weight="bold">示例3 "551": 无增益 → 删最后 '5'(i=1) → "51"（删尾处损失最小，前缀不动）</text>
</svg>
