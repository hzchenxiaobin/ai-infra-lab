<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#666"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：符号决定排序方向，正数需处理前导零</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">正数→升序（小数配大权重）；负数→降序（大数配大权重，绝对值最大→值最负）</text>

  <!-- ===== Left: Positive num = 310 ===== -->
  <text x="150" y="74" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">正数 num = 310</text>

  <!-- Step 1: digits [3, 1, 0] with weights -->
  <text x="44" y="92" font-size="10" fill="#888">① 数位与权重</text>
  <rect x="60" y="98" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="82" y="118" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="82" y="140" text-anchor="middle" font-size="8.5" fill="#888">×100</text>
  <rect x="106" y="98" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="128" y="118" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <text x="128" y="140" text-anchor="middle" font-size="8.5" fill="#888">×10</text>
  <rect x="152" y="98" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="174" y="118" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <text x="174" y="140" text-anchor="middle" font-size="8.5" fill="#888">×1</text>

  <!-- arrow down: ascending sort -->
  <path d="M 128 148 L 128 162" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="144" y="158" font-size="9.5" fill="#666" font-weight="bold">升序</text>

  <!-- Step 2: sorted [0, 1, 3] with leading zero problem -->
  <text x="44" y="176" font-size="10" fill="#888">② 排序后</text>
  <rect x="60" y="182" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="82" y="202" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="106" y="182" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="128" y="202" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="152" y="182" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="174" y="202" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <text x="82" y="224" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">前导零!</text>

  <!-- arrow down: fix -->
  <path d="M 128 228 L 128 242" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="148" y="238" font-size="9.5" fill="#b85450" font-weight="bold">修正</text>

  <!-- Step 3: swap first non-zero to front [1, 0, 3] -->
  <text x="44" y="256" font-size="10" fill="#888">③ 首个非零换首位</text>
  <rect x="60" y="262" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="82" y="282" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="106" y="262" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="128" y="282" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="152" y="262" width="44" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="174" y="282" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <!-- result -->
  <rect x="80" y="302" width="96" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="128" y="323" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">103</text>

  <!-- vertical divider -->
  <line x1="280" y1="60" x2="280" y2="345" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Right: Negative num = -7605 ===== -->
  <text x="430" y="74" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">负数 num = -7605</text>

  <!-- Step 1: digits of |num| [7, 6, 0, 5] with weights -->
  <text x="324" y="92" font-size="10" fill="#888">① |num| 数位与权重</text>
  <rect x="340" y="98" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="118" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
  <text x="360" y="140" text-anchor="middle" font-size="8" fill="#888">×1000</text>
  <rect x="382" y="98" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="402" y="118" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <text x="402" y="140" text-anchor="middle" font-size="8.5" fill="#888">×100</text>
  <rect x="424" y="98" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="444" y="118" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <text x="444" y="140" text-anchor="middle" font-size="8.5" fill="#888">×10</text>
  <rect x="466" y="98" width="40" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="486" y="118" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <text x="486" y="140" text-anchor="middle" font-size="8.5" fill="#888">×1</text>

  <!-- arrow down: descending sort -->
  <path d="M 430 148 L 430 162" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="448" y="158" font-size="9.5" fill="#666" font-weight="bold">降序</text>

  <!-- Step 2: sorted descending [7, 6, 5, 0] -->
  <text x="324" y="176" font-size="10" fill="#888">② 降序排列</text>
  <rect x="340" y="182" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="360" y="202" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
  <rect x="382" y="182" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="402" y="202" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <rect x="424" y="182" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="444" y="202" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <rect x="466" y="182" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="486" y="202" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <text x="430" y="224" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">首位非零 ✓ 无需修正</text>

  <!-- arrow down -->
  <path d="M 430 228 L 430 262" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="380" y="270" width="100" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="430" y="291" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">-7650</text>
  <text x="430" y="318" text-anchor="middle" font-size="9.5" fill="#888">降序→绝对值最大→值最负</text>

  <!-- ===== Bottom: key insight ===== -->
  <rect x="40" y="352" width="480" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="370" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">重排不等式：最小化加权和 → 小数位配大权重（升序）</text>
  <text x="280" y="384" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">负数最小化 = 最大化绝对值 → 大数位配大权重（降序）</text>
</svg>
