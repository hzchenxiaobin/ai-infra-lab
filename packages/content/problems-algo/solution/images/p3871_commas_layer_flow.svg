<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：阈值 p 从 10³ 起每轮 ×1000，至多 5 轮</text>

  <!-- 流程主干 -->
  <rect x="55" y="42" width="120" height="28" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="115" y="60" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">开始：输入 n</text>

  <path d="M 115 70 L 115 88" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="45" y="90" width="140" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115" y="105" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">ans = 0</text>
  <text x="115" y="119" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">p = 10³</text>

  <path d="M 115 126 L 115 143" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="115,146 178,188 115,230 52,188" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="115" y="192" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">p ≤ n ?</text>

  <!-- 否 → 返回 -->
  <path d="M 178 188 L 211 188" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="194" y="180" text-anchor="middle" font-size="10" fill="#a0433f" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="215" y="170" width="100" height="36" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="265" y="192" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <!-- 是 → 累加 -->
  <path d="M 115 230 L 115 246" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="127" y="243" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="40" y="248" width="150" height="38" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115" y="263" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">ans += n − p + 1</text>
  <text x="115" y="279" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">（第 k 层 = [p, n] 长度）</text>

  <path d="M 115 286 L 115 300" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="40" y="302" width="150" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="115" y="321" text-anchor="middle" font-size="10.5" fill="#8a6d1f" filter="url(#rough2)">p *= 1000</text>

  <!-- 回到判断 -->
  <path d="M 40 317 L 22 317 L 22 188 L 48 188" fill="none" stroke="#888" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 右侧演算面板 -->
  <rect x="336" y="64" width="172" height="232" rx="10" fill="#ffffff" stroke="#bbb" stroke-width="1.3" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="422" y="86" text-anchor="middle" font-size="10.5" fill="#444" font-weight="bold" filter="url(#rough2)">演算 n = 1002（示例 1）</text>

  <text x="346" y="112" font-size="9.5" fill="#444" filter="url(#rough2)">① p = 10³ ≤ 1002</text>
  <text x="346" y="132" font-size="9.5" fill="#33506b" filter="url(#rough2)">ans += 1002−1000+1 = 3</text>
  <text x="346" y="152" font-size="9.5" fill="#444" filter="url(#rough2)">② p = 10⁶ &gt; 1002 → 停</text>
  <text x="346" y="172" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 3 ✓</text>

  <path d="M 348 184 L 496 184" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>

  <text x="346" y="206" font-size="9.5" fill="#444" font-weight="bold" filter="url(#rough2)">n = 2×10⁶（两层）：</text>
  <text x="346" y="226" font-size="9.5" fill="#33506b" filter="url(#rough2)">k=1 → 1,999,001</text>
  <text x="346" y="246" font-size="9.5" fill="#33506b" filter="url(#rough2)">k=2 → 1,000,001</text>
  <text x="346" y="266" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ans = 2,999,002 ✓</text>
  <text x="346" y="288" font-size="9" fill="#888" filter="url(#rough2)">轮数 = ⌊(位数−1)/3⌋ ≤ 5</text>

  <!-- 右下注记 -->
  <rect x="336" y="308" width="172" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="422" y="322" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">每轮 ×1000 跨 3 个量级</text>
  <text x="422" y="336" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">O(log n) / O(1)</text>
</svg>
