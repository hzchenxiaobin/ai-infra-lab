<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="340" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：!(&amp;(f,t))</text>

  <!-- Header row -->
  <g filter="url(#rough2)">
    <rect x="20" y="40" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="40" y="56" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">步</text>
    <rect x="64" y="40" width="40" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="84" y="56" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">字符</text>
    <rect x="108" y="40" width="150" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="183" y="56" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">操作</text>
    <rect x="262" y="40" width="258" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="391" y="56" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">栈状态（底 → 顶）</text>
  </g>

  <!-- highlight backgrounds for rows 6 and 7 -->
  <rect x="20" y="234" width="500" height="26" fill="#fff8e1" stroke="none" rx="3" filter="url(#rough2)"/>
  <rect x="20" y="262" width="500" height="26" fill="#fff8e1" stroke="none" rx="3" filter="url(#rough2)"/>

  <!-- Row 0: ! -->
  <g filter="url(#rough2)">
    <rect x="20" y="66" width="40" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="40" y="82" text-anchor="middle" font-size="10" fill="#333">0</text>
    <rect x="64" y="66" width="40" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="84" y="82" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">!</text>
    <rect x="108" y="66" width="150" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="183" y="82" text-anchor="middle" font-size="10" fill="#333">push !</text>
    <rect x="266" y="66" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="280" y="82" text-anchor="middle" font-size="11" fill="#446688">!</text>
  </g>

  <!-- Row 1: & -->
  <g filter="url(#rough2)">
    <rect x="20" y="94" width="40" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="40" y="110" text-anchor="middle" font-size="10" fill="#333">1</text>
    <rect x="64" y="94" width="40" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="84" y="110" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">&amp;</text>
    <rect x="108" y="94" width="150" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="183" y="110" text-anchor="middle" font-size="10" fill="#333">push &amp;</text>
    <rect x="266" y="94" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="280" y="110" text-anchor="middle" font-size="11" fill="#446688">!</text>
    <rect x="296" y="94" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="310" y="110" text-anchor="middle" font-size="11" fill="#446688">&amp;</text>
  </g>

  <!-- Row 2: ( -->
  <g filter="url(#rough2)">
    <rect x="20" y="122" width="40" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="40" y="138" text-anchor="middle" font-size="10" fill="#333">2</text>
    <rect x="64" y="122" width="40" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="84" y="138" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">(</text>
    <rect x="108" y="122" width="150" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="183" y="138" text-anchor="middle" font-size="10" fill="#333">push (</text>
    <rect x="266" y="122" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="280" y="138" text-anchor="middle" font-size="11" fill="#446688">!</text>
    <rect x="296" y="122" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="310" y="138" text-anchor="middle" font-size="11" fill="#446688">&amp;</text>
    <rect x="326" y="122" width="28" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3"/>
    <text x="340" y="138" text-anchor="middle" font-size="11" fill="#d6a040">(</text>
  </g>

  <!-- Row 3: f -->
  <g filter="url(#rough2)">
    <rect x="20" y="150" width="40" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="40" y="166" text-anchor="middle" font-size="10" fill="#333">3</text>
    <rect x="64" y="150" width="40" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="84" y="166" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">f</text>
    <rect x="108" y="150" width="150" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="183" y="166" text-anchor="middle" font-size="10" fill="#333">push f</text>
    <rect x="266" y="150" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="280" y="166" text-anchor="middle" font-size="11" fill="#446688">!</text>
    <rect x="296" y="150" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="310" y="166" text-anchor="middle" font-size="11" fill="#446688">&amp;</text>
    <rect x="326" y="150" width="28" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3"/>
    <text x="340" y="166" text-anchor="middle" font-size="11" fill="#d6a040">(</text>
    <rect x="356" y="150" width="28" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3"/>
    <text x="370" y="166" text-anchor="middle" font-size="11" fill="#b85450">f</text>
  </g>

  <!-- Row 4: , -->
  <g filter="url(#rough2)">
    <rect x="20" y="178" width="40" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="40" y="194" text-anchor="middle" font-size="10" fill="#333">4</text>
    <rect x="64" y="178" width="40" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="84" y="194" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">,</text>
    <rect x="108" y="178" width="150" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="183" y="194" text-anchor="middle" font-size="10" fill="#888">跳过（无操作）</text>
    <rect x="266" y="178" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="280" y="194" text-anchor="middle" font-size="11" fill="#446688">!</text>
    <rect x="296" y="178" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="310" y="194" text-anchor="middle" font-size="11" fill="#446688">&amp;</text>
    <rect x="326" y="178" width="28" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3"/>
    <text x="340" y="194" text-anchor="middle" font-size="11" fill="#d6a040">(</text>
    <rect x="356" y="178" width="28" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3"/>
    <text x="370" y="194" text-anchor="middle" font-size="11" fill="#b85450">f</text>
  </g>

  <!-- Row 5: t -->
  <g filter="url(#rough2)">
    <rect x="20" y="206" width="40" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="40" y="222" text-anchor="middle" font-size="10" fill="#333">5</text>
    <rect x="64" y="206" width="40" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="84" y="222" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">t</text>
    <rect x="108" y="206" width="150" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="183" y="222" text-anchor="middle" font-size="10" fill="#333">push t</text>
    <rect x="266" y="206" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="280" y="222" text-anchor="middle" font-size="11" fill="#446688">!</text>
    <rect x="296" y="206" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="310" y="222" text-anchor="middle" font-size="11" fill="#446688">&amp;</text>
    <rect x="326" y="206" width="28" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3"/>
    <text x="340" y="222" text-anchor="middle" font-size="11" fill="#d6a040">(</text>
    <rect x="356" y="206" width="28" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3"/>
    <text x="370" y="222" text-anchor="middle" font-size="11" fill="#b85450">f</text>
    <rect x="386" y="206" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <text x="400" y="222" text-anchor="middle" font-size="11" fill="#4a7a3a">t</text>
  </g>

  <!-- Row 6: ) reduce &(f,t)=f -->
  <g filter="url(#rough2)">
    <rect x="20" y="234" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3"/>
    <text x="40" y="250" text-anchor="middle" font-size="10" fill="#333">6</text>
    <rect x="64" y="234" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3"/>
    <text x="84" y="250" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">)</text>
    <rect x="108" y="234" width="150" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3"/>
    <text x="183" y="250" text-anchor="middle" font-size="9" fill="#b85450">归约 &amp;(f,t)=f</text>
    <rect x="266" y="234" width="28" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="280" y="250" text-anchor="middle" font-size="11" fill="#446688">!</text>
    <rect x="296" y="234" width="28" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3"/>
    <text x="310" y="250" text-anchor="middle" font-size="11" fill="#b85450">f</text>
  </g>

  <!-- Row 7: ) reduce !(f)=t -->
  <g filter="url(#rough2)">
    <rect x="20" y="262" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3"/>
    <text x="40" y="278" text-anchor="middle" font-size="10" fill="#333">7</text>
    <rect x="64" y="262" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3"/>
    <text x="84" y="278" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">)</text>
    <rect x="108" y="262" width="150" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="3"/>
    <text x="183" y="278" text-anchor="middle" font-size="9" fill="#b85450">归约 !(f)=t</text>
    <rect x="266" y="262" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3"/>
    <text x="280" y="278" text-anchor="middle" font-size="11" fill="#4a7a3a">t</text>
  </g>

  <!-- footer -->
  <text x="270" y="312" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">最终栈顶 = t → 返回 true ✓</text>
</svg>
