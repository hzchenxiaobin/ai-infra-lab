<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrOrange" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：同一棵 BST，四个不同 node</text>

  <!-- ===== BST（左上） ===== -->
  <text x="40" y="56" font-size="12" fill="#888">BST：</text>

  <line x1="300" y1="86" x2="370" y2="124" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="290" y1="86" x2="240" y2="124" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="235" y1="140" x2="200" y2="178" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="255" y1="140" x2="280" y2="178" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="275" y1="194" x2="250" y2="232" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="295" y1="194" x2="318" y2="232" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>

  <circle cx="300" cy="72" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="76" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">20</text>

  <circle cx="238" cy="128" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="238" y="132" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">10</text>

  <circle cx="372" cy="128" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="372" y="132" text-anchor="middle" font-size="11" fill="#333">30</text>

  <circle cx="198" cy="184" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="198" y="188" text-anchor="middle" font-size="10" fill="#333">5</text>

  <circle cx="282" cy="184" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="282" y="188" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">15</text>

  <circle cx="248" cy="240" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="248" y="244" text-anchor="middle" font-size="10" fill="#333">12</text>

  <circle cx="322" cy="240" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="322" y="244" text-anchor="middle" font-size="10" fill="#333">17</text>

  <!-- ===== 中序序列条 ===== -->
  <text x="40" y="248" font-size="12" fill="#888">中序：</text>
  <g font-size="10" fill="#333">
    <rect x="80" y="234" width="32" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="96" y="250" text-anchor="middle">5</text>
    <rect x="114" y="234" width="32" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="130" y="250" text-anchor="middle">10</text>
    <rect x="148" y="234" width="32" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="164" y="250" text-anchor="middle">12</text>
    <rect x="182" y="234" width="32" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="198" y="250" text-anchor="middle">15</text>
    <rect x="216" y="234" width="32" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="232" y="250" text-anchor="middle">17</text>
    <rect x="250" y="234" width="32" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="266" y="250" text-anchor="middle">20</text>
    <rect x="284" y="234" width="32" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="300" y="250" text-anchor="middle">30</text>
  </g>

  <!-- ===== 右上：图例 ===== -->
  <rect x="430" y="50" width="190" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="442" y="70" font-size="11" fill="#444" font-weight="bold">图例</text>
  <circle cx="450" cy="86" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="464" y="89" font-size="10" fill="#555">查询节点 node</text>
  <circle cx="450" cy="102" r="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="464" y="105" font-size="10" fill="#555">后继 successor</text>
  <text x="442" y="120" font-size="9" fill="#888">⇒ 右-左到底 / ⇑ parent 上溯</text>

  <!-- ===== 演算表 ===== -->
  <text x="40" y="300" font-size="12" fill="#888">逐例演算：</text>

  <!-- 表头 -->
  <rect x="40" y="308" width="560" height="24" fill="#eef2f7" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="68" y="324" text-anchor="middle" font-size="10" fill="#335" font-weight="bold">node</text>
  <text x="138" y="324" text-anchor="middle" font-size="10" fill="#335" font-weight="bold">右子?</text>
  <text x="320" y="324" text-anchor="middle" font-size="10" fill="#335" font-weight="bold">搜索路径</text>
  <text x="540" y="324" text-anchor="middle" font-size="10" fill="#335" font-weight="bold">后继</text>

  <!-- 行1：node=10 有右子 -->
  <rect x="40" y="332" width="560" height="26" fill="#fffdf5" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="68" y="349" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">10</text>
  <text x="138" y="349" text-anchor="middle" font-size="10" fill="#4a7a3a">有</text>
  <text x="320" y="349" text-anchor="middle" font-size="10" fill="#333">10 ⇒右 15 ⇒左到底 12</text>
  <text x="540" y="349" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">12</text>

  <!-- 行2：node=12 无右子 -->
  <rect x="40" y="358" width="560" height="26" fill="#f7fbff" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="68" y="375" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">12</text>
  <text x="138" y="375" text-anchor="middle" font-size="10" fill="#b85450">无</text>
  <text x="320" y="375" text-anchor="middle" font-size="10" fill="#333">12 ⇑parent 15（12 是 15 的左孩 → 停）</text>
  <text x="540" y="375" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">15</text>

  <!-- 行3：node=17 无右子 -->
  <rect x="40" y="384" width="560" height="26" fill="#fffdf5" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="68" y="401" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">17</text>
  <text x="138" y="401" text-anchor="middle" font-size="10" fill="#b85450">无</text>
  <text x="320" y="401" text-anchor="middle" font-size="10" fill="#333">17⇑15(右孩)⇑10(右孩)⇑20(左孩→停)</text>
  <text x="540" y="401" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">20</text>

  <!-- 行4：node=30 无右子 -->
  <rect x="40" y="410" width="560" height="26" fill="#f7fbff" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="68" y="427" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">30</text>
  <text x="138" y="427" text-anchor="middle" font-size="10" fill="#b85450">无</text>
  <text x="320" y="427" text-anchor="middle" font-size="10" fill="#333">30⇑20(右孩)→ 20.parent=null → 越界</text>
  <text x="540" y="427" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">null</text>

  <text x="320" y="452" text-anchor="middle" font-size="10" fill="#888">中序最后一个节点（最大值）无后继，返回 null</text>
</svg>
