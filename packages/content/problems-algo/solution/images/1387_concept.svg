<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="300" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：Collatz 序列共享后缀 → 记忆化</text>
  <text x="300" y="48" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">power(12) 递归经过 6、3，而 3→1 这段后缀与 power(3) 完全相同 → 缓存命中</text>

  <!-- 10 个节点的链：12→6→3→10→5→16→8→4→2→1，center y=94, 顶部 y=72, 高 44 -->
  <!-- centers x: 35,94,153,212,271,330,389,448,507,566 -->
  <!-- 12 红 -->
  <rect x="12" y="72" width="46" height="44" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="35" y="100" text-anchor="middle" font-size="17" fill="#b85450" font-weight="bold" filter="url(#rough2)">12</text>
  <!-- 6 橙 -->
  <rect x="71" y="72" width="46" height="44" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="94" y="100" text-anchor="middle" font-size="17" fill="#d6a040" font-weight="bold" filter="url(#rough2)">6</text>
  <!-- 3 蓝 -->
  <rect x="130" y="72" width="46" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="153" y="100" text-anchor="middle" font-size="17" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <!-- 10 蓝 -->
  <rect x="189" y="72" width="46" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="212" y="100" text-anchor="middle" font-size="17" fill="#446688" font-weight="bold" filter="url(#rough2)">10</text>
  <!-- 5 蓝 -->
  <rect x="248" y="72" width="46" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="271" y="100" text-anchor="middle" font-size="17" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>
  <!-- 16 蓝 -->
  <rect x="307" y="72" width="46" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="100" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold" filter="url(#rough2)">16</text>
  <!-- 8 蓝 -->
  <rect x="366" y="72" width="46" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="389" y="100" text-anchor="middle" font-size="17" fill="#446688" font-weight="bold" filter="url(#rough2)">8</text>
  <!-- 4 蓝 -->
  <rect x="425" y="72" width="46" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="448" y="100" text-anchor="middle" font-size="17" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <!-- 2 蓝 -->
  <rect x="484" y="72" width="46" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="507" y="100" text-anchor="middle" font-size="17" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <!-- 1 绿（基准） -->
  <rect x="543" y="72" width="46" height="44" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="566" y="100" text-anchor="middle" font-size="17" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- 链上的箭头：从 box i 右边到 box i+1 左边，y=94 -->
  <path d="M 58 94 L 71 94" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 117 94 L 130 94" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 176 94 L 189 94" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 235 94 L 248 94" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 294 94 L 307 94" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 353 94 L 366 94" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 412 94 L 425 94" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 471 94 L 484 94" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 530 94 L 543 94" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 规则标注：3→10 是奇数 3x+1（变大），10→5 是偶数 ÷2 -->
  <text x="182" y="86" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">×3+1↑</text>
  <text x="241" y="86" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">÷2↓</text>

  <!-- 三条堆叠的区间条，宽度递增，体现“前缀+续接缓存” -->
  <!-- 条1：memo[3]=7，覆盖 3→1（x 130..589） -->
  <rect x="130" y="128" width="459" height="18" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="359" y="141" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">memo[3] = 7　（3→10→5→16→8→4→2→1，共享后缀，仅算一次）</text>
  <!-- 条2：memo[6]=8，覆盖 6→1（x 71..589） -->
  <rect x="71" y="152" width="518" height="18" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="330" y="165" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">memo[6] = 1 + memo[3] = 8　（前缀 6→3，续接缓存）</text>
  <!-- 条3：memo[12]=9，覆盖全部（x 12..589） -->
  <rect x="12" y="176" width="577" height="18" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="300" y="189" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">memo[12] = 1 + memo[6] = 9  ✓　（前缀 12→6，续接缓存）</text>

  <!-- 说明 -->
  <text x="300" y="218" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">💡 一旦 memo[3] 算出，之后查 power(6) / power(3) 直接 O(1) 命中，无需重走 7 步</text>
  <text x="300" y="240" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">规则：x 偶 → x/2（↓）；x 奇 → 3x+1（↑可能变大，如 3→10）。序列非单调，但保证收敛到 1</text>
  <text x="300" y="262" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">颜色：红=查询入口　橙=前缀　蓝=已缓存中间值　绿=基准（power=0）</text>
</svg>
