<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：排序 → 相邻扫描判冲突</text>

  <!-- step 1: sort -->
  <rect x="180" y="48" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="73" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">按 start 升序排序</text>

  <path d="M 280 88 L 280 108" stroke="#888" stroke-width="1.6" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- step 2: init i=1 -->
  <rect x="180" y="110" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="135" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">i = 1 （从第二场开始）</text>

  <path d="M 280 150 L 280 168" stroke="#888" stroke-width="1.6" marker-end="url(#arr2)" filter="url(#rough2)"/>

  <!-- decision: i < n ? -->
  <polygon points="280,170 380,210 280,250 180,210" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="206" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">i &lt; n ?</text>
  <text x="280" y="222" text-anchor="middle" font-size="10.5" fill="#7a5415">还有会议要比</text>

  <!-- no -> return true -->
  <path d="M 380 210 L 470 210" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="392" y="202" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="472" y="190" width="78" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="511" y="215" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">return true</text>

  <!-- yes -> down -->
  <path d="M 280 250 L 280 268" stroke="#888" stroke-width="1.6" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="288" y="264" font-size="11" fill="#888" font-weight="bold">是</text>

  <!-- decision: overlap? -->
  <polygon points="280,270 400,312 280,354 160,312" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="308" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">intervals[i][0]</text>
  <text x="280" y="324" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">&lt; prev_end ?</text>

  <!-- yes overlap -> return false -->
  <path d="M 160 312 L 80 312 L 80 358" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="112" y="304" font-size="11" fill="#b85450" font-weight="bold">是(冲突)</text>
  <rect x="40" y="360" width="86" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="83" y="385" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">return false</text>

  <!-- no overlap -> update prev_end, i++ -->
  <path d="M 400 312 L 470 312 L 470 210" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr2)" filter="url(#rough2)"/>
  <text x="424" y="304" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="418" y="358" width="120" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="478" y="376" text-anchor="middle" font-size="11" fill="#333">prev_end = end_i</text>
  <text x="478" y="392" text-anchor="middle" font-size="11" fill="#333">i++ → 回到判断</text>

  <path d="M 478 358 L 478 340 L 470 312" stroke="none" fill="none"/>
</svg>
