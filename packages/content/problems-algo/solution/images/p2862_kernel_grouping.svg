<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：按下标的「无平方因子核」P(i) 分组</text>

  <!-- 分解示意框 -->
  <rect x="30" y="38" width="500" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">每个正整数 i 都能唯一写成 i = k · m²，其中 k 不含平方因子，称为 i 的「核」P(i)</text>
  <text x="280" y="84" text-anchor="middle" font-size="12" fill="#555">18 = 2·3²　　12 = 3·2²　　50 = 2·5²　　45 = 5·3²</text>

  <!-- 下标格子 -->
  <text x="280" y="124" text-anchor="middle" font-size="12" fill="#555">把下标 1 ~ 12 按核染色：</text>

  <text x="61" y="142" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">k=1</text>
  <text x="101" y="142" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">k=2</text>
  <text x="141" y="142" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">k=3</text>
  <text x="181" y="142" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">k=1</text>
  <text x="221" y="142" text-anchor="middle" font-size="10" fill="#999">k=5</text>
  <text x="261" y="142" text-anchor="middle" font-size="10" fill="#999">k=6</text>
  <text x="301" y="142" text-anchor="middle" font-size="10" fill="#999">k=7</text>
  <text x="341" y="142" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">k=2</text>
  <text x="381" y="142" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">k=1</text>
  <text x="421" y="142" text-anchor="middle" font-size="10" fill="#999">k=10</text>
  <text x="461" y="142" text-anchor="middle" font-size="10" fill="#999">k=11</text>
  <text x="501" y="142" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">k=3</text>

  <rect x="42" y="148" width="38" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="61" y="170" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="82" y="148" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="101" y="170" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="122" y="148" width="38" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="141" y="170" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="162" y="148" width="38" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="181" y="170" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="202" y="148" width="38" height="34" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="221" y="170" text-anchor="middle" font-size="13" fill="#333">5</text>
  <rect x="242" y="148" width="38" height="34" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="261" y="170" text-anchor="middle" font-size="13" fill="#333">6</text>
  <rect x="282" y="148" width="38" height="34" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="301" y="170" text-anchor="middle" font-size="13" fill="#333">7</text>
  <rect x="322" y="148" width="38" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="341" y="170" text-anchor="middle" font-size="13" fill="#333">8</text>
  <rect x="362" y="148" width="38" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="381" y="170" text-anchor="middle" font-size="13" fill="#333">9</text>
  <rect x="402" y="148" width="38" height="34" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="421" y="170" text-anchor="middle" font-size="13" fill="#333">10</text>
  <rect x="442" y="148" width="38" height="34" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="461" y="170" text-anchor="middle" font-size="13" fill="#333">11</text>
  <rect x="482" y="148" width="38" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="501" y="170" text-anchor="middle" font-size="13" fill="#333">12</text>

  <!-- 分组列表 -->
  <rect x="42" y="196" width="478" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="58" y="216" font-size="12" fill="#333">核 k=1：{1, 4, 9} = {1·1², 1·2², 1·3²}</text>

  <rect x="42" y="232" width="478" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="58" y="252" font-size="12" fill="#333">核 k=2：{2, 8} = {2·1², 2·2²}</text>

  <rect x="42" y="268" width="478" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="58" y="288" font-size="12" fill="#333">核 k=3：{3, 12} = {3·1², 3·2²}</text>

  <rect x="42" y="304" width="478" height="30" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="58" y="324" font-size="12" fill="#666">核 k=5, 6, 7, 10, 11：各为单元素组（k·1²）</text>

  <!-- 结论框 -->
  <rect x="30" y="348" width="500" height="66" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="372" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">同组任意两个下标相乘：i·j = k²·(m₁·m₂)² = (k·m₁·m₂)²，必是完全平方数</text>
  <text x="280" y="396" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">反之 P(i) ≠ P(j) 时 i·j 必不是平方数 ⟹ i·j 是平方数 ⟺ P(i) = P(j)</text>
</svg>
