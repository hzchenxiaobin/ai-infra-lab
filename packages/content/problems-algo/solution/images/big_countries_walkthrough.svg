<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">示例演算：5 行逐行 WHERE 判定 → 留 2 行</text>

  <!-- Header row -->
  <rect x="30" y="54" width="560" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="68" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">name</text>
  <text x="200" y="68" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">area</text>
  <text x="310" y="68" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">population</text>
  <text x="420" y="68" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">area≥3M</text>
  <text x="510" y="68" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">OR 保留?</text>
  <line x1="150" y1="54" x2="150" y2="76" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="250" y1="54" x2="250" y2="76" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="370" y1="54" x2="370" y2="76" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="470" y1="54" x2="470" y2="76" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Row 1: Afghanistan - keep -->
  <rect x="30" y="76" width="560" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="90" y="90" text-anchor="middle" font-size="9" fill="#333">Afghanistan</text>
  <text x="200" y="90" text-anchor="middle" font-size="9" fill="#333">652230</text>
  <text x="310" y="90" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">25500100</text>
  <text x="420" y="90" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">FALSE</text>
  <text x="510" y="90" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">✓ TRUE</text>
  <line x1="150" y1="76" x2="150" y2="98" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="250" y1="76" x2="250" y2="98" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="370" y1="76" x2="370" y2="98" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="470" y1="76" x2="470" y2="98" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- Row 2: Albania - drop -->
  <rect x="30" y="98" width="560" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="90" y="112" text-anchor="middle" font-size="9" fill="#333">Albania</text>
  <text x="200" y="112" text-anchor="middle" font-size="9" fill="#333">28748</text>
  <text x="310" y="112" text-anchor="middle" font-size="9" fill="#333">2831741</text>
  <text x="420" y="112" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">FALSE</text>
  <text x="510" y="112" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">✗ FALSE</text>
  <line x1="150" y1="98" x2="150" y2="120" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="250" y1="98" x2="250" y2="120" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="370" y1="98" x2="370" y2="120" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="470" y1="98" x2="470" y2="120" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- Row 3: Algeria - keep -->
  <rect x="30" y="120" width="560" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="90" y="134" text-anchor="middle" font-size="9" fill="#333">Algeria</text>
  <text x="200" y="134" text-anchor="middle" font-size="9" fill="#333">2381741</text>
  <text x="310" y="134" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">37100000</text>
  <text x="420" y="134" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">FALSE</text>
  <text x="510" y="134" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">✓ TRUE</text>
  <line x1="150" y1="120" x2="150" y2="142" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="250" y1="120" x2="250" y2="142" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="370" y1="120" x2="370" y2="142" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="470" y1="120" x2="470" y2="142" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- Row 4: Andorra - drop -->
  <rect x="30" y="142" width="560" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="90" y="156" text-anchor="middle" font-size="9" fill="#333">Andorra</text>
  <text x="200" y="156" text-anchor="middle" font-size="9" fill="#333">468</text>
  <text x="310" y="156" text-anchor="middle" font-size="9" fill="#333">78115</text>
  <text x="420" y="156" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">FALSE</text>
  <text x="510" y="156" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">✗ FALSE</text>
  <line x1="150" y1="142" x2="150" y2="164" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="250" y1="142" x2="250" y2="164" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="370" y1="142" x2="370" y2="164" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="470" y1="142" x2="470" y2="164" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- Row 5: Angola - drop -->
  <rect x="30" y="164" width="560" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="90" y="178" text-anchor="middle" font-size="9" fill="#333">Angola</text>
  <text x="200" y="178" text-anchor="middle" font-size="9" fill="#333">1246700</text>
  <text x="310" y="178" text-anchor="middle" font-size="9" fill="#333">20609294</text>
  <text x="420" y="178" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">FALSE</text>
  <text x="510" y="178" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">✗ FALSE</text>
  <line x1="150" y1="164" x2="150" y2="186" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="250" y1="164" x2="250" y2="186" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="370" y1="164" x2="370" y2="186" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="470" y1="164" x2="470" y2="186" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- Arrow down -->
  <path d="M310 192 L310 212" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="395" y="208" font-size="10" fill="#b85450" font-weight="bold">WHERE 留 TRUE 行（2 行）</text>

  <!-- Filtered result -->
  <rect x="80" y="222" width="460" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="236" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">name</text>
  <text x="310" y="236" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">population</text>
  <text x="470" y="236" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">area</text>
  <line x1="240" y1="222" x2="240" y2="244" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="400" y1="222" x2="400" y2="244" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="80" y="244" width="460" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="170" y="257" text-anchor="middle" font-size="9" fill="#333">Afghanistan</text>
  <text x="310" y="257" text-anchor="middle" font-size="9" fill="#333">25500100</text>
  <text x="470" y="257" text-anchor="middle" font-size="9" fill="#333">652230</text>
  <line x1="240" y1="244" x2="240" y2="262" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="400" y1="244" x2="400" y2="262" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <rect x="80" y="262" width="460" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="170" y="275" text-anchor="middle" font-size="9" fill="#333">Algeria</text>
  <text x="310" y="275" text-anchor="middle" font-size="9" fill="#333">37100000</text>
  <text x="470" y="275" text-anchor="middle" font-size="9" fill="#333">2381741</text>
  <line x1="240" y1="262" x2="240" y2="280" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="400" y1="262" x2="400" y2="280" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- Arrow down to output -->
  <path d="M310 288 L310 308" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="395" y="304" font-size="10" fill="#4a7a3a" font-weight="bold">SELECT name, population, area</text>

  <!-- Final output -->
  <rect x="150" y="316" width="320" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="336" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">最终输出</text>
  <text x="310" y="352" text-anchor="middle" font-size="9" fill="#333">Afghanistan, 25500100, 652230</text>
  <text x="310" y="366" text-anchor="middle" font-size="9" fill="#333">Algeria, 37100000, 2381741</text>

  <!-- Note callout -->
  <rect x="56" y="388" width="508" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="310" y="406" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">观察要点</text>
  <text x="68" y="422" font-size="9" fill="#333">• 本例 5 国中仅 Afghanistan / Algeria 人口 ≥ 2500万 → 保留；area 列全部 &lt; 300万 → 该条件全 FALSE</text>
  <text x="68" y="436" font-size="9" fill="#4a7a3a" font-weight="bold">• OR 仍逐行检查两条件：即使 area 全 FALSE，靠 population 条件救回 2 行</text>
</svg>
