<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="32" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">高位 6 → 9 收益最大</text>

  <text x="55" y="100" font-size="13" fill="#4a7a3a" filter="url(#rough2)">原数</text>
  <rect x="90" y="72" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="105" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">9</text>
  <rect x="145" y="72" width="50" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="105" text-anchor="middle" font-size="20" fill="#b85450" filter="url(#rough2)">6</text>
  <rect x="200" y="72" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="225" y="105" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">6</text>
  <rect x="255" y="72" width="50" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="105" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">9</text>

  <text x="115" y="140" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">千位</text>
  <text x="170" y="140" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">百位</text>
  <text x="225" y="140" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">十位</text>
  <text x="280" y="140" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">个位</text>

  <path d="M170,152 L170,182" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="188" y="172" font-size="12" fill="#b85450" filter="url(#rough2)">6→9</text>

  <text x="55" y="222" font-size="13" fill="#4a7a3a" filter="url(#rough2)">结果</text>
  <rect x="90" y="194" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="115" y="227" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">9</text>
  <rect x="145" y="194" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="227" text-anchor="middle" font-size="20" fill="#4a7a3a" filter="url(#rough2)">9</text>
  <rect x="200" y="194" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="225" y="227" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">6</text>
  <rect x="255" y="194" width="50" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="227" text-anchor="middle" font-size="20" fill="#333" filter="url(#rough2)">9</text>

  <rect x="340" y="78" width="160" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="420" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">收益 = 3 × 10²</text>
  <text x="420" y="122" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">= 3 × 100</text>
  <text x="420" y="144" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">= +300</text>

  <rect x="55" y="278" width="410" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="302" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6→9 使数值增大，9→6 使数值减小</text>
  <text x="260" y="322" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">故只做 6→9；越高位改动收益越大</text>
</svg>
