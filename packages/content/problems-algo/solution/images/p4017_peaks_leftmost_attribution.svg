<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：按最左峰归责 —— 子数组数给它的最左严格内部峰</text>

  <!-- 数组格子 nums = [1,5,1,5,1,5,1] -->
  <text x="168" y="34" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">≤ l，出局</text>
  <text x="168" y="50" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">峰1</text>
  <text x="260" y="50" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">峰3</text>
  <text x="352" y="50" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">峰5</text>

  <rect x="99"  y="56" width="46" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="145" y="56" width="46" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="191" y="56" width="46" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="237" y="56" width="46" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="283" y="56" width="46" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="329" y="56" width="46" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <rect x="375" y="56" width="46" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="122" y="83" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="168" y="83" text-anchor="middle" font-size="14" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="214" y="83" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="260" y="83" text-anchor="middle" font-size="14" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="306" y="83" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="352" y="83" text-anchor="middle" font-size="14" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="398" y="83" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>

  <text x="122" y="114" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">0</text>
  <text x="168" y="114" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1</text>
  <text x="214" y="114" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">2</text>
  <text x="260" y="114" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">3</text>
  <text x="306" y="114" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">4</text>
  <text x="352" y="114" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">5</text>
  <text x="398" y="114" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">6</text>

  <!-- 查询区间括线 [l=2, r=6] -->
  <path d="M 191 128 H 421" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 191 122 V 134" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 421 122 V 134" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="306" y="148" text-anchor="middle" font-size="11" fill="#7a5c1a" font-weight="bold" filter="url(#rough2)">查询 [l=2, r=6]：(l,r) 内的峰 = {3, 5}，即 a=3、b=5</text>

  <!-- 归责两行 -->
  <rect x="36" y="162" width="88" height="24" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="178" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">峰 3 归责</text>
  <text x="136" y="178" font-size="9.5" fill="#333" filter="url(#rough2)">i ∈ [2,2]（被 l 截断）× j ∈ [4,6] → 1×3 = 3 个</text>

  <rect x="36" y="196" width="88" height="24" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="80" y="212" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">峰 5 归责</text>
  <text x="136" y="212" font-size="9.5" fill="#333" filter="url(#rough2)">i ∈ [3,4]（卡在前峰 3）× j ∈ [6,6] → 2×1 = 2 个</text>

  <text x="136" y="234" font-size="8" fill="#999" filter="url(#rough2)">＊左端点可取到前一个峰的下标本身——峰落在端点上不算严格内部，不抢归责；右端点只要求 j &gt; p，自由伸到 r</text>

  <!-- 公式框 -->
  <rect x="36" y="244" width="448" height="96" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="266" text-anchor="middle" font-size="11" fill="#7a5c1a" font-weight="bold" filter="url(#rough2)">合计 3 + 2 = 5 个峰值子数组</text>
  <text x="260" y="288" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">代数变形：ans = r·(b−l) − W + a·(l−q)</text>
  <text x="260" y="308" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">= 6·(5−2) − 16 + 3·(2−1) = 18 − 16 + 3 = 5</text>
  <text x="260" y="328" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">W = value[3] + value[5] = 3·(3−1) + 5·(5−3) = 16；q = 峰 3 的全局前驱 = 1</text>
</svg>
