<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：遍历找金格 → DFS 收集 → 回溯退还</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">时间 O(k·3^k)，空间 O(k)</text>

  <g font-size="10" fill="#333">
    <!-- Step 1: find start -->
    <rect x="40" y="64" width="480" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="84" font-size="12" fill="#446688" font-weight="bold">① 遍历网格找金格起点</text>
    <text x="54" y="102" font-family="monospace" font-size="10" fill="#555">for i in 0..m: for j in 0..n:</text>
    <text x="54" y="116" font-family="monospace" font-size="10" fill="#446688">    if grid[i][j] != 0: ans = max(ans, dfs(i,j))</text>

    <path d="M 280 122 L 280 136" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 2: prune -->
    <rect x="40" y="140" width="480" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="160" font-size="12" fill="#b85450" font-weight="bold">② 剪枝（递归入口）</text>
    <text x="54" y="178" font-family="monospace" font-size="10" fill="#555">if 越界 or grid[i][j]==0: return 0</text>
    <text x="54" y="192" font-family="monospace" font-size="10" fill="#b85450">    // 空格或已访问，此路不通</text>

    <path d="M 280 192 L 280 206" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 3: collect + mark -->
    <rect x="40" y="210" width="480" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="230" font-size="12" fill="#4a7a3a" font-weight="bold">③ 收集 + 标记</text>
    <text x="170" y="230" font-family="monospace" font-size="10" fill="#4a7a3a">gold = grid[i][j]; grid[i][j] = 0</text>
    <text x="170" y="246" font-size="9" fill="#888">取走黄金，置 0 防重入</text>

    <path d="M 280 256 L 280 270" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 4: recurse + backtrack -->
    <rect x="40" y="274" width="480" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="294" font-size="12" fill="#d6a040" font-weight="bold">④ 四方向递归 → 取最大 → 回溯退还</text>
    <text x="54" y="312" font-family="monospace" font-size="10" fill="#446688">best = 0</text>
    <text x="54" y="328" font-family="monospace" font-size="10" fill="#446688">for d in 4方向: best = max(best, dfs(i+dx[d], j+dy[d]))</text>
    <text x="54" y="344" font-family="monospace" font-size="10" fill="#d6a040">grid[i][j] = gold          // 回溯：退还黄金</text>
    <text x="54" y="358" font-family="monospace" font-size="10" fill="#4a7a3a">return gold + best</text>

    <path d="M 280 362 L 280 376" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 5: done -->
    <rect x="40" y="380" width="480" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="400" font-size="12" fill="#446688" font-weight="bold">⑤ 返回全局最大值 ans</text>
    <text x="220" y="400" font-family="monospace" font-size="10" fill="#555">所有起点 DFS 取最大</text>
    <text x="220" y="414" font-size="9" fill="#888">矿工可任意起点出发或停止</text>
  </g>
</svg>
