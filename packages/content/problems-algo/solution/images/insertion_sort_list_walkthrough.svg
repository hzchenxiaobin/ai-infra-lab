<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="'Comic Sans MS','Marker Felt','Kaiti SC',楷体,'Segoe UI',cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="720" height="540" fill="#fdfcf7"/>

  <text x="360" y="28" text-anchor="middle" font-size="16" fill="#2b2b2b" font-weight="bold">示例演算：head = [4, 2, 1, 3]</text>
  <path d="M 220 38 Q 360 46 500 38" stroke="#2b2b2b" stroke-width="1.3" fill="none" filter="url(#sk)"/>
  <text x="360" y="54" text-anchor="middle" font-size="11" fill="#888">每轮摘下原链表首节点 cur，正向扫描已排序段找位置插入</text>

  <!-- 图例 -->
  <g filter="url(#sk)">
    <rect x="540" y="64" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3"/>
  </g>
  <text x="560" y="76" font-size="10" fill="#555">dummy</text>
  <g filter="url(#sk)">
    <rect x="600" y="64" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3"/>
  </g>
  <text x="620" y="76" font-size="10" fill="#555">已排序</text>
  <g filter="url(#sk)">
    <rect x="660" y="64" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3"/>
  </g>
  <text x="680" y="76" font-size="10" fill="#555">cur</text>

  <!-- ===== 轮1: cur=4 ===== -->
  <text x="24" y="104" font-size="12" fill="#4a7a3a" font-weight="bold">轮1</text>
  <text x="60" y="104" font-size="11" fill="#444">cur=4，prev=dummy（prev.next=null）→ 4 插在最前</text>
  <g filter="url(#sk)">
    <rect x="40" y="112" width="56" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="110" y="112" width="46" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="68" y="132" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">dummy</text>
  <text x="133" y="132" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">4</text>
  <path d="M 96 127 L 108 127" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="180" y="132" font-size="10" fill="#888">已排序：[4]</text>

  <!-- ===== 轮2: cur=2 ===== -->
  <text x="24" y="170" font-size="12" fill="#4a7a3a" font-weight="bold">轮2</text>
  <text x="60" y="170" font-size="11" fill="#444">cur=2，prev=dummy（prev.next.val=4 ≥ 2）→ 停，插在 4 前</text>
  <g filter="url(#sk)">
    <rect x="40" y="178" width="56" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="110" y="178" width="46" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="170" y="178" width="46" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="68" y="198" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">dummy</text>
  <text x="133" y="198" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">2</text>
  <text x="193" y="198" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">4</text>
  <path d="M 96 193 L 108 193" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 156 193 L 168 193" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="240" y="198" font-size="10" fill="#888">已排序：[2,4]</text>
  <text x="133" y="168" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">prev↓</text>

  <!-- ===== 轮3: cur=1 ===== -->
  <text x="24" y="236" font-size="12" fill="#4a7a3a" font-weight="bold">轮3</text>
  <text x="60" y="236" font-size="11" fill="#444">cur=1，prev=dummy（prev.next.val=2 ≥ 1）→ 停，插在 2 前</text>
  <g filter="url(#sk)">
    <rect x="40" y="244" width="56" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="110" y="244" width="46" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="170" y="244" width="46" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="230" y="244" width="46" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="68" y="264" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">dummy</text>
  <text x="133" y="264" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">1</text>
  <text x="193" y="264" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">2</text>
  <text x="253" y="264" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">4</text>
  <path d="M 96 259 L 108 259" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 156 259 L 168 259" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 216 259 L 228 259" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="300" y="264" font-size="10" fill="#888">已排序：[1,2,4]</text>
  <text x="133" y="234" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">prev↓</text>

  <!-- ===== 轮4: cur=3 ===== -->
  <text x="24" y="302" font-size="12" fill="#4a7a3a" font-weight="bold">轮4</text>
  <text x="60" y="302" font-size="11" fill="#444">cur=3，prev 从 dummy 走过 1、2（都 &lt; 3），停在 4 前 → 插在 2 与 4 之间</text>
  <g filter="url(#sk)">
    <rect x="40" y="310" width="56" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <rect x="110" y="310" width="46" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="170" y="310" width="46" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="230" y="310" width="46" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
    <rect x="290" y="310" width="46" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="68" y="330" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">dummy</text>
  <text x="133" y="330" text-anchor="middle" font-size="12" fill="#2b2b2b">1</text>
  <text x="193" y="330" text-anchor="middle" font-size="12" fill="#2b2b2b">2</text>
  <text x="253" y="330" text-anchor="middle" font-size="12" fill="#2b2b2b" font-weight="bold">3</text>
  <text x="313" y="330" text-anchor="middle" font-size="12" fill="#2b2b2b">4</text>
  <path d="M 96 325 L 108 325" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 156 325 L 168 325" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 216 325 L 228 325" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 276 325 L 288 325" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="360" y="330" font-size="10" fill="#888">已排序：[1,2,3,4] ✓</text>
  <!-- prev 指向 node(2) -->
  <text x="193" y="300" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">prev↓</text>
  <path d="M 193 302 L 193 310" stroke="#b85450" stroke-width="1" fill="none" stroke-dasharray="2,2" filter="url(#sk)"/>
  <!-- 扫描轨迹 -->
  <path d="M 90 345 Q 140 358 193 345" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="140" y="370" text-anchor="middle" font-size="9" fill="#4a7a3a">prev 走过 1→2，val&lt;3 继续；到 2 后 prev.next=4 ≥ 3 停</text>

  <!-- ===== 最终结果 ===== -->
  <path d="M 40 388 L 680 388" stroke="#d0d0d0" stroke-width="1" stroke-dasharray="4,3" fill="none" filter="url(#sk)"/>
  <text x="24" y="416" font-size="12" fill="#888" font-weight="bold">结果</text>
  <g filter="url(#sk)">
    <rect x="70" y="404" width="50" height="32" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="140" y="404" width="50" height="32" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="210" y="404" width="50" height="32" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
    <rect x="280" y="404" width="50" height="32" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="95" y="424" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold">1</text>
  <text x="165" y="424" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold">2</text>
  <text x="235" y="424" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold">3</text>
  <text x="305" y="424" text-anchor="middle" font-size="13" fill="#2b2b2b" font-weight="bold">4</text>
  <path d="M 120 420 L 138 420" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 190 420 L 208 420" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 260 420 L 278 420" stroke="#3a3a3a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="360" y="424" font-size="11" fill="#888">return dummy.next → [1,2,3,4]</text>

  <!-- 底部要点 -->
  <rect x="24" y="452" width="672" height="68" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#sk)"/>
  <text x="360" y="474" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">观察：每轮 cur 走 1 步、prev 最多扫过已排序段 → 最坏 O(n²)</text>
  <text x="40" y="494" font-size="10.5" fill="#444">· 最好情况（原链表已升序）：每轮 prev 直接停（prev.next.val ≥ cur.val），prev 不前进，总比较 n → O(n)</text>
  <text x="40" y="510" font-size="10.5" fill="#444">· 最坏情况（原链表降序）：每轮 prev 走完整段已排序部分，总比较 1+2+…+(n−1) → O(n²)；平均也是 O(n²)</text>
</svg>
