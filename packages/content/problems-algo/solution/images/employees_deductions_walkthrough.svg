<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：逐条打卡算时差 → 按员工汇总 → 比所需工时</text>

  <!-- column headers -->
  <rect x="20" y="50" width="580" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55"  y="69" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">emp</text>
  <text x="185" y="69" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">in_time</text>
  <text x="325" y="69" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">out_time</text>
  <text x="450" y="69" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">时差(HOUR)</text>
  <text x="555" y="69" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">累加</text>

  <!-- rows -->
  <g font-size="11" fill="#333">
    <text x="55"  y="96" text-anchor="middle">1</text>
    <text x="185" y="96" text-anchor="middle">10-01 09:00</text>
    <text x="325" y="96" text-anchor="middle">10-01 17:00</text>
    <text x="450" y="96" text-anchor="middle">8</text>
    <text x="555" y="96" text-anchor="middle">8</text>

    <text x="55"  y="116" text-anchor="middle">1</text>
    <text x="185" y="116" text-anchor="middle">10-06 09:05</text>
    <text x="325" y="116" text-anchor="middle">10-06 17:09</text>
    <text x="450" y="116" text-anchor="middle">8</text>
    <text x="555" y="116" text-anchor="middle">16</text>

    <text x="55"  y="136" text-anchor="middle">1</text>
    <text x="185" y="136" text-anchor="middle">10-12 23:00</text>
    <text x="325" y="136" text-anchor="middle">10-13 03:00</text>
    <text x="450" y="136" text-anchor="middle">4</text>
    <text x="555" y="136" text-anchor="middle">20</text>

    <text x="55"  y="160" text-anchor="middle" fill="#b85450">2</text>
    <text x="185" y="160" text-anchor="middle" fill="#b85450">10-29 12:00</text>
    <text x="325" y="160" text-anchor="middle" fill="#b85450">10-29 23:58</text>
    <text x="450" y="160" text-anchor="middle" fill="#b85450">11</text>
    <text x="555" y="160" text-anchor="middle" fill="#b85450">11</text>

    <text x="55"  y="184" text-anchor="middle" fill="#b85450">3</text>
    <text x="185" y="184" text-anchor="middle" fill="#888">— 无打卡 —</text>
    <text x="325" y="184" text-anchor="middle" fill="#888">NULL</text>
    <text x="450" y="184" text-anchor="middle" fill="#888">COALESCE→0</text>
    <text x="555" y="184" text-anchor="middle" fill="#b85450">0</text>
  </g>

  <!-- row separators -->
  <line x1="20" y1="78"  x2="600" y2="78"  stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="104" x2="600" y2="104" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="124" x2="600" y2="124" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="148" x2="600" y2="148" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="168" x2="600" y2="168" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="192" x2="600" y2="192" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- arrow down to verdict -->
  <path d="M 310 200 L 310 222" stroke="#b85450" stroke-width="2" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="400" y="216" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">GROUP BY + HAVING worked &lt; needed</text>

  <!-- verdict table -->
  <rect x="60" y="228" width="500" height="120" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="248" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">判定：worked &lt; needed_hours ?</text>
  <line x1="70" y1="256" x2="550" y2="256" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="120" y="276" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">emp</text>
  <text x="250" y="276" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">worked</text>
  <text x="370" y="276" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">needed</text>
  <text x="490" y="276" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">是否开除</text>
  <line x1="70" y1="284" x2="550" y2="284" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>

  <g font-size="11" fill="#333">
    <text x="120" y="304" text-anchor="middle">1</text>
    <text x="250" y="304" text-anchor="middle">20</text>
    <text x="370" y="304" text-anchor="middle">20</text>
    <text x="490" y="304" text-anchor="middle" fill="#4a7a3a" font-weight="bold">否 (20≮20)</text>

    <text x="120" y="324" text-anchor="middle" fill="#b85450">2</text>
    <text x="250" y="324" text-anchor="middle" fill="#b85450">11</text>
    <text x="370" y="324" text-anchor="middle">12</text>
    <text x="490" y="324" text-anchor="middle" fill="#b85450" font-weight="bold">是 (11&lt;12)</text>

    <text x="120" y="344" text-anchor="middle" fill="#b85450">3</text>
    <text x="250" y="344" text-anchor="middle" fill="#b85450">0</text>
    <text x="370" y="344" text-anchor="middle">2</text>
    <text x="490" y="344" text-anchor="middle" fill="#b85450" font-weight="bold">是 (0&lt;2)</text>
  </g>

  <!-- output -->
  <rect x="190" y="370" width="240" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="390" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">输出 employee_id</text>
  <text x="310" y="408" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2, 3</text>
  <path d="M 310 350 L 310 370" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="310" y="444" text-anchor="middle" font-size="10" fill="#888">员工3 无打卡：LEFT JOIN 保行 + COALESCE 归 0，0 &lt; 2 必入名单</text>
</svg>
