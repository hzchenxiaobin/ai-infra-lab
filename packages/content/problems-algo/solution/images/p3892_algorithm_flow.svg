<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：预处理 → 拆环两情况 → 链上计数 DP 取 min</text>

  <!-- start -->
  <rect x="200" y="32" width="120" height="26" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="49" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">输入 nums, k</text>

  <path d="M 260 58 L 260 70" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <!-- decision 1 -->
  <polygon points="260,70 340,96 260,122 180,96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="93" text-anchor="middle" font-size="10" fill="#8a6d1a" filter="url(#rough2)">k = 0 ？</text>
  <text x="260" y="106" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">或 k &gt; ⌊n/2⌋ ？</text>
  <path d="M 340 96 L 396 96" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="368" y="88" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="400" y="82" width="92" height="28" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="446" y="94" text-anchor="middle" font-size="9.5" fill="#8a3030" font-weight="bold" filter="url(#rough2)">k=0 ⟹ 0</text>
  <text x="446" y="105" text-anchor="middle" font-size="9.5" fill="#8a3030" font-weight="bold" filter="url(#rough2)">超界 ⟹ −1</text>

  <path d="M 260 122 L 260 138" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="272" y="134" font-size="9" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- cost preprocess -->
  <rect x="160" y="140" width="200" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="156" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">① 预处理代价</text>
  <text x="260" y="171" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">cost[i] = max(0, max(环邻)+1−nums[i])</text>

  <path d="M 260 180 L 260 196" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <!-- decision 2 -->
  <polygon points="260,196 348 222 260,248 172,222" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="219" text-anchor="middle" font-size="10" fill="#8a6d1a" filter="url(#rough2)">② 下标 0 是否为峰？</text>
  <text x="260" y="233" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">（0 与 n−1 相邻，二情况不交不漏）</text>

  <path d="M 172 222 L 118 222" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="145" y="214" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">不是</text>
  <path d="M 348 222 L 402 222" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="375" y="214" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">是</text>

  <!-- case A -->
  <rect x="30" y="240" width="176" height="78" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="118" y="258" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">情况 A：链 [1, n−1]</text>
  <text x="118" y="274" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">恰选 k 个互不相邻</text>
  <text x="118" y="290" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">dp[i][j] = min(dp[i−1][j],</text>
  <text x="118" y="302" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">        dp[i−2][j−1]+cost)</text>
  <text x="118" y="314" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">结果记为 A</text>

  <!-- case B -->
  <rect x="314" y="240" width="176" height="78" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="402" y="258" text-anchor="middle" font-size="10" fill="#8a3030" font-weight="bold" filter="url(#rough2)">情况 B：峰 0 + 链 [2, n−2]</text>
  <text x="402" y="274" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">先付 cost[0]，再恰选 k−1 个</text>
  <text x="402" y="290" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">（1 与 n−1 已被 0 封死）</text>
  <text x="402" y="302" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">同款链上 DP</text>
  <text x="402" y="314" text-anchor="middle" font-size="8.5" fill="#888" filter="url(#rough2)">结果记为 B</text>

  <path d="M 118 318 L 118 338 L 236 348" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <path d="M 402 318 L 402 338 L 284 348" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>

  <!-- merge -->
  <polygon points="260,340 300,356 260,372 220,356" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="353" text-anchor="middle" font-size="10" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">③ 取 min</text>
  <text x="260" y="366" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">answer = min(A, B)</text>

  <path d="M 300 356 L 360 356" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>

  <!-- output -->
  <rect x="364" y="342" width="126" height="28" rx="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="427" y="360" text-anchor="middle" font-size="10.5" fill="#2a5a1e" font-weight="bold" filter="url(#rough2)">输出最少操作数</text>

  <!-- complexity note -->
  <rect x="30" y="388" width="460" height="40" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="404" text-anchor="middle" font-size="9.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">复杂度：时间 O(n·k)（j 只需枚举到 min(k, ⌈i/2⌉)），空间 O(k) 滚动数组</text>
  <text x="260" y="420" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">n ≤ 5000：最坏 n·k ≈ 1.25×10⁷ 状态，轻松通过；答案 ≤ 2500×(2×10⁵+1) 须 64 位</text>
</svg>
