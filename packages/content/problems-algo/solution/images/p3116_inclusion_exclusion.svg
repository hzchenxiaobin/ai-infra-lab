<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">容斥计数：3 的倍数 ∪ 5 的倍数，重叠处恰是 lcm 的倍数</text>

  <!-- legend -->
  <circle cx="96" cy="54" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="112" y="58" font-size="11" fill="#446688" filter="url(#rough2)">3 的倍数</text>
  <circle cx="196" cy="54" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="212" y="58" font-size="11" fill="#4a7a3a" filter="url(#rough2)">5 的倍数</text>
  <circle cx="296" cy="54" r="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="312" y="58" font-size="11" fill="#b85450" filter="url(#rough2)">两者重叠（15 的倍数）</text>

  <!-- number line -->
  <path d="M 52 190 L 536 190" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- multiples of 3: lollipops above (3,6,9,12,15) -->
  <g filter="url(#rough2)">
    <line x1="128" y1="186" x2="128" y2="162" stroke="#446688" stroke-width="1.5"/>
    <circle cx="128" cy="154" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <line x1="218" y1="186" x2="218" y2="162" stroke="#446688" stroke-width="1.5"/>
    <circle cx="218" cy="154" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <line x1="308" y1="186" x2="308" y2="162" stroke="#446688" stroke-width="1.5"/>
    <circle cx="308" cy="154" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <line x1="398" y1="186" x2="398" y2="162" stroke="#446688" stroke-width="1.5"/>
    <circle cx="398" cy="154" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
    <line x1="488" y1="186" x2="488" y2="162" stroke="#446688" stroke-width="1.5"/>
    <circle cx="488" cy="154" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>

  <!-- multiples of 5: lollipops below (5,10,15) -->
  <g filter="url(#rough2)">
    <line x1="188" y1="194" x2="188" y2="220" stroke="#4a7a3a" stroke-width="1.5"/>
    <circle cx="188" cy="228" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <line x1="368" y1="194" x2="368" y2="220" stroke="#4a7a3a" stroke-width="1.5"/>
    <circle cx="368" cy="228" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <line x1="488" y1="194" x2="488" y2="220" stroke="#4a7a3a" stroke-width="1.5"/>
    <circle cx="488" cy="228" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>

  <!-- overlap ring at 15 -->
  <ellipse cx="488" cy="191" rx="17" ry="66" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="470" y="112" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">15 = lcm(3,5)</text>
  <text x="470" y="126" font-size="10.5" fill="#b85450" filter="url(#rough2)">被两边各数一次！</text>

  <!-- ticks 1..16 -->
  <g font-size="11" fill="#666" text-anchor="middle" filter="url(#rough2)">
    <line x1="68"  y1="186" x2="68"  y2="194" stroke="#888" stroke-width="1.2"/><text x="68"  y="214">1</text>
    <line x1="98"  y1="186" x2="98"  y2="194" stroke="#888" stroke-width="1.2"/><text x="98"  y="214">2</text>
    <line x1="128" y1="186" x2="128" y2="194" stroke="#888" stroke-width="1.2"/><text x="128" y="214">3</text>
    <line x1="158" y1="186" x2="158" y2="194" stroke="#888" stroke-width="1.2"/><text x="158" y="214">4</text>
    <line x1="188" y1="186" x2="188" y2="194" stroke="#888" stroke-width="1.2"/><text x="188" y="214">5</text>
    <line x1="218" y1="186" x2="218" y2="194" stroke="#888" stroke-width="1.2"/><text x="218" y="214">6</text>
    <line x1="248" y1="186" x2="248" y2="194" stroke="#888" stroke-width="1.2"/><text x="248" y="214">7</text>
    <line x1="278" y1="186" x2="278" y2="194" stroke="#888" stroke-width="1.2"/><text x="278" y="214">8</text>
    <line x1="308" y1="186" x2="308" y2="194" stroke="#888" stroke-width="1.2"/><text x="308" y="214">9</text>
    <line x1="338" y1="186" x2="338" y2="194" stroke="#888" stroke-width="1.2"/><text x="338" y="214">10</text>
    <line x1="368" y1="186" x2="368" y2="194" stroke="#888" stroke-width="1.2"/><text x="368" y="214">11</text>
    <line x1="398" y1="186" x2="398" y2="194" stroke="#888" stroke-width="1.2"/><text x="398" y="214">12</text>
    <line x1="428" y1="186" x2="428" y2="194" stroke="#888" stroke-width="1.2"/><text x="428" y="214">13</text>
    <line x1="458" y1="186" x2="458" y2="194" stroke="#888" stroke-width="1.2"/><text x="458" y="214">14</text>
    <line x1="488" y1="186" x2="488" y2="194" stroke="#888" stroke-width="1.2"/><text x="488" y="214">15</text>
    <line x1="518" y1="186" x2="518" y2="194" stroke="#888" stroke-width="1.2"/><text x="518" y="214">16</text>
  </g>

  <!-- formula box -->
  <rect x="46" y="276" width="468" height="86" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="280" y="298" text-anchor="middle" font-size="12.5" fill="#335" font-weight="bold" filter="url(#rough2)">count(x) = ⌊x/3⌋ + ⌊x/5⌋ − ⌊x/15⌋</text>
  <text x="280" y="318" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">「3 的倍数」与「5 的倍数」交集 = 「15 = lcm(3,5) 的倍数」，多加的减回来</text>
  <text x="280" y="336" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">n 个硬币 ⇒ 2ⁿ−1 个非空子集，按 |子集| 奇偶决定加减号</text>
  <text x="280" y="354" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">count(x) 随 x 单调不减 ⇒ 可二分「第 k 小」</text>
</svg>
