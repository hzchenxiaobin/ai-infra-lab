<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 560"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="560" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：排序 → 前缀最大美丽值 → 逐查询二分</text>

  <!-- Step 1: Sort -->
  <rect x="130" y="48" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="70" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">① 按 price 升序排序 items</text>

  <path d="M 260 84 L 260 104" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: Build prefMax -->
  <rect x="130" y="108" width="260" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="130" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 原地 prefMax[i] = max(beauty[0..i])</text>

  <path d="M 260 144 L 260 164" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: Loop queries -->
  <rect x="130" y="168" width="260" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="190" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">③ 遍历每个查询 q</text>

  <path d="M 260 204 L 260 224" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: Binary search (diamond) -->
  <polygon points="260,228 400,272 260,316 120,272" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="264" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">④ upper_bound</text>
  <text x="260" y="280" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">找首个 price &gt; q</text>
  <text x="260" y="294" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">的位置 idx</text>

  <!-- Left branch: idx == 0 -->
  <path d="M 120 272 L 60 272 L 60 332" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="68" y="264" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">idx == 0</text>

  <rect x="14" y="336" width="180" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="104" y="356" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">无价格 ≤ q 的物品</text>
  <text x="104" y="374" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">answer[j] = 0</text>

  <!-- Right branch: idx > 0 -->
  <path d="M 400 272 L 460 272 L 460 332" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="416" y="264" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">idx &gt; 0</text>

  <rect x="326" y="336" width="180" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="416" y="356" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">idx-1 = 最后 price ≤ q</text>
  <text x="416" y="374" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">answer = prefMax[idx-1]</text>

  <!-- Converge -->
  <path d="M 104 388 L 104 408 L 260 408" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 416 388 L 416 408 L 260 408" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 260 408 L 260 428" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: Record answer -->
  <rect x="130" y="432" width="260" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="454" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">⑤ 记录 answer[j]</text>

  <!-- Loop back -->
  <path d="M 390 449 L 472 449 L 472 190 L 390 190" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="482" y="320" font-size="9.5" fill="#888" filter="url(#rough2)" transform="rotate(90 482 320)">下一个查询 q</text>

  <!-- Step 6: Return -->
  <path d="M 260 468 L 260 488" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="130" y="492" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="514" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">⑥ 返回 answer</text>

  <!-- Complexity note -->
  <text x="260" y="548" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">排序 O(n log n) + m 次二分 × O(log n) = O((n+m) log n)</text>
</svg>
