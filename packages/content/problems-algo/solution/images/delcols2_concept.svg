<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">字典序短路：decided[i]=True 的行对「免检」后续列</text>

  <!-- Example label -->
  <text x="40" y="54" font-size="11" fill="#888" font-weight="bold">示例 strs = ["ab","ac","ba"]（n=3, m=2）</text>

  <!-- ===== Matrix ===== -->
  <!-- Column headers -->
  <text x="190" y="72" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">列 0</text>
  <text x="250" y="72" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">列 1</text>

  <!-- Row labels -->
  <text x="128" y="96" text-anchor="end" font-size="10" fill="#888">行 0</text>
  <text x="128" y="130" text-anchor="end" font-size="10" fill="#888">行 1</text>
  <text x="128" y="164" text-anchor="end" font-size="10" fill="#888">行 2</text>

  <!-- Col 0 cells -->
  <rect x="168" y="80" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="100" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>
  <rect x="168" y="110" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="130" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>
  <rect x="168" y="140" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="160" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">b</text>

  <!-- Col 1 cells -->
  <rect x="228" y="80" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="100" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">b</text>
  <rect x="228" y="110" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="130" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">c</text>
  <rect x="228" y="140" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="160" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>

  <!-- ===== Col 0 annotations ===== -->
  <text x="300" y="80" font-size="11" fill="#4a7a3a" font-weight="bold">列 0 处理</text>

  <!-- pair (0,1): a == a -->
  <rect x="300" y="88" width="220" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="310" y="104" font-size="10" fill="#666">pair(0,1): a == a → 相等，未定序</text>

  <!-- pair (1,2): a < b -->
  <rect x="300" y="118" width="220" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="310" y="134" font-size="10" fill="#4a7a3a">pair(1,2): a &lt; b → 定序 ✓ decided[1]=True</text>

  <!-- ===== Col 1 annotations ===== -->
  <text x="300" y="158" font-size="11" fill="#446688" font-weight="bold">列 1 处理</text>

  <!-- pair (0,1): b < c -->
  <rect x="300" y="166" width="220" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="310" y="182" font-size="10" fill="#4a7a3a">pair(0,1): b &lt; c → 定序 ✓ decided[0]=True</text>

  <!-- pair (1,2): DECIDED -> SKIP -->
  <rect x="300" y="196" width="220" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="310" y="212" font-size="10" fill="#b85450" font-weight="bold">pair(1,2): 已定序 → 跳过! (c&gt;a 但不影响)</text>

  <!-- arrow from col0 decided to col1 skip -->
  <path d="M 300 130 Q 285 160 300 208" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="272" y="172" font-size="9" fill="#b85450">短路</text>

  <!-- ===== decided array bar ===== -->
  <text x="40" y="244" font-size="11" fill="#888" font-weight="bold">decided 数组演变：</text>

  <rect x="60" y="252" width="120" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="120" y="271" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">[False, True]</text>
  <text x="190" y="271" font-size="10" fill="#888">列 0 后</text>

  <path d="M 190 266 L 230 266" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="240" y="252" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="271" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">[True, True]</text>
  <text x="370" y="271" font-size="10" fill="#888">列 1 后（全定序）</text>

  <text x="440" y="271" font-size="10" fill="#4a7a3a" font-weight="bold">ans = 0</text>

  <!-- ===== Key insight box ===== -->
  <rect x="30" y="298" width="500" height="108" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">核心观察：行间字典序的「短路」特性</text>
  <text x="50" y="342" font-size="11" fill="#555">• decided[i]=True 表示行 i 与 i+1 的前缀已分出大小（strs[i] &lt; strs[i+1]）</text>
  <text x="50" y="360" font-size="11" fill="#555">• 已定序的行对：后续列无论 c_i &gt; c_{i+1} 都不影响——更早的列已锁定大小关系</text>
  <text x="50" y="378" font-size="11" fill="#555">• 未定序的行对：必须 c_i ≤ c_{i+1}，否则该列必须删除（无法靠删后续列补救）</text>
  <text x="50" y="396" font-size="11" fill="#b85450" font-weight="bold">→ 贪心：逐列扫描，能保留就保留（只松不紧约束），必须删才删</text>
</svg>
