<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：排序 + freq → 取最小 x → 消耗 k 连张 → 循环</text>

  <!-- 1. 整除检查 -->
  <rect x="180" y="44" width="180" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="68" text-anchor="middle" font-size="12" fill="#333">① n % k != 0 ?</text>

  <path d="M 270 82 L 270 100" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="96" font-size="10.5" fill="#b85450" font-weight="bold">是 → return false</text>
  <text x="282" y="108" font-size="10" fill="#4a7a3a">否 ↓</text>

  <!-- 2. 统计频率 -->
  <rect x="170" y="110" width="200" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="134" text-anchor="middle" font-size="12" fill="#333">② 统计 freq（有序映射 / Counter）</text>

  <path d="M 270 148 L 270 166" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. 取最小 x -->
  <rect x="170" y="166" width="200" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="190" text-anchor="middle" font-size="12" fill="#333">③ 取下一个最小 x（升序）</text>

  <path d="M 270 204 L 270 222" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4. 判定 cnt==0 -->
  <polygon points="270,222 360,262 270,302 180,262" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="258" text-anchor="middle" font-size="11.5" fill="#333">freq[x]==0 ?</text>
  <text x="270" y="274" text-anchor="middle" font-size="10.5" fill="#888">(已消耗)</text>

  <!-- 是 → 跳回③ -->
  <path d="M 180 262 L 120 262 L 120 185 L 168 185" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="92" y="225" font-size="10.5" fill="#4a7a3a" font-weight="bold">是，跳过</text>

  <!-- 否 ↓ -->
  <path d="M 270 302 L 270 320" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="316" font-size="10.5" fill="#4a7a3a">否 ↓</text>

  <!-- 5. 内层循环 i=1..k-1 -->
  <rect x="150" y="320" width="240" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="344" text-anchor="middle" font-size="12" fill="#333">④ for i = 1 … k−1：查 freq[x+i]</text>

  <path d="M 270 358 L 270 376" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 6. 判定 freq[x+i]>=cnt -->
  <polygon points="270,376 380,410 270,444 160,410" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="407" text-anchor="middle" font-size="11.5" fill="#333">freq[x+i] ≥ cnt ?</text>
  <text x="270" y="422" text-anchor="middle" font-size="10.5" fill="#888">(够则 −= cnt)</text>

  <!-- 否 → return false -->
  <path d="M 380 410 L 460 410" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="448" y="396" width="84" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="490" y="415" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return false</text>

  <!-- 是 → 回到③ (全部 i 走完后) -->
  <path d="M 160 410 L 60 410 L 60 185 L 168 185" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="34" y="300" font-size="10.5" fill="#4a7a3a" font-weight="bold">i 全部满足</text>
  <text x="34" y="314" font-size="10" fill="#4a7a3a">回到③取下个 x</text>

  <!-- 终点 return true -->
  <path d="M 270 444 L 270 452" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 右下注释 -->
  <rect x="380" y="300" width="150" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="455" y="320" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">所有 x 处理完</text>
  <text x="455" y="336" text-anchor="middle" font-size="10" fill="#555">freq 全归零</text>
  <text x="455" y="350" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">→ return true</text>

  <!-- 左下注释 cnt -->
  <rect x="370" y="250" width="160" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="450" y="268" text-anchor="middle" font-size="10" fill="#a87020" font-weight="bold">cnt = freq[x]（剩余个数）</text>
  <text x="450" y="282" text-anchor="middle" font-size="10" fill="#555">一次消耗 cnt 个以 x 开头的组</text>
</svg>
