<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="470" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">逐行模拟：只算「流过」每杯的体积</text>

  <!-- ===== Start: init ===== -->
  <ellipse cx="260" cy="64" rx="78" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="68" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">dp[0][0] = poured</text>

  <path d="M 260 86 L 260 108" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Loop box ===== -->
  <rect x="130" y="112" width="260" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="130" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">遍历 r = 0 → query_row−1</text>
  <text x="260" y="144" text-anchor="middle" font-size="10.5" fill="#888">内层 g = 0 → r（第 r 行共 r+1 杯）</text>

  <path d="M 260 152 L 260 174" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Decision diamond ===== -->
  <polygon points="260,178 340,222 260,266 180,222" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="218" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">dp[r][g] &gt; 1 ?</text>
  <text x="260" y="234" text-anchor="middle" font-size="9.5" fill="#888">（有溢出？）</text>

  <!-- Yes branch (left) -->
  <path d="M 180 222 L 100 222 L 100 250" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="216" font-size="10" fill="#b85450" font-weight="bold">是</text>

  <rect x="30" y="254" width="140" height="74" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="100" y="273" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">溢出 = dp[r][g] − 1</text>
  <text x="100" y="290" text-anchor="middle" font-size="9.5" fill="#555">dp[r+1][g]</text>
  <text x="100" y="302" text-anchor="middle" font-size="9.5" fill="#555">  += 溢出 / 2</text>
  <text x="100" y="316" text-anchor="middle" font-size="9.5" fill="#555">dp[r+1][g+1]</text>
  <text x="100" y="324" text-anchor="middle" font-size="8.5" fill="#888">  += 溢出 / 2</text>

  <!-- No branch (right) -->
  <path d="M 340 222 L 420 222 L 420 250" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="216" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <rect x="350" y="254" width="140" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="420" y="278" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">不做处理</text>
  <text x="420" y="296" text-anchor="middle" font-size="9.5" fill="#555">杯子盛住全部</text>
  <text x="420" y="312" text-anchor="middle" font-size="9.5" fill="#555">dp[r+1] 不增加</text>

  <!-- merge arrows down -->
  <path d="M 100 328 L 100 358 L 260 358" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 420 328 L 420 358 L 260 358" stroke="#888" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== continue box ===== -->
  <rect x="160" y="362" width="200" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="384" text-anchor="middle" font-size="10.5" fill="#d6a040">继续下一杯 / 下一行</text>

  <path d="M 260 396 L 260 418" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Return ===== -->
  <ellipse cx="260" cy="444" rx="120" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="448" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">return min(1, dp[query_row][query_glass])</text>
</svg>
