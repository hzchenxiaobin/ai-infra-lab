<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#666"/>
    </marker>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：至多两种表示 + 去前导零 + 贪心计费</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">600 秒 = 10 分 0 秒 = 9 分 60 秒，前导零免费去除</text>

  <!-- ===== Left: 600秒的两种表示 ===== -->
  <text x="150" y="72" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">600 秒的两种表示</text>

  <!-- 标准表示 (10, 0) → 1000 -->
  <text x="40" y="100" font-size="10.5" fill="#4a7a3a" font-weight="bold">标准表示</text>
  <text x="40" y="114" font-size="9.5" fill="#888">mm=10, ss=0</text>

  <rect x="100" y="88" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="108" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="136" y="88" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="108" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="172" y="88" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="108" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="208" y="88" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="226" y="108" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>

  <text x="150" y="134" text-anchor="middle" font-size="9.5" fill="#888">无前导零，4 位全按</text>

  <!-- arrow down: borrow -->
  <path d="M 150 140 L 150 162" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="88" y="142" width="124" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="150" y="156" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">借 1 分钟 = +60 秒</text>

  <!-- 借位表示 (9, 60) → 0960 → 960 -->
  <text x="40" y="182" font-size="10.5" fill="#b85450" font-weight="bold">借位表示</text>
  <text x="40" y="196" font-size="9.5" fill="#888">mm=9, ss=60</text>

  <!-- leading 0, struck through (grayed) -->
  <rect x="100" y="170" width="36" height="30" fill="#f0f0f0" stroke="#ccc" stroke-width="1.2" rx="4" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="118" y="190" text-anchor="middle" font-size="14" fill="#bbb" font-weight="bold">0</text>
  <line x1="100" y1="172" x2="136" y2="198" stroke="#ccc" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="136" y="170" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="154" y="190" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">9</text>
  <rect x="172" y="170" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="190" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">6</text>
  <rect x="208" y="170" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="226" y="190" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>

  <text x="150" y="216" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">去前导零 → 只按 960（3 位）</text>

  <!-- conclusion left -->
  <rect x="48" y="228" width="204" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="150" y="250" text-anchor="middle" font-size="10.5" fill="#444" font-weight="bold">至多两种，都需检查</text>

  <!-- vertical divider -->
  <line x1="290" y1="60" x2="290" y2="280" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Right: 贪心计费 ===== -->
  <text x="430" y="72" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">贪心计费（startAt = 1）</text>

  <!-- cost rule -->
  <rect x="312" y="82" width="236" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="430" y="102" text-anchor="middle" font-size="10" fill="#444">数字变化 → moveCost；每位 → pushCost</text>

  <!-- "1000" cost -->
  <text x="312" y="130" font-size="10.5" fill="#4a7a3a" font-weight="bold">1000：</text>
  <rect x="356" y="118" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="370" y="135" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="388" y="135" font-size="9" fill="#4a7a3a">按1</text>
  <rect x="416" y="118" width="28" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="430" y="135" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="448" y="135" font-size="9" fill="#d6a040">移+按</text>
  <rect x="480" y="118" width="28" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="494" y="135" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="512" y="135" font-size="9" fill="#4a7a3a">按</text>
  <rect x="528" y="118" width="20" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="538" y="135" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="312" y="155" font-size="10" fill="#888">= 1 + (2+1) + 1 + 1 = </text>
  <text x="430" y="155" font-size="11" fill="#4a7a3a" font-weight="bold">6</text>

  <!-- "960" cost -->
  <text x="312" y="180" font-size="10.5" fill="#b85450" font-weight="bold">960：</text>
  <rect x="356" y="168" width="28" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="370" y="185" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">9</text>
  <text x="388" y="185" font-size="9" fill="#b85450">移+按</text>
  <rect x="416" y="168" width="28" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="430" y="185" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>
  <text x="448" y="185" font-size="9" fill="#b85450">移+按</text>
  <rect x="480" y="168" width="28" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="494" y="185" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="512" y="185" font-size="9" fill="#b85450">移+按</text>
  <text x="312" y="205" font-size="10" fill="#888">= (2+1) + (2+1) + (2+1) = </text>
  <text x="468" y="205" font-size="11" fill="#b85450" font-weight="bold">9</text>

  <!-- min box -->
  <rect x="332" y="220" width="196" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="430" y="243" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">min(6, 9) = 6</text>

  <!-- ===== Bottom note ===== -->
  <rect x="40" y="288" width="480" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="310" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">三个关键观察</text>
  <text x="60" y="328" font-size="10" fill="#555">① mm×60 + ss = t 且 ss ≤ 99 → 从标准表示出发最多借位一次，至多两个候选</text>
  <text x="60" y="346" font-size="10" fill="#555">② 前导零免费去除（自动补零不花代价）→ 去前导零后少按键 = 省 pushCost</text>
  <text x="60" y="364" font-size="10" fill="#555">③ 贪心计费：手指有惯性，只在数字变化时移动，每位必按，代价唯一确定</text>
  <text x="60" y="378" font-size="9.5" fill="#888">两种表示的最优分别由不同因素决定 → 必须都算</text>
</svg>
