<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：买卖双堆，按价格撮合</text>

  <!-- Buy max-heap (left) -->
  <text x="140" y="64" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">采购积压 buy（大顶堆）</text>
  <text x="140" y="80" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">堆顶 = 最高买价</text>
  <!-- heap nodes -->
  <rect x="100" y="96" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="140" y="116" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">30 × 1</text>
  <rect x="60" y="140" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="159" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">10 × 5</text>
  <path d="M 140 126 L 100 140" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <!-- top marker -->
  <text x="200" y="116" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">← 堆顶</text>

  <!-- Sell min-heap (right) -->
  <text x="420" y="64" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">销售积压 sell（小顶堆）</text>
  <text x="420" y="80" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">堆顶 = 最低卖价</text>
  <rect x="380" y="96" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="420" y="116" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">15 × 2</text>
  <rect x="340" y="140" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="159" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">25 × 1</text>
  <path d="M 420 126 L 380 140" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="312" y="116" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">堆顶 →</text>

  <!-- Matching arrow between tops -->
  <text x="280" y="112" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">撮合条件</text>
  <path d="M 380 112 L 200 112" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <!-- Incoming buy order -->
  <rect x="60" y="208" width="120" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="120" y="230" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">新 buy 4 @ 30</text>
  <path d="M 120 208 L 120 176" stroke="#888" stroke-width="1.2" stroke-dasharray="2,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="148" y="196" font-size="10" fill="#888" filter="url(#rough2)">查 sell 最低价</text>

  <!-- Matching rule block -->
  <rect x="200" y="200" width="320" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="360" y="222" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">撮合规则</text>
  <text x="216" y="244" font-size="11" fill="#555" filter="url(#rough2)">• 新 <tspan fill="#446688" font-weight="bold">buy @ p</tspan>：sell 堆顶价 ≤ p ? 成交 : 入 buy 堆</text>
  <text x="216" y="264" font-size="11" fill="#555" filter="url(#rough2)">• 新 <tspan fill="#4a7a3a" font-weight="bold">sell @ p</tspan>：buy 堆顶价 ≥ p ? 成交 : 入 sell 堆</text>
  <text x="216" y="284" font-size="10.5" fill="#888" filter="url(#rough2)">每次成交取 min(剩余量, 堆顶量)，堆顶归零则弹出</text>

  <!-- Key insight -->
  <path d="M 40 318 L 520 318" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="56" y="340" font-size="11.5" fill="#555" filter="url(#rough2)">• buy 想低价买，故与 <tspan fill="#4a7a3a" font-weight="bold">最低卖价</tspan> 撮合；sell 想高价卖，故与 <tspan fill="#446688" font-weight="bold">最高买价</tspan> 撮合</text>
  <text x="56" y="360" font-size="11" fill="#b85450" filter="url(#rough2)">⚠ 价格相等也成交（buy 价 ≥ sell 价），与“积压优先于新单”一致</text>
</svg>
