<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">状态机 DP：配额封顶 → 2 × 2 × 3 = 12 个状态</text>

  <!-- column headers -->
  <text x="82" y="56" text-anchor="middle" font-size="11" fill="#555">e = 0</text>
  <text x="148" y="56" text-anchor="middle" font-size="11" fill="#555">e = 1</text>
  <text x="214" y="56" text-anchor="middle" font-size="11" fill="#555">e ≥ 2</text>

  <!-- row labels -->
  <text x="44" y="87" text-anchor="end" font-size="10" fill="#555">(0,0)</text>
  <text x="44" y="129" text-anchor="end" font-size="10" fill="#555">(1,0)</text>
  <text x="44" y="171" text-anchor="end" font-size="10" fill="#555">(0,1)</text>
  <text x="44" y="213" text-anchor="end" font-size="10" fill="#555">(1,1)</text>

  <!-- grid cells -->
  <rect x="50" y="64" width="64" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="82" y="81" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">(0,0,0)</text>
  <text x="82" y="96" text-anchor="middle" font-size="8" fill="#446688">起点</text>

  <rect x="116" y="64" width="64" height="38" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="148" y="87" text-anchor="middle" font-size="11" fill="#666">(0,0,1)</text>
  <rect x="182" y="64" width="64" height="38" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="214" y="87" text-anchor="middle" font-size="11" fill="#666">(0,0,2)</text>

  <rect x="50" y="106" width="64" height="38" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="82" y="129" text-anchor="middle" font-size="11" fill="#666">(1,0,0)</text>
  <rect x="116" y="106" width="64" height="38" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="148" y="129" text-anchor="middle" font-size="11" fill="#666">(1,0,1)</text>
  <rect x="182" y="106" width="64" height="38" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="214" y="129" text-anchor="middle" font-size="11" fill="#666">(1,0,2)</text>

  <rect x="50" y="148" width="64" height="38" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="82" y="171" text-anchor="middle" font-size="11" fill="#666">(0,1,0)</text>
  <rect x="116" y="148" width="64" height="38" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="148" y="171" text-anchor="middle" font-size="11" fill="#666">(0,1,1)</text>
  <rect x="182" y="148" width="64" height="38" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="214" y="171" text-anchor="middle" font-size="11" fill="#666">(0,1,2)</text>

  <rect x="50" y="190" width="64" height="38" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="82" y="213" text-anchor="middle" font-size="11" fill="#666">(1,1,0)</text>
  <rect x="116" y="190" width="64" height="38" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="148" y="213" text-anchor="middle" font-size="11" fill="#666">(1,1,1)</text>
  <rect x="182" y="190" width="64" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="214" y="207" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">(1,1,2)</text>
  <text x="214" y="222" text-anchor="middle" font-size="8" fill="#4a7a3a">答案</text>

  <text x="148" y="250" text-anchor="middle" font-size="10" fill="#888">行 = (l, t)，列 = e（均已封顶）</text>

  <!-- transitions -->
  <rect x="280" y="48" width="215" height="158" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="387" y="70" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">每填一个字符（4 类）</text>
  <text x="387" y="94" text-anchor="middle" font-size="11" fill="#333">填 l（1 种）→ l ← 1</text>
  <text x="387" y="114" text-anchor="middle" font-size="11" fill="#333">填 t（1 种）→ t ← 1</text>
  <text x="387" y="134" text-anchor="middle" font-size="11" fill="#333">填 e（1 种）→ e ← min(e+1, 2)</text>
  <text x="387" y="154" text-anchor="middle" font-size="11" fill="#333">其余 23 种 → 状态不变</text>
  <text x="387" y="182" text-anchor="middle" font-size="9" fill="#888">1 + 1 + 1 + 23 = 26 ✓</text>

  <!-- sample path -->
  <rect x="280" y="218" width="215" height="120" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="387" y="240" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">一条达标路径</text>
  <text x="387" y="266" text-anchor="middle" font-size="11" fill="#333">(0,0,0) →e (0,0,1) →l (1,0,1)</text>
  <text x="387" y="288" text-anchor="middle" font-size="11" fill="#333">→t (1,1,1) →e (1,1,2) ✓</text>
  <text x="387" y="314" text-anchor="middle" font-size="9" fill="#888">填 e、l、t、e 即达标，与顺序无关</text>

  <!-- bottom summary -->
  <rect x="25" y="352" width="470" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="368" text-anchor="middle" font-size="11" fill="#333">初始 dp[(0,0,0)] = 1，转移 n 轮，答案 = dp[(1,1,2)]</text>
  <text x="260" y="384" text-anchor="middle" font-size="9" fill="#4a7a3a">每轮 12 状态 × 4 类转移：O(12n) 时间 / O(12) 空间</text>
</svg>
