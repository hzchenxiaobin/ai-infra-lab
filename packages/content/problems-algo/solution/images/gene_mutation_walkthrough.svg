<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：BFS 逐层扩展（示例 2）</text>
  <text x="280" y="48" text-anchor="middle" font-size="11" fill="#888">start=AACCGGTT, end=AAACGGTA, bank={AACCGGTA, AACCGCTA, AAACGGTA}</text>

  <!-- table -->
  <g filter="url(#rough2)" font-size="11">
    <!-- header -->
    <rect x="20" y="64" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="43" y="82" text-anchor="middle" fill="#446688" font-weight="bold">step</text>
    <rect x="66" y="64" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="126" y="82" text-anchor="middle" fill="#446688" font-weight="bold">出队 cur</text>
    <rect x="186" y="64" width="300" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="336" y="82" text-anchor="middle" fill="#446688" font-weight="bold">生成的合法邻居（加入队列）</text>
    <rect x="486" y="64" width="54" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="513" y="82" text-anchor="middle" fill="#446688" font-weight="bold">说明</text>

    <!-- row1 step0 -->
    <rect x="20" y="92" width="46" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="43" y="115" text-anchor="middle" fill="#555">0</text>
    <rect x="66" y="92" width="120" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4"/>
    <text x="126" y="115" text-anchor="middle" fill="#446688" font-weight="bold">AACCGGTT</text>
    <rect x="186" y="92" width="300" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="196" y="115" fill="#555"><tspan>AACCGGT</tspan><tspan fill="#b85450" font-weight="bold">A</tspan><tspan fill="#888">   (7: T→A)</tspan></text>
    <rect x="486" y="92" width="54" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="513" y="115" text-anchor="middle" fill="#888" font-size="10">起点</text>

    <!-- row2 step1 -->
    <rect x="20" y="128" width="46" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="43" y="151" text-anchor="middle" fill="#555">1</text>
    <rect x="66" y="128" width="120" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="126" y="151" text-anchor="middle" fill="#555" font-weight="bold"><tspan>AACCGGT</tspan><tspan fill="#b85450">A</tspan></text>
    <rect x="186" y="128" width="300" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="196" y="151" fill="#555"><tspan>AACCG</tspan><tspan fill="#b85450" font-weight="bold">C</tspan><tspan>TA (5:G→C),   AA</tspan><tspan fill="#b85450" font-weight="bold">A</tspan><tspan>CGGTA (2:C→A)</tspan></text>
    <rect x="486" y="128" width="54" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="513" y="151" text-anchor="middle" fill="#888" font-size="10">2 个</text>

    <!-- row3 step2 -->
    <rect x="20" y="164" width="46" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="43" y="187" text-anchor="middle" fill="#555">2</text>
    <rect x="66" y="164" width="120" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4"/>
    <text x="126" y="187" text-anchor="middle" fill="#555" font-weight="bold"><tspan>AACCG</tspan><tspan fill="#b85450">C</tspan><tspan>TA</tspan></text>
    <rect x="186" y="164" width="300" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="336" y="187" text-anchor="middle" fill="#888">（无新增，邻居均已访问）</text>
    <rect x="486" y="164" width="54" height="36" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="513" y="187" text-anchor="middle" fill="#888" font-size="10">—</text>

    <!-- row4 step2 end -->
    <rect x="20" y="200" width="46" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="43" y="223" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="66" y="200" width="120" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="126" y="223" text-anchor="middle" fill="#4a7a3a" font-weight="bold"><tspan>AA</tspan><tspan fill="#b85450">A</tspan><tspan>CGGTA</tspan></text>
    <rect x="186" y="200" width="300" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="336" y="223" text-anchor="middle" fill="#4a7a3a" font-weight="bold">cur == end → 返回 step = 2 ✓</text>
    <rect x="486" y="200" width="54" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="513" y="223" text-anchor="middle" fill="#4a7a3a" font-size="10">命中</text>
  </g>

  <!-- conclusion box -->
  <g filter="url(#rough2)">
    <rect x="70" y="256" width="420" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10"/>
    <text x="280" y="278" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">答案：2 步变异</text>
    <text x="280" y="298" text-anchor="middle" font-size="11" fill="#555">AACCGGTT → AACCGGTA → AAACGGTA</text>
    <text x="280" y="312" text-anchor="middle" font-size="10" fill="#888">每层 step += 1，首次抵达 end 即最短变异数</text>
  </g>
</svg>
