<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：数位映射 + 稳定排序</text>

  <!-- Start -->
  <rect x="200" y="44" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="17" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">输入 nums, mapping</text>

  <path d="M 280 78 L 280 96" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 1: compute mapped values -->
  <rect x="120" y="100" width="320" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)" opacity="0.4"/>
  <text x="280" y="122" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">Step 1：计算每个数的映射值</text>
  <text x="280" y="142" text-anchor="middle" font-size="11" fill="#333">for each nums[i]:</text>
  <text x="280" y="158" text-anchor="middle" font-size="11" fill="#333">  逐位 d = x%10 → mapping[d] → 重组整数</text>
  <text x="280" y="174" text-anchor="middle" font-size="10" fill="#b85450">⚠️ x=0 时单独取 mapping[0]</text>

  <path d="M 280 180 L 280 198" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: x == 0? -->
  <polygon points="280,200 380,240 280,280 180,240" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="236" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">x == 0 ?</text>
  <text x="280" y="252" text-anchor="middle" font-size="10" fill="#888">（边界判定）</text>

  <!-- Yes: mapped = mapping[0] -->
  <path d="M 180 240 L 80 240" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="130" y="232" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="20" y="224" width="60" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="50" y="244" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">mapping[0]</text>

  <!-- No: while loop -->
  <path d="M 380 240 L 460 240" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="420" y="232" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>

  <rect x="440" y="212" width="100" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="490" y="232" text-anchor="middle" font-size="10" fill="#333">while x &gt; 0:</text>
  <text x="490" y="248" text-anchor="middle" font-size="10" fill="#333">  d=x%10</text>
  <text x="490" y="262" text-anchor="middle" font-size="10" fill="#333">  val+=m[d]*pw</text>

  <!-- converge -->
  <path d="M 50 256 L 50 300 L 280 300" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 490 268 L 490 300 L 280 300" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <path d="M 280 300 L 280 318" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: stable sort -->
  <rect x="120" y="320" width="320" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)" opacity="0.5"/>
  <text x="280" y="342" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">Step 2：按映射值稳定排序</text>
  <text x="280" y="360" text-anchor="middle" font-size="11" fill="#333">stable_sort（映射值相同 → 保持原序）</text>

  <path d="M 280 376 L 280 394" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- End -->
  <rect x="180" y="396" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="17" filter="url(#rough2)"/>
  <text x="280" y="418" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">返回原始 nums（按映射值排序）</text>
</svg>
