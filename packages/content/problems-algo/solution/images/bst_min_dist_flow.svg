<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">中序遍历 + 滚动 prev：左 → 根（算距更新） → 右</text>

  <!-- 入口 -->
  <rect x="190" y="48" width="200" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="69" text-anchor="middle" font-size="12" fill="#333">prev=null, ans=∞；调用 dfs(root)</text>

  <path d="M 290 80 L 290 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判空 -->
  <polygon points="290,100 400,140 290,180 180,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="136" text-anchor="middle" font-size="12" fill="#333">node == null ?</text>

  <!-- 是 → 返回 -->
  <path d="M 400 140 L 470 140" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="132" font-size="10" fill="#b85450">是</text>
  <rect x="470" y="124" width="90" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="515" y="145" text-anchor="middle" font-size="11" fill="#888">return</text>

  <!-- 否 ↓ -->
  <path d="M 290 180 L 290 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="194" font-size="10" fill="#82b366">否</text>

  <!-- ① 递归左 -->
  <rect x="170" y="200" width="240" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290" y="221" text-anchor="middle" font-size="11" fill="#333">① dfs(node.left)   // 左：先访问更小节点</text>

  <path d="M 290 232 L 290 248" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② 算距 + 记录 -->
  <rect x="110" y="252" width="360" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="290" y="273" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">② if prev≠null: ans=min(ans, node.val−prev.val)</text>

  <path d="M 290 284 L 290 300" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ 更新 prev -->
  <rect x="170" y="304" width="240" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290" y="325" text-anchor="middle" font-size="11" fill="#333">③ prev = node   // 记录当前为前驱</text>

  <path d="M 290 336 L 290 352" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ④ 递归右 -->
  <rect x="170" y="356" width="240" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290" y="377" text-anchor="middle" font-size="11" fill="#333">④ dfs(node.right)   // 右：继续访问更大节点</text>

  <path d="M 290 388 L 290 404" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结束 -->
  <rect x="235" y="408" width="110" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="290" y="427" text-anchor="middle" font-size="11" fill="#888">return ans</text>

  <!-- 回溯到入口的虚线（体现递归返回） -->
  <path d="M 410 372 L 510 372 L 510 64 L 390 64" stroke="#b85450" stroke-width="1.1" stroke-dasharray="3,3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="516" y="220" font-size="10" fill="#b85450" transform="rotate(-90 516 220)">逐层 return</text>
</svg>
