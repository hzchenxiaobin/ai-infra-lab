<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">O(n) 计数法：众数频次 x 决定一切</text>

  <!-- left panel: case 1 -->
  <rect x="25" y="48" width="275" height="242" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="162" y="74" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">情况一：2x ≤ n（众数不过半）</text>

  <!-- pairing arcs -->
  <path d="M 62 106 Q 122 64 182 106" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 102 106 Q 162 52 222 106" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 142 106 Q 202 64 262 106" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- cells [1,1,2,2,3,3] -->
  <rect x="44" y="106" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="62" y="127" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="84" y="106" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="102" y="127" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="124" y="106" width="36" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="127" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="164" y="106" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="182" y="127" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="204" y="106" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="222" y="127" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="244" y="106" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="262" y="127" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <text x="162" y="168" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">x = 2（每个值都出现 2 次），2x = 4 ≤ 6</text>
  <text x="162" y="190" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">k = ⌊n/2⌋ = 3 可行 → 全部删光</text>

  <rect x="45" y="206" width="235" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="162" y="229" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = n mod 2 = 0</text>

  <!-- right panel: case 2 -->
  <rect x="320" y="48" width="275" height="242" fill="#ffffff" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="457" y="74" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">情况二：2x &gt; n（众数过剩）</text>

  <!-- pairing arc -->
  <path d="M 377 106 Q 457 54 537 106" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="457" y="66" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">2 &lt; 3 ✓</text>

  <!-- cells [2,2,2,2,3] -->
  <rect x="359" y="106" width="36" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="377" y="127" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="399" y="106" width="36" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="417" y="127" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="439" y="106" width="36" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="457" y="127" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="479" y="106" width="36" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="497" y="127" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="519" y="106" width="36" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="537" y="127" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>

  <!-- dead crosses on leftover 2s -->
  <path d="M 407 152 L 427 164 M 427 152 L 407 164" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 447 152 L 467 164 M 467 152 L 447 164" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 487 152 L 507 164 M 507 152 L 487 164" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="457" y="182" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">剩下的 2 相互相等 → 配不成对 ✗</text>

  <text x="457" y="204" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">x = 4（值 2），2x = 8 &gt; 5</text>
  <text x="457" y="222" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">每对至多消耗 1 个 2 → k ≤ n − x = 1</text>

  <rect x="340" y="232" width="235" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="457" y="255" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 = 2x − n = 3</text>

  <!-- bottom conclusion -->
  <rect x="40" y="308" width="540" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="330" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">x = 数组最大频次（哈希计数一遍扫出）</text>
  <text x="310" y="348" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">严格小于 ⟹ 两个众数不能互配，每个操作至多消耗 1 个众数</text>
  <text x="310" y="368" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">2x &gt; n ⟹ k = n − x，答案 2x − n；否则 k = ⌊n/2⌋，答案 n mod 2</text>
</svg>
