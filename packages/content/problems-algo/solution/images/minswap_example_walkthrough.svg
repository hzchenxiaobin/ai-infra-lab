  <!-- Notes -->
  <text x="310" y="252" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">最终结果 = "1342" ✓</text>
  <rect x="30" y="266" width="580" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="285" font-size="10" fill="#666">关键：每步从 d=0 到 9 试，取第一个 cost ≤ k 的数字；BIT.query(j) 返回原下标 [0,j−1] 内剩余数字个数即交换代价。</text>
  <text x="50" y="301" font-size="10" fill="#666">绿格=选中数字/零代价；橙格=有代价；红 0=已用位置。步骤 3 中 j=0 时前方无数字故 cost=0。</text>
