<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：strs = ["ca","bb","ac"]（n=3, m=2）</text>

  <!-- ===== Column 0 ===== -->
  <text x="40" y="56" font-size="12" fill="#888" font-weight="bold">列 j=0</text>
  <text x="100" y="56" font-size="11" fill="#555">decided=[F,F] → 检查所有行对</text>

  <!-- Col 0 cells: c, b, a -->
  <rect x="196" y="62" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="82" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">c</text>
  <rect x="196" y="92" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="112" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">b</text>
  <rect x="196" y="122" width="44" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="218" y="142" text-anchor="middle" font-size="15" fill="#bbb">a</text>

  <!-- violation arrow c > b -->
  <path d="M 218 92 L 218 96" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="252" y="102" font-size="11" fill="#b85450" font-weight="bold">c &gt; b ✗ 违反!</text>
  <text x="252" y="136" font-size="10" fill="#999" font-style="italic">(break，不查 b vs a)</text>

  <!-- verdict -->
  <text x="218" y="170" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">违反 → 删除该列</text>

  <!-- decided + ans state -->
  <rect x="370" y="86" width="150" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="445" y="105" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">ans = 1, decided=[F,F]</text>

  <!-- separator -->
  <path d="M 40 186 L 520 186" stroke="#e0e0e0" stroke-width="1" fill="none" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- ===== Column 1 ===== -->
  <text x="40" y="208" font-size="12" fill="#888" font-weight="bold">列 j=1</text>
  <text x="100" y="208" font-size="11" fill="#555">decided=[F,F]（列 0 已删，不变）→ 仍检查所有行对</text>

  <!-- Col 1 cells: a, b, c -->
  <rect x="196" y="214" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="234" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>
  <rect x="196" y="244" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="264" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">b</text>
  <rect x="196" y="274" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="218" y="294" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">c</text>

  <!-- pair(0,1): a < b -->
  <path d="M 218 244 L 218 248" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="252" y="254" font-size="11" fill="#4a7a3a" font-weight="bold">a &lt; b ✓ → decided[0]=True</text>

  <!-- pair(1,2): b < c -->
  <path d="M 218 274 L 218 278" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="252" y="288" font-size="11" fill="#4a7a3a" font-weight="bold">b &lt; c ✓ → decided[1]=True</text>

  <!-- verdict -->
  <text x="218" y="322" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">无违反 → 保留该列</text>

  <!-- decided + ans state -->
  <rect x="370" y="238" width="150" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="445" y="257" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">ans = 1, decided=[T,T]</text>

  <!-- separator -->
  <path d="M 40 340 L 520 340" stroke="#e0e0e0" stroke-width="1" fill="none" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- ===== Result ===== -->
  <text x="40" y="362" font-size="12" fill="#888" font-weight="bold">结果</text>

  <rect x="100" y="370" width="380" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="390" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">删后 strs = ["a","b","c"]（仅保留列 1）</text>
  <text x="290" y="404" text-anchor="middle" font-size="11" fill="#666">字典序非降 ✓，最少删除 ans = 1</text>

  <!-- ===== Key takeaway ===== -->
  <rect x="40" y="424" width="480" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="446" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">关键对比（944 vs 955）</text>
  <text x="60" y="466" font-size="11" fill="#555">944：列独立判定——c&gt;b 直接删，无需维护 decided</text>
  <text x="60" y="480" font-size="11" fill="#555">955：列间交互——删除的列「不存在」，decided 不更新；保留的列才可能定序行对</text>
</svg>
