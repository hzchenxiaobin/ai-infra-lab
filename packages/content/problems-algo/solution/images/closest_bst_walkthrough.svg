<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：root = [4,2,5,1,3]，target = 3.71</text>

  <!-- 左侧 BST -->
  <text x="30" y="58" font-size="12" fill="#888">BST：</text>

  <!-- 节点 4 -->
  <circle cx="120" cy="90" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="120" y="95" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>

  <!-- 节点 2 -->
  <circle cx="70" cy="150" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="70" y="154" text-anchor="middle" font-size="11" fill="#333">2</text>
  <line x1="108" y1="104" x2="78" y2="138" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>

  <!-- 节点 5 -->
  <circle cx="175" cy="150" r="15" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="175" y="154" text-anchor="middle" font-size="11" fill="#999">5</text>
  <line x1="132" y1="104" x2="167" y2="138" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- 节点 1 -->
  <circle cx="40" cy="215" r="13" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="40" y="219" text-anchor="middle" font-size="10" fill="#999">1</text>
  <line x1="60" y1="162" x2="46" y2="205" stroke="#bbb" stroke-width="1.1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- 节点 3 -->
  <circle cx="105" cy="215" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" filter="url(#rough2)"/>
  <text x="105" y="219" text-anchor="middle" font-size="10" fill="#333">3</text>
  <line x1="80" y1="162" x2="98" y2="205" stroke="#4a7a3a" stroke-width="1.3" filter="url(#rough2)"/>

  <!-- 搜索路径箭头 -->
  <path d="M 120 107 L 78 138" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 82 162 L 98 205" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 右侧步骤表 -->
  <text x="270" y="58" font-size="12" fill="#888">逐步跟踪：</text>

  <!-- 表头 -->
  <rect x="270" y="68" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="295" y="85" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">步</text>
  <rect x="320" y="68" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="350" y="85" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">cur</text>
  <rect x="380" y="68" width="70" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="415" y="85" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">diff</text>
  <rect x="450" y="68" width="70" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="485" y="85" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">closest</text>
  <rect x="520" y="68" width="56" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="548" y="85" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">去向</text>

  <!-- 步骤1 -->
  <rect x="270" y="96" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="295" y="114" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="320" y="96" width="60" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="350" y="114" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <rect x="380" y="96" width="70" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="415" y="114" text-anchor="middle" font-size="10" fill="#333">0.29</text>
  <rect x="450" y="96" width="70" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="485" y="114" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <rect x="520" y="96" width="56" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="548" y="114" text-anchor="middle" font-size="10" fill="#333">左</text>

  <!-- 步骤2 -->
  <rect x="270" y="126" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="295" y="144" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="320" y="126" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="350" y="144" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="380" y="126" width="70" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="415" y="144" text-anchor="middle" font-size="10" fill="#333">1.71</text>
  <rect x="450" y="126" width="70" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="485" y="144" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="520" y="126" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="548" y="144" text-anchor="middle" font-size="10" fill="#333">右</text>

  <!-- 步骤3 -->
  <rect x="270" y="156" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="295" y="174" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="320" y="156" width="60" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="350" y="174" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="380" y="156" width="70" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="415" y="174" text-anchor="middle" font-size="10" fill="#333">0.71</text>
  <rect x="450" y="156" width="70" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="485" y="174" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="520" y="156" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="548" y="174" text-anchor="middle" font-size="10" fill="#333">右</text>

  <!-- 步骤4 -->
  <rect x="270" y="186" width="50" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="295" y="204" text-anchor="middle" font-size="11" fill="#888">4</text>
  <rect x="320" y="186" width="60" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="350" y="204" text-anchor="middle" font-size="10" fill="#888">null</text>
  <rect x="380" y="186" width="70" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="415" y="204" text-anchor="middle" font-size="10" fill="#888">—</text>
  <rect x="450" y="186" width="70" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="485" y="204" text-anchor="middle" font-size="10" fill="#888">—</text>
  <rect x="520" y="186" width="56" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="548" y="204" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">结束</text>

  <!-- 结果标注 -->
  <rect x="270" y="230" width="306" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="423" y="250" text-anchor="middle" font-size="12" fill="#333">返回 closest = 4（|3.71−4|=0.29 全局最小）</text>

  <!-- diff 比较说明 -->
  <text x="30" y="290" font-size="12" fill="#888">关键：每步只需比较 diff 与更新方向：</text>
  <rect x="30" y="302" width="546" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="50" y="318" font-size="11" fill="#333">步1：diff 0.29 &lt; ∞ → 更新 closest=4；3.71&lt;4 走左</text>
  <rect x="30" y="330" width="546" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="50" y="346" font-size="11" fill="#333">步2：diff 1.71 &gt; 0.29 → 不更新；3.71&gt;2 走右</text>
  <rect x="30" y="358" width="546" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="50" y="374" font-size="11" fill="#333">步3：diff 0.71 &gt; 0.29 → 不更新；3.71&gt;3 走右→null，结束</text>

  <rect x="30" y="388" width="546" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="50" y="404" font-size="11" fill="#333">5 被 4 在步1 剪掉（target&lt;4 时右子树全 &gt;4，只会更远）</text>
</svg>
