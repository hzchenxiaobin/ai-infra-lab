<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">LEFT JOIN 反连接：未匹配的学生即"院系无效"</text>

  <!-- Students table -->
  <text x="120" y="62" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">Students</text>
  <rect x="30" y="68" width="180" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="52" y="84" font-size="10" fill="#446688" font-weight="bold">id</text>
  <text x="112" y="84" font-size="10" fill="#446688" font-weight="bold">name</text>
  <text x="172" y="84" font-size="10" fill="#446688" font-weight="bold">dept_id</text>
  <line x1="82" y1="68" x2="82" y2="92" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="152" y1="68" x2="152" y2="92" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="92" width="180" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="52" y="108" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">23</text>
  <text x="112" y="108" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Alice</text>
  <text x="172" y="108" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <line x1="82" y1="92" x2="82" y2="116" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="152" y1="92" x2="152" y2="116" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="116" width="180" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="52" y="132" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">30</text>
  <text x="112" y="132" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Bob</text>
  <text x="172" y="132" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">7</text>
  <line x1="82" y1="116" x2="82" y2="140" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="152" y1="116" x2="152" y2="140" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="140" width="180" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="52" y="156" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">36</text>
  <text x="112" y="156" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">Ann</text>
  <text x="172" y="156" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">13</text>
  <line x1="82" y1="140" x2="82" y2="164" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="152" y1="140" x2="152" y2="164" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="164" width="180" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="52" y="180" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">50</text>
  <text x="112" y="180" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Peter</text>
  <text x="172" y="180" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">15</text>
  <line x1="82" y1="164" x2="82" y2="188" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="152" y1="164" x2="152" y2="188" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Departments table -->
  <text x="450" y="62" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">Departments</text>
  <rect x="370" y="68" width="160" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="392" y="84" font-size="10" fill="#446688" font-weight="bold">id</text>
  <text x="460" y="84" font-size="10" fill="#446688" font-weight="bold">name</text>
  <line x1="422" y1="68" x2="422" y2="92" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="370" y="92" width="160" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="392" y="108" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="432" y="108" font-size="10" fill="#4a7a3a">Electrical Eng</text>
  <line x1="422" y1="92" x2="422" y2="116" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="370" y="116" width="160" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="392" y="132" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">7</text>
  <text x="432" y="132" font-size="10" fill="#4a7a3a">Computer Eng</text>
  <line x1="422" y1="116" x2="422" y2="140" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="370" y="140" width="160" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="392" y="156" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">15</text>
  <text x="432" y="156" font-size="10" fill="#4a7a3a">Mechanical Eng</text>
  <line x1="422" y1="140" x2="422" y2="164" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- join arrows: student dept_id -> dept id -->
  <path d="M210 104 C 290 104, 300 104, 370 104" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M210 128 C 290 128, 300 128, 370 128" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M210 176 C 290 176, 300 152, 370 152" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Ann: no match -> ? -->
  <path d="M210 152 C 260 152, 285 152, 318 152" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="320" y="142" width="34" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="337" y="157" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">?</text>

  <!-- result -->
  <text x="280" y="224" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">WHERE d.id IS NULL → 只保留未匹配的"悬空"行</text>
  <rect x="180" y="234" width="200" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="210" y="250" font-size="10" fill="#b85450" font-weight="bold">id</text>
  <text x="290" y="250" font-size="10" fill="#b85450" font-weight="bold">name</text>
  <line x1="250" y1="234" x2="250" y2="258" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="180" y="258" width="200" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="210" y="274" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">36</text>
  <text x="290" y="274" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">Ann</text>
  <line x1="250" y1="258" x2="250" y2="282" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- bottom note -->
  <rect x="30" y="300" width="500" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="50" y="320" font-size="10.5" fill="#333">核心：Students LEFT JOIN Departments 后，匹配上的行 d.id 非空，</text>
  <text x="50" y="336" font-size="10.5" fill="#333">匹配不上的行 d.id 为 NULL——这正是「院系已不存在」的信号。</text>
  <text x="50" y="352" font-size="10.5" fill="#333"><tspan fill="#b85450" font-weight="bold">WHERE d.id IS NULL</tspan> 把这些"悬空"行筛出，即得答案。</text>
  <text x="50" y="372" font-size="9.5" fill="#888">（若用 NOT IN，须保证 dept_id 非 NULL，否则陷入三值逻辑陷阱，见扩展）</text>
</svg>
