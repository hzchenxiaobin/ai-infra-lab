<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：花开天数 d 越大，能扎的花束越多</text>

  <!-- bloomDay array label -->
  <text x="40" y="58" font-size="12" fill="#555" font-weight="bold">bloomDay =</text>

  <!-- bloomDay array boxes -->
  <g filter="url(#rough2)">
    <rect x="120" y="44" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="148" y="64" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
    <rect x="176" y="44" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="204" y="64" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">10</text>
    <rect x="232" y="44" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="260" y="64" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
    <rect x="288" y="44" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="316" y="64" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">10</text>
    <rect x="344" y="44" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="372" y="64" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  </g>
  <text x="148" y="88" text-anchor="middle" font-size="10" fill="#888">idx0</text>
  <text x="204" y="88" text-anchor="middle" font-size="10" fill="#888">idx1</text>
  <text x="260" y="88" text-anchor="middle" font-size="10" fill="#888">idx2</text>
  <text x="316" y="88" text-anchor="middle" font-size="10" fill="#888">idx3</text>
  <text x="372" y="88" text-anchor="middle" font-size="10" fill="#888">idx4</text>

  <!-- Day = 2 scenario -->
  <text x="40" y="120" font-size="12" fill="#a87020" font-weight="bold">d = 2 时：</text>
  <g filter="url(#rough2)">
    <!-- bloomed (green) / not bloomed (red/faded) -->
    <rect x="120" y="108" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="148" y="127" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">开 ✓</text>
    <rect x="176" y="108" width="56" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="204" y="127" text-anchor="middle" font-size="11" fill="#b85450">未开</text>
    <rect x="232" y="108" width="56" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="260" y="127" text-anchor="middle" font-size="11" fill="#b85450">未开</text>
    <rect x="288" y="108" width="56" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="316" y="127" text-anchor="middle" font-size="11" fill="#b85450">未开</text>
    <rect x="344" y="108" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="372" y="127" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">开 ✓</text>
  </g>
  <!-- bouquet brackets k=1 -->
  <text x="40" y="160" font-size="11" fill="#555">花束 (k=1):</text>
  <g filter="url(#rough2)">
    <path d="M 130 150 L 130 156 L 166 156 L 166 150" stroke="#4a7a3a" stroke-width="1.8" fill="none"/>
    <text x="148" y="168" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">束1</text>
    <path d="M 354 150 L 354 156 L 390 156 L 390 150" stroke="#4a7a3a" stroke-width="1.8" fill="none"/>
    <text x="372" y="168" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">束2</text>
  </g>
  <rect x="420" y="112" width="110" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="475" y="132" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">2 束 &lt; m=3 ✗</text>

  <!-- Day = 3 scenario -->
  <text x="40" y="200" font-size="12" fill="#4a7a3a" font-weight="bold">d = 3 时：</text>
  <g filter="url(#rough2)">
    <rect x="120" y="188" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="148" y="207" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">开 ✓</text>
    <rect x="176" y="188" width="56" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="204" y="207" text-anchor="middle" font-size="11" fill="#b85450">未开</text>
    <rect x="232" y="188" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="260" y="207" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">开 ✓</text>
    <rect x="288" y="188" width="56" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="316" y="207" text-anchor="middle" font-size="11" fill="#b85450">未开</text>
    <rect x="344" y="188" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4"/>
    <text x="372" y="207" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">开 ✓</text>
  </g>
  <text x="40" y="240" font-size="11" fill="#555">花束 (k=1):</text>
  <g filter="url(#rough2)">
    <path d="M 130 230 L 130 236 L 166 236 L 166 230" stroke="#4a7a3a" stroke-width="1.8" fill="none"/>
    <text x="148" y="248" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">束1</text>
    <path d="M 242 230 L 242 236 L 278 236 L 278 230" stroke="#4a7a3a" stroke-width="1.8" fill="none"/>
    <text x="260" y="248" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">束2</text>
    <path d="M 354 230 L 354 236 L 390 236 L 390 230" stroke="#4a7a3a" stroke-width="1.8" fill="none"/>
    <text x="372" y="248" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">束3</text>
  </g>
  <rect x="420" y="192" width="110" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="475" y="212" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">3 束 ≥ m=3 ✓</text>

  <!-- Monotonicity arrow -->
  <path d="M 270 270 L 270 288" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Monotonicity insight box -->
  <rect x="60" y="294" width="420" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="314" text-anchor="middle" font-size="12" fill="#a87020" font-weight="bold">bouquet(d) 关于 d 单调不减 → 存在二段性</text>
  <text x="270" y="330" text-anchor="middle" font-size="10.5" fill="#666">d &lt; d* 时花束不足 / d ≥ d* 时花束足够 → 二分找最小 d*</text>

  <!-- Impossible check -->
  <rect x="60" y="350" width="420" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="368" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">特判：m × k &gt; n 时直接返回 −1（花不够，永远不可能）</text>
  <text x="270" y="382" text-anchor="middle" font-size="10" fill="#888">否则在 [min(bloomDay), max(bloomDay)] 上二分</text>
</svg>
