<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold">示例演算：6 次 book 的差分 map 演化</text>

  <line x1="20" y1="44" x2="580" y2="44" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="34" y="40" font-size="10" fill="#888" font-weight="bold">步</text>
  <text x="74" y="40" font-size="10" fill="#888" font-weight="bold">book</text>
  <text x="190" y="40" font-size="10" fill="#888" font-weight="bold">diff map（端点 → 增量，红=本次新增/改动）</text>
  <text x="520" y="40" font-size="10" fill="#888" font-weight="bold">max</text>
  <line x1="20" y1="48" x2="580" y2="48" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>

  <text x="34" y="68" font-size="11" fill="#555" font-weight="bold">①</text>
  <rect x="66" y="56" width="76" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="104" y="70" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">(10, 20)</text>
  <text x="190" y="70" font-size="10" fill="#b85450" font-weight="bold">10:+1</text>
  <text x="250" y="70" font-size="10" fill="#b85450" font-weight="bold">20:−1</text>
  <rect x="512" y="56" width="28" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="526" y="70" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <line x1="20" y1="82" x2="580" y2="82" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="34" y="100" font-size="11" fill="#555" font-weight="bold">②</text>
  <rect x="66" y="88" width="76" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="104" y="102" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">(50, 60)</text>
  <text x="190" y="102" font-size="10" fill="#888">10:+1</text>
  <text x="240" y="102" font-size="10" fill="#888">20:−1</text>
  <text x="300" y="102" font-size="10" fill="#b85450" font-weight="bold">50:+1</text>
  <text x="360" y="102" font-size="10" fill="#b85450" font-weight="bold">60:−1</text>
  <rect x="512" y="88" width="28" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="526" y="102" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>
  <line x1="20" y1="114" x2="580" y2="114" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="34" y="132" font-size="11" fill="#555" font-weight="bold">③</text>
  <rect x="66" y="120" width="76" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="104" y="134" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">(10, 40)</text>
  <text x="190" y="134" font-size="10" fill="#b85450" font-weight="bold">10:+2</text>
  <text x="240" y="134" font-size="10" fill="#888">20:−1</text>
  <text x="300" y="134" font-size="10" fill="#b85450" font-weight="bold">40:−1</text>
  <text x="360" y="134" font-size="10" fill="#888">50:+1</text>
  <text x="420" y="134" font-size="10" fill="#888">60:−1</text>
  <rect x="510" y="120" width="32" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="526" y="134" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2</text>
  <line x1="20" y1="146" x2="580" y2="146" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="34" y="164" font-size="11" fill="#555" font-weight="bold">④</text>
  <rect x="66" y="152" width="76" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="104" y="166" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">(5, 15)</text>
  <text x="186" y="166" font-size="9.5" fill="#b85450" font-weight="bold">5:+1</text>
  <text x="226" y="166" font-size="9.5" fill="#888">10:+2</text>
  <text x="276" y="166" font-size="9.5" fill="#b85450" font-weight="bold">15:−1</text>
  <text x="326" y="166" font-size="9.5" fill="#888">20:−1</text>
  <text x="376" y="166" font-size="9.5" fill="#888">40:−1</text>
  <text x="426" y="166" font-size="9.5" fill="#888">50:+1</text>
  <text x="476" y="166" font-size="9.5" fill="#888">60:−1</text>
  <rect x="510" y="152" width="32" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="526" y="166" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <line x1="20" y1="178" x2="580" y2="178" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="34" y="196" font-size="11" fill="#555" font-weight="bold">⑤</text>
  <rect x="66" y="184" width="76" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="104" y="198" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">(5, 10)</text>
  <text x="186" y="198" font-size="9.5" fill="#b85450" font-weight="bold">5:+2</text>
  <text x="226" y="198" font-size="9.5" fill="#b85450" font-weight="bold">10:+1</text>
  <text x="276" y="198" font-size="9.5" fill="#888">15:−1</text>
  <text x="326" y="198" font-size="9.5" fill="#888">20:−1</text>
  <text x="376" y="198" font-size="9.5" fill="#888">40:−1</text>
  <text x="426" y="198" font-size="9.5" fill="#888">50:+1</text>
  <text x="476" y="198" font-size="9.5" fill="#888">60:−1</text>
  <rect x="510" y="184" width="32" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="526" y="198" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <line x1="20" y1="210" x2="580" y2="210" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="34" y="228" font-size="11" fill="#555" font-weight="bold">⑥</text>
  <rect x="66" y="216" width="76" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="104" y="230" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">(25, 55)</text>
  <text x="180" y="230" font-size="9" fill="#888">5:+2</text>
  <text x="218" y="230" font-size="9" fill="#888">10:+1</text>
  <text x="258" y="230" font-size="9" fill="#888">15:−1</text>
  <text x="298" y="230" font-size="9" fill="#888">20:−1</text>
  <text x="338" y="230" font-size="9" fill="#b85450" font-weight="bold">25:+1</text>
  <text x="380" y="230" font-size="9" fill="#888">40:−1</text>
  <text x="420" y="230" font-size="9" fill="#888">50:+1</text>
  <text x="462" y="230" font-size="9" fill="#b85450" font-weight="bold">55:−1</text>
  <text x="508" y="230" font-size="9" fill="#888">60:−1</text>
  <rect x="510" y="216" width="32" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="526" y="230" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <line x1="20" y1="242" x2="580" y2="242" stroke="#aaa" stroke-width="1" filter="url(#rough2)"/>

  <rect x="36" y="262" width="528" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="284" font-size="11.5" fill="#d6a040" font-weight="bold">关键观察：第 ④ 步 max 跃升到 3</text>
  <text x="56" y="304" font-size="10.5" fill="#555">book(5,15) 后，端点 5(+1) 和 10(+2) 紧邻 → 区间 [10,15) 内三事件重叠</text>
  <text x="56" y="322" font-size="10.5" fill="#555">扫描轨迹：cur = 0→1→3→2→1→0→1→0，峰值 3 出现在 [10,15)</text>
  <text x="56" y="340" font-size="10.5" fill="#b85450" font-weight="bold">此后 ⑤⑥ 虽继续插入端点，但峰值不再增长 → max 维持 3</text>

  <rect x="36" y="360" width="528" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="382" font-size="11.5" fill="#4a7a3a" font-weight="bold">增量更新 vs 重建</text>
  <text x="56" y="402" font-size="10.5" fill="#555">• 每次只改 diff[start] 和 diff[end] 两处，其余键不变 → 有序 map 天然增量维护</text>
  <text x="56" y="420" font-size="10.5" fill="#555">• 但「求 max」必须扫描全部键（前缀和的最值无法 O(log n) 增量维护）→ 单次 O(n)</text>
  <text x="56" y="438" font-size="10.5" fill="#4a7a3a" font-weight="bold">→ 想要 O(log n) 单次？需动态线段树（区间加 + 区间最大，见第 5 节扩展）</text>
</svg>
