<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：建堆 → 堆顶哨兵判断 → 弹二压一</text>

  <!-- build heap -->
  <rect x="185" y="38" width="150" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="56" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">全部元素入小根堆</text>
  <text x="260" y="72" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">（heapify，O(n)）</text>

  <path d="M 260 78 L 260 90" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- decision: top < k ? -->
  <path d="M 260 96 L 336 128 L 260 160 L 184 128 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="125" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">堆顶 &lt; k ?</text>
  <text x="260" y="142" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">（堆顶 = 全局最小）</text>

  <path d="M 336 128 L 390 128" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="362" y="120" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="394" y="110" width="102" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="445" y="133" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <path d="M 260 160 L 260 178" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="276" y="174" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- pop x, y -->
  <rect x="160" y="182" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="200" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">弹出 x = 堆顶，再弹出 y</text>
  <text x="260" y="216" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">（x ≤ y）</text>

  <path d="M 260 222 L 260 236" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- push merged -->
  <rect x="160" y="240" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="258" text-anchor="middle" font-size="12" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">压入 2x + y，ans += 1</text>
  <text x="260" y="274" text-anchor="middle" font-size="10.5" fill="#2d5a1e" filter="url(#rough2)">（min·2 + max）</text>

  <!-- loop back -->
  <path d="M 160 260 L 96 260 L 96 128 L 178 128" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="106" y="196" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">下一轮</text>

  <!-- side notes -->
  <rect x="100" y="312" width="320" height="72" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="332" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">x 先弹出 ⇒ x ≤ y，min·2 + max 直接写 2x+y；</text>
  <text x="260" y="350" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">合并值最大 3×10⁹（超 int32），C++ 用 long long；</text>
  <text x="260" y="368" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">合并值会再次入局，必须压回堆。</text>
</svg>
