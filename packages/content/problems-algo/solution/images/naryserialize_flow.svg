<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">序列化 / 反序列化流程（前序 + 孩子数）</text>

  <!-- 序列化侧 -->
  <text x="140" y="56" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">serialize(node)</text>

  <polygon points="140,68 235,98 140,128 45,98" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="140" y="94" text-anchor="middle" font-size="11" fill="#333">node == null?</text>
  <text x="140" y="110" text-anchor="middle" font-size="10" fill="#888">空树</text>

  <path d="M 45 98 L 22 98 L 22 132" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="55" y="90" font-size="10" fill="#b85450">是</text>
  <rect x="0" y="136" width="84" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="42" y="154" text-anchor="middle" font-size="11" fill="#333">返回 ""</text>

  <path d="M 140 128 L 140 148" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="152" y="144" font-size="10" fill="#82b366">否</text>
  <rect x="45" y="152" width="190" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="140" y="171" text-anchor="middle" font-size="11" fill="#333">写 node.val + len(children)</text>

  <path d="M 140 180 L 140 198" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="35" y="202" width="210" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="140" y="222" text-anchor="middle" font-size="11" fill="#333">for child in node.children:</text>
  <text x="140" y="238" text-anchor="middle" font-size="11" fill="#333">serialize(child)</text>

  <text x="140" y="268" text-anchor="middle" font-size="10" fill="#888">空格拼接得到字符串</text>

  <!-- 到序列的箭头 -->
  <path d="M 250 244 L 298 244" stroke="#82b366" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 序列 -->
  <rect x="302" y="222" width="232" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="418" y="244" text-anchor="middle" font-size="10" fill="#333" font-family="monospace">1 3 3 2 5 0 6 0 2 0 4 0</text>
  <text x="418" y="260" text-anchor="middle" font-size="9" fill="#888">值 与 孩子数 交替</text>

  <!-- 反序列化侧 -->
  <text x="440" y="296" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">deserialize(data)</text>

  <polygon points="440,308 532,340 440,372 348,340" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="440" y="336" text-anchor="middle" font-size="11" fill="#333">data 为空?</text>
  <text x="440" y="352" text-anchor="middle" font-size="10" fill="#888">空树</text>

  <path d="M 348 340 L 334 340" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="344" y="332" font-size="10" fill="#b85450">是</text>
  <rect x="252" y="326" width="82" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="293" y="345" text-anchor="middle" font-size="11" fill="#333">返回 null</text>

  <path d="M 440 372 L 440 388" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="452" y="384" font-size="10" fill="#82b366">否</text>

  <rect x="316" y="392" width="248" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="440" y="410" text-anchor="middle" font-size="10" fill="#333">build()：读 val 与 count k</text>
  <text x="440" y="426" text-anchor="middle" font-size="10" fill="#333">建 Node(val)；for i&lt;k: append(build())</text>
</svg>
