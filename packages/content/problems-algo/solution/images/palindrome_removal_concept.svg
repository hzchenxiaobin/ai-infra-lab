<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">区间 DP 核心观察：配对 vs 分割</text>

  <!-- Array row -->
  <text x="30" y="62" font-size="13" fill="#666" filter="url(#rough2)">arr =</text>
  <rect x="70" y="44" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="66" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="120" y="44" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="145" y="66" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="170" y="44" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="195" y="66" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="220" y="44" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="245" y="66" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="270" y="44" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="295" y="66" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>

  <!-- i and j markers -->
  <text x="95" y="98" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">i</text>
  <path d="M95,90 L95,80" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="295" y="98" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">j</text>
  <path d="M295,90 L295,80" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Branch labels -->
  <text x="280" y="120" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">arr[i] == arr[j] ?</text>

  <!-- Left branch: pair -->
  <rect x="30" y="135" width="230" height="95" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="145" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">策略 A：两端配对</text>
  <text x="145" y="176" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">arr[i] 与 arr[j] 同属一次删除</text>
  <text x="145" y="194" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">先删中间 [i+1, j-1]</text>
  <text x="145" y="212" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">dp[i][j] = dp[i+1][j-1]</text>

  <!-- Right branch: split -->
  <rect x="300" y="135" width="230" height="95" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="415" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">策略 B：枚举分割点 k</text>
  <text x="415" y="176" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">在任意 k 处切成两段</text>
  <text x="415" y="194" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">分别独立删除</text>
  <text x="415" y="212" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">dp[i][j] = dp[i][k]+dp[k+1][j]</text>

  <!-- Arrows from decision to branches -->
  <path d="M200,125 L145,135" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M360,125 L415,135" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Bottom: intuition box -->
  <rect x="40" y="250" width="480" height="130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="272" text-anchor="middle" font-size="13" font-weight="bold" fill="#d6a040" filter="url(#rough2)">为什么 arr[i]==arr[j] 时两端可以「免费」删除？</text>
  <text x="55" y="295" font-size="12" fill="#555" filter="url(#rough2)">1. 先用 dp[i+1][j-1] 次操作清空中间部分，此时 arr[i] 和 arr[j] 相邻</text>
  <text x="55" y="315" font-size="12" fill="#555" filter="url(#rough2)">2. 清空中间的最后一次删除，其回文可向两侧延伸——把 arr[i]/arr[j] 吸收进去</text>
  <text x="55" y="335" font-size="12" fill="#555" filter="url(#rough2)">3. 因此两端不产生额外操作次数，dp[i][j] = dp[i+1][j-1]</text>
  <text x="55" y="358" font-size="12" fill="#b85450" filter="url(#rough2)">⚠ 取两种策略的最小值，保证最优</text>
</svg>
