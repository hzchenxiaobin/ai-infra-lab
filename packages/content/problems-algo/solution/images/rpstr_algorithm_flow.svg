<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>

  <text x="310" y="30" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">算法流程：预处理后缀最小值 + 单遍扫描贪心出栈</text>

  <!-- Box1: preprocess suffix min -->
  <rect x="70" y="52" width="480" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="80" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">① 预处理 suf[i] = min(s[i], suf[i+1])，哨兵 suf[n] = 'z'+1</text>
  <path d="M310 100 L310 118" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box2: main loop -->
  <rect x="120" y="120" width="380" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="147" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">② 遍历 i = 0 … n−1：先把 s[i] 压入 t</text>
  <path d="M310 166 L310 184" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box3: while pop decision -->
  <rect x="40" y="186" width="540" height="96" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="60" y="210" font-size="13" fill="#333" filter="url(#rough2)">③ while t 非空 且 t.back() ≤ suf[i+1]：</text>
  <text x="74" y="234" font-size="12" fill="#4a7a3a" filter="url(#rough2)">• 栈顶是剩余可用字符中最小者（不劣于 s 中任何未处理字符）</text>
  <text x="74" y="256" font-size="12" fill="#4a7a3a" filter="url(#rough2)">• 弹出 t.back() 追加到答案 ans；继续循环直到条件不满足</text>
  <text x="74" y="276" font-size="12" fill="#b85450" filter="url(#rough2)">⚠ 用 ≤ 而非 &lt;：等号时也须立即出栈，否则会被后续更大字符埋住</text>
  <path d="M310 284 L310 302" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box4: loopback -->
  <rect x="120" y="304" width="380" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="331" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">④ i ← i+1；若 i &lt; n 回 ②</text>

  <!-- loopback arrow on right -->
  <path d="M500 326 L568 326 L568 142 L502 142" fill="none" stroke="#446688" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="575" y="236" font-size="11" fill="#446688" filter="url(#rough2)">i</text>
  <text x="575" y="250" font-size="11" fill="#446688" filter="url(#rough2)">加</text>
  <text x="575" y="264" font-size="11" fill="#446688" filter="url(#rough2)">1</text>

  <!-- Box5: drain t -->
  <path d="M310 350 L310 368" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="80" y="370" width="460" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="397" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">⑤ s 已空：把 t 中剩余字符依次弹出追加到 ans</text>

  <!-- Box6: return -->
  <path d="M310 416 L310 432" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="200" y="434" width="220" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="310" y="454" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">⑥ return ans</text>
</svg>
