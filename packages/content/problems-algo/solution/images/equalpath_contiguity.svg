<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2b4a66"/>
    </marker>
  </defs>

  <rect width="720" height="410" fill="#fdfcf7"/>

  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">连续区间引理：一次 2×2 角翻转，0 数变化不超过 1</text>
  <path d="M 200 38 Q 360 46 520 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="360" y="60" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">同一 2×2 方块的两条走法，只交换「右上」与「左下」一个格子，公共格 TL、BR 不变</text>

  <!-- ============ Left 2x2 block: path A = →,↓ (visits TL,TR,BR) ============ -->
  <!-- TL neutral blue -->
  <g filter="url(#sk)">
    <rect x="70" y="80" width="70" height="70" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="140" y="80" width="70" height="70" rx="5" fill="#fff3d6" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="70" y="150" width="70" height="70" rx="5" fill="#f4f4f4" stroke="#bdbdbd" stroke-width="1.4" stroke-dasharray="4 3"/>
    <rect x="140" y="150" width="70" height="70" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g font-size="22" font-weight="bold" text-anchor="middle" filter="url(#sk)">
    <text x="105" y="124" fill="#2b4a66">0</text>
    <text x="175" y="124" fill="#7a5415">1</text>
    <text x="105" y="194" fill="#bbb">·</text>
    <text x="175" y="194" fill="#2b4a66">1</text>
  </g>
  <text x="140" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">路径 A：→ ↓</text>
  <!-- arrows: TL->TR, TR->BR -->
  <line x1="140" y1="115" x2="158" y2="115" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#ag)" filter="url(#sk)"/>
  <line x1="175" y1="150" x2="175" y2="168" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#ag)" filter="url(#sk)"/>
  <text x="105" y="240" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">0 数 = 1（仅 TL 为 0）</text>

  <!-- swap arrow between blocks -->
  <path d="M 220 115 C 300 95 360 95 410 115" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="315" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#sk)">交换 TR ↔ BL</text>
  <path d="M 410 185 C 330 205 270 205 220 185" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- ============ Right 2x2 block: path B = ↓,→ (visits TL,BL,BR) ============ -->
  <g filter="url(#sk)">
    <rect x="420" y="80" width="70" height="70" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <rect x="490" y="80" width="70" height="70" rx="5" fill="#f4f4f4" stroke="#bdbdbd" stroke-width="1.4" stroke-dasharray="4 3"/>
    <rect x="420" y="150" width="70" height="70" rx="5" fill="#fff3d6" stroke="#d6a040" stroke-width="2.2"/>
    <rect x="490" y="150" width="70" height="70" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <g font-size="22" font-weight="bold" text-anchor="middle" filter="url(#sk)">
    <text x="455" y="124" fill="#2b4a66">0</text>
    <text x="525" y="124" fill="#bbb">·</text>
    <text x="455" y="194" fill="#7a5415">0</text>
    <text x="525" y="194" fill="#2b4a66">1</text>
  </g>
  <text x="490" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">路径 B：↓ →</text>
  <line x1="455" y1="150" x2="455" y2="168" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#ag)" filter="url(#sk)"/>
  <line x1="490" y1="185" x2="508" y2="185" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#ag)" filter="url(#sk)"/>
  <text x="490" y="240" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">0 数 = 2（TL、BL 为 0）</text>

  <!-- ============ formula box ============ -->
  <g filter="url(#sk)">
    <rect x="60" y="265" width="600" height="120" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/>
  </g>
  <text x="80" y="290" font-size="13" font-weight="bold" fill="#444" filter="url(#sk)">Δ(0 数) = [BL == 0] − [TR == 0] = 1 − 0 = +1  ∈ { −1, 0, +1 }</text>
  <text x="80" y="314" font-size="12" fill="#444" filter="url(#sk)">公共格 TL、BR 不变；一次角翻转最多让 0 数增减 1。</text>
  <text x="80" y="338" font-size="12" fill="#444" filter="url(#sk)">任意两条「右/下」单调路径可由一串相邻 DR↔RD 交换（即角翻转）互通，</text>
  <text x="80" y="360" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#sk)">⇒ 可达 0 数集合为连续整数区间 [min0, max0]，目标 T 落入即存在。</text>

  <!-- mini interval dots -->
  <g filter="url(#sk)">
    <circle cx="430" cy="390" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="470" cy="390" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="510" cy="390" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <circle cx="550" cy="390" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <line x1="435" y1="390" x2="465" y2="390" stroke="#4a7a3a" stroke-width="1.4"/>
    <line x1="475" y1="390" x2="505" y2="390" stroke="#4a7a3a" stroke-width="1.4"/>
    <line x1="515" y1="390" x2="545" y2="390" stroke="#4a7a3a" stroke-width="1.4"/>
  </g>
  <text x="600" y="394" font-size="11" fill="#4a7a3a" filter="url(#sk)">连续，无空洞</text>
</svg>
