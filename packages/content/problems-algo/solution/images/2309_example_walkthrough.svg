<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：三组样例的双掩码相与结果</text>
  <text x="270" y="44" text-anchor="middle" font-size="10.5" fill="#999">蓝 = 小写出现 · 橙 = 大写出现 · 绿框 = 兼具大小写（both）</text>

  <!-- ============ Example 1: lEeTcOdE → E ============ -->
  <text x="30" y="76" font-size="12" fill="#446688" font-weight="bold">示例 1</text>
  <text x="90" y="76" font-size="12" fill="#333">s = "lEeTcOdE"</text>
  <!-- char cells, width 28 -->
  <g filter="url(#rough2)">
    <!-- l(0) lower -->
    <rect x="60" y="84" width="28" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <!-- E(1) upper, both -->
    <rect x="88" y="84" width="28" height="30" fill="#fff8e1" stroke="#4a7a3a" stroke-width="2.2" rx="3"/>
    <!-- e(2) lower, both -->
    <rect x="116" y="84" width="28" height="30" fill="#e8f0fe" stroke="#4a7a3a" stroke-width="2.2" rx="3"/>
    <!-- T(3) upper -->
    <rect x="144" y="84" width="28" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <!-- c(4) lower -->
    <rect x="172" y="84" width="28" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <!-- O(5) upper -->
    <rect x="200" y="84" width="28" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <!-- d(6) lower -->
    <rect x="228" y="84" width="28" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <!-- E(7) upper, both -->
    <rect x="256" y="84" width="28" height="30" fill="#fff8e1" stroke="#4a7a3a" stroke-width="2.2" rx="3"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="74" y="104">l</text><text x="102" y="104" fill="#4a7a3a">E</text><text x="130" y="104" fill="#4a7a3a">e</text>
    <text x="158" y="104">T</text><text x="186" y="104">c</text><text x="214" y="104">O</text>
    <text x="242" y="104">d</text><text x="270" y="104" fill="#4a7a3a">E</text>
  </g>
  <text x="300" y="104" font-size="12" fill="#555">→ both = {E} → </text>
  <text x="430" y="104" font-size="13" fill="#4a7a3a" font-weight="bold">return "E"</text>

  <line x1="30" y1="128" x2="510" y2="128" stroke="#dddddd" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ============ Example 2: arRAzFif → R ============ -->
  <text x="30" y="156" font-size="12" fill="#446688" font-weight="bold">示例 2</text>
  <text x="90" y="156" font-size="12" fill="#333">s = "arRAzFif"</text>
  <g filter="url(#rough2)">
    <!-- a(0) lower, both -->
    <rect x="60" y="164" width="28" height="30" fill="#e8f0fe" stroke="#4a7a3a" stroke-width="2.2" rx="3"/>
    <!-- r(1) lower, both -->
    <rect x="88" y="164" width="28" height="30" fill="#e8f0fe" stroke="#4a7a3a" stroke-width="2.2" rx="3"/>
    <!-- R(2) upper, both -->
    <rect x="116" y="164" width="28" height="30" fill="#fff8e1" stroke="#4a7a3a" stroke-width="2.6" rx="3"/>
    <!-- A(3) upper, both -->
    <rect x="144" y="164" width="28" height="30" fill="#fff8e1" stroke="#4a7a3a" stroke-width="2.2" rx="3"/>
    <!-- z(4) lower -->
    <rect x="172" y="164" width="28" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <!-- F(5) upper, both -->
    <rect x="200" y="164" width="28" height="30" fill="#fff8e1" stroke="#4a7a3a" stroke-width="2.2" rx="3"/>
    <!-- i(6) lower -->
    <rect x="228" y="164" width="28" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <!-- f(7) lower, both -->
    <rect x="256" y="164" width="28" height="30" fill="#e8f0fe" stroke="#4a7a3a" stroke-width="2.2" rx="3"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="74" y="184" fill="#4a7a3a">a</text><text x="102" y="184" fill="#4a7a3a">r</text>
    <text x="130" y="184" fill="#4a7a3a">R</text><text x="158" y="184" fill="#4a7a3a">A</text>
    <text x="186" y="184">z</text><text x="214" y="184" fill="#4a7a3a">F</text>
    <text x="242" y="184">i</text><text x="270" y="184" fill="#4a7a3a">f</text>
  </g>
  <text x="300" y="184" font-size="12" fill="#555">→ both = {A,F,</text>
  <text x="386" y="184" font-size="13" fill="#4a7a3a" font-weight="bold">R</text>
  <text x="396" y="184" font-size="12" fill="#555">} → </text>
  <text x="430" y="184" font-size="13" fill="#4a7a3a" font-weight="bold">return "R"</text>
  <text x="300" y="200" font-size="10.5" fill="#999">R 在字母表最靠后 = 最高置位 = 最好</text>

  <line x1="30" y1="214" x2="510" y2="214" stroke="#dddddd" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ============ Example 3: AbCdEfGhIjK → "" ============ -->
  <text x="30" y="242" font-size="12" fill="#446688" font-weight="bold">示例 3</text>
  <text x="90" y="242" font-size="12" fill="#333">s = "AbCdEfGhIjK"</text>
  <g filter="url(#rough2)">
    <!-- A upper -->
    <rect x="60" y="250" width="28" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <!-- b lower -->
    <rect x="88" y="250" width="28" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <!-- C upper -->
    <rect x="116" y="250" width="28" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <!-- d lower -->
    <rect x="144" y="250" width="28" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <!-- E upper -->
    <rect x="172" y="250" width="28" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <!-- f lower -->
    <rect x="200" y="250" width="28" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <!-- G upper -->
    <rect x="228" y="250" width="28" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <!-- h lower -->
    <rect x="256" y="250" width="28" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <!-- I upper -->
    <rect x="284" y="250" width="28" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
    <!-- j lower -->
    <rect x="312" y="250" width="28" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3"/>
    <!-- K upper -->
    <rect x="340" y="250" width="28" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3"/>
  </g>
  <g font-size="14" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="74" y="270">A</text><text x="102" y="270">b</text><text x="130" y="270">C</text><text x="158" y="270">d</text>
    <text x="186" y="270">E</text><text x="214" y="270">f</text><text x="242" y="270">G</text><text x="270" y="270">h</text>
    <text x="298" y="270">I</text><text x="326" y="270">j</text><text x="354" y="270">K</text>
  </g>
  <text x="384" y="270" font-size="12" fill="#555">→ both = ∅ → </text>
  <text x="490" y="270" text-anchor="end" font-size="13" fill="#b85450" font-weight="bold">return ""</text>
  <text x="384" y="286" font-size="10.5" fill="#999">无任一字母兼具大小写</text>

  <!-- bottom summary box -->
  <rect x="40" y="312" width="460" height="138" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="56" y="336" font-size="12" fill="#446688" font-weight="bold">判定规则汇总</text>
  <text x="56" y="358" font-size="11.5" fill="#333">• 兼具大小写 = letter 的小写位与对应大写位同时为 1（both = lower &amp; upper）</text>
  <text x="56" y="378" font-size="11.5" fill="#333">• 最好 = both 中下标最大者（字母表越靠后越好）→ 取最高置位</text>
  <text x="56" y="398" font-size="11.5" fill="#333">• both == 0：无兼具大小写的字母，返回空串 ""</text>
  <text x="56" y="426" font-size="11" fill="#d6a040" font-weight="bold">关键：lower 与 upper 用同一字母下标对齐，相与即得「大小写都出现」的字母集合</text>
</svg>
