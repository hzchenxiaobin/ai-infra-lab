<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算：total=20, cost1=10, cost2=5 → ans=9</text>
  <text x="300" y="46" text-anchor="middle" font-size="11" fill="#888">已满足 cost1 ≥ cost2，无需交换；x 从 0 枚举到 ⌊20/10⌋=2</text>

  <!-- ===== Table ===== -->
  <!-- header background -->
  <rect x="80" y="74" width="480" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="110" y="96" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">x</text>
  <text x="185" y="96" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">花费 x·10</text>
  <text x="270" y="96" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">剩余 rem</text>
  <text x="360" y="96" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Y=⌊rem/5⌋</text>
  <text x="450" y="96" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">选法 Y+1</text>
  <text x="525" y="96" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">累计 ans</text>

  <!-- column separators (subtle) -->
  <line x1="140" y1="74" x2="140" y2="284" stroke="#cdd6e4" stroke-width="1" filter="url(#rough2)"/>
  <line x1="230" y1="74" x2="230" y2="284" stroke="#cdd6e4" stroke-width="1" filter="url(#rough2)"/>
  <line x1="310" y1="74" x2="310" y2="284" stroke="#cdd6e4" stroke-width="1" filter="url(#rough2)"/>
  <line x1="410" y1="74" x2="410" y2="284" stroke="#cdd6e4" stroke-width="1" filter="url(#rough2)"/>
  <line x1="490" y1="74" x2="490" y2="284" stroke="#cdd6e4" stroke-width="1" filter="url(#rough2)"/>

  <!-- ans column highlight -->
  <rect x="490" y="108" width="70" height="176" fill="#e6f4ea" stroke="none" rx="3" filter="url(#rough2)"/>

  <!-- Row 0: x=0 -->
  <rect x="80" y="108" width="480" height="44" fill="none" stroke="#d6d6d6" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="136" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <text x="185" y="136" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="270" y="136" text-anchor="middle" font-size="12" fill="#333">20</text>
  <text x="360" y="136" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="450" y="136" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="525" y="136" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">5</text>

  <!-- Row 1: x=1 (highlighted as the "fixed x" example) -->
  <rect x="80" y="152" width="480" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="110" y="180" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">1</text>
  <text x="185" y="180" text-anchor="middle" font-size="12" fill="#333">10</text>
  <text x="270" y="180" text-anchor="middle" font-size="12" fill="#333">10</text>
  <text x="360" y="180" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="450" y="180" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="525" y="180" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">8</text>

  <!-- Row 2: x=2 (final valid) -->
  <rect x="80" y="196" width="480" height="44" fill="none" stroke="#d6d6d6" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="224" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <text x="185" y="224" text-anchor="middle" font-size="12" fill="#333">20</text>
  <text x="270" y="224" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="360" y="224" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="450" y="224" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="525" y="224" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">9</text>

  <!-- Row 3: x=3 stop -->
  <rect x="80" y="240" width="480" height="44" fill="#f5f5f5" stroke="#ccc" stroke-width="1" stroke-dasharray="4 3" rx="3" filter="url(#rough2)"/>
  <text x="110" y="268" text-anchor="middle" font-size="13" fill="#bbb">3</text>
  <text x="185" y="268" text-anchor="middle" font-size="12" fill="#bbb">30 &gt; 20</text>
  <text x="300" y="268" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">超出预算，停止枚举 ✗</text>

  <!-- arrow pointing ans progression -->
  <path d="M 525 142 L 525 216" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" stroke-dasharray="4 3" filter="url(#rough2)"/>

  <!-- bottom note -->
  <rect x="80" y="300" width="480" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="322" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">观察：选法列 5 → 3 → 1 是等差数列（公差 −2 = −cost1/cost2）</text>
  <text x="300" y="342" text-anchor="middle" font-size="11" fill="#888">每多买 1 支钢笔，剩余钱少 10，铅笔可买数恰好少 10/5=2</text>
  <text x="300" y="358" text-anchor="middle" font-size="11" fill="#888">ans = 5 + 3 + 1 = 9 ✓（一般情况非严格等差，本题系数整除恰好成等差）</text>
</svg>
