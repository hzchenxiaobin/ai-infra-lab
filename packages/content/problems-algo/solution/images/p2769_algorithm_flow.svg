<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="34" text-anchor="middle" font-size="16" fill="#446688" filter="url(#rough2)">算法流程：差距 → 充要条件 → 闭式解</text>

  <!-- 步骤 1 -->
  <rect x="60" y="60" width="400" height="48" fill="#e8f0fe"
        stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="80" y="90" font-size="13" fill="#446688" filter="url(#rough2)">① 定义差距 d = x − num（求最大值时 x &gt; num）</text>

  <path d="M260,112 L260,128" stroke="#446688" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 步骤 2 -->
  <rect x="60" y="130" width="400" height="48" fill="#e8f0fe"
        stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="80" y="160" font-size="13" fill="#446688" filter="url(#rough2)">② 贪心：每步 x−1、num+1，d 每步减 2</text>

  <path d="M260,180 L260,196" stroke="#446688" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 步骤 3 -->
  <rect x="60" y="198" width="400" height="48" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="80" y="228" font-size="13" fill="#4a7a3a" filter="url(#rough2)">③ t 步最多减 2t，追平需 d ≤ 2t</text>

  <path d="M260,248 L260,264" stroke="#446688" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 步骤 4：结论 -->
  <rect x="60" y="266" width="400" height="56" fill="#fff8e1"
        stroke="#d6a040" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="298" text-anchor="middle" font-size="15" fill="#d6a040" filter="url(#rough2)">④ x ≤ num + 2t，取等号得最大</text>
  <text x="260" y="316" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">x_max = num + 2t</text>

  <!-- 旁注 -->
  <text x="470" y="90" font-size="11" fill="#999" filter="url(#rough2)">建模</text>
  <text x="470" y="160" font-size="11" fill="#999" filter="url(#rough2)">贪心</text>
  <text x="470" y="228" font-size="11" fill="#999" filter="url(#rough2)">不变量</text>
  <text x="470" y="298" font-size="11" fill="#999" filter="url(#rough2)">闭式</text>
</svg>
