<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：先按 102 自顶向下收集，再整体翻转</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">BFS 骨架不变，只多一步 reverse —— 「遍历」与「输出方向」解耦</text>

  <!-- ===== Tree (left) ===== -->
  <text x="30" y="74" font-size="11" fill="#446688" font-weight="bold">二叉树</text>
  <g font-size="11">
    <circle cx="100" cy="92" r="18" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="100" y="97" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
    <circle cx="60" cy="150" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="60" y="155" text-anchor="middle" fill="#446688" font-weight="bold">9</text>
    <circle cx="150" cy="150" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="150" y="155" text-anchor="middle" fill="#4a7a3a" font-weight="bold">20</text>
    <line x1="90" y1="104" x2="70" y2="138" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <line x1="110" y1="104" x2="140" y2="138" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <circle cx="125" cy="208" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="125" y="213" text-anchor="middle" fill="#d6a040" font-weight="bold">15</text>
    <circle cx="180" cy="208" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="180" y="213" text-anchor="middle" fill="#d6a040" font-weight="bold">7</text>
    <line x1="142" y1="162" x2="128" y2="196" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <line x1="158" y1="162" x2="172" y2="196" stroke="#888" stroke-width="1" filter="url(#rough2)"/>

    <text x="18" y="97" font-size="9" fill="#b85450" font-weight="bold">L0</text>
    <text x="18" y="155" font-size="9" fill="#446688" font-weight="bold">L1</text>
    <text x="18" y="213" font-size="9" fill="#d6a040" font-weight="bold">L2</text>
  </g>

  <!-- arrow tree -> top-down result -->
  <path d="M 215 150 L 250 150" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="232" y="142" text-anchor="middle" font-size="9" fill="#888">BFS</text>

  <!-- ===== Top-down result (middle) ===== -->
  <text x="300" y="74" font-size="11" fill="#444" font-weight="bold">自顶向下收集</text>
  <g font-size="11">
    <rect x="280" y="90" width="80" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="320" y="108" text-anchor="middle" fill="#b85450" font-weight="bold">[3]</text>
    <text x="272" y="108" font-size="9" fill="#b85450" font-weight="bold">L0</text>

    <rect x="280" y="124" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="320" y="142" text-anchor="middle" fill="#446688" font-weight="bold">[9, 20]</text>
    <text x="272" y="142" font-size="9" fill="#446688" font-weight="bold">L1</text>

    <rect x="280" y="158" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="320" y="176" text-anchor="middle" fill="#d6a040" font-weight="bold">[15, 7]</text>
    <text x="272" y="176" font-size="9" fill="#d6a040" font-weight="bold">L2</text>

    <text x="320" y="200" text-anchor="middle" font-size="9" fill="#888">result（正序）</text>
  </g>

  <!-- arrow: reverse -->
  <path d="M 370 165 L 410 165" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="390" y="156" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">reverse</text>
  <text x="390" y="180" text-anchor="middle" font-size="8" fill="#888">O(L)</text>

  <!-- ===== Bottom-up result (right) ===== -->
  <text x="490" y="74" font-size="11" fill="#444" font-weight="bold">自底向上输出</text>
  <g font-size="11">
    <rect x="430" y="90" width="90" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="475" y="108" text-anchor="middle" fill="#d6a040" font-weight="bold">[15, 7]</text>
    <text x="525" y="108" font-size="9" fill="#d6a040" font-weight="bold">L2</text>

    <rect x="430" y="124" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="475" y="142" text-anchor="middle" fill="#446688" font-weight="bold">[9, 20]</text>
    <text x="525" y="142" font-size="9" fill="#446688" font-weight="bold">L1</text>

    <rect x="430" y="158" width="90" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="475" y="176" text-anchor="middle" fill="#b85450" font-weight="bold">[3]</text>
    <text x="525" y="176" font-size="9" fill="#b85450" font-weight="bold">L0</text>

    <text x="475" y="200" text-anchor="middle" font-size="9" fill="#888">result（逆序）</text>
  </g>

  <!-- ===== Insight box ===== -->
  <rect x="30" y="240" width="490" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="50" y="260" font-size="11" fill="#4a7a3a" font-weight="bold">为什么不在遍历时直接倒着收集？</text>
  <text x="50" y="277" font-size="10" fill="#555">BFS 天然自顶向下（队列从根开始扩散），倒着收集要么「头插 O(n·L)」要么先存后翻。</text>
  <text x="50" y="291" font-size="10" fill="#555">先按 102 正序收集，最后一次性 reverse 仅 O(L)，最简洁、最不易错。</text>

  <rect x="30" y="312" width="490" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="50" y="332" font-size="11" fill="#d6a040" font-weight="bold">与 102 的差异：仅一行</text>
  <text x="50" y="349" font-family="monospace" font-size="10" fill="#333">reverse(result.begin(), result.end());   // 或 Python: result.reverse()</text>
  <text x="50" y="360" font-size="9" fill="#888">L = 树高 ≤ n，翻转外层列表不计入时间复杂度量级（仍 O(n)）</text>
</svg>
