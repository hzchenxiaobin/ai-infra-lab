<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心结构：memoize = 闭包 + 哈希缓存</text>

  <!-- caller -->
  <rect x="190" y="42" width="180" height="38" rx="8" fill="#f5f5f5" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">调用 memoized(...args)</text>

  <path d="M 280 82 L 280 100" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- closure big box -->
  <rect x="40" y="102" width="480" height="220" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="60" y="126" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">memoize(fn) 返回的包装函数（闭包）</text>

  <!-- fn slot -->
  <rect x="70" y="150" width="150" height="64" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="145" y="178" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">原函数 fn</text>
  <text x="145" y="198" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">（闭包捕获）</text>

  <!-- cache slot -->
  <rect x="340" y="150" width="160" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="420" y="178" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Map cache</text>
  <text x="420" y="198" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">key → result（闭包捕获）</text>

  <!-- body box -->
  <rect x="150" y="240" width="260" height="44" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="266" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">函数体：序列化 args → 查/写 cache</text>

  <!-- arrow: body -> fn (call on miss) -->
  <path d="M 175 240 L 150 216" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="92" y="232" font-size="10" fill="#d6a040" filter="url(#rough2)">未命中→调</text>

  <!-- arrow: body -> cache (read/write) -->
  <path d="M 385 240 L 410 216" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="414" y="232" font-size="10" fill="#4a7a3a" filter="url(#rough2)">读/写</text>

  <!-- note -->
  <rect x="60" y="296" width="440" height="20" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="311" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">fn 与 cache 被闭包捕获 → 多次调用共享同一份缓存</text>
</svg>
