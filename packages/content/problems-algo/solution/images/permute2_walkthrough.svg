<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums=[1,1,2]（已排序）→ 3 个不重复排列</text>

  <!-- ===== Table grid ===== -->
  <!-- column x: 步骤 20-66, path 66-166, used 166-276, 动作 276-620 -->
  <!-- row backgrounds -->
  <rect x="20" y="76" width="600" height="32" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="20" y="172" width="600" height="32" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="20" y="236" width="600" height="32" fill="#fce4ec" filter="url(#rough2)"/>
  <rect x="20" y="332" width="600" height="32" fill="#e6f4ea" filter="url(#rough2)"/>
  <rect x="20" y="364" width="600" height="32" fill="#fce4ec" filter="url(#rough2)"/>

  <!-- outer border -->
  <rect x="20" y="44" width="600" height="352" fill="none" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <!-- header separator -->
  <line x1="20" y1="76" x2="620" y2="76" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <!-- vertical separators -->
  <line x1="66" y1="44" x2="66" y2="396" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="166" y1="44" x2="166" y2="396" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="276" y1="44" x2="276" y2="396" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <!-- row separators -->
  <line x1="20" y1="108" x2="620" y2="108" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="140" x2="620" y2="140" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="204" x2="620" y2="204" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="268" x2="620" y2="268" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="20" y1="300" x2="620" y2="300" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Header ===== -->
  <text x="43" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">步骤</text>
  <text x="116" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">path</text>
  <text x="221" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">used</text>
  <text x="448" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">动作 / 说明</text>

  <!-- ===== Row 1 ===== -->
  <text x="43" y="96" text-anchor="middle" font-size="12" fill="#333">①</text>
  <text x="116" y="96" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">[1]</text>
  <text x="221" y="96" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">[T,F,F]</text>
  <text x="284" y="96" font-size="11" fill="#555">首位选 nums[0]=1，进入第二层</text>

  <!-- Row 2 -->
  <text x="43" y="128" text-anchor="middle" font-size="12" fill="#333">②</text>
  <text x="116" y="128" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">[1,1]</text>
  <text x="221" y="128" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">[T,T,F]</text>
  <text x="284" y="128" font-size="11" fill="#4a7a3a">纵向复用：used[0]=T，不剪枝</text>

  <!-- Row 3 (collect) -->
  <text x="43" y="160" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③</text>
  <text x="116" y="160" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" font-family="monospace">[1,1,2]</text>
  <text x="221" y="160" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">[T,T,T]</text>
  <text x="284" y="160" font-size="11" fill="#4a7a3a" font-weight="bold">路径满 → 收集 ✓ [1,1,2]</text>

  <!-- Row 4 -->
  <text x="43" y="192" text-anchor="middle" font-size="12" fill="#333">④</text>
  <text x="116" y="192" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">[1,2]</text>
  <text x="221" y="192" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">[T,F,T]</text>
  <text x="284" y="192" font-size="11" fill="#555">回溯，换选 nums[2]=2</text>

  <!-- Row 5 (collect) -->
  <text x="43" y="224" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">⑤</text>
  <text x="116" y="224" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" font-family="monospace">[1,2,1]</text>
  <text x="221" y="224" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">[T,T,T]</text>
  <text x="284" y="224" font-size="11" fill="#4a7a3a" font-weight="bold">路径满 → 收集 ✓ [1,2,1]</text>

  <!-- Row 6 (prune) -->
  <text x="43" y="256" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">⑥</text>
  <text x="116" y="256" text-anchor="middle" font-size="12" fill="#b85450" font-family="monospace">[]</text>
  <text x="221" y="256" text-anchor="middle" font-size="12" fill="#b85450" font-family="monospace">[F,F,F]</text>
  <text x="284" y="256" font-size="11" fill="#b85450" font-weight="bold">回溯到根，试 nums[1]=1 → ✗ 同层重复剪枝</text>

  <!-- Row 7 -->
  <text x="43" y="288" text-anchor="middle" font-size="12" fill="#333">⑦</text>
  <text x="116" y="288" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">[2]</text>
  <text x="221" y="288" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">[F,F,T]</text>
  <text x="284" y="288" font-size="11" fill="#555">首位选 nums[2]=2</text>

  <!-- Row 8 -->
  <text x="43" y="320" text-anchor="middle" font-size="12" fill="#333">⑧</text>
  <text x="116" y="320" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">[2,1]</text>
  <text x="221" y="320" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">[T,F,T]</text>
  <text x="284" y="320" font-size="11" fill="#555">第二位选 nums[0]=1</text>

  <!-- Row 9 (collect) -->
  <text x="43" y="352" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">⑨</text>
  <text x="116" y="352" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" font-family="monospace">[2,1,1]</text>
  <text x="221" y="352" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">[T,T,T]</text>
  <text x="284" y="352" font-size="11" fill="#4a7a3a" font-weight="bold">纵向复用 → 收集 ✓ [2,1,1]</text>

  <!-- Row 10 (prune) -->
  <text x="43" y="384" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">⑩</text>
  <text x="116" y="384" text-anchor="middle" font-size="12" fill="#b85450" font-family="monospace">[2]</text>
  <text x="221" y="384" text-anchor="middle" font-size="12" fill="#b85450" font-family="monospace">[F,F,T]</text>
  <text x="284" y="384" font-size="11" fill="#b85450" font-weight="bold">同层试 nums[1]=1 → ✗ 同层重复剪枝</text>

  <!-- ===== Footer note ===== -->
  <text x="320" y="416" text-anchor="middle" font-size="11" fill="#888">绿色行 = 收集到的合法排列（共 3 个）；红色行 = 同层去重剪枝；纵向复用（used[i-1]=T）不剪枝</text>
</svg>
