<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：target=12, position=[10,8,0,5,3], speed=[2,4,1,1,3]</text>

  <!-- ===== Table ===== -->
  <!-- Header row background -->
  <rect x="15" y="44" width="535" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>

  <!-- Header text -->
  <text x="40" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">步骤</text>
  <text x="105" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">(pos, spd)</text>
  <text x="180" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">t</text>
  <text x="262" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">t &gt; max_t?</text>
  <text x="365" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">操作</text>
  <text x="445" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">fleets</text>
  <text x="510" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">max_t</text>

  <!-- Vertical grid lines -->
  <line x1="65" y1="44" x2="65" y2="230" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="145" y1="44" x2="145" y2="230" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="215" y1="44" x2="215" y2="230" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="310" y1="44" x2="310" y2="230" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="420" y1="44" x2="420" y2="230" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="470" y1="44" x2="470" y2="230" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Horizontal grid lines -->
  <line x1="15" y1="72" x2="550" y2="72" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="15" y1="102" x2="550" y2="102" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="15" y1="132" x2="550" y2="132" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="15" y1="162" x2="550" y2="162" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="15" y1="192" x2="550" y2="192" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="15" y1="222" x2="550" y2="222" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Row 1: i=0, (10,2), t=1.0, 1.0>0 ✓, 新车队, 1, 1.0 ===== -->
  <text x="40" y="92" text-anchor="middle" font-size="11" fill="#333">i=0</text>
  <text x="105" y="92" text-anchor="middle" font-size="11" fill="#333">(10, 2)</text>
  <text x="180" y="92" text-anchor="middle" font-size="11" fill="#333">1.0</text>
  <text x="262" y="92" text-anchor="middle" font-size="11" fill="#82b366" font-weight="bold">1.0 &gt; 0 ✓</text>
  <text x="365" y="92" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">新车队</text>
  <text x="445" y="92" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="510" y="92" text-anchor="middle" font-size="11" fill="#333">1.0</text>

  <!-- ===== Row 2: i=1, (8,4), t=1.0, 1.0>1.0 ✗, 并入, 1, 1.0 ===== -->
  <text x="40" y="122" text-anchor="middle" font-size="11" fill="#333">i=1</text>
  <text x="105" y="122" text-anchor="middle" font-size="11" fill="#333">(8, 4)</text>
  <text x="180" y="122" text-anchor="middle" font-size="11" fill="#333">1.0</text>
  <text x="262" y="122" text-anchor="middle" font-size="11" fill="#b85450">1.0 &gt; 1.0 ✗</text>
  <text x="365" y="122" text-anchor="middle" font-size="11" fill="#888">并入</text>
  <text x="445" y="122" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="510" y="122" text-anchor="middle" font-size="11" fill="#333">1.0</text>

  <!-- ===== Row 3: i=2, (5,1), t=7.0, 7.0>1.0 ✓, 新车队, 2, 7.0 ===== -->
  <text x="40" y="152" text-anchor="middle" font-size="11" fill="#333">i=2</text>
  <text x="105" y="152" text-anchor="middle" font-size="11" fill="#333">(5, 1)</text>
  <text x="180" y="152" text-anchor="middle" font-size="11" fill="#333">7.0</text>
  <text x="262" y="152" text-anchor="middle" font-size="11" fill="#82b366" font-weight="bold">7.0 &gt; 1.0 ✓</text>
  <text x="365" y="152" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">新车队</text>
  <text x="445" y="152" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="510" y="152" text-anchor="middle" font-size="11" fill="#333">7.0</text>

  <!-- ===== Row 4: i=3, (3,3), t=3.0, 3.0>7.0 ✗, 并入, 2, 7.0 ===== -->
  <text x="40" y="182" text-anchor="middle" font-size="11" fill="#333">i=3</text>
  <text x="105" y="182" text-anchor="middle" font-size="11" fill="#333">(3, 3)</text>
  <text x="180" y="182" text-anchor="middle" font-size="11" fill="#333">3.0</text>
  <text x="262" y="182" text-anchor="middle" font-size="11" fill="#b85450">3.0 &gt; 7.0 ✗</text>
  <text x="365" y="182" text-anchor="middle" font-size="11" fill="#888">并入</text>
  <text x="445" y="182" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="510" y="182" text-anchor="middle" font-size="11" fill="#333">7.0</text>

  <!-- ===== Row 5: i=4, (0,1), t=12, 12>7.0 ✓, 新车队, 3, 12 ===== -->
  <text x="40" y="212" text-anchor="middle" font-size="11" fill="#333">i=4</text>
  <text x="105" y="212" text-anchor="middle" font-size="11" fill="#333">(0, 1)</text>
  <text x="180" y="212" text-anchor="middle" font-size="11" fill="#333">12</text>
  <text x="262" y="212" text-anchor="middle" font-size="11" fill="#82b366" font-weight="bold">12 &gt; 7.0 ✓</text>
  <text x="365" y="212" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">新车队</text>
  <text x="445" y="212" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="510" y="212" text-anchor="middle" font-size="11" fill="#333">12</text>

  <!-- ===== Result row ===== -->
  <rect x="15" y="240" width="535" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="263" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">答案 = 3 个车队</text>

  <!-- ===== Fleet summary ===== -->
  <rect x="60" y="290" width="140" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="130" y="312" text-anchor="middle" font-size="11" fill="#446688">车队1: pos 10+8 (t=1)</text>

  <rect x="210" y="290" width="140" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="11" fill="#4a7a3a">车队2: pos 5+3 (t=7)</text>

  <rect x="360" y="290" width="140" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="430" y="312" text-anchor="middle" font-size="11" fill="#d6a040">车队3: pos 0 (t=12)</text>
</svg>
