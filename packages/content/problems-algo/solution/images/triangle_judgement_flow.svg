<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">流程：逐行读取 → CASE 判三个不等式 → 输出 Yes/No</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">单趟扫描 O(n)：每行独立计算，无聚合 / 无连接 / 无排序</text>

  <g font-size="10" fill="#333">
    <!-- Step 1: FROM -->
    <rect x="40" y="64" width="440" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="84" font-size="12" fill="#446688" font-weight="bold">① FROM Triangle</text>
    <text x="200" y="84" font-family="monospace" font-size="10" fill="#555">逐行读取 (x, y, z)</text>
    <text x="54" y="100" font-size="9" fill="#888">每行三条线段长度，主键 (x,y,z) 保证非空；一行一判定，互不依赖</text>

    <path d="M 260 110 L 260 124" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 2: three inequalities -->
    <rect x="40" y="128" width="440" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="148" font-size="12" fill="#d6a040" font-weight="bold">② CASE WHEN 三角形不等式</text>
    <text x="54" y="166" font-family="monospace" font-size="10" fill="#555">x + y &gt; z   AND   x + z &gt; y   AND   y + z &gt; x</text>
    <text x="54" y="182" font-size="9" fill="#888">任意两边之和严格大于第三边；AND 串联，三条全真才为真</text>
    <text x="54" y="198" font-size="9" fill="#b85450">⚠ 用 &gt; 不用 &gt;= ：a+b=c 时三边共线退化，不算三角形</text>
    <text x="54" y="214" font-size="9" fill="#4a7a3a">排序后 a≤b≤c 只需判 a+b&gt;c；SQL 可用 GREATEST 压成 1 式</text>

    <path d="M 260 222 L 260 236" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 3: map to Yes/No -->
    <rect x="40" y="240" width="440" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="260" font-size="12" fill="#b85450" font-weight="bold">③ THEN 'Yes' ELSE 'No' END AS triangle</text>
    <text x="54" y="278" font-size="9" fill="#888">布尔真 → 'Yes'；任一不等式失败 → 'No'</text>
    <text x="290" y="278" font-size="9" fill="#888">MySQL 可写 IF(cond,'Yes','No') 更短</text>

    <path d="M 260 298 L 260 312" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 4: output -->
    <rect x="40" y="316" width="440" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="336" font-size="12" fill="#4a7a3a" font-weight="bold">④ SELECT x, y, z, triangle</text>
    <text x="54" y="354" font-size="9" fill="#888">输出原三列 + 派生标签列；结果顺序不限</text>

    <!-- complexity -->
    <rect x="40" y="374" width="440" height="36" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
    <text x="260" y="392" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">时间 O(n)  ·  空间 O(1) 辅助（输出 O(n)）</text>
    <text x="260" y="406" text-anchor="middle" font-size="10" fill="#888">SQL「投影 + 条件派生列」最简形态</text>
  </g>
</svg>
