<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">核心思路：三表问题 = 找 RED 的 sales_id + SalesPerson 做差集</text>

  <!-- Step 1 label -->
  <rect x="20" y="40" width="240" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="54" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">步骤① 找向 RED 销售过的 sales_id 集合</text>

  <!-- Company table -->
  <text x="80" y="80" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">Company</text>
  <rect x="30" y="86" width="100" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50" y="98" font-size="8.5" fill="#333">com_id</text>
  <text x="95" y="98" font-size="8.5" fill="#333">name</text>
  <line x1="70" y1="86" x2="70" y2="104" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="30" y="104" width="100" height="15" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="50" y="116" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <text x="95" y="116" font-size="9" fill="#b85450" font-weight="bold">RED</text>
  <line x1="70" y1="104" x2="70" y2="119" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="30" y="119" width="100" height="14" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="130" font-size="8.5" fill="#999">2</text>
  <text x="95" y="130" font-size="8.5" fill="#999">ORANGE</text>
  <line x1="70" y1="119" x2="70" y2="133" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="30" y="133" width="100" height="14" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="144" font-size="8.5" fill="#999">3</text>
  <text x="95" y="144" font-size="8.5" fill="#999">YELLOW</text>
  <line x1="70" y1="133" x2="70" y2="147" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="30" y="147" width="100" height="14" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="158" font-size="8.5" fill="#999">4</text>
  <text x="95" y="158" font-size="8.5" fill="#999">GREEN</text>
  <line x1="70" y1="147" x2="70" y2="161" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- arrow Company -> Orders (filter name='RED') -->
  <path d="M135 126 L185 126" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="160" y="121" text-anchor="middle" font-size="8" fill="#b85450">com_id=1</text>

  <!-- Orders table -->
  <text x="265" y="80" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">Orders</text>
  <rect x="185" y="86" width="160" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="205" y="98" font-size="8.5" fill="#333">order_id</text>
  <text x="260" y="98" font-size="8.5" fill="#333">com_id</text>
  <text x="320" y="98" font-size="8.5" fill="#333">sales_id</text>
  <line x1="230" y1="86" x2="230" y2="104" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="290" y1="86" x2="290" y2="104" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="185" y="104" width="160" height="14" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="205" y="115" font-size="8.5" fill="#999">1</text>
  <text x="260" y="115" font-size="8.5" fill="#999">3</text>
  <text x="320" y="115" font-size="8.5" fill="#999">4</text>
  <line x1="230" y1="104" x2="230" y2="118" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="290" y1="104" x2="290" y2="118" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="185" y="118" width="160" height="14" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="205" y="129" font-size="8.5" fill="#999">2</text>
  <text x="260" y="129" font-size="8.5" fill="#999">4</text>
  <text x="320" y="129" font-size="8.5" fill="#999">5</text>
  <line x1="230" y1="118" x2="230" y2="132" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="290" y1="118" x2="290" y2="132" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="185" y="132" width="160" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="205" y="143" font-size="8.5" fill="#b85450" font-weight="bold">3</text>
  <text x="260" y="143" font-size="8.5" fill="#b85450" font-weight="bold">1</text>
  <text x="320" y="143" font-size="8.5" fill="#b85450" font-weight="bold">1</text>
  <line x1="230" y1="132" x2="230" y2="146" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="290" y1="132" x2="290" y2="146" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="185" y="146" width="160" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="205" y="157" font-size="8.5" fill="#b85450" font-weight="bold">4</text>
  <text x="260" y="157" font-size="8.5" fill="#b85450" font-weight="bold">1</text>
  <text x="320" y="157" font-size="8.5" fill="#b85450" font-weight="bold">4</text>
  <line x1="230" y1="146" x2="230" y2="160" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="290" y1="146" x2="290" y2="160" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- arrow Orders -> sales_ids set -->
  <path d="M350 139 L400 139" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="375" y="134" text-anchor="middle" font-size="8" fill="#b85450">sales_id</text>

  <!-- RED sales_ids box -->
  <rect x="400" y="118" width="100" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="450" y="134" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">向 RED 销售</text>
  <text x="450" y="150" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">{1, 4}</text>

  <!-- arrow step1 -> step2 -->
  <path d="M450 165 L450 188 L120 188 L120 214" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)" stroke-dasharray="4,3"/>

  <!-- Step 2 label -->
  <rect x="20" y="194" width="220" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="208" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">步骤② SalesPerson − {1, 4} = 答案</text>

  <!-- SalesPerson table -->
  <text x="100" y="228" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">SalesPerson</text>
  <rect x="40" y="234" width="120" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="246" font-size="8.5" fill="#333">sales_id</text>
  <text x="115" y="246" font-size="8.5" fill="#333">name</text>
  <line x1="85" y1="234" x2="85" y2="252" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="40" y="252" width="120" height="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="60" y="263" font-size="9" fill="#b85450">1</text>
  <text x="115" y="263" font-size="9" fill="#b85450">John ✗</text>
  <line x1="85" y1="252" x2="85" y2="267" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="40" y="267" width="120" height="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="278" font-size="9" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="115" y="278" font-size="9" fill="#4a7a3a" font-weight="bold">Amy ✓</text>
  <line x1="85" y1="267" x2="85" y2="282" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="40" y="282" width="120" height="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="293" font-size="9" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="115" y="293" font-size="9" fill="#4a7a3a" font-weight="bold">Mark ✓</text>
  <line x1="85" y1="282" x2="85" y2="297" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="40" y="297" width="120" height="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="60" y="308" font-size="9" fill="#b85450">4</text>
  <text x="115" y="308" font-size="9" fill="#b85450">Pam ✗</text>
  <line x1="85" y1="297" x2="85" y2="312" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="40" y="312" width="120" height="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="323" font-size="9" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="115" y="323" font-size="9" fill="#4a7a3a" font-weight="bold">Alex ✓</text>
  <line x1="85" y1="312" x2="85" y2="327" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- arrow SalesPerson -> result -->
  <path d="M165 289 L220 289" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="192" y="284" text-anchor="middle" font-size="8" fill="#4a7a3a">NOT IN</text>

  <!-- result box -->
  <rect x="220" y="258" width="170" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="305" y="278" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">从未向 RED 销售</text>
  <text x="305" y="298" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Amy, Mark, Alex</text>
  <text x="305" y="314" text-anchor="middle" font-size="8.5" fill="#555">SalesPerson − {1, 4}</text>

  <!-- bottom note -->
  <rect x="20" y="348" width="540" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="368" font-size="10" fill="#333" font-weight="bold">关键观察：三表 = 两步</text>
  <text x="40" y="384" font-size="9.5" fill="#555">① Company ⋈ Orders 用 name='RED' 过滤 → 得到向 RED 销售过的 sales_id 集合</text>
  <text x="40" y="398" font-size="9.5" fill="#555">② SalesPerson 与该集合做反连接（NOT IN / LEFT JOIN+IS NULL / NOT EXISTS）→ 得答案</text>
  <text x="40" y="414" font-size="9.5" fill="#b85450" font-weight="bold">本质是 183 反连接母题的三表推广：先多表 JOIN 归约成单列集合，再做差</text>
</svg>
