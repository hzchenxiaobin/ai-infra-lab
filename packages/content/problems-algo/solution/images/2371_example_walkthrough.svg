<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：grid = [[3,1],[2,5]]，按值升序逐格填值并维护行/列最大值</text>
  <text x="310" y="42" text-anchor="middle" font-size="11" fill="#888">橙底红字＝本步新填　绿底黑字＝已落定　灰底＝待填　处理顺序：1 → 2 → 3 → 5</text>

  <!-- ===== Four grid blocks =====
       block centers: 90, 230, 370, 510 ; grid 2x2 of 32x32 cells ; top y=92 -->

  <!-- arrows between blocks (at grid mid y=124) -->
  <g filter="url(#rough2)">
    <path d="M 124 124 L 154 124" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
    <path d="M 264 124 L 294 124" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
    <path d="M 404 124 L 434 124" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)"/>
  </g>

  <!-- ===== Block 1 : step1, process (0,1)=1 ===== -->
  <g filter="url(#rough2)">
    <text x="90" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">step 1</text>
    <text x="90" y="82" text-anchor="middle" font-size="10" fill="#666">处理 (0,1)=1</text>
    <!-- (0,0) empty -->
    <rect x="58" y="92" width="32" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="74" y="113" text-anchor="middle" font-size="12" fill="#ccc">_</text>
    <!-- (0,1) new -->
    <rect x="90" y="92" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3"/>
    <text x="106" y="113" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
    <!-- (1,0) empty -->
    <rect x="58" y="124" width="32" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="74" y="145" text-anchor="middle" font-size="12" fill="#ccc">_</text>
    <!-- (1,1) empty -->
    <rect x="90" y="124" width="32" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="106" y="145" text-anchor="middle" font-size="12" fill="#ccc">_</text>
    <!-- below -->
    <text x="90" y="174" text-anchor="middle" font-size="10" fill="#888">max(rM[0],cM[1])</text>
    <text x="90" y="188" text-anchor="middle" font-size="10" fill="#666">= max(0,0) = 0</text>
    <text x="90" y="208" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">→ ans = 1</text>
    <text x="90" y="226" text-anchor="middle" font-size="10" fill="#555">rowMax=[1,0]</text>
    <text x="90" y="240" text-anchor="middle" font-size="10" fill="#555">colMax=[0,1]</text>
  </g>

  <!-- ===== Block 2 : step2, process (1,0)=2 ===== -->
  <g filter="url(#rough2)">
    <text x="230" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">step 2</text>
    <text x="230" y="82" text-anchor="middle" font-size="10" fill="#666">处理 (1,0)=2</text>
    <!-- (0,0) empty -->
    <rect x="198" y="92" width="32" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="214" y="113" text-anchor="middle" font-size="12" fill="#ccc">_</text>
    <!-- (0,1) old green -->
    <rect x="230" y="92" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <text x="246" y="113" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
    <!-- (1,0) new -->
    <rect x="198" y="124" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3"/>
    <text x="214" y="145" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
    <!-- (1,1) empty -->
    <rect x="230" y="124" width="32" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="246" y="145" text-anchor="middle" font-size="12" fill="#ccc">_</text>
    <text x="230" y="174" text-anchor="middle" font-size="10" fill="#888">max(rM[1],cM[0])</text>
    <text x="230" y="188" text-anchor="middle" font-size="10" fill="#666">= max(0,0) = 0</text>
    <text x="230" y="208" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">→ ans = 1</text>
    <text x="230" y="226" text-anchor="middle" font-size="10" fill="#555">rowMax=[1,1]</text>
    <text x="230" y="240" text-anchor="middle" font-size="10" fill="#555">colMax=[1,1]</text>
  </g>

  <!-- ===== Block 3 : step3, process (0,0)=3 ===== -->
  <g filter="url(#rough2)">
    <text x="370" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">step 3</text>
    <text x="370" y="82" text-anchor="middle" font-size="10" fill="#666">处理 (0,0)=3</text>
    <!-- (0,0) new -->
    <rect x="338" y="92" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="3"/>
    <text x="354" y="113" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">2</text>
    <!-- (0,1) old green -->
    <rect x="370" y="92" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <text x="386" y="113" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
    <!-- (1,0) old green -->
    <rect x="338" y="124" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <text x="354" y="145" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
    <!-- (1,1) empty -->
    <rect x="370" y="124" width="32" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="386" y="145" text-anchor="middle" font-size="12" fill="#ccc">_</text>
    <text x="370" y="174" text-anchor="middle" font-size="10" fill="#888">max(rM[0],cM[0])</text>
    <text x="370" y="188" text-anchor="middle" font-size="10" fill="#666">= max(1,1) = 1</text>
    <text x="370" y="208" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">→ ans = 2</text>
    <text x="370" y="226" text-anchor="middle" font-size="10" fill="#555">rowMax=[2,1]</text>
    <text x="370" y="240" text-anchor="middle" font-size="10" fill="#555">colMax=[2,1]</text>
  </g>

  <!-- ===== Block 4 : step4, process (1,1)=5 ===== -->
  <g filter="url(#rough2)">
    <text x="510" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">step 4</text>
    <text x="510" y="82" text-anchor="middle" font-size="10" fill="#666">处理 (1,1)=5</text>
    <!-- (0,0) old green -->
    <rect x="478" y="92" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <text x="494" y="113" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
    <!-- (0,1) old green -->
    <rect x="510" y="92" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <text x="526" y="113" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
    <!-- (1,0) old green -->
    <rect x="478" y="124" width="32" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <text x="494" y="145" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
    <!-- (1,1) new -->
    <rect x="510" y="124" width="32" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3"/>
    <text x="526" y="145" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2</text>
    <text x="510" y="174" text-anchor="middle" font-size="10" fill="#888">max(rM[1],cM[1])</text>
    <text x="510" y="188" text-anchor="middle" font-size="10" fill="#666">= max(1,1) = 1</text>
    <text x="510" y="208" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">→ ans = 2</text>
    <text x="510" y="226" text-anchor="middle" font-size="10" fill="#555">rowMax=[2,2]</text>
    <text x="510" y="240" text-anchor="middle" font-size="10" fill="#555">colMax=[2,2]</text>
  </g>

  <!-- ===== Bottom summary ===== -->
  <rect x="40" y="266" width="540" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="310" y="290" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">结果 ans = [[2,1],[1,2]]，最大值 = 2</text>
  <text x="310" y="310" text-anchor="middle" font-size="11" fill="#444">校验相对顺序：行0：3&gt;1⇒2&gt;1 ✓　行1：2&lt;5⇒1&lt;2 ✓　列0：3&gt;2⇒2&gt;1 ✓　列1：1&lt;5⇒1&lt;2 ✓</text>
  <text x="310" y="330" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">最优性：偏序最长链长 L = 2（如 (0,1)→(0,0)），最大值不可能 &lt; 2，恰达下界</text>
  <text x="310" y="350" text-anchor="middle" font-size="10" fill="#888">每格 ans = 1 + 前驱最大值 ＝ 以它结尾的最长链长，排序贪心天然最优</text>
</svg>
