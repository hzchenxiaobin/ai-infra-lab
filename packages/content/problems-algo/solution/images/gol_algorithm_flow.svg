<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="480" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：遍历 → 用 &amp;1 数邻居 → 置 bit1 → 全体右移</text>

  <!-- Start -->
  <rect x="250" y="40" width="100" height="28" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="59" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">开始</text>

  <!-- Diamond1: 还有未处理 cell? center (300,118) -->
  <polygon points="300,84 420,118 300,152 180,118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="115" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold">还有未处理 cell?</text>
  <text x="300" y="130" text-anchor="middle" font-size="9" fill="#888">(i,j) 未遍历完</text>

  <!-- count neighbors box -->
  <rect x="170" y="170" width="260" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="192" text-anchor="middle" font-size="11" fill="#2a4a66">用 <tspan font-family="monospace">board[r][c]&amp;1</tspan> 数 (i,j) 的 8 邻居 live 数</text>

  <!-- Diamond2: 存活条件? center (300,266) -->
  <polygon points="300,228 445,266 300,304 155,266" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="262" text-anchor="middle" font-size="10.5" fill="#7a5a20" font-weight="bold">live==3 || (原活 &amp;&amp; live==2)?</text>
  <text x="300" y="277" text-anchor="middle" font-size="9" fill="#888">下一代是否存活</text>

  <!-- Yes box (right): board[i][j] |= 2 -->
  <rect x="465" y="248" width="120" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="525" y="270" text-anchor="middle" font-size="11" fill="#3a5a2a" font-family="monospace">board[i][j]|=2</text>

  <!-- No box (left): 跳过 -->
  <rect x="35" y="248" width="115" height="36" rx="6" fill="#f0f0f0" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="92" y="270" text-anchor="middle" font-size="11" fill="#666">跳过（bit1 已为 0）</text>

  <!-- 下一个 cell box -->
  <rect x="250" y="330" width="100" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="349" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold">下一个 cell</text>

  <!-- 返回 box (Diamond1 No) -->
  <rect x="455" y="100" width="125" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="517" y="122" text-anchor="middle" font-size="11" fill="#2a4a66" font-family="monospace">board[r][c] &gt;&gt;= 1</text>
  <!-- 结束 -->
  <rect x="475" y="150" width="88" height="26" rx="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="519" y="167" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">结束</text>

  <!-- arrows -->
  <!-- Start -> Diamond1 -->
  <line x1="300" y1="68" x2="300" y2="82" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- Diamond1 -> count (Yes, down) -->
  <line x1="300" y1="152" x2="300" y2="168" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="308" y="163" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <!-- Diamond1 -> 返回 (No, right) -->
  <line x1="420" y1="118" x2="453" y2="118" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="428" y="110" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <!-- 返回 -> 结束 -->
  <line x1="517" y1="136" x2="518" y2="148" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- count -> Diamond2 -->
  <line x1="300" y1="206" x2="300" y2="226" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond2 -> Yes box (right) -->
  <line x1="445" y1="266" x2="463" y2="266" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="448" y="258" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <!-- Diamond2 -> No box (left) -->
  <line x1="155" y1="266" x2="152" y2="266" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="258" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- Yes box -> 下一个 cell (down then left) -->
  <path d="M 525 284 L 525 345 L 352 345" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- No box -> 下一个 cell (down then right) -->
  <path d="M 92 284 L 92 345 L 248 345" fill="none" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop back: 下一个 cell -> far left -> up -> Diamond1 left -->
  <path d="M 250 345 L 18 345 L 18 118 L 178 118" fill="none" stroke="#666" stroke-width="1.6" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="28" y="232" font-size="10" fill="#888" font-weight="bold" transform="rotate(-90 28 232)">继续遍历</text>

  <!-- note -->
  <rect x="120" y="430" width="360" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="300" y="446" text-anchor="middle" font-size="10.5" fill="#555">存活条件 = (死 &amp; live==3) 繁殖　或　(活 &amp; live∈{2,3}) 维持</text>
  <text x="300" y="459" text-anchor="middle" font-size="10" fill="#888">两个分支都不破坏 bit0，故循环中始终能读到原状态</text>
</svg>
