<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：遍历统计频次 → 逐值判奇偶</text>

  <!-- ===== Step 1: Initialize frequency table ===== -->
  <rect x="150" y="40" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="61" text-anchor="middle" font-size="11.5" fill="#333">① 初始化频次表 freq（数组 / 哈希表）</text>

  <path d="M 260 76 L 260 92" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: Iterate nums, count frequency ===== -->
  <polygon points="260,94 380,132 260,170 140,132" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="128" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">② 遍历 nums</text>
  <text x="260" y="144" text-anchor="middle" font-size="10.5" fill="#555">还有未处理元素?</text>

  <!-- No branch: go down to step 3 -->
  <path d="M 260 170 L 260 188" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="182" font-size="10" fill="#888">否</text>

  <!-- Yes branch right: increment freq -->
  <path d="M 380 132 L 430 132" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="406" y="126" text-anchor="middle" font-size="10" fill="#888">是</text>
  <rect x="430" y="116" width="84" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="472" y="138" text-anchor="middle" font-size="10.5" fill="#333">freq[v] += 1</text>

  <!-- loop back from freq++ to step 2 -->
  <path d="M 472 116 L 472 100 L 260 100 L 260 94" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="366" y="96" text-anchor="middle" font-size="9.5" fill="#888">下一元素</text>

  <!-- ===== Step 3: Iterate each value's frequency ===== -->
  <polygon points="260,190 380,228 260,266 140,228" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="224" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">③ 遍历每个频次</text>
  <text x="260" y="240" text-anchor="middle" font-size="10.5" fill="#555">还有未检查的值?</text>

  <!-- No branch: return true -->
  <path d="M 380 228 L 430 228" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="406" y="222" text-anchor="middle" font-size="10" fill="#4a7a3a">否</text>
  <rect x="430" y="212" width="84" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="472" y="234" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">return true</text>

  <!-- Yes branch down -->
  <path d="M 260 266 L 260 284" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="276" y="278" font-size="10" fill="#888">是</text>

  <!-- ===== Step 4: Check even ===== -->
  <polygon points="260,286 380,320 260,354 140,320" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="316" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">④ freq[v] % 2 == 0 ?</text>
  <text x="260" y="332" text-anchor="middle" font-size="10" fill="#555">频次为偶?</text>

  <!-- No: return false -->
  <path d="M 140 320 L 70 320" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="105" y="314" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <rect x="10" y="304" width="62" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="41" y="320" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">return</text>
  <text x="41" y="332" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">false</text>

  <!-- Yes: continue to next value, loop back to step 3 -->
  <path d="M 380 320 L 410 320 L 410 228 L 380 228" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="420" y="276" font-size="9.5" fill="#888">下一值</text>

  <!-- ===== Bottom note ===== -->
  <rect x="40" y="352" width="440" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="260" y="367" text-anchor="middle" font-size="10" fill="#555">遇到首个奇频次即可提前 return false → 无需统计完所有值</text>
</svg>
