<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：正数嵌套链只看最长 · 分隔符统一奇偶中心</text>

  <!-- 左上：嵌套回文链 -->
  <g filter="url(#rough2)">
    <rect x="20" y="38" width="260" height="172" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="145" y="58" text-anchor="middle" font-size="11.5" fill="#33506b" font-weight="bold">① 正数 ⇒ 每个中心只看最长</text>

    <rect x="50" y="66" width="40" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
    <text x="70" y="86" text-anchor="middle" font-size="13" fill="#333">7</text>
    <rect x="90" y="66" width="40" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
    <text x="110" y="86" text-anchor="middle" font-size="13" fill="#333">1</text>
    <rect x="130" y="66" width="40" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <text x="150" y="86" text-anchor="middle" font-size="13" fill="#8a3030" font-weight="bold">2</text>
    <rect x="170" y="66" width="40" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
    <text x="190" y="86" text-anchor="middle" font-size="13" fill="#333">1</text>
    <rect x="210" y="66" width="40" height="30" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.4"/>
    <text x="230" y="86" text-anchor="middle" font-size="13" fill="#333">7</text>

    <text x="150" y="111" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold">r=2 → 和 18 ✓</text>
    <path d="M 50 116 L 250 116 M 50 112 L 50 120 M 250 112 L 250 120" stroke="#4a7a3a" stroke-width="2" fill="none"/>

    <text x="150" y="129" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold">r=1 → 和 4</text>
    <path d="M 90 134 L 210 134 M 90 130 L 90 138 M 210 130 L 210 138" stroke="#446688" stroke-width="1.8" fill="none"/>

    <text x="150" y="147" text-anchor="middle" font-size="10" fill="#777" font-weight="bold">r=0 → 和 2</text>
    <path d="M 130 152 L 170 152 M 130 148 L 130 156 M 170 148 L 170 156" stroke="#999" stroke-width="1.6" fill="none"/>

    <text x="145" y="174" text-anchor="middle" font-size="10" fill="#33506b">以 2 为中心层层嵌套，和 2 → 4 → 18</text>
    <text x="145" y="190" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold">合法半径是前缀 {0,…,R}，全正 ⇒ 只留 R</text>
  </g>

  <!-- 右上：分隔符技巧 -->
  <g filter="url(#rough2)">
    <rect x="300" y="38" width="240" height="172" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="420" y="58" text-anchor="middle" font-size="11.5" fill="#8a6d1a" font-weight="bold">② 分隔符统一奇偶中心</text>

    <text x="316" y="70" font-size="10" fill="#8a6d1a">nums</text>
    <rect x="350" y="54" width="30" height="22" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="365" y="69" text-anchor="middle" font-size="11" fill="#333">7</text>
    <rect x="382" y="54" width="30" height="22" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="397" y="69" text-anchor="middle" font-size="11" fill="#333">1</text>
    <rect x="414" y="54" width="30" height="22" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="429" y="69" text-anchor="middle" font-size="11" fill="#333">2</text>
    <rect x="446" y="54" width="30" height="22" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="461" y="69" text-anchor="middle" font-size="11" fill="#333">1</text>
    <rect x="478" y="54" width="30" height="22" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.2"/>
    <text x="493" y="69" text-anchor="middle" font-size="11" fill="#333">7</text>

    <path d="M 425 80 L 425 90" stroke="#8a6d1a" stroke-width="1.6" fill="none" marker-end="url(#arrB)"/>

    <text x="314" y="109" font-size="10" fill="#8a6d1a">t</text>
    <rect x="318" y="94" width="17" height="22" rx="3" fill="#f7e6bb" stroke="#d6a040" stroke-width="1.2"/>
    <text x="326.5" y="109" text-anchor="middle" font-size="9.5" fill="#8a6d1a">S</text>
    <rect x="336" y="94" width="17" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="344.5" y="109" text-anchor="middle" font-size="9.5" fill="#33506b">7</text>
    <rect x="354" y="94" width="17" height="22" rx="3" fill="#f7e6bb" stroke="#d6a040" stroke-width="1.2"/>
    <text x="362.5" y="109" text-anchor="middle" font-size="9.5" fill="#8a6d1a">S</text>
    <rect x="372" y="94" width="17" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="380.5" y="109" text-anchor="middle" font-size="9.5" fill="#33506b">1</text>
    <rect x="390" y="94" width="17" height="22" rx="3" fill="#f7e6bb" stroke="#4a7a3a" stroke-width="2"/>
    <text x="398.5" y="109" text-anchor="middle" font-size="9.5" fill="#8a6d1a">S</text>
    <rect x="408" y="94" width="17" height="22" rx="3" fill="#e8f0fe" stroke="#b85450" stroke-width="2"/>
    <text x="416.5" y="109" text-anchor="middle" font-size="9.5" fill="#8a3030" font-weight="bold">2</text>
    <rect x="426" y="94" width="17" height="22" rx="3" fill="#f7e6bb" stroke="#d6a040" stroke-width="1.2"/>
    <text x="434.5" y="109" text-anchor="middle" font-size="9.5" fill="#8a6d1a">S</text>
    <rect x="444" y="94" width="17" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="452.5" y="109" text-anchor="middle" font-size="9.5" fill="#33506b">1</text>
    <rect x="462" y="94" width="17" height="22" rx="3" fill="#f7e6bb" stroke="#d6a040" stroke-width="1.2"/>
    <text x="470.5" y="109" text-anchor="middle" font-size="9.5" fill="#8a6d1a">S</text>
    <rect x="480" y="94" width="17" height="22" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2"/>
    <text x="488.5" y="109" text-anchor="middle" font-size="9.5" fill="#33506b">7</text>
    <rect x="498" y="94" width="17" height="22" rx="3" fill="#f7e6bb" stroke="#d6a040" stroke-width="1.2"/>
    <text x="506.5" y="109" text-anchor="middle" font-size="9.5" fill="#8a6d1a">S</text>

    <path d="M 399 120 L 373 134" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)"/>
    <text x="352" y="148" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold">偶 = 缝隙中心</text>
    <path d="M 416 120 L 448 134" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)"/>
    <text x="472" y="148" text-anchor="middle" font-size="10" fill="#8a3030" font-weight="bold">奇 = 元素中心</text>

    <text x="420" y="168" text-anchor="middle" font-size="9.5" fill="#8a6d1a">SEP = −1 ∉ 值域 [1,10⁹]，S 互相等</text>
    <text x="420" y="186" text-anchor="middle" font-size="9.5" fill="#8a6d1a" font-weight="bold">两类中心一趟 Manacher 全包</text>
  </g>

  <!-- 底部：半径映射 + 前缀和 -->
  <g filter="url(#rough2)">
    <rect x="20" y="220" width="520" height="190" rx="10" fill="#ffffff" stroke="#999" stroke-width="1.5"/>
    <text x="280" y="240" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">③ 极大回文的边界必落在 SEP ⇒ 半径干净映射 + 前缀和 O(1) 求和</text>

    <rect x="36" y="252" width="242" height="92" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="157" y="272" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">奇中心 i = 2k+1（元素）</text>
    <text x="157" y="290" text-anchor="middle" font-size="10" fill="#33506b">p[i] 恒为奇数，半径 R = (p−1)/2</text>
    <text x="157" y="308" text-anchor="middle" font-size="10" fill="#33506b">子数组 nums[k−R .. k+R]</text>
    <text x="157" y="326" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold">和 = pre[k+R+1] − pre[k−R]</text>

    <rect x="282" y="252" width="242" height="92" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="403" y="272" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold">偶中心 i = 2j（缝隙）</text>
    <text x="403" y="290" text-anchor="middle" font-size="10" fill="#2f5d24">p[i] 恒为偶数，对数 q = p/2</text>
    <text x="403" y="308" text-anchor="middle" font-size="10" fill="#2f5d24">子数组 nums[j−q .. j+q−1]，q=0 跳过</text>
    <text x="403" y="326" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold">和 = pre[j+q] − pre[j−q]</text>

    <rect x="36" y="354" width="488" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="280" y="372" text-anchor="middle" font-size="9.5" fill="#8a3030">⚠️ 若极大回文的边界是元素，它紧外侧的两格都是 SEP、必相等 ⇒ 还能再扩一步——矛盾！</text>
    <text x="280" y="390" text-anchor="middle" font-size="9.5" fill="#8a3030">故奇中心 p 恒奇、偶中心 p 恒偶，映射公式永不遇到奇偶错位</text>
  </g>
</svg>
