<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：贪心逐位填结果 + BIT 维护代价</text>

  <!-- Init -->
  <rect x="150" y="46" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">初始化</text>
  <text x="280" y="80" text-anchor="middle" font-size="11" fill="#555">BIT 全置 1；pos[d] 记录数字 d 的所有原下标</text>

  <path d="M 280 86 L 280 104" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Outer loop -->
  <rect x="120" y="106" width="320" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="128" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">for i = 0 … n−1 （目标位 i）</text>

  <path d="M 280 140 L 280 158" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Inner loop -->
  <rect x="120" y="160" width="320" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="182" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">for d = 0 … 9 （从小到大试数字）</text>

  <path d="M 280 194 L 280 212" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Get candidate j -->
  <rect x="150" y="214" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="236" text-anchor="middle" font-size="11" fill="#333">j = pos[d] 最左未用位置（若空则跳过此 d）</text>

  <path d="M 280 248 L 280 266" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Cost query -->
  <rect x="150" y="268" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="290" text-anchor="middle" font-size="11" fill="#333">cost = BIT.query(j)   // O(log n)</text>

  <path d="M 280 302 L 280 320" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="280,322 400,362 280,402 160,362" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="12" fill="#333">cost ≤ k ?</text>
  <text x="280" y="376" text-anchor="middle" font-size="10" fill="#888">预算够不够</text>

  <!-- No → next d -->
  <path d="M 400 362 L 470 362 L 470 182 L 440 182" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="412" y="354" font-size="10" fill="#b85450">否</text>
  <text x="478" y="272" font-size="10" fill="#888">试下一个 d</text>

  <!-- Yes → pick -->
  <path d="M 160 362 L 90 362 L 90 428" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="354" font-size="10" fill="#82b366">是</text>
  <rect x="20" y="428" width="280" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="160" y="445" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans += d; k −= cost; BIT.add(j+1, −1); break</text>

  <!-- return -->
  <text x="280" y="455" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">填满 n 位后返回 ans</text>
</svg>
