<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="720" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">核心概念：两个独立谓词用 AND 连接，行需同时满足才入选</text>
  <path d="M 140 36 Q 360 44 580 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== Products table (left) ===== -->
  <text x="40" y="68" font-size="12" fill="#888" font-weight="bold">Products 表（5 行）</text>

  <!-- header -->
  <g filter="url(#rough2)">
    <rect x="40" y="76" width="240" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
  </g>
  <text x="80" y="93" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">product_id</text>
  <text x="160" y="93" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">low_fats</text>
  <text x="240" y="93" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">recyclable</text>

  <!-- row 0: Y N -> fail -->
  <g filter="url(#rough2)"><rect x="40" y="102" width="240" height="24" fill="#fff" stroke="#bbb" stroke-width="1" rx="3"/></g>
  <text x="80" y="118" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="160" y="118" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Y</text>
  <text x="240" y="118" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">N</text>

  <!-- row 1: Y Y -> pass -->
  <g filter="url(#rough2)"><rect x="40" y="126" width="240" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/></g>
  <text x="80" y="142" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="160" y="142" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Y</text>
  <text x="240" y="142" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Y</text>

  <!-- row 2: N Y -> fail -->
  <g filter="url(#rough2)"><rect x="40" y="150" width="240" height="24" fill="#fff" stroke="#bbb" stroke-width="1" rx="3"/></g>
  <text x="80" y="166" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="160" y="166" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">N</text>
  <text x="240" y="166" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Y</text>

  <!-- row 3: Y Y -> pass -->
  <g filter="url(#rough2)"><rect x="40" y="174" width="240" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/></g>
  <text x="80" y="190" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="160" y="190" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Y</text>
  <text x="240" y="190" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Y</text>

  <!-- row 4: N N -> fail -->
  <g filter="url(#rough2)"><rect x="40" y="198" width="240" height="24" fill="#fff" stroke="#bbb" stroke-width="1" rx="3"/></g>
  <text x="80" y="214" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="160" y="214" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">N</text>
  <text x="240" y="214" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">N</text>

  <!-- column highlight bands -->
  <g filter="url(#rough2)">
    <rect x="130" y="76" width="60" height="146" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" rx="3"/>
    <rect x="210" y="76" width="60" height="146" fill="none" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4 3" rx="3"/>
  </g>
  <text x="160" y="240" text-anchor="middle" font-size="9" fill="#b85450">谓词①</text>
  <text x="240" y="240" text-anchor="middle" font-size="9" fill="#d6a040">谓词②</text>

  <!-- ===== AND gate (middle) ===== -->
  <g filter="url(#rough2)">
    <rect x="320" y="120" width="150" height="80" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="395" y="142" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">WHERE 子句</text>
  <text x="395" y="162" text-anchor="middle" font-size="11" fill="#333">low_fats = 'Y'</text>
  <text x="395" y="178" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">AND</text>
  <text x="395" y="194" text-anchor="middle" font-size="11" fill="#333">recyclable = 'Y'</text>

  <!-- arrow from table to AND -->
  <path d="M 282 149 L 318 149" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="142" text-anchor="middle" font-size="9" fill="#888">逐行</text>

  <!-- arrow from AND to result -->
  <path d="M 472 160 L 510 160" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>

  <!-- ===== Result (right) ===== -->
  <text x="540" y="132" font-size="12" fill="#888" font-weight="bold">结果</text>
  <g filter="url(#rough2)">
    <rect x="540" y="138" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
  </g>
  <text x="600" y="155" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">product_id</text>

  <g filter="url(#rough2)"><rect x="540" y="162" width="120" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/></g>
  <text x="600" y="178" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>

  <g filter="url(#rough2)"><rect x="540" y="186" width="120" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3"/></g>
  <text x="600" y="202" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>

  <!-- ===== Bottom: AND truth-table insight ===== -->
  <text x="40" y="270" font-size="11" fill="#888">AND 的语义：两谓词皆真才放行（缺一即弃）</text>

  <g filter="url(#rough2)"><rect x="40" y="284" width="640" height="70" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>

  <!-- truth table style -->
  <text x="70" y="308" font-size="11" fill="#446688" font-weight="bold">low_fats='Y'</text>
  <text x="220" y="308" font-size="11" fill="#d6a040" font-weight="bold">recyclable='Y'</text>
  <text x="380" y="308" font-size="11" fill="#b85450" font-weight="bold">AND 结果</text>
  <text x="540" y="308" font-size="11" fill="#333" font-weight="bold">对应行</text>

  <text x="70" y="330" font-size="11" fill="#4a7a3a">✓ Y</text>
  <text x="220" y="330" font-size="11" fill="#b85450">✗ N</text>
  <text x="380" y="330" font-size="11" fill="#b85450">✗ 弃</text>
  <text x="540" y="330" font-size="11" fill="#888">product 0</text>

  <text x="70" y="346" font-size="11" fill="#4a7a3a">✓ Y</text>
  <text x="220" y="346" font-size="11" fill="#4a7a3a">✓ Y</text>
  <text x="380" y="346" font-size="11" fill="#4a7a3a">✓ 留</text>
  <text x="540" y="346" font-size="11" fill="#4a7a3a" font-weight="bold">product 1, 3</text>

  <g filter="url(#rough2)"><rect x="40" y="372" width="640" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="60" y="392" font-size="11" fill="#d6a040" font-weight="bold">⭐ 关键点：</text>
  <text x="60" y="408" font-size="11" fill="#333">两个谓词互相独立——可任意交换顺序，结果不变；优化器可按选择性自由重排以先淘汰更多行。</text>
</svg>
