<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：seqs 的相邻对定义偏序 → 唯一拓扑序即 org</text>

  <!-- ===== Left: seqs ===== -->
  <text x="110" y="58" text-anchor="middle" font-size="12" fill="#888">seqs（两行子序列）</text>

  <!-- seq1: [5,2,6,3] -->
  <rect x="30"  y="70" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50"  y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <rect x="74"  y="70" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="94"  y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="118" y="70" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="138" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <rect x="162" y="70" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="182" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <path d="M 70 87 L 74 87" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 114 87 L 118 87" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 158 87 L 162 87" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- seq2: [4,1,5,2] -->
  <rect x="30"  y="120" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50"  y="142" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="74"  y="120" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="94"  y="142" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="118" y="120" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="138" y="142" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <rect x="162" y="120" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="182" y="142" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <path d="M 70 137 L 74 137" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 114 137 L 118 137" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 158 137 L 162 137" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- arrow seqs -> DAG -->
  <path d="M 210 113 L 250 200" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="232" y="150" font-size="10" fill="#888" filter="url(#rough2)">相邻对→边</text>

  <!-- ===== Middle: DAG chain 4->1->5->2->6->3 ===== -->
  <text x="330" y="170" text-anchor="middle" font-size="12" fill="#888">约束图 DAG（链状，无分叉）</text>

  <!-- nodes in a horizontal chain -->
  <circle cx="230" cy="220" r="19" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="225" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>

  <circle cx="290" cy="220" r="19" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="290" y="225" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <circle cx="350" cy="220" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="350" y="225" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>

  <circle cx="410" cy="220" r="19" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="410" y="225" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <circle cx="470" cy="220" r="19" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="470" y="225" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>

  <circle cx="525" cy="220" r="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="525" y="225" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>

  <!-- edges -->
  <path d="M 249 220 L 271 220" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 309 220 L 331 220" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 369 220 L 391 220" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 429 220 L 451 220" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 489 220 L 508 220" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- arrow DAG -> order -->
  <path d="M 330 245 L 330 280" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="338" y="268" font-size="10" fill="#888" filter="url(#rough2)">Kahn 每步队列=1</text>

  <!-- ===== Bottom: unique order ===== -->
  <rect x="160" y="290" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="311" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="204" y="290" width="40" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="224" y="311" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="248" y="290" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="268" y="311" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <rect x="292" y="290" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="312" y="311" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="336" y="290" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="356" y="311" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <rect x="380" y="290" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="400" y="311" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>

  <text x="290" y="288" text-anchor="middle" font-size="0" fill="#555"/>
  <text x="440" y="311" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">= org ✓</text>

  <!-- bottom note -->
  <rect x="40" y="340" width="480" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="11" fill="#444">每步队列恰 1 个节点 ⇒ 拓扑序唯一 ⇒ 重建唯一 = org</text>
</svg>
