<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="470" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：nums=[4,3,2,1,2,3,1]（固定 7 格，染色表段和）</text>

  <!-- ============ Strip 1: i=0,j=6  a=4  b=1  a>b ============ -->
  <text x="100" y="74" text-anchor="end" font-size="12" fill="#333" filter="url(#rough2)">① i=0,j=6</text>
  <!-- cells: 0 blue, 6 red -->
  <rect x="108" y="52" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="130" y="75" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">4</text>
  <rect x="152" y="52" width="44" height="36" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="174" y="75" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <rect x="196" y="52" width="44" height="36" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="218" y="75" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <rect x="240" y="52" width="44" height="36" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="262" y="75" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="284" y="52" width="44" height="36" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="306" y="75" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <rect x="328" y="52" width="44" height="36" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="350" y="75" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <rect x="372" y="52" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="394" y="75" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="130" y="104" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">a=4</text>
  <text x="394" y="104" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">b=1</text>
  <text x="430" y="70" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">a &gt; b：吞较小端 b</text>
  <text x="430" y="88" font-size="11" fill="#333" filter="url(#rough2)">右吞 nums[5]=3 → b=4，ans 0→1</text>

  <!-- ============ Strip 2: i=0,j=5  a=4  b=4  equal ============ -->
  <text x="100" y="150" text-anchor="end" font-size="12" fill="#333" filter="url(#rough2)">② i=0,j=5</text>
  <rect x="108" y="128" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="130" y="151" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">4</text>
  <rect x="152" y="128" width="44" height="36" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="174" y="151" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <rect x="196" y="128" width="44" height="36" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="218" y="151" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <rect x="240" y="128" width="44" height="36" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="262" y="151" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="284" y="128" width="44" height="36" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="306" y="151" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <rect x="328" y="128" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="350" y="151" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <rect x="372" y="128" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="394" y="151" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <text x="130" y="180" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">a=4</text>
  <path d="M330 180 L330 170 L416 170 L416 180" fill="none" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="373" y="192" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">b=4</text>
  <text x="430" y="146" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">a = b：配对收进</text>
  <text x="430" y="164" font-size="11" fill="#333" filter="url(#rough2)">i→1, j→4，ans 不变 = 1</text>

  <!-- ============ Strip 3: i=1,j=4  a=3  b=2  a>b ============ -->
  <text x="100" y="226" text-anchor="end" font-size="12" fill="#333" filter="url(#rough2)">③ i=1,j=4</text>
  <rect x="108" y="204" width="44" height="36" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="130" y="227" text-anchor="middle" font-size="15" fill="#aaa" filter="url(#rough2)">4</text>
  <rect x="152" y="204" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="174" y="227" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <rect x="196" y="204" width="44" height="36" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="218" y="227" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <rect x="240" y="204" width="44" height="36" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="262" y="227" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="284" y="204" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="306" y="227" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <rect x="328" y="204" width="44" height="36" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="350" y="227" text-anchor="middle" font-size="15" fill="#aaa" filter="url(#rough2)">3</text>
  <rect x="372" y="204" width="44" height="36" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="394" y="227" text-anchor="middle" font-size="15" fill="#aaa" filter="url(#rough2)">1</text>
  <text x="174" y="256" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">a=3</text>
  <text x="306" y="256" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">b=2</text>
  <text x="430" y="222" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">a &gt; b：吞较小端 b</text>
  <text x="430" y="240" font-size="11" fill="#333" filter="url(#rough2)">右吞 nums[3]=1 → b=3，ans 1→2</text>

  <!-- ============ Strip 4: i=1,j=3  a=3  b=3  equal ============ -->
  <text x="100" y="302" text-anchor="end" font-size="12" fill="#333" filter="url(#rough2)">④ i=1,j=3</text>
  <rect x="108" y="280" width="44" height="36" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="130" y="303" text-anchor="middle" font-size="15" fill="#aaa" filter="url(#rough2)">4</text>
  <rect x="152" y="280" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="174" y="303" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">3</text>
  <rect x="196" y="280" width="44" height="36" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="218" y="303" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <rect x="240" y="280" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="262" y="303" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">1</text>
  <rect x="284" y="280" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="306" y="303" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">2</text>
  <rect x="328" y="280" width="44" height="36" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="350" y="303" text-anchor="middle" font-size="15" fill="#aaa" filter="url(#rough2)">3</text>
  <rect x="372" y="280" width="44" height="36" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="394" y="303" text-anchor="middle" font-size="15" fill="#aaa" filter="url(#rough2)">1</text>
  <text x="174" y="332" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">a=3</text>
  <path d="M242 332 L242 322 L326 322 L326 332" fill="none" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="284" y="344" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">b=3</text>
  <text x="430" y="298" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">a = b：配对收进</text>
  <text x="430" y="316" font-size="11" fill="#333" filter="url(#rough2)">i→2, j→2，i≥j 停</text>

  <!-- result bar -->
  <rect x="60" y="366" width="500" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="388" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">合并轨迹：[4,3,2,1,2,3,1] → [4,3,2,1,2,4] → [4,3,2,3,4]</text>
  <text x="310" y="406" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">[4,3,2,3,4] 已是回文 ✓，最少操作 ans = 2</text>
</svg>
