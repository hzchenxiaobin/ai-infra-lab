<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    算法流程：标记 → 前缀和 → 差分查询
  </text>

  <!-- Stage 1: input -->
  <rect x="120" y="40" width="280" height="40" rx="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="65" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">输入 words[], queries[]</text>

  <!-- arrow 1 -->
  <path d="M260,82 L260,98" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Stage 2: mark -->
  <rect x="100" y="100" width="320" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="121" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">① 标记 b[i]：words[i] 首、末字符 ∈ 元音 ?</text>
  <text x="260" y="137" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">{ 'a','e','i','o','u' }</text>
  <text x="432" y="126" font-size="12" fill="#888" filter="url(#rough2)">O(n)</text>

  <!-- arrow 2 -->
  <path d="M260,146 L260,162" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Stage 3: prefix sum -->
  <rect x="100" y="164" width="320" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="189" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">② 前缀和 pre[i+1] = pre[i] + b[i]</text>
  <text x="432" y="189" font-size="12" fill="#888" filter="url(#rough2)">O(n)</text>

  <!-- arrow 3 -->
  <path d="M260,206 L260,222" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Stage 4: loop over queries -->
  <rect x="100" y="224" width="320" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="249" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">③ 对每个查询 [l, r]</text>
  <text x="432" y="249" font-size="12" fill="#888" filter="url(#rough2)">q 次</text>

  <!-- arrow 4 -->
  <path d="M260,266 L260,282" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Stage 5: answer -->
  <rect x="100" y="284" width="320" height="40" rx="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="309" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">ans = pre[r+1] − pre[l]   （O(1)/查询）</text>

  <!-- total bracket on right -->
  <path d="M452,100 L452,284" fill="none" stroke="#888" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="468" y="196" text-anchor="middle" font-size="12" fill="#888" transform="rotate(90 468 196)" filter="url(#rough2)">总复杂度 O(n+q)</text>

  <text x="260" y="346" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">
    预处理一次性，查询每条 O(1)
  </text>
</svg>
