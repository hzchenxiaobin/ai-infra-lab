<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：用队列模拟「翻牌位置消费序列」</text>

  <!-- Section 1: Sorted cards -->
  <text x="30" y="56" font-size="11" fill="#888">① 排序后的卡牌（递增）</text>
  <rect x="30" y="64" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="52" y="83" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <rect x="78" y="64" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="100" y="83" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
  <rect x="126" y="64" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="148" y="83" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">5</text>
  <rect x="174" y="64" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="196" y="83" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">7</text>
  <rect x="222" y="64" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="244" y="83" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">11</text>
  <rect x="270" y="64" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="292" y="83" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">13</text>
  <rect x="318" y="64" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="340" y="83" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">17</text>

  <!-- Arrow down -->
  <path d="M 196 96 L 196 118" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Section 2: Queue of indices -->
  <text x="30" y="136" font-size="11" fill="#888">② 索引队列 Q（模拟「取一张、移一张到底部」）</text>
  <rect x="30" y="144" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="50" y="163" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="74" y="144" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="94" y="163" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <rect x="118" y="144" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="138" y="163" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <rect x="162" y="144" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="182" y="163" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3</text>
  <rect x="206" y="144" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="226" y="163" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">4</text>
  <rect x="250" y="144" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="270" y="163" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">5</text>
  <rect x="294" y="144" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="314" y="163" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">6</text>

  <!-- Labels for first two elements -->
  <text x="50" y="188" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">弹出→放卡</text>
  <text x="94" y="188" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">弹出→塞回队尾</text>

  <!-- Curved arrow: index 1 goes to back of queue -->
  <path d="M 94 144 Q 200 108 314 144" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="5 3" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="204" y="110" text-anchor="middle" font-size="9.5" fill="#d6a040">移到底部</text>

  <!-- Arrow down to result -->
  <path d="M 196 198 L 196 220" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Section 3: Result array -->
  <text x="30" y="238" font-size="11" fill="#888">③ 结果数组 ans（卡牌依次放入弹出的位置）</text>
  <rect x="30" y="246" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="52" y="265" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="78" y="246" width="44" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="265" text-anchor="middle" font-size="11" fill="#ccc">?</text>
  <rect x="126" y="246" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="148" y="265" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="174" y="246" width="44" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="196" y="265" text-anchor="middle" font-size="11" fill="#ccc">?</text>
  <rect x="222" y="246" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="244" y="265" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">5</text>
  <rect x="270" y="246" width="44" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="292" y="265" text-anchor="middle" font-size="11" fill="#ccc">?</text>
  <rect x="318" y="246" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="340" y="265" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">7</text>

  <!-- Index labels below result -->
  <text x="52" y="288" text-anchor="middle" font-size="9" fill="#aaa">idx0</text>
  <text x="100" y="288" text-anchor="middle" font-size="9" fill="#aaa">idx1</text>
  <text x="148" y="288" text-anchor="middle" font-size="9" fill="#aaa">idx2</text>
  <text x="196" y="288" text-anchor="middle" font-size="9" fill="#aaa">idx3</text>
  <text x="244" y="288" text-anchor="middle" font-size="9" fill="#aaa">idx4</text>
  <text x="292" y="288" text-anchor="middle" font-size="9" fill="#aaa">idx5</text>
  <text x="340" y="288" text-anchor="middle" font-size="9" fill="#aaa">idx6</text>

  <!-- Right side: final result -->
  <text x="400" y="56" font-size="11" fill="#888">最终结果</text>
  <rect x="400" y="64" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="420" y="83" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="444" y="64" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="464" y="83" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">13</text>
  <rect x="488" y="64" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="508" y="83" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="400" y="108" font-size="9.5" fill="#888">翻牌序列：</text>
  <text x="400" y="122" font-size="9.5" fill="#4a7a3a" font-weight="bold">2,3,5,7,11,13,17 ✓</text>

  <!-- Key insight box -->
  <rect x="20" y="304" width="520" height="104" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="40" y="326" font-size="12" fill="#b85450" font-weight="bold">关键洞察</text>
  <text x="40" y="346" font-size="10.5" fill="#555">翻牌过程「取一张、移一张到底部」对位置的消费顺序是固定的——只与牌数 n 有关，与卡牌值无关。</text>
  <text x="40" y="364" font-size="10.5" fill="#555">用队列模拟这个消费序列：队首弹出 = 该位置放下一张卡，再弹一个塞回队尾 = 模拟「移到底部」。</text>
  <text x="40" y="382" font-size="10.5" fill="#555">排序后的第 i 张卡放入第 i 个被消费的位置 → 翻牌序列恰好递增。</text>
  <text x="40" y="398" font-size="10.5" fill="#b85450">本质：不是搜索排列，而是「逆向确定每个值该去哪个位置」。</text>
</svg>
