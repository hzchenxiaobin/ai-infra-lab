<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：[[2,1],[5,0],[4,2]] → ans = 10</text>

  <!-- 表格 -->
  <!-- 表头 -->
  <rect x="30" y="44" width="500" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="80"  y="61" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">交易</text>
  <text x="160" y="61" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">cost</text>
  <text x="240" y="61" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">cashback</text>
  <text x="335" y="61" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">类型</text>
  <text x="415" y="61" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">loss</text>
  <text x="495" y="61" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">val</text>

  <!-- 行1 [2,1] -->
  <rect x="30" y="70" width="500" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80"  y="86" text-anchor="middle" font-size="11" fill="#333">[2,1]</text>
  <text x="160" y="86" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="240" y="86" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="335" y="86" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">亏</text>
  <text x="415" y="86" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="495" y="86" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>

  <!-- 行2 [5,0] -->
  <rect x="30" y="94" width="500" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80"  y="110" text-anchor="middle" font-size="11" fill="#333">[5,0]</text>
  <text x="160" y="110" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="240" y="110" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="335" y="110" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">亏</text>
  <text x="415" y="110" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="495" y="110" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>

  <!-- 行3 [4,2] -->
  <rect x="30" y="118" width="500" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="80"  y="134" text-anchor="middle" font-size="11" fill="#333">[4,2]</text>
  <text x="160" y="134" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="240" y="134" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="335" y="134" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">亏</text>
  <text x="415" y="134" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="495" y="134" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>

  <!-- 汇总 -->
  <text x="36" y="160" font-size="12" fill="#446688" font-weight="bold">T = 1 + 5 + 2 = 8</text>
  <text x="230" y="160" font-size="12" fill="#446688" font-weight="bold">max(val) = max(1, 0, 2) = 2</text>
  <text x="430" y="160" font-size="12" fill="#b85450" font-weight="bold">ans = 8 + 2 = 10</text>

  <!-- 最坏顺序执行 -->
  <text x="280" y="188" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">最坏顺序 [5,0] → [2,1] → [4,2]（cashback 升序，大者殿后）</text>

  <!-- 三个步骤 -->
  <rect x="40" y="200" width="150" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="115" y="220" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">步骤 1：[5,0]</text>
  <text x="50" y="240" font-size="10" fill="#555">需求 R = 5</text>
  <text x="50" y="256" font-size="10" fill="#555">钱：10 → 10−5+0 = 5</text>

  <line x1="190" y1="235" x2="218" y2="235" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="220" y="200" width="150" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="295" y="220" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">步骤 2：[2,1]</text>
  <text x="230" y="240" font-size="10" fill="#555">需求 R = 2+5 = 7</text>
  <text x="230" y="256" font-size="10" fill="#555">钱：5 → 5−2+1 = 4</text>

  <line x1="370" y1="235" x2="398" y2="235" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="400" y="200" width="150" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="475" y="220" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">步骤 3：[4,2]</text>
  <text x="410" y="240" font-size="10" fill="#b85450" font-weight="bold">需求 R = 4+5+1 = 10</text>
  <text x="410" y="256" font-size="10" fill="#555">钱：4 → 4−4+2 = 2</text>

  <!-- 验证 M=9 失败 -->
  <rect x="40" y="290" width="480" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="312" font-size="11" fill="#446688" font-weight="bold">⚠️ 若 M = 9：步骤 3 时钱 = 9−5−1 = 3 &lt; 4（cost），断钱 ✓</text>
  <text x="56" y="328" font-size="11" fill="#446688">故 M &lt; 10 必有顺序失败，M = 10 是任意顺序都成立的最少钱数</text>

  <!-- 结论 -->
  <text x="280" y="360" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">峰值需求 = cashback₃ + T = 2 + 8 = 10 = ans ✓</text>
  <text x="280" y="380" text-anchor="middle" font-size="10.5" fill="#888">亏₃（cashback 最大的）排最后，前缀亏损和 = T − loss₃ = 8 − 2 = 6</text>
</svg>
