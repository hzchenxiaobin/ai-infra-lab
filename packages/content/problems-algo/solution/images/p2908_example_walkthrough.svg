<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [8,6,1,5,3]</text>
  <text x="310" y="50" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">从右往左递推 suf[k] = min(nums[k..4]) = [1,1,1,3,3,+∞]，再从左往右枚举 j</text>

  <!-- table header -->
  <rect x="70" y="64" width="480" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="97" y="87" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">j</text>
  <text x="167" y="87" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">nums[j]</text>
  <text x="257" y="87" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">preMin</text>
  <text x="352" y="87" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">suf[j+1]</text>
  <text x="432" y="87" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">山峰?</text>
  <text x="507" y="87" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">候选和</text>

  <!-- rows -->
  <rect x="70" y="100" width="480" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="97" y="122" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="167" y="122" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <text x="257" y="122" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">+∞</text>
  <text x="352" y="122" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="432" y="122" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="507" y="122" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">—</text>

  <rect x="70" y="134" width="480" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="97" y="156" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="167" y="156" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="257" y="156" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <text x="352" y="156" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="432" y="156" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="507" y="156" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">—</text>

  <rect x="70" y="168" width="480" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="97" y="190" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="167" y="190" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="257" y="190" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>
  <text x="352" y="190" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="432" y="190" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="507" y="190" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">—</text>

  <rect x="70" y="202" width="480" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="97" y="224" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="167" y="224" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="257" y="224" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="352" y="224" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="432" y="224" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="507" y="224" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">1+5+3=9</text>

  <rect x="70" y="236" width="480" height="34" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="97" y="258" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="167" y="258" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="257" y="258" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="352" y="258" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">+∞</text>
  <text x="432" y="258" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="507" y="258" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">—</text>

  <!-- notes -->
  <text x="310" y="298" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">✗ 的原因：j=0 / j=4 一侧没元素（哨兵 +∞）；j=1、j=2 左侧最小不比山峰矮（8≥6、6≥1）</text>
  <text x="310" y="318" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">j=3：preMin=1 &lt; 5 且 suf[4]=3 &lt; 5 → 唯一合法山峰</text>

  <!-- answer box -->
  <rect x="130" y="338" width="360" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="362" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 = 9（三元组 (2,3,4)：nums[2]+nums[3]+nums[4]）</text>
</svg>
