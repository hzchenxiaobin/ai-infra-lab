<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 462" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="462" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">一遍遍历流程：边计数，边维护 maxFreq 与 ans</text>

  <!-- start -->
  <rect x="200" y="38" width="160" height="32" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="280" y="59" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">maxFreq = 0，ans = 0</text>
  <path d="M 280 70 L 280 86" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- loop -->
  <rect x="200" y="88" width="160" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="280" y="109" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">for x in nums（一次遍历）</text>
  <path d="M 280 120 L 280 136" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- increment -->
  <rect x="205" y="138" width="150" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="280" y="159" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">freq[x] += 1</text>
  <path d="M 280 170 L 280 186" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 1 -->
  <polygon points="280,188 358,222 280,256 202,222" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="216" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">freq[x] &gt;</text>
  <text x="280" y="233" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">maxFreq ?</text>

  <!-- branch yes 1 -->
  <text x="362" y="212" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 358 222 L 376 222" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="378" y="198" width="132" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="444" y="218" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">maxFreq = freq[x]</text>
  <text x="444" y="236" text-anchor="middle" font-size="11.5" fill="#b85450" filter="url(#rough2)">ans = maxFreq（重置）</text>

  <!-- branch no 1 -->
  <text x="290" y="272" font-size="11.5" fill="#555" filter="url(#rough2)">否</text>
  <path d="M 280 256 L 280 278" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 2 -->
  <polygon points="280,280 358,314 280,348 202,314" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="308" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">freq[x] ==</text>
  <text x="280" y="325" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">maxFreq ?</text>

  <!-- branch yes 2 -->
  <text x="362" y="304" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 358 314 L 376 314" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="378" y="290" width="132" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="444" y="310" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans += maxFreq</text>
  <text x="444" y="328" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">（多一个并列冠军）</text>

  <!-- branch no 2 -->
  <text x="290" y="364" font-size="11.5" fill="#555" filter="url(#rough2)">否</text>
  <path d="M 280 348 L 280 366" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- no change -->
  <rect x="232" y="368" width="96" height="30" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="280" y="388" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">ans 不变</text>

  <!-- converge lines -->
  <path d="M 510 222 L 530 222 L 530 430 L 326 430" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 510 314 L 530 314" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 280 398 L 280 414" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="204" y="416" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="264" y="437" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <!-- side note -->
  <rect x="30" y="196" width="150" height="112" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="105" y="218" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">不变式：任意时刻</text>
  <text x="105" y="236" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">ans = 已扫前缀中</text>
  <text x="105" y="254" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">频率恰为 maxFreq 的</text>
  <text x="105" y="272" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">元素的频率之和</text>
  <text x="105" y="296" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">（突破就重置，并列就累加）</text>
</svg>
