<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：单指针扫描 + 三分支分词</text>

  <!-- Start -->
  <ellipse cx="270" cy="58" rx="46" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="62" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">开始</text>

  <path d="M 270 76 L 270 92" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init box -->
  <rect x="170" y="94" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="115" text-anchor="middle" font-size="12" fill="#333">i = 0, res = ""</text>

  <path d="M 270 128 L 270 146" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: i < n? -->
  <polygon points="270,148 388,196 270,244 152,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="192" text-anchor="middle" font-size="12" fill="#333">i &lt; n ?</text>
  <text x="270" y="208" text-anchor="middle" font-size="10" fill="#888">(还有 token)</text>

  <!-- No branch -> return -->
  <path d="M 388 196 L 450 196 L 450 250" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="402" y="188" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="384" y="252" width="132" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="450" y="273" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 res</text>

  <!-- Yes branch -> G? -->
  <path d="M 152 196 L 100 196 L 100 252" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="138" y="188" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Decision: command[i] == 'G' ? -->
  <polygon points="100,254 190,296 100,338 10,296" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="293" text-anchor="middle" font-size="11" fill="#333">s[i] == 'G' ?</text>
  <text x="100" y="308" text-anchor="middle" font-size="10" fill="#888">首字符是 G</text>

  <!-- Yes G -> append G, i+=1 -->
  <path d="M 190 296 L 238 296 L 238 326" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="204" y="288" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="172" y="328" width="132" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="238" y="346" text-anchor="middle" font-size="11" fill="#333">res += "G"</text>
  <text x="238" y="362" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">i += 1</text>

  <!-- No -> it is '(' ; peek next -->
  <path d="M 10 296 L 10 340" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="22" y="320" font-size="11" fill="#999" font-weight="bold">否</text>
  <polygon points="10,342 90,374 50,406 -30,374" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="30" y="378" text-anchor="middle" font-size="10" fill="#333">s[i+1]==')' ?</text>

  <!-- Yes ')' -> append o, i+=2 -->
  <path d="M 90 374 L 130 374 L 130 386" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="104" y="368" font-size="10" fill="#446688" font-weight="bold">是</text>
  <rect x="78" y="388" width="104" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="404" text-anchor="middle" font-size="10" fill="#333">res += "o"</text>
  <text x="130" y="418" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">i += 2</text>

  <!-- No 'a' -> append al, i+=4 -->
  <path d="M 50 406 L 50 426" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="62" y="420" font-size="10" fill="#d6a040" font-weight="bold">否</text>
  <rect x="-12" y="428" width="104" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="40" y="445" text-anchor="middle" font-size="10" fill="#333">res += "al", i += 4</text>

  <!-- Loop back arrows (dashed) -->
  <path d="M 304 350 L 450 350 L 450 196" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="458" y="276" font-size="9" fill="#4a7a3a">循环</text>
  <path d="M 130 428 L 130 446 L 450 446 L 450 350" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <path d="M 90 462 L 450 462" stroke="#4a7a3a" stroke-width="1" fill="none" stroke-dasharray="3 3" filter="url(#rough2)"/>

  <!-- Legend -->
  <rect x="300" y="384" width="160" height="42" fill="#fff" stroke="#eee" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="308" y="400" font-size="10" fill="#888" font-weight="bold">图例</text>
  <rect x="308" y="406" width="14" height="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="328" y="415" font-size="10" fill="#555">token=G</text>
  <rect x="380" y="406" width="14" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="400" y="415" font-size="10" fill="#555">token=()</text>

  <!-- Bottom note -->
  <rect x="180" y="384" width="116" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="192" y="402" font-size="10" fill="#d6a040" font-weight="bold">注意</text>
  <text x="192" y="416" font-size="9" fill="#555">输入保证合法，</text>
  <text x="192" y="425" font-size="9" fill="#555">无需越界校验</text>
</svg>
