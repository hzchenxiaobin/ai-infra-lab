<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#999"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：三级比较器 + 一次库排序</text>

  <!-- 左列：主流程 -->
  <rect x="36" y="56" width="176" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="124" y="74" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">输入 threats</text>
  <text x="124" y="90" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">n 条 [id, sev, expl]</text>

  <path d="M 124 98 L 124 116" stroke="#999" stroke-width="1.4" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="36" y="120" width="176" height="42" fill="#ffffff" stroke="#888" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="124" y="138" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">定义比较器 cmp(a,b)</text>
  <text x="124" y="154" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">逻辑见右侧虚线框</text>

  <path d="M 124 162 L 124 180" stroke="#999" stroke-width="1.4" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="36" y="184" width="176" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="124" y="202" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">调用库排序</text>
  <text x="124" y="218" text-anchor="middle" font-size="10" fill="#b07818" filter="url(#rough2)">sort(cmp) / sorted(key)</text>

  <path d="M 124 226 L 124 244" stroke="#999" stroke-width="1.4" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="36" y="248" width="176" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="124" y="266" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回排序后数组</text>
  <text x="124" y="282" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">优先处置清单</text>

  <!-- 主流程与比较器的关联 -->
  <path d="M 212 141 L 240 141" stroke="#999" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 右列：比较器逐级判定 -->
  <rect x="240" y="50" width="252" height="246" rx="10" fill="none" stroke="#999" stroke-width="1.3" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="366" y="70" text-anchor="middle" font-size="11.5" fill="#666" filter="url(#rough2)">cmp(a, b)：逐级判定 a 是否排在 b 前</text>

  <rect x="254" y="82" width="112" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="310" y="98" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">① 比 severity</text>
  <text x="310" y="111" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">a[1] vs b[1]</text>
  <path d="M 366 99 L 388 99" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="96" font-size="9.5" fill="#446688" filter="url(#rough2)">不等 ⇒ 定序</text>
  <text x="392" y="108" font-size="9.5" fill="#446688" filter="url(#rough2)">a[1] &gt; b[1]</text>

  <path d="M 310 116 L 310 134" stroke="#999" stroke-width="1.4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="325" y="131" font-size="9" fill="#999" filter="url(#rough2)">相等</text>

  <rect x="254" y="138" width="112" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="310" y="154" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">② 比 expl</text>
  <text x="310" y="167" text-anchor="middle" font-size="9" fill="#b07818" filter="url(#rough2)">a[2] vs b[2]</text>
  <path d="M 366 155 L 388 155" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="392" y="152" font-size="9.5" fill="#b07818" filter="url(#rough2)">不等 ⇒ 定序</text>
  <text x="392" y="164" font-size="9.5" fill="#b07818" filter="url(#rough2)">a[2] &gt; b[2]</text>

  <path d="M 310 172 L 310 190" stroke="#999" stroke-width="1.4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="325" y="187" font-size="9" fill="#999" filter="url(#rough2)">相等</text>

  <rect x="254" y="194" width="112" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="310" y="210" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">③ id 决胜</text>
  <text x="310" y="223" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">a[0] vs b[0]</text>
  <path d="M 366 211 L 388 211" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="208" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">必分胜负</text>
  <text x="392" y="220" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">a[0] &lt; b[0]</text>

  <text x="366" y="252" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">每一级只在「上一级平局」时才被看到</text>
  <text x="366" y="268" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">⚠ cmp(a,a) 必须为 false（严格弱序）</text>

  <!-- 底部复杂度框 -->
  <rect x="36" y="308" width="456" height="40" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="264" y="325" text-anchor="middle" font-size="11.5" fill="#7a3430" filter="url(#rough2)">整题 = 一次 O(n log n) 排序：比较次数 ~ n·log₂n ≈ 1.7×10⁶（n = 10⁵）</text>
  <text x="264" y="341" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">空间 O(log n)（introsort 递归栈）/ O(n)（Python Timsort 缓冲）</text>
</svg>
