<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 425"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="425" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">流程：数奇偶 → 判可行 → 两模板位移和 → 取最小</text>

  <!-- 前置 -->
  <rect x="90" y="32" width="340" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="52" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">一遍扫描：数出 cntE / cntO，收集偶数下标 evens[]（升序）</text>
  <path d="M 260 62 L 260 74" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 可行性判定 -->
  <polygon points="150,104 260,76 370,104 260,132" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="108" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">|cntE − cntO| &gt; 1 ?</text>
  <text x="378" y="98" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M 370 104 L 406 104" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <rect x="408" y="88" width="96" height="32" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="456" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">返回 −1</text>
  <text x="268" y="144" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <path d="M 260 132 L 260 146" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- 候选总览 -->
  <rect x="110" y="148" width="300" height="28" rx="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="167" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">至多两个候选模板，逐个评估</text>

  <path d="M 260 176 C 260 186, 141 182, 141 194" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 260 176 C 260 186, 379 182, 379 194" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- 候选① 偶开头 -->
  <rect x="30" y="196" width="222" height="78" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="141" y="216" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#446688" filter="url(#rough2)">候选① 偶开头 EOEO…（偶占 0,2,4,…）</text>
  <text x="141" y="236" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">可行 ⟺ cntE = ⌈n/2⌉</text>
  <text x="141" y="258" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">cost(0) = Σ|evens[k] − 2k|</text>

  <!-- 候选② 奇开头 -->
  <rect x="268" y="196" width="222" height="78" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="379" y="216" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">候选② 奇开头 OEOE…（偶占 1,3,5,…）</text>
  <text x="379" y="236" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">可行 ⟺ cntO = ⌈n/2⌉</text>
  <text x="379" y="258" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">cost(1) = Σ|evens[k] − (2k+1)|</text>

  <path d="M 141 274 C 141 286, 190 284, 200 292" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 379 274 C 379 286, 330 284, 320 292" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- 取最小 -->
  <rect x="60" y="294" width="400" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="312" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">ans = 可行候选中取最小（不可行者跳过）</text>
  <text x="260" y="330" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">n 奇 ⇒ 恰一个可行；n 偶且 cntE = cntO ⇒ 两个都可行</text>

  <path d="M 260 338 L 260 350" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- 返回 -->
  <rect x="100" y="352" width="320" height="42" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="260" y="370" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">返回 ans</text>
  <text x="260" y="387" text-anchor="middle" font-size="9.5" fill="#2a5a2a" filter="url(#rough2)">long long 累加（上界 ≈ n²/8 ≈ 1.25×10⁹，贴 int 上限）</text>

  <text x="260" y="414" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">时间 O(n)：一趟收集 + 至多两趟求和；空间 O(n)，三遍扫描可压至 O(1)</text>
</svg>
