<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：排序 → 贪心扫描 → 计数</text>

  <!-- ===== Step 1: sort ===== -->
  <rect x="160" y="40" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="61" text-anchor="middle" font-size="11.5" fill="#333">① 排序 nums（升序）</text>

  <path d="M 260 76 L 260 92" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: init ===== -->
  <rect x="160" y="94" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="115" text-anchor="middle" font-size="11.5" fill="#333">② 初始化 i = 0, count = 0</text>

  <path d="M 260 130 L 260 146" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Diamond 3: i < n ? ===== -->
  <polygon points="260,148 384,196 260,244 136,196" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="192" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">③ i &lt; n ?</text>
  <text x="260" y="208" text-anchor="middle" font-size="10" fill="#555">还有未分组元素?</text>

  <!-- No branch down: return count -->
  <path d="M 260 244 L 260 262" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="276" y="256" font-size="10" fill="#4a7a3a">否</text>
  <rect x="200" y="264" width="120" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="287" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">return count</text>

  <!-- Yes branch right: open new group -->
  <path d="M 384 196 L 410 196" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="397" y="190" text-anchor="middle" font-size="10" fill="#888">是</text>
  <rect x="412" y="170" width="100" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="462" y="186" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">count++</text>
  <text x="462" y="200" text-anchor="middle" font-size="9.5" fill="#555">start = nums[i]</text>
  <text x="462" y="214" text-anchor="middle" font-size="9.5" fill="#555">while ≤ start+k: i++</text>

  <!-- loop back from action box to diamond -->
  <path d="M 462 170 L 462 140 L 260 140 L 260 148" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="361" y="135" text-anchor="middle" font-size="9.5" fill="#888">回到判定，处理下一组</text>

  <!-- ===== Bottom note ===== -->
  <rect x="40" y="316" width="440" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="260" y="335" text-anchor="middle" font-size="10.5" fill="#555">排序保证「同组最优上界」= 紧邻 s 之后的一段连续前缀</text>
  <text x="260" y="352" text-anchor="middle" font-size="10.5" fill="#555">每组一次跳跃（i 跳过整段），整体只扫描一遍 → O(n log n) 由排序主导</text>
</svg>
