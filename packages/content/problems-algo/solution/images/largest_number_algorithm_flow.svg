<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="500" height="460" fill="#fafafa"/>

  <text x="250" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：DP 填表 → 判可行性 → 贪心构造</text>

  <!-- Step 1: Init -->
  <rect x="120" y="44" width="260" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="250" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 初始化</text>
  <text x="250" y="82" text-anchor="middle" font-size="11" fill="#555">dp[0] = 0, dp[1..target] = −1</text>

  <path d="M 250 94 L 250 108" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <!-- Step 2: Fill DP -->
  <rect x="60" y="110" width="380" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="250" y="130" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 完全背包填表</text>
  <text x="250" y="148" text-anchor="middle" font-size="11" fill="#555">for t = 1..target:</text>
  <text x="250" y="164" text-anchor="middle" font-size="11" fill="#555">  for i = 0..8 (数位 1..9):</text>
  <text x="250" y="182" text-anchor="middle" font-size="10" fill="#b85450">    if dp[t−cost[i]] ≥ 0: dp[t] = max(dp[t], dp[t−cost[i]]+1)</text>

  <path d="M 250 192 L 250 206" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>

  <!-- Diamond: check feasibility -->
  <polygon points="250,210 370,250 250,290 130,250" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="248" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">dp[target] &lt; 0?</text>
  <text x="250" y="264" text-anchor="middle" font-size="10" fill="#888">(不可达)</text>

  <!-- Yes arrow right -->
  <path d="M 370 250 L 420 250" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="378" y="242" font-size="10" fill="#b85450" font-weight="bold">是</text>
  <rect x="420" y="234" width="60" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="450" y="254" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return "0"</text>

  <!-- No arrow down -->
  <path d="M 250 290 L 250 304" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" fill="none" filter="url(#rough2)"/>
  <text x="258" y="300" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>

  <!-- Step 3: Greedy -->
  <rect x="50" y="306" width="400" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="250" y="326" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 贪心构造（从左到右每位）</text>
  <text x="250" y="344" text-anchor="middle" font-size="11" fill="#555">remain = target</text>
  <text x="250" y="360" text-anchor="middle" font-size="11" fill="#555">for 每位 (共 dp[target] 位):</text>
  <text x="250" y="376" text-anchor="middle" font-size="11" fill="#555">  for d = 9 → 1:</text>
  <text x="250" y="394" text-anchor="middle" font-size="10" fill="#b85450">    if dp[remain−c] == dp[remain]−1: 选 d, remain −= c, break</text>

  <path d="M 250 408 L 250 422" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" fill="none" filter="url(#rough2)"/>

  <!-- Return -->
  <rect x="150" y="424" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="444" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return ans</text>
</svg>
