<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 416" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="416" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：两种顶色方案各自贪心到底，取最大高度</text>

  <!-- 开始 -->
  <rect x="195" y="32" width="130" height="28" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="50" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">输入 red, blue</text>
  <path d="M 260 60 L 260 72" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <!-- 枚举方案 -->
  <rect x="145" y="76" width="230" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="96" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">枚举方案 s ∈ {红顶, 蓝顶}</text>
  <path d="M 260 108 L 260 124" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <!-- h = 0 -->
  <ellipse cx="260" cy="142" rx="38" ry="16" fill="#f0f0f0" stroke="#aaa" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="260" y="146" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">h = 0</text>
  <path d="M 260 158 L 260 174" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <polygon points="260,178 392,218 260,258 128,218" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="212" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">第 h+1 行需 h+1 个球</text>
  <text x="260" y="230" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">该行颜色的库存够吗？</text>

  <!-- 够：扣球循环 -->
  <text x="402" y="210" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">够</text>
  <path d="M 392 218 L 408 218" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <rect x="412" y="200" width="100" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="462" y="214" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">扣掉 h+1 个球</text>
  <text x="462" y="228" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">h ← h + 1</text>
  <path d="M 462 200 L 462 168 L 268 168" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="360" y="162" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">继续尝试下一行</text>

  <!-- 不够：记录并退出该方案 -->
  <text x="274" y="272" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">不够</text>
  <path d="M 260 258 L 260 274" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <rect x="150" y="278" width="220" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="297" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">记录 hₛ（方案 s 的最大高度）</text>
  <path d="M 260 308 L 260 322" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="276" y="319" font-size="9.5" fill="#888" filter="url(#rough2)">两种方案都完成后</text>

  <!-- 汇总 -->
  <rect x="140" y="326" width="240" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="260" y="347" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">answer = max(h红顶, h蓝顶)</text>
  <path d="M 260 360 L 260 374" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <!-- 返回 -->
  <rect x="200" y="378" width="120" height="28" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="396" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">返回 answer</text>

  <!-- 侧注 -->
  <rect x="18" y="192" width="100" height="72" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="68" y="212" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">两种方案共用</text>
  <text x="68" y="228" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">同一个 calc</text>
  <text x="68" y="244" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">参数对调即换</text>
  <text x="68" y="258" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">方案</text>
</svg>
