<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">流程：单调队列维护窗口 [lo, i−1] 的极值，前缀和 O(1) 转移</text>

  <!-- 初始化 -->
  <rect x="140" y="32" width="240" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="52" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">初始化：dp[0] = 1，S[1] = 1，lo = 0</text>
  <path d="M 260 62 L 260 74" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环头 -->
  <rect x="195" y="76" width="130" height="30" rx="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">for i = 1 … n</text>
  <path d="M 260 106 L 260 118" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ① 入队 -->
  <rect x="48" y="120" width="424" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="137" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">① nums[i−1] 入队：maxDq 尾部值 ≤ 新值 → 出队</text>
  <text x="260" y="153" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">minDq 尾部值 ≥ 新值 → 出队（队列存下标，保持单调）</text>
  <path d="M 260 160 L 260 172" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② 判定菱形 -->
  <polygon points="80,204 205,174 330,204 205,234" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="205" y="209" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">② max − min &gt; k ?</text>

  <!-- 是：缩窗 -->
  <text x="342" y="198" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M 330 204 L 360 204" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <rect x="362" y="182" width="146" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="435" y="200" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">队首 == lo 则出队</text>
  <text x="435" y="216" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">lo ← lo + 1</text>
  <path d="M 435 182 C 435 152, 205 146, 205 170" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="322" y="153" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">缩到合法为止</text>

  <!-- 否：转移 -->
  <text x="216" y="250" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <path d="M 205 234 L 205 252" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="48" y="254" width="424" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="271" text-anchor="middle" font-size="11" fill="#2a5a2a" filter="url(#rough2)">③ dp[i] = (S[i] − S[lo] + MOD) % MOD</text>
  <text x="260" y="287" text-anchor="middle" font-size="11" fill="#2a5a2a" filter="url(#rough2)">S[i+1] = (S[i] + dp[i]) % MOD，随后 i 自增进入下一轮</text>
  <path d="M 260 294 L 260 304" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- 返回 -->
  <rect x="170" y="306" width="180" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="260" y="326" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">返回 dp[n]</text>

  <text x="260" y="352" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">每个下标至多入队、出队各一次 ⇒ 均摊 O(1)，总计 O(n)</text>
</svg>
