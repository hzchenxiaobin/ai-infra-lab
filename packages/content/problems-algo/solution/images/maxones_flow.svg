<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="760" height="280" fill="#fdfcf7"/>

  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：枚举余数 → 算类大小 → 排序 → 取前 maxOnes</text>
  <path d="M 160 38 Q 380 46 600 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- box1: 枚举余数 -->
  <g filter="url(#sk)"><rect x="20" y="95" width="130" height="80" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="85" y="124" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">① 枚举余数</text>
  <text x="85" y="144" text-anchor="middle" font-size="10" fill="#555">(r, c) ∈</text>
  <text x="85" y="160" text-anchor="middle" font-size="10" fill="#555">[0, sl) × [0, sl)</text>
  <path d="M 152 135 L 178 135" stroke="#5a5a5a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- box2: 算每维个数 -->
  <g filter="url(#sk)"><rect x="180" y="95" width="150" height="80" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="255" y="120" text-anchor="middle" font-size="12" fill="#9a6a20" font-weight="bold">② 算每维个数</text>
  <text x="255" y="140" text-anchor="middle" font-size="10" fill="#555">行数=⌊(H−1−r)/sl⌋+1</text>
  <text x="255" y="156" text-anchor="middle" font-size="10" fill="#555">列数=⌊(W−1−c)/sl⌋+1</text>
  <path d="M 332 135 L 358 135" stroke="#5a5a5a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- box3: 类大小 -->
  <g filter="url(#sk)"><rect x="360" y="95" width="120" height="80" rx="8" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.5"/></g>
  <text x="420" y="124" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">③ 类大小</text>
  <text x="420" y="146" text-anchor="middle" font-size="11" fill="#555">= 行数 × 列数</text>
  <text x="420" y="164" text-anchor="middle" font-size="10" fill="#888">共 sl² 个</text>
  <path d="M 482 135 L 508 135" stroke="#5a5a5a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- box4: 降序排序 -->
  <g filter="url(#sk)"><rect x="510" y="95" width="110" height="80" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="565" y="124" text-anchor="middle" font-size="12" fill="#9a6a20" font-weight="bold">④ 降序排序</text>
  <text x="565" y="146" text-anchor="middle" font-size="10" fill="#555">按类大小</text>
  <text x="565" y="162" text-anchor="middle" font-size="10" fill="#555">从大到小</text>
  <path d="M 622 135 L 648 135" stroke="#5a5a5a" stroke-width="1.8" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- box5: 取前 maxOnes (answer) -->
  <g filter="url(#sk)"><rect x="650" y="95" width="100" height="80" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.2"/></g>
  <text x="700" y="120" text-anchor="middle" font-size="11.5" fill="#a8423e" font-weight="bold">⑤ 取前 maxOnes</text>
  <text x="700" y="142" text-anchor="middle" font-size="10" fill="#555">求和</text>
  <text x="700" y="160" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">= 答案</text>

  <!-- bottom boxes -->
  <g filter="url(#sk)"><rect x="20" y="205" width="350" height="56" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.2"/></g>
  <text x="195" y="228" text-anchor="middle" font-size="11" fill="#2b6e9e" font-weight="bold">复杂度</text>
  <text x="40" y="248" font-size="10.5" fill="#555">枚举 sl² 类 O(sl²) · 排序 O(sl² log sl) · 求和 O(maxOnes)</text>

  <g filter="url(#sk)"><rect x="390" y="205" width="350" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2"/></g>
  <text x="565" y="228" text-anchor="middle" font-size="11" fill="#9a6a20" font-weight="bold">关键不变式</text>
  <text x="410" y="248" font-size="10.5" fill="#555">填满 k 类 ⟹ 每子阵恰 k 个 1，k ≤ maxOnes 即合法</text>
</svg>
