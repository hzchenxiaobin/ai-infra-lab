<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 310" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="310" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例 2 演算：words = ["abc","bcd","aaaa","cbc"]，x = "a"</text>

  <!-- header row: y=38..66 -->
  <rect x="36" y="38" width="34" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="70" y="38" width="78" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="148" y="38" width="172" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="320" y="38" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="376" y="38" width="124" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="53" y="57" text-anchor="middle" font-size="11.5" fill="#33476b" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="109" y="57" text-anchor="middle" font-size="11.5" fill="#33476b" font-weight="bold" filter="url(#rough2)">words[i]</text>
  <text x="234" y="57" text-anchor="middle" font-size="11.5" fill="#33476b" font-weight="bold" filter="url(#rough2)">逐位扫描</text>
  <text x="348" y="57" text-anchor="middle" font-size="11.5" fill="#33476b" font-weight="bold" filter="url(#rough2)">命中?</text>
  <text x="438" y="57" text-anchor="middle" font-size="11.5" fill="#33476b" font-weight="bold" filter="url(#rough2)">ans</text>

  <!-- Row 0: y=66..110 -->
  <rect x="36" y="66" width="34" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="70" y="66" width="78" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="148" y="66" width="172" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="320" y="66" width="56" height="44" fill="#e6f4ea" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="376" y="66" width="124" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="53" y="93" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">0</text>
  <text x="109" y="93" text-anchor="middle" font-size="12.5" filter="url(#rough2)"><tspan fill="#2f5d24" font-weight="bold">a</tspan><tspan fill="#555">bc</tspan></text>
  <text x="158" y="93" font-size="11.5" fill="#2f5d24" filter="url(#rough2)">a ✓ 命中即停</text>
  <text x="348" y="93" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="438" y="93" text-anchor="middle" font-size="12.5" fill="#33476b" font-weight="bold" filter="url(#rough2)">[0]</text>

  <!-- Row 1: y=110..154 -->
  <rect x="36" y="110" width="34" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="70" y="110" width="78" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="148" y="110" width="172" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="320" y="110" width="56" height="44" fill="#fce4ec" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="376" y="110" width="124" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="53" y="137" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">1</text>
  <text x="109" y="137" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">bcd</text>
  <text x="158" y="137" font-size="11.5" fill="#777" filter="url(#rough2)">b ✗ → c ✗ → d ✗（读完）</text>
  <text x="348" y="137" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="438" y="137" text-anchor="middle" font-size="12.5" fill="#33476b" font-weight="bold" filter="url(#rough2)">[0]</text>

  <!-- Row 2: y=154..198 -->
  <rect x="36" y="154" width="34" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="70" y="154" width="78" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="148" y="154" width="172" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="320" y="154" width="56" height="44" fill="#e6f4ea" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="376" y="154" width="124" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="53" y="181" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">2</text>
  <text x="109" y="181" text-anchor="middle" font-size="12.5" filter="url(#rough2)"><tspan fill="#2f5d24" font-weight="bold">a</tspan><tspan fill="#aaa">aaa</tspan></text>
  <text x="158" y="181" font-size="11.5" fill="#2f5d24" filter="url(#rough2)">a ✓ 命中即停</text>
  <text x="348" y="181" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="438" y="181" text-anchor="middle" font-size="12.5" fill="#33476b" font-weight="bold" filter="url(#rough2)">[0, 2]</text>

  <!-- Row 3: y=198..242 -->
  <rect x="36" y="198" width="34" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="70" y="198" width="78" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="148" y="198" width="172" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="320" y="198" width="56" height="44" fill="#fce4ec" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="376" y="198" width="124" height="44" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="53" y="225" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">3</text>
  <text x="109" y="225" text-anchor="middle" font-size="12.5" fill="#555" filter="url(#rough2)">cbc</text>
  <text x="158" y="225" font-size="11.5" fill="#777" filter="url(#rough2)">c ✗ → b ✗ → c ✗（读完）</text>
  <text x="348" y="225" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="438" y="225" text-anchor="middle" font-size="12.5" fill="#33476b" font-weight="bold" filter="url(#rough2)">[0, 2]</text>

  <!-- bottom note -->
  <rect x="36" y="256" width="464" height="42" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="268" y="273" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">示例 3（x = "z"）：四个单词全部读完仍无命中，返回 [ ]；</text>
  <text x="268" y="291" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">必须读完全部 n × m 个字符——O(n·m) 正是读取下界</text>
</svg>
