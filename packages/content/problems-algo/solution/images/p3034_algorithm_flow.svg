<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="520" height="480" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：差分符号化 → KMP 预处理 → 单遍扫描计数</text>

  <!-- start -->
  <ellipse cx="260" cy="46" rx="36" ry="16" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="51" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M 260 62 L 260 74" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- phase 1: sign transform -->
  <rect x="125" y="76" width="270" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="95" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① 差分符号化：b[i] = sign(nums[i+1] − nums[i])</text>
  <path d="M 260 106 L 260 118" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- phase 2: fail -->
  <rect x="125" y="120" width="270" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="139" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">② 预处理 fail 数组（pattern 自匹配，O(m)）</text>
  <path d="M 260 150 L 260 162" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- phase 3: scan -->
  <rect x="125" y="164" width="270" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="183" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">③ 取下一个 c ∈ b（j = 已匹配的 pattern 前缀长）</text>
  <path d="M 260 194 L 260 206" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 1: mismatch fallback -->
  <polygon points="260,208 350,238 260,268 170,238" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="242" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">j &gt; 0 且 c ≠ pattern[j]？</text>
  <text x="356" y="230" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 350 238 L 386 238" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="386" y="224" width="104" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="438" y="243" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">j ← fail[j−1]</text>
  <path d="M 438 224 C 440 198, 320 198, 290 210" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="268" y="282" font-size="10.5" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 260 268 L 260 282" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 2: match advance -->
  <polygon points="260,284 350,314 260,344 170,314" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">c == pattern[j]？</text>
  <text x="356" y="306" font-size="10.5" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 350 314 L 384 314" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="384" y="300" width="104" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="436" y="319" text-anchor="middle" font-size="12" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">j ← j + 1</text>
  <path d="M 436 328 C 436 350, 330 350, 292 360" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="268" y="358" font-size="10.5" fill="#999" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 260 344 L 260 358" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 3: full hit -->
  <polygon points="260,360 345,390 260,420 175,390" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="394" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">j == m ？</text>
  <text x="351" y="382" font-size="10.5" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 345 390 L 378 390" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="378" y="374" width="130" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="8" filter="url(#rough2)"/>
  <text x="443" y="388" text-anchor="middle" font-size="11" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">cnt ← cnt + 1</text>
  <text x="443" y="403" text-anchor="middle" font-size="11" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">j ← fail[m−1]</text>
  <text x="268" y="432" font-size="10.5" fill="#999" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 260 420 L 260 432" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- next c ellipse -->
  <ellipse cx="260" cy="450" rx="62" ry="16" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="455" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">取下一个 c</text>
  <path d="M 443 408 C 443 428, 300 415, 272 433" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="352" y="424" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">继续扫（接住重叠）</text>

  <!-- loop back -->
  <path d="M 198 450 C 60 450, 60 179, 123 179" stroke="#999" stroke-width="1.4" fill="none" stroke-dasharray="6 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="50" y="292" font-size="9.5" fill="#999" filter="url(#rough2)">未耗尽</text>
  <text x="50" y="306" font-size="9.5" fill="#999" filter="url(#rough2)">循环</text>

  <!-- return -->
  <path d="M 322 450 L 350 450" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="352" y="434" width="152" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="8" filter="url(#rough2)"/>
  <text x="428" y="455" text-anchor="middle" font-size="11.5" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">b 耗尽 → 返回 cnt</text>

  <!-- complexity note -->
  <rect x="402" y="88" width="106" height="50" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="455" y="106" text-anchor="middle" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">复杂度 O(n+m)</text>
  <text x="455" y="120" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">摊还：总回退</text>
  <text x="455" y="132" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">≤ 总前进 ≤ n</text>
</svg>
