<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：一趟扫描 + 两个标志</text>

  <!-- Step 1: Init -->
  <rect x="190" y="44" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="62" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">初始化</text>
  <text x="270" y="78" text-anchor="middle" font-size="10.5" fill="#555">increasing = true, decreasing = true</text>

  <!-- arrow down -->
  <path d="M 270 86 L 270 106" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: Loop -->
  <rect x="170" y="110" width="200" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="132" text-anchor="middle" font-size="11.5" fill="#a07820" font-weight="bold">for i = 1 to n−1  遍历相邻对</text>

  <!-- arrow down to diamond -->
  <path d="M 270 148 L 270 168" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond: compare nums[i] vs nums[i-1] -->
  <polygon points="270,172 380,224 270,276 160,224" fill="#fff" stroke="#888" stroke-width="2" rx="2" filter="url(#rough2)"/>
  <text x="270" y="216" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">nums[i] vs nums[i−1]</text>
  <text x="270" y="234" text-anchor="middle" font-size="10" fill="#888">三种情况</text>

  <!-- Branch 1: nums[i] > nums[i-1] (left) -->
  <path d="M 160 224 L 96 224" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="100" y="216" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">&gt; 升</text>
  <rect x="20" y="208" width="76" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="58" y="222" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">decreasing</text>
  <text x="58" y="236" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">= false</text>

  <!-- Branch 2: nums[i] == nums[i-1] (bottom) -->
  <path d="M 270 276 L 270 316" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="284" y="300" font-size="10" fill="#888" font-weight="bold">= 平</text>
  <rect x="210" y="320" width="120" height="30" fill="#f5f5f5" stroke="#aaa" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="340" text-anchor="middle" font-size="10.5" fill="#888">无需操作，跳过</text>

  <!-- Branch 3: nums[i] < nums[i-1] (right) -->
  <path d="M 380 224 L 444 224" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="440" y="216" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">&lt; 降</text>
  <rect x="444" y="208" width="76" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="482" y="222" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">increasing</text>
  <text x="482" y="236" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">= false</text>

  <!-- loop back arrow: from three branches back to loop -->
  <path d="M 58 242 Q 58 128 168 128" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 270 350 Q 270 128 370 128" stroke="#888" stroke-width="1.8" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 482 242 Q 482 128 372 128" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="120" y="186" font-size="9.5" fill="#4a7a3a">继续下一段</text>

  <!-- arrow from loop to end -->
  <path d="M 370 128 Q 460 128 460 380" stroke="#666" stroke-width="2" fill="none" stroke-dasharray="6,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="468" y="250" font-size="9.5" fill="#888">遍历结束</text>

  <!-- Final result box -->
  <rect x="170" y="384" width="200" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="402" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">return increasing || decreasing</text>
  <text x="270" y="420" text-anchor="middle" font-size="10" fill="#555">只要有一个为 true 即单调</text>

  <path d="M 270 350 L 270 384" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
