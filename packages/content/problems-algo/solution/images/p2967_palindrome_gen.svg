<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">打表：枚举「前半部分」，镜像拼接生成全部回文数</text>

  <!-- odd length: d = 5 -->
  <text x="48" y="72" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">d = 5（奇数位）</text>
  <rect x="150" y="52" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="168" y="73" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="190" y="52" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="208" y="73" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="230" y="52" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="248" y="73" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="208" y="100" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">前半 ⌈d/2⌉ = 3 位</text>

  <path d="M 278 68 L 302 68" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="290" y="58" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">镜像</text>

  <rect x="312" y="52" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="330" y="73" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="352" y="52" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="370" y="73" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="392" y="52" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="410" y="73" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="432" y="52" width="36" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="450" y="73" text-anchor="middle" font-size="14" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="472" y="52" width="36" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="490" y="73" text-anchor="middle" font-size="14" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="410" y="100" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">橙色 = 镜像拼上的 ⌊d/2⌋ 位</text>

  <!-- even length: d = 4 -->
  <text x="48" y="146" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">d = 4（偶数位）</text>
  <rect x="150" y="126" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="168" y="147" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="190" y="126" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="208" y="147" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="208" y="174" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">前半 ⌈d/2⌉ = 2 位</text>

  <path d="M 238 142 L 262 142" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="250" y="132" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">镜像</text>

  <rect x="272" y="126" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="290" y="147" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="312" y="126" width="36" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="330" y="147" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="352" y="126" width="36" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="370" y="147" text-anchor="middle" font-size="14" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="392" y="126" width="36" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="410" y="147" text-anchor="middle" font-size="14" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- count table -->
  <text x="48" y="212" font-size="12" fill="#555" filter="url(#rough2)">d 位回文数由前 ⌈d/2⌉ 位唯一决定，个数 = 9 × 10^(⌈d/2⌉−1)：</text>

  <rect x="40" y="224" width="88" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="84" y="244" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">位数 d</text>
  <rect x="40" y="256" width="88" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="84" y="276" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">回文数个数</text>

  <rect x="132" y="224" width="40" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="152" y="244" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <rect x="132" y="256" width="40" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="152" y="276" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">9</text>

  <rect x="176" y="224" width="40" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="196" y="244" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <rect x="176" y="256" width="40" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="196" y="276" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">9</text>

  <rect x="220" y="224" width="40" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="244" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>
  <rect x="220" y="256" width="40" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="276" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">90</text>

  <rect x="264" y="224" width="40" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="284" y="244" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4</text>
  <rect x="264" y="256" width="40" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="284" y="276" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">90</text>

  <rect x="308" y="224" width="40" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="328" y="244" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">5</text>
  <rect x="308" y="256" width="40" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="328" y="276" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">900</text>

  <rect x="352" y="224" width="40" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="372" y="244" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">6</text>
  <rect x="352" y="256" width="40" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="372" y="276" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">900</text>

  <rect x="396" y="224" width="40" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="416" y="244" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">7</text>
  <rect x="396" y="256" width="40" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="416" y="276" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">9000</text>

  <rect x="440" y="224" width="40" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="460" y="244" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">8</text>
  <rect x="440" y="256" width="40" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="460" y="276" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">9000</text>

  <rect x="484" y="224" width="36" height="30" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="502" y="244" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">9</text>
  <rect x="484" y="256" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="502" y="276" text-anchor="middle" font-size="9" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">90000</text>

  <!-- note box -->
  <rect x="48" y="308" width="424" height="74" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="330" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">合计 109,998 个（全部 &lt; 10⁹）—— 一次性生成，天然升序</text>
  <text x="260" y="352" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">对中位数 m 二分（lower_bound），一步定位两侧最近的回文数</text>
  <text x="260" y="372" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">⚠️ 别从 m 逐个 ±1 试探：9 位回文数相邻间隔可达 10⁴</text>
</svg>
