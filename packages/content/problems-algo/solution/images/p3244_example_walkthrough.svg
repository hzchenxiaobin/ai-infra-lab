<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrgr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arror" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：n = 5，queries = [[2,4],[0,2],[0,4]]</text>

  <!-- 演算表 -->
  <rect x="48" y="44" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="128" y="44" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="218" y="44" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="318" y="44" width="75" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="393" y="44" width="79" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="88" y="62" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">查询</text>
  <text x="173" y="62" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">find(u)</text>
  <text x="268" y="62" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">吸收的节点</text>
  <text x="355" y="62" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">skipped</text>
  <text x="432" y="62" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">answer</text>

  <rect x="48" y="72" width="80" height="28" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="128" y="72" width="90" height="28" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="218" y="72" width="100" height="28" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="318" y="72" width="75" height="28" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="393" y="72" width="79" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="88" y="90" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(2,4)</text>
  <text x="173" y="90" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2（存活）</text>
  <text x="268" y="90" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="355" y="90" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="432" y="90" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>

  <rect x="48" y="100" width="80" height="28" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="128" y="100" width="90" height="28" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="218" y="100" width="100" height="28" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="318" y="100" width="75" height="28" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="393" y="100" width="79" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="88" y="118" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(0,2)</text>
  <text x="173" y="118" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0（存活）</text>
  <text x="268" y="118" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="355" y="118" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="432" y="118" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="48" y="128" width="80" height="28" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="128" y="128" width="90" height="28" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="218" y="128" width="100" height="28" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="318" y="128" width="75" height="28" fill="#ffffff" stroke="#b8c4d0" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="393" y="128" width="79" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="88" y="146" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(0,4)</text>
  <text x="173" y="146" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0（存活）</text>
  <text x="268" y="146" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="355" y="146" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="432" y="146" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>

  <text x="260" y="176" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">查询 ③：find(1) = 2（1 已灰）；吸收 2 后 find(3) = 4（3 已灰），恰好停在 v</text>

  <!-- 情形 A：被包含 -->
  <text x="260" y="202" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">情形 A（被包含）：n = 6，queries = [[0,5],[2,4]]</text>

  <path d="M 80 236 Q 240 186 399 236" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrgr)" filter="url(#rough2)"/>
  <text x="128" y="216" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">(0,5)</text>
  <circle cx="80" cy="250" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <circle cx="145" cy="250" r="13" fill="#efefef" stroke="#a0a0a0" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <circle cx="210" cy="250" r="13" fill="#efefef" stroke="#a0a0a0" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <circle cx="275" cy="250" r="13" fill="#efefef" stroke="#a0a0a0" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <circle cx="340" cy="250" r="13" fill="#efefef" stroke="#a0a0a0" stroke-width="1.2" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <circle cx="405" cy="250" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="80" y="254" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">0</text>
  <text x="145" y="254" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="210" y="254" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="275" y="254" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="340" y="254" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">4</text>
  <text x="405" y="254" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">5</text>
  <path d="M 137 258 L 153 242" stroke="#b85450" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 202 258 L 218 242" stroke="#b85450" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 267 258 L 283 242" stroke="#b85450" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 332 258 L 348 242" stroke="#b85450" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- find(2) 跳到 5 -->
  <path d="M 210 268 Q 300 298 392 268" stroke="#a07830" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arror)" filter="url(#rough2)"/>
  <text x="301" y="298" text-anchor="middle" font-size="10" fill="#a07830" filter="url(#rough2)">find(2) = 5 ≠ 2</text>

  <text x="260" y="320" text-anchor="middle" font-size="10.5" fill="#8a3a34" filter="url(#rough2)">(2,4) ⊆ (0,5)：u 已灰，被包含 → 不吸收，answer 保持 1</text>

  <!-- 结论 -->
  <rect x="48" y="332" width="424" height="24" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="348" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">灰色点数 = 诸极大区间内部点数之和；answer = n − 1 − skipped</text>
</svg>
