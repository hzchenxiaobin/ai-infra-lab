<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "(1+(2*3)+((8)/4))+1"</text>
  <text x="280" y="44" text-anchor="middle" font-size="10" fill="#999">只列出括号事件（数字与 +,*,/ 等运算符直接跳过，不影响 depth）</text>

  <!-- Table frame -->
  <rect x="40" y="58" width="480" height="324" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>

  <!-- Header row -->
  <rect x="40" y="58" width="480" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <g font-size="12" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="80" y="76">序号</text>
    <text x="150" y="76">字符</text>
    <text x="250" y="76">动作</text>
    <text x="370" y="76">depth（处理后）</text>
    <text x="470" y="76">ans</text>
  </g>
  <!-- column separators -->
  <g stroke="#dde" stroke-width="1" filter="url(#rough2)">
    <line x1="110" y1="58" x2="110" y2="382"/>
    <line x1="190" y1="58" x2="190" y2="382"/>
    <line x1="320" y1="58" x2="320" y2="382"/>
    <line x1="420" y1="58" x2="420" y2="382"/>
  </g>

  <!-- Rows: 8 paren events + end -->
  <g font-size="12" fill="#333" text-anchor="middle">
    <!-- row 1 -->
    <text x="80" y="106">1</text>
    <text x="150" y="106" font-weight="bold" fill="#b85450">(</text>
    <text x="250" y="106">depth++</text>
    <text x="370" y="106" fill="#b85450" font-weight="bold">1</text>
    <text x="470" y="106" fill="#b85450" font-weight="bold">1</text>

    <!-- row 2 -->
    <text x="80" y="130">2</text>
    <text x="150" y="130" font-weight="bold" fill="#b85450">(</text>
    <text x="250" y="130">depth++</text>
    <text x="370" y="130" fill="#b85450" font-weight="bold">2</text>
    <text x="470" y="130" fill="#b85450" font-weight="bold">2</text>

    <!-- row 3 -->
    <text x="80" y="154">3</text>
    <text x="150" y="154" font-weight="bold" fill="#4a7a3a">)</text>
    <text x="250" y="154">depth--</text>
    <text x="370" y="154">1</text>
    <text x="470" y="154" fill="#b85450" font-weight="bold">2</text>

    <!-- row 4 -->
    <text x="80" y="178">4</text>
    <text x="150" y="178" font-weight="bold" fill="#b85450">(</text>
    <text x="250" y="178">depth++</text>
    <text x="370" y="178" fill="#b85450" font-weight="bold">2</text>
    <text x="470" y="178" fill="#b85450" font-weight="bold">2</text>

    <!-- row 5 PEAK -->
    <rect x="42" y="184" width="476" height="24" fill="#fce4ec" stroke="none" filter="url(#rough2)"/>
    <text x="80" y="202">5</text>
    <text x="150" y="202" font-weight="bold" fill="#b85450">(</text>
    <text x="250" y="202">depth++</text>
    <text x="370" y="202" fill="#b85450" font-weight="bold">3</text>
    <text x="470" y="202" fill="#b85450" font-weight="bold">3</text>

    <!-- row 6 -->
    <text x="80" y="226">6</text>
    <text x="150" y="226" font-weight="bold" fill="#4a7a3a">)</text>
    <text x="250" y="226">depth--</text>
    <text x="370" y="226">2</text>
    <text x="470" y="226" fill="#b85450" font-weight="bold">3</text>

    <!-- row 7 -->
    <text x="80" y="250">7</text>
    <text x="150" y="250" font-weight="bold" fill="#4a7a3a">)</text>
    <text x="250" y="250">depth--</text>
    <text x="370" y="250">1</text>
    <text x="470" y="250" fill="#b85450" font-weight="bold">3</text>

    <!-- row 8 -->
    <text x="80" y="274">8</text>
    <text x="150" y="274" font-weight="bold" fill="#4a7a3a">)</text>
    <text x="250" y="274">depth--</text>
    <text x="370" y="274">0</text>
    <text x="470" y="274" fill="#b85450" font-weight="bold">3</text>
  </g>

  <!-- row separators -->
  <g stroke="#eef" stroke-width="1" filter="url(#rough2)">
    <line x1="40" y1="114" x2="520" y2="114"/>
    <line x1="40" y1="138" x2="520" y2="138"/>
    <line x1="40" y1="162" x2="520" y2="162"/>
    <line x1="40" y1="186" x2="520" y2="186"/>
    <line x1="40" y1="210" x2="520" y2="210"/>
    <line x1="40" y1="234" x2="520" y2="234"/>
    <line x1="40" y1="258" x2="520" y2="258"/>
    <line x1="40" y1="282" x2="520" y2="282"/>
  </g>

  <!-- End result row -->
  <rect x="40" y="284" width="480" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="304" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">扫描结束 → 返回 ans = 3 ✓</text>

  <!-- Peak annotation -->
  <text x="510" y="202" font-size="10" fill="#b85450" font-weight="bold" text-anchor="end">← 峰值</text>

  <!-- Bottom note -->
  <rect x="40" y="326" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="346" font-size="11" fill="#d6a040" font-weight="bold">观察</text>
  <text x="56" y="362" font-size="11" fill="#555">• ans 只在遇到 ‘(’ 时才可能增大（depth 上升的瞬间刷新）</text>
  <text x="56" y="376" font-size="11" fill="#555">• 遇到 ‘)’ depth 下降，ans 不变；遇到数字/运算符两者都不变</text>
</svg>
