<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    表达式 7+3*1*2 的两种求值视角
  </text>

  <!-- Expression display -->
  <g filter="url(#rough2)">
    <rect x="120" y="48" width="36" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="138" y="68" text-anchor="middle" font-size="14" fill="#333">7</text>
    <rect x="158" y="48" width="20" height="30" fill="#fafafa" stroke="none"/>
    <text x="168" y="68" text-anchor="middle" font-size="14" fill="#888">+</text>
    <rect x="180" y="48" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="198" y="68" text-anchor="middle" font-size="14" fill="#333">3</text>
    <rect x="218" y="48" width="20" height="30" fill="#fafafa" stroke="none"/>
    <text x="228" y="68" text-anchor="middle" font-size="14" fill="#888">*</text>
    <rect x="240" y="48" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="258" y="68" text-anchor="middle" font-size="14" fill="#333">1</text>
    <rect x="278" y="48" width="20" height="30" fill="#fafafa" stroke="none"/>
    <text x="288" y="68" text-anchor="middle" font-size="14" fill="#888">*</text>
    <rect x="300" y="48" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="318" y="68" text-anchor="middle" font-size="14" fill="#333">2</text>
  </g>

  <!-- Divider -->
  <line x1="50" y1="95" x2="510" y2="95" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Left side: Correct order -->
  <text x="140" y="120" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">
    ✅ 正确运算顺序
  </text>
  <text x="140" y="140" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">
    先乘（左→右），后加（左→右）
  </text>

  <!-- Step 1: multiply 3*1=3 -->
  <g filter="url(#rough2)">
    <rect x="70" y="160" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="88" y="178" text-anchor="middle" font-size="12" fill="#333">7</text>
    <text x="118" y="178" text-anchor="middle" font-size="12" fill="#888">+</text>
    <rect x="130" y="160" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="148" y="178" text-anchor="middle" font-size="12" fill="#333">3</text>
    <text x="178" y="178" text-anchor="middle" font-size="12" fill="#888">*</text>
    <rect x="190" y="160" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="208" y="178" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="238" y="178" text-anchor="middle" font-size="12" fill="#888">*</text>
    <rect x="250" y="160" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="268" y="178" text-anchor="middle" font-size="12" fill="#333">2</text>
  </g>
  <text x="170" y="205" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">3*1 → 3</text>

  <!-- Step 2: 3*2=6 -->
  <g filter="url(#rough2)">
    <rect x="70" y="220" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="88" y="238" text-anchor="middle" font-size="12" fill="#333">7</text>
    <text x="118" y="238" text-anchor="middle" font-size="12" fill="#888">+</text>
    <rect x="130" y="220" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4"/>
    <text x="148" y="238" text-anchor="middle" font-size="12" fill="#333">3</text>
    <text x="178" y="238" text-anchor="middle" font-size="12" fill="#888">*</text>
    <rect x="190" y="220" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="208" y="238" text-anchor="middle" font-size="12" fill="#333">2</text>
  </g>
  <text x="170" y="265" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">3*2 → 6</text>

  <!-- Step 3: 7+6=13 -->
  <g filter="url(#rough2)">
    <rect x="90" y="280" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="108" y="298" text-anchor="middle" font-size="12" fill="#333">7</text>
    <text x="138" y="298" text-anchor="middle" font-size="12" fill="#888">+</text>
    <rect x="150" y="280" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="168" y="298" text-anchor="middle" font-size="12" fill="#333">6</text>
  </g>
  <text x="140" y="325" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">7+6 → </text>
  <rect x="190" y="310" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="215" y="328" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">13</text>

  <!-- Right side: Wrong order -->
  <text x="400" y="120" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">
    ❌ 错误运算顺序之一
  </text>
  <text x="400" y="140" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">
    任意加括号 → 任意求值顺序
  </text>

  <!-- Wrong step 1: 7+3=10 -->
  <g filter="url(#rough2)">
    <rect x="330" y="160" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="348" y="178" text-anchor="middle" font-size="12" fill="#333">7</text>
    <text x="378" y="178" text-anchor="middle" font-size="12" fill="#888">+</text>
    <rect x="390" y="160" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="408" y="178" text-anchor="middle" font-size="12" fill="#333">3</text>
    <text x="438" y="178" text-anchor="middle" font-size="12" fill="#888">*</text>
    <rect x="450" y="160" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="468" y="178" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="498" y="178" text-anchor="middle" font-size="12" fill="#888">*</text>
    <rect x="510" y="160" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="528" y="178" text-anchor="middle" font-size="12" fill="#333">2</text>
  </g>
  <text x="400" y="205" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">(7+3)*1*2 → 10*1*2</text>

  <!-- Wrong step 2: 10*1=10 -->
  <g filter="url(#rough2)">
    <rect x="370" y="220" width="50" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="395" y="238" text-anchor="middle" font-size="12" fill="#333">10</text>
    <text x="430" y="238" text-anchor="middle" font-size="12" fill="#888">*</text>
    <rect x="442" y="220" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="460" y="238" text-anchor="middle" font-size="12" fill="#333">1</text>
    <text x="490" y="238" text-anchor="middle" font-size="12" fill="#888">*</text>
    <rect x="502" y="220" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="520" y="238" text-anchor="middle" font-size="12" fill="#333">2</text>
  </g>
  <text x="400" y="265" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">10*1 → 10, 10*2 → 20</text>

  <!-- Wrong result -->
  <rect x="370" y="310" width="50" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="395" y="328" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">20</text>

  <!-- Scoring box -->
  <line x1="50" y1="355" x2="510" y2="355" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="80" y="370" width="400" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="388" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    打分规则：答案 = 13 → 5 分 | 答案 ∈ 所有可能结果但 ≠ 13 → 2 分 | 否则 → 0 分
  </text>
  <text x="280" y="404" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">
    所有可能结果 = 任意加括号能得到的全部值（区间 DP 枚举）
  </text>
</svg>
