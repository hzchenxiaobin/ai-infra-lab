<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
  </defs>
  <rect width="760" height="440" fill="#fdfcf7"/>

  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">余数类划分：每个子阵恰取每类一格</text>
  <path d="M 200 40 Q 380 48 560 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="380" y="58" text-anchor="middle" font-size="11" fill="#888">按 (i % sideLength, j % sideLength) 给格子涂色 → 同色格子永不共处任一 sideLength×sideLength 子阵</text>

  <!-- axis labels -->
  <text x="50" y="122" text-anchor="end" font-size="10" fill="#888">i=0</text>
  <text x="50" y="178" text-anchor="end" font-size="10" fill="#888">i=1</text>
  <text x="50" y="234" text-anchor="end" font-size="10" fill="#888">i=2</text>
  <text x="86" y="84" text-anchor="middle" font-size="10" fill="#888">j=0</text>
  <text x="142" y="84" text-anchor="middle" font-size="10" fill="#888">j=1</text>
  <text x="198" y="84" text-anchor="middle" font-size="10" fill="#888">j=2</text>

  <!-- 3x3 grid, sl=2. cell x=60+j*56, y=92+i*56, size 52 -->
  <!-- row i=0: (0,0)blue (0,1)green (0,2)blue -->
  <g filter="url(#sk)"><rect x="60" y="92" width="52" height="52" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="86" y="122" text-anchor="middle" font-size="11" fill="#2b6e9e">(0,0)</text>
  <g filter="url(#sk)"><rect x="116" y="92" width="52" height="52" rx="5" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.5"/></g>
  <text x="142" y="122" text-anchor="middle" font-size="11" fill="#2e6e2e">(0,1)</text>
  <g filter="url(#sk)"><rect x="172" y="92" width="52" height="52" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="198" y="122" text-anchor="middle" font-size="11" fill="#2b6e9e">(0,0)</text>

  <!-- row i=1: (1,0)orange (1,1)pink (1,2)orange -->
  <g filter="url(#sk)"><rect x="60" y="148" width="52" height="52" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="86" y="178" text-anchor="middle" font-size="11" fill="#9a6a20">(1,0)</text>
  <g filter="url(#sk)"><rect x="116" y="148" width="52" height="52" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="142" y="178" text-anchor="middle" font-size="11" fill="#a8423e">(1,1)</text>
  <g filter="url(#sk)"><rect x="172" y="148" width="52" height="52" rx="5" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="198" y="178" text-anchor="middle" font-size="11" fill="#9a6a20">(1,0)</text>

  <!-- row i=2: (0,0)blue (0,1)green (0,2)blue -->
  <g filter="url(#sk)"><rect x="60" y="204" width="52" height="52" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="86" y="234" text-anchor="middle" font-size="11" fill="#2b6e9e">(0,0)</text>
  <g filter="url(#sk)"><rect x="116" y="204" width="52" height="52" rx="5" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.5"/></g>
  <text x="142" y="234" text-anchor="middle" font-size="11" fill="#2e6e2e">(0,1)</text>
  <g filter="url(#sk)"><rect x="172" y="204" width="52" height="52" rx="5" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="198" y="234" text-anchor="middle" font-size="11" fill="#2b6e9e">(0,0)</text>

  <!-- 2x2 sub-matrix ① at (0,0): x[60,168] y[92,200] -->
  <rect x="57" y="89" width="114" height="114" rx="6" fill="none" stroke="#b85450" stroke-width="2.2" stroke-dasharray="6,3" filter="url(#sk)"/>
  <text x="114" y="278" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">子阵① (r0=0,c0=0)</text>
  <text x="114" y="292" text-anchor="middle" font-size="10" fill="#a8423e">蓝+绿+橙+粉 = 4 类各 1</text>

  <!-- 2x2 sub-matrix ② at (1,1): x[116,224] y[148,256] -->
  <rect x="113" y="145" width="114" height="114" rx="6" fill="none" stroke="#d6a040" stroke-width="2.2" stroke-dasharray="6,3" filter="url(#sk)"/>
  <text x="170" y="312" text-anchor="middle" font-size="10.5" fill="#9a6a20" font-weight="bold">子阵② (r0=1,c0=1)</text>
  <text x="170" y="326" text-anchor="middle" font-size="10" fill="#9a6a20">同样 4 类各 1（不论从哪起）</text>

  <!-- Right side: legend -->
  <text x="560" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b2b2b">余数类（sideLength=2）</text>
  <path d="M 450 108 Q 560 114 670 108" stroke="#2b2b2b" stroke-width="1" fill="none" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="420" y="124" width="28" height="22" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="460" y="140" font-size="11" fill="#2b6e9e" font-weight="bold">(0,0)</text>
  <text x="500" y="140" font-size="10" fill="#555">(0,0),(0,2),(2,0),(2,2)</text>

  <g filter="url(#sk)"><rect x="420" y="156" width="28" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="460" y="172" font-size="11" fill="#9a6a20" font-weight="bold">(1,0)</text>
  <text x="500" y="172" font-size="10" fill="#555">(1,0),(1,2)</text>

  <g filter="url(#sk)"><rect x="420" y="188" width="28" height="22" rx="4" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.5"/></g>
  <text x="460" y="204" font-size="11" fill="#2e6e2e" font-weight="bold">(0,1)</text>
  <text x="500" y="204" font-size="10" fill="#555">(0,1),(2,1)</text>

  <g filter="url(#sk)"><rect x="420" y="220" width="28" height="22" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="460" y="236" font-size="11" fill="#a8423e" font-weight="bold">(1,1)</text>
  <text x="500" y="236" font-size="10" fill="#555">(1,1)</text>

  <!-- key insight box -->
  <g filter="url(#sk)"><rect x="410" y="262" width="320" height="150" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.3"/></g>
  <text x="570" y="286" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">关键洞察</text>
  <text x="424" y="308" font-size="10.5" fill="#444">① 连续 sl 行模 sl = {0,1,…,sl−1}</text>
  <text x="436" y="324" font-size="10.5" fill="#444">故每个子阵恰含每类一格</text>
  <text x="424" y="348" font-size="10.5" fill="#b85450" font-weight="bold">② 同类两格行差 ≥ sl</text>
  <text x="436" y="364" font-size="10.5" fill="#444">→ 永不共处一子阵，类内无冲突</text>
  <text x="424" y="388" font-size="10.5" fill="#2e8b57" font-weight="bold">③ 填满 k 类 ⇒ 每子阵恰 k 个 1</text>
  <text x="436" y="404" font-size="10.5" fill="#444">k ≤ maxOnes 即合法</text>
</svg>
