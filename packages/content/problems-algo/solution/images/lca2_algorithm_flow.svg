<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">1644 算法流程：后序 DFS + 计数验证</text>

  <!-- Start -->
  <ellipse cx="280" cy="52" rx="90" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="56" text-anchor="middle" font-size="11" fill="#333">count = 0; ans = dfs(root)</text>

  <path d="M 280 70 L 280 84" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Base case -->
  <polygon points="280,88 400,124 280,160 160,124" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="120" text-anchor="middle" font-size="11" fill="#333">root == null ?</text>

  <!-- Yes: return null -->
  <path d="M 400 124 L 470 124" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="435" y="116" text-anchor="middle" font-size="10" fill="#b85450">是</text>
  <ellipse cx="510" cy="124" rx="44" ry="18" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="510" y="128" text-anchor="middle" font-size="11" fill="#888">return null</text>

  <!-- No: recurse -->
  <path d="M 280 160 L 280 174" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="170" font-size="10" fill="#82b366">否</text>

  <!-- Post-order recurse -->
  <rect x="100" y="178" width="360" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="198" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">后序递归（不早返回！）</text>
  <text x="280" y="216" text-anchor="middle" font-size="11" fill="#333">left = dfs(root.left)</text>
  <text x="280" y="230" text-anchor="middle" font-size="11" fill="#333">right = dfs(root.right)</text>

  <path d="M 280 234 L 280 248" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Check root == p or q -->
  <polygon points="280,252 420,292 280,332 140,292" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="286" text-anchor="middle" font-size="11" fill="#333">root == p 或</text>
  <text x="280" y="302" text-anchor="middle" font-size="11" fill="#333">root == q ?</text>

  <!-- Yes: count++ and return root -->
  <path d="M 420 292 L 470 292" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="445" y="284" text-anchor="middle" font-size="10" fill="#82b366">是</text>
  <rect x="470" y="274" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="510" y="290" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">count++</text>
  <text x="510" y="306" text-anchor="middle" font-size="10" fill="#333">return root</text>

  <!-- No: check both non-null -->
  <path d="M 280 332 L 280 346" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="342" font-size="10" fill="#b85450">否</text>

  <polygon points="280,350 400,386 280,422 160,386" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="382" text-anchor="middle" font-size="11" fill="#333">left ≠ null 且</text>
  <text x="280" y="398" text-anchor="middle" font-size="11" fill="#333">right ≠ null ?</text>

  <!-- Yes: LCA -->
  <path d="M 400 386 L 470 386" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="435" y="378" text-anchor="middle" font-size="10" fill="#82b366">是</text>
  <rect x="470" y="370" width="80" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="510" y="388" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">return root</text>
  <text x="510" y="400" text-anchor="middle" font-size="9" fill="#4a7a3a">LCA 候选</text>

  <!-- No: return non-null side -->
  <path d="M 280 422 L 280 436" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="432" font-size="10" fill="#b85450">否</text>

  <rect x="150" y="440" width="260" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="462" text-anchor="middle" font-size="11" fill="#333">return left ? left : right</text>

  <!-- recursion loop back -->
  <path d="M 100 206 L 50 206 L 50 52 L 190 52" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="42" y="130" text-anchor="middle" font-size="9" fill="#888" transform="rotate(-90 42 130)">递归左右子树</text>

  <!-- Post-process: count check -->
  <rect x="60" y="486" width="440" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="504" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">DFS 结束后：count == 2 ? 返回 ans : 返回 null</text>

  <path d="M 280 476 L 280 484" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
