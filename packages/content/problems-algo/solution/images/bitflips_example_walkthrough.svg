<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：start=10, goal=7，翻转 3 次</text>

  <!-- ===== XOR step ===== -->
  <text x="44" y="66" font-size="12" fill="#446688" font-weight="bold">start=10</text>
  <rect x="150" y="48" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="171" y="70" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="200" y="48" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="221" y="70" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <rect x="250" y="48" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="271" y="70" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="300" y="48" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="321" y="70" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>

  <text x="44" y="100" font-size="12" fill="#446688" font-weight="bold">goal=7</text>
  <rect x="150" y="84" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="171" y="103" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>
  <rect x="200" y="84" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="221" y="103" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="250" y="84" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="271" y="103" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="300" y="84" width="42" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="321" y="103" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>

  <text x="108" y="124" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">^</text>
  <line x1="150" y1="118" x2="342" y2="118" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>

  <text x="44" y="142" font-size="12" fill="#b85450" font-weight="bold">x = 13</text>
  <rect x="150" y="126" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="171" y="148" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">1</text>
  <rect x="200" y="126" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="221" y="148" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">1</text>
  <rect x="250" y="126" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="271" y="148" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <rect x="300" y="126" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="321" y="148" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">1</text>
  <text x="356" y="148" font-size="11" fill="#b85450" font-weight="bold">3 个 1 → 数 1</text>

  <!-- arrow to popcount -->
  <path d="M 246 162 Q 246 172 246 180" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="174" font-size="10.5" fill="#888">Brian Kernighan 数 1</text>

  <!-- ===== Row 0: count=0, x=13=1101 ===== -->
  <rect x="34" y="186" width="86" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="77" y="206" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">count = 0</text>
  <text x="140" y="206" font-size="12.5" fill="#446688" font-weight="bold">x = 13</text>
  <rect x="180" y="184" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="201" y="206" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="230" y="184" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="251" y="206" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="280" y="184" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="301" y="206" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <rect x="330" y="184" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="351" y="206" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">1</text>
  <text x="384" y="206" font-size="10.5" fill="#b85450" font-weight="bold">↑ 最低设置位</text>

  <!-- arrow 1 -->
  <path d="M 351 220 Q 351 230 351 238" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="366" y="232" font-size="10.5" fill="#888">x &amp;= x−1</text>

  <!-- ===== Row 1: count=1, x=12=1100 ===== -->
  <rect x="34" y="246" width="86" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="77" y="266" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">count = 1</text>
  <text x="140" y="266" font-size="12.5" fill="#446688" font-weight="bold">x = 12</text>
  <rect x="180" y="244" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="201" y="266" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="230" y="244" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="251" y="266" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="280" y="244" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="301" y="266" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <rect x="330" y="244" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="351" y="266" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">0</text>
  <text x="384" y="266" font-size="10.5" fill="#b85450" font-weight="bold">↑ 最低设置位</text>

  <!-- arrow 2 -->
  <path d="M 251 280 Q 251 290 251 298" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="266" y="292" font-size="10.5" fill="#888">x &amp;= x−1</text>

  <!-- ===== Row 2: count=2, x=8=1000 ===== -->
  <rect x="34" y="306" width="86" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="77" y="326" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">count = 2</text>
  <text x="140" y="326" font-size="12.5" fill="#446688" font-weight="bold">x = 8</text>
  <rect x="180" y="304" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="201" y="326" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">1</text>
  <rect x="230" y="304" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="251" y="326" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <rect x="280" y="304" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="301" y="326" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <rect x="330" y="304" width="42" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="351" y="326" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">0</text>
  <text x="384" y="326" font-size="10.5" fill="#b85450" font-weight="bold">↑ 最低设置位</text>

  <!-- arrow 3 -->
  <path d="M 201 340 Q 201 350 201 358" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="216" y="352" font-size="10.5" fill="#888">x &amp;= x−1</text>

  <!-- ===== Row 3: count=3, x=0=0000 ===== -->
  <rect x="34" y="366" width="86" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="77" y="386" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">count = 3</text>
  <text x="140" y="386" font-size="12.5" fill="#888" font-weight="bold">x = 0</text>
  <rect x="180" y="364" width="42" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="201" y="386" text-anchor="middle" font-size="15" fill="#bbb" font-weight="bold">0</text>
  <rect x="230" y="364" width="42" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="251" y="386" text-anchor="middle" font-size="15" fill="#bbb" font-weight="bold">0</text>
  <rect x="280" y="364" width="42" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="301" y="386" text-anchor="middle" font-size="15" fill="#bbb" font-weight="bold">0</text>
  <rect x="330" y="364" width="42" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="351" y="386" text-anchor="middle" font-size="15" fill="#bbb" font-weight="bold">0</text>
  <text x="384" y="386" font-size="11" fill="#888" font-weight="bold">x = 0，停止 ✓</text>

  <!-- arrow to result -->
  <path d="M 246 400 Q 246 412 246 420" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- result box -->
  <rect x="80" y="426" width="380" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="445" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">异或有 3 个 1 = 需翻转 3 次，返回 3</text>
</svg>
