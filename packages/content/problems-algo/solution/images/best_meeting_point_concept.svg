<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="660" height="440" fill="#fafafa"/>

  <text x="330" y="30" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">曼哈顿距离可分离：行、列各自取中位数即可</text>
  <path d="M 150 40 Q 330 50 510 40" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- ===== Grid (left) ===== -->
  <text x="155" y="76" text-anchor="middle" font-size="11" fill="#888">grid（橙=朋友，绿=碰头点）</text>

  <!-- empty cells (drawn first) -->
  <g filter="url(#rough2)">
    <rect x="92"  y="100" width="42" height="42" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="176" y="100" width="42" height="42" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="50"  y="142" width="42" height="42" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="92"  y="142" width="42" height="42" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="134" y="142" width="42" height="42" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="176" y="142" width="42" height="42" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="218" y="142" width="42" height="42" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="50"  y="184" width="42" height="42" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="92"  y="184" width="42" height="42" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="176" y="184" width="42" height="42" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="3"/>
    <rect x="218" y="184" width="42" height="42" fill="#f4f4f4" stroke="#bbb" stroke-width="1" rx="3"/>
  </g>

  <!-- people cells (orange) -->
  <g filter="url(#rough2)">
    <rect x="50"  y="100" width="42" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="3"/>
    <rect x="218" y="100" width="42" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="3"/>
    <rect x="134" y="184" width="42" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="3"/>
  </g>
  <g font-size="15" text-anchor="middle" font-weight="bold" fill="#b07a20">
    <text x="71"  y="127">1</text>
    <text x="239" y="127">1</text>
    <text x="155" y="211">1</text>
  </g>

  <!-- meeting cell (green) -->
  <g filter="url(#rough2)">
    <rect x="134" y="100" width="42" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.6" rx="3"/>
  </g>
  <text x="155" y="120" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">碰头</text>
  <text x="155" y="134" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">★</text>

  <!-- row labels -->
  <g font-size="10" fill="#888" text-anchor="end">
    <text x="44" y="125">i=0</text>
    <text x="44" y="167">i=1</text>
    <text x="44" y="209">i=2</text>
  </g>
  <!-- col labels -->
  <g font-size="10" fill="#888" text-anchor="middle">
    <text x="71"  y="240">j=0</text>
    <text x="113" y="240">j=1</text>
    <text x="155" y="240">j=2</text>
    <text x="197" y="240">j=3</text>
    <text x="239" y="240">j=4</text>
  </g>

  <!-- distance arrows (orange dashed) from each person to meeting center (155,121) -->
  <path d="M 84 121 L 130 121" stroke="#d6a040" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 226 121 L 180 121" stroke="#d6a040" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 155 180 L 155 142" stroke="#d6a040" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="105" y="115" text-anchor="middle" font-size="9" fill="#b07a20">2</text>
  <text x="205" y="115" text-anchor="middle" font-size="9" fill="#b07a20">2</text>
  <text x="168" y="164" font-size="9" fill="#b07a20">2</text>

  <!-- ===== Right: projections ===== -->
  <!-- Row projection -->
  <text x="430" y="78" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">行坐标投影（i）</text>
  <line x1="320" y1="110" x2="470" y2="110" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <g stroke="#446688" stroke-width="1.2" filter="url(#rough2)">
    <line x1="330" y1="106" x2="330" y2="114"/>
    <line x1="400" y1="106" x2="400" y2="114"/>
    <line x1="470" y1="106" x2="470" y2="114"/>
  </g>
  <g font-size="10" fill="#888" text-anchor="middle">
    <text x="330" y="128">0</text>
    <text x="400" y="128">1</text>
    <text x="470" y="128">2</text>
  </g>
  <!-- people dots at i=0 (two) and i=2 (one) -->
  <g filter="url(#rough2)">
    <circle cx="330" cy="101" r="4" fill="#d6a040" stroke="#b07a20" stroke-width="1"/>
    <circle cx="330" cy="93"  r="4" fill="#d6a040" stroke="#b07a20" stroke-width="1"/>
    <circle cx="470" cy="101" r="4" fill="#d6a040" stroke="#b07a20" stroke-width="1"/>
  </g>
  <text x="330" y="88" text-anchor="middle" font-size="9" fill="#b07a20">×2</text>
  <!-- median i=0 -->
  <line x1="330" y1="86" x2="330" y2="118" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="330" y="148" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">中位数 0</text>

  <!-- Col projection -->
  <text x="430" y="178" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">列坐标投影（j）</text>
  <line x1="300" y1="210" x2="540" y2="210" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <g stroke="#446688" stroke-width="1.2" filter="url(#rough2)">
    <line x1="300" y1="206" x2="300" y2="214"/>
    <line x1="360" y1="206" x2="360" y2="214"/>
    <line x1="420" y1="206" x2="420" y2="214"/>
    <line x1="480" y1="206" x2="480" y2="214"/>
    <line x1="540" y1="206" x2="540" y2="214"/>
  </g>
  <g font-size="10" fill="#888" text-anchor="middle">
    <text x="300" y="228">0</text>
    <text x="360" y="228">1</text>
    <text x="420" y="228">2</text>
    <text x="480" y="228">3</text>
    <text x="540" y="228">4</text>
  </g>
  <!-- people dots at j=0,2,4 -->
  <g filter="url(#rough2)">
    <circle cx="300" cy="201" r="4" fill="#d6a040" stroke="#b07a20" stroke-width="1"/>
    <circle cx="420" cy="201" r="4" fill="#d6a040" stroke="#b07a20" stroke-width="1"/>
    <circle cx="540" cy="201" r="4" fill="#d6a040" stroke="#b07a20" stroke-width="1"/>
  </g>
  <!-- median j=2 -->
  <line x1="420" y1="186" x2="420" y2="218" stroke="#4a7a3a" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="420" y="248" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">中位数 2</text>

  <!-- ===== Bottom formula ===== -->
  <g filter="url(#rough2)">
    <rect x="40" y="300" width="580" height="80" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10"/>
  </g>
  <text x="330" y="328" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">总距离 = Σ|x_i − 中位数_i| + Σ|y_j − 中位数_j|</text>
  <text x="330" y="352" text-anchor="middle" font-size="11" fill="#555">曼哈顿距离天然分离为两个独立的 1D 问题，各自取中位数即最优</text>
  <text x="330" y="370" text-anchor="middle" font-size="10" fill="#888">中位数取的是「朋友的坐标」的中位数，不是网格中心</text>
</svg>
