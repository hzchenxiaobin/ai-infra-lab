<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：对称差 = 只在一张表出现的 id（信息丢失）</text>

  <!-- ===== Employees table (left) ===== -->
  <text x="50" y="54" font-size="10" fill="#888">Employees（姓名表）</text>
  <rect x="40" y="60" width="140" height="120" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="50" y="76" font-size="9" fill="#446688" font-weight="bold">id   name</text>
  <line x1="40" y1="82" x2="180" y2="82" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="98" font-size="9" fill="#b85450" font-weight="bold">2   Crew</text>
  <text x="50" y="118" font-size="9" fill="#4a7a3a">4   Haven</text>
  <text x="50" y="138" font-size="9" fill="#4a7a3a">5   Kristian</text>
  <text x="50" y="166" font-size="8" fill="#888">id 集合 = {2, 4, 5}</text>

  <!-- ===== Salaries table (right) ===== -->
  <text x="380" y="54" font-size="10" fill="#888">Salaries（薪水表）</text>
  <rect x="370" y="60" width="160" height="120" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="380" y="76" font-size="9" fill="#446688" font-weight="bold">id    salary</text>
  <line x1="370" y1="82" x2="530" y2="82" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="380" y="98" font-size="9" fill="#4a7a3a">5    76071</text>
  <text x="380" y="118" font-size="9" fill="#b85450" font-weight="bold">1    22517</text>
  <text x="380" y="138" font-size="9" fill="#4a7a3a">4    63539</text>
  <text x="380" y="166" font-size="8" fill="#888">id 集合 = {1, 4, 5}</text>

  <!-- ===== Venn-like set diagram (middle) ===== -->
  <!-- Employees circle -->
  <ellipse cx="230" cy="250" rx="60" ry="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" opacity="0.7"/>
  <!-- Salaries circle -->
  <ellipse cx="350" cy="250" rx="60" ry="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)" opacity="0.7"/>

  <!-- Left-only (id 2) -->
  <text x="205" y="248" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>
  <text x="205" y="262" text-anchor="middle" font-size="8" fill="#b85450">缺薪</text>
  <!-- Intersection (id 4, 5) -->
  <text x="290" y="248" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4, 5</text>
  <text x="290" y="262" text-anchor="middle" font-size="8" fill="#4a7a3a">完整</text>
  <!-- Right-only (id 1) -->
  <text x="375" y="248" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <text x="375" y="262" text-anchor="middle" font-size="8" fill="#b85450">缺名</text>

  <!-- Set labels -->
  <text x="195" y="210" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">Employees</text>
  <text x="385" y="210" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">Salaries</text>

  <!-- Arrows from tables to set -->
  <path d="M 110 180 C 110 210, 180 215, 205 230" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)" opacity="0.6" stroke-dasharray="3,2"/>
  <path d="M 450 180 C 450 210, 380 215, 355 230" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)" opacity="0.6" stroke-dasharray="3,2"/>

  <!-- ===== Symmetric difference → result ===== -->
  <path d="M 205 268 L 205 300 L 110 300 L 110 326" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 375 268 L 375 300 L 110 300" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)" opacity="0.5"/>

  <!-- HAVING box -->
  <rect x="40" y="330" width="180" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="130" y="350" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">UNION ALL + GROUP BY</text>
  <text x="130" y="366" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">HAVING COUNT(*) = 1</text>

  <!-- Arrow to result -->
  <path d="M 220 352 L 290 352" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Result table -->
  <rect x="294" y="322" width="120" height="64" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="354" y="338" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">employee_id</text>
  <line x1="294" y1="344" x2="414" y2="344" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="354" y="360" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="354" y="376" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>

  <!-- ===== Bottom note ===== -->
  <rect x="30" y="396" width="530" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="295" y="416" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">两表都出现 → COUNT=2（完整）；只出现一次 → COUNT=1（信息丢失）</text>

  <!-- ===== Legend ===== -->
  <rect x="430" y="330" width="120" height="56" fill="#fff" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="440" y="346" font-size="9" fill="#4a7a3a">绿：两表都有（完整）</text>
  <text x="440" y="360" font-size="9" fill="#b85450">红：仅一张表（丢失）</text>
  <text x="440" y="376" font-size="8" fill="#888">对称差 = 两集合差集的并</text>
</svg>
