<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <text x="310" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">示例演算：s = abaccdbbd，k = 3，n = 9</text>

  <!-- table outer frame -->
  <rect x="30" y="50" width="560" height="270" fill="none" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>

  <!-- column dividers & header -->
  <line x1="30" y1="80" x2="590" y2="80" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="90" y1="50" x2="90" y2="320" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="300" y1="50" x2="300" y2="320" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="380" y1="50" x2="380" y2="320" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- header text -->
  <text x="60" y="71" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="195" y="71" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">前缀 s[0..i−1]</text>
  <text x="340" y="71" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">dp[i]</text>
  <text x="485" y="71" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">关键转移</text>

  <!-- row separators -->
  <line x1="30" y1="103" x2="590" y2="103" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="30" y1="125" x2="590" y2="125" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="30" y1="147" x2="590" y2="147" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="30" y1="169" x2="590" y2="169" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="30" y1="191" x2="590" y2="191" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="30" y1="213" x2="590" y2="213" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="30" y1="235" x2="590" y2="235" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="30" y1="257" x2="590" y2="257" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="30" y1="279" x2="590" y2="279" stroke="#ddd" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- highlight rows: i=3 (blue), i=9 (red) -->
  <rect x="30" y="147" width="560" height="22" fill="#e8f0fe" opacity="0.7" filter="url(#rough2)"/>
  <rect x="30" y="279" width="560" height="22" fill="#fce4ec" opacity="0.7" filter="url(#rough2)"/>

  <!-- row data. Each row baseline y = top+15 -->
  <!-- i=0  y 88 -->
  <text x="60" y="99" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="195" y="99" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">（空）</text>
  <text x="340" y="99" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="485" y="99" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">基准 dp[0]=0</text>

  <!-- i=1  y 121 -->
  <text x="60" y="121" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="195" y="121" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a</text>
  <text x="340" y="121" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="485" y="121" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">i&lt;k，无长度≥3 回文</text>

  <!-- i=2  y 143 -->
  <text x="60" y="143" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <text x="195" y="143" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">ab</text>
  <text x="340" y="143" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">0</text>
  <text x="485" y="143" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">承接 dp[1]</text>

  <!-- i=3  y 165  (aba) -->
  <text x="60" y="165" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="195" y="165" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">aba</text>
  <text x="340" y="165" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="485" y="165" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">★选 s[0..2]=aba，dp[0]+1=1</text>

  <!-- i=4  y 187 -->
  <text x="60" y="187" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>
  <text x="195" y="187" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">abac</text>
  <text x="340" y="187" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="485" y="187" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">承接 dp[3]</text>

  <!-- i=5  y 209 -->
  <text x="60" y="209" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <text x="195" y="209" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">abacc</text>
  <text x="340" y="209" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="485" y="209" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">承接 dp[4]</text>

  <!-- i=6  y 231 -->
  <text x="60" y="231" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <text x="195" y="231" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">abaccd</text>
  <text x="340" y="231" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="485" y="231" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">承接 dp[5]</text>

  <!-- i=7  y 253 -->
  <text x="60" y="253" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">7</text>
  <text x="195" y="253" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">abaccdb</text>
  <text x="340" y="253" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="485" y="253" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">承接 dp[6]</text>

  <!-- i=8  y 275 -->
  <text x="60" y="275" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8</text>
  <text x="195" y="275" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">abaccdbb</text>
  <text x="340" y="275" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <text x="485" y="275" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">承接 dp[7]</text>

  <!-- i=9  y 297  (dbbd) -->
  <text x="60" y="297" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="195" y="297" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">abaccdbbd</text>
  <text x="340" y="297" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="485" y="297" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">★选 s[5..8]=dbbd，dp[5]+1=2</text>

  <!-- answer note -->
  <rect x="120" y="334" width="380" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="310" y="356" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">答案 dp[9] = 2 ✓  （aba 与 dbbd 互不重叠）</text>
</svg>
