<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：sentence = "I speak Goat Latin"</text>

  <!-- table header -->
  <rect x="30" y="44" width="560" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="55" y="62" font-size="11" fill="#446688" font-weight="bold">索引</text>
  <text x="120" y="62" font-size="11" fill="#446688" font-weight="bold">原词</text>
  <text x="190" y="62" font-size="11" fill="#446688" font-weight="bold">首字母</text>
  <text x="260" y="62" font-size="11" fill="#446688" font-weight="bold">变换体</text>
  <text x="430" y="62" font-size="11" fill="#446688" font-weight="bold">追加 a</text>
  <text x="530" y="62" font-size="11" fill="#446688" font-weight="bold">结果</text>

  <!-- Row 1: I -->
  <g font-size="11" filter="url(#rough2)">
    <rect x="30" y="76" width="560" height="40" fill="#e6f4ea" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="55" y="100" fill="#333" font-weight="bold">1</text>
    <text x="120" y="100" fill="#333" font-weight="bold">I</text>
    <text x="190" y="100" fill="#4a7a3a" font-weight="bold">元音</text>
    <text x="260" y="100" fill="#333">I + ma</text>
    <text x="430" y="100" fill="#d6a040" font-weight="bold">a ×1</text>
    <text x="530" y="94" fill="#b85450" font-weight="bold">Imaa</text>
    <text x="530" y="108" font-size="9" fill="#888">I·ma·a</text>
  </g>

  <!-- Row 2: speak -->
  <g font-size="11" filter="url(#rough2)">
    <rect x="30" y="120" width="560" height="40" fill="#fce4ec" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="55" y="144" fill="#333" font-weight="bold">2</text>
    <text x="120" y="144" fill="#333" font-weight="bold">speak</text>
    <text x="190" y="144" fill="#b85450" font-weight="bold">辅音 s</text>
    <text x="260" y="144" fill="#333">peak + s + ma</text>
    <text x="430" y="144" fill="#d6a040" font-weight="bold">a ×2</text>
    <text x="530" y="138" fill="#b85450" font-weight="bold">peaksmaaa</text>
    <text x="530" y="152" font-size="9" fill="#888">peak·s·ma·aa</text>
  </g>

  <!-- Row 3: Goat -->
  <g font-size="11" filter="url(#rough2)">
    <rect x="30" y="164" width="560" height="40" fill="#fce4ec" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="55" y="188" fill="#333" font-weight="bold">3</text>
    <text x="120" y="188" fill="#333" font-weight="bold">Goat</text>
    <text x="190" y="188" fill="#b85450" font-weight="bold">辅音 G</text>
    <text x="260" y="188" fill="#333">oat + G + ma</text>
    <text x="430" y="188" fill="#d6a040" font-weight="bold">a ×3</text>
    <text x="530" y="182" fill="#b85450" font-weight="bold">oatGmaaaa</text>
    <text x="530" y="196" font-size="9" fill="#888">oat·G·ma·aaa</text>
  </g>

  <!-- Row 4: Latin -->
  <g font-size="11" filter="url(#rough2)">
    <rect x="30" y="208" width="560" height="40" fill="#fce4ec" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="55" y="232" fill="#333" font-weight="bold">4</text>
    <text x="120" y="232" fill="#333" font-weight="bold">Latin</text>
    <text x="190" y="232" fill="#b85450" font-weight="bold">辅音 L</text>
    <text x="260" y="232" fill="#333">atin + L + ma</text>
    <text x="430" y="232" fill="#d6a040" font-weight="bold">a ×4</text>
    <text x="530" y="226" fill="#b85450" font-weight="bold">atinLmaaaaa</text>
    <text x="530" y="240" font-size="9" fill="#888">atin·L·ma·aaaa</text>
  </g>

  <!-- legend -->
  <text x="30" y="270" font-size="10" fill="#888">绿行=元音开头(原样+ma)；红行=辅音开头(移首字母+ma)；橙=追加索引个 a</text>

  <!-- detail: consonant move -->
  <rect x="30" y="284" width="560" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="46" y="304" font-size="11" fill="#d6a040" font-weight="bold">辅音词变换细节（以 Goat 为例）：</text>
  <rect x="60" y="312" width="56" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="88" y="328" text-anchor="middle" font-size="11" fill="#333">Goat</text>
  <path d="M 120 323 L 150 323" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="156" y="312" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="176" y="328" text-anchor="middle" font-size="11" fill="#333">oat</text>
  <rect x="198" y="312" width="24" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="328" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">G</text>
  <text x="232" y="328" font-size="11" fill="#888">首字母 G 移到末尾</text>
  <rect x="390" y="312" width="30" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="405" y="328" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">ma</text>
  <rect x="424" y="312" width="40" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="444" y="328" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">aaa</text>
  <text x="472" y="328" font-size="10" fill="#888">→ oatGmaaaa</text>

  <!-- result -->
  <path d="M 310 340 L 310 356" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="360" width="500" height="36" fill="#446688" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="310" y="382" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">结果："Imaa peaksmaaa oatGmaaaa atinLmaaaaa"</text>

  <!-- takeaway -->
  <rect x="30" y="404" width="560" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="46" y="422" font-size="11" fill="#4a7a3a" font-weight="bold">关键：元音词原样保留，辅音词首字母移末尾；统一加 "ma" 后再追加索引个 "a"。</text>
</svg>
