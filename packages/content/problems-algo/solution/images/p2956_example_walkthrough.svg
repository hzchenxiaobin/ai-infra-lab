  <text x="260" y="50" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">s1 = {1,2,3,4}，s2 = {2,3,5,6}（先各自去重）</text>

  <!-- table A label -->
  <text x="260" y="76" text-anchor="middle" font-size="12" fill="#33476b" font-weight="bold" filter="url(#rough2)">第一趟：扫 nums1，逐个查 s2 → answer1</text>

