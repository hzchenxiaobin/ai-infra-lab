<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">Rabin-Karp 滚动哈希 + 双模数</text>
  <text x="300" y="48" text-anchor="middle" font-size="11" fill="#888">窗口右移 1 位：去掉最左 out，加入最右 in，哈希 O(1) 增量更新</text>

  <!-- ===== 字符串与两个窗口 ===== -->
  <text x="40" y="84" font-size="11" fill="#666">字符串 s：</text>
  <g font-size="11">
    <rect x="90" y="70" width="34" height="28" fill="#eee" stroke="#bbb" rx="3" filter="url(#rough2)"/>
    <text x="107" y="89" text-anchor="middle" fill="#888">…</text>
    <rect x="124" y="70" width="34" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="141" y="89" text-anchor="middle" fill="#b85450" font-weight="bold">out</text>
    <rect x="158" y="70" width="34" height="28" fill="#e8f0fe" stroke="#446688" rx="3" filter="url(#rough2)"/>
    <text x="175" y="89" text-anchor="middle" fill="#446688" font-weight="bold">·</text>
    <rect x="192" y="70" width="34" height="28" fill="#e8f0fe" stroke="#446688" rx="3" filter="url(#rough2)"/>
    <text x="209" y="89" text-anchor="middle" fill="#446688" font-weight="bold">·</text>
    <rect x="226" y="70" width="34" height="28" fill="#e8f0fe" stroke="#446688" rx="3" filter="url(#rough2)"/>
    <text x="243" y="89" text-anchor="middle" fill="#446688" font-weight="bold">·</text>
    <rect x="260" y="70" width="34" height="28" fill="#e8f0fe" stroke="#446688" rx="3" filter="url(#rough2)"/>
    <text x="277" y="89" text-anchor="middle" fill="#446688" font-weight="bold">·</text>
    <rect x="294" y="70" width="34" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="311" y="89" text-anchor="middle" fill="#4a7a3a" font-weight="bold">in</text>
    <rect x="328" y="70" width="34" height="28" fill="#eee" stroke="#bbb" rx="3" filter="url(#rough2)"/>
    <text x="345" y="89" text-anchor="middle" fill="#888">…</text>
  </g>

  <!-- 窗口 i 括号 -->
  <path d="M 124 104 L 124 112 L 294 112 L 294 104" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="209" y="126" text-anchor="middle" font-size="10" fill="#446688">窗口 i：长度 L，哈希 hash(i)</text>

  <!-- 窗口 i+1 括号 -->
  <path d="M 158 134 L 158 142 L 328 142 L 328 134" stroke="#4a7a3a" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="243" y="156" text-anchor="middle" font-size="10" fill="#4a7a3a">窗口 i+1：右移 1 位，哈希 hash(i+1)</text>

  <text x="141" y="172" text-anchor="middle" font-size="9" fill="#b85450">↑移出</text>
  <text x="311" y="172" text-anchor="middle" font-size="9" fill="#4a7a3a">↑移入</text>

  <!-- ===== 滚动公式 ===== -->
  <rect x="40" y="184" width="520" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="206" font-size="12" fill="#2a4a66" font-weight="bold">滚动公式（基数 b = 26，最高位字符系数 b^(L−1)）：</text>
  <text x="60" y="230" font-size="12" fill="#333" font-family="monospace">hash(i+1) = ( ( hash(i) − out · b^(L−1) ) · b + in )  mod M</text>
  <text x="60" y="252" font-size="10" fill="#666">• 减去移出字符 out 的贡献（out · b^(L−1)），再整体 ×b 左移，最后加上移入字符 in</text>
  <text x="60" y="266" font-size="10" fill="#666">• 预计算 pow = b^(L−1) mod M 后，每步仅 1 次乘、1 次减、1 次加、2 次取模 → O(1)</text>

  <!-- ===== 双模数 ===== -->
  <rect x="40" y="288" width="290" height="128" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="310" font-size="12" fill="#3a5a2a" font-weight="bold">双哈希：两组 (MOD, h) 并行</text>
  <text x="60" y="330" font-size="10" fill="#555" font-family="monospace">MOD1 = 1e9+7,  MOD2 = 1e9+9</text>
  <text x="60" y="348" font-size="10" fill="#555" font-family="monospace">key = h1 · MOD2 + h2</text>
  <text x="60" y="368" font-size="10" fill="#666">单模数冲突概率 ~ n/MOD ≈ 3e4/1e9</text>
  <text x="60" y="384" font-size="10" fill="#666">双模数冲突概率 ~ n²/(MOD1·MOD2) ≈ 1e-9</text>
  <text x="60" y="402" font-size="10" fill="#3a5a2a" font-weight="bold">→ 冲突可忽略，无需逐字符核对</text>

  <!-- 哈希表 -->
  <rect x="350" y="288" width="210" height="128" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="455" y="310" text-anchor="middle" font-size="12" fill="#7a5a20" font-weight="bold">哈希表 key → 首次位置</text>
  <text x="362" y="332" font-size="10" fill="#446688" font-family="monospace">key₁  →  p</text>
  <text x="362" y="350" font-size="10" fill="#4a7a3a" font-family="monospace">key₂  →  q</text>
  <text x="362" y="372" font-size="10" fill="#b85450" font-family="monospace" font-weight="bold">key₁ 再现 → 命中！</text>
  <text x="362" y="392" font-size="10" fill="#666">s[p..p+L−1] 与 s[i..i+L−1]</text>
  <text x="362" y="406" font-size="10" fill="#b85450" font-weight="bold">视为相同 → 返回 p</text>
  <line x1="330" y1="352" x2="350" y2="352" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="3 2" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
