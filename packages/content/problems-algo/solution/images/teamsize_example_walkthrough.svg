<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：按 team_id 分区 → COUNT 广播 → 按 emp_id 排序</text>

  <!-- Step 1: Input table -->
  <text x="95" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① 输入 Employee</text>
  <rect x="40" y="64" width="110" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="80" font-size="10" fill="#446688" font-weight="bold">emp_id</text>
  <text x="120" y="80" font-size="10" fill="#446688" font-weight="bold">team_id</text>
  <line x1="90" y1="64" x2="90" y2="88" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="40" y="88" width="110" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="103" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="120" y="103" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>
  <line x1="90" y1="88" x2="90" y2="108" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="40" y="108" width="110" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="123" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">2</text>
  <text x="120" y="123" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">1</text>
  <line x1="90" y1="108" x2="90" y2="128" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="40" y="128" width="110" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="143" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3</text>
  <text x="120" y="143" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3</text>
  <line x1="90" y1="128" x2="90" y2="148" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="40" y="148" width="110" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="163" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">4</text>
  <text x="120" y="163" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3</text>
  <line x1="90" y1="148" x2="90" y2="168" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="40" y="168" width="110" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="183" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="120" y="183" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>
  <line x1="90" y1="168" x2="90" y2="188" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="40" y="188" width="110" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="203" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">6</text>
  <text x="120" y="203" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>
  <line x1="90" y1="188" x2="90" y2="208" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="40" y="208" width="110" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="223" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">7</text>
  <text x="120" y="223" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">1</text>
  <line x1="90" y1="208" x2="90" y2="228" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- arrow step1 -> step2 -->
  <path d="M150 144 L188 144" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="169" y="138" text-anchor="middle" font-size="9" fill="#d6a040">PARTITION</text>

  <!-- Step 2: partitioned groups -->
  <text x="320" y="56" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">② 按 team_id 分区并 COUNT</text>

  <!-- team 2 (green) group -->
  <text x="240" y="82" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">team_id=2</text>
  <rect x="200" y="88" width="80" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="220" y="104" text-anchor="middle" font-size="9.5" fill="#4a7a3a">1</text>
  <text x="240" y="104" text-anchor="middle" font-size="9.5" fill="#4a7a3a">5</text>
  <text x="260" y="104" text-anchor="middle" font-size="9.5" fill="#4a7a3a">6</text>
  <rect x="210" y="116" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="240" y="131" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">COUNT=3</text>

  <!-- team 1 (blue) group -->
  <text x="340" y="82" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">team_id=1</text>
  <rect x="300" y="88" width="80" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="325" y="104" text-anchor="middle" font-size="9.5" fill="#446688">2</text>
  <text x="355" y="104" text-anchor="middle" font-size="9.5" fill="#446688">7</text>
  <rect x="310" y="116" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="340" y="131" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">COUNT=2</text>

  <!-- team 3 (red) group -->
  <text x="440" y="82" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">team_id=3</text>
  <rect x="400" y="88" width="80" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="425" y="104" text-anchor="middle" font-size="9.5" fill="#b85450">3</text>
  <text x="455" y="104" text-anchor="middle" font-size="9.5" fill="#b85450">4</text>
  <rect x="410" y="116" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="440" y="131" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">COUNT=2</text>

  <!-- broadcast note -->
  <rect x="200" y="156" width="280" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="340" y="174" text-anchor="middle" font-size="10" fill="#333">每个 COUNT 值广播回分区内所有行（不收缩）</text>

  <!-- arrow step2 -> step3 -->
  <path d="M340 182 L340 200" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="372" y="194" font-size="9" fill="#d6a040">ORDER BY emp_id</text>

  <!-- Step 3: Output table -->
  <text x="320" y="216" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">③ 输出（emp_id 升序）</text>
  <rect x="240" y="224" width="160" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="285" y="240" font-size="10" fill="#4a7a3a" font-weight="bold">emp_id</text>
  <text x="355" y="240" font-size="10" fill="#d6a040" font-weight="bold">team_size</text>
  <line x1="320" y1="224" x2="320" y2="248" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="240" y="248" width="160" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="285" y="263" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="355" y="263" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">3</text>
  <line x1="320" y1="248" x2="320" y2="268" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="240" y="268" width="160" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="285" y="283" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">2</text>
  <text x="355" y="283" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">2</text>
  <line x1="320" y1="268" x2="320" y2="288" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="240" y="288" width="160" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="285" y="303" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3</text>
  <text x="355" y="303" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">2</text>
  <line x1="320" y1="288" x2="320" y2="308" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="240" y="308" width="160" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="285" y="323" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">4</text>
  <text x="355" y="323" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">2</text>
  <line x1="320" y1="308" x2="320" y2="328" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="240" y="328" width="160" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="285" y="343" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="355" y="343" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">3</text>
  <line x1="320" y1="328" x2="320" y2="348" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="240" y="348" width="160" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="285" y="363" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">6</text>
  <text x="355" y="363" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">3</text>
  <line x1="320" y1="348" x2="320" y2="368" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="240" y="368" width="160" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="285" y="383" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">7</text>
  <text x="355" y="383" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">2</text>
  <line x1="320" y1="368" x2="320" y2="388" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- bottom note -->
  <rect x="20" y="402" width="520" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="40" y="421" font-size="10" fill="#333">同 team_id 染同色：team 2（绿）→ size 3；team 1（蓝）/ team 3（红）→ size 2。广播后行数不变，仅追加列。</text>
</svg>
