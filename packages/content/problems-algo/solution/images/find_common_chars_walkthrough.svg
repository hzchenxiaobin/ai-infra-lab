<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：words = [&quot;bella&quot;,&quot;label&quot;,&quot;roller&quot;]</text>

  <!-- 表头 -->
  <rect x="30" y="44" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">阶段</text>
  <rect x="110" y="44" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">a</text>
  <rect x="170" y="44" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">b</text>
  <rect x="230" y="44" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">e</text>
  <rect x="290" y="44" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">l</text>
  <rect x="350" y="44" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">o</text>
  <rect x="410" y="44" width="60" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="440" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">r</text>
  <rect x="470" y="44" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="510" y="62" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">说明</text>

  <!-- Row: 初始化 = freq(bella) -->
  <rect x="30" y="74" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="70" y="92" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">= bella</text>
  <rect x="110" y="74" width="60" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="140" y="92" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="170" y="74" width="60" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="200" y="92" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="230" y="74" width="60" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="260" y="92" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="290" y="74" width="60" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="320" y="92" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="350" y="74" width="60" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="380" y="92" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="410" y="74" width="60" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="440" y="92" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="470" y="74" width="80" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="510" y="92" text-anchor="middle" font-size="9.5" fill="#888">minFreq ← 首词</text>

  <!-- Row: min label -->
  <rect x="30" y="106" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="124" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">min label</text>
  <rect x="110" y="106" width="60" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="140" y="124" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="170" y="106" width="60" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="200" y="124" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="230" y="106" width="60" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="260" y="124" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="290" y="106" width="60" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="320" y="124" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="350" y="106" width="60" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="380" y="124" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="410" y="106" width="60" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="440" y="124" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="470" y="106" width="80" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="510" y="124" text-anchor="middle" font-size="9.5" fill="#888">freq 相同，不变</text>

  <!-- Row: min roller -->
  <rect x="30" y="138" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="156" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">min roller</text>
  <rect x="110" y="138" width="60" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="140" y="156" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="170" y="138" width="60" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="200" y="156" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="230" y="138" width="60" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="260" y="156" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <rect x="290" y="138" width="60" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="320" y="156" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <rect x="350" y="138" width="60" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="380" y="156" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="410" y="138" width="60" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="440" y="156" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="470" y="138" width="80" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="510" y="156" text-anchor="middle" font-size="9.5" fill="#888">a/b 被 roller 清零</text>

  <!-- 最终 minFreq 高亮行 -->
  <rect x="30" y="174" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="194" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">最终</text>
  <rect x="110" y="174" width="60" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="140" y="194" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="170" y="174" width="60" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="200" y="194" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="230" y="174" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="260" y="194" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1 ⭐</text>
  <rect x="290" y="174" width="60" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="320" y="194" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2 ⭐</text>
  <rect x="350" y="174" width="60" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="380" y="194" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="410" y="174" width="60" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="440" y="194" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="470" y="174" width="80" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="510" y="194" text-anchor="middle" font-size="9.5" fill="#888">只 e, l 留存</text>

  <!-- 展开箭头 -->
  <path d="M 290 206 L 290 228" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="220" y="210" width="140" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="222" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">展开 minFreq &gt; 0 的字母</text>

  <!-- 结果框 -->
  <rect x="100" y="232" width="380" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="258" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">e×1 + l×2 = [&quot;e&quot;,&quot;l&quot;,&quot;l&quot;]</text>

  <!-- 示例 2 -->
  <rect x="50" y="290" width="480" height="64" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="290" y="310" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">示例 2：[&quot;cool&quot;,&quot;lock&quot;,&quot;cook&quot;]</text>
  <text x="290" y="326" text-anchor="middle" font-size="10.5" fill="#888">cool: c=1 o=2 l=1　lock: l=1 o=1 c=1 k=1　cook: c=2 o=1 k=1</text>
  <text x="290" y="342" text-anchor="middle" font-size="10.5" fill="#888">minFreq = c=1, o=1 → [&quot;c&quot;,&quot;o&quot;]</text>

  <!-- 易错提示 -->
  <rect x="50" y="368" width="480" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="70" y="388" font-size="11" fill="#d6a040" font-weight="bold">⚠️ 易错点</text>
  <text x="70" y="406" font-size="10.5" fill="#333">· 「包括重复字符」：l 出现 2 次 ⇒ 输出两个 &quot;l&quot;，不是去重</text>
  <text x="70" y="422" font-size="10.5" fill="#333">· 不能只看「是否出现」，要看「最少出现几次」，故用 min 而非交集布尔</text>
  <text x="70" y="438" font-size="10.5" fill="#333">· 初始化用第一个单词，避免对空数组额外处理（题目保证 words ≥ 1）</text>
</svg>
