<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrOrange" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">时间轴是环形：最小差来自「排序后相邻」或「首尾跨午夜」</text>

  <!-- ============ 左：环形时间轴 ============ -->
  <text x="40" y="56" font-size="12" fill="#888">环形时间轴（一天 = 1440 分钟）：</text>

  <!-- 完整圆（淡虚线） -->
  <circle cx="150" cy="195" r="70" fill="none" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- 长弧 1439 min（灰色，从 00:00 顺时针绕一大圈到 23:59） -->
  <path d="M 162 126 A 70 70 0 1 1 138 126" fill="none" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="278" text-anchor="middle" font-size="10" fill="#888">长弧 1439 min（线性方向）</text>

  <!-- 短弧 1 min（红色，跨午夜） -->
  <path d="M 138 126 A 70 70 0 0 1 162 126" fill="none" stroke="#b85450" stroke-width="3" filter="url(#rough2)"/>
  <text x="150" y="110" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">1 min（跨午夜）</text>

  <!-- 时间点圆点 23:59 / 00:00 -->
  <circle cx="138" cy="126" r="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="108" y="122" font-size="10" fill="#d6a040" font-weight="bold">23:59</text>
  <text x="108" y="134" font-size="9" fill="#888">(1439)</text>

  <circle cx="162" cy="126" r="5" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="170" y="122" font-size="10" fill="#d6a040" font-weight="bold">00:00</text>
  <text x="170" y="134" font-size="9" fill="#888">(0)</text>

  <!-- 午夜标记 -->
  <text x="150" y="160" text-anchor="middle" font-size="9" fill="#bbb">↑ 午夜 0/1440</text>

  <!-- ============ 右：两类候选 + 取最小 ============ -->
  <text x="300" y="56" font-size="12" fill="#888">排序后只需看两类候选：</text>

  <!-- ① 相邻差 -->
  <rect x="300" y="68" width="250" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="312" y="86" font-size="11" fill="#333" font-weight="bold">① 排序后相邻差 a[i] − a[i−1]</text>
  <!-- mini sorted [0, 1439] -->
  <rect x="320" y="96" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="337" y="111" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">0</text>
  <path d="M 356 107 L 378 107" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="380" y="96" width="44" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="402" y="111" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">1439</text>
  <rect x="434" y="96" width="56" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="462" y="111" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">= 1439</text>

  <!-- ② 首尾环形 -->
  <rect x="300" y="142" width="250" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="312" y="160" font-size="11" fill="#333" font-weight="bold">② 首尾环形 1440 − a[n−1] + a[0]</text>
  <rect x="320" y="170" width="34" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="337" y="185" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">0</text>
  <rect x="380" y="170" width="44" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="402" y="185" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">1439</text>
  <!-- 跨午夜弧形箭头：从 1439 上方绕回 0 -->
  <path d="M 402 170 C 402 152, 337 152, 337 170" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="369" y="150" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">跨午夜</text>
  <rect x="434" y="170" width="56" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="462" y="185" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">= 1</text>

  <!-- 取最小 -->
  <text x="300" y="226" font-size="12" fill="#333">取最小：</text>
  <rect x="350" y="214" width="200" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="450" y="232" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">min(1439, 1) = 1 ✓</text>

  <!-- ============ 底部：核心结论 ============ -->
  <rect x="30" y="300" width="520" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="50" y="324" font-size="12" fill="#333" font-weight="bold">核心：分钟值升序排序 ⇒ 最小差 = min{相邻差, 首尾跨午夜差}</text>
  <text x="50" y="344" font-size="11" fill="#555">扫描相邻 a[i]−a[i−1] + 单独算 1440+a[0]−a[n−1]，两类取 min，O(n)</text>
  <text x="50" y="360" font-size="11" fill="#b85450" font-weight="bold">⚠️ 漏掉首尾环形会把 1 错答成 1439</text>
</svg>
