<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：s = "aba"，dp 表逐格填充</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">行 i 列 j（仅上三角 i ≤ j），答案 dp[0][2] = 2</text>

  <!-- ===== dp table 3x3 ===== -->
  <!-- header row: j=0(a) j=1(b) j=2(a) -->
  <text x="120" y="86" text-anchor="middle" font-size="11" fill="#888">j→</text>
  <rect x="150" y="70" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="185" y="89" text-anchor="middle" font-size="10.5" fill="#3a4a66">0 (a)</text>
  <rect x="220" y="70" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="255" y="89" text-anchor="middle" font-size="10.5" fill="#3a4a66">1 (b)</text>
  <rect x="290" y="70" width="70" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="325" y="89" text-anchor="middle" font-size="10.5" fill="#3a4a66">2 (a)</text>

  <!-- row i=0 (a) -->
  <rect x="80" y="100" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="115" y="120" text-anchor="middle" font-size="10.5" fill="#3a4a66">i=0 (a)</text>
  <rect x="150" y="100" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="185" y="121" text-anchor="middle" font-size="13" fill="#3a5a2a" font-weight="bold">1</text>
  <rect x="220" y="100" width="70" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="121" text-anchor="middle" font-size="13" fill="#6a4a10">2</text>
  <rect x="290" y="100" width="70" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="325" y="121" text-anchor="middle" font-size="13" fill="#7a3a3a" font-weight="bold">2</text>

  <!-- row i=1 (b) -->
  <rect x="80" y="132" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="115" y="152" text-anchor="middle" font-size="10.5" fill="#3a4a66">i=1 (b)</text>
  <rect x="150" y="132" width="70" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="2,2" rx="4" filter="url(#rough2)"/>
  <text x="185" y="153" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <rect x="220" y="132" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="153" text-anchor="middle" font-size="13" fill="#3a5a2a" font-weight="bold">1</text>
  <rect x="290" y="132" width="70" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="325" y="153" text-anchor="middle" font-size="13" fill="#6a4a10">2</text>

  <!-- row i=2 (a) -->
  <rect x="80" y="164" width="70" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="115" y="184" text-anchor="middle" font-size="10.5" fill="#3a4a66">i=2 (a)</text>
  <rect x="150" y="164" width="70" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="2,2" rx="4" filter="url(#rough2)"/>
  <text x="185" y="185" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <rect x="220" y="164" width="70" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="2,2" rx="4" filter="url(#rough2)"/>
  <text x="255" y="185" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <rect x="290" y="164" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="325" y="185" text-anchor="middle" font-size="13" fill="#3a5a2a" font-weight="bold">1</text>

  <!-- ===== key fill steps ===== -->
  <text x="380" y="86" font-size="11" fill="#446688" font-weight="bold">关键填表步骤</text>

  <rect x="380" y="94" width="160" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="388" y="108" font-size="9.5" fill="#3a5a2a">dp[0][0]=1：单字符</text>
  <text x="388" y="121" font-size="9.5" fill="#3a5a2a">dp[1][1]=dp[2][2]=1</text>

  <rect x="380" y="134" width="160" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="388" y="148" font-size="9.5" fill="#6a4a10">dp[0][1]：a≠b，默认</text>
  <text x="388" y="161" font-size="9.5" fill="#6a4a10">=dp[0][0]+1=2</text>

  <rect x="380" y="174" width="160" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="388" y="189" font-size="9.5" fill="#7a3a3a" font-weight="bold">dp[0][2]：s[0]==s[2]</text>
  <text x="388" y="202" font-size="9.5" fill="#7a3a3a">默认 dp[0][1]+1=3</text>
  <text x="388" y="215" font-size="9.5" fill="#7a3a3a">合并 k=0：1+dp[1][1]=2 ✓</text>

  <!-- arrow from key box to dp[0][2] -->
  <path d="M 380 199 L 360 116" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== conclusion ===== -->
  <rect x="30" y="232" width="500" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="45" y="254" font-size="11.5" fill="#3a5a2a" font-weight="bold">结论：dp[0][2] = 2</text>
  <text x="45" y="274" font-size="10.5" fill="#3a5a2a">第 1 轮涂 "aaa" 覆盖整段；第 2 轮在中间涂 "b" 覆盖原 a → 得到 "aba"。</text>
  <text x="45" y="290" font-size="10.5" fill="#3a5a2a">关键：s[0]==s[2] 让两端的 a 共用第 1 轮，中间 b 单独 1 轮，共 2 轮。</text>

  <!-- footer -->
  <rect x="30" y="320" width="500" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.1" rx="8" filter="url(#rough2)"/>
  <text x="45" y="337" font-size="10.5" fill="#6a4a10" font-weight="bold">每个 (i,j) 内层枚举 k ∈ [i,j-1]，共 O(n³)；n ≤ 100 时约 10⁶，足够。</text>
</svg>
