<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：JOIN 贴团队标签 → 每个团队一条均值线 → 逐行比大小</text>

  <!-- Project 表 -->
  <text x="24" y="37" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">Project（分配流水）</text>
  <rect x="24" y="42" width="228" height="86" fill="#ffffff" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <path d="M 24 60 L 252 60" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="58" y="55" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">project_id</text>
  <text x="131" y="55" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">employee_id</text>
  <text x="211" y="55" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">workload</text>
  <path d="M 92 60 L 92 128" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <path d="M 170 60 L 170 128" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="58" y="74" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="131" y="74" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="211" y="74" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">45</text>
  <path d="M 24 78 L 252 78" stroke="#c9d6e8" stroke-width="0.7" filter="url(#rough2)"/>
  <text x="58" y="92" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="131" y="92" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="211" y="92" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">90</text>
  <path d="M 24 96 L 252 96" stroke="#c9d6e8" stroke-width="0.7" filter="url(#rough2)"/>
  <text x="58" y="110" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="131" y="110" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="211" y="110" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">12</text>
  <path d="M 24 114 L 252 114" stroke="#c9d6e8" stroke-width="0.7" filter="url(#rough2)"/>
  <text x="58" y="125" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="131" y="125" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="211" y="125" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">68</text>

  <!-- Employees 表 -->
  <text x="268" y="37" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Employees（花名册）</text>
  <rect x="268" y="42" width="228" height="86" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <path d="M 268 60 L 496 60" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="312" y="55" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">employee_id</text>
  <text x="388" y="55" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">name</text>
  <text x="458" y="55" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">team</text>
  <path d="M 356 60 L 356 128" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <path d="M 420 60 L 420 128" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="312" y="74" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">1</text>
  <text x="388" y="74" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">Khaled</text>
  <rect x="445" y="64" width="26" height="13" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="458" y="74" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">A</text>
  <path d="M 268 78 L 496 78" stroke="#d4e5cc" stroke-width="0.7" filter="url(#rough2)"/>
  <text x="312" y="92" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">2</text>
  <text x="388" y="92" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">Ali</text>
  <rect x="445" y="82" width="26" height="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="458" y="92" text-anchor="middle" font-size="9" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">B</text>
  <path d="M 268 96 L 496 96" stroke="#d4e5cc" stroke-width="0.7" filter="url(#rough2)"/>
  <text x="312" y="110" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">3</text>
  <text x="388" y="110" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">John</text>
  <rect x="445" y="100" width="26" height="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="458" y="110" text-anchor="middle" font-size="9" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">B</text>
  <path d="M 268 114 L 496 114" stroke="#d4e5cc" stroke-width="0.7" filter="url(#rough2)"/>
  <text x="312" y="125" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">4</text>
  <text x="388" y="125" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">Doe</text>
  <rect x="445" y="114" width="26" height="13" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="458" y="125" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold" filter="url(#rough2)">A</text>

  <!-- JOIN 药丸 -->
  <path d="M 138 132 L 222 150" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 382 132 L 298 150" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <rect x="196" y="152" width="128" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="13" filter="url(#rough2)"/>
  <text x="260" y="169" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">JOIN USING(employee_id)</text>
  <path d="M 244 180 C 228 192, 180 198, 146 200" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 276 180 C 292 192, 340 198, 374 200" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Team A 面板 -->
  <rect x="24" y="204" width="228" height="124" fill="#ffffff" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="34" y="219" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">Team A</text>
  <path d="M 183 232 L 183 290" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="183" y="228" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">56.50</text>
  <text x="34" y="250" font-size="9.5" fill="#333" filter="url(#rough2)">1 · Khaled</text>
  <rect x="104" y="238" width="63" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="171" y="250" font-size="9.5" fill="#446688" filter="url(#rough2)">45</text>
  <text x="188" y="251" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="34" y="276" font-size="9.5" fill="#333" filter="url(#rough2)">4 · Doe</text>
  <rect x="104" y="262" width="95" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="203" y="276" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">68</text>
  <text x="220" y="277" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="138" y="315" text-anchor="middle" font-size="9" fill="#8f3a36" filter="url(#rough2)">avg = (45+68)/2 = 56.50</text>

  <!-- Team B 面板 -->
  <rect x="268" y="204" width="228" height="124" fill="#ffffff" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="278" y="219" font-size="11" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">Team B</text>
  <path d="M 419 232 L 419 290" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 3" filter="url(#rough2)"/>
  <text x="419" y="228" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">51.00</text>
  <text x="278" y="250" font-size="9.5" fill="#333" filter="url(#rough2)">2 · Ali</text>
  <rect x="348" y="238" width="126" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="468" y="250" text-anchor="end" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">90</text>
  <text x="478" y="251" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="278" y="276" font-size="9.5" fill="#333" filter="url(#rough2)">3 · John</text>
  <rect x="348" y="262" width="17" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="369" y="276" font-size="9.5" fill="#7a5a10" filter="url(#rough2)">12</text>
  <text x="386" y="277" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="382" y="315" text-anchor="middle" font-size="9" fill="#8f3a36" filter="url(#rough2)">avg = (90+12)/2 = 51.00</text>

  <!-- 底部注记 -->
  <rect x="24" y="336" width="472" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="350" text-anchor="middle" font-size="9.5" fill="#7a5a10" filter="url(#rough2)">💡 基准是「所在团队」的均值线，不是全局平均；严格大于 —— 恰好压线不算</text>
</svg>
