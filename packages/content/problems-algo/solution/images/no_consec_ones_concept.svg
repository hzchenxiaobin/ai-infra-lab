<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arb" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arg" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>
  <rect width="880" height="540" fill="#fdfcf7"/>

  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">数位 DP 决策树：n = 6（二进制 110）</text>
  <path d="M 300 42 Q 440 50 580 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="440" y="60" text-anchor="middle" font-size="11" fill="#888">f[0]=1, f[1]=2, f[2]=3, f[3]=5</text>

  <text x="300" y="86" font-size="12" fill="#666">n =</text>
  <g filter="url(#sk)">
    <rect x="338" y="72" width="34" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="374" y="72" width="34" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <rect x="410" y="72" width="34" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="355" y="91" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">1</text>
  <text x="391" y="91" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">1</text>
  <text x="427" y="91" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a5415">0</text>
  <text x="355" y="116" text-anchor="middle" font-size="9" fill="#999">pos0</text>
  <text x="391" y="116" text-anchor="middle" font-size="9" fill="#999">pos1</text>
  <text x="427" y="116" text-anchor="middle" font-size="9" fill="#999">pos2</text>

  <g filter="url(#sk)">
    <rect x="350" y="130" width="180" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="440" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">pos0</text>
  <text x="440" y="166" text-anchor="middle" font-size="10.5" fill="#446688">tight=1  prev=0  limit=1</text>

  <path d="M 370 174 Q 280 200 200 222" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arb)" filter="url(#sk)"/>
  <text x="268" y="196" font-size="11" fill="#446688" font-weight="bold">d=0</text>
  <path d="M 510 174 Q 600 200 660 222" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <text x="595" y="196" font-size="11" fill="#4a7a3a" font-weight="bold">d=1</text>

  <g filter="url(#sk)">
    <rect x="70" y="222" width="240" height="68" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="190" y="244" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">free subtree（tight=0）</text>
  <text x="190" y="266" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e">f[2] = 3</text>
  <text x="190" y="284" text-anchor="middle" font-size="11" fill="#3a6a3a">{000, 001, 010} = {0, 1, 2}</text>

  <g filter="url(#sk)">
    <rect x="580" y="222" width="160" height="44" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="660" y="242" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b2b2b">pos1</text>
  <text x="660" y="258" text-anchor="middle" font-size="10.5" fill="#7a5415">tight=1  prev=1  limit=1</text>

  <path d="M 640 266 Q 600 300 540 322" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arb)" filter="url(#sk)"/>
  <text x="560" y="298" font-size="11" fill="#446688" font-weight="bold">d=0</text>
  <path d="M 680 266 Q 730 300 780 322" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#sk)" stroke-dasharray="4 3"/>
  <text x="748" y="298" font-size="11" fill="#b85450" font-weight="bold">d=1</text>

  <g filter="url(#sk)">
    <rect x="430" y="322" width="210" height="68" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="535" y="344" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">free subtree（tight=0）</text>
  <text x="535" y="366" text-anchor="middle" font-size="16" font-weight="bold" fill="#2e6e2e">f[1] = 2</text>
  <text x="535" y="384" text-anchor="middle" font-size="11" fill="#3a6a3a">{100, 101} = {4, 5}</text>

  <g filter="url(#sk)">
    <rect x="710" y="322" width="140" height="56" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3"/>
  </g>
  <text x="780" y="346" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450">✗ 剪枝</text>
  <text x="780" y="365" text-anchor="middle" font-size="10.5" fill="#b85450">prev=1 再填 1</text>
  <text x="780" y="380" text-anchor="middle" font-size="10.5" fill="#b85450">→ 连续 1</text>

  <g filter="url(#sk)">
    <rect x="300" y="410" width="280" height="44" rx="8" fill="#fffdf3" stroke="#c9a93a" stroke-width="2"/>
  </g>
  <text x="440" y="438" text-anchor="middle" font-size="16" font-weight="bold" fill="#7a5415">合计：3 + 2 = 5</text>
  <text x="440" y="472" text-anchor="middle" font-size="11" fill="#888">n = 6 (110) 自身含连续 1 → 不加 n，提前返回</text>

  <g font-size="11" fill="#444">
    <line x1="60" y1="504" x2="100" y2="504" stroke="#446688" stroke-width="1.8" marker-end="url(#arb)" filter="url(#sk)"/>
    <text x="108" y="508">填 0（解除 tight → 自由子树）</text>
    <line x1="350" y1="504" x2="390" y2="504" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arg)" filter="url(#sk)"/>
    <text x="398" y="508">填 1（保持 tight）</text>
    <line x1="570" y1="504" x2="610" y2="504" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#sk)"/>
    <text x="618" y="508">剪枝（连续 1）</text>
  </g>
  <text x="440" y="530" text-anchor="middle" font-size="10.5" fill="#b03a3a" font-weight="bold">两个标志位 prev_one（上一位）+ tight（紧贴上界）刻画全部状态</text>
</svg>
