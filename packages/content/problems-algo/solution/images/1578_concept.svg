<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：同色连续段保留 max，删其余</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888">每段必留一个 → 留删除代价最大的（neededTime 最大），代价最小</text>

  <!-- Rope label -->
  <text x="28" y="86" font-size="10.5" fill="#666">同色段</text>

  <!-- Three balloons 'a a a' with times 3,5,2 -->
  <!-- Balloon 1: a, time=3 (remove) -->
  <ellipse cx="110" cy="92" rx="22" ry="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="110" y="98" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <text x="110" y="138" text-anchor="middle" font-size="11" fill="#b85450">t=3</text>
  <path d="M 110 118 L 110 128" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <!-- remove mark -->
  <path d="M 92 76 L 128 108" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <path d="M 128 76 L 92 108" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="110" y="160" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">删</text>

  <!-- Balloon 2: a, time=5 (keep) -->
  <ellipse cx="200" cy="92" rx="22" ry="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="200" y="98" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <text x="200" y="138" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">t=5 ★</text>
  <path d="M 200 118 L 200 128" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="200" y="160" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">留（max）</text>

  <!-- Balloon 3: a, time=2 (remove) -->
  <ellipse cx="290" cy="92" rx="22" ry="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="98" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <text x="290" y="138" text-anchor="middle" font-size="11" fill="#b85450">t=2</text>
  <path d="M 290 118 L 290 128" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <path d="M 272 76 L 308 108" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <path d="M 308 76 L 272 108" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="290" y="160" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">删</text>

  <!-- Rope line under balloons -->
  <path d="M 70 122 L 330 122" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Arrow down -->
  <path d="M 200 174 L 200 192" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Cost formula box -->
  <rect x="60" y="198" width="400" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="220" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">段代价 = sum − max = (3+5+2) − 5 = 5</text>
  <text x="260" y="240" text-anchor="middle" font-size="11" fill="#555">删 3 + 删 2 = 5（保留 t=5 的那个，代价最小）</text>

  <!-- Bottom note -->
  <rect x="40" y="276" width="440" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="296" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">为什么保留 max 是对的？</text>
  <text x="260" y="314" text-anchor="middle" font-size="10.5" fill="#555">段内必删 k−1 个、留 1 个 → 删除总代价 = sum − 保留项</text>
  <text x="260" y="328" text-anchor="middle" font-size="10.5" fill="#555">→ 保留项越大，删除代价越小 → 保留 max</text>

  <!-- Footer -->
  <text x="260" y="352" text-anchor="middle" font-size="10" fill="#aaa">一次遍历即可：维护当前段 sum 与 max，颜色变化时结算</text>
</svg>
