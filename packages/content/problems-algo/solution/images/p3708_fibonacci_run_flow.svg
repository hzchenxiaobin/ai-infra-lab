<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 448"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="448" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">一次扫描流程：判定成立游程 +1，断点重置为 2</text>

  <!-- 开始 -->
  <rect x="120" y="36" width="280" height="32" rx="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="56" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">cur = 2，ans = 2（长度 ≤ 2 恒合法）</text>

  <path d="M 260 68 L 260 80" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i 初始化 -->
  <rect x="150" y="86" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="105" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i ← 2（从第三个元素开始）</text>

  <path d="M 260 116 L 260 126" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定 1 -->
  <polygon points="260,132 158,174 260,216 362,174" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="164" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a[i] ==</text>
  <text x="260" y="180" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a[i-1] + a[i-2] ?</text>
  <text x="260" y="199" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">⚠ 用 64 位求和</text>

  <!-- 是 → 增长 -->
  <text x="272" y="234" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 260 216 L 260 236" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <rect x="110" y="240" width="300" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="258" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">cur ← cur + 1；ans ← max(ans, cur)</text>
  <text x="260" y="276" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">游程向右延长一项</text>

  <!-- 否 → 重置 -->
  <text x="384" y="166" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 362 174 L 398 174" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="402" y="150" width="108" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="456" y="168" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">cur ← 2</text>
  <text x="456" y="182" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">相邻两项</text>
  <text x="456" y="194" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">恒合法</text>

  <!-- 重置分支汇合回主线 -->
  <path d="M 456 198 L 456 296 L 272 296" fill="none" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <path d="M 260 284 L 260 308" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 判定 2 -->
  <polygon points="260,312 165,352 260,392 355,352" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="348" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">还有下一个元素 ?</text>
  <text x="260" y="366" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">（i + 1 &lt; n）</text>

  <!-- 是 → 循环回判定 1 -->
  <text x="152" y="342" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">是</text>
  <path d="M 165 352 L 134 352" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="48" y="336" width="84" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="356" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">i ← i + 1</text>
  <path d="M 90 336 L 90 174 L 152 174" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 否 → 返回 -->
  <text x="272" y="408" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 260 392 L 260 404" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="205" y="408" width="110" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="427" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 ans</text>
</svg>
