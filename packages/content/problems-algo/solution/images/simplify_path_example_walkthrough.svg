<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：path = "/a/./b/../../c/"</text>

  <!-- Column headers -->
  <text x="50" y="50" font-size="11" fill="#888" font-weight="bold">步骤</text>
  <text x="110" y="50" font-size="11" fill="#888" font-weight="bold">part</text>
  <text x="180" y="50" font-size="11" fill="#888" font-weight="bold">操作</text>
  <text x="380" y="50" font-size="11" fill="#888" font-weight="bold">栈状态</text>

  <!-- Separator line -->
  <line x1="30" y1="58" x2="490" y2="58" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 0: split -->
  <text x="50" y="76" font-size="11" fill="#555" font-weight="bold">切分</text>
  <text x="110" y="76" font-size="11" fill="#888">—</text>
  <text x="180" y="76" font-size="11" fill="#555">split('/', path)</text>
  <text x="380" y="76" font-size="10.5" fill="#888">→ [a, ., b, .., .., c]</text>

  <!-- Row 1: a -> push -->
  <rect x="30" y="84" width="460" height="28" fill="#e8f0fe" opacity="0.3" rx="4" filter="url(#rough2)"/>
  <text x="50" y="103" font-size="11" fill="#555" font-weight="bold">1</text>
  <rect x="105" y="92" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="123" y="108" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">a</text>
  <text x="180" y="103" font-size="11" fill="#446688" font-weight="bold">压栈 push</text>
  <rect x="375" y="92" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="395" y="108" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">a</text>

  <!-- Row 2: . -> skip -->
  <text x="50" y="129" font-size="11" fill="#555" font-weight="bold">2</text>
  <rect x="105" y="118" width="36" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="123" y="134" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">.</text>
  <text x="180" y="129" font-size="11" fill="#d6a040" font-weight="bold">跳过 skip</text>
  <rect x="375" y="118" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="395" y="134" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">a</text>

  <!-- Row 3: b -> push -->
  <rect x="30" y="144" width="460" height="28" fill="#e8f0fe" opacity="0.3" rx="4" filter="url(#rough2)"/>
  <text x="50" y="163" font-size="11" fill="#555" font-weight="bold">3</text>
  <rect x="105" y="152" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="123" y="168" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">b</text>
  <text x="180" y="163" font-size="11" fill="#446688" font-weight="bold">压栈 push</text>
  <rect x="375" y="152" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="395" y="168" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">b</text>
  <rect x="420" y="152" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="440" y="168" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">a</text>

  <!-- Row 4: .. -> pop b -->
  <rect x="30" y="176" width="460" height="28" fill="#fce4ec" opacity="0.3" rx="4" filter="url(#rough2)"/>
  <text x="50" y="195" font-size="11" fill="#555" font-weight="bold">4</text>
  <rect x="105" y="184" width="36" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="123" y="200" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">..</text>
  <text x="180" y="195" font-size="11" fill="#b85450" font-weight="bold">弹栈 pop（弹出 b）</text>
  <rect x="375" y="184" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="395" y="200" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">a</text>
  <rect x="420" y="184" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="440" y="200" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">b✗</text>

  <!-- Row 5: .. -> pop a -->
  <rect x="30" y="208" width="460" height="28" fill="#fce4ec" opacity="0.3" rx="4" filter="url(#rough2)"/>
  <text x="50" y="227" font-size="11" fill="#555" font-weight="bold">5</text>
  <rect x="105" y="216" width="36" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="123" y="232" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">..</text>
  <text x="180" y="227" font-size="11" fill="#b85450" font-weight="bold">弹栈 pop（弹出 a）</text>
  <rect x="375" y="216" width="40" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="395" y="232" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">a✗</text>
  <text x="430" y="232" font-size="10.5" fill="#888">栈空 []</text>

  <!-- Row 6: c -> push -->
  <rect x="30" y="240" width="460" height="28" fill="#e8f0fe" opacity="0.3" rx="4" filter="url(#rough2)"/>
  <text x="50" y="259" font-size="11" fill="#555" font-weight="bold">6</text>
  <rect x="105" y="248" width="36" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="123" y="264" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">c</text>
  <text x="180" y="259" font-size="11" fill="#446688" font-weight="bold">压栈 push</text>
  <rect x="375" y="248" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="395" y="264" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">c</text>

  <!-- arrow down to result -->
  <path d="M 260 278 L 260 294" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Result box -->
  <rect x="80" y="300" width="360" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="322" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">拼接："/" + join(["c"], "/")</text>
  <text x="260" y="342" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">= "/c" ✓</text>

  <!-- Legend -->
  <rect x="30" y="364" width="16" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="52" y="376" font-size="10" fill="#555">目录名/压栈</text>
  <rect x="140" y="364" width="16" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="162" y="376" font-size="10" fill="#555">. / 跳过</text>
  <rect x="230" y="364" width="16" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="252" y="376" font-size="10" fill="#555">.. / 弹栈</text>
  <rect x="320" y="364" width="16" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="342" y="376" font-size="10" fill="#555">最终结果</text>
</svg>
