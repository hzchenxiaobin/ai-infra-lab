<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">
    示例演算：s = "CONTEST IS COMING"
  </text>

  <!-- Words header -->
  <text x="40" y="54" font-size="12" fill="#888" filter="url(#rough2)">切分得 3 个单词（列方向放置）:</text>

  <!-- Column headers: word0 CONTEST, word1 IS, word2 COMING -->
  <text x="95" y="76" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">CONTEST</text>
  <text x="95" y="90" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">(len=7)</text>
  <text x="155" y="76" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">IS</text>
  <text x="155" y="90" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">(len=2)</text>
  <text x="215" y="76" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">COMING</text>
  <text x="215" y="90" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">(len=6)</text>

  <!-- L = 7 marker -->
  <text x="300" y="84" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">L = 7 → 输出 7 行</text>

  <!-- Build the 7 rows, each row = word0[i] + word1[i](or space) + word2[i](or space) -->
  <!-- cell size 30x28, start y=104 -->

  <!-- Row 0: C I C -> "CIC" -->
  <text x="30" y="122" font-size="10" fill="#888" filter="url(#rough2)">i=0</text>
  <rect x="80" y="108" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="127" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">C</text>
  <rect x="140" y="108" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="127" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">I</text>
  <rect x="200" y="108" width="30" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="215" y="127" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">C</text>
  <text x="248" y="127" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">→ "CIC"</text>

  <!-- Row 1: O S O -> "OSO" -->
  <text x="30" y="152" font-size="10" fill="#888" filter="url(#rough2)">i=1</text>
  <rect x="80" y="138" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="157" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">O</text>
  <rect x="140" y="138" width="30" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="157" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">S</text>
  <rect x="200" y="138" width="30" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="215" y="157" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">O</text>
  <text x="248" y="157" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">→ "OSO"</text>

  <!-- Row 2: N _ M -> "N M" (IS has no index 2 -> space) -->
  <text x="30" y="182" font-size="10" fill="#888" filter="url(#rough2)">i=2</text>
  <rect x="80" y="168" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="187" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">N</text>
  <rect x="140" y="168" width="30" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="187" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">·</text>
  <rect x="200" y="168" width="30" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="215" y="187" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">M</text>
  <text x="248" y="187" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">→ "N M"</text>

  <!-- Row 3: T _ I -> "T I" -->
  <text x="30" y="212" font-size="10" fill="#888" filter="url(#rough2)">i=3</text>
  <rect x="80" y="198" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="217" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">T</text>
  <rect x="140" y="198" width="30" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="217" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">·</text>
  <rect x="200" y="198" width="30" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="215" y="217" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">I</text>
  <text x="248" y="217" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">→ "T I"</text>

  <!-- Row 4: E _ N -> "E N" -->
  <text x="30" y="242" font-size="10" fill="#888" filter="url(#rough2)">i=4</text>
  <rect x="80" y="228" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="247" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">E</text>
  <rect x="140" y="228" width="30" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="247" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">·</text>
  <rect x="200" y="228" width="30" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="215" y="247" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">N</text>
  <text x="248" y="247" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">→ "E N"</text>

  <!-- Row 5: S _ G -> "S G" -->
  <text x="30" y="272" font-size="10" fill="#888" filter="url(#rough2)">i=5</text>
  <rect x="80" y="258" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="277" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">S</text>
  <rect x="140" y="258" width="30" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="277" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">·</text>
  <rect x="200" y="258" width="30" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="215" y="277" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">G</text>
  <text x="248" y="277" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">→ "S G"</text>

  <!-- Row 6: T _ _ -> last=0, only CONTEST has index 6 -> "T" -->
  <text x="30" y="302" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">i=6</text>
  <rect x="80" y="288" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="307" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">T</text>
  <rect x="140" y="288" width="30" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="155" y="307" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">·</text>
  <rect x="200" y="288" width="30" height="28" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="215" y="307" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">·</text>
  <text x="248" y="307" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">→ "T" (last=0)</text>

  <!-- annotation for row 6 -->
  <path d="M 215 318 Q 215 326 200 326 L 95 326" fill="none" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="155" y="340" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">IS/COMING 均短于 7，截断在 last=0</text>

  <!-- Final output box -->
  <rect x="40" y="358" width="480" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="382" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">最终输出</text>
  <text x="280" y="406" text-anchor="middle" font-size="13" fill="#333" font-family="'Comic Sans MS', monospace" filter="url(#rough2)">["CIC", "OSO", "N M", "T I", "E N", "S G", "T"]</text>
  <text x="280" y="430" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">行数 = L = 7；每行只在最右有效单词处停止，天然无尾随空格</text>
</svg>
