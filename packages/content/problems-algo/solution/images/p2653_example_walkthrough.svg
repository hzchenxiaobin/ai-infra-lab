<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums=[1,-1,-3,-2,3], k=3, x=2</text>

  <!-- Column headers -->
  <rect x="20" y="44" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="42" y="63" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">j</text>
  <rect x="64" y="44" width="196" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="162" y="63" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">窗口 (k=3)</text>
  <rect x="260" y="44" width="150" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="335" y="63" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">累加到 cnt≥2</text>
  <rect x="410" y="44" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="435" y="63" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">val</text>
  <rect x="460" y="44" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="500" y="63" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">美丽值</text>

  <!-- Row j=0: window [1,-1,-3] -->
  <rect x="20" y="76" width="44" height="40" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="42" y="101" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="64" y="76" width="60" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="94" y="101" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="124" y="76" width="60" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="101" text-anchor="middle" font-size="12" fill="#333">-1</text>
  <rect x="184" y="76" width="60" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="214" y="101" text-anchor="middle" font-size="12" fill="#333">-3</text>
  <rect x="260" y="76" width="150" height="40" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="335" y="101" text-anchor="middle" font-size="11" fill="#555">-3→1 , -1→2 ✓</text>
  <rect x="410" y="76" width="50" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="435" y="101" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">-1</text>
  <rect x="460" y="76" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="500" y="101" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">-1</text>

  <!-- Row j=1: window [-1,-3,-2] -->
  <rect x="20" y="120" width="44" height="40" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="42" y="145" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="64" y="120" width="60" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="94" y="145" text-anchor="middle" font-size="12" fill="#333">-1</text>
  <rect x="124" y="120" width="60" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="145" text-anchor="middle" font-size="12" fill="#333">-3</text>
  <rect x="184" y="120" width="60" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="214" y="145" text-anchor="middle" font-size="12" fill="#333">-2</text>
  <rect x="260" y="120" width="150" height="40" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="335" y="145" text-anchor="middle" font-size="11" fill="#555">-3→1 , -2→2 ✓</text>
  <rect x="410" y="120" width="50" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="435" y="145" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">-2</text>
  <rect x="460" y="120" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="500" y="145" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">-2</text>

  <!-- Row j=2: window [-3,-2,3] -->
  <rect x="20" y="164" width="44" height="40" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="42" y="189" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="64" y="164" width="60" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="94" y="189" text-anchor="middle" font-size="12" fill="#333">-3</text>
  <rect x="124" y="164" width="60" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="189" text-anchor="middle" font-size="12" fill="#333">-2</text>
  <rect x="184" y="164" width="60" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="214" y="189" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="260" y="164" width="150" height="40" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="335" y="189" text-anchor="middle" font-size="11" fill="#555">-3→1 , -2→2 ✓</text>
  <rect x="410" y="164" width="50" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="435" y="189" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">-2</text>
  <rect x="460" y="164" width="80" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="500" y="189" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">-2</text>

  <!-- Result -->
  <path d="M 500 208 L 500 226" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="300" y="232" width="260" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="430" y="257" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">输出 = [-1, -2, -2] ✓</text>

  <!-- Footnote -->
  <text x="20" y="258" font-size="10" fill="#888">红格=负数 · 黄格=非负数 · 每窗从最小值起累加，</text>
  <text x="20" y="272" font-size="10" fill="#888">首达累计 ≥ x 即第 x 小。</text>

  <!-- insight -->
  <rect x="20" y="290" width="540" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="314" text-anchor="middle" font-size="11" fill="#555">滑动一格 → freq 增删各 1 → 再扫 101 格重算第 x 小，全程 O(n)</text>
</svg>
