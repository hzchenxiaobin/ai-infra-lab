<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：从左到右一次扫描，树状数组动态维护「已用元素」</text>

  <!-- row 1 -->
  <rect x="24" y="46" width="78" height="42" rx="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="63" y="71" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">开始</text>

  <rect x="126" y="46" width="152" height="42" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="202" y="63" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">预处理 fact[i] = i!</text>
  <text x="202" y="79" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">（mod 1e9+7），BIT 置 0</text>

  <rect x="302" y="46" width="176" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="390" y="63" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">取 x = perm[i]（i 从 0 起）</text>
  <text x="390" y="79" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">BIT 记录左侧已出现的元素</text>

  <path d="M 102 67 L 124 67" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 278 67 L 300 67" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- row 2 -->
  <rect x="302" y="128" width="176" height="42" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="390" y="145" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">smaller = (x−1) − query(x)</text>
  <text x="390" y="161" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">剩余候选中比 x 小的个数</text>

  <rect x="126" y="128" width="152" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="202" y="145" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">ans += smaller·fact[n−1−i]</text>
  <text x="202" y="161" text-anchor="middle" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">（mod 1e9+7）</text>

  <path d="M 390 88 L 390 126" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 300 149 L 280 149" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- row 3 -->
  <rect x="126" y="210" width="152" height="42" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="202" y="227" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">update(x)：x 记为已用</text>
  <text x="202" y="243" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">i++，处理下一位</text>

  <polygon points="410,201 482,231 410,261 338,231" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="410" y="236" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">i &lt; n ?</text>

  <path d="M 202 170 L 202 208" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 231 L 336 231" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop back: yes -->
  <path d="M 482 231 L 506 231 L 506 67 L 480 67" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="494" y="220" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- no -->
  <path d="M 410 261 L 410 294" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="422" y="282" font-size="10" fill="#666" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="348" y="296" width="124" height="40" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="410" y="320" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <!-- complexity note -->
  <rect x="24" y="288" width="300" height="56" fill="#ffffff" stroke="#888" stroke-width="1.2" stroke-dasharray="5 3" rx="8" filter="url(#rough2)"/>
  <text x="174" y="310" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">query / update 均为 O(log n)</text>
  <text x="174" y="330" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">总时间 O(n log n)，空间 O(n)</text>
</svg>
