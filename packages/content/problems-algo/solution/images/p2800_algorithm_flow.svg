<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2800f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arr2800g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：6 排列 → 枚举 o12 → 放 s3 → 取最短字典序最小</text>

  <!-- Start oval -->
  <ellipse cx="280" cy="62" rx="46" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">开始</text>

  <path d="M280,82 L280,100" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr2800f)" filter="url(#rough2)"/>

  <!-- Step 1: enumerate permutations -->
  <rect x="150" y="102" width="260" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="120" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">枚举 6 种排列 (s1, s2, s3)</text>
  <text x="280" y="136" text-anchor="middle" font-size="10" fill="#888">按首次出现顺序覆盖所有可能</text>

  <path d="M280,146 L280,164" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr2800f)" filter="url(#rough2)"/>

  <!-- Step 2: enumerate o12 for s2 -->
  <rect x="110" y="166" width="340" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="186" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">枚举 s2 的所有合法重叠 o12（含 0）+ 包含分支</text>
  <text x="280" y="202" text-anchor="middle" font-size="11" fill="#4a7a3a">→ 接缝串候选集 acc = s1 + s2[o12:]</text>
  <text x="280" y="218" text-anchor="middle" font-size="10" fill="#888">⚠ 含非最大重叠，给 s3 留桥接接缝的机会</text>

  <path d="M280,226 L280,244" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr2800f)" filter="url(#rough2)"/>

  <!-- Step 3: place s3 -->
  <rect x="110" y="246" width="340" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="266" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">对每个 acc 放置末位串 s3</text>
  <text x="280" y="284" text-anchor="middle" font-size="11" fill="#d6a040">若 s3 ⊆ acc → cand = acc</text>
  <text x="280" y="300" text-anchor="middle" font-size="11" fill="#d6a040">否则 → cand = acc + s3[最大重叠 o3 :]</text>

  <path d="M280,310 L280,328" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr2800f)" filter="url(#rough2)"/>

  <!-- Step 4: update best -->
  <rect x="150" y="330" width="260" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="348" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">更新 best：更短 或 同长字典序更小</text>
  <text x="280" y="364" text-anchor="middle" font-size="10" fill="#888">先比长度，再逐字符比字典序</text>

  <!-- loop back arrow -->
  <path d="M410,352 L470,352 L470,124 L412,124" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arr2800g)" filter="url(#rough2)"/>
  <text x="478" y="240" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" transform="rotate(0 478 240)">下一排列</text>

  <path d="M280,374 L280,392" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr2800f)" filter="url(#rough2)"/>

  <!-- End -->
  <ellipse cx="280" cy="412" rx="58" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="416" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">输出 best</text>

  <text x="280" y="452" text-anchor="middle" font-size="10" fill="#888">6 排列 × (≤L+1 接缝串) × O(L²) 判定 = O(L³)，L≤100 轻松通过</text>
</svg>
