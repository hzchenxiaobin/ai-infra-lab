<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心概念：经过 node 的「拐弯路径」 vs 向上返回的「向下贡献 gain」</text>

  <!-- Center node v -->
  <circle cx="290" cy="150" r="22" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="290" y="155" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">v</text>
  <text x="290" y="120" text-anchor="middle" font-size="11" fill="#888">node</text>

  <!-- Left subtree triangle -->
  <polygon points="180,150 130,110 130,190" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="150" y="156" text-anchor="middle" font-size="10" fill="#4a7a3a">左子树</text>
  <line x1="180" y1="150" x2="268" y2="150" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="222" y="142" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">left_gain</text>
  <text x="222" y="166" text-anchor="middle" font-size="9" fill="#888">= max(0, dfs(L))</text>

  <!-- Right subtree triangle -->
  <polygon points="400,150 450,110 450,190" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="425" y="156" text-anchor="middle" font-size="10" fill="#d6a040">右子树</text>
  <line x1="312" y1="150" x2="400" y2="150" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="356" y="142" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">right_gain</text>
  <text x="356" y="166" text-anchor="middle" font-size="9" fill="#888">= max(0, dfs(R))</text>

  <!-- 拐弯路径 highlight (through node) -->
  <path d="M 150 150 Q 290 150 425 150" stroke="#b85450" stroke-width="2.5" fill="none" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <circle cx="290" cy="150" r="26" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Formula 1: 拐弯路径 (更新 ans) -->
  <rect x="40" y="230" width="520" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="56" y="252" font-size="12" fill="#b85450" font-weight="bold">① 拐弯路径（node 作拐点，可同时接左右）→ 更新全局 ans</text>
  <text x="60" y="274" font-size="13" fill="#333" font-weight="bold">path(node) = v + left_gain + right_gain</text>
  <text x="430" y="274" font-size="10" fill="#888">用 max(ans, ·)</text>

  <!-- Formula 2: 向下贡献 gain (返回父) -->
  <rect x="40" y="306" width="520" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="56" y="328" font-size="12" fill="#4a7a3a" font-weight="bold">② 向下贡献（只能选一侧，向上延伸成单链）→ 返回给父节点</text>
  <text x="60" y="350" font-size="13" fill="#333" font-weight="bold">gain(node) = v + max(left_gain, right_gain)</text>
  <text x="430" y="350" font-size="10" fill="#888">return 给父</text>

  <!-- arrow from node down to formulas -->
  <path d="M 290 178 L 290 222" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- return arrow to parent -->
  <path d="M 290 128 L 290 70" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="300" y="62" font-size="10" fill="#4a7a3a">return gain(node)</text>

  <!-- key insight -->
  <text x="300" y="396" text-anchor="middle" font-size="11" fill="#888">关键：父节点要和 node 相连成单链，故 gain 只能选一侧；左右之和是「拐弯路径」不能向上延伸</text>
  <text x="300" y="414" text-anchor="middle" font-size="11" fill="#888">负贡献用 max(0, ·) 舍弃；但 v 本身必保留（路径至少一个节点）→ ans 初值取 −∞</text>
</svg>
