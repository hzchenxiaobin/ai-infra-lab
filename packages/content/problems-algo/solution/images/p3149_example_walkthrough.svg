<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="18" text-anchor="middle" font-size="13" font-weight="bold" fill="#555" filter="url(#rough2)">示例演算：nums = [0, 2, 1]，n = 3</text>
  <text x="260" y="33" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">mask 二进制书写：bit v 置 1 ⇔ 值 v 已放置（如 101 = {0, 2}）</text>

  <!-- table header -->
  <rect x="16" y="42" width="96" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="64" y="56" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#446688" filter="url(#rough2)">mask</text>
  <rect x="112" y="42" width="40" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="132" y="56" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#446688" filter="url(#rough2)">last</text>
  <rect x="152" y="42" width="276" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="290" y="56" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#446688" filter="url(#rough2)">转移计算（v 取遍不在 mask 中的值）</text>
  <rect x="428" y="42" width="76" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="466" y="56" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#446688" filter="url(#rough2)">dp 值</text>

  <!-- row 0 -->
  <rect x="16" y="62" width="96" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="64" y="78" text-anchor="middle" font-size="8.5" fill="#333" font-weight="bold" filter="url(#rough2)">111 <tspan fill="#999" font-weight="normal">{0,1,2}</tspan></text>
  <rect x="112" y="62" width="40" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="132" y="78" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">0/1/2</text>
  <rect x="152" y="62" width="276" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="160" y="78" font-size="8.5" fill="#333" filter="url(#rough2)">边界：dp[full][last] = |last − nums[0]| = |last − 0|</text>
  <rect x="428" y="62" width="76" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="466" y="78" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">0 / 1 / 2</text>

  <!-- row 1 -->
  <rect x="16" y="86" width="96" height="24" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="64" y="102" text-anchor="middle" font-size="8.5" fill="#333" font-weight="bold" filter="url(#rough2)">011 <tspan fill="#999" font-weight="normal">{0,1}</tspan></text>
  <rect x="112" y="86" width="40" height="24" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="132" y="102" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="152" y="86" width="276" height="24" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="160" y="102" font-size="8.5" fill="#333" filter="url(#rough2)">v=2：|0−nums[2]| + dp[111][2] = 1+2</text>
  <rect x="428" y="86" width="76" height="24" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="466" y="102" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">3</text>

  <!-- row 2 -->
  <rect x="16" y="110" width="96" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="64" y="126" text-anchor="middle" font-size="8.5" fill="#333" font-weight="bold" filter="url(#rough2)">011 <tspan fill="#999" font-weight="normal">{0,1}</tspan></text>
  <rect x="112" y="110" width="40" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="132" y="126" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="152" y="110" width="276" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="160" y="126" font-size="8.5" fill="#333" filter="url(#rough2)">v=2：|1−nums[2]| + dp[111][2] = 0+2</text>
  <rect x="428" y="110" width="76" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="466" y="126" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">2</text>

  <!-- row 3 -->
  <rect x="16" y="134" width="96" height="24" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="64" y="150" text-anchor="middle" font-size="8.5" fill="#333" font-weight="bold" filter="url(#rough2)">101 <tspan fill="#999" font-weight="normal">{0,2}</tspan></text>
  <rect x="112" y="134" width="40" height="24" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="132" y="150" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="152" y="134" width="276" height="24" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="160" y="150" font-size="8.5" fill="#333" filter="url(#rough2)">v=1：|0−nums[1]| + dp[111][1] = 2+1</text>
  <rect x="428" y="134" width="76" height="24" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="466" y="150" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">3</text>

  <!-- row 4: highlighted -->
  <rect x="16" y="158" width="96" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="64" y="174" text-anchor="middle" font-size="8.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">101 <tspan fill="#6a9a5a" font-weight="normal">{0,2}</tspan></text>
  <rect x="112" y="158" width="40" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="132" y="174" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">2</text>
  <rect x="152" y="158" width="276" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="174" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">v=1：|2−nums[1]| + dp[111][1] = 0+1</text>
  <rect x="428" y="158" width="76" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="466" y="174" text-anchor="middle" font-size="8.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1 ←</text>

  <!-- row 5: answer -->
  <rect x="16" y="182" width="96" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="64" y="198" text-anchor="middle" font-size="8.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">001 <tspan fill="#b08a3f" font-weight="normal">{0}</tspan></text>
  <rect x="112" y="182" width="40" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="132" y="198" text-anchor="middle" font-size="8.5" fill="#8a6a1f" filter="url(#rough2)">0</text>
  <rect x="152" y="182" width="276" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="160" y="198" font-size="8.5" fill="#8a6a1f" filter="url(#rough2)">v=1：|0−2| + dp[011][1] = 4 ✗；v=2：|0−1| + dp[101][2] = 2 ✓</text>
  <rect x="428" y="182" width="76" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="466" y="198" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">2 ★</text>

  <!-- reconstruction -->
  <text x="260" y="226" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6a1f" filter="url(#rough2)">贪心重构：从 (mask=001, last=0) 出发，目标 dp[001][0] = 2</text>

  <rect x="16" y="238" width="158" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="95" y="256" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">第 1 步：试 v = 1 ✗</text>
  <text x="95" y="272" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">|0−nums[1]| + dp[011][1]</text>
  <text x="95" y="286" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">= 2 + 2 = 4 ≠ 2</text>
  <text x="95" y="298" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">更小但丢最优 → 否决</text>

  <path d="M 174 270 L 182 270" stroke="#446688" stroke-width="1.8" stroke-linecap="round" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="182" y="238" width="158" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="261" y="256" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">第 2 步：试 v = 2 ✓</text>
  <text x="261" y="272" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">|0−nums[2]| + dp[101][2]</text>
  <text x="261" y="286" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">= 1 + 1 = 2 ✓</text>
  <text x="261" y="298" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">入选 → perm = [0,2]</text>

  <path d="M 340 270 L 348 270" stroke="#446688" stroke-width="1.8" stroke-linecap="round" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="348" y="238" width="156" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="426" y="256" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f5d24" filter="url(#rough2)">第 3 步：试 v = 1 ✓</text>
  <text x="426" y="272" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">|2−nums[1]| + dp[111][1]</text>
  <text x="426" y="286" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">= 0 + 1 = 1 ✓</text>
  <text x="426" y="298" text-anchor="middle" font-size="8.5" fill="#2f5d24" filter="url(#rough2)">入选 → perm = [0,2,1]</text>

  <!-- bottom strip -->
  <rect x="16" y="314" width="488" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="332" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#446688" filter="url(#rough2)">输出 [0,2,1]，总分 = |0−1| + |2−2| + |1−0| = 2 ✓</text>
  <text x="260" y="346" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">先守住最优（等式），再谈谁更小（v 升序）—— 字典序让位于最优性</text>
</svg>
