<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：7 行 → MIN 聚合 → JOIN → AVG → 50.00</text>

  <!-- ===== Step 1: GROUP BY + MIN ===== -->
  <text x="35" y="54" font-size="11" fill="#4a7a3a" font-weight="bold">步骤 ①：GROUP BY customer_id + MIN(order_date)</text>
  <text x="400" y="54" font-size="9" fill="#888">按顾客分组取最早订单日</text>

  <!-- mini Delivery table for reference -->
  <rect x="20" y="60" width="200" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="40" y="73" font-size="7.5" fill="#446688" font-weight="bold">cust</text>
  <text x="90" y="73" font-size="7.5" fill="#446688" font-weight="bold">order_date</text>
  <text x="165" y="73" font-size="7" fill="#446688" font-weight="bold">delivery</text>

  <!-- cust1 rows -->
  <rect x="20" y="80" width="200" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="40" y="92" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="90" y="92" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">08-01</text>
  <text x="165" y="92" text-anchor="middle" font-size="8" fill="#4a7a3a">#1</text>

  <rect x="20" y="96" width="200" height="16" fill="#f5f5f5" stroke="#888" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="40" y="108" text-anchor="middle" font-size="8" fill="#888">1</text>
  <text x="90" y="108" text-anchor="middle" font-size="8" fill="#888">08-11</text>
  <text x="165" y="108" text-anchor="middle" font-size="8" fill="#888">#3</text>

  <!-- cust2 rows -->
  <rect x="20" y="112" width="200" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="40" y="124" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="90" y="124" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">08-02</text>
  <text x="165" y="124" text-anchor="middle" font-size="8" fill="#4a7a3a">#2</text>

  <rect x="20" y="128" width="200" height="16" fill="#f5f5f5" stroke="#888" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="40" y="140" text-anchor="middle" font-size="8" fill="#888">2</text>
  <text x="90" y="140" text-anchor="middle" font-size="8" fill="#888">08-11</text>
  <text x="165" y="140" text-anchor="middle" font-size="8" fill="#888">#6</text>

  <!-- cust3 rows -->
  <rect x="20" y="144" width="200" height="16" fill="#f5f5f5" stroke="#888" stroke-width="0.6" rx="2" filter="url(#rough2)"/>
  <text x="40" y="156" text-anchor="middle" font-size="8" fill="#888">3</text>
  <text x="90" y="156" text-anchor="middle" font-size="8" fill="#888">08-24</text>
  <text x="165" y="156" text-anchor="middle" font-size="8" fill="#888">#4</text>

  <rect x="20" y="160" width="200" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="40" y="172" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="90" y="172" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">08-21</text>
  <text x="165" y="172" text-anchor="middle" font-size="8" fill="#4a7a3a">#5</text>

  <!-- cust4 row -->
  <rect x="20" y="176" width="200" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="40" y="188" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="90" y="188" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">08-09</text>
  <text x="165" y="188" text-anchor="middle" font-size="8" fill="#4a7a3a">#7</text>

  <!-- arrow -->
  <path d="M225 128 L265 128" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="245" y="121" text-anchor="middle" font-size="7" fill="#d6a040" font-weight="bold">MIN</text>

  <!-- result of step 1 -->
  <text x="365" y="54" font-size="9" fill="#4a7a3a" font-weight="bold">子查询结果 f（4 行）</text>
  <rect x="270" y="60" width="180" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="310" y="73" font-size="7.5" fill="#4a7a3a" font-weight="bold">customer_id</text>
  <text x="395" y="73" font-size="7.5" fill="#4a7a3a" font-weight="bold">first_date</text>
  <line x1="355" y1="60" x2="355" y2="80" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>

  <rect x="270" y="80" width="180" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="310" y="92" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="395" y="92" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">08-01</text>
  <line x1="355" y1="80" x2="355" y2="96" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>

  <rect x="270" y="96" width="180" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="310" y="108" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="395" y="108" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">08-02</text>
  <line x1="355" y1="96" x2="355" y2="112" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>

  <rect x="270" y="112" width="180" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="310" y="124" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="395" y="124" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">08-21</text>
  <line x1="355" y1="112" x2="355" y2="128" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>

  <rect x="270" y="128" width="180" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="310" y="140" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="395" y="140" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">08-09</text>
  <line x1="355" y1="128" x2="355" y2="144" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>

  <!-- separator -->
  <line x1="20" y1="210" x2="540" y2="210" stroke="#ccc" stroke-width="0.8" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Step 2: JOIN + check immediate ===== -->
  <text x="35" y="232" font-size="11" fill="#d6a040" font-weight="bold">步骤 ②：JOIN 取首次订单完整记录 + 判即时</text>
  <text x="400" y="232" font-size="9" fill="#888">order_date = pref_delivery_date?</text>

  <!-- joined table header -->
  <rect x="60" y="240" width="420" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="255" font-size="8" fill="#d6a040" font-weight="bold">cust</text>
  <text x="170" y="255" font-size="7.5" fill="#d6a040" font-weight="bold">order_date</text>
  <text x="280" y="255" font-size="7" fill="#d6a040" font-weight="bold">pref_delivery_date</text>
  <text x="400" y="255" font-size="7.5" fill="#d6a040" font-weight="bold">即时?(=?)</text>
  <line x1="135" y1="240" x2="135" y2="262" stroke="#d6a040" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="230" y1="240" x2="230" y2="262" stroke="#d6a040" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="350" y1="240" x2="350" y2="262" stroke="#d6a040" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- row 1: cust1, 08-01, 08-02, scheduled -->
  <rect x="60" y="262" width="420" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="100" y="275" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">1</text>
  <text x="170" y="275" text-anchor="middle" font-size="8" fill="#d6a040">08-01</text>
  <text x="280" y="275" text-anchor="middle" font-size="8" fill="#888">08-02</text>
  <text x="400" y="275" text-anchor="middle" font-size="9" fill="#888">✗ → 0</text>
  <line x1="135" y1="262" x2="135" y2="280" stroke="#d6a040" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="230" y1="262" x2="230" y2="280" stroke="#d6a040" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="350" y1="262" x2="350" y2="280" stroke="#d6a040" stroke-width="0.5" filter="url(#rough2)"/>

  <!-- row 2: cust2, 08-02, 08-02, immediate -->
  <rect x="60" y="280" width="420" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="100" y="293" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="170" y="293" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">08-02</text>
  <text x="280" y="293" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">08-02</text>
  <text x="400" y="293" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">✓ → 1</text>
  <line x1="135" y1="280" x2="135" y2="298" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="230" y1="280" x2="230" y2="298" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="350" y1="280" x2="350" y2="298" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>

  <!-- row 3: cust3, 08-21, 08-22, scheduled -->
  <rect x="60" y="298" width="420" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="100" y="311" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">3</text>
  <text x="170" y="311" text-anchor="middle" font-size="8" fill="#d6a040">08-21</text>
  <text x="280" y="311" text-anchor="middle" font-size="8" fill="#888">08-22</text>
  <text x="400" y="311" text-anchor="middle" font-size="9" fill="#888">✗ → 0</text>
  <line x1="135" y1="298" x2="135" y2="316" stroke="#d6a040" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="230" y1="298" x2="230" y2="316" stroke="#d6a040" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="350" y1="298" x2="350" y2="316" stroke="#d6a040" stroke-width="0.5" filter="url(#rough2)"/>

  <!-- row 4: cust4, 08-09, 08-09, immediate -->
  <rect x="60" y="316" width="420" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="100" y="329" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="170" y="329" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">08-09</text>
  <text x="280" y="329" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">08-09</text>
  <text x="400" y="329" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">✓ → 1</text>
  <line x1="135" y1="316" x2="135" y2="334" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="230" y1="316" x2="230" y2="334" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="350" y1="316" x2="350" y2="334" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>

  <!-- separator -->
  <line x1="20" y1="352" x2="540" y2="352" stroke="#ccc" stroke-width="0.8" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Step 3: AVG calculation ===== -->
  <text x="35" y="374" font-size="11" fill="#b85450" font-weight="bold">步骤 ③：AVG(即时) × 100 = ROUND(50.00, 2)</text>

  <rect x="80" y="384" width="400" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="402" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">AVG(0, 1, 0, 1) = (0+1+0+1) / 4 = 0.5</text>
  <text x="280" y="418" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">0.5 × 100 = 50 → ROUND(50, 2) = 50.00</text>
  <text x="280" y="432" text-anchor="middle" font-size="8" fill="#888">即时订单 2 个 / 首次订单 4 个 = 50.00%</text>

  <!-- summary box -->
  <rect x="20" y="452" width="520" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="280" y="470" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">7 行 → MIN 聚合 4 行首次 → JOIN 取完整记录判即时 → AVG(2/4)×100 = 50.00</text>
  <text x="280" y="484" text-anchor="middle" font-size="8" fill="#888">关键：MIN 求首次订单日 → JOIN 回原表取完整行 → 布尔表达式 1/0 转 AVG 算比例</text>
</svg>
