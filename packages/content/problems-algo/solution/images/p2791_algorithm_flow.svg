<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF2791" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">算法流程：BFS 求 mask + 哈希计数配对</text>

  <!-- Step 1 -->
  <rect x="60" y="44" width="400" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="80" y="64" font-size="11" fill="#446688" font-weight="bold">① BFS 遍历树，计算每个节点的 mask</text>
  <text x="80" y="82" font-size="10" fill="#666">mask[0]=0，mask[v] = mask[parent[v]] ⊕ (1 &lt;&lt; (s[v]−'a'))</text>
  <text x="80" y="94" font-size="10" fill="#888">用队列避免递归栈溢出（n 可达 10⁵）</text>

  <!-- arrow -->
  <path d="M 260 102 L 260 118" stroke="#888" stroke-width="1.4" marker-end="url(#arrF2791)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="60" y="122" width="400" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="80" y="142" font-size="11" fill="#4a7a3a" font-weight="bold">② 按 v = 0, 1, ..., n−1 顺序遍历（保证 u &lt; v）</text>
  <text x="80" y="160" font-size="10" fill="#666">令 m = mask[v]，在哈希表 cnt 中查 27 个目标 mask</text>
  <text x="80" y="172" font-size="10" fill="#888">cnt[m]（全偶）+ cnt[m⊕(1&lt;&lt;k)] for k=0..25（单奇）</text>

  <!-- arrow -->
  <path d="M 260 180 L 260 196" stroke="#888" stroke-width="1.4" marker-end="url(#arrF2791)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="60" y="200" width="400" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="80" y="220" font-size="11" fill="#d6a040" font-weight="bold">③ 累加答案并更新哈希表</text>
  <text x="80" y="238" font-size="10" fill="#666">ans += cnt[m] + Σ cnt[m⊕(1&lt;&lt;k)]（共 27 次查表）</text>
  <text x="80" y="250" font-size="10" fill="#666">cnt[m] += 1（将当前 v 纳入表，供后续节点配对）</text>

  <!-- arrow -->
  <path d="M 260 258 L 260 274" stroke="#888" stroke-width="1.4" marker-end="url(#arrF2791)" filter="url(#rough2)"/>

  <!-- Step 4 -->
  <rect x="120" y="278" width="280" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="298" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">④ 返回 ans</text>
  <text x="260" y="314" text-anchor="middle" font-size="9" fill="#888">每个节点只查 27 次 → 总 O(27n) = O(n)</text>

  <!-- Side note -->
  <text x="475" y="150" font-size="9" fill="#888" text-anchor="middle">27 个</text>
  <text x="475" y="162" font-size="9" fill="#888" text-anchor="middle">目标</text>
  <text x="475" y="174" font-size="9" fill="#888" text-anchor="middle">mask</text>
</svg>
