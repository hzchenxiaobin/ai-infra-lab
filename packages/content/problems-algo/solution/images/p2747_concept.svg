<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">离线排序查询：r 单调↑，窗口恒长 x 使 l=r−x 也单调↑ → j/k 只右移，均摊 O(1)</text>

  <!-- ===== Timeline section ===== -->
  <text x="30" y="54" font-size="12" fill="#888">日志按 time 排序后铺在时间轴上（示例 logs 去重示意）：</text>

  <!-- time → x = 70 + t*37 ; t=3→181, t=5→255, t=6→292, t=10→440, t=11→477 -->
  <!-- log dots above axis -->
  <circle cx="181" cy="110" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="181" y="114" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <text x="181" y="96" text-anchor="middle" font-size="9" fill="#888">t=3</text>

  <circle cx="255" cy="110" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="255" y="114" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <text x="255" y="96" text-anchor="middle" font-size="9" fill="#888">t=5</text>

  <circle cx="292" cy="110" r="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="292" y="114" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="292" y="96" text-anchor="middle" font-size="9" fill="#888">t=6</text>

  <!-- timeline axis -->
  <path d="M 70 132 L 520 132" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <!-- ticks + labels -->
  <path d="M 181 128 L 181 136" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="181" y="150" text-anchor="middle" font-size="10" fill="#888">3</text>
  <path d="M 255 128 L 255 136" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="255" y="150" text-anchor="middle" font-size="10" fill="#888">5</text>
  <path d="M 292 128 L 292 136" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="292" y="150" text-anchor="middle" font-size="10" fill="#888">6</text>
  <path d="M 440 128 L 440 136" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="440" y="150" text-anchor="middle" font-size="10" fill="#888">10</text>
  <path d="M 477 128 L 477 136" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="477" y="150" text-anchor="middle" font-size="10" fill="#888">11</text>
  <text x="530" y="136" font-size="10" fill="#888">time</text>

  <!-- Query windows as translucent rounded bars -->
  <!-- Q0: [5,10] -->
  <rect x="255" y="160" width="185" height="24" fill="#e8f0fe" fill-opacity="0.6" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="347" y="176" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">查询 Q0：r=10，窗口 [5, 10]</text>

  <!-- Q1: [6,11] -->
  <rect x="292" y="190" width="185" height="24" fill="#e6f4ea" fill-opacity="0.6" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="384" y="206" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">查询 Q1：r=11，窗口 [6, 11]</text>

  <!-- monotonic arrow on right -->
  <path d="M 470 224 L 510 224" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="514" y="228" font-size="10" fill="#888">r↑</text>

  <!-- ===== two-pointer band ===== -->
  <text x="30" y="240" font-size="12" fill="#555" font-weight="bold">双指针随 r 递增均只向右移动（每条日志进/出各 ≤ 1 次）：</text>

  <!-- k arrow (green, upper) -->
  <path d="M 150 262 L 330 262" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="338" y="266" font-size="11" fill="#4a7a3a" font-weight="bold">k：添加 time ≤ r</text>

  <!-- j arrow (red, lower) -->
  <path d="M 150 282 L 260 282" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="286" font-size="11" fill="#b85450" font-weight="bold">j：删除 time &lt; l</text>

  <!-- j<=k note -->
  <text x="150" y="300" font-size="9" fill="#888">先加后删，恒有 j ≤ k，计数永不为负</text>

  <!-- ===== cnt evolution ===== -->
  <!-- Q0 cnt box -->
  <rect x="40" y="316" width="220" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="150" y="334" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">Q0：cnt = {1:1, 2:1}</text>
  <text x="150" y="350" text-anchor="middle" font-size="10" fill="#555">size=2 → ans = 3 − 2 = 1</text>

  <!-- arrow -->
  <path d="M 262 338 L 300 338" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Q1 cnt box -->
  <rect x="302" y="316" width="240" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="422" y="334" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">Q1：cnt = {2:1}</text>
  <text x="422" y="350" text-anchor="middle" font-size="10" fill="#555">size=1 → ans = 3 − 1 = 2</text>

  <!-- ===== Key insight box ===== -->
  <rect x="20" y="372" width="560" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="300" y="392" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">关键：窗口长度恒为 x，按 r 排序等价于按 l 排序，两端同向单调</text>
  <text x="300" y="408" text-anchor="middle" font-size="10" fill="#555">→ j、k 跨查询复用只右移，每条日志最多被加 1 次、删 1 次（均摊 O(1)/查询）</text>
  <text x="300" y="424" text-anchor="middle" font-size="10" fill="#555">→ 哈希表 cnt 维护窗口内每服务器请求数，无请求数 = n − cnt.size()</text>
</svg>
