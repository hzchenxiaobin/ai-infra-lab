<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">核心：双哈希表，freq 记「频率的频率」</text>

  <!-- left map cnt -->
  <text x="120" y="64" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">cnt：数字 → 出现频率</text>
  <g filter="url(#rough2)">
    <rect x="40" y="74" width="200" height="160" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="70" y="96" font-size="12" fill="#888">数字</text>
    <text x="200" y="96" font-size="12" fill="#888">频率</text>
    <line x1="50" y1="102" x2="230" y2="102" stroke="#446688" stroke-width="1"/>
    <line x1="150" y1="86" x2="150" y2="234" stroke="#446688" stroke-width="1"/>
    <text x="90" y="128" font-size="14" fill="#333">3</text>
    <text x="190" y="128" font-size="15" font-weight="bold" fill="#b85450">2</text>
    <text x="90" y="162" font-size="14" fill="#333">1</text>
    <text x="190" y="162" font-size="15" font-weight="bold" fill="#4a7a3a">1</text>
    <text x="90" y="196" font-size="14" fill="#bbb">…</text>
    <text x="190" y="196" font-size="14" fill="#bbb">…</text>
    <text x="140" y="222" text-anchor="middle" font-size="11" fill="#888">3 出现 2 次，1 出现 1 次</text>
  </g>

  <!-- right map freq -->
  <text x="400" y="64" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">freq：频率 → 几个数字</text>
  <g filter="url(#rough2)">
    <rect x="300" y="74" width="200" height="160" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="330" y="96" font-size="12" fill="#888">频率</text>
    <text x="460" y="96" font-size="12" fill="#888">个数</text>
    <line x1="310" y1="102" x2="490" y2="102" stroke="#4a7a3a" stroke-width="1"/>
    <line x1="410" y1="86" x2="410" y2="234" stroke="#4a7a3a" stroke-width="1"/>
    <text x="350" y="128" font-size="14" font-weight="bold" fill="#4a7a3a">1</text>
    <text x="450" y="128" font-size="14" fill="#333">1</text>
    <text x="350" y="162" font-size="14" font-weight="bold" fill="#b85450">2</text>
    <text x="450" y="162" font-size="14" fill="#333">1</text>
    <text x="350" y="196" font-size="14" fill="#bbb">…</text>
    <text x="450" y="196" font-size="14" fill="#bbb">…</text>
    <text x="400" y="222" text-anchor="middle" font-size="11" fill="#888">1 个数字频率为 1，1 个为 2</text>
  </g>

  <!-- linking arrow: cnt value 2 -> freq key 2 -->
  <path d="M240 122 C 268 122, 272 158, 300 158" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="270" y="132" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">值即键</text>

  <!-- bottom note -->
  <g filter="url(#rough2)">
    <rect x="70" y="262" width="400" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10"/>
    <text x="270" y="288" text-anchor="middle" font-size="13" font-weight="bold" fill="#a07020">hasFrequency(f) = freq[f] &gt; 0  →  O(1)</text>
    <text x="270" y="312" text-anchor="middle" font-size="12" fill="#7a5a10">问「有没有数字恰好出现 f 次」</text>
    <text x="270" y="330" text-anchor="middle" font-size="12" fill="#7a5a10">= 问「freq[f] 是否非零」，无需遍历 cnt</text>
  </g>
</svg>
