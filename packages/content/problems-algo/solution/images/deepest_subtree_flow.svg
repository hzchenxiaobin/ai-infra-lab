<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">dfs(node) 返回 (depth, lca_node) —— 后序决策流程</text>

  <!-- 入口: node == null -->
  <rect x="220" y="48" width="120" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="70" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">node == null ?</text>

  <line x1="280" y1="82" x2="180" y2="108" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="280" y1="82" x2="380" y2="108" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="200" y="100" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <text x="360" y="100" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- null 返回 (0, null) -->
  <rect x="110" y="112" width="140" height="34" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="134" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 (0, null)</text>

  <!-- 否: 递归左右 -->
  <rect x="340" y="112" width="180" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="430" y="134" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">L=dfs(left), R=dfs(right)</text>

  <!-- 汇合到比较 -->
  <line x1="430" y1="146" x2="430" y2="172" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形: 比较 L.d 与 R.d -->
  <polygon points="430,176 510,216 430,256 350,216" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="430" y="212" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">L.d ? R.d</text>
  <text x="430" y="228" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">(左右深度比)</text>

  <!-- 三分支 -->
  <!-- 左 > 右 -->
  <line x1="350" y1="216" x2="180" y2="216" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="265" y="208" font-size="11" fill="#b85450" filter="url(#rough2)">L.d &gt; R.d</text>

  <!-- 相等 -->
  <line x1="430" y1="256" x2="430" y2="290" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="445" y="276" font-size="11" fill="#d6a040" filter="url(#rough2)">L.d == R.d</text>

  <!-- 右 > 左 -->
  <line x1="510" y1="216" x2="540" y2="216" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="510" y="208" font-size="11" fill="#b85450" filter="url(#rough2)">R.d&gt;L.d</text>

  <!-- 左大: 返回左 -->
  <rect x="80" y="200" width="100" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="130" y="216" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">返回</text>
  <text x="130" y="230" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(L.d+1, L.node)</text>

  <!-- 右大: 返回右 -->
  <rect x="460" y="200" width="100" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="510" y="216" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">返回</text>
  <text x="510" y="230" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(R.d+1, R.node)</text>

  <!-- 相等: node 即 LCA -->
  <rect x="350" y="294" width="160" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="430" y="312" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">两侧等深 → 深处在两侧</text>
  <text x="430" y="327" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">返回 (L.d+1, node) ⭐</text>

  <!-- 说明框 -->
  <rect x="40" y="300" width="280" height="78" rx="8" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="54" y="322" font-size="11" fill="#333" filter="url(#rough2)">💡 depth = 该子树最深叶子的深度</text>
  <text x="54" y="340" font-size="11" fill="#333" filter="url(#rough2)">💡 node = 该子树中「所有最深</text>
  <text x="54" y="356" font-size="11" fill="#333" filter="url(#rough2)">   叶子」的 LCA</text>
  <text x="54" y="372" font-size="11" fill="#b85450" filter="url(#rough2)">⚠️ 空节点深度 0；叶子返回 (1, 自身)</text>
</svg>
