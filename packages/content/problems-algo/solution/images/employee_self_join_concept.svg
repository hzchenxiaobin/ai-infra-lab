<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">Self JOIN：一张表扮两个角色，员工 e 与经理 m 并排</text>

  <!-- Source Employee table (top) -->
  <text x="120" y="58" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">Employee（原始表）</text>
  <rect x="40" y="64" width="170" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="58" y="82" font-size="9.5" fill="#333">id</text>
  <text x="100" y="82" font-size="9.5" fill="#333">name</text>
  <text x="148" y="82" font-size="9.5" fill="#333">salary</text>
  <text x="190" y="82" font-size="9.5" fill="#333">managerId</text>
  <line x1="70" y1="64" x2="70" y2="92" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="115" y1="64" x2="115" y2="92" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="170" y1="64" x2="170" y2="92" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="40" y="92" width="170" height="20" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="58" y="106" font-size="9.5" fill="#333">1</text>
  <text x="100" y="106" font-size="9.5" fill="#333">Joe</text>
  <text x="148" y="106" font-size="9.5" fill="#333">70000</text>
  <text x="190" y="106" font-size="9.5" fill="#b85450" font-weight="bold">3</text>
  <line x1="70" y1="92" x2="70" y2="112" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="115" y1="92" x2="115" y2="112" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="170" y1="92" x2="170" y2="112" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="40" y="112" width="170" height="20" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="58" y="126" font-size="9.5" fill="#333">2</text>
  <text x="100" y="126" font-size="9.5" fill="#333">Henry</text>
  <text x="148" y="126" font-size="9.5" fill="#333">80000</text>
  <text x="190" y="126" font-size="9.5" fill="#b85450" font-weight="bold">4</text>
  <line x1="70" y1="112" x2="70" y2="132" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="115" y1="112" x2="115" y2="132" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="170" y1="112" x2="170" y2="132" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="40" y="132" width="170" height="20" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="58" y="146" font-size="9.5" fill="#333">3</text>
  <text x="100" y="146" font-size="9.5" fill="#333">Sam</text>
  <text x="148" y="146" font-size="9.5" fill="#333">60000</text>
  <text x="190" y="146" font-size="9.5" fill="#888">NULL</text>
  <line x1="70" y1="132" x2="70" y2="152" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="115" y1="132" x2="115" y2="152" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="170" y1="132" x2="170" y2="152" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="40" y="152" width="170" height="20" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="58" y="166" font-size="9.5" fill="#333">4</text>
  <text x="100" y="166" font-size="9.5" fill="#333">Max</text>
  <text x="148" y="166" font-size="9.5" fill="#333">90000</text>
  <text x="190" y="166" font-size="9.5" fill="#888">NULL</text>
  <line x1="70" y1="152" x2="70" y2="172" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="115" y1="152" x2="115" y2="172" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="170" y1="152" x2="170" y2="172" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- split arrows to two roles -->
  <path d="M125 176 L90 214" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M125 176 L360 214" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="78" y="198" font-size="9" fill="#446688">扮演「员工」</text>
  <text x="335" y="198" font-size="9" fill="#4a7a3a">扮演「经理」</text>

  <!-- Role e (employee) bottom-left -->
  <text x="135" y="226" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">e（员工视角）</text>
  <rect x="40" y="232" width="190" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="249" font-size="9.5" fill="#333">e.id</text>
  <text x="105" y="249" font-size="9.5" fill="#333">e.name</text>
  <text x="160" y="249" font-size="9.5" fill="#333">e.salary</text>
  <text x="208" y="249" font-size="9.5" fill="#b85450" font-weight="bold">e.managerId</text>
  <line x1="85" y1="232" x2="85" y2="258" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="135" y1="232" x2="135" y2="258" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="195" y1="232" x2="195" y2="258" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="40" y="258" width="190" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="60" y="272" font-size="9.5" fill="#333">1</text>
  <text x="105" y="272" font-size="9.5" fill="#333">Joe</text>
  <text x="160" y="272" font-size="9.5" fill="#333">70000</text>
  <text x="208" y="272" font-size="9.5" fill="#b85450" font-weight="bold">3</text>
  <line x1="85" y1="258" x2="85" y2="278" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="135" y1="258" x2="135" y2="278" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="195" y1="258" x2="195" y2="278" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Role m (manager) bottom-right -->
  <text x="415" y="226" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">m（经理视角）</text>
  <rect x="320" y="232" width="190" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="249" font-size="9.5" fill="#333">m.id</text>
  <text x="385" y="249" font-size="9.5" fill="#333">m.name</text>
  <text x="440" y="249" font-size="9.5" fill="#333">m.salary</text>
  <text x="488" y="249" font-size="9.5" fill="#888">m.managerId</text>
  <line x1="365" y1="232" x2="365" y2="258" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="415" y1="232" x2="415" y2="258" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="475" y1="232" x2="475" y2="258" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="320" y="258" width="190" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="340" y="272" font-size="9.5" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="385" y="272" font-size="9.5" fill="#333">Sam</text>
  <text x="440" y="272" font-size="9.5" fill="#333">60000</text>
  <text x="488" y="272" font-size="9.5" fill="#888">NULL</text>
  <line x1="365" y1="258" x2="365" y2="278" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="415" y1="258" x2="415" y2="278" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="475" y1="258" x2="475" y2="278" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- JOIN arrow: e.managerId = m.id -->
  <path d="M230 268 L320 268" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="275" y="262" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">ON e.managerId = m.id</text>

  <!-- Compare arrow: e.salary > m.salary -->
  <path d="M160 278 L160 308 L440 308 L440 278" stroke="#d6a040" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="300" y="304" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">WHERE e.salary &gt; m.salary</text>

  <!-- Result callout -->
  <rect x="140" y="350" width="280" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="372" text-anchor="middle" font-size="11" fill="#333">Joe 的 70000 &gt; 经理 Sam 的 60000 ✓</text>
  <text x="280" y="392" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">→ 输出 Joe</text>
  <text x="280" y="410" text-anchor="middle" font-size="9.5" fill="#888">managerId 为 NULL 的行（Sam/Max）无匹配，自动排除</text>
</svg>
