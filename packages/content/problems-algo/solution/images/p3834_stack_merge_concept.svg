<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 370" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="370" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">栈上模拟：栈 = 已化简前缀，新元素只与栈顶对话</text>

  <!-- ===== Row A: current array [3,2,2,1,1] ===== -->
  <text x="30" y="72" font-size="12" fill="#888">当前数组:</text>

  <rect x="110" y="52" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="131" y="73" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="152" y="52" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="173" y="73" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="194" y="52" width="42" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="215" y="73" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="236" y="52" width="42" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="257" y="73" text-anchor="middle" font-size="13" fill="#999">1</text>
  <rect x="278" y="52" width="42" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="299" y="73" text-anchor="middle" font-size="13" fill="#999">1</text>

  <!-- pair highlight: stack top x current element -->
  <rect x="146" y="46" width="96" height="44" fill="none" stroke="#b85450" stroke-width="2" rx="6" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="194" y="40" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">最左相等对</text>
  <text x="352" y="40" font-size="11" fill="#999">扫描 →</text>

  <!-- brackets -->
  <path d="M 110 92 Q 110 100 116 100 L 188 100 Q 194 100 194 92" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="152" y="114" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">栈：已化简，永无相邻相等</text>
  <path d="M 236 92 Q 236 100 242 100 L 314 100 Q 320 100 320 92" stroke="#999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="278" y="114" text-anchor="middle" font-size="10.5" fill="#999">未扫描</text>

  <text x="215" y="136" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">↓ 合并：2+2=4</text>

  <!-- ===== Row B: after merge [3,4,1,1] ===== -->
  <text x="30" y="170" font-size="12" fill="#888">合并后:</text>

  <rect x="110" y="150" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="131" y="171" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="152" y="150" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="173" y="171" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="194" y="150" width="42" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="215" y="171" text-anchor="middle" font-size="13" fill="#999">1</text>
  <rect x="236" y="150" width="42" height="32" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="257" y="171" text-anchor="middle" font-size="13" fill="#999">1</text>

  <text x="280" y="200" text-anchor="middle" font-size="10.5" fill="#666">4 ≠ 栈顶 3 → 入栈；继续扫描 x=1（下一个 1 又与栈顶 1 相等）</text>

  <text x="215" y="222" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">↓ 合并：1+1=2</text>

  <!-- ===== Row C: final [3,4,2] ===== -->
  <text x="30" y="258" font-size="12" fill="#888">最终:</text>

  <rect x="110" y="238" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="131" y="259" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="152" y="238" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="173" y="259" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="194" y="238" width="42" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="215" y="259" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <text x="280" y="288" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">扫描结束 → 栈即最终数组 [3,4,2]</text>

  <!-- Insight box -->
  <rect x="40" y="302" width="480" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">不变式：栈内永无相邻相等 ⇒ 相等对只可能出现在「栈顶 × 当前元素」或更右侧</text>
  <text x="280" y="340" text-anchor="middle" font-size="11" fill="#666">「栈顶 × 当前元素」恰是全数组最左侧的一对——级联合并它，就是「最左优先」</text>
  <text x="280" y="356" text-anchor="middle" font-size="11" fill="#888">每个元素一进一出，均摊 O(n)</text>
</svg>
