<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：正向解密指数分支 → 反向加密字典确定性建表</text>

  <!-- ===== Left side: forward decrypt (bad) ===== -->
  <rect x="28" y="48" width="266" height="372" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="161" y="72" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">✗ 正向解密（模糊）</text>

  <!-- word2 box -->
  <rect x="60" y="86" width="200" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="160" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">word2 = eizfeiam</text>

  <!-- split into 2-char segments -->
  <text x="161" y="138" text-anchor="middle" font-size="10" fill="#888">每 2 字符切段</text>
  <rect x="60" y="146" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="82" y="164" text-anchor="middle" font-size="11" fill="#333">ei</text>
  <rect x="108" y="146" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="130" y="164" text-anchor="middle" font-size="11" fill="#333">zf</text>
  <rect x="156" y="146" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="178" y="164" text-anchor="middle" font-size="11" fill="#333">ei</text>
  <rect x="204" y="146" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="226" y="164" text-anchor="middle" font-size="11" fill="#333">am</text>

  <!-- branching arrows from ei -->
  <path d="M 82 174 L 70 196" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <path d="M 82 174 L 94 196" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <rect x="56" y="198" width="28" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="70" y="214" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">a</text>
  <rect x="88" y="198" width="28" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="102" y="214" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">c</text>

  <text x="178" y="214" text-anchor="middle" font-size="11" fill="#888">ei→{a,c}，分支…</text>

  <!-- exponential explosion -->
  <rect x="60" y="238" width="200" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="160" y="258" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">笛卡尔积 = k^m 个候选</text>
  <text x="160" y="274" text-anchor="middle" font-size="10" fill="#888">m≤100 段 → 2^100 灾难</text>

  <!-- compare with dictionary -->
  <path d="M 160 288 L 160 308" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <rect x="60" y="312" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="160" y="328" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">逐一查 dictionary 集合</text>
  <text x="160" y="344" text-anchor="middle" font-size="10" fill="#888">计数命中</text>

  <text x="161" y="380" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">每次 decrypt 都重算，O(k^m)</text>
  <text x="161" y="398" text-anchor="middle" font-size="10" fill="#888">方向错了：拿模糊匹配确定</text>

  <!-- ===== Right side: inverted encrypt (good) ===== -->
  <rect x="306" y="48" width="266" height="372" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="439" y="72" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓ 反向加密字典（确定）</text>

  <!-- dictionary list -->
  <text x="439" y="96" text-anchor="middle" font-size="10" fill="#888">遍历 dictionary 每个 w</text>
  <rect x="340" y="104" width="74" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="377" y="120" text-anchor="middle" font-size="11" fill="#333">abcd</text>
  <rect x="340" y="130" width="74" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="377" y="146" text-anchor="middle" font-size="11" fill="#333">acbd</text>
  <rect x="340" y="156" width="74" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="377" y="172" text-anchor="middle" font-size="11" fill="#333">…</text>
  <rect x="340" y="182" width="74" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="377" y="198" text-anchor="middle" font-size="11" fill="#333">abad</text>

  <!-- encrypt arrow -->
  <path d="M 414 142 L 460 142" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="437" y="134" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">encrypt</text>
  <text x="437" y="158" text-anchor="middle" font-size="9" fill="#888">确定性 f(w)</text>

  <!-- encrypted results -->
  <rect x="466" y="104" width="92" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="512" y="120" text-anchor="middle" font-size="10" fill="#333">eizfeiam</text>
  <rect x="466" y="130" width="92" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="512" y="146" text-anchor="middle" font-size="10" fill="#333">eieizfam</text>
  <rect x="466" y="156" width="92" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="512" y="172" text-anchor="middle" font-size="10" fill="#333">…</text>
  <rect x="466" y="182" width="92" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="512" y="198" text-anchor="middle" font-size="10" fill="#333">eizfeiam</text>

  <!-- build count map -->
  <path d="M 439 214 L 439 234" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="336" y="238" width="206" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="439" y="258" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">建哈希计数表 cnt</text>
  <text x="439" y="276" text-anchor="middle" font-size="10" fill="#555">cnt[eizfeiam] = 2  ⭐</text>
  <text x="439" y="290" text-anchor="middle" font-size="10" fill="#555">cnt[其他] = 1</text>

  <!-- decrypt query -->
  <path d="M 439 298 L 439 318" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="336" y="322" width="206" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="439" y="340" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">decrypt(word2) = cnt[word2]</text>
  <text x="439" y="356" text-anchor="middle" font-size="10" fill="#888">O(1) 查表，无需枚举</text>

  <text x="439" y="392" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">预处理 O(Σ|w|)，查询 O(1)</text>
  <text x="439" y="408" text-anchor="middle" font-size="10" fill="#888">方向对了：确定方建表</text>

  <!-- center vs arrow -->
  <text x="300" y="232" text-anchor="middle" font-size="20" fill="#888" font-weight="bold">vs</text>
</svg>
