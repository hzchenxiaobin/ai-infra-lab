<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="480" fill="#fafafa"/>

  <text x="310" y="30" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">二号选 y=2（x 的父节点），独占最大块父方区域</text>

  <!-- 父方区域底色（蓝，二号独占） -->
  <path d="M 250 60 Q 220 130 80 200 Q 40 280 50 330 Q 200 360 280 260 Q 300 160 250 60 Z"
        fill="#e8f0fe" opacity="0.55" filter="url(#rough2)"/>

  <!-- 树边 -->
  <line x1="300" y1="82" x2="180" y2="150" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="312" y1="82" x2="420" y2="150" stroke="#b85450" stroke-width="2.2" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <line x1="170" y1="162" x2="100" y2="230" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="190" y1="162" x2="260" y2="230" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="410" y1="162" x2="360" y2="230" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="430" y1="162" x2="480" y2="230" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <line x1="92" y1="242" x2="60" y2="310" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="108" y1="242" x2="140" y2="310" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="252" y1="242" x2="220" y2="310" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>
  <line x1="268" y1="242" x2="300" y2="310" stroke="#446688" stroke-width="1.1" filter="url(#rough2)"/>

  <!-- 二号蓝色独占的父方区域 8 节点 -->
  <circle cx="300" cy="70" r="15" fill="#446688" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">1</text>

  <circle cx="180" cy="150" r="15" fill="#446688" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="180" y="154" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">2</text>
  <text x="152" y="140" font-size="11" fill="#446688" font-weight="bold">y</text>

  <circle cx="100" cy="230" r="13" fill="#446688" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="100" y="234" text-anchor="middle" font-size="10" fill="#fff">4</text>
  <circle cx="260" cy="230" r="13" fill="#446688" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="260" y="234" text-anchor="middle" font-size="10" fill="#fff">5</text>

  <circle cx="60" cy="310" r="11" fill="#446688" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="60" y="314" text-anchor="middle" font-size="9" fill="#fff">8</text>
  <circle cx="140" cy="310" r="11" fill="#446688" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="140" y="314" text-anchor="middle" font-size="9" fill="#fff">9</text>
  <circle cx="220" cy="310" r="11" fill="#446688" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="220" y="314" text-anchor="middle" font-size="9" fill="#fff">10</text>
  <circle cx="300" cy="310" r="11" fill="#446688" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="300" y="314" text-anchor="middle" font-size="9" fill="#fff">11</text>

  <!-- x=3 红色 -->
  <circle cx="420" cy="150" r="16" fill="#b85450" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="420" y="154" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">3</text>
  <text x="448" y="146" font-size="11" fill="#b85450" font-weight="bold">x</text>

  <!-- 一号红色拿到的小块 -->
  <circle cx="360" cy="230" r="13" fill="#b85450" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="360" y="234" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">6</text>
  <circle cx="480" cy="230" r="13" fill="#b85450" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="480" y="234" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">7</text>

  <!-- 堵通道箭头 -->
  <path d="M 200 150 L 405 150" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4,3" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="300" y="142" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">y 堵死 x→父方通道</text>

  <!-- 结算框 -->
  <rect x="60" y="370" width="240" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="180" y="392" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">二号（蓝）= 8 节点</text>
  <text x="180" y="412" text-anchor="middle" font-size="10" fill="#666">独占父方区域 {1,2,4,5,8,9,10,11}</text>
  <text x="180" y="426" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">8 &gt; 5.5 ✓ 必胜</text>

  <rect x="330" y="370" width="230" height="62" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="445" y="392" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">一号（红）= 3 节点</text>
  <text x="445" y="412" text-anchor="middle" font-size="10" fill="#666">x={3} + 左{6} + 右{7}</text>
  <text x="445" y="426" text-anchor="middle" font-size="10" fill="#888">3 &lt; 5.5 ✗</text>

  <text x="310" y="460" text-anchor="middle" font-size="10" fill="#555">M = max(1,1,8) = 8 &gt; n/2 = 5.5 ⇒ 返回 true</text>
</svg>
