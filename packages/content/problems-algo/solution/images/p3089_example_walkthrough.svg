<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：avg = k ÷ 4，阈值 = 2 × avg，max_7day = 各锚点窗口计数的最大值</text>
  <text x="290" y="38" text-anchor="middle" font-size="9" fill="#888">k = 该用户 2 月（02-01 ~ 02-28）总帖数；窗口 [d, d+6] 闭区间 7 天</text>

  <!-- Main table header -->
  <rect x="30" y="50" width="55" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="85" y="50" width="150" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="235" y="50" width="35" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="270" y="50" width="80" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="350" y="50" width="65" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="415" y="50" width="85" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="500" y="50" width="50" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="57" y="65" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">user</text>
  <text x="160" y="65" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">发帖日期</text>
  <text x="252" y="65" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">k</text>
  <text x="310" y="65" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">avg_weekly</text>
  <text x="382" y="65" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">2×avg</text>
  <text x="457" y="65" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">max_7day</text>
  <text x="525" y="65" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">判定</text>

  <!-- Row 1 -->
  <rect x="30" y="72" width="55" height="26" fill="#fafafa" stroke="#999" rx="3" filter="url(#rough2)"/>
  <rect x="85" y="72" width="150" height="26" fill="#fafafa" stroke="#999" rx="3" filter="url(#rough2)"/>
  <rect x="235" y="72" width="35" height="26" fill="#fafafa" stroke="#999" rx="3" filter="url(#rough2)"/>
  <rect x="270" y="72" width="80" height="26" fill="#fafafa" stroke="#999" rx="3" filter="url(#rough2)"/>
  <rect x="350" y="72" width="65" height="26" fill="#fafafa" stroke="#999" rx="3" filter="url(#rough2)"/>
  <rect x="415" y="72" width="85" height="26" fill="#fafafa" stroke="#999" rx="3" filter="url(#rough2)"/>
  <rect x="500" y="72" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" rx="3" filter="url(#rough2)"/>
  <text x="57" y="89" text-anchor="middle" font-size="9" fill="#555">1</text>
  <text x="160" y="89" text-anchor="middle" font-size="9" fill="#555">02-27</text>
  <text x="252" y="89" text-anchor="middle" font-size="9" fill="#555">1</text>
  <text x="310" y="89" text-anchor="middle" font-size="9" fill="#446688">0.2500</text>
  <text x="382" y="89" text-anchor="middle" font-size="9" fill="#d6a040">0.50</text>
  <text x="457" y="89" text-anchor="middle" font-size="9" fill="#555">1</text>
  <text x="525" y="89" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- Row 2 -->
  <rect x="30" y="98" width="55" height="26" fill="#fafafa" stroke="#999" rx="3" filter="url(#rough2)"/>
  <rect x="85" y="98" width="150" height="26" fill="#fafafa" stroke="#999" rx="3" filter="url(#rough2)"/>
  <rect x="235" y="98" width="35" height="26" fill="#fafafa" stroke="#999" rx="3" filter="url(#rough2)"/>
  <rect x="270" y="98" width="80" height="26" fill="#fafafa" stroke="#999" rx="3" filter="url(#rough2)"/>
  <rect x="350" y="98" width="65" height="26" fill="#fafafa" stroke="#999" rx="3" filter="url(#rough2)"/>
  <rect x="415" y="98" width="85" height="26" fill="#fafafa" stroke="#999" rx="3" filter="url(#rough2)"/>
  <rect x="500" y="98" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" rx="3" filter="url(#rough2)"/>
  <text x="57" y="115" text-anchor="middle" font-size="9" fill="#555">2</text>
  <text x="160" y="115" text-anchor="middle" font-size="9" fill="#555">02-25</text>
  <text x="252" y="115" text-anchor="middle" font-size="9" fill="#555">1</text>
  <text x="310" y="115" text-anchor="middle" font-size="9" fill="#446688">0.2500</text>
  <text x="382" y="115" text-anchor="middle" font-size="9" fill="#d6a040">0.50</text>
  <text x="457" y="115" text-anchor="middle" font-size="9" fill="#555">1</text>
  <text x="525" y="115" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- Row 3: user 3 (highlighted) -->
  <rect x="30" y="124" width="55" height="26" fill="#fce4ec" stroke="#b85450" rx="3" filter="url(#rough2)"/>
  <rect x="85" y="124" width="150" height="26" fill="#fce4ec" stroke="#b85450" rx="3" filter="url(#rough2)"/>
  <rect x="235" y="124" width="35" height="26" fill="#fce4ec" stroke="#b85450" rx="3" filter="url(#rough2)"/>
  <rect x="270" y="124" width="80" height="26" fill="#fce4ec" stroke="#b85450" rx="3" filter="url(#rough2)"/>
  <rect x="350" y="124" width="65" height="26" fill="#fce4ec" stroke="#b85450" rx="3" filter="url(#rough2)"/>
  <rect x="415" y="124" width="85" height="26" fill="#fce4ec" stroke="#b85450" rx="3" filter="url(#rough2)"/>
  <rect x="500" y="124" width="50" height="26" fill="#fce4ec" stroke="#b85450" rx="3" filter="url(#rough2)"/>
  <text x="57" y="141" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">3</text>
  <text x="160" y="141" text-anchor="middle" font-size="9" fill="#b85450">02-06、14、25</text>
  <text x="252" y="141" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">3</text>
  <text x="310" y="141" text-anchor="middle" font-size="9" fill="#b85450">0.7500</text>
  <text x="382" y="141" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1.50</text>
  <text x="457" y="141" text-anchor="middle" font-size="9" fill="#b85450">1</text>
  <text x="525" y="141" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✗</text>

  <!-- Row 4 -->
  <rect x="30" y="150" width="55" height="26" fill="#fafafa" stroke="#999" rx="3" filter="url(#rough2)"/>
  <rect x="85" y="150" width="150" height="26" fill="#fafafa" stroke="#999" rx="3" filter="url(#rough2)"/>
  <rect x="235" y="150" width="35" height="26" fill="#fafafa" stroke="#999" rx="3" filter="url(#rough2)"/>
  <rect x="270" y="150" width="80" height="26" fill="#fafafa" stroke="#999" rx="3" filter="url(#rough2)"/>
  <rect x="350" y="150" width="65" height="26" fill="#fafafa" stroke="#999" rx="3" filter="url(#rough2)"/>
  <rect x="415" y="150" width="85" height="26" fill="#fafafa" stroke="#999" rx="3" filter="url(#rough2)"/>
  <rect x="500" y="150" width="50" height="26" fill="#e6f4ea" stroke="#4a7a3a" rx="3" filter="url(#rough2)"/>
  <text x="57" y="167" text-anchor="middle" font-size="9" fill="#555">5</text>
  <text x="160" y="167" text-anchor="middle" font-size="9" fill="#555">02-06</text>
  <text x="252" y="167" text-anchor="middle" font-size="9" fill="#555">1</text>
  <text x="310" y="167" text-anchor="middle" font-size="9" fill="#446688">0.2500</text>
  <text x="382" y="167" text-anchor="middle" font-size="9" fill="#d6a040">0.50</text>
  <text x="457" y="167" text-anchor="middle" font-size="9" fill="#555">1</text>
  <text x="525" y="167" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>

  <text x="290" y="196" text-anchor="middle" font-size="9" fill="#b85450">用户 3 三个锚点窗：[02-06, 02-12] = 1、[02-14, 02-20] = 1、[02-25, 03-02] = 1 → max = 1 &lt; 1.50，落选</text>

  <!-- Output table -->
  <text x="290" y="222" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">输出（ORDER BY user_id 升序）</text>

  <rect x="90" y="232" width="150" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="240" y="232" width="150" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="390" y="232" width="150" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="165" y="246" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">user_id</text>
  <text x="315" y="246" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">max_7day_posts</text>
  <text x="465" y="246" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">avg_weekly_posts</text>

  <rect x="90" y="252" width="150" height="20" fill="#fafafa" stroke="#999" rx="3" filter="url(#rough2)"/>
  <rect x="240" y="252" width="150" height="20" fill="#fafafa" stroke="#999" rx="3" filter="url(#rough2)"/>
  <rect x="390" y="252" width="150" height="20" fill="#fafafa" stroke="#999" rx="3" filter="url(#rough2)"/>
  <text x="165" y="266" text-anchor="middle" font-size="9" fill="#555">1</text>
  <text x="315" y="266" text-anchor="middle" font-size="9" fill="#555">1</text>
  <text x="465" y="266" text-anchor="middle" font-size="9" fill="#555">0.2500</text>

  <rect x="90" y="272" width="150" height="20" fill="#fafafa" stroke="#999" rx="3" filter="url(#rough2)"/>
  <rect x="240" y="272" width="150" height="20" fill="#fafafa" stroke="#999" rx="3" filter="url(#rough2)"/>
  <rect x="390" y="272" width="150" height="20" fill="#fafafa" stroke="#999" rx="3" filter="url(#rough2)"/>
  <text x="165" y="286" text-anchor="middle" font-size="9" fill="#555">2</text>
  <text x="315" y="286" text-anchor="middle" font-size="9" fill="#555">1</text>
  <text x="465" y="286" text-anchor="middle" font-size="9" fill="#555">0.2500</text>

  <rect x="90" y="292" width="150" height="20" fill="#fafafa" stroke="#999" rx="3" filter="url(#rough2)"/>
  <rect x="240" y="292" width="150" height="20" fill="#fafafa" stroke="#999" rx="3" filter="url(#rough2)"/>
  <rect x="390" y="292" width="150" height="20" fill="#fafafa" stroke="#999" rx="3" filter="url(#rough2)"/>
  <text x="165" y="306" text-anchor="middle" font-size="9" fill="#555">5</text>
  <text x="315" y="306" text-anchor="middle" font-size="9" fill="#555">1</text>
  <text x="465" y="306" text-anchor="middle" font-size="9" fill="#555">0.2500</text>

  <!-- Insight box -->
  <rect x="40" y="328" width="500" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="290" y="348" text-anchor="middle" font-size="9" fill="#d6a040">💡 k ≤ 2 必突发：max_7day ≥ 1 ≥ k/2 = 阈值 → 三个单帖用户（1、2、5）全部入选</text>
  <text x="290" y="366" text-anchor="middle" font-size="9" fill="#d6a040">💡 用户 3 帖最多却落选：「突发」比的不是总量，而是局部密度 ÷ 平均密度 ≥ 2</text>
  <text x="290" y="384" text-anchor="middle" font-size="9" fill="#d6a040">⚠️ max_7day_posts = 1 说明输出的是「窗口计数最大值」，不是「达到阈值的窗口数」</text>
  <text x="290" y="402" text-anchor="middle" font-size="9" fill="#d6a040">⚠️ avg_weekly_posts 输出四位小数（0.2500）：MySQL 中 COUNT(1)/4 天然产生 DECIMAL 四位小数</text>
</svg>
