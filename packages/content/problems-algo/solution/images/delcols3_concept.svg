<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：保留列 = 列的「最长递增子序列」</text>

  <!-- ===== Matrix ===== -->
  <text x="40" y="56" font-size="12" fill="#888" font-weight="bold">strs = ["babca","bbazb"]（n=2, m=5）</text>

  <!-- column headers -->
  <text x="120" y="78" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">列0</text>
  <text x="172" y="78" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">列1</text>
  <text x="224" y="78" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">列2</text>
  <text x="276" y="78" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">列3</text>
  <text x="328" y="78" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">列4</text>

  <!-- row labels -->
  <text x="78" y="104" text-anchor="end" font-size="10" fill="#888">行0</text>
  <text x="78" y="134" text-anchor="end" font-size="10" fill="#888">行1</text>

  <!-- Row 0: b a b c a -->
  <rect x="98" y="88" width="44" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="108" text-anchor="middle" font-size="15" fill="#999" font-weight="bold">b</text>
  <rect x="150" y="88" width="44" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="172" y="108" text-anchor="middle" font-size="15" fill="#999" font-weight="bold">a</text>
  <rect x="202" y="88" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="224" y="108" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">b</text>
  <rect x="254" y="88" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="276" y="108" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">c</text>
  <rect x="306" y="88" width="44" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="328" y="108" text-anchor="middle" font-size="15" fill="#999" font-weight="bold">a</text>

  <!-- Row 1: b b a z b -->
  <rect x="98" y="118" width="44" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="138" text-anchor="middle" font-size="15" fill="#999" font-weight="bold">b</text>
  <rect x="150" y="118" width="44" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="172" y="138" text-anchor="middle" font-size="15" fill="#999" font-weight="bold">b</text>
  <rect x="202" y="118" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="224" y="138" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>
  <rect x="254" y="118" width="44" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="276" y="138" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">z</text>
  <rect x="306" y="118" width="44" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="328" y="138" text-anchor="middle" font-size="15" fill="#999" font-weight="bold">b</text>

  <!-- kept columns chain arrow: col2 -> col3 -->
  <path d="M 246 158 L 256 158" stroke="#4a7a3a" stroke-width="2.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="251" y="172" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">保留链</text>

  <!-- delete marks on cols 0,1,4 -->
  <text x="120" y="172" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">删</text>
  <text x="172" y="172" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">删</text>
  <text x="328" y="172" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">删</text>

  <!-- result row -->
  <text x="40" y="196" font-size="11" fill="#666">保留列 2,3 → 行0 "bc" 非降，行1 "az" 非降 ✓</text>

  <!-- separator -->
  <path d="M 40 212 L 520 212" stroke="#e0e0e0" stroke-width="1" fill="none" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- ===== Predicate ===== -->
  <text x="40" y="234" font-size="12" fill="#888" font-weight="bold">列间「可比」谓词 le(i, j)：</text>

  <rect x="60" y="244" width="440" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="266" text-anchor="middle" font-size="11" fill="#333">le(i, j) ⟺ ∀ r：strs[r][i] ≤ strs[r][j]　（所有行同时非降）</text>

  <!-- example: col2 -> col3 ok -->
  <rect x="60" y="288" width="220" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="170" y="306" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">列2 → 列3 ✓</text>
  <text x="170" y="322" text-anchor="middle" font-size="10" fill="#4a7a3a">b≤c 且 a≤z，两行都满足</text>

  <!-- example: col1 -> col4 ok -->
  <rect x="290" y="288" width="220" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="400" y="306" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">列1 → 列4 ✓</text>
  <text x="400" y="322" text-anchor="middle" font-size="10" fill="#4a7a3a">a≤a 且 b≤b，两行都满足</text>

  <!-- example: col0 -> col4 fail -->
  <rect x="175" y="346" width="220" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="285" y="364" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">列0 → 列4 ✗</text>
  <text x="285" y="380" text-anchor="middle" font-size="10" fill="#b85450">行0 b≤a? 失败 → 整体不可比</text>

  <!-- ===== Core idea box ===== -->
  <rect x="40" y="404" width="480" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="422" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">dp[j] = 1 + max{dp[i] : i&lt;j, le(i,j)}　答案 = m − max(dp)</text>
</svg>
