  <!-- 结果框 -->
  <rect x="40" y="338" width="460" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="360" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3 步完成 8 位翻转 ✓（32 位时多两步：8 位组 0x0F→字节、16 位组）</text>

  <!-- 说明 -->
  <rect x="40" y="384" width="460" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="404" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">思想：自底向上倍增——先翻最小块（2 位），再合并翻大块（4、8…）</text>
  <text x="270" y="420" text-anchor="middle" font-size="11" fill="#888">每步用掩码取奇偶组分别左/右移再 OR，无循环，32 位共 5 步 O(1)</text>
  <text x="270" y="436" text-anchor="middle" font-size="10.5" fill="#888">32 位掩码：0x55/0x33/0x0F（字节内）/0x00FF（字节间）/0x0000FFFF（半字间）</text>
