<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：直到落在取用区才返回</text>

  <!-- Table header -->
  <rect x="40" y="52" width="60" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="72" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">轮次</text>
  <rect x="100" y="52" width="50" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="125" y="72" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">a</text>
  <rect x="150" y="52" width="50" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="175" y="72" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">b</text>
  <rect x="200" y="52" width="120" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="72" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">x=(a−1)×7+b</text>
  <rect x="320" y="52" width="110" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="375" y="72" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">判定</text>
  <rect x="430" y="52" width="90" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="475" y="72" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">输出</text>

  <!-- Row 1: a=7,b=3 -> x=43 -> reject -->
  <rect x="40" y="86" width="60" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="107" text-anchor="middle" font-size="12" fill="#333">第 1 次</text>
  <rect x="100" y="86" width="50" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="125" y="107" text-anchor="middle" font-size="12" fill="#333">7</text>
  <rect x="150" y="86" width="50" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="175" y="107" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="200" y="86" width="120" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="107" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">43</text>
  <rect x="320" y="86" width="110" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="375" y="107" text-anchor="middle" font-size="11" fill="#b85450">&gt; 40, 丢弃</text>
  <rect x="430" y="86" width="90" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="475" y="107" text-anchor="middle" font-size="11" fill="#b85450">重试 ↻</text>

  <!-- Row 2: a=6,b=7 -> x=42 -> reject -->
  <rect x="40" y="122" width="60" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="143" text-anchor="middle" font-size="12" fill="#333">第 2 次</text>
  <rect x="100" y="122" width="50" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="125" y="143" text-anchor="middle" font-size="12" fill="#333">6</text>
  <rect x="150" y="122" width="50" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="175" y="143" text-anchor="middle" font-size="12" fill="#333">7</text>
  <rect x="200" y="122" width="120" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="143" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">42</text>
  <rect x="320" y="122" width="110" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="375" y="143" text-anchor="middle" font-size="11" fill="#b85450">&gt; 40, 丢弃</text>
  <rect x="430" y="122" width="90" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="475" y="143" text-anchor="middle" font-size="11" fill="#b85450">重试 ↻</text>

  <!-- Row 3: a=4,b=2 -> x=23 -> accept -> (23-1)%10+1 = 3 -->
  <rect x="40" y="158" width="60" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="179" text-anchor="middle" font-size="12" fill="#333">第 3 次</text>
  <rect x="100" y="158" width="50" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="125" y="179" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="150" y="158" width="50" height="32" fill="#fafafa" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="175" y="179" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="200" y="158" width="120" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="179" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">23</text>
  <rect x="320" y="158" width="110" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="375" y="179" text-anchor="middle" font-size="11" fill="#4a7a3a">≤ 40, 取用</text>
  <rect x="430" y="158" width="90" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="475" y="179" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>

  <!-- mapping detail for row 3 -->
  <path d="M 475 190 L 475 210" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="350" y="214" width="250" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="475" y="237" text-anchor="middle" font-size="11" fill="#444">(23 − 1) % 10 + 1 = 22 % 10 + 1 = 3</text>

  <!-- Probability box -->
  <rect x="40" y="270" width="480" height="84" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="292" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">概率与期望分析</text>
  <text x="280" y="312" text-anchor="middle" font-size="11" fill="#555">单次取用概率 p = 40 / 49 ≈ 0.816</text>
  <text x="280" y="330" text-anchor="middle" font-size="11" fill="#555">期望尝试次数 = 1 / p = 49 / 40 ≈ 1.225 轮</text>
  <text x="280" y="348" text-anchor="middle" font-size="11" fill="#555">期望调用 rand7() ≈ 2 × 1.225 ≈ 2.45 次</text>

  <!-- footnote -->
  <text x="280" y="380" text-anchor="middle" font-size="11" fill="#888">丢弃事件不改变取用区内的相对概率 → 结果仍严格均匀</text>
  <text x="280" y="398" text-anchor="middle" font-size="11" fill="#888">连续两次被丢弃概率仅 (9/49)² ≈ 3.4%，几乎总能 1~2 轮内返回</text>
</svg>
