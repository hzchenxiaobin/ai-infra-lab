<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">两种解法对比：DENSE_RANK 窗口函数 vs 相关子查询 COUNT(DISTINCT)</text>

  <!-- ===== Left: Approach A (window function) ===== -->
  <rect x="30" y="48" width="280" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="170" y="71" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">解法 A：DENSE_RANK 窗口函数（推荐）</text>

  <rect x="40" y="94" width="260" height="150" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="52" y="112" font-size="9" fill="#446688" font-family="monospace">SELECT Dept, Emp, Sal FROM (</text>
  <text x="52" y="126" font-size="9" fill="#446688" font-family="monospace">  SELECT d.name Dept, e.name Emp,</text>
  <text x="52" y="140" font-size="9" fill="#446688" font-family="monospace">         e.salary Sal,</text>
  <text x="52" y="154" font-size="9" fill="#b85450" font-family="monospace" font-weight="bold">         DENSE_RANK() OVER(</text>
  <text x="52" y="168" font-size="9" fill="#446688" font-family="monospace">           PARTITION BY e.depId</text>
  <text x="52" y="182" font-size="9" fill="#446688" font-family="monospace">           ORDER BY e.salary DESC) rk</text>
  <text x="52" y="196" font-size="9" fill="#446688" font-family="monospace">  FROM Emp e JOIN Dep d ON ...</text>
  <text x="52" y="210" font-size="9" fill="#446688" font-family="monospace">) t</text>
  <text x="52" y="224" font-size="9" fill="#4a7a3a" font-family="monospace" font-weight="bold">WHERE rk &lt;= 3;</text>
  <text x="52" y="238" font-size="8" fill="#888">需 MySQL 8.0+ 支持窗口函数</text>

  <!-- flow box A -->
  <rect x="40" y="256" width="260" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="60" y="274" font-size="9" fill="#333" font-weight="bold">执行流程：</text>
  <text x="60" y="290" font-size="9" fill="#555">① JOIN 部门名 → 带部门信息的行</text>
  <text x="60" y="306" font-size="9" fill="#b85450" font-weight="bold">② PARTITION BY 部门分组排序</text>
  <text x="60" y="320" font-size="9" fill="#555">   一次排序 O(n log n) 打名次</text>
  <text x="60" y="336" font-size="9" fill="#4a7a3a" font-weight="bold">③ 外层 WHERE rk ≤ 3 过滤</text>
  <text x="60" y="350" font-size="9" fill="#555">   套子查询：窗口晚于 WHERE</text>

  <!-- complexity A -->
  <rect x="40" y="368" width="260" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="170" y="386" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">复杂度与优势</text>
  <text x="52" y="402" font-size="9" fill="#555">时间 O(n log n)：一次分区排序</text>
  <text x="52" y="416" font-size="9" fill="#555">✓ 扩展 Top-K：rk≤K 改数字即可</text>
  <text x="52" y="430" font-size="9" fill="#555">✓ 184（rk=1）→ 185（rk≤3）一行</text>

  <!-- ===== Right: Approach B (correlated subquery) ===== -->
  <rect x="330" y="48" width="280" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="470" y="71" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">解法 B：相关子查询 COUNT(DISTINCT)</text>

  <rect x="340" y="94" width="260" height="150" fill="#fafafa" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="352" y="112" font-size="9" fill="#446688" font-family="monospace">SELECT d.name Dept, e1.name Emp,</text>
  <text x="352" y="126" font-size="9" fill="#446688" font-family="monospace">       e1.salary Sal</text>
  <text x="352" y="140" font-size="9" fill="#446688" font-family="monospace">FROM Emp e1 JOIN Dep d ON ...</text>
  <text x="352" y="154" font-size="9" fill="#b85450" font-family="monospace" font-weight="bold">WHERE (</text>
  <text x="352" y="168" font-size="9" fill="#446688" font-family="monospace">  SELECT COUNT(DISTINCT e2.sal)</text>
  <text x="352" y="182" font-size="9" fill="#446688" font-family="monospace">  FROM Emp e2</text>
  <text x="352" y="196" font-size="9" fill="#446688" font-family="monospace">  WHERE e2.depId=e1.depId</text>
  <text x="352" y="210" font-size="9" fill="#446688" font-family="monospace">    AND e2.sal &gt; e1.sal</text>
  <text x="352" y="224" font-size="9" fill="#4a7a3a" font-family="monospace" font-weight="bold">) &lt; 3;</text>
  <text x="352" y="238" font-size="8" fill="#888">DENSE_RANK 等价表达，旧版可用</text>

  <!-- flow box B -->
  <rect x="340" y="256" width="260" height="100" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="360" y="274" font-size="9" fill="#333" font-weight="bold">执行流程：</text>
  <text x="360" y="290" font-size="9" fill="#555">① JOIN 部门名 → 带部门信息的行</text>
  <text x="360" y="306" font-size="9" fill="#b85450" font-weight="bold">② 逐行触发相关子查询</text>
  <text x="360" y="320" font-size="9" fill="#555">   数同部门严格更大的「不同值」</text>
  <text x="360" y="336" font-size="9" fill="#4a7a3a" font-weight="bold">③ &lt; 3 即前三档（0/1/2 个更大）</text>
  <text x="360" y="350" font-size="9" fill="#555">   DISTINCT+&gt; 不可省（见下）</text>

  <!-- complexity B -->
  <rect x="340" y="368" width="260" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="470" y="386" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">复杂度与注意</text>
  <text x="352" y="402" font-size="9" fill="#555">时间 O(n²)：每行全表扫描+去重</text>
  <text x="352" y="416" font-size="9" fill="#555">⚠ 省 DISTINCT → 退化为 RANK 漏档</text>
  <text x="352" y="430" font-size="9" fill="#555">⚠ 用 ≥ 代替 &gt; → 逻辑全错</text>

  <!-- center equivalence arrow -->
  <path d="M310 168 L330 168" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M330 168 L310 168" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="320" y="160" text-anchor="middle" font-size="8" fill="#888">等价</text>

  <!-- bottom equivalence formula -->
  <rect x="40" y="446" width="560" height="10" fill="none"/>
  <text x="320" y="454" text-anchor="middle" font-size="9" fill="#555" font-weight="bold">DENSE_RANK(x) = COUNT(DISTINCT 同部门更大值) + 1 → Top-K 即「更大不同值 &lt; K」</text>
</svg>
