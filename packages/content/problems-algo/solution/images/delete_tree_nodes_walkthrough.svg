<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：后序逐节点累加（删后不贡献）</text>

  <!-- ===== table frame ===== -->
  <!-- columns: 序 | 节点 | value | 孩子贡献 | 子树和 s | 节点数 c | 动作 -->
  <!-- x positions: 40, 90, 150, 210, 300, 360, 430 ; widths fit -->
  <g filter="url(#rough2)">
    <!-- header row -->
    <rect x="34" y="44" width="492" height="28" fill="#446688" stroke="#446688" stroke-width="1.4" rx="3"/>
    <text x="60"  y="62" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">序</text>
    <text x="100" y="62" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">节点</text>
    <text x="156" y="62" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">value</text>
    <text x="232" y="62" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">孩子贡献</text>
    <text x="312" y="62" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">子树和 s</text>
    <text x="372" y="62" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">节点数 c</text>
    <text x="452" y="62" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">动作</text>

    <!-- vertical separators -->
    <line x1="80"  y1="44" x2="80"  y2="300" stroke="#cfd8e8" stroke-width="1"/>
    <line x1="124" y1="44" x2="124" y2="300" stroke="#cfd8e8" stroke-width="1"/>
    <line x1="188" y1="44" x2="188" y2="300" stroke="#cfd8e8" stroke-width="1"/>
    <line x1="278" y1="44" x2="278" y2="300" stroke="#cfd8e8" stroke-width="1"/>
    <line x1="346" y1="44" x2="346" y2="300" stroke="#cfd8e8" stroke-width="1"/>
    <line x1="400" y1="44" x2="400" y2="300" stroke="#cfd8e8" stroke-width="1"/>
  </g>

  <!-- row heights: 28, start y=72; rows at 72,100,128,156,184,212,240 -->
  <!-- row 1: node 3 deleted -->
  <g filter="url(#rough2)">
    <rect x="34" y="72" width="492" height="28" fill="#fce4ec" stroke="#e3c0bd" stroke-width="1"/>
    <text x="60"  y="90" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="100" y="90" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
    <text x="156" y="90" text-anchor="middle" font-size="11" fill="#333">0</text>
    <text x="232" y="90" text-anchor="middle" font-size="11" fill="#888">—</text>
    <text x="312" y="90" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
    <text x="372" y="90" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
    <text x="452" y="90" text-anchor="middle" font-size="11" fill="#b85450">删除</text>
  </g>

  <!-- row 2: node 4 kept -->
  <g filter="url(#rough2)">
    <rect x="34" y="100" width="492" height="28" fill="#ffffff" stroke="#e8e8e8" stroke-width="1"/>
    <text x="60"  y="118" text-anchor="middle" font-size="11" fill="#333">2</text>
    <text x="100" y="118" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
    <text x="156" y="118" text-anchor="middle" font-size="11" fill="#333">-2</text>
    <text x="232" y="118" text-anchor="middle" font-size="11" fill="#888">—</text>
    <text x="312" y="118" text-anchor="middle" font-size="11" fill="#333">-2</text>
    <text x="372" y="118" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="452" y="118" text-anchor="middle" font-size="11" fill="#4a7a3a">保留</text>
  </g>

  <!-- row 3: node 5 kept -->
  <g filter="url(#rough2)">
    <rect x="34" y="128" width="492" height="28" fill="#f6faf6" stroke="#e8e8e8" stroke-width="1"/>
    <text x="60"  y="146" text-anchor="middle" font-size="11" fill="#333">3</text>
    <text x="100" y="146" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
    <text x="156" y="146" text-anchor="middle" font-size="11" fill="#333">-1</text>
    <text x="232" y="146" text-anchor="middle" font-size="11" fill="#888">—</text>
    <text x="312" y="146" text-anchor="middle" font-size="11" fill="#333">-1</text>
    <text x="372" y="146" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="452" y="146" text-anchor="middle" font-size="11" fill="#4a7a3a">保留</text>
  </g>

  <!-- row 4: node 6 kept -->
  <g filter="url(#rough2)">
    <rect x="34" y="156" width="492" height="28" fill="#ffffff" stroke="#e8e8e8" stroke-width="1"/>
    <text x="60"  y="174" text-anchor="middle" font-size="11" fill="#333">4</text>
    <text x="100" y="174" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>
    <text x="156" y="174" text-anchor="middle" font-size="11" fill="#333">-1</text>
    <text x="232" y="174" text-anchor="middle" font-size="11" fill="#888">—</text>
    <text x="312" y="174" text-anchor="middle" font-size="11" fill="#333">-1</text>
    <text x="372" y="174" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="452" y="174" text-anchor="middle" font-size="11" fill="#4a7a3a">保留</text>
  </g>

  <!-- row 5: node 1 kept (child 3 deleted → contributes 0) -->
  <g filter="url(#rough2)">
    <rect x="34" y="184" width="492" height="28" fill="#f6faf6" stroke="#e8e8e8" stroke-width="1"/>
    <text x="60"  y="202" text-anchor="middle" font-size="11" fill="#333">5</text>
    <text x="100" y="202" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
    <text x="156" y="202" text-anchor="middle" font-size="11" fill="#333">-2</text>
    <text x="232" y="202" text-anchor="middle" font-size="11" fill="#888">子3: (0,0)</text>
    <text x="312" y="202" text-anchor="middle" font-size="11" fill="#333">-2</text>
    <text x="372" y="202" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="452" y="202" text-anchor="middle" font-size="11" fill="#4a7a3a">保留</text>
  </g>

  <!-- row 6: node 2 deleted (4 + (-2)+(-1)+(-1) = 0) -->
  <g filter="url(#rough2)">
    <rect x="34" y="212" width="492" height="28" fill="#fce4ec" stroke="#e3c0bd" stroke-width="1"/>
    <text x="60"  y="230" text-anchor="middle" font-size="11" fill="#333">6</text>
    <text x="100" y="230" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
    <text x="156" y="230" text-anchor="middle" font-size="11" fill="#333">4</text>
    <text x="232" y="230" text-anchor="middle" font-size="11" fill="#888">4:-2,5:-1,6:-1</text>
    <text x="312" y="230" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
    <text x="372" y="230" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
    <text x="452" y="230" text-anchor="middle" font-size="11" fill="#b85450">删除</text>
  </g>

  <!-- row 7: node 0 kept (answer c=2) -->
  <g filter="url(#rough2)">
    <rect x="34" y="240" width="492" height="28" fill="#e6f4ea" stroke="#bcd9b4" stroke-width="1.4"/>
    <text x="60"  y="258" text-anchor="middle" font-size="11" fill="#333">7</text>
    <text x="100" y="258" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
    <text x="156" y="258" text-anchor="middle" font-size="11" fill="#333">1</text>
    <text x="232" y="258" text-anchor="middle" font-size="11" fill="#888">1:(-2,1),2:(0,0)</text>
    <text x="312" y="258" text-anchor="middle" font-size="11" fill="#333">-1</text>
    <text x="372" y="258" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="452" y="258" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">答案=2</text>
  </g>

  <!-- ===== footer note ===== -->
  <rect x="40" y="290" width="480" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="310" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">关键：孩子被删 → 返回 (0, 0)，对父节点"零贡献"</text>
  <text x="280" y="328" text-anchor="middle" font-size="11" fill="#666">节点 3 被删使节点 1 仍为 -2；节点 2 整体为 0 连带 4,5,6 一并删除</text>
</svg>
