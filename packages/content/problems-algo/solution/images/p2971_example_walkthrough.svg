<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [1,12,1,2,5,50,3]</text>

  <!-- 排序后数组 -->
  <text x="40" y="64" font-size="12" fill="#4a7a3a" filter="url(#rough2)">排序后：</text>
  <rect x="106" y="46" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="132" y="67" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="158" y="46" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="184" y="67" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="210" y="46" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="236" y="67" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="262" y="46" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="288" y="67" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="314" y="46" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="340" y="67" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="366" y="46" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="392" y="67" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">12</text>
  <rect x="418" y="46" width="52" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="444" y="67" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">50</text>

  <text x="132" y="92" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">i=0</text>
  <text x="184" y="92" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1</text>
  <text x="236" y="92" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">2</text>
  <text x="288" y="92" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">3</text>
  <text x="340" y="92" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">4</text>
  <text x="392" y="92" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">5</text>
  <text x="444" y="92" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">6</text>

  <!-- 前缀和行 -->
  <text x="30" y="134" font-size="12" fill="#446688" filter="url(#rough2)">pre[i]：</text>
  <rect x="106" y="112" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="132" y="132" text-anchor="middle" font-size="12" fill="#33506e" filter="url(#rough2)">1</text>
  <rect x="158" y="112" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="184" y="132" text-anchor="middle" font-size="12" fill="#33506e" filter="url(#rough2)">2</text>
  <rect x="210" y="112" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="236" y="132" text-anchor="middle" font-size="12" fill="#33506e" filter="url(#rough2)">4</text>
  <rect x="262" y="112" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="288" y="132" text-anchor="middle" font-size="12" fill="#33506e" filter="url(#rough2)">7</text>
  <rect x="314" y="112" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="340" y="132" text-anchor="middle" font-size="12" fill="#33506e" filter="url(#rough2)">12</text>
  <rect x="366" y="112" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="392" y="132" text-anchor="middle" font-size="12" fill="#33506e" filter="url(#rough2)">24</text>
  <rect x="418" y="112" width="52" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="444" y="132" text-anchor="middle" font-size="12" fill="#33506e" filter="url(#rough2)">74</text>

  <text x="70" y="132" font-size="10" fill="#888" filter="url(#rough2)">（i=1…7）</text>

  <!-- 分隔线 -->
  <path d="M 40 156 L 480 156" stroke="#ccc" stroke-width="1" stroke-dasharray="6 5" filter="url(#rough2)"/>

  <!-- 三步检查 -->
  <text x="40" y="184" font-size="12" fill="#555" filter="url(#rough2)">倒序检查：</text>

  <!-- 步骤 1: i=6 -->
  <rect x="60" y="196" width="400" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="76" y="218" font-size="12" fill="#7a2e2a" filter="url(#rough2)">i = 6：最长边 50，其余和 pre[6] = 1+1+2+3+5+12 = 24</text>
  <text x="76" y="238" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">50 &lt; 24 ？ ✗ 太长了，压不住 → 左移</text>

  <!-- 步骤 2: i=5 -->
  <rect x="60" y="262" width="400" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="76" y="284" font-size="12" fill="#7a5a10" filter="url(#rough2)">i = 5：最长边 12，其余和 pre[5] = 1+1+2+3+5 = 12</text>
  <text x="76" y="304" font-size="12" fill="#b8860b" font-weight="bold" filter="url(#rough2)">12 &lt; 12 ？ ✗ 恰好相等，退化成线段 → 左移</text>

  <!-- 步骤 3: i=4 -->
  <rect x="60" y="328" width="400" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="76" y="350" font-size="12" fill="#2f5d24" filter="url(#rough2)">i = 4：最长边 5，其余和 pre[4] = 1+1+2+3 = 7</text>
  <text x="76" y="370" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">5 &lt; 7 ？ ✓ 首次命中 → 返回 pre[5] = 12</text>

  <!-- 结论框 -->
  <rect x="110" y="398" width="300" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="418" text-anchor="middle" font-size="12" fill="#33506e" filter="url(#rough2)">答案：五边形 1+1+2+3+5，周长 = 12</text>
</svg>
