<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    示例演算：示例 1 的 BFS 逐层扩展
  </text>
  <text x="280" y="44" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    起点 (1,1)，食物在 (2,3)，第 3 层首达
  </text>

  <!-- ===== Grid (left) cell 40, origin x=30 y=64 ===== -->
  <g filter="url(#rough2)">
    <!-- Row 0: all X -->
    <rect x="30" y="64" width="40" height="40" fill="#f0f0f0" stroke="#bbb" rx="3"/>
    <rect x="70" y="64" width="40" height="40" fill="#f0f0f0" stroke="#bbb" rx="3"/>
    <rect x="110" y="64" width="40" height="40" fill="#f0f0f0" stroke="#bbb" rx="3"/>
    <rect x="150" y="64" width="40" height="40" fill="#f0f0f0" stroke="#bbb" rx="3"/>
    <rect x="190" y="64" width="40" height="40" fill="#f0f0f0" stroke="#bbb" rx="3"/>
    <rect x="230" y="64" width="40" height="40" fill="#f0f0f0" stroke="#bbb" rx="3"/>
    <!-- Row 1: X * O O O X -->
    <rect x="30" y="104" width="40" height="40" fill="#f0f0f0" stroke="#bbb" rx="3"/>
    <rect x="70" y="104" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="3"/>
    <rect x="110" y="104" width="40" height="40" fill="#fff8e1" stroke="#d6a040" rx="3"/>
    <rect x="150" y="104" width="40" height="40" fill="#e8f0fe" stroke="#446688" rx="3"/>
    <rect x="190" y="104" width="40" height="40" fill="#eaf6ee" stroke="#4a8e4a" rx="3"/>
    <rect x="230" y="104" width="40" height="40" fill="#f0f0f0" stroke="#bbb" rx="3"/>
    <!-- Row 2: X O O # O X -->
    <rect x="30" y="144" width="40" height="40" fill="#f0f0f0" stroke="#bbb" rx="3"/>
    <rect x="70" y="144" width="40" height="40" fill="#fff8e1" stroke="#d6a040" rx="3"/>
    <rect x="110" y="144" width="40" height="40" fill="#e8f0fe" stroke="#446688" rx="3"/>
    <rect x="150" y="144" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="3"/>
    <rect x="190" y="144" width="40" height="40" fill="#fff" stroke="#bbb" rx="3"/>
    <rect x="230" y="144" width="40" height="40" fill="#f0f0f0" stroke="#bbb" rx="3"/>
    <!-- Row 3: all X -->
    <rect x="30" y="184" width="40" height="40" fill="#f0f0f0" stroke="#bbb" rx="3"/>
    <rect x="70" y="184" width="40" height="40" fill="#f0f0f0" stroke="#bbb" rx="3"/>
    <rect x="110" y="184" width="40" height="40" fill="#f0f0f0" stroke="#bbb" rx="3"/>
    <rect x="150" y="184" width="40" height="40" fill="#f0f0f0" stroke="#bbb" rx="3"/>
    <rect x="190" y="184" width="40" height="40" fill="#f0f0f0" stroke="#bbb" rx="3"/>
    <rect x="230" y="184" width="40" height="40" fill="#f0f0f0" stroke="#bbb" rx="3"/>
  </g>

  <!-- cell content labels -->
  <g font-size="14" filter="url(#rough2)">
    <text x="50" y="90" text-anchor="middle" fill="#999">X</text>
    <text x="90" y="90" text-anchor="middle" fill="#999">X</text>
    <text x="130" y="90" text-anchor="middle" fill="#999">X</text>
    <text x="170" y="90" text-anchor="middle" fill="#999">X</text>
    <text x="210" y="90" text-anchor="middle" fill="#999">X</text>
    <text x="250" y="90" text-anchor="middle" fill="#999">X</text>
    <text x="50" y="130" text-anchor="middle" fill="#999">X</text>
    <text x="90" y="130" text-anchor="middle" fill="#b03a3a" font-weight="bold">*</text>
    <text x="130" y="130" text-anchor="middle" fill="#7a5415">O</text>
    <text x="170" y="130" text-anchor="middle" fill="#446688">O</text>
    <text x="210" y="130" text-anchor="middle" fill="#4a8e4a">O</text>
    <text x="250" y="130" text-anchor="middle" fill="#999">X</text>
    <text x="50" y="170" text-anchor="middle" fill="#999">X</text>
    <text x="90" y="170" text-anchor="middle" fill="#7a5415">O</text>
    <text x="130" y="170" text-anchor="middle" fill="#446688">O</text>
    <text x="170" y="170" text-anchor="middle" fill="#2e6e2e" font-weight="bold">#</text>
    <text x="210" y="170" text-anchor="middle" fill="#bbb">O</text>
    <text x="250" y="170" text-anchor="middle" fill="#999">X</text>
    <text x="50" y="210" text-anchor="middle" fill="#999">X</text>
    <text x="90" y="210" text-anchor="middle" fill="#999">X</text>
    <text x="130" y="210" text-anchor="middle" fill="#999">X</text>
    <text x="170" y="210" text-anchor="middle" fill="#999">X</text>
    <text x="210" y="210" text-anchor="middle" fill="#999">X</text>
    <text x="250" y="210" text-anchor="middle" fill="#999">X</text>
  </g>

  <!-- distance numbers -->
  <g font-size="9" fill="#888" filter="url(#rough2)">
    <text x="104" y="116">0</text>
    <text x="144" y="116">1</text>
    <text x="104" y="156">1</text>
    <text x="184" y="116">2</text>
    <text x="144" y="156">2</text>
    <text x="224" y="116">3</text>
    <text x="184" y="156">3</text>
  </g>

  <!-- food arrow -->
  <path d="M 276,164 L 296,164" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ===== Right panel: queue evolution ===== -->
  <rect x="300" y="60" width="240" height="170" fill="#fffdf3" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="420" y="80" text-anchor="middle" font-size="12" font-weight="bold" fill="#5a4a1a" filter="url(#rough2)">BFS 队列演化</text>
  <g font-size="10" fill="#444" filter="url(#rough2)">
    <text x="316" y="102" font-weight="bold" fill="#b85450">init</text>
    <text x="316" y="116">q = [(1,1)]  ← 起点 *</text>
    <text x="316" y="138" font-weight="bold" fill="#d6a040">step 1</text>
    <text x="316" y="152">pop (1,1) → push (2,1),(1,2)</text>
    <text x="316" y="166" fill="#888">q = [(2,1), (1,2)]</text>
    <text x="316" y="188" font-weight="bold" fill="#446688">step 2</text>
    <text x="316" y="202">pop (2,1),(1,2) → push (2,2),(1,3)</text>
    <text x="316" y="216" fill="#888">q = [(2,2), (1,3)]</text>
  </g>

  <!-- found banner -->
  <rect x="300" y="238" width="240" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="420" y="254" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold" filter="url(#rough2)">step 3：pop (2,2)</text>
  <text x="420" y="268" text-anchor="middle" font-size="10" fill="#2e6e2e" filter="url(#rough2)">邻居 (2,3) = '#' → return 3</text>

  <!-- ===== Bottom: summary table ===== -->
  <rect x="30" y="290" width="510" height="110" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="285" y="312" text-anchor="middle" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">逐层 frontier 与首达食物</text>
  <g font-size="11" filter="url(#rough2)">
    <text x="50" y="334" font-weight="bold" fill="#888">step</text>
    <text x="120" y="334" font-weight="bold" fill="#888">frontier (本层 pop)</text>
    <text x="290" y="334" font-weight="bold" fill="#888">新入队</text>
    <text x="440" y="334" font-weight="bold" fill="#888">结果</text>

    <text x="50" y="354" fill="#d6a040">1</text>
    <text x="120" y="354">(1,1)</text>
    <text x="290" y="354">(2,1), (1,2)</text>
    <text x="440" y="354" fill="#888">—</text>

    <text x="50" y="372" fill="#446688">2</text>
    <text x="120" y="372">(2,1), (1,2)</text>
    <text x="290" y="372">(2,2), (1,3)</text>
    <text x="440" y="372" fill="#888">—</text>
  </g>
  <!-- step 3 highlighted row -->
  <rect x="34" y="380" width="502" height="16" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g font-size="11" filter="url(#rough2)">
    <text x="50" y="392" fill="#2e6e2e" font-weight="bold">3</text>
    <text x="120" y="392" fill="#2e6e2e">(2,2), (1,3)</text>
    <text x="290" y="392" fill="#2e6e2e">(2,3) = '#'</text>
    <text x="440" y="392" fill="#2e6e2e" font-weight="bold">return 3 ✓</text>
  </g>
</svg>
