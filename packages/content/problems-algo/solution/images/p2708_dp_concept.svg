<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">维护 curMax 与 curMin：负数让最小值翻身变最大</text>

  <!-- Old state label -->
  <text x="40" y="58" font-size="12" fill="#888">已处理元素的非空子集乘积：</text>

  <!-- curMax box (green) -->
  <rect x="50" y="74" width="110" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="105" y="92" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">curMax</text>
  <text x="105" y="108" text-anchor="middle" font-size="11" fill="#555">最大（最正）</text>

  <!-- curMin box (red) -->
  <rect x="50" y="130" width="110" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="105" y="148" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">curMin</text>
  <text x="105" y="164" text-anchor="middle" font-size="11" fill="#555">最小（最负）</text>

  <!-- new num -->
  <rect x="230" y="102" width="70" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="265" y="120" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">num</text>
  <text x="265" y="136" text-anchor="middle" font-size="11" fill="#555">新元素</text>

  <!-- arrow from curMax to num -->
  <path d="M 160 95 Q 195 95 230 115" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="188" y="88" text-anchor="middle" font-size="10" fill="#4a7a3a">×num</text>

  <!-- arrow from curMin to num (the flip, emphasized) -->
  <path d="M 160 151 Q 195 145 230 130" stroke="#b85450" stroke-width="2.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="192" y="158" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">×num(翻身)</text>

  <!-- candidates box -->
  <rect x="330" y="70" width="170" height="120" fill="#fafafa" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="415" y="90" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">四个候选取极值</text>
  <text x="345" y="110" font-size="11" fill="#333">① curMax      （不选 num）</text>
  <text x="345" y="128" font-size="11" fill="#333">② num          （单取）</text>
  <text x="345" y="146" font-size="11" fill="#4a7a3a">③ curMax · num</text>
  <text x="345" y="164" font-size="11" fill="#b85450" font-weight="bold">④ curMin · num  ← 负×负翻号</text>
  <text x="345" y="182" font-size="10" fill="#888">max→newMax / min→newMin</text>

  <!-- arrow num -> candidates -->
  <path d="M 300 123 L 330 123" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Highlight: curMin*num becomes newMax -->
  <rect x="330" y="222" width="170" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="415" y="240" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">当 num &lt; 0</text>
  <text x="415" y="258" text-anchor="middle" font-size="11" fill="#4a7a3a">curMin·num 可翻身成 newMax</text>

  <path d="M 415 190 L 415 222" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)" stroke-dasharray="4 3"/>

  <!-- example callout -->
  <rect x="30" y="222" width="270" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="44" y="244" font-size="12" fill="#446688" font-weight="bold">示例片段</text>
  <text x="44" y="263" font-size="11" fill="#444">curMin = -150，num = -9</text>
  <text x="44" y="280" font-size="11" fill="#444">curMax·num = 150·(-9) = -1350</text>
  <text x="44" y="297" font-size="11" fill="#b85450" font-weight="bold">curMin·num = (-150)·(-9) = 1350 ✓</text>
  <text x="44" y="314" font-size="10" fill="#888">→ newMax = 1350，由最小值翻身而来</text>

  <!-- bottom summary -->
  <rect x="20" y="332" width="480" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="348" text-anchor="middle" font-size="11" fill="#333">同时追踪 (max, min)，负数翻号时最小值反成最大</text>
</svg>
