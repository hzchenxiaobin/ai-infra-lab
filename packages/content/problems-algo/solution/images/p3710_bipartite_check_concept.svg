<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心观察：dist &lt; D ⇒ 必须异组 ⇒ 判二分图</text>

  <text x="148" y="48" text-anchor="middle" font-size="12.5" fill="#666" filter="url(#rough2)">示例 1（D = 4）：连边 + 染色</text>

  <!-- 对角线（同组，dist = 4 ≥ D） -->
  <path d="M 78,86 L 218,202" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <path d="M 78,202 L 218,86" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>

  <!-- 正方形四条边（dist = 2 &lt; D，必须异组，连边） -->
  <path d="M 78,86 L 78,202" stroke="#d6a040" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <path d="M 78,86 L 218,86" stroke="#d6a040" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <path d="M 218,86 L 218,202" stroke="#d6a040" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <path d="M 78,202 L 218,202" stroke="#d6a040" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>

  <!-- 距离标注 -->
  <text x="66" y="148" text-anchor="end" font-size="10.5" fill="#d6a040" filter="url(#rough2)">2</text>
  <text x="148" y="78" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">2</text>
  <text x="230" y="148" font-size="10.5" fill="#d6a040" filter="url(#rough2)">2</text>
  <text x="148" y="218" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">2</text>
  <text x="196" y="180" font-size="10.5" fill="#446688" filter="url(#rough2)">4</text>
  <text x="196" y="102" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">4</text>

  <!-- 四个点：组 A = {0,3}（蓝），组 B = {1,2}（绿） -->
  <circle cx="78" cy="86" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="78" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="78" y="66" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">(0,0)</text>

  <circle cx="218" cy="86" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="218" y="90" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="218" y="66" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">(2,0)</text>

  <circle cx="78" cy="202" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="78" y="206" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="78" y="228" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">(0,2)</text>

  <circle cx="218" cy="202" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="218" y="206" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="218" y="228" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">(2,2)</text>

  <!-- 左侧图例 -->
  <path d="M 40,244 L 66,244" stroke="#d6a040" stroke-width="2" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="72" y="248" font-size="11" fill="#333" filter="url(#rough2)">dist &lt; D：必须异组（连边）</text>
  <path d="M 40,264 L 53,264" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <path d="M 53,264 L 66,264" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="72" y="268" font-size="11" fill="#333" filter="url(#rough2)">dist ≥ D：允许同组（不连边）</text>

  <!-- 右侧：D = 4 可行 -->
  <rect x="300" y="52" width="200" height="104" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="400" y="74" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">D = 4：图是二分图 ✓</text>
  <text x="400" y="96" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">连边 = 4 条边（dist = 2）</text>
  <text x="400" y="114" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">染色：0,3 同组 / 1,2 同组</text>
  <text x="400" y="132" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">组内最近距离 = 4 ≥ 4 → 可行</text>

  <!-- 右侧：D = 5 不可行 -->
  <rect x="300" y="172" width="200" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="400" y="194" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">D = 5：非二分 ✗</text>
  <text x="400" y="216" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">全部 6 对 dist &lt; 5 → K₄</text>
  <text x="400" y="234" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">任何染色都有同色相邻</text>
  <text x="400" y="252" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">→ 不可行</text>

  <!-- 底部总结 -->
  <rect x="60" y="286" width="400" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="260" y="308" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">因子 ≥ D ⟺ dist &lt; D 的点对全异组 ⟺ 二分图</text>
  <text x="260" y="328" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">check(D) 随 D 单调 ⇒ 二分答案（n = 2 特判 0）</text>
</svg>
