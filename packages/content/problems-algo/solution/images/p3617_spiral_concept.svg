<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="410" fill="#fafafa"/>

  <text x="290" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">核心观察：按 (rn−1) mod k 上色——同一「循环位次」的格子学科必须相同</text>

  <text x="88" y="48" text-anchor="end" font-size="10" fill="#888">学生</text>
  <text x="250" y="48" text-anchor="middle" font-size="10" fill="#888">学习序列（按日期 左→右）</text>
  <text x="498" y="48" text-anchor="middle" font-size="10" fill="#888">判定</text>

  <!-- Alice: k=3, n=6 -->
  <text x="96" y="79" text-anchor="end" font-size="10.5" fill="#333">Alice</text>
  <rect x="104" y="62" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124" y="79" text-anchor="middle" font-size="9.5" fill="#333">Math</text>
  <rect x="148" y="62" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="168" y="79" text-anchor="middle" font-size="9.5" fill="#333">Phys</text>
  <rect x="192" y="62" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="212" y="79" text-anchor="middle" font-size="9.5" fill="#333">Chem</text>
  <rect x="236" y="62" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="256" y="79" text-anchor="middle" font-size="9.5" fill="#333">Math</text>
  <rect x="280" y="62" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="79" text-anchor="middle" font-size="9.5" fill="#333">Phys</text>
  <rect x="324" y="62" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="344" y="79" text-anchor="middle" font-size="9.5" fill="#333">Chem</text>

  <path d="M124 58 C152 34 228 34 256 58" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)" marker-end="url(#arrB)"/>
  <text x="190" y="32" text-anchor="middle" font-size="8.5" fill="#446688">隔 k=3 格 ⇒ 学科相同</text>

  <text x="124" y="101" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">①</text>
  <text x="168" y="101" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">②</text>
  <text x="212" y="101" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">③</text>
  <text x="256" y="101" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">①</text>
  <text x="300" y="101" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">②</text>
  <text x="344" y="101" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">③</text>
  <text x="124" y="114" text-anchor="middle" font-size="7" fill="#999">10-01</text>
  <text x="168" y="114" text-anchor="middle" font-size="7" fill="#999">10-02</text>
  <text x="212" y="114" text-anchor="middle" font-size="7" fill="#999">10-03</text>
  <text x="256" y="114" text-anchor="middle" font-size="7" fill="#999">10-04</text>
  <text x="300" y="114" text-anchor="middle" font-size="7" fill="#999">10-05</text>
  <text x="344" y="114" text-anchor="middle" font-size="7" fill="#999">10-06</text>

  <rect x="430" y="62" width="136" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="498" y="79" text-anchor="middle" font-size="9" fill="#4a7a3a">✓ k=3 · 15.0h</text>

  <!-- Bob: k=4, n=8 -->
  <text x="96" y="141" text-anchor="end" font-size="10.5" fill="#333">Bob</text>
  <rect x="104" y="124" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="141" text-anchor="middle" font-size="8.5" fill="#333">Alg</text>
  <rect x="143" y="124" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="161" y="141" text-anchor="middle" font-size="8.5" fill="#333">Cal</text>
  <rect x="182" y="124" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="141" text-anchor="middle" font-size="8.5" fill="#333">Sta</text>
  <rect x="221" y="124" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="239" y="141" text-anchor="middle" font-size="8.5" fill="#333">Geo</text>
  <rect x="260" y="124" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="278" y="141" text-anchor="middle" font-size="8.5" fill="#333">Alg</text>
  <rect x="299" y="124" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="317" y="141" text-anchor="middle" font-size="8.5" fill="#333">Cal</text>
  <rect x="338" y="124" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="356" y="141" text-anchor="middle" font-size="8.5" fill="#333">Sta</text>
  <rect x="377" y="124" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="395" y="141" text-anchor="middle" font-size="8.5" fill="#333">Geo</text>

  <text x="122" y="163" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">①</text>
  <text x="161" y="163" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">②</text>
  <text x="200" y="163" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">③</text>
  <text x="239" y="163" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">④</text>
  <text x="278" y="163" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">①</text>
  <text x="317" y="163" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">②</text>
  <text x="356" y="163" text-anchor="middle" font-size="8.5" fill="#4a7a3a" font-weight="bold">③</text>
  <text x="395" y="163" text-anchor="middle" font-size="8.5" fill="#b85450" font-weight="bold">④</text>

  <rect x="430" y="124" width="136" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="498" y="141" text-anchor="middle" font-size="9" fill="#4a7a3a">✓ k=4 · 26.0h</text>

  <!-- Carol: k=2 -->
  <text x="96" y="203" text-anchor="end" font-size="10.5" fill="#333">Carol</text>
  <rect x="104" y="186" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124" y="203" text-anchor="middle" font-size="9.5" fill="#333">Bio</text>
  <rect x="148" y="186" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="168" y="203" text-anchor="middle" font-size="9.5" fill="#333">Chem</text>
  <rect x="192" y="186" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="212" y="203" text-anchor="middle" font-size="9.5" fill="#333">Bio</text>
  <rect x="236" y="186" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="256" y="203" text-anchor="middle" font-size="9.5" fill="#333">Chem</text>

  <text x="124" y="225" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">①</text>
  <text x="168" y="225" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">②</text>
  <text x="212" y="225" text-anchor="middle" font-size="8.5" fill="#446688" font-weight="bold">①</text>
  <text x="256" y="225" text-anchor="middle" font-size="8.5" fill="#d6a040" font-weight="bold">②</text>

  <rect x="430" y="186" width="136" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="498" y="203" text-anchor="middle" font-size="9" fill="#b85450">✗ 仅 2 门学科 &lt; 3</text>

  <!-- David: gap 4 days -->
  <text x="96" y="265" text-anchor="end" font-size="10.5" fill="#333">David</text>
  <rect x="104" y="248" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124" y="265" text-anchor="middle" font-size="9.5" fill="#333">Org</text>
  <rect x="230" y="248" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="265" text-anchor="middle" font-size="9.5" fill="#333">Phy</text>

  <path d="M150 257 L224 257" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4,3" fill="none" filter="url(#rough2)" marker-end="url(#arrR)"/>
  <text x="187" y="250" text-anchor="middle" font-size="8.5" fill="#b85450">间隔 4 天</text>
  <text x="124" y="287" text-anchor="middle" font-size="7" fill="#999">10-01</text>
  <text x="250" y="287" text-anchor="middle" font-size="7" fill="#999">10-05</text>

  <rect x="430" y="248" width="136" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="498" y="265" text-anchor="middle" font-size="8.5" fill="#b85450">✗ 间隔&gt;2天 · 仅 2 次</text>

  <!-- Emma: no records -->
  <text x="96" y="327" text-anchor="end" font-size="10.5" fill="#333">Emma</text>
  <rect x="104" y="310" width="170" height="26" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="189" y="327" text-anchor="middle" font-size="9" fill="#999">（没有学习记录）</text>

  <rect x="430" y="310" width="136" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="498" y="327" text-anchor="middle" font-size="9" fill="#b85450">✗ 无记录</text>

  <!-- legend -->
  <text x="290" y="358" text-anchor="middle" font-size="9.5" fill="#555">格子颜色 / ①②③ = 循环位次 (rn−1) mod k：同一位次的格子学科必须相同，否则周期性破坏</text>
  <text x="290" y="376" text-anchor="middle" font-size="9.5" fill="#555">四道闸门：k ≥ 3 · n ≥ 2k（两轮完整周期）· 相邻日期差 ≤ 2 天 · 同位次学科唯一</text>
  <text x="290" y="394" text-anchor="middle" font-size="9.5" fill="#555">示例：Alice 3 门循环 2 轮（15.0h）、Bob 4 门循环 2 轮（26.0h）⇒ cycle_length 大者排前</text>
</svg>
