<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="520" fill="#fafafa"/>

  <text x="280" y="18" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">记忆化 dfs(i, j, and) 判定流程</text>

  <!-- start -->
  <rect x="80" y="30" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="180" y="51" text-anchor="middle" font-size="12" fill="#335" font-weight="bold" filter="url(#rough2)">进入 dfs(i, j, and)</text>
  <path d="M 180 64 L 180 76" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- d1 -->
  <polygon points="180,78 258,106 180,134 102,106" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="102" text-anchor="middle" font-size="10.5" fill="#335" font-weight="bold" filter="url(#rough2)">n − i &lt; m − j ?</text>
  <text x="180" y="116" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">剩余元素不够？</text>
  <path d="M 258 106 L 346 106" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="300" y="98" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="346" y="88" width="164" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="428" y="110" text-anchor="middle" font-size="11.5" fill="#a04038" font-weight="bold" filter="url(#rough2)">return +∞</text>
  <path d="M 180 134 L 180 146" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="190" y="144" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- d2 -->
  <polygon points="180,148 258,176 180,204 102,176" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="172" text-anchor="middle" font-size="10.5" fill="#335" font-weight="bold" filter="url(#rough2)">j == m ?</text>
  <text x="180" y="186" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">组数用尽？</text>
  <path d="M 258 176 L 346 176" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="300" y="168" font-size="10" fill="#a07818" filter="url(#rough2)">是</text>
  <rect x="346" y="158" width="164" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="428" y="180" text-anchor="middle" font-size="11" fill="#a07818" font-weight="bold" filter="url(#rough2)">i == n ? 0 : +∞</text>
  <path d="M 180 204 L 180 216" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="190" y="214" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- r1 -->
  <rect x="80" y="218" width="200" height="34" fill="#ffffff" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="239" text-anchor="middle" font-size="11.5" fill="#335" filter="url(#rough2)">and &amp;= nums[i]</text>
  <path d="M 180 252 L 180 264" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- d3 -->
  <polygon points="180,266 258,294 180,322 102,294" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="290" text-anchor="middle" font-size="10.5" fill="#335" font-weight="bold" filter="url(#rough2)">and &lt; andValues[j] ?</text>
  <text x="180" y="304" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">跌破目标？</text>
  <path d="M 258 294 L 346 294" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="300" y="286" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="346" y="276" width="164" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="428" y="298" text-anchor="middle" font-size="11" fill="#a04038" font-weight="bold" filter="url(#rough2)">return +∞（剪枝）</text>
  <path d="M 180 322 L 180 334" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="190" y="332" font-size="10" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- r2 extend -->
  <rect x="80" y="336" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="352" text-anchor="middle" font-size="11" fill="#335" filter="url(#rough2)">res = dfs(i+1, j, and)</text>
  <text x="180" y="368" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">延伸：nums[i] 不当组尾</text>
  <path d="M 180 376 L 180 388" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- d4 -->
  <polygon points="180,390 262,418 180,446 98,418" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="414" text-anchor="middle" font-size="10.5" fill="#335" font-weight="bold" filter="url(#rough2)">and == andValues[j] ?</text>
  <text x="180" y="428" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">命中目标？</text>
  <path d="M 262 418 L 340 418" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="296" y="410" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="438" y="390" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">闭合：nums[i] 当组尾</text>
  <rect x="340" y="396" width="196" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="438" y="414" text-anchor="middle" font-size="10.5" fill="#335" filter="url(#rough2)">res = min(res,</text>
  <text x="438" y="430" text-anchor="middle" font-size="10.5" fill="#335" filter="url(#rough2)">dfs(i+1, j+1, −1) + nums[i])</text>
  <path d="M 180 446 L 180 458" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- r3 -->
  <rect x="80" y="460" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="180" y="481" text-anchor="middle" font-size="11.5" fill="#335" font-weight="bold" filter="url(#rough2)">写入记忆化，return res</text>

  <text x="280" y="510" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">入口先查记忆化表 (i, j, and)，命中即返回（图中省略）；−1 为 AND 的单位元</text>
</svg>
