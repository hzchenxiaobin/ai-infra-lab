<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#b85450" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="270" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    区间 DP：按长度递增填充，dp[i][j] 依赖下方与左方
  </text>

  <!-- 5x5 上三角格子，格宽 56，起点 (110, 70) -->
  <!-- 行 i 向下递增，列 j 向右递增。只画上三角 i<=j -->
  <g filter="url(#rough2)" font-size="13" fill="#333">
    <!-- 行 0 -->
    <rect x="110" y="70" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="166" y="70" width="56" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="222" y="70" width="56" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="278" y="70" width="56" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="334" y="70" width="56" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <!-- 行 1 -->
    <rect x="166" y="114" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="222" y="114" width="56" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="278" y="114" width="56" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="334" y="114" width="56" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <!-- 行 2 -->
    <rect x="222" y="158" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="278" y="158" width="56" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <rect x="334" y="158" width="56" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <!-- 行 3 -->
    <rect x="278" y="202" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <rect x="334" y="202" width="56" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <!-- 行 4 -->
    <rect x="334" y="246" width="56" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
  </g>

  <!-- 单元格标签：用 dp[i][j] 标注关键格 -->
  <g filter="url(#rough2)" font-size="11" fill="#555">
    <text x="138" y="96" text-anchor="middle">dp[0][0]</text>
    <text x="362" y="96" text-anchor="middle" fill="#b85450" font-size="12">dp[0][4]=答案</text>
    <text x="362" y="268" text-anchor="middle">dp[4][4]</text>
  </g>

  <!-- 行列轴标签 -->
  <text x="92" y="96" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">i=0</text>
  <text x="92" y="268" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">i=4</text>
  <text x="138" y="60" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">j=0</text>
  <text x="362" y="60" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">j=4</text>

  <!-- 依赖箭头：以 dp[1][3] 为例，依赖 dp[2][3](下方) 与 dp[1][2](左方) -->
  <!-- dp[1][3] 中心 (306,136)；dp[2][3] 中心 (306,180)；dp[1][2] 中心 (250,136) -->
  <path d="M306,158 L306,180" fill="none" stroke="#b85450" stroke-width="1.8"
        marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M250,136 L278,136" fill="none" stroke="#b85450" stroke-width="1.8"
        marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- 依赖说明 -->
  <rect x="40" y="300" width="460" height="84" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="324" font-size="13" fill="#333" filter="url(#rough2)">
    依赖方向（以 dp[1][3] 为例，红色箭头）：
  </text>
  <text x="60" y="346" font-size="12" fill="#333" filter="url(#rough2)">
    • 下方 dp[i+1][j]：移除左端 stones[i] 后对手在 [i+1..j] 的净赚
  </text>
  <text x="60" y="364" font-size="12" fill="#333" filter="url(#rough2)">
    • 左方 dp[i][j−1]：移除右端 stones[j] 后对手在 [i..j−1] 的净赚
  </text>
  <text x="60" y="380" font-size="12" fill="#4a7a3a" filter="url(#rough2)">
    填充顺序：len=1(蓝对角线) → len=2..n(橙层) → dp[0][n-1](红框)
  </text>
</svg>
