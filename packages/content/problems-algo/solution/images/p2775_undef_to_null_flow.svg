<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="500" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" filter="url(#rough2)" font-weight="bold">算法流程：四路类型分派，undefined 命中即返回 null，容器下钻递归</text>

  <!-- 入口 -->
  <rect x="250" y="44" width="120" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="66" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">undefinedToNull(obj)</text>

  <!-- 判定1: obj === undefined? -->
  <path d="M 310 78 L 310 100" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="310,100 400,138 310,176 220,138" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="142" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">obj === undefined ?</text>

  <!-- 是 → return null -->
  <path d="M 220 138 L 170 138" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="195" y="130" font-size="11" fill="#b85450" filter="url(#rough2)" font-weight="bold">是</text>
  <rect x="30" y="116" width="140" height="44" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="100" y="136" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)" font-weight="bold">return null</text>
  <text x="100" y="152" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">核心变换</text>

  <!-- 否 → 判定2 -->
  <path d="M 310 176 L 310 200" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="192" font-size="11" fill="#888" filter="url(#rough2)" font-weight="bold">否</text>
  <polygon points="310,200 400,238 310,276 220,238" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="242" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Array.isArray ?</text>

  <!-- 是 → 数组分支 -->
  <path d="M 400 238 L 450 238" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="425" y="230" font-size="11" fill="#b85450" filter="url(#rough2)" font-weight="bold">是</text>
  <rect x="450" y="208" width="150" height="60" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="525" y="228" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)" font-weight="bold">数组分支</text>
  <text x="525" y="244" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">逐下标递归</text>
  <text x="525" y="260" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">res.push(f(obj[i]))</text>

  <!-- 否 → 判定3 -->
  <path d="M 310 276 L 310 300" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="292" font-size="11" fill="#888" filter="url(#rough2)" font-weight="bold">否</text>
  <polygon points="310,300 410,338 310,376 210,338" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="334" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">obj≠null &amp;&amp;</text>
  <text x="310" y="350" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">typeof === 'object' ?</text>

  <!-- 是 → 对象分支 -->
  <path d="M 410 338 L 450 338" stroke="#446688" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="430" y="330" font-size="11" fill="#446688" filter="url(#rough2)" font-weight="bold">是</text>
  <rect x="450" y="308" width="150" height="60" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="525" y="328" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)" font-weight="bold">对象分支</text>
  <text x="525" y="344" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">逐值递归</text>
  <text x="525" y="360" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">res[k] = f(obj[k])</text>

  <!-- 否 → return obj -->
  <path d="M 310 376 L 310 400" stroke="#888" stroke-width="1.2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="320" y="392" font-size="11" fill="#888" filter="url(#rough2)" font-weight="bold">否</text>
  <rect x="240" y="402" width="140" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="422" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)" font-weight="bold">return obj</text>
  <text x="310" y="438" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">null / 原始值 原样</text>

  <!-- 排雷提示框 -->
  <rect x="30" y="456" width="560" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="46" y="472" font-size="11" fill="#333" filter="url(#rough2)" font-weight="bold">⚠️ 排雷：typeof null === 'object'，判普通对象前须 obj !== null，否则 null 误入对象分支对 Object.keys 报错。</text>
  <text x="46" y="488" font-size="11" fill="#555" filter="url(#rough2)">判定顺序：undefined → Array → 普通对象 → 兜底，前者命中即短路返回。</text>
</svg>
