<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 450" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="450" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：一次遍历跟踪 max1 / max2</text>

  <!-- ===== Example 1 ===== -->
  <text x="60" y="56" font-size="12" fill="#333" font-weight="bold">示例 1：nums = [3, 6, 1, 0]</text>

  <!-- header row -->
  <rect x="60" y="68" width="480" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="85" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i</text>
  <text x="130" y="85" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">nums[i]</text>
  <text x="190" y="85" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">max1</text>
  <text x="250" y="85" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">max2</text>
  <text x="305" y="85" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">idx</text>
  <text x="435" y="85" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">动作</text>

  <!-- data rows -->
  <rect x="60" y="94" width="480" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="60" y="120" width="480" height="26" fill="#f7f9fc" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="60" y="146" width="480" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="60" y="172" width="480" height="26" fill="#f7f9fc" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="60" y="198" width="480" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- column dividers -->
  <line x1="100" y1="68" x2="100" y2="224" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="160" y1="68" x2="160" y2="224" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="220" y1="68" x2="220" y2="224" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="280" y1="68" x2="280" y2="224" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="330" y1="68" x2="330" y2="224" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 0 -->
  <text x="80" y="111" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="130" y="111" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="190" y="111" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="250" y="111" text-anchor="middle" font-size="11" fill="#888">−1</text>
  <text x="305" y="111" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="340" y="111" font-size="10" fill="#555">3 &gt; max1(−1) → max1=3</text>

  <!-- row 1 -->
  <text x="80" y="137" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="130" y="137" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="190" y="137" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">6</text>
  <text x="250" y="137" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
  <text x="305" y="137" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="340" y="137" font-size="10" fill="#555">6 &gt; max1(3) → max2←3, max1=6</text>

  <!-- row 2 -->
  <text x="80" y="163" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="130" y="163" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="190" y="163" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="250" y="163" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="305" y="163" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="340" y="163" font-size="10" fill="#888">1 &lt; max1 且 &lt; max2, 跳过</text>

  <!-- row 3 -->
  <text x="80" y="189" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="130" y="189" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="190" y="189" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="250" y="189" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="305" y="189" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="340" y="189" font-size="10" fill="#888">0 &lt; max1 且 &lt; max2, 跳过</text>

  <!-- final row -->
  <text x="80" y="215" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">终</text>
  <text x="130" y="215" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="190" y="215" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="250" y="215" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="305" y="215" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="340" y="215" font-size="10" fill="#4a7a3a" font-weight="bold">6 ≥ 2×3 = 6 ✓ → 返回 1</text>

  <!-- ===== Example 2 ===== -->
  <text x="60" y="252" font-size="12" fill="#333" font-weight="bold">示例 2：nums = [1, 2, 3, 4]</text>

  <!-- header row -->
  <rect x="60" y="264" width="480" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="281" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i</text>
  <text x="130" y="281" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">nums[i]</text>
  <text x="190" y="281" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">max1</text>
  <text x="250" y="281" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">max2</text>
  <text x="305" y="281" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">idx</text>
  <text x="435" y="281" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">动作</text>

  <!-- data rows -->
  <rect x="60" y="290" width="480" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="60" y="316" width="480" height="26" fill="#f7f9fc" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="60" y="342" width="480" height="26" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="60" y="368" width="480" height="26" fill="#f7f9fc" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="60" y="394" width="480" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- column dividers -->
  <line x1="100" y1="264" x2="100" y2="420" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="160" y1="264" x2="160" y2="420" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="220" y1="264" x2="220" y2="420" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="280" y1="264" x2="280" y2="420" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="330" y1="264" x2="330" y2="420" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 0 -->
  <text x="80" y="307" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="130" y="307" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="190" y="307" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="250" y="307" text-anchor="middle" font-size="11" fill="#888">−1</text>
  <text x="305" y="307" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="340" y="307" font-size="10" fill="#555">1 &gt; max1(−1) → max1=1</text>

  <!-- row 1 -->
  <text x="80" y="333" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="130" y="333" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="190" y="333" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="250" y="333" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">1</text>
  <text x="305" y="333" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="340" y="333" font-size="10" fill="#555">2 &gt; max1(1) → max2←1, max1=2</text>

  <!-- row 2 -->
  <text x="80" y="359" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="130" y="359" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="190" y="359" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="250" y="359" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
  <text x="305" y="359" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="340" y="359" font-size="10" fill="#555">3 &gt; max1(2) → max2←2, max1=3</text>

  <!-- row 3 -->
  <text x="80" y="385" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="130" y="385" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="190" y="385" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <text x="250" y="385" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
  <text x="305" y="385" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="340" y="385" font-size="10" fill="#555">4 &gt; max1(3) → max2←3, max1=4</text>

  <!-- final row -->
  <text x="80" y="411" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">终</text>
  <text x="130" y="411" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="190" y="411" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="250" y="411" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="305" y="411" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="340" y="411" font-size="10" fill="#b85450" font-weight="bold">4 ≥ 2×3 = 6 ? 否 → 返回 −1</text>
</svg>
