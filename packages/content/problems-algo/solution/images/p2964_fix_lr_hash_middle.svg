<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：枚举两端 L、R，哈希表只装中间元素的余数</text>
  <text x="280" y="44" text-anchor="middle" font-size="12" fill="#888">nums = [3, 3, 4, 7, 8]，d = 5 → 余数 r = [3, 3, 4, 2, 3]</text>

  <rect x="36" y="78" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="68" y="104" text-anchor="middle" font-size="14" fill="#333">3</text>
  <rect x="114" y="78" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="146" y="104" text-anchor="middle" font-size="14" fill="#333">3</text>
  <rect x="192" y="78" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="224" y="104" text-anchor="middle" font-size="14" fill="#333">4</text>
  <rect x="270" y="78" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="302" y="104" text-anchor="middle" font-size="14" fill="#333">7</text>
  <rect x="348" y="78" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="380" y="104" text-anchor="middle" font-size="14" fill="#333">8</text>

  <text x="68" y="72" text-anchor="middle" font-size="11" fill="#4a7a3a">r=3</text>
  <text x="146" y="72" text-anchor="middle" font-size="11" fill="#4a7a3a">r=3</text>
  <text x="224" y="72" text-anchor="middle" font-size="11" fill="#4a7a3a">r=4</text>
  <text x="302" y="72" text-anchor="middle" font-size="11" fill="#4a7a3a">r=2</text>
  <text x="380" y="72" text-anchor="middle" font-size="11" fill="#4a7a3a">r=3</text>

  <text x="68" y="136" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="146" y="136" text-anchor="middle" font-size="11" fill="#888">1</text>
  <text x="224" y="136" text-anchor="middle" font-size="11" fill="#888">2</text>
  <text x="302" y="136" text-anchor="middle" font-size="11" fill="#888">3</text>
  <text x="380" y="136" text-anchor="middle" font-size="11" fill="#888">4</text>

  <rect x="108" y="64" width="196" height="62" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="7 5" rx="6" filter="url(#rough2)"/>
  <text x="224" y="188" text-anchor="middle" font-size="12" fill="#4a7a3a">中间区 (L, R)：只把余数放进哈希表</text>

  <path d="M 68 174 L 68 148" fill="none" stroke="#446688" stroke-width="2" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <text x="68" y="192" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">L</text>

  <path d="M 380 174 L 380 148" fill="none" stroke="#d6a040" stroke-width="2" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <text x="380" y="192" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">R</text>

  <rect x="430" y="64" width="112" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="486" y="84" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">cnt（哈希表）</text>
  <text x="486" y="106" text-anchor="middle" font-size="12" fill="#333">余数 3 → 1 个</text>
  <text x="486" y="126" text-anchor="middle" font-size="12" fill="#333">余数 4 → 1 个</text>
  <text x="486" y="146" text-anchor="middle" font-size="12" fill="#333">余数 2 → 1 个</text>

  <path d="M 302 66 Q 380 36 428 64" fill="none" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrg)"/>

  <rect x="30" y="210" width="500" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="234" text-anchor="middle" font-size="12.5" fill="#333">两端和 3 + 8 = 11 的补余数：need = (d − 11 mod d) mod d = (5 − 1) mod 5 = 4</text>
  <text x="280" y="258" text-anchor="middle" font-size="12.5" fill="#333">查表 cnt[4] = 1 → 中间取下标 2（值 4，余数恰为 4）</text>
  <text x="280" y="284" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">三元组 (0, 2, 4)：3 + 4 + 8 = 15，被 5 整除 ✓</text>

  <rect x="60" y="328" width="440" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="348" text-anchor="middle" font-size="12" fill="#333">余数相同的一批中间元素命运完全相同——</text>
  <text x="280" y="366" text-anchor="middle" font-size="12" fill="#333">逐个枚举坍缩成一次查表，第三层循环消失</text>
</svg>
