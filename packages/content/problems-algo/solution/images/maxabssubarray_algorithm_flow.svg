<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：一次遍历双向 Kadane</text>

  <!-- Start -->
  <rect x="200" y="44" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="66" text-anchor="middle" font-size="12" fill="#333">初始化 curMax=maxSum=0</text>

  <line x1="260" y1="78" x2="260" y2="96" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop decision -->
  <polygon points="260,96 360,140 260,184 160,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="136" text-anchor="middle" font-size="11" fill="#333">还有未处理元素</text>
  <text x="260" y="152" text-anchor="middle" font-size="11" fill="#333">x = nums[i] ?</text>

  <!-- No branch -> return -->
  <line x1="360" y1="140" x2="408" y2="140" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="384" y="134" font-size="11" fill="#888">否</text>
  <rect x="408" y="120" width="96" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="456" y="138" text-anchor="middle" font-size="11" fill="#333">返回</text>
  <text x="456" y="152" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">max(|maxSum|,</text>
  <text x="456" y="164" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">|minSum|)</text>

  <!-- Yes branch -> two parallel updates -->
  <line x1="260" y1="184" x2="260" y2="200" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="196" font-size="11" fill="#888">是</text>

  <!-- Split bar -->
  <line x1="120" y1="200" x2="400" y2="200" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="260" y1="200" x2="260" y2="216" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- Left: max update -->
  <line x1="180" y1="200" x2="180" y2="220" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="220" width="240" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="180" y="240" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">正向 Kadane（求 max）</text>
  <text x="180" y="258" text-anchor="middle" font-size="11" fill="#333">curMax = max(x, curMax + x)</text>
  <text x="180" y="274" text-anchor="middle" font-size="11" fill="#333">maxSum = max(maxSum, curMax)</text>

  <!-- Right: min update -->
  <line x1="340" y1="200" x2="340" y2="220" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="220" y="220" width="240" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="340" y="240" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">反向 Kadane（求 min）</text>
  <text x="340" y="258" text-anchor="middle" font-size="11" fill="#333">curMin = min(x, curMin + x)</text>
  <text x="340" y="274" text-anchor="middle" font-size="11" fill="#333">minSum = min(minSum, curMin)</text>

  <!-- Merge back to loop -->
  <line x1="180" y1="284" x2="180" y2="306" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="340" y1="284" x2="340" y2="306" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="180" y1="306" x2="340" y2="306" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="260" y1="306" x2="260" y2="324" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="320" font-size="11" fill="#888">i++</text>

  <!-- Loop back arrow to decision -->
  <path d="M 260 324 L 260 340 L 460 340 L 460 140 L 410 140" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Footer note -->
  <rect x="40" y="356" width="440" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="376" text-anchor="middle" font-size="11" fill="#d6a040">💡 两路 Kadane 同步进行，O(n) 一次遍历，O(1) 额外空间</text>
</svg>
