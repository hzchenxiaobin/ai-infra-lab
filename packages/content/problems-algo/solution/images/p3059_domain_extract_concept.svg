<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <text x="290" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：域名 = 最后一个 '@' 右侧的全部内容</text>
  <text x="290" y="40" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">一封邮件 = 本地部分 + '@' + 域名 —— SUBSTRING_INDEX 一刀切出域名</text>

  <rect x="140" y="56" width="110" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="195" y="78" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">hwkiy</text>
  <rect x="250" y="56" width="40" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="78" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">@</text>
  <rect x="290" y="56" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="365" y="78" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">test.edu</text>

  <text x="195" y="104" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">本地部分（local）</text>
  <text x="270" y="104" text-anchor="middle" font-size="9" fill="#8a6d1a" filter="url(#rough2)">分隔符</text>
  <text x="365" y="104" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">域名（domain）★</text>

  <rect x="40" y="118" width="250" height="56" fill="#fff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="165" y="140" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">SUBSTRING_INDEX(email, '@', 1)</text>
  <text x="165" y="160" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">→ 'hwkiy'（第一个 @ 左侧）</text>

  <rect x="305" y="118" width="235" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="422" y="140" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">SUBSTRING_INDEX(email, '@', -1)</text>
  <text x="422" y="160" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">→ 'test.edu'（最后一个 @ 右侧）★</text>

  <text x="40" y="200" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">第三参数 count 的语义（以 'www.mysql.com' 按 '.' 切为例）：</text>

  <rect x="40" y="210" width="500" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="50" y="225" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">count &gt; 0</text>
  <text x="160" y="225" font-size="10" fill="#333" filter="url(#rough2)">第 k 个分隔符左侧</text>
  <text x="330" y="225" font-size="10" fill="#666" filter="url(#rough2)">(s, '.', 2) → 'www.mysql'</text>

  <rect x="40" y="232" width="500" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="50" y="247" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">count &lt; 0</text>
  <text x="160" y="247" font-size="10" fill="#333" filter="url(#rough2)">倒数第 k 个分隔符右侧</text>
  <text x="330" y="247" font-size="10" fill="#4a7a3a" filter="url(#rough2)">(s, '.', -2) → 'mysql.com' ★</text>

  <rect x="40" y="270" width="500" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="290" y="291" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠️ RFC 5321：带引号的本地部分可以含 '@'，如 "a@b"@x.com</text>
  <text x="290" y="311" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">取「第一个 @ 右侧」会得到 b"@x.com（错）；域名永不含 '@'，</text>
  <text x="290" y="327" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">取「最后一个 @ 右侧」在任意合法邮箱上恒正确</text>

  <rect x="40" y="342" width="500" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="360" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">一行收工：SELECT DISTINCT SUBSTRING_INDEX(email, '@', -1) AS email_domain</text>
  <text x="290" y="378" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">切一刀（SUBSTRING_INDEX）+ 去个重（DISTINCT）= 本题的全部</text>
</svg>
