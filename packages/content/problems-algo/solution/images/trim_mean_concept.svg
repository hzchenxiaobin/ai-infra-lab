<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,3 L8,3" fill="none" stroke="#446688" stroke-width="1.5"/>
      <path d="M6,0 L9,3 L6,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：排序后掐头去尾各 5%，中间 90% 求均值</text>

  <!-- Step 1: original array -->
  <text x="60" y="62" text-anchor="start" font-size="11" fill="#888" font-weight="bold">原数组（乱序）</text>
  <rect x="60" y="70" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="76" y="88" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">6</text>
  <rect x="92" y="70" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="108" y="88" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">2</text>
  <rect x="124" y="70" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="88" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">7</text>
  <rect x="156" y="70" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="172" y="88" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">5</text>
  <rect x="188" y="70" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="88" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">1</text>
  <rect x="220" y="70" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="236" y="88" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">2</text>
  <rect x="252" y="70" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="268" y="88" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">0</text>
  <rect x="284" y="70" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="88" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">3</text>
  <rect x="316" y="70" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="332" y="88" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">10</text>
  <rect x="348" y="70" width="32" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="364" y="88" text-anchor="middle" font-size="11" fill="#333" font-family="monospace">2</text>
  <text x="395" y="88" text-anchor="start" font-size="11" fill="#888">...</text>

  <!-- Sort arrow -->
  <path d="M 260 112 L 260 138" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)" transform="rotate(90 260 125)"/>
  <text x="430" y="118" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">↑ 排序（升序）</text>

  <!-- Step 2: sorted array with trim zones -->
  <text x="60" y="156" text-anchor="start" font-size="11" fill="#888" font-weight="bold">排序后：掐头 5% + 去尾 5%</text>

  <!-- left trim zone (5%) -->
  <rect x="60" y="166" width="64" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="92" y="184" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">最小 5%</text>

  <!-- middle keep zone (90%) -->
  <rect x="124" y="166" width="280" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="264" y="184" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">保留中间 90% → 求均值</text>

  <!-- right trim zone (5%) -->
  <rect x="404" y="166" width="64" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="436" y="184" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">最大 5%</text>

  <!-- Brace labels -->
  <path d="M 60 200 L 60 206 L 124 206 L 124 200" fill="none" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="92" y="218" text-anchor="middle" font-size="10" fill="#b85450">m = n/20 个</text>
  <path d="M 124 200 L 124 206 L 404 206 L 404 200" fill="none" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="264" y="218" text-anchor="middle" font-size="10" fill="#4a7a3a">n − 2m 个（占 90%）</text>
  <path d="M 404 200 L 404 206 L 468 206 L 468 200" fill="none" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="436" y="218" text-anchor="middle" font-size="10" fill="#b85450">m = n/20 个</text>

  <!-- Why 5%? note box -->
  <rect x="60" y="240" width="440" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="262" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">为什么是 5%？</text>
  <line x1="80" y1="270" x2="480" y2="270" stroke="#d6a040" stroke-width="0.6" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="280" y="290" text-anchor="middle" font-size="10.5" fill="#555">题目约束 n 是 20 的倍数 → 5% = n/20 必为整数</text>
  <text x="280" y="308" text-anchor="middle" font-size="10.5" fill="#555">去掉两端各 m = n/20 个，剩余 n − 2m = 0.9n 个</text>
  <text x="280" y="326" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">均值 = Σ(arr[m .. n−m−1]) / (n − 2m)</text>
</svg>
