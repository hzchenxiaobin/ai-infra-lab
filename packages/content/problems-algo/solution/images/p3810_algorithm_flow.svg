<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一趟扫描 + 哈希集合去重（数组根本不用改）</text>

  <!-- ① 初始化 -->
  <rect x="110" y="38" width="300" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="57" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">① S ← ∅（收集失配位上的 nums 值）</text>

  <path d="M 260 68 L 260 82" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 1：i < n ? -->
  <polygon points="260,86 340,118 260,150 180,118" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="122" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">i &lt; n ?</text>

  <!-- 否 → 返回 -->
  <path d="M 180 118 L 134 118" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="157" y="110" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="14" y="100" width="116" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="72" y="122" text-anchor="middle" font-size="11.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">④ 返回 |S|</text>

  <!-- 是 ↓ -->
  <path d="M 260 150 L 260 164" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="162" font-size="10" fill="#2f5d24" filter="url(#rough2)">是</text>

  <!-- 菱形 2：失配？ -->
  <polygon points="260,168 368,200 260,232 152,200" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="204" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">nums[i] ≠ target[i] ?</text>

  <!-- 是 → 左：S.add -->
  <path d="M 152 200 L 138 200" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="145" y="190" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">是</text>
  <rect x="16" y="182" width="118" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="75" y="197" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">② S.add(nums[i])</text>
  <text x="75" y="211" text-anchor="middle" font-size="9" fill="#6a83a3" filter="url(#rough2)">只收 nums 的值！</text>
  <path d="M 75 218 L 75 262 L 164 262" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 否 → 右绕 -->
  <path d="M 368 200 L 424 200 L 424 262 L 358 262" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="396" y="193" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- ③ i++ -->
  <path d="M 260 232 L 260 242" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170" y="246" width="180" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="266" text-anchor="middle" font-size="11" fill="#2f5d24" filter="url(#rough2)">③ i ← i + 1</text>

  <!-- 回边 -->
  <path d="M 260 278 L 260 306 L 508 306 L 508 118 L 348 118" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="299" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">下一位 i</text>

  <!-- 底部说明条 -->
  <rect x="20" y="330" width="480" height="26" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="260" y="347" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">一趟 O(n)：每个位置一次比较 + 均摊 O(1) 插入；值域 ≤ 10⁵ 可用 bool 数组替哈希表</text>
</svg>
