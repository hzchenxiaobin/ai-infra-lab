<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：答案 = n 的最大数字位</text>

  <!-- Lower bound box -->
  <rect x="40" y="44" width="460" height="86" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">① 下界：至少要 max_d 个数</text>
  <text x="60" y="88" font-size="11.5" fill="#555">设某位数字 d* = max(各位)，是最大的一位。</text>
  <text x="60" y="106" font-size="11.5" fill="#555">每个十-二进制数在该位只能贡献 0 或 1（≤ 1）。</text>
  <text x="60" y="124" font-size="11.5" fill="#555">→ 想凑出 d*，至少要 <tspan fill="#b85450" font-weight="bold">d* 个数</tspan> 各贡献一个 1。</text>

  <!-- arrow down -->
  <path d="M 270 134 L 270 158" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Upper bound box -->
  <rect x="40" y="164" width="460" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="186" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">② 上界：构造 max_d 个数即可达成</text>
  <text x="60" y="208" font-size="11.5" fill="#555">第 k 个数（k = 1 … max_d）的构造：</text>
  <text x="60" y="226" font-size="11.5" fill="#555">在第 i 位放 1 ⟺ digit[i] ≥ k，否则放 0。</text>
  <text x="60" y="244" font-size="11.5" fill="#555">→ 第 i 位恰有 digit[i] 个数放 1，列和 = digit[i] ✓</text>
  <text x="60" y="262" font-size="11.5" fill="#555">→ 这 max_d 个数全是 0/1 组成、无前导零（最高位数字 ≥ 1 → 第 1 个数最高位必为 1）✓</text>
  <text x="60" y="278" font-size="11" fill="#4a7a3a" font-weight="bold">即：max_d 个数合法且和恰为 n → 至多 max_d 个数</text>

  <!-- Conclusion -->
  <rect x="80" y="300" width="380" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="318" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">下界 = 上界 = max(各位数字)</text>
  <text x="270" y="334" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">答案 = max(digit[i])，一次遍历取最大字符即可</text>

  <text x="270" y="362" text-anchor="middle" font-size="10.5" fill="#888">这本质是一个「贪心 + 上下界夹逼」的脑筋急转弯题</text>
  <text x="270" y="380" text-anchor="middle" font-size="10" fill="#aaa">n.length ≤ 10⁵ → O(n) 扫一遍，无需真正构造</text>
</svg>
