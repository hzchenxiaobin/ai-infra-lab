<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [6, 10, 3],  M = 10</text>
  <text x="300" y="40" text-anchor="middle" font-size="10" fill="#888">逐个候选 g 验证：T(g) = nums 中 g 的倍数；判定 gcd(T(g)) == g</text>

  <!-- ===== Table ===== -->
  <!-- Header row -->
  <rect x="40" y="52" width="520" height="26" fill="#446688" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="65" y="69" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">g</text>
  <text x="200" y="69" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">T(g) = nums 中 g 的倍数</text>
  <text x="355" y="69" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">cur = gcd(...)</text>
  <text x="440" y="69" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">cur == g ?</text>
  <text x="520" y="69" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">计入 ans</text>

  <!-- Column dividers (light vertical lines) -->
  <line x1="90" y1="52" x2="90" y2="358" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="310" y1="52" x2="310" y2="358" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="400" y1="52" x2="400" y2="358" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="480" y1="52" x2="480" y2="358" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Row backgrounds: success=green tint, fail=white/light red -->
  <!-- g=1 success -->
  <rect x="40" y="78" width="520" height="28" fill="#e6f4ea" stroke="#cde6d5" stroke-width="0.6" filter="url(#rough2)"/>
  <!-- g=2 success -->
  <rect x="40" y="106" width="520" height="28" fill="#e6f4ea" stroke="#cde6d5" stroke-width="0.6" filter="url(#rough2)"/>
  <!-- g=3 success -->
  <rect x="40" y="134" width="520" height="28" fill="#e6f4ea" stroke="#cde6d5" stroke-width="0.6" filter="url(#rough2)"/>
  <!-- g=4 fail -->
  <rect x="40" y="162" width="520" height="28" fill="#ffffff" stroke="#eee" stroke-width="0.6" filter="url(#rough2)"/>
  <!-- g=5 fail (highlighted: the trap) -->
  <rect x="40" y="190" width="520" height="28" fill="#fce4ec" stroke="#e6b8c0" stroke-width="1.2" filter="url(#rough2)"/>
  <!-- g=6 success -->
  <rect x="40" y="218" width="520" height="28" fill="#e6f4ea" stroke="#cde6d5" stroke-width="0.6" filter="url(#rough2)"/>
  <!-- g=7 fail -->
  <rect x="40" y="246" width="520" height="28" fill="#ffffff" stroke="#eee" stroke-width="0.6" filter="url(#rough2)"/>
  <!-- g=8 fail -->
  <rect x="40" y="274" width="520" height="28" fill="#ffffff" stroke="#eee" stroke-width="0.6" filter="url(#rough2)"/>
  <!-- g=9 fail -->
  <rect x="40" y="302" width="520" height="28" fill="#ffffff" stroke="#eee" stroke-width="0.6" filter="url(#rough2)"/>
  <!-- g=10 success -->
  <rect x="40" y="330" width="520" height="28" fill="#e6f4ea" stroke="#cde6d5" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- Data rows text -->
  <!-- g=1 -->
  <text x="65" y="97" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="200" y="97" text-anchor="middle" font-size="11" fill="#333">{3, 6, 10}</text>
  <text x="355" y="97" text-anchor="middle" font-size="11" fill="#333">gcd = 1</text>
  <text x="440" y="97" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="520" y="97" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">ans = 1</text>

  <!-- g=2 -->
  <text x="65" y="125" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="200" y="125" text-anchor="middle" font-size="11" fill="#333">{6, 10}</text>
  <text x="355" y="125" text-anchor="middle" font-size="11" fill="#333">gcd = 2</text>
  <text x="440" y="125" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="520" y="125" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">ans = 2</text>

  <!-- g=3 -->
  <text x="65" y="153" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="200" y="153" text-anchor="middle" font-size="11" fill="#333">{3, 6}</text>
  <text x="355" y="153" text-anchor="middle" font-size="11" fill="#333">gcd = 3</text>
  <text x="440" y="153" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="520" y="153" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">ans = 3</text>

  <!-- g=4 -->
  <text x="65" y="181" text-anchor="middle" font-size="11" fill="#999" font-weight="bold">4</text>
  <text x="200" y="181" text-anchor="middle" font-size="11" fill="#999">∅  (空集)</text>
  <text x="355" y="181" text-anchor="middle" font-size="11" fill="#999">0</text>
  <text x="440" y="181" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <text x="520" y="181" text-anchor="middle" font-size="11" fill="#999">—</text>

  <!-- g=5 (trap, highlighted) -->
  <text x="65" y="209" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5</text>
  <text x="200" y="209" text-anchor="middle" font-size="11" fill="#333">{10}</text>
  <text x="355" y="209" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">10  (≠5)</text>
  <text x="440" y="209" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <text x="520" y="209" text-anchor="middle" font-size="11" fill="#999">—</text>

  <!-- g=6 -->
  <text x="65" y="237" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>
  <text x="200" y="237" text-anchor="middle" font-size="11" fill="#333">{6}</text>
  <text x="355" y="237" text-anchor="middle" font-size="11" fill="#333">gcd = 6</text>
  <text x="440" y="237" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="520" y="237" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">ans = 4</text>

  <!-- g=7 -->
  <text x="65" y="265" text-anchor="middle" font-size="11" fill="#999" font-weight="bold">7</text>
  <text x="200" y="265" text-anchor="middle" font-size="11" fill="#999">∅</text>
  <text x="355" y="265" text-anchor="middle" font-size="11" fill="#999">0</text>
  <text x="440" y="265" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <text x="520" y="265" text-anchor="middle" font-size="11" fill="#999">—</text>

  <!-- g=8 -->
  <text x="65" y="293" text-anchor="middle" font-size="11" fill="#999" font-weight="bold">8</text>
  <text x="200" y="293" text-anchor="middle" font-size="11" fill="#999">∅</text>
  <text x="355" y="293" text-anchor="middle" font-size="11" fill="#999">0</text>
  <text x="440" y="293" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <text x="520" y="293" text-anchor="middle" font-size="11" fill="#999">—</text>

  <!-- g=9 -->
  <text x="65" y="321" text-anchor="middle" font-size="11" fill="#999" font-weight="bold">9</text>
  <text x="200" y="321" text-anchor="middle" font-size="11" fill="#999">∅</text>
  <text x="355" y="321" text-anchor="middle" font-size="11" fill="#999">0</text>
  <text x="440" y="321" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <text x="520" y="321" text-anchor="middle" font-size="11" fill="#999">—</text>

  <!-- g=10 -->
  <text x="65" y="349" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">10</text>
  <text x="200" y="349" text-anchor="middle" font-size="11" fill="#333">{10}</text>
  <text x="355" y="349" text-anchor="middle" font-size="11" fill="#333">gcd = 10</text>
  <text x="440" y="349" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="520" y="349" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">ans = 5</text>

  <!-- Table outer border -->
  <rect x="40" y="52" width="520" height="306" fill="none" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- ===== Answer + callout ===== -->
  <rect x="40" y="372" width="180" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="130" y="392" text-anchor="middle" font-size="11" fill="#555">可达的 g：</text>
  <text x="130" y="408" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">{1, 2, 3, 6, 10} → ans = 5</text>

  <!-- Trap callout -->
  <rect x="240" y="372" width="320" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="255" y="390" font-size="11" fill="#b85450" font-weight="bold">⚠️ g=5 陷阱：</text>
  <text x="255" y="406" font-size="10" fill="#444">有倍数(10) ≠ 可达！gcd({10})=10≠5，</text>
  <text x="255" y="418" font-size="10" fill="#444">必须算倍数集合的 GCD 再与 g 比较</text>

  <!-- Bottom note -->
  <text x="300" y="440" text-anchor="middle" font-size="10" fill="#888">g=4/7/8/9：nums 中无对应倍数 → cur=0 ≠ g → 不计入（空集自动排除）</text>
</svg>
