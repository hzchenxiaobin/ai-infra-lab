<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：根固定 + 左右子序列保序交错</text>
  <text x="290" y="42" text-anchor="middle" font-size="11" fill="#888">BST 的根=首元素；比根小的进左子树，比根大的进右子树</text>

  <!-- ===== Left side: BST tree ===== -->
  <text x="140" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">原数组 → BST</text>

  <g font-size="12">
    <!-- root 3 -->
    <line x1="140" y1="84" x2="100" y2="120" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
    <line x1="140" y1="84" x2="185" y2="120" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
    <circle cx="140" cy="78" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
    <text x="140" y="83" text-anchor="middle" fill="#446688" font-weight="bold">3</text>

    <!-- left child 1 (empty left) -->
    <line x1="100" y1="132" x2="80" y2="168" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
    <line x1="100" y1="132" x2="120" y2="168" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
    <circle cx="100" cy="126" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="100" y="131" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>

    <circle cx="80" cy="176" r="6" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <circle cx="120" cy="176" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="120" y="181" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>

    <!-- right child 4 -->
    <line x1="185" y1="132" x2="165" y2="168" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
    <line x1="185" y1="132" x2="210" y2="168" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>
    <circle cx="185" cy="126" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="185" y="131" text-anchor="middle" fill="#d6a040" font-weight="bold">4</text>

    <circle cx="165" cy="176" r="6" fill="none" stroke="#bbb" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
    <circle cx="210" cy="176" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="210" y="181" text-anchor="middle" fill="#d6a040" font-weight="bold">5</text>
  </g>

  <text x="140" y="210" text-anchor="middle" font-size="9" fill="#888">蓝=根 绿=左子树 橙=右子树</text>

  <!-- ===== Right side: Partition ===== -->
  <text x="400" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">按根分区 + 交错</text>

  <!-- array boxes -->
  <g font-size="11">
    <rect x="320" y="76" width="28" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="334" y="92" text-anchor="middle" fill="#446688" font-weight="bold">3</text>
    <text x="362" y="92" font-size="9" fill="#888">← 根(首元素)</text>
  </g>

  <!-- left subsequence -->
  <g font-size="11">
    <rect x="330" y="116" width="26" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="343" y="131" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="360" y="116" width="26" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="373" y="131" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="400" y="131" font-size="9" fill="#4a7a3a">← 左序列 (保序)</text>
  </g>

  <!-- right subsequence -->
  <g font-size="11">
    <rect x="330" y="150" width="26" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="343" y="165" text-anchor="middle" fill="#d6a040" font-weight="bold">4</text>
    <rect x="360" y="150" width="26" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="373" y="165" text-anchor="middle" fill="#d6a040" font-weight="bold">5</text>
    <text x="400" y="165" font-size="9" fill="#d6a040">← 右序列 (保序)</text>
  </g>

  <!-- interleaving arrow -->
  <path d="M 345 180 L 345 198" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- interleaved result -->
  <g font-size="10">
    <rect x="300" y="204" width="20" height="18" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="310" y="217" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <rect x="322" y="204" width="20" height="18" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="332" y="217" text-anchor="middle" fill="#d6a040" font-weight="bold">4</text>
    <rect x="344" y="204" width="20" height="18" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="354" y="217" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="366" y="204" width="20" height="18" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="376" y="217" text-anchor="middle" fill="#d6a040" font-weight="bold">5</text>
    <text x="398" y="217" font-size="9" fill="#888">← 交错排列之一</text>
  </g>

  <!-- ===== Bottom: Formula ===== -->
  <rect x="30" y="248" width="520" height="156" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>

  <text x="50" y="274" font-size="12" fill="#444" font-weight="bold">递推公式（含原排列的总方案数）</text>

  <text x="50" y="302" font-size="13" fill="#333" font-family="monospace">f(nums) = C(l+r, l) × f(left) × f(right)</text>

  <text x="50" y="326" font-size="10" fill="#666">l = 比根小的元素个数，r = 比根大的元素个数</text>
  <text x="50" y="342" font-size="10" fill="#666">C(l+r, l) = 左右子序列保序交错的方案数（从 l+r 个位置中选 l 个放左序列）</text>
  <text x="50" y="358" font-size="10" fill="#666">f(left)、f(right) = 子树内部递归的排列方案数</text>

  <text x="50" y="384" font-size="12" fill="#b85450" font-weight="bold">答案 = (f(nums) - 1) mod (10⁹+7)</text>
  <text x="50" y="398" font-size="10" fill="#888">减 1 是因为题目要求「重排」，排除原始顺序本身</text>
</svg>
