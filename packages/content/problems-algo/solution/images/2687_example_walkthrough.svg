<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="720" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="360" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：6 行 → 分组取 MAX → 排序输出</text>

  <!-- Stage label -->
  <text x="360" y="46" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">阶段 ② 分组计数：GROUP BY bike_number + MAX(end_time)</text>

  <!-- Header row -->
  <rect x="30" y="56" width="660" height="26" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="100" y="73" text-anchor="middle" font-size="9" fill="#555" font-weight="bold">分组 (bike_number)</text>
  <text x="370" y="73" text-anchor="middle" font-size="9" fill="#555" font-weight="bold">组内各 end_time</text>
  <text x="610" y="73" text-anchor="middle" font-size="9" fill="#555" font-weight="bold">MAX(end_time)</text>

  <!-- Group 1: W00300 (green) -->
  <rect x="30" y="82" width="660" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="100" y="103" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">W00300</text>
  <text x="370" y="103" text-anchor="middle" font-size="8" fill="#333">2012-03-25 10:50:00</text>
  <text x="610" y="103" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">2012-03-25 10:50:00</text>

  <!-- Group 2: W00455 (orange) -->
  <rect x="30" y="116" width="660" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="100" y="137" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">W00455</text>
  <text x="370" y="137" text-anchor="middle" font-size="8" fill="#333">2012-03-25 13:40:00,  <tspan fill="#b85450" font-weight="bold">2012-03-26 17:40:00</tspan></text>
  <text x="610" y="137" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">2012-03-26 17:40:00</text>

  <!-- Group 3: W00576 (blue) -->
  <rect x="30" y="150" width="660" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="100" y="175" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">W00576</text>
  <text x="370" y="168" text-anchor="middle" font-size="8" fill="#333">2012-03-25 09:10:00, 2012-03-25 12:40:00,</text>
  <text x="370" y="182" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">2012-03-28 02:50:00</text>
  <text x="610" y="175" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">2012-03-28 02:50:00</text>

  <!-- arrow to output -->
  <path d="M 360 192 L 360 214" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="208" font-size="8" fill="#888">ORDER BY bike_number 升序</text>

  <!-- Output table label -->
  <text x="360" y="228" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">最终输出</text>

  <!-- Output table -->
  <rect x="180" y="236" width="360" height="24" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="250" y="252" text-anchor="middle" font-size="9" fill="#555" font-weight="bold">bike_number</text>
  <text x="430" y="252" text-anchor="middle" font-size="9" fill="#555" font-weight="bold">end_time</text>

  <rect x="180" y="260" width="360" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="250" y="275" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">W00300</text>
  <text x="430" y="275" text-anchor="middle" font-size="8" fill="#333">2012-03-25 10:50:00</text>

  <rect x="180" y="282" width="360" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="250" y="297" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">W00455</text>
  <text x="430" y="297" text-anchor="middle" font-size="8" fill="#333">2012-03-26 17:40:00</text>

  <rect x="180" y="304" width="360" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="250" y="319" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">W00576</text>
  <text x="430" y="319" text-anchor="middle" font-size="8" fill="#333">2012-03-28 02:50:00</text>

  <!-- bottom note -->
  <rect x="40" y="348" width="640" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="360" y="368" text-anchor="middle" font-size="9" fill="#666">同车多行归一组后，MAX 只返回「该组最大的那个值」——它丢弃了其余行</text>
  <text x="360" y="386" text-anchor="middle" font-size="9" fill="#b85450">若需取回「最大值所在的那一整行」，MAX 不够用 → 见扩展 5.1（窗口函数 ROW_NUMBER）</text>
</svg>
