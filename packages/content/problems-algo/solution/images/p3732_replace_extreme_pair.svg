<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="30" y="22" font-size="12.5" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：留两个原值 + 补一个 ±10⁵ ⟹ 答案 = 10⁵ × 最大的数对乘积绝对值</text>

  <!-- 面板一：替换值取端点 -->
  <rect x="20" y="36" width="520" height="154" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="36" y="58" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">① 替换值必取端点 ±10⁵，符号跟着数对走（示例 1）</text>
  <text x="182" y="73" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">替换这个位置</text>

  <rect x="40" y="78" width="52" height="40" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="98" y="78" width="52" height="40" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="156" y="78" width="52" height="40" rx="4" fill="#ffffff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="240" y="78" width="64" height="40" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="66" y="103" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">−5</text>
  <text x="124" y="103" text-anchor="middle" font-size="13" fill="#33506b" filter="url(#rough2)">7</text>
  <text x="182" y="103" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">0</text>
  <path d="M 161 98 L 203 98" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <path d="M 212 98 L 236 98" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="272" y="103" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">−10⁵</text>

  <text x="40" y="146" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">(−5) × 7 × (−10⁵) = 3 500 000</text>
  <text x="40" y="168" font-size="9.5" fill="#33506b" filter="url(#rough2)">注：两个「最大值」是 7 和 0 —— 最优数对看 |乘积|，别只盯着 +10⁵</text>

  <text x="330" y="82" font-size="11" fill="#33506b" filter="url(#rough2)">设留下的数对乘积为 X：</text>
  <text x="330" y="104" font-size="11" fill="#33506b" filter="url(#rough2)">X &gt; 0 ⟹ v = +10⁵</text>
  <text x="330" y="126" font-size="11" fill="#b85450" filter="url(#rough2)">X &lt; 0 ⟹ v = −10⁵（负负得正）</text>
  <text x="330" y="152" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">统一：贡献 = |X| · 10⁵</text>

  <!-- 面板二：三个候选 -->
  <rect x="20" y="200" width="520" height="150" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="36" y="222" font-size="12" fill="#2f5d28" font-weight="bold" filter="url(#rough2)">② 最优数对 = |a·b| 最大的两个元素：排序后只有三个候选</text>

  <rect x="40" y="240" width="52" height="34" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="98" y="240" width="52" height="34" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="214" y="240" width="52" height="34" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="272" y="240" width="52" height="34" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="66" y="261" text-anchor="middle" font-size="12" fill="#2f5d28" filter="url(#rough2)">min1</text>
  <text x="124" y="261" text-anchor="middle" font-size="12" fill="#2f5d28" filter="url(#rough2)">min2</text>
  <text x="182" y="261" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">⋯</text>
  <text x="240" y="261" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">max2</text>
  <text x="298" y="261" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">max1</text>
  <text x="182" y="294" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">排序后</text>

  <text x="350" y="250" font-size="10.5" fill="#33506b" filter="url(#rough2)">候选① max1·max2（两大正数）</text>
  <text x="350" y="274" font-size="10.5" fill="#2f5d28" filter="url(#rough2)">候选② min1·min2（两小负数）</text>
  <text x="350" y="298" font-size="10.5" fill="#b85450" filter="url(#rough2)">候选③ |min1·max1|（一正一负）</text>

  <text x="36" y="332" font-size="10.5" fill="#2f5d28" filter="url(#rough2)">示例 2：[−4,−3,−2,−1] ⟹ 候选② = (−4)·(−3) = 12 最大 ⟹ 12 × 10⁵ = 1 200 000</text>

  <!-- 底部结论 -->
  <rect x="20" y="360" width="520" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="36" y="381" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">答案 = 10⁵ × max(①, ②, ③)。「必须替换」不吃亏：替换值可以等于原值</text>
  <text x="36" y="400" font-size="10.5" fill="#b85450" filter="url(#rough2)">⚠️ 上限 10⁵·10⁵·10⁵ = 10¹⁵ 超 int32 ⟹ C++ 全程 long long</text>
</svg>
