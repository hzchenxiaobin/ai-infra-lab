<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：第三笔 = 时间序第 3 行，且花费压过前两笔</text>

  <!-- user 1 lane -->
  <text x="52" y="80" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">user 1</text>
  <path d="M 88 76 L 436 76" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="105" y="57" width="66" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="138" y="70" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">11-02</text>
  <text x="138" y="87" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">7.44</text>
  <text x="138" y="107" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">第1笔</text>
  <rect x="190" y="57" width="66" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="223" y="70" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">11-12</text>
  <text x="223" y="87" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">49.78</text>
  <text x="223" y="107" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">第2笔</text>
  <rect x="275" y="57" width="66" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="308" y="70" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">11-18</text>
  <text x="308" y="87" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">65.56</text>
  <text x="308" y="107" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">第3笔 ★</text>
  <rect x="360" y="57" width="66" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="393" y="70" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">11-30</text>
  <text x="393" y="87" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">96.0</text>
  <text x="393" y="107" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">第4笔</text>
  <text x="494" y="72" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 前两笔都更低</text>
  <text x="494" y="88" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">→ 入选</text>

  <!-- user 2 lane -->
  <text x="52" y="170" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">user 2</text>
  <path d="M 88 166 L 266 166" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="105" y="147" width="66" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="138" y="160" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">11-20</text>
  <text x="138" y="177" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">100.44</text>
  <text x="138" y="197" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">第1笔</text>
  <rect x="190" y="147" width="66" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="223" y="160" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">11-21</text>
  <text x="223" y="177" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">40.89</text>
  <text x="223" y="197" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">第2笔</text>
  <text x="370" y="166" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 凑不齐三笔（只有 2 笔）</text>

  <!-- user 3 lane -->
  <text x="52" y="260" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">user 3</text>
  <path d="M 88 256 L 351 256" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="105" y="237" width="66" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="138" y="250" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">11-03</text>
  <text x="138" y="267" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">37.33</text>
  <text x="138" y="287" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">第1笔</text>
  <rect x="190" y="237" width="66" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="223" y="250" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">11-11</text>
  <text x="223" y="267" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">13.89</text>
  <text x="223" y="287" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">第2笔</text>
  <rect x="275" y="237" width="66" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="308" y="250" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">11-29</text>
  <text x="308" y="267" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">7.0</text>
  <text x="308" y="287" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">第3笔 ★</text>
  <text x="445" y="252" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗ 前两笔并未都更低</text>
  <text x="445" y="270" text-anchor="middle" font-size="9.5" fill="#999" filter="url(#rough2)">（37.33 &gt; 7.0）</text>

  <!-- bottom callout -->
  <rect x="30" y="302" width="500" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">等价重述：前两笔都低于第三笔 ⟺ max(前两笔花费) &lt; 第三笔花费</text>
  <text x="280" y="346" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">即「前三笔中花费最大者恰是第三笔」—— MAX OVER 帧写法的依据</text>
  <text x="280" y="364" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">不足 3 笔的用户没有 rn = 3 的行，天然出局（无需 HAVING 人数）</text>
</svg>
