<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：计数 → 取基准 → 一致校验</text>

  <!-- Input -->
  <rect x="160" y="46" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="70" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">输入字符串 s（仅小写字母）</text>

  <path d="M 260 90 L 260 108" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 1: count -->
  <rect x="80" y="114" width="360" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="134" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">步骤 1：统计频次</text>
  <text x="260" y="152" text-anchor="middle" font-size="11" fill="#555">cnt[26] = {0}；for c in s: cnt[c−'a']++</text>
  <text x="260" y="166" text-anchor="middle" font-size="10" fill="#888">一趟 O(n)，固定 26 槽 = O(1) 空间</text>

  <path d="M 260 172 L 260 190" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: pick target -->
  <rect x="80" y="196" width="360" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="216" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">步骤 2：取基准 target</text>
  <text x="260" y="234" text-anchor="middle" font-size="11" fill="#555">扫描 cnt[0..25]，target = 首个非零值</text>
  <text x="260" y="248" text-anchor="middle" font-size="10" fill="#888">（至少存在一个非零，因为 s 非空）</text>

  <path d="M 260 254 L 260 272" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 3: verify (diamond) -->
  <path d="M 260 278 L 360 312 L 260 346 L 160 312 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="306" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">步骤 3：遍历 cnt</text>
  <text x="260" y="322" text-anchor="middle" font-size="10.5" fill="#555">跳过 0；</text>
  <text x="260" y="336" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">非零项 ≠ target？</text>

  <!-- Left branch: no (all equal) -->
  <path d="M 160 312 L 80 312" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="120" y="304" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">否（全相等）</text>
  <rect x="20" y="300" width="64" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="52" y="320" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">true</text>

  <!-- Right branch: yes (mismatch) -->
  <path d="M 360 312 L 440 312" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="400" y="304" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">是（存在不等）</text>
  <rect x="436" y="300" width="64" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="468" y="320" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">false</text>

  <!-- note -->
  <text x="60" y="380" font-size="10.5" fill="#888">校验至多遍历 26 个槽，O(|Σ|) = O(1)；整体 O(n) 时间、O(1) 空间。</text>
</svg>
