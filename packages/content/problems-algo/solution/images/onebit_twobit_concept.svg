<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">前缀码与贪心扫描规则</text>

  <text x="48" y="72" font-size="12" fill="#888" font-weight="bold">字符集</text>

  <rect x="90" y="54" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="150" y="72" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">一比特字符</text>
  <text x="150" y="88" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">0</text>

  <rect x="240" y="54" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="340" y="72" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">两比特字符（均以 1 开头）</text>
  <text x="340" y="88" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">10  /  11</text>

  <text x="48" y="138" font-size="12" fill="#888" font-weight="bold">前缀码</text>
  <rect x="90" y="118" width="400" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="135" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">一比特字符 0 不是任何两比特字符的前缀</text>
  <text x="290" y="151" text-anchor="middle" font-size="11" fill="#666">→ 从左到右解码唯一确定，无需回溯</text>

  <text x="48" y="200" font-size="12" fill="#888" font-weight="bold">贪心规则</text>

  <rect x="90" y="182" width="180" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="180" y="200" text-anchor="middle" font-size="11" fill="#666">遇到</text>
  <text x="180" y="218" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">bits[i] == 0  →  i += 1</text>

  <rect x="310" y="182" width="180" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="400" y="200" text-anchor="middle" font-size="11" fill="#666">遇到</text>
  <text x="400" y="218" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">bits[i] == 1  →  i += 2</text>

  <text x="48" y="262" font-size="12" fill="#888" font-weight="bold">落点判定</text>

  <rect x="90" y="244" width="190" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="185" y="262" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">i == n - 1</text>
  <text x="185" y="280" text-anchor="middle" font-size="11" fill="#444">末位 0 单独成字</text>

  <rect x="310" y="244" width="190" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="405" y="262" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">i == n</text>
  <text x="405" y="280" text-anchor="middle" font-size="11" fill="#444">末位 0 被前 1 拼走</text>

  <path d="M 185 290 L 185 308" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 405 290 L 405 308" stroke="#b85450" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <polygon points="401,306 409,306 405,312" fill="#b85450"/>

  <rect x="90" y="310" width="190" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="185" y="332" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">return true</text>

  <rect x="310" y="310" width="190" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="405" y="332" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">return false</text>

  <rect x="40" y="356" width="480" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="280" y="368" text-anchor="middle" font-size="10" fill="#666">关键：bits 末位恒为 0，i 不会停在中间，只可能落在 n-1 或 n</text>
</svg>
