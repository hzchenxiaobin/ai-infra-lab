<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 424" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="424" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：枚举公共奇偶 k，一趟扫描的 O(1) 空间 DP</text>

  <rect x="30" y="40" width="250" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="155" y="60" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">① 枚举 k ∈ {0, 1}：相邻和的公共奇偶</text>

  <path d="M 155 72 L 155 88" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <rect x="30" y="90" width="250" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="155" y="108" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">② f[0] ← 0，f[1] ← 0</text>
  <text x="155" y="126" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">（f[r]：以奇偶 r 结尾的最长长度）</text>

  <path d="M 155 136 L 155 152" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <rect x="30" y="154" width="250" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="155" y="174" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">③ 取下一个元素 x：p ← x &amp; 1</text>

  <path d="M 155 186 L 155 202" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <rect x="30" y="204" width="250" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="155" y="224" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">④ f[p] ← f[k ⊕ p] + 1</text>
  <text x="155" y="242" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">前驱元素的奇偶性必为 k ⊕ p</text>

  <path d="M 155 250 L 155 266" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <polygon points="155,268 222,298 155,328 88,298" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="155" y="302" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">还有元素 x ?</text>

  <path d="M 88 298 L 18 298 L 18 170 L 26 170" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="52" y="290" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">是</text>

  <path d="M 155 328 L 155 344" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="170" y="342" font-size="10" fill="#446688" filter="url(#rough2)">否</text>

  <rect x="30" y="346" width="250" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="155" y="366" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">⑤ ans ← max(ans, f[0], f[1])</text>

  <path d="M 155 378 L 155 392" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <rect x="30" y="394" width="250" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="155" y="412" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⑥ 两个 k 都做完 → 返回 ans</text>

  <rect x="300" y="40" width="202" height="84" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="401" y="58" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">💡 为什么是 k ⊕ p ？</text>
  <text x="401" y="74" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">设前驱奇偶为 q，须满足</text>
  <text x="401" y="88" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">(q + p) mod 2 = k；模 2 的</text>
  <text x="401" y="102" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">加法就是异或 → q = k ⊕ p</text>

  <rect x="300" y="136" width="202" height="84" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="401" y="154" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠️ 读写顺序无忧</text>
  <text x="401" y="170" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">k=1：读写异格，读到的是处理 x</text>
  <text x="401" y="184" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">之前的旧值＝「接在原子序列后」</text>
  <text x="401" y="198" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">k=0：读写同格＝纯计数</text>

  <rect x="300" y="232" width="202" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="401" y="250" text-anchor="middle" font-size="10" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">k = 0 轮自动退化</text>
  <text x="401" y="266" text-anchor="middle" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">f[p] ← f[p] + 1 纯累加，轮末</text>
  <text x="401" y="280" text-anchor="middle" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">f[r] 恰为奇偶 r 的元素个数</text>
  <text x="401" y="294" text-anchor="middle" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">→ 4 种形态一个转移式全包</text>

  <rect x="300" y="328" width="202" height="66" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="401" y="346" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">复杂度</text>
  <text x="401" y="362" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">两轮 × 一趟扫描 → O(n)</text>
  <text x="401" y="376" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">f 长度恒为 2 → O(1) 空间</text>
</svg>
