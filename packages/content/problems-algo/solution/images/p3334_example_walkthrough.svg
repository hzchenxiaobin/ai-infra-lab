<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：nums = [2,4,8,16]，n = 4</text>

  <!-- 前后缀表 -->
  <text x="20" y="44" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">预处理四张表：</text>
  <rect x="86" y="50" width="42" height="20" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="107" y="64" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">k=0</text>
  <rect x="128" y="50" width="42" height="20" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="149" y="64" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">1</text>
  <rect x="170" y="50" width="42" height="20" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="191" y="64" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">2</text>
  <rect x="212" y="50" width="42" height="20" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="233" y="64" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">3</text>
  <rect x="254" y="50" width="42" height="20" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="275" y="64" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">4</text>

  <text x="80" y="82" text-anchor="end" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">preG</text>
  <text x="80" y="104" text-anchor="end" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">preL</text>
  <text x="80" y="126" text-anchor="end" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">sufG</text>
  <text x="80" y="148" text-anchor="end" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">sufL</text>

  <g font-size="10" text-anchor="middle" fill="#33506b" filter="url(#rough2)">
    <text x="107" y="84" fill="#b85450" font-weight="bold">0</text><text x="149" y="84">2</text><text x="191" y="84">2</text><text x="233" y="84">2</text><text x="275" y="84">2</text>
    <text x="107" y="106" fill="#b85450" font-weight="bold">1</text><text x="149" y="106">2</text><text x="191" y="106">4</text><text x="233" y="106">8</text><text x="275" y="106">16</text>
  </g>
  <g font-size="10" text-anchor="middle" fill="#2f5d24" filter="url(#rough2)">
    <text x="107" y="128">2</text><text x="149" y="128">4</text><text x="191" y="128">8</text><text x="233" y="128">16</text><text x="275" y="128" fill="#b85450" font-weight="bold">0</text>
    <text x="107" y="150">16</text><text x="149" y="150">16</text><text x="191" y="150">16</text><text x="233" y="150">16</text><text x="275" y="150" fill="#b85450" font-weight="bold">1</text>
  </g>

  <rect x="320" y="56" width="176" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="408" y="76" text-anchor="middle" font-size="10" fill="#33506b" font-weight="bold" filter="url(#rough2)">删下标 i 时只查两格：</text>
  <text x="408" y="96" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">G = gcd(preG[i], sufG[i+1])</text>
  <text x="408" y="114" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">L = lcm(preL[i], sufL[i+1])</text>
  <text x="408" y="136" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">红字＝单位元哨兵</text>
  <text x="408" y="150" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">（preG[0]=0，preL[0]=1，sufG[4]=0，sufL[4]=1）</text>

  <!-- 方案表 -->
  <rect x="20" y="172" width="90" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="65" y="188" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">方案</text>
  <rect x="110" y="172" width="100" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="188" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">剩余数组</text>
  <rect x="210" y="172" width="45" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="232" y="188" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">G</text>
  <rect x="255" y="172" width="45" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="277" y="188" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">L</text>
  <rect x="300" y="172" width="55" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="327" y="188" text-anchor="middle" font-size="10" fill="#a07830" font-weight="bold" filter="url(#rough2)">得分</text>

  <g font-size="10" text-anchor="middle" fill="#444" filter="url(#rough2)">
    <rect x="20" y="200" width="335" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="65" y="216">不删</text><text x="160" y="216">[2,4,8,16]</text><text x="232" y="216">2</text><text x="277" y="216">16</text><text x="327" y="216">32</text>

    <rect x="20" y="228" width="335" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="65" y="244" fill="#b85450" font-weight="bold">删 0（值 2）</text><text x="160" y="244" fill="#b85450" font-weight="bold">[4,8,16]</text><text x="232" y="244" fill="#b85450" font-weight="bold">4</text><text x="277" y="244" fill="#b85450" font-weight="bold">16</text><text x="327" y="244" fill="#b85450" font-weight="bold">64 ★</text>

    <rect x="20" y="256" width="335" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="65" y="272">删 1（值 4）</text><text x="160" y="272">[2,8,16]</text><text x="232" y="272">2</text><text x="277" y="272">16</text><text x="327" y="272">32</text>

    <rect x="20" y="284" width="335" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="65" y="300">删 2（值 8）</text><text x="160" y="300">[2,4,16]</text><text x="232" y="300">2</text><text x="277" y="300">16</text><text x="327" y="300">32</text>

    <rect x="20" y="312" width="335" height="24" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <text x="65" y="328">删 3（值 16）</text><text x="160" y="328">[2,4,8]</text><text x="232" y="328">2</text><text x="277" y="328">8</text><text x="327" y="328">16</text>
  </g>

  <rect x="370" y="200" width="130" height="136" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="435" y="222" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">结论：max = 64</text>
  <text x="435" y="244" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">2 是「短板」：</text>
  <text x="435" y="260" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">独自把 GCD 压到 2</text>
  <text x="435" y="278" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">删掉它 GCD 翻倍</text>
  <text x="435" y="296" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">LCM 由 16 主导不变</text>
  <text x="435" y="320" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">4 × 16 = 64 ✓</text>
</svg>
