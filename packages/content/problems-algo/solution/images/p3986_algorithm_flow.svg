<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：固定下标解析 → 位权换算 → 作差返回</text>

  <!-- 开始 -->
  <rect x="150" y="36" width="260" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="57" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">输入 startTime、endTime（"HH:MM:SS"）</text>

  <path d="M 280 68 L 280 82" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 解析 startTime 子程序框 -->
  <rect x="120" y="86" width="320" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="106" text-anchor="middle" font-size="11.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">toSec(startTime)：固定下标切三段</text>
  <text x="280" y="124" text-anchor="middle" font-size="10.5" fill="#8a6d1a" filter="url(#rough2)">H = s[0..1]，M = s[3..4]，S = s[6..7]</text>
  <text x="280" y="146" text-anchor="middle" font-size="11" fill="#8a6d1a" filter="url(#rough2)">t₁ = H×3600 ＋ M×60 ＋ S</text>

  <!-- 示例角标 -->
  <rect x="452" y="94" width="96" height="58" fill="#ffffff" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="500" y="112" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">"12:34:56"</text>
  <text x="500" y="126" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">12×3600＋34×60</text>
  <text x="500" y="140" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">＋56 = 45296</text>

  <path d="M 280 162 L 280 176" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 解析 endTime 子程序框 -->
  <rect x="120" y="180" width="320" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="202" text-anchor="middle" font-size="11.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">toSec(endTime)：同款换算</text>
  <text x="280" y="222" text-anchor="middle" font-size="11" fill="#8a6d1a" filter="url(#rough2)">t₂ = 13×3600 ＋ 0×60 ＋ 0 = 46800</text>

  <path d="M 280 236 L 280 250" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 作差 -->
  <rect x="175" y="254" width="210" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="276" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans = t₂ − t₁ ＝ 1504</text>

  <path d="M 280 288 L 280 302" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 返回 -->
  <rect x="205" y="306" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="328" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <!-- 底部：固定下标示意 -->
  <rect x="60" y="366" width="440" height="112" fill="#ffffff" stroke="#999" stroke-width="1.4" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="388" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">为什么敢用固定下标？格式被约束钉死（长度恒为 8）</text>

  <!-- 字符格子 -->
  <g filter="url(#rough2)">
    <rect x="160" y="400" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="190" y="400" width="28" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <rect x="220" y="400" width="28" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="250" y="400" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="280" y="400" width="28" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <rect x="310" y="400" width="28" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="4"/>
    <rect x="340" y="400" width="28" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
    <rect x="370" y="400" width="28" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4"/>
  </g>
  <text x="174" y="419" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="204" y="419" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="234" y="419" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">:</text>
  <text x="264" y="419" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="294" y="419" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="324" y="419" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">:</text>
  <text x="354" y="419" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="384" y="419" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">6</text>

  <text x="174" y="445" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">下标0</text>
  <text x="204" y="445" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">下标1</text>
  <text x="264" y="445" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">下标3</text>
  <text x="294" y="445" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">下标4</text>
  <text x="354" y="445" text-anchor="middle" font-size="9.5" fill="#8a6d1a" filter="url(#rough2)">下标6</text>
  <text x="384" y="445" text-anchor="middle" font-size="9.5" fill="#8a6d1a" filter="url(#rough2)">下标7</text>

  <text x="280" y="468" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">两段拼两位数：(s[0]−&#39;0&#39;)×10 ＋ (s[1]−&#39;0&#39;)，冒号只占位不入算</text>
</svg>
