<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：固定最大边 k，双指针在 [0, k-1] 中计数 a+b &gt; c</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">排序后降维：固定 c → 找两数之和 &gt; c 的对数，双指针 O(n) 扫一轮</text>

  <!-- sorted array cells: [2,2,3,4] -->
  <text x="20" y="86" font-size="12" fill="#888">nums(已排序)：</text>
  <rect x="120" y="70" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="144" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="170" y="70" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="194" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="220" y="70" width="48" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="244" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="270" y="70" width="48" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="294" y="92" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>

  <!-- index labels -->
  <text x="144" y="118" text-anchor="middle" font-size="9.5" fill="#aaa">0</text>
  <text x="194" y="118" text-anchor="middle" font-size="9.5" fill="#aaa">1</text>
  <text x="244" y="118" text-anchor="middle" font-size="9.5" fill="#aaa">2</text>
  <text x="294" y="118" text-anchor="middle" font-size="9.5" fill="#aaa">3</text>

  <!-- k pointer (red) pointing to index 3 -->
  <path d="M 294 130 L 294 120" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="294" y="146" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">k</text>
  <text x="294" y="160" text-anchor="middle" font-size="9.5" fill="#b85450">最大边 c</text>

  <!-- left pointer (blue) pointing to index 0 -->
  <path d="M 144 200 L 144 110" stroke="#446688" stroke-width="1.8" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="144" y="214" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">left</text>

  <!-- right pointer (orange) pointing to index 2 -->
  <path d="M 244 200 L 244 110" stroke="#d6a040" stroke-width="1.8" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="244" y="214" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">right</text>

  <!-- two-pointer sweep bracket below -->
  <path d="M 144 232 L 144 238 L 244 238 L 244 232" stroke="#888" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="194" y="256" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">双指针区间 [0, k-1]</text>

  <!-- triangle inequality box -->
  <rect x="40" y="276" width="480" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="296" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">三角形不等式：a ≤ b ≤ c 时，只需 a + b &gt; c</text>

  <!-- move rule box -->
  <rect x="40" y="312" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="332" text-anchor="middle" font-size="11.5" fill="#444">a + b &gt; c → count += right − left, right −−   （left 到 right−1 全合法）</text>
  <text x="280" y="350" text-anchor="middle" font-size="11.5" fill="#444">a + b ≤ c → left++   （换更大的 left）</text>
  <text x="280" y="364" text-anchor="middle" font-size="10.5" fill="#888">升序保证单调性：双指针不漏不重</text>
</svg>
