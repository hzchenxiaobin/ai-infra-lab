<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：两阶段从右向左扫描</text>

  <!-- Start node -->
  <ellipse cx="270" cy="62" rx="100" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="12" fill="#333">开始: i = n − 1</text>

  <!-- Arrow down -->
  <path d="M 270 82 L 270 98" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 1: s[i] == ' '? -->
  <polygon points="270,102 380,148 270,194 160,148" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="142" text-anchor="middle" font-size="11" fill="#333">i ≥ 0 且</text>
  <text x="270" y="158" text-anchor="middle" font-size="11" fill="#333">s[i] == ' ' ?</text>

  <!-- Phase 1 label (left side) -->
  <rect x="40" y="138" width="76" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="78" y="153" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">阶段 1</text>

  <!-- Yes branch: i-- -->
  <path d="M 380 148 L 440 148" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="140" text-anchor="middle" font-size="11" fill="#b85450">是</text>
  <rect x="440" y="126" width="64" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="472" y="144" text-anchor="middle" font-size="10" fill="#333">跳过空格</text>
  <text x="472" y="160" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">i −−</text>

  <!-- Loop back from i-- to decision 1 (up and left) -->
  <path d="M 472 126 L 472 88 L 270 88 L 270 100" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- No branch: down to len = 0 -->
  <path d="M 270 194 L 270 214" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="210" font-size="11" fill="#82b366">否</text>

  <!-- len = 0 box -->
  <rect x="220" y="218" width="100" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="239" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">len = 0</text>

  <!-- Arrow down -->
  <path d="M 270 250 L 270 266" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 2: s[i] != ' '? -->
  <polygon points="270,270 380,316 270,362 160,316" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="310" text-anchor="middle" font-size="11" fill="#333">i ≥ 0 且</text>
  <text x="270" y="326" text-anchor="middle" font-size="11" fill="#333">s[i] != ' ' ?</text>

  <!-- Phase 2 label (left side) -->
  <rect x="40" y="306" width="76" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="78" y="321" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">阶段 2</text>

  <!-- Yes branch: len++; i-- -->
  <path d="M 380 316 L 440 316" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="308" text-anchor="middle" font-size="11" fill="#82b366">是</text>
  <rect x="440" y="294" width="72" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="476" y="312" text-anchor="middle" font-size="10" fill="#333">数单词</text>
  <text x="476" y="328" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">len++; i−−</text>

  <!-- Loop back from len++; i-- to decision 2 -->
  <path d="M 476 294 L 476 256 L 270 256 L 270 268" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- No branch: down to return -->
  <path d="M 270 362 L 270 382" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="378" font-size="11" fill="#b85450">否</text>

  <!-- End node -->
  <ellipse cx="270" cy="406" rx="90" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="410" text-anchor="middle" font-size="12" fill="#333">返回 len</text>

  <!-- Summary note -->
  <text x="270" y="432" text-anchor="middle" font-size="10" fill="#888">关键：两阶段共用 i，判定互补；最坏 O(n)，实际只访问尾部一段</text>
</svg>
