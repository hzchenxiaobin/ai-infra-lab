<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：差分标记 → 前缀和 → 逐点检查</text>

  <!-- 1. Initialize diff array -->
  <rect x="150" y="44" width="220" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="68" text-anchor="middle" font-size="12" fill="#333">① 初始化 diff[0..52] = 0</text>

  <path d="M 260 82 L 260 100" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. For each range, mark +1/-1 -->
  <rect x="120" y="100" width="280" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="120" text-anchor="middle" font-size="12" fill="#333">② 遍历每个区间 [start, end]</text>
  <text x="260" y="138" text-anchor="middle" font-size="11" fill="#555">diff[start]++,　diff[end + 1]−−</text>

  <path d="M 260 148 L 260 166" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="162" font-size="10" fill="#888">所有区间处理完</text>

  <!-- 3. Prefix sum -->
  <rect x="130" y="166" width="260" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="186" text-anchor="middle" font-size="12" fill="#333">③ 前缀和还原覆盖次数</text>
  <text x="260" y="204" text-anchor="middle" font-size="11" fill="#555">cover[i] = cover[i−1] + diff[i]</text>

  <path d="M 260 214 L 260 232" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4. Check [left, right] loop -->
  <polygon points="260,232 380,278 260,324 140,278" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="272" text-anchor="middle" font-size="11.5" fill="#333">i 从 left 到 right</text>
  <text x="260" y="290" text-anchor="middle" font-size="11.5" fill="#333">cover[i] ≥ 1 ?</text>
  <text x="260" y="306" text-anchor="middle" font-size="10" fill="#888">(每个点都被覆盖?)</text>

  <!-- No → return false -->
  <path d="M 380 278 L 450 278" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="440" y="262" width="72" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="476" y="282" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return false</text>
  <text x="410" y="270" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- Yes → next i -->
  <path d="M 140 278 L 80 278 L 80 232 L 140 252" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="52" y="258" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <text x="52" y="272" font-size="9.5" fill="#4a7a3a">下一个 i</text>

  <!-- All checked → return true -->
  <path d="M 260 324 L 260 346" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="340" font-size="10" fill="#4a7a3a">全部 ≥ 1</text>

  <rect x="150" y="346" width="220" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="368" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">→ return true</text>

  <!-- Right side notes -->
  <rect x="390" y="120" width="120" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="450" y="140" text-anchor="middle" font-size="10" fill="#a87020" font-weight="bold">区间加 1 = O(1)</text>
  <text x="450" y="156" text-anchor="middle" font-size="9.5" fill="#555">只改 start 和 end+1</text>
  <text x="450" y="170" text-anchor="middle" font-size="9.5" fill="#555">两个端点</text>

  <rect x="390" y="186" width="120" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="450" y="204" text-anchor="middle" font-size="10" fill="#a87020" font-weight="bold">前缀和 = O(U)</text>
  <text x="450" y="220" text-anchor="middle" font-size="9.5" fill="#555">U = 值域上界 ≤ 50</text>

  <!-- Footer -->
  <text x="260" y="404" text-anchor="middle" font-size="10.5" fill="#888">总时间 O(n + U)，空间 O(U)　n = 区间数, U = 值域范围</text>
  <text x="260" y="422" text-anchor="middle" font-size="10" fill="#aaa">对比暴力 O(n × (right−left))：差分把「逐区间逐点」降为「批量标记 + 一遍扫描」</text>
</svg>
