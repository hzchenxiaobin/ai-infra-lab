<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">岛屿数量 II 算法流程</text>

  <!-- init -->
  <rect x="170" y="44" width="200" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="62" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">初始化</text>
  <text x="270" y="78" text-anchor="middle" font-size="10.5" fill="#666">parent[i]=i, grid 全水, count=0</text>
  <line x1="270" y1="86" x2="270" y2="106" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop positions -->
  <rect x="150" y="106" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="127" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">遍历 positions 中每个 (r,c)</text>
  <line x1="270" y1="140" x2="270" y2="160" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision: already land? -->
  <path d="M 270 160 L 380 202 L 270 244 L 160 202 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="196" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">grid[r][c]</text>
  <text x="270" y="212" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">已是陆地?</text>

  <!-- yes branch: skip -->
  <text x="120" y="198" font-size="11" fill="#888">是</text>
  <path d="M 160 202 L 110 202 L 110 124 L 150 124" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="70" y="118" font-size="10" fill="#888">跳过，count 不变</text>

  <!-- no branch -->
  <text x="396" y="198" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>
  <line x1="380" y1="202" x2="430" y2="202" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- mark land + count+1 -->
  <rect x="430" y="184" width="100" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="480" y="202" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">置 grid=1</text>
  <text x="480" y="217" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">count+1</text>
  <line x1="480" y1="224" x2="480" y2="244" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- check 4 neighbors -->
  <rect x="380" y="244" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="480" y="262" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">枚举 4 方向邻居</text>
  <text x="480" y="278" text-anchor="middle" font-size="10.5" fill="#666">(上/下/左/右) 是陆地?</text>
  <line x1="480" y1="288" x2="480" y2="308" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision: union different root? -->
  <path d="M 480 308 L 510 318 L 480 348 L 450 318 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="480" y="322" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">异根?</text>
  <!-- yes: union + count-1 -->
  <text x="516" y="316" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <line x1="510" y1="318" x2="528" y2="318" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="438" y="312" width="0" height="0" fill="none"/>
  <text x="528" y="334" font-size="10" fill="#4a7a3a">union</text>
  <text x="528" y="346" font-size="10" fill="#b85450">count−1</text>
  <path d="M 510 318 L 510 360" stroke="#888" stroke-width="1.4" fill="none"/>
  <!-- no: skip neighbor -->
  <text x="430" y="316" font-size="10" fill="#888">否</text>
  <text x="412" y="338" font-size="10" fill="#888">下个邻居</text>

  <!-- back to neighbors loop -->
  <path d="M 510 360 Q 510 372 480 372 L 480 288" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- after neighbors: record -->
  <line x1="480" y1="372" x2="480" y2="392" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="400" y="392" width="160" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.7" rx="8" filter="url(#rough2)"/>
  <text x="480" y="413" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">ans.append(count)</text>

  <!-- back to outer loop -->
  <path d="M 400 409 Q 270 409 270 409 L 240 409 L 240 124 L 150 124" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="180" y="402" font-size="10" fill="#888">回到 positions 循环</text>

  <!-- end -->
  <line x1="270" y1="409" x2="270" y2="425" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="170" y="425" width="200" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="444" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 ans</text>
</svg>
