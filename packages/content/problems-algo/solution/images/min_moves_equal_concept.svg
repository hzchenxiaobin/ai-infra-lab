<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>
  <text x="270" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：给 n−1 个数 +1 ≡ 给 1 个数 −1</text>

  <!-- ===== Top: original operation ===== -->
  <text x="40" y="60" font-size="12" fill="#446688" font-weight="bold">① 原始操作：n−1 个元素 +1</text>

  <!-- before array -->
  <rect x="60" y="74" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="82" y="97" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="106" y="74" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="128" y="97" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="152" y="74" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="174" y="97" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">3</text>
  <text x="206" y="96" font-size="10.5" fill="#888">不动</text>

  <!-- arrow -->
  <path d="M 246 91 L 286 91" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="266" y="84" text-anchor="middle" font-size="10" fill="#888">+1 步</text>

  <!-- after array -->
  <rect x="292" y="74" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="314" y="97" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="338" y="74" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="360" y="97" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">3</text>
  <rect x="384" y="74" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="406" y="97" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">3</text>
  <text x="438" y="96" font-size="10.5" fill="#888">[1,2,3] → [2,3,3]</text>

  <!-- divider -->
  <path d="M 40 124 L 500 124" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>

  <!-- ===== Bottom: equivalent operation ===== -->
  <text x="40" y="152" font-size="12" fill="#446688" font-weight="bold">② 等价操作：1 个元素 −1</text>

  <!-- before array -->
  <rect x="60" y="166" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="82" y="189" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="106" y="166" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="128" y="189" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="152" y="166" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="174" y="189" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3</text>
  <text x="206" y="188" font-size="10.5" fill="#b85450">−1</text>

  <!-- arrow -->
  <path d="M 246 183 L 286 183" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="266" y="176" text-anchor="middle" font-size="10" fill="#888">−1 步</text>

  <!-- after array -->
  <rect x="292" y="166" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="314" y="189" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="338" y="166" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="360" y="189" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="384" y="166" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="406" y="189" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="438" y="188" font-size="10.5" fill="#888">[1,2,3] → [1,2,2]</text>

  <!-- equivalence note -->
  <path d="M 40 216 L 500 216" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>
  <text x="40" y="244" font-size="12" fill="#446688" font-weight="bold">③ 差值变化完全相同 → 两种操作等价</text>

  <!-- difference bars -->
  <text x="60" y="266" font-size="10.5" fill="#888">原始：最大−最小 = 3−1 = 2</text>
  <text x="60" y="282" font-size="10.5" fill="#888">+1 后：最大−最小 = 3−2 = 1（差减1）</text>
  <text x="60" y="298" font-size="10.5" fill="#888">−1 后：最大−最小 = 2−1 = 1（差减1）</text>

  <text x="300" y="274" font-size="11" fill="#d6a040" font-weight="bold">每步都让「最大−最小」减 1</text>
  <text x="300" y="292" font-size="11" fill="#d6a040">→ 要让差变 0</text>
  <text x="300" y="308" font-size="11" fill="#d6a040">→ 把每个数降到 min(nums)</text>

  <!-- footer -->
  <rect x="40" y="328" width="460" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="270" y="350" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">移动数 = Σ(nums[i] − min) = sum(nums) − n × min(nums)</text>
  <text x="270" y="370" text-anchor="middle" font-size="10.5" fill="#555">把「让 n−1 个数追上最大」翻译成「让所有数降到最小」</text>
</svg>
