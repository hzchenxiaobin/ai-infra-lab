<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="8" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="560" height="420" fill="#fdfcf7"/>

  <text x="280" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#2b2b2b">示例演算：characters="abc", k=2</text>
  <path d="M 150 36 Q 280 44 410 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="280" y="62" text-anchor="middle" font-size="11" fill="#888">n=3, k=2 → 上界 idx[j] &lt; n−k+j = 1+j</text>

  <!-- Table header -->
  <g filter="url(#sk)"><rect x="40" y="76" width="480" height="26" rx="4" fill="#f0f0f0" stroke="#bbb" stroke-width="1"/></g>
  <text x="80" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#444">调用</text>
  <text x="190" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#444">idx 数组</text>
  <text x="310" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#444">拼出串</text>
  <text x="430" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#444">推进后 idx</text>

  <!-- Row 1: init -->
  <g filter="url(#sk)"><rect x="40" y="104" width="480" height="32" rx="4" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.2"/></g>
  <text x="80" y="124" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">构造</text>
  <text x="190" y="124" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">[0, 1]</text>
  <text x="310" y="124" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="430" y="124" text-anchor="middle" font-size="11" fill="#888">—</text>

  <!-- Row 2: next() -> "ab" -->
  <g filter="url(#sk)"><rect x="40" y="138" width="480" height="32" rx="4" fill="#fff" stroke="#ccc" stroke-width="1"/></g>
  <text x="80" y="158" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">next()</text>
  <text x="190" y="158" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">[0, 1]</text>
  <g filter="url(#sk)"><rect x="290" y="142" width="40" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="310" y="159" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">ab</text>
  <text x="430" y="158" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">[0, 2]</text>

  <!-- Row 3: next() -> "ac" -->
  <g filter="url(#sk)"><rect x="40" y="172" width="480" height="32" rx="4" fill="#fff" stroke="#ccc" stroke-width="1"/></g>
  <text x="80" y="192" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">next()</text>
  <text x="190" y="192" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">[0, 2]</text>
  <g filter="url(#sk)"><rect x="290" y="176" width="40" height="24" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="310" y="193" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">ac</text>
  <text x="430" y="192" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">[1, 2]</text>

  <!-- Row 4: next() -> "bc" -->
  <g filter="url(#sk)"><rect x="40" y="206" width="480" height="32" rx="4" fill="#fff" stroke="#ccc" stroke-width="1"/></g>
  <text x="80" y="226" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">next()</text>
  <text x="190" y="226" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">[1, 2]</text>
  <g filter="url(#sk)"><rect x="290" y="210" width="40" height="24" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/></g>
  <text x="310" y="227" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">bc</text>
  <text x="430" y="226" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">done ✓</text>

  <!-- Row 5: hasNext() -> false -->
  <g filter="url(#sk)"><rect x="40" y="240" width="480" height="32" rx="4" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/></g>
  <text x="80" y="260" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">hasNext()</text>
  <text x="190" y="260" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="310" y="260" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">false</text>
  <text x="430" y="260" text-anchor="middle" font-size="11" fill="#888">—</text>

  <!-- Annotation: push detail -->
  <g filter="url(#sk)"><rect x="40" y="288" width="480" height="118" rx="8" fill="#fffdf3" stroke="#9e9e9e" stroke-dasharray="5 3"/></g>
  <text x="56" y="310" font-size="12" font-weight="bold" fill="#444">推进细节（以 [0,1] → [0,2] 为例）：</text>
  <text x="56" y="330" font-size="11" fill="#444">· j 从 k−1=1 往左扫：idx[1]=1，上界 = n−k+1 = 2，1 &lt; 2 ✓ → 可增</text>
  <text x="56" y="348" font-size="11" fill="#444">· idx[1]++ → idx[1]=2</text>
  <text x="56" y="366" font-size="11" fill="#444">· j 右侧无元素（j 已是最右），无需重置 → [0, 2]</text>
  <text x="56" y="386" font-size="11" fill="#d6a040">★ 再看 [0,2]→[1,2]：idx[1]=2 不 &lt; 2，idx[0]=0 &lt; 1 ✓ → idx[0]++, idx[1]=idx[0]+1=2</text>
  <text x="56" y="402" font-size="11" fill="#b85450">★ [1,2]→done：idx[1]=2 不 &lt; 2，idx[0]=1 不 &lt; 1 → 无可增位，耗尽</text>
</svg>
