<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#446688" stroke-width="1.6"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#b85450" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="17" fill="#333"
        filter="url(#rough2)">算法流程：一遍扫描，判偶则 OR 进累积器</text>

  <!-- ① 初始化 -->
  <rect x="60" y="52" width="300" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="210" y="76" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">① 初始化 ans = 0（或的幺元）</text>

  <path d="M 210 90 L 210 106" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② 取元素 -->
  <rect x="60" y="110" width="300" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="210" y="134" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">② 取下一个元素 x（未取完）</text>

  <path d="M 210 148 L 210 162" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断偶数 -->
  <polygon points="210,164 296,204 210,244 124,204" fill="#fafafa" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="210" y="200" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">x &amp; 1 == 0 ?</text>
  <text x="210" y="217" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">（最低位是 0？）</text>

  <!-- 是 → OR -->
  <path d="M 296 204 L 340 204" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="316" y="196" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="344" y="184" width="130" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="409" y="202" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans |= x</text>
  <text x="409" y="218" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">置位只增不减</text>

  <!-- 否 → 跳过 -->
  <path d="M 210 244 L 210 268" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="220" y="260" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否（奇数跳过）</text>
  <rect x="126" y="272" width="168" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="210" y="294" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">回到 ② 取下一个</text>

  <!-- 循环回环 -->
  <path d="M 474 204 L 500 204 L 500 129 L 364 129" stroke="#446688" stroke-width="1.3" stroke-dasharray="6 4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="492" y="168" font-size="10" fill="#446688" filter="url(#rough2)">继续</text>

  <!-- 扫描完 → 返回 -->
  <path d="M 60 129 L 40 129 L 40 320 L 130 320" stroke="#446688" stroke-width="1.3" stroke-dasharray="6 4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="44" y="258" font-size="10" fill="#446688" filter="url(#rough2)">取完</text>
  <rect x="134" y="302" width="180" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="224" y="326" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">③ 返回 ans</text>

  <!-- 注释框 -->
  <rect x="330" y="302" width="170" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="415" y="318" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">无偶数：ans 从未被更新</text>
  <text x="415" y="332" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">恰好返回 0，零特判</text>
</svg>
