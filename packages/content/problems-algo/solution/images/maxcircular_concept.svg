<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">环形数组最大子数组和：两种情况</text>

  <!-- Case 1: Non-circular -->
  <text x="30" y="56" font-size="12" fill="#4a7a3a" font-weight="bold">情况一：不跨越边界（普通区间）</text>

  <!-- Linear array representation -->
  <rect x="60" y="66" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="85" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="105" y="66" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="85" text-anchor="middle" font-size="11" fill="#333">−3</text>
  <rect x="150" y="66" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="85" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <rect x="195" y="66" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="215" y="85" text-anchor="middle" font-size="11" fill="#333">2</text>

  <text x="260" y="85" font-size="11" fill="#4a7a3a">→ Kadane 求 max</text>

  <!-- Bracket showing max subarray -->
  <path d="M 60 100 L 60 108 L 190 108 L 190 100" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="125" y="124" text-anchor="middle" font-size="11" fill="#4a7a3a">max_sum = Kadane(nums)</text>

  <!-- Case 2: Circular -->
  <text x="30" y="156" font-size="12" fill="#b85450" font-weight="bold">情况二：跨越边界（首尾相接）</text>

  <!-- Circular array: left part (selected) + middle (skipped) + right part (selected) -->
  <rect x="60" y="166" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="185" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <rect x="105" y="166" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="185" text-anchor="middle" font-size="11" fill="#333">−3</text>
  <rect x="150" y="166" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="185" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="195" y="166" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="215" y="185" text-anchor="middle" font-size="11" fill="#333">2</text>

  <!-- Wrap arrow from right to left -->
  <path d="M 235 180 Q 270 145 235 175" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Explanation -->
  <text x="260" y="185" font-size="11" fill="#b85450">→ total − min_sum</text>

  <!-- Bracket showing skip -->
  <path d="M 105 200 L 105 208 L 195 208 L 195 200" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="150" y="224" text-anchor="middle" font-size="11" fill="#d6a040">跳过中间最小段</text>

  <!-- Formula box -->
  <rect x="40" y="240" width="440" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="262" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">answer = max(max_sum, total − min_sum)</text>
  <text x="260" y="280" text-anchor="middle" font-size="11" fill="#888">跨越边界 = 总和扣掉中间最差的一段</text>

  <!-- Edge case warning -->
  <rect x="40" y="302" width="440" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="322" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">⚠️ 全负数组：total − min_sum = 0（空集），须取 max_sum</text>
  <text x="260" y="338" text-anchor="middle" font-size="11" fill="#888">即 max_sum > 0 时才考虑环形情况</text>
</svg>
