<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：元音数 = 辅音数 ⟹ 乘积 = v²，判定只剩一个变量</text>

  <text x="66" y="76" font-size="12" fill="#555">t =</text>

  <rect x="90" y="56" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="108" y="74" text-anchor="middle" font-size="13" fill="#333">b</text>
  <rect x="126" y="56" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="144" y="74" text-anchor="middle" font-size="13" fill="#333">a</text>
  <rect x="162" y="56" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="180" y="74" text-anchor="middle" font-size="13" fill="#333">e</text>
  <rect x="198" y="56" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="216" y="74" text-anchor="middle" font-size="13" fill="#333">y</text>

  <text x="108" y="98" text-anchor="middle" font-size="10" fill="#446688">辅</text>
  <text x="144" y="98" text-anchor="middle" font-size="10" fill="#4a7a3a">元</text>
  <text x="180" y="98" text-anchor="middle" font-size="10" fill="#4a7a3a">元</text>
  <text x="216" y="98" text-anchor="middle" font-size="10" fill="#446688">辅</text>

  <text x="290" y="64" font-size="12" fill="#4a7a3a">v = 2（元音数）</text>
  <text x="290" y="82" font-size="12" fill="#446688">c = 2（辅音数）</text>
  <text x="290" y="100" font-size="12" fill="#333" font-weight="bold">v == c ✓ 平衡，len = 4 = 2v</text>

  <rect x="60" y="124" width="440" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="150" text-anchor="middle" font-size="13" fill="#333">① 元音 = 辅音 ⟺ len = v + c = 2v ⟹ 平衡判定：2v == len</text>
  <text x="280" y="174" text-anchor="middle" font-size="13" fill="#333">② v × c = v × v = v² ⟹ 整除判定：v² mod k == 0</text>

  <path d="M 280 188 L 280 210" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <rect x="60" y="214" width="440" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="238" text-anchor="middle" font-size="13" fill="#333">增量维护：固定左端点 i，j 每右移一格，v 至多 +1</text>
  <text x="280" y="260" text-anchor="middle" font-size="12" fill="#446688">内层均摊 O(1) → 总计 O(n²)，n = 1000 约 5×10⁵ 次判定</text>

  <path d="M 280 270 L 280 290" fill="none" stroke="#446688" stroke-width="1.8" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <rect x="60" y="294" width="440" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="318" text-anchor="middle" font-size="13" fill="#333">数论预告（见第 5 节）：v² ≡ 0 (mod k) ⟺ m ∣ v，m = ∏ p^⌈e/2⌉</text>
  <text x="280" y="340" text-anchor="middle" font-size="12" fill="#4a7a3a">k=2→m=2，k=12→m=6，k=1→m=1（平衡即美丽，对应示例 2）</text>

  <text x="60" y="384" font-size="12" fill="#999">⚠ 元音 = {a, e, i, o, u}，其余皆辅音——y 也是辅音（"baey" 的 c 靠它撑平）</text>
</svg>
