<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="420" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：FROM → GROUP BY → SELECT（含标量子查询）→ ORDER BY</text>

  <!-- 步骤 1 FROM -->
  <rect x="30" y="56" width="150" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="105" y="78" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">① FROM Register</text>
  <text x="105" y="98" text-anchor="middle" font-size="9.5" fill="#333">读取全部注册记录</text>

  <path d="M182 84 L228 84" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 步骤 2 GROUP BY -->
  <rect x="230" y="56" width="160" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="310" y="78" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">② GROUP BY contest_id</text>
  <text x="310" y="98" text-anchor="middle" font-size="9.5" fill="#333">按赛事分组（5 组）</text>

  <path d="M392 84 L438 84" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 步骤 3 SELECT -->
  <rect x="440" y="48" width="150" height="74" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="515" y="70" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">③ SELECT</text>
  <text x="515" y="88" text-anchor="middle" font-size="9" fill="#333">contest_id,</text>
  <text x="515" y="102" text-anchor="middle" font-size="9" fill="#333">COUNT(user_id),</text>
  <text x="515" y="116" text-anchor="middle" font-size="9" fill="#333">ROUND(...,2)</text>

  <!-- 标量子查询分支 -->
  <rect x="230" y="150" width="160" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="310" y="172" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">标量子查询（分母）</text>
  <text x="310" y="192" text-anchor="middle" font-size="9.5" fill="#333">(SELECT COUNT(*) FROM Users)</text>

  <path d="M310 206 L310 232 L515 232 L515 122" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="400" y="226" text-anchor="middle" font-size="9" fill="#b85450">注入每组做除法</text>

  <!-- 步骤 4 ORDER BY -->
  <rect x="440" y="250" width="150" height="66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="515" y="272" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">④ ORDER BY</text>
  <text x="515" y="290" text-anchor="middle" font-size="9.5" fill="#333">percentage DESC,</text>
  <text x="515" y="306" text-anchor="middle" font-size="9.5" fill="#333">contest_id ASC</text>

  <path d="M515 122 L515 248" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 结果表 -->
  <rect x="180" y="320" width="260" height="84" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="310" y="340" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">结果（contest_id | percentage）</text>
  <text x="210" y="360" font-size="10" fill="#333">208 | 100.0</text>
  <text x="210" y="376" font-size="10" fill="#333">209 | 100.0</text>
  <text x="210" y="392" font-size="10" fill="#333">215 | 66.67</text>
  <text x="370" y="360" font-size="10" fill="#333">210 | 100.0</text>
  <text x="370" y="376" font-size="10" fill="#333">207 | 33.33</text>

  <path d="M515 316 L440 340" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 子句执行顺序说明 -->
  <rect x="30" y="150" width="180" height="86" fill="#fafafa" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="120" y="172" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">SQL 子句执行顺序</text>
  <text x="45" y="192" font-size="9.5" fill="#555">FROM → ON → JOIN</text>
  <text x="45" y="208" font-size="9.5" fill="#555">→ GROUP BY → HAVING</text>
  <text x="45" y="224" font-size="9.5" fill="#555">→ SELECT → ORDER BY</text>

  <text x="310" y="406" text-anchor="middle" font-size="9.5" fill="#888">标量子查询在 SELECT 阶段对每组求值一次，返回单值常量作分母</text>
</svg>
