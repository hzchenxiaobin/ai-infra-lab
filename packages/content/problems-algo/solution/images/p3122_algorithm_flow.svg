<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：逐列 DP，每列 O(m + 10)</text>

  <!-- start -->
  <rect x="170" y="36" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="15" filter="url(#rough2)"/>
  <text x="260" y="55" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">输入 grid（m×n，值 0..9）</text>

  <path d="M 260 66 L 260 78" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- init dp -->
  <rect x="140" y="80" width="240" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="101" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">dp[0..9] ← 全 0（虚拟第 −1 列）</text>

  <path d="M 260 114 L 260 126" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- j init -->
  <rect x="140" y="128" width="240" height="30" fill="#ffffff" stroke="#999" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="147" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">j ← 0</text>

  <path d="M 260 158 L 260 170" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- scan column -->
  <rect x="110" y="172" width="300" height="34" fill="#ffffff" stroke="#666" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="193" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">扫描第 j 列：cnt[grid[i][j]]++（i = 0..m−1）</text>

  <path d="M 260 206 L 260 218" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- min1/min2 -->
  <rect x="110" y="220" width="300" height="34" fill="#ffffff" stroke="#666" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="241" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">一趟扫描求当前 dp 的最小 m1、次小 m2</text>

  <path d="M 260 254 L 260 266" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- update -->
  <rect x="100" y="268" width="320" height="36" fill="#ffffff" stroke="#666" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="290" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">dp[v] ← m − cnt[v] + (dp[v]==m1 ? m2 : m1)，v=0..9</text>

  <path d="M 260 304 L 260 314" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="260,316 344,348 260,380 176,348" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="352" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">j 到 n−1 了？</text>

  <!-- yes branch -->
  <path d="M 176 348 L 150 348" fill="none" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="163" y="340" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="30" y="330" width="118" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="89" y="352" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 = min dp[v]</text>

  <!-- no branch: loop back -->
  <path d="M 344 348 L 452 348 L 452 189 L 414 189" fill="none" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="456" y="270" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <text x="456" y="288" font-size="10.5" fill="#b85450" filter="url(#rough2)">j←j+1</text>
</svg>
