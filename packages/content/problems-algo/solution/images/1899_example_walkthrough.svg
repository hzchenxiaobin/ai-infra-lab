<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：过滤越界 + 逐维取 max</text>
  <text x="290" y="42" text-anchor="middle" font-size="10.5" fill="#888">例 1（true）与例 3（false）对照</text>

  <!-- ===== Example 1 ===== -->
  <text x="40" y="68" font-size="11.5" fill="#446688" font-weight="bold">例 1：triplets = [[2,5,3],[1,8,4],[1,7,5]], target = [2, 7, 5]</text>

  <!-- Table header -->
  <text x="40" y="92" font-size="10" fill="#666">步骤</text>
  <text x="92" y="92" font-size="10" fill="#666">三元组 t</text>
  <text x="190" y="92" font-size="10" fill="#666">是否越界</text>
  <text x="300" y="92" font-size="10" fill="#666">操作</text>
  <text x="440" y="92" font-size="10" fill="#666">res（累积 max）</text>

  <path d="M 28 100 L 556 100" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- Step 0: init -->
  <rect x="28" y="106" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="48" y="123" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">0</text>
  <text x="92" y="123" font-size="10" fill="#888">—</text>
  <text x="190" y="123" font-size="10" fill="#888">—</text>
  <text x="300" y="123" font-size="10" fill="#555">初始化</text>
  <text x="440" y="123" font-size="10.5" fill="#446688" font-weight="bold">[0, 0, 0]</text>

  <!-- Step 1: [2,5,3] usable -->
  <rect x="28" y="136" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="48" y="153" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">1</text>
  <text x="92" y="153" font-size="10" fill="#333">[2, 5, 3]</text>
  <text x="190" y="153" font-size="10" fill="#4a7a3a" font-weight="bold">否 ✓</text>
  <text x="300" y="153" font-size="10" fill="#555">并入，取 max</text>
  <text x="440" y="153" font-size="10.5" fill="#4a7a3a" font-weight="bold">[2, 5, 3]</text>

  <!-- Step 2: [1,8,4] overshoots -->
  <rect x="28" y="166" width="40" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="48" y="183" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">2</text>
  <text x="92" y="183" font-size="10" fill="#888">[1, 8, 4]</text>
  <text x="190" y="183" font-size="10" fill="#b85450" font-weight="bold">是 ✗ (8&gt;7)</text>
  <text x="300" y="183" font-size="10" fill="#b85450">跳过</text>
  <text x="440" y="183" font-size="10.5" fill="#4a7a3a" font-weight="bold">[2, 5, 3]</text>

  <!-- Step 3: [1,7,5] usable -->
  <rect x="28" y="196" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="48" y="213" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">3</text>
  <text x="92" y="213" font-size="10" fill="#333">[1, 7, 5]</text>
  <text x="190" y="213" font-size="10" fill="#4a7a3a" font-weight="bold">否 ✓</text>
  <text x="300" y="213" font-size="10" fill="#555">并入，取 max</text>
  <text x="440" y="213" font-size="10.5" fill="#4a7a3a" font-weight="bold">[2, 7, 5]</text>

  <!-- Step 4: compare -->
  <rect x="28" y="228" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="48" y="245" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">4</text>
  <text x="92" y="245" font-size="10" fill="#888">—</text>
  <text x="190" y="245" font-size="10" fill="#888">—</text>
  <text x="300" y="245" font-size="10" fill="#555">比对 target</text>
  <text x="440" y="245" font-size="10.5" fill="#4a7a3a" font-weight="bold">[2,7,5]==[2,7,5] ✓</text>

  <!-- Result 1 -->
  <rect x="60" y="260" width="360" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="240" y="279" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">res == target → return true</text>

  <!-- Divider -->
  <path d="M 28 300 L 556 300" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ===== Example 3 ===== -->
  <text x="40" y="322" font-size="11.5" fill="#b85450" font-weight="bold">例 3：triplets = [[2,5,3],[2,3,4],[1,2,5]], target = [5, 5, 5]</text>

  <!-- Compact table for example 3 -->
  <text x="40" y="344" font-size="10" fill="#666">三元组</text>
  <text x="140" y="344" font-size="10" fill="#666">越界?</text>
  <text x="220" y="344" font-size="10" fill="#666">并入后 res</text>
  <text x="380" y="344" font-size="10" fill="#666">说明</text>
  <path d="M 28 350 L 556 350" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- t1: [2,5,3] -->
  <text x="40" y="368" font-size="10" fill="#333">[2, 5, 3]</text>
  <text x="140" y="368" font-size="10" fill="#4a7a3a" font-weight="bold">否 ✓</text>
  <text x="220" y="368" font-size="10" fill="#4a7a3a" font-weight="bold">[2, 5, 3]</text>
  <text x="380" y="368" font-size="9.5" fill="#888">全部 ≤ 5</text>

  <!-- t2: [2,3,4] -->
  <text x="40" y="384" font-size="10" fill="#333">[2, 3, 4]</text>
  <text x="140" y="384" font-size="10" fill="#4a7a3a" font-weight="bold">否 ✓</text>
  <text x="220" y="384" font-size="10" fill="#4a7a3a" font-weight="bold">[2, 5, 4]</text>
  <text x="380" y="384" font-size="9.5" fill="#888">max(3,5)=5, max(3,4)=4</text>

  <!-- t3: [1,2,5] -->
  <text x="40" y="400" font-size="10" fill="#333">[1, 2, 5]</text>
  <text x="140" y="400" font-size="10" fill="#4a7a3a" font-weight="bold">否 ✓</text>
  <text x="220" y="400" font-size="10" fill="#b85450" font-weight="bold">[2, 5, 5]</text>
  <text x="380" y="400" font-size="9.5" fill="#b85450">第1维 max=2 &lt; 5 ✗</text>

  <!-- Result 3 -->
  <rect x="60" y="412" width="380" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="250" y="429" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">res = [2,5,5] ≠ [5,5,5]（第1维无法到5）→ false</text>
</svg>
