<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：两张 26 位「出勤表」，交集大小即答案</text>

  <text x="60" y="52" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">word = "aaAbcBC"</text>

  <!-- word boxes -->
  <rect x="90" y="60" width="44" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="112" y="90" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>

  <rect x="142" y="60" width="44" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="164" y="90" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>

  <rect x="194" y="60" width="44" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="216" y="90" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold" filter="url(#rough2)">A</text>

  <rect x="246" y="60" width="44" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="268" y="90" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold" filter="url(#rough2)">b</text>

  <rect x="298" y="60" width="44" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="320" y="90" text-anchor="middle" font-size="18" fill="#446688" font-weight="bold" filter="url(#rough2)">c</text>

  <rect x="350" y="60" width="44" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="372" y="90" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold" filter="url(#rough2)">B</text>

  <rect x="402" y="60" width="44" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="424" y="90" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold" filter="url(#rough2)">C</text>

  <!-- arrows word -> masks -->
  <path d="M 150 106 L 138 132" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="96" y="126" font-size="10.5" fill="#446688" filter="url(#rough2)">小写 → lower</text>

  <path d="M 386 106 L 398 132" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="404" y="126" font-size="10.5" fill="#d6a040" filter="url(#rough2)">大写 → upper</text>

  <!-- lower mask row -->
  <text x="66" y="160" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">lower</text>
  <rect x="110" y="140" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="125" y="160" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="144" y="140" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="159" y="160" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="178" y="140" width="30" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="193" y="160" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="212" y="140" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3 3" rx="4" filter="url(#rough2)"/>
  <text x="227" y="160" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">d</text>
  <rect x="246" y="140" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3 3" rx="4" filter="url(#rough2)"/>
  <text x="261" y="160" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">e</text>
  <rect x="280" y="140" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3 3" rx="4" filter="url(#rough2)"/>
  <text x="295" y="160" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">f</text>
  <rect x="314" y="140" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3 3" rx="4" filter="url(#rough2)"/>
  <text x="329" y="160" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">g</text>
  <text x="356" y="160" font-size="13" fill="#999" filter="url(#rough2)">⋯ z</text>
  <text x="392" y="160" font-size="10.5" fill="#888" filter="url(#rough2)">= 0b111</text>

  <!-- upper mask row -->
  <text x="66" y="204" font-size="12.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">upper</text>
  <rect x="110" y="184" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="125" y="204" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">A</text>
  <rect x="144" y="184" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="159" y="204" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">B</text>
  <rect x="178" y="184" width="30" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="193" y="204" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">C</text>
  <rect x="212" y="184" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3 3" rx="4" filter="url(#rough2)"/>
  <text x="227" y="204" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">D</text>
  <rect x="246" y="184" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3 3" rx="4" filter="url(#rough2)"/>
  <text x="261" y="204" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">E</text>
  <rect x="280" y="184" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3 3" rx="4" filter="url(#rough2)"/>
  <text x="295" y="204" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">F</text>
  <rect x="314" y="184" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3 3" rx="4" filter="url(#rough2)"/>
  <text x="329" y="204" text-anchor="middle" font-size="13" fill="#bbb" filter="url(#rough2)">G</text>
  <text x="356" y="204" font-size="13" fill="#999" filter="url(#rough2)">⋯ Z</text>
  <text x="392" y="204" font-size="10.5" fill="#888" filter="url(#rough2)">= 0b111</text>

  <!-- AND pill between rows, right side -->
  <rect x="420" y="168" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="13" filter="url(#rough2)"/>
  <text x="442" y="186" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">&amp;</text>

  <path d="M 260 214 L 260 236" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="106" y="240" width="308" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="262" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">两表同时点名：{ a, b, c } → ans = 3</text>

  <rect x="60" y="288" width="400" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="309" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">ans = popcount(lower &amp; upper)（按位与 = 集合交集）</text>

  <rect x="60" y="330" width="400" height="32" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="351" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">'a'−'a' = 'A'−'A' = 0：同一字母在两表中下标天然对齐</text>

  <rect x="48" y="370" width="424" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="388" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">lower / upper 只是两个 int（26 位）—— 顺序无关，只记「来没来过」</text>
</svg>
