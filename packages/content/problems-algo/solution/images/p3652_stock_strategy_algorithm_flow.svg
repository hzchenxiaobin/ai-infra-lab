<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：前缀和 + 枚举定长窗口</text>

  <rect x="130" y="42" width="280" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="16" filter="url(#rough2)"/>
  <text x="270" y="60" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">① base = Σ strategy[i]·prices[i]</text>
  <text x="270" y="78" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">② 建前缀和 A（s·p）与 B（p）</text>

  <path d="M 270 86 L 270 100" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="102" width="280" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="124" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">③ ans = base（不修改的保底）</text>

  <path d="M 270 136 L 270 150" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="152" width="280" height="58" fill="#ffffff" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="172" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">④ 枚举窗口 [l, l+k)：</text>
  <text x="270" y="190" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">old = A[l+k] − A[l]</text>
  <text x="270" y="206" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">cur = B[l+k] − B[l+k/2]</text>

  <path d="M 270 210 L 270 224" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="130" y="226" width="280" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="250" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">⑤ ans = max(ans, base − old + cur)</text>

  <path d="M 270 264 L 270 278" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="270,280 376,314 270,348 164,314" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="318" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">l + k &lt; n ?</text>

  <text x="388" y="306" text-anchor="start" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <text x="284" y="358" text-anchor="start" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <path d="M 376 314 L 452 314 L 452 181 L 414 181" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <text x="433" y="168" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">l ← l + 1，回到 ④</text>

  <path d="M 270 348 L 270 362" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrr)" filter="url(#rough2)"/>

  <rect x="170" y="364" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="16" filter="url(#rough2)"/>
  <text x="270" y="384" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans ✓</text>
</svg>
