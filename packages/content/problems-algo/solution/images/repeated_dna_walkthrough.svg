<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="480" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：s = "AAAAACCCCCAAAAACCCCCC…"</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#888">关键步骤：首次出现记入 → 第二次出现收答案（省略中间步用 ⋯ 表示）</text>

  <!-- ===== 表头 ===== -->
  <g font-size="11" fill="#444" font-weight="bold">
    <rect x="20" y="58" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="45" y="76" text-anchor="middle">i</text>
    <rect x="70" y="58" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="90" y="76" text-anchor="middle">s[i]</text>
    <rect x="110" y="58" width="160" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="190" y="76" text-anchor="middle">窗口 s[i−9..i]</text>
    <rect x="270" y="58" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="310" y="76" text-anchor="middle">hash</text>
    <rect x="350" y="58" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="405" y="76" text-anchor="middle">cnt[hash]</text>
    <rect x="460" y="58" width="140" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
    <text x="530" y="76" text-anchor="middle">动作</text>
  </g>

  <!-- ===== Row 1: i=9 首次出现 ===== -->
  <g font-size="11">
    <rect x="20" y="88" width="580" height="32" fill="#fff" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="45" y="108" text-anchor="middle" fill="#446688" font-weight="bold">9</text>
    <text x="90" y="108" text-anchor="middle" fill="#4a7a3a" font-weight="bold">C</text>
    <text x="190" y="108" text-anchor="middle" fill="#444" font-family="monospace">AAAAACCCCC</text>
    <text x="310" y="108" text-anchor="middle" fill="#446688" font-weight="bold" font-family="monospace">341</text>
    <text x="405" y="108" text-anchor="middle" fill="#444">0 → 1</text>
    <text x="530" y="108" text-anchor="middle" fill="#888">首次出现，记入</text>
  </g>

  <!-- ===== Row 2: i=10 ===== -->
  <g font-size="11">
    <rect x="20" y="122" width="580" height="32" fill="#fff" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="45" y="142" text-anchor="middle" fill="#446688" font-weight="bold">10</text>
    <text x="90" y="142" text-anchor="middle" fill="#446688" font-weight="bold">A</text>
    <text x="190" y="142" text-anchor="middle" fill="#444" font-family="monospace">AAAACCCCCA</text>
    <text x="310" y="142" text-anchor="middle" fill="#446688" font-weight="bold" font-family="monospace">1364</text>
    <text x="405" y="142" text-anchor="middle" fill="#444">0 → 1</text>
    <text x="530" y="142" text-anchor="middle" fill="#888">新哈希，记入</text>
  </g>

  <!-- ===== Row 3: i=14 首次 ===== -->
  <g font-size="11">
    <rect x="20" y="156" width="580" height="32" fill="#fff" stroke="#ddd" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="45" y="176" text-anchor="middle" fill="#446688" font-weight="bold">14</text>
    <text x="90" y="176" text-anchor="middle" fill="#446688" font-weight="bold">A</text>
    <text x="190" y="176" text-anchor="middle" fill="#444" font-family="monospace">CCCCCAAAAA</text>
    <text x="310" y="176" text-anchor="middle" fill="#d6a040" font-weight="bold" font-family="monospace">349184</text>
    <text x="405" y="176" text-anchor="middle" fill="#444">0 → 1</text>
    <text x="530" y="176" text-anchor="middle" fill="#888">首次出现，记入</text>
  </g>

  <!-- ===== 省略行 ===== -->
  <text x="310" y="206" text-anchor="middle" font-size="12" fill="#aaa">⋯ 中间步逐位滚动，哈希随窗口变化 ⋯</text>

  <!-- ===== Row 4: i=19 ★重复 ===== -->
  <g font-size="11">
    <rect x="20" y="218" width="580" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="45" y="240" text-anchor="middle" fill="#b85450" font-weight="bold">19</text>
    <text x="90" y="240" text-anchor="middle" fill="#4a7a3a" font-weight="bold">C</text>
    <text x="190" y="240" text-anchor="middle" fill="#b85450" font-weight="bold" font-family="monospace">AAAAACCCCC</text>
    <text x="310" y="240" text-anchor="middle" fill="#b85450" font-weight="bold" font-family="monospace">341</text>
    <text x="405" y="240" text-anchor="middle" fill="#b85450" font-weight="bold">1 → 2</text>
    <text x="530" y="240" text-anchor="middle" fill="#b85450" font-weight="bold">★ 重复！收答案</text>
  </g>
  <text x="300" y="266" text-anchor="middle" font-size="10" fill="#b85450">hash=341 与 i=9 相同 → s[10..19]="AAAAACCCCC" 是重复序列</text>

  <!-- 省略行 -->
  <text x="310" y="288" text-anchor="middle" font-size="12" fill="#aaa">⋯ 继续滚动 ⋯</text>

  <!-- ===== Row 5: i=25 ★重复 ===== -->
  <g font-size="11">
    <rect x="20" y="300" width="580" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="45" y="322" text-anchor="middle" fill="#b85450" font-weight="bold">25</text>
    <text x="90" y="322" text-anchor="middle" fill="#446688" font-weight="bold">A</text>
    <text x="190" y="322" text-anchor="middle" fill="#b85450" font-weight="bold" font-family="monospace">CCCCCAAAAA</text>
    <text x="310" y="322" text-anchor="middle" fill="#b85450" font-weight="bold" font-family="monospace">349184</text>
    <text x="405" y="322" text-anchor="middle" fill="#b85450" font-weight="bold">1 → 2</text>
    <text x="530" y="322" text-anchor="middle" fill="#b85450" font-weight="bold">★ 重复！收答案</text>
  </g>
  <text x="300" y="348" text-anchor="middle" font-size="10" fill="#b85450">hash=349184 与 i=14 相同 → s[16..25]="CCCCCAAAAA" 是重复序列</text>

  <!-- ===== 结果框 ===== -->
  <rect x="20" y="370" width="580" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="392" font-size="12" fill="#3a5a2a" font-weight="bold">最终答案：</text>
  <text x="40" y="410" font-size="12" fill="#3a5a2a" font-family="monospace">["AAAAACCCCC", "CCCCCAAAAA"]</text>
  <text x="380" y="392" font-size="10" fill="#888">每个重复序列只在 cnt 1→2 时收一次</text>
  <text x="380" y="408" font-size="10" fill="#888">cnt ≥ 3 时跳过 → 天然去重</text>

  <!-- ===== 底部说明 ===== -->
  <rect x="20" y="430" width="580" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="310" y="454" text-anchor="middle" font-size="10.5" fill="#555">关键不变量：相同 10-mer → 相同 20 位哈希（双射，无哈希冲突）；cnt==2 触发收答案，&gt;2 跳过</text>
</svg>
