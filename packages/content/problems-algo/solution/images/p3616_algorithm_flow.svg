<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：一遍扫描，两个变量搞定</text>
  <text x="494" y="46" text-anchor="end" font-size="10" fill="#666" filter="url(#rough2)">O(n) 时间 / O(1) 空间</text>

  <!-- 开始 -->
  <rect x="150" y="38" width="120" height="28" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="210" y="57" text-anchor="middle" font-size="12" fill="#2a4a20" filter="url(#rough2)">开始</text>
  <path d="M 210 66 L 210 80" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="130" y="82" width="160" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="210" y="103" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">cur = ranks[0]，ans = 0</text>
  <path d="M 210 114 L 210 136" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形1：i ≤ n-1 ? -->
  <polygon points="210,138 278,172 210,206 142,172" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="176" text-anchor="middle" font-size="11" fill="#7a5a10" filter="url(#rough2)">i ≤ n−1 ?</text>

  <!-- 菱形1 是 → 菱形2 -->
  <path d="M 210 206 L 210 230" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="219" y="222" font-size="11" fill="#446688" filter="url(#rough2)">是</text>

  <!-- 菱形2：ranks[i] < cur ? -->
  <polygon points="210,232 285,264 210,296 135,264" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="268" text-anchor="middle" font-size="10.5" fill="#7a5a10" filter="url(#rough2)">ranks[i] &lt; cur ?</text>

  <!-- 菱形2 是 → 更新 -->
  <path d="M 210 296 L 210 310" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="219" y="307" font-size="10" fill="#b07818" filter="url(#rough2)">是（严格更小）</text>

  <!-- 更新框 -->
  <rect x="125" y="312" width="170" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="332" text-anchor="middle" font-size="11.5" fill="#7a3030" filter="url(#rough2)">cur = ranks[i]；ans += 1</text>

  <!-- 更新框 → i++ -->
  <path d="M 125 328 L 50 328 L 50 192" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- 菱形2 否 → i++ -->
  <path d="M 135 264 L 80 264 L 80 192" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="126" y="256" text-anchor="end" font-size="11" fill="#999" filter="url(#rough2)">否</text>

  <!-- i++ 框 -->
  <rect x="30" y="158" width="70" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="65" y="178" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">i++</text>

  <!-- i++ → 菱形1 -->
  <path d="M 100 172 L 138 172" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形1 否 → 返回 -->
  <path d="M 278 172 L 341 172" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="304" y="164" font-size="11" fill="#999" filter="url(#rough2)">否</text>

  <!-- 返回框 -->
  <rect x="345" y="156" width="130" height="32" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="410" y="176" text-anchor="middle" font-size="12" fill="#2a4a20" filter="url(#rough2)">返回 ans</text>

  <!-- 坑提示 -->
  <rect x="330" y="300" width="164" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="412" y="317" text-anchor="middle" font-size="10" fill="#7a5a10" filter="url(#rough2)">⚠️ 比较对象是 cur</text>
  <text x="412" y="331" text-anchor="middle" font-size="10" fill="#7a5a10" filter="url(#rough2)">而非 ranks[i−1]：</text>
  <text x="412" y="345" text-anchor="middle" font-size="10" fill="#7a5a10" filter="url(#rough2)">[2,5,4] 答案是 0 不是 1</text>
</svg>
