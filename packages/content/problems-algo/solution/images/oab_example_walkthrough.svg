<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：we will we will rock you</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">first = "we", second = "will"　words = [we, will, we, will, rock, you]</text>

  <!-- Header row -->
  <rect x="32" y="58" width="48" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="56" y="75" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">i</text>
  <rect x="84" y="58" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="144" y="75" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">words[i], words[i+1]</text>
  <rect x="206" y="58" width="70" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="241" y="75" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">匹配?</text>
  <rect x="278" y="58" width="80" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="318" y="75" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">third</text>
  <rect x="360" y="58" width="150" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="435" y="75" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">说明</text>

  <!-- Row i=0 -->
  <rect x="32" y="86" width="48" height="40" fill="#fff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="56" y="111" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="84" y="86" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="144" y="111" text-anchor="middle" font-size="11" fill="#333">we, will</text>
  <rect x="206" y="86" width="70" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="241" y="111" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="278" y="86" width="80" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="318" y="111" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">"we"</text>
  <rect x="360" y="86" width="150" height="40" fill="#fff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="365" y="104" font-size="10" fill="#555">we==first</text>
  <text x="365" y="118" font-size="10" fill="#555">will==second</text>

  <!-- Row i=1 -->
  <rect x="32" y="130" width="48" height="40" fill="#fff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="56" y="155" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <rect x="84" y="130" width="120" height="40" fill="#fff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="144" y="155" text-anchor="middle" font-size="11" fill="#333">will, we</text>
  <rect x="206" y="130" width="70" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="241" y="155" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <rect x="278" y="130" width="80" height="40" fill="#fff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="318" y="155" text-anchor="middle" font-size="11" fill="#888">—</text>
  <rect x="360" y="130" width="150" height="40" fill="#fff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="365" y="155" font-size="10" fill="#888">will ≠ first</text>

  <!-- Row i=2 -->
  <rect x="32" y="174" width="48" height="40" fill="#fff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="56" y="199" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <rect x="84" y="174" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="144" y="199" text-anchor="middle" font-size="11" fill="#333">we, will</text>
  <rect x="206" y="174" width="70" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="241" y="199" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="278" y="174" width="80" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="318" y="199" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">"rock"</text>
  <rect x="360" y="174" width="150" height="40" fill="#fff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="365" y="192" font-size="10" fill="#555">we==first</text>
  <text x="365" y="206" font-size="10" fill="#555">will==second</text>

  <!-- Row i=3 -->
  <rect x="32" y="218" width="48" height="40" fill="#fff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="56" y="243" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="84" y="218" width="120" height="40" fill="#fff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="144" y="243" text-anchor="middle" font-size="11" fill="#333">will, rock</text>
  <rect x="206" y="218" width="70" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="241" y="243" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <rect x="278" y="218" width="80" height="40" fill="#fff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="318" y="243" text-anchor="middle" font-size="11" fill="#888">—</text>
  <rect x="360" y="218" width="150" height="40" fill="#fff" stroke="#888" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="365" y="243" font-size="10" fill="#888">will ≠ first</text>

  <!-- Loop bound note -->
  <text x="280" y="280" text-anchor="middle" font-size="11" fill="#888">i 上界 = len(words) − 3 = 3（保证 words[i+2] 不越界）</text>

  <!-- Result box -->
  <rect x="120" y="296" width="320" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="313" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">ans 收集结果</text>
  <text x="280" y="330" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">["we", "rock"]</text>

  <!-- overlap note -->
  <rect x="80" y="346" width="400" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="363" text-anchor="middle" font-size="11" fill="#555">⚠ 两次命中共用下标 2（i=0 的 third = i=2 的 first），匹配允许重叠</text>
</svg>
