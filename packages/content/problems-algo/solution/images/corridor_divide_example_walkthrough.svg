<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：SSPPSPS 的座位配对与缝隙计数</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">seats = [0,1,4,6]  →  m=4(偶)  →  ans = ∏缝隙数</text>

  <!-- ===== Example 1: SSPPSPS ===== -->
  <text x="40" y="74" font-size="12.5" fill="#446688" font-weight="bold">示例 1：corridor = "SSPPSPS"  →  ans = 3</text>

  <!-- Table header -->
  <g font-size="10" fill="#666">
    <rect x="40"  y="82" width="50"  height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="65"  y="97" text-anchor="middle" font-weight="bold">步骤</text>
    <rect x="90"  y="82" width="110" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="145" y="97" text-anchor="middle" font-weight="bold">操作</text>
    <rect x="200" y="82" width="140" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="270" y="97" text-anchor="middle" font-weight="bold">细节</text>
    <rect x="340" y="82" width="80"  height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="380" y="97" text-anchor="middle" font-weight="bold">ans</text>
    <rect x="420" y="82" width="100" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="470" y="97" text-anchor="middle" font-weight="bold">说明</text>
  </g>

  <g font-size="11">
    <!-- Step: collect seats -->
    <rect x="40"  y="106" width="50"  height="28" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="65"  y="124" text-anchor="middle" fill="#446688" font-weight="bold">收集</text>
    <rect x="90"  y="106" width="110" height="28" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="145" y="124" text-anchor="middle" fill="#446688">扫描 'S'</text>
    <rect x="200" y="106" width="140" height="28" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="270" y="124" text-anchor="middle" fill="#446688" font-weight="bold">seats=[0,1,4,6]</text>
    <rect x="340" y="106" width="80"  height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="380" y="124" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <rect x="420" y="106" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="470" y="124" text-anchor="middle" fill="#4a7a3a">m=4, 偶数 ✓</text>

    <!-- Step: check -->
    <rect x="40"  y="136" width="50"  height="28" fill="#fff8e1" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="65"  y="154" text-anchor="middle" fill="#d6a040" font-weight="bold">检查</text>
    <rect x="90"  y="136" width="110" height="28" fill="#fff8e1" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="145" y="154" text-anchor="middle" fill="#d6a040">m%2==0?</text>
    <rect x="200" y="136" width="140" height="28" fill="#fff8e1" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="270" y="154" text-anchor="middle" fill="#d6a040">4 % 2 == 0</text>
    <rect x="340" y="136" width="80"  height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="380" y="154" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <rect x="420" y="136" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="470" y="154" text-anchor="middle" fill="#4a7a3a">继续</text>

    <!-- Step: k=2 -->
    <rect x="40"  y="166" width="50"  height="28" fill="#e6f4ea" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="65"  y="184" text-anchor="middle" fill="#4a7a3a" font-weight="bold">k=2</text>
    <rect x="90"  y="166" width="110" height="28" fill="#e6f4ea" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="145" y="184" text-anchor="middle" fill="#4a7a3a" font-weight="bold">× 缝隙数</text>
    <rect x="200" y="166" width="140" height="28" fill="#e6f4ea" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="270" y="184" text-anchor="middle" fill="#4a7a3a" font-weight="bold">seats[2]−seats[1]</text>
    <rect x="340" y="166" width="80"  height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="380" y="184" text-anchor="middle" fill="#d6a040" font-weight="bold">1×3=3</text>
    <rect x="420" y="166" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="470" y="184" text-anchor="middle" fill="#4a7a3a">4−1=3</text>

    <!-- Step: done -->
    <rect x="40"  y="196" width="50"  height="28" fill="#fce4ec" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="65"  y="214" text-anchor="middle" fill="#b85450" font-weight="bold">返回</text>
    <rect x="90"  y="196" width="110" height="28" fill="#fce4ec" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="145" y="214" text-anchor="middle" fill="#b85450">循环结束</text>
    <rect x="200" y="196" width="140" height="28" fill="#fce4ec" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="270" y="214" text-anchor="middle" fill="#b85450">k=4 ≥ m=4, 停</text>
    <rect x="340" y="196" width="80"  height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
    <text x="380" y="214" text-anchor="middle" fill="#b85450" font-weight="bold">3 ✓</text>
    <rect x="420" y="196" width="100" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="470" y="214" text-anchor="middle" fill="#4a7a3a">ans=3</text>
  </g>

  <rect x="40" y="230" width="480" height="22" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="50" y="246" font-size="10" fill="#555">最终 ans = 1 × 3 = 3 ✓ （只有 1 个组间缝隙，3 种屏风位置）</text>

  <!-- ===== Example 2: PPSPSP ===== -->
  <text x="40" y="280" font-size="12.5" fill="#446688" font-weight="bold">示例 2：corridor = "PPSPSP"  →  ans = 1</text>

  <g font-size="11">
    <rect x="40"  y="288" width="50"  height="24" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="65"  y="304" text-anchor="middle" fill="#446688" font-weight="bold">收集</text>
    <rect x="90"  y="288" width="110" height="24" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="145" y="304" text-anchor="middle" fill="#446688">扫描 'S'</text>
    <rect x="200" y="288" width="140" height="24" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="270" y="304" text-anchor="middle" fill="#446688" font-weight="bold">seats=[2,4]</text>
    <rect x="340" y="288" width="80"  height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="380" y="304" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <rect x="420" y="288" width="100" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="470" y="304" text-anchor="middle" fill="#4a7a3a">m=2, 偶数 ✓</text>

    <rect x="40"  y="314" width="50"  height="24" fill="#fce4ec" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="65"  y="330" text-anchor="middle" fill="#b85450" font-weight="bold">返回</text>
    <rect x="90"  y="314" width="110" height="24" fill="#fce4ec" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="145" y="330" text-anchor="middle" fill="#b85450">循环不执行</text>
    <rect x="200" y="314" width="140" height="24" fill="#fce4ec" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="270" y="330" text-anchor="middle" fill="#b85450">range(2,2,2)=空</text>
    <rect x="340" y="314" width="80"  height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
    <text x="380" y="330" text-anchor="middle" fill="#b85450" font-weight="bold">1 ✓</text>
    <rect x="420" y="314" width="100" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="470" y="330" text-anchor="middle" fill="#4a7a3a">空积=1</text>
  </g>

  <rect x="40" y="342" width="480" height="22" fill="#f6f6f6" stroke="#ccc" stroke-width="0.8" rx="4" filter="url(#rough2)"/>
  <text x="50" y="358" font-size="10" fill="#555">m=2 → 只有 1 组，无组间缝隙 → 空积 = 1（不放置任何额外屏风）✓</text>

  <!-- ===== Example 3: S ===== -->
  <text x="40" y="392" font-size="12.5" fill="#446688" font-weight="bold">示例 3：corridor = "S"  →  ans = 0</text>

  <g font-size="11">
    <rect x="40"  y="400" width="50"  height="24" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="65"  y="416" text-anchor="middle" fill="#446688" font-weight="bold">收集</text>
    <rect x="90"  y="400" width="110" height="24" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="145" y="416" text-anchor="middle" fill="#446688">扫描 'S'</text>
    <rect x="200" y="400" width="140" height="24" fill="#e8f0fe" stroke="#bbb" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
    <text x="270" y="416" text-anchor="middle" fill="#446688" font-weight="bold">seats=[0]</text>
    <rect x="340" y="400" width="80"  height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
    <text x="380" y="416" text-anchor="middle" fill="#b85450" font-weight="bold">0 ✗</text>
    <rect x="420" y="400" width="100" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="470" y="416" text-anchor="middle" fill="#b85450">m=1, 奇数</text>
  </g>

  <rect x="40" y="428" width="480" height="10" fill="transparent"/>
</svg>
