<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：BFS 逐层求和，滚动比较找最小</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">每层只累加一个 sum 标量 → 边走边比，无需存下所有层的和</text>

  <!-- ===== Tree ===== -->
  <text x="30" y="72" font-size="11" fill="#446688" font-weight="bold">二叉树 [50,6,2,30,80,7]</text>
  <g font-size="11">
    <!-- L1: root 50 -->
    <circle cx="110" cy="92" r="17" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
    <text x="110" y="97" text-anchor="middle" fill="#b85450" font-weight="bold">50</text>
    <!-- L2 -->
    <circle cx="70" cy="150" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="70" y="155" text-anchor="middle" fill="#446688" font-weight="bold">6</text>
    <circle cx="170" cy="150" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="170" y="155" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <line x1="100" y1="104" x2="80" y2="138" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <line x1="120" y1="104" x2="160" y2="138" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <!-- L3: children of 6 and left child of 2 -->
    <circle cx="45" cy="210" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="45" y="215" text-anchor="middle" fill="#4a7a3a" font-weight="bold">30</text>
    <circle cx="95" cy="210" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="95" y="215" text-anchor="middle" fill="#4a7a3a" font-weight="bold">80</text>
    <circle cx="175" cy="210" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="175" y="215" text-anchor="middle" fill="#4a7a3a" font-weight="bold">7</text>
    <line x1="62" y1="162" x2="52" y2="198" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <line x1="80" y1="162" x2="92" y2="198" stroke="#888" stroke-width="1" filter="url(#rough2)"/>
    <line x1="172" y1="165" x2="175" y2="196" stroke="#888" stroke-width="1" filter="url(#rough2)"/>

    <!-- level labels -->
    <text x="14" y="97" font-size="9" fill="#b85450" font-weight="bold">L1</text>
    <text x="14" y="155" font-size="9" fill="#446688" font-weight="bold">L2</text>
    <text x="14" y="215" font-size="9" fill="#4a7a3a" font-weight="bold">L3</text>
  </g>

  <!-- arrows tree -> sum boxes -->
  <path d="M 195 92 L 276 92" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 195 150 L 276 150" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 194 210 L 276 210" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Sum boxes ===== -->
  <text x="351" y="72" font-size="11" fill="#444" font-weight="bold">每层 sum</text>
  <g font-size="10">
    <rect x="282" y="78" width="138" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="292" y="98" fill="#b85450">L1: 50</text>
    <text x="410" y="98" text-anchor="end" fill="#b85450" font-weight="bold">= 50</text>

    <rect x="282" y="136" width="138" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="292" y="156" fill="#446688">L2: 6 + 2</text>
    <text x="410" y="156" text-anchor="end" fill="#446688" font-weight="bold">= 8</text>

    <rect x="282" y="194" width="138" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="292" y="214" fill="#4a7a3a">L3: 30+80+7</text>
    <text x="410" y="214" text-anchor="end" fill="#4a7a3a" font-weight="bold">= 117</text>
  </g>

  <!-- ===== Comparison ===== -->
  <path d="M 351 226 L 351 246" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="40" y="250" width="440" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="60" y="270" font-family="monospace" font-size="11" fill="#d6a040" font-weight="bold">if (sum &lt; minSum) { minSum = sum; ans = level; }</text>
  <text x="60" y="286" font-size="10" fill="#555">L1: 50 &lt; +∞ → min=50, ans=1</text>
  <text x="60" y="300" font-size="10" fill="#555">L2: 8 &lt; 50 → min=8, ans=2  ✅  |  L3: 117 &lt; 8? 否，不动</text>

  <rect x="40" y="324" width="440" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="343" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">最小 sum = 8 → 返回层号 2</text>
  <text x="260" y="360" text-anchor="middle" font-size="9" fill="#888">minSum 初值取 +∞（不能用 0：本例三层和全正，初值 0 会永不更新）；平局用严格 &lt; 保留更小层号</text>
</svg>
