<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：'a' 与 'A' 是同一个键 —— 按键变更只认物理键</text>

  <!-- keyboard keys -->
  <rect x="96" y="52" width="88" height="44" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="6" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="140" y="79" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">⇧ shift</text>
  <rect x="196" y="52" width="100" height="44" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="6" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="246" y="79" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">caps lock</text>
  <rect x="308" y="52" width="58" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="337" y="79" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">A a</text>
  <rect x="378" y="52" width="58" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="407" y="79" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">B b</text>

  <text x="260" y="120" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">灰色虚线键只是修饰键 → 不计数；彩色键才是"物理键"</text>

  <!-- original string row -->
  <text x="260" y="146" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">逐对比较相邻输入（s = "aAbBcC"）</text>

  <rect x="88" y="156" width="44" height="38" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="110" y="180" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="148" y="156" width="44" height="38" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="170" y="180" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">A</text>
  <rect x="208" y="156" width="44" height="38" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="230" y="180" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="268" y="156" width="44" height="38" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="290" y="180" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">B</text>
  <rect x="328" y="156" width="44" height="38" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="350" y="180" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="388" y="156" width="44" height="38" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="410" y="180" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">C</text>

  <text x="140" y="181" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">=</text>
  <text x="200" y="181" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">≠</text>
  <text x="260" y="181" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">=</text>
  <text x="320" y="181" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">≠</text>
  <text x="380" y="181" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">=</text>

  <!-- normalize arrow -->
  <path d="M 260 198 L 260 220" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="272" y="213" font-size="10.5" fill="#446688" filter="url(#rough2)">lower() 归一化</text>

  <!-- normalized row -->
  <rect x="88" y="224" width="44" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="110" y="248" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="148" y="224" width="44" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="170" y="248" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">a</text>
  <rect x="208" y="224" width="44" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="230" y="248" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="268" y="224" width="44" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="290" y="248" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="328" y="224" width="44" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="350" y="248" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="388" y="224" width="44" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="410" y="248" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">c</text>

  <text x="140" y="249" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">=</text>
  <text x="200" y="249" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">≠</text>
  <text x="260" y="249" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">=</text>
  <text x="320" y="249" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">≠</text>
  <text x="380" y="249" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">=</text>

  <!-- summary box -->
  <rect x="48" y="286" width="424" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="309" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">归一化得 "aabbcc"：相邻不同的对恰有 2 处（a→b 与 b→c）→ 答案 2</text>
  <text x="260" y="331" text-anchor="middle" font-size="11.5" fill="#8a6d3b" filter="url(#rough2)">示例 2 "AaAaAaaA" → "aaaaaaaa"，全程同键 → 答案 0</text>
</svg>
