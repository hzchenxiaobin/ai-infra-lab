<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="4.5" refY="8" orient="auto">
      <path d="M0,0 L9,0 L4.5,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：lower_bound 找首个 arr[i] ≥ i</text>

  <!-- start -->
  <rect x="210" y="44" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="270" y="65" text-anchor="middle" font-size="12" fill="#333">lo=0, hi=n−1</text>
  <path d="M 270 78 L 270 94" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- loop cond diamond -->
  <polygon points="270,98 360,148 270,198 180,148" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="144" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">lo &lt; hi ?</text>
  <text x="270" y="160" text-anchor="middle" font-size="10.5" fill="#888">否则收敛</text>

  <!-- no branch -> result -->
  <path d="M 360 148 L 458 148" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="408" y="140" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="410" y="162" width="130" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="475" y="182" text-anchor="middle" font-size="11" fill="#333">lo == hi 收敛</text>
  <text x="475" y="198" text-anchor="middle" font-size="11" fill="#333">arr[lo]==lo ?</text>
  <text x="475" y="214" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">→ lo 或 −1</text>

  <!-- yes branch down -->
  <path d="M 270 198 L 270 216" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="282" y="212" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- mid compute -->
  <rect x="180" y="220" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="242" text-anchor="middle" font-size="12" fill="#333">mid = lo + (hi−lo)/2</text>
  <path d="M 270 254 L 270 272" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- compare diamond -->
  <polygon points="270,276 380,326 270,376 160,326" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="322" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">arr[mid] vs mid</text>
  <text x="270" y="340" text-anchor="middle" font-size="10.5" fill="#888">两种情况</text>

  <!-- arr[mid] < mid -> lo = mid+1 (left) -->
  <path d="M 160 326 L 110 326 L 110 368" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="132" y="318" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">arr[mid]&lt;mid</text>
  <rect x="50" y="372" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="110" y="393" text-anchor="middle" font-size="12" fill="#333">lo = mid + 1</text>

  <!-- arr[mid] >= mid -> hi = mid (right) -->
  <path d="M 380 326 L 440 326 L 440 368" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="418" y="318" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">arr[mid]≥mid</text>
  <rect x="380" y="372" width="120" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="440" y="393" text-anchor="middle" font-size="12" fill="#333">hi = mid</text>

  <!-- loop back arrows -->
  <path d="M 110 404 L 110 440 L 30 440 L 30 148 L 170 148" stroke="#888" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 440 404 L 440 440 L 110 440" stroke="#888" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <text x="58" y="300" font-size="10" fill="#888">回循环</text>
</svg>
