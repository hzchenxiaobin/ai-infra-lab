<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">碰撞反弹 ⟺ 直接穿透：机器人无差别→终点集合相同</text>

  <!-- Number line -->
  <line x1="40" y1="52" x2="480" y2="52" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="48" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="340" y="48" text-anchor="middle" font-size="10" fill="#888">2</text>
  <circle cx="100" cy="52" r="3" fill="#888" filter="url(#rough2)"/>
  <circle cx="340" cy="52" r="3" fill="#888" filter="url(#rough2)"/>

  <!-- Initial robots -->
  <circle cx="100" cy="52" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="100" y="56" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">A</text>
  <path d="M 115 52 L 135 52" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <circle cx="340" cy="52" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="340" y="56" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">B</text>
  <path d="M 325 52 L 305 52" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Two columns -->
  <rect x="30" y="80" width="220" height="250" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)" opacity="0.5"/>
  <rect x="270" y="80" width="220" height="250" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)" opacity="0.5"/>

  <!-- Left column: collide & bounce -->
  <text x="140" y="102" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① 碰撞反弹</text>

  <text x="44" y="124" font-size="10" fill="#555">t=0:  A→0,  B←2</text>
  <text x="44" y="142" font-size="10" fill="#555">t=1:  均到 1,  撞!  反向</text>
  <rect x="44" y="148" width="190" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="139" y="161" text-anchor="middle" font-size="9" fill="#d6a040">A 现在向 ← ,  B 现在向 →</text>

  <text x="44" y="184" font-size="10" fill="#555">t=2:  A 到 0,  B 到 2</text>

  <!-- mini number line for result -->
  <line x1="60" y1="210" x2="220" y2="210" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="100" cy="210" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="100" y="214" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">A</text>
  <circle cx="180" cy="210" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="214" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">B</text>
  <text x="140" y="236" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">终点 = {0, 2}</text>

  <text x="44" y="262" font-size="9" fill="#888">反弹使身份"交换"了方向</text>
  <text x="44" y="276" font-size="9" fill="#888">但位置集合不变</text>

  <!-- Right column: pass through -->
  <text x="380" y="102" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">② 直接穿透</text>

  <text x="284" y="124" font-size="10" fill="#555">t=0:  A→0,  B←2</text>
  <text x="284" y="142" font-size="10" fill="#555">t=1:  交换位置, 不理会</text>
  <rect x="284" y="148" width="190" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="379" y="161" text-anchor="middle" font-size="9" fill="#d6a040">A 继续 → ,  B 继续 ←</text>

  <text x="284" y="184" font-size="10" fill="#555">t=2:  A 到 2,  B 到 0</text>

  <!-- mini number line for result -->
  <line x1="300" y1="210" x2="460" y2="210" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="340" cy="210" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="340" y="214" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">B</text>
  <circle cx="420" cy="210" r="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="420" y="214" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">A</text>
  <text x="380" y="236" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">终点 = {0, 2}</text>

  <text x="284" y="262" font-size="9" fill="#888">身份虽"穿"过去了</text>
  <text x="284" y="276" font-size="9" fill="#888">位置集合完全相同</text>

  <!-- equal sign between columns -->
  <text x="260" y="220" text-anchor="middle" font-size="22" fill="#d6a040" font-weight="bold">=</text>

  <!-- bottom summary -->
  <rect x="20" y="346" width="480" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="363" text-anchor="middle" font-size="11" fill="#333">机器人无差别 ⇒ 只需按原方向走 d 秒，再排序求两两距离之和</text>
</svg>
