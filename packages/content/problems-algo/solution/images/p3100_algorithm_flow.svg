<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：先喝光，再循环「换 − 喝 − 涨阈值」</text>

  <!-- start -->
  <ellipse cx="260" cy="58" rx="58" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="63" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">开始</text>

  <path d="M 260 78 V 96" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 1 -->
  <rect x="130" y="98" width="260" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="118" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">初始 n 瓶满水全部喝光</text>
  <text x="260" y="137" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">drunk = empty = numBottles</text>

  <path d="M 260 148 V 168" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision -->
  <path d="M 260 170 L 360 210 L 260 250 L 160 210 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="206" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">empty ≥</text>
  <text x="260" y="224" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">numExchange ?</text>

  <!-- yes branch -->
  <path d="M 360 210 H 398" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="374" y="200" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- loop body -->
  <rect x="400" y="112" width="106" height="196" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="453" y="136" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">交换并喝掉</text>
  <text x="453" y="160" text-anchor="middle" font-size="10.5" fill="#3a5a2e" filter="url(#rough2)">empty += 1</text>
  <text x="453" y="176" text-anchor="middle" font-size="10.5" fill="#3a5a2e" filter="url(#rough2)">        − x</text>
  <text x="453" y="200" text-anchor="middle" font-size="10.5" fill="#3a5a2e" filter="url(#rough2)">drunk += 1</text>
  <text x="453" y="224" text-anchor="middle" font-size="10.5" fill="#3a5a2e" filter="url(#rough2)">阈值 x → x+1</text>
  <text x="453" y="250" text-anchor="middle" font-size="10" fill="#8a6d3b" font-style="italic" filter="url(#rough2)">(净减 x−1 个</text>
  <text x="453" y="264" text-anchor="middle" font-size="10" fill="#8a6d3b" font-style="italic" filter="url(#rough2)">空瓶，答案+1)</text>

  <!-- loop back -->
  <path d="M 453 112 C 453 86, 260 86, 260 96" stroke="#4a7a3a" stroke-width="1.8" fill="none" stroke-dasharray="6 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="356" y="88" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">回到判断</text>

  <!-- no branch -->
  <path d="M 260 250 V 278" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="278" y="270" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- return -->
  <rect x="160" y="280" width="200" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="298" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 drunk</text>
  <text x="260" y="316" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">= numBottles + 交换次数 k</text>

  <!-- complexity note -->
  <rect x="40" y="344" width="440" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="362" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">第 i 轮净消耗 ≥ i 个空瓶 ⇒ k(k−1)/2 ≤ n ⇒ 至多 O(√n) 轮</text>
  <text x="260" y="380" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">时间 O(√n)，空间 O(1)，n ≤ 100 时 ≤ 15 轮</text>
</svg>
