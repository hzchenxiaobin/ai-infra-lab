<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">扩展：max-Fenwick 把两侧查询降到 O(log M)（2921 必备）</text>

  <!-- 面板一：左扫 -->
  <rect x="30" y="40" width="500" height="104" fill="#ffffff" stroke="#446688" stroke-width="1.5" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① 左扫求 left：正值域，前缀 max 直接查</text>

  <rect x="96" y="72" width="48" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="146" y="72" width="48" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="196" y="72" width="48" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="246" y="72" width="48" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="296" y="72" width="48" height="22" fill="#ffffff" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <rect x="346" y="72" width="48" height="22" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="396" y="72" width="48" height="22" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="446" y="72" width="48" height="22" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="88" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">p=5</text>
  <text x="120" y="110" text-anchor="middle" font-size="9" fill="#999">1</text>
  <text x="170" y="110" text-anchor="middle" font-size="9" fill="#999">2</text>
  <text x="220" y="110" text-anchor="middle" font-size="9" fill="#999">3</text>
  <text x="270" y="110" text-anchor="middle" font-size="9" fill="#999">4</text>
  <text x="320" y="110" text-anchor="middle" font-size="9" fill="#999">5</text>
  <text x="370" y="110" text-anchor="middle" font-size="9" fill="#999">6</text>
  <text x="420" y="110" text-anchor="middle" font-size="9" fill="#999">7</text>
  <text x="470" y="110" text-anchor="middle" font-size="9" fill="#999">8</text>
  <text x="280" y="132" text-anchor="middle" font-size="10" fill="#446688">先 query(p−1)：查「价格 &lt; 5」的前缀 max（蓝格），再 update(p, profits[i]) 把自己挂上去</text>

  <!-- 面板二：右扫 + 翻转 -->
  <rect x="30" y="152" width="500" height="186" fill="#ffffff" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="172" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">② 右扫求 right：要后缀 max？把值域翻转 v′ = M+1−v</text>

  <text x="280" y="190" text-anchor="middle" font-size="10" fill="#555">原值域：需要 (p, M] = (5, 8] 的后缀 max（红格）</text>
  <rect x="96" y="196" width="48" height="22" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="146" y="196" width="48" height="22" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="196" y="196" width="48" height="22" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="246" y="196" width="48" height="22" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="296" y="196" width="48" height="22" fill="#ffffff" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="212" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">p=5</text>
  <rect x="346" y="196" width="48" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="396" y="196" width="48" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="446" y="196" width="48" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="120" y="234" text-anchor="middle" font-size="9" fill="#999">1</text>
  <text x="170" y="234" text-anchor="middle" font-size="9" fill="#999">2</text>
  <text x="220" y="234" text-anchor="middle" font-size="9" fill="#999">3</text>
  <text x="270" y="234" text-anchor="middle" font-size="9" fill="#999">4</text>
  <text x="320" y="234" text-anchor="middle" font-size="9" fill="#999">5</text>
  <text x="370" y="234" text-anchor="middle" font-size="9" fill="#999">6</text>
  <text x="420" y="234" text-anchor="middle" font-size="9" fill="#999">7</text>
  <text x="470" y="234" text-anchor="middle" font-size="9" fill="#999">8</text>

  <path d="M 240 240 C 250 250, 260 250, 268 258" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="370" y="254" text-anchor="middle" font-size="10" fill="#b85450">翻转：v ↦ 9−v（M = 8，镜像）</text>

  <text x="280" y="264" text-anchor="middle" font-size="10" fill="#4a7a3a">翻转后：后缀 (5, 8] 恰好变成前缀 [1, 3]（绿格）</text>
  <rect x="96" y="270" width="48" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="146" y="270" width="48" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="196" y="270" width="48" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="246" y="270" width="48" height="22" fill="#ffffff" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="270" y="286" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">v′=4</text>
  <rect x="296" y="270" width="48" height="22" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="346" y="270" width="48" height="22" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="396" y="270" width="48" height="22" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="446" y="270" width="48" height="22" fill="#ffffff" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="308" text-anchor="middle" font-size="9" fill="#999">1</text>
  <text x="170" y="308" text-anchor="middle" font-size="9" fill="#999">2</text>
  <text x="220" y="308" text-anchor="middle" font-size="9" fill="#999">3</text>
  <text x="270" y="308" text-anchor="middle" font-size="9" fill="#999">4</text>
  <text x="320" y="308" text-anchor="middle" font-size="9" fill="#999">5</text>
  <text x="370" y="308" text-anchor="middle" font-size="9" fill="#999">6</text>
  <text x="420" y="308" text-anchor="middle" font-size="9" fill="#999">7</text>
  <text x="470" y="308" text-anchor="middle" font-size="9" fill="#999">8</text>
  <text x="280" y="328" text-anchor="middle" font-size="10" fill="#555">从右往左扫：先 query(M − p) 查「价格 &gt; p」，再 update(M+1−p, profits[i])</text>

  <!-- 底部要点 -->
  <rect x="30" y="348" width="500" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="368" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">要点：max-Fenwick 只支持「只增不减」的插入与前缀 max 查询</text>
  <text x="280" y="386" text-anchor="middle" font-size="10" fill="#555">本题每个元素只插一次、只查已插入部分，天然满足；M = max(prices) 或离散化到 O(n)</text>
  <text x="280" y="404" text-anchor="middle" font-size="10" fill="#555">2921（n ≤ 5×10⁴）必须 O(n log M)；本题 2907（n ≤ 2000）O(n²) 已足够</text>
</svg>
