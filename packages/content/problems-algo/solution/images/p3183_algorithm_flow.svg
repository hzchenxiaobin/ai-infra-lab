<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：一个完全背包 + 两次手动补项</text>

  <rect x="170" y="40" width="180" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="61" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">开始：输入 n（1 ≤ n ≤ 10⁵）</text>

  <path d="M 260 74 L 260 92" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <rect x="150" y="96" width="220" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="117" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">初始化：f[0] = 1，f[1..n] = 0</text>

  <path d="M 260 130 L 260 148" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <rect x="90" y="152" width="340" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="174" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">对无限硬币 c ∈ {1, 2, 6}：</text>
  <text x="260" y="196" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">正序 j = c … n：f[j] += f[j − c]（mod 10⁹+7）</text>

  <text x="450" y="178" font-size="10" fill="#4a7a3a" filter="url(#rough2)">完全背包：</text>
  <text x="450" y="192" font-size="10" fill="#4a7a3a" filter="url(#rough2)">金额正序 →</text>
  <text x="450" y="206" font-size="10" fill="#4a7a3a" filter="url(#rough2)">硬币可复用</text>

  <path d="M 260 210 L 260 228" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <rect x="130" y="232" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="253" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">ans ← f[n]（0 枚 4 的方案数）</text>

  <path d="M 260 266 L 260 284" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>

  <polygon points="260,288 350,316 260,344 170,316" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="320" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">n ≥ 4 ？</text>

  <path d="M 350 316 L 420 316" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>
  <text x="385" y="308" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">是</text>
  <rect x="424" y="300" width="84" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="466" y="320" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">ans += f[n−4]</text>

  <path d="M 260 344 L 260 356" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="272" y="356" font-size="10" fill="#8a6d3b" filter="url(#rough2)">否</text>

  <polygon points="235,360 320,384 235,408 150,384" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="235" y="388" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">n ≥ 8 ？</text>

  <path d="M 320 384 L 420 384" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>
  <text x="368" y="376" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">是</text>
  <rect x="424" y="368" width="84" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="466" y="388" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">ans += f[n−8]</text>

  <path d="M 150 384 L 96 384" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="128" y="376" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">否</text>

  <rect x="8" y="362" width="88" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="52" y="381" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回</text>
  <text x="52" y="397" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans mod 10⁹+7</text>
</svg>
