<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：状态图 BFS（队列存 (节点, 上一条边颜色)）</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">颜色编码：0=红，1=蓝；nc=1−c 表示下一步必走反色边</text>

  <!-- B1 -->
  <rect x="140" y="58" width="230" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="255" y="80" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① 建红/蓝邻接表 redAdj, blueAdj</text>

  <!-- B2 -->
  <rect x="140" y="104" width="230" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="255" y="124" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">② dist[0][红]=dist[0][蓝]=0</text>
  <text x="255" y="140" text-anchor="middle" font-size="10" fill="#888">队列入 (0,红)、(0,蓝) 两个起点</text>

  <!-- D3 diamond: 队列空? -->
  <polygon points="255,162 325,196 255,230 185,196" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="255" y="200" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">队列空?</text>

  <!-- B7 end (right of D3) -->
  <rect x="370" y="172" width="150" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="445" y="194" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">⑤ answer[i]</text>
  <text x="445" y="210" text-anchor="middle" font-size="9" fill="#4a7a3a">= min(dist[i][红],</text>
  <text x="445" y="220" text-anchor="middle" font-size="9" fill="#4a7a3a">dist[i][蓝]), ∞→−1</text>

  <!-- B4 -->
  <rect x="140" y="246" width="230" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="255" y="268" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">③ 弹出 (u, c)；nc = 1 − c</text>

  <!-- B5 -->
  <rect x="140" y="294" width="230" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="255" y="314" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">④ 取 adj = (nc=红 ? redAdj : blueAdj)</text>
  <text x="255" y="330" text-anchor="middle" font-size="10" fill="#888">遍历 adj[u] 中每个 v</text>

  <!-- B6 -->
  <rect x="140" y="352" width="230" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="255" y="372" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">若 dist[v][nc] = ∞：</text>
  <text x="255" y="388" text-anchor="middle" font-size="10" fill="#888">置 dist[v][nc]=dist[u][c]+1，入队 (v, nc)</text>

  <!-- arrows -->
  <path d="M 255 92 L 255 104" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 255 150 L 255 162" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D3 -> B7 (是) -->
  <path d="M 325 196 L 370 196" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="347" y="188" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- D3 -> B4 (否) -->
  <path d="M 255 230 L 255 246" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="268" y="242" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <path d="M 255 280 L 255 294" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 255 338 L 255 352" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop back: B6 bottom -> down -> left -> up -> D3 left -->
  <path d="M 255 400 L 255 432 L 70 432 L 70 196 L 185 196" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="80" y="320" font-size="10" fill="#4a7a3a" font-weight="bold">回到 ③</text>
  <text x="80" y="336" font-size="9" fill="#888">继续取队首</text>

  <!-- footer -->
  <text x="40" y="458" font-size="10" fill="#888">每个状态 (u,色) 至多入队一次 → 复杂度 O(n + E)，E 为红蓝边总数</text>
</svg>
