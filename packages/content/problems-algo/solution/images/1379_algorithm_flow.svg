<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">同步 DFS 流程：判空 → 判命中 → 递归左 → 递归右</text>

  <rect x="195" y="40" width="150" height="30" rx="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="60" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">dfs(o, c)</text>

  <path d="M 270 70 L 270 86" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <polygon points="270,88 360,116 270,144 180,116" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="120" text-anchor="middle" font-size="11" fill="#444">o == null?</text>

  <path d="M 360 116 L 398 116" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="378" y="110" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>
  <rect x="400" y="100" width="110" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="455" y="120" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return null</text>

  <path d="M 270 144 L 270 160" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="282" y="156" font-size="10" fill="#b85450">否</text>

  <polygon points="270,162 372,196 270,230 168,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="193" text-anchor="middle" font-size="11" fill="#444">o is target?</text>
  <text x="270" y="207" text-anchor="middle" font-size="9" fill="#888">(指针身份，非 .val)</text>

  <path d="M 372 196 L 398 196" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="384" y="190" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>
  <rect x="400" y="180" width="110" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="455" y="200" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return c ✓</text>

  <path d="M 270 230 L 270 246" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="282" y="242" font-size="10" fill="#b85450">否</text>

  <rect x="150" y="248" width="240" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="270" y="268" text-anchor="middle" font-size="11" fill="#333">L = dfs(o.left, c.left)</text>

  <path d="M 270 278 L 270 292" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <polygon points="270,294 360,322 270,350 180,322" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="270" y="326" text-anchor="middle" font-size="11" fill="#444">L != null?</text>

  <path d="M 360 322 L 398 322" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="378" y="316" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>
  <rect x="400" y="306" width="110" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="455" y="326" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return L</text>

  <path d="M 270 350 L 270 366" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="282" y="362" font-size="10" fill="#b85450">否</text>

  <rect x="150" y="368" width="240" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="270" y="388" text-anchor="middle" font-size="11" fill="#333">return dfs(o.right, c.right)</text>

  <text x="270" y="424" text-anchor="middle" font-size="10" fill="#888">命中判定用 is（指针身份），全程不读 .val → 天然满足 follow-up</text>
  <text x="270" y="440" text-anchor="middle" font-size="10" fill="#888">cloned 镜像 original，故 (o.left, c.left) / (o.right, c.right) 永远同位</text>
</svg>
