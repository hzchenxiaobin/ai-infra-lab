<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算：word1 = "abcabc"，word2 = "abc"</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">need：a:1 / b:1 / c:1，初始 less = 3（三种都欠着）</text>

  <!-- 表头 -->
  <rect x="36" y="58" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="76" y="58" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="116" y="58" width="60" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="176" y="58" width="150" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="326" y="58" width="70" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="396" y="58" width="42" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="438" y="58" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="56" y="79" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">right</text>
  <text x="96" y="79" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">入窗</text>
  <text x="146" y="79" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">less</text>
  <text x="251" y="79" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">收缩动作</text>
  <text x="361" y="79" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">收敛窗口</text>
  <text x="417" y="79" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">贡献</text>
  <text x="461" y="79" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">累计</text>

  <!-- 行 0 -->
  <rect x="36" y="92" width="40" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="76" y="92" width="40" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="116" y="92" width="60" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="176" y="92" width="150" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="326" y="92" width="70" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="396" y="92" width="42" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="438" y="92" width="46" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="56" y="113" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="96" y="113" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="146" y="113" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">3→2</text>
  <text x="251" y="113" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">—（还欠着）</text>
  <text x="361" y="113" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">[0,0]「a」</text>
  <text x="417" y="113" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">+0</text>
  <text x="461" y="113" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">0</text>

  <!-- 行 1 -->
  <rect x="36" y="126" width="40" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="76" y="126" width="40" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="116" y="126" width="60" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="176" y="126" width="150" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="326" y="126" width="70" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="396" y="126" width="42" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="438" y="126" width="46" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="56" y="147" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="96" y="147" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="146" y="147" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">2→1</text>
  <text x="251" y="147" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">—（还欠着）</text>
  <text x="361" y="147" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">[0,1]「ab」</text>
  <text x="417" y="147" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">+0</text>
  <text x="461" y="147" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">0</text>

  <!-- 行 2（首次覆盖） -->
  <rect x="36" y="160" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="76" y="160" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="116" y="160" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="176" y="160" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="326" y="160" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="396" y="160" width="42" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="438" y="160" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="56" y="181" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="96" y="181" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="146" y="181" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1→0 ✓</text>
  <text x="251" y="181" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">踢 'a'：less=1，left=1</text>
  <text x="361" y="181" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">[1,2]「bc」</text>
  <text x="417" y="181" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">+1</text>
  <text x="461" y="181" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- 行 3 -->
  <rect x="36" y="194" width="40" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="76" y="194" width="40" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="116" y="194" width="60" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="176" y="194" width="150" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="326" y="194" width="70" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="396" y="194" width="42" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="438" y="194" width="46" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="56" y="215" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="96" y="215" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="146" y="215" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1→0 ✓</text>
  <text x="251" y="215" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">踢 'b'：left=2</text>
  <text x="361" y="215" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">[2,3]「ca」</text>
  <text x="417" y="215" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">+2</text>
  <text x="461" y="215" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3</text>

  <!-- 行 4 -->
  <rect x="36" y="228" width="40" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="76" y="228" width="40" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="116" y="228" width="60" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="176" y="228" width="150" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="326" y="228" width="70" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="396" y="228" width="42" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="438" y="228" width="46" height="34" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="56" y="249" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="96" y="249" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="146" y="249" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1→0 ✓</text>
  <text x="251" y="249" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">踢 'c'：left=3</text>
  <text x="361" y="249" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">[3,4]「ab」</text>
  <text x="417" y="249" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">+3</text>
  <text x="461" y="249" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">6</text>

  <!-- 行 5 -->
  <rect x="36" y="262" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="76" y="262" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="116" y="262" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="176" y="262" width="150" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="326" y="262" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="396" y="262" width="42" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="438" y="262" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="56" y="283" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="96" y="283" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="146" y="283" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1→0 ✓</text>
  <text x="251" y="283" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">踢 'a'：left=4</text>
  <text x="361" y="283" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">[4,5]「bc」</text>
  <text x="417" y="283" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">+4</text>
  <text x="461" y="283" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">10</text>

  <!-- 底部结论 -->
  <rect x="56" y="312" width="408" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="330" text-anchor="middle" font-size="11.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">ans = 0+0+1+2+3+4 = 10 ✓</text>
  <text x="260" y="344" text-anchor="middle" font-size="10.5" fill="#a07830" filter="url(#rough2)">除长度 1、2 的子串外全部合法（贡献 = left，合法起点 0..left−1）</text>

  <text x="260" y="372" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">对照示例 1：word1 = "bcca" 时仅 right=3 才凑齐 need，ans = left = 1 ✓</text>
</svg>
