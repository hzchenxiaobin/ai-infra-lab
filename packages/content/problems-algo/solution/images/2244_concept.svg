<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#666"/>
    </marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：按难度分组 → 每组拆成 2/3 → 轮数 = ⌈c/3⌉</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">同难度任务互相独立；每组只看数量 c，用尽可能多的 3 凑，最少轮数 = ceil(c/3)</text>

  <!-- ===== Left: group by difficulty ===== -->
  <text x="40" y="74" font-size="11.5" fill="#446688" font-weight="bold">① 按难度分组计数</text>

  <text x="40" y="96" font-size="9.5" fill="#888">tasks =</text>
  <rect x="86" y="82" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="106" y="102" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="128" y="82" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="102" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="170" y="82" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="102" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="212" y="82" width="40" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="232" y="102" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="254" y="82" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="274" y="102" text-anchor="middle" font-size="12" fill="#333">2</text>

  <path d="M 150 116 L 150 134" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="170" y="130" font-size="9.5" fill="#666">哈希表统计频次</text>

  <!-- hash map entries -->
  <rect x="40" y="138" width="120" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="100" y="158" text-anchor="middle" font-size="11" fill="#333">难度 2 → 出现 3 次</text>

  <rect x="40" y="176" width="120" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="100" y="196" text-anchor="middle" font-size="11" fill="#333">难度 3 → 出现 2 次</text>

  <rect x="40" y="214" width="120" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="100" y="234" text-anchor="middle" font-size="11" fill="#333">难度 4 → 出现 5 次</text>

  <!-- note -->
  <rect x="40" y="258" width="250" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="165" y="276" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">不同难度互不干扰</text>
  <text x="165" y="292" text-anchor="middle" font-size="9.5" fill="#555">总轮数 = 各难度最少轮数之和</text>

  <!-- split line -->
  <line x1="310" y1="60" x2="310" y2="400" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Right: decompose c into 2/3 ===== -->
  <text x="435" y="74" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">② 每组拆成 2 和 3</text>

  <!-- table header -->
  <rect x="330" y="86" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="355" y="104" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">c</text>
  <rect x="382" y="86" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="432" y="104" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">拆法</text>
  <rect x="484" y="86" width="46" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="507" y="104" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">轮数</text>

  <!-- c=1: impossible -->
  <rect x="330" y="116" width="50" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="355" y="134" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <rect x="382" y="116" width="100" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="432" y="134" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">无法凑 ❌</text>
  <rect x="484" y="116" width="46" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="507" y="134" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">−1</text>

  <!-- c=2 -->
  <rect x="330" y="146" width="50" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="355" y="162" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="382" y="146" width="100" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="432" y="162" text-anchor="middle" font-size="10" fill="#333">2</text>
  <rect x="484" y="146" width="46" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="507" y="162" text-anchor="middle" font-size="11" fill="#333">1</text>

  <!-- c=3 -->
  <rect x="330" y="174" width="50" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="355" y="190" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="382" y="174" width="100" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="432" y="190" text-anchor="middle" font-size="10" fill="#333">3</text>
  <rect x="484" y="174" width="46" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="507" y="190" text-anchor="middle" font-size="11" fill="#333">1</text>

  <!-- c=4 -->
  <rect x="330" y="202" width="50" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="355" y="218" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="382" y="202" width="100" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="432" y="218" text-anchor="middle" font-size="10" fill="#333">2 + 2</text>
  <rect x="484" y="202" width="46" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="507" y="218" text-anchor="middle" font-size="11" fill="#333">2</text>

  <!-- c=5 -->
  <rect x="330" y="230" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="355" y="246" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <rect x="382" y="230" width="100" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="432" y="246" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">3 + 2</text>
  <rect x="484" y="230" width="46" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="507" y="246" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>

  <!-- c=6 -->
  <rect x="330" y="258" width="50" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="355" y="274" text-anchor="middle" font-size="11" fill="#333">6</text>
  <rect x="382" y="258" width="100" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="432" y="274" text-anchor="middle" font-size="10" fill="#333">3 + 3</text>
  <rect x="484" y="258" width="46" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="507" y="274" text-anchor="middle" font-size="11" fill="#333">2</text>

  <!-- c=7 -->
  <rect x="330" y="286" width="50" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="355" y="302" text-anchor="middle" font-size="11" fill="#333">7</text>
  <rect x="382" y="286" width="100" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="432" y="302" text-anchor="middle" font-size="10" fill="#333">3 + 2 + 2</text>
  <rect x="484" y="286" width="46" height="24" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="507" y="302" text-anchor="middle" font-size="11" fill="#333">3</text>

  <!-- formula box -->
  <rect x="330" y="320" width="200" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="340" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">规律：轮数 = ⌈c / 3⌉</text>
  <text x="430" y="356" text-anchor="middle" font-size="10" fill="#555">即 (c + 2) / 3（整数除法）</text>
  <text x="430" y="368" text-anchor="middle" font-size="9.5" fill="#888">c = 1 时返回 −1，其余必有解</text>

  <!-- footer -->
  <text x="40" y="324" font-size="10.5" fill="#444" font-weight="bold">为什么 c ≥ 2 必有解？</text>
  <text x="40" y="340" font-size="10" fill="#555">2 = 2，3 = 3 是基底；c ≥ 4 时</text>
  <text x="40" y="354" font-size="10" fill="#555">c = (c−2) + 2 或 (c−3) + 3</text>
  <text x="40" y="368" font-size="10" fill="#555">归纳可知均可拆成 2/3 之和</text>
</svg>
