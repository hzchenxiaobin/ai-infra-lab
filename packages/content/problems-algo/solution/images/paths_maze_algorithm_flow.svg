<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：枚举每个顶点的邻居对，验证第三条边</text>

  <!-- Step 1: build adjacency -->
  <rect x="170" y="48" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">建邻接表 g[]（双向）</text>
  <text x="280" y="81" text-anchor="middle" font-size="10" fill="#666">for [a,b] in corridors: g[a].add(b), g[b].add(a)</text>

  <path d="M 280 90 L 280 108" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: init ans -->
  <rect x="200" y="112" width="160" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="133" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans = 0</text>

  <path d="M 280 146 L 280 164" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: loop c -->
  <rect x="170" y="168" width="220" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="190" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">枚举顶点 c = 1 … n</text>

  <path d="M 280 206 L 280 224" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: pair of neighbors -->
  <rect x="140" y="228" width="280" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="246" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">枚举 g[c] 中的邻居对 (a, b)</text>
  <text x="280" y="261" text-anchor="middle" font-size="10" fill="#666">a &lt; b，避免同一对算两次</text>

  <path d="M 280 270 L 280 286" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond -->
  <polygon points="280,290 380,330 280,370 180,330" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">a 与 b 直接</text>
  <text x="280" y="340" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">相连？</text>
  <text x="280" y="356" text-anchor="middle" font-size="10" fill="#888">(a ∈ g[b])</text>

  <!-- Yes branch -->
  <path d="M 380 330 L 430 330 L 430 300" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="402" y="322" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="370" y="262" width="120" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="278" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">{a,b,c} 成环</text>
  <text x="430" y="292" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">ans += 1</text>

  <!-- No branch -->
  <path d="M 180 330 L 130 330 L 130 300" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="322" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="70" y="262" width="120" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="285" text-anchor="middle" font-size="11" fill="#b85450">跳过这对</text>

  <!-- loop back arrow (from both branches back up to pair step) -->
  <path d="M 430 262 L 430 210 L 420 210" stroke="#666" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 130 262 L 130 210 L 140 210" stroke="#666" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="455" y="240" font-size="10" fill="#888">下一对</text>

  <!-- Final step -->
  <path d="M 280 370 L 280 392" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="160" y="396" width="240" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="414" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 ans / 3</text>
  <text x="280" y="429" text-anchor="middle" font-size="10" fill="#666">每个三角形被 3 个顶点各统计一次，需除以 3</text>

  <!-- side note -->
  <rect x="30" y="396" width="120" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="90" y="414" text-anchor="middle" font-size="10" fill="#555">查 a∈g[b]</text>
  <text x="90" y="428" text-anchor="middle" font-size="10" fill="#888">哈希集合 O(1)</text>
</svg>
