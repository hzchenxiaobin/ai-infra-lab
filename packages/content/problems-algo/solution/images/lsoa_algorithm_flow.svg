<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：前缀和 → 基准 → 三重循环递推 → 返回 dp[n][k]</text>

  <!-- step 1 -->
  <rect x="160" y="44" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">① 预处理前缀和 pref[]</text>
  <text x="260" y="80" text-anchor="middle" font-size="10" fill="#666">pref[i] = Σ nums[0..i−1]，O(n)</text>

  <path d="M 260 88 L 260 100" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2 -->
  <rect x="160" y="102" width="200" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="122" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">② 填基准 dp[i][1]</text>
  <text x="260" y="138" text-anchor="middle" font-size="10" fill="#666">dp[i][1] = pref[i] / i（整段一组）</text>

  <path d="M 260 146 L 260 158" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 3: loops -->
  <rect x="80" y="160" width="360" height="118" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="182" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">③ 按组数 j = 2 … k 递推</text>
  <text x="100" y="206" font-size="11" fill="#444">for j = 2 → k:</text>
  <text x="120" y="224" font-size="11" fill="#444">for i = j → n:        // 至少 j 个元素</text>
  <text x="140" y="242" font-size="11" fill="#444">for t = j−1 → i−1:  // 枚举切点</text>
  <text x="160" y="260" font-size="11" fill="#b85450" font-weight="bold">dp[i][j] = max(dp[i][j], dp[t][j−1] + 均值)</text>
  <text x="320" y="224" font-size="10" fill="#888">外层按 j</text>
  <text x="320" y="242" font-size="10" fill="#888">保证 j−1 已就绪</text>

  <path d="M 260 278 L 260 290" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 4 -->
  <rect x="160" y="292" width="200" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="312" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">④ 返回 dp[n][k]</text>
  <text x="260" y="328" text-anchor="middle" font-size="10" fill="#666">前 n 个元素分 k 组的最大分数</text>

  <text x="260" y="360" text-anchor="middle" font-size="10" fill="#888">复杂度：时间 O(n²·k)   空间 O(n·k)，滚动可优化至 O(n)</text>
</svg>
