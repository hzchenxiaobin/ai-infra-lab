<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心：进入 / 退出 两条 FIFO 队列，门在中间按规则选向</text>

  <!-- region labels -->
  <text x="110" y="80" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">外 outside</text>
  <text x="450" y="80" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">里 inside</text>

  <!-- door in the middle -->
  <rect x="250" y="120" width="60" height="120" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <line x1="280" y1="128" x2="280" y2="232" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <text x="280" y="250" text-anchor="middle" font-size="15" fill="#7a5520" filter="url(#rough2)">门</text>

  <!-- enter queue (left, moving rightward into door) -->
  <rect x="60" y="158" width="40" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="80" y="186" text-anchor="middle" font-size="14" fill="#2c3e50" filter="url(#rough2)">P0</text>
  <rect x="110" y="158" width="40" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="130" y="186" text-anchor="middle" font-size="14" fill="#2c3e50" filter="url(#rough2)">P2</text>
  <rect x="160" y="158" width="40" height="44" rx="5" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="186" text-anchor="middle" font-size="14" fill="#2c3e50" filter="url(#rough2)">P3</text>
  <path d="M 210 180 L 246 180" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="130" y="222" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">进入队列 enter（往里走）</text>

  <!-- exit queue (right, moving leftward into door) -->
  <rect x="320" y="158" width="40" height="44" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="340" y="186" text-anchor="middle" font-size="14" fill="#2c4a22" filter="url(#rough2)">P1</text>
  <rect x="370" y="158" width="40" height="44" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="390" y="186" text-anchor="middle" font-size="14" fill="#2c4a22" filter="url(#rough2)">P4</text>
  <path d="M 330 180 L 314 180" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="365" y="222" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">退出队列 exit（往外走）</text>

  <!-- callout rule box -->
  <rect x="60" y="262" width="440" height="54" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="286" text-anchor="middle" font-size="13" fill="#7a2230" filter="url(#rough2)">上一秒用过门 → 同向优先（无人则切换）</text>
  <text x="280" y="305" text-anchor="middle" font-size="13" fill="#7a2230" filter="url(#rough2)">上一秒闲置 → 退出优先</text>
</svg>
