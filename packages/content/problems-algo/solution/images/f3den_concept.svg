<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：反向枚举值域 —— 答案空间小且天然有序</text>

  <rect x="30" y="42" width="500" height="118" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5 3" rx="8" filter="url(#rough2)"/>
  <text x="48" y="62" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">① 正向：从 digits 排列组合（麻烦）</text>

  <rect x="48" y="74" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="97" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="96" y="74" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="97" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="144" y="74" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="166" y="97" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="192" y="74" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="214" y="97" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="118" y="64" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">digits</text>

  <path d="M 244 92 L 282 92" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" fill="none" filter="url(#rough2)"/>
  <text x="263" y="86" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">P(n,3)</text>

  <rect x="288" y="74" width="64" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="90" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">排列去重</text>
  <text x="320" y="102" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">+ 排序</text>

  <path d="M 358 92 L 396 92" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" fill="none" filter="url(#rough2)"/>

  <rect x="402" y="74" width="118" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="461" y="97" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案（需去重排序）</text>

  <text x="48" y="128" font-size="10.5" fill="#b85450" filter="url(#rough2)">n≤100 → P(100,3)≈10⁶ 排列，且重复元素产生重复结果，必须用 set 去重</text>
  <text x="48" y="144" font-size="10.5" fill="#b85450" filter="url(#rough2)">⚠️ 还要逐个判前导零 / 偶数，逻辑分支多</text>

  <rect x="30" y="174" width="500" height="206" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="48" y="194" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 反向：枚举答案值域 100 → 998（优雅）</text>

  <rect x="48" y="208" width="150" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="123" y="233" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">[100, 998] 步长 2</text>
  <text x="123" y="252" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">三位偶数共 450 个</text>

  <path d="M 204 228 L 242 228" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>

  <rect x="248" y="208" width="120" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="308" y="226" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">拆成 3 位数字</text>
  <text x="308" y="240" text-anchor="middle" font-size="9.5" fill="#d6a040" filter="url(#rough2)">百/十/个</text>

  <path d="M 374 228 L 412 228" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>

  <rect x="418" y="208" width="104" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="470" y="226" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">查 freq 够不够</text>
  <text x="470" y="240" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">每位 O(1)</text>

  <rect x="48" y="266" width="474" height="24" fill="#fafafa" stroke="#aaa" stroke-width="1.2" stroke-dasharray="4 3" rx="6" filter="url(#rough2)"/>
  <text x="285" y="283" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">天然有序（升序枚举）+ 天然去重（每个候选只判一次）</text>

  <text x="48" y="312" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓ 值域仅 450 个候选，每个判 3 位频次，总操作 ≈ 1350 次</text>
  <text x="48" y="332" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓ 枚举即升序 → 无需再排序；候选互异 → 无需 set 去重</text>
  <text x="48" y="352" font-size="11" fill="#4a7a3a" filter="url(#rough2)">✓ 三个条件一次性满足：三位数(范围保证) / 偶数(步长2) / 无前导零(≥100)</text>

  <text x="48" y="374" font-size="10.5" fill="#b85450" font-style="italic" filter="url(#rough2)">关键转换：把「从输入生成候选」翻转成「从答案空间验证候选」</text>
</svg>
