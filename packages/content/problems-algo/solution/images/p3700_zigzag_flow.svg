<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="520" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：0/1 转移矩阵 + 快速幂 T^(n−2)，O((2m)³ log n)</text>

  <!-- ① 输入 -->
  <rect x="110" y="44" width="300" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">输入 n、l、r（3 ≤ n ≤ 10⁹，m = r−l+1 ≤ 75）</text>

  <path d="M 260 76 L 260 92" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② 状态编号 -->
  <rect x="75" y="96" width="370" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="116" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">① 状态编号：0..m−1 = up(x)，m..2m−1 = dn(x)</text>
  <text x="260" y="133" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">状态数 2m ≤ 150——m 塌缩到 75 才敢让状态带上「具体取值」</text>

  <path d="M 260 142 L 260 158" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ 初始向量 -->
  <rect x="75" y="162" width="370" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="182" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">② 初始向量 v₂：up(x) = x，dn(x) = m−1−x</text>
  <text x="260" y="199" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">前两个元素一步编码进向量，此后只需 n−2 次转移</text>

  <path d="M 260 208 L 260 224" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ④ 转移矩阵 -->
  <rect x="75" y="228" width="370" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="248" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">③ 转移矩阵 T：up(x)→dn(y) ∀y&lt;x；dn(x)→up(y) ∀y&gt;x</text>
  <text x="260" y="265" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">0/1 矩阵，up 块与 dn 块互为翻转——方向必须交替的矩阵化身</text>

  <path d="M 260 274 L 260 290" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ⑤ 快速幂判定 -->
  <polygon points="260,292 345,332 260,372 175,332" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="330" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">e = n−2 &gt; 0 ?</text>
  <text x="260" y="346" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">e 初值 = n−2</text>

  <!-- 否：汇总 -->
  <path d="M 345 332 L 353 332" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="348" y="324" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">否</text>
  <rect x="357" y="314" width="150" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="432" y="331" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">④ ans = Σ(P·v₂)</text>
  <text x="432" y="346" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">mod 10⁹+7</text>

  <path d="M 432 352 L 432 368" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="332" y="372" width="200" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="432" y="392" text-anchor="middle" font-size="11" fill="#2f5d25" filter="url(#rough2)">⑤ 返回 ans</text>
  <text x="432" y="418" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">此时 P = T^(n−2) 已就绪</text>

  <!-- 是：循环体 -->
  <path d="M 260 372 L 260 390" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="386" font-size="9.5" fill="#666" filter="url(#rough2)">是</text>
  <rect x="120" y="394" width="280" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="413" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">e 为奇数：P = P × T</text>
  <text x="260" y="430" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">T = T × T；e = e &gt;&gt; 1</text>
  <text x="260" y="443" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">P 初值 = 单位阵 I</text>

  <!-- 回环 -->
  <path d="M 120 420 L 56 420 L 56 332 L 171 332" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="6,5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="62" y="356" font-size="9" fill="#4a7a3a" filter="url(#rough2)">下一比特</text>

  <!-- 底部说明 -->
  <text x="260" y="474" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">💡 60 次 150×150 矩阵乘 ≈ 2×10⁸ 次乘加取模：C++ 实测 0.1s</text>
  <text x="260" y="494" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">⚠️ Python 须 numpy 且拆位防 int64 静默溢出；C++ 乘积 &lt; 10¹⁸ 天然安全</text>
</svg>
