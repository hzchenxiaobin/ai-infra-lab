<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：prices = [1, 10, 1, 1]（下标从 1 开始）</text>
  <text x="310" y="40" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">dp[0] = 0；队列元素记作 (下标 l, 候选值 dp[l−1] + prices[l])，绿色 = 队首</text>

  <rect x="30" y="56" width="45" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="52" y="75" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">i</text>
  <rect x="75" y="56" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="165" y="75" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">新候选 v = dp[i−1] + prices[i]</text>
  <rect x="255" y="56" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="305" y="75" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">窗口左界 ⌈i/2⌉</text>
  <rect x="355" y="56" width="155" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="432" y="75" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">队列（l, 值）</text>
  <rect x="510" y="56" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="550" y="75" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">dp[i]</text>

  <rect x="30" y="86" width="45" height="44" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="52" y="112" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="75" y="86" width="180" height="44" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="165" y="104" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">v = dp[0] + p1 = 0 + 1</text>
  <text x="165" y="120" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">= 1</text>
  <rect x="255" y="86" width="100" height="44" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="305" y="112" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">⌈1/2⌉ = 1</text>
  <rect x="355" y="86" width="155" height="44" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="432" y="112" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(1, 1)</text>
  <rect x="510" y="86" width="80" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="550" y="112" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="30" y="130" width="45" height="44" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="52" y="156" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="75" y="130" width="180" height="44" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="165" y="148" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">v = dp[1] + p2 = 1 + 10</text>
  <text x="165" y="164" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">= 11</text>
  <rect x="255" y="130" width="100" height="44" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="305" y="156" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">⌈2/2⌉ = 1</text>
  <rect x="355" y="130" width="155" height="44" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="432" y="156" text-anchor="middle" font-size="11" filter="url(#rough2)"><tspan fill="#4a7a3a" font-weight="bold">(1, 1)</tspan><tspan fill="#999"> → (2, 11)</tspan></text>
  <rect x="510" y="130" width="80" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="550" y="156" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>

  <rect x="30" y="174" width="45" height="44" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="52" y="200" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="75" y="174" width="180" height="44" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="165" y="192" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">v = dp[2] + p3 = 1 + 1 = 2</text>
  <text x="165" y="208" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">2 &lt; 11 ⇒ 淘汰队尾 (2, 11)</text>
  <rect x="255" y="174" width="100" height="44" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="305" y="192" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">⌈3/2⌉ = 2</text>
  <text x="305" y="208" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">(1, 1) 过期出队</text>
  <rect x="355" y="174" width="155" height="44" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="432" y="200" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">(3, 2)</text>
  <rect x="510" y="174" width="80" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="550" y="200" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="30" y="218" width="45" height="44" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="52" y="244" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="75" y="218" width="180" height="44" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="165" y="236" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">v = dp[3] + p4 = 2 + 1</text>
  <text x="165" y="252" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">= 3</text>
  <rect x="255" y="218" width="100" height="44" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="305" y="244" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">⌈4/2⌉ = 2</text>
  <rect x="355" y="218" width="155" height="44" fill="#ffffff" stroke="#999" stroke-width="1.1" rx="4" filter="url(#rough2)"/>
  <text x="432" y="244" text-anchor="middle" font-size="11" filter="url(#rough2)"><tspan fill="#4a7a3a" font-weight="bold">(3, 2)</tspan><tspan fill="#999"> → (4, 3)</tspan></text>
  <rect x="510" y="218" width="80" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="550" y="244" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="30" y="278" width="560" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="310" y="297" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 dp[4] = 2 ✓</text>
  <text x="310" y="314" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">方案：花 1 买 1 号（2 号免费）+ 花 1 买 3 号（4 号免费）</text>

  <rect x="30" y="332" width="560" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="310" y="351" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">顺带验证示例 1：prices = [3, 1, 2]</text>
  <text x="310" y="369" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">dp = [0, 3, 3, 4] → 买 1 号送 2 号，再花 1 买 2 号送 3 号，共 4 ✓</text>
</svg>
