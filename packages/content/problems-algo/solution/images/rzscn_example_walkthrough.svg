<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="480" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：1→2→−3→3→1（示例 1）</text>
  <text x="290" y="44" text-anchor="middle" font-size="11" fill="#888">橙=dummy，蓝=普通，红=零和段，绿=最终保留</text>

  <!-- ===== Row 1: 初始链表 + 前缀和 ===== -->
  <text x="20" y="66" font-size="11" fill="#444" font-weight="bold">初始链表（前缀和标注于节点下方）</text>
  <g font-size="12">
    <rect x="40" y="74" width="46" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="63" y="92" text-anchor="middle" fill="#8a6a20" font-size="8" font-weight="bold">dummy</text>
    <rect x="92" y="74" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="115" y="92" text-anchor="middle" fill="#333" font-weight="bold">1</text>
    <rect x="144" y="74" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="167" y="92" text-anchor="middle" fill="#333" font-weight="bold">2</text>
    <rect x="196" y="74" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="219" y="92" text-anchor="middle" fill="#333" font-weight="bold">−3</text>
    <rect x="248" y="74" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="271" y="92" text-anchor="middle" fill="#333" font-weight="bold">3</text>
    <rect x="300" y="74" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="323" y="92" text-anchor="middle" fill="#333" font-weight="bold">1</text>
  </g>
  <g stroke="#446688" stroke-width="1.2" fill="none">
    <line x1="86" y1="88" x2="92" y2="88" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="138" y1="88" x2="144" y2="88" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="190" y1="88" x2="196" y2="88" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="242" y1="88" x2="248" y2="88" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="294" y1="88" x2="300" y2="88" marker-end="url(#arr)" filter="url(#rough2)"/>
  </g>
  <g font-size="10" fill="#888">
    <text x="14" y="116" font-size="9" fill="#aaa">prefix:</text>
    <text x="63" y="116" text-anchor="middle" fill="#b85450" font-weight="bold">0</text>
    <text x="115" y="116" text-anchor="middle" fill="#555">1</text>
    <text x="167" y="116" text-anchor="middle" fill="#555">3</text>
    <text x="219" y="116" text-anchor="middle" fill="#b85450" font-weight="bold">0</text>
    <text x="271" y="116" text-anchor="middle" fill="#555">3</text>
    <text x="323" y="116" text-anchor="middle" fill="#555">4</text>
  </g>

  <!-- ===== Row 2: 第一遍 map ===== -->
  <text x="20" y="142" font-size="11" fill="#444" font-weight="bold">第一遍结束：map（覆盖，保留最后出现）</text>
  <g font-size="11">
    <rect x="40" y="152" width="110" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="95" y="169" text-anchor="middle" fill="#b85450" font-weight="bold">0 → n(−3)</text>
    <rect x="160" y="152" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="215" y="169" text-anchor="middle" fill="#333">1 → n(1)</text>
    <rect x="280" y="152" width="110" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="335" y="169" text-anchor="middle" fill="#b85450" font-weight="bold">3 → n(3)</text>
    <rect x="400" y="152" width="110" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="455" y="169" text-anchor="middle" fill="#333">4 → n(1)</text>
  </g>
  <text x="40" y="196" font-size="9" fill="#b85450">↑ 0 覆盖了 dummy，3 覆盖了 n(2) → 存最后出现</text>
  <text x="40" y="210" font-size="9" fill="#888">→ 第二遍查 map[0] 得 n(−3)，查 map[3] 得 n(3)（最后的同值节点）</text>

  <!-- ===== Row 3: 第二遍 step1 — 跳过 ===== -->
  <text x="20" y="234" font-size="11" fill="#b85450" font-weight="bold">第二遍 step1：curr=dummy, prefix=0, map[0]=n(−3) ≠ dummy → 跳过！</text>
  <g font-size="12">
    <rect x="40" y="242" width="46" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="63" y="260" text-anchor="middle" fill="#8a6a20" font-size="8" font-weight="bold">dummy</text>
    <rect x="92" y="242" width="46" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="115" y="260" text-anchor="middle" fill="#bbb" font-weight="bold" text-decoration="line-through">1</text>
    <rect x="144" y="242" width="46" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="167" y="260" text-anchor="middle" fill="#bbb" font-weight="bold" text-decoration="line-through">2</text>
    <rect x="196" y="242" width="46" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
    <text x="219" y="260" text-anchor="middle" fill="#bbb" font-weight="bold" text-decoration="line-through">−3</text>
    <rect x="248" y="242" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="271" y="260" text-anchor="middle" fill="#333" font-weight="bold">3</text>
    <rect x="300" y="242" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="323" y="260" text-anchor="middle" fill="#333" font-weight="bold">1</text>
  </g>
  <!-- skip arrow -->
  <path d="M 63 242 Q 167 210 271 242" stroke="#b85450" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="167" y="206" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">curr.next = n(−3).next = n(3)</text>
  <text x="400" y="260" font-size="9" fill="#b85450">[1,2,−3] 和=0 删去</text>

  <!-- ===== Row 4: step2-3 — 不跳 ===== -->
  <text x="20" y="296" font-size="11" fill="#444" font-weight="bold">step2：curr=n(3), prefix=3, map[3]=n(3)=curr → 不跳，前进</text>
  <text x="20" y="314" font-size="11" fill="#444" font-weight="bold">step3：curr=n(1), prefix=4, map[4]=n(1)=curr → 不跳，curr=null 结束</text>
  <g font-size="12">
    <rect x="100" y="322" width="46" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="123" y="340" text-anchor="middle" fill="#8a6a20" font-size="8" font-weight="bold">dummy</text>
    <rect x="152" y="322" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="175" y="340" text-anchor="middle" fill="#333" font-weight="bold">3</text>
    <rect x="204" y="322" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="227" y="340" text-anchor="middle" fill="#333" font-weight="bold">1</text>
  </g>
  <g stroke="#446688" stroke-width="1.2" fill="none">
    <line x1="146" y1="336" x2="152" y2="336" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="198" y1="336" x2="204" y2="336" marker-end="url(#arr)" filter="url(#rough2)"/>
  </g>
  <text x="260" y="340" font-size="10" fill="#888">→∅</text>

  <!-- ===== Row 5: 最终结果 ===== -->
  <rect x="20" y="372" width="540" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="34" y="394" font-size="12" fill="#4a7a3a" font-weight="bold">最终结果：dummy.next → 3→1 ✓</text>
  <g font-size="13">
    <rect x="34" y="404" width="46" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="57" y="422" text-anchor="middle" fill="#8a6a20" font-size="8" font-weight="bold">dummy</text>
    <rect x="86" y="404" width="46" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="109" y="422" text-anchor="middle" fill="#333" font-weight="bold">3</text>
    <rect x="138" y="404" width="46" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="161" y="422" text-anchor="middle" fill="#333" font-weight="bold">1</text>
  </g>
  <g stroke="#4a7a3a" stroke-width="1.2" fill="none">
    <line x1="80" y1="418" x2="86" y2="418" marker-end="url(#arr)" filter="url(#rough2)"/>
    <line x1="132" y1="418" x2="138" y2="418" marker-end="url(#arr)" filter="url(#rough2)"/>
  </g>
  <text x="194" y="422" font-size="10" fill="#888">→∅</text>
  <text x="34" y="456" font-size="10" fill="#555">前缀和 0 在 dummy 与 n(−3) 处相同 → [1,2,−3] 和为零，一跳删去</text>
</svg>
