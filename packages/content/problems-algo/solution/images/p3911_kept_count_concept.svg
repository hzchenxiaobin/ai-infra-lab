<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：kept(x) = x/2 − cnt(x) 单调不减 → 二分答案</text>

  <!-- ① 顶部：无限偶数轴 + 移除标记 -->
  <g filter="url(#rough2)">
    <rect x="16" y="36" width="528" height="140" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="280" y="56" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">查询 [0,2,4]：子数组 nums[0..2] = [2,5,8] → 只有偶数 2、8 被移除，奇数 5 陪跑</text>

    <rect x="44" y="66" width="44" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="66" y="88" text-anchor="middle" font-size="12" fill="#8a3030">2</text>
    <path d="M52,73 L60,93 M60,73 L52,93" stroke="#b85450" stroke-width="2"/>

    <rect x="88" y="66" width="44" height="34" rx="4" fill="#fff" stroke="#446688" stroke-width="1.5"/>
    <text x="110" y="88" text-anchor="middle" font-size="12" fill="#333">4</text>

    <rect x="132" y="66" width="44" height="34" rx="4" fill="#fff" stroke="#446688" stroke-width="1.5"/>
    <text x="154" y="88" text-anchor="middle" font-size="12" fill="#333">6</text>

    <rect x="176" y="66" width="44" height="34" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="198" y="88" text-anchor="middle" font-size="12" fill="#8a3030">8</text>
    <path d="M184,73 L192,93 M192,73 L184,93" stroke="#b85450" stroke-width="2"/>

    <rect x="220" y="66" width="44" height="34" rx="4" fill="#fff" stroke="#446688" stroke-width="1.5"/>
    <text x="242" y="88" text-anchor="middle" font-size="12" fill="#333">10</text>

    <rect x="264" y="66" width="44" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
    <text x="286" y="88" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold">12</text>

    <rect x="308" y="66" width="44" height="34" rx="4" fill="#fff" stroke="#446688" stroke-width="1.5"/>
    <text x="330" y="88" text-anchor="middle" font-size="12" fill="#333">14</text>

    <rect x="352" y="66" width="44" height="34" rx="4" fill="#fff" stroke="#446688" stroke-width="1.5"/>
    <text x="374" y="88" text-anchor="middle" font-size="12" fill="#333">16</text>

    <text x="422" y="88" font-size="13" fill="#666">…</text>

    <circle cx="110" cy="116" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="110" y="120" text-anchor="middle" font-size="10" fill="#2f5d24">1</text>
    <circle cx="154" cy="116" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="154" y="120" text-anchor="middle" font-size="10" fill="#2f5d24">2</text>
    <circle cx="242" cy="116" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="242" y="120" text-anchor="middle" font-size="10" fill="#2f5d24">3</text>
    <circle cx="286" cy="116" r="9" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="286" y="120" text-anchor="middle" font-size="10" fill="#8a6d1a" font-weight="bold">4</text>

    <text x="280" y="152" text-anchor="middle" font-size="10.5" fill="#33506b">存活序列 4, 6, 10, 12, … → 第 k = 4 个存活偶数 = <tspan fill="#b85450" font-weight="bold">12</tspan></text>
    <text x="280" y="168" text-anchor="middle" font-size="9.5" fill="#5a7495">（子数组是筛子：只筛掉「在其中的偶数」，查询之间互不影响）</text>
  </g>

  <!-- ② 左下：公式拆解 -->
  <g filter="url(#rough2)">
    <rect x="16" y="188" width="268" height="230" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="150" y="208" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">② 把「数数」变成「算数」</text>
    <text x="150" y="234" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold">kept(x) = x/2 − cnt(x)</text>

    <text x="30" y="262" font-size="10" fill="#2f5d24"><tspan font-weight="bold">x/2</tspan>：≤ x 的正偶数恰有 x/2 个（2,4,…,x）</text>
    <text x="30" y="278" font-size="10" fill="#2f5d24"><tspan font-weight="bold">cnt(x)</tspan>：子数组中 ≤ x 的偶数个数（被移除的）</text>
    <text x="30" y="294" font-size="10" fill="#2f5d24"><tspan font-weight="bold">kept(x)</tspan>：序列中 ≤ x 还存活的偶数个数</text>

    <rect x="30" y="308" width="240" height="44" rx="6" fill="#fff" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="150" y="325" text-anchor="middle" font-size="9.5" fill="#2f5d24">cnt(x)：先 bisect 出子数组中 ≤ x 的右边界 j</text>
    <text x="150" y="342" text-anchor="middle" font-size="9.5" fill="#2f5d24">再 cnt = pre[j] − pre[l]（偶数前缀计数），O(log n)</text>

    <text x="150" y="372" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold">x 每增大 2：x/2 加 1，cnt 至多加 1</text>
    <text x="150" y="390" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">⇒ kept(x) 单调不减 ⇒ 可二分！</text>
    <text x="150" y="408" text-anchor="middle" font-size="9.5" fill="#4a6b5a">（k ≤ 10⁹，逐个数必死；值域二分才活得下来）</text>
  </g>

  <!-- ③ 右下：kept 阶梯图 -->
  <g filter="url(#rough2)">
    <rect x="296" y="188" width="248" height="230" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
    <text x="420" y="208" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold">③ kept(x) 阶梯图：找最小 x 使 kept ≥ k</text>

    <path d="M330,392 H516" stroke="#8a6d1a" stroke-width="1.5" marker-end="url(#arr)"/>
    <path d="M330,392 V228" stroke="#8a6d1a" stroke-width="1.5" marker-end="url(#arr)"/>

    <text x="322" y="396" text-anchor="end" font-size="9" fill="#8a6d1a">0</text>
    <text x="352" y="406" text-anchor="middle" font-size="9" fill="#8a6d1a">2</text>
    <text x="374" y="406" text-anchor="middle" font-size="9" fill="#8a6d1a">4</text>
    <text x="396" y="406" text-anchor="middle" font-size="9" fill="#8a6d1a">6</text>
    <text x="418" y="406" text-anchor="middle" font-size="9" fill="#8a6d1a">8</text>
    <text x="440" y="406" text-anchor="middle" font-size="9" fill="#8a6d1a">10</text>
    <text x="462" y="406" text-anchor="middle" font-size="9" fill="#8a6d1a">12</text>
    <text x="484" y="406" text-anchor="middle" font-size="9" fill="#8a6d1a">14</text>
    <text x="506" y="406" text-anchor="middle" font-size="9" fill="#8a6d1a">16</text>
    <text x="500" y="396" font-size="9" fill="#8a6d1a" text-anchor="middle">x</text>
    <text x="318" y="240" text-anchor="end" font-size="9" fill="#8a6d1a">6</text>
    <text x="318" y="292" text-anchor="end" font-size="9" fill="#8a6d1a">4</text>
    <text x="318" y="344" text-anchor="end" font-size="9" fill="#8a6d1a">2</text>
    <text x="308" y="222" font-size="9" fill="#8a6d1a">kept</text>

    <path d="M352,390 L374,364 L396,338 L418,338 L440,312 L462,286 L484,260 L506,238"
          fill="none" stroke="#4a7a3a" stroke-width="2"/>

    <path d="M330,286 H462" stroke="#b85450" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="338" y="280" font-size="9.5" fill="#b85450" font-weight="bold">k = 4</text>

    <circle cx="462" cy="286" r="4.5" fill="#b85450" stroke="#8a3030" stroke-width="1.5"/>
    <text x="470" y="272" font-size="10.5" fill="#b85450" font-weight="bold">x = 12 ✓</text>

    <text x="420" y="360" text-anchor="middle" font-size="9.5" fill="#8a6d1a">x=8 处 kept 停在 2（8 被移除，平台期）</text>
    <text x="420" y="376" text-anchor="middle" font-size="9.5" fill="#8a6d1a">交点 x=12 未被移除——最小性保证</text>
  </g>
</svg>
