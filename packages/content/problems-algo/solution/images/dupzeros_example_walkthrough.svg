<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="290" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">
    示例演算：arr = [1,0,2,3,0,4,5,0]，n = 8
  </text>

  <!-- ===== Section 1: 第一趟 计数 ===== -->
  <rect x="30" y="40" width="180" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="120" y="54" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① 第一趟：i、j 正向计数</text>

  <!-- 表头 -->
  <text x="70" y="78" text-anchor="middle" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">步</text>
  <text x="140" y="78" text-anchor="middle" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="210" y="78" text-anchor="middle" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">arr[i]</text>
  <text x="310" y="78" text-anchor="middle" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">j 增量</text>
  <text x="420" y="78" text-anchor="middle" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">新 j</text>

  <!-- 行0: i=0,1,+1,1 -->
  <text x="70" y="98" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">0</text>
  <text x="140" y="98" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="210" y="98" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="310" y="98" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">+1</text>
  <text x="420" y="98" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <!-- 行1: i=1,0,+2,3 (零) -->
  <rect x="40" y="104" width="440" height="18" fill="#fce4ec" opacity="0.35" rx="3" filter="url(#rough2)"/>
  <text x="70" y="116" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="140" y="116" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="210" y="116" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="310" y="116" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">+2</text>
  <text x="420" y="116" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>

  <!-- 行2: i=2,2,+1,4 -->
  <text x="70" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="140" y="134" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="210" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="310" y="134" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">+1</text>
  <text x="420" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>

  <!-- 行3: i=3,3,+1,5 -->
  <text x="70" y="152" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="140" y="152" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="210" y="152" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="310" y="152" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">+1</text>
  <text x="420" y="152" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>

  <!-- 行4: i=4,0,+2,7 (零) -->
  <rect x="40" y="140" width="440" height="18" fill="#fce4ec" opacity="0.35" rx="3" filter="url(#rough2)"/>
  <text x="70" y="152" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="140" y="152" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="210" y="152" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="310" y="152" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">+2</text>
  <text x="420" y="152" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>

  <!-- 行5: i=5,4,+1,8 (stop) -->
  <text x="70" y="170" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="140" y="170" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="210" y="170" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="310" y="170" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">+1</text>
  <text x="420" y="170" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">8 ≥n 停</text>

  <!-- 小结 -->
  <text x="290" y="188" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">
    结束 i=6, j=8 → 回退 i=5, j=7（j≠n，无特判）
  </text>

  <!-- 分隔线 -->
  <path d="M 30 198 L 550 198" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- ===== Section 2: 第二趟 回填 ===== -->
  <rect x="30" y="206" width="220" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="5" filter="url(#rough2)"/>
  <text x="140" y="220" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">② 第二趟：从右向左回填（j ≥ i）</text>

  <!-- 6 行数组快照，每行 8 格 -->
  <!-- 公共：原始数组底色，改动的格子高亮 -->

  <!-- 行1: i=5,j=7 写4 → [1,0,2,3,0,4,5,4] pos7 -->
  <text x="40" y="248" font-size="10" fill="#888" filter="url(#rough2)">i=5</text>
  <text x="40" y="261" font-size="10" fill="#888" filter="url(#rough2)">j=7</text>
  <!-- cells -->
  <rect x="92" y="240" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="109" y="258" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="128" y="240" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="145" y="258" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="164" y="240" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="181" y="258" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="200" y="240" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="217" y="258" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="236" y="240" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="253" y="258" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="272" y="240" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="289" y="258" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="308" y="240" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="325" y="258" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="344" y="240" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="361" y="258" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="392" y="258" font-size="10" fill="#d6a040" filter="url(#rough2)">← 写 4</text>

  <!-- 行2: i=4,j=6 写0,0 → pos6,5 -->
  <text x="40" y="290" font-size="10" fill="#888" filter="url(#rough2)">i=4</text>
  <text x="40" y="303" font-size="10" fill="#888" filter="url(#rough2)">j=6</text>
  <rect x="92" y="282" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="109" y="300" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="128" y="282" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="145" y="300" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="164" y="282" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="181" y="300" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="200" y="282" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="217" y="300" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="236" y="282" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="253" y="300" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="272" y="282" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="289" y="300" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="308" y="282" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="325" y="300" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="344" y="282" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="361" y="300" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="392" y="300" font-size="10" fill="#d6a040" filter="url(#rough2)">← 写 0,0</text>

  <!-- 行3: i=3,j=4 写3 → pos4 -->
  <text x="40" y="332" font-size="10" fill="#888" filter="url(#rough2)">i=3</text>
  <text x="40" y="345" font-size="10" fill="#888" filter="url(#rough2)">j=4</text>
  <rect x="92" y="324" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="109" y="342" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="128" y="324" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="145" y="342" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="164" y="324" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="181" y="342" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="200" y="324" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="217" y="342" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="236" y="324" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="253" y="342" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="272" y="324" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="289" y="342" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="308" y="324" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="325" y="342" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="344" y="324" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="361" y="342" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="392" y="342" font-size="10" fill="#d6a040" filter="url(#rough2)">← 写 3</text>

  <!-- 行4: i=2,j=3 写2 → pos3 -->
  <text x="40" y="374" font-size="10" fill="#888" filter="url(#rough2)">i=2</text>
  <text x="40" y="387" font-size="10" fill="#888" filter="url(#rough2)">j=3</text>
  <rect x="92" y="366" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="109" y="384" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="128" y="366" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="145" y="384" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="164" y="366" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="181" y="384" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="200" y="366" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="217" y="384" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="236" y="366" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="253" y="384" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="272" y="366" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="289" y="384" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="308" y="366" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="325" y="384" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="344" y="366" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="361" y="384" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="392" y="384" font-size="10" fill="#d6a040" filter="url(#rough2)">← 写 2</text>

  <!-- 行5+6 合并：i=1 写0,0 / i=0 写1 → 最终 -->
  <text x="40" y="416" font-size="10" fill="#888" filter="url(#rough2)">i=1</text>
  <text x="40" y="429" font-size="10" fill="#888" filter="url(#rough2)">i=0</text>
  <rect x="92" y="408" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="109" y="426" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="128" y="408" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="145" y="426" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="164" y="408" width="34" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="181" y="426" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="200" y="408" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="217" y="426" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="236" y="408" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="253" y="426" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="272" y="408" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="289" y="426" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="308" y="408" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="325" y="426" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <rect x="344" y="408" width="34" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="361" y="426" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="392" y="426" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">← 最终</text>

  <!-- 图例 -->
  <rect x="448" y="244" width="12" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="464" y="254" font-size="9.5" fill="#555" filter="url(#rough2)">本次写入</text>
  <rect x="448" y="262" width="12" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="2" filter="url(#rough2)"/>
  <text x="464" y="272" font-size="9.5" fill="#555" filter="url(#rough2)">原值=0</text>
</svg>
