<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 452" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="452" fill="#fafafa"/>

  <text x="290" y="20" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：「技能全齐」是关系除法，「打分」是逐技能 CASE 求和</text>
  <text x="290" y="36" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">JOIN ON skill 只回答「有没有交集」；数行数比对才能回答「是否全齐」</text>

  <text x="70" y="48" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">Candidates</text>
  <rect x="42" y="52" width="212" height="96" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="42" y="52" width="212" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="67" y="68" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">cand</text>
  <text x="138" y="68" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">skill</text>
  <text x="221" y="68" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">prof</text>
  <line x1="42" y1="76" x2="254" y2="76" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="92" y1="52" x2="92" y2="148" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="184" y1="52" x2="184" y2="148" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="67" y="92" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">101</text>
  <text x="138" y="92" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Python</text>
  <text x="221" y="92" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">5</text>
  <text x="67" y="116" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">101</text>
  <text x="138" y="116" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Tableau</text>
  <text x="221" y="116" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="67" y="140" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">102</text>
  <text x="138" y="140" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">R</text>
  <text x="221" y="140" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4</text>

  <text x="354" y="48" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Projects</text>
  <rect x="326" y="52" width="212" height="96" fill="#fff" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <rect x="326" y="52" width="212" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="351" y="68" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">proj</text>
  <text x="422" y="68" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">skill</text>
  <text x="505" y="68" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">imp</text>
  <line x1="326" y1="76" x2="538" y2="76" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <line x1="376" y1="52" x2="376" y2="148" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="468" y1="52" x2="468" y2="148" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="351" y="92" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">501</text>
  <text x="422" y="92" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Python</text>
  <text x="505" y="92" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4</text>
  <text x="351" y="116" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">502</text>
  <text x="422" y="116" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">R</text>
  <text x="505" y="116" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>
  <text x="351" y="140" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">…</text>
  <text x="422" y="140" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">…</text>
  <text x="505" y="140" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">…</text>

  <path d="M 258 100 L 322 100" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="92" text-anchor="middle" font-size="10" fill="#666" font-weight="bold" filter="url(#rough2)">ON</text>
  <text x="290" y="116" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">skill</text>

  <rect x="42" y="162" width="496" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="182" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">⋈ 结果：一行 = 一项「双方共有」的技能 (cand, proj, skill, prof, imp)</text>
  <text x="290" y="200" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">(101,501,Python,5,4)、(101,502,Tableau,3,4)、(102,502,R,4,2) ……</text>
  <text x="290" y="216" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">主键 (id, skill) ⇒ 连接不会一对多膨胀，COUNT(*) 数得准</text>

  <rect x="42" y="240" width="240" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="162" y="260" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">GROUP BY (cand, proj)</text>
  <text x="162" y="277" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">matched_skills = 共有技能数</text>
  <text x="162" y="291" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">同一分组里 SUM 逐技能 delta</text>

  <rect x="298" y="240" width="240" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="418" y="260" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">GROUP BY proj</text>
  <text x="418" y="277" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">required_skills = 需求技能数</text>
  <text x="418" y="291" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">（T 表独立统计，与候选人无关）</text>

  <rect x="42" y="316" width="496" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="336" text-anchor="middle" font-size="11" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">matched_skills = required_skills ⇔ 候选人技能集 ⊇ 项目技能集（关系除法）</text>
  <text x="290" y="354" text-anchor="middle" font-size="10" fill="#8a6d1a" filter="url(#rough2)">score = 100 + Σ( prof＞imp 记 +10；prof＜imp 记 −5；相等记 0 )</text>
  <text x="290" y="374" text-anchor="middle" font-size="9" fill="#8a6d1a" filter="url(#rough2)">⇒ 每项目取最高分；同分取更小 candidate_id；无人全齐的项目自然不出现</text>

  <rect x="42" y="404" width="496" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="290" y="421" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">💡 100 是每个「候选人-项目对」的基础分——加在 SUM 外面、每个分组只加一次；</text>
  <text x="290" y="436" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">技能数有限 ⇒ 扣分有下界，score 恒为正，排序无需担心负分</text>
</svg>
