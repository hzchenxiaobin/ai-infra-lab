<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 370" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="370" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：滚动前缀异或 → 查询累加 → 插入 → 循环至右端点耗尽</text>

  <rect x="28" y="46" width="204" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="63" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 建空 Trie，插入 P₀ = 0</text>
  <text x="130" y="79" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">覆盖左端点为数组开头的子数组</text>

  <rect x="28" y="108" width="204" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="125" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">② r = 1..n：p ⊕= nums[r−1]</text>
  <text x="130" y="141" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">O(1) 滚动维护前缀异或 Pᵣ</text>

  <rect x="28" y="170" width="204" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="187" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">③ res = query(p, k)</text>
  <text x="130" y="203" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">30 位逐位决策，沿途收对侧子树 cnt</text>

  <rect x="28" y="232" width="204" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="249" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">④ ans += res</text>
  <text x="130" y="265" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">以 r 为右端点的合法子数组数（long long）</text>

  <rect x="28" y="294" width="204" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="311" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⑤ insert(p)</text>
  <text x="130" y="327" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">沿途每个节点 cnt + 1，供后续查询</text>

  <rect x="288" y="232" width="204" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="390" y="249" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">⑥ r 走完 n 个右端点？</text>
  <text x="390" y="265" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">没完 → 回 ② 处理下一个右端点</text>

  <rect x="288" y="108" width="204" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="390" y="125" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⑦ 输出 ans</text>
  <text x="390" y="141" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">示例 1：1 + 1 + 2 + 2 = 6</text>

  <rect x="288" y="44" width="204" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" stroke-dasharray="6 4" rx="8" filter="url(#rough2)"/>
  <text x="390" y="61" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠ 两个坑</text>
  <text x="390" y="78" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">P₀ 不先插 → 漏子数组；位宽不足 → 高位误判</text>

  <rect x="288" y="294" width="204" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="390" y="311" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">节点数 ≤ n×30 + 1 ≈ 3×10⁶</text>
  <text x="390" y="327" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">答案上界 n(n+1)/2 ≈ 5×10⁹ 须 long long</text>

  <path d="M 130 88 L 130 104" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 130 150 L 130 166" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <path d="M 130 212 L 130 228" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 130 274 L 130 290" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <path d="M 236 315 L 260 315 L 260 253 L 284 253" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arro)" filter="url(#rough2)"/>

  <path d="M 390 230 L 390 154" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <path d="M 390 292 L 390 278" stroke="#888" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="260" y="360" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">n 个右端点 ×（查询 + 插入）各 30 层 → 总复杂度 O(n·log V)</text>
</svg>
