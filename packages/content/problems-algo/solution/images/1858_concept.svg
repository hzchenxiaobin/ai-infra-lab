<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="32" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    前缀完整性：每个前缀都必须在词典中
  </text>

  <text x="40" y="68" font-size="13" fill="#4a7a3a" filter="url(#rough2)">✓ apple 合法（所有前缀都在）</text>

  <rect x="30" y="82" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="52" y="104" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>

  <rect x="86" y="82" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="114" y="104" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">ap</text>

  <rect x="154" y="82" width="62" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="185" y="104" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">app</text>

  <rect x="228" y="82" width="72" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="264" y="104" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">appl</text>

  <rect x="312" y="82" width="82" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="353" y="104" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">apple ✓</text>

  <path d="M74,99 L86,99" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M142,99 L154,99" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M216,99 L228,99" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M300,99 L312,99" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="52" y="132" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">∈dict</text>
  <text x="114" y="132" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">∈dict</text>
  <text x="185" y="132" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">∈dict</text>
  <text x="264" y="132" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">∈dict</text>
  <text x="353" y="132" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">最长 ✓</text>

  <line x1="20" y1="160" x2="540" y2="160" stroke="#cccccc" stroke-width="1" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <text x="40" y="190" font-size="13" fill="#b85450" filter="url(#rough2)">✗ apply 虽长但需逐前缀检查</text>

  <rect x="30" y="205" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="52" y="227" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">a</text>

  <rect x="86" y="205" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="114" y="227" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">ap</text>

  <rect x="154" y="205" width="62" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="185" y="227" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">app</text>

  <rect x="228" y="205" width="72" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="264" y="227" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">appl</text>

  <rect x="312" y="205" width="82" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="353" y="227" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">apply</text>

  <path d="M74,222 L86,222" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M142,222 L154,222" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M216,222 L228,222" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M300,222 L312,222" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="353" y="255" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">等长 → 字典序 apple &lt; apply</text>

  <line x1="20" y1="275" x2="540" y2="275" stroke="#cccccc" stroke-width="1" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <text x="40" y="302" font-size="13" fill="#b85450" filter="url(#rough2)">✗ banana 不合法（前缀断裂）</text>

  <rect x="30" y="315" width="56" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="58" y="335" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b</text>

  <rect x="96" y="315" width="70" height="30" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.5" stroke-dasharray="3,3" rx="4" filter="url(#rough2)"/>
  <text x="131" y="335" text-anchor="middle" font-size="11" fill="#aaaaaa" filter="url(#rough2)">ba?</text>

  <rect x="176" y="315" width="84" height="30" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.5" stroke-dasharray="3,3" rx="4" filter="url(#rough2)"/>
  <text x="218" y="335" text-anchor="middle" font-size="11" fill="#aaaaaa" filter="url(#rough2)">ban?</text>

  <path d="M86,330 L96,330" stroke="#bbbbbb" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M166,330 L176,330" stroke="#bbbbbb" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="58" y="358" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">∉dict ✗</text>
  <text x="131" y="358" text-anchor="middle" font-size="10" fill="#aaaaaa" filter="url(#rough2)">断裂</text>
  <text x="218" y="358" text-anchor="middle" font-size="10" fill="#aaaaaa" filter="url(#rough2)">断裂</text>
</svg>
