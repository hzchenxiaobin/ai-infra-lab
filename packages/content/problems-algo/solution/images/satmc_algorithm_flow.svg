<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：质因子最后出现位置 + 右边界推进</text>

  <!-- start -->
  <g filter="url(#rough2)"><rect x="200" y="40" width="160" height="30" rx="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/></g>
  <text x="280" y="59" text-anchor="middle" font-size="11" fill="#7a5a20" font-weight="bold">输入 nums[0..n−1]，nums[i] ≤ 10⁶</text>

  <line x1="280" y1="70" x2="280" y2="86" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step1 SPF -->
  <g filter="url(#rough2)"><rect x="160" y="88" width="240" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/></g>
  <text x="280" y="106" text-anchor="middle" font-size="11.5" fill="#224466" font-weight="bold">① 线性筛求 SPF（到 max(nums)）</text>
  <text x="280" y="121" text-anchor="middle" font-size="9.5" fill="#888">O(maxV·log log maxV)，使分解质因数为 O(log x)</text>

  <line x1="280" y1="128" x2="280" y2="144" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step2 last -->
  <g filter="url(#rough2)"><rect x="130" y="146" width="300" height="46" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/></g>
  <text x="280" y="166" text-anchor="middle" font-size="11.5" fill="#3a5a2a" font-weight="bold">② 第一遍：分解每个 nums[j] 的质因子</text>
  <text x="280" y="183" text-anchor="middle" font-size="10.5" fill="#3a5a2a">记录 last[p] = j（质数 p 最后出现的下标）</text>

  <line x1="280" y1="192" x2="280" y2="208" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step3 scan -->
  <g filter="url(#rough2)"><rect x="100" y="210" width="360" height="50" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/></g>
  <text x="280" y="230" text-anchor="middle" font-size="11.5" fill="#7a5a20" font-weight="bold">③ 第二遍 i = 0 .. n−2：把 nums[i] 各质因子 p 的 last[p]</text>
  <text x="280" y="247" text-anchor="middle" font-size="11.5" fill="#7a5a20" font-weight="bold">取入更新 maxLast = max(maxLast, last[p])</text>

  <line x1="280" y1="260" x2="280" y2="276" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond -->
  <g filter="url(#rough2)"><polygon points="280,278 360,316 280,354 200,316" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="280" y="313" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">maxLast ≤ i ?</text>
  <text x="280" y="328" text-anchor="middle" font-size="9" fill="#b03a3a">(前缀质因子均未进后缀)</text>

  <!-- yes branch -->
  <line x1="360" y1="316" x2="430" y2="316" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="310" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <g filter="url(#rough2)"><rect x="430" y="302" width="118" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/></g>
  <text x="489" y="320" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">返回 i（最小有效）</text>

  <!-- no branch -> loop back -->
  <path d="M 200 316 L 60 316 L 60 235 L 100 235" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="0"/>
  <text x="100" y="308" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <text x="50" y="280" text-anchor="middle" font-size="9.5" fill="#b85450">i++ 继续</text>

  <!-- end -1 -->
  <line x1="280" y1="354" x2="280" y2="372" stroke="#666" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="368" font-size="9.5" fill="#888">遍历完无解</text>
  <g filter="url(#rough2)"><rect x="220" y="374" width="120" height="22" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/></g>
  <text x="280" y="390" text-anchor="middle" font-size="11" fill="#b03a3a" font-weight="bold">返回 −1</text>
</svg>
