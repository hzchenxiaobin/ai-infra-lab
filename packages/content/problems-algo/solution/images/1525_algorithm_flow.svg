<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：后缀预算 + 左扫比较</text>

  <!-- ===== 阶段一：预算 suffix 数组 ===== -->
  <rect x="40" y="44" width="480" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="60" y="66" font-size="12" fill="#4a7a3a" font-weight="bold">阶段一：从右向左预算 suffix[i]（右半不同字符数）</text>

  <rect x="60" y="78" width="200" height="34" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="160" y="99" text-anchor="middle" font-size="11" fill="#333">mask = 0</text>

  <path d="M 160 116 L 160 126" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环菱形 -->
  <polygon points="160,130 250,160 160,190 70,160" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="160" y="158" text-anchor="middle" font-size="11" fill="#333">i = n−1 ↓ 0</text>
  <text x="160" y="174" text-anchor="middle" font-size="10" fill="#888">逆序遍历</text>

  <!-- 循环体 -->
  <rect x="280" y="138" width="220" height="44" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="390" y="156" text-anchor="middle" font-size="11" fill="#333">mask |= 1 &lt;&lt; (s[i]−'a')</text>
  <text x="390" y="172" text-anchor="middle" font-size="11" fill="#333">suffix[i] = popcount(mask)</text>
  <path d="M 250 160 L 276 160" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 阶段二：左扫比较 ===== -->
  <rect x="40" y="180" width="480" height="200" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="60" y="202" font-size="12" fill="#446688" font-weight="bold">阶段二：从左向右扫描，维护左掩码并逐点比较</text>

  <rect x="60" y="214" width="200" height="34" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="160" y="235" text-anchor="middle" font-size="11" fill="#333">leftMask = 0, ans = 0</text>
  <path d="M 160 252 L 160 262" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环菱形 -->
  <polygon points="160,266 250,296 160,326 70,296" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="160" y="294" text-anchor="middle" font-size="11" fill="#333">i = 1 → n−1</text>
  <text x="160" y="310" text-anchor="middle" font-size="10" fill="#888">顺序遍历</text>

  <!-- 循环体：更新左掩码 -->
  <rect x="280" y="270" width="220" height="30" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="390" y="289" text-anchor="middle" font-size="11" fill="#333">leftMask |= 1 &lt;&lt; (s[i−1]−'a')</text>
  <path d="M 250 285 L 276 285" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="390,306 470,336 390,366 310,336" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="390" y="332" text-anchor="middle" font-size="10" fill="#333">popcount(leftMask)</text>
  <text x="390" y="346" text-anchor="middle" font-size="10" fill="#333">== suffix[i] ?</text>

  <!-- 是 → ans++ -->
  <path d="M 390 366 L 390 376" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="330" y="380" width="120" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="390" y="398" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">ans++</text>

  <!-- 返回 -->
  <path d="M 160 326 L 160 380" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="384" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="160" y="403" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return ans</text>

  <!-- 备注 -->
  <text x="280" y="438" text-anchor="middle" font-size="10" fill="#888">位掩码：26 个小写字母 → 26 bit 整数；popcount 数 1 的个数</text>
</svg>
