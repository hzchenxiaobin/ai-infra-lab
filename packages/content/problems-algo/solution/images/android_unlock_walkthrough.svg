<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：m=1, n=2，从起点 1 出发</text>

  <!-- ============ Top: grid at length 1 ============ -->
  <text x="30" y="56" font-size="12" fill="#444" font-weight="bold">长度 1：序列 [1]</text>

  <!-- mini grid 1 -->
  <g transform="translate(30,64)">
    <circle cx="30" cy="30" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="30" y="34" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
    <circle cx="70" cy="30" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="70" y="34" text-anchor="middle" font-size="12" fill="#333">2</text>
    <circle cx="110" cy="30" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="110" y="34" text-anchor="middle" font-size="12" fill="#333">3</text>
    <circle cx="30" cy="70" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="30" y="74" text-anchor="middle" font-size="12" fill="#333">4</text>
    <circle cx="70" cy="70" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="70" y="74" text-anchor="middle" font-size="12" fill="#333">5</text>
    <circle cx="110" cy="70" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="110" y="74" text-anchor="middle" font-size="12" fill="#333">6</text>
    <circle cx="30" cy="110" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="30" y="114" text-anchor="middle" font-size="12" fill="#333">7</text>
    <circle cx="70" cy="110" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="70" y="114" text-anchor="middle" font-size="12" fill="#333">8</text>
    <circle cx="110" cy="110" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="110" y="114" text-anchor="middle" font-size="12" fill="#333">9</text>
  </g>

  <rect x="190" y="110" width="80" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="230" y="126" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">计数 +1</text>
  <path d="M 170 122 L 188 122" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <text x="300" y="120" font-size="11" fill="#888">9 个起点各贡献 1 → 小计 9</text>

  <!-- ============ Bottom: length 2 from 1 ============ -->
  <text x="30" y="180" font-size="12" fill="#444" font-weight="bold">长度 2：从 [1] 尝试跳到每个 next</text>

  <!-- grid 2 with arrows from 1 -->
  <g transform="translate(30,190)">
    <!-- 1 is visited (green), others are candidates -->
    <circle cx="30" cy="30" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="30" y="34" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

    <!-- 2: valid -->
    <circle cx="70" cy="30" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="70" y="34" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
    <path d="M 44 30 L 56 30" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

    <!-- 3: invalid (skip=2 not visited) -->
    <circle cx="110" cy="30" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4,3" filter="url(#rough2)"/>
    <text x="110" y="34" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3✗</text>
    <path d="M 44 30 L 96 30" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4,3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

    <!-- 4: valid -->
    <circle cx="30" cy="70" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="30" y="74" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
    <path d="M 30 44 L 30 56" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

    <!-- 5: valid (diagonal, no midpoint on grid line... actually 1-9 has midpoint 5, but 1-5 itself has no midpoint) -->
    <circle cx="70" cy="70" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="70" y="74" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
    <path d="M 42 42 L 58 58" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

    <!-- 6: valid (1->6 no midpoint) -->
    <circle cx="110" cy="70" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="110" y="74" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
    <path d="M 44 44 L 96 56" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

    <!-- 7: invalid (skip=4 not visited) -->
    <circle cx="30" cy="110" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4,3" filter="url(#rough2)"/>
    <text x="30" y="114" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">7✗</text>
    <path d="M 30 44 L 30 96" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4,3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

    <!-- 8: valid -->
    <circle cx="70" cy="110" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="70" y="114" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">8</text>
    <path d="M 42 42 L 58 98" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

    <!-- 9: invalid (skip=5 not visited) -->
    <circle cx="110" cy="110" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4,3" filter="url(#rough2)"/>
    <text x="110" y="114" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">9✗</text>
    <path d="M 42 42 L 98 98" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4,3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  </g>

  <!-- Summary table on right -->
  <text x="360" y="190" font-size="12" fill="#444" font-weight="bold">从 [1] 出发的 8 个候选</text>

  <rect x="360" y="200" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="410" y="216" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">next</text>
  <rect x="460" y="200" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="510" y="216" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">结果</text>

  <g font-size="10" fill="#333">
    <rect x="360" y="224" width="100" height="20" fill="#fff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="410" y="238" text-anchor="middle">2</text>
    <rect x="460" y="224" width="100" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="510" y="238" text-anchor="middle" fill="#4a7a3a">合法 ✓</text>

    <rect x="360" y="244" width="100" height="20" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="410" y="258" text-anchor="middle">3</text>
    <rect x="460" y="244" width="100" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="510" y="258" text-anchor="middle" fill="#b85450">剪枝 (mid=2)</text>

    <rect x="360" y="264" width="100" height="20" fill="#fff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="410" y="278" text-anchor="middle">4</text>
    <rect x="460" y="264" width="100" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="510" y="278" text-anchor="middle" fill="#4a7a3a">合法 ✓</text>

    <rect x="360" y="284" width="100" height="20" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="410" y="298" text-anchor="middle">5</text>
    <rect x="460" y="284" width="100" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="510" y="298" text-anchor="middle" fill="#4a7a3a">合法 ✓</text>

    <rect x="360" y="304" width="100" height="20" fill="#fff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="410" y="318" text-anchor="middle">6</text>
    <rect x="460" y="304" width="100" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="510" y="318" text-anchor="middle" fill="#4a7a3a">合法 ✓</text>

    <rect x="360" y="324" width="100" height="20" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="410" y="338" text-anchor="middle">7</text>
    <rect x="460" y="324" width="100" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="510" y="338" text-anchor="middle" fill="#b85450">剪枝 (mid=4)</text>

    <rect x="360" y="344" width="100" height="20" fill="#fff" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="410" y="358" text-anchor="middle">8</text>
    <rect x="460" y="344" width="100" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="510" y="358" text-anchor="middle" fill="#4a7a3a">合法 ✓</text>

    <rect x="360" y="364" width="100" height="20" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="410" y="378" text-anchor="middle">9</text>
    <rect x="460" y="364" width="100" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
    <text x="510" y="378" text-anchor="middle" fill="#b85450">剪枝 (mid=5)</text>
  </g>

  <!-- Summary -->
  <rect x="360" y="396" width="200" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="460" y="414" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">合法 5 个 + 剪枝 3 个</text>
  <text x="460" y="430" text-anchor="middle" font-size="10" fill="#888">从点 1 出发长度 2 的序列数 = 5</text>

  <text x="320" y="464" text-anchor="middle" font-size="11" fill="#888">汇总：9（长度1）+ 56（长度2，9 个起点合计）= 65 ✓</text>
</svg>
