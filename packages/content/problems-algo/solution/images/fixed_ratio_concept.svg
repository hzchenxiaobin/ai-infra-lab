<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="580" height="360" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：比率条件压成「前缀 F 相等」，相等值配对即合法子串</text>

  <text x="83" y="30" font-size="11" fill="#888">s = "0111010"，num1=2，num2=3　│　ΔF：'0' → +num2(+3)，'1' → −num1(−2)</text>

  <!-- s row -->
  <rect x="111" y="36" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="134" y="55" text-anchor="middle" font-size="14" fill="#333">0</text>
  <rect x="163" y="36" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="55" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="215" y="36" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="238" y="55" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="267" y="36" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="55" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="319" y="36" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="342" y="55" text-anchor="middle" font-size="14" fill="#333">0</text>
  <rect x="371" y="36" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="394" y="55" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="423" y="36" width="46" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="446" y="55" text-anchor="middle" font-size="14" fill="#333">0</text>

  <!-- delta labels -->
  <text x="134" y="70" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">+3</text>
  <text x="186" y="70" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">−2</text>
  <text x="238" y="70" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">−2</text>
  <text x="290" y="70" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">−2</text>
  <text x="342" y="70" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">+3</text>
  <text x="394" y="70" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">−2</text>
  <text x="446" y="70" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">+3</text>

  <!-- F row -->
  <rect x="83" y="76" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="108" y="98" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">0</text>
  <rect x="135" y="76" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="98" text-anchor="middle" font-size="14" fill="#333">3</text>
  <rect x="187" y="76" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="212" y="98" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="239" y="76" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="264" y="98" text-anchor="middle" font-size="14" fill="#333">−1</text>
  <rect x="291" y="76" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="316" y="98" text-anchor="middle" font-size="14" fill="#333">−3</text>
  <rect x="343" y="76" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="368" y="98" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">0</text>
  <rect x="395" y="76" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="98" text-anchor="middle" font-size="14" fill="#333">−2</text>
  <rect x="447" y="76" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="472" y="98" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>

  <text x="74" y="98" text-anchor="end" font-size="11" fill="#888">F(i)</text>

  <!-- bracket 1: F0 == F5 == 0 -> substring s[0..4] -->
  <path d="M108 114 L108 124 L368 124 L368 114" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="238" y="138" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold">F(0)=F(5)=0 ⟹ 子串 s[0..4]="01110"，0:1=2:3 ✓</text>

  <!-- bracket 2: F2 == F7 == 1 -> substring s[2..6] -->
  <path d="M212 146 L212 156 L472 156 L472 146" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="342" y="170" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">F(2)=F(7)=1 ⟹ 子串 s[2..6]="11010"，0:1=2:3 ✓</text>

  <!-- formula box -->
  <rect x="40" y="186" width="500" height="152" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="208" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">把比率条件翻译成前缀相等</text>
  <text x="56" y="230" font-size="12" fill="#333">设 Z[i]、O[i] = 前 i 个字符中 0、1 的个数，定义 F(i) = num2·Z[i] − num1·O[i]</text>
  <text x="56" y="250" font-size="12" fill="#333">子串 s[l..r−1]：c0 = Z[r]−Z[l]，c1 = O[r]−O[l]</text>
  <text x="56" y="270" font-size="12" fill="#333">c0:c1 = num1:num2 ⟺ num2·c0 = num1·c1 ⟺ F(r) = F(l)</text>
  <rect x="80" y="288" width="420" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="310" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">⟹ 统计 F 序列中「相等值配对数」即为固定比率子串数</text>
</svg>
