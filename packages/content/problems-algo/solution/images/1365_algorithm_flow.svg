<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：频次计数法 O(n+k)</text>

  <!-- Step 1: build frequency array -->
  <rect x="100" y="48" width="320" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="68" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">① 建频次数组</text>
  <text x="260" y="84" text-anchor="middle" font-size="11" fill="#555">for v in nums: count[v] += 1</text>
  <text x="260" y="98" text-anchor="middle" font-size="10" fill="#888">遍历一次，统计每个值出现次数</text>

  <!-- arrow down -->
  <path d="M 260 110 L 260 128" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 2: prefix sum -->
  <rect x="100" y="130" width="320" height="58" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="150" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">② 前缀和</text>
  <text x="260" y="166" text-anchor="middle" font-size="11" fill="#555">for v in 1..100: smaller[v] = smaller[v-1] + count[v-1]</text>
  <text x="260" y="180" text-anchor="middle" font-size="10" fill="#888">smaller[v] = 值严格小于 v 的元素总数</text>

  <!-- arrow down -->
  <path d="M 260 192 L 260 210" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 3: query -->
  <rect x="100" y="212" width="320" height="58" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="232" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">③ 查表填答案</text>
  <text x="260" y="248" text-anchor="middle" font-size="11" fill="#555">for i in 0..n-1: answer[i] = smaller[nums[i]]</text>
  <text x="260" y="262" text-anchor="middle" font-size="10" fill="#888">每个元素 O(1) 查表，无需逐个比较</text>

  <!-- arrow down -->
  <path d="M 260 274 L 260 292" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 4: return -->
  <rect x="180" y="294" width="160" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="312" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">④ 返回 answer</text>
  <text x="260" y="328" text-anchor="middle" font-size="10" fill="#888">结束</text>

  <!-- complexity note -->
  <rect x="40" y="356" width="440" height="68" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="260" y="376" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">复杂度分析</text>
  <text x="260" y="394" text-anchor="middle" font-size="11" fill="#666">① O(n) 遍历 + ② O(k) 前缀和 + ③ O(n) 查表</text>
  <text x="260" y="410" text-anchor="middle" font-size="11" fill="#666">总计 O(n+k)，空间 O(k)，k=101（值域 0..100）</text>
  <text x="260" y="424" text-anchor="middle" font-size="10" fill="#888">n≤500, k=101 ⇒ 远优于暴力 O(n²)</text>
</svg>
