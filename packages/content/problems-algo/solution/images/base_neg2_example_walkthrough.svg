<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：位运算法逐步转换</text>

  <!-- ===== Case A: n = 2 ===== -->
  <text x="40" y="56" font-size="12" fill="#446688" font-weight="bold">Case A：n = 2 → "110"</text>

  <!-- table header -->
  <rect x="40" y="64" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="70" y="80" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">轮次</text>
  <rect x="100" y="64" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="145" y="80" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">r = n &amp; 1</text>
  <rect x="190" y="64" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="250" y="80" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">n = −(n &gt;&gt; 1)</text>
  <rect x="310" y="64" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="360" y="80" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">res</text>
  <rect x="410" y="64" width="110" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="465" y="80" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">验证</text>

  <!-- row 1: n=2 -->
  <rect x="40" y="90" width="60" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="107" text-anchor="middle" font-size="11" fill="#555">①</text>
  <rect x="100" y="90" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="145" y="107" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2 &amp; 1 = 0</text>
  <rect x="190" y="90" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="250" y="107" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">−(2&gt;&gt;1) = −1</text>
  <rect x="310" y="90" width="100" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="360" y="107" text-anchor="middle" font-size="11" fill="#555">[0]</text>
  <rect x="410" y="90" width="110" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="465" y="107" text-anchor="middle" font-size="10" fill="#888">继续</text>

  <!-- row 2: n=-1 -->
  <rect x="40" y="118" width="60" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="135" text-anchor="middle" font-size="11" fill="#555">②</text>
  <rect x="100" y="118" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="145" y="135" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">−1 &amp; 1 = 1</text>
  <rect x="190" y="118" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="250" y="135" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">−(−1&gt;&gt;1) = 1</text>
  <rect x="310" y="118" width="100" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="360" y="135" text-anchor="middle" font-size="11" fill="#555">[0, 1]</text>
  <rect x="410" y="118" width="110" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="465" y="135" text-anchor="middle" font-size="10" fill="#888">继续</text>

  <!-- row 3: n=1 -->
  <rect x="40" y="146" width="60" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="163" text-anchor="middle" font-size="11" fill="#555">③</text>
  <rect x="100" y="146" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="145" y="163" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1 &amp; 1 = 1</text>
  <rect x="190" y="146" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="250" y="163" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">−(1&gt;&gt;1) = 0</text>
  <rect x="310" y="146" width="100" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="360" y="163" text-anchor="middle" font-size="11" fill="#555">[0, 1, 1]</text>
  <rect x="410" y="146" width="110" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="465" y="163" text-anchor="middle" font-size="10" fill="#4a7a3a">n=0 停</text>

  <!-- result -->
  <path d="M 360 174 L 360 186" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="250" y="188" width="220" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="360" y="206" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">反转 [0,1,1] → "110" → 4−2+0=2 ✓</text>

  <!-- ===== Case B: n = 3 ===== -->
  <text x="40" y="236" font-size="12" fill="#446688" font-weight="bold">Case B：n = 3 → "111"</text>

  <!-- table header -->
  <rect x="40" y="244" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="70" y="260" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">轮次</text>
  <rect x="100" y="244" width="90" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="145" y="260" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">r = n &amp; 1</text>
  <rect x="190" y="244" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="250" y="260" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">n = −(n &gt;&gt; 1)</text>
  <rect x="310" y="244" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="360" y="260" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">res</text>
  <rect x="410" y="244" width="110" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="465" y="260" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">验证</text>

  <!-- row 1: n=3 -->
  <rect x="40" y="270" width="60" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="287" text-anchor="middle" font-size="11" fill="#555">①</text>
  <rect x="100" y="270" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="145" y="287" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3 &amp; 1 = 1</text>
  <rect x="190" y="270" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="250" y="287" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">−(3&gt;&gt;1) = −1</text>
  <rect x="310" y="270" width="100" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="360" y="287" text-anchor="middle" font-size="11" fill="#555">[1]</text>
  <rect x="410" y="270" width="110" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="465" y="287" text-anchor="middle" font-size="10" fill="#888">继续</text>

  <!-- row 2: n=-1 -->
  <rect x="40" y="298" width="60" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="315" text-anchor="middle" font-size="11" fill="#555">②</text>
  <rect x="100" y="298" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="145" y="315" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">−1 &amp; 1 = 1</text>
  <rect x="190" y="298" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="250" y="315" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">−(−1&gt;&gt;1) = 1</text>
  <rect x="310" y="298" width="100" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="360" y="315" text-anchor="middle" font-size="11" fill="#555">[1, 1]</text>
  <rect x="410" y="298" width="110" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="465" y="315" text-anchor="middle" font-size="10" fill="#888">继续</text>

  <!-- row 3: n=1 -->
  <rect x="40" y="326" width="60" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="343" text-anchor="middle" font-size="11" fill="#555">③</text>
  <rect x="100" y="326" width="90" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="145" y="343" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1 &amp; 1 = 1</text>
  <rect x="190" y="326" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="250" y="343" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">−(1&gt;&gt;1) = 0</text>
  <rect x="310" y="326" width="100" height="26" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="360" y="343" text-anchor="middle" font-size="11" fill="#555">[1, 1, 1]</text>
  <rect x="410" y="326" width="110" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="465" y="343" text-anchor="middle" font-size="10" fill="#4a7a3a">n=0 停</text>

  <!-- result -->
  <path d="M 360 354 L 360 366" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="250" y="368" width="220" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="360" y="386" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">反转 [1,1,1] → "111" → 4−2+1=3 ✓</text>

  <!-- ===== bottom note ===== -->
  <rect x="40" y="410" width="480" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="428" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">关键：n 经过负数中间态（n=−1），但 n&amp;1 仍给出正确余数</text>
  <text x="280" y="442" text-anchor="middle" font-size="10.5" fill="#555">−(n&gt;&gt;1) 自动完成「除以 −2」+「负余数修正」，无需额外 if</text>
</svg>
