<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrGrey" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#888"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="430" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：枚举末两位对 + 两个兜底</text>

  <!-- start box -->
  <rect x="80" y="44" width="250" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="205" y="71" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">初始化 ans = n（全删 → 0 兜底）</text>
  <path d="M 205 88 L 205 108" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arrGrey)" filter="url(#rough2)"/>

  <!-- diamond 1 -->
  <polygon points="205,110 300,146 205,182 110,146" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="205" y="151" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">num 中有 '0'？</text>
  <text x="322" y="140" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 300 146 L 346 146" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arrGrey)" filter="url(#rough2)"/>

  <!-- side box 1 -->
  <rect x="350" y="122" width="215" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="457" y="141" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">ans = min(ans, n − 1)</text>
  <text x="457" y="160" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">（只留一个 '0'）</text>
  <path d="M 457 170 L 457 190 L 213 190" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrGreen)" filter="url(#rough2)"/>

  <text x="216" y="182" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 205 182 L 205 198" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arrGrey)" filter="url(#rough2)"/>

  <!-- enumerate box -->
  <rect x="80" y="200" width="250" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="205" y="227" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">双重循环枚举下标对 i &lt; j</text>
  <path d="M 205 244 L 205 262" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arrGrey)" filter="url(#rough2)"/>

  <!-- diamond 2 -->
  <polygon points="205,264 315,300 205,336 95,300" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="205" y="296" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">num[i]×10 + num[j]</text>
  <text x="205" y="314" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">∈ {00, 25, 50, 75}？</text>
  <text x="336" y="292" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 315 300 L 356 300" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arrGrey)" filter="url(#rough2)"/>

  <!-- side box 2 -->
  <rect x="360" y="276" width="205" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="462" y="295" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">ans = min(ans, n − i − 2)</text>
  <text x="462" y="314" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">（代价只与 i 有关）</text>
  <path d="M 462 276 L 462 224 L 336 224" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="470" y="252" text-anchor="start" font-size="10" fill="#4a7a3a" filter="url(#rough2)">换下一对</text>

  <text x="218" y="350" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否（或枚举完毕）</text>
  <path d="M 205 336 L 205 356" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arrGrey)" filter="url(#rough2)"/>

  <!-- end box -->
  <rect x="80" y="358" width="250" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="205" y="385" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans</text>
</svg>
