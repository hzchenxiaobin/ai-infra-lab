<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrc" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8899aa"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">一条查询 (u, v) 的处理流程</text>

  <!-- 开始 -->
  <rect x="185" y="38" width="150" height="30" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="58" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">取下一条查询 (u, v)</text>
  <path d="M 260 68 L 260 84" stroke="#8899aa" stroke-width="2" fill="none" marker-end="url(#arrc)" filter="url(#rough2)"/>

  <!-- 判断 1 -->
  <polygon points="260,86 352,122 260,158 168,122" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="118" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">find(u) == u ?</text>
  <text x="260" y="134" text-anchor="middle" font-size="9" fill="#8a6a20" filter="url(#rough2)">（u 未被跳过？）</text>

  <!-- 否 → 情形 A -->
  <path d="M 352 122 L 384 122" stroke="#8899aa" stroke-width="2" fill="none" marker-end="url(#arrc)" filter="url(#rough2)"/>
  <text x="364" y="112" font-size="9.5" fill="#888" filter="url(#rough2)">否</text>
  <rect x="388" y="104" width="120" height="44" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="448" y="122" text-anchor="middle" font-size="10" fill="#8a3a34" filter="url(#rough2)">(u,v) 被包含</text>
  <text x="448" y="138" text-anchor="middle" font-size="10" fill="#8a3a34" filter="url(#rough2)">极大集合不变</text>
  <path d="M 448 148 L 448 164" stroke="#8899aa" stroke-width="2" fill="none" marker-end="url(#arrc)" filter="url(#rough2)"/>

  <!-- 记答案 -->
  <rect x="388" y="168" width="120" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="448" y="188" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">ans ← n−1−skipped</text>

  <!-- 是 → x = find(u+1) -->
  <path d="M 260 158 L 260 172" stroke="#8899aa" stroke-width="2" fill="none" marker-end="url(#arrc)" filter="url(#rough2)"/>
  <text x="268" y="168" font-size="9.5" fill="#888" filter="url(#rough2)">是</text>
  <rect x="185" y="176" width="150" height="28" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="195" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">x ← find(u+1)</text>
  <path d="M 260 204 L 260 218" stroke="#8899aa" stroke-width="2" fill="none" marker-end="url(#arrc)" filter="url(#rough2)"/>

  <!-- 判断 2 -->
  <polygon points="260,220 352,254 260,288 168,254" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="250" text-anchor="middle" font-size="11" fill="#8a6a20" font-weight="bold" filter="url(#rough2)">x &lt; v ?</text>
  <text x="260" y="265" text-anchor="middle" font-size="9" fill="#8a6a20" filter="url(#rough2)">（还没跳到 v？）</text>

  <!-- 否 → 记答案 -->
  <path d="M 352 254 L 448 254 L 448 202" stroke="#8899aa" stroke-width="2" fill="none" marker-end="url(#arrc)" filter="url(#rough2)"/>
  <text x="366" y="246" font-size="9.5" fill="#888" filter="url(#rough2)">否（到 v 了）</text>

  <!-- 是 → 吸收 -->
  <path d="M 260 288 L 260 302" stroke="#8899aa" stroke-width="2" fill="none" marker-end="url(#arrc)" filter="url(#rough2)"/>
  <text x="268" y="300" font-size="9.5" fill="#888" filter="url(#rough2)">是</text>
  <rect x="150" y="306" width="220" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="322" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">吸收 x：skipped++，fa[x] ← x+1</text>
  <text x="260" y="338" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">再 x ← find(x+1)</text>

  <!-- 循环回边 -->
  <path d="M 150 326 L 108 326 L 108 254 L 164 254" stroke="#8899aa" stroke-width="2" fill="none" marker-end="url(#arrc)" filter="url(#rough2)"/>
  <text x="112" y="244" font-size="9.5" fill="#888" filter="url(#rough2)">循环</text>

  <!-- 右下注记 -->
  <text x="448" y="230" font-size="9.5" fill="#a07830" text-anchor="middle" filter="url(#rough2)">两种情形共用记答案：</text>
  <text x="448" y="244" font-size="9.5" fill="#a07830" text-anchor="middle" filter="url(#rough2)">skipped 不变则答案不变</text>
</svg>
