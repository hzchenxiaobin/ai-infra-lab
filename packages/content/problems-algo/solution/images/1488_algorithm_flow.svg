<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="540" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：贪心 + 小顶堆</text>

  <!-- 1. preprocess -->
  <rect x="160" y="44" width="280" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="300" y="63" text-anchor="middle" font-size="11" fill="#333">预处理 nxt[i]：从右向左扫描</text>
  <text x="300" y="79" text-anchor="middle" font-size="10" fill="#555">nxt[i] = 湖泊 rains[i] 在 i 之后下一次降雨日</text>
  <path d="M300,90 L300,110" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. loop -->
  <rect x="220" y="112" width="160" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="300" y="133" text-anchor="middle" font-size="11" fill="#333">for i = 0 .. n−1</text>
  <path d="M300,146 L300,166" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. decision diamond: rains[i]==0 ? -->
  <polygon points="300,168 410,214 300,260 190,214" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="210" text-anchor="middle" font-size="11" fill="#333">rains[i] == 0 ?</text>
  <text x="300" y="224" text-anchor="middle" font-size="11" fill="#333">(干涰日)</text>

  <!-- Yes branch (left) -->
  <text x="170" y="206" text-anchor="middle" font-size="11" fill="#4a7a3a">是</text>
  <path d="M190,214 L120,214 L120,290" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- diamond: heap empty? -->
  <polygon points="120,290 200,324 120,358 40,324" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="120" y="320" text-anchor="middle" font-size="11" fill="#333">堆非空 ?</text>
  <text x="120" y="334" text-anchor="middle" font-size="11" fill="#333">(有满水湖)</text>

  <!-- heap empty -> ans=1 -->
  <text x="148" y="392" text-anchor="middle" font-size="10" fill="#888">否</text>
  <path d="M40,324 L24,324 L24,400 L60,400" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="60" y="386" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="120" y="408" text-anchor="middle" font-size="10" fill="#333">ans[i] = 1（占位）</text>

  <!-- heap not empty -> pop -->
  <text x="200" y="372" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>
  <path d="M200,324 L236,324 L236,400 L200,400" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="200" y="386" width="170" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="285" y="403" text-anchor="middle" font-size="10" fill="#333">弹堆顶 L；ans[i]=L</text>
  <text x="285" y="415" text-anchor="middle" font-size="10" fill="#333">满集合移除 L</text>

  <!-- No branch (right): rain day -->
  <text x="430" y="206" text-anchor="middle" font-size="11" fill="#b85450">否(降雨)</text>
  <path d="M410,214 L480,214 L480,290" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <polygon points="480,290 560,324 480,358 400,324" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="480" y="320" text-anchor="middle" font-size="11" fill="#333">湖 L 已满 ?</text>

  <!-- L full -> return [] -->
  <text x="408" y="372" text-anchor="middle" font-size="10" fill="#b85450">是</text>
  <path d="M560,324 L576,324 L576,400 L540,400" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="430" y="386" width="110" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="485" y="408" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">返回 []</text>

  <!-- L not full -> fill -->
  <text x="452" y="392" text-anchor="middle" font-size="10" fill="#4a7a3a">否</text>
  <path d="M400,324 L364,324 L364,400 L400,400" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="400" y="386" width="170" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="485" y="403" text-anchor="middle" font-size="10" fill="#333">ans[i]=−1；满集合.add(L)</text>
  <text x="485" y="418" text-anchor="middle" font-size="10" fill="#333">nxt[i]&lt;n 则 push(nxt[i],L)</text>

  <!-- loop back arrow -->
  <path d="M120,420 L120,128 L216,128" stroke="#446688" stroke-width="1.4" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="448" text-anchor="middle" font-size="9" fill="#888">循环结束</text>

  <!-- end -->
  <path d="M300,470 L300,486" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="220" y="488" width="160" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="300" y="510" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">返回 ans</text>
</svg>
