<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：[[1,2],[2,3],[3,4],[4,5]] → true</text>

  <!-- baseline note -->
  <rect x="30" y="42" width="460" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="63" text-anchor="middle" font-size="12" fill="#333">基准 p0=(1,2)、p1=(2,3) → dx = 1，dy = 1</text>

  <!-- ===== Table ===== -->
  <!-- header row -->
  <rect x="30" y="92" width="460" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="112" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">i</text>
  <text x="160" y="112" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">point (xi,yi)</text>
  <text x="280" y="112" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">(xi−x0, yi−y0)</text>
  <text x="410" y="112" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">cross</text>

  <!-- row i=2 -->
  <rect x="30" y="122" width="460" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="144" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="160" y="144" text-anchor="middle" font-size="12" fill="#333">(3, 4)</text>
  <text x="280" y="144" text-anchor="middle" font-size="12" fill="#333">(2, 2)</text>
  <text x="410" y="144" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1·2 − 1·2 = 0 ✅</text>

  <!-- row i=3 -->
  <rect x="30" y="156" width="460" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="70" y="178" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="160" y="178" text-anchor="middle" font-size="12" fill="#333">(4, 5)</text>
  <text x="280" y="178" text-anchor="middle" font-size="12" fill="#333">(3, 3)</text>
  <text x="410" y="178" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1·3 − 1·3 = 0 ✅</text>

  <!-- ===== Small coordinate plot on the right ===== -->
  <text x="30" y="216" font-size="11" fill="#888">坐标视图（4 点在同一直线 y = x + 1 上）</text>

  <!-- axes -->
  <path d="M 40 320 L 220 320" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 40 320 L 40 230" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="224" y="324" font-size="10" fill="#888">x</text>
  <text x="36" y="226" font-size="10" fill="#888">y</text>

  <!-- the line y=x+1 in screen coords: map (x,y)-> (40+x*40, 320-y*40) -->
  <!-- at x=0,y=1 -> (40,280); x=5,y=6 -> (240,80). clip within -->
  <path d="M 40 280 L 220 120" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>

  <!-- points: (1,2)->(80,240); (2,3)->(120,200); (3,4)->(160,160); (4,5)->(200,120) -->
  <circle cx="80" cy="240" r="6" fill="#446688" filter="url(#rough2)"/>
  <text x="86" y="238" font-size="10" fill="#333" font-weight="bold">p0(1,2)</text>
  <circle cx="120" cy="200" r="6" fill="#446688" filter="url(#rough2)"/>
  <text x="126" y="198" font-size="10" fill="#333" font-weight="bold">p1(2,3)</text>
  <circle cx="160" cy="160" r="6" fill="#d6a040" filter="url(#rough2)"/>
  <text x="166" y="158" font-size="10" fill="#333" font-weight="bold">p2(3,4)</text>
  <circle cx="200" cy="120" r="6" fill="#d6a040" filter="url(#rough2)"/>
  <text x="166" y="112" font-size="10" fill="#333" font-weight="bold">p3(4,5)</text>

  <!-- ===== Result box ===== -->
  <rect x="270" y="210" width="220" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="380" y="234" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">所有点 cross 均为 0</text>
  <text x="380" y="254" text-anchor="middle" font-size="11" fill="#666">→ 向量 p0→pᵢ 与 p0→p1 始终平行</text>
  <text x="380" y="272" text-anchor="middle" font-size="11" fill="#666">→ 全部落在同一直线上</text>
  <rect x="320" y="284" width="120" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="380" y="306" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">返回 true</text>

  <!-- foot note -->
  <text x="260" y="356" text-anchor="middle" font-size="11" fill="#888">对比示例 2 [[1,1],[2,2],[3,4]…]：到 (3,4) 时 cross = 1·3 − 1·2 = 1 ≠ 0 → false</text>
</svg>
