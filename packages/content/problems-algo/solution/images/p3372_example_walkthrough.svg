<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 415"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="415" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">示例演算（示例 1，k = 2）</text>
  <text x="260" y="38" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">树 1：[[0,1],[0,2],[2,3],[2,4]]　　树 2：[[0,1],[0,2],[0,3],[2,7],[1,4],[4,5],[4,6]]</text>

