  <text x="425" y="132" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">u=1 离 3、4 都要 3 步，</text>
  <text x="425" y="146" text-anchor="middle" font-size="8.5" fill="#666" filter="url(#rough2)">超预算，只覆盖 3 个点</text>

