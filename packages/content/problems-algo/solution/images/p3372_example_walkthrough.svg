  <text x="30" y="322" text-anchor="start" font-size="8.5" fill="#666" filter="url(#rough2)">节点 0 覆盖 {0,1,2,3}，节点 4 覆盖 {4,1,5,6} —— 都是 4 个，桥墩二选一即可</text>

