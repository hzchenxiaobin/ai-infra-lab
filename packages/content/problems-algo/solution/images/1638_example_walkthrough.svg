<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s="abe", t="bbc"（输出 10）</text>

  <!-- strings -->
  <text x="40" y="62" font-size="11" fill="#446688" font-weight="bold">s =</text>
  <g filter="url(#rough2)">
    <rect x="70"  y="48" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="90"  y="67" text-anchor="middle" font-size="13" fill="#333">a</text>
    <rect x="110" y="48" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="130" y="67" text-anchor="middle" font-size="13" fill="#333">b</text>
    <rect x="150" y="48" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="170" y="67" text-anchor="middle" font-size="13" fill="#333">e</text>
  </g>
  <text x="200" y="62" font-size="10" fill="#888">下标 0 1 2</text>

  <text x="40" y="98" font-size="11" fill="#4a7a3a" font-weight="bold">t =</text>
  <g filter="url(#rough2)">
    <rect x="70"  y="84" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="90"  y="103" text-anchor="middle" font-size="13" fill="#333">b</text>
    <rect x="110" y="84" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="130" y="103" text-anchor="middle" font-size="13" fill="#333">b</text>
    <rect x="150" y="84" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="170" y="103" text-anchor="middle" font-size="13" fill="#333">c</text>
  </g>
  <text x="200" y="98" font-size="10" fill="#888">下标 0 1 2</text>

  <!-- table header -->
  <text x="30" y="138" font-size="12" fill="#555" font-weight="bold">差异位 (p,q)：s[p] ≠ t[q]，共 7 处</text>

  <g filter="url(#rough2)">
    <rect x="30" y="148" width="540" height="26" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="60"  y="166" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">(p,q)</text>
    <text x="120" y="166" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">s[p]/t[q]</text>
    <text x="210" y="166" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">left=lcs[p-1][q-1]</text>
    <text x="330" y="166" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">right=lcp[p+1][q+1]</text>
    <text x="450" y="166" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">(left+1)×(right+1)</text>
    <text x="540" y="166" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">贡献</text>
  </g>

  <!-- rows -->
  <g filter="url(#rough2)" font-size="11" fill="#333">
    <rect x="30" y="174" width="540" height="24" fill="#fafafa" stroke="#ddd" stroke-width="0.8" rx="2"/>
    <text x="60"  y="190" text-anchor="middle">(0,0)</text>
    <text x="120" y="190" text-anchor="middle">a / b</text>
    <text x="210" y="190" text-anchor="middle" fill="#4a7a3a">0</text>
    <text x="330" y="190" text-anchor="middle" fill="#446688">1</text>
    <text x="450" y="190" text-anchor="middle" fill="#d6a040">1×2</text>
    <text x="540" y="190" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>

    <rect x="30" y="198" width="540" height="24" fill="#fff" stroke="#ddd" stroke-width="0.8" rx="2"/>
    <text x="60"  y="214" text-anchor="middle">(0,1)</text>
    <text x="120" y="214" text-anchor="middle">a / b</text>
    <text x="210" y="214" text-anchor="middle" fill="#4a7a3a">0</text>
    <text x="330" y="214" text-anchor="middle" fill="#446688">0</text>
    <text x="450" y="214" text-anchor="middle" fill="#d6a040">1×1</text>
    <text x="540" y="214" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>

    <rect x="30" y="222" width="540" height="24" fill="#fafafa" stroke="#ddd" stroke-width="0.8" rx="2"/>
    <text x="60"  y="238" text-anchor="middle">(0,2)</text>
    <text x="120" y="238" text-anchor="middle">a / c</text>
    <text x="210" y="238" text-anchor="middle" fill="#4a7a3a">0</text>
    <text x="330" y="238" text-anchor="middle" fill="#446688">0</text>
    <text x="450" y="238" text-anchor="middle" fill="#d6a040">1×1</text>
    <text x="540" y="238" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>

    <rect x="30" y="246" width="540" height="24" fill="#fff" stroke="#ddd" stroke-width="0.8" rx="2"/>
    <text x="60"  y="262" text-anchor="middle">(1,2)</text>
    <text x="120" y="262" text-anchor="middle">b / c</text>
    <text x="210" y="262" text-anchor="middle" fill="#4a7a3a">0</text>
    <text x="330" y="262" text-anchor="middle" fill="#446688">0</text>
    <text x="450" y="262" text-anchor="middle" fill="#d6a040">1×1</text>
    <text x="540" y="262" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>

    <rect x="30" y="270" width="540" height="24" fill="#fafafa" stroke="#ddd" stroke-width="0.8" rx="2"/>
    <text x="60"  y="286" text-anchor="middle">(2,0)</text>
    <text x="120" y="286" text-anchor="middle">e / b</text>
    <text x="210" y="286" text-anchor="middle" fill="#4a7a3a">0</text>
    <text x="330" y="286" text-anchor="middle" fill="#446688">0</text>
    <text x="450" y="286" text-anchor="middle" fill="#d6a040">1×1</text>
    <text x="540" y="286" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>

    <rect x="30" y="294" width="540" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2"/>
    <text x="60"  y="310" text-anchor="middle">(2,1)</text>
    <text x="120" y="310" text-anchor="middle">e / b</text>
    <text x="210" y="310" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="330" y="310" text-anchor="middle" fill="#446688">0</text>
    <text x="450" y="310" text-anchor="middle" fill="#d6a040">2×1</text>
    <text x="540" y="310" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>

    <rect x="30" y="318" width="540" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2"/>
    <text x="60"  y="334" text-anchor="middle">(2,2)</text>
    <text x="120" y="334" text-anchor="middle">e / c</text>
    <text x="210" y="334" text-anchor="middle" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="330" y="334" text-anchor="middle" fill="#446688">0</text>
    <text x="450" y="334" text-anchor="middle" fill="#d6a040">2×1</text>
    <text x="540" y="334" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
  </g>

  <!-- annotation for (2,1) -->
  <rect x="30" y="352" width="540" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="50" y="372" font-size="11" fill="#4a7a3a" font-weight="bold">以 (2,1) 为例：</text>
  <text x="50" y="388" font-size="10" fill="#444">左侧 s[1]=b == t[0]=b → left=1；右侧越界 → right=0；故 (1+1)×(0+1)=2 对：{"eb","bb"} 与 {"e","b"}</text>

  <!-- total -->
  <rect x="180" y="412" width="240" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="432" text-anchor="middle" font-size="12" fill="#555">总和 ans</text>
  <text x="300" y="450" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">2+1+1+1+1+2+2 = 10 ✓</text>
</svg>
