<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心思路：频次 &gt; 25% 的元素必覆盖某个四分位点</text>

  <!-- Array label -->
  <text x="36" y="102" font-size="12" fill="#888">有序数组</text>

  <!-- Array boxes: [1,2,2,6,6,6,6,7,10], 9 elements, box=44px, start x=80 -->
  <rect x="80" y="84" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="102" y="105" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="124" y="84" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="146" y="105" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="168" y="84" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="105" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="212" y="84" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="234" y="105" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">6</text>
  <rect x="256" y="84" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="278" y="105" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">6</text>
  <rect x="300" y="84" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="322" y="105" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">6</text>
  <rect x="344" y="84" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="366" y="105" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">6</text>
  <rect x="388" y="84" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="105" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">7</text>
  <rect x="432" y="84" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="454" y="105" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">10</text>

  <!-- Index labels -->
  <text x="102" y="132" text-anchor="middle" font-size="10" fill="#888">0</text>
  <text x="146" y="132" text-anchor="middle" font-size="10" fill="#888">1</text>
  <text x="190" y="132" text-anchor="middle" font-size="10" fill="#888">2</text>
  <text x="234" y="132" text-anchor="middle" font-size="10" fill="#888">3</text>
  <text x="278" y="132" text-anchor="middle" font-size="10" fill="#888">4</text>
  <text x="322" y="132" text-anchor="middle" font-size="10" fill="#888">5</text>
  <text x="366" y="132" text-anchor="middle" font-size="10" fill="#888">6</text>
  <text x="410" y="132" text-anchor="middle" font-size="10" fill="#888">7</text>
  <text x="454" y="132" text-anchor="middle" font-size="10" fill="#888">8</text>

  <!-- Quarter point markers (vertical dashed lines going up) -->
  <path d="M 190 64 L 190 80" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="190" y="58" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">n/4</text>
  <path d="M 278 64 L 278 80" stroke="#b85450" stroke-width="2.5" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="278" y="58" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">n/2 ←命中</text>
  <path d="M 366 64 L 366 80" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="366" y="58" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">3n/4</text>

  <!-- Block of 6s bracket below -->
  <path d="M 212 146 L 212 156 L 388 156 L 388 146" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="300" y="172" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">元素 6 的连续块（4 个 &gt; 9/4 = 2.25）</text>

  <!-- Explanation box -->
  <rect x="40" y="192" width="480" height="168" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="216" font-size="12" fill="#4a7a3a" font-weight="bold">为什么四分位点必命中？</text>
  <text x="56" y="238" font-size="11" fill="#444">将长度为 n 的数组等分为 4 段，每段恰好 n/4 个元素。</text>
  <text x="56" y="256" font-size="11" fill="#444">若某元素出现 &gt; n/4 次，其连续块长度 &gt; n/4，</text>
  <text x="56" y="274" font-size="11" fill="#444">不可能完全塞进某一段而不触及段边界——</text>
  <text x="56" y="292" font-size="11" fill="#444">因此该块必然覆盖至少一个四分位点（n/4、n/2、3n/4）。</text>
  <text x="56" y="314" font-size="11" fill="#b85450" font-weight="bold">只需检查这 3 个位置的元素，二分求频次即可。</text>
  <text x="56" y="340" font-size="10" fill="#888">图中 6 的块（下标 3-6）覆盖 n/2 处（下标 4），故 arr[4] = 6 即为答案。</text>
</svg>
