<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="#fafafa"/>

  <text x="320" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例 2 演算：5 次首末词命中 → 5 个新短语（共享词高亮）</text>

  <!-- column headers -->
  <text x="24" y="48" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">短语 i（末词）</text>
  <text x="268" y="48" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">短语 j（首词）</text>
  <text x="434" y="48" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">拼接结果</text>

  <!-- Row 1 -->
  <rect x="20" y="54" width="600" height="40" fill="#eef3fb" stroke="#dde6f0" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="24" y="78" font-size="11" fill="#333" filter="url(#rough2)">a chip off the old <tspan fill="#d6a040" font-weight="bold">block</tspan></text>
  <text x="252" y="78" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">+</text>
  <text x="268" y="78" font-size="11" fill="#333" filter="url(#rough2)"><tspan fill="#d6a040" font-weight="bold">block</tspan> party</text>
  <text x="416" y="78" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→</text>
  <text x="434" y="78" font-size="11" fill="#333" filter="url(#rough2)">a chip off the old <tspan fill="#d6a040" font-weight="bold">block</tspan> party</text>

  <!-- Row 2 -->
  <rect x="20" y="96" width="600" height="40" fill="#f7f7f7" stroke="#eee" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="24" y="120" font-size="11" fill="#333" filter="url(#rough2)">a man on a <tspan fill="#d6a040" font-weight="bold">mission</tspan></text>
  <text x="252" y="120" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">+</text>
  <text x="268" y="120" font-size="11" fill="#333" filter="url(#rough2)"><tspan fill="#d6a040" font-weight="bold">mission</tspan> impossible</text>
  <text x="416" y="120" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→</text>
  <text x="434" y="120" font-size="11" fill="#333" filter="url(#rough2)">a man on a <tspan fill="#d6a040" font-weight="bold">mission</tspan> impossible</text>

  <!-- Row 3 -->
  <rect x="20" y="138" width="600" height="40" fill="#eef3fb" stroke="#dde6f0" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="24" y="162" font-size="11" fill="#333" filter="url(#rough2)">a man on a <tspan fill="#d6a040" font-weight="bold">mission</tspan></text>
  <text x="252" y="162" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">+</text>
  <text x="268" y="162" font-size="11" fill="#333" filter="url(#rough2)"><tspan fill="#d6a040" font-weight="bold">mission</tspan> statement</text>
  <text x="416" y="162" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→</text>
  <text x="434" y="162" font-size="11" fill="#333" filter="url(#rough2)">a man on a <tspan fill="#d6a040" font-weight="bold">mission</tspan> statement</text>

  <!-- Row 4 -->
  <rect x="20" y="180" width="600" height="40" fill="#f7f7f7" stroke="#eee" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="24" y="204" font-size="11" fill="#333" filter="url(#rough2)">a quick bite to <tspan fill="#d6a040" font-weight="bold">eat</tspan></text>
  <text x="252" y="204" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">+</text>
  <text x="268" y="204" font-size="11" fill="#333" filter="url(#rough2)"><tspan fill="#d6a040" font-weight="bold">eat</tspan> my words</text>
  <text x="416" y="204" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→</text>
  <text x="434" y="204" font-size="11" fill="#333" filter="url(#rough2)">a quick bite to <tspan fill="#d6a040" font-weight="bold">eat</tspan> my words</text>

  <!-- Row 5 -->
  <rect x="20" y="222" width="600" height="40" fill="#eef3fb" stroke="#dde6f0" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="24" y="246" font-size="11" fill="#333" filter="url(#rough2)">chocolate <tspan fill="#d6a040" font-weight="bold">bar</tspan></text>
  <text x="252" y="246" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">+</text>
  <text x="268" y="246" font-size="11" fill="#333" filter="url(#rough2)"><tspan fill="#d6a040" font-weight="bold">bar</tspan> of soap</text>
  <text x="416" y="246" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→</text>
  <text x="434" y="246" font-size="11" fill="#333" filter="url(#rough2)">chocolate <tspan fill="#d6a040" font-weight="bold">bar</tspan> of soap</text>

  <!-- final sorted list -->
  <rect x="20" y="276" width="600" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="32" y="296" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">set 去重（本例无重复）→ 字典序排序后返回：</text>
  <text x="32" y="314" font-size="10" fill="#333" filter="url(#rough2)">["a chip off the old block party", "a man on a mission impossible",</text>
  <text x="32" y="330" font-size="10" fill="#333" filter="url(#rough2)"> "a man on a mission statement", "a quick bite to eat my words", "chocolate bar of soap"]</text>
</svg>
