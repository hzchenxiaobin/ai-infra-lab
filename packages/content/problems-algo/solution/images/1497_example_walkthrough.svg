<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrGray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#999"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：arr = [1,2,3,4,5,10,6,7,8,9], k = 5 → true</text>
  <text x="310" y="40" text-anchor="middle" font-size="10.5" fill="#888">配色：余 0 橙(自配) · 余 1&amp;4 蓝(互补) · 余 2&amp;3 绿(互补)</text>

  <!-- ===== Row 1: arr values ===== -->
  <text x="24" y="82" font-size="11.5" fill="#446688" font-weight="bold">arr</text>
  <!-- cells: centers 90,142,194,246,298,350,402,454,506,558 ; x=left = center-26 ; w=52 ; y=58 h=36 -->
  <!-- 1 (r1 blue) -->
  <rect x="64" y="58" width="52" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="82" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold">1</text>
  <!-- 2 (r2 green) -->
  <rect x="116" y="58" width="52" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="142" y="82" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold">2</text>
  <!-- 3 (r3 green) -->
  <rect x="168" y="58" width="52" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="194" y="82" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold">3</text>
  <!-- 4 (r4 blue) -->
  <rect x="220" y="58" width="52" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="246" y="82" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold">4</text>
  <!-- 5 (r0 orange) -->
  <rect x="272" y="58" width="52" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="298" y="82" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold">5</text>
  <!-- 10 (r0 orange) -->
  <rect x="324" y="58" width="52" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350" y="82" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold">10</text>
  <!-- 6 (r1 blue) -->
  <rect x="376" y="58" width="52" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="402" y="82" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold">6</text>
  <!-- 7 (r2 green) -->
  <rect x="428" y="58" width="52" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="454" y="82" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold">7</text>
  <!-- 8 (r3 green) -->
  <rect x="480" y="58" width="52" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="506" y="82" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold">8</text>
  <!-- 9 (r4 blue) -->
  <rect x="532" y="58" width="52" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="558" y="82" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold">9</text>

  <!-- arrows arr -> remainder -->
  <path d="M 90 94 L 90 106" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <path d="M 142 94 L 142 106" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <path d="M 194 94 L 194 106" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <path d="M 246 94 L 246 106" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <path d="M 298 94 L 298 106" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <path d="M 350 94 L 350 106" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <path d="M 402 94 L 402 106" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <path d="M 454 94 L 454 106" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <path d="M 506 94 L 506 106" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <path d="M 558 94 L 558 106" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arrGray)" filter="url(#rough2)"/>

  <!-- ===== Row 2: remainders ===== -->
  <text x="24" y="132" font-size="11.5" fill="#446688" font-weight="bold">余数</text>
  <text x="24" y="146" font-size="9.5" fill="#888">x % 5</text>
  <!-- 1 -->
  <rect x="64" y="108" width="52" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="132" text-anchor="middle" font-size="13.5" fill="#446688" font-weight="bold">1</text>
  <!-- 2 -->
  <rect x="116" y="108" width="52" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="142" y="132" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold">2</text>
  <!-- 3 -->
  <rect x="168" y="108" width="52" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="194" y="132" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold">3</text>
  <!-- 4 -->
  <rect x="220" y="108" width="52" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="246" y="132" text-anchor="middle" font-size="13.5" fill="#446688" font-weight="bold">4</text>
  <!-- 0 -->
  <rect x="272" y="108" width="52" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="298" y="132" text-anchor="middle" font-size="13.5" fill="#d6a040" font-weight="bold">0</text>
  <!-- 0 -->
  <rect x="324" y="108" width="52" height="36" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="350" y="132" text-anchor="middle" font-size="13.5" fill="#d6a040" font-weight="bold">0</text>
  <!-- 1 -->
  <rect x="376" y="108" width="52" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="402" y="132" text-anchor="middle" font-size="13.5" fill="#446688" font-weight="bold">1</text>
  <!-- 2 -->
  <rect x="428" y="108" width="52" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="454" y="132" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold">2</text>
  <!-- 3 -->
  <rect x="480" y="108" width="52" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="506" y="132" text-anchor="middle" font-size="13.5" fill="#4a7a3a" font-weight="bold">3</text>
  <!-- 4 -->
  <rect x="532" y="108" width="52" height="36" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="558" y="132" text-anchor="middle" font-size="13.5" fill="#446688" font-weight="bold">4</text>

  <!-- arrow remainder row -> bucket count row (single curved) -->
  <path d="M 310 144 L 310 186" stroke="#999" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <text x="316" y="170" font-size="10" fill="#888">分桶计数</text>

  <!-- ===== Row 3: bucket counts ===== -->
  <text x="24" y="214" font-size="11.5" fill="#446688" font-weight="bold">桶计数</text>
  <text x="24" y="228" font-size="9.5" fill="#888">cnt[r]</text>
  <!-- bucket 0 orange : center 118 -->
  <rect x="80" y="188" width="76" height="42" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="118" y="202" text-anchor="middle" font-size="9.5" fill="#d6a040">r = 0</text>
  <text x="118" y="222" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <!-- bucket 1 blue : center 204 -->
  <rect x="166" y="188" width="76" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="204" y="202" text-anchor="middle" font-size="9.5" fill="#446688">r = 1</text>
  <text x="204" y="222" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <!-- bucket 2 green : center 290 -->
  <rect x="252" y="188" width="76" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="202" text-anchor="middle" font-size="9.5" fill="#4a7a3a">r = 2</text>
  <text x="290" y="222" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <!-- bucket 3 green : center 376 -->
  <rect x="338" y="188" width="76" height="42" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="376" y="202" text-anchor="middle" font-size="9.5" fill="#4a7a3a">r = 3</text>
  <text x="376" y="222" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <!-- bucket 4 blue : center 462 -->
  <rect x="424" y="188" width="76" height="42" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="462" y="202" text-anchor="middle" font-size="9.5" fill="#446688">r = 4</text>
  <text x="462" y="222" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>

  <!-- ===== Row 4: pairing checks ===== -->
  <text x="24" y="294" font-size="11.5" fill="#446688" font-weight="bold">配对</text>
  <text x="24" y="308" font-size="9.5" fill="#888">检查</text>
  <!-- check 1: cnt[0] even (orange) -->
  <rect x="60" y="278" width="170" height="34" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="145" y="300" text-anchor="middle" font-size="11.5" fill="#333">cnt[0]=2 偶 ✓</text>
  <!-- check 2: cnt[1]==cnt[4] (blue) -->
  <rect x="240" y="278" width="180" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="300" text-anchor="middle" font-size="11.5" fill="#333">cnt[1]=2 == cnt[4]=2 ✓</text>
  <!-- check 3: cnt[2]==cnt[3] (green) -->
  <rect x="430" y="278" width="170" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="515" y="300" text-anchor="middle" font-size="11.5" fill="#333">cnt[2]=2 == cnt[3]=2 ✓</text>

  <!-- arrows checks -> result -->
  <path d="M 145 312 L 145 324" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <path d="M 330 312 L 330 324" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <path d="M 515 312 L 515 324" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arrGray)" filter="url(#rough2)"/>

  <!-- ===== Result ===== -->
  <rect x="180" y="326" width="260" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="310" y="348" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">全部通过 → 返回 true ✓</text>

  <!-- bottom note: a legal pairing -->
  <rect x="40" y="376" width="540" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="310" y="396" text-anchor="middle" font-size="11" fill="#555">一种合法配对：(1, 9)、(2, 8)、(3, 7)、(4, 6)、(5, 10)</text>
  <text x="310" y="414" text-anchor="middle" font-size="10.5" fill="#888">每对和 = 10/10/10/10/15，均为 5 的倍数 ✓</text>
</svg>
