<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="17" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察二：阈值计数——数「能量 ≥ d」而非「能量 = d」</text>
  <text x="260" y="46" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">cnt_ge(d)：所有相邻差 ≥ d 的长度 k 子序列数（示例 [−1, 3, 4]，k = 2）</text>

  <!-- 坐标轴 -->
  <path d="M70,290 L500,290" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M70,290 L70,86" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="484" y="308" font-size="12" fill="#446688" filter="url(#rough2)">d</text>
  <text x="58" y="80" font-size="12" fill="#446688" filter="url(#rough2)">cnt_ge</text>

  <!-- x 轴刻度 d=1..6 -->
  <text x="160" y="308" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="220" y="308" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="280" y="308" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="340" y="308" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="400" y="308" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="456" y="308" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">6</text>

  <!-- 台阶矩形：d∈[1,2) 高 3 -->
  <rect x="130" y="101" width="60" height="189" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="160" y="94" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <!-- d∈[2,5) 高 2 -->
  <rect x="190" y="164" width="180" height="126" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="157" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <!-- d∈[5,6) 高 1 -->
  <rect x="370" y="227" width="60" height="63" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="400" y="220" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- y 轴参考虚线 -->
  <path d="M70,101 L130,101" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <path d="M70,164 L190,164" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <path d="M70,227 L370,227" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- 分段端点标注 -->
  <text x="196" y="120" font-size="11" fill="#b85450" filter="url(#rough2)">← 段右端 = 差值 1</text>
  <text x="376" y="180" font-size="11" fill="#b85450" filter="url(#rough2)">← 段右端 = 差值 4</text>

  <!-- 面积分解标注 -->
  <text x="160" y="140" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">1×3</text>
  <text x="280" y="200" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">3×2</text>
  <text x="400" y="262" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">1×1</text>

  <!-- 底部公式框 -->
  <rect x="36" y="318" width="448" height="38" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="333" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">能量和 = Σ(d≥1) cnt_ge(d) = Σ (d_j − d_{j−1})·cnt_ge(d_j) = 1·3 + 3·2 + 1·1 = 10</text>
  <text x="260" y="350" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">每段右端点都是数对差值 d ∈ {1, 4, 5} ⇒ 只需 ≤ n²/2 个关键 d 处求值</text>
</svg>
