<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：建 Trie → BFS 建 fail/dict → 单趟扫描松弛 dp</text>

  <rect x="140" y="38" width="250" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="265" y="53" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">① 全部单词插入 Trie</text>
  <text x="265" y="68" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">重复单词：终点只存最小 cost</text>

  <path d="M265,74 L265,86" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="90" width="250" height="44" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="265" y="106" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">② BFS 逐层建 fail 与 dict</text>
  <text x="265" y="121" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">dict(u) = fail 链上最近单词终点；</text>
  <text x="265" y="131" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">缺失边合并为 goto 转移（扫描 O(1)）</text>

  <path d="M265,134 L265,146" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="150" width="250" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="265" y="171" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">③ 读入 target[j]，u ← goto(u, ch)</text>

  <path d="M265,184 L265,196" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="200" width="250" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="265" y="216" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">④ 沿 dict 链枚举单词终点 w</text>
  <text x="265" y="232" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">dp[j] ← min(dp[j],</text>
  <text x="265" y="243" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">dp[j−|w|] + cost(w))</text>

  <path d="M265,248 L265,258" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="265,262 335,286 265,310 195,286" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="265" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">j = n ?</text>

  <path d="M335,286 L455,286 L455,167 L396,167" fill="none" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="452" y="150" font-size="10" fill="#666" filter="url(#rough2)">否：j+1</text>
  <text x="452" y="164" font-size="10" fill="#666" filter="url(#rough2)">继续扫描</text>

  <path d="M265,310 L265,320" stroke="#888" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="285" y="322" font-size="10" fill="#666" filter="url(#rough2)">是</text>

  <rect x="140" y="324" width="250" height="30" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="265" y="343" text-anchor="middle" font-size="11" font-weight="bold" fill="#333" filter="url(#rough2)">输出 dp[n]（∞ 则 −1）</text>
</svg>
