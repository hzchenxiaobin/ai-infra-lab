<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="470" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：逐书判定可售期 + 过去一年销量</text>
  <text x="320" y="42" text-anchor="middle" font-size="10" fill="#888">今天 = 2019-06-23；可售阈值 = 2019-05-23；过去一年起点 = 2018-06-23</text>

  <!-- Table header -->
  <rect x="20" y="54" width="600" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="48" y="73" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">id</text>
  <text x="150" y="73" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">name</text>
  <text x="278" y="73" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">available_from</text>
  <text x="392" y="73" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">可售≥1月?</text>
  <text x="500" y="73" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">过去一年销量</text>
  <text x="592" y="73" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">结果</text>
  <line x1="82" y1="54" x2="82" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="230" y1="54" x2="230" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="330" y1="54" x2="330" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="450" y1="54" x2="450" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="555" y1="54" x2="555" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Row 1: book 1 -->
  <rect x="20" y="84" width="600" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="48" y="108" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="150" y="108" text-anchor="middle" font-size="9.5" fill="#333">Kalila And Demna</text>
  <text x="278" y="108" text-anchor="middle" font-size="9.5" fill="#333">2010-01-01</text>
  <text x="392" y="108" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="500" y="103" text-anchor="middle" font-size="9.5" fill="#333">2+1 = 3</text>
  <text x="500" y="116" text-anchor="middle" font-size="9" fill="#888">(07-26, 11-05)</text>
  <text x="592" y="108" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✅</text>
  <line x1="82" y1="84" x2="82" y2="124" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="230" y1="84" x2="230" y2="124" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="330" y1="84" x2="330" y2="124" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="450" y1="84" x2="450" y2="124" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="555" y1="84" x2="555" y2="124" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>

  <!-- Row 2: book 2 -->
  <rect x="20" y="124" width="600" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="48" y="148" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="150" y="148" text-anchor="middle" font-size="9.5" fill="#333">28 Letters</text>
  <text x="278" y="148" text-anchor="middle" font-size="9.5" fill="#333">2012-05-12</text>
  <text x="392" y="148" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="500" y="143" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">无订单 → 0</text>
  <text x="500" y="156" text-anchor="middle" font-size="9" fill="#888">IFNULL(NULL,0)</text>
  <text x="592" y="148" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✅</text>
  <line x1="82" y1="124" x2="82" y2="164" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="230" y1="124" x2="230" y2="164" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="330" y1="124" x2="330" y2="164" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="450" y1="124" x2="450" y2="164" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="555" y1="124" x2="555" y2="164" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>

  <!-- Row 3: book 3 -->
  <rect x="20" y="164" width="600" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="48" y="188" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="150" y="188" text-anchor="middle" font-size="9.5" fill="#333">The Hobbit</text>
  <text x="278" y="188" text-anchor="middle" font-size="9.5" fill="#333">2019-06-10</text>
  <text x="392" y="183" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✗ 仅 13 天</text>
  <text x="392" y="196" text-anchor="middle" font-size="9" fill="#b85450">&gt; 05-23</text>
  <text x="500" y="188" text-anchor="middle" font-size="10" fill="#888">—</text>
  <text x="592" y="188" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">❌</text>
  <line x1="82" y1="164" x2="82" y2="204" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="230" y1="164" x2="230" y2="204" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="330" y1="164" x2="330" y2="204" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="450" y1="164" x2="450" y2="204" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="555" y1="164" x2="555" y2="204" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>

  <!-- Row 4: book 4 -->
  <rect x="20" y="204" width="600" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="48" y="228" text-anchor="middle" font-size="10" fill="#333">4</text>
  <text x="150" y="228" text-anchor="middle" font-size="9.5" fill="#333">13 Reasons Why</text>
  <text x="278" y="228" text-anchor="middle" font-size="9.5" fill="#333">2019-06-01</text>
  <text x="392" y="223" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✗ 仅 22 天</text>
  <text x="392" y="236" text-anchor="middle" font-size="9" fill="#b85450">&gt; 05-23</text>
  <text x="500" y="228" text-anchor="middle" font-size="10" fill="#888">—</text>
  <text x="592" y="228" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">❌</text>
  <line x1="82" y1="204" x2="82" y2="244" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="230" y1="204" x2="230" y2="244" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="330" y1="204" x2="330" y2="244" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="450" y1="204" x2="450" y2="244" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="555" y1="204" x2="555" y2="244" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>

  <!-- Row 5: book 5 -->
  <rect x="20" y="244" width="600" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="48" y="268" text-anchor="middle" font-size="10" fill="#333">5</text>
  <text x="150" y="268" text-anchor="middle" font-size="9.5" fill="#333">The Hunger Games</text>
  <text x="278" y="268" text-anchor="middle" font-size="9.5" fill="#333">2008-09-21</text>
  <text x="392" y="268" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="500" y="263" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">订单均超 1 年 → 0</text>
  <text x="500" y="276" text-anchor="middle" font-size="9" fill="#888">(2009, 2010)</text>
  <text x="592" y="268" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✅</text>
  <line x1="82" y1="244" x2="82" y2="284" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="230" y1="244" x2="230" y2="284" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="330" y1="244" x2="330" y2="284" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="450" y1="244" x2="450" y2="284" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="555" y1="244" x2="555" y2="284" stroke="#888" stroke-width="0.5" filter="url(#rough2)"/>

  <!-- arrow to result -->
  <path d="M 320 288 L 320 306" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Final result -->
  <rect x="20" y="312" width="600" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="320" y="332" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">HAVING IFNULL(SUM(quantity), 0) &lt; 10</text>
  <text x="320" y="348" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">结果 → book 1, book 2, book 5</text>

  <!-- Key insight -->
  <rect x="20" y="364" width="600" height="96" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="40" y="384" font-size="11" fill="#555" font-weight="bold">💡 两个易错点</text>
  <text x="40" y="402" font-size="10.5" fill="#888">① book 2、book 5 过去一年销量为 0（&lt; 10）应入选：需 LEFT JOIN + IFNULL(SUM,0) 防漏。</text>
  <text x="40" y="418" font-size="10.5" fill="#888">② book 3、book 4 可售不足 1 月被 WHERE 排除：可售期是行级条件，放 WHERE 即可。</text>
  <text x="40" y="436" font-size="10.5" fill="#888">③ dispatch_date 过滤必须放 ON 子句：放 WHERE 会把无订单行的 NULL 一并过滤掉，</text>
  <text x="40" y="452" font-size="10.5" fill="#888">    使 LEFT JOIN 退化为 INNER JOIN，零销量书再次丢失。</text>
</svg>
