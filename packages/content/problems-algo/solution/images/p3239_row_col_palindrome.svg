<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrS" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">两个独立目标：所有行回文 vs 所有列回文</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">grid = [[1,0,0],[0,0,0],[0,0,1]]（示例 1）</text>

  <!-- 左面板：行视角 -->
  <rect x="22" y="56" width="226" height="240" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="135" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">行视角：每行左右对称</text>

  <!-- 左矩阵 -->
  <rect x="72" y="92" width="42" height="42" fill="#e8f0fe" stroke="#d6a040" stroke-width="3" rx="4" filter="url(#rough2)"/>
  <text x="93" y="118" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="114" y="92" width="42" height="42" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="118" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="156" y="92" width="42" height="42" fill="#ffffff" stroke="#d6a040" stroke-width="3" rx="4" filter="url(#rough2)"/>
  <text x="177" y="118" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>

  <rect x="72" y="134" width="42" height="42" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="93" y="160" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="114" y="134" width="42" height="42" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="160" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="156" y="134" width="42" height="42" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="177" y="160" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>

  <rect x="72" y="176" width="42" height="42" fill="#ffffff" stroke="#d6a040" stroke-width="3" rx="4" filter="url(#rough2)"/>
  <text x="93" y="202" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="114" y="176" width="42" height="42" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="202" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="156" y="176" width="42" height="42" fill="#e8f0fe" stroke="#d6a040" stroke-width="3" rx="4" filter="url(#rough2)"/>
  <text x="177" y="202" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>

  <!-- 行0 / 行2 对称对箭头 -->
  <line x1="93" y1="87" x2="177" y2="87" stroke="#d6a040" stroke-width="2" marker-start="url(#arrS)" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="93" y1="224" x2="177" y2="224" stroke="#d6a040" stroke-width="2" marker-start="url(#arrS)" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="208" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">≠</text>
  <text x="208" y="229" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">≠</text>
  <text x="208" y="163" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <text x="135" y="244" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">行0：1≠0 → 1 次</text>
  <text x="135" y="260" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">行2：0≠1 → 1 次</text>
  <rect x="85" y="266" width="100" height="24" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="135" y="283" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d27" filter="url(#rough2)">rowDiff = 2</text>

  <!-- 右面板：列视角 -->
  <rect x="272" y="56" width="226" height="240" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="385" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">列视角：每列上下对称</text>

  <!-- 右矩阵 -->
  <rect x="322" y="92" width="42" height="42" fill="#e8f0fe" stroke="#d6a040" stroke-width="3" rx="4" filter="url(#rough2)"/>
  <text x="343" y="118" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="364" y="92" width="42" height="42" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="385" y="118" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="406" y="92" width="42" height="42" fill="#ffffff" stroke="#d6a040" stroke-width="3" rx="4" filter="url(#rough2)"/>
  <text x="427" y="118" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>

  <rect x="322" y="134" width="42" height="42" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="343" y="160" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="364" y="134" width="42" height="42" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="385" y="160" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="406" y="134" width="42" height="42" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="427" y="160" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>

  <rect x="322" y="176" width="42" height="42" fill="#ffffff" stroke="#d6a040" stroke-width="3" rx="4" filter="url(#rough2)"/>
  <text x="343" y="202" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="364" y="176" width="42" height="42" fill="#ffffff" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="385" y="202" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">0</text>
  <rect x="406" y="176" width="42" height="42" fill="#e8f0fe" stroke="#d6a040" stroke-width="3" rx="4" filter="url(#rough2)"/>
  <text x="427" y="202" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>

  <!-- 列0 / 列2 对称对箭头 -->
  <line x1="316" y1="113" x2="316" y2="197" stroke="#d6a040" stroke-width="2" marker-start="url(#arrS)" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="454" y1="113" x2="454" y2="197" stroke="#d6a040" stroke-width="2" marker-start="url(#arrS)" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="304" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">≠</text>
  <text x="466" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">≠</text>
  <text x="385" y="233" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <text x="385" y="248" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">列0：1≠0 → 1 次</text>
  <text x="385" y="264" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">列2：0≠1 → 1 次</text>
  <rect x="335" y="270" width="100" height="24" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="385" y="287" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f5d27" filter="url(#rough2)">colDiff = 2</text>

  <!-- 规则框 -->
  <rect x="40" y="312" width="440" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="331" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">对称对规则：相等 → 0 次；不等 → 翻其中任意一个 → 恰好 1 次</text>
  <text x="260" y="348" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">（中间格是回文中心天然对称；同行/列的对称对互不共享格子，代价直接相加）</text>

  <!-- 答案框 -->
  <rect x="120" y="366" width="280" height="40" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="391" text-anchor="middle" font-size="14" font-weight="bold" fill="#b85450" filter="url(#rough2)">ans = min(rowDiff, colDiff) = 2</text>
</svg>
