<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">流程：字典序排序 + 相邻前缀检查</text>

  <!-- 开始 -->
  <rect x="200" y="34" width="120" height="30" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="53" text-anchor="middle" font-size="12" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">开始</text>

  <path d="M 260 64 L 260 84" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 排序 -->
  <rect x="150" y="86" width="220" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="110" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">按字典序排序 numbers</text>

  <path d="M 260 124 L 260 146" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形1：还有相邻对吗 -->
  <polygon points="172,186 260,146 348,186 260,226" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="182" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">还有未检查</text>
  <text x="260" y="196" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">的相邻对？</text>

  <path d="M 348 186 L 400 186" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="374" y="178" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="404" y="168" width="98" height="36" rx="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="453" y="191" text-anchor="middle" font-size="12.5" fill="#2a5a2a" font-weight="bold" filter="url(#rough2)">返回 true</text>

  <path d="M 260 226 L 260 250" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="242" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- 菱形2：前缀判定 -->
  <polygon points="164,292 260,252 356,292 260,332" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="288" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">a[i−1] 是 a[i]</text>
  <text x="260" y="302" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">的前缀吗？</text>

  <path d="M 356 292 L 400 292" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="378" y="284" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>

  <rect x="404" y="274" width="98" height="36" rx="9" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="453" y="297" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 false</text>

  <!-- 回边：否 → 下一对 -->
  <path d="M 164 292 L 86 292 L 86 186 L 166 186" fill="none" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="125" y="284" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <text x="96" y="234" font-size="10" fill="#4a7a3a" filter="url(#rough2)">i ← i + 1</text>
  <text x="96" y="248" font-size="10" fill="#4a7a3a" filter="url(#rough2)">检查下一对</text>

  <!-- 要点注记 -->
  <rect x="22" y="316" width="210" height="38" rx="8" fill="#ffffff" stroke="#999" stroke-width="1.2" stroke-dasharray="5,4" filter="url(#rough2)"/>
  <text x="127" y="330" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">重复号码排序后必相邻，</text>
  <text x="127" y="344" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">startsWith 天然判 false，无需特判</text>
</svg>
