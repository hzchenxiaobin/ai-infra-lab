<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 500"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="500" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：从右往左贪心</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">预处理 SPF 筛 + 反向扫描，维护 pre（右侧已定型部分的最小值）</text>

  <!-- 步骤1：预处理 -->
  <rect x="155" y="54" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="230" y="73" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">预处理：埃氏筛求 SPF</text>

  <path d="M 230 84 L 230 96" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 步骤2：初始化 -->
  <rect x="130" y="98" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="230" y="113" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">初始化</text>
  <text x="230" y="126" text-anchor="middle" font-size="10" fill="#33506b" filter="url(#rough2)">pre = nums[n−1]，i = n−2，ans = 0</text>

  <path d="M 230 132 L 230 146" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形A：循环条件 -->
  <polygon points="230,148 312,182 230,216 148,182" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="187" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">i ≥ 0 ?</text>

  <path d="M 312 182 L 348 182" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="174" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">否</text>

  <rect x="352" y="164" width="142" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="423" y="186" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 ans ✓</text>

  <path d="M 230 216 L 230 238" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="244" y="232" font-size="9" fill="#a07830" filter="url(#rough2)">是</text>

  <!-- 循环体虚线框 -->
  <rect x="95" y="240" width="410" height="236" fill="none" stroke="#999" stroke-width="1.3" stroke-dasharray="6 4" rx="12" filter="url(#rough2)"/>
  <text x="408" y="256" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">循环体：处理完 i−− 回到顶部</text>

  <!-- 菱形B：能不能不动 -->
  <polygon points="230,256 330,292 230,328 130,292" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="297" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">nums[i] ≤ pre ?</text>

  <path d="M 130 292 L 100 292" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="284" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">是</text>

  <rect x="16" y="274" width="82" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="57" y="289" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">不动</text>
  <text x="57" y="302" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">pre = nums[i]</text>

  <path d="M 230 328 L 230 340" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="244" y="338" font-size="9" fill="#a07830" filter="url(#rough2)">否</text>

  <!-- 框3：求新值 -->
  <rect x="155" y="342" width="150" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="230" y="361" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">v = SPF(nums[i])</text>

  <path d="M 230 372 L 230 384" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形C：新值能不能过关 -->
  <polygon points="230,386 325,420 230,454 135,420" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="425" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">v ≤ pre ?</text>

  <path d="M 325 420 L 358 420" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="342" y="412" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">是</text>

  <rect x="362" y="402" width="138" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="431" y="417" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">ans+1，pre = v</text>
  <text x="431" y="430" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">跳崖一次</text>

  <path d="M 135 420 L 106 420" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="122" y="412" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">否</text>

  <rect x="22" y="402" width="82" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="63" y="417" text-anchor="middle" font-size="10.5" fill="#8a3833" filter="url(#rough2)">返回 −1 ✗</text>
  <text x="63" y="430" text-anchor="middle" font-size="9" fill="#8a3833" filter="url(#rough2)">死子挡路</text>

  <!-- 底部注释 -->
  <text x="260" y="492" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">贪心核心：能不动就不动（值大对左边宽松、零成本）——只有压不过 pre 时才被迫「跳崖」</text>
</svg>
