<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">每个点的 DP 松弛流程（3 车道滚动）</text>

  <!-- Left: flowchart -->
  <g filter="url(#rough2)">
    <!-- step 1 -->
    <rect x="40" y="50" width="240" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8"/>
    <text x="160" y="73" text-anchor="middle" font-size="12" fill="#333">① 取 o = obstacles[i]</text>
    <!-- step 2 -->
    <rect x="40" y="104" width="240" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
    <text x="160" y="121" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② o&gt;0 → dp[o−1] = ∞</text>
    <text x="160" y="137" text-anchor="middle" font-size="10" fill="#888">障碍道禁足</text>
    <!-- step 3 -->
    <rect x="40" y="164" width="240" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="160" y="181" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ mn = min(dp[0..2])</text>
    <text x="160" y="197" text-anchor="middle" font-size="10" fill="#888">最便宜的可到达道</text>
    <!-- step 4 -->
    <rect x="40" y="224" width="240" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8"/>
    <text x="160" y="241" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">④ dp[j]=min(dp[j], mn+1)</text>
    <text x="160" y="257" text-anchor="middle" font-size="10" fill="#888">从最便宜道侧跳一次可到任意空闲道</text>
    <!-- step 5 -->
    <rect x="40" y="284" width="240" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
    <text x="160" y="301" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">⑤ o&gt;0 → 再 dp[o−1] = ∞</text>
    <text x="160" y="317" text-anchor="middle" font-size="10" fill="#888">松弛后重新封住障碍道</text>
  </g>

  <!-- flow arrows -->
  <g stroke="#888" stroke-width="1.4" fill="none" filter="url(#rough2)">
    <line x1="160" y1="86" x2="160" y2="100" marker-end="url(#arrG)"/>
    <line x1="160" y1="144" x2="160" y2="160" marker-end="url(#arrG)"/>
    <line x1="160" y1="204" x2="160" y2="220" marker-end="url(#arrG)"/>
    <line x1="160" y1="264" x2="160" y2="280" marker-end="url(#arrG)"/>
  </g>

  <!-- Right: relaxation snapshot -->
  <text x="430" y="58" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">某点松弛前后</text>

  <!-- lane labels -->
  <g font-size="11" fill="#666" text-anchor="end" filter="url(#rough2)">
    <text x="318" y="103">1 道</text>
    <text x="318" y="148">2 道</text>
    <text x="318" y="193">3 道</text>
  </g>

  <!-- before column -->
  <g filter="url(#rough2)">
    <rect x="324" y="86" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="352" y="106" text-anchor="middle" font-size="12" fill="#333">5</text>
    <rect x="324" y="131" width="56" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="352" y="151" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">∞</text>
    <rect x="324" y="176" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <text x="352" y="196" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
    <text x="352" y="170" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">mn</text>
  </g>

  <!-- after column -->
  <g filter="url(#rough2)">
    <rect x="454" y="86" width="56" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="482" y="106" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
    <rect x="454" y="131" width="56" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4"/>
    <text x="482" y="151" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">∞</text>
    <rect x="454" y="176" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <text x="482" y="196" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  </g>

  <!-- big arrow between columns -->
  <path d="M 384 155 L 450 155" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="417" y="148" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">松弛</text>

  <!-- side-jump arrow: from lane3(before) to lane1(after) -->
  <path d="M 380 191 C 410 191 410 101 450 101" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="4,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="418" y="120" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">侧跳 +1</text>

  <!-- note -->
  <rect x="324" y="240" width="186" height="84" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="417" y="261" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2 道被封 → ∞</text>
  <text x="417" y="280" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3 道最便宜(mn=2)</text>
  <text x="417" y="299" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1 道侧跳一次: 2+1=3</text>
  <text x="417" y="316" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">(原值 5 &gt; 3，故更新)</text>
</svg>
