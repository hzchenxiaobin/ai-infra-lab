<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：total = 2S + x ——「和」S 被数了两次</text>
  <text x="260" y="40" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">以示例 1 nums = [2, 3, 5, 10] 为例，total = 2+3+5+10 = 20</text>

  <!-- 数组本体 -->
  <rect x="157" y="56" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="179" y="79" text-anchor="middle" font-size="12.5" fill="#2f5d24" filter="url(#rough2)">2</text>
  <rect x="211" y="56" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="233" y="79" text-anchor="middle" font-size="12.5" fill="#2f5d24" filter="url(#rough2)">3</text>
  <rect x="265" y="56" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="287" y="79" text-anchor="middle" font-size="12.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="319" y="56" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="341" y="79" text-anchor="middle" font-size="12.5" fill="#8a3833" font-weight="bold" filter="url(#rough2)">10</text>

  <text x="179" y="106" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">特殊数字</text>
  <text x="233" y="106" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">特殊数字</text>
  <text x="287" y="106" text-anchor="middle" font-size="9.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">和元素 S</text>
  <text x="341" y="106" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">异常值 x</text>

  <!-- 特殊数字分组虚线框 -->
  <rect x="150" y="50" width="112" height="62" fill="none" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="5 4" rx="8" filter="url(#rough2)"/>
  <text x="206" y="128" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">特殊数字之和 = 2+3 = 5 = S</text>

  <!-- 记账条 -->
  <text x="42" y="172" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">total</text>
  <text x="72" y="172" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">=</text>
  <rect x="86" y="150" width="104" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="138" y="164" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">特殊数字之和</text>
  <text x="138" y="178" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">= S = 5</text>
  <text x="200" y="172" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">+</text>
  <rect x="212" y="150" width="96" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="260" y="164" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">和元素</text>
  <text x="260" y="178" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">= S = 5</text>
  <text x="320" y="172" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">+</text>
  <rect x="332" y="150" width="104" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="384" y="164" text-anchor="middle" font-size="10.5" fill="#8a3833" filter="url(#rough2)">异常值</text>
  <text x="384" y="178" text-anchor="middle" font-size="10.5" fill="#8a3833" font-weight="bold" filter="url(#rough2)">= x = 10</text>

  <!-- 关键公式 -->
  <rect x="140" y="200" width="240" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="221" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">x = total − 2S = 20 − 10 = 10</text>

  <!-- 反向合法性说明框 -->
  <rect x="24" y="246" width="472" height="104" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="38" y="266" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">反向也成立：存在即可行，无需再验证剩余元素之和</text>
  <text x="38" y="284" font-size="9.8" fill="#555" filter="url(#rough2)">任取 s = nums[i] 充当「和」元素，算出候选异常值 cand = total − 2s；</text>
  <text x="38" y="302" font-size="9.8" fill="#555" filter="url(#rough2)">只要 cand 在数组中另有出现（下标 ≠ i），则其余 n−2 个数之和</text>
  <text x="38" y="320" font-size="9.8" fill="#555" filter="url(#rough2)">= total − s − cand = s，恰好等于「和」元素的值 —— 拆分自动合法 ✓</text>
  <text x="38" y="340" font-size="9.8" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠️ 当 cand == s 时该值须出现 ≥ 2 次（下标互异、值可相同）</text>
</svg>
