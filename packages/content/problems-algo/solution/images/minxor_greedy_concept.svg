<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">贪心策略：高位先匹配，低位再补差（num1=25, c=4）</text>

  <!-- ===== num1 row ===== -->
  <text x="150" y="58" text-anchor="end" font-size="11.5" fill="#333" font-weight="bold">num1=25</text>
  <!-- bit position labels -->
  <text x="202" y="50" text-anchor="middle" font-size="9.5" fill="#888">bit4</text>
  <text x="250" y="50" text-anchor="middle" font-size="9.5" fill="#888">bit3</text>
  <text x="298" y="50" text-anchor="middle" font-size="9.5" fill="#888">bit2</text>
  <text x="346" y="50" text-anchor="middle" font-size="9.5" fill="#888">bit1</text>
  <text x="394" y="50" text-anchor="middle" font-size="9.5" fill="#888">bit0</text>
  <!-- bits 1 1 0 0 1 -->
  <rect x="180" y="56" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="202" y="78" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1</text>
  <rect x="228" y="56" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="78" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1</text>
  <rect x="276" y="56" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="298" y="78" text-anchor="middle" font-size="14" fill="#333">0</text>
  <rect x="324" y="56" width="44" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="346" y="78" text-anchor="middle" font-size="14" fill="#333">0</text>
  <rect x="372" y="56" width="44" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="394" y="78" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1</text>

  <!-- tags under each bit -->
  <text x="202" y="104" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">①匹配</text>
  <text x="250" y="104" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">①匹配</text>
  <text x="298" y="104" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">②补位</text>
  <text x="346" y="104" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">②补位</text>
  <text x="394" y="104" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">①匹配</text>

  <!-- arrows from tags down to x row -->
  <path d="M 202 110 Q 202 130 202 150" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 250 110 Q 250 130 250 150" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 346 110 Q 346 130 346 150" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 394 110 Q 394 130 394 150" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- strategy labels -->
  <text x="430" y="112" font-size="11" fill="#4a7a3a" font-weight="bold">① 匹配 num1 的 1</text>
  <text x="430" y="126" font-size="10" fill="#4a7a3a">高位→低位，x 置 1 → XOR=0</text>
  <text x="430" y="148" font-size="10" fill="#d6a040">② 多余的 1 填 num1 的 0</text>
  <text x="430" y="162" font-size="10" fill="#d6a040">低位→高位 → XOR 该位=1（值小）</text>

  <!-- divider -->
  <line x1="30" y1="180" x2="540" y2="180" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== x row ===== -->
  <text x="150" y="216" text-anchor="end" font-size="11.5" fill="#333" font-weight="bold">x=27</text>
  <text x="202" y="208" text-anchor="middle" font-size="9.5" fill="#888">bit4</text>
  <text x="250" y="208" text-anchor="middle" font-size="9.5" fill="#888">bit3</text>
  <text x="298" y="208" text-anchor="middle" font-size="9.5" fill="#888">bit2</text>
  <text x="346" y="208" text-anchor="middle" font-size="9.5" fill="#888">bit1</text>
  <text x="394" y="208" text-anchor="middle" font-size="9.5" fill="#888">bit0</text>
  <!-- bits 1 1 0 1 1 -->
  <rect x="180" y="214" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="202" y="236" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="228" y="214" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="236" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="276" y="214" width="44" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="298" y="236" text-anchor="middle" font-size="14" fill="#999">0</text>
  <rect x="324" y="214" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="346" y="236" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">1</text>
  <rect x="372" y="214" width="44" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="394" y="236" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="430" y="232" font-size="11" fill="#4a7a3a" font-weight="bold">绿色=匹配</text>
  <text x="430" y="246" font-size="11" fill="#d6a040" font-weight="bold">橙色=补位</text>

  <!-- ===== XOR row ===== -->
  <text x="150" y="300" text-anchor="end" font-size="11.5" fill="#333" font-weight="bold">XOR=2</text>
  <text x="202" y="292" text-anchor="middle" font-size="9.5" fill="#888">bit4</text>
  <text x="250" y="292" text-anchor="middle" font-size="9.5" fill="#888">bit3</text>
  <text x="298" y="292" text-anchor="middle" font-size="9.5" fill="#888">bit2</text>
  <text x="346" y="292" text-anchor="middle" font-size="9.5" fill="#888">bit1</text>
  <text x="394" y="292" text-anchor="middle" font-size="9.5" fill="#888">bit0</text>
  <!-- bits 0 0 0 1 0 -->
  <rect x="180" y="298" width="44" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="202" y="320" text-anchor="middle" font-size="14" fill="#999">0</text>
  <rect x="228" y="298" width="44" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="250" y="320" text-anchor="middle" font-size="14" fill="#999">0</text>
  <rect x="276" y="298" width="44" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="298" y="320" text-anchor="middle" font-size="14" fill="#999">0</text>
  <rect x="324" y="298" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="346" y="320" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">1</text>
  <rect x="372" y="298" width="44" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="394" y="320" text-anchor="middle" font-size="14" fill="#999">0</text>
  <text x="430" y="316" font-size="11" fill="#d6a040" font-weight="bold">差异只在 bit1</text>
  <text x="430" y="330" font-size="10.5" fill="#888">挤到最低 → 最小</text>

  <!-- note box -->
  <rect x="30" y="356" width="500" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="378" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">为什么高位优先？</text>
  <text x="280" y="398" text-anchor="middle" font-size="11.5" fill="#333">高位一个差异的代价 &gt; 所有低位之和：bit4=16 &gt; 8+4+2+1=15</text>
  <text x="280" y="414" text-anchor="middle" font-size="11.5" fill="#333">故高位必须先消（匹配 num1 的 1），剩余差异留给最低位 → XOR 值最小</text>
</svg>
