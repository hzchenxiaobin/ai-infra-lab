<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 570"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="570" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：长度剪枝 → 快路径 → 正反两遍贪心 → 枚举替换位判定</text>

  <!-- 开始 -->
  <rect x="170" y="38" width="220" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="57" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">输入 s, t（n = |s|，m = |t|）</text>

  <path d="M 280 68 L 280 82" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 菱形 1：n > m ? -->
  <polygon points="280,88 352,120 280,152 208,120" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="125" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">n &gt; m ？</text>

  <text x="356" y="112" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 352 120 L 376 120" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="380" y="102" width="150" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="455" y="118" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 false</text>
  <text x="455" y="132" text-anchor="middle" font-size="9" fill="#8a3030" filter="url(#rough2)">替换不改长度，先封死长度维度</text>

  <text x="288" y="166" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 280 152 L 280 164" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 菱形 2：s 已是子序列 ? -->
  <polygon points="280,170 356,202 280,234 204,202" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="207" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">s 已是 t 的子序列？</text>

  <text x="360" y="194" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 356 202 L 380 202" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="384" y="184" width="146" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="457" y="200" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 true</text>
  <text x="457" y="214" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">零替换快路径（一遍贪心）</text>

  <text x="288" y="248" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 280 234 L 280 246" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 正向贪心 -->
  <rect x="150" y="252" width="260" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="272" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">正向贪心：pre[i] = s[0..i−1] 最早结束位</text>
  <text x="280" y="290" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">首个空闲下标；pre[0] = 0；进不去记 −1</text>

  <path d="M 280 302 L 280 314" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 反向贪心 -->
  <rect x="150" y="320" width="260" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="340" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">反向贪心：suf[i] = s[i..] 最晚开始位</text>
  <text x="280" y="358" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">空后缀记 suf[n] = m；进不去记 −1</text>

  <path d="M 280 370 L 280 382" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 枚举 i -->
  <rect x="185" y="388" width="190" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="407" text-anchor="middle" font-size="12" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">枚举 i = 0 .. n−1</text>

  <path d="M 280 418 L 280 430" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 菱形 3：判定 -->
  <polygon points="280,436 372,472 280,508 188,472" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="465" text-anchor="middle" font-size="9.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">pre[i] ≠ −1 且 suf[i+1] ≠ −1</text>
  <text x="280" y="481" text-anchor="middle" font-size="9.5" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">且 pre[i] &lt; suf[i+1] ？</text>

  <text x="376" y="462" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 372 472 L 396 472" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="400" y="454" width="130" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="465" y="470" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 true</text>
  <text x="465" y="484" text-anchor="middle" font-size="9" fill="#2f5d24" filter="url(#rough2)">中间有空位给万能牌</text>

  <!-- 否：回环 -->
  <text x="150" y="490" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">否 · 下一个 i</text>
  <path d="M 188 472 L 110 472 L 110 403 L 181 403" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- i 用尽 -->
  <text x="290" y="524" font-size="10" fill="#888" font-weight="bold" filter="url(#rough2)">i 用尽</text>
  <path d="M 280 508 L 280 522" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="210" y="526" width="140" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="546" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 false</text>
</svg>
