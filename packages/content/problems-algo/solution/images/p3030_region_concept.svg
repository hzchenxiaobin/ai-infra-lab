<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">区域：3×3 窗口内 12 条相邻对全部达标</text>

  <!-- left panel: grid with two overlapping windows -->
  <text x="117" y="48" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">两个 3×3 窗口可以重叠</text>

  <!-- grid cells 5x4 -->
  <g filter="url(#rough2)">
    <rect x="42" y="70" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <rect x="72" y="70" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <rect x="102" y="70" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <rect x="132" y="70" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <rect x="162" y="70" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <rect x="42" y="100" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <rect x="72" y="100" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <rect x="102" y="100" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <rect x="132" y="100" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <rect x="162" y="100" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <rect x="42" y="130" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <rect x="72" y="130" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <rect x="102" y="130" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <rect x="132" y="130" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <rect x="162" y="130" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <rect x="42" y="160" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <rect x="72" y="160" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <rect x="102" y="160" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <rect x="132" y="160" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <rect x="162" y="160" width="30" height="30" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
  </g>

  <!-- window A overlay: rows0-2 cols0-2 -->
  <rect x="42" y="70" width="90" height="90" fill="#446688" fill-opacity="0.10" stroke="#446688" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="87" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">窗口 A</text>

  <!-- window B overlay: rows1-3 cols2-4 -->
  <rect x="102" y="100" width="90" height="90" fill="#4a7a3a" fill-opacity="0.10" stroke="#4a7a3a" stroke-width="2.2" stroke-dasharray="7 5" rx="3" filter="url(#rough2)"/>
  <text x="147" y="206" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">窗口 B</text>

  <!-- overlap tint rows1-2 col2 -->
  <rect x="102" y="100" width="30" height="30" fill="#b85450" fill-opacity="0.35" filter="url(#rough2)"/>
  <rect x="102" y="130" width="30" height="30" fill="#b85450" fill-opacity="0.35" filter="url(#rough2)"/>

  <!-- cell values -->
  <g font-size="11" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="57" y="90">5</text><text x="87" y="90">6</text><text x="117" y="90">7</text><text x="147" y="90">10</text><text x="177" y="90">9</text>
    <text x="57" y="120">8</text><text x="87" y="120">9</text><text x="117" y="120">10</text><text x="147" y="120">10</text><text x="177" y="120">8</text>
    <text x="57" y="150">11</text><text x="87" y="150">12</text><text x="117" y="150">13</text><text x="147" y="150">10</text><text x="177" y="150">9</text>
    <text x="57" y="180">10</text><text x="87" y="180">11</text><text x="117" y="180">12</text><text x="147" y="180">9</text><text x="177" y="180">8</text>
  </g>

  <text x="117" y="228" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">红色格子同时属于窗口 A 和 B</text>
  <text x="117" y="246" text-anchor="middle" font-size="10.5" fill="#777" filter="url(#rough2)">内部像素最多被 9 个窗口覆盖</text>

  <!-- right panel: zoomed 3x3 with 12 adjacency edges -->
  <text x="365" y="48" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">放大看一个 3×3：12 条相邻对</text>

  <g filter="url(#rough2)">
    <rect x="296" y="70" width="46" height="46" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <rect x="342" y="70" width="46" height="46" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <rect x="388" y="70" width="46" height="46" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <rect x="296" y="116" width="46" height="46" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <rect x="342" y="116" width="46" height="46" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <rect x="388" y="116" width="46" height="46" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <rect x="296" y="162" width="46" height="46" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <rect x="342" y="162" width="46" height="46" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
    <rect x="388" y="162" width="46" height="46" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="2"/>
  </g>

  <g font-size="14" fill="#333" text-anchor="middle" filter="url(#rough2)">
    <text x="319" y="98">5</text><text x="365" y="98">6</text><text x="411" y="98">7</text>
    <text x="319" y="144">8</text><text x="365" y="144">9</text><text x="411" y="144">10</text>
    <text x="319" y="190">11</text><text x="365" y="190">12</text><text x="411" y="190">13</text>
  </g>

  <!-- 6 horizontal green arrows -->
  <g stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)">
    <path d="M 335 93 L 349 93" marker-end="url(#arrG)"/>
    <path d="M 381 93 L 395 93" marker-end="url(#arrG)"/>
    <path d="M 335 139 L 349 139" marker-end="url(#arrG)"/>
    <path d="M 381 139 L 395 139" marker-end="url(#arrG)"/>
    <path d="M 335 185 L 349 185" marker-end="url(#arrG)"/>
    <path d="M 381 185 L 395 185" marker-end="url(#arrG)"/>
  </g>

  <!-- 6 vertical orange arrows -->
  <g stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)">
    <path d="M 319 109 L 319 123" marker-end="url(#arrO)"/>
    <path d="M 365 109 L 365 123" marker-end="url(#arrO)"/>
    <path d="M 411 109 L 411 123" marker-end="url(#arrO)"/>
    <path d="M 319 155 L 319 169" marker-end="url(#arrO)"/>
    <path d="M 365 155 L 365 169" marker-end="url(#arrO)"/>
    <path d="M 411 155 L 411 169" marker-end="url(#arrO)"/>
  </g>

  <g font-size="11" filter="url(#rough2)">
    <text x="445" y="93" fill="#4a7a3a" font-weight="bold">横向 6 对</text>
    <text x="445" y="117" fill="#d6a040" font-weight="bold">纵向 6 对</text>
    <text x="445" y="141" fill="#555" font-weight="bold">共 12 对</text>
  </g>

  <!-- bottom note box -->
  <rect x="48" y="268" width="424" height="96" fill="#ffffff" stroke="#999" stroke-width="1.4" stroke-dasharray="6 4" rx="10" filter="url(#rough2)"/>
  <text x="260" y="292" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">读题三个关键点</text>
  <text x="260" y="312" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">① 相邻 = |a−c| + |b−d| = 1（上下左右 4 方向），对角线不算相邻</text>
  <text x="260" y="330" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">② 3×3 内相邻对共 12 条：横向 6 + 纵向 6，条条都要 |差| ≤ threshold</text>
  <text x="260" y="348" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">③ 一个像素可属多个区域（最多 9 个），聚合时先取整再平均</text>
</svg>
