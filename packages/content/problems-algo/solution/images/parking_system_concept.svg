<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto">
      <path d="M0,0 L5,8 L10,0" fill="none" stroke="#b85450" stroke-width="1.5"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,3 L8,3" fill="none" stroke="#446688" stroke-width="1.5"/>
      <path d="M6,0 L9,3 L6,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="540" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：三类车位各维护一个剩余计数，addCar 即对应计数减一</text>

  <!-- addCar call label -->
  <text x="130" y="78" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">addCar(1)</text>
  <path d="M 130 86 L 130 116" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Big lot (type 1): blue -->
  <rect x="70" y="120" width="120" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="130" y="144" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">大型车位 (1)</text>
  <line x1="86" y1="154" x2="174" y2="154" stroke="#446688" stroke-width="0.8" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="130" y="184" text-anchor="middle" font-size="22" fill="#333" font-family="monospace" font-weight="bold">1</text>
  <text x="130" y="204" text-anchor="middle" font-size="10" fill="#888">剩余车位</text>

  <!-- Medium lot (type 2): green -->
  <rect x="210" y="120" width="120" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="144" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">中型车位 (2)</text>
  <line x1="226" y1="154" x2="314" y2="154" stroke="#4a7a3a" stroke-width="0.8" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="270" y="184" text-anchor="middle" font-size="22" fill="#333" font-family="monospace" font-weight="bold">1</text>
  <text x="270" y="204" text-anchor="middle" font-size="10" fill="#888">剩余车位</text>

  <!-- Small lot (type 3): orange -->
  <rect x="350" y="120" width="120" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="410" y="144" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">小型车位 (3)</text>
  <line x1="366" y1="154" x2="454" y2="154" stroke="#d6a040" stroke-width="0.8" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="410" y="184" text-anchor="middle" font-size="22" fill="#333" font-family="monospace" font-weight="bold">0</text>
  <text x="410" y="204" text-anchor="middle" font-size="10" fill="#888">剩余车位</text>

  <!-- Decrement annotation under big lot -->
  <text x="130" y="234" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1 → 0</text>
  <text x="130" y="250" text-anchor="middle" font-size="10.5" fill="#b85450">计数 &gt; 0，减一后返回 true</text>

  <!-- Index mapping hint -->
  <rect x="70" y="272" width="400" height="50" fill="#f0f7ff" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="290" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">用数组 slots[4] 存储：slots[carType] = 该类型剩余车位数</text>
  <text x="270" y="308" text-anchor="middle" font-size="10.5" fill="#888">carType ∈ {1,2,3} 天然可作数组下标，1-indexed 恰好跳过 slots[0]</text>
</svg>
