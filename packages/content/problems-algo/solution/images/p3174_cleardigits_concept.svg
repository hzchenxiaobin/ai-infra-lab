<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：栈只存「幸存字母」，数字来了弹栈顶配对</text>

  <!-- pairing arcs above cells -->
  <path d="M 140 62 C 150 30, 286 30, 296 62" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="218" y="26" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">外层配对 (b, 2)</text>

  <path d="M 192 62 C 197 46, 239 46, 244 62" stroke="#b85450" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="218" y="59" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">内层 (c,1)</text>

  <!-- string cells: s = "abc12" -->
  <text x="40" y="90" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">s =</text>

  <rect x="64" y="66" width="48" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="88" y="92" text-anchor="middle" font-size="17" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="88" y="124" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">0</text>

  <rect x="116" y="66" width="48" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="140" y="92" text-anchor="middle" font-size="17" fill="#446688" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="140" y="124" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">1</text>

  <rect x="168" y="66" width="48" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="192" y="92" text-anchor="middle" font-size="17" fill="#446688" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="192" y="124" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">2</text>

  <rect x="220" y="66" width="48" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="244" y="92" text-anchor="middle" font-size="17" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="244" y="124" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">3</text>

  <rect x="272" y="66" width="48" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="296" y="92" text-anchor="middle" font-size="17" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="296" y="124" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">4</text>

  <text x="40" y="142" font-size="10.5" fill="#333" filter="url(#rough2)">删 2 时 c 已随 1 消失 → 左边最近的「幸存字母」是 b（即栈顶）</text>

  <!-- stack captions -->
  <text x="125" y="166" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">快照① 扫完 "abc"</text>
  <text x="260" y="166" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">快照② 遇 1，弹 c</text>
  <text x="395" y="166" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold" filter="url(#rough2)">快照③ 遇 2，弹 b</text>

  <text x="62" y="196" text-anchor="end" font-size="9" fill="#888" filter="url(#rough2)">栈顶</text>
  <text x="62" y="266" text-anchor="end" font-size="9" fill="#888" filter="url(#rough2)">栈底</text>

  <!-- stack 1 -->
  <rect x="70" y="172" width="110" height="126" fill="#fafafa" stroke="#999" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <rect x="103" y="180" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="125" y="197" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">c</text>
  <rect x="103" y="214" width="44" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="125" y="231" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="103" y="248" width="44" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="125" y="265" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>

  <path d="M 182 235 L 201 235" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- stack 2 -->
  <rect x="205" y="172" width="110" height="126" fill="#fafafa" stroke="#999" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <rect x="238" y="180" width="44" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="197" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="238" y="214" width="44" height="26" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="231" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>

  <path d="M 317 235 L 336 235" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- stack 3 -->
  <rect x="340" y="172" width="110" height="126" fill="#fafafa" stroke="#999" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <rect x="373" y="180" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="395" y="197" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="395" y="230" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">幸存到终态</text>

  <!-- conclusion -->
  <rect x="40" y="316" width="440" height="88" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="340" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">数字 = 右括号，字母 = 通配左括号：配对可嵌套</text>
  <text x="260" y="360" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">内层 (c,1) 先消，外层 2 越过它去配 b —— 栈弹顶自动工作在「当前串」语义</text>
  <text x="260" y="384" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">扫描结束：栈底→栈顶拼接 = "a" ✓</text>
</svg>
