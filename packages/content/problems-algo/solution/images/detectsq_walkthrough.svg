<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：count([11, 10]) = 2（添加 B' 后）</text>

  <!-- Coordinate plane (scaled) -->
  <!-- map: x in [0,20] -> px 60..420 (18/unit), y in [0,12] -> py 380..60 (26.7/unit, inverted) -->
  <line x1="60" y1="380" x2="440" y2="380" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="60" y1="380" x2="60" y2="50" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="448" y="394" font-size="11" fill="#888">x</text>
  <text x="50" y="46" font-size="11" fill="#888">y</text>

  <!-- grid labels -->
  <text x="156" y="396" font-size="10" fill="#aaa">3</text>
  <text x="300" y="396" font-size="10" fill="#aaa">11</text>
  <text x="54" y="120" font-size="10" fill="#aaa" text-anchor="end">10</text>
  <text x="54" y="334" font-size="10" fill="#aaa" text-anchor="end">2</text>

  <!-- Square outline: Q(11,10) P(3,10) (3,2) (11,2) -->
  <!-- Q=(11,10)->(300,120); P=(3,10)->(156,120); (3,2)->(156,334); (11,2)->(300,334) -->
  <rect x="156" y="120" width="144" height="214" fill="#e8f0fe" fill-opacity="0.4" stroke="#446688" stroke-width="1.6" stroke-dasharray="5,3" rx="2" filter="url(#rough2)"/>

  <!-- Points -->
  <!-- A (3,10) -->
  <circle cx="156" cy="120" r="6" fill="#4a7a3a" stroke="#2f5a22" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="120" y="112" font-size="11" fill="#4a7a3a" font-weight="bold">A(3,10)</text>

  <!-- C (3,2) -->
  <circle cx="156" cy="334" r="6" fill="#4a7a3a" stroke="#2f5a22" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="120" y="352" font-size="11" fill="#4a7a3a" font-weight="bold">C(3,2)</text>

  <!-- B, B' (11,2) duplicate shown as stacked -->
  <circle cx="300" cy="334" r="6" fill="#d6a040" stroke="#a87a26" stroke-width="1.4" filter="url(#rough2)"/>
  <circle cx="308" cy="340" r="6" fill="#d6a040" stroke="#a87a26" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="316" y="352" font-size="11" fill="#d6a040" font-weight="bold">B,B'(11,2)×2</text>

  <!-- Query Q (11,10) -->
  <circle cx="300" cy="120" r="7" fill="#b85450" stroke="#8a3a36" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="316" y="112" font-size="11" fill="#b85450" font-weight="bold">查询 Q(11,10)</text>

  <!-- d annotation: side = 8 -->
  <line x1="300" y1="138" x2="300" y2="316" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="312" y="232" font-size="11" fill="#b85450" font-weight="bold">d=8</text>

  <!-- Calculation panel -->
  <rect x="460" y="60" width="170" height="380" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="545" y="82" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">逐步演算</text>

  <text x="472" y="108" font-size="11" fill="#555" font-weight="bold">同列点 px=11：</text>
  <text x="472" y="126" font-size="11" fill="#555">y=2, cnt=2</text>
  <text x="472" y="144" font-size="11" fill="#555">y=10(查询, 跳过)</text>

  <text x="472" y="172" font-size="11" fill="#555" font-weight="bold">边长 d=|2−10|=8</text>

  <text x="472" y="200" font-size="11" fill="#4a7a3a" font-weight="bold">朝左 x=11−8=3</text>
  <text x="472" y="218" font-size="11" fill="#555">cnt[3][10]=1</text>
  <text x="472" y="236" font-size="11" fill="#555">cnt[3][2]=1</text>
  <text x="472" y="254" font-size="11" fill="#b85450" font-weight="bold">贡献 2×1×1=2</text>

  <text x="472" y="282" font-size="11" fill="#4a7a3a" font-weight="bold">朝右 x=11+8=19</text>
  <text x="472" y="300" font-size="11" fill="#555">cnt[19][10]=0</text>
  <text x="472" y="318" font-size="11" fill="#b85450" font-weight="bold">贡献 0</text>

  <line x1="472" y1="334" x2="618" y2="334" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="472" y="360" font-size="12" fill="#333" font-weight="bold">ans = 2 + 0 = 2</text>
  <text x="472" y="382" font-size="10" fill="#888">B' 副本使同列点 cnt 由 1→2，</text>
  <text x="472" y="398" font-size="10" fill="#888">方案数随之翻倍 ✅</text>
  <text x="472" y="424" font-size="11" fill="#b85450" font-weight="bold">返回 2</text>
</svg>
