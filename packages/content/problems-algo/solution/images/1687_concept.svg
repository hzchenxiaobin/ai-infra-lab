<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">一趟行程的代价 = 2 + 箱子间码头切换次数</text>

  <!-- Boxes row -->
  <text x="20" y="60" font-size="13" fill="#666" filter="url(#rough2)">箱子：</text>

  <!-- Trip 1: box 0, port 1 -->
  <rect x="70" y="48" width="50" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="62" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">码头1</text>
  <text x="95" y="76" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">wt=2</text>

  <!-- gap -->
  <text x="128" y="66" font-size="14" fill="#b85450" filter="url(#rough2)">|</text>

  <!-- Trip 2: boxes 1,2,3, ports 3,3,3 -->
  <rect x="140" y="48" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="165" y="62" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">码头3</text>
  <text x="165" y="76" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">wt=3</text>

  <rect x="195" y="48" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="62" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">码头3</text>
  <text x="220" y="76" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">wt=1</text>

  <rect x="250" y="48" width="50" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="275" y="62" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">码头3</text>
  <text x="275" y="76" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">wt=1</text>

  <!-- gap -->
  <text x="308" y="66" font-size="14" fill="#b85450" filter="url(#rough2)">|</text>

  <!-- Trip 3: box 4, port 2 -->
  <rect x="320" y="48" width="50" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="345" y="62" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">码头2</text>
  <text x="345" y="76" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">wt=4</text>

  <!-- Trip brackets and costs -->
  <!-- Trip 1 bracket -->
  <path d="M 70 95 Q 70 102, 78 102 L 112 102 Q 120 102, 120 95" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="95" y="118" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">行程1</text>
  <text x="95" y="132" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">2+0=2</text>

  <!-- Trip 2 bracket -->
  <path d="M 140 95 Q 140 102, 148 102 L 292 102 Q 300 102, 300 95" fill="none" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="220" y="118" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">行程2</text>
  <text x="220" y="132" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">2+0=2（码头不变）</text>

  <!-- Trip 3 bracket -->
  <path d="M 320 95 Q 320 102, 328 102 L 362 102 Q 370 102, 370 95" fill="none" stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="345" y="118" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">行程3</text>
  <text x="345" y="132" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">2+0=2</text>

  <!-- Total -->
  <text x="280" y="155" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">总行程 = 2 + 2 + 2 = 6</text>

  <!-- Divider -->
  <line x1="40" y1="170" x2="520" y2="170" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Cost formula -->
  <text x="20" y="195" font-size="13" fill="#333" filter="url(#rough2)">代价公式：</text>
  <rect x="100" y="182" width="380" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="290" y="200" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">cost(j, i) = 2 + p[i] − p[j]</text>

  <text x="20" y="230" font-size="11" fill="#666" filter="url(#rough2)">其中 p[k] = boxes[0..k-1] 间的码头切换次数</text>

  <!-- DP recurrence -->
  <text x="20" y="262" font-size="13" fill="#333" filter="url(#rough2)">DP 转移：</text>
  <rect x="90" y="248" width="410" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="295" y="267" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">dp[i] = min&#8201;{ dp[j] + 2 + p[i] − p[j+1] }</text>

  <!-- Key transformation -->
  <text x="20" y="305" font-size="13" fill="#333" filter="url(#rough2)">提取公因：</text>
  <rect x="100" y="292" width="400" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="300" y="311" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">dp[i] = p[i] + 2 + min&#8201;{ dp[k−1] − p[k] }</text>

  <text x="290" y="340" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">记 g[k] = dp[k−1] − p[k]，只需维护滑动窗口内 g[k] 的最小值</text>

  <!-- Constraints box -->
  <rect x="60" y="355" width="440" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="372" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">有效 k 需满足：① 箱子数 i−k+1 ≤ maxBoxes</text>
  <text x="280" y="386" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">② 总重 prefixW[i] − prefixW[k−1] ≤ maxWeight</text>
</svg>
