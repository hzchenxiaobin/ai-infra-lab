<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">示例演算：grid = [[X,Y,.],[Y,.,.]]，答案 = 3</text>

  <!-- 原矩阵 -->
  <text x="100" y="40" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">原矩阵（橙 = 锚点）</text>
  <rect x="40" y="44" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="69" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">X</text>
  <rect x="80" y="44" width="40" height="40" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="69" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">Y</text>
  <rect x="120" y="44" width="40" height="40" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="140" y="69" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">.</text>
  <rect x="40" y="84" width="40" height="40" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="60" y="109" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">Y</text>
  <rect x="80" y="84" width="40" height="40" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="109" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">.</text>
  <rect x="120" y="84" width="40" height="40" fill="#fff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="140" y="109" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">.</text>

  <!-- 列计数器演化 -->
  <rect x="180" y="48" width="152" height="76" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="256" y="64" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333" filter="url(#rough2)">列计数器演化</text>
  <text x="256" y="80" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">行 0 扫完：colX=[1,0,0]</text>
  <text x="256" y="93" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">　　　　　colY=[0,1,0]</text>
  <text x="256" y="107" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">行 1 扫完：colX=[1,0,0]</text>
  <text x="256" y="120" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">　　　　　colY=[1,1,0]</text>

  <!-- 演算表 -->
  <rect x="40" y="140" width="76" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="78" y="157" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">右下角(i,j)</text>
  <rect x="116" y="140" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="144" y="157" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">sx</text>
  <rect x="172" y="140" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="157" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">sy</text>
  <rect x="228" y="140" width="104" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="157" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">判定</text>

  <rect x="40" y="170" width="76" height="24" fill="#fff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="78" y="186" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(0,0)</text>
  <rect x="116" y="170" width="56" height="24" fill="#fff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="144" y="186" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="172" y="170" width="56" height="24" fill="#fff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="200" y="186" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">0</text>
  <rect x="228" y="170" width="104" height="24" fill="#fff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="280" y="186" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">✗ X 多</text>

  <rect x="40" y="194" width="76" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="78" y="210" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(0,1)</text>
  <rect x="116" y="194" width="56" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="144" y="210" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="172" y="194" width="56" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="200" y="210" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="228" y="194" width="104" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="280" y="210" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <rect x="40" y="218" width="76" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="78" y="234" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(0,2)</text>
  <rect x="116" y="218" width="56" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="144" y="234" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="172" y="218" width="56" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="200" y="234" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="228" y="218" width="104" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="280" y="234" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <rect x="40" y="242" width="76" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="78" y="258" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(1,0)</text>
  <rect x="116" y="242" width="56" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="144" y="258" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="172" y="242" width="56" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="200" y="258" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="228" y="242" width="104" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="280" y="258" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <rect x="40" y="266" width="76" height="24" fill="#fff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="78" y="282" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(1,1)</text>
  <rect x="116" y="266" width="56" height="24" fill="#fff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="144" y="282" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="172" y="266" width="56" height="24" fill="#fff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="200" y="282" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="228" y="266" width="104" height="24" fill="#fff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="280" y="282" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">✗ Y 多</text>

  <rect x="40" y="290" width="76" height="24" fill="#fff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="78" y="306" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">(1,2)</text>
  <rect x="116" y="290" width="56" height="24" fill="#fff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="144" y="306" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">1</text>
  <rect x="172" y="290" width="56" height="24" fill="#fff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="200" y="306" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">2</text>
  <rect x="228" y="290" width="104" height="24" fill="#fff" stroke="#999" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="280" y="306" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">✗ Y 多</text>

  <text x="186" y="330" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">'.' 不改变频数 ⇒ (0,2) 与 (0,1) 同判定</text>
  <text x="186" y="346" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">单格 (0,0) 永不满足（X、Y 至少各 1 个）</text>

  <!-- 右侧三个有效子矩阵 -->
  <text x="426" y="40" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#333" filter="url(#rough2)">三个 ✓ 子矩阵</text>

  <rect x="352" y="56" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="369" y="78" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">X</text>
  <rect x="386" y="56" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="403" y="78" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">Y</text>
  <text x="426" y="104" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">(0,1)：X=Y=1</text>

  <rect x="352" y="120" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="369" y="142" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">X</text>
  <rect x="386" y="120" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="403" y="142" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">Y</text>
  <rect x="420" y="120" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="437" y="142" text-anchor="middle" font-size="13" fill="#888" filter="url(#rough2)">.</text>
  <text x="426" y="170" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">(0,2)：X=Y=1</text>

  <rect x="352" y="186" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="369" y="208" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">X</text>
  <rect x="352" y="220" width="34" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="369" y="242" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">Y</text>
  <text x="426" y="272" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">(1,0)：X=Y=1</text>

  <!-- 答案框 -->
  <rect x="352" y="288" width="148" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="426" y="308" text-anchor="middle" font-size="13" font-weight="bold" fill="#333" filter="url(#rough2)">共 3 个好子矩阵</text>
  <text x="426" y="324" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">与示例输出一致 ✓</text>
</svg>
