<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#4a7a3a" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#446688" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#d6a040" stroke-width="1.6" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">核心观察：约束只涉及 x 与 y 的相对顺序</text>
  <text x="260" y="50" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">只需让「所有 y」整体位于「所有 x」左侧，其余字符放哪都行</text>

  <!-- 输入行 s = a a b c -->
  <text x="168" y="89" text-anchor="end" font-size="13" fill="#333" filter="url(#rough2)">s =</text>
  <rect x="175" y="66" width="46" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="198" y="89" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">a</text>
  <rect x="226" y="66" width="46" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="249" y="89" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">a</text>
  <rect x="277" y="66" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="89" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">b</text>
  <rect x="328" y="66" width="46" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="351" y="89" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">c</text>
  <text x="382" y="89" font-size="11" fill="#888" filter="url(#rough2)">x='a'，y='c'</text>

  <!-- 左侧注释 -->
  <text x="95" y="136" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">y 全部跳到头部</text>
  <text x="95" y="154" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">x 全部压到尾部</text>

  <!-- 分派箭头 -->
  <path d="M 351 104 C 351 152, 198 144, 198 186" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 300 104 C 300 148, 249 150, 249 186" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 198 104 C 198 148, 300 150, 300 186" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 249 104 C 249 148, 351 150, 351 186" fill="none" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- 输出行 t = c b a a -->
  <text x="168" y="213" text-anchor="end" font-size="13" fill="#333" filter="url(#rough2)">t =</text>
  <rect x="175" y="190" width="46" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="198" y="213" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">c</text>
  <rect x="226" y="190" width="46" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="249" y="213" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">b</text>
  <rect x="277" y="190" width="46" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="300" y="213" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">a</text>
  <rect x="328" y="190" width="46" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="351" y="213" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">a</text>

  <!-- 区域括线 -->
  <path d="M 176 228 L 176 234 L 220 234 L 220 228" fill="none" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="198" y="250" text-anchor="middle" font-size="11.5" fill="#4a7a3a" filter="url(#rough2)">所有 y</text>
  <text x="198" y="264" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">[0, cy)</text>

  <path d="M 227 228 L 227 234 L 271 234 L 271 228" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="249" y="250" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">其他字符</text>
  <text x="249" y="264" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">任意顺序</text>

  <path d="M 278 228 L 278 234 L 373 234 L 373 228" fill="none" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="325" y="250" text-anchor="middle" font-size="11.5" fill="#d6a040" filter="url(#rough2)">所有 x</text>
  <text x="325" y="264" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">[n−cx, n)</text>

  <!-- 底部注释 -->
  <text x="260" y="308" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">y 区 [0, cy) 与 x 区 [n−cx, n) 不交叠（cy + cx ≤ n）⇒ 任意 y 在任意 x 之前</text>
  <text x="260" y="330" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">计数守恒 ⇒ t 是 s 的排列；x 或 y 不出现时对应段为空，条件自动成立</text>
  <text x="260" y="350" text-anchor="middle" font-size="11" fill="#aaa" filter="url(#rough2)">一趟扫描三路分类：数 y、数 x、收集中间字符，O(n) 收工</text>
</svg>
