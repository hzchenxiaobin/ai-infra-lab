<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 540"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例 1 演算：items = [[1,2],[3,2],[2,4],[5,6],[3,5]]</text>

  <!-- Step 0: Sort -->
  <rect x="40" y="38" width="500" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="60" y="56" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">排序后：</text>
  <text x="118" y="56" font-size="11" fill="#333" filter="url(#rough2)">[1,2]</text>
  <text x="170" y="56" font-size="11" fill="#333" filter="url(#rough2)">[2,4]</text>
  <text x="222" y="56" font-size="11" fill="#333" filter="url(#rough2)">[3,2]</text>
  <text x="278" y="56" font-size="11" fill="#333" filter="url(#rough2)">[3,5]</text>
  <text x="338" y="56" font-size="11" fill="#333" filter="url(#rough2)">[5,6]</text>
  <text x="400" y="56" font-size="10" fill="#888" filter="url(#rough2)">（按 price 升序）</text>
  <text x="118" y="72" font-size="9.5" fill="#888" filter="url(#rough2)">p=1</text>
  <text x="170" y="72" font-size="9.5" fill="#888" filter="url(#rough2)">p=2</text>
  <text x="222" y="72" font-size="9.5" fill="#888" filter="url(#rough2)">p=3</text>
  <text x="278" y="72" font-size="9.5" fill="#888" filter="url(#rough2)">p=3</text>
  <text x="338" y="72" font-size="9.5" fill="#888" filter="url(#rough2)">p=5</text>

  <!-- Step 1: prefMax -->
  <text x="40" y="100" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">prefMax：</text>

  <rect x="108" y="90" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="136" y="108" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>

  <rect x="168" y="90" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="196" y="108" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>

  <rect x="228" y="90" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="256" y="108" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>

  <rect x="288" y="90" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="316" y="108" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>

  <rect x="348" y="90" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="376" y="108" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>

  <text x="416" y="108" font-size="10" fill="#888" filter="url(#rough2)">max(2,4,4,5,6)</text>

  <!-- Divider -->
  <path d="M 40 130 L 540 130" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <text x="40" y="150" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">逐查询 upper_bound（prices = [1,2,3,3,5]）：</text>

  <!-- Table header -->
  <rect x="40" y="160" width="500" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="70" y="176" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">q</text>
  <text x="130" y="176" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">首个 &gt; q 的位置</text>
  <text x="300" y="176" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">idx</text>
  <text x="360" y="176" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">prefMax[idx-1]</text>
  <text x="500" y="176" font-size="10" fill="#555" font-weight="bold" filter="url(#rough2)">ans</text>

  <!-- Row q=1 -->
  <rect x="40" y="184" width="500" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)" opacity="0.5"/>
  <text x="70" y="203" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="130" y="203" font-size="10" fill="#555" filter="url(#rough2)">prices[1]=2 &gt; 1</text>
  <text x="300" y="203" font-size="10" fill="#555" filter="url(#rough2)">1</text>
  <text x="360" y="203" font-size="10" fill="#555" filter="url(#rough2)">prefMax[0]=2</text>
  <text x="500" y="203" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>

  <!-- Row q=2 -->
  <rect x="40" y="214" width="500" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)" opacity="0.5"/>
  <text x="70" y="233" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="130" y="233" font-size="10" fill="#555" filter="url(#rough2)">prices[2]=3 &gt; 2</text>
  <text x="300" y="233" font-size="10" fill="#555" filter="url(#rough2)">2</text>
  <text x="360" y="233" font-size="10" fill="#555" filter="url(#rough2)">prefMax[1]=4</text>
  <text x="500" y="233" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>

  <!-- Row q=3 -->
  <rect x="40" y="244" width="500" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="70" y="263" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="130" y="263" font-size="10" fill="#555" filter="url(#rough2)">prices[4]=5 &gt; 3</text>
  <text x="300" y="263" font-size="10" fill="#555" filter="url(#rough2)">4</text>
  <text x="360" y="263" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">prefMax[3]=5</text>
  <text x="500" y="263" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">5</text>

  <!-- Row q=4 -->
  <rect x="40" y="274" width="500" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="70" y="293" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="130" y="293" font-size="10" fill="#555" filter="url(#rough2)">prices[4]=5 &gt; 4</text>
  <text x="300" y="293" font-size="10" fill="#555" filter="url(#rough2)">4</text>
  <text x="360" y="293" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">prefMax[3]=5</text>
  <text x="500" y="293" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">5</text>

  <!-- Row q=5 -->
  <rect x="40" y="304" width="500" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)" opacity="0.5"/>
  <text x="70" y="323" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5</text>
  <text x="130" y="323" font-size="10" fill="#555" filter="url(#rough2)">无（越界 idx=5）</text>
  <text x="300" y="323" font-size="10" fill="#555" filter="url(#rough2)">5</text>
  <text x="360" y="323" font-size="10" fill="#555" filter="url(#rough2)">prefMax[4]=6</text>
  <text x="500" y="323" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">6</text>

  <!-- Row q=6 -->
  <rect x="40" y="334" width="500" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)" opacity="0.5"/>
  <text x="70" y="353" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="130" y="353" font-size="10" fill="#555" filter="url(#rough2)">无（越界 idx=5）</text>
  <text x="300" y="353" font-size="10" fill="#555" filter="url(#rough2)">5</text>
  <text x="360" y="353" font-size="10" fill="#555" filter="url(#rough2)">prefMax[4]=6</text>
  <text x="500" y="353" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">6</text>

  <!-- Divider -->
  <path d="M 40 376 L 540 376" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Highlight note: q=3 and q=4 same idx -->
  <rect x="40" y="386" width="500" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="56" y="408" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">观察：</text>
  <text x="100" y="408" font-size="10.5" fill="#555" filter="url(#rough2)">q=3 与 q=4 落到同一 idx-1=3——价格 3 是 ≤ 4 的最大价格，二者查到同一组物品</text>

  <!-- Answer box -->
  <rect x="120" y="432" width="340" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="456" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">answer = [2, 4, 5, 5, 6, 6]</text>
  <text x="290" y="474" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">与示例输出一致 ✓</text>

  <!-- Bottom note -->
  <text x="290" y="510" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">prefMax 非降 → idx 越大答案不减；q 小于最小价格时 idx=0 返回 0</text>
</svg>
