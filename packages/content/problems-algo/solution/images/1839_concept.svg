<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：下降点切分非降段，含 5 元音的段即美丽</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#888">示意串 word = "aeiaaioaaaaeiou"</text>

  <!-- ===== char boxes (15 boxes, width 30, y=66) ===== -->
  <!-- seg1: i=0,1,2 (aei) blue -->
  <rect x="80" y="66" width="30" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="88" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>
  <rect x="110" y="66" width="30" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="88" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">e</text>
  <rect x="140" y="66" width="30" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="88" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">i</text>

  <!-- seg2: i=3,4,5,6 (aaio) blue -->
  <rect x="170" y="66" width="30" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="185" y="88" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>
  <rect x="200" y="66" width="30" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="215" y="88" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>
  <rect x="230" y="66" width="30" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="245" y="88" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">i</text>
  <rect x="260" y="66" width="30" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="275" y="88" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">o</text>

  <!-- seg3: i=7..14 (aaaaeiou) green highlighted -->
  <rect x="290" y="66" width="30" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="305" y="88" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>
  <rect x="320" y="66" width="30" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="335" y="88" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>
  <rect x="350" y="66" width="30" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="365" y="88" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>
  <rect x="380" y="66" width="30" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="395" y="88" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>
  <rect x="410" y="66" width="30" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="425" y="88" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">e</text>
  <rect x="440" y="66" width="30" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="455" y="88" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">i</text>
  <rect x="470" y="66" width="30" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="485" y="88" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">o</text>
  <rect x="500" y="66" width="30" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="515" y="88" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">u</text>

  <!-- ===== descent cut markers ===== -->
  <!-- cut1 at x=170: i > a -->
  <path d="M 170 60 L 170 116" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <text x="170" y="56" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">i↓a ✂</text>

  <!-- cut2 at x=290: o > a -->
  <path d="M 290 60 L 290 116" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <text x="290" y="56" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">o↓a ✂</text>

  <!-- ===== segment brackets ===== -->
  <path d="M 82 108 L 82 114 L 168 114 L 168 108" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="125" y="130" text-anchor="middle" font-size="11" fill="#446688">aei · 3 种 · ✗</text>

  <path d="M 172 108 L 172 114 L 288 114 L 288 108" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="230" y="130" text-anchor="middle" font-size="11" fill="#446688">aaio · 3 种 · ✗</text>

  <path d="M 292 108 L 292 114 L 528 114 L 528 108" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="410" y="130" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">aaaaeiou · 5 种 · ✓ 美丽 len=8</text>

  <!-- ===== explanation box ===== -->
  <rect x="60" y="150" width="500" height="210" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="310" y="176" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">两条规则把问题降维成「一次扫描」</text>

  <text x="80" y="206" font-size="12" fill="#b85450" font-weight="bold">规则一：美丽子串必是非降段</text>
  <text x="80" y="224" font-size="11" fill="#666">顺序要求 a ≤ e ≤ i ≤ o ≤ u ⇒ 子串内部不得出现「下降」</text>
  <text x="80" y="240" font-size="11" fill="#666">凡 word[i] &lt; word[i−1] 处即切一刀，美丽子串不能跨刀</text>

  <text x="80" y="270" font-size="12" fill="#4a7a3a" font-weight="bold">规则二：段内凑齐 5 元音即整段美丽</text>
  <text x="80" y="288" font-size="11" fill="#666">非降段内每个「上升」恰引入一个新元音，相等则不增种类</text>
  <text x="80" y="304" font-size="11" fill="#666">distinct 计数到 5 时，从段首到当前都美丽 ⇒ 取最长</text>

  <text x="80" y="336" font-size="11" fill="#d6a040" font-weight="bold">⇒ 维护 left / distinct：遇下降重置，遇上升 distinct++，到 5 即更新 ans</text>

  <!-- arrow linking bracket to explanation -->
  <path d="M 410 138 L 410 148" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
