<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：同用户自连接配对 + 日期差 ≤ 7 过滤</text>

  <!-- ===== Left: Purchases table (6 rows, color by user) ===== -->
  <text x="110" y="50" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">Purchases 表（6 行，按用户着色）</text>

  <!-- header -->
  <rect x="30" y="56" width="170" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="50" y="71" font-size="8" fill="#446688" font-weight="bold">pid</text>
  <text x="95" y="71" font-size="8" fill="#446688" font-weight="bold">user</text>
  <text x="150" y="71" font-size="8" fill="#446688" font-weight="bold">date</text>

  <!-- Row 1: pid4 user2 03-13 (blue) -->
  <rect x="30" y="80" width="170" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="95" font-size="9" fill="#446688">4</text>
  <text x="95" y="95" font-size="9" fill="#446688" font-weight="bold">2</text>
  <text x="150" y="95" font-size="8" fill="#446688">03-13</text>

  <!-- Row 2: pid1 user5 02-11 (gray) -->
  <rect x="30" y="104" width="170" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="119" font-size="9" fill="#999">1</text>
  <text x="95" y="119" font-size="9" fill="#999" font-weight="bold">5</text>
  <text x="150" y="119" font-size="8" fill="#999">02-11</text>

  <!-- Row 3: pid3 user7 06-19 (green) -->
  <rect x="30" y="128" width="170" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="143" font-size="9" fill="#4a7a3a">3</text>
  <text x="95" y="143" font-size="9" fill="#4a7a3a" font-weight="bold">7</text>
  <text x="150" y="143" font-size="8" fill="#4a7a3a">06-19</text>

  <!-- Row 4: pid6 user2 03-20 (blue) -->
  <rect x="30" y="152" width="170" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="167" font-size="9" fill="#446688">6</text>
  <text x="95" y="167" font-size="9" fill="#446688" font-weight="bold">2</text>
  <text x="150" y="167" font-size="8" fill="#446688">03-20</text>

  <!-- Row 5: pid5 user7 06-19 (green) -->
  <rect x="30" y="176" width="170" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="191" font-size="9" fill="#4a7a3a">5</text>
  <text x="95" y="191" font-size="9" fill="#4a7a3a" font-weight="bold">7</text>
  <text x="150" y="191" font-size="8" fill="#4a7a3a">06-19</text>

  <!-- Row 6: pid2 user2 06-08 (blue) -->
  <rect x="30" y="200" width="170" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="50" y="215" font-size="9" fill="#446688">2</text>
  <text x="95" y="215" font-size="9" fill="#446688" font-weight="bold">2</text>
  <text x="150" y="215" font-size="8" fill="#446688">06-08</text>

  <!-- user legend -->
  <rect x="30" y="232" width="170" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="40" y="242" width="14" height="8" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="249" font-size="8" fill="#d6a040">user 2</text>
  <rect x="100" y="242" width="14" height="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" filter="url(#rough2)"/>
  <text x="120" y="249" font-size="8" fill="#d6a040">user 7</text>
  <rect x="40" y="256" width="14" height="8" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="60" y="263" font-size="8" fill="#d6a040">user 5</text>
  <text x="110" y="263" font-size="7" fill="#999">仅 1 行，无对</text>

  <!-- ===== Middle: self-join pairs ===== -->
  <path d="M 202 150 L 240 150" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="244" y="56" width="190" height="210" fill="#fff" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="339" y="74" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">自连接 JOIN</text>
  <text x="339" y="88" text-anchor="middle" font-size="8" fill="#666">ON p1.user=p2.user</text>
  <text x="339" y="100" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">AND p1.pid &lt; p2.pid</text>
  <text x="339" y="112" text-anchor="middle" font-size="7" fill="#888">半空间剪枝，去双向重复</text>

  <line x1="252" y1="120" x2="426" y2="120" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <text x="252" y="134" font-size="8" fill="#888" font-weight="bold">配对</text>
  <text x="312" y="134" font-size="8" fill="#888" font-weight="bold">日期</text>
  <text x="392" y="134" font-size="8" fill="#888" font-weight="bold">|Δ|天</text>

  <!-- pair (4,6) -->
  <rect x="250" y="138" width="178" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="270" y="153" font-size="9" fill="#4a7a3a" font-weight="bold">(4,6)</text>
  <text x="312" y="153" font-size="8" fill="#4a7a3a">03-13↔03-20</text>
  <text x="396" y="153" font-size="9" fill="#4a7a3a" font-weight="bold">7</text>

  <!-- pair (4,2) -->
  <rect x="250" y="162" width="178" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="270" y="177" font-size="9" fill="#555">(4,2)</text>
  <text x="312" y="177" font-size="8" fill="#999">03-13↔06-08</text>
  <text x="396" y="177" font-size="9" fill="#b85450" font-weight="bold">87</text>

  <!-- pair (6,2) -->
  <rect x="250" y="186" width="178" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="270" y="201" font-size="9" fill="#555">(6,2)</text>
  <text x="312" y="201" font-size="8" fill="#999">03-20↔06-08</text>
  <text x="396" y="201" font-size="9" fill="#b85450" font-weight="bold">80</text>

  <!-- pair (3,5) -->
  <rect x="250" y="210" width="178" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="270" y="225" font-size="9" fill="#4a7a3a" font-weight="bold">(3,5)</text>
  <text x="312" y="225" font-size="8" fill="#4a7a3a">06-19↔06-19</text>
  <text x="396" y="225" font-size="9" fill="#4a7a3a" font-weight="bold">0</text>

  <text x="339" y="252" text-anchor="middle" font-size="8" fill="#888">user 5 仅 1 行 → 0 对</text>

  <!-- ===== Right: filter + output ===== -->
  <path d="M 434 161 L 470 161" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- filter gate -->
  <rect x="474" y="56" width="130" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="539" y="76" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">WHERE</text>
  <text x="539" y="90" text-anchor="middle" font-size="8" fill="#b85450">ABS(DATEDIFF)</text>
  <text x="539" y="103" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">&lt;= 7</text>

  <!-- kept pairs -->
  <rect x="474" y="120" width="130" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="539" y="136" text-anchor="middle" font-size="8" fill="#4a7a3a">留 2 对</text>
  <text x="539" y="150" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">(4,6) → user 2</text>
  <text x="539" y="164" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">(3,5) → user 7</text>

  <path d="M 539 176 L 539 194" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- DISTINCT -->
  <rect x="474" y="198" width="130" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="539" y="215" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">DISTINCT user_id</text>
  <text x="539" y="227" text-anchor="middle" font-size="8" fill="#666">{2, 7}</text>

  <path d="M 539 232 L 539 250" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- output -->
  <rect x="474" y="254" width="130" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="539" y="270" text-anchor="middle" font-size="8" fill="#4a7a3a">ORDER BY user_id</text>
  <text x="539" y="290" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">2, 7</text>

  <!-- ===== Bottom note ===== -->
  <rect x="30" y="312" width="560" height="150" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="310" y="332" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">三要素叠加：配对（主键不等）+ 日期差（ABS DATEDIFF）+ 去重输出</text>

  <text x="48" y="354" font-size="9" fill="#446688" font-weight="bold">① 配对</text>
  <text x="48" y="368" font-size="8" fill="#666">p1.user_id = p2.user_id AND p1.purchase_id &lt; p2.purchase_id</text>
  <text x="48" y="380" font-size="7" fill="#888">主键不等：避免自配对 + 去双向重复；不能用 date&lt;date（漏同日对）</text>

  <text x="48" y="400" font-size="9" fill="#b85450" font-weight="bold">② 日期差</text>
  <text x="48" y="414" font-size="8" fill="#666">ABS(DATEDIFF(p1.purchase_date, p2.purchase_date)) &lt;= 7</text>
  <text x="48" y="426" font-size="7" fill="#888">DATEDIFF 可正可负 → ABS；≤7 含等号（用户2 相差 7 天合格）</text>

  <text x="48" y="446" font-size="9" fill="#4a7a3a" font-weight="bold">③ 去重排序</text>
  <text x="120" y="446" font-size="8" fill="#666">DISTINCT user_id → ORDER BY user_id（同一用户多对合格只输出一次）</text>
</svg>
