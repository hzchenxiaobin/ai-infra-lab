<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">仅 3 个节点：判定 root.val == left.val + right.val</text>

  <!-- 树结构 -->
  <circle cx="250" cy="90" r="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="95" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">root</text>

  <circle cx="170" cy="180" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="170" y="185" text-anchor="middle" font-size="13" fill="#333">left</text>
  <line x1="234" y1="106" x2="184" y2="164" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>

  <circle cx="330" cy="180" r="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="330" y="185" text-anchor="middle" font-size="13" fill="#333">right</text>
  <line x1="266" y1="106" x2="316" y2="164" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>

  <!-- 等式说明 -->
  <rect x="80" y="230" width="400" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="256" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">判定条件</text>
  <text x="110" y="282" font-size="13" fill="#555">root.val == left.val + right.val  →  返回 true</text>
  <text x="110" y="304" font-size="13" fill="#555">root.val != left.val + right.val  →  返回 false</text>

  <!-- 箭头指向等式 -->
  <path d="M 250 210 L 250 226" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
