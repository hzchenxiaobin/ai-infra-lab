<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：算缺失和 → 判可行域 → 商余分配</text>

  <!-- 1. compute s -->
  <rect x="160" y="44" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="62" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">① 算缺失和</text>
  <text x="270" y="78" text-anchor="middle" font-size="10.5" fill="#555">s = mean×(n+m) − Σrolls</text>

  <path d="M 270 84 L 270 102" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. decision: feasibility -->
  <polygon points="270,102 390,142 270,182 150,142" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="138" text-anchor="middle" font-size="11.5" fill="#333">s &lt; n 或 s &gt; 6n ?</text>
  <text x="270" y="154" text-anchor="middle" font-size="10" fill="#888">(越界即无解)</text>

  <!-- yes -> return [] -->
  <path d="M 390 142 L 460 142" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="450" y="128" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="490" y="147" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">return []</text>

  <!-- no ↓ -->
  <path d="M 270 182 L 270 200" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="196" font-size="10.5" fill="#4a7a3a" font-weight="bold">否 ↓</text>

  <!-- 3. quotient / remainder -->
  <rect x="150" y="200" width="240" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="218" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">② 商余分解</text>
  <text x="270" y="234" text-anchor="middle" font-size="10.5" fill="#555">q = s ÷ n，r = s mod n</text>

  <path d="M 270 240 L 270 258" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4. fill ans -->
  <rect x="130" y="258" width="280" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="278" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">③ 均匀填充 ans[0..n−1]</text>
  <text x="270" y="295" text-anchor="middle" font-size="10.5" fill="#d6a040">前 r 个 → q+1</text>
  <text x="270" y="308" text-anchor="middle" font-size="10.5" fill="#446688">后 n−r 个 → q</text>

  <path d="M 270 308 L 270 326" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 5. return ans -->
  <rect x="190" y="326" width="160" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="349" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">④ return ans</text>

  <!-- right side note: why no search -->
  <rect x="410" y="258" width="120" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="470" y="278" text-anchor="middle" font-size="10.5" fill="#a87020" font-weight="bold">为何不搜索？</text>
  <text x="470" y="295" text-anchor="middle" font-size="9.5" fill="#555">解空间自由度大</text>
  <text x="470" y="308" text-anchor="middle" font-size="9.5" fill="#555">只需任一合法解</text>
  <text x="470" y="324" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">→ 数学构造 O(n)</text>

  <!-- footer -->
  <text x="270" y="392" text-anchor="middle" font-size="10.5" fill="#888">判定用区间 O(1)，构造用商余 O(n)，全程无回溯/DP</text>
  <text x="270" y="410" text-anchor="middle" font-size="10" fill="#aaa">关键：n 个 [1,6] 整数的可达和恰为连续区间 [n, 6n]</text>
</svg>
