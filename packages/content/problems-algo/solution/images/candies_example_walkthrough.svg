<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="340" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：candies = [5,8,6], k = 3</text>
  <text x="310" y="42" text-anchor="middle" font-size="11" fill="#888">hi = max(candies) = 8；绿=可行(往大试)，红=太大(往小试)</text>

  <!-- Table header -->
  <rect x="30" y="56" width="560" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="60" y="74" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">轮次</text>
  <text x="135" y="74" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[lo, hi]</text>
  <text x="215" y="74" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">mid</text>
  <text x="370" y="74" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">count = Σ⌊c[i]/mid⌋</text>
  <text x="500" y="74" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">判定 / 动作</text>

  <!-- vertical separators -->
  <line x1="95" y1="56" x2="95" y2="262" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="175" y1="56" x2="175" y2="262" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="255" y1="56" x2="255" y2="262" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="470" y1="56" x2="470" y2="262" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1 -->
  <rect x="30" y="86" width="560" height="40" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="111" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">①</text>
  <text x="135" y="111" text-anchor="middle" font-size="11" fill="#333">[1, 8]</text>
  <text x="215" y="111" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="362" y="111" text-anchor="middle" font-size="11" fill="#333">1 + 2 + 1 = 4</text>
  <text x="500" y="105" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">4 ≥ 3 ✓</text>
  <text x="500" y="120" text-anchor="middle" font-size="10" fill="#555">ans=4, lo=5</text>

  <!-- Row 2 -->
  <rect x="30" y="128" width="560" height="40" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="153" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">②</text>
  <text x="135" y="153" text-anchor="middle" font-size="11" fill="#333">[5, 8]</text>
  <text x="215" y="153" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="362" y="153" text-anchor="middle" font-size="11" fill="#333">0 + 1 + 1 = 2</text>
  <text x="500" y="147" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2 &lt; 3 ✗</text>
  <text x="500" y="162" text-anchor="middle" font-size="10" fill="#555">hi = 5</text>

  <!-- Row 3 -->
  <rect x="30" y="170" width="560" height="40" fill="#ffffff" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="195" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">③</text>
  <text x="135" y="195" text-anchor="middle" font-size="11" fill="#333">[5, 5]</text>
  <text x="215" y="195" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="362" y="195" text-anchor="middle" font-size="11" fill="#333">1 + 1 + 1 = 3</text>
  <text x="500" y="189" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">3 ≥ 3 ✓</text>
  <text x="500" y="204" text-anchor="middle" font-size="10" fill="#555">ans=5, lo=6</text>

  <!-- Row 4 -->
  <rect x="30" y="212" width="560" height="40" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="237" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">④</text>
  <text x="135" y="237" text-anchor="middle" font-size="11" fill="#888">lo=6 &gt; hi=5</text>
  <text x="215" y="237" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="362" y="237" text-anchor="middle" font-size="11" fill="#888">循环结束</text>
  <text x="500" y="237" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">返回 ans = 5</text>

  <!-- arrow down -->
  <path d="M 310 262 L 310 280" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- bottom note -->
  <rect x="60" y="284" width="500" height="48" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="310" y="304" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">检查 count(5) = ⌊5/5⌋+⌊8/5⌋+⌊6/5⌋ = 1+1+1 = 3 ≥ k</text>
  <text x="310" y="322" text-anchor="middle" font-size="10" fill="#666">堆 8 → [5,3]、堆 6 → [5,1]、堆 5 → [5]，共 3 份 ×5 颗分给 3 个小孩</text>
</svg>
