<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 415" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="415" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">算法流程：迭代 DFS 定序 → 逆序（后序）DP → 总分减根</text>

  <!-- step 1 -->
  <rect x="60" y="46" width="200" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="160" y="69" text-anchor="middle" font-size="12" fill="#2c4a6e" filter="url(#rough2)">① 建无向邻接表 g</text>

  <path d="M 160 82 L 160 102" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)" marker-end="url(#arr)"/>

  <!-- step 2 -->
  <rect x="60" y="106" width="200" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12" fill="#2c4a6e">
    <text x="160" y="126" text-anchor="middle">② 栈模拟 DFS</text>
    <text x="160" y="143" text-anchor="middle" font-size="11">收集 order + parent（父先于子）</text>
  </g>

  <path d="M 160 154 L 160 174" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)" marker-end="url(#arr)"/>

  <!-- step 3 -->
  <rect x="60" y="178" width="200" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12" fill="#8a6414">
    <text x="160" y="195" text-anchor="middle">③ 逆序遍历 order</text>
    <text x="160" y="211" text-anchor="middle" font-size="11">（保证孩子先于父处理）</text>
  </g>

  <path d="M 260 198 L 296 198" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)" marker-end="url(#arr)"/>

  <!-- step 4: per-node box -->
  <rect x="300" y="130" width="235" height="150" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="417" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e5c22" filter="url(#rough2)">④ 对每个节点 x（孩子已算完）</text>

  <rect x="312" y="164" width="211" height="44" fill="#fff" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#2e5c22">
    <text x="417" y="182" text-anchor="middle">叶子：keep[x] = values[x]</text>
    <text x="417" y="199" text-anchor="middle" font-size="10.5">根→叶路径只剩自己，必须保留</text>
  </g>

  <rect x="312" y="216" width="211" height="56" fill="#fff" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#2e5c22">
    <text x="417" y="234" text-anchor="middle">内部：keep[x] =</text>
    <text x="417" y="250" text-anchor="middle">min(values[x], Σ keep[y])</text>
    <text x="417" y="266" text-anchor="middle" font-size="10.5">保留自己 vs 交给子树</text>
  </g>

  <!-- final arrow to step 5 -->
  <path d="M 417 280 L 417 316 L 160 316 L 160 330" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)" marker-end="url(#arr)"/>

  <!-- back edge: next x -->
  <path d="M 310 280 L 310 304 L 30 304 L 30 198 L 56 198" fill="none" stroke="#b85450" stroke-width="1.4" stroke-dasharray="5 4" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="170" y="299" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">每处理完一个 x 就回到 ③</text>

  <!-- step 5 -->
  <rect x="60" y="334" width="200" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="12" fill="#2c4a6e">
    <text x="160" y="354" text-anchor="middle">⑤ 返回 Σ values − keep[0]</text>
    <text x="160" y="371" text-anchor="middle" font-size="11">（总分 − 最小保留分）</text>
  </g>

  <!-- warning box -->
  <rect x="300" y="330" width="235" height="78" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="10.5" fill="#8c3a36">
    <text x="417" y="350" text-anchor="middle" font-size="11.5" font-weight="bold">⚠️ 防爆栈提示</text>
    <text x="417" y="366" text-anchor="middle">n ≤ 2×10⁴，链形树深可达 2×10⁴</text>
    <text x="417" y="381" text-anchor="middle">Python 递归必爆栈 → 显式栈迭代</text>
    <text x="417" y="396" text-anchor="middle">C++ 递归一般可过，迭代更稳</text>
  </g>
</svg>
