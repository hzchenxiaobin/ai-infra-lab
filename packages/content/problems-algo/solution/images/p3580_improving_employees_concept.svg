<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">核心观察：按日期取每人最近 3 次评分，做「严格递增」检查</text>

  <text x="75" y="50" text-anchor="middle" font-size="10" fill="#888">员工</text>
  <text x="200" y="50" text-anchor="middle" font-size="10" fill="#888">评估序列（左旧 → 右新）</text>
  <text x="420" y="50" text-anchor="middle" font-size="10" fill="#888">最近 3 次判定</text>

  <!-- Alice -->
  <text x="112" y="83" text-anchor="end" font-size="10.5" fill="#333">Alice</text>
  <rect x="135" y="66" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="83" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="170" y="66" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="185" y="83" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="205" y="66" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="83" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="240" y="66" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="83" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="150" y="101" text-anchor="middle" font-size="7" fill="#999">01-15</text>
  <text x="185" y="101" text-anchor="middle" font-size="7" fill="#999">04-15</text>
  <text x="220" y="101" text-anchor="middle" font-size="7" fill="#999">07-15</text>
  <text x="255" y="101" text-anchor="middle" font-size="7" fill="#999">10-15</text>
  <rect x="310" y="66" width="215" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="417" y="83" text-anchor="middle" font-size="9.5" fill="#4a7a3a">3 &lt; 4 &lt; 5 ✓ 进步 2</text>

  <!-- Bob -->
  <text x="112" y="145" text-anchor="end" font-size="10.5" fill="#333">Bob</text>
  <rect x="135" y="128" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="145" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="170" y="128" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="185" y="145" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="205" y="128" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="145" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="240" y="128" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="145" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="310" y="128" width="215" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="417" y="145" text-anchor="middle" font-size="9.5" fill="#4a7a3a">2 &lt; 4 &lt; 5 ✓ 进步 3</text>

  <!-- Carol -->
  <text x="112" y="207" text-anchor="end" font-size="10.5" fill="#333">Carol</text>
  <rect x="135" y="190" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="207" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="170" y="190" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="185" y="207" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="205" y="190" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="207" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="240" y="190" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="207" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="310" y="190" width="215" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="417" y="207" text-anchor="middle" font-size="9.5" fill="#4a7a3a">2 &lt; 3 &lt; 4 ✓ 进步 2</text>

  <!-- David -->
  <text x="112" y="269" text-anchor="end" font-size="10.5" fill="#333">David</text>
  <rect x="135" y="252" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="269" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="170" y="252" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="185" y="269" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="205" y="252" width="30" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="269" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="310" y="252" width="215" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="417" y="269" text-anchor="middle" font-size="9.5" fill="#b85450">4 &lt; 4 不成立 ✗</text>

  <!-- Emma -->
  <text x="112" y="331" text-anchor="end" font-size="10.5" fill="#333">Emma</text>
  <rect x="135" y="314" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="150" y="331" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="170" y="314" width="30" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="185" y="331" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="310" y="314" width="215" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="417" y="331" text-anchor="middle" font-size="9.5" fill="#b85450">仅 2 次，不足 3 次 ✗</text>

  <!-- annotation: last-3 window on Alice -->
  <path d="M165 58 L165 48 L272 48" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)" marker-end="url(#arrO)"/>
  <text x="218" y="43" text-anchor="middle" font-size="8.5" fill="#d6a040">最近 3 次（rn ≤ 3）</text>

  <!-- legend -->
  <text x="280" y="364" text-anchor="middle" font-size="9.5" fill="#555">橙色 = 最近 3 次窗口（ROW_NUMBER 按 review_date 倒序取 rn ≤ 3）；蓝色 = 不参与判定的行</text>
  <text x="280" y="384" text-anchor="middle" font-size="9.5" fill="#555">进步分数 = 最新评分(rn=1) − 最早评分(rn=3)；判定条件：r_earliest &lt; r_mid &lt; r_latest</text>
</svg>
