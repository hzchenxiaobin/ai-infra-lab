<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：nums = [1,100,200,1,100], key = 1</text>
  <text x="270" y="40" text-anchor="middle" font-size="10.5" fill="#888">逐位扫描：i 从 0 到 3，遇 key=1 则把 nums[i+1] 计入 count</text>

  <!-- ===== Table outer frame ===== -->
  <rect x="20" y="58" width="500" height="208" fill="none" stroke="#888" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- Column dividers -->
  <line x1="60" y1="58" x2="60" y2="266" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="120" y1="58" x2="120" y2="266" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="220" y1="58" x2="220" y2="266" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="330" y1="58" x2="330" y2="266" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <line x1="440" y1="58" x2="440" y2="266" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>

  <!-- Header row divider -->
  <line x1="20" y1="86" x2="520" y2="86" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <!-- Header background -->
  <rect x="21" y="59" width="498" height="26" fill="#e8f0fe" stroke="none" filter="url(#rough2)"/>

  <!-- Header text -->
  <text x="40" y="77" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">i</text>
  <text x="90" y="77" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">nums[i]</text>
  <text x="170" y="77" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">==key?</text>
  <text x="275" y="77" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">target=nums[i+1]</text>
  <text x="385" y="77" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">count 变化</text>
  <text x="480" y="77" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">ansTarget</text>

  <!-- Row i=0: nums[0]=1==key, target=nums[1]=100 -->
  <rect x="21" y="87" width="498" height="44" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <line x1="20" y1="131" x2="520" y2="131" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="113" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">0</text>
  <text x="90" y="113" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="170" y="113" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 是</text>
  <text x="275" y="113" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">100</text>
  <text x="385" y="113" text-anchor="middle" font-size="11" fill="#333">{100: 1}</text>
  <text x="480" y="113" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">100</text>

  <!-- Row i=1: nums[1]=100!=key -->
  <rect x="21" y="131" width="498" height="44" fill="#fce4ec" stroke="none" filter="url(#rough2)"/>
  <line x1="20" y1="175" x2="520" y2="175" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="157" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">1</text>
  <text x="90" y="157" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">100</text>
  <text x="170" y="157" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗ 否</text>
  <text x="275" y="157" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="385" y="157" text-anchor="middle" font-size="11" fill="#888">(不变)</text>
  <text x="480" y="157" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">100</text>

  <!-- Row i=2: nums[2]=200!=key -->
  <rect x="21" y="175" width="498" height="44" fill="#fce4ec" stroke="none" filter="url(#rough2)"/>
  <line x1="20" y1="219" x2="520" y2="219" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="201" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">2</text>
  <text x="90" y="201" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">200</text>
  <text x="170" y="201" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗ 否</text>
  <text x="275" y="201" text-anchor="middle" font-size="11" fill="#888">—</text>
  <text x="385" y="201" text-anchor="middle" font-size="11" fill="#888">(不变)</text>
  <text x="480" y="201" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">100</text>

  <!-- Row i=3: nums[3]=1==key, target=nums[4]=100 -->
  <rect x="21" y="219" width="498" height="44" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <text x="40" y="245" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">3</text>
  <text x="90" y="245" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <text x="170" y="245" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓ 是</text>
  <text x="275" y="245" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">100</text>
  <text x="385" y="245" text-anchor="middle" font-size="11" fill="#333">{100: 2}</text>
  <text x="480" y="245" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">100</text>

  <!-- ===== Result box ===== -->
  <rect x="60" y="280" width="420" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="300" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">count = {100: 2} → 最大者 100 → 答案</text>
  <text x="270" y="316" text-anchor="middle" font-size="10.5" fill="#555">i=4 是最后一位，无「下一个」，循环到 i ≤ n−2 = 3 结束</text>

  <!-- ===== Insight box ===== -->
  <rect x="40" y="336" width="460" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="356" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">关键：循环上界 n−2（i ≤ n−2）保证 nums[i+1] 必存在</text>
  <text x="270" y="374" text-anchor="middle" font-size="10" fill="#555">一遍扫描同步完成计数与取最大，无需二次遍历</text>
</svg>
