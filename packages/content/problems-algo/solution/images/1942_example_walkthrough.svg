<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="380" fill="#fafafa"/>

  <text x="330" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：times = [[1,4],[2,3],[4,6]], targetFriend = 1</text>
  <text x="330" y="48" text-anchor="middle" font-size="11" fill="#888">事件流：(1,到,0) (2,到,1) (3,离,1) (4,离,0) (4,到,2)</text>

  <!-- table header -->
  <g font-size="12">
    <rect x="30" y="64" width="70" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="65" y="84" text-anchor="middle" fill="#446688" font-weight="bold">时刻</text>
    <rect x="100" y="64" width="120" height="30" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="160" y="84" text-anchor="middle" fill="#446688" font-weight="bold">事件</text>
    <rect x="220" y="64" width="200" height="30" rx="3" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="320" y="84" text-anchor="middle" fill="#d6a040" font-weight="bold">动作</text>
    <rect x="420" y="64" width="90" height="30" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="465" y="84" text-anchor="middle" fill="#b85450" font-weight="bold">available</text>
    <rect x="510" y="64" width="120" height="30" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="570" y="84" text-anchor="middle" fill="#4a7a3a" font-weight="bold">分配结果</text>
  </g>

  <!-- row 1: t=1 arrive friend 0 -->
  <g font-size="11">
    <rect x="30" y="98" width="70" height="40" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="65" y="124" text-anchor="middle" fill="#444">1</text>
    <rect x="100" y="98" width="120" height="40" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="160" y="124" text-anchor="middle" fill="#4a7a3a">朋友0 到达</text>
    <rect x="220" y="98" width="200" height="40" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="320" y="124" text-anchor="middle" fill="#555">堆空 → nextChair=0</text>
    <rect x="420" y="98" width="90" height="40" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="465" y="124" text-anchor="middle" fill="#888">{}</text>
    <rect x="510" y="98" width="120" height="40" rx="3" fill="#fafafa" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>
    <text x="570" y="124" text-anchor="middle" fill="#4a7a3a" font-weight="bold">朋友0→椅0</text>
  </g>

  <!-- row 2: t=2 arrive friend 1 (target) -->
  <g font-size="11">
    <rect x="30" y="142" width="70" height="40" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="65" y="168" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <rect x="100" y="142" width="120" height="40" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="160" y="168" text-anchor="middle" fill="#b85450" font-weight="bold">朋友1 到达 ★</text>
    <rect x="220" y="142" width="200" height="40" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="320" y="168" text-anchor="middle" fill="#b85450">堆空 → nextChair=1</text>
    <rect x="420" y="142" width="90" height="40" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="465" y="168" text-anchor="middle" fill="#888">{}</text>
    <rect x="510" y="142" width="120" height="40" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
    <text x="570" y="168" text-anchor="middle" fill="#4a7a3a" font-weight="bold">朋友1→椅1 ✓</text>
  </g>

  <!-- row 3: hit, return -->
  <g font-size="11">
    <rect x="30" y="186" width="600" height="36" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="330" y="210" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">命中 targetFriend=1，返回 1（无需处理 t=3、4 的事件）</text>
  </g>

  <!-- continuation note for example with target=2 -->
  <rect x="30" y="236" width="600" height="128" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="50" y="260" font-size="12" fill="#444" font-weight="bold">若 targetFriend = 2，则继续处理后续事件：</text>
  <g font-size="11">
    <text x="50" y="284" fill="#b85450">t=3 朋友1 离开 → available.push(1) → available={1}</text>
    <text x="50" y="304" fill="#b85450">t=4 朋友0 离开 → available.push(0) → available={0,1}</text>
    <text x="50" y="324" fill="#4a7a3a">t=4 朋友2 到达 → 取堆顶 0 → 朋友2→椅0</text>
    <text x="50" y="346" fill="#4a7a3a" font-weight="bold">→ 返回 0（复用了刚释放的最小号椅）</text>
  </g>
</svg>
