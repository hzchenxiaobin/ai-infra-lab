<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：以长度 2 为阈值分两种改写规则</text>

  <!-- ====== Left branch: len <= 2 → all lowercase ====== -->
  <text x="170" y="64" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">长度 ≤ 2：全小写</text>

  <!-- threshold box -->
  <rect x="80" y="78" width="180" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="170" y="103" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">word.lower()</text>

  <!-- example cells: "a" "an" "of" "to" -->
  <text x="170" y="142" text-anchor="middle" font-size="10" fill="#888">示例</text>
  <!-- "a" -->
  <rect x="90" y="150" width="36" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="108" y="172" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <text x="108" y="198" text-anchor="middle" font-size="9" fill="#aaa">len=1</text>
  <!-- "an" -->
  <rect x="132" y="150" width="48" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="156" y="172" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">an</text>
  <text x="156" y="198" text-anchor="middle" font-size="9" fill="#aaa">len=2</text>
  <!-- "of" -->
  <rect x="186" y="150" width="48" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="172" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">of</text>
  <text x="210" y="198" text-anchor="middle" font-size="9" fill="#aaa">len=2</text>

  <!-- arrow showing input → output -->
  <text x="170" y="222" text-anchor="middle" font-size="10" fill="#888">"An" → "an"　"OF" → "of"</text>

  <!-- ====== Right branch: len >= 3 → capitalize first + lowercase rest ====== -->
  <text x="430" y="64" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">长度 ≥ 3：首字母大写 + 其余小写</text>

  <!-- threshold box -->
  <rect x="340" y="78" width="180" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="103" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">capitalize(word)</text>

  <!-- example cells -->
  <text x="430" y="142" text-anchor="middle" font-size="10" fill="#888">示例</text>
  <!-- "the" → "The" -->
  <rect x="350" y="150" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="378" y="172" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">The</text>
  <text x="378" y="198" text-anchor="middle" font-size="9" fill="#aaa">len=3</text>
  <!-- "love" → "Love" -->
  <rect x="412" y="150" width="64" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="444" y="172" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">Love</text>
  <text x="444" y="198" text-anchor="middle" font-size="9" fill="#aaa">len=4</text>

  <!-- show transformation detail -->
  <text x="430" y="222" text-anchor="middle" font-size="10" fill="#888">"tHe" → "The"　"lOve" → "Love"</text>

  <!-- highlight first letter -->
  <rect x="350" y="150" width="20" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="0" rx="4" filter="url(#rough2)" opacity="0.5"/>
  <rect x="412" y="150" width="22" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="0" rx="4" filter="url(#rough2)" opacity="0.5"/>
  <text x="290" y="170" text-anchor="middle" font-size="9" fill="#b85450">↑</text>
  <text x="290" y="182" text-anchor="middle" font-size="9" fill="#b85450">首字母大写</text>

  <!-- ====== Divider line ====== -->
  <path d="M 290 60 L 290 230" stroke="#ccc" stroke-width="1" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>

  <!-- ====== Threshold emphasis ====== -->
  <rect x="180" y="252" width="220" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="272" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">阈值判定：len(word) ≤ 2 ?</text>
  <text x="290" y="288" text-anchor="middle" font-size="10" fill="#666">≤ 2 走左分支（全小写），≥ 3 走右分支（首大余小）</text>

  <!-- ====== Core insight box ====== -->
  <rect x="40" y="312" width="500" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="336" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">关键：规则只依赖单词长度，与原大小写无关</text>
  <text x="290" y="356" text-anchor="middle" font-size="11" fill="#666">短词（≤2）一律小写；长词（≥3）一律「首大写 + 余小写」</text>
  <text x="290" y="374" text-anchor="middle" font-size="11" fill="#666">→ 先 lower 再按长度决定是否 capitalize[0]，可统一处理</text>
</svg>
