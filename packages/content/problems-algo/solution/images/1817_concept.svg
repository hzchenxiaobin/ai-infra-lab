<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：logs → 用户时间集合 → UAM 分布</text>

  <!-- ===== Left: raw logs ===== -->
  <text x="80" y="58" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">操作日志 logs</text>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="32" y="68" width="96" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="56" y="84" fill="#446688" font-weight="bold">[0, 5]</text>
    <rect x="32" y="94" width="96" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="56" y="110" fill="#446688" font-weight="bold">[1, 2]</text>
    <rect x="32" y="120" width="96" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="56" y="136" fill="#446688" font-weight="bold">[0, 2]</text>
    <rect x="32" y="146" width="96" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="56" y="162" fill="#d6a040" font-weight="bold">[0, 5]</text>
    <rect x="32" y="172" width="96" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="56" y="188" fill="#446688" font-weight="bold">[1, 3]</text>
  </g>

  <text x="80" y="212" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">每条 [id, time]</text>

  <!-- arrow to hash map -->
  <path d="M 134 130 L 176 130" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="155" y="124" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">归拢</text>

  <!-- ===== Middle: hash map user -> set ===== -->
  <text x="300" y="58" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">哈希表 userTimes</text>
  <text x="300" y="72" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">用户 ID → 时间集合</text>

  <rect x="184" y="82" width="232" height="120" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>

  <!-- user 0 row -->
  <g filter="url(#rough2)">
    <rect x="196" y="96" width="44" height="28" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="218" y="115" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">ID=0</text>
    <text x="248" y="115" font-size="11" fill="#888">→</text>
    <rect x="264" y="96" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="14"/>
    <text x="284" y="115" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">5</text>
    <rect x="308" y="96" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="14"/>
    <text x="328" y="115" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
    <text x="356" y="115" font-size="9" fill="#b85450">重复5被去重</text>
  </g>

  <!-- user 1 row -->
  <g filter="url(#rough2)">
    <rect x="196" y="138" width="44" height="28" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="218" y="157" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">ID=1</text>
    <text x="248" y="157" font-size="11" fill="#888">→</text>
    <rect x="264" y="138" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="14"/>
    <text x="284" y="157" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">2</text>
    <rect x="308" y="138" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="14"/>
    <text x="328" y="157" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">3</text>
  </g>

  <text x="300" y="188" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">集合自动去重：add 即去重</text>

  <!-- arrow down to UAM -->
  <path d="M 300 206 L 300 230" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="330" y="222" font-size="9" fill="#d6a040" filter="url(#rough2)">len(集合)=UAM</text>

  <!-- ===== Bottom: UAM -> answer distribution ===== -->
  <text x="80" y="252" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">用户 UAM</text>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="32" y="262" width="96" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="80" y="280" fill="#b85450" font-weight="bold">ID=0: UAM=2</text>
    <rect x="32" y="292" width="96" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="80" y="310" fill="#b85450" font-weight="bold">ID=1: UAM=2</text>
  </g>

  <!-- arrow to answer -->
  <path d="M 134 292 L 196 292" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="165" y="286" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">计数</text>

  <!-- answer array -->
  <text x="360" y="252" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">answer（下标 j = UAM）</text>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <text x="226" y="266" font-size="9" fill="#aaa">j=1</text>
    <text x="276" y="266" font-size="9" fill="#aaa">j=2</text>
    <text x="326" y="266" font-size="9" fill="#aaa">j=3</text>
    <text x="376" y="266" font-size="9" fill="#aaa">j=4</text>
    <text x="426" y="266" font-size="9" fill="#aaa">j=5</text>

    <rect x="208" y="272" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="226" y="296" fill="#446688" font-weight="bold" font-size="13">0</text>
    <rect x="258" y="272" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4"/>
    <text x="276" y="296" fill="#d6a040" font-weight="bold" font-size="13">2</text>
    <rect x="308" y="272" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="326" y="296" fill="#446688" font-weight="bold" font-size="13">0</text>
    <rect x="358" y="272" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="376" y="296" fill="#446688" font-weight="bold" font-size="13">0</text>
    <rect x="408" y="272" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="426" y="296" fill="#446688" font-weight="bold" font-size="13">0</text>
  </g>

  <text x="300" y="326" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">两个用户 UAM=2 → answer[2]=2</text>

  <!-- ===== Key insight footer ===== -->
  <rect x="32" y="346" width="496" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="48" y="368" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">两阶段哈希：</text>
  <text x="48" y="386" font-size="10" fill="#555" filter="url(#rough2)">① 哈希表按用户 ID 归拢时间，值用集合 → 插入即去重，O(1) 均摊</text>
  <text x="48" y="402" font-size="10" fill="#555" filter="url(#rough2)">② 遍历哈希表，len(集合) = UAM，再按 UAM 值计数到 answer</text>
  <text x="48" y="424" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">关键：把「去重需求」编码进数据结构（集合），省去额外去重步骤</text>

  <text x="280" y="450" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">一次遍历归拢 O(n) + 分布统计 O(U) = O(n)</text>
</svg>
