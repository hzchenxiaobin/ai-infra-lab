<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n=4, a=2, b=3, L=lcm=6, hi=n·min=8</text>

  <!-- ===== Number line with magical numbers ===== -->
  <text x="40" y="50" font-size="11" fill="#888">神奇数序列：2, 3, 4, 6, 8, 9, 10, 12 …（标 ▼ 的是前 4 个）</text>
  <line x1="60" y1="80" x2="540" y2="80" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 540 80 L 532 76 L 532 84 z" fill="#888" filter="url(#rough2)"/>

  <g font-size="10" fill="#999" filter="url(#rough2)">
    <line x1="100" y1="76" x2="100" y2="84" stroke="#999" stroke-width="1"/>
    <text x="100" y="98" text-anchor="middle">1</text>
    <line x1="140" y1="76" x2="140" y2="84" stroke="#999" stroke-width="1"/>
    <text x="140" y="98" text-anchor="middle">2</text>
    <line x1="180" y1="76" x2="180" y2="84" stroke="#999" stroke-width="1"/>
    <text x="180" y="98" text-anchor="middle">3</text>
    <line x1="220" y1="76" x2="220" y2="84" stroke="#999" stroke-width="1"/>
    <text x="220" y="98" text-anchor="middle">4</text>
    <line x1="260" y1="76" x2="260" y2="84" stroke="#999" stroke-width="1"/>
    <text x="260" y="98" text-anchor="middle">5</text>
    <line x1="300" y1="76" x2="300" y2="84" stroke="#999" stroke-width="1"/>
    <text x="300" y="98" text-anchor="middle">6</text>
    <line x1="340" y1="76" x2="340" y2="84" stroke="#999" stroke-width="1"/>
    <text x="340" y="98" text-anchor="middle">7</text>
    <line x1="380" y1="76" x2="380" y2="84" stroke="#999" stroke-width="1"/>
    <text x="380" y="98" text-anchor="middle">8</text>
    <line x1="420" y1="76" x2="420" y2="84" stroke="#999" stroke-width="1"/>
    <text x="420" y="98" text-anchor="middle">9</text>
    <line x1="460" y1="76" x2="460" y2="84" stroke="#999" stroke-width="1"/>
    <text x="460" y="98" text-anchor="middle">10</text>
    <line x1="500" y1="76" x2="500" y2="84" stroke="#999" stroke-width="1"/>
    <text x="500" y="98" text-anchor="middle">11</text>
  </g>

  <!-- magical markers: 2,3,4,6,8 (first 5) -->
  <g filter="url(#rough2)">
    <path d="M 140 68 L 136 60 L 144 60 z" fill="#446688"/>
    <text x="140" y="56" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">①</text>
    <path d="M 180 68 L 176 60 L 184 60 z" fill="#4a7a3a"/>
    <text x="180" y="56" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">②</text>
    <path d="M 220 68 L 216 60 L 224 60 z" fill="#446688"/>
    <text x="220" y="56" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">③</text>
    <path d="M 300 68 L 296 60 L 304 60 z" fill="#b85450"/>
    <text x="300" y="56" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">④</text>
    <path d="M 380 68 L 376 60 L 384 60 z" fill="#446688"/>
  </g>

  <!-- ===== Binary search table ===== -->
  <text x="40" y="124" font-size="11" fill="#888">二分过程（找最小 x 使 cnt(x) ≥ 4）：</text>

  <!-- Column headers -->
  <text x="40" y="148" font-size="10" fill="#888">轮</text>
  <text x="100" y="148" text-anchor="middle" font-size="10" fill="#888">[lo, hi]</text>
  <text x="170" y="148" text-anchor="middle" font-size="10" fill="#888">mid</text>
  <text x="300" y="148" text-anchor="middle" font-size="10" fill="#888">cnt = ⌊m/a⌋+⌊m/b⌋−⌊m/L⌋</text>
  <text x="440" y="148" text-anchor="middle" font-size="10" fill="#888">判定</text>
  <text x="540" y="148" font-size="10" fill="#888">动作</text>

  <path d="M 24 156 L 576 156" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1: lo=1,hi=8, mid=4, cnt=2+1-0=3<4, 偏小 lo=5 -->
  <text x="40" y="178" font-size="11" fill="#555">1</text>
  <text x="100" y="178" text-anchor="middle" font-size="11" fill="#555">[1, 8]</text>
  <text x="170" y="178" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <text x="300" y="178" text-anchor="middle" font-size="11" fill="#555">2 + 1 − 0 = 3</text>
  <text x="440" y="178" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3 &lt; 4 ✗</text>
  <text x="540" y="178" font-size="11" fill="#b85450">lo=5</text>

  <!-- Row 2: lo=5,hi=8, mid=6, cnt=3+2-1=4>=4, 够 hi=6 -->
  <text x="40" y="208" font-size="11" fill="#555">2</text>
  <text x="100" y="208" text-anchor="middle" font-size="11" fill="#555">[5, 8]</text>
  <text x="170" y="208" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>
  <text x="300" y="208" text-anchor="middle" font-size="11" fill="#555">3 + 2 − 1 = 4</text>
  <text x="440" y="208" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4 ≥ 4 ✓</text>
  <text x="540" y="208" font-size="11" fill="#4a7a3a">hi=6</text>

  <!-- Row 3: lo=5,hi=6, mid=5, cnt=2+1-0=3<4, 偏小 lo=6 -->
  <text x="40" y="238" font-size="11" fill="#555">3</text>
  <text x="100" y="238" text-anchor="middle" font-size="11" fill="#555">[5, 6]</text>
  <text x="170" y="238" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="300" y="238" text-anchor="middle" font-size="11" fill="#555">2 + 1 − 0 = 3</text>
  <text x="440" y="238" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3 &lt; 4 ✗</text>
  <text x="540" y="238" font-size="11" fill="#b85450">lo=6</text>

  <!-- Row 4: lo==hi==6, 结束 -->
  <rect x="24" y="250" width="552" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="40" y="266" font-size="11" fill="#555">结束</text>
  <text x="100" y="266" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">lo = hi = 6</text>
  <text x="300" y="266" text-anchor="middle" font-size="11" fill="#d6a040">cnt(6) = 4，6 本身是神奇数 → 第 4 个</text>
  <text x="540" y="266" font-size="11" fill="#d6a040" font-weight="bold">返回 6</text>

  <path d="M 24 278 L 576 278" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Result box -->
  <rect x="40" y="292" width="520" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="310" font-size="11" fill="#888">结果:</text>
  <text x="300" y="310" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">第 4 个神奇数 = 6 ✓（6 是 2 的倍数，恰为第 4 个神奇数）</text>
  <text x="300" y="328" text-anchor="middle" font-size="10" fill="#4a7a3a">关键: cnt(x) 是阶梯函数，恰在神奇数处跳变；二分收敛到的 lo 必是神奇数</text>
</svg>
