<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="580" height="500" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：startTime=[1,2,3,3] endTime=[3,4,5,6] profit=[50,10,40,70]</text>
  <text x="290" y="40" text-anchor="middle" font-size="10.5" fill="#888">按 endTime 排序后顺序不变</text>

  <!-- Column headers -->
  <rect x="20" y="50" width="540" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="52" y="68" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">i</text>
  <text x="130" y="68" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">工作(s,e,p)</text>
  <text x="234" y="68" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">二分找 j</text>
  <text x="332" y="68" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">不选/选</text>
  <text x="430" y="68" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">dp[i]</text>
  <text x="524" y="68" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">说明</text>

  <!-- dp[0] base row -->
  <rect x="20" y="80" width="540" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="52" y="100" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="130" y="100" text-anchor="middle" font-size="9.5" fill="#888">—（基准）</text>
  <text x="234" y="100" text-anchor="middle" font-size="9.5" fill="#888">—</text>
  <text x="332" y="100" text-anchor="middle" font-size="9.5" fill="#888">—</text>
  <rect x="410" y="86" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="430" y="100" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="524" y="100" text-anchor="middle" font-size="9" fill="#888">dp[0]=0</text>

  <!-- Step i=1 -->
  <rect x="20" y="114" width="540" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="52" y="140" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="92" y="122" width="76" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="130" y="140" text-anchor="middle" font-size="9.5" fill="#333">1,3,50</text>
  <text x="234" y="134" text-anchor="middle" font-size="9.5" fill="#888">endTime≤1</text>
  <text x="234" y="146" text-anchor="middle" font-size="9.5" fill="#b85450">→ j=0</text>
  <text x="332" y="134" text-anchor="middle" font-size="9" fill="#888">max(0,</text>
  <text x="332" y="146" text-anchor="middle" font-size="9" fill="#4a7a3a">50+0)</text>
  <rect x="410" y="122" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="430" y="140" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">50</text>
  <text x="524" y="140" text-anchor="middle" font-size="9" fill="#4a7a3a">选①</text>

  <!-- Step i=2 -->
  <rect x="20" y="160" width="540" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="52" y="186" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="92" y="168" width="76" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="130" y="186" text-anchor="middle" font-size="9.5" fill="#333">2,4,10</text>
  <text x="234" y="180" text-anchor="middle" font-size="9.5" fill="#888">endTime≤2</text>
  <text x="234" y="192" text-anchor="middle" font-size="9.5" fill="#b85450">→ j=0</text>
  <text x="332" y="180" text-anchor="middle" font-size="9" fill="#888">max(50,</text>
  <text x="332" y="192" text-anchor="middle" font-size="9" fill="#b85450">10+0)</text>
  <rect x="410" y="168" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="430" y="186" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">50</text>
  <text x="524" y="186" text-anchor="middle" font-size="9" fill="#b85450">不选②</text>

  <!-- Step i=3 -->
  <rect x="20" y="206" width="540" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="52" y="232" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="92" y="214" width="76" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="130" y="232" text-anchor="middle" font-size="9.5" fill="#333">3,5,40</text>
  <text x="234" y="224" text-anchor="middle" font-size="9.5" fill="#888">endTime≤3</text>
  <text x="234" y="236" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">→ j=1</text>
  <text x="332" y="224" text-anchor="middle" font-size="9" fill="#888">max(50,</text>
  <text x="332" y="236" text-anchor="middle" font-size="9" fill="#4a7a3a">40+50)</text>
  <rect x="410" y="214" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="430" y="232" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">90</text>
  <text x="524" y="232" text-anchor="middle" font-size="9" fill="#4a7a3a">选①③</text>

  <!-- Step i=4 (highlighted, key step) -->
  <rect x="20" y="258" width="540" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="52" y="288" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">4</text>
  <rect x="92" y="266" width="76" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="130" y="284" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">3,6,70</text>
  <text x="234" y="278" text-anchor="middle" font-size="9.5" fill="#888">endTime≤3</text>
  <text x="234" y="290" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">→ j=1</text>
  <text x="234" y="302" text-anchor="middle" font-size="8.5" fill="#d6a040">endTime①=3≤3</text>
  <text x="332" y="278" text-anchor="middle" font-size="9" fill="#888">max(90,</text>
  <text x="332" y="290" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">70+50)</text>
  <text x="332" y="302" text-anchor="middle" font-size="8.5" fill="#d6a040">=120</text>
  <rect x="410" y="268" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="3" filter="url(#rough2)"/>
  <text x="430" y="289" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">120</text>
  <text x="524" y="284" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">选①④</text>
  <text x="524" y="296" text-anchor="middle" font-size="8.5" fill="#d6a040">⚡关键</text>

  <!-- dp array visualization -->
  <text x="290" y="336" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">dp 数组演化（始终非降）</text>

  <rect x="60" y="346" width="460" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="84" y="362" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">下标</text>
  <text x="84" y="380" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">dp</text>

  <rect x="106" y="352" width="56" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="134" y="364" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="134" y="380" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>

  <rect x="166" y="352" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="194" y="364" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="194" y="380" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">50</text>

  <rect x="226" y="352" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="254" y="364" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="254" y="380" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">50</text>

  <rect x="286" y="352" width="56" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="3" filter="url(#rough2)"/>
  <text x="314" y="364" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="314" y="380" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">90</text>

  <rect x="346" y="352" width="56" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="374" y="364" text-anchor="middle" font-size="9" fill="#d6a040">4</text>
  <text x="374" y="380" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">120</text>

  <path d="M 402 372 L 420 372" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="436" y="376" font-size="9.5" fill="#d6a040" font-weight="bold">答案</text>

  <!-- selected jobs illustration -->
  <text x="290" y="412" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">最优选择：工作①[1-3] + 工作④[3-6] = 50 + 70 = 120</text>

  <rect x="100" y="424" width="120" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="160" y="440" text-anchor="middle" font-size="9.5" fill="#333">①[1-3] p=50</text>

  <path d="M 222 435 L 246 435" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="236" y="430" text-anchor="middle" font-size="8" fill="#4a7a3a">3=3</text>

  <rect x="250" y="424" width="120" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="310" y="440" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">④[3-6] p=70</text>

  <text x="392" y="440" font-size="10.5" fill="#d6a040" font-weight="bold">端点相接 ✓</text>

  <!-- bottom note -->
  <rect x="30" y="460" width="520" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="50" y="478" font-size="10" fill="#333">⚡ <tspan fill="#d6a040" font-weight="bold">第 4 步是精髓</tspan>：选④需跳过②③（冲突），二分定位 j=1（endTime①=3≤3），</text>
  <text x="50" y="490" font-size="10" fill="#333">dp[4]=max(90, 70+50)=120，而非继承 dp[3]=90。二分让「找 j」从 O(n) 降到 O(log n)</text>
</svg>
