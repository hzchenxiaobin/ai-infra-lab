<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">核心：固定频率 k，每个字符独立「选 k 个 / 不选」</text>

  <!-- target k -->
  <rect x="210" y="52" width="140" height="34" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="74" text-anchor="middle" font-size="14" fill="#7a5520" filter="url(#rough2)">目标频率 k = 2</text>

  <!-- character a -->
  <text x="60" y="140" text-anchor="middle" font-size="14" fill="#446688" filter="url(#rough2)">字符 a：f=2</text>
  <rect x="40" y="150" width="40" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="176" text-anchor="middle" font-size="15" fill="#2c3e50" filter="url(#rough2)">a</text>
  <rect x="86" y="150" width="40" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="106" y="176" text-anchor="middle" font-size="15" fill="#2c3e50" filter="url(#rough2)">a</text>

  <!-- two branches for a -->
  <rect x="150" y="120" width="96" height="26" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="198" y="138" text-anchor="middle" font-size="12" fill="#2c4a22" filter="url(#rough2)">选 2 个：C(2,2)=1</text>
  <rect x="150" y="196" width="96" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="198" y="214" text-anchor="middle" font-size="12" fill="#7a2230" filter="url(#rough2)">不选：1 种</text>
  <path d="M 132 162 L 148 135" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 132 178 L 148 206" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- combine bracket -->
  <path d="M 250 110 Q 268 110 268 165 Q 268 220 250 220" fill="none" stroke="#888" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="276" y="170" text-anchor="middle" font-size="13" fill="#555" filter="url(#rough2)">合计</text>
  <rect x="296" y="150" width="120" height="34" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="356" y="172" text-anchor="middle" font-size="13" fill="#7a5520" filter="url(#rough2)">C(2,2)+1 = 2</text>

  <!-- character b -->
  <text x="60" y="276" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">字符 b：f=2</text>
  <rect x="40" y="286" width="40" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="312" text-anchor="middle" font-size="15" fill="#2c4a22" filter="url(#rough2)">b</text>
  <rect x="86" y="286" width="40" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="106" y="312" text-anchor="middle" font-size="15" fill="#2c4a22" filter="url(#rough2)">b</text>
  <rect x="150" y="286" width="120" height="34" rx="7" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="308" text-anchor="middle" font-size="13" fill="#7a5520" filter="url(#rough2)">C(2,2)+1 = 2</text>
  <path d="M 132 306 L 148 303" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- multiply and subtract -->
  <text x="470" y="186" text-anchor="middle" font-size="22" fill="#d6a040" filter="url(#rough2)">×</text>
  <rect x="490" y="150" width="60" height="70" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="520" y="178" text-anchor="middle" font-size="13" fill="#7a2230" filter="url(#rough2)">2×2</text>
  <text x="520" y="200" text-anchor="middle" font-size="13" fill="#7a2230" filter="url(#rough2)">−1</text>
  <text x="520" y="218" text-anchor="middle" font-size="14" fill="#7a2230" filter="url(#rough2)">= 3</text>

  <text x="280" y="346" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">k 固定时：∏(C(f,k)+1) − 1，−1 去掉「全不选」空子序列</text>
</svg>
