<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：多组验证 num+1 去前导 1 的正确性</text>

  <!-- ===== Column headers ===== -->
  <text x="50" y="56" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">num</text>
  <text x="120" y="56" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">组号 k</text>
  <text x="200" y="56" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">偏移=num−(2^k−1)</text>
  <text x="310" y="56" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">num+1</text>
  <text x="410" y="56" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">bin(num+1)</text>
  <text x="515" y="56" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">编码 ✓</text>

  <!-- separator line -->
  <path d="M 30 62 L 540 62" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Row 1: num=0 ===== -->
  <rect x="28" y="68" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50" y="87" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="96" y="68" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="87" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">0</text>
  <rect x="158" y="68" width="84" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="87" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0−0=0</text>
  <rect x="282" y="68" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="310" y="87" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <rect x="370" y="68" width="80" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="87" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"1"</text>
  <rect x="478" y="68" width="74" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="515" y="87" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">""</text>

  <!-- ===== Row 2: num=3 ===== -->
  <rect x="28" y="102" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50" y="121" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="96" y="102" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="121" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="158" y="102" width="84" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="121" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3−3=0</text>
  <rect x="282" y="102" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="310" y="121" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">4</text>
  <rect x="370" y="102" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="121" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"100"</text>
  <rect x="478" y="102" width="74" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="515" y="121" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">"00"</text>

  <!-- ===== Row 3: num=6 ===== -->
  <rect x="28" y="136" width="44" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50" y="155" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
  <rect x="96" y="136" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="155" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="158" y="136" width="84" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="155" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6−3=3</text>
  <rect x="282" y="136" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="310" y="155" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">7</text>
  <rect x="370" y="136" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="155" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"111"</text>
  <rect x="478" y="136" width="74" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="515" y="155" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">"11"</text>

  <!-- ===== Row 4: num=7 ===== -->
  <rect x="28" y="170" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50" y="189" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">7</text>
  <rect x="96" y="170" width="48" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="189" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
  <rect x="158" y="170" width="84" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="189" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">7−7=0</text>
  <rect x="282" y="170" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="310" y="189" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">8</text>
  <rect x="370" y="170" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="189" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"1000"</text>
  <rect x="478" y="170" width="74" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="515" y="189" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">"000"</text>

  <!-- ===== Row 5: num=10 ===== -->
  <rect x="28" y="204" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50" y="223" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">10</text>
  <rect x="96" y="204" width="48" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="223" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
  <rect x="158" y="204" width="84" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="223" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">10−7=3</text>
  <rect x="282" y="204" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="310" y="223" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">11</text>
  <rect x="370" y="204" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="223" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"1011"</text>
  <rect x="478" y="204" width="74" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="515" y="223" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">"011"</text>

  <!-- ===== Row 6: num=14 ===== -->
  <rect x="28" y="238" width="44" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50" y="257" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">14</text>
  <rect x="96" y="238" width="48" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="257" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
  <rect x="158" y="238" width="84" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="257" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">14−7=7</text>
  <rect x="282" y="238" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="310" y="257" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">15</text>
  <rect x="370" y="238" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="257" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"1111"</text>
  <rect x="478" y="238" width="74" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="515" y="257" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">"111"</text>

  <!-- ===== Row 7: num=15 ===== -->
  <rect x="28" y="272" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="50" y="291" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">15</text>
  <rect x="96" y="272" width="48" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="291" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">4</text>
  <rect x="158" y="272" width="84" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="291" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">15−15=0</text>
  <rect x="282" y="272" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="310" y="291" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">16</text>
  <rect x="370" y="272" width="80" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="291" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">"10000"</text>
  <rect x="478" y="272" width="74" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="515" y="291" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">"0000"</text>

  <!-- separator -->
  <path d="M 30 310 L 540 310" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <!-- ===== Summary notes ===== -->
  <rect x="40" y="324" width="480" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="342" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">规律：第 k 组从 2^k−1 开始，偏移 = num − (2^k−1) = num + 1 − 2^k</text>
  <text x="280" y="356" text-anchor="middle" font-size="10.5" fill="#666">而 num+1 ∈ [2^k, 2^(k+1)−1]，其二进制 = 1 后跟 k 位，去掉 1 恰好是偏移的 k 位二进制</text>

  <!-- color legend -->
  <rect x="60" y="376" width="16" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="82" y="387" font-size="10" fill="#888">k=0</text>
  <rect x="120" y="376" width="16" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="142" y="387" font-size="10" fill="#888">k=2</text>
  <rect x="180" y="376" width="16" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="202" y="387" font-size="10" fill="#888">k=3</text>
  <rect x="240" y="376" width="16" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="262" y="387" font-size="10" fill="#888">k=4（新组起点）</text>
  <text x="380" y="387" font-size="10.5" fill="#4a7a3a" font-weight="bold">→ 去掉前导 1 即编码 ✓</text>
</svg>
