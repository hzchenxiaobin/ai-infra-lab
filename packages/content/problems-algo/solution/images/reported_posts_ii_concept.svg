<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心思路：LEFT JOIN 让未删帖行 b.post_id 为 NULL → COUNT(DISTINCT) 自动分离分子分母</text>

  <!-- ===== Left: spam report rows (after WHERE) ===== -->
  <text x="95" y="56" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">筛出的 spam 举报行</text>
  <text x="95" y="70" text-anchor="middle" font-size="8" fill="#888">WHERE action='report' AND extra='spam'</text>
  <rect x="30" y="78" width="130" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="55" y="92" font-size="8.5" fill="#4a7a3a" font-weight="bold">post_id</text>
  <text x="115" y="92" font-size="8.5" fill="#4a7a3a" font-weight="bold">action_date</text>
  <line x1="80" y1="78" x2="80" y2="98" stroke="#4a7a3a" stroke-width="0.7" filter="url(#rough2)"/>

  <rect x="30" y="98" width="130" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="55" y="111" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">2</text>
  <text x="115" y="111" text-anchor="middle" font-size="8.5" fill="#333">07-04</text>
  <line x1="80" y1="98" x2="80" y2="116" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>

  <rect x="30" y="116" width="130" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="55" y="129" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">4</text>
  <text x="115" y="129" text-anchor="middle" font-size="8.5" fill="#333">07-04</text>
  <line x1="80" y1="116" x2="80" y2="134" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>

  <rect x="30" y="134" width="130" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="55" y="147" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">3</text>
  <text x="115" y="147" text-anchor="middle" font-size="8.5" fill="#333">07-02</text>
  <line x1="80" y1="134" x2="80" y2="152" stroke="#4a7a3a" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- LEFT JOIN label -->
  <path d="M162 125 L208 125" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="185" y="119" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">LEFT JOIN</text>
  <text x="185" y="138" text-anchor="middle" font-size="7" fill="#d6a040">ON post_id</text>

  <!-- ===== Middle: Removals table ===== -->
  <text x="270" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Removals 表</text>
  <text x="270" y="70" text-anchor="middle" font-size="8" fill="#888">post_id 为主键</text>
  <rect x="215" y="78" width="110" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="92" font-size="8.5" fill="#446688" font-weight="bold">post_id</text>
  <text x="290" y="92" font-size="8.5" fill="#446688" font-weight="bold">remove_date</text>
  <line x1="263" y1="78" x2="263" y2="98" stroke="#446688" stroke-width="0.7" filter="url(#rough2)"/>

  <rect x="215" y="98" width="110" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="240" y="111" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">2</text>
  <text x="290" y="111" text-anchor="middle" font-size="8.5" fill="#888">07-20</text>
  <line x1="263" y1="98" x2="263" y2="116" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <rect x="215" y="116" width="110" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="240" y="129" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">3</text>
  <text x="290" y="129" text-anchor="middle" font-size="8.5" fill="#888">07-18</text>
  <line x1="263" y1="116" x2="263" y2="134" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <text x="270" y="158" text-anchor="middle" font-size="7.5" fill="#888">⚠ remove_date 不参与匹配</text>

  <!-- arrow to joined result -->
  <path d="M327 125 L362 125" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="345" y="119" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">→</text>

  <!-- ===== Right: JOIN result with NULL ===== -->
  <text x="465" y="56" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">JOIN 后（含 NULL）</text>
  <rect x="370" y="78" width="190" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="395" y="92" font-size="8" fill="#b85450" font-weight="bold">a.post</text>
  <text x="445" y="92" font-size="8" fill="#b85450" font-weight="bold">date</text>
  <text x="510" y="92" font-size="8" fill="#b85450" font-weight="bold">b.post（删除）</text>
  <line x1="418" y1="78" x2="418" y2="98" stroke="#b85450" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="472" y1="78" x2="472" y2="98" stroke="#b85450" stroke-width="0.6" filter="url(#rough2)"/>

  <rect x="370" y="98" width="190" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="395" y="111" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">2</text>
  <text x="445" y="111" text-anchor="middle" font-size="8.5" fill="#333">07-04</text>
  <text x="510" y="111" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2 ✓</text>
  <line x1="418" y1="98" x2="418" y2="116" stroke="#b85450" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="472" y1="98" x2="472" y2="116" stroke="#b85450" stroke-width="0.5" filter="url(#rough2)"/>

  <rect x="370" y="116" width="190" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="395" y="129" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">4</text>
  <text x="445" y="129" text-anchor="middle" font-size="8.5" fill="#333">07-04</text>
  <text x="510" y="129" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">NULL</text>
  <line x1="418" y1="116" x2="418" y2="134" stroke="#b85450" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="472" y1="116" x2="472" y2="134" stroke="#b85450" stroke-width="0.5" filter="url(#rough2)"/>

  <rect x="370" y="134" width="190" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="395" y="147" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">3</text>
  <text x="445" y="147" text-anchor="middle" font-size="8.5" fill="#333">07-02</text>
  <text x="510" y="147" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">3 ✓</text>
  <line x1="418" y1="134" x2="418" y2="152" stroke="#b85450" stroke-width="0.5" filter="url(#rough2)"/>
  <line x1="472" y1="134" x2="472" y2="152" stroke="#b85450" stroke-width="0.5" filter="url(#rough2)"/>

  <text x="465" y="170" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">post 4 未在 Removals → b.post_id = NULL</text>

  <!-- ===== Bottom: per-day computation ===== -->
  <rect x="30" y="186" width="540" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="206" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">GROUP BY action_date 后逐日算百分比</text>

  <text x="45" y="228" font-size="9.5" fill="#333">• <tspan fill="#4a7a3a" font-weight="bold">07-02</tspan>：COUNT(DISTINCT a.post) = <tspan fill="#b85450" font-weight="bold">1</tspan>，COUNT(DISTINCT b.post) = <tspan fill="#b85450" font-weight="bold">1</tspan>（NULL 不计）→ 1×100/1 = <tspan fill="#4a7a3a" font-weight="bold">100%</tspan></text>
  <text x="45" y="246" font-size="9.5" fill="#333">• <tspan fill="#4a7a3a" font-weight="bold">07-04</tspan>：COUNT(DISTINCT a.post) = <tspan fill="#b85450" font-weight="bold">2</tspan>，COUNT(DISTINCT b.post) = <tspan fill="#b85450" font-weight="bold">1</tspan>（NULL 不计）→ 1×100/2 = <tspan fill="#d6a040" font-weight="bold">50%</tspan></text>
  <text x="45" y="264" font-size="9.5" fill="#333">• <tspan fill="#888">07-03</tspan> 只有 racism 举报、<tspan fill="#888">07-01</tspan> 无举报 → 无 spam 行 → <tspan fill="#b85450" font-weight="bold">不进入分组结果</tspan>（非 0%，被排除）</text>

  <!-- ===== Final: AVG + ROUND ===== -->
  <rect x="30" y="290" width="540" height="138" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="312" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">外层 AVG + ROUND：只对有 spam 举报的日期取平均</text>

  <text x="50" y="334" font-size="10" fill="#333">AVG(100, 50) = (100 + 50) / 2 = <tspan fill="#b85450" font-weight="bold">75</tspan>　→　ROUND(75, 2) = <tspan fill="#b85450" font-weight="bold">75.00</tspan></text>

  <text x="50" y="356" font-size="9.5" fill="#333">关键技巧：</text>
  <text x="50" y="372" font-size="9" fill="#333">① <tspan fill="#d6a040" font-weight="bold">LEFT JOIN</tspan> 保留所有 spam 举报行；未删帖行 b.post_id 为 <tspan fill="#b85450" font-weight="bold">NULL</tspan></text>
  <text x="50" y="388" font-size="9" fill="#333">② <tspan fill="#b85450" font-weight="bold">COUNT(DISTINCT b.post_id)</tspan> 自动跳过 NULL → 直接得"被删 spam 帖数"（分子）</text>
  <text x="50" y="404" font-size="9" fill="#333">③ <tspan fill="#b85450" font-weight="bold">COUNT(DISTINCT a.post_id)</tspan> = 当日全部 spam 帖数（分母）；DISTINCT 防"同帖多用户举报"重复</text>
  <text x="50" y="420" font-size="9" fill="#333">④ 无 spam 举报的日期不出现在分组中 → <tspan fill="#4a7a3a" font-weight="bold">AVG 天然排除它们</tspan>，无需手动过滤</text>
</svg>
