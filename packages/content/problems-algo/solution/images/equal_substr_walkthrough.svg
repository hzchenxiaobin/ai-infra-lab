<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s="abcd", t="bcdf", maxCost=3</text>
  <text x="290" y="42" text-anchor="middle" font-size="11" fill="#888">开销数组 cost = [1, 1, 1, 2]</text>

  <!-- cost array cells header -->
  <text x="40" y="72" font-size="11" fill="#888">下标:</text>
  <text x="130" y="72" font-size="11" fill="#888" font-weight="bold">0</text>
  <text x="190" y="72" font-size="11" fill="#888" font-weight="bold">1</text>
  <text x="250" y="72" font-size="11" fill="#888" font-weight="bold">2</text>
  <text x="310" y="72" font-size="11" fill="#888" font-weight="bold">3</text>

  <rect x="108" y="78" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="100" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="168" y="78" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="100" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="228" y="78" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="100" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="288" y="78" width="44" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="100" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>

  <!-- Steps table header -->
  <text x="40" y="140" font-size="12" fill="#444" font-weight="bold">步骤</text>
  <text x="90" y="140" font-size="12" fill="#444" font-weight="bold">right</text>
  <text x="150" y="140" font-size="12" fill="#444" font-weight="bold">cost</text>
  <text x="200" y="140" font-size="12" fill="#444" font-weight="bold">sum</text>
  <text x="260" y="140" font-size="12" fill="#444" font-weight="bold">动作</text>
  <text x="400" y="140" font-size="12" fill="#444" font-weight="bold">窗口</text>
  <text x="500" y="140" font-size="12" fill="#444" font-weight="bold">max</text>

  <line x1="30" y1="146" x2="560" y2="146" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Step 1 -->
  <text x="40" y="166" font-size="11" fill="#333">1</text>
  <text x="90" y="166" font-size="11" fill="#333">0</text>
  <text x="150" y="166" font-size="11" fill="#333">1</text>
  <text x="200" y="166" font-size="11" fill="#333">1</text>
  <text x="260" y="166" font-size="11" fill="#82b366">加入，1≤3</text>
  <text x="400" y="166" font-size="11" fill="#4a7a3a" font-weight="bold">[1]</text>
  <text x="500" y="166" font-size="11" fill="#333" font-weight="bold">1</text>

  <!-- Step 2 -->
  <text x="40" y="190" font-size="11" fill="#333">2</text>
  <text x="90" y="190" font-size="11" fill="#333">1</text>
  <text x="150" y="190" font-size="11" fill="#333">1</text>
  <text x="200" y="190" font-size="11" fill="#333">2</text>
  <text x="260" y="190" font-size="11" fill="#82b366">加入，2≤3</text>
  <text x="400" y="190" font-size="11" fill="#4a7a3a" font-weight="bold">[1,1]</text>
  <text x="500" y="190" font-size="11" fill="#333" font-weight="bold">2</text>

  <!-- Step 3 -->
  <text x="40" y="214" font-size="11" fill="#333">3</text>
  <text x="90" y="214" font-size="11" fill="#333">2</text>
  <text x="150" y="214" font-size="11" fill="#333">1</text>
  <text x="200" y="214" font-size="11" fill="#333">3</text>
  <text x="260" y="214" font-size="11" fill="#82b366">加入，3≤3</text>
  <text x="400" y="214" font-size="11" fill="#4a7a3a" font-weight="bold">[1,1,1]</text>
  <text x="500" y="214" font-size="11" fill="#333" font-weight="bold">3 ⭐</text>

  <!-- Step 4 -->
  <text x="40" y="238" font-size="11" fill="#333">4</text>
  <text x="90" y="238" font-size="11" fill="#333">3</text>
  <text x="150" y="238" font-size="11" fill="#333">2</text>
  <text x="200" y="238" font-size="11" fill="#b85450">5</text>
  <text x="260" y="238" font-size="11" fill="#b85450">5&gt;3，收缩 left</text>
  <text x="400" y="238" font-size="11" fill="#d6a040" font-weight="bold">→</text>
  <text x="500" y="238" font-size="11" fill="#333">3</text>

  <!-- Step 4a: shrink detail -->
  <text x="40" y="262" font-size="10" fill="#888">4a</text>
  <text x="90" y="262" font-size="10" fill="#888">—</text>
  <text x="150" y="262" font-size="10" fill="#888">−1</text>
  <text x="200" y="262" font-size="10" fill="#d6a040">4</text>
  <text x="260" y="262" font-size="10" fill="#b85450">仍 4&gt;3，再收缩</text>
  <text x="400" y="262" font-size="10" fill="#d6a040">left→1</text>
  <text x="500" y="262" font-size="10" fill="#888">3</text>

  <!-- Step 4b: shrink detail -->
  <text x="40" y="284" font-size="10" fill="#888">4b</text>
  <text x="90" y="284" font-size="10" fill="#888">—</text>
  <text x="150" y="284" font-size="10" fill="#888">−1</text>
  <text x="200" y="284" font-size="10" fill="#82b366">3</text>
  <text x="260" y="284" font-size="10" fill="#82b366">3≤3，停止收缩</text>
  <text x="400" y="284" font-size="10" fill="#4a7a3a" font-weight="bold">[1,2]</text>
  <text x="500" y="284" font-size="10" fill="#888">3</text>

  <!-- result box -->
  <rect x="60" y="312" width="460" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="334" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">答案 = 3，子串 "abc"→"bcd"（下标 0-2，开销 1+1+1=3）</text>
  <text x="290" y="354" text-anchor="middle" font-size="11" fill="#888">right=3 时窗口先扩张后收缩两次，最终窗口 [1,2] 宽度仍为 2 ≤ 3</text>

  <!-- legend -->
  <rect x="60" y="388" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="80" y="399" font-size="11" fill="#555">预算内加入</text>
  <rect x="170" y="388" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="190" y="399" font-size="11" fill="#555">超预算收缩</text>
  <rect x="290" y="388" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="310" y="399" font-size="11" fill="#555">结果</text>
  <text x="400" y="399" font-size="11" fill="#888">⭐ = 当前全局最大</text>
</svg>
