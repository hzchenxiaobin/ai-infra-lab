<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 100，求 [1, 100] 中易混淆数个数</text>

  <!-- ===== Step 1: count valid ===== -->
  <rect x="30" y="40" width="480" height="116" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="60" font-size="12" fill="#446688" font-weight="bold">步骤一：数有效数（所有位 ∈ {0,1,6,8,9}）</text>

  <!-- row: fewer digits -->
  <text x="50" y="80" font-size="11" fill="#444" font-family="monospace">位数 &lt; 3：</text>
  <rect x="140" y="68" width="60" height="22" fill="#fff" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="170" y="84" text-anchor="middle" font-size="10" fill="#333">1 位: 4</text>
  <rect x="210" y="68" width="70" height="22" fill="#fff" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="245" y="84" text-anchor="middle" font-size="10" fill="#333">2 位: 20</text>
  <text x="296" y="84" font-size="11" fill="#4a7a3a" font-weight="bold">小计 = 24</text>

  <!-- row: 3-digit -->
  <text x="50" y="108" font-size="11" fill="#444" font-family="monospace">3 位 ≤ 100：</text>
  <text x="140" y="108" font-size="10" fill="#888">s="100", 逐位匹配</text>
  <text x="300" y="108" font-size="11" fill="#888">各位 less=0</text>
  <text x="400" y="108" font-size="11" fill="#888">+0</text>

  <!-- row: n itself -->
  <text x="50" y="134" font-size="11" fill="#444" font-family="monospace">n 本身：</text>
  <text x="140" y="134" font-size="10" fill="#4a7a3a">100 有效 → +1</text>

  <rect x="380" y="122" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="430" y="139" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">有效数 = 25</text>

  <path d="M 270 160 L 270 176" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: count strobogrammatic ===== -->
  <rect x="30" y="180" width="480" height="116" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="50" y="200" font-size="12" fill="#4a7a3a" font-weight="bold">步骤二：数中心对称数（旋转后 = 自身）</text>

  <!-- length 1 -->
  <text x="50" y="222" font-size="11" fill="#444" font-family="monospace">长度 1：</text>
  <rect x="120" y="210" width="30" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="135" y="226" text-anchor="middle" font-size="10" fill="#333">1</text>
  <rect x="156" y="210" width="30" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="171" y="226" text-anchor="middle" font-size="10" fill="#333">8</text>
  <text x="196" y="226" font-size="10" fill="#b85450">(排除 0)</text>
  <text x="280" y="226" font-size="11" fill="#4a7a3a" font-weight="bold">→ 2 个</text>

  <!-- length 2 -->
  <text x="50" y="252" font-size="11" fill="#444" font-family="monospace">长度 2：</text>
  <rect x="120" y="240" width="30" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="135" y="256" text-anchor="middle" font-size="10" fill="#333">11</text>
  <rect x="156" y="240" width="30" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="171" y="256" text-anchor="middle" font-size="10" fill="#333">69</text>
  <rect x="192" y="240" width="30" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="207" y="256" text-anchor="middle" font-size="10" fill="#333">88</text>
  <rect x="228" y="240" width="30" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="243" y="256" text-anchor="middle" font-size="10" fill="#333">96</text>
  <text x="280" y="256" font-size="11" fill="#4a7a3a" font-weight="bold">→ 4 个</text>

  <!-- length 3 -->
  <text x="50" y="282" font-size="11" fill="#444" font-family="monospace">长度 3：</text>
  <text x="120" y="282" font-size="10" fill="#b85450">最小 101 &gt; 100</text>
  <text x="280" y="282" font-size="11" fill="#b85450" font-weight="bold">→ 0 个</text>

  <rect x="380" y="262" width="100" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="430" y="279" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">对称数 = 6</text>

  <path d="M 270 300 L 270 316" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: subtract ===== -->
  <rect x="80" y="320" width="380" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="342" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">易混淆数 = 有效数 − 中心对称数</text>
  <text x="270" y="362" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">= 25 − 6 = 19  ✓</text>

  <!-- verification note -->
  <rect x="30" y="384" width="480" height="28" fill="#fff" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="270" y="402" text-anchor="middle" font-size="10" fill="#888">验证：6, 9, 10, 16, 18, 19, 60, 61, 66, 68, 80, 81, 86, 89, 90, 91, 98, 99, 100 → 共 19 个 ✓</text>
</svg>
