<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">半回文串：按真因数 d 分组，组组皆回文</text>
  <text x="260" y="54" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">以 "abcabc"（长度 6）为例：d 整除 6 且 1 ≤ d &lt; 6 ⇒ d ∈ {1, 2, 3}</text>

  <!-- 字符格子：同色 = 同组（d = 3） -->
  <rect x="95" y="64" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="263" y="64" width="46" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="151" y="64" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="319" y="64" width="46" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="207" y="64" width="46" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="375" y="64" width="46" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>

  <text x="118" y="90" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">a</text>
  <text x="174" y="90" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">b</text>
  <text x="230" y="90" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">c</text>
  <text x="286" y="90" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">a</text>
  <text x="342" y="90" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">b</text>
  <text x="398" y="90" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">c</text>

  <text x="118" y="120" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">1</text>
  <text x="174" y="120" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">2</text>
  <text x="230" y="120" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">3</text>
  <text x="286" y="120" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">4</text>
  <text x="342" y="120" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">5</text>
  <text x="398" y="120" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">6</text>

  <text x="260" y="143" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">同色同组（d = 3，每组 6/3 = 2 个字符）：aa / bb / cc</text>

  <!-- 三个 d 的判定结果 -->
  <rect x="40" y="158" width="440" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="183" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">d = 1：整串一组 "abcabc" —— 不是回文 ✗</text>

  <rect x="40" y="210" width="440" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="235" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">d = 2：两组 "acb" ✗、"bac" ✗ —— 都不是回文</text>

  <rect x="40" y="262" width="440" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="289" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">d = 3：三组 "aa" ✓、"bb" ✓、"cc" ✓ ⇒ "abcabc" 是半回文串！</text>

  <text x="260" y="340" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">d = 1 即普通回文——半回文是回文的放宽；长度 2 的串只有 d = 1 可选</text>
  <text x="260" y="362" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">若允许 d = m，每组只剩 1 个字符 ⇒ 任何串恒为半回文，题目故排除</text>
</svg>
