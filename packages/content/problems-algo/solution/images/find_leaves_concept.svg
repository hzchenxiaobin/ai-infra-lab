<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：节点的「离地高度」决定剥离层</text>

  <!-- ============ Left: the tree ============ -->
  <text x="40" y="58" font-size="12" fill="#446688" font-weight="bold">① 示例树：按离地高度着色</text>

  <!-- edges -->
  <path d="M 200 104 L 140 158" stroke="#888" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 200 104 L 260 158" stroke="#888" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 140 168 L 100 222" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 140 168 L 180 222" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>

  <!-- node 1 (layer 2, orange) -->
  <circle cx="200" cy="96" r="18" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="200" y="100" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <text x="226" y="100" font-size="10" fill="#d6a040" font-weight="bold">L2</text>

  <!-- node 2 (layer 1, blue) -->
  <circle cx="140" cy="162" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="140" y="166" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <text x="164" y="166" font-size="10" fill="#446688" font-weight="bold">L1</text>

  <!-- node 3 (layer 0, green) -->
  <circle cx="260" cy="162" r="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="166" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="284" y="166" font-size="10" fill="#4a7a3a" font-weight="bold">L0</text>

  <!-- node 4 (layer 0, green) -->
  <circle cx="100" cy="228" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="100" y="232" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="120" y="232" font-size="9.5" fill="#4a7a3a" font-weight="bold">L0</text>

  <!-- node 5 (layer 0, green) -->
  <circle cx="180" cy="228" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="180" y="232" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="200" y="232" font-size="9.5" fill="#4a7a3a" font-weight="bold">L0</text>

  <!-- up arrows (layer transfer) -->
  <path d="M 100 246 L 124 188" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="3,3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 180 246 L 156 188" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="3,3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 260 180 L 212 110" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="3,3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 140 180 L 188 110" stroke="#888" stroke-width="1.2" fill="none" stroke-dasharray="3,3" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- legend -->
  <rect x="40" y="276" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="60" y="288" font-size="10" fill="#555">L0 叶子（首轮剥离）</text>
  <rect x="40" y="296" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="60" y="308" font-size="10" fill="#555">L1 次轮剥离</text>
  <rect x="40" y="316" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="60" y="328" font-size="10" fill="#555">L2 末轮剥离（根）</text>
  <text x="40" y="348" font-size="9.5" fill="#888">虚线箭头：子树高度向父节点传递</text>

  <!-- divider -->
  <path d="M 380 56 L 380 360" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,4" fill="none" filter="url(#rough2)"/>

  <!-- ============ Right: formula + output ============ -->
  <text x="400" y="58" font-size="12" fill="#446688" font-weight="bold">② 高度公式与输出</text>

  <!-- formula box -->
  <rect x="396" y="72" width="160" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="476" y="92" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">layer = max(l, r) + 1</text>
  <text x="476" y="110" text-anchor="middle" font-size="10" fill="#555">dfs(null) = -1</text>
  <text x="476" y="126" text-anchor="middle" font-size="9.5" fill="#888">→ 叶子: max(-1,-1)+1 = 0</text>

  <!-- output rows -->
  <rect x="396" y="154" width="160" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="412" y="174" font-size="10" fill="#4a7a3a" font-weight="bold">L0</text>
  <text x="476" y="174" text-anchor="middle" font-size="11" fill="#333">[4, 5, 3]</text>

  <rect x="396" y="190" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="412" y="210" font-size="10" fill="#446688" font-weight="bold">L1</text>
  <text x="476" y="210" text-anchor="middle" font-size="11" fill="#333">[2]</text>

  <rect x="396" y="226" width="160" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="412" y="246" font-size="10" fill="#d6a040" font-weight="bold">L2</text>
  <text x="476" y="246" text-anchor="middle" font-size="11" fill="#333">[1]</text>

  <!-- key insight -->
  <rect x="396" y="272" width="160" height="84" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="476" y="292" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">剥离层 = 离地高度</text>
  <text x="476" y="310" text-anchor="middle" font-size="9.5" fill="#555">节点在第 k 轮被移除</text>
  <text x="476" y="324" text-anchor="middle" font-size="9.5" fill="#555">⟺ 其所有子树高度 &lt; k</text>
  <text x="476" y="342" text-anchor="middle" font-size="9.5" fill="#888">一次后序遍历即可分组</text>
</svg>
