<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：排序 → 建置换 → 环上归位计数</text>

  <!-- ① 求数位和 -->
  <rect x="150" y="36" width="220" height="32" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="57" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">① 求每个数的数位和 s(·)</text>
  <path d="M260,70 L260,86" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- ② 排序建 target -->
  <rect x="110" y="90" width="300" height="46" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="108" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">② 按 (数位和, 数值) 升序排序</text>
  <text x="260" y="126" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">得到每个元素的目标位置 target[]</text>
  <path d="M260,138 L260,152" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- 判断菱形 -->
  <polygon points="260,154 350,190 260,226 170,190" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="195" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">target[i] = i ?</text>

  <!-- 是 分支 -->
  <path d="M350,190 L386,190" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="364" y="182" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="388" y="174" width="112" height="32" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="444" y="194" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">i++ 继续扫描</text>
  <path d="M444,208 C444,236 340,240 285,230" fill="none" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- 否 分支 -->
  <path d="M260,226 L260,244" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="270" y="240" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- ③ 交换归位 -->
  <rect x="118" y="246" width="284" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="264" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">③ 交换 target[i] ↔ target[target[i]]</text>
  <text x="260" y="282" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">ans++（一次交换 = 拆掉一环、归位一个）</text>

  <!-- 否 → 回到判断（虚线回边） -->
  <path d="M118,269 L48,269 L48,190 L164,190" fill="none" stroke="#b85450" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="50" y="263" font-size="10" fill="#b85450" filter="url(#rough2)">同一 i 再查</text>

  <!-- ④ 返回 -->
  <path d="M260,292 L260,310" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="150" y="312" width="220" height="34" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="334" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#333" filter="url(#rough2)">④ 返回 ans = n − 环数</text>

  <!-- 右下示例注记 -->
  <rect x="400" y="306" width="112" height="62" rx="6" fill="#f5f5f5" stroke="#999" stroke-width="1" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <text x="456" y="324" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">target=[3,2,1,0]</text>
  <text x="456" y="340" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">两个环 → 4−2</text>
  <text x="456" y="356" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">ans = 2 ✓</text>
</svg>
