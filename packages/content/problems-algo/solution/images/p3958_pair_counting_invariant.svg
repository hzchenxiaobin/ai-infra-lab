<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：n 个 1 两两配对，总代价恒等于 C(n,2)</text>

  <!-- ===== 左：任取一种拆法（n=4 对半拆）===== -->
  <text x="140" y="54" text-anchor="middle" font-size="12" fill="#446688">任取一种拆法（n = 4，对半拆）</text>

  <g stroke="#8a8a8a" stroke-width="1.4" filter="url(#rough2)">
    <line x1="128" y1="98" x2="88" y2="134"/>
    <line x1="128" y1="98" x2="168" y2="134"/>
    <line x1="88" y1="162" x2="66" y2="199"/>
    <line x1="88" y1="162" x2="110" y2="199"/>
    <line x1="168" y1="162" x2="150" y2="199"/>
    <line x1="168" y1="162" x2="194" y2="199"/>
  </g>

  <rect x="110" y="70" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="128" y="89" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="70" y="134" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="88" y="153" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="150" y="134" width="36" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="168" y="153" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <rect x="50" y="199" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="66" y="217" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="94" y="199" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="110" y="217" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="134" y="199" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="150" y="217" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="178" y="199" width="32" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="194" y="217" text-anchor="middle" font-size="12" fill="#333">1</text>

  <rect x="103" y="112" width="50" height="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="128" y="124" text-anchor="middle" font-size="10" fill="#a0721a">2×2 = 4</text>
  <rect x="63" y="176" width="50" height="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="88" y="188" text-anchor="middle" font-size="10" fill="#a0721a">1×1 = 1</text>
  <rect x="143" y="176" width="50" height="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="168" y="188" text-anchor="middle" font-size="10" fill="#a0721a">1×1 = 1</text>

  <text x="140" y="250" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">总代价 = 4 + 1 + 1 = 6</text>

  <!-- ===== 右：粒子配对视角 ===== -->
  <text x="392" y="54" text-anchor="middle" font-size="12" fill="#4a7a3a">换成 4 个「粒子」：两两配对共 6 对</text>

  <g fill="none" filter="url(#rough2)">
    <path d="M310,97 Q388,54 466,97" stroke="#d6a040" stroke-width="1.8"/>
    <path d="M310,123 Q362,164 414,123" stroke="#446688" stroke-width="1.8"/>
    <path d="M362,123 Q414,164 466,123" stroke="#446688" stroke-width="1.8"/>
    <path d="M310,123 Q336,144 362,123" stroke="#4a7a3a" stroke-width="1.8"/>
    <path d="M362,123 Q388,144 414,123" stroke="#4a7a3a" stroke-width="1.8"/>
    <path d="M414,123 Q440,144 466,123" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>

  <circle cx="310" cy="110" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="310" y="114" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <circle cx="362" cy="110" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="362" y="114" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <circle cx="414" cy="110" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="414" y="114" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <circle cx="466" cy="110" r="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="466" y="114" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>

  <text x="392" y="196" text-anchor="middle" font-size="10.5" fill="#555">橙 1 对 + 蓝 2 对 + 绿 3 对 = 6 对，每对恰计费一次</text>
  <text x="392" y="214" text-anchor="middle" font-size="10.5" fill="#555">「分开」只发生在 LCA 那一步，贡献 1×1 = 1</text>

  <text x="392" y="250" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">总代价 = 6 对 × 1 = 6 ✓</text>

  <!-- ===== 底部结论 ===== -->
  <rect x="30" y="276" width="460" height="62" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="300" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">总代价 ≡ C(n,2) = n(n−1)/2，与拆分顺序无关</text>
  <text x="260" y="322" text-anchor="middle" font-size="11.5" fill="#444">最小 = 最大 = 唯一可能值 —— n 再大也只是两次算术运算</text>
</svg>
