<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="520" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">前序 DFS 收集叶值演算（root1）</text>

  <!-- ===== 树结构 ===== -->
  <!-- 根 3 -->
  <circle cx="260" cy="60" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="11" fill="#333">3</text>
  <!-- 左 5 -->
  <line x1="250" y1="72" x2="200" y2="92" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="195" cy="102" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="195" y="106" text-anchor="middle" font-size="11" fill="#333">5</text>
  <!-- 右 1 -->
  <line x1="270" y1="72" x2="320" y2="92" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="325" cy="102" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="325" y="106" text-anchor="middle" font-size="11" fill="#333">1</text>
  <!-- 5 左 6 (叶子) -->
  <line x1="187" y1="114" x2="172" y2="132" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="168" cy="142" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="168" y="146" text-anchor="middle" font-size="10" fill="#333">6</text>
  <!-- 5 右 2 -->
  <line x1="203" y1="114" x2="220" y2="132" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="222" cy="142" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="222" y="146" text-anchor="middle" font-size="10" fill="#333">2</text>
  <!-- 2 左 7 (叶子) -->
  <line x1="214" y1="153" x2="200" y2="172" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="196" cy="182" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="196" y="186" text-anchor="middle" font-size="10" fill="#333">7</text>
  <!-- 2 右 4 (叶子) -->
  <line x1="230" y1="153" x2="244" y2="172" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="248" cy="182" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="248" y="186" text-anchor="middle" font-size="10" fill="#333">4</text>
  <!-- 1 左 9 (叶子) -->
  <line x1="317" y1="114" x2="303" y2="132" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="300" cy="142" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="300" y="146" text-anchor="middle" font-size="10" fill="#333">9</text>
  <!-- 1 右 8 (叶子) -->
  <line x1="333" y1="114" x2="347" y2="132" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <circle cx="350" cy="142" r="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="350" y="146" text-anchor="middle" font-size="10" fill="#333">8</text>

  <!-- 访问序号标注 (蓝色小圆) -->
  <circle cx="268" cy="52" r="8" fill="#446688" filter="url(#rough2)"/>
  <text x="268" y="55" text-anchor="middle" font-size="8" fill="#fff">1</text>
  <circle cx="182" cy="95" r="8" fill="#446688" filter="url(#rough2)"/>
  <text x="182" y="98" text-anchor="middle" font-size="8" fill="#fff">2</text>
  <circle cx="156" cy="135" r="8" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="156" y="138" text-anchor="middle" font-size="8" fill="#fff">3</text>
  <circle cx="232" cy="135" r="8" fill="#446688" filter="url(#rough2)"/>
  <text x="232" y="138" text-anchor="middle" font-size="8" fill="#fff">4</text>
  <circle cx="186" cy="175" r="8" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="186" y="178" text-anchor="middle" font-size="8" fill="#fff">5</text>
  <circle cx="238" cy="175" r="8" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="238" y="178" text-anchor="middle" font-size="8" fill="#fff">6</text>
  <circle cx="338" cy="95" r="8" fill="#446688" filter="url(#rough2)"/>
  <text x="338" y="98" text-anchor="middle" font-size="8" fill="#fff">7</text>
  <circle cx="290" cy="135" r="8" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="290" y="138" text-anchor="middle" font-size="8" fill="#fff">8</text>
  <circle cx="360" cy="135" r="8" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="360" y="138" text-anchor="middle" font-size="8" fill="#fff">9</text>

  <!-- 图例 -->
  <circle cx="410" cy="62" r="6" fill="#446688" filter="url(#rough2)"/>
  <text x="422" y="66" font-size="10" fill="#555">非叶节点</text>
  <circle cx="410" cy="82" r="6" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="422" y="86" font-size="10" fill="#555">叶子节点</text>

  <!-- ===== 演算表格 ===== -->
  <text x="310" y="222" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">DFS 访问过程</text>

  <!-- 表头 -->
  <rect x="40" y="234" width="540" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="251" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">步骤</text>
  <text x="170" y="251" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">访问节点</text>
  <text x="300" y="251" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">是否叶子</text>
  <text x="470" y="251" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">叶值序列（追加后）</text>

  <!-- 行1 -->
  <rect x="40" y="260" width="540" height="24" fill="#fafafa" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="80" y="276" text-anchor="middle" font-size="10" fill="#555">1</text>
  <text x="170" y="276" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="300" y="276" text-anchor="middle" font-size="10" fill="#888">否</text>
  <text x="470" y="276" text-anchor="middle" font-size="10" fill="#888">[]</text>

  <!-- 行2 -->
  <rect x="40" y="284" width="540" height="24" fill="#f5f5f5" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="80" y="300" text-anchor="middle" font-size="10" fill="#555">2</text>
  <text x="170" y="300" text-anchor="middle" font-size="10" fill="#333">5</text>
  <text x="300" y="300" text-anchor="middle" font-size="10" fill="#888">否</text>
  <text x="470" y="300" text-anchor="middle" font-size="10" fill="#888">[]</text>

  <!-- 行3 - 叶子 -->
  <rect x="40" y="308" width="540" height="24" fill="#e6f4ea" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="80" y="324" text-anchor="middle" font-size="10" fill="#555">3</text>
  <text x="170" y="324" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">6</text>
  <text x="300" y="324" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✅ 叶子</text>
  <text x="470" y="324" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">[6]</text>

  <!-- 行4 -->
  <rect x="40" y="332" width="540" height="24" fill="#fafafa" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="80" y="348" text-anchor="middle" font-size="10" fill="#555">4</text>
  <text x="170" y="348" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="300" y="348" text-anchor="middle" font-size="10" fill="#888">否</text>
  <text x="470" y="348" text-anchor="middle" font-size="10" fill="#888">[6]</text>

  <!-- 行5 - 叶子 -->
  <rect x="40" y="356" width="540" height="24" fill="#e6f4ea" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="80" y="372" text-anchor="middle" font-size="10" fill="#555">5</text>
  <text x="170" y="372" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">7</text>
  <text x="300" y="372" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✅ 叶子</text>
  <text x="470" y="372" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">[6, 7]</text>

  <!-- 行6 - 叶子 -->
  <rect x="40" y="380" width="540" height="24" fill="#e6f4ea" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="80" y="396" text-anchor="middle" font-size="10" fill="#555">6</text>
  <text x="170" y="396" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">4</text>
  <text x="300" y="396" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✅ 叶子</text>
  <text x="470" y="396" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">[6, 7, 4]</text>

  <!-- 行7 -->
  <rect x="40" y="404" width="540" height="24" fill="#fafafa" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="80" y="420" text-anchor="middle" font-size="10" fill="#555">7</text>
  <text x="170" y="420" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="300" y="420" text-anchor="middle" font-size="10" fill="#888">否</text>
  <text x="470" y="420" text-anchor="middle" font-size="10" fill="#888">[6, 7, 4]</text>

  <!-- 行8 - 叶子 -->
  <rect x="40" y="428" width="540" height="24" fill="#e6f4ea" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="80" y="444" text-anchor="middle" font-size="10" fill="#555">8</text>
  <text x="170" y="444" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">9</text>
  <text x="300" y="444" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✅ 叶子</text>
  <text x="470" y="444" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">[6, 7, 4, 9]</text>

  <!-- 行9 - 叶子 -->
  <rect x="40" y="452" width="540" height="24" fill="#e6f4ea" stroke="#ccc" stroke-width="0.8" filter="url(#rough2)"/>
  <text x="80" y="468" text-anchor="middle" font-size="10" fill="#555">9</text>
  <text x="170" y="468" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">8</text>
  <text x="300" y="468" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✅ 叶子</text>
  <text x="470" y="468" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">[6, 7, 4, 9, 8]</text>

  <!-- 最终结果 -->
  <rect x="40" y="482" width="540" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="310" y="502" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">最终叶值序列 = [6, 7, 4, 9, 8]</text>
</svg>
