<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：每击败一个怪物 gain+1，天数 = ⌈power / gain⌉</text>

  <!-- Row 1: monsters -->
  <text x="36" y="58" font-size="12" fill="#888">power =</text>
  <rect x="108" y="40" width="62" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="139" y="58" text-anchor="middle" font-size="10" fill="#446688">怪1</text>
  <text x="139" y="74" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">3</text>
  <rect x="176" y="40" width="62" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="207" y="58" text-anchor="middle" font-size="10" fill="#446688">怪2</text>
  <text x="207" y="74" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">1</text>
  <rect x="244" y="40" width="62" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="275" y="58" text-anchor="middle" font-size="10" fill="#446688">怪3</text>
  <text x="275" y="74" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">4</text>
  <text x="320" y="64" font-size="10.5" fill="#888">击败顺序自选，但 gain 递增</text>

  <path d="M 270 90 L 270 108" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="282" y="104" font-size="10.5" fill="#446688">按最优顺序 [怪2, 怪3, 怪1] 逐个击败</text>

  <!-- Row 2: gain timeline, three stages -->
  <!-- Stage 1 -->
  <rect x="30" y="118" width="150" height="96" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="105" y="138" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">第 1 个击败</text>
  <rect x="48" y="146" width="50" height="30" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="73" y="166" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">gain=1</text>
  <text x="112" y="166" font-size="11" fill="#888">怪2(1)</text>
  <text x="105" y="196" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">⌈1/1⌉ = 1 天</text>
  <text x="105" y="210" text-anchor="middle" font-size="9.5" fill="#888">法力 1 ≥ power 1 → 击败</text>

  <!-- arrow -->
  <path d="M 184 166 L 198 166" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Stage 2 -->
  <rect x="202" y="118" width="150" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="277" y="138" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">第 2 个击败</text>
  <rect x="220" y="146" width="50" height="30" fill="#fafafa" stroke="#d6a040" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="245" y="166" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">gain=2</text>
  <text x="284" y="166" font-size="11" fill="#888">怪3(4)</text>
  <text x="277" y="196" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">⌈4/2⌉ = 2 天</text>
  <text x="277" y="210" text-anchor="middle" font-size="9.5" fill="#888">攒 2 天法力 4 ≥ power 4</text>

  <!-- arrow -->
  <path d="M 356 166 L 370 166" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Stage 3 -->
  <rect x="374" y="118" width="150" height="96" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="449" y="138" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">第 3 个击败</text>
  <rect x="392" y="146" width="50" height="30" fill="#fafafa" stroke="#b85450" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="417" y="166" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">gain=3</text>
  <text x="456" y="166" font-size="11" fill="#888">怪1(3)</text>
  <text x="449" y="196" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">⌈3/3⌉ = 1 天</text>
  <text x="449" y="210" text-anchor="middle" font-size="9.5" fill="#888">攒 1 天法力 3 ≥ power 3</text>

  <!-- Arrow to total -->
  <path d="M 270 224 L 270 244" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="282" y="240" font-size="11" fill="#4a7a3a">总天数 = 1 + 2 + 1</text>

  <!-- Result -->
  <rect x="170" y="248" width="200" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="275" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">最少 4 天 ✓</text>

  <!-- Formula box -->
  <rect x="40" y="306" width="460" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="328" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold">击败 power=x 的怪物需 ⌈x / gain⌉ 天</text>
  <text x="270" y="348" text-anchor="middle" font-size="11.5" fill="#333">gain = 1 + 已击败怪物数（1 → 2 → 3 → …）</text>
  <text x="270" y="368" text-anchor="middle" font-size="11.5" fill="#b85450">求 min Σ⌈power[i_k] / k⌉ — 顺序影响总和，需状压 DP</text>
</svg>
