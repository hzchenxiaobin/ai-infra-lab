<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrBs" markerWidth="8" markerHeight="8" refX="0.5" refY="3" orient="auto">
      <path d="M6,0 L0,3 L6,6 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#b85450"/>
    </marker>
    <marker id="arrRs" markerWidth="8" markerHeight="8" refX="0.5" refY="3" orient="auto">
      <path d="M6,0 L0,3 L6,6 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="5.5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrGs" markerWidth="8" markerHeight="8" refX="0.5" refY="3" orient="auto">
      <path d="M6,0 L0,3 L6,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">核心观察：排序后，最小差只在「相邻的不同值」之间</text>

  <!-- 示例窗口 (0,1) -->
  <text x="36" y="44" font-size="11" fill="#555" filter="url(#rough2)">示例 3 的窗口 (0,1)</text>
  <rect x="36" y="52" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="77" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−2</text>
  <rect x="80" y="52" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="77" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="36" y="92" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="56" y="117" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="80" y="92" width="40" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="117" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>

  <!-- 收集排序 -->
  <path d="M78,138 L70,166" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="88" y="156" font-size="10.5" fill="#446688" filter="url(#rough2)">排序</text>

  <!-- 排序后的值 -->
  <rect x="40" y="172" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="68" y="197" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">−2</text>
  <rect x="150" y="172" width="56" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="178" y="197" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="260" y="172" width="56" height="40" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="288" y="197" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="370" y="172" width="56" height="40" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="398" y="197" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>

  <!-- 相邻差标注 -->
  <path d="M96,224 L148,224" stroke="#446688" stroke-width="1.5" marker-start="url(#arrBs)" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="122" y="242" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">差 = 5</text>
  <text x="122" y="257" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">|−2 − 3| = 5</text>

  <path d="M206,224 L258,224" stroke="#b85450" stroke-width="1.5" marker-start="url(#arrRs)" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="232" y="242" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">3 = 3 ✗</text>
  <text x="232" y="257" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">同一个值，不算一对</text>

  <path d="M316,224 L368,224" stroke="#4a7a3a" stroke-width="1.8" marker-start="url(#arrGs)" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="342" y="242" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">差 = 2 ✓ 最小</text>
  <text x="342" y="257" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">|3 − 5| = 2</text>

  <!-- 左下：实现三要点 -->
  <rect x="30" y="272" width="270" height="88" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="165" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">实现三要点</text>
  <text x="165" y="312" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">① 排序后只扫相邻对，不重不漏</text>
  <text x="165" y="330" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">② 相邻相等 = 同一个值 → 跳过</text>
  <text x="165" y="348" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">③ 无数对（全同值 / k=1）→ 0</text>

  <!-- 右下：正确性 -->
  <rect x="316" y="272" width="174" height="88" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="403" y="292" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#333" filter="url(#rough2)">为什么只需看相邻？</text>
  <text x="403" y="312" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">设 a &lt; c &lt; b：</text>
  <text x="403" y="329" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">b − a = (c−a) + (b−c)</text>
  <text x="403" y="346" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">两段都 ≤ b − a ✓</text>
</svg>
