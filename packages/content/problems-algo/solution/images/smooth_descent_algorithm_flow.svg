<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：一次遍历 DP</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">dp[i] = 以 i 结尾的最长平滑段长度；ans += dp[i]</text>

  <!-- ===== Start ===== -->
  <rect x="230" y="58" width="100" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="280" y="77" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">开始</text>
  <line x1="280" y1="88" x2="280" y2="104" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Init ===== -->
  <rect x="170" y="106" width="220" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="280" y="124" text-anchor="middle" font-size="11" fill="#555">ans = 1, dp = 1  （i=0 自身必为平滑段）</text>
  <text x="280" y="140" text-anchor="middle" font-size="10" fill="#888">long long ans 容纳至 ~n²/2</text>
  <line x1="280" y1="148" x2="280" y2="164" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Loop header ===== -->
  <rect x="200" y="166" width="160" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="280" y="185" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">for i = 1 → n−1</text>
  <line x1="280" y1="196" x2="280" y2="212" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Decision diamond ===== -->
  <polygon points="280,214 410,260 280,306 150,260" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="256" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">prices[i] ==</text>
  <text x="280" y="272" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">prices[i−1] − 1 ?</text>

  <!-- ===== Yes branch (left) ===== -->
  <line x1="150" y1="260" x2="110" y2="260" stroke="#4a7a3a" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="252" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="50" y="270" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="110" y="292" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">dp = dp + 1</text>

  <!-- ===== No branch (right) ===== -->
  <line x1="410" y1="260" x2="450" y2="260" stroke="#b85450" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="425" y="252" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="390" y="270" width="120" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="450" y="292" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">dp = 1</text>

  <!-- ===== Merge to ans += dp ===== -->
  <path d="M 110 304 L 110 340 L 280 340" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <path d="M 450 304 L 450 340 L 280 340" stroke="#666" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <line x1="280" y1="340" x2="280" y2="358" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="360" width="280" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="280" y="382" text-anchor="middle" font-size="11" fill="#555">ans += dp  （以 i 结尾的 dp 个子数组都合法）</text>

  <!-- ===== Loop back arrow ===== -->
  <path d="M 420 377 L 510 377 L 510 181 L 360 181" stroke="#888" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="522" y="280" font-size="9" fill="#888" transform="rotate(-90 522 280)">继续下一轮 i</text>

  <!-- ===== After loop: arrow down to return ===== -->
  <line x1="280" y1="394" x2="280" y2="418" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="210" y="420" width="140" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="16" filter="url(#rough2)"/>
  <text x="280" y="441" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">返回 ans</text>
</svg>
