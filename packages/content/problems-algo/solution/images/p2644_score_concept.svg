<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="600" height="360" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">可整除性得分 = 能被除数 d 整除的 nums 元素个数</text>

  <line x1="300" y1="50" x2="300" y2="332" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4 5" filter="url(#rough2)"/>

  <!-- ===== Left panel: d = 5 (score 2) ===== -->
  <rect x="24" y="58" width="256" height="274" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="152" y="80" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">除数 d = 5</text>
  <text x="152" y="100" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">nums = [2, 9, 15, 50]</text>

  <rect x="51" y="120" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="74" y="145" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="103" y="120" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="126" y="145" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">9</text>
  <rect x="155" y="120" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="178" y="145" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">15</text>
  <rect x="207" y="120" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="145" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">50</text>

  <text x="74" y="186" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="126" y="186" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="178" y="186" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  <text x="230" y="186" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>

  <path d="M 152 202 L 152 226" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="92" y="234" width="120" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="152" y="262" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">得分 = 2</text>

  <text x="152" y="302" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">15 ÷ 5 = 3，50 ÷ 5 = 10</text>
  <text x="152" y="320" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">两个可整除 → 得分 2</text>

  <!-- ===== Right panel: d = 7 (score 0) ===== -->
  <rect x="320" y="58" width="256" height="274" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="448" y="80" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">除数 d = 7</text>
  <text x="448" y="100" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">nums = [2, 9, 15, 50]</text>

  <rect x="347" y="120" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="145" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="399" y="120" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="422" y="145" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">9</text>
  <rect x="451" y="120" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="474" y="145" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">15</text>
  <rect x="503" y="120" width="46" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="526" y="145" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">50</text>

  <text x="370" y="186" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="422" y="186" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="474" y="186" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
  <text x="526" y="186" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <path d="M 448 202 L 448 226" stroke="#d6a040" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="388" y="234" width="120" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="8" filter="url(#rough2)"/>
  <text x="448" y="262" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">得分 = 0</text>

  <text x="448" y="302" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">没有任何数能被 7 整除</text>
  <text x="448" y="320" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">得分随除数变化 → 逐个计数</text>
</svg>
