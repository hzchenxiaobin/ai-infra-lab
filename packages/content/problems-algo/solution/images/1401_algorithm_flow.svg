<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：夹紧 x/y → 算距离平方 → 与半径平方比较</text>

  <!-- Box1: clamp x -->
  <rect x="130" y="52" width="260" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="70" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">夹紧 x</text>
  <text x="260" y="87" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">closestX = max(x1, min(x2, xC))</text>
  <line x1="260" y1="96" x2="260" y2="116" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box2: clamp y -->
  <rect x="130" y="116" width="260" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="134" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">夹紧 y</text>
  <text x="260" y="151" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">closestY = max(y1, min(y2, yC))</text>
  <line x1="260" y1="160" x2="260" y2="180" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box3: compute d^2 -->
  <rect x="130" y="180" width="260" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="198" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">算距离平方</text>
  <text x="260" y="215" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">d² = (xC−cX)² + (yC−cY)²</text>
  <line x1="260" y1="224" x2="260" y2="248" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: decision -->
  <polygon points="260,248 360,296 260,344 160,296"
           fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="292" text-anchor="middle" font-size="12" fill="#444" filter="url(#rough2)">d² ≤ r² ?</text>
  <text x="260" y="308" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">平方比较</text>

  <!-- branch lines -->
  <line x1="160" y1="296" x2="110" y2="296" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="110" y1="296" x2="110" y2="372" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="360" y1="296" x2="410" y2="296" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="410" y1="296" x2="410" y2="372" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="135" y="288" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <text x="385" y="288" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>

  <!-- true box -->
  <rect x="50" y="372" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="110" y="397" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return true</text>

  <!-- false box -->
  <rect x="350" y="372" width="120" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="410" y="397" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">return false</text>
</svg>
