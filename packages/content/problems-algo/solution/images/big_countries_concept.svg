<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="660" height="440" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">核心观察：area ≥ 300万 OR population ≥ 2500万</text>

  <!-- World table -->
  <text x="130" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">World 表</text>
  <rect x="30" y="62" width="200" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="77" font-size="10" fill="#333" font-weight="bold">name</text>
  <text x="150" y="77" font-size="10" fill="#333" font-weight="bold">area</text>
  <text x="205" y="77" font-size="10" fill="#333" font-weight="bold">population</text>
  <line x1="110" y1="62" x2="110" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="180" y1="62" x2="180" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Afghanistan - keep (pop) -->
  <rect x="30" y="84" width="200" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="34" y="98" font-size="9" fill="#333">Afghanistan</text>
  <text x="150" y="98" text-anchor="middle" font-size="9" fill="#333">652230</text>
  <text x="205" y="98" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">25500100</text>
  <line x1="110" y1="84" x2="110" y2="104" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="180" y1="84" x2="180" y2="104" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- Albania - drop -->
  <rect x="30" y="104" width="200" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="34" y="118" font-size="9" fill="#333">Albania</text>
  <text x="150" y="118" text-anchor="middle" font-size="9" fill="#333">28748</text>
  <text x="205" y="118" text-anchor="middle" font-size="9" fill="#333">2831741</text>
  <line x1="110" y1="104" x2="110" y2="124" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="180" y1="104" x2="180" y2="124" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- Algeria - keep (pop) -->
  <rect x="30" y="124" width="200" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="34" y="138" font-size="9" fill="#333">Algeria</text>
  <text x="150" y="138" text-anchor="middle" font-size="9" fill="#333">2381741</text>
  <text x="205" y="138" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">37100000</text>
  <line x1="110" y1="124" x2="110" y2="144" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="180" y1="124" x2="180" y2="144" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- Andorra - drop -->
  <rect x="30" y="144" width="200" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="34" y="158" font-size="9" fill="#333">Andorra</text>
  <text x="150" y="158" text-anchor="middle" font-size="9" fill="#333">468</text>
  <text x="205" y="158" text-anchor="middle" font-size="9" fill="#333">78115</text>
  <line x1="110" y1="144" x2="110" y2="164" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="180" y1="144" x2="180" y2="164" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- Angola - drop -->
  <rect x="30" y="164" width="200" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="34" y="178" font-size="9" fill="#333">Angola</text>
  <text x="150" y="178" text-anchor="middle" font-size="9" fill="#333">1246700</text>
  <text x="205" y="178" text-anchor="middle" font-size="9" fill="#333">20609294</text>
  <line x1="110" y1="164" x2="110" y2="184" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="180" y1="164" x2="180" y2="184" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- Arrow to eval 1 -->
  <path d="M236 124 L276 124" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Eval 1: area >= 3000000 -->
  <text x="335" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">area ≥ 3000000</text>
  <rect x="286" y="62" width="98" height="122" fill="none" stroke="#446688" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="335" y="98" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">FALSE</text>
  <text x="335" y="118" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">FALSE</text>
  <text x="335" y="138" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">FALSE</text>
  <text x="335" y="158" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">FALSE</text>
  <text x="335" y="178" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">FALSE</text>

  <!-- Arrow + OR -->
  <path d="M388 124 L424 124" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="406" y="118" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">OR</text>

  <!-- Eval 2: population >= 25000000 -->
  <text x="483" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">population ≥ 25000000</text>
  <rect x="434" y="62" width="98" height="122" fill="none" stroke="#446688" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="483" y="98" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">TRUE</text>
  <text x="483" y="118" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">FALSE</text>
  <text x="483" y="138" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">TRUE</text>
  <text x="483" y="158" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">FALSE</text>
  <text x="483" y="178" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">FALSE</text>

  <!-- Arrow to result -->
  <path d="M536 124 L572 124" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Result -->
  <text x="612" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">大国?</text>
  <text x="612" y="98" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="612" y="118" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">✗</text>
  <text x="612" y="138" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="612" y="158" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">✗</text>
  <text x="612" y="178" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">✗</text>

  <!-- Callout: OR semantics -->
  <path d="M330 196 L330 216" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="56" y="222" width="548" height="150" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="330" y="246" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">💡 OR 语义：任一条件为 TRUE 即保留</text>

  <text x="76" y="270" font-size="10" fill="#333">两个阈值（满足其一即为「大国」）：</text>
  <text x="96" y="288" font-size="10" fill="#446688" font-weight="bold">① area ≥ 3,000,000（面积≥300万 km²）</text>
  <text x="96" y="306" font-size="10" fill="#446688" font-weight="bold">② population ≥ 25,000,000（人口≥2500万）</text>

  <text x="76" y="330" font-size="10" fill="#333">本例：Afghanistan / Algeria 人口超 2500万 → TRUE；其余两国阈值皆 FALSE → 丢弃</text>
  <text x="76" y="348" font-size="10" fill="#4a7a3a" font-weight="bold">若某国面积≥300万但人口&lt;2500万，仍为大国（OR 短路为 TRUE）</text>

  <text x="76" y="368" font-size="9" fill="#b85450" font-weight="bold">⚠ 用 AND 会要求两条件同时满足 → 漏掉只满足其一的国家</text>
</svg>
