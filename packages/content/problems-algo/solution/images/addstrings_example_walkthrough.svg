<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：456 + 77，逐位累加得到 533</text>

  <!-- ===== Round 1 ===== -->
  <text x="40" y="62" font-size="12" fill="#b85450" font-weight="bold">第 1 轮（个位）</text>
  <!-- num1 -->
  <text x="44" y="92" font-size="11" fill="#888">num1:</text>
  <rect x="92" y="76" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="111" y="97" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="130" y="76" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="149" y="97" text-anchor="middle" font-size="13" fill="#333">5</text>
  <rect x="168" y="76" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="187" y="97" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <text x="187" y="66" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">i=2</text>
  <!-- num2 -->
  <text x="44" y="128" font-size="11" fill="#888">num2:</text>
  <rect x="130" y="112" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="149" y="133" text-anchor="middle" font-size="13" fill="#333">7</text>
  <rect x="168" y="112" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="187" y="133" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
  <text x="187" y="156" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">j=1</text>
  <!-- sum calc -->
  <text x="246" y="104" font-size="11" fill="#666">→ 6 + 7 + 0 =</text>
  <rect x="350" y="88" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="372" y="108" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">13</text>
  <text x="412" y="104" font-size="11" fill="#4a7a3a">写 3，carry=1</text>

  <!-- ===== Round 2 ===== -->
  <text x="40" y="196" font-size="12" fill="#b85450" font-weight="bold">第 2 轮（十位）</text>
  <text x="44" y="226" font-size="11" fill="#888">num1:</text>
  <rect x="92" y="210" width="38" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="111" y="231" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="130" y="210" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="149" y="231" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <rect x="168" y="210" width="38" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="187" y="231" text-anchor="middle" font-size="13" fill="#bbb">6</text>
  <text x="149" y="200" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">i=1</text>
  <text x="44" y="262" font-size="11" fill="#888">num2:</text>
  <rect x="130" y="246" width="38" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="149" y="267" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
  <rect x="168" y="246" width="38" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="187" y="267" text-anchor="middle" font-size="13" fill="#bbb">7</text>
  <text x="149" y="290" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">j=0</text>
  <text x="246" y="238" font-size="11" fill="#666">→ 5 + 7 + 1 =</text>
  <rect x="350" y="222" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="372" y="242" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">13</text>
  <text x="412" y="238" font-size="11" fill="#4a7a3a">写 3，carry=1</text>

  <!-- ===== Round 3 ===== -->
  <text x="40" y="330" font-size="12" fill="#b85450" font-weight="bold">第 3 轮（百位，短串已扫完）</text>
  <text x="44" y="360" font-size="11" fill="#888">num1:</text>
  <rect x="92" y="344" width="38" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="111" y="365" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="130" y="344" width="38" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="149" y="365" text-anchor="middle" font-size="13" fill="#bbb">5</text>
  <rect x="168" y="344" width="38" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="187" y="365" text-anchor="middle" font-size="13" fill="#bbb">6</text>
  <text x="111" y="334" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">i=0</text>
  <text x="44" y="396" font-size="11" fill="#888">num2:</text>
  <text x="149" y="372" text-anchor="middle" font-size="9" fill="#888">j &lt; 0</text>
  <rect x="130" y="380" width="38" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="149" y="401" text-anchor="middle" font-size="13" fill="#bbb">—</text>
  <rect x="168" y="380" width="38" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" rx="4" filter="url(#rough2)"/>
  <text x="187" y="401" text-anchor="middle" font-size="13" fill="#bbb">—</text>
  <text x="246" y="372" font-size="11" fill="#666">→ 4 + 0 + 1 =</text>
  <rect x="350" y="356" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="372" y="376" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <text x="412" y="372" font-size="11" fill="#4a7a3a">写 5，carry=0</text>

  <!-- ===== Final result ===== -->
  <rect x="40" y="420" width="500" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="440" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">写入顺序 3,3,5 → 反转 → "533" ✓</text>
</svg>
