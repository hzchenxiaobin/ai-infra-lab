<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    核心观察：交换边 → 连通分量 → 内部自由排列
  </text>

  <!-- Swap graph: indices as nodes, edges = allowedSwaps -->
  <text x="36" y="62" font-size="11" fill="#888" filter="url(#rough2)">下标图（allowedSwaps 为边）</text>

  <!-- Component 1: {0, 1} blue -->
  <ellipse cx="100" cy="105" rx="58" ry="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)" opacity="0.7"/>
  <circle cx="72" cy="100" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="72" y="104" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <circle cx="128" cy="100" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="128" y="104" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <path d="M88,100 L112,100" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="100" y="88" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">swap</text>

  <!-- Component 2: {2, 3} green -->
  <ellipse cx="260" cy="105" rx="58" ry="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#rough2)" opacity="0.7"/>
  <circle cx="232" cy="100" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="232" y="104" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <circle cx="288" cy="100" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="288" y="104" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <path d="M248,100 L272,100" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="260" y="88" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">swap</text>

  <!-- Isolated node (no swap) grey -->
  <circle cx="420" cy="100" r="16" fill="#f5f5f5" stroke="#bbb" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="420" y="104" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">k</text>
  <text x="420" y="138" text-anchor="middle" font-size="9" fill="#aaa" filter="url(#rough2)">无交换边</text>

  <!-- Arrow down -->
  <path d="M180,140 L180,168" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="196" y="160" font-size="10" fill="#b85450" filter="url(#rough2)">并查集</text>

  <!-- Row: source / target values per component -->
  <text x="36" y="188" font-size="11" fill="#888" filter="url(#rough2)">分量内 source / target 值</text>

  <!-- Component 1 values -->
  <rect x="50" y="198" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="69" y="216" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="92" y="198" width="38" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="111" y="216" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="140" y="216" font-size="10" fill="#888" filter="url(#rough2)">src</text>

  <rect x="50" y="232" width="38" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="69" y="250" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="92" y="232" width="38" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="111" y="250" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="140" y="250" font-size="10" fill="#888" filter="url(#rough2)">tgt</text>

  <!-- Component 2 values -->
  <rect x="210" y="198" width="38" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="229" y="216" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="252" y="198" width="38" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="271" y="216" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="300" y="216" font-size="10" fill="#888" filter="url(#rough2)">src</text>

  <rect x="210" y="232" width="38" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="229" y="250" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <rect x="252" y="232" width="38" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="271" y="250" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <text x="300" y="250" font-size="10" fill="#888" filter="url(#rough2)">tgt</text>

  <!-- Arrow down -->
  <path d="M180,270 L180,296" stroke="#b85450" stroke-width="1.6" stroke-dasharray="4 3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="196" y="288" font-size="10" fill="#b85450" filter="url(#rough2)">频率匹配</text>

  <!-- Insight box -->
  <rect x="40" y="300" width="480" height="66" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">
    分量内 source 可任意排列 → 比较多重集频率
  </text>
  <text x="280" y="342" text-anchor="middle" font-size="11" fill="#5a3a3a" filter="url(#rough2)">
    匹配数 = Σ min(src[v], tgt[v])；距离 = |C| − 匹配数
  </text>
  <text x="280" y="358" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    {1,2} vs {2,1} → 匹配 2，距离 0　|　{3,4} vs {4,5} → 匹配 1，距离 1
  </text>
</svg>
