<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：两玩家独立计分 → 比较大小</text>

  <!-- start -->
  <rect x="220" y="50" width="120" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="18" filter="url(#rough2)"/>
  <text x="280" y="73" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">输入 player1, player2</text>
  <path d="M 280 86 L 280 100" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- score(p) function box -->
  <rect x="150" y="104" width="260" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="120" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">对每个玩家调用 score(p)：</text>
  <text x="280" y="136" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">两玩家完全独立，复用同一函数</text>
  <path d="M 280 144 L 280 156" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop diamond -->
  <path d="M 280 158 L 360 196 L 280 234 L 200 196 Z" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="190" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">遍历每轮 i</text>
  <text x="280" y="206" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">i = 0 .. n-1</text>
  <path d="M 280 234 L 280 248" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision: doubled? -->
  <path d="M 280 250 L 380 286 L 280 322 L 180 286 Z" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="282" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">前两轮有 10 ?</text>
  <text x="280" y="298" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">p[i-1]==10 或 p[i-2]==10</text>

  <!-- yes branch -->
  <path d="M 380 286 L 440 286" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="410" y="280" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="440" y="268" width="92" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="486" y="284" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">s += 2×p[i]</text>
  <text x="486" y="298" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">翻倍</text>

  <!-- no branch -->
  <path d="M 180 286 L 120 286" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="280" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="28" y="268" width="92" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="74" y="284" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">s += p[i]</text>
  <text x="74" y="298" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">原值</text>

  <!-- loop back arrow to diamond -->
  <path d="M 486 304 Q 486 340 360 196" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 74 304 Q 74 340 200 196" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">← 下一轮（虚线回流）</text>

  <!-- bottom compare -->
  <text x="280" y="370" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">得 s1, s2 → s1&gt;s2 返 1，s1&lt;s2 返 2，相等返 0</text>
</svg>
