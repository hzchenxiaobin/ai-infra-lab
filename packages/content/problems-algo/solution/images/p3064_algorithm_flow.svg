<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：固定 30 次单比特询问，拼出隐藏数 n</text>

  <!-- start -->
  <ellipse cx="210" cy="46" rx="42" ry="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="210" y="51" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M 210 62 L 210 76" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="118" y="78" width="184" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="210" y="98" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">n = 0；i = 0</text>
  <path d="M 210 108 L 210 122" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 1 -->
  <polygon points="210,124 266,150 210,176 154,150" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="210" y="155" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">i &lt; 30 ?</text>

  <!-- no -> return -->
  <path d="M 154 150 L 108 150" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="131" y="141" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">否</text>
  <ellipse cx="60" cy="150" rx="44" ry="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="155" text-anchor="middle" font-size="12" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">返回 n</text>

  <!-- yes -->
  <path d="M 210 176 L 210 192" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="222" y="189" font-size="10.5" fill="#446688" filter="url(#rough2)">是</text>

  <!-- query -->
  <rect x="106" y="194" width="208" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="210" y="214" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">c = commonSetBits(1 &lt;&lt; i)　询问第 i 位</text>
  <path d="M 210 224 L 210 238" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 2 -->
  <polygon points="210,240 268,266 210,292 152,266" fill="#ffffff" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="210" y="271" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">c &gt; 0 ?</text>

  <!-- yes -> set bit -->
  <path d="M 152 266 L 120 266" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="136" y="258" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="28" y="250" width="90" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="73" y="270" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">n |= 1 &lt;&lt; i</text>

  <!-- no -->
  <path d="M 210 292 L 210 312" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="224" y="306" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">否·该位是 0，跳过</text>

  <!-- set-bit merge -->
  <path d="M 73 282 L 73 329 L 116 329" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- i += 1 -->
  <rect x="118" y="314" width="184" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="210" y="334" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">i += 1　→　回到顶部判断</text>

  <!-- loop back -->
  <path d="M 302 329 L 430 329 L 430 150 L 270 150" stroke="#d6a040" stroke-width="1.6" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="368" y="348" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">下一位</text>

  <!-- bottom notes -->
  <rect x="40" y="356" width="440" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="372" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">固定 30 次调用、O(log n) 时间 / O(1) 空间，无任何自适应分支</text>
  <text x="260" y="388" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">n ≤ 2³⁰ − 1 ⇒ 第 30/31 位必为 0，循环上界取 30 即可；1 &lt;&lt; i（i ≤ 29）在 int 内安全</text>
</svg>
