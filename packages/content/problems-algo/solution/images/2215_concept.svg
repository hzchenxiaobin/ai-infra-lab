<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：集合差集 A\B 与 B\A</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888">nums1 = [1,2,3]，nums2 = [2,4,6]</text>

  <!-- ===== Two overlapping ellipses (Venn) ===== -->
  <!-- Set A (nums1): blue ellipse, left -->
  <ellipse cx="195" cy="170" rx="105" ry="78" fill="#e8f0fe" fill-opacity="0.65"
           stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <!-- Set B (nums2): orange ellipse, right -->
  <ellipse cx="325" cy="170" rx="105" ry="78" fill="#fff8e1" fill-opacity="0.65"
           stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>

  <!-- Labels for sets -->
  <text x="135" y="112" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">集合 A = set(nums1)</text>
  <text x="385" y="112" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">集合 B = set(nums2)</text>

  <!-- Elements of A: 1, 2, 3 -->
  <text x="160" y="178" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">1</text>
  <text x="210" y="178" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">2</text>
  <text x="195" y="210" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">3</text>

  <!-- Elements of B: 2, 4, 6 -->
  <text x="310" y="178" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">2</text>
  <text x="360" y="178" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">4</text>
  <text x="325" y="210" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">6</text>

  <!-- Intersection highlight circle around shared 2 -->
  <circle cx="260" cy="174" r="14" fill="none" stroke="#b85450" stroke-width="1.8"
          stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="260" y="150" text-anchor="middle" font-size="9.5" fill="#b85450">交 ∩ = {2}</text>

  <!-- ===== A \ B region highlight (green) ===== -->
  <text x="125" y="252" font-size="11" fill="#4a7a3a" font-weight="bold">A\B：</text>
  <text x="165" y="252" font-size="10.5" fill="#555">A 中不在 B 的不同整数</text>
  <rect x="125" y="262" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"
        rx="6" filter="url(#rough2)"/>
  <text x="185" y="280" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">{1, 3} → answer[0]</text>

  <!-- arrow from A\B area to green box -->
  <path d="M 175 232 L 180 260" stroke="#4a7a3a" stroke-width="1.5" fill="none"
        marker-end="url(#arr)" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- ===== B \ A region highlight (green) ===== -->
  <text x="295" y="252" font-size="11" fill="#4a7a3a" font-weight="bold">B\A：</text>
  <text x="335" y="252" font-size="10.5" fill="#555">B 中不在 A 的不同整数</text>
  <rect x="295" y="262" width="120" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"
        rx="6" filter="url(#rough2)"/>
  <text x="355" y="280" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">{4, 6} → answer[1]</text>

  <path d="M 345 232 L 350 260" stroke="#4a7a3a" stroke-width="1.5" fill="none"
        marker-end="url(#arr)" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- ===== Final answer ===== -->
  <rect x="60" y="306" width="400" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"
        rx="6" filter="url(#rough2)"/>
  <text x="260" y="326" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">
    answer = [[1, 3], [4, 6]]（顺序可任意）
  </text>

  <!-- Footer -->
  <text x="260" y="352" text-anchor="middle" font-size="10" fill="#888">蓝=A · 橙=B · 红圈=交集 · 绿框=差集结果（去重后）</text>
</svg>
