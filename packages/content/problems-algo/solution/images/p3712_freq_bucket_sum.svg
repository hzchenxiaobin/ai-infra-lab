<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：贡献 = 元素值 × 出现次数</text>

  <text x="260" y="48" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">nums = [1,2,2,3,3,3,3,4]，k = 2</text>

  <!-- 数组格子 -->
  <rect x="110" y="56" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="127" y="78" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="148" y="56" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="165" y="78" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="186" y="56" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="203" y="78" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="224" y="56" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="241" y="78" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="262" y="56" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="279" y="78" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="300" y="56" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="317" y="78" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="338" y="56" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="355" y="78" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">3</text>
  <rect x="376" y="56" width="34" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="393" y="78" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>

  <path d="M 260 94 L 260 110" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="107" font-size="11" fill="#666" filter="url(#rough2)">一趟扫描入桶</text>

  <!-- 计数桶 -->
  <rect x="65" y="116" width="90" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="110" y="136" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">值 = 1</text>
  <text x="110" y="158" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">出现 1 次</text>

  <rect x="165" y="116" width="90" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="210" y="136" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">值 = 2</text>
  <text x="210" y="158" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">出现 2 次</text>

  <rect x="265" y="116" width="90" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="310" y="136" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">值 = 3</text>
  <text x="310" y="158" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">出现 4 次</text>

  <rect x="365" y="116" width="90" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="410" y="136" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">值 = 4</text>
  <text x="410" y="158" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">出现 1 次</text>

  <!-- 判定 -->
  <text x="110" y="190" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1 % 2 = 1 ✗</text>
  <text x="210" y="190" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">2 % 2 = 0 ✓</text>
  <text x="310" y="190" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">4 % 2 = 0 ✓</text>
  <text x="410" y="190" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">1 % 2 = 1 ✗</text>

  <text x="260" y="216" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">命中元素 → 贡献 = 元素值 × 出现次数：</text>

  <text x="70" y="247" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">1 ✗</text>

  <rect x="120" y="226" width="130" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="185" y="247" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2 × 2 = 4</text>

  <rect x="270" y="226" width="130" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="335" y="247" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3 × 4 = 12</text>

  <text x="450" y="247" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">4 ✗</text>

  <path d="M 260 262 L 260 274" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="140" y="276" width="240" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="298" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">ans = 4 + 12 = 16</text>

  <text x="16" y="340" font-size="10" fill="#999" filter="url(#rough2)">⚠️ 判定对象是「出现次数」能否被 k 整除，不是元素值本身；</text>
  <text x="16" y="352" font-size="10" fill="#999" filter="url(#rough2)">若误算成「去重和」2 + 3 = 5 → 错，命中元素的每次出现都要计入</text>
</svg>
