<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="320" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [3, 4, 4, 5]</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#888">两个 4 含 2² 直接淘汰，入 DP 的只有 3、5</text>

  <!-- table outline -->
  <rect x="30" y="56" width="470" height="224" fill="none" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>

  <!-- column separators -->
  <g stroke="#9bb" stroke-width="1" filter="url(#rough2)">
    <line x1="120" y1="56" x2="120" y2="280"/>
    <line x1="192" y1="56" x2="192" y2="280"/>
    <line x1="264" y1="56" x2="264" y2="280"/>
    <line x1="336" y1="56" x2="336" y2="280"/>
    <line x1="408" y1="56" x2="408" y2="280"/>
  </g>
  <!-- row separators -->
  <g stroke="#9bb" stroke-width="1" filter="url(#rough2)">
    <line x1="30" y1="88" x2="500" y2="88"/>
    <line x1="30" y1="120" x2="500" y2="120"/>
    <line x1="30" y1="152" x2="500" y2="152"/>
    <line x1="30" y1="184" x2="500" y2="184"/>
    <line x1="30" y1="216" x2="500" y2="216"/>
    <line x1="30" y1="248" x2="500" y2="248"/>
  </g>

  <!-- header -->
  <rect x="30" y="56" width="470" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="0" rx="0" filter="url(#rough2)"/>
  <g font-size="11" fill="#333" text-anchor="middle" font-weight="bold">
    <text x="75" y="76">阶段</text>
    <text x="156" y="76">dp[∅]</text>
    <text x="228" y="76">dp[{3}]</text>
    <text x="300" y="76">dp[{5}]</text>
    <text x="372" y="76">dp[{3,5}]</text>
    <text x="454" y="76">说明</text>
  </g>

  <!-- row 1: 初始 -->
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="75" y="108" font-weight="bold">初始</text>
    <text x="156" y="108" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="228" y="108" fill="#aaa">0</text>
    <text x="300" y="108" fill="#aaa">0</text>
    <text x="372" y="108" fill="#aaa">0</text>
    <text x="454" y="108" font-size="10" fill="#888">仅空集</text>
  </g>

  <!-- row 2: v=3 -->
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="75" y="140" font-weight="bold">v = 3</text>
    <text x="156" y="140" fill="#4a7a3a">1</text>
    <text x="228" y="140" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="300" y="140" fill="#aaa">0</text>
    <text x="372" y="140" fill="#aaa">0</text>
    <text x="454" y="140" font-size="9.5" fill="#888">∅→{3} 并入</text>
  </g>

  <!-- row 3: v=4 淘汰 -->
  <g font-size="11" text-anchor="middle">
    <text x="75" y="172" fill="#b85450" font-weight="bold">v = 4</text>
    <text x="156" y="172" fill="#aaa">1</text>
    <text x="228" y="172" fill="#aaa">1</text>
    <text x="300" y="172" fill="#aaa">0</text>
    <text x="372" y="172" fill="#aaa">0</text>
    <text x="454" y="172" font-size="9.5" fill="#b85450">2² 淘汰，跳过</text>
  </g>

  <!-- row 4: v=4 淘汰 -->
  <g font-size="11" text-anchor="middle">
    <text x="75" y="204" fill="#b85450" font-weight="bold">v = 4</text>
    <text x="156" y="204" fill="#aaa">1</text>
    <text x="228" y="204" fill="#aaa">1</text>
    <text x="300" y="204" fill="#aaa">0</text>
    <text x="372" y="204" fill="#aaa">0</text>
    <text x="454" y="204" font-size="9.5" fill="#b85450">2² 淘汰，跳过</text>
  </g>

  <!-- row 5: v=5 -->
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="75" y="236" font-weight="bold">v = 5</text>
    <text x="156" y="236" fill="#4a7a3a">1</text>
    <text x="228" y="236" fill="#4a7a3a">1</text>
    <text x="300" y="236" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="372" y="236" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="454" y="236" font-size="9" fill="#888">∅→{5},{3}→{3,5}</text>
  </g>

  <!-- row 6: 汇总 (merged mask columns) -->
  <rect x="120" y="248" width="288" height="32" fill="#fff8e1" filter="url(#rough2)"/>
  <text x="75" y="270" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">汇总</text>
  <text x="264" y="270" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">Σ dp[s] = 1 + 1 + 1 + 1 = 4</text>
  <text x="454" y="270" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">4 − 1 = 3 ✓</text>

  <!-- bottom answer annotation -->
  <rect x="120" y="292" width="288" height="22" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="264" y="307" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">答案 = 3 ：{3}、{5}、{3,5}</text>
</svg>
