<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：构造 5 候选 → 排除自身 → 取最近</text>

  <!-- Step 1: Input -->
  <rect x="170" y="44" width="180" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="66" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">输入：字符串 n（1 ≤ len ≤ 18）</text>

  <!-- Arrow 1 -->
  <line x1="260" y1="80" x2="260" y2="96" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: Compute prefix -->
  <rect x="120" y="100" width="280" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="120" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">k = len(n)，half = (k+1)//2</text>
  <text x="260" y="138" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">prefix = int(n[:half])</text>

  <!-- Arrow 2 -->
  <line x1="260" y1="150" x2="260" y2="166" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: Generate 5 candidates -->
  <rect x="60" y="170" width="400" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="190" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">构造 5 个候选</text>
  <text x="80" y="210" font-size="11" fill="#446688">前缀候选（3 个）：</text>
  <text x="80" y="226" font-size="10" fill="#555">  delta ∈ {−1, 0, +1} → p = str(prefix+delta)</text>
  <text x="80" y="240" font-size="10" fill="#555">  len(p)==half → 镜像 p + reverse(p[:k//2])</text>
  <text x="80" y="258" font-size="11" fill="#b85450">边界候选（2 个）：</text>
  <text x="280" y="258" font-size="10" fill="#555">10^(k−1)−1  与  10^k+1</text>

  <!-- Arrow 3 -->
  <line x1="260" y1="272" x2="260" y2="288" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: Filter out n -->
  <rect x="140" y="292" width="240" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="314" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">排除自身：candidates.erase(int(n))</text>

  <!-- Arrow 4 -->
  <line x1="260" y1="330" x2="260" y2="346" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: Find closest -->
  <rect x="100" y="350" width="320" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="370" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">择优：min(候选, key=(|候选−n|, 候选))</text>
  <text x="260" y="388" text-anchor="middle" font-size="10" fill="#666">平手时元组第二项取较小值</text>

  <!-- Arrow 5 -->
  <line x1="260" y1="400" x2="260" y2="416" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 6: Output -->
  <rect x="170" y="420" width="180" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="441" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">输出：str(ans)</text>
</svg>
