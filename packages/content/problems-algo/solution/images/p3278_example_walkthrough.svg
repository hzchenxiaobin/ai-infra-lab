<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 512" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="512" fill="#fafafa"/>

  <text x="290" y="20" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：501 同分靠「小 id」破平局，502 靠除法筛唯一全才</text>
  <text x="290" y="36" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">delta：prof＞imp 记 +10，prof＜imp 记 −5，相等记 0；score = 100 + Σdelta</text>

  <rect x="26" y="44" width="528" height="184" fill="#ffffff" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="64" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">项目 501：Python(4) · Tableau(3) · PostgreSQL(5)，required = 3</text>

  <rect x="96" y="74" width="68" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="130" y="90" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">候选人</text>
  <rect x="164" y="74" width="72" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="200" y="90" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">Python</text>
  <rect x="236" y="74" width="78" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="275" y="90" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">Tableau</text>
  <rect x="314" y="74" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="364" y="90" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">PostgreSQL</text>
  <rect x="414" y="74" width="70" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="449" y="90" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">matched</text>
  <rect x="484" y="74" width="52" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="510" y="90" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">score</text>

  <rect x="96" y="98" width="440" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="130" y="114" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">101</text>
  <text x="200" y="114" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">5&gt;4 +10</text>
  <text x="275" y="114" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3=3 ±0</text>
  <text x="364" y="114" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4&lt;5 −5</text>
  <text x="449" y="114" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3/3</text>
  <text x="510" y="114" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">105</text>

  <rect x="96" y="122" width="440" height="24" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="130" y="138" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">102</text>
  <text x="200" y="138" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4=4 ±0</text>
  <text x="275" y="138" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">5&gt;3 +10</text>
  <text x="364" y="138" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4&lt;5 −5</text>
  <text x="449" y="138" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3/3</text>
  <text x="510" y="138" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">105</text>

  <rect x="96" y="146" width="440" height="24" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="130" y="162" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">103</text>
  <text x="200" y="162" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3&lt;4 −5</text>
  <text x="275" y="162" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">5&gt;3 +10</text>
  <text x="364" y="162" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">5=5 ±0</text>
  <text x="449" y="162" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3/3</text>
  <text x="510" y="162" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">105</text>

  <text x="290" y="198" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">三人 delta 恰好都是 {+10, 0, −5}，同分 105 —— 平局打破：取最小 candidate_id = 101 ✓</text>
  <text x="290" y="216" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">（同为 3/3 全齐，资格过滤不淘汰任何人，全靠分数与 id 定胜负）</text>

  <rect x="26" y="240" width="528" height="184" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="260" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">项目 502：Python(3) · Tableau(4) · R(2)，required = 3</text>

  <rect x="96" y="270" width="68" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="130" y="286" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">候选人</text>
  <rect x="164" y="270" width="72" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="200" y="286" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Python</text>
  <rect x="236" y="270" width="78" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="275" y="286" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Tableau</text>
  <rect x="314" y="270" width="100" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="364" y="286" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">R</text>
  <rect x="414" y="270" width="70" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="449" y="286" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">matched</text>
  <rect x="484" y="270" width="52" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="510" y="286" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">score</text>

  <rect x="96" y="294" width="440" height="24" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="130" y="310" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">101</text>
  <text x="200" y="310" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">5&gt;3 +10</text>
  <text x="275" y="310" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3&lt;4 −5</text>
  <text x="364" y="310" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗ 无 R</text>
  <text x="449" y="310" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">2/3</text>
  <text x="510" y="310" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">出局</text>

  <rect x="96" y="318" width="440" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="3" filter="url(#rough2)"/>
  <text x="130" y="334" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">102</text>
  <text x="200" y="334" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4&gt;3 +10</text>
  <text x="275" y="334" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">5&gt;4 +10</text>
  <text x="364" y="334" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4&gt;2 +10</text>
  <text x="449" y="334" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3/3</text>
  <text x="510" y="334" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">130</text>

  <rect x="96" y="342" width="440" height="24" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="130" y="358" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">103</text>
  <text x="200" y="358" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3=3 ±0</text>
  <text x="275" y="358" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">5&gt;4 +10</text>
  <text x="364" y="358" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✗ 无 R</text>
  <text x="449" y="358" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">2/3</text>
  <text x="510" y="358" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">出局</text>

  <text x="290" y="394" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">101 / 103 缺 R：matched 2 ≠ required 3，被除法过滤——分数再高也没资格；</text>
  <text x="290" y="412" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">102 唯一全才，三项全超 → 100 + 30 = 130 ✓</text>

  <rect x="190" y="436" width="78" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="229" y="451" text-anchor="middle" font-size="9" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">project_id</text>
  <rect x="268" y="436" width="94" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="315" y="451" text-anchor="middle" font-size="9" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">candidate_id</text>
  <rect x="362" y="436" width="52" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="388" y="451" text-anchor="middle" font-size="9" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">score</text>

  <rect x="190" y="458" width="78" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="229" y="473" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">501</text>
  <rect x="268" y="458" width="94" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="315" y="473" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">101</text>
  <rect x="362" y="458" width="52" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="388" y="473" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">105</text>

  <rect x="190" y="480" width="78" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="229" y="495" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">502</text>
  <rect x="268" y="480" width="94" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="315" y="495" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">102</text>
  <rect x="362" y="480" width="52" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="388" y="495" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">130</text>
</svg>
