<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：bloomDay = [1,10,3,10,2], m=3, k=1</text>

  <!-- Header row -->
  <rect x="20" y="40" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="65" y="58" text-anchor="middle" font-size="11" fill="#335" font-weight="bold">区间 [lo,hi]</text>
  <rect x="110" y="40" width="50" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="58" text-anchor="middle" font-size="11" fill="#335" font-weight="bold">mid</text>
  <rect x="160" y="40" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="58" text-anchor="middle" font-size="10" fill="#335" font-weight="bold">idx0=1</text>
  <rect x="216" y="40" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="244" y="58" text-anchor="middle" font-size="10" fill="#335" font-weight="bold">idx1=10</text>
  <rect x="272" y="40" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="58" text-anchor="middle" font-size="10" fill="#335" font-weight="bold">idx2=3</text>
  <rect x="328" y="40" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="356" y="58" text-anchor="middle" font-size="10" fill="#335" font-weight="bold">idx3=10</text>
  <rect x="384" y="40" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="412" y="58" text-anchor="middle" font-size="10" fill="#335" font-weight="bold">idx4=2</text>
  <rect x="440" y="40" width="50" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="465" y="58" text-anchor="middle" font-size="10" fill="#a87020" font-weight="bold">花束</text>
  <rect x="490" y="40" width="54" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="517" y="58" text-anchor="middle" font-size="10" fill="#3a5a2a" font-weight="bold">决策</text>

  <!-- Row 1: [1,10] mid=5 -->
  <rect x="20" y="72" width="90" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="65" y="90" text-anchor="middle" font-size="11" fill="#333">[1, 10]</text>
  <rect x="110" y="72" width="50" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="135" y="90" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <!-- bloom pattern: 1≤5✓ 10≤5✗ 3≤5✓ 10≤5✗ 2≤5✓ -->
  <rect x="160" y="72" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="90" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">✓</text>
  <rect x="216" y="72" width="56" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="244" y="90" text-anchor="middle" font-size="11" fill="#b85450">✗</text>
  <rect x="272" y="72" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="90" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">✓</text>
  <rect x="328" y="72" width="56" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="356" y="90" text-anchor="middle" font-size="11" fill="#b85450">✗</text>
  <rect x="384" y="72" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="412" y="90" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">✓</text>
  <rect x="440" y="72" width="50" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="465" y="90" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">3</text>
  <rect x="490" y="72" width="54" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="517" y="90" text-anchor="middle" font-size="10" fill="#3a5a2a" font-weight="bold">✓ ans=5</text>

  <!-- Row 2: [1,4] mid=2 -->
  <rect x="20" y="104" width="90" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="65" y="122" text-anchor="middle" font-size="11" fill="#333">[1, 4]</text>
  <rect x="110" y="104" width="50" height="28" fill="#fafafa" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="135" y="122" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="160" y="104" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="122" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">✓</text>
  <rect x="216" y="104" width="56" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="244" y="122" text-anchor="middle" font-size="11" fill="#b85450">✗</text>
  <rect x="272" y="104" width="56" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="122" text-anchor="middle" font-size="11" fill="#b85450">✗</text>
  <rect x="328" y="104" width="56" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="356" y="122" text-anchor="middle" font-size="11" fill="#b85450">✗</text>
  <rect x="384" y="104" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="412" y="122" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">✓</text>
  <rect x="440" y="104" width="50" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="465" y="122" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">2</text>
  <rect x="490" y="104" width="54" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="517" y="122" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✗ lo=3</text>

  <!-- Row 3: [3,4] mid=3 (answer) -->
  <rect x="20" y="136" width="90" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="65" y="154" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">[3, 4]</text>
  <rect x="110" y="136" width="50" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="135" y="154" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">3 ★</text>
  <rect x="160" y="136" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="154" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">✓</text>
  <rect x="216" y="136" width="56" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="244" y="154" text-anchor="middle" font-size="11" fill="#b85450">✗</text>
  <rect x="272" y="136" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="154" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">✓</text>
  <rect x="328" y="136" width="56" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="356" y="154" text-anchor="middle" font-size="11" fill="#b85450">✗</text>
  <rect x="384" y="136" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="412" y="154" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">✓</text>
  <rect x="440" y="136" width="50" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="465" y="154" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">3</text>
  <rect x="490" y="136" width="54" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="517" y="154" text-anchor="middle" font-size="10" fill="#3a5a2a" font-weight="bold">✓ ans=3</text>

  <!-- separator -->
  <line x1="20" y1="176" x2="544" y2="176" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- Result box -->
  <rect x="120" y="188" width="320" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="211" text-anchor="middle" font-size="13" fill="#3a5a2a" font-weight="bold">lo=3 &gt; hi=2 → 循环结束，返回 ans = 3</text>

  <!-- Explanation of check() with k=3 example -->
  <text x="280" y="246" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">check() 贪心过程（以 k=3 为例）</text>

  <!-- k=3 example: bloomDay = [7,7,7,7,12,7,7], d=7 -->
  <text x="40" y="272" font-size="11" fill="#a87020" font-weight="bold">d=7, k=3:</text>
  <g filter="url(#rough2)">
    <rect x="100" y="260" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="124" y="278" text-anchor="middle" font-size="10" fill="#3a5a2a">7✓</text>
    <rect x="148" y="260" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="172" y="278" text-anchor="middle" font-size="10" fill="#3a5a2a">7✓</text>
    <rect x="196" y="260" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="220" y="278" text-anchor="middle" font-size="10" fill="#3a5a2a">7✓</text>
    <rect x="244" y="260" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="268" y="278" text-anchor="middle" font-size="10" fill="#3a5a2a">7✓</text>
    <rect x="292" y="260" width="48" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="316" y="278" text-anchor="middle" font-size="10" fill="#b85450">12✗</text>
    <rect x="340" y="260" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="364" y="278" text-anchor="middle" font-size="10" fill="#3a5a2a">7✓</text>
    <rect x="388" y="260" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="412" y="278" text-anchor="middle" font-size="10" fill="#3a5a2a">7✓</text>
  </g>
  <!-- bracket: first 4 consecutive → 4//3=1 bouquet -->
  <path d="M 104 292 L 104 298 L 288 298 L 288 292" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="196" y="312" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">连续4朵 → ⌊4/3⌋ = 1 束</text>
  <path d="M 344 292 L 344 298 L 412 298 L 412 292" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="378" y="312" text-anchor="middle" font-size="10" fill="#888">连续2朵 → 0 束</text>
  <rect x="448" y="266" width="96" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="496" y="285" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">共 1 束 &lt; 2 ✗</text>

  <!-- d=12 -->
  <text x="40" y="344" font-size="11" fill="#4a7a3a" font-weight="bold">d=12, k=3:</text>
  <g filter="url(#rough2)">
    <rect x="100" y="332" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="124" y="350" text-anchor="middle" font-size="10" fill="#3a5a2a">✓</text>
    <rect x="148" y="332" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="172" y="350" text-anchor="middle" font-size="10" fill="#3a5a2a">✓</text>
    <rect x="196" y="332" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="220" y="350" text-anchor="middle" font-size="10" fill="#3a5a2a">✓</text>
    <rect x="244" y="332" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="268" y="350" text-anchor="middle" font-size="10" fill="#3a5a2a">✓</text>
    <rect x="292" y="332" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="316" y="350" text-anchor="middle" font-size="10" fill="#3a5a2a">✓</text>
    <rect x="340" y="332" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="364" y="350" text-anchor="middle" font-size="10" fill="#3a5a2a">✓</text>
    <rect x="388" y="332" width="48" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="412" y="350" text-anchor="middle" font-size="10" fill="#3a5a2a">✓</text>
  </g>
  <path d="M 104 364 L 104 370 L 412 370 L 412 364" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="258" y="384" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">连续7朵 → ⌊7/3⌋ = 2 束</text>
  <rect x="448" y="338" width="96" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="496" y="357" text-anchor="middle" font-size="10.5" fill="#3a5a2a" font-weight="bold">共 2 束 ≥ 2 ✓</text>

  <!-- footer -->
  <rect x="60" y="400" width="440" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="420" text-anchor="middle" font-size="11" fill="#666">连续开花的段长 L → 该段可扎 ⌊L / k⌋ 束</text>
  <text x="280" y="438" text-anchor="middle" font-size="10.5" fill="#888">遇未开花(✗)断段清零；无需真正分组，「数连续 + 整除」即可</text>
</svg>
