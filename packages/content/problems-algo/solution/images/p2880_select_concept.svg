<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">布尔掩码筛行 + .loc 列投影：一次方括号搞定</text>

  <!-- Left: students table -->
  <rect x="28" y="56" width="212" height="152" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="134" y="76" text-anchor="middle" font-size="12.5" fill="#446688" filter="url(#rough2)">students</text>

  <rect x="36" y="84" width="22" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="60" y="84" width="66" height="22" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="128" y="84" width="60" height="22" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="190" y="84" width="42" height="22" fill="#446688" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="93" y="99" text-anchor="middle" font-size="9" fill="#ffffff" filter="url(#rough2)">student_id</text>
  <text x="158" y="99" text-anchor="middle" font-size="9" fill="#ffffff" filter="url(#rough2)">name</text>
  <text x="211" y="99" text-anchor="middle" font-size="9" fill="#ffffff" filter="url(#rough2)">age</text>

  <rect x="36" y="108" width="22" height="22" fill="#e6f4ea" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="60" y="108" width="66" height="22" fill="#e6f4ea" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="128" y="108" width="60" height="22" fill="#e6f4ea" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="190" y="108" width="42" height="22" fill="#e6f4ea" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="47" y="123" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">0</text>
  <text x="93" y="123" text-anchor="middle" font-size="10" fill="#333" font-weight="bold" filter="url(#rough2)">101</text>
  <text x="158" y="123" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Ulysses</text>
  <text x="211" y="123" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">13</text>

  <rect x="36" y="130" width="22" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="60" y="130" width="66" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="128" y="130" width="60" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="190" y="130" width="42" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="47" y="145" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">1</text>
  <text x="93" y="145" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">53</text>
  <text x="158" y="145" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">William</text>
  <text x="211" y="145" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">10</text>

  <rect x="36" y="152" width="22" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="60" y="152" width="66" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="128" y="152" width="60" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="190" y="152" width="42" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="47" y="167" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">2</text>
  <text x="93" y="167" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">128</text>
  <text x="158" y="167" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Henry</text>
  <text x="211" y="167" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">6</text>

  <rect x="36" y="174" width="22" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="60" y="174" width="66" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="128" y="174" width="60" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="190" y="174" width="42" height="22" fill="#ffffff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="47" y="189" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">3</text>
  <text x="93" y="189" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>
  <text x="158" y="189" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Henry</text>
  <text x="211" y="189" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">11</text>

  <text x="134" y="226" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">筛行后行索引沿用原表（0 仍是 0）</text>

  <!-- Arrow to mask -->
  <path d="M 242 132 L 254 132" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Middle: mask panel -->
  <rect x="256" y="56" width="92" height="152" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="302" y="76" text-anchor="middle" font-size="9.5" fill="#d6a040" filter="url(#rough2)">student_id==101</text>
  <text x="302" y="90" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">（布尔掩码）</text>

  <rect x="266" y="108" width="72" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="302" y="123" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">True</text>

  <rect x="266" y="130" width="72" height="22" fill="#ffffff" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="302" y="145" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">False</text>

  <rect x="266" y="152" width="72" height="22" fill="#ffffff" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="302" y="167" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">False</text>

  <rect x="266" y="174" width="72" height="22" fill="#ffffff" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="302" y="189" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">False</text>

  <text x="302" y="226" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">True 留 · False 弃</text>

  <!-- Arrow to .loc -->
  <path d="M 350 132 L 362 132" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- .loc hero box -->
  <rect x="366" y="64" width="168" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="450" y="88" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">students.loc[mask,</text>
  <text x="450" y="106" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">['name', 'age']]</text>
  <text x="450" y="130" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">第 1 维筛行 · 第 2 维投影</text>

  <!-- Arrow down to output -->
  <path d="M 450 142 L 450 156" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Right: output table -->
  <rect x="366" y="160" width="168" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <rect x="378" y="184" width="86" height="22" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="466" y="184" width="52" height="22" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="421" y="199" text-anchor="middle" font-size="10" fill="#ffffff" filter="url(#rough2)">name</text>
  <text x="492" y="199" text-anchor="middle" font-size="10" fill="#ffffff" filter="url(#rough2)">age</text>

  <rect x="378" y="208" width="86" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <rect x="466" y="208" width="52" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="421" y="223" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">Ulysses</text>
  <text x="492" y="223" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">13</text>

  <text x="450" y="242" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">输出列顺序 = 列表顺序</text>

  <!-- Bottom warning -->
  <rect x="28" y="288" width="506" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="281" y="312" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">⚠️ 两个高频坑</text>
  <text x="281" y="336" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">列顺序 = 列表顺序：写成 [['age','name']] 输出就反了</text>
  <text x="281" y="358" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">链式 students[mask][cols]：读没问题，写场景触发 SettingWithCopyWarning</text>
</svg>
