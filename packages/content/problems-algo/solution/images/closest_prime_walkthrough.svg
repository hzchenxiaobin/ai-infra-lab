<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrW" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">示例演算</text>

  <!-- ===== Example A: left=10, right=19 ===== -->
  <text x="30" y="52" font-size="13" fill="#4a7a3a" font-weight="bold">A. left=10, right=19</text>

  <!-- header row -->
  <rect x="30" y="60" width="430" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="60" y="77" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">相邻对</text>
  <text x="180" y="77" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">差值</text>
  <text x="300" y="77" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">minGap</text>
  <text x="410" y="77" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">ans</text>

  <!-- row 1: (11,13) -->
  <rect x="30" y="84" width="430" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <text x="60" y="101" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">(11,13)</text>
  <text x="180" y="101" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">2</text>
  <text x="300" y="101" text-anchor="middle" font-size="10" fill="#333">2</text>
  <text x="410" y="101" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">[11,13]</text>

  <!-- row 2: (13,17) -->
  <rect x="30" y="108" width="430" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="125" text-anchor="middle" font-size="10" fill="#333">(13,17)</text>
  <text x="180" y="125" text-anchor="middle" font-size="10" fill="#4a7a3a">4</text>
  <text x="300" y="125" text-anchor="middle" font-size="10" fill="#999">2</text>
  <text x="410" y="125" text-anchor="middle" font-size="10" fill="#999">[11,13]</text>

  <!-- row 3: (17,19) -->
  <rect x="30" y="132" width="430" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="149" text-anchor="middle" font-size="10" fill="#333">(17,19)</text>
  <text x="180" y="149" text-anchor="middle" font-size="10" fill="#4a7a3a">2</text>
  <text x="300" y="149" text-anchor="middle" font-size="10" fill="#999">2</text>
  <text x="410" y="149" text-anchor="middle" font-size="10" fill="#999">[11,13]</text>

  <text x="30" y="174" font-size="10" fill="#b85450" font-weight="bold">→ gap=2 已是最小可能值，命中即停；并列取 num1 更小的 [11,13]</text>

  <!-- ===== Example B: left=4, right=6 ===== -->
  <text x="30" y="204" font-size="13" fill="#4a7a3a" font-weight="bold">B. left=4, right=6</text>

  <rect x="30" y="212" width="430" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="50" y="232" font-size="10" fill="#333">区间内质数：仅 5 （4、6 为合数）</text>
  <text x="50" y="250" font-size="10" fill="#b85450" font-weight="bold">|primes|=1 &lt; 2 → 返回 [-1, -1]</text>

  <!-- sieve mini illustration -->
  <text x="30" y="288" font-size="12" fill="#446688" font-weight="bold">筛法标记（n=10..19）：</text>

  <!-- number strip 10..19 -->
  <g font-size="10">
    <rect x="30" y="300" width="42" height="26" fill="#eee" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="51" y="317" text-anchor="middle" fill="#999">10</text>
    <path d="M 33 305 L 69 321" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>

    <rect x="74" y="300" width="42" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="95" y="317" text-anchor="middle" fill="#4a7a3a" font-weight="bold">11</text>

    <rect x="118" y="300" width="42" height="26" fill="#eee" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="139" y="317" text-anchor="middle" fill="#999">12</text>
    <path d="M 121 305 L 157 321" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>

    <rect x="162" y="300" width="42" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="183" y="317" text-anchor="middle" fill="#4a7a3a" font-weight="bold">13</text>

    <rect x="206" y="300" width="42" height="26" fill="#eee" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="227" y="317" text-anchor="middle" fill="#999">14</text>
    <path d="M 209 305 L 245 321" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>

    <rect x="250" y="300" width="42" height="26" fill="#eee" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="271" y="317" text-anchor="middle" fill="#999">15</text>
    <path d="M 253 305 L 289 321" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>

    <rect x="294" y="300" width="42" height="26" fill="#eee" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="315" y="317" text-anchor="middle" fill="#999">16</text>
    <path d="M 297 305 L 333 321" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>

    <rect x="338" y="300" width="42" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="359" y="317" text-anchor="middle" fill="#4a7a3a" font-weight="bold">17</text>

    <rect x="382" y="300" width="42" height="26" fill="#eee" stroke="#aaa" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="403" y="317" text-anchor="middle" fill="#999">18</text>
    <path d="M 385 305 L 421 321" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>

    <rect x="426" y="300" width="42" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
    <text x="447" y="317" text-anchor="middle" fill="#4a7a3a" font-weight="bold">19</text>
  </g>

  <text x="280" y="348" text-anchor="middle" font-size="10" fill="#4a7a3a">绿框 = 质数，灰叉 = 被筛掉的合数</text>
</svg>
