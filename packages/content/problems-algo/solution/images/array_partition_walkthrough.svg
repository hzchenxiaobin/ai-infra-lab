<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [6, 2, 6, 5, 1, 2]</text>

  <!-- legend -->
  <rect x="360" y="36" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="378" y="47" font-size="10" fill="#555">取</text>
  <rect x="408" y="36" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="2" filter="url(#rough2)"/>
  <text x="426" y="47" font-size="10" fill="#555">弃</text>

  <!-- ===== Row 1: input [6,2,6,5,1,2] ===== -->
  <text x="40" y="92" font-size="11.5" fill="#446688" font-weight="bold">输入</text>
  <text x="40" y="108" font-size="10" fill="#888">未排序</text>

  <!-- 6 cells, width 44 gap 4, start x=138 -->
  <rect x="138" y="76" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="160" y="98" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">6</text>
  <rect x="186" y="76" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="208" y="98" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <rect x="234" y="76" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="256" y="98" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">6</text>
  <rect x="282" y="76" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="304" y="98" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">5</text>
  <rect x="330" y="76" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="352" y="98" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <rect x="378" y="76" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="400" y="98" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>

  <!-- arrow down: sort -->
  <path d="M 280 118 L 280 142" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="134" font-size="10.5" fill="#888">排序</text>

  <!-- ===== Row 2: sorted [1,2,2,5,6,6] with kept/discarded coloring ===== -->
  <text x="40" y="172" font-size="11.5" fill="#4a7a3a" font-weight="bold">排序后</text>
  <text x="40" y="188" font-size="10" fill="#888">升序</text>

  <!-- index 0 val 1 kept -->
  <rect x="138" y="156" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="178" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <!-- index 1 val 2 discarded -->
  <rect x="186" y="156" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="208" y="178" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <!-- index 2 val 2 kept -->
  <rect x="234" y="156" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="256" y="178" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <!-- index 3 val 5 discarded -->
  <rect x="282" y="156" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="304" y="178" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">5</text>
  <!-- index 4 val 6 kept -->
  <rect x="330" y="156" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="352" y="178" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">6</text>
  <!-- index 5 val 6 discarded -->
  <rect x="378" y="156" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="400" y="178" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">6</text>

  <!-- index ticks -->
  <text x="160" y="204" text-anchor="middle" font-size="9" fill="#999">0</text>
  <text x="208" y="204" text-anchor="middle" font-size="9" fill="#999">1</text>
  <text x="256" y="204" text-anchor="middle" font-size="9" fill="#999">2</text>
  <text x="304" y="204" text-anchor="middle" font-size="9" fill="#999">3</text>
  <text x="352" y="204" text-anchor="middle" font-size="9" fill="#999">4</text>
  <text x="400" y="204" text-anchor="middle" font-size="9" fill="#999">5</text>

  <!-- pair brackets -->
  <path d="M 140 212 L 140 218 L 228 218 L 228 212" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="184" y="234" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">(1, 2) → 1</text>

  <path d="M 236 212 L 236 218 L 324 218 L 324 212" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="280" y="234" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">(2, 5) → 2</text>

  <path d="M 332 212 L 332 218 L 420 218 L 420 212" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="376" y="234" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">(6, 6) → 6</text>

  <!-- arrow down: sum -->
  <path d="M 280 252 L 280 278" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="270" font-size="10.5" fill="#888">累加</text>

  <!-- ===== Row 3: sum ===== -->
  <rect x="138" y="288" width="284" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="310" text-anchor="middle" font-size="13" fill="#3a5a2a" font-weight="bold">sum = 1 + 2 + 6 = 9</text>

  <!-- bottom note -->
  <rect x="30" y="338" width="500" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">对比次优配对 (1,6)(2,6)(2,5) → 1+2+2 = 5</text>
  <text x="280" y="376" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">相邻配对让「弃」的总和最小 → 「取」的总和最大</text>
</svg>
