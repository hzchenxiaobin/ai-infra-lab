<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：33 → [10,11,12] 与 4 → [ ]</text>
  <text x="280" y="44" text-anchor="middle" font-size="10.5" fill="#888">整除则取中位数 num/3 后左右各 ±1；不整除则无解</text>

  <!-- ===== Left: num = 33 ===== -->
  <text x="40" y="76" font-size="12" fill="#4a7a3a" font-weight="bold">示例 1：num = 33</text>

  <!-- step 1: 33 % 3 == 0 -->
  <rect x="40" y="86" width="220" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="150" y="111" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">33 % 3 == 0  ✓ 整除</text>

  <path d="M 150 128 L 150 150" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2: x = 11 -->
  <rect x="40" y="154" width="220" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="150" y="179" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">x = 33 / 3 = 11</text>

  <path d="M 150 196 L 150 218" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 3: three numbers 10, 11, 12 -->
  <text x="40" y="234" font-size="11" fill="#888" font-weight="bold">中位数左右各 ±1：</text>
  <rect x="40" y="240" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="72" y="265" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">10</text>
  <text x="72" y="292" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">x−1</text>
  <rect x="118" y="240" width="64" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="150" y="265" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">11</text>
  <text x="150" y="292" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">x</text>
  <rect x="196" y="240" width="64" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="228" y="265" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">12</text>
  <text x="228" y="292" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">x+1</text>

  <!-- verify -->
  <rect x="40" y="306" width="220" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="150" y="324" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">验证：10 + 11 + 12 = 33 ✓</text>
  <text x="150" y="341" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">返回 [10, 11, 12]</text>

  <!-- vertical divider -->
  <line x1="300" y1="60" x2="300" y2="360" stroke="#ddd" stroke-width="1.2" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- ===== Right: num = 4 ===== -->
  <text x="430" y="76" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">示例 2：num = 4</text>

  <!-- step 1: 4 % 3 != 0 -->
  <rect x="320" y="86" width="220" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="430" y="111" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">4 % 3 == 1  ✗ 不整除</text>

  <path d="M 430 128 L 430 150" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- step 2: no integer x -->
  <rect x="320" y="154" width="220" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="430" y="173" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">x = 4 / 3 = 1.33…</text>
  <text x="430" y="188" text-anchor="middle" font-size="10.5" fill="#888">非整数，无连续整数解</text>

  <path d="M 430 196 L 430 218" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- illustration: no three integers sum to 4 -->
  <text x="430" y="234" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">枚举验证（均失败）：</text>
  <rect x="320" y="240" width="220" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="430" y="258" text-anchor="middle" font-size="10.5" fill="#555">0+1+2 = 3  ✗</text>
  <text x="430" y="274" text-anchor="middle" font-size="10.5" fill="#555">1+2+3 = 6  ✗</text>
  <text x="430" y="290" text-anchor="middle" font-size="10.5" fill="#555">4 落在 3 与 6 之间，无解</text>

  <!-- result -->
  <rect x="320" y="316" width="220" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="430" y="341" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 [ ]</text>
</svg>
