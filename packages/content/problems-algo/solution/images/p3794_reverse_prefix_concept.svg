<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">反转前缀 = 对撞双指针两两交换</text>
  <text x="100" y="46" font-size="12" fill="#888" filter="url(#rough2)">s = "abcdef"，k = 4</text>

  <!-- 第 1 轮：l=0, r=3 -->
  <path d="M 125 66 Q 209 22 293 66" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="300" y="52" font-size="11" fill="#b85450" filter="url(#rough2)">① swap(a, d)</text>

  <rect x="100" y="70" width="50" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="156" y="70" width="50" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="212" y="70" width="50" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="268" y="70" width="50" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="324" y="70" width="50" height="38" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="380" y="70" width="50" height="38" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="125" y="95" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <text x="181" y="95" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <text x="237" y="95" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>
  <text x="293" y="95" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">d</text>
  <text x="349" y="95" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">e</text>
  <text x="405" y="95" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">f</text>

  <line x1="125" y1="124" x2="125" y2="111" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="125" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">l</text>
  <line x1="293" y1="124" x2="293" y2="111" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="293" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">r</text>

  <line x1="455" y1="114" x2="455" y2="154" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="455" y="138" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">交换后</text>

  <!-- 第 2 轮：l=1, r=2 -->
  <path d="M 181 156 Q 209 132 237 156" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="245" y="150" font-size="11" fill="#b85450" filter="url(#rough2)">② swap(b, c)</text>

  <rect x="100" y="160" width="50" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="156" y="160" width="50" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="212" y="160" width="50" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="268" y="160" width="50" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="324" y="160" width="50" height="38" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="380" y="160" width="50" height="38" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="125" y="185" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">d</text>
  <text x="181" y="185" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <text x="237" y="185" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>
  <text x="293" y="185" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <text x="349" y="185" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">e</text>
  <text x="405" y="185" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">f</text>

  <line x1="181" y1="214" x2="181" y2="201" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="181" y="218" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">l</text>
  <line x1="237" y1="214" x2="237" y2="201" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="237" y="218" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">r</text>

  <line x1="455" y1="222" x2="455" y2="246" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 终态：指针交错 -->
  <rect x="100" y="250" width="50" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="156" y="250" width="50" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="212" y="250" width="50" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="268" y="250" width="50" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <rect x="324" y="250" width="50" height="38" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="380" y="250" width="50" height="38" fill="#ffffff" stroke="#999" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="125" y="275" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">d</text>
  <text x="181" y="275" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">c</text>
  <text x="237" y="275" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <text x="293" y="275" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <text x="349" y="275" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">e</text>
  <text x="405" y="275" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">f</text>

  <line x1="237" y1="304" x2="237" y2="291" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="237" y="308" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">l</text>
  <line x1="181" y1="304" x2="181" y2="291" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="181" y="308" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">r</text>
  <text x="330" y="306" font-size="12" fill="#b85450" filter="url(#rough2)">l = 2 ≥ r = 1，终止</text>

  <text x="209" y="338" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">前 k 个已全部就位 ✓</text>
  <text x="385" y="338" text-anchor="middle" font-size="12" fill="#777" filter="url(#rough2)">下标 ≥ k 未动</text>
</svg>
