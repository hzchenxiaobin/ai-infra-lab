<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="430" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">二分答案算法流程（在时速 v 上二分）</text>

  <!-- Feasibility check: hour <= n-1? -->
  <polygon points="270,38 370,66 270,94 170,66" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="62" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">hour ≤ n−1 ?</text>
  <text x="270" y="78" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">(无限速也来不及)</text>

  <!-- Yes -> return -1 -->
  <path d="M 370 66 L 452 66" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="58" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <ellipse cx="486" cy="66" rx="46" ry="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="486" y="70" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">返回 −1</text>

  <!-- No -> init -->
  <path d="M 270 94 L 270 108" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="104" font-size="11" fill="#82b366" filter="url(#rough2)">否</text>

  <rect x="150" y="110" width="240" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="128" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">lo=1, hi=10⁷, ans=−1</text>

  <!-- arrow down -->
  <path d="M 270 138 L 270 154" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: lo <= hi? -->
  <polygon points="270,158 370,184 270,210 170,184" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="180" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">lo ≤ hi ?</text>
  <text x="270" y="196" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">(二分未结束)</text>

  <!-- No -> return ans -->
  <path d="M 370 184 L 452 184" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="176" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <ellipse cx="486" cy="184" rx="46" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="486" y="188" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 ans</text>

  <!-- Yes -> mid -->
  <path d="M 270 210 L 270 226" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="222" font-size="11" fill="#82b366" filter="url(#rough2)">是</text>

  <rect x="150" y="228" width="240" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="246" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">mid = (lo + hi) / 2</text>

  <!-- arrow down -->
  <path d="M 270 256 L 270 272" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Check function -->
  <rect x="100" y="274" width="340" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="292" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">T = Σ⌈dist[i]/mid⌉(i&lt;n−1) + dist[n−1]/mid</text>
  <text x="270" y="308" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">前 n−1 趟向上取整，末趟精确除法</text>

  <!-- arrow down -->
  <path d="M 270 316 L 270 332" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: T <= hour? -->
  <polygon points="270,336 370,362 270,388 170,362" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="358" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">T ≤ hour ?</text>
  <text x="270" y="374" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">(准时到达?)</text>

  <!-- Yes (feasible) -> try smaller -->
  <path d="M 170 362 L 100 362" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="132" y="354" text-anchor="middle" font-size="11" fill="#82b366" filter="url(#rough2)">是</text>
  <rect x="14" y="342" width="84" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="56" y="360" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">ans = mid</text>
  <text x="56" y="376" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">hi = mid−1</text>

  <!-- No (too slow) -> try bigger -->
  <path d="M 370 362 L 440 362" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="354" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="442" y="342" width="84" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="484" y="368" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">lo = mid+1</text>

  <!-- loop back arrows -->
  <path d="M 56 342 L 56 184 L 170 184" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 484 342 L 484 184 L 370 184" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- summary -->
  <text x="270" y="420" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">关键：T(v) 单调递减 → 二段性；每次 O(n) 验证，共 O(log 10⁷) ≈ 24 次</text>
</svg>
