<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="500" fill="#fafafa"/>
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：聚合 → 过滤 → 配对</text>

  <!-- ===== Table A: GROUP BY result ===== -->
  <text x="270" y="44" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">① GROUP BY product_id, YEAR(date)  →  COUNT(*)</text>
  <rect x="110" y="50" width="320" height="92" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="110" y="50" width="320" height="20" fill="#e8f0fe" filter="url(#rough2)"/>
  <text x="170" y="64" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">product_id</text>
  <text x="275" y="64" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">year</text>
  <text x="390" y="64" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">cnt</text>
  <line x1="220" y1="50" x2="220" y2="142" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="350" y1="50" x2="350" y2="142" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="110" y1="70" x2="430" y2="70" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="170" y="88" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="275" y="88" text-anchor="middle" font-size="10" fill="#333">2020</text>
  <text x="390" y="88" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="170" y="108" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="275" y="108" text-anchor="middle" font-size="10" fill="#333">2021</text>
  <text x="390" y="108" text-anchor="middle" font-size="10" fill="#333">3</text>
  <text x="170" y="128" text-anchor="middle" font-size="10" fill="#999">2</text>
  <text x="275" y="128" text-anchor="middle" font-size="10" fill="#999">2022</text>
  <text x="390" y="128" text-anchor="middle" font-size="10" fill="#999">1</text>

  <!-- Arrow to B -->
  <path d="M 270 144 L 270 162" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="460" y="156" font-size="9" fill="#b85450">② HAVING cnt ≥ 3</text>

  <!-- ===== Table B: filtered ===== -->
  <text x="270" y="178" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">② 只留 cnt ≥ 3 的年组</text>
  <rect x="110" y="184" width="320" height="68" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="110" y="184" width="320" height="20" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="170" y="198" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">product_id</text>
  <text x="275" y="198" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">year</text>
  <text x="390" y="198" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">cnt</text>
  <line x1="220" y1="184" x2="220" y2="252" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="350" y1="184" x2="350" y2="252" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="110" y1="204" x2="430" y2="204" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="170" y="222" text-anchor="middle" font-size="10" fill="#4a7a3a">1 ✓</text>
  <text x="275" y="222" text-anchor="middle" font-size="10" fill="#4a7a3a">2020</text>
  <text x="390" y="222" text-anchor="middle" font-size="10" fill="#4a7a3a">3</text>
  <text x="170" y="242" text-anchor="middle" font-size="10" fill="#4a7a3a">1 ✓</text>
  <text x="275" y="242" text-anchor="middle" font-size="10" fill="#4a7a3a">2021</text>
  <text x="390" y="242" text-anchor="middle" font-size="10" fill="#4a7a3a">3</text>
  <text x="470" y="218" font-size="8" fill="#b85450">(2 / 2022 / 1)</text>
  <text x="470" y="230" font-size="8" fill="#b85450">已被 HAVING</text>
  <text x="470" y="242" font-size="8" fill="#b85450">过滤丢弃</text>

  <!-- Arrow to C -->
  <path d="M 270 254 L 270 272" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="452" y="266" font-size="9" fill="#d6a040">③ 自连接 a.yr=b.yr−1</text>

  <!-- ===== Table C: pairs ===== -->
  <text x="270" y="288" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">③ 同产品相邻年配对（差恰好 = 1）</text>
  <rect x="90" y="294" width="360" height="44" fill="#fff" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="90" y="294" width="360" height="20" fill="#fff8e1" filter="url(#rough2)"/>
  <text x="150" y="308" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">a.product_id</text>
  <text x="240" y="308" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">a.yr</text>
  <text x="330" y="308" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">b.yr</text>
  <text x="420" y="308" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">命中?</text>
  <line x1="200" y1="294" x2="200" y2="338" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="290" y1="294" x2="290" y2="338" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="380" y1="294" x2="380" y2="338" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="90" y1="314" x2="450" y2="314" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="150" y="332" text-anchor="middle" font-size="10" fill="#4a7a3a">1</text>
  <text x="240" y="332" text-anchor="middle" font-size="10" fill="#4a7a3a">2020</text>
  <text x="330" y="332" text-anchor="middle" font-size="10" fill="#4a7a3a">2021</text>
  <text x="420" y="332" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓ 差=1</text>

  <!-- Arrow to output -->
  <path d="M 270 340 L 270 358" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== output ===== -->
  <rect x="170" y="362" width="200" height="48" fill="#fff" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="380" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">输出 product_id</text>
  <text x="270" y="400" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <!-- ===== bottom notes ===== -->
  <rect x="40" y="424" width="460" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="270" y="442" text-anchor="middle" font-size="9" fill="#555">产品 1：2020 与 2021 各有 3 笔订单且相邻 → 命中</text>
  <text x="270" y="458" text-anchor="middle" font-size="9" fill="#b85450">产品 2：仅 2022 一年有订单（且仅 1 笔）→ 不满足</text>
  <text x="270" y="472" text-anchor="middle" font-size="8" fill="#888">quantity 列是干扰项，按「订单行数」COUNT 计数</text>
</svg>
