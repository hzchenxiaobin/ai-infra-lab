<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">纵向扫描算法流程（以 strs[0] 为基准）</text>

  <!-- Start node -->
  <ellipse cx="270" cy="62" rx="90" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="12" fill="#333">开始: prefix = ""，i = 0</text>

  <!-- arrow down -->
  <path d="M 270 82 L 270 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: i < strs[0].size() ? -->
  <polygon points="270,104 380,150 270,196 160,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="146" text-anchor="middle" font-size="12" fill="#333">i &lt; strs[0].size() ?</text>
  <text x="270" y="162" text-anchor="middle" font-size="11" fill="#666">(还有列可扫)</text>

  <!-- No branch -> end -->
  <path d="M 380 150 L 460 150" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="142" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="492" cy="150" rx="42" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="492" y="154" text-anchor="middle" font-size="11" fill="#333">返回 prefix</text>

  <!-- Yes branch down -->
  <path d="M 270 196 L 270 214" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="210" font-size="11" fill="#82b366">是</text>

  <!-- c = strs[0][i] -->
  <rect x="200" y="218" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="240" text-anchor="middle" font-size="11" fill="#333">c = strs[0][i]</text>

  <path d="M 270 252 L 270 270" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: for each s: i==s.size() or s[i]!=c ? -->
  <polygon points="270,274 410,330 270,386 130,330" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="322" text-anchor="middle" font-size="12" fill="#333">存在 s: 越界或 s[i]≠c ?</text>
  <text x="270" y="340" text-anchor="middle" font-size="11" fill="#666">(遍历每个字符串)</text>

  <!-- Yes (mismatch) -> return prefix -->
  <path d="M 130 330 L 70 330" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="322" text-anchor="middle" font-size="11" fill="#b85450">是</text>
  <rect x="14" y="310" width="56" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="42" y="328" text-anchor="middle" font-size="10" fill="#333">返回</text>
  <text x="42" y="342" text-anchor="middle" font-size="10" fill="#333">prefix</text>

  <!-- No (all match) -> append and loop -->
  <path d="M 270 386 L 270 404" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="400" font-size="11" fill="#82b366">否</text>

  <!-- loop back arrow to decision top -->
  <path d="M 410 330 L 470 330 L 470 62 L 360 62" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="470" y="196" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 470 196)">prefix += c；i++</text>

  <!-- summary note -->
  <text x="270" y="414" text-anchor="middle" font-size="11" fill="#888">关键：任一字符串越界或不匹配即终止，保证只扫到公共前缀为止</text>
</svg>
