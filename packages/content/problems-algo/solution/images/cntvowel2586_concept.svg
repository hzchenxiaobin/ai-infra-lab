<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：只看首尾两字符，O(1) 判定元音串</text>

  <!-- Vowel set -->
  <rect x="170" y="44" width="220" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="70" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">元音集合 { a, e, i, o, u }</text>

  <!-- Row 1: aeo (i=1) -> vowel string -->
  <text x="40" y="138" font-size="12" fill="#446688" font-weight="bold">i=1  "aeo"</text>
  <rect x="150" y="110" width="40" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="138" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">a</text>
  <text x="170" y="100" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">首</text>
  <rect x="190" y="110" width="40" height="44" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="210" y="138" text-anchor="middle" font-size="15" fill="#999">e</text>
  <rect x="230" y="110" width="40" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="250" y="138" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">o</text>
  <text x="250" y="100" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">末</text>
  <path d="M 272 132 L 376 132" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="378" y="114" width="150" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="453" y="137" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 元音串</text>

  <!-- Row 2: mu (i=2) -> first not vowel -->
  <text x="40" y="200" font-size="12" fill="#446688" font-weight="bold">i=2  "mu"</text>
  <rect x="150" y="172" width="40" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="200" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">m</text>
  <text x="170" y="162" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">首</text>
  <rect x="190" y="172" width="40" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="210" y="200" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">u</text>
  <text x="210" y="162" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">末</text>
  <path d="M 232 194 L 376 194" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="378" y="176" width="150" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="453" y="199" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">✗ 首字符非元音</text>

  <!-- Row 3: artro (i=4) -> vowel string -->
  <text x="40" y="262" font-size="12" fill="#446688" font-weight="bold">i=4  "artro"</text>
  <rect x="150" y="234" width="40" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="262" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">a</text>
  <text x="170" y="224" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">首</text>
  <rect x="190" y="234" width="40" height="44" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="210" y="262" text-anchor="middle" font-size="15" fill="#999">r</text>
  <rect x="230" y="234" width="40" height="44" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="250" y="262" text-anchor="middle" font-size="15" fill="#999">t</text>
  <rect x="270" y="234" width="40" height="44" fill="#f0f0f0" stroke="#bbb" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="290" y="262" text-anchor="middle" font-size="15" fill="#999">r</text>
  <rect x="310" y="234" width="40" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="330" y="262" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">o</text>
  <text x="330" y="224" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">末</text>
  <path d="M 352 256 L 376 256" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="378" y="238" width="150" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="453" y="261" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 元音串</text>

  <!-- takeaway -->
  <rect x="36" y="300" width="488" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">单串判定 = 取首字符 + 取末字符 + 两次集合查找，O(1)</text>
  <text x="280" y="340" text-anchor="middle" font-size="11" fill="#888">与串长无关："u"（长度 1）与 "artro"（长度 5）判定成本相同</text>
  <text x="280" y="356" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">中间字符（含本身是元音的 'e'）一概不看，仅首尾决定结论</text>
</svg>
