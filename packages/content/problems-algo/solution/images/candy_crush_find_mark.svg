<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">标记阶段：行/列连续 ≥3 同值 → 取负值</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">用 abs() 比较，负值既当标记又保留原值信息</text>

  <!-- ============ LEFT GRID: before mark ============ -->
  <text x="132" y="74" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">标记前</text>
  <!-- cell 44x42, start x=44 y=84. cols x=44,88,132,176 ; cx=66,110,154,198 ; rows y=84,126,168 ; cy=108,150,192 -->
  <!-- Row 0: 1 1 1 5  -> cols0-2 horizontal triple (blue) -->
  <rect x="44" y="84" width="44" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="66" y="111" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">1</text>
  <rect x="88" y="84" width="44" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="111" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">1</text>
  <rect x="132" y="84" width="44" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="154" y="111" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">1</text>
  <!-- (0,3)=5 part of vertical triple (green) -->
  <rect x="176" y="84" width="44" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="198" y="111" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">5</text>

  <!-- Row 1: 2 3 4 5 -->
  <rect x="44" y="126" width="44" height="42" fill="#f5f5f5" stroke="#ccc" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="66" y="153" text-anchor="middle" font-size="14" fill="#555">2</text>
  <rect x="88" y="126" width="44" height="42" fill="#f5f5f5" stroke="#ccc" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="110" y="153" text-anchor="middle" font-size="14" fill="#555">3</text>
  <rect x="132" y="126" width="44" height="42" fill="#f5f5f5" stroke="#ccc" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="154" y="153" text-anchor="middle" font-size="14" fill="#555">4</text>
  <rect x="176" y="126" width="44" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="198" y="153" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">5</text>

  <!-- Row 2: 2 3 4 5 -->
  <rect x="44" y="168" width="44" height="42" fill="#f5f5f5" stroke="#ccc" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="66" y="195" text-anchor="middle" font-size="14" fill="#555">2</text>
  <rect x="88" y="168" width="44" height="42" fill="#f5f5f5" stroke="#ccc" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="110" y="195" text-anchor="middle" font-size="14" fill="#555">3</text>
  <rect x="132" y="168" width="44" height="42" fill="#f5f5f5" stroke="#ccc" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="154" y="195" text-anchor="middle" font-size="14" fill="#555">4</text>
  <rect x="176" y="168" width="44" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="198" y="195" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">5</text>

  <!-- brackets + labels for triples -->
  <path d="M 46 78 L 46 72 L 174 72 L 174 78" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="110" y="66" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">行三元组 j,j+1,j+2</text>
  <path d="M 222 86 L 228 86 L 228 208 L 222 208" stroke="#4a7a3a" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="252" y="150" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">列三元组</text>
  <text x="252" y="164" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">i,i+1,i+2</text>

  <!-- ============ ARROW ============ -->
  <path d="M 282 150 L 322 150" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="142" text-anchor="middle" font-size="9.5" fill="#888">三格同取 -v</text>

  <!-- ============ RIGHT GRID: after mark (negated) ============ -->
  <text x="404" y="74" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">标记后（取负）</text>
  <!-- start x=330 y=84 ; cols x=330,374,418,462 ; cx=352,396,440,484 -->
  <!-- Row 0: -1 -1 -1 -5 -->
  <rect x="330" y="84" width="44" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="352" y="111" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">-1</text>
  <rect x="374" y="84" width="44" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="396" y="111" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">-1</text>
  <rect x="418" y="84" width="44" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="440" y="111" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">-1</text>
  <rect x="462" y="84" width="44" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="484" y="111" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">-5</text>

  <!-- Row 1: 2 3 4 -5 -->
  <rect x="330" y="126" width="44" height="42" fill="#f5f5f5" stroke="#ccc" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="352" y="153" text-anchor="middle" font-size="14" fill="#555">2</text>
  <rect x="374" y="126" width="44" height="42" fill="#f5f5f5" stroke="#ccc" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="396" y="153" text-anchor="middle" font-size="14" fill="#555">3</text>
  <rect x="418" y="126" width="44" height="42" fill="#f5f5f5" stroke="#ccc" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="440" y="153" text-anchor="middle" font-size="14" fill="#555">4</text>
  <rect x="462" y="126" width="44" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="484" y="153" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">-5</text>

  <!-- Row 2: 2 3 4 -5 -->
  <rect x="330" y="168" width="44" height="42" fill="#f5f5f5" stroke="#ccc" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="352" y="195" text-anchor="middle" font-size="14" fill="#555">2</text>
  <rect x="374" y="168" width="44" height="42" fill="#f5f5f5" stroke="#ccc" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="396" y="195" text-anchor="middle" font-size="14" fill="#555">3</text>
  <rect x="418" y="168" width="44" height="42" fill="#f5f5f5" stroke="#ccc" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="440" y="195" text-anchor="middle" font-size="14" fill="#555">4</text>
  <rect x="462" y="168" width="44" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="484" y="195" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">-5</text>

  <!-- ============ explanation box ============ -->
  <rect x="40" y="232" width="500" height="132" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="58" y="256" font-size="12" fill="#d6a040" font-weight="bold">取负标记法（O(1) 额外空间）</text>
  <text x="58" y="278" font-size="11" fill="#555">• 合法糖果值 ≥ 1，故用「负值」当待粉碎标记，不与任何真值冲突。</text>
  <text x="58" y="296" font-size="11" fill="#555">• 比较时统一取绝对值：v = abs(b[i][j])；v ≠ 0 且 abs(b[i][j+1])==abs(b[i][j+2])==v 即命中。</text>
  <text x="58" y="314" font-size="11" fill="#555">• 命中后三格同赋 -v；已为负的格再次命中也是 -v（幂等，不会误还原）。</text>
  <text x="58" y="332" font-size="11" fill="#555">• 一轮内先扫所有行、再扫所有列；行扫已标负的不影响列扫（abs 还原原值）。</text>
  <text x="58" y="350" font-size="11" fill="#b85450" font-weight="bold">→ 粉碎阶段只保留 &gt; 0 的格，负值与原 0 一并当空格下落。</text>
</svg>
