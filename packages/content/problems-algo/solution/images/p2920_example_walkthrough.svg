<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算：coins=[10,10,3,3], k=5（链 0-1-2-3）</text>

  <!-- header t -->
  <text x="96" y="62" font-size="11" fill="#888">t =</text>
  <text x="150" y="62" text-anchor="middle" font-size="11" fill="#888">0</text>
  <text x="204" y="62" text-anchor="middle" font-size="11" fill="#888">1</text>
  <text x="258" y="62" text-anchor="middle" font-size="11" fill="#888">2</text>
  <text x="312" y="62" text-anchor="middle" font-size="11" fill="#888">3</text>
  <text x="366" y="62" text-anchor="middle" font-size="11" fill="#888">4</text>

  <!-- row dp[3] -->
  <text x="96" y="88" font-size="11" fill="#446688" font-weight="bold">dp[3]</text>
  <rect x="128" y="70" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="88" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <rect x="182" y="70" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="88" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="236" y="70" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="258" y="88" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="290" y="70" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="312" y="88" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="344" y="70" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="366" y="88" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="420" y="88" font-size="10" fill="#888">t=0: max(3−5, 1)=1</text>

  <!-- row dp[2] -->
  <text x="96" y="128" font-size="11" fill="#446688" font-weight="bold">dp[2]</text>
  <rect x="128" y="110" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="128" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <rect x="182" y="110" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="204" y="128" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="236" y="110" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="258" y="128" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="290" y="110" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="312" y="128" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="344" y="110" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="366" y="128" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="420" y="128" font-size="10" fill="#888">t=0: max(−2+1, 1+0)=1</text>

  <!-- row dp[1] -->
  <text x="96" y="168" font-size="11" fill="#446688" font-weight="bold">dp[1]</text>
  <rect x="128" y="150" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="168" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">6</text>
  <rect x="182" y="150" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="204" y="168" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <rect x="236" y="150" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="258" y="168" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="290" y="150" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="312" y="168" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="344" y="150" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="366" y="168" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="420" y="168" font-size="10" fill="#888">t=0: max(5+1, 5+0)=6</text>

  <!-- dp[0] -->
  <rect x="24" y="196" width="472" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="218" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">根：dp[0][0] = max( (10−5)+dp[1][0] , 5+dp[1][1] )</text>
  <text x="260" y="240" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">= max( 5+6, 5+2 ) = 11 ✓</text>

  <!-- optimal plan -->
  <rect x="24" y="270" width="472" height="112" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="294" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">最优方案回溯（方法①②交替使用）</text>
  <rect x="56" y="310" width="96" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="104" y="326" text-anchor="middle" font-size="10.5" fill="#333">节点0 方法①</text>
  <text x="104" y="342" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">10−5 = 5</text>
  <rect x="164" y="310" width="96" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="212" y="326" text-anchor="middle" font-size="10.5" fill="#333">节点1 方法①</text>
  <text x="212" y="342" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">10−5 = 5</text>
  <rect x="272" y="310" width="96" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="326" text-anchor="middle" font-size="10.5" fill="#333">节点2 方法②</text>
  <text x="320" y="342" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">⌊3/2⌋ = 1</text>
  <rect x="380" y="310" width="96" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="428" y="326" text-anchor="middle" font-size="10.5" fill="#333">节点3 方法②</text>
  <text x="428" y="342" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">⌊1/2⌋ = 0</text>
  <text x="260" y="374" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">总计 5 + 5 + 1 + 0 = 11</text>
</svg>
