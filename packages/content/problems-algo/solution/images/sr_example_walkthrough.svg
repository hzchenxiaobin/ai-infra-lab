<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [[4,10,15,24,26],[0,9,12,20],[5,18,22,30]]</text>

  <!-- table header -->
  <rect x="40" y="48" width="500" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="76" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">步</text>
  <text x="146" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">弹出(val,r,c)</text>
  <text x="246" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">入堆next</text>
  <text x="338" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">currentMax</text>
  <text x="430" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">区间[a,b]</text>
  <text x="510" y="66" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">best</text>

  <!-- initial row -->
  <rect x="40" y="78" width="500" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="76" y="96" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">init</text>
  <text x="146" y="96" text-anchor="middle" font-size="11" fill="#888">首元素入堆</text>
  <text x="246" y="96" text-anchor="middle" font-size="11" fill="#888">{4,0,5}</text>
  <text x="338" y="96" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <text x="430" y="96" text-anchor="middle" font-size="11" fill="#333">[0,5]</text>
  <text x="510" y="96" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">[0,5]</text>

  <!-- step rows: y starts 106, row height 26 -->
  <!-- step 1 -->
  <rect x="40" y="106" width="500" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="76" y="124" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="146" y="124" text-anchor="middle" font-size="11" fill="#333">(0,1,0)</text>
  <text x="246" y="124" text-anchor="middle" font-size="11" fill="#4a7a3a">(9,1,1)</text>
  <text x="338" y="124" text-anchor="middle" font-size="11" fill="#333">9</text>
  <text x="430" y="124" text-anchor="middle" font-size="11" fill="#333">[0,5]</text>
  <text x="510" y="124" text-anchor="middle" font-size="11" fill="#888">[0,5]</text>

  <!-- step 2 -->
  <rect x="40" y="134" width="500" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="76" y="152" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="146" y="152" text-anchor="middle" font-size="11" fill="#333">(4,0,0)</text>
  <text x="246" y="152" text-anchor="middle" font-size="11" fill="#4a7a3a">(10,0,1)</text>
  <text x="338" y="152" text-anchor="middle" font-size="11" fill="#333">10</text>
  <text x="430" y="152" text-anchor="middle" font-size="11" fill="#333">[4,9]</text>
  <text x="510" y="152" text-anchor="middle" font-size="11" fill="#888">[0,5]</text>

  <!-- step 3 -->
  <rect x="40" y="162" width="500" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="76" y="180" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="146" y="180" text-anchor="middle" font-size="11" fill="#333">(5,2,0)</text>
  <text x="246" y="180" text-anchor="middle" font-size="11" fill="#4a7a3a">(18,2,1)</text>
  <text x="338" y="180" text-anchor="middle" font-size="11" fill="#333">18</text>
  <text x="430" y="180" text-anchor="middle" font-size="11" fill="#333">[5,10]</text>
  <text x="510" y="180" text-anchor="middle" font-size="11" fill="#888">[0,5]</text>

  <!-- step 4 -->
  <rect x="40" y="190" width="500" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="76" y="208" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="146" y="208" text-anchor="middle" font-size="11" fill="#333">(9,1,1)</text>
  <text x="246" y="208" text-anchor="middle" font-size="11" fill="#4a7a3a">(12,1,2)</text>
  <text x="338" y="208" text-anchor="middle" font-size="11" fill="#333">18</text>
  <text x="430" y="208" text-anchor="middle" font-size="11" fill="#333">[9,18]</text>
  <text x="510" y="208" text-anchor="middle" font-size="11" fill="#888">[0,5]</text>

  <!-- step 5 -->
  <rect x="40" y="218" width="500" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="76" y="236" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="146" y="236" text-anchor="middle" font-size="11" fill="#333">(10,0,1)</text>
  <text x="246" y="236" text-anchor="middle" font-size="11" fill="#4a7a3a">(15,0,2)</text>
  <text x="338" y="236" text-anchor="middle" font-size="11" fill="#333">18</text>
  <text x="430" y="236" text-anchor="middle" font-size="11" fill="#333">[10,18]</text>
  <text x="510" y="236" text-anchor="middle" font-size="11" fill="#888">[0,5]</text>

  <!-- step 6 -->
  <rect x="40" y="246" width="500" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="76" y="264" text-anchor="middle" font-size="11" fill="#333">6</text>
  <text x="146" y="264" text-anchor="middle" font-size="11" fill="#333">(12,1,2)</text>
  <text x="246" y="264" text-anchor="middle" font-size="11" fill="#4a7a3a">(20,1,3)</text>
  <text x="338" y="264" text-anchor="middle" font-size="11" fill="#333">20</text>
  <text x="430" y="264" text-anchor="middle" font-size="11" fill="#333">[12,18]</text>
  <text x="510" y="264" text-anchor="middle" font-size="11" fill="#888">[0,5]</text>

  <!-- step 7 -->
  <rect x="40" y="274" width="500" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="76" y="292" text-anchor="middle" font-size="11" fill="#333">7</text>
  <text x="146" y="292" text-anchor="middle" font-size="11" fill="#333">(15,0,2)</text>
  <text x="246" y="292" text-anchor="middle" font-size="11" fill="#4a7a3a">(24,0,3)</text>
  <text x="338" y="292" text-anchor="middle" font-size="11" fill="#333">24</text>
  <text x="430" y="292" text-anchor="middle" font-size="11" fill="#333">[15,20]</text>
  <text x="510" y="292" text-anchor="middle" font-size="11" fill="#888">[0,5]</text>

  <!-- step 8 -->
  <rect x="40" y="302" width="500" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="76" y="320" text-anchor="middle" font-size="11" fill="#333">8</text>
  <text x="146" y="320" text-anchor="middle" font-size="11" fill="#333">(18,2,1)</text>
  <text x="246" y="320" text-anchor="middle" font-size="11" fill="#4a7a3a">(22,2,2)</text>
  <text x="338" y="320" text-anchor="middle" font-size="11" fill="#333">24</text>
  <text x="430" y="320" text-anchor="middle" font-size="11" fill="#333">[18,24]</text>
  <text x="510" y="320" text-anchor="middle" font-size="11" fill="#888">[0,5]</text>

  <!-- step 9: highlight - best changes -->
  <rect x="40" y="330" width="500" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="76" y="348" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">9★</text>
  <text x="146" y="348" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">(20,1,3)</text>
  <text x="246" y="348" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">该路耗尽</text>
  <text x="338" y="348" text-anchor="middle" font-size="11" fill="#333">24</text>
  <text x="430" y="348" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">[20,24]</text>
  <text x="510" y="348" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">[20,24]</text>

  <!-- annotation arrow to step 9 -->
  <path d="M 470 380 L 470 360" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="470" y="396" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">len=4 &lt; 5</text>
  <text x="470" y="410" text-anchor="middle" font-size="10" fill="#b85450">且 L1 耗尽 → 停</text>

  <!-- bottom note -->
  <rect x="40" y="404" width="380" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="230" y="421" text-anchor="middle" font-size="11" fill="#446688">第 9 步：区间 [20,24] 长度 4 最优，L1 后继无元素 → 终止</text>
</svg>
