<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">枚举划分点 k 的算法流程</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">k = 不完善花园数，从 n 递减到 0</text>

  <!-- Start -->
  <rect x="220" y="56" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="15" filter="url(#rough2)"/>
  <text x="280" y="76" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">开始</text>
  <path d="M280,86 L280,96" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init -->
  <rect x="120" y="98" width="320" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="117" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">预处理</text>
  <text x="280" y="133" text-anchor="middle" font-size="10.5" fill="#555">封顶 target → 排序 → 前缀和 pref；k = n，completeCost = 0</text>
  <path d="M280,142 L280,152" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: completeCost <= newFlowers ? -->
  <polygon points="280,154 410,196 280,238 150,196" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="192" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">completeCost ≤ newFlowers ?</text>
  <!-- No -> go to step-down (right) -->
  <path d="M410,196 L452,196" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="190" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <text x="460" y="200" font-size="9.5" fill="#888">该 k 不可行</text>

  <!-- Yes -> down to k==0 check -->
  <path d="M280,238 L280,250" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="298" y="248" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Decision: k == 0 ? -->
  <polygon points="280,252 380,284 280,316 180,284" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="288" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">k == 0 ?</text>
  <!-- Yes (left): all complete -->
  <path d="M180,284 L120,284" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="150" y="278" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="40" y="268" width="78" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="79" y="283" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">全完善</text>
  <text x="79" y="296" text-anchor="middle" font-size="9" fill="#4a7a3a">ans=? n·full</text>

  <!-- No (right-down): binary search min -->
  <path d="M280,316 L280,328" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="298" y="326" font-size="10" fill="#4a7a3a" font-weight="bold">否</text>
  <!-- guard: flowers[k-1] < target -->
  <rect x="120" y="330" width="320" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="350" text-anchor="middle" font-size="10" fill="#555">要求 flowers[k−1] &lt; target（前缀确为不完善花园）</text>
  <path d="M280,360 L280,370" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Binary search box -->
  <rect x="80" y="372" width="400" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="392" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">二分最大最小值 m ∈ [flowers[0], target−1]</text>
  <text x="94" y="410" font-size="10" fill="#555">p = lower_bound(前缀, mid)；cost = mid·p − pref[p]</text>
  <text x="94" y="424" font-size="10" fill="#555">cost ≤ remain → 抬高；取 m 更新 ans = max(ans, (n−k)·full + m·partial)</text>

  <!-- step-down: completeCost += target - flowers[k-1]; k decreases; loop -->
  <path d="M452,196 L452,440 L490,440" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <path d="M280,428 L280,442 L490,442" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <rect x="380" y="444" width="220" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="490" y="463" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">completeCost += target−flowers[k−1]；k−−</text>
  <!-- loop back up to decision -->
  <path d="M490,444 L540,444 L540,196 L410,196" stroke="#888" stroke-width="1.4" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="3,3"/>
  <text x="546" y="320" text-anchor="middle" font-size="9.5" fill="#888" font-weight="bold">k ≥ 0</text>
  <text x="546" y="334" text-anchor="middle" font-size="9" fill="#888">继续</text>

  <!-- return -->
  <rect x="40" y="444" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="15" filter="url(#rough2)"/>
  <text x="100" y="463" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回 ans</text>
  <text x="100" y="436" text-anchor="middle" font-size="9" fill="#888">k &lt; 0 时</text>
</svg>
