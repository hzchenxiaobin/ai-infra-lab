<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：nums1=[-2,-1,0,1,2]  nums2=[-3,-1,2,4,5]  k=3</text>
  <text x="320" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">四角乘积 {6, -10, -6, 10} → lo=-10, hi=10</text>

  <!-- ===== Left table: count(-7) ===== -->
  <text x="150" y="68" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">count(−7) = 2 &lt; 3</text>
  <g filter="url(#rough2)" font-size="9.5">
    <!-- header -->
    <rect x="30" y="78" width="240" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3"/>
    <text x="42" y="92" fill="#333" font-weight="bold">x</text>
    <text x="78" y="92" fill="#333" font-weight="bold">符号</text>
    <text x="120" y="92" fill="#333" font-weight="bold">阈值</text>
    <text x="172" y="92" fill="#333" font-weight="bold">满足的 y</text>
    <text x="232" y="92" fill="#333" font-weight="bold">贡献</text>
    <!-- rows -->
    <rect x="30" y="98" width="240" height="18" fill="#fff8e1" stroke="#ddd" stroke-width="1" rx="2"/>
    <text x="42" y="111" fill="#446688" font-weight="bold">−2</text>
    <text x="78" y="111" fill="#446688">负</text>
    <text x="120" y="111" fill="#333">⌈3.5⌉=4</text>
    <text x="172" y="111" fill="#333">{4,5}</text>
    <text x="232" y="111" fill="#b85450" font-weight="bold">2</text>

    <rect x="30" y="116" width="240" height="18" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="2"/>
    <text x="42" y="129" fill="#446688" font-weight="bold">−1</text>
    <text x="78" y="129" fill="#446688">负</text>
    <text x="120" y="129" fill="#333">⌈7⌉=7</text>
    <text x="172" y="129" fill="#888">∅</text>
    <text x="232" y="129" fill="#333">0</text>

    <rect x="30" y="134" width="240" height="18" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="2"/>
    <text x="42" y="147" fill="#b85450" font-weight="bold">0</text>
    <text x="78" y="147" fill="#b85450">零</text>
    <text x="120" y="147" fill="#888">−7&lt;0</text>
    <text x="172" y="147" fill="#888">∅</text>
    <text x="232" y="147" fill="#333">0</text>

    <rect x="30" y="152" width="240" height="18" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="2"/>
    <text x="42" y="165" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="78" y="165" fill="#4a7a3a">正</text>
    <text x="120" y="165" fill="#333">⌊−7⌋=−7</text>
    <text x="172" y="165" fill="#888">∅</text>
    <text x="232" y="165" fill="#333">0</text>

    <rect x="30" y="170" width="240" height="18" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="2"/>
    <text x="42" y="183" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="78" y="183" fill="#4a7a3a">正</text>
    <text x="120" y="183" fill="#333">⌊−3.5⌋=−4</text>
    <text x="172" y="183" fill="#888">∅</text>
    <text x="232" y="183" fill="#333">0</text>
  </g>
  <rect x="30" y="192" width="240" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="150" y="207" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">合计 2 &lt; 3 → lo = mid+1 = −6</text>

  <!-- ===== Right table: count(-6) ===== -->
  <text x="490" y="68" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">count(−6) = 3 ≥ 3 ✓</text>
  <g filter="url(#rough2)" font-size="9.5">
    <rect x="370" y="78" width="240" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3"/>
    <text x="382" y="92" fill="#333" font-weight="bold">x</text>
    <text x="418" y="92" fill="#333" font-weight="bold">符号</text>
    <text x="460" y="92" fill="#333" font-weight="bold">阈值</text>
    <text x="512" y="92" fill="#333" font-weight="bold">满足的 y</text>
    <text x="572" y="92" fill="#333" font-weight="bold">贡献</text>

    <rect x="370" y="98" width="240" height="18" fill="#fff8e1" stroke="#ddd" stroke-width="1" rx="2"/>
    <text x="382" y="111" fill="#446688" font-weight="bold">−2</text>
    <text x="418" y="111" fill="#446688">负</text>
    <text x="460" y="111" fill="#333">⌈3⌉=3</text>
    <text x="512" y="111" fill="#333">{4,5}</text>
    <text x="572" y="111" fill="#b85450" font-weight="bold">2</text>

    <rect x="370" y="116" width="240" height="18" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="2"/>
    <text x="382" y="129" fill="#446688" font-weight="bold">−1</text>
    <text x="418" y="129" fill="#446688">负</text>
    <text x="460" y="129" fill="#333">⌈6⌉=6</text>
    <text x="512" y="129" fill="#888">∅</text>
    <text x="572" y="129" fill="#333">0</text>

    <rect x="370" y="134" width="240" height="18" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="2"/>
    <text x="382" y="147" fill="#b85450" font-weight="bold">0</text>
    <text x="418" y="147" fill="#b85450">零</text>
    <text x="460" y="147" fill="#888">−6&lt;0</text>
    <text x="512" y="147" fill="#888">∅</text>
    <text x="572" y="147" fill="#333">0</text>

    <rect x="370" y="152" width="240" height="18" fill="#fafafa" stroke="#ddd" stroke-width="1" rx="2"/>
    <text x="382" y="165" fill="#4a7a3a" font-weight="bold">1</text>
    <text x="418" y="165" fill="#4a7a3a">正</text>
    <text x="460" y="165" fill="#333">⌊−6⌋=−6</text>
    <text x="512" y="165" fill="#888">∅</text>
    <text x="572" y="165" fill="#333">0</text>

    <rect x="370" y="170" width="240" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="2"/>
    <text x="382" y="183" fill="#4a7a3a" font-weight="bold">2</text>
    <text x="418" y="183" fill="#4a7a3a">正</text>
    <text x="460" y="183" fill="#333">⌊−3⌋=−3</text>
    <text x="512" y="183" fill="#b85450" font-weight="bold">{−3}</text>
    <text x="572" y="183" fill="#b85450" font-weight="bold">1</text>
  </g>
  <rect x="370" y="192" width="240" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="490" y="207" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">合计 3 ≥ 3 → hi = mid = −6</text>

  <!-- arrow between tables -->
  <path d="M 270 130 L 370 130" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="320" y="124" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">lo=−6</text>

  <!-- nums2 visualization -->
  <text x="320" y="240" text-anchor="middle" font-size="11" fill="#444" font-weight="bold" filter="url(#rough2)">nums2 = [−3, −1, 2, 4, 5]（升序）</text>
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <rect x="200" y="250" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4"/>
    <text x="222" y="268" fill="#b85450" font-weight="bold">−3</text>
    <rect x="244" y="250" width="44" height="26" fill="#fafafa" stroke="#888" stroke-width="1.4" rx="4"/>
    <text x="266" y="268" fill="#333">−1</text>
    <rect x="288" y="250" width="44" height="26" fill="#fafafa" stroke="#888" stroke-width="1.4" rx="4"/>
    <text x="310" y="268" fill="#333">2</text>
    <rect x="332" y="250" width="44" height="26" fill="#cfddfa" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="354" y="268" fill="#446688" font-weight="bold">4</text>
    <rect x="376" y="250" width="44" height="26" fill="#cfddfa" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="398" y="268" fill="#446688" font-weight="bold">5</text>
  </g>
  <text x="320" y="294" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">x=−2 时阈值 3：首个 ≥3 是 4 → 右段 {4,5} 计 2 个</text>
  <text x="320" y="310" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">x=2 时阈值 −3：末个 ≤−3 是 −3 → 左段 {−3} 计 1 个（v 从 −7→−6 时跳变）</text>

  <!-- staircase insight -->
  <rect x="40" y="330" width="560" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="320" y="352" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">阶梯跳变：count 在真实乘积处才增加</text>
  <text x="320" y="372" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">v=−10: cnt=1   v=−8: cnt=2   v=−7: cnt=2(不动)   v=−6: cnt=3(跳变)   v=−5: cnt=4</text>
  <text x="320" y="390" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">−7 不是乘积 → count(−7)=count(−8)=2 不动；−6 是乘积 → 跳到 3</text>
  <text x="320" y="408" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">故「最小 v 使 count ≥ k=3」恰落在真实乘积 −6 上</text>

  <!-- answer -->
  <rect x="190" y="440" width="260" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="320" y="462" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">lo == hi == −6</text>
  <text x="320" y="478" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">返回答案 −6 ✓</text>

  <!-- note -->
  <text x="320" y="508" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">对照示例：第 3 小乘积 = (−2)×5=−10, (−2)×4=−8, 2×(−3)=−6</text>
  <text x="320" y="524" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">count(−7)=2 &lt; 3，count(−6)=3 ≥ 3；−7 非乘积故 count 与 −8 相同，−6 处跳变</text>
</svg>
