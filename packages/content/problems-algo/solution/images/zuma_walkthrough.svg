<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：board="RBYYBBRRB", hand="YRBGB" → 答案 3</text>

  <!-- ===== Step 0: Initial state ===== -->
  <text x="20" y="52" font-size="11" fill="#888" font-weight="bold">Step 0</text>
  <text x="62" y="52" font-size="10.5" fill="#888">初始状态</text>

  <text x="20" y="74" font-size="10" fill="#888">board:</text>
  <!-- R B Y Y B B R R B -->
  <circle cx="66" cy="68" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="66" y="72" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">R</text>
  <circle cx="92" cy="68" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="92" y="72" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">B</text>
  <circle cx="118" cy="68" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="118" y="72" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">Y</text>
  <circle cx="144" cy="68" r="13" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="144" y="72" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">Y</text>
  <circle cx="170" cy="68" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="72" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">B</text>
  <circle cx="196" cy="68" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="196" y="72" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">B</text>
  <circle cx="222" cy="68" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="222" y="72" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">R</text>
  <circle cx="248" cy="68" r="13" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="248" y="72" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">R</text>
  <circle cx="274" cy="68" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="274" y="72" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">B</text>

  <text x="20" y="96" font-size="10" fill="#888">hand:</text>
  <text x="62" y="96" font-size="10" fill="#666">Y×1  R×1  B×2  G×1</text>
  <text x="220" y="96" font-size="9.5" fill="#aaa">（G 不在 board 上 → 无用）</text>

  <!-- Arrow down -->
  <path d="M 170 108 L 170 124" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 1: Insert 2 B at end ===== -->
  <text x="20" y="140" font-size="11" fill="#888" font-weight="bold">Step 1</text>
  <text x="62" y="140" font-size="10.5" fill="#555" font-weight="bold">尾部单 B（L=1）→ 补 2 个 B → BBB 消除</text>

  <!-- board + BBB inserted at end -->
  <text x="20" y="164" font-size="10" fill="#888">插入:</text>
  <circle cx="66" cy="158" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="66" y="162" text-anchor="middle" font-size="10" fill="#b85450">R</text>
  <circle cx="90" cy="158" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="90" y="162" text-anchor="middle" font-size="10" fill="#446688">B</text>
  <circle cx="114" cy="158" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="114" y="162" text-anchor="middle" font-size="10" fill="#d6a040">Y</text>
  <circle cx="138" cy="158" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="138" y="162" text-anchor="middle" font-size="10" fill="#d6a040">Y</text>
  <circle cx="162" cy="158" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="162" y="162" text-anchor="middle" font-size="10" fill="#446688">B</text>
  <circle cx="186" cy="158" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="186" y="162" text-anchor="middle" font-size="10" fill="#446688">B</text>
  <circle cx="210" cy="158" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="210" y="162" text-anchor="middle" font-size="10" fill="#b85450">R</text>
  <circle cx="234" cy="158" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="234" y="162" text-anchor="middle" font-size="10" fill="#b85450">R</text>
  <circle cx="258" cy="158" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="258" y="162" text-anchor="middle" font-size="10" fill="#446688">B</text>
  <!-- inserted B B B highlighted -->
  <circle cx="282" cy="158" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="282" y="162" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">B</text>
  <circle cx="306" cy="158" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="306" y="162" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">B</text>
  <circle cx="330" cy="158" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="330" y="162" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">B</text>

  <!-- bracket around BBB -->
  <path d="M 246 176 L 246 180 L 342 180 L 342 176" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="294" y="196" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">消除 BBB</text>

  <!-- Result after step 1 -->
  <text x="20" y="220" font-size="10" fill="#888">剩余:</text>
  <text x="62" y="220" font-size="10.5" fill="#555" font-weight="bold">RBYYBBRR</text>
  <text x="180" y="220" font-size="10" fill="#888">hand: Y×1  R×1  (用掉 2B)</text>
  <text x="350" y="220" font-size="10" fill="#d6a040" font-weight="bold">累计用 2 球</text>

  <!-- Arrow down -->
  <path d="M 170 230 L 170 246" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: Insert Y into YY ===== -->
  <text x="20" y="262" font-size="11" fill="#888" font-weight="bold">Step 2</text>
  <text x="62" y="262" font-size="10.5" fill="#555" font-weight="bold">YY 段（L=2）→ 补 1 个 Y → YYY 消除 → 连锁！</text>

  <!-- RBYYYBBRR -->
  <text x="20" y="286" font-size="10" fill="#888">插入:</text>
  <circle cx="66" cy="280" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="66" y="284" text-anchor="middle" font-size="10" fill="#b85450">R</text>
  <circle cx="90" cy="280" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="90" y="284" text-anchor="middle" font-size="10" fill="#446688">B</text>
  <!-- YYY highlighted -->
  <circle cx="114" cy="280" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="114" y="284" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">Y</text>
  <circle cx="138" cy="280" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="138" y="284" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">Y</text>
  <circle cx="162" cy="280" r="12" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="162" y="284" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">Y</text>
  <circle cx="186" cy="280" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="186" y="284" text-anchor="middle" font-size="10" fill="#446688">B</text>
  <circle cx="210" cy="280" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="210" y="284" text-anchor="middle" font-size="10" fill="#446688">B</text>
  <circle cx="234" cy="280" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="234" y="284" text-anchor="middle" font-size="10" fill="#b85450">R</text>
  <circle cx="258" cy="280" r="12" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="258" y="284" text-anchor="middle" font-size="10" fill="#b85450">R</text>

  <path d="M 102 298 L 102 302 L 174 302 L 174 298" stroke="#d6a040" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="138" y="316" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">① 消除 YYY</text>

  <!-- Chain 1 result: RBBBRR -->
  <path d="M 170 322 L 170 338" stroke="#666" stroke-width="1" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="20" y="354" font-size="10" fill="#888">连锁:</text>
  <circle cx="66" cy="348" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="66" y="352" text-anchor="middle" font-size="9.5" fill="#b85450">R</text>
  <!-- BBB highlighted -->
  <circle cx="88" cy="348" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="88" y="352" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">B</text>
  <circle cx="110" cy="348" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="110" y="352" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">B</text>
  <circle cx="132" cy="348" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="132" y="352" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">B</text>
  <circle cx="154" cy="348" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="154" y="352" text-anchor="middle" font-size="9.5" fill="#b85450">R</text>
  <circle cx="176" cy="348" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="176" y="352" text-anchor="middle" font-size="9.5" fill="#b85450">R</text>

  <text x="210" y="352" font-size="9.5" fill="#446688" font-weight="bold">② 消除 BBB</text>

  <!-- Chain 2: RRRR -->
  <path d="M 130 362 L 130 378" stroke="#666" stroke-width="1" fill="none" stroke-dasharray="3,2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="20" y="394" font-size="10" fill="#888">连锁:</text>
  <circle cx="66" cy="388" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="66" y="392" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">R</text>
  <circle cx="88" cy="388" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="88" y="392" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">R</text>
  <circle cx="110" cy="388" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="110" y="392" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">R</text>
  <circle cx="132" cy="388" r="11" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="132" y="392" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">R</text>

  <text x="160" y="392" font-size="9.5" fill="#b85450" font-weight="bold">③ 消除 RRRR</text>

  <!-- Arrow down -->
  <path d="M 100 404 L 100 420" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Result -->
  <rect x="40" y="424" width="220" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="150" y="446" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 棋盘清空！累计用 3 球</text>

  <!-- Summary box -->
  <rect x="340" y="260" width="260" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="470" y="284" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">关键决策</text>
  <text x="352" y="304" font-size="10" fill="#666">① 先消尾部单 B（L=1, 补 2 球）</text>
  <text x="352" y="322" font-size="10" fill="#666">② 再消 YY（L=2, 补 1 球）</text>
  <text x="352" y="340" font-size="10" fill="#666">③ 连锁自动清除 BB 和 RRRR</text>
  <text x="352" y="354" font-size="10" fill="#888">暴力法会先消 BB/RR，耗尽手牌</text>

  <!-- Note about naive failure -->
  <rect x="340" y="380" width="260" height="80" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="470" y="402" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">为何贪心消 BB/RR 会失败？</text>
  <text x="352" y="420" font-size="10" fill="#666">先消 BB → 剩 R R → RRR 消除</text>
  <text x="352" y="436" font-size="10" fill="#666">→ 剩 RBYB → 单 B 无法补齐</text>
  <text x="352" y="452" font-size="10" fill="#888">DFS 遍历所有顺序才能找到最优解</text>
</svg>
