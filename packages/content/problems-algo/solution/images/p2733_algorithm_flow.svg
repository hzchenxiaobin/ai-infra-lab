<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2733f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：前三个数取中位数</text>

  <!-- start -->
  <rect x="210" y="48" width="140" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="70" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">读入 nums</text>

  <path d="M280,86 L280,112" stroke="#446688" stroke-width="2" marker-end="url(#arr2733f)" filter="url(#rough2)"/>

  <!-- decision n>=3 -->
  <path d="M280,116 L400,160 L280,204 L160,160 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="156" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">n ≥ 3 ?</text>
  <text x="280" y="174" text-anchor="middle" font-size="10" fill="#d6a040">元素互异</text>

  <!-- no branch: return -1 -->
  <text x="140" y="156" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M160,160 L80,160 L80,236" stroke="#b85450" stroke-width="2" marker-end="url(#arr2733f)" filter="url(#rough2)"/>
  <rect x="20" y="240" width="120" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="80" y="258" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">return -1</text>
  <text x="80" y="272" text-anchor="middle" font-size="9" fill="#b85450">非极小即极大</text>

  <!-- yes branch -->
  <text x="410" y="156" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M400,160 L470,160 L470,250" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr2733f)" filter="url(#rough2)"/>
  <rect x="392" y="252" width="156" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="470" y="270" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">取 v = [n0,n1,n2]</text>
  <text x="470" y="284" text-anchor="middle" font-size="9" fill="#4a7a3a">前三个</text>

  <path d="M470,292 L470,318" stroke="#446688" stroke-width="2" marker-end="url(#arr2733f)" filter="url(#rough2)"/>

  <!-- sort box -->
  <rect x="392" y="322" width="156" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="470" y="340" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">sort(v) → a &lt; b &lt; c</text>
  <text x="470" y="354" text-anchor="middle" font-size="9" fill="#446688">排序三元素</text>

  <path d="M470,362 L470,386" stroke="#446688" stroke-width="2" marker-end="url(#arr2733f)" filter="url(#rough2)"/>

  <!-- return median -->
  <rect x="392" y="388" width="156" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="470" y="406" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">return v[1] （中位）</text>

  <!-- side note -->
  <rect x="180" y="322" width="200" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="344" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">等价写法（免排序）</text>
  <text x="280" y="362" text-anchor="middle" font-size="10" fill="#446688">return n0+n1+n2</text>
  <text x="280" y="378" text-anchor="middle" font-size="10" fill="#446688">       − min − max</text>
  <text x="280" y="392" text-anchor="middle" font-size="9" fill="#888">和减极值即中位</text>
</svg>
