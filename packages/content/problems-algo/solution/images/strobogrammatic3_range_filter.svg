<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">按长度分层生成 + 边界范围过滤</text>

  <!-- ===== 顶部区间条 low="50" ... high="9000" ===== -->
  <rect x="70" y="52" width="420" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="74" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">区间 [low, high]：low="50"  ···  high="9000"</text>
  <!-- 区间端点标记 -->
  <path d="M 70 86 L 70 96" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="70" y="108" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">len=2</text>
  <path d="M 490 86 L 490 96" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="490" y="108" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">len=4</text>

  <!-- ===== 三列：L=2 下界 / L=3 中间 / L=4 上界 ===== -->
  <!-- 列 1: L=2 下界长度 -->
  <rect x="44" y="120" width="150" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="119" y="138" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">L=2 下界长度</text>

  <rect x="60" y="154" width="118" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="119" y="172" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">11  ✗ &lt; "50"</text>

  <rect x="60" y="186" width="118" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="119" y="204" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">69  ✓</text>

  <rect x="60" y="218" width="118" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="119" y="236" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">88  ✓</text>

  <rect x="60" y="250" width="118" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="119" y="268" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">96  ✓</text>

  <text x="119" y="294" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">保留 s ≥ low</text>
  <text x="119" y="308" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">小计 3</text>

  <!-- 列 2: L=3 中间长度 -->
  <rect x="205" y="120" width="150" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="280" y="138" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">L=3 中间长度</text>

  <rect x="221" y="154" width="118" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="280" y="172" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">101  ✓</text>

  <rect x="221" y="186" width="118" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="280" y="204" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">609  ✓</text>

  <rect x="221" y="218" width="118" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="280" y="236" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">888  ✓</text>

  <rect x="221" y="250" width="118" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="280" y="268" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">986  ✓ ...</text>

  <text x="280" y="294" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">位数严格介于两端</text>
  <text x="280" y="308" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">全部保留，小计 12</text>

  <!-- 列 3: L=4 上界长度 -->
  <rect x="366" y="120" width="150" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="5" filter="url(#rough2)"/>
  <text x="441" y="138" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">L=4 上界长度</text>

  <rect x="382" y="154" width="118" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="441" y="172" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1001  ✓</text>

  <rect x="382" y="186" width="118" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="441" y="204" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6009  ✓</text>

  <rect x="382" y="218" width="118" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="441" y="236" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">8888  ✓</text>

  <rect x="382" y="250" width="118" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="441" y="268" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9006  ✗ &gt; "9000"</text>

  <text x="441" y="294" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">保留 s ≤ high</text>
  <text x="441" y="308" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">小计 15</text>

  <!-- 汇总箭头 -->
  <path d="M 119 318 Q 280 336 280 344" fill="none" stroke="#446688" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 280 318 L 280 344" fill="none" stroke="#446688" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 441 318 Q 280 336 280 344" fill="none" stroke="#446688" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- 底部结论 -->
  <rect x="70" y="346" width="420" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="368" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">合计 = 3 + 12 + 15 = 30</text>

  <rect x="70" y="388" width="420" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="280" y="406" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">中间长度无需比较 → 闭式 f(L) 直接累加</text>
</svg>
