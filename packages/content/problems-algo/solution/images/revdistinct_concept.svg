<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：原数与反转数都入集合，集合大小即答案</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888">不必真正拼接数组——集合天然去重</text>

  <!-- Original array label -->
  <text x="30" y="84" font-size="10.5" fill="#666">原数组</text>

  <!-- Original cards: 1, 13, 10, 12, 31 (5 cards, w=46, gap=14, start=117) -->
  <rect x="117" y="64" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="86" text-anchor="middle" font-size="13" fill="#333">1</text>

  <rect x="177" y="64" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="86" text-anchor="middle" font-size="13" fill="#333">13</text>

  <rect x="237" y="64" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="86" text-anchor="middle" font-size="13" fill="#333">10</text>

  <rect x="297" y="64" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="86" text-anchor="middle" font-size="13" fill="#333">12</text>

  <rect x="357" y="64" width="46" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="86" text-anchor="middle" font-size="13" fill="#333">31</text>

  <!-- Down arrows (反转) -->
  <path d="M 140 100 L 140 124" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 200 100 L 200 124" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 260 100 L 260 124" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 320 100 L 320 124" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 380 100 L 380 124" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="420" y="116" font-size="9.5" fill="#d6a040" font-weight="bold">反转数位</text>

  <!-- Reversed cards: 1, 31, 1, 21, 13 -->
  <rect x="117" y="128" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="150" text-anchor="middle" font-size="13" fill="#333">1</text>

  <rect x="177" y="128" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="200" y="150" text-anchor="middle" font-size="13" fill="#333">31</text>

  <!-- Highlight: 10 -> 1 (leading zero dropped) -->
  <rect x="237" y="128" width="46" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="150" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <rect x="297" y="128" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="150" text-anchor="middle" font-size="13" fill="#333">21</text>

  <rect x="357" y="128" width="46" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="150" text-anchor="middle" font-size="13" fill="#333">13</text>

  <!-- Note for leading zero -->
  <text x="260" y="178" text-anchor="middle" font-size="9.5" fill="#b85450">10 → 01 = 1，前导零丢弃</text>

  <!-- Arrow down to set -->
  <path d="M 260 188 L 260 212" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="206" font-size="10" fill="#888">全部入集合</text>

  <!-- Set box -->
  <rect x="60" y="218" width="400" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="240" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">集合 = {1, 10, 12, 13, 21, 31}</text>
  <text x="260" y="258" text-anchor="middle" font-size="11" fill="#555">原数 5 个 + 反转数 5 个 = 10 次插入，去重后 6 个</text>

  <!-- Result -->
  <rect x="150" y="284" width="220" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="309" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">答案 = |集合| = 6</text>

  <!-- Footer -->
  <text x="260" y="344" text-anchor="middle" font-size="10" fill="#aaa">关键：遍历时同时加入 num 和 rev(num)，无需构建结果数组</text>
</svg>
