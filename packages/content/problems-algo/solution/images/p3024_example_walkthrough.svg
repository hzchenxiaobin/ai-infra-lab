<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：四组输入走完整个判定链</text>

  <!-- table header -->
  <rect x="24" y="44" width="86" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="67" y="64" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">输入</text>
  <rect x="110" y="44" width="86" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="153" y="64" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">排序后</text>
  <rect x="196" y="44" width="108" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="250" y="64" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">a+b 与 c</text>
  <rect x="304" y="44" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="359" y="64" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">相等情况</text>
  <rect x="414" y="44" width="86" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="457" y="64" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">输出</text>

  <!-- row 1: equilateral -->
  <rect x="24" y="84" width="86" height="52" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="67" y="114" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[3,3,3]</text>
  <rect x="110" y="84" width="86" height="52" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="153" y="114" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[3,3,3]</text>
  <rect x="196" y="84" width="108" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="250" y="108" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">6 &gt; 3 ✓</text>
  <text x="250" y="126" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">过合法性关卡</text>
  <rect x="304" y="84" width="110" height="52" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="359" y="108" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3==3==3</text>
  <text x="359" y="126" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">三边全等</text>
  <rect x="414" y="84" width="86" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="457" y="114" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">equilateral</text>

  <!-- row 2: isosceles -->
  <rect x="24" y="148" width="86" height="52" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="67" y="178" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[5,3,5]</text>
  <rect x="110" y="148" width="86" height="52" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="153" y="178" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[3,5,5]</text>
  <rect x="196" y="148" width="108" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="250" y="172" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">8 &gt; 5 ✓</text>
  <text x="250" y="190" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">过合法性关卡</text>
  <rect x="304" y="148" width="110" height="52" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="359" y="172" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3≠5，5==5</text>
  <text x="359" y="190" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">恰两边相等</text>
  <rect x="414" y="148" width="86" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="457" y="178" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">isosceles</text>

  <!-- row 3: scalene -->
  <rect x="24" y="212" width="86" height="52" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="67" y="242" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[3,4,5]</text>
  <rect x="110" y="212" width="86" height="52" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="153" y="242" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[3,4,5]</text>
  <rect x="196" y="212" width="108" height="52" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="250" y="236" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">7 &gt; 5 ✓</text>
  <text x="250" y="254" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">过合法性关卡</text>
  <rect x="304" y="212" width="110" height="52" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="359" y="236" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">3≠4≠5</text>
  <text x="359" y="254" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">互不相等</text>
  <rect x="414" y="212" width="86" height="52" fill="#ffffff" stroke="#999" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="457" y="242" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">scalene</text>

  <!-- row 4: none (degenerate) -->
  <rect x="24" y="276" width="86" height="52" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="67" y="306" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[8,4,4]</text>
  <rect x="110" y="276" width="86" height="52" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="153" y="306" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">[4,4,8]</text>
  <rect x="196" y="276" width="108" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="250" y="300" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">8 == 8 ✗</text>
  <text x="250" y="318" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">退化！关卡拦截</text>
  <rect x="304" y="276" width="110" height="52" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="359" y="300" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">（不再看）</text>
  <text x="359" y="318" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">合法即分类</text>
  <rect x="414" y="276" width="86" height="52" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="457" y="306" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">"none"</text>

  <!-- bottom note -->
  <rect x="48" y="344" width="424" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="362" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">先合法性后分类：a+b ≤ c 直接 "none"，</text>
  <text x="260" y="380" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">否则按「全等 → 恰两等 → 全不等」三档短路的顺序判类型。</text>
</svg>
