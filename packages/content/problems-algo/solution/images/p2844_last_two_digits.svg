<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：100 = 4 × 25 ⇒ 整除性只由末两位决定</text>
  <text x="310" y="48" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">以 2908305 为例：高位整体 × 100，对 mod 25 的贡献恒为 0</text>

  <!-- digit cells -->
  <rect x="68" y="78" width="64" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="100" y="111" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">2</text>
  <rect x="138" y="78" width="64" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="170" y="111" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">9</text>
  <rect x="208" y="78" width="64" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="240" y="111" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">0</text>
  <rect x="278" y="78" width="64" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="310" y="111" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">8</text>
  <rect x="348" y="78" width="64" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="380" y="111" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">3</text>
  <rect x="418" y="78" width="64" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="6" filter="url(#rough2)"/>
  <text x="450" y="111" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">0</text>
  <rect x="488" y="78" width="64" height="54" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="6" filter="url(#rough2)"/>
  <text x="520" y="111" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">5</text>

  <!-- index labels -->
  <text x="100" y="150" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="170" y="150" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">1</text>
  <text x="240" y="150" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">2</text>
  <text x="310" y="150" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">3</text>
  <text x="380" y="150" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">4</text>
  <text x="450" y="150" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">5</text>
  <text x="520" y="150" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">6</text>

  <!-- brackets -->
  <path d="M 68 164 L 68 174 M 68 168 L 412 168 M 412 164 L 412 174" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="190" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">高位 × 100：对 mod 25 贡献为 0，怎么删都不影响</text>
  <path d="M 418 164 L 418 174 M 418 168 L 552 168 M 552 164 L 552 174" fill="none" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="485" y="190" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">末两位：一切由它决定</text>

  <!-- formula box -->
  <rect x="110" y="210" width="400" height="58" rx="9" fill="#fff" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="310" y="234" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2908305 = 29083 × 100 + 05</text>
  <text x="310" y="256" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">⇒ 2908305 mod 25 = 05 mod 25 = 5 ≠ 0</text>

  <!-- valid endings -->
  <text x="188" y="318" text-anchor="end" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">合法末两位</text>
  <rect x="200" y="290" width="56" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="228" y="318" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">00</text>
  <rect x="272" y="290" width="56" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="300" y="318" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">25</text>
  <rect x="344" y="290" width="56" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="372" y="318" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">50</text>
  <rect x="416" y="290" width="56" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="444" y="318" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">75</text>
  <text x="486" y="308" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">作为两位数</text>
  <text x="486" y="324" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">恰好被 25 整除 ✓</text>

  <text x="310" y="368" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">10^k ≡ 0 (mod 25) 对一切 k ≥ 2 成立 —— 高位无所谓，末两位才是命门</text>
</svg>
