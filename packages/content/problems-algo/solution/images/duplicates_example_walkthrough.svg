<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 590" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="590" fill="#fafafa"/>
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [4, 3, 2, 7, 8, 2, 3, 1]，n = 8</text>

  <!-- index labels -->
  <text x="80" y="78" text-anchor="middle" font-size="9" fill="#bbb">0</text>
  <text x="120" y="78" text-anchor="middle" font-size="9" fill="#bbb">1</text>
  <text x="160" y="78" text-anchor="middle" font-size="9" fill="#bbb">2</text>
  <text x="200" y="78" text-anchor="middle" font-size="9" fill="#bbb">3</text>
  <text x="240" y="78" text-anchor="middle" font-size="9" fill="#bbb">4</text>
  <text x="280" y="78" text-anchor="middle" font-size="9" fill="#bbb">5</text>
  <text x="320" y="78" text-anchor="middle" font-size="9" fill="#bbb">6</text>
  <text x="360" y="78" text-anchor="middle" font-size="9" fill="#bbb">7</text>

  <!-- Initial state -->
  <text x="36" y="108" font-size="11" fill="#888" font-weight="bold">初始</text>
  <rect x="60" y="92" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="80" y="115" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="100" y="92" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="120" y="115" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="140" y="92" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="160" y="115" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="180" y="92" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="200" y="115" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
  <rect x="220" y="92" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="240" y="115" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>
  <rect x="260" y="92" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="115" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="300" y="92" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="320" y="115" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="340" y="92" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="360" y="115" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <path d="M 270 130 L 270 146" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- i=1, v=3, mark nums[2] -->
  <text x="36" y="184" font-size="10.5" fill="#d6a040" font-weight="bold">i=1</text>
  <text x="36" y="198" font-size="10" fill="#888">v=3</text>
  <path d="M 120 168 Q 140 162 160 168" stroke="#d6a040" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="60" y="168" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="80" y="191" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="100" y="168" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="120" y="191" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="140" y="168" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="191" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−2</text>
  <rect x="180" y="168" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="200" y="191" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
  <rect x="220" y="168" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="240" y="191" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>
  <rect x="260" y="168" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="191" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="300" y="168" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="320" y="191" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="340" y="168" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="360" y="191" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <path d="M 270 206 L 270 222" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- i=2, v=2, mark nums[1] -->
  <text x="36" y="260" font-size="10.5" fill="#d6a040" font-weight="bold">i=2</text>
  <text x="36" y="274" font-size="10" fill="#888">v=2</text>
  <path d="M 160 244 Q 140 238 120 244" stroke="#d6a040" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="60" y="244" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="80" y="267" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="100" y="244" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="267" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−3</text>
  <rect x="140" y="244" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="160" y="267" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−2</text>
  <rect x="180" y="244" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="200" y="267" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">7</text>
  <rect x="220" y="244" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="240" y="267" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>
  <rect x="260" y="244" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="267" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="300" y="244" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="320" y="267" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="340" y="244" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="360" y="267" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <path d="M 270 282 L 270 298" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- i=5, v=2, nums[1] already negative -> duplicate! -->
  <text x="36" y="336" font-size="10.5" fill="#4a7a3a" font-weight="bold">i=5</text>
  <text x="36" y="350" font-size="10" fill="#888">v=2</text>
  <path d="M 280 320 Q 200 314 120 320" stroke="#4a7a3a" stroke-width="2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="60" y="320" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="80" y="343" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="100" y="320" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="343" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−3</text>
  <rect x="140" y="320" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="160" y="343" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−2</text>
  <rect x="180" y="320" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="200" y="343" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−7</text>
  <rect x="220" y="320" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="240" y="343" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>
  <rect x="260" y="320" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="343" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="300" y="320" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="320" y="343" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−3</text>
  <rect x="340" y="320" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="360" y="343" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−1</text>
  <text x="392" y="340" font-size="11" fill="#4a7a3a" font-weight="bold">nums[1]&lt;0</text>
  <text x="392" y="354" font-size="11" fill="#4a7a3a" font-weight="bold">→ 2 重复!</text>

  <path d="M 270 358 L 270 374" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- i=6, v=3, nums[2] already negative -> duplicate! -->
  <text x="36" y="412" font-size="10.5" fill="#4a7a3a" font-weight="bold">i=6</text>
  <text x="36" y="426" font-size="10" fill="#888">v=3</text>
  <path d="M 320 396 Q 240 390 160 396" stroke="#4a7a3a" stroke-width="2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="60" y="396" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="80" y="419" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="100" y="396" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="120" y="419" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−3</text>
  <rect x="140" y="396" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="419" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−2</text>
  <rect x="180" y="396" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="200" y="419" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−7</text>
  <rect x="220" y="396" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="240" y="419" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">8</text>
  <rect x="260" y="396" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="419" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <rect x="300" y="396" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="320" y="419" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−3</text>
  <rect x="340" y="396" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="360" y="419" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">−1</text>
  <text x="392" y="416" font-size="11" fill="#4a7a3a" font-weight="bold">nums[2]&lt;0</text>
  <text x="392" y="430" font-size="11" fill="#4a7a3a" font-weight="bold">→ 3 重复!</text>

  <path d="M 270 434 L 270 466" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- result -->
  <rect x="170" y="472" width="200" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="494" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">i=5：nums[1] 已负 → 收集 2</text>
  <text x="270" y="512" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">i=6：nums[2] 已负 → 收集 3</text>

  <text x="270" y="548" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">结果 = [2, 3] ✓</text>
  <text x="270" y="568" text-anchor="middle" font-size="10.5" fill="#888">一趟扫描即时收集，无需第二趟</text>
</svg>
