<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="540" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：对 4 环 1-2-3-4-1 执行 DFS 克隆</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">绿=新建节点，红=命中 map 直接复用（破环/去重）</text>

  <!-- ===== Header ===== -->
  <rect x="30" y="58" width="60" height="28" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="76" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">步骤</text>

  <rect x="92" y="58" width="170" height="28" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="177" y="76" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">DFS 调用</text>

  <rect x="264" y="58" width="150" height="28" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="339" y="76" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">动作</text>

  <rect x="416" y="58" width="154" height="28" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="493" y="76" text-anchor="middle" font-size="11" fill="#666" font-weight="bold">visited 状态</text>

  <!-- ===== Row 1: clone(1) create ===== -->
  <rect x="30" y="90" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="116" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>
  <rect x="92" y="90" width="170" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="177" y="116" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">clone(1)</text>
  <rect x="264" y="90" width="150" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="339" y="116" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">新建 1′</text>
  <rect x="416" y="90" width="154" height="44" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="493" y="116" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">{1:1′}</text>

  <!-- ===== Row 2: clone(2) create ===== -->
  <rect x="30" y="138" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="164" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="92" y="138" width="170" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="177" y="164" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">clone(2)</text>
  <rect x="264" y="138" width="150" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="339" y="164" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">新建 2′</text>
  <rect x="416" y="138" width="154" height="44" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="493" y="164" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">{1:1′, 2:2′}</text>

  <!-- ===== Row 3: clone(1) hit ===== -->
  <rect x="30" y="186" width="60" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="212" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
  <rect x="92" y="186" width="170" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="177" y="212" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">clone(1)</text>
  <rect x="264" y="186" width="150" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="339" y="212" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">命中! return 1′</text>
  <rect x="416" y="186" width="154" height="44" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="493" y="212" text-anchor="middle" font-size="11" fill="#888">（不变）</text>

  <!-- ===== Row 4: clone(3) create ===== -->
  <rect x="30" y="234" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="260" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4</text>
  <rect x="92" y="234" width="170" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="177" y="260" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">clone(3)</text>
  <rect x="264" y="234" width="150" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="339" y="260" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">新建 3′</text>
  <rect x="416" y="234" width="154" height="44" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="493" y="260" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">{1:1′,2:2′,3:3′}</text>

  <!-- ===== Row 5: clone(2) hit ===== -->
  <rect x="30" y="282" width="60" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="308" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">5</text>
  <rect x="92" y="282" width="170" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="177" y="308" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">clone(2)</text>
  <rect x="264" y="282" width="150" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="339" y="308" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">命中! return 2′</text>
  <rect x="416" y="282" width="154" height="44" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="493" y="308" text-anchor="middle" font-size="11" fill="#888">（不变）</text>

  <!-- ===== Row 6: clone(4) create ===== -->
  <rect x="30" y="330" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="356" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">6</text>
  <rect x="92" y="330" width="170" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="177" y="356" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">clone(4)</text>
  <rect x="264" y="330" width="150" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="339" y="356" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">新建 4′</text>
  <rect x="416" y="330" width="154" height="44" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="493" y="356" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">{1:1′,2:2′,3:3′,4:4′}</text>

  <!-- ===== Row 7: clone(1) & clone(3) hit ===== -->
  <rect x="30" y="378" width="60" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="404" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">7</text>
  <rect x="92" y="378" width="170" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="177" y="400" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">clone(1), clone(3)</text>
  <rect x="264" y="378" width="150" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="339" y="400" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">均命中</text>
  <text x="339" y="414" text-anchor="middle" font-size="9" fill="#888">return 1′, 3′</text>
  <rect x="416" y="378" width="154" height="44" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="493" y="404" text-anchor="middle" font-size="11" fill="#888">（不变）</text>

  <!-- ===== Row 8: clone(4) hit ===== -->
  <rect x="30" y="426" width="60" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="452" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">8</text>
  <rect x="92" y="426" width="170" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="177" y="452" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">clone(4)</text>
  <rect x="264" y="426" width="150" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="339" y="448" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">命中! return 4′</text>
  <text x="339" y="462" text-anchor="middle" font-size="9" fill="#888">回到 1 的邻居</text>
  <rect x="416" y="426" width="154" height="44" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="493" y="452" text-anchor="middle" font-size="11" fill="#888">（不变）</text>

  <!-- footer -->
  <rect x="30" y="484" width="540" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="502" text-anchor="middle" font-size="10.5" fill="#666">共 4 次「新建」+ 5 次「命中复用」→ 克隆图与原图结构完全一致，节点全新独立</text>
  <text x="300" y="518" text-anchor="middle" font-size="10" fill="#888">关键：第 3 步若没有 map，clone(1)→clone(2)→clone(1)→… 会无限递归栈溢出</text>
</svg>
