<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="640" height="480" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：三表 LEFT JOIN + COUNT 计数技巧</text>

  <!-- ===== Members table (left) ===== -->
  <text x="28" y="52" font-size="10" fill="#446688" font-weight="bold">Members</text>
  <rect x="22" y="58" width="120" height="124" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="30" y="72" font-size="8" fill="#888">mid  name</text>
  <line x1="22" y1="76" x2="142" y2="76" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="24" y="80" width="116" height="16" fill="#e8f0fe" stroke="#446688" stroke-width="0.6" rx="3" filter="url(#rough2)" opacity="0.45"/>
  <text x="30" y="92" font-size="8" fill="#446688">9    Alice</text>
  <rect x="24" y="98" width="116" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.6" rx="3" filter="url(#rough2)" opacity="0.45"/>
  <text x="30" y="110" font-size="8" fill="#4a7a3a">11   Bob</text>
  <rect x="24" y="116" width="116" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="0.6" rx="3" filter="url(#rough2)" opacity="0.45"/>
  <text x="30" y="128" font-size="8" fill="#d6a040">3    Winston</text>
  <rect x="24" y="134" width="116" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="0.6" rx="3" filter="url(#rough2)" opacity="0.45"/>
  <text x="30" y="146" font-size="8" fill="#b85450">8    Hercy</text>
  <rect x="24" y="152" width="116" height="16" fill="#f3e5e5" stroke="#999" stroke-width="0.6" rx="3" filter="url(#rough2)" opacity="0.45"/>
  <text x="30" y="164" font-size="8" fill="#999">1    Narihan</text>

  <!-- LEFT JOIN arrow 1 -->
  <path d="M 142 116 L 188 116" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="165" y="110" text-anchor="middle" font-size="7" fill="#888">LEFT</text>
  <text x="165" y="128" text-anchor="middle" font-size="7" fill="#888">JOIN</text>

  <!-- ===== Visits table (middle) ===== -->
  <text x="194" y="52" font-size="10" fill="#446688" font-weight="bold">Visits</text>
  <rect x="188" y="58" width="140" height="172" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="196" y="72" font-size="8" fill="#888">vid  mid  date</text>
  <line x1="188" y1="76" x2="328" y2="76" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="190" y="80" width="136" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="0.5" rx="2" filter="url(#rough2)" opacity="0.4"/>
  <text x="196" y="91" font-size="8" fill="#446688">18   9    12-10</text>
  <rect x="190" y="96" width="136" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="0.5" rx="2" filter="url(#rough2)" opacity="0.4"/>
  <text x="196" y="107" font-size="8" fill="#446688">21   9    05-12</text>
  <rect x="190" y="112" width="136" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.5" rx="2" filter="url(#rough2)" opacity="0.4"/>
  <text x="196" y="123" font-size="8" fill="#4a7a3a">22   11   10-28</text>
  <rect x="190" y="128" width="136" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.5" rx="2" filter="url(#rough2)" opacity="0.4"/>
  <text x="196" y="139" font-size="8" fill="#4a7a3a">16   11   01-12</text>
  <rect x="190" y="144" width="136" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.5" rx="2" filter="url(#rough2)" opacity="0.4"/>
  <text x="196" y="155" font-size="8" fill="#4a7a3a">12   11   03-01</text>
  <rect x="190" y="160" width="136" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="0.5" rx="2" filter="url(#rough2)" opacity="0.4"/>
  <text x="196" y="171" font-size="8" fill="#d6a040">19   3    10-19</text>
  <rect x="190" y="176" width="136" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="0.5" rx="2" filter="url(#rough2)" opacity="0.4"/>
  <text x="196" y="187" font-size="8" fill="#b85450">17   8    05-07</text>
  <text x="196" y="206" font-size="7" fill="#999">Narihan(1) 无匹配 → NULL</text>
  <text x="196" y="218" font-size="7" fill="#999">LEFT JOIN 保留该行</text>

  <!-- LEFT JOIN arrow 2 -->
  <path d="M 328 116 L 374 116" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="351" y="110" text-anchor="middle" font-size="7" fill="#888">LEFT</text>
  <text x="351" y="128" text-anchor="middle" font-size="7" fill="#888">JOIN</text>

  <!-- ===== Purchases table (right) ===== -->
  <text x="380" y="52" font-size="10" fill="#446688" font-weight="bold">Purchases</text>
  <rect x="374" y="58" width="130" height="100" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="382" y="72" font-size="8" fill="#888">vid  amount</text>
  <line x1="374" y1="76" x2="504" y2="76" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <rect x="376" y="80" width="126" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="0.5" rx="2" filter="url(#rough2)" opacity="0.4"/>
  <text x="382" y="91" font-size="8" fill="#446688">18   9000</text>
  <rect x="376" y="96" width="126" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.5" rx="2" filter="url(#rough2)" opacity="0.4"/>
  <text x="382" y="107" font-size="8" fill="#4a7a3a">12   2000</text>
  <rect x="376" y="112" width="126" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="0.5" rx="2" filter="url(#rough2)" opacity="0.4"/>
  <text x="382" y="123" font-size="8" fill="#b85450">17   7000</text>
  <text x="382" y="140" font-size="7" fill="#999">vid 21/22/16/19 无匹配</text>
  <text x="382" y="152" font-size="7" fill="#999">→ charged_amount = NULL</text>

  <!-- ===== Formula box (bottom) ===== -->
  <rect x="22" y="252" width="596" height="80" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="320" y="272" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">转化率 = (100 × 购买次数) / 访问次数</text>
  <text x="320" y="290" text-anchor="middle" font-size="10" fill="#d6a040">COUNT(charged_amount) 统计非 NULL = 购买次数</text>
  <text x="320" y="306" text-anchor="middle" font-size="10" fill="#d6a040">COUNT(v.visit_id) 统计非 NULL = 访问次数</text>
  <text x="320" y="322" text-anchor="middle" font-size="9" fill="#b85450">⚠ charged_amount 的数值无关！只看有没有（NULL 与否）</text>

  <!-- ===== COUNT trick explanation ===== -->
  <rect x="22" y="346" width="596" height="120" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="34" y="364" font-size="10" fill="#446688" font-weight="bold">COUNT 技巧：LEFT JOIN 后用"是否 NULL"区分有无购买</text>
  <text x="34" y="382" font-size="9" fill="#555">Alice(9):  visit18→有购买 · visit21→NULL     COUNT(vid)=2, COUNT(amt)=1 → 50  → Gold</text>
  <text x="34" y="398" font-size="9" fill="#555">Bob(11):   visit22→NULL · visit16→NULL · visit12→有  COUNT(vid)=3, COUNT(amt)=1 → 33  → Silver</text>
  <text x="34" y="414" font-size="9" fill="#555">Winston(3): visit19→NULL                    COUNT(vid)=1, COUNT(amt)=0 → 0   → Silver</text>
  <text x="34" y="430" font-size="9" fill="#555">Hercy(8):  visit17→有购买                   COUNT(vid)=1, COUNT(amt)=1 → 100 → Diamond</text>
  <text x="34" y="446" font-size="9" fill="#999">Narihan(1): 无 visit → vid=NULL, amt=NULL   COUNT(vid)=0 → Bronze（须先判，避免除零）</text>
  <text x="34" y="460" font-size="8" fill="#888">vid=visit_id · amt=charged_amount · rate=100×COUNT(amt)/COUNT(vid)</text>
</svg>
