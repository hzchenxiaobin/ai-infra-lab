<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L9,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [0,1,2,4,5,7] → ["0-&gt;2","4-&gt;5","7"]</text>

  <!-- nums row -->
  <text x="22" y="64" font-size="11" fill="#888">nums:</text>
  <rect x="56" y="50" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="78" y="68" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="100" y="50" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="122" y="68" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="144" y="50" width="44" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="166" y="68" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="188" y="50" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="210" y="68" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="232" y="50" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="254" y="68" text-anchor="middle" font-size="11" fill="#333">5</text>
  <rect x="276" y="50" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="298" y="68" text-anchor="middle" font-size="11" fill="#333">7</text>

  <!-- index labels -->
  <text x="78" y="90" text-anchor="middle" font-size="8.5" fill="#aaa">0</text>
  <text x="122" y="90" text-anchor="middle" font-size="8.5" fill="#aaa">1</text>
  <text x="166" y="90" text-anchor="middle" font-size="8.5" fill="#aaa">2</text>
  <text x="210" y="90" text-anchor="middle" font-size="8.5" fill="#aaa">3</text>
  <text x="254" y="90" text-anchor="middle" font-size="8.5" fill="#aaa">4</text>
  <text x="298" y="90" text-anchor="middle" font-size="8.5" fill="#aaa">5</text>

  <!-- init note -->
  <rect x="340" y="50" width="200" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="440" y="68" text-anchor="middle" font-size="11" fill="#333">i=0: start = 0</text>

  <!-- arrows down to panels -->
  <path d="M 166 100 L 166 120" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 254 100 L 254 120" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 298 100 L 298 120" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===================== Panel 1: i=3 断点 ===================== -->
  <rect x="20" y="124" width="170" height="200" fill="#ffffff" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <rect x="20" y="124" width="170" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="105" y="143" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">i=3 断点 ✗</text>

  <text x="32" y="172" font-size="10.5" fill="#888">判定：</text>
  <text x="105" y="172" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">4 ≠ 2+1</text>
  <text x="32" y="196" font-size="10.5" fill="#888">闭合段：</text>
  <text x="105" y="196" text-anchor="middle" font-size="10.5" fill="#333">start=0, nums[i−1]=2</text>
  <text x="105" y="212" text-anchor="middle" font-size="10.5" fill="#888">0 ≠ 2 → 连续段</text>

  <rect x="40" y="222" width="130" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="105" y="241" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">输出 "0-&gt;2"</text>

  <rect x="40" y="262" width="130" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="105" y="280" text-anchor="middle" font-size="10.5" fill="#4a7a3a">start ← nums[3]</text>
  <text x="105" y="296" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">start = 4</text>

  <!-- ===================== Panel 2: i=5 断点 ===================== -->
  <rect x="200" y="124" width="170" height="200" fill="#ffffff" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <rect x="200" y="124" width="170" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="285" y="143" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">i=5 断点 ✗</text>

  <text x="212" y="172" font-size="10.5" fill="#888">判定：</text>
  <text x="285" y="172" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">7 ≠ 5+1</text>
  <text x="212" y="196" font-size="10.5" fill="#888">闭合段：</text>
  <text x="285" y="196" text-anchor="middle" font-size="10.5" fill="#333">start=4, nums[i−1]=5</text>
  <text x="285" y="212" text-anchor="middle" font-size="10.5" fill="#888">4 ≠ 5 → 连续段</text>

  <rect x="220" y="222" width="130" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="285" y="241" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">输出 "4-&gt;5"</text>

  <rect x="220" y="262" width="130" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="285" y="280" text-anchor="middle" font-size="10.5" fill="#d6a040">start ← nums[5]</text>
  <text x="285" y="296" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">start = 7</text>

  <!-- ===================== Panel 3: 循环结束 ===================== -->
  <rect x="380" y="124" width="160" height="200" fill="#ffffff" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <rect x="380" y="124" width="160" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="460" y="143" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">循环结束</text>

  <text x="392" y="172" font-size="10.5" fill="#888">闭合末段：</text>
  <text x="460" y="196" text-anchor="middle" font-size="10.5" fill="#333">start=7, nums[n−1]=7</text>
  <text x="460" y="212" text-anchor="middle" font-size="10.5" fill="#888">7 == 7 → 单元素</text>

  <rect x="395" y="222" width="130" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="460" y="241" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">输出 "7"</text>

  <rect x="395" y="262" width="130" height="44" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="460" y="284" text-anchor="middle" font-size="10.5" fill="#888" font-style="italic">所有元素已归段</text>

  <!-- final result -->
  <rect x="20" y="342" width="520" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="368" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">最终结果：["0-&gt;2", "4-&gt;5", "7"]</text>
</svg>
