<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="760" height="340" fill="#fafafa"/>

  <text x="380" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：两层级聚合 ① 筛每城最高气温行 ② 取其中最早一天</text>

  <!-- ===== Panel A: Weather table ===== -->
  <text x="124" y="54" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Weather（原始）</text>
  <rect x="24" y="60" width="200" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="54" y="74" text-anchor="middle" font-size="9" fill="#333">city_id</text>
  <text x="129" y="74" text-anchor="middle" font-size="9" fill="#333">day</text>
  <text x="199" y="74" text-anchor="middle" font-size="9" fill="#333">degree</text>
  <line x1="84" y1="60" x2="84" y2="80" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="174" y1="60" x2="174" y2="80" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- city1 rows (light green) -->
  <rect x="24" y="80" width="200" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="54" y="94" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="129" y="94" text-anchor="middle" font-size="8" fill="#888">2022-01-07</text>
  <text x="199" y="94" text-anchor="middle" font-size="9" fill="#888">-12</text>
  <rect x="24" y="100" width="200" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="54" y="114" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="129" y="114" text-anchor="middle" font-size="8" fill="#888">2022-03-07</text>
  <text x="199" y="114" text-anchor="middle" font-size="9" fill="#888">5</text>
  <!-- city1 max row (strong green) -->
  <rect x="24" y="120" width="200" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="54" y="134" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="129" y="134" text-anchor="middle" font-size="8" fill="#4a7a3a">2022-07-07</text>
  <text x="199" y="134" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">24</text>

  <!-- city2 rows (strong orange) -->
  <rect x="24" y="140" width="200" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="54" y="154" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="129" y="154" text-anchor="middle" font-size="8" fill="#d6a040">2022-08-07</text>
  <text x="199" y="154" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">37</text>
  <rect x="24" y="160" width="200" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="54" y="174" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="129" y="174" text-anchor="middle" font-size="8" fill="#d6a040">2022-08-17</text>
  <text x="199" y="174" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">37</text>

  <!-- city3 rows -->
  <rect x="24" y="180" width="200" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="54" y="194" text-anchor="middle" font-size="9" fill="#333">3</text>
  <text x="129" y="194" text-anchor="middle" font-size="8" fill="#888">2022-02-07</text>
  <text x="199" y="194" text-anchor="middle" font-size="9" fill="#888">-7</text>
  <rect x="24" y="200" width="200" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="54" y="214" text-anchor="middle" font-size="9" fill="#333">3</text>
  <text x="129" y="214" text-anchor="middle" font-size="8" fill="#b85450">2022-12-07</text>
  <text x="199" y="214" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">-6</text>
  <line x1="84" y1="80" x2="84" y2="220" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="174" y1="80" x2="174" y2="220" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Arrow A -> B -->
  <path d="M224 150 L262 150" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="243" y="142" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">① 筛=MAX</text>
  <text x="243" y="166" text-anchor="middle" font-size="8" fill="#888">每城最高行</text>

  <!-- ===== Panel B: max-degree rows ===== -->
  <text x="380" y="54" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">筛出 = MAX(degree) 的行</text>
  <rect x="280" y="60" width="200" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="74" text-anchor="middle" font-size="9" fill="#333">city_id</text>
  <text x="385" y="74" text-anchor="middle" font-size="9" fill="#333">day</text>
  <text x="455" y="74" text-anchor="middle" font-size="9" fill="#333">degree</text>
  <line x1="340" y1="60" x2="340" y2="80" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="430" y1="60" x2="430" y2="80" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="280" y="80" width="200" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="310" y="94" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="385" y="94" text-anchor="middle" font-size="8" fill="#4a7a3a">2022-07-07</text>
  <text x="455" y="94" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">24</text>
  <rect x="280" y="100" width="200" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="310" y="114" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="385" y="114" text-anchor="middle" font-size="8" fill="#d6a040">2022-08-07</text>
  <text x="455" y="114" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">37</text>
  <rect x="280" y="120" width="200" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="310" y="134" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="385" y="134" text-anchor="middle" font-size="8" fill="#d6a040">2022-08-17</text>
  <text x="455" y="134" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">37</text>
  <rect x="280" y="140" width="200" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="310" y="154" text-anchor="middle" font-size="9" fill="#333">3</text>
  <text x="385" y="154" text-anchor="middle" font-size="8" fill="#b85450">2022-12-07</text>
  <text x="455" y="154" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">-6</text>
  <line x1="340" y1="80" x2="340" y2="160" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="430" y1="80" x2="430" y2="160" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Arrow B -> C -->
  <path d="M480 120 L518 120" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="499" y="112" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">② MIN(day)</text>
  <text x="499" y="136" text-anchor="middle" font-size="8" fill="#888">每城最早</text>

  <!-- ===== Panel C: result ===== -->
  <text x="626" y="54" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">结果（city_id, day）</text>
  <rect x="536" y="60" width="180" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="566" y="74" text-anchor="middle" font-size="9" fill="#333">city_id</text>
  <text x="656" y="74" text-anchor="middle" font-size="9" fill="#333">day</text>
  <line x1="596" y1="60" x2="596" y2="80" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="536" y="80" width="180" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="566" y="94" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="656" y="94" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">2022-07-07</text>
  <rect x="536" y="100" width="180" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="566" y="114" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">2</text>
  <text x="656" y="114" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">2022-08-07</text>
  <rect x="536" y="120" width="180" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="566" y="134" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">3</text>
  <text x="656" y="134" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">2022-12-07</text>
  <line x1="596" y1="80" x2="596" y2="140" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- ===== Bottom note ===== -->
  <rect x="24" y="246" width="712" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="380" y="266" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">⚠️ city 2 最高气温 37 出现在 2022-08-07 与 2022-08-17 两天 → 取最早 08-07</text>
  <text x="380" y="286" text-anchor="middle" font-size="10" fill="#666">两层级：先 MAX(degree) 筛"最高行"（组级最值），再 MIN(day) 取"最早一天"（组级最值的再最值）</text>
  <text x="380" y="302" text-anchor="middle" font-size="10" fill="#666">每城恰好输出一行 (city_id, day)；与 1831/1549"并列全保留"不同，本题要"某一天"故并列需折叠为一天</text>
</svg>
