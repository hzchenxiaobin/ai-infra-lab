<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-path">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">算法流程：补集计数 + 快速幂</text>

  <!-- Box1 总方案 -->
  <rect x="130" y="48" width="260" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="73" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">每猴 2 选 1 → 总方案数 = 2ⁿ</text>

  <line x1="260" y1="90" x2="260" y2="112" stroke="#446688" stroke-width="2" marker-end="url(#ar)" filter="url(#rough2)"/>

  <!-- Box2 正难则反 -->
  <rect x="110" y="116" width="300" height="40" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="141" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">正难则反：直接数碰撞难 → 数「不碰撞」</text>

  <line x1="260" y1="158" x2="260" y2="180" stroke="#446688" stroke-width="2" marker-end="url(#ar)" filter="url(#rough2)"/>

  <!-- Box3 不碰撞=2 -->
  <rect x="110" y="184" width="300" height="44" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="206" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">不碰撞 ⟺ 全员同向（全顺 / 全逆）</text>
  <text x="260" y="222" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">混向环形必有相向边 → 必撞，故仅 2 种</text>

  <line x1="260" y1="230" x2="260" y2="252" stroke="#446688" stroke-width="2" marker-end="url(#ar)" filter="url(#rough2)"/>

  <!-- Box4 快速幂 -->
  <rect x="130" y="256" width="260" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="281" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">快速幂求 2ⁿ mod p　O(log n)</text>

  <line x1="260" y1="298" x2="260" y2="320" stroke="#446688" stroke-width="2" marker-end="url(#ar)" filter="url(#rough2)"/>

  <!-- Box5 答案 -->
  <rect x="110" y="324" width="300" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="349" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">答案 = (2ⁿ − 2) mod p（+p 修负）</text>

  <!-- 侧注 -->
  <text x="430" y="280" font-size="11" fill="#888" filter="url(#rough2)">n ≤ 10⁹</text>
  <text x="430" y="294" font-size="11" fill="#888" filter="url(#rough2)">必须对数级</text>
</svg>
