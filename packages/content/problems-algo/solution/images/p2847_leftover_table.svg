<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="620" height="360" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">余料打包表：捆完 8 和 9 后，零头只有 6 种组合</text>
  <text x="310" y="46" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">rem2 = a mod 3 ∈ {0, 1, 2}　　rem3 = b mod 2 ∈ {0, 1}</text>

  <!-- header row -->
  <rect x="60" y="60" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="80" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">rem2</text>
  <rect x="130" y="60" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="165" y="80" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">rem3</text>
  <rect x="200" y="60" width="140" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="80" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">剩余质因子</text>
  <rect x="340" y="60" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="400" y="80" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">追加数位</text>
  <rect x="460" y="60" width="110" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="515" y="80" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">说明</text>

  <!-- row 1: 0,0 -->
  <rect x="60" y="92" width="70" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="95" y="113" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="130" y="92" width="70" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="165" y="113" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="200" y="92" width="140" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="270" y="113" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">—</text>
  <rect x="340" y="92" width="120" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="400" y="113" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">—</text>
  <rect x="460" y="92" width="110" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="515" y="113" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">正好装完</text>

  <!-- row 2: 1,0 -->
  <rect x="60" y="126" width="70" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="95" y="147" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="130" y="126" width="70" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="165" y="147" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="200" y="126" width="140" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="270" y="147" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="340" y="126" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="400" y="147" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="460" y="126" width="110" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="515" y="147" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">单个 2 成位</text>

  <!-- row 3: 2,0 -->
  <rect x="60" y="160" width="70" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="95" y="181" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="130" y="160" width="70" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="165" y="181" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="200" y="160" width="140" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="270" y="181" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2·2</text>
  <rect x="340" y="160" width="120" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="400" y="181" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="460" y="160" width="110" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="515" y="181" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">2×2 = 4</text>

  <!-- row 4: 0,1 -->
  <rect x="60" y="194" width="70" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="95" y="215" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="130" y="194" width="70" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="165" y="215" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="200" y="194" width="140" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="270" y="215" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="340" y="194" width="120" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="400" y="215" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="460" y="194" width="110" height="32" fill="#ffffff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="515" y="215" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">单个 3 成位</text>

  <!-- row 5: 1,1 highlight green -->
  <rect x="60" y="228" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="249" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="130" y="228" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="165" y="249" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="200" y="228" width="140" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="249" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2·3</text>
  <rect x="340" y="228" width="120" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="400" y="249" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="460" y="228" width="110" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="515" y="249" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">一位抵两位 ✓</text>

  <!-- row 6: 2,1 highlight orange -->
  <rect x="60" y="262" width="70" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="283" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="130" y="262" width="70" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="165" y="283" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="200" y="262" width="140" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="283" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2·2·3</text>
  <rect x="340" y="262" width="120" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="400" y="283" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2 和 6</text>
  <rect x="460" y="262" width="110" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="515" y="283" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">"26" &lt; "34"</text>

  <!-- conclusion -->
  <rect x="70" y="310" width="480" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="332" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">同位数时比较字典序 —— 升序拼接即为最小数字</text>

  <text x="310" y="354" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">12 = 2·2·3 的两种两位拆法：{2,6} → "26" 与 {3,4} → "34"，取前者</text>
</svg>
