<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：sumRegion(2,1,4,3) = 8</text>

  <!-- 列标号 0..4 -->
  <text x="131" y="72" text-anchor="middle" font-size="10" fill="#999">c=0</text>
  <text x="173" y="72" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="215" y="72" text-anchor="middle" font-size="10" fill="#999">2</text>
  <text x="257" y="72" text-anchor="middle" font-size="10" fill="#999">3</text>
  <text x="299" y="72" text-anchor="middle" font-size="10" fill="#999">4</text>

  <!-- 行标号 0..4 -->
  <text x="100" y="111" text-anchor="end" font-size="10" fill="#999">r=0</text>
  <text x="100" y="153" text-anchor="end" font-size="10" fill="#999">1</text>
  <text x="100" y="195" text-anchor="end" font-size="10" fill="#999">2</text>
  <text x="100" y="237" text-anchor="end" font-size="10" fill="#999">3</text>
  <text x="100" y="279" text-anchor="end" font-size="10" fill="#999">4</text>

  <!-- 网格背景 -->
  <rect x="110" y="80" width="210" height="210" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <!-- 网格线 -->
  <path d="M152 80 V290 M194 80 V290 M236 80 V290 M278 80 V290" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>
  <path d="M110 122 H320 M110 164 H320 M110 206 H320 M110 248 H320" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>

  <!-- 目标子矩阵 9 格高亮（行 2..4，列 1..3） -->
  <rect x="152" y="164" width="126" height="126" fill="#fff8e1" opacity="0.9" filter="url(#rough2)"/>
  <rect x="152" y="164" width="126" height="126" fill="none" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>

  <!-- 单元格数值 -->
  <!-- row0 -->
  <text x="131" y="111" text-anchor="middle" font-size="13" fill="#666">3</text>
  <text x="173" y="111" text-anchor="middle" font-size="13" fill="#666">0</text>
  <text x="215" y="111" text-anchor="middle" font-size="13" fill="#666">1</text>
  <text x="257" y="111" text-anchor="middle" font-size="13" fill="#666">4</text>
  <text x="299" y="111" text-anchor="middle" font-size="13" fill="#666">2</text>
  <!-- row1 -->
  <text x="131" y="153" text-anchor="middle" font-size="13" fill="#666">5</text>
  <text x="173" y="153" text-anchor="middle" font-size="13" fill="#666">6</text>
  <text x="215" y="153" text-anchor="middle" font-size="13" fill="#666">3</text>
  <text x="257" y="153" text-anchor="middle" font-size="13" fill="#666">2</text>
  <text x="299" y="153" text-anchor="middle" font-size="13" fill="#666">1</text>
  <!-- row2 -->
  <text x="131" y="195" text-anchor="middle" font-size="13" fill="#666">1</text>
  <text x="173" y="195" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">2</text>
  <text x="215" y="195" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">0</text>
  <text x="257" y="195" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">1</text>
  <text x="299" y="195" text-anchor="middle" font-size="13" fill="#666">5</text>
  <!-- row3 -->
  <text x="131" y="237" text-anchor="middle" font-size="13" fill="#666">4</text>
  <text x="173" y="237" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">1</text>
  <text x="215" y="237" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">0</text>
  <text x="257" y="237" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">1</text>
  <text x="299" y="237" text-anchor="middle" font-size="13" fill="#666">7</text>
  <!-- row4 -->
  <text x="131" y="279" text-anchor="middle" font-size="13" fill="#666">1</text>
  <text x="173" y="279" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">0</text>
  <text x="215" y="279" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">3</text>
  <text x="257" y="279" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">0</text>
  <text x="299" y="279" text-anchor="middle" font-size="13" fill="#666">5</text>

  <!-- 四个角点 -->
  <!-- TL (r1,c1) pre[2][1]=8 绿 -->
  <circle cx="152" cy="164" r="6.5" fill="#4a7a3a" stroke="#fff" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M152 164 L70 164" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="3,2" fill="none" filter="url(#rough2)"/>
  <text x="66" y="161" text-anchor="end" font-size="10" fill="#4a7a3a" font-weight="bold">pre[2][1]</text>
  <text x="66" y="173" text-anchor="end" font-size="10" fill="#4a7a3a">= 8</text>

  <!-- TR (r1,c2+1) pre[2][4]=24 蓝 -->
  <circle cx="278" cy="164" r="6.5" fill="#446688" stroke="#fff" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M278 164 L360 164" stroke="#446688" stroke-width="1" stroke-dasharray="3,2" fill="none" filter="url(#rough2)"/>
  <text x="364" y="161" font-size="10" fill="#446688" font-weight="bold">pre[2][4]</text>
  <text x="364" y="173" font-size="10" fill="#446688">= 24</text>

  <!-- BL (r2+1,c1) pre[5][1]=14 蓝 -->
  <circle cx="152" cy="290" r="6.5" fill="#446688" stroke="#fff" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M152 290 L70 290" stroke="#446688" stroke-width="1" stroke-dasharray="3,2" fill="none" filter="url(#rough2)"/>
  <text x="66" y="287" text-anchor="end" font-size="10" fill="#446688" font-weight="bold">pre[5][1]</text>
  <text x="66" y="299" text-anchor="end" font-size="10" fill="#446688">= 14</text>

  <!-- BR (r2+1,c2+1) pre[5][4]=38 红 -->
  <circle cx="278" cy="290" r="6.5" fill="#b85450" stroke="#fff" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M278 290 L360 290" stroke="#b85450" stroke-width="1" stroke-dasharray="3,2" fill="none" filter="url(#rough2)"/>
  <text x="364" y="287" font-size="10" fill="#b85450" font-weight="bold">pre[5][4]</text>
  <text x="364" y="299" font-size="10" fill="#b85450">= 38</text>

  <!-- 计算框 -->
  <rect x="40" y="328" width="480" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="352" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">四角容斥计算</text>
  <text x="280" y="380" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">
    <tspan fill="#b85450">38</tspan>
    <tspan fill="#333">  −  </tspan>
    <tspan fill="#446688">24</tspan>
    <tspan fill="#333">  −  </tspan>
    <tspan fill="#446688">14</tspan>
    <tspan fill="#333">  +  </tspan>
    <tspan fill="#4a7a3a">8</tspan>
    <tspan fill="#333">  =  </tspan>
    <tspan fill="#d6a040">8</tspan>
    <tspan fill="#d6a040"> ✓</tspan>
  </text>
</svg>
