<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L8,5 L0,10 z" fill="#d6a040" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="640" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="26" text-anchor="middle" font-size="15" fill="#555" font-weight="bold" filter="url(#rough2)">菱形四边 = 两条主对角线段 + 两条副对角线段</text>

  <!-- ===== Grid 5x5, origin x0=120 y0=70, cell 48 ===== -->
  <!-- background grid cells -->
  <g filter="url(#rough2)">
    <!-- normal cells: light gray -->
    <rect x="120" y="70" width="48" height="48" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/>
    <rect x="168" y="70" width="48" height="48" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/>
    <rect x="216" y="70" width="48" height="48" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/>
    <rect x="264" y="70" width="48" height="48" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/>
    <rect x="312" y="70" width="48" height="48" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/>
    <rect x="120" y="118" width="48" height="48" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/>
    <rect x="168" y="118" width="48" height="48" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/>
    <rect x="216" y="118" width="48" height="48" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/>
    <rect x="264" y="118" width="48" height="48" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/>
    <rect x="312" y="118" width="48" height="48" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/>
    <rect x="120" y="166" width="48" height="48" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/>
    <rect x="168" y="166" width="48" height="48" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/>
    <rect x="216" y="166" width="48" height="48" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/>
    <rect x="264" y="166" width="48" height="48" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/>
    <rect x="312" y="166" width="48" height="48" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/>
    <rect x="120" y="214" width="48" height="48" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/>
    <rect x="168" y="214" width="48" height="48" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/>
    <rect x="216" y="214" width="48" height="48" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/>
    <rect x="264" y="214" width="48" height="48" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/>
    <rect x="312" y="214" width="48" height="48" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/>
    <rect x="120" y="262" width="48" height="48" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/>
    <rect x="168" y="262" width="48" height="48" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/>
    <rect x="216" y="262" width="48" height="48" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/>
    <rect x="264" y="262" width="48" height="48" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/>
    <rect x="312" y="262" width="48" height="48" fill="#f4f4f4" stroke="#ccc" stroke-width="1"/>
  </g>

  <!-- ===== Rhombus k=2 centered at (2,2): corners T(0,2) R(2,4) B(4,2) L(2,0) ===== -->
  <!-- center cell (2,2) green-ish -->
  <rect x="216" y="166" width="48" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="194" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">C</text>

  <!-- main-diagonal edges (blue): T->R interior (1,3) ; B->L interior (3,1) -->
  <rect x="264" y="118" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="288" y="146" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">主</text>
  <rect x="168" y="214" width="48" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="192" y="242" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">主</text>

  <!-- anti-diagonal edges (orange): R->B interior (3,3) ; L->T interior (1,1) -->
  <rect x="264" y="214" width="48" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="288" y="242" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">副</text>
  <rect x="168" y="118" width="48" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="192" y="146" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">副</text>

  <!-- corners (red/pink): T(0,2) R(2,4) B(4,2) L(2,0) -->
  <rect x="216" y="70" width="48" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="100" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">T</text>
  <rect x="312" y="166" width="48" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="336" y="196" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">R</text>
  <rect x="216" y="262" width="48" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="240" y="292" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">B</text>
  <rect x="120" y="166" width="48" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="144" y="196" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">L</text>

  <!-- rhombus outline polygon T(240,94) R(336,190) B(240,286) L(144,190) -->
  <polygon points="240,94 336,190 240,286 144,190" fill="none" stroke="#666" stroke-width="2" stroke-dasharray="5,3" filter="url(#rough2)"/>

  <!-- radius hint from C to T -->
  <path d="M 240 190 L 240 94" stroke="#999" stroke-width="1.4" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="248" y="146" font-size="10" fill="#999" filter="url(#rough2)">k</text>

  <!-- column / row axis hints -->
  <text x="240" y="62" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">cy</text>
  <text x="112" y="196" text-anchor="end" font-size="10" fill="#aaa" filter="url(#rough2)">cx</text>

  <!-- ===== Right side: legend & diagonal families ===== -->
  <!-- Main diagonal family -->
  <text x="400" y="86" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">主对角线族 (r−c = const)</text>
  <rect x="400" y="96" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="411" y="112" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">主</text>
  <text x="430" y="112" font-size="10" fill="#555" filter="url(#rough2)">边 T→R、B→L</text>
  <!-- arrow down-right -->
  <path d="M 408 130 L 432 154" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="438" y="146" font-size="9" fill="#446688" filter="url(#rough2)">步长 (+1,+1)</text>

  <!-- Anti diagonal family -->
  <text x="400" y="178" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">副对角线族 (r+c = const)</text>
  <rect x="400" y="188" width="22" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="411" y="204" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">副</text>
  <text x="430" y="204" font-size="10" fill="#555" filter="url(#rough2)">边 R→B、L→T</text>
  <!-- arrow down-left -->
  <path d="M 432 222 L 408 246" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="438" y="240" font-size="9" fill="#d6a040" filter="url(#rough2)">步长 (+1,−1)</text>

  <!-- corners legend -->
  <rect x="400" y="262" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="430" y="278" font-size="10" fill="#555" filter="url(#rough2)">四角：被两边各算一次，减一次</text>

  <!-- prefix note -->
  <rect x="392" y="298" width="232" height="76" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="508" y="318" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">对角线前缀和</text>
  <text x="400" y="336" font-size="10" fill="#444" filter="url(#rough2)">preMain[r][c] = g[r][c] + preMain[r−1][c−1]</text>
  <text x="400" y="352" font-size="10" fill="#444" filter="url(#rough2)">preAnti[r][c] = g[r][c] + preAnti[r−1][c+1]</text>
  <text x="400" y="368" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→ 任意对角线段和 = O(1)</text>

  <!-- footer -->
  <rect x="40" y="392" width="600" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="340" y="414" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">边界和 = sTR + sRB + sBL + sLT − (g_T + g_R + g_B + g_L)</text>
</svg>
