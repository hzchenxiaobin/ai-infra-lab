<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrL" markerWidth="9" markerHeight="9" refX="2" refY="4.5" orient="auto">
      <path d="M 9 0 L 0 4.5 L 9 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：奇偶层方向交替</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">L0 正序 →，L1 逆序 ←，L2 正序 → …方向每层翻转一次</text>

  <!-- ===== Tree ===== -->
  <g font-size="12">
    <!-- root L0 -->
    <circle cx="200" cy="86" r="20" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="200" y="92" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
    <!-- L1 -->
    <circle cx="140" cy="156" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="140" y="161" text-anchor="middle" fill="#446688" font-weight="bold">9</text>
    <circle cx="260" cy="156" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="260" y="161" text-anchor="middle" fill="#446688" font-weight="bold">20</text>
    <!-- edges L0-L1 -->
    <line x1="186" y1="100" x2="152" y2="142" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="214" y1="100" x2="248" y2="142" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <!-- L2 -->
    <circle cx="225" cy="226" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="225" y="231" text-anchor="middle" fill="#d6a040" font-weight="bold">15</text>
    <circle cx="295" cy="226" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="295" y="231" text-anchor="middle" fill="#d6a040" font-weight="bold">7</text>
    <line x1="248" y1="170" x2="232" y2="212" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
    <line x1="272" y1="170" x2="288" y2="212" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  </g>

  <!-- layer labels + direction arrows -->
  <text x="32" y="92" font-size="10" fill="#b85450" font-weight="bold">L0</text>
  <text x="32" y="161" font-size="10" fill="#446688" font-weight="bold">L1</text>
  <text x="32" y="231" font-size="10" fill="#d6a040" font-weight="bold">L2</text>

  <!-- direction arrows on the right side of tree -->
  <path d="M 348 86 L 408 86" stroke="#b85450" stroke-width="2.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="378" y="78" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">正序</text>

  <path d="M 408 156 L 348 156" stroke="#446688" stroke-width="2.2" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="378" y="148" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">逆序</text>

  <path d="M 348 226 L 408 226" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="378" y="218" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">正序</text>

  <!-- ===== Per-level result ===== -->
  <line x1="20" y1="262" x2="500" y2="262" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="30" y="282" font-size="11" fill="#444" font-weight="bold">逐层收集（按方向调整顺序）</text>

  <g font-size="11">
    <!-- L0 -->
    <rect x="30" y="294" width="30" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="45" y="310" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
    <text x="70" y="310" font-size="9" fill="#888">L0 正序 → [3]</text>

    <!-- L1 reversed -->
    <rect x="30" y="326" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="45" y="342" text-anchor="middle" fill="#446688" font-weight="bold">20</text>
    <rect x="62" y="326" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="77" y="342" text-anchor="middle" fill="#446688" font-weight="bold">9</text>
    <text x="102" y="342" font-size="9" fill="#888">L1 逆序 ← [20, 9]（原 [9,20] 翻转）</text>

    <!-- L2 -->
    <rect x="30" y="358" width="30" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="45" y="374" text-anchor="middle" fill="#d6a040" font-weight="bold">15</text>
    <rect x="62" y="358" width="30" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
    <text x="77" y="374" text-anchor="middle" fill="#d6a040" font-weight="bold">7</text>
    <text x="102" y="374" font-size="9" fill="#888">L2 正序 → [15, 7]</text>
  </g>

  <rect x="300" y="326" width="200" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="320" y="346" font-size="10" fill="#4a7a3a" font-weight="bold">方向标志 leftToRight</text>
  <text x="320" y="362" font-family="monospace" font-size="9" fill="#333">每层结束：flag = !flag</text>
  <text x="320" y="376" font-family="monospace" font-size="9" fill="#333">逆序层：reverse(level)</text>
</svg>
