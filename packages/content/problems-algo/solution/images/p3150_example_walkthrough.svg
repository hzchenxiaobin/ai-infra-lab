<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：16 条推文逐行计数，命中 4 条</text>
  <text x="260" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">len = 字符数；@ = '@' 出现次数；# = '#' 出现次数（均须严格大于阈值才无效）</text>

  <!-- header row -->
  <rect x="90" y="56" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="125" y="75" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">tweet_id</text>
  <rect x="160" y="56" width="65" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="192" y="75" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">len</text>
  <rect x="225" y="56" width="55" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="252" y="75" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">@</text>
  <rect x="280" y="56" width="55" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="307" y="75" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">#</text>
  <rect x="335" y="56" width="95" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="382" y="75" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">判定</text>

  <!-- row 1 -->
  <rect x="90" y="86" width="70" height="25" fill="#ffffff" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="125" y="103" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <rect x="160" y="86" width="65" height="25" fill="#ffffff" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="192" y="103" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">75</text>
  <rect x="225" y="86" width="55" height="25" fill="#ffffff" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="252" y="103" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="280" y="86" width="55" height="25" fill="#ffffff" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="307" y="103" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="335" y="86" width="95" height="25" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="382" y="103" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">有效</text>

  <!-- row 2 -->
  <rect x="90" y="111" width="70" height="25" fill="#ffffff" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="125" y="128" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>
  <rect x="160" y="111" width="65" height="25" fill="#ffffff" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="192" y="128" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">88</text>
  <rect x="225" y="111" width="55" height="25" fill="#ffffff" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="252" y="128" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="280" y="111" width="55" height="25" fill="#ffffff" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="307" y="128" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="335" y="111" width="95" height="25" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="382" y="128" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">有效</text>

  <!-- row 3: tweet 4 invalid -->
  <rect x="90" y="136" width="70" height="25" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="125" y="153" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="160" y="136" width="65" height="25" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="192" y="153" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">109</text>
  <rect x="225" y="136" width="55" height="25" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="252" y="153" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="280" y="136" width="55" height="25" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="307" y="153" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="335" y="136" width="95" height="25" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="382" y="153" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">无效 ✗</text>

  <!-- row 4: tweet 7 invalid -->
  <rect x="90" y="161" width="70" height="25" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="125" y="178" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="160" y="161" width="65" height="25" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="192" y="178" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">122</text>
  <rect x="225" y="161" width="55" height="25" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="252" y="178" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="280" y="161" width="55" height="25" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="307" y="178" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="335" y="161" width="95" height="25" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="382" y="178" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">无效 ✗</text>

  <!-- row 5: tweet 13 invalid -->
  <rect x="90" y="186" width="70" height="25" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="125" y="203" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">13</text>
  <rect x="160" y="186" width="65" height="25" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="192" y="203" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">80</text>
  <rect x="225" y="186" width="55" height="25" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="252" y="203" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="280" y="186" width="55" height="25" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="307" y="203" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="335" y="186" width="95" height="25" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="382" y="203" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">无效 ✗</text>

  <!-- row 6: tweet 14 invalid -->
  <rect x="90" y="211" width="70" height="25" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="125" y="228" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">14</text>
  <rect x="160" y="211" width="65" height="25" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="192" y="228" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">121</text>
  <rect x="225" y="211" width="55" height="25" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="252" y="228" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>
  <rect x="280" y="211" width="55" height="25" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="307" y="228" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="335" y="211" width="95" height="25" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="382" y="228" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">无效 ✗</text>

  <!-- row 7: tweet 16 valid -->
  <rect x="90" y="236" width="70" height="25" fill="#ffffff" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="125" y="253" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">16</text>
  <rect x="160" y="236" width="65" height="25" fill="#ffffff" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="192" y="253" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">74</text>
  <rect x="225" y="236" width="55" height="25" fill="#ffffff" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="252" y="253" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="280" y="236" width="55" height="25" fill="#ffffff" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="307" y="253" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="335" y="236" width="95" height="25" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="382" y="253" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">有效</text>

  <!-- row 8: ellipsis -->
  <rect x="90" y="261" width="340" height="25" fill="#fafafa" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="260" y="278" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">… 其余 9 条（2, 5, 6, 8, 9, 10, 11, 12, 15）全部有效</text>

  <!-- output box -->
  <rect x="90" y="300" width="340" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="321" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">输出（任意顺序）：tweet_id = 4, 7, 13, 14</text>

  <text x="260" y="352" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">⚠ 边界：恰 3 个 @ / 恰 3 个 # 均合法——tweet 1（3@、3#）有效；tweet 14 因 @=4 无效（#=3 本身合法）</text>
</svg>
