<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例 1：dp 逐点演化（obstacles = [0,1,2,3,0]）</text>

  <!-- Header row -->
  <g filter="url(#rough2)">
    <rect x="60" y="54" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="100" y="74" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">点 i</text>
    <rect x="140" y="54" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="180" y="74" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">障碍 o</text>
    <rect x="220" y="54" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="260" y="74" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1 道</text>
    <rect x="300" y="54" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="340" y="74" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2 道</text>
    <rect x="380" y="54" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
    <text x="420" y="74" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3 道</text>
  </g>

  <!-- Row 0: i=0, o=0, [1,0,1] -->
  <g filter="url(#rough2)">
    <rect x="60" y="84" width="80" height="32" fill="#fff" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="100" y="105" text-anchor="middle" font-size="12" fill="#333">0</text>
    <rect x="140" y="84" width="80" height="32" fill="#fff" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="180" y="105" text-anchor="middle" font-size="12" fill="#333">0</text>
    <rect x="220" y="84" width="80" height="32" fill="#fff" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="260" y="105" text-anchor="middle" font-size="12" fill="#333">1</text>
    <rect x="300" y="84" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3"/>
    <text x="340" y="105" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">0</text>
    <text x="340" y="80" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">起点</text>
    <rect x="380" y="84" width="80" height="32" fill="#fff" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="420" y="105" text-anchor="middle" font-size="12" fill="#333">1</text>
  </g>

  <!-- Row 1: i=1, o=1, [∞,0,1] -->
  <g filter="url(#rough2)">
    <rect x="60" y="116" width="80" height="32" fill="#fff" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="100" y="137" text-anchor="middle" font-size="12" fill="#333">1</text>
    <rect x="140" y="116" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3"/>
    <text x="180" y="137" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
    <rect x="220" y="116" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3"/>
    <text x="260" y="137" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">∞</text>
    <rect x="300" y="116" width="80" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3"/>
    <text x="340" y="137" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
    <text x="340" y="112" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">mn</text>
    <rect x="380" y="116" width="80" height="32" fill="#fff" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="420" y="137" text-anchor="middle" font-size="12" fill="#333">1</text>
  </g>

  <!-- Row 2: i=2, o=2, [2,∞,1]  (key step) -->
  <g filter="url(#rough2)">
    <rect x="60" y="148" width="80" height="32" fill="#fff" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="100" y="169" text-anchor="middle" font-size="12" fill="#333">2</text>
    <rect x="140" y="148" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3"/>
    <text x="180" y="169" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2</text>
    <rect x="220" y="148" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3"/>
    <text x="260" y="169" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="300" y="148" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3"/>
    <text x="340" y="169" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">∞</text>
    <rect x="380" y="148" width="80" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3"/>
    <text x="420" y="169" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
    <text x="420" y="144" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">mn</text>
  </g>

  <!-- Row 3: i=3, o=3, [2,3,∞] -->
  <g filter="url(#rough2)">
    <rect x="60" y="180" width="80" height="32" fill="#fff" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="100" y="201" text-anchor="middle" font-size="12" fill="#333">3</text>
    <rect x="140" y="180" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3"/>
    <text x="180" y="201" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">3</text>
    <rect x="220" y="180" width="80" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3"/>
    <text x="260" y="201" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
    <text x="260" y="176" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">mn</text>
    <rect x="300" y="180" width="80" height="32" fill="#fff" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="340" y="201" text-anchor="middle" font-size="12" fill="#333">3</text>
    <rect x="380" y="180" width="80" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3"/>
    <text x="420" y="201" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">∞</text>
  </g>

  <!-- Row 4: i=4, o=0, [2,3,3] -->
  <g filter="url(#rough2)">
    <rect x="60" y="212" width="80" height="32" fill="#fff" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="100" y="233" text-anchor="middle" font-size="12" fill="#333">4</text>
    <rect x="140" y="212" width="80" height="32" fill="#fff" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="180" y="233" text-anchor="middle" font-size="12" fill="#333">0</text>
    <rect x="220" y="212" width="80" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3"/>
    <text x="260" y="233" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
    <text x="260" y="208" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">mn</text>
    <rect x="300" y="212" width="80" height="32" fill="#fff" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="340" y="233" text-anchor="middle" font-size="12" fill="#333">3</text>
    <rect x="380" y="212" width="80" height="32" fill="#fff" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="420" y="233" text-anchor="middle" font-size="12" fill="#333">3</text>
  </g>

  <!-- Key-step annotation: point2, 3道(1) -> 1道(2) over blocked 2道 -->
  <path d="M 420 164 C 470 164 470 120 300 120 C 280 120 280 164 260 164" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="395" y="250" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">点2：3道(mn=1) 越障侧跳 → 1道=2</text>

  <!-- Answer annotation -->
  <path d="M 260 246 L 260 268" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="120" y="272" width="280" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="294" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 = min(2, 3, 3) = 2 ⭐</text>

  <!-- Legend -->
  <g filter="url(#rough2)" font-size="10" fill="#555">
    <rect x="60" y="330" width="18" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2"/>
    <text x="84" y="342">起点 / 直行到达</text>
    <rect x="190" y="330" width="18" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2"/>
    <text x="214" y="342">障碍封死 (∞)</text>
    <rect x="320" y="330" width="18" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2"/>
    <text x="344" y="342">mn（最便宜可到达道）</text>
  </g>
  <text x="280" y="372" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">每点：障碍道置 ∞ → mn=min(dp) → 空闲道 dp[j]=min(dp[j], mn+1) → 再封障碍道</text>
</svg>
