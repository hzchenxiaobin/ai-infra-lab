<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：arr = [2, 3, 1, 1, 4]，从右向左 DP</text>

  <!-- Column headers -->
  <rect x="10" y="38" width="540" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="38" y="55" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">i</text>
  <text x="95" y="55" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">arr[i]</text>
  <text x="170" y="55" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">oddNext</text>
  <text x="250" y="55" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">evenNext</text>
  <text x="325" y="55" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">odd[i]</text>
  <text x="390" y="55" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">even[i]</text>
  <text x="470" y="55" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">好起点?</text>

  <!-- Row 0: i=4 (base case) -->
  <rect x="10" y="66" width="540" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="38" y="84" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="95" y="84" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">4</text>
  <text x="170" y="84" text-anchor="middle" font-size="10.5" fill="#aaa">—</text>
  <text x="250" y="84" text-anchor="middle" font-size="10.5" fill="#aaa">—</text>
  <text x="325" y="84" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">T</text>
  <text x="390" y="84" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">T</text>
  <text x="470" y="84" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="525" y="84" text-anchor="middle" font-size="9.5" fill="#888">base（终点）</text>

  <!-- Row 1: i=3 (good) -->
  <rect x="10" y="96" width="540" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="38" y="114" text-anchor="middle" font-size="10.5" fill="#888">3</text>
  <text x="95" y="114" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">1</text>
  <text x="170" y="114" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">4</text>
  <text x="250" y="114" text-anchor="middle" font-size="10.5" fill="#aaa">—</text>
  <text x="325" y="114" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">T</text>
  <text x="390" y="114" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">F</text>
  <text x="470" y="114" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="525" y="114" text-anchor="middle" font-size="9" fill="#555">odd→4, even[4]</text>

  <!-- Row 2: i=2 (not good) -->
  <rect x="10" y="126" width="540" height="28" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="38" y="144" text-anchor="middle" font-size="10.5" fill="#888">2</text>
  <text x="95" y="144" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">1</text>
  <text x="170" y="144" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">3</text>
  <text x="250" y="144" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">3</text>
  <text x="325" y="144" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">F</text>
  <text x="390" y="144" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">T</text>
  <text x="470" y="144" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <text x="525" y="144" text-anchor="middle" font-size="9" fill="#555">odd→3, even[3]</text>

  <!-- Row 3: i=1 (good) -->
  <rect x="10" y="156" width="540" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="38" y="174" text-anchor="middle" font-size="10.5" fill="#888">1</text>
  <text x="95" y="174" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">3</text>
  <text x="170" y="174" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">4</text>
  <text x="250" y="174" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">2</text>
  <text x="325" y="174" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">T</text>
  <text x="390" y="174" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">F</text>
  <text x="470" y="174" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="525" y="174" text-anchor="middle" font-size="9" fill="#555">odd→4, even[4]</text>

  <!-- Row 4: i=0 (not good) -->
  <rect x="10" y="186" width="540" height="28" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="38" y="204" text-anchor="middle" font-size="10.5" fill="#888">0</text>
  <text x="95" y="204" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">2</text>
  <text x="170" y="204" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">1</text>
  <text x="250" y="204" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">2</text>
  <text x="325" y="204" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">F</text>
  <text x="390" y="204" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">F</text>
  <text x="470" y="204" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✗</text>
  <text x="525" y="204" text-anchor="middle" font-size="9" fill="#555">odd→1, even[1]</text>

  <!-- Explanation box 1: ceiling/floor -->
  <rect x="10" y="226" width="265" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="142" y="246" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">oddNext = ceiling(arr[i])</text>
  <text x="142" y="262" text-anchor="middle" font-size="10" fill="#555">有序表中 ≥ arr[i] 的最小 key</text>
  <text x="142" y="278" text-anchor="middle" font-size="10" fill="#555">i=2: ceiling(1) = 1 → idx 3</text>
  <text x="142" y="287" text-anchor="middle" font-size="9.5" fill="#888">同值取最小下标</text>

  <!-- Explanation box 2: DP recurrence -->
  <rect x="285" y="226" width="265" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="417" y="246" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">奇跳后接偶跳，偶跳后接奇跳</text>
  <text x="417" y="262" text-anchor="middle" font-size="10" fill="#555">odd[i] = even[oddNext[i]]</text>
  <text x="417" y="278" text-anchor="middle" font-size="10" fill="#555">even[i] = odd[evenNext[i]]</text>
  <text x="417" y="287" text-anchor="middle" font-size="9.5" fill="#888">无目标时记 false</text>

  <!-- Summary box -->
  <rect x="10" y="300" width="540" height="72" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="322" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">好起点 = {1, 3, 4} → 答案 = 3</text>
  <text x="280" y="342" text-anchor="middle" font-size="10.5" fill="#555">i=4: 终点 ✓ | i=3: 1→(奇)4 ✓ | i=1: 3→(奇)4 ✓</text>
  <text x="280" y="358" text-anchor="middle" font-size="10.5" fill="#888">i=0: 2→(奇)1→(偶)2→(奇)3→(偶)无 ✗ | i=2: 1→(奇)3→(偶)无 ✗</text>
  <text x="280" y="370" text-anchor="middle" font-size="10" fill="#aaa">从右向左一次遍历，每步 O(log n) 查有序表</text>
</svg>
