<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：碰撞反弹 ⟺ 穿过对方</text>

  <!-- ===== Top panel: collide and reverse ===== -->
  <rect x="30" y="44" width="500" height="130" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">情形一：相遇 → 双双反向（题目规则）</text>

  <!-- t=0 row -->
  <text x="50" y="86" font-size="10" fill="#888">t=0</text>
  <line x1="80" y1="86" x2="480" y2="86" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="180" cy="86" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="89" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">A</text>
  <path d="M 192 86 L 210 86" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <circle cx="380" cy="86" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="89" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">B</text>
  <path d="M 368 86 L 350 86" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- t=1 collision -->
  <text x="50" y="124" font-size="10" fill="#888">t=1</text>
  <line x1="80" y1="124" x2="480" y2="124" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <!-- burst at collision -->
  <text x="280" y="112" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">碰撞! 反向</text>
  <circle cx="270" cy="124" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="127" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">A</text>
  <path d="M 258 124 L 240 124" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <circle cx="290" cy="124" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="290" y="127" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">B</text>
  <path d="M 302 124 L 320 124" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- t=2 after reverse -->
  <text x="50" y="158" font-size="10" fill="#888">t=2</text>
  <line x1="80" y1="158" x2="480" y2="158" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="180" cy="158" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="161" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">B</text>
  <circle cx="380" cy="158" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="161" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">A</text>
  <text x="280" y="170" text-anchor="middle" font-size="10" fill="#b85450">A 到了 B 的起点，B 到了 A 的起点</text>

  <!-- ===== Bottom panel: pass through ===== -->
  <rect x="30" y="190" width="500" height="130" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="210" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">情形二：直接穿过对方（等价转化）</text>

  <!-- t=0 row -->
  <text x="50" y="232" font-size="10" fill="#888">t=0</text>
  <line x1="80" y1="232" x2="480" y2="232" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="180" cy="232" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="235" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">A</text>
  <path d="M 192 232 L 210 232" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <circle cx="380" cy="232" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="235" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">B</text>
  <path d="M 368 232 L 350 232" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- t=1 pass through -->
  <text x="50" y="270" font-size="10" fill="#888">t=1</text>
  <line x1="80" y1="270" x2="480" y2="270" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <text x="280" y="258" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">穿过! 不转向</text>
  <circle cx="280" cy="270" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)" opacity="0.6"/>
  <text x="280" y="273" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">A</text>
  <circle cx="280" cy="270" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="284" y="273" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">B</text>

  <!-- t=2 -->
  <text x="50" y="304" font-size="10" fill="#888">t=2</text>
  <line x1="80" y1="304" x2="480" y2="304" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <circle cx="180" cy="304" r="9" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="307" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">B</text>
  <circle cx="380" cy="304" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="307" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">A</text>
  <text x="280" y="316" text-anchor="middle" font-size="10" fill="#4a7a3a">A 仍到 B 的起点，B 仍到 A 的起点</text>

  <!-- ===== Conclusion ===== -->
  <rect x="30" y="330" width="500" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="355" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">蚂蚁不可区分 → 碰撞反弹与穿过等价 → 各自直走到掉落</text>
</svg>
