<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">缺失计数：missing(idx) = nums[idx] − nums[0] − idx</text>

  <!-- ============ Number line: 4 5 6 7 8 9 10 ============ -->
  <text x="20" y="74" font-size="11" fill="#888">数轴：</text>

  <!-- present: 4 -->
  <rect x="80" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="78" text-anchor="middle" font-size="12" fill="#333">4</text>
  <!-- missing: 5 -->
  <rect x="135" y="58" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="160" y="78" text-anchor="middle" font-size="12" fill="#b85450">5</text>
  <!-- missing: 6 -->
  <rect x="190" y="58" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="215" y="78" text-anchor="middle" font-size="12" fill="#b85450">6</text>
  <!-- present: 7 -->
  <rect x="245" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="78" text-anchor="middle" font-size="12" fill="#333">7</text>
  <!-- missing: 8 -->
  <rect x="300" y="58" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="325" y="78" text-anchor="middle" font-size="12" fill="#b85450">8</text>
  <!-- present: 9 -->
  <rect x="355" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="78" text-anchor="middle" font-size="12" fill="#333">9</text>
  <!-- present: 10 -->
  <rect x="410" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="435" y="78" text-anchor="middle" font-size="12" fill="#333">10</text>

  <!-- legend -->
  <rect x="470" y="58" width="14" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="490" y="70" font-size="10" fill="#555">存在</text>
  <rect x="470" y="76" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,2" rx="2" filter="url(#rough2)"/>
  <text x="490" y="88" font-size="10" fill="#555">缺失</text>

  <!-- arrow connecting number line to nums array -->
  <path d="M 105 92 L 105 108" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 270 92 L 270 108" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 380 92 L 380 108" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 435 92 L 435 108" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- ============ nums array ============ -->
  <text x="20" y="128" font-size="11" fill="#888">nums:</text>
  <rect x="80" y="112" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="132" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="245" y="112" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="132" text-anchor="middle" font-size="12" fill="#333">7</text>
  <rect x="355" y="112" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="132" text-anchor="middle" font-size="12" fill="#333">9</text>
  <rect x="410" y="112" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="435" y="132" text-anchor="middle" font-size="12" fill="#333">10</text>

  <!-- index labels -->
  <text x="105" y="156" text-anchor="middle" font-size="9" fill="#aaa">idx=0</text>
  <text x="270" y="156" text-anchor="middle" font-size="9" fill="#aaa">idx=1</text>
  <text x="380" y="156" text-anchor="middle" font-size="9" fill="#aaa">idx=2</text>
  <text x="435" y="156" text-anchor="middle" font-size="9" fill="#aaa">idx=3</text>

  <!-- ============ missing(idx) values ============ -->
  <text x="20" y="186" font-size="11" fill="#888">missing:</text>
  <rect x="80" y="170" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="190" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="245" y="170" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="270" y="190" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="355" y="170" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="380" y="190" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="410" y="170" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="435" y="190" text-anchor="middle" font-size="12" fill="#333">3</text>

  <!-- formula annotation -->
  <text x="270" y="216" text-anchor="middle" font-size="10.5" fill="#888">↑ 7−4−1=2（5、6 缺失）　 9−4−2=3（5、6、8 缺失）</text>

  <!-- monotonicity arrow -->
  <path d="M 105 210 L 430 210" stroke="#d6a040" stroke-width="1.4" fill="none" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <text x="268" y="238" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">missing(idx) 单调不减 → 可二分 ✓</text>

  <!-- ============ key insight box ============ -->
  <rect x="40" y="258" width="480" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="280" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">关键转化：求第 k 个缺失数 → 二分找「第一个 missing(idx) ≥ k 的下标」</text>
  <text x="280" y="300" text-anchor="middle" font-size="10.5" fill="#555">找到后 j = idx−1，答案 = nums[j] + k − missing(j)</text>

  <!-- ============ complexity box ============ -->
  <rect x="40" y="324" width="480" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="346" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">二分 O(log n)，每轮 O(1) 计数 → 总 O(log n)，空间 O(1)</text>
  <text x="280" y="362" text-anchor="middle" font-size="10" fill="#888">对照线性扫描 O(n)：逐段累加缺失数直到 ≥ k</text>
</svg>
