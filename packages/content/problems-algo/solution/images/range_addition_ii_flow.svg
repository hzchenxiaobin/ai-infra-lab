<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：遍历一次 ops 维护最小边，O(k) 时间 O(1) 空间</text>

  <!-- Start -->
  <rect x="230" y="48" width="100" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="16" filter="url(#rough2)"/>
  <text x="280" y="70" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">开始</text>
  <path d="M 280 82 L 280 96" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: ops empty? -->
  <polygon points="280,100 380,140 280,180 180,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="138" text-anchor="middle" font-size="11" fill="#333">ops 为空?</text>
  <text x="280" y="152" text-anchor="middle" font-size="11" fill="#333">k == 0</text>

  <!-- Yes branch: return m*n -->
  <path d="M 380 140 L 430 140" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="134" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="432" y="120" width="110" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="487" y="138" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">返回 m × n</text>
  <text x="487" y="152" text-anchor="middle" font-size="10" fill="#666">全为 0 即最大</text>

  <!-- No branch: init min_a, min_b -->
  <path d="M 280 180 L 280 196" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="192" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="200" y="198" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="220" text-anchor="middle" font-size="11" fill="#333">min_a = m,  min_b = n</text>

  <!-- Loop box -->
  <path d="M 280 232 L 280 246" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="160" y="248" width="240" height="56" fill="none" stroke="#b85450" stroke-width="1.6" stroke-dasharray="5 3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="266" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">遍历每个 op = [a, b]</text>
  <text x="280" y="282" text-anchor="middle" font-size="11" fill="#333">min_a = min(min_a, a)</text>
  <text x="280" y="296" text-anchor="middle" font-size="11" fill="#333">min_b = min(min_b, b)</text>

  <!-- to return -->
  <path d="M 280 304 L 280 322" stroke="#4a7a3a" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="180" y="324" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="342" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 min_a × min_b</text>
  <text x="280" y="356" text-anchor="middle" font-size="10" fill="#666">= 交集面积 = 最大值个数</text>

  <!-- complexity box -->
  <rect x="40" y="372" width="480" height="22" fill="none" stroke="#bbb" stroke-width="0.8" stroke-dasharray="3 3" rx="4" filter="url(#rough2)"/>
  <text x="280" y="388" text-anchor="middle" font-size="10" fill="#888">时间 O(k)，空间 O(1)；k = ops.length，无需构造 m×n 矩阵</text>
</svg>
