<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：判回文 → 1，否则 → 2</text>

  <rect x="200" y="48" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="70" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">输入 s</text>
  <path d="M260,82 L260,104" stroke="#446688" stroke-width="1.5" marker-end="url(#arr2)" fill="none" filter="url(#rough2)"/>

  <polygon points="260,106 380,156 260,206 140,156" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="152" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">s == reverse(s) ?</text>
  <text x="260" y="170" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">(双指针判回文)</text>

  <path d="M140,156 L80,156 L80,220" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrR)" fill="none" filter="url(#rough2)"/>
  <text x="88" y="148" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>

  <rect x="20" y="222" width="120" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="80" y="240" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">本身就是回文</text>
  <text x="80" y="256" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">return 1</text>

  <path d="M380,156 L440,156 L440,220" stroke="#446688" stroke-width="1.5" marker-end="url(#arr2)" fill="none" filter="url(#rough2)"/>
  <text x="410" y="148" font-size="11" fill="#446688" filter="url(#rough2)">否</text>

  <rect x="380" y="222" width="120" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="440" y="240" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">先删全 a，再删全 b</text>
  <text x="440" y="256" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">return 2</text>

  <rect x="60" y="290" width="400" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="312" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">双指针判回文：l=0, r=n−1，s[l]==s[r] 则 l++, r−−</text>
  <text x="260" y="332" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">全程 l &lt; r 都满足 → 回文；否则非回文</text>
</svg>
