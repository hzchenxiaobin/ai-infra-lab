<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="560" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">示例演算：stamp="abc", target="ababc" 反向消去</text>
  <text x="290" y="42" text-anchor="middle" font-size="11" fill="#888">n=5, m=3, 窗口 0/1/2；橙色框=当前撤销窗口，红色=本次消除位</text>

  <!-- ===== Step 0: initial target ===== -->
  <text x="40" y="74" font-size="12" fill="#446688" font-weight="bold">初始 target</text>
  <!-- cells ababc, indices 0..4 -->
  <rect x="190" y="58" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="79" text-anchor="middle" font-size="13" fill="#333">a</text>
  <rect x="230" y="58" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="79" text-anchor="middle" font-size="13" fill="#333">b</text>
  <rect x="270" y="58" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="79" text-anchor="middle" font-size="13" fill="#333">a</text>
  <rect x="310" y="58" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="79" text-anchor="middle" font-size="13" fill="#333">b</text>
  <rect x="350" y="58" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="79" text-anchor="middle" font-size="13" fill="#333">c</text>
  <!-- index labels -->
  <text x="210" y="104" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="250" y="104" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="290" y="104" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="330" y="104" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="370" y="104" text-anchor="middle" font-size="9" fill="#888">4</text>
  <!-- note: window 2 fully matches -->
  <rect x="266" y="54" width="128" height="40" fill="none" stroke="#d6a040" stroke-width="2.5" rx="5" filter="url(#rough2)"/>
  <text x="412" y="74" font-size="10" fill="#d6a040">窗口2=abc</text>
  <text x="412" y="88" font-size="10" fill="#d6a040">全匹配 ✓</text>
  <line x1="290" y1="114" x2="290" y2="138" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="306" y="130" font-size="10" fill="#b85450">撤销窗口 2</text>

  <!-- ===== Step 1: after undo window 2 -> ab??? ===== -->
  <text x="40" y="166" font-size="12" fill="#4a7a3a" font-weight="bold">撤销 2 后</text>
  <rect x="190" y="150" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="171" text-anchor="middle" font-size="13" fill="#333">a</text>
  <rect x="230" y="150" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="171" text-anchor="middle" font-size="13" fill="#333">b</text>
  <!-- erased positions 2,3,4 in red/green erased style -->
  <rect x="270" y="150" width="40" height="32" fill="#e6f4ea" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="171" text-anchor="middle" font-size="13" fill="#b85450">?</text>
  <rect x="310" y="150" width="40" height="32" fill="#e6f4ea" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="171" text-anchor="middle" font-size="13" fill="#b85450">?</text>
  <rect x="350" y="150" width="40" height="32" fill="#e6f4ea" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="171" text-anchor="middle" font-size="13" fill="#b85450">?</text>
  <text x="412" y="166" font-size="10" fill="#b85450">消除位 2,3,4</text>
  <text x="412" y="180" font-size="10" fill="#888">位2解除窗口0阻塞</text>
  <line x1="290" y1="194" x2="290" y2="218" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="306" y="210" font-size="10" fill="#b85450">撤销窗口 0</text>

  <!-- ===== Step 2: after undo window 0 -> ????? ===== -->
  <text x="40" y="246" font-size="12" fill="#4a7a3a" font-weight="bold">撤销 0 后</text>
  <!-- window 0 highlight (positions 0,1,2) -->
  <rect x="186" y="226" width="128" height="40" fill="none" stroke="#d6a040" stroke-width="2.5" rx="5" filter="url(#rough2)"/>
  <rect x="190" y="230" width="40" height="32" fill="#e6f4ea" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="251" text-anchor="middle" font-size="13" fill="#b85450">?</text>
  <rect x="230" y="230" width="40" height="32" fill="#e6f4ea" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="251" text-anchor="middle" font-size="13" fill="#b85450">?</text>
  <rect x="270" y="230" width="40" height="32" fill="#e6f4ea" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="290" y="251" text-anchor="middle" font-size="13" fill="#888">?</text>
  <rect x="310" y="230" width="40" height="32" fill="#e6f4ea" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="251" text-anchor="middle" font-size="13" fill="#888">?</text>
  <rect x="350" y="230" width="40" height="32" fill="#e6f4ea" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="251" text-anchor="middle" font-size="13" fill="#888">?</text>
  <text x="412" y="246" font-size="10" fill="#b85450">消除位 0,1</text>
  <text x="412" y="260" font-size="10" fill="#4a7a3a">全 ? ✓ 完成</text>

  <!-- divider -->
  <line x1="60" y1="290" x2="520" y2="290" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="5,3" filter="url(#rough2)"/>

  <!-- ===== Summary table ===== -->
  <text x="290" y="312" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">撤销过程汇总</text>

  <!-- table header -->
  <rect x="60" y="324" width="460" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="120" y="342" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">步骤</text>
  <text x="230" y="342" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">撤销窗口</text>
  <text x="340" y="342" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">消除位置</text>
  <text x="450" y="342" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">状态</text>

  <!-- row1 -->
  <rect x="60" y="350" width="460" height="26" fill="#fafafa" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="120" y="368" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="230" y="368" text-anchor="middle" font-size="11" fill="#333">窗口 2</text>
  <text x="340" y="368" text-anchor="middle" font-size="11" fill="#b85450">2, 3, 4</text>
  <text x="450" y="368" text-anchor="middle" font-size="11" fill="#333">ab???</text>

  <!-- row2 -->
  <rect x="60" y="376" width="460" height="26" fill="#fafafa" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="120" y="394" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="230" y="394" text-anchor="middle" font-size="11" fill="#333">窗口 0</text>
  <text x="340" y="394" text-anchor="middle" font-size="11" fill="#b85450">0, 1</text>
  <text x="450" y="394" text-anchor="middle" font-size="11" fill="#333">?????</text>

  <!-- ===== Result ===== -->
  <rect x="60" y="418" width="460" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="438" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">撤销序列 [2, 0] → 逆序得盖印顺序 [0, 2]</text>
  <text x="290" y="455" text-anchor="middle" font-size="11" fill="#888">最后撤销的最先盖印：撤销 0 是最后一步 → 盖印 0 最先</text>

  <!-- forward verification -->
  <rect x="60" y="476" width="460" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="496" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">正向验证（盖印顺序 [0, 2]）</text>
  <text x="290" y="514" text-anchor="middle" font-size="11" fill="#333">????? →盖0→ abc?? →盖2→ ababc</text>
  <text x="290" y="530" text-anchor="middle" font-size="10" fill="#888">与示例输出 [0,2] 一致 ✓</text>
</svg>
