<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：按列统计字符频次，递增选列构造 target</text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#888">words 每列是独立字符池；选列严格递增 → 加法原理拆分为子结构</text>

  <!-- ===== Words 矩阵 ===== -->
  <text x="40" y="74" font-size="12" fill="#446688" font-weight="bold">words 矩阵（行 = 单词，列 = 字符位置）</text>

  <g font-size="10" fill="#888">
    <text x="170" y="92" text-anchor="middle">col 0</text>
    <text x="230" y="92" text-anchor="middle">col 1</text>
    <text x="290" y="92" text-anchor="middle">col 2</text>
    <text x="350" y="92" text-anchor="middle">col 3</text>
  </g>

  <text x="120" y="115" text-anchor="end" font-size="11" fill="#446688" font-weight="bold">w0</text>
  <g filter="url(#rough2)">
    <rect x="142" y="98" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="170" y="117" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
    <rect x="202" y="98" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="230" y="117" text-anchor="middle" font-size="13" fill="#333">c</text>
    <rect x="262" y="98" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="290" y="117" text-anchor="middle" font-size="13" fill="#333">c</text>
    <rect x="322" y="98" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="350" y="117" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  </g>

  <text x="120" y="145" text-anchor="end" font-size="11" fill="#446688" font-weight="bold">w1</text>
  <g filter="url(#rough2)">
    <rect x="142" y="128" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="170" y="147" text-anchor="middle" font-size="13" fill="#333">b</text>
    <rect x="202" y="128" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="230" y="147" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
    <rect x="262" y="128" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="290" y="147" text-anchor="middle" font-size="13" fill="#333">b</text>
    <rect x="322" y="128" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="350" y="147" text-anchor="middle" font-size="13" fill="#333">b</text>
  </g>

  <text x="120" y="175" text-anchor="end" font-size="11" fill="#446688" font-weight="bold">w2</text>
  <g filter="url(#rough2)">
    <rect x="142" y="158" width="56" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="170" y="177" text-anchor="middle" font-size="13" fill="#333">c</text>
    <rect x="202" y="158" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="230" y="177" text-anchor="middle" font-size="13" fill="#333">c</text>
    <rect x="262" y="158" width="56" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="290" y="177" text-anchor="middle" font-size="13" fill="#333">c</text>
    <rect x="322" y="158" width="56" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4"/>
    <text x="350" y="177" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  </g>

  <!-- 一组有效选列示意 -->
  <rect x="410" y="96" width="170" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="495" y="116" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">target = "aba"</text>
  <text x="495" y="132" text-anchor="middle" font-size="10" fill="#888">选列 0 → 1 → 3（递增）</text>
  <text x="425" y="150" font-size="10" fill="#444">target[0]='a' ← col0·w0</text>
  <text x="425" y="166" font-size="10" fill="#444">target[1]='b' ← col1·w1</text>
  <text x="425" y="182" font-size="10" fill="#444">target[2]='a' ← col3·w2</text>

  <!-- 选列箭头 -->
  <path d="M 170 188 Q 200 210 230 96" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3 2" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <path d="M 230 188 Q 290 220 350 158" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3 2" marker-end="url(#arrRed)" filter="url(#rough2)"/>

  <!-- ===== 列频次表 cnt[j][c] ===== -->
  <text x="40" y="220" font-size="12" fill="#4a7a3a" font-weight="bold">列频次表 cnt[j][c]：第 j 列中字符 c 出现的单词数</text>

  <g filter="url(#rough2)" font-size="11" fill="#555" font-weight="bold">
    <rect x="40" y="230" width="360" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="3"/>
    <text x="80" y="247" text-anchor="middle">j</text>
    <text x="170" y="247" text-anchor="middle">cnt[j]['a']</text>
    <text x="270" y="247" text-anchor="middle">cnt[j]['b']</text>
    <text x="360" y="247" text-anchor="middle">cnt[j]['c']</text>
  </g>

  <g filter="url(#rough2)" font-size="11" fill="#333">
    <rect x="40" y="254" width="360" height="22" fill="#fafafa" stroke="#ddd" stroke-width="0.8" rx="2"/>
    <text x="80" y="270" text-anchor="middle">0</text>
    <text x="170" y="270" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <text x="270" y="270" text-anchor="middle">1</text>
    <text x="360" y="270" text-anchor="middle">1</text>

    <rect x="40" y="276" width="360" height="22" fill="#fff" stroke="#ddd" stroke-width="0.8" rx="2"/>
    <text x="80" y="292" text-anchor="middle">1</text>
    <text x="170" y="292" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <text x="270" y="292" text-anchor="middle">1</text>
    <text x="360" y="292" text-anchor="middle">1</text>

    <rect x="40" y="298" width="360" height="22" fill="#fafafa" stroke="#ddd" stroke-width="0.8" rx="2"/>
    <text x="80" y="314" text-anchor="middle">2</text>
    <text x="170" y="314" text-anchor="middle" fill="#888">0</text>
    <text x="270" y="314" text-anchor="middle">1</text>
    <text x="360" y="314" text-anchor="middle">2</text>

    <rect x="40" y="320" width="360" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2"/>
    <text x="80" y="336" text-anchor="middle">3</text>
    <text x="170" y="336" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <text x="270" y="336" text-anchor="middle">1</text>
    <text x="360" y="336" text-anchor="middle" fill="#888">0</text>
  </g>

  <text x="415" y="282" font-size="10" fill="#b85450" font-weight="bold">↑ 红色 = target</text>
  <text x="415" y="298" font-size="10" fill="#b85450">  字符的可用计数</text>
  <text x="415" y="318" font-size="10" fill="#888">col2 无 'a' → cnt=0</text>
  <text x="415" y="334" font-size="10" fill="#888">col3 有 2 个 'a'</text>

  <!-- ===== DP 递推公式 ===== -->
  <rect x="40" y="360" width="540" height="68" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="56" y="382" font-size="12" fill="#4a7a3a" font-weight="bold">DP 状态：dp[i][j] = 用前 j 列构造 target[0..i−1] 的方案数</text>
  <text x="56" y="402" font-size="11" fill="#333">递推：dp[i][j] = dp[i][j−1]  ＋  dp[i−1][j−1] × cnt[j−1][target[i−1]]</text>
  <text x="56" y="420" font-size="10" fill="#888">① 不用第 j−1 列（跳过）          ② 用第 j−1 列匹配 target[i−1]（乘法原理）</text>
</svg>
