<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="640" height="420" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">arguments 对象 vs 剩余参数 ...args</text>

  <!-- ===== LEFT: arguments object (legacy) ===== -->
  <rect x="30" y="50" width="280" height="340" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" rx="10" filter="url(#rough2)"/>
  <text x="170" y="74" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">function() { ... arguments }</text>
  <text x="170" y="92" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">(老式，箭头函数里不可用)</text>

  <!-- arguments object as key-value map -->
  <rect x="60" y="108" width="220" height="150" fill="#fafafa" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="170" y="126" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">arguments (类数组对象)</text>

  <text x="80" y="146" font-size="11" fill="#333" filter="url(#rough2)">0: 5</text>
  <text x="80" y="164" font-size="11" fill="#333" filter="url(#rough2)">1: "hi"</text>
  <text x="80" y="182" font-size="11" fill="#333" filter="url(#rough2)">2: null</text>
  <text x="80" y="200" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">length: 3</text>
  <text x="80" y="218" font-size="9" fill="#888" filter="url(#rough2)">Symbol.iterator: ...</text>
  <text x="80" y="236" font-size="9" fill="#888" filter="url(#rough2)">callee: fn 自身</text>

  <!-- no array methods -->
  <rect x="60" y="272" width="220" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="170" y="288" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠ 不是真正的 Array</text>
  <text x="170" y="304" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">无 .map / .filter / .reduce / .pop ...</text>

  <rect x="60" y="328" width="220" height="40" fill="#fafafa" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="170" y="346" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">arguments.length  → 3 ✓ (本题可用)</text>
  <text x="170" y="360" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">但用数组方法须 Array.from(arguments)</text>

  <!-- ===== RIGHT: rest params (modern) ===== -->
  <rect x="330" y="50" width="280" height="340" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="6 4" rx="10" filter="url(#rough2)"/>
  <text x="470" y="74" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">function(...args) { ... args }</text>
  <text x="470" y="92" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">(ES6+，箭头函数可用)</text>

  <!-- args as real array -->
  <rect x="360" y="108" width="220" height="150" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="470" y="126" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">args (真正的 Array)</text>

  <text x="380" y="146" font-size="11" fill="#333" filter="url(#rough2)">[0] = 5</text>
  <text x="380" y="164" font-size="11" fill="#333" filter="url(#rough2)">[1] = "hi"</text>
  <text x="380" y="182" font-size="11" fill="#333" filter="url(#rough2)">[2] = null</text>
  <text x="380" y="200" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">length = 3</text>
  <text x="380" y="218" font-size="9" fill="#888" filter="url(#rough2)">原型 = Array.prototype</text>
  <text x="380" y="236" font-size="9" fill="#888" filter="url(#rough2)">无 callee</text>

  <!-- has array methods -->
  <rect x="360" y="272" width="220" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="470" y="288" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓ 真正的 Array 实例</text>
  <text x="470" y="304" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">自带 .map / .filter / .reduce / .pop ...</text>

  <rect x="360" y="328" width="220" height="40" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="470" y="346" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">args.length  → 3 ✓ (推荐写法)</text>
  <text x="470" y="360" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">直接用数组方法，无需转换</text>

  <!-- VS divider -->
  <circle cx="320" cy="200" r="18" fill="#fafafa" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="320" y="205" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">VS</text>

  <!-- bottom note -->
  <rect x="30" y="398" width="580" height="0" fill="none"/>
  <text x="320" y="410" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">两者都有 .length（本题都行），但 ...args 是真数组——现代 JS 统一推荐剩余参数</text>
</svg>
