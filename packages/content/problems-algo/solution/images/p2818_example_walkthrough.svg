<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="28" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">
    示例 2 贪心分配过程
  </text>
  <text x="260" y="48" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">
    nums = [19, 12, 14, 6, 10, 18]，k = 3
  </text>

  <!-- Sort by value desc: 19(i=0), 18(i=5), 14(i=2), 12(i=1), 10(i=4), 6(i=3) -->
  <!-- Row 1: sorted elements with ranges -->
  <text x="30" y="78" font-size="11" fill="#666" filter="url(#rough2)">按值↓</text>
  <rect x="70" y="62" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="82" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">19</text>
  <rect x="145" y="62" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="82" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">18</text>
  <rect x="220" y="62" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="255" y="82" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">14</text>
  <rect x="295" y="62" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="82" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">12</text>
  <rect x="370" y="62" width="70" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="405" y="82" text-anchor="middle" font-size="14" fill="#999" filter="url(#rough2)">10</text>

  <!-- ranges row -->
  <text x="30" y="110" font-size="11" fill="#666" filter="url(#rough2)">ranges</text>
  <text x="105" y="110" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="180" y="110" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">1</text>
  <text x="255" y="110" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">4</text>
  <text x="330" y="110" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">10</text>
  <text x="405" y="110" text-anchor="middle" font-size="13" fill="#999" filter="url(#rough2)">2</text>

  <!-- Round 1: pick 19, cnt=1, score=19 -->
  <rect x="65" y="128" width="80" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="105" y="146" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">① 选 19</text>
  <text x="105" y="162" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">cnt=min(1,3)=1</text>

  <!-- arrow -->
  <path d="M148,150 L178,150" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- score after round 1 -->
  <rect x="185" y="128" width="90" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="230" y="148" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">分数 = 19</text>
  <text x="230" y="164" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">剩余 k = 2</text>

  <!-- Round 2: pick 18, cnt=1, score=342 -->
  <rect x="65" y="188" width="80" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="105" y="206" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">② 选 18</text>
  <text x="105" y="222" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">cnt=min(1,2)=1</text>

  <path d="M148,210 L178,210" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="185" y="188" width="90" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="230" y="208" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">分数 = 342</text>
  <text x="230" y="224" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">剩余 k = 1</text>

  <!-- Round 3: pick 14, cnt=1, score=4788 -->
  <rect x="65" y="248" width="80" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="105" y="266" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">③ 选 14</text>
  <text x="105" y="282" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">cnt=min(4,1)=1</text>

  <path d="M148,270 L178,270" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="185" y="248" width="90" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="230" y="268" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">分数 = 4788</text>
  <text x="230" y="284" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">剩余 k = 0</text>

  <!-- Note: 12 has ranges=10 but value smaller -->
  <rect x="300" y="188" width="190" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="395" y="210" text-anchor="middle" font-size="12" fill="#d6a040" filter="url(#rough2)">⚠️ 12 的 ranges=10</text>
  <text x="395" y="228" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">但值不是最大的</text>
  <text x="395" y="244" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">14 先用掉最后 1 次</text>

  <!-- Final answer -->
  <rect x="130" y="315" width="260" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="341" text-anchor="middle" font-size="18" fill="#4a7a3a" filter="url(#rough2)">
    输出：4788 ✓
  </text>

  <!-- Color legend -->
  <rect x="40" y="365" width="18" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="64" y="376" font-size="10" fill="#333" filter="url(#rough2)">选中操作</text>
  <rect x="140" y="365" width="18" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="164" y="376" font-size="10" fill="#333" filter="url(#rough2)">分数状态</text>
  <rect x="240" y="365" width="18" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="264" y="376" font-size="10" fill="#333" filter="url(#rough2)">注意点</text>
</svg>
