<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="360" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">四状态机：买1 → 卖1 → 买2 → 卖2</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">至多两笔交易 = 4 个状态线性递进，每个状态只依赖前一个</text>

  <!-- ===== buy1 ===== -->
  <rect x="40" y="130" width="95" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="87" y="155" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">buy1</text>
  <text x="87" y="173" text-anchor="middle" font-size="9" fill="#b85450">第1笔·持有</text>

  <!-- ===== sell1 ===== -->
  <rect x="190" y="130" width="95" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="237" y="155" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">sell1</text>
  <text x="237" y="173" text-anchor="middle" font-size="9" fill="#446688">第1笔·空仓</text>

  <!-- ===== buy2 ===== -->
  <rect x="340" y="130" width="95" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="387" y="155" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">buy2</text>
  <text x="387" y="173" text-anchor="middle" font-size="9" fill="#b85450">第2笔·持有</text>

  <!-- ===== sell2 ===== -->
  <rect x="490" y="130" width="95" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="537" y="155" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">sell2</text>
  <text x="537" y="173" text-anchor="middle" font-size="9" fill="#4a7a3a">第2笔·空仓</text>

  <!-- ===== start -> buy1 ===== -->
  <text x="22" y="120" text-anchor="middle" font-size="9" fill="#888">起始</text>
  <path d="M 22 130 L 38 159" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>

  <!-- ===== buy1 -> sell1 : 卖出 +p ===== -->
  <path d="M 135 155 L 188 155" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <rect x="142" y="136" width="42" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="163" y="149" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">卖+p</text>

  <!-- ===== sell1 -> buy2 : 买入 -p ===== -->
  <path d="M 285 155 L 338 155" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrg)" filter="url(#rough2)"/>
  <rect x="290" y="136" width="42" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="311" y="149" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">买−p</text>

  <!-- ===== buy2 -> sell2 : 卖出 +p ===== -->
  <path d="M 435 155 L 488 155" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <rect x="442" y="136" width="42" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="463" y="149" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">卖+p</text>

  <!-- ===== self-loops (rest) ===== -->
  <path d="M 60 130 C 40 108, 70 100, 87 122" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="55" y="102" text-anchor="middle" font-size="8" fill="#999">持有</text>

  <path d="M 210 130 C 190 108, 220 100, 237 122" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="205" y="102" text-anchor="middle" font-size="8" fill="#999">空仓</text>

  <path d="M 360 130 C 340 108, 370 100, 387 122" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="355" y="102" text-anchor="middle" font-size="8" fill="#999">持有</text>

  <path d="M 510 130 C 490 108, 520 100, 537 122" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="505" y="102" text-anchor="middle" font-size="8" fill="#999">空仓</text>

  <!-- ===== answer note ===== -->
  <text x="537" y="205" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">↓ 答案</text>

  <!-- ===== transfer equations ===== -->
  <line x1="30" y1="230" x2="570" y2="230" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="252" font-size="11" fill="#444" font-weight="bold">转移方程（每天依次更新，取「保持 / 跳入」较大值）：</text>
  <g font-size="10" fill="#333">
    <text x="70" y="274" fill="#b85450">buy1  = max(buy1,  −p)</text>
    <text x="70" y="292" fill="#446688">sell1 = max(sell1, buy1 + p)</text>
    <text x="70" y="310" fill="#b85450">buy2  = max(buy2,  sell1 − p)</text>
    <text x="70" y="328" fill="#4a7a3a">sell2 = max(sell2, buy2 + p)</text>
  </g>

  <!-- ===== right-side notes ===== -->
  <rect x="330" y="256" width="240" height="82" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="345" y="274" font-size="9" fill="#888">初值：buy1 = buy2 = −∞</text>
  <text x="345" y="290" font-size="9" fill="#888">　　　sell1 = sell2 = 0</text>
  <text x="345" y="310" font-size="9" fill="#8a6a20">同日买卖收益为 0，不影</text>
  <text x="345" y="324" font-size="9" fill="#8a6a20">响最优值 → 无需快照</text>
</svg>
