<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">核心概念：定长分组 + 末组填充（s="abcdefghij", k=3, fill='x'）</text>

  <!-- ====== Row 1: original string n=10 ====== -->
  <text x="50" y="62" font-size="11" fill="#446688" font-weight="bold">原字符串 s（n=10）</text>

  <!-- 10 char boxes, 36px each, start x=100 -->
  <rect x="100" y="70" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="118" y="94" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>
  <rect x="136" y="70" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="154" y="94" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">b</text>
  <rect x="172" y="70" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="94" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">c</text>

  <rect x="208" y="70" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="226" y="94" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">d</text>
  <rect x="244" y="70" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="262" y="94" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">e</text>
  <rect x="280" y="70" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="298" y="94" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">f</text>

  <rect x="316" y="70" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="334" y="94" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">g</text>
  <rect x="352" y="70" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="94" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">h</text>
  <rect x="388" y="70" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="406" y="94" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">i</text>

  <rect x="424" y="70" width="36" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="442" y="94" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">j</text>

  <!-- group boundary dashed lines (between groups, every k=3) -->
  <path d="M 208 60 L 208 114" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 316 60 L 316 114" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <path d="M 424 60 L 424 114" stroke="#b85450" stroke-width="1.4" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- index labels below -->
  <text x="118" y="126" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="190" y="126" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="262" y="126" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="298" y="126" text-anchor="middle" font-size="9" fill="#888">5</text>
  <text x="370" y="126" text-anchor="middle" font-size="9" fill="#888">6</text>
  <text x="406" y="126" text-anchor="middle" font-size="9" fill="#888">8</text>
  <text x="442" y="126" text-anchor="middle" font-size="9" fill="#888">9</text>

  <!-- arrow down -->
  <path d="M 280 138 L 280 156" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="296" y="152" font-size="10" fill="#446688">按 k=3 切分</text>

  <!-- ====== Row 2: 4 groups with gaps, last group padded ====== -->
  <text x="50" y="178" font-size="11" fill="#4a7a3a" font-weight="bold">分组结果（4 组）</text>

  <!-- Group 1: abc at x=46,82,118 -->
  <rect x="46" y="186" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="64" y="210" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">a</text>
  <rect x="82" y="186" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="100" y="210" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">b</text>
  <rect x="118" y="186" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="136" y="210" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">c</text>
  <text x="100" y="238" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">第 1 组</text>

  <!-- Group 2: def at x=166,202,238 -->
  <rect x="166" y="186" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="184" y="210" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">d</text>
  <rect x="202" y="186" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="220" y="210" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">e</text>
  <rect x="238" y="186" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="256" y="210" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">f</text>
  <text x="220" y="238" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">第 2 组</text>

  <!-- Group 3: ghi at x=286,322,358 -->
  <rect x="286" y="186" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="304" y="210" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">g</text>
  <rect x="322" y="186" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="340" y="210" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">h</text>
  <rect x="358" y="186" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="376" y="210" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">i</text>
  <text x="340" y="238" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">第 3 组</text>

  <!-- Group 4: jxx at x=406,442,478 — j is real, xx is fill -->
  <rect x="406" y="186" width="36" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="424" y="210" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">j</text>
  <rect x="442" y="186" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="460" y="210" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">x</text>
  <rect x="478" y="186" width="36" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="496" y="210" text-anchor="middle" font-size="15" fill="#d6a040" font-weight="bold">x</text>
  <text x="460" y="238" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">第 4 组（末组填充）</text>

  <!-- bracket + fill annotation -->
  <path d="M 442 250 L 442 256 L 514 256 L 514 250" stroke="#d6a040" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="478" y="270" text-anchor="middle" font-size="10" fill="#d6a040">fill 补 k−1=2 个</text>

  <!-- ====== Formula box ====== -->
  <rect x="60" y="290" width="440" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="312" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">组数 = ⌈n / k⌉ = ⌈10 / 3⌉ = 4</text>
  <text x="280" y="332" text-anchor="middle" font-size="11" fill="#555">末组剩余 r = n mod k = 1 个字符 → 需补 (k − r) = 2 个 fill</text>
  <text x="280" y="350" text-anchor="middle" font-size="10" fill="#888">若 n mod k = 0，末组刚好 k 个，无需填充</text>
</svg>
