<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">二维费用 0-1 背包：双层倒序更新</text>

  <!-- 初始化 -->
  <rect x="170" y="48" width="240" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="71" text-anchor="middle" font-size="12" fill="#333">dp[0..m][0..n] = 0</text>

  <path d="M 290 84 L 290 100" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 遍历字符串 -->
  <polygon points="290,102 410,146 290,190 170,146" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="142" text-anchor="middle" font-size="12" fill="#333">还有未处理的 str？</text>
  <text x="290" y="160" text-anchor="middle" font-size="11" fill="#888">每串只用一次</text>

  <path d="M 290 190 L 290 208" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="302" y="204" font-size="10" fill="#82b366">是</text>

  <!-- 统计 0/1 -->
  <rect x="150" y="212" width="280" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="230" text-anchor="middle" font-size="12" fill="#333">统计本串 z = 0 的个数, o = 1 的个数</text>
  <text x="290" y="246" text-anchor="middle" font-size="11" fill="#888">z 与 o 即该物品的两种费用</text>

  <path d="M 290 252 L 290 268" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 双层倒序 -->
  <rect x="110" y="272" width="360" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="290" y="292" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">for j = m ↓ z :  for k = n ↓ o</text>
  <text x="290" y="312" text-anchor="middle" font-size="12" fill="#333">dp[j][k] = max( dp[j][k] , dp[j−z][k−o] + 1 )</text>

  <text x="470" y="300" font-size="10" fill="#b85450" font-weight="bold">两维</text>
  <text x="470" y="314" font-size="10" fill="#b85450" font-weight="bold">都倒序!</text>

  <path d="M 290 328 L 290 344" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 回到遍历 -->
  <path d="M 110 300 L 70 300 L 70 146 L 170 146" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="78" y="220" font-size="10" fill="#888">下一串</text>

  <!-- 结束 -->
  <path d="M 410 146 L 470 146 L 470 220" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="432" y="138" font-size="10" fill="#b85450">否</text>
  <rect x="410" y="224" width="120" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="470" y="246" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 dp[m][n]</text>

  <!-- 倒序说明 -->
  <rect x="90" y="372" width="400" height="52" fill="#f5f5f5" stroke="#bbb" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="290" y="392" text-anchor="middle" font-size="11" fill="#555">倒序保证 dp[j−z][k−o] 仍是上一轮旧值 → 每串只用一次</text>
  <text x="290" y="410" text-anchor="middle" font-size="11" fill="#555">若某一维升序，同一串会被重复选取，退化成完全背包</text>
</svg>
