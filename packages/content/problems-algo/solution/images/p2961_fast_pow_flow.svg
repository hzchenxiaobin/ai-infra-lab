<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：两段快速幂 + 逐下标比对</text>

  <!-- ===== 左列：主流程 ===== -->
  <ellipse cx="140" cy="46" rx="40" ry="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="51" text-anchor="middle" font-size="12" fill="#333">开始</text>

  <path d="M 140 61 L 140 74" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <rect x="40" y="78" width="200" height="36" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="140" y="92" text-anchor="middle" font-size="11.5" fill="#333">遍历 i = 0 … n−1</text>
  <text x="140" y="107" text-anchor="middle" font-size="11.5" fill="#333">取 [a, b, c, m]</text>

  <path d="M 140 114 L 140 126" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <rect x="40" y="130" width="200" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="149" text-anchor="middle" font-size="12" fill="#333">x = modpow(a, b, 10)</text>

  <path d="M 140 160 L 140 172" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <rect x="40" y="176" width="200" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="195" text-anchor="middle" font-size="12" fill="#333">y = modpow(x, c, m)</text>

  <path d="M 140 206 L 140 218" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <polygon points="140,222 216,246 140,270 64,246" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="250" text-anchor="middle" font-size="12" fill="#333">y == target ?</text>

  <path d="M 140 270 L 140 282" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)" marker-end="url(#arrg)"/>
  <text x="150" y="280" font-size="11" fill="#4a7a3a">是</text>

  <rect x="40" y="286" width="200" height="28" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="304" text-anchor="middle" font-size="11.5" fill="#333">ans.push_back(i)</text>

  <path d="M 140 314 L 140 324" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <rect x="40" y="328" width="200" height="26" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="140" y="345" text-anchor="middle" font-size="11.5" fill="#333">下一个 i（未完则回到取数）</text>

  <path d="M 216 246 L 258 246 L 258 341 L 242 341" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <text x="226" y="238" font-size="11" fill="#b85450">否</text>

  <path d="M 140 354 L 140 366" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)" marker-end="url(#arrb)"/>

  <ellipse cx="140" cy="381" rx="44" ry="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="140" y="386" text-anchor="middle" font-size="12" fill="#333">返回 ans</text>

  <!-- ===== 右栏：快速幂内部 ===== -->
  <text x="400" y="52" text-anchor="middle" font-size="12.5" fill="#555" font-weight="bold">快速幂 modpow(x, e, m) 内部</text>

  <text x="391" y="76" text-anchor="middle" font-size="11.5" fill="#333">e = 13 = 1101₂（二进制，高位在前）</text>

  <rect x="310" y="88" width="36" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="328" y="106" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="352" y="88" width="36" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="370" y="106" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="394" y="88" width="36" height="26" rx="4" fill="#f0f0f0" stroke="#999999" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="412" y="106" text-anchor="middle" font-size="13" fill="#888">0</text>
  <rect x="436" y="88" width="36" height="26" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="454" y="106" text-anchor="middle" font-size="13" fill="#333">1</text>

  <text x="328" y="130" text-anchor="middle" font-size="10.5" fill="#888">×8</text>
  <text x="370" y="130" text-anchor="middle" font-size="10.5" fill="#888">×4</text>
  <text x="412" y="130" text-anchor="middle" font-size="10.5" fill="#888">×2</text>
  <text x="454" y="130" text-anchor="middle" font-size="10.5" fill="#888">×1</text>

  <text x="398" y="154" text-anchor="middle" font-size="11.5" fill="#333">3¹³ = 3⁸ × 3⁴ × 3¹（bit=0 的 3² 跳过）</text>

  <rect x="300" y="168" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="187" text-anchor="middle" font-size="12" fill="#333">3</text>
  <path d="M 342 182 L 352 182" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <rect x="354" y="168" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="374" y="187" text-anchor="middle" font-size="12" fill="#333">3²</text>
  <path d="M 396 182 L 406 182" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <rect x="408" y="168" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="428" y="187" text-anchor="middle" font-size="12" fill="#333">3⁴</text>
  <path d="M 450 182 L 460 182" fill="none" stroke="#446688" stroke-width="1.5" filter="url(#rough2)" marker-end="url(#arrb)"/>
  <rect x="462" y="168" width="40" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="482" y="187" text-anchor="middle" font-size="12" fill="#333">3⁸</text>

  <text x="398" y="216" text-anchor="middle" font-size="10.5" fill="#888">底数自乘平方：3 → 9 → 81 → 6561</text>
  <text x="398" y="238" text-anchor="middle" font-size="11" fill="#333">4 次平方 + 3 次乘入（朴素需 12 次连乘）</text>

  <rect x="292" y="252" width="236" height="118" rx="8" fill="#fafafa" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="304" y="274" font-size="11" fill="#333">res = 1 % m ;  x %= m</text>
  <text x="304" y="294" font-size="11" fill="#333">while e &gt; 0:</text>
  <text x="312" y="312" font-size="11" fill="#333">if e &amp; 1: res = res·x % m</text>
  <text x="312" y="330" font-size="11" fill="#333">x = x·x % m ;  e &gt;&gt;= 1</text>
  <text x="304" y="348" font-size="11" fill="#333">return res</text>

  <text x="400" y="392" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">每轮指数折半 → O(log e) 次乘法</text>
</svg>
