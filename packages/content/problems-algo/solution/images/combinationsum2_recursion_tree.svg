<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.3"/>
    </filter>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a8e4a"/>
    </marker>
  </defs>
  <rect width="900" height="560" fill="#fdfcf7"/>
  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">组合总和 II：回溯树（示例 1）</text>
  <path d="M 280 42 Q 450 50 620 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="450" y="60" text-anchor="middle" font-size="12" fill="#888">排序后 candidates = [1,1,2,5,6,7,10]，target = 8</text>

  <!-- ===== ROOT ===== -->
  <g filter="url(#sk)"><rect x="395" y="74" width="110" height="30" rx="7" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/></g>
  <text x="450" y="94" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">rem=8  []</text>

  <!-- ===== LEVEL 1 ===== -->
  <!-- lines from root to L1 -->
  <path d="M 420 104 L 110 138" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 440 104 L 185 138" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 460 104 L 470 138" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 470 104 L 560 138" stroke="#999" stroke-width="1.1" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 480 104 L 650 138" stroke="#999" stroke-width="1.1" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 485 104 L 740 138" stroke="#999" stroke-width="1.1" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 490 104 L 820 138" stroke="#b85450" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- L1 nodes -->
  <g filter="url(#sk)"><rect x="78" y="138" width="64" height="26" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="110" y="156" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">[1] rem7</text>

  <g filter="url(#sk)"><rect x="153" y="138" width="64" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <text x="185" y="154" text-anchor="middle" font-size="10" fill="#b03a3a" font-weight="bold">idx1=1</text>
  <text x="185" y="164" text-anchor="middle" font-size="9" fill="#b03a3a">去重✗</text>

  <g filter="url(#sk)"><rect x="438" y="138" width="64" height="26" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="470" y="156" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">[2] rem6</text>

  <g filter="url(#sk)"><rect x="528" y="138" width="64" height="26" rx="5" fill="#f4f4f4" stroke="#999" stroke-width="1"/></g>
  <text x="560" y="156" text-anchor="middle" font-size="10" fill="#888">[5] rem3</text>

  <g filter="url(#sk)"><rect x="618" y="138" width="64" height="26" rx="5" fill="#f4f4f4" stroke="#999" stroke-width="1"/></g>
  <text x="650" y="156" text-anchor="middle" font-size="10" fill="#888">[6] rem2</text>

  <g filter="url(#sk)"><rect x="708" y="138" width="64" height="26" rx="5" fill="#f4f4f4" stroke="#999" stroke-width="1"/></g>
  <text x="740" y="156" text-anchor="middle" font-size="10" fill="#888">[7] rem1</text>

  <g filter="url(#sk)"><rect x="788" y="138" width="64" height="26" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="4 3"/></g>
  <text x="820" y="154" text-anchor="middle" font-size="10" fill="#b03a3a" font-weight="bold">idx6=10</text>
  <text x="820" y="164" text-anchor="middle" font-size="9" fill="#b03a3a">剪枝✗</text>

  <!-- ===== [1]-subtree (left) ===== -->
  <path d="M 95 164 L 60 214" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 115 164 L 160 214" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 130 164 L 250 214" stroke="#4a8e4a" stroke-width="1.4" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="20" y="214" width="80" height="26" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="60" y="232" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">[1,1] rem6</text>

  <g filter="url(#sk)"><rect x="120" y="214" width="80" height="26" rx="5" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.3"/></g>
  <text x="160" y="232" text-anchor="middle" font-size="10" fill="#2e6e2e" font-weight="bold">[1,2] rem5</text>

  <g filter="url(#sk)"><rect x="210" y="214" width="80" height="26" rx="5" fill="#d6efd6" stroke="#2e6e2e" stroke-width="1.8"/></g>
  <text x="250" y="232" text-anchor="middle" font-size="10" fill="#1f5a1f" font-weight="bold">[1,7] ✓</text>
  <text x="250" y="256" text-anchor="middle" font-size="9" fill="#1f5a1f">rem=0 → 答案</text>

  <text x="110" y="258" text-anchor="middle" font-size="9" fill="#888">idx3=5,idx4=6 → 剪枝/无解</text>

  <!-- Level3 under [1,1] and [1,2] -->
  <path d="M 60 240 L 60 290" stroke="#4a8e4a" stroke-width="1.4" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>
  <path d="M 160 240 L 160 290" stroke="#4a8e4a" stroke-width="1.4" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="15" y="290" width="90" height="26" rx="5" fill="#d6efd6" stroke="#2e6e2e" stroke-width="1.8"/></g>
  <text x="60" y="308" text-anchor="middle" font-size="10" fill="#1f5a1f" font-weight="bold">[1,1,6] ✓</text>

  <g filter="url(#sk)"><rect x="115" y="290" width="90" height="26" rx="5" fill="#d6efd6" stroke="#2e6e2e" stroke-width="1.8"/></g>
  <text x="160" y="308" text-anchor="middle" font-size="10" fill="#1f5a1f" font-weight="bold">[1,2,5] ✓</text>

  <text x="60" y="332" text-anchor="middle" font-size="9" fill="#888">idx2,3 剪枝</text>
  <text x="160" y="332" text-anchor="middle" font-size="9" fill="#888">idx4 剪枝</text>

  <!-- ===== [2]-subtree (right) ===== -->
  <path d="M 455 164 L 430 214" stroke="#999" stroke-width="1.1" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 480 164 L 520 214" stroke="#4a8e4a" stroke-width="1.4" fill="none" marker-end="url(#arg)" filter="url(#sk)"/>

  <g filter="url(#sk)"><rect x="390" y="214" width="80" height="26" rx="5" fill="#f4f4f4" stroke="#999" stroke-width="1"/></g>
  <text x="430" y="232" text-anchor="middle" font-size="10" fill="#888">[2,5] rem1</text>

  <g filter="url(#sk)"><rect x="480" y="214" width="80" height="26" rx="5" fill="#d6efd6" stroke="#2e6e2e" stroke-width="1.8"/></g>
  <text x="520" y="232" text-anchor="middle" font-size="10" fill="#1f5a1f" font-weight="bold">[2,6] ✓</text>
  <text x="520" y="256" text-anchor="middle" font-size="9" fill="#1f5a1f">rem=0 → 答案</text>

  <text x="470" y="278" text-anchor="middle" font-size="9" fill="#888">idx5=7, idx6=10 → 剪枝( &gt; rem )</text>

  <!-- collapsed non-answer L1 branches note -->
  <g filter="url(#sk2)"><rect x="540" y="270" width="320" height="76" rx="7" fill="#fff" stroke="#bbb" stroke-width="1" stroke-dasharray="4 3"/></g>
  <text x="700" y="292" text-anchor="middle" font-size="11" font-weight="bold" fill="#666">[5]/[6]/[7] 开头的分支</text>
  <text x="560" y="312" font-size="10" fill="#888">• rem 不足以再选更大元素</text>
  <text x="560" y="328" font-size="10" fill="#888">• 排序后直接 break 剪枝，无答案</text>

  <!-- ===== legend + answer ===== -->
  <g font-size="10" fill="#666">
    <g filter="url(#sk)"><rect x="40" y="380" width="14" height="14" rx="3" fill="#d6efd6" stroke="#2e6e2e" stroke-width="1.4"/></g>
    <text x="60" y="391">= 命中答案</text>
    <g filter="url(#sk)"><rect x="150" y="380" width="14" height="14" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3 2"/></g>
    <text x="170" y="391">= 去重 / 剪枝</text>
    <g filter="url(#sk)"><rect x="270" y="380" width="14" height="14" rx="3" fill="#f4f4f4" stroke="#999" stroke-width="1"/></g>
    <text x="290" y="391">= 无解分支</text>
  </g>

  <g filter="url(#sk)"><rect x="40" y="416" width="820" height="118" rx="9" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="450" y="442" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e6e2e">最终答案（4 个组合）</text>
  <g font-size="13" fill="#1f5a1f" font-weight="bold">
    <g filter="url(#sk)"><rect x="90" y="458" width="150" height="34" rx="6" fill="#fff" stroke="#4a8e4a" stroke-width="1.2"/></g>
    <text x="165" y="480" text-anchor="middle">[1, 1, 6]</text>
    <g filter="url(#sk)"><rect x="270" y="458" width="150" height="34" rx="6" fill="#fff" stroke="#4a8e4a" stroke-width="1.2"/></g>
    <text x="345" y="480" text-anchor="middle">[1, 2, 5]</text>
    <g filter="url(#sk)"><rect x="450" y="458" width="150" height="34" rx="6" fill="#fff" stroke="#4a8e4a" stroke-width="1.2"/></g>
    <text x="525" y="480" text-anchor="middle">[1, 7]</text>
    <g filter="url(#sk)"><rect x="630" y="458" width="150" height="34" rx="6" fill="#fff" stroke="#4a8e4a" stroke-width="1.2"/></g>
    <text x="705" y="480" text-anchor="middle">[2, 6]</text>
  </g>
  <text x="450" y="516" text-anchor="middle" font-size="10" fill="#888">每个元素最多用一次 → 递归从 i+1 开始；同层相邻相同值跳过 → 不产生重复组合</text>
</svg>
