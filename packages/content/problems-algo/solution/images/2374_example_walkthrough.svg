<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arrGr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#aaa"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="620" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1：edges=[1,0,0,0,0,7,7,5] → 每个 i 把编号投进 edges[i] 桶</text>

  <!-- ARROWS : source i (y=75) -> target bucket (y=200) -->
  <g filter="url(#rough2)">
    <!-- i=0 (x65) -> bucket1 (x135) : gray, contributes 0 -->
    <line x1="65" y1="75" x2="135" y2="200" stroke="#aaa" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrGr)"/>
    <!-- i=1 (x135) -> bucket0 (x65) : green -->
    <line x1="135" y1="75" x2="65" y2="200" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)"/>
    <!-- i=2 (x205) -> bucket0 (x65) : green -->
    <line x1="205" y1="75" x2="65" y2="200" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)"/>
    <!-- i=3 (x275) -> bucket0 (x65) : green -->
    <line x1="275" y1="75" x2="65" y2="200" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)"/>
    <!-- i=4 (x345) -> bucket0 (x65) : green -->
    <line x1="345" y1="75" x2="65" y2="200" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)"/>
    <!-- i=5 (x415) -> bucket7 (x555) : red -->
    <line x1="415" y1="75" x2="555" y2="200" stroke="#b85450" stroke-width="1.7" marker-end="url(#arrR)"/>
    <!-- i=6 (x485) -> bucket7 (x555) : red -->
    <line x1="485" y1="75" x2="555" y2="200" stroke="#b85450" stroke-width="1.7" marker-end="url(#arrR)"/>
    <!-- i=7 (x555) -> bucket5 (x415) : orange -->
    <line x1="555" y1="75" x2="415" y2="200" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arrO)"/>
  </g>

  <!-- SOURCE nodes row (i = 0..7) -->
  <text x="30" y="65" font-size="11" fill="#888" font-weight="bold">源 i</text>
  <g filter="url(#rough2)">
    <circle cx="65"  cy="60" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <text x="65"  y="65" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
    <circle cx="135" cy="60" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <text x="135" y="65" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
    <circle cx="205" cy="60" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <text x="205" y="65" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
    <circle cx="275" cy="60" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <text x="275" y="65" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
    <circle cx="345" cy="60" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <text x="345" y="65" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
    <circle cx="415" cy="60" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <text x="415" y="65" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
    <circle cx="485" cy="60" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <text x="485" y="65" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">6</text>
    <circle cx="555" cy="60" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.3"/>
    <text x="555" y="65" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">7</text>
  </g>

  <!-- "scatter" hint in the middle -->
  <text x="310" y="150" text-anchor="middle" font-size="11" fill="#888" font-style="italic">edges[i] 决定 i 投进哪个桶（一次散射，每源恰一次）</text>

  <!-- BUCKET row : score[0..7], final values -->
  <text x="22" y="226" font-size="11" fill="#888" font-weight="bold">score</text>
  <g filter="url(#rough2)">
    <!-- bucket 0 : 1+2+3+4=10 (green) -->
    <rect x="38" y="200" width="54" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="5"/>
    <text x="65" y="218" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">1+2+3+4</text>
    <text x="65" y="236" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">10</text>

    <!-- bucket 1 : 0 (gray) -->
    <rect x="108" y="200" width="54" height="44" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="5"/>
    <text x="135" y="218" text-anchor="middle" font-size="10" fill="#999">←0</text>
    <text x="135" y="236" text-anchor="middle" font-size="13" fill="#999">0</text>

    <!-- bucket 2,3,4 : 0 -->
    <rect x="178" y="200" width="54" height="44" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="5"/>
    <text x="205" y="228" text-anchor="middle" font-size="13" fill="#bbb">0</text>
    <rect x="248" y="200" width="54" height="44" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="5"/>
    <text x="275" y="228" text-anchor="middle" font-size="13" fill="#bbb">0</text>
    <rect x="318" y="200" width="54" height="44" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="5"/>
    <text x="345" y="228" text-anchor="middle" font-size="13" fill="#bbb">0</text>

    <!-- bucket 5 : 7 (orange, from node 7) -->
    <rect x="388" y="200" width="54" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="5"/>
    <text x="415" y="218" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">←7</text>
    <text x="415" y="236" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">7</text>

    <!-- bucket 6 : 0 -->
    <rect x="458" y="200" width="54" height="44" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="5"/>
    <text x="485" y="228" text-anchor="middle" font-size="13" fill="#bbb">0</text>

    <!-- bucket 7 : 5+6=11 (red, MAX) -->
    <rect x="528" y="200" width="54" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="5"/>
    <text x="555" y="218" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">5+6</text>
    <text x="555" y="237" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">11 ★</text>
  </g>

  <!-- index labels under buckets -->
  <g filter="url(#rough2)">
    <text x="65"  y="262" text-anchor="middle" font-size="10" fill="#888">桶0</text>
    <text x="135" y="262" text-anchor="middle" font-size="10" fill="#888">桶1</text>
    <text x="205" y="262" text-anchor="middle" font-size="10" fill="#888">桶2</text>
    <text x="275" y="262" text-anchor="middle" font-size="10" fill="#888">桶3</text>
    <text x="345" y="262" text-anchor="middle" font-size="10" fill="#888">桶4</text>
    <text x="415" y="262" text-anchor="middle" font-size="10" fill="#888">桶5</text>
    <text x="485" y="262" text-anchor="middle" font-size="10" fill="#888">桶6</text>
    <text x="555" y="262" text-anchor="middle" font-size="10" fill="#888">桶7</text>
  </g>

  <!-- argmax arrow + result -->
  <path d="M 555 266 L 555 282" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="360" y="284" width="240" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="480" y="304" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">argmax = 7（score[7]=11 最高）</text>

  <!-- example 2 note -->
  <rect x="30" y="324" width="560" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="310" y="342" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">示例 2：edges=[2,0,0,2] ⇒ score[0]=1+2=3，score[2]=0+3=3</text>
  <text x="310" y="358" text-anchor="middle" font-size="11" fill="#6688aa">并列 3，严格大于不更新 ⇒ ans 保留更小的 0</text>
</svg>
