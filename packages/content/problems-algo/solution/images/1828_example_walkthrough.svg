<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：points = [[1,3],[3,3],[5,3],[2,2]]</text>

  <!-- Column headers -->
  <!-- Label cell -->
  <rect x="20" y="44" width="110" height="40" fill="#f0f0f0" stroke="#aaa" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="69" text-anchor="middle" font-size="11" fill="#666">queries[j]</text>

  <!-- Point headers -->
  <rect x="140" y="44" width="70" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="175" y="62" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">[1,3]</text>
  <text x="175" y="77" text-anchor="middle" font-size="9" fill="#888">P₀</text>

  <rect x="220" y="44" width="70" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="255" y="62" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">[3,3]</text>
  <text x="255" y="77" text-anchor="middle" font-size="9" fill="#888">P₁</text>

  <rect x="300" y="44" width="70" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="335" y="62" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">[5,3]</text>
  <text x="335" y="77" text-anchor="middle" font-size="9" fill="#888">P₂</text>

  <rect x="380" y="44" width="70" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="415" y="62" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">[2,2]</text>
  <text x="415" y="77" text-anchor="middle" font-size="9" fill="#888">P₃</text>

  <!-- Count header -->
  <rect x="460" y="44" width="80" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="500" y="69" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">count</text>

  <!-- Row 1: query [2,3,1], r²=1 -->
  <rect x="20" y="94" width="110" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="113" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">[2, 3, 1]</text>
  <text x="75" y="130" text-anchor="middle" font-size="9" fill="#888">r² = 1</text>

  <!-- d² values: 1, 1, 9, 1 -->
  <rect x="140" y="94" width="70" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="175" y="116" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="175" y="133" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>

  <rect x="220" y="94" width="70" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="255" y="116" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="255" y="133" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>

  <rect x="300" y="94" width="70" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="335" y="116" text-anchor="middle" font-size="11" fill="#333">9</text>
  <text x="335" y="133" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✗</text>

  <rect x="380" y="94" width="70" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="415" y="116" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="415" y="133" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>

  <rect x="460" y="94" width="80" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="500" y="124" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold">3</text>

  <!-- Row 2: query [4,3,1], r²=1 -->
  <rect x="20" y="152" width="110" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="171" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">[4, 3, 1]</text>
  <text x="75" y="188" text-anchor="middle" font-size="9" fill="#888">r² = 1</text>

  <!-- d² values: 9, 1, 1, 5 -->
  <rect x="140" y="152" width="70" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="175" y="174" text-anchor="middle" font-size="11" fill="#333">9</text>
  <text x="175" y="191" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✗</text>

  <rect x="220" y="152" width="70" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="255" y="174" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="255" y="191" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>

  <rect x="300" y="152" width="70" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="335" y="174" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="335" y="191" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>

  <rect x="380" y="152" width="70" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="415" y="174" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="415" y="191" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✗</text>

  <rect x="460" y="152" width="80" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="500" y="182" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- Row 3: query [1,1,2], r²=4 -->
  <rect x="20" y="210" width="110" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="75" y="229" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">[1, 1, 2]</text>
  <text x="75" y="246" text-anchor="middle" font-size="9" fill="#888">r² = 4</text>

  <!-- d² values: 4, 8, 20, 2 -->
  <rect x="140" y="210" width="70" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="175" y="232" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="175" y="249" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>

  <rect x="220" y="210" width="70" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="255" y="232" text-anchor="middle" font-size="11" fill="#333">8</text>
  <text x="255" y="249" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✗</text>

  <rect x="300" y="210" width="70" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="335" y="232" text-anchor="middle" font-size="11" fill="#333">20</text>
  <text x="335" y="249" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✗</text>

  <rect x="380" y="210" width="70" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="415" y="232" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="415" y="249" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>

  <rect x="460" y="210" width="80" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="500" y="240" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- Computation hint for row 3 (example) -->
  <text x="300" y="278" text-anchor="middle" font-size="10" fill="#888">以 queries[2] 为例：d² = (px−1)² + (py−1)²，r² = 4</text>
  <text x="300" y="294" text-anchor="middle" font-size="10" fill="#888">P₀: 0+4=4 ✓　 P₁: 4+4=8 ✗　 P₂: 16+4=20 ✗　 P₃: 1+1=2 ✓</text>

  <!-- Answer box -->
  <rect x="150" y="316" width="300" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="338" text-anchor="middle" font-size="11" fill="#666">最终结果</text>
  <text x="300" y="358" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">answer = [3, 2, 2]</text>

  <!-- Legend -->
  <rect x="40" y="378" width="16" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="62" y="390" font-size="10" fill="#666">d² ≤ r² 在圆内</text>
  <rect x="160" y="378" width="16" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="182" y="390" font-size="10" fill="#666">d² &gt; r² 在圆外</text>
  <text x="300" y="390" font-size="10" fill="#888">每个单元格显示 d² 值，绿色=在圆内，红色=在圆外</text>
</svg>
