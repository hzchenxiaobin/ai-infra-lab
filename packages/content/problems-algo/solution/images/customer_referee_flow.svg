<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">执行流程：FROM → WHERE（三值逻辑）→ SELECT</text>

  <!-- Step 1: FROM -->
  <rect x="40" y="56" width="160" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="120" y="76" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① FROM Customer</text>
  <text x="120" y="92" text-anchor="middle" font-size="9" fill="#555">读取全部 6 行</text>

  <path d="M120 104 L120 124" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 2: WHERE -->
  <rect x="40" y="128" width="160" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="120" y="148" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">② WHERE</text>
  <text x="120" y="164" text-anchor="middle" font-size="9" fill="#333">referee_id != 2</text>
  <text x="120" y="178" text-anchor="middle" font-size="9" fill="#333">OR referee_id IS NULL</text>

  <path d="M120 192 L120 212" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- Step 3: SELECT -->
  <rect x="40" y="216" width="160" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="120" y="236" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">③ SELECT name</text>
  <text x="120" y="252" text-anchor="middle" font-size="9" fill="#555">输出 4 行姓名</text>

  <path d="M120 264 L120 286" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Output -->
  <rect x="50" y="290" width="140" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="120" y="306" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">结果（name）</text>
  <text x="120" y="320" text-anchor="middle" font-size="9" fill="#333">Will, Jane</text>
  <text x="120" y="334" text-anchor="middle" font-size="9" fill="#333">Bill, Zack</text>

  <!-- Truth table on right -->
  <text x="380" y="56" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">三值逻辑判定表（referee_id = r）</text>

  <rect x="240" y="66" width="280" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="268" y="80" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">r 值</text>
  <text x="338" y="80" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">r != 2</text>
  <text x="408" y="80" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">r IS NULL</text>
  <text x="488" y="80" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">OR 保留?</text>
  <line x1="296" y1="66" x2="296" y2="88" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="366" y1="66" x2="366" y2="88" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="448" y1="66" x2="448" y2="88" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Row 1: null -->
  <rect x="240" y="88" width="280" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="268" y="102" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">null</text>
  <text x="338" y="102" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">UNKNOWN</text>
  <text x="408" y="102" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">TRUE</text>
  <text x="488" y="102" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">✓ TRUE</text>
  <line x1="296" y1="88" x2="296" y2="108" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="366" y1="88" x2="366" y2="108" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="448" y1="88" x2="448" y2="108" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- Row 2: 1 -->
  <rect x="240" y="108" width="280" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="268" y="122" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="338" y="122" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">TRUE</text>
  <text x="408" y="122" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">FALSE</text>
  <text x="488" y="122" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">✓ TRUE</text>
  <line x1="296" y1="108" x2="296" y2="128" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="366" y1="108" x2="366" y2="128" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="448" y1="108" x2="448" y2="128" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- Row 3: 2 -->
  <rect x="240" y="128" width="280" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="268" y="142" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="338" y="142" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">FALSE</text>
  <text x="408" y="142" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">FALSE</text>
  <text x="488" y="142" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">✗ FALSE</text>
  <line x1="296" y1="128" x2="296" y2="148" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="366" y1="128" x2="366" y2="148" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>
  <line x1="448" y1="128" x2="448" y2="148" stroke="#446688" stroke-width="0.6" filter="url(#rough2)"/>

  <!-- Logic notes -->
  <rect x="240" y="166" width="280" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="380" y="184" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">三值逻辑关键规则</text>
  <text x="252" y="200" font-size="9" fill="#333">• NULL 与任何值用 !=,=,< 比较皆得 UNKNOWN</text>
  <text x="252" y="214" font-size="9" fill="#333">• WHERE 把 UNKNOWN 当作假（行被过滤）</text>
  <text x="252" y="228" font-size="9" fill="#333">• UNKNOWN OR TRUE = TRUE（IS NULL 救回 null 行）</text>
  <text x="252" y="240" font-size="9" fill="#333">• IS NULL 不走比较运算，直接返回 TRUE/FALSE</text>

  <!-- Mini execution order -->
  <rect x="240" y="254" width="280" height="100" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="380" y="272" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">SQL 逻辑执行顺序</text>
  <text x="252" y="290" font-size="9" fill="#333">FROM → WHERE → SELECT</text>
  <text x="252" y="306" font-size="9" fill="#555">① 先读 Customer 全表</text>
  <text x="252" y="320" font-size="9" fill="#555">② 逐行用 WHERE 三值逻辑判定</text>
  <text x="252" y="334" font-size="9" fill="#555">③ 留下的行输出 name 列</text>
  <text x="252" y="348" font-size="9" fill="#d6a040" font-weight="bold">无 JOIN / GROUP BY，单表过滤</text>
</svg>
