<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">
    示例演算：points = [[1,2,3],[1,5,1],[3,1,1]]
  </text>
  <text x="310" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">
    每行：points → leftMax / rightMax → 新 dp（红框 = 最优路径所选格）
  </text>

  <!-- Column headers -->
  <text x="40" y="78" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">r</text>
  <text x="128" y="78" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">points</text>
  <text x="262" y="78" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">leftMax</text>
  <text x="396" y="78" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">rightMax</text>
  <text x="556" y="78" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">new dp</text>

  <!-- ===== Row 0 ===== -->
  <text x="40" y="108" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">0</text>
  <!-- points [1,2,3] -->
  <rect x="92" y="92" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="110" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="130" y="92" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="110" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="168" y="92" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="110" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="240" y="110" font-size="10" fill="#aaa" filter="url(#rough2)">— 无 —</text>
  <text x="374" y="110" font-size="10" fill="#aaa" filter="url(#rough2)">— 无 —</text>
  <path d="M 478 105 L 506 105" stroke="#446688" stroke-width="1.5" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <!-- dp = points[0] -->
  <rect x="520" y="92" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="538" y="110" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="558" y="92" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="576" y="110" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="596" y="92" width="20" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="606" y="110" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>

  <line x1="20" y1="128" x2="620" y2="128" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- ===== Row 1 ===== -->
  <text x="40" y="160" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">1</text>
  <!-- points [1,5,1] -->
  <rect x="92" y="144" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="162" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="130" y="144" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="162" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <rect x="168" y="144" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="162" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <!-- leftMax [1,3,5] -->
  <rect x="226" y="144" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="244" y="162" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="264" y="144" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="282" y="162" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="302" y="144" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="162" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <!-- rightMax [1,1,1] -->
  <rect x="360" y="144" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="378" y="162" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="398" y="144" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="416" y="162" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="436" y="144" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="454" y="162" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <path d="M 478 157 L 506 157" stroke="#446688" stroke-width="1.5" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <!-- new dp [2,7,4], highlight c1=7 -->
  <rect x="520" y="144" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="538" y="162" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="558" y="144" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="576" y="162" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">7</text>
  <rect x="596" y="144" width="20" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="606" y="162" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>

  <line x1="20" y1="180" x2="620" y2="180" stroke="#ddd" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- ===== Row 2 ===== -->
  <text x="40" y="212" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">2</text>
  <!-- points [3,1,1] -->
  <rect x="92" y="196" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="214" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <rect x="130" y="196" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="214" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <rect x="168" y="196" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="186" y="214" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <!-- leftMax [2,8,8] -->
  <rect x="226" y="196" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="244" y="214" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <rect x="264" y="196" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="282" y="214" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>
  <rect x="302" y="196" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="214" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>
  <!-- rightMax [6,6,2] -->
  <rect x="360" y="196" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="378" y="214" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <rect x="398" y="196" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="416" y="214" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <rect x="436" y="196" width="36" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="454" y="214" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <path d="M 478 209 L 506 209" stroke="#446688" stroke-width="1.5" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <!-- new dp [9,8,7], highlight c0=9 -->
  <rect x="520" y="196" width="36" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="538" y="214" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">9</text>
  <rect x="558" y="196" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="576" y="214" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>
  <rect x="596" y="196" width="20" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="606" y="214" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>

  <!-- path trace arrows between highlighted cells -->
  <path d="M 606 122 Q 590 132 576 144" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 576 174 Q 560 185 538 196" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- Answer box -->
  <rect x="120" y="252" width="380" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="310" y="274" text-anchor="middle" font-size="13" fill="#7a3a38" font-weight="bold" filter="url(#rough2)">
    最优路径：(0,2) → (1,1) → (2,0)
  </text>
  <text x="310" y="292" text-anchor="middle" font-size="12" fill="#7a3a38" filter="url(#rough2)">
    得分 = 3 + 5 + 3 − |2−1| − |1−0| = 11 − 2
  </text>
  <text x="310" y="312" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">
    答案 = 9 ⭐
  </text>

  <!-- verify c1 computation note -->
  <rect x="60" y="338" width="500" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="310" y="360" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">
    验证 r=1, c=1（取 points=5）
  </text>
  <text x="310" y="378" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">
    leftMax[1]−1 = 3−1 = 2   |   rightMax[1]+1 = 1+1 = 2
  </text>
  <text x="310" y="396" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">
    dp[1][1] = 5 + max(2, 2) = 7   ← 左源 c'=1 或右源 c'=0/2 均可
  </text>
  <text x="310" y="416" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    （c'=1：dp0[1]+1−1=2；c'=0：dp0[0]−0+1=2；c'=2：dp0[2]−2+1=2）
  </text>
</svg>
