<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 640"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="620" height="640" fill="#fafafa"/>

  <g filter="url(#rough2)">
    <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：二分 T + 时间倒流——「到达」变「截止」，区间结构复活</text>
    <text x="310" y="42" text-anchor="middle" font-size="10.5" fill="#888">示例 3：楼层 F = [1, 3, 5]，到达 A = [0, 6, 0]，start = 3，最优 T = 8</text>

    <!-- ===== Panel A: forward time ===== -->
    <text x="58" y="68" font-size="11.5" fill="#b85450" font-weight="bold">① 正向时间（III 的困境）：路过 ≠ 处理，已处理集合有「空洞」</text>

    <path d="M 90 100 H 570" stroke="#c9c2b4" stroke-width="1.3" stroke-dasharray="5 4" fill="none"/>
    <path d="M 90 135 H 570" stroke="#c9c2b4" stroke-width="1.3" stroke-dasharray="5 4" fill="none"/>
    <path d="M 90 170 H 570" stroke="#c9c2b4" stroke-width="1.3" stroke-dasharray="5 4" fill="none"/>
    <text x="80" y="104" text-anchor="end" font-size="9.5" fill="#777">5 层</text>
    <text x="80" y="139" text-anchor="end" font-size="9.5" fill="#777">3 层</text>
    <text x="80" y="174" text-anchor="end" font-size="9.5" fill="#777">1 层</text>

    <path d="M 90 135 L 210 100 L 450 170 L 570 135" stroke="#446688" stroke-width="2.4" fill="none"/>

    <circle cx="90" cy="135" r="5.5" fill="#e8f0fe" stroke="#446688" stroke-width="2"/>
    <circle cx="210" cy="100" r="5.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <circle cx="330" cy="135" r="5.5" fill="#fafafa" stroke="#b85450" stroke-width="2.2"/>
    <circle cx="450" cy="170" r="5.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <circle cx="570" cy="135" r="5.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>

    <text x="90" y="122" text-anchor="middle" font-size="8.5" fill="#33506b">t=0 在 3 层</text>
    <text x="90" y="152" text-anchor="middle" font-size="8.5" fill="#b85450">a=6 未到 ✗</text>
    <text x="214" y="92" text-anchor="middle" font-size="8.5" fill="#4a7a3a">t=2 ✓ (0,5)</text>
    <text x="330" y="156" text-anchor="middle" font-size="8.5" fill="#b85450">t=4 路过 3 层，a=6 未到 ✗</text>
    <text x="450" y="186" text-anchor="middle" font-size="8.5" fill="#4a7a3a">t=6 ✓ (0,1)</text>
    <text x="570" y="122" text-anchor="middle" font-size="8.5" fill="#4a7a3a">t=8 ✓ (6,3)</text>

    <path d="M 88 196 H 572" stroke="#999" stroke-width="1.4" marker-end="url(#arrG)" fill="none"/>
    <text x="588" y="200" font-size="9" fill="#777">t</text>
    <text x="230" y="212" text-anchor="middle" font-size="9" fill="#b85450">t=6 时已处理楼层 = {1, 5}——跳过了 3，不是连续区间 ⇒ III 只能状压 DP</text>

    <!-- ===== reversal band ===== -->
    <path d="M 310 224 V 252" stroke="#d6a040" stroke-width="3" marker-end="url(#arrB)" fill="none"/>
    <rect x="80" y="228" width="180" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <text x="170" y="247" text-anchor="middle" font-size="9.5" fill="#8a6d1f">时间倒流 t′ = T − t</text>
    <rect x="360" y="228" width="215" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8"/>
    <text x="467" y="241" text-anchor="middle" font-size="9" fill="#8a6d1f">到达 a ⇔ 截止 D = T − a</text>
    <text x="467" y="253" text-anchor="middle" font-size="9" fill="#8a6d1f">起点=最后处理的楼层，终点=start</text>

    <!-- ===== Panel B: reversed time ===== -->
    <text x="58" y="278" font-size="11.5" fill="#4a7a3a" font-weight="bold">② 反向时间（IV 的复活）：已访问楼层 = 排序后连续区间，只在端点向外扩张</text>

    <path d="M 90 310 H 570" stroke="#c9c2b4" stroke-width="1.3" stroke-dasharray="5 4" fill="none"/>
    <path d="M 90 345 H 570" stroke="#c9c2b4" stroke-width="1.3" stroke-dasharray="5 4" fill="none"/>
    <path d="M 90 380 H 570" stroke="#c9c2b4" stroke-width="1.3" stroke-dasharray="5 4" fill="none"/>
    <text x="80" y="314" text-anchor="end" font-size="9.5" fill="#777">5 层</text>
    <text x="80" y="349" text-anchor="end" font-size="9.5" fill="#777">3 层</text>
    <text x="80" y="384" text-anchor="end" font-size="9.5" fill="#777">1 层</text>
    <text x="580" y="314" text-anchor="start" font-size="8.5" fill="#a87020">D=8</text>
    <text x="580" y="349" text-anchor="start" font-size="8.5" fill="#a87020">D=2</text>
    <text x="580" y="384" text-anchor="start" font-size="8.5" fill="#a87020">D=8</text>

    <path d="M 90 345 L 210 380 L 450 310 L 570 345" stroke="#4a7a3a" stroke-width="2.4" fill="none"/>

    <circle cx="90" cy="345" r="5.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <circle cx="210" cy="380" r="5.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <circle cx="450" cy="310" r="5.5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <circle cx="570" cy="345" r="5.5" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4"/>

    <text x="90" y="332" text-anchor="middle" font-size="8.5" fill="#2f5527">t′=0 从 3 出发</text>
    <text x="90" y="362" text-anchor="middle" font-size="8.5" fill="#2f5527">0 ≤ D(3)=2 ✓</text>
    <text x="210" y="396" text-anchor="middle" font-size="8.5" fill="#2f5527">t′=2 ≤ D(1)=8 ✓</text>
    <text x="450" y="302" text-anchor="middle" font-size="8.5" fill="#2f5527">t′=6 ≤ D(5)=8 ✓</text>
    <text x="572" y="332" text-anchor="middle" font-size="8.5" fill="#a87020">t′=8 回 start</text>
    <text x="572" y="364" text-anchor="middle" font-size="8.5" fill="#a87020">恰 = T ✓</text>

    <path d="M 88 406 H 572" stroke="#999" stroke-width="1.4" marker-end="url(#arrG)" fill="none"/>
    <text x="588" y="410" font-size="9" fill="#777">t′</text>
    <text x="230" y="422" text-anchor="middle" font-size="9" fill="#2f5527">访问过的楼层：{3} → {1,3} → {1,3,5}——恒为连续区间，电梯只在端点扩张</text>

    <!-- ===== why: continuity ===== -->
    <rect x="40" y="436" width="540" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10"/>
    <text x="310" y="454" text-anchor="middle" font-size="10.5" fill="#2f5527" font-weight="bold">为什么倒放必然连续？电梯轨迹连续 ⇒ 到过的位置是一整段区间</text>
    <text x="310" y="472" text-anchor="middle" font-size="9.5" fill="#2f5527">⇒ 这段区间里的请求楼层全被路过 ⇒ 已访问楼层 = 排序后连续区间 [l, r]，扩张一次吞并一个新端点</text>

    <!-- ===== dp box ===== -->
    <rect x="40" y="494" width="540" height="62" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10"/>
    <text x="310" y="514" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">dp[l][r][0/1] = 访问完 F[l..r]（每个都卡在截止 D 内）、停在左/右端点的最早倒放时刻</text>
    <text x="310" y="532" text-anchor="middle" font-size="9.5" fill="#33506b">dp[i][i][·] = 0（起点任选——对应正向最后处理的那个楼层）；扩张到新楼层须 ≤ 该层截止 D</text>
    <text x="310" y="548" text-anchor="middle" font-size="9.5" fill="#33506b">收尾：dp[0][m−1][side] + |F 端点 − start| ≤ T 即 T 可行</text>

    <!-- ===== footer ===== -->
    <text x="58" y="578" font-size="9" fill="#6b7f99">① 同楼层只留最晚到达（一次到访全处理）② T 可行 ⇒ T+1 可行 ⇒ 二分答案 ③ 倒放把「不早于 a」翻成「不晚于 T−a」</text>
    <text x="58" y="594" font-size="9" fill="#6b7f99">可行性判定 O(m²)（区间 DP），总体 O(m² log V)——III 的状压 DP 在 m &gt; 25 后爆炸，这里 m 到数百照样过</text>
    <text x="58" y="614" font-size="8.5" fill="#8a3a35">⚠️ 本图为付费题 4029 的重建题意（与 4027 III 同题、仅规模放大），示例与答案 9 / 7 / 8 和 III 官方一致</text>
  </g>
</svg>
