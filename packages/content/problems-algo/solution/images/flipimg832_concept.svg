<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心直觉：翻转 = 水平反转 + 取反，两步可合并为一次双指针扫描</text>

  <!-- Original row [1,1,0] -->
  <text x="150" y="72" font-size="12" fill="#888">原始行</text>
  <rect x="240" y="56" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="78" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="280" y="56" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="78" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="320" y="56" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="78" text-anchor="middle" font-size="14" fill="#333">0</text>

  <!-- flip arrow -->
  <path d="M 300 98 L 300 120" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="114" font-size="11" fill="#666">水平翻转（反转行）</text>

  <!-- After flip [0,1,1] -->
  <text x="150" y="152" font-size="12" fill="#888">反转后</text>
  <rect x="240" y="136" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="158" text-anchor="middle" font-size="14" fill="#333">0</text>
  <rect x="280" y="136" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="158" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="320" y="136" width="40" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="340" y="158" text-anchor="middle" font-size="14" fill="#333">1</text>

  <!-- invert arrow -->
  <path d="M 300 178 L 300 200" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="312" y="194" font-size="11" fill="#666">取反（0↔1）</text>

  <!-- After invert [1,0,0] -->
  <text x="150" y="232" font-size="12" fill="#888">结果</text>
  <rect x="240" y="216" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="260" y="238" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">1</text>
  <rect x="280" y="216" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="300" y="238" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">0</text>
  <rect x="320" y="216" width="40" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="340" y="238" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">0</text>

  <!-- divider -->
  <line x1="60" y1="270" x2="540" y2="270" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- two pointer observation -->
  <text x="300" y="294" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">合并观察：双指针对称比较 (a, b)</text>

  <!-- Case 1: a == b (left box, green) -->
  <rect x="40" y="312" width="256" height="132" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="168" y="334" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">情况一：a == b</text>
  <rect x="76" y="346" width="36" height="30" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="94" y="366" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="120" y="346" width="36" height="30" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="138" y="366" text-anchor="middle" font-size="13" fill="#333">1</text>
  <text x="170" y="366" font-size="14" fill="#666">→</text>
  <rect x="190" y="346" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="208" y="366" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="234" y="346" width="36" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="252" y="366" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="168" y="404" text-anchor="middle" font-size="11" fill="#444">翻转交换（同值）→</text>
  <text x="168" y="424" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">两边都取反 = 1−a</text>

  <!-- Case 2: a != b (right box, orange) -->
  <rect x="312" y="312" width="256" height="132" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="440" y="334" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">情况二：a ≠ b</text>
  <rect x="348" y="346" width="36" height="30" fill="#fff" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="366" y="366" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="392" y="346" width="36" height="30" fill="#fff" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="366" text-anchor="middle" font-size="13" fill="#333">0</text>
  <text x="442" y="366" font-size="14" fill="#666">→</text>
  <rect x="462" y="346" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="480" y="366" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">1</text>
  <rect x="506" y="346" width="36" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="524" y="366" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">0</text>
  <text x="440" y="404" text-anchor="middle" font-size="11" fill="#444">翻转交换（异值）→</text>
  <text x="440" y="424" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">取反恰好还原，不变</text>
</svg>
