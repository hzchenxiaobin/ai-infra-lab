<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.7"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="820" height="460" fill="#fdfcf7"/>

  <text x="410" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">算法流程：四次指针定位 + 两步接线</text>
  <path d="M 280 40 Q 410 48 540 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Step 1 -->
  <g filter="url(#sk)"><rect x="60" y="70" width="700" height="56" rx="8" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.4"/></g>
  <text x="80" y="92" font-size="13" font-weight="bold" fill="#2b6e9e">步骤 ① 定位 prevA（删除区间前驱，下标 a−1）</text>
  <text x="80" y="112" font-size="11" fill="#444">prevA = list1;  for i in 0..a−2:  prevA = prevA.next   // 走 a−1 步</text>
  <text x="640" y="112" font-size="10" fill="#888">O(a)</text>

  <!-- arrow down -->
  <path d="M 410 128 L 410 142" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Step 2 -->
  <g filter="url(#sk)"><rect x="60" y="146" width="700" height="56" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/></g>
  <text x="80" y="168" font-size="13" font-weight="bold" fill="#a07020">步骤 ② 定位 nodeB（删除区间末尾，下标 b）</text>
  <text x="80" y="188" font-size="11" fill="#444">nodeB = prevA;  for i in 0..b−a:  nodeB = nodeB.next   // 再走 b−a+1 步</text>
  <text x="640" y="188" font-size="10" fill="#888">O(b−a+1)</text>

  <path d="M 410 204 L 410 218" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Step 3 -->
  <g filter="url(#sk)"><rect x="60" y="222" width="700" height="56" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="80" y="244" font-size="13" font-weight="bold" fill="#2e6e2e">步骤 ③ 接上 list2 头：prevA.next = list2</text>
  <text x="80" y="264" font-size="11" fill="#444">// prevA 后继切换为 list2，[a, b] 段从链表脱离</text>
  <text x="640" y="264" font-size="10" fill="#888">O(1)</text>

  <path d="M 410 280 L 410 294" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Step 4 -->
  <g filter="url(#sk)"><rect x="60" y="298" width="700" height="56" rx="8" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/></g>
  <text x="80" y="320" font-size="13" font-weight="bold" fill="#2e6e2e">步骤 ④ 定位 list2 尾：tail = list2; while tail.next: tail = tail.next</text>
  <text x="80" y="340" font-size="11" fill="#444">// 走完 list2 全长 m</text>
  <text x="640" y="340" font-size="10" fill="#888">O(m)</text>

  <path d="M 410 356 L 410 370" stroke="#5a5a5a" stroke-width="1.2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- Step 5 -->
  <g filter="url(#sk)"><rect x="60" y="374" width="700" height="56" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/></g>
  <text x="80" y="396" font-size="13" font-weight="bold" fill="#b85450">步骤 ⑤ 接回 list1 尾段：tail.next = nodeB.next</text>
  <text x="80" y="416" font-size="11" fill="#444">// list2 末尾接 nodeB 的后继（下标 b+1），完成拼接</text>
  <text x="640" y="416" font-size="10" fill="#888">O(1)</text>

  <text x="410" y="448" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">合计时间 O(n + m)，空间 O(1)，返回 list1 即可</text>
</svg>
