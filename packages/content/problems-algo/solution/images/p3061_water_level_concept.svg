<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="660" height="400" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：水位 = min(l, r)，接水 = 水位 − height（沙洲宽度均为 1）</text>

  <!-- formula box -->
  <rect x="384" y="40" width="256" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="512" y="60" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">l = 左侧最高（含自身）  r = 右侧最高（含自身）</text>
  <text x="512" y="78" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">接水ᵢ = LEAST(l, r) − heightᵢ</text>

  <!-- callout box for id=6 -->
  <rect x="180" y="104" width="250" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="305" y="126" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">位置 6（h = 0）：水位 = min(2, 3) = 2</text>
  <text x="305" y="146" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">接水 = 2 − 0 = 2 格（红框）</text>
  <path d="M 305 162 L 298 240" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- water level dashed lines -->
  <path d="M 232 254 L 366 254" stroke="#6a9fd8" stroke-width="1.2" stroke-dasharray="5,4" fill="none" filter="url(#rough2)"/>
  <path d="M 450 254 L 540 254" stroke="#6a9fd8" stroke-width="1.2" stroke-dasharray="5,4" fill="none" filter="url(#rough2)"/>
  <path d="M 144 292 L 190 292" stroke="#6a9fd8" stroke-width="1.2" stroke-dasharray="5,4" fill="none" filter="url(#rough2)"/>
  <text x="436" y="248" font-size="9" fill="#6a9fd8" filter="url(#rough2)">水位=2</text>
  <text x="86" y="286" font-size="9" fill="#6a9fd8" filter="url(#rough2)">水位=1</text>

  <!-- bars (sandbars) -->
  <rect x="104" y="292" width="36" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="192" y="254" width="36" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="236" y="292" width="36" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="324" y="292" width="36" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="368" y="216" width="36" height="114" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="412" y="254" width="36" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="456" y="292" width="36" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="500" y="254" width="36" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>
  <rect x="544" y="292" width="36" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="3" filter="url(#rough2)"/>

  <!-- water -->
  <rect x="148" y="292" width="36" height="38" fill="#d9e8fb" stroke="#6a9fd8" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="236" y="254" width="36" height="38" fill="#d9e8fb" stroke="#6a9fd8" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="280" y="254" width="36" height="76" fill="#d9e8fb" stroke="#6a9fd8" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="324" y="254" width="36" height="38" fill="#d9e8fb" stroke="#6a9fd8" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <rect x="456" y="254" width="36" height="38" fill="#d9e8fb" stroke="#6a9fd8" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="166" y="315" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="254" y="277" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="298" y="296" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="342" y="277" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="474" y="277" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- highlight id=6 -->
  <rect x="274" y="246" width="48" height="88" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="4,4" rx="4" filter="url(#rough2)"/>

  <!-- l / r annotations -->
  <text x="60" y="238" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">l = 2</text>
  <text x="60" y="254" font-size="10" fill="#666" filter="url(#rough2)">左侧最高（id ≤ 6）</text>
  <path d="M 132 242 L 268 262" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="470" y="186" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">r = 3</text>
  <text x="470" y="202" font-size="10" fill="#666" filter="url(#rough2)">右侧最高（id ≥ 6）</text>
  <path d="M 474 194 Q 400 176 328 242" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ground -->
  <path d="M 50 330 L 592 330" stroke="#555" stroke-width="2" filter="url(#rough2)"/>

  <!-- id / height labels -->
  <text x="36" y="346" font-size="9" fill="#888" filter="url(#rough2)">id</text>
  <text x="36" y="360" font-size="9" fill="#888" filter="url(#rough2)">h</text>
  <text x="78" y="346" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">1</text>
  <text x="122" y="346" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">2</text>
  <text x="166" y="346" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">3</text>
  <text x="210" y="346" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">4</text>
  <text x="254" y="346" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">5</text>
  <text x="298" y="346" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">6</text>
  <text x="342" y="346" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">7</text>
  <text x="386" y="346" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">8</text>
  <text x="430" y="346" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">9</text>
  <text x="474" y="346" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">10</text>
  <text x="518" y="346" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">11</text>
  <text x="562" y="346" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">12</text>
  <text x="78" y="360" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="122" y="360" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="166" y="360" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="210" y="360" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="254" y="360" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="298" y="360" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="342" y="360" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="386" y="360" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="430" y="360" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="474" y="360" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="518" y="360" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="562" y="360" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>

  <!-- bottom note -->
  <rect x="30" y="368" width="600" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="330" y="385" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">总滞留雨水 = Σ(LEAST(l, r) − height) = 1+1+2+1+1 = 6</text>
</svg>
