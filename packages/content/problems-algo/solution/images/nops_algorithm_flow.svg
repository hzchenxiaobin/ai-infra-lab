<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 600"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L7,4.5 L0,9 Z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="600" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">算法流程：回文预处理 ＋ 前缀 DP</text>

  <!-- Start oval -->
  <ellipse cx="200" cy="58" rx="42" ry="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="63" text-anchor="middle" font-size="14" fill="#4a7a3a" filter="url(#rough2)">开始</text>

  <path d="M200 76 L200 92" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ① precompute -->
  <rect x="60" y="94" width="280" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="200" y="116" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">① 预处理回文表 isPal[l][r]</text>
  <text x="200" y="136" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">s[l]==s[r] &amp;&amp; (r−l≤2 ‖ isPal[l+1][r−1])，O(n²)</text>

  <path d="M200 154 L200 168" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② dp[0]=0 -->
  <rect x="110" y="170" width="180" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="200" y="193" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">② dp[0] = 0</text>

  <path d="M200 206 L200 220" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ outer loop -->
  <rect x="70" y="222" width="260" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="200" y="247" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">③ 外层循环 i = 1 .. n</text>

  <path d="M200 262 L200 276" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ④ dp[i]=dp[i-1] -->
  <rect x="50" y="278" width="300" height="44" fill="#f0f0f0" stroke="#999" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="200" y="305" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">④ dp[i] = dp[i−1]   （跳过当前位）</text>

  <path d="M200 322 L200 336" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ⑤ inner loop -->
  <rect x="60" y="338" width="280" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="200" y="363" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">⑤ 内层循环 j = 0 .. i−k</text>
  <text x="360" y="363" text-anchor="start" font-size="11" fill="#666" filter="url(#rough2)">⟲ j 取尽 → 回 ③</text>

  <path d="M200 378 L200 392" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ⑥ diamond -->
  <polygon points="200,394 296,434 200,474 104,434" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="439" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">isPal[j][i−1]?</text>

  <!-- Yes -> ⑦ on the right -->
  <path d="M296 434 L378 434" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="335" y="426" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">是</text>

  <rect x="378" y="410" width="162" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="459" y="431" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">⑦ dp[i] = max(</text>
  <text x="459" y="449" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">dp[i], dp[j]+1)</text>

  <!-- ⑦ back to ⑤ (next j) -->
  <path d="M459 410 C 459 376 360 358 342 358" fill="none" stroke="#446688" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="390" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">下一个 j</text>

  <!-- No -> back to ⑤ (next j) on the left -->
  <path d="M104 434 C 66 434 56 396 60 360" fill="none" stroke="#888" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="74" y="410" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">否</text>

  <!-- exit down: i loop exhausted -->
  <path d="M200 474 L200 500" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="214" y="492" text-anchor="start" font-size="11" fill="#4a7a3a" filter="url(#rough2)">i 用尽</text>

  <!-- ⑧ return -->
  <rect x="110" y="502" width="180" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="200" y="527" text-anchor="middle" font-size="13" fill="#333" font-weight="bold" filter="url(#rough2)">⑧ 返回 dp[n]</text>

  <path d="M200 542 L200 558" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- End oval -->
  <ellipse cx="200" cy="578" rx="42" ry="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="200" y="583" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">结束</text>
</svg>
