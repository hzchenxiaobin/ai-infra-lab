<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <text x="150" y="30" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：离线降序 + 双指针 + Pareto 前沿 + 二分</text>

  <!-- 1 排序 -->
  <rect x="180" y="50" width="240" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="74" text-anchor="middle" font-size="14" fill="#335" filter="url(#rough2)">① 排序</text>
  <text x="300" y="94" text-anchor="middle" font-size="12" fill="#335" filter="url(#rough2)">点按 x 降序；查询按 x 降序（记原 idx）</text>
  <line x1="300" y1="106" x2="300" y2="130" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2 双指针 -->
  <rect x="150" y="132" width="300" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="156" text-anchor="middle" font-size="14" fill="#244" filter="url(#rough2)">② 双指针 j：加入 x ≥ x_q 的点</text>
  <text x="300" y="176" text-anchor="middle" font-size="12" fill="#244" filter="url(#rough2)">每点只入结构一次（x 约束自动满足）</text>
  <line x1="300" y1="188" x2="300" y2="212" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3 维护前沿 -->
  <rect x="90" y="214" width="420" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="238" text-anchor="middle" font-size="14" fill="#642" filter="url(#rough2)">③ 维护 Pareto 前沿（y 升、s 降）</text>
  <text x="300" y="258" text-anchor="middle" font-size="12" fill="#642" filter="url(#rough2)">被支配(y'≥y 且 s'≥s) → 跳过</text>
  <text x="300" y="278" text-anchor="middle" font-size="12" fill="#642" filter="url(#rough2)">删被新点支配的(y'≤y 且 s'≤s)，再插入</text>
  <line x1="300" y1="290" x2="300" y2="314" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4 二分查询 -->
  <rect x="150" y="316" width="300" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="340" text-anchor="middle" font-size="14" fill="#622" filter="url(#rough2)">④ 二分首个 y ≥ y_q，读其 s</text>
  <text x="300" y="360" text-anchor="middle" font-size="12" fill="#622" filter="url(#rough2)">写回 ans[原 idx]；无则 -1</text>

  <!-- 循环回环 -->
  <path d="M460 344 Q540 344 540 160 Q540 160 460 160" stroke="#888" stroke-width="1.5"
        fill="none" stroke-dasharray="5 3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="548" y="254" font-size="12" fill="#888" filter="url(#rough2)">下个</text>
  <text x="548" y="270" font-size="12" fill="#888" filter="url(#rough2)">查询</text>

  <!-- 复杂度标注 -->
  <rect x="120" y="396" width="360" height="32" fill="#fafafa" stroke="#aaa" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="300" y="416" text-anchor="middle" font-size="13" fill="#444" filter="url(#rough2)">复杂度：排序 O(n log n) + 结构 O((n+q) log n)</text>
</svg>
