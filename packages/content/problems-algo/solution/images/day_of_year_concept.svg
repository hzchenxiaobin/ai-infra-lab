<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：每月天数前缀和 —— 闰年修正仅 +1（当 M&gt;2）</text>

  <text x="290" y="50" text-anchor="middle" font-size="11.5" fill="#888">平年前缀和表：prefix[i] = 第 1~i 月累计天数（查第 M 月 → 取 prefix[M−1]）</text>

  <!-- ===== Row 1: months 1-6 ===== -->
  <rect x="24" y="62" width="82" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="65" y="82" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1 月</text>
  <text x="65" y="102" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">31</text>
  <text x="65" y="118" text-anchor="middle" font-size="10.5" fill="#888">前缀: 0</text>

  <rect x="114" y="62" width="82" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="6" filter="url(#rough2)"/>
  <text x="155" y="82" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2 月</text>
  <text x="155" y="102" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">28/29</text>
  <text x="155" y="118" text-anchor="middle" font-size="10.5" fill="#d6a040">前缀: 31</text>

  <rect x="204" y="62" width="82" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="245" y="82" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">3 月</text>
  <text x="245" y="102" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">31</text>
  <text x="245" y="118" text-anchor="middle" font-size="10.5" fill="#888">前缀: 59</text>

  <rect x="294" y="62" width="82" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="335" y="82" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">4 月</text>
  <text x="335" y="102" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">30</text>
  <text x="335" y="118" text-anchor="middle" font-size="10.5" fill="#888">前缀: 90</text>

  <rect x="384" y="62" width="82" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="425" y="82" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">5 月</text>
  <text x="425" y="102" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">31</text>
  <text x="425" y="118" text-anchor="middle" font-size="10.5" fill="#888">前缀: 120</text>

  <rect x="474" y="62" width="82" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="515" y="82" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">6 月</text>
  <text x="515" y="102" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">30</text>
  <text x="515" y="118" text-anchor="middle" font-size="10.5" fill="#888">前缀: 151</text>

  <!-- ===== Row 2: months 7-12 ===== -->
  <rect x="24" y="138" width="82" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="65" y="158" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">7 月</text>
  <text x="65" y="178" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">31</text>
  <text x="65" y="194" text-anchor="middle" font-size="10.5" fill="#888">前缀: 181</text>

  <rect x="114" y="138" width="82" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="155" y="158" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">8 月</text>
  <text x="155" y="178" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">31</text>
  <text x="155" y="194" text-anchor="middle" font-size="10.5" fill="#888">前缀: 212</text>

  <rect x="204" y="138" width="82" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="245" y="158" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">9 月</text>
  <text x="245" y="178" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">30</text>
  <text x="245" y="194" text-anchor="middle" font-size="10.5" fill="#888">前缀: 243</text>

  <rect x="294" y="138" width="82" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="335" y="158" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">10 月</text>
  <text x="335" y="178" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">31</text>
  <text x="335" y="194" text-anchor="middle" font-size="10.5" fill="#888">前缀: 273</text>

  <rect x="384" y="138" width="82" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="425" y="158" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">11 月</text>
  <text x="425" y="178" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">30</text>
  <text x="425" y="194" text-anchor="middle" font-size="10.5" fill="#888">前缀: 304</text>

  <rect x="474" y="138" width="82" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="515" y="158" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">12 月</text>
  <text x="515" y="178" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">31</text>
  <text x="515" y="194" text-anchor="middle" font-size="10.5" fill="#888">前缀: 334</text>

  <!-- ===== Formula box ===== -->
  <rect x="50" y="220" width="480" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="290" y="240" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">day_of_year = prefix[M−1] + D + (leap ∧ M&gt;2 ? 1 : 0)</text>
  <text x="290" y="258" text-anchor="middle" font-size="10.5" fill="#555">查表 O(1) + 闰年修正 O(1) = 全程 O(1)</text>

  <!-- ===== Leap correction note ===== -->
  <rect x="50" y="280" width="480" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="290" y="302" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">闰年修正：二月 28→29，仅影响 M≥3 的日期</text>
  <text x="290" y="322" text-anchor="middle" font-size="11" fill="#555">M=1：prefix=0，无闰年影响（一月在二月之前）</text>
  <text x="290" y="340" text-anchor="middle" font-size="11" fill="#555">M=2：prefix=31（一月天数），二月天数在 +D 中，不受 prefix 影响</text>
  <text x="290" y="358" text-anchor="middle" font-size="11" fill="#b85450">M≥3：prefix 含二月 → 闰年时 prefix 多 1 → 修正 +1</text>
</svg>
