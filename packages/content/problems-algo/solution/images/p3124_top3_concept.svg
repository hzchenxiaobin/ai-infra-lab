  <text x="290" y="351" text-anchor="middle" font-size="11" fill="#a06a10" font-weight="bold" filter="url(#rough2)">RANK() OVER (PARTITION BY type ORDER BY duration DESC)</text>
  <text x="290" y="370" text-anchor="middle" font-size="10" fill="#a06a10" filter="url(#rough2)">排名在各泳道内独立进行；first_name 靠 JOIN Contacts 补上；HH:MM:SS 最后格式化</text>
