<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">一步取模定位：算法流程</text>

  <!-- 开始 -->
  <rect x="75" y="42" width="90" height="26" rx="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="60" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M 120 68 L 120 88" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 遍历 i -->
  <rect x="50" y="90" width="140" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="110" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">遍历 i = 0 … n−1</text>
  <path d="M 120 120 L 120 144" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 核心公式 -->
  <rect x="32" y="146" width="176" height="50" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="120" y="167" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">j = ((i + nums[i]) % n</text>
  <text x="120" y="187" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">+ n) % n</text>
  <path d="M 120 196 L 120 218" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 赋值 -->
  <rect x="50" y="220" width="140" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="240" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">result[i] = nums[j]</text>
  <path d="M 120 250 L 120 266" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形判断 -->
  <polygon points="120,268 170,296 120,324 70,296" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="301" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">还有 i?</text>

  <!-- 回环：是 -->
  <path d="M 70 296 L 28 296 L 28 105 L 48 105" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="52" y="288" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 否 → 返回 -->
  <path d="M 120 324 L 120 334" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="128" y="322" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="75" y="336" width="90" height="22" rx="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="351" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">返回 result</text>

  <!-- 右侧：双取模实例（橙框） -->
  <rect x="305" y="60" width="195" height="210" rx="10" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="402" y="86" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">为什么 + n 再 % n？</text>
  <text x="402" y="112" text-anchor="middle" font-size="13" fill="#666" filter="url(#rough2)">n = 4，i = 1，nums[1] = −2</text>
  <text x="402" y="140" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">① 1 + (−2) = −1</text>
  <text x="402" y="168" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">② −1 % 4 = −1（负！）</text>
  <text x="402" y="196" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">③ −1 + 4 = 3</text>
  <text x="402" y="224" text-anchor="middle" font-size="13" fill="#4a7a3a" filter="url(#rough2)">④ 3 % 4 = 3 ✓ 落到下标 3</text>
  <line x1="322" y1="240" x2="483" y2="240" stroke="#d6a040" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <text x="402" y="260" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">左移 k 步 = 加 −k</text>

  <!-- 右下：语言差异（红框） -->
  <rect x="305" y="286" width="195" height="64" rx="10" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="402" y="308" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">⚠️ C++/Java：−1 % 4 = −1</text>
  <text x="402" y="328" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">Python：−1 % 4 = 3</text>
  <text x="402" y="346" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">双取模全语言通用</text>
</svg>
