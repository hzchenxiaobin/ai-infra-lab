<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="740" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="370" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：8 行 Employees → 自连接配对 → 3 位经理</text>
  <path d="M 180 36 Q 370 44 560 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== Top: raw table ===== -->
  <text x="40" y="62" font-size="11" fill="#888">① 原始 Employees 表（示例 2）</text>
  <g filter="url(#rough2)"><rect x="30" y="68" width="680" height="64" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6"/></g>
  <text x="350" y="84" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">Employees</text>
  <line x1="30" y1="90" x2="710" y2="90" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="50" y="104" font-size="9" fill="#888" font-weight="bold">emp_id</text>
  <text x="130" y="104" font-size="9" fill="#888" font-weight="bold">name</text>
  <text x="220" y="104" font-size="9" fill="#888" font-weight="bold">reports_to</text>
  <text x="320" y="104" font-size="9" fill="#888" font-weight="bold">age</text>

  <!-- rows inline -->
  <text x="52" y="124" font-size="10" fill="#4a8edb">1</text>
  <text x="130" y="124" font-size="10" fill="#4a8edb">Michael</text>
  <text x="226" y="124" font-size="10" fill="#aaa">null</text>
  <text x="320" y="124" font-size="10" fill="#4a8edb">45</text>

  <text x="380" y="124" font-size="10" fill="#4a7a3a">2</text>
  <text x="430" y="124" font-size="10" fill="#4a7a3a">Alice</text>
  <text x="510" y="124" font-size="10" fill="#4a8edb">1</text>
  <text x="590" y="124" font-size="10" fill="#4a7a3a">38</text>

  <text x="640" y="124" font-size="9" fill="#888">(其余 6 行…)</text>

  <!-- Arrow down -->
  <path d="M 350 134 L 350 148" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Middle: 3 manager groups ===== -->
  <text x="40" y="162" font-size="11" fill="#888">② 自连接 + GROUP BY 后形成 3 个经理分组</text>

  <!-- Group Michael -->
  <g filter="url(#rough2)"><rect x="30" y="168" width="220" height="118" fill="#e8f0fe" stroke="#4a8edb" stroke-width="1.5" rx="8"/></g>
  <text x="140" y="188" text-anchor="middle" font-size="11" fill="#4a8edb" font-weight="bold">经理 e1 = Michael</text>
  <line x1="30" y1="194" x2="250" y2="194" stroke="#bbd" stroke-width="1" filter="url(#rough2)"/>
  <text x="48" y="210" font-size="9" fill="#888">下属 s：</text>
  <text x="48" y="226" font-size="10" fill="#4a8edb">s2 = Alice, age 38</text>
  <text x="48" y="242" font-size="10" fill="#4a8edb">s3 = Bob, age 42</text>
  <line x1="40" y1="250" x2="240" y2="250" stroke="#bbd" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="48" y="268" font-size="10" fill="#4a8edb" font-weight="bold">COUNT = 2</text>
  <text x="160" y="268" font-size="10" fill="#4a8edb" font-weight="bold">AVG = (38+42)/2 = 40</text>

  <!-- Group Alice -->
  <g filter="url(#rough2)"><rect x="260" y="168" width="220" height="118" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/></g>
  <text x="370" y="188" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">经理 e2 = Alice</text>
  <line x1="260" y1="194" x2="480" y2="194" stroke="#bdb" stroke-width="1" filter="url(#rough2)"/>
  <text x="278" y="210" font-size="9" fill="#888">下属 s：</text>
  <text x="278" y="226" font-size="10" fill="#4a7a3a">s4 = Charlie, age 34</text>
  <text x="278" y="242" font-size="10" fill="#4a7a3a">s5 = David, age 40</text>
  <line x1="270" y1="250" x2="470" y2="250" stroke="#bdb" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="278" y="268" font-size="10" fill="#4a7a3a" font-weight="bold">COUNT = 2</text>
  <text x="390" y="268" font-size="10" fill="#4a7a3a" font-weight="bold">AVG = (34+40)/2 = 37</text>

  <!-- Group Bob -->
  <g filter="url(#rough2)"><rect x="490" y="168" width="220" height="118" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/></g>
  <text x="600" y="188" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">经理 e3 = Bob</text>
  <line x1="490" y1="194" x2="710" y2="194" stroke="#ebb" stroke-width="1" filter="url(#rough2)"/>
  <text x="508" y="210" font-size="9" fill="#888">下属 s：</text>
  <text x="508" y="226" font-size="10" fill="#b85450">s6 = Eve, age 37</text>
  <text x="508" y="242" font-size="9" fill="#bbb">（仅 1 人）</text>
  <line x1="500" y1="250" x2="700" y2="250" stroke="#ebb" stroke-width="1" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="508" y="268" font-size="10" fill="#b85450" font-weight="bold">COUNT = 1</text>
  <text x="620" y="268" font-size="10" fill="#b85450" font-weight="bold">AVG = 37</text>

  <!-- Note about excluded rows -->
  <text x="370" y="304" text-anchor="middle" font-size="9" fill="#888">⚠️ Frank(7)/Grace(8) 的 reports_to 为 null → JOIN 配对失败被剔除；Michael(1)/Alice(2)/Bob(3) 自身作为 s 时 reports_to 非自身 → 不计入自己组</text>

  <!-- Arrow down -->
  <path d="M 350 312 L 350 326" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Bottom: final result ===== -->
  <text x="40" y="340" font-size="11" fill="#888">③ 最终结果（ORDER BY employee_id）</text>
  <g filter="url(#rough2)"><rect x="200" y="346" width="340" height="100" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="6"/></g>
  <text x="370" y="364" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">输出结果</text>
  <line x1="200" y1="370" x2="540" y2="370" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="220" y="384" font-size="9" fill="#888" font-weight="bold">employee_id</text>
  <text x="300" y="384" font-size="9" fill="#888" font-weight="bold">name</text>
  <text x="386" y="384" font-size="9" fill="#888" font-weight="bold">reports_count</text>
  <text x="470" y="384" font-size="9" fill="#888" font-weight="bold">average_age</text>
  <line x1="200" y1="388" x2="540" y2="388" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <text x="232" y="406" font-size="10" fill="#4a8edb">1</text>
  <text x="300" y="406" font-size="10" fill="#4a8edb">Michael</text>
  <text x="396" y="406" font-size="10" fill="#4a8edb">2</text>
  <text x="478" y="406" font-size="10" fill="#4a8edb">40</text>

  <text x="232" y="424" font-size="10" fill="#4a7a3a">2</text>
  <text x="300" y="424" font-size="10" fill="#4a7a3a">Alice</text>
  <text x="396" y="424" font-size="10" fill="#4a7a3a">2</text>
  <text x="478" y="424" font-size="10" fill="#4a7a3a">37</text>

  <text x="232" y="442" font-size="10" fill="#b85450">3</text>
  <text x="300" y="442" font-size="10" fill="#b85450">Bob</text>
  <text x="396" y="442" font-size="10" fill="#b85450">1</text>
  <text x="478" y="442" font-size="10" fill="#b85450">37</text>
</svg>
