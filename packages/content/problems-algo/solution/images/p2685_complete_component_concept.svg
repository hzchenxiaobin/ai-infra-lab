<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 390"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="390" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：完全连通分量 ⟺ 边数 = m(m−1)/2</text>
  <text x="280" y="46" text-anchor="middle" font-size="10.5" fill="#888">m 个节点的连通分量，恰好有 C(m,2) 条边即为完全图</text>

  <!-- ===== Panel 1: complete triangle (green) ===== -->
  <text x="100" y="80" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">① 完全三角形</text>
  <!-- triangle edges -->
  <line x1="100" y1="110" x2="70" y2="168" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <line x1="70" y1="172" x2="130" y2="172" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <line x1="130" y1="168" x2="100" y2="110" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <!-- nodes -->
  <circle cx="100" cy="104" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="109" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">0</text>
  <circle cx="66" cy="176" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="66" y="181" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">1</text>
  <circle cx="134" cy="176" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="134" y="181" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">2</text>
  <!-- count -->
  <text x="100" y="216" text-anchor="middle" font-size="10.5" fill="#666">m=3, 边=3</text>
  <rect x="50" y="228" width="100" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="100" y="252" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">3 = 3×2/2 ✓</text>

  <!-- ===== Panel 2: incomplete (red) ===== -->
  <text x="290" y="80" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">② 非完全</text>
  <!-- edges 3-4, 3-5 solid; 4-5 missing (dashed gap) -->
  <line x1="290" y1="110" x2="258" y2="168" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <line x1="290" y1="110" x2="322" y2="168" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <!-- missing edge shown as faint dashed -->
  <path d="M 82 0 L 58 0" stroke="#ccc" stroke-width="1.8" stroke-dasharray="4,3" transform="translate(216 176)" filter="url(#rough2)"/>
  <text x="290" y="200" text-anchor="middle" font-size="9.5" fill="#b85450">↑ 缺边 4−5</text>
  <!-- nodes -->
  <circle cx="290" cy="104" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="109" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">3</text>
  <circle cx="256" cy="176" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="256" y="181" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">4</text>
  <circle cx="324" cy="176" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="324" y="181" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450">5</text>
  <text x="290" y="216" text-anchor="middle" font-size="10.5" fill="#666">m=3, 边=2</text>
  <rect x="240" y="228" width="100" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="252" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">2 ≠ 3×2/2 ✗</text>

  <!-- ===== Panel 3: single node (green) ===== -->
  <text x="470" y="80" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">③ 孤立点</text>
  <circle cx="470" cy="140" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="470" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">6</text>
  <text x="470" y="216" text-anchor="middle" font-size="10.5" fill="#666">m=1, 边=0</text>
  <rect x="420" y="228" width="100" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="470" y="252" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">0 = 1×0/2 ✓</text>

  <!-- ===== divider ===== -->
  <line x1="40" y1="290" x2="520" y2="290" stroke="#ddd" stroke-width="1.3" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <!-- ===== formula box ===== -->
  <rect x="70" y="308" width="420" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="330" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">判定准则</text>
  <text x="280" y="350" text-anchor="middle" font-size="13" fill="#333">连通分量（m 个节点，e 条边）完全</text>
  <text x="280" y="366" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">⟺  e = m(m−1)/2</text>
</svg>
