<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">任意子数组和绝对值最大值：核心观察</text>

  <!-- Number line -->
  <text x="30" y="60" font-size="12" fill="#4a7a3a" font-weight="bold">所有子数组和 S 落在区间 [min_sum, max_sum] 内</text>

  <!-- The axis line -->
  <line x1="40" y1="110" x2="480" y2="110" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="486" y="114" font-size="11" fill="#888">S</text>

  <!-- min_sum point (negative) -->
  <circle cx="90" cy="110" r="5" fill="#b85450" filter="url(#rough2)"/>
  <text x="90" y="92" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">min_sum</text>
  <text x="90" y="134" text-anchor="middle" font-size="11" fill="#b85450">(负方向极端)</text>

  <!-- zero point -->
  <circle cx="260" cy="110" r="4" fill="#888" filter="url(#rough2)"/>
  <text x="260" y="92" text-anchor="middle" font-size="11" fill="#888">0</text>

  <!-- max_sum point (positive) -->
  <circle cx="430" cy="110" r="5" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="430" y="92" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">max_sum</text>
  <text x="430" y="134" text-anchor="middle" font-size="11" fill="#4a7a3a">(正方向极端)</text>

  <!-- bracket spanning [min_sum, max_sum] -->
  <path d="M 90 150 L 90 158 L 430 158 L 430 150" stroke="#888" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="260" y="174" text-anchor="middle" font-size="11" fill="#888">S 的取值范围</text>

  <!-- Absolute value illustration: fold at 0 -->
  <text x="30" y="206" font-size="12" fill="#d6a040" font-weight="bold">绝对值 = 把数轴在 0 处对折，看谁跑得更远</text>

  <!-- |min_sum| arrow: from 0 leftward -->
  <line x1="260" y1="230" x2="90" y2="230" stroke="#b85450" stroke-width="2.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="175" y="224" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">|min_sum|</text>

  <!-- |max_sum| arrow: from 0 rightward -->
  <line x1="260" y1="230" x2="430" y2="230" stroke="#4a7a3a" stroke-width="2.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="345" y="224" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">|max_sum|</text>

  <!-- fold mark at 0 -->
  <circle cx="260" cy="230" r="4" fill="#d6a040" filter="url(#rough2)"/>

  <!-- Formula box -->
  <rect x="40" y="258" width="440" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="282" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">answer = max( |max_sum|, |min_sum| )</text>
  <text x="260" y="298" text-anchor="middle" font-size="11" fill="#888">两个方向各跑一次 Kadane，取跑得更远的</text>

  <!-- Empty subarray note -->
  <rect x="40" y="316" width="440" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="338" text-anchor="middle" font-size="11" fill="#446688">💡 子数组可为空：max(|max_sum|, |min_sum|) ≥ 0 恒成立，空集的 0 自动覆盖</text>
</svg>
