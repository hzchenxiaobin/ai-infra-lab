<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：Orders 是桥梁表 —— 一次连接拼出「品牌 × 偏好」</text>

  <!-- Users 表（维表：卖家偏好） -->
  <rect x="48" y="48" width="150" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="123" y="66" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">Users（卖家偏好）</text>
  <text x="60" y="86" font-size="11" fill="#333" filter="url(#rough2)">seller_id 🔑</text>
  <text x="60" y="103" font-size="11" fill="#333" filter="url(#rough2)">join_date</text>
  <text x="60" y="120" font-size="11" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">favorite_brand ★</text>

  <!-- Items 表（维表：商品品牌） -->
  <rect x="322" y="48" width="150" height="84" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="397" y="66" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">Items（商品品牌）</text>
  <text x="334" y="86" font-size="11" fill="#333" filter="url(#rough2)">item_id 🔑</text>
  <text x="334" y="103" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">item_brand ★</text>

  <!-- Orders 表（桥梁/事实表） -->
  <rect x="186" y="170" width="148" height="116" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="188" text-anchor="middle" font-size="12" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">Orders（桥梁表）</text>
  <text x="198" y="206" font-size="11" fill="#333" filter="url(#rough2)">order_id 🔑</text>
  <text x="198" y="222" font-size="11" fill="#333" filter="url(#rough2)">order_date</text>
  <text x="198" y="238" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">item_id →</text>
  <text x="198" y="254" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">seller_id →</text>

  <!-- 外键箭头：Orders → Users -->
  <path d="M 205 170 C 180 158, 155 158, 126 153" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="128" y="182" text-anchor="middle" font-size="10.5" fill="#2f5d24" filter="url(#rough2)">seller_id（外键）</text>

  <!-- 外键箭头：Orders → Items -->
  <path d="M 315 170 C 340 158, 365 152, 388 140" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="392" y="182" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">item_id（外键）</text>

  <!-- 连接后示例行 -->
  <rect x="48" y="300" width="424" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="11" fill="#8f3a36" filter="url(#rough2)">连接后：order 1 = seller 2（偏好 Samsung）× item 4（HP）</text>
  <text x="260" y="336" text-anchor="middle" font-size="11" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">HP ≠ Samsung ⇒ 非偏爱订单 ✓ —— WHERE 过滤的判定依据</text>
</svg>
