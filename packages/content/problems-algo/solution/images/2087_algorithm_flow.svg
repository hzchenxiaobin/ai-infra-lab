<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：确定行列区间 → 累加代价 → 返回总和</text>

  <rect x="245" y="38" width="70" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="55" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">开始</text>
  <path d="M 280 62 L 280 76" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="160" y="78" width="240" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="96" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">读入 startPos, homePos</text>
  <text x="280" y="112" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">rowCosts, colCosts</text>
  <path d="M 280 118 L 280 132" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <polygon points="280,134 388,166 280,198 172,166" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="162" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">startPos == homePos ?</text>
  <text x="280" y="178" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">已在 home</text>

  <path d="M 388 166 L 410 166" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="400" y="158" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="410" y="152" width="110" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="465" y="170" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">return 0</text>

  <path d="M 280 198 L 280 212" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="296" y="208" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>

  <rect x="150" y="214" width="260" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="232" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">ans = 0</text>
  <text x="280" y="248" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">确定行区间 r1..r2，列区间 c1..c2</text>
  <path d="M 280 262 L 280 276" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="120" y="278" width="180" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="210" y="296" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">遍历 r ∈ [r1, r2]</text>
  <text x="210" y="312" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">if r != startrow: ans += rowCosts[r]</text>

  <rect x="330" y="278" width="180" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="420" y="296" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">遍历 c ∈ [c1, c2]</text>
  <text x="420" y="312" text-anchor="middle" font-size="10.5" fill="#d6a040" filter="url(#rough2)">if c != startcol: ans += colCosts[c]</text>

  <path d="M 210 322 L 210 340" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 420 322 L 420 340" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <path d="M 210 340 L 420 340" stroke="#666" stroke-width="1.5" filter="url(#rough2)"/>
  <path d="M 315 340 L 315 352" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <rect x="225" y="354" width="180" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="315" y="375" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return ans</text>

  <rect x="40" y="404" width="480" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="422" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">关键洞察：行列代价 ≥ 0 ⇒ 任意绕路只增不减</text>
  <text x="280" y="438" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">故无需 BFS/Dijkstra，直接累加「起点到终点间每行/每列」的代价</text>
</svg>
