<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto">
      <path d="M0,0 L4,6 L8,0 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">
    示例演算：4 场 → 8 行 → 聚合排序 → 3 行结果
  </text>

  <!-- ===== Section 1: 4 Matches ===== -->
  <text x="260" y="48" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    Matches 表（4 场比赛）
  </text>

  <!-- Match 1: 1 vs 4, 0:1 -->
  <rect x="30" y="56" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="80" y="74" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1 vs 4 (0:1)</text>

  <!-- Match 2: 1 vs 6, 3:3 -->
  <rect x="140" y="56" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="190" y="74" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">1 vs 6 (3:3)</text>

  <!-- Match 3: 4 vs 1, 5:2 -->
  <rect x="250" y="56" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="300" y="74" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4 vs 1 (5:2)</text>

  <!-- Match 4: 6 vs 1, 0:0 -->
  <rect x="360" y="56" width="100" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="410" y="74" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">6 vs 1 (0:0)</text>

  <!-- Down arrow -->
  <path d="M 260,88 L 260,102" fill="none" stroke="#446688" stroke-width="1.2"
        marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="280" y="98" font-size="8" fill="#999" filter="url(#rough2)">UNION ALL</text>

  <!-- ===== Section 2: 8 team-perspective rows ===== -->
  <text x="260" y="116" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    TeamStats 长表（8 行，按 team_id 分组着色）
  </text>

  <!-- Group: team_id = 1 (Ajax) — red/pink, 4 rows -->
  <rect x="30" y="124" width="460" height="60" fill="none" stroke="#b85450" stroke-width="1" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="42" y="138" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">Ajax(1)</text>

  <rect x="30" y="142" width="105" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="82" y="155" text-anchor="middle" font-size="8" fill="#b85450" filter="url(#rough2)">gf=0, ga=1, pts=0</text>

  <rect x="140" y="142" width="105" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="192" y="155" text-anchor="middle" font-size="8" fill="#b85450" filter="url(#rough2)">gf=3, ga=3, pts=1</text>

  <rect x="250" y="142" width="105" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="302" y="155" text-anchor="middle" font-size="8" fill="#b85450" filter="url(#rough2)">gf=2, ga=5, pts=0</text>

  <rect x="360" y="142" width="105" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="412" y="155" text-anchor="middle" font-size="8" fill="#b85450" filter="url(#rough2)">gf=0, ga=0, pts=1</text>

  <!-- Ajax aggregate -->
  <rect x="30" y="164" width="460" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="260" y="177" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">
    SUM → matches=4, points=2, gf=5, ga=9, diff=−4
  </text>

  <!-- Group: team_id = 4 (Dortmund) — green, 2 rows -->
  <rect x="30" y="190" width="460" height="42" fill="none" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="42" y="204" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Dortmund(4)</text>

  <rect x="30" y="208" width="160" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="221" text-anchor="middle" font-size="8" fill="#4a7a3a" filter="url(#rough2)">gf=1, ga=0, pts=3</text>

  <rect x="250" y="208" width="160" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="330" y="221" text-anchor="middle" font-size="8" fill="#4a7a3a" filter="url(#rough2)">gf=5, ga=2, pts=3</text>

  <!-- Dortmund aggregate -->
  <rect x="30" y="228" width="460" height="0" fill="none" filter="url(#rough2)"/>

  <!-- Group: team_id = 6 (Arsenal) — orange, 2 rows -->
  <rect x="30" y="238" width="460" height="42" fill="none" stroke="#d6a040" stroke-width="1" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="42" y="252" font-size="9" fill="#d6a040" font-weight="bold" filter="url(#rough2)">Arsenal(6)</text>

  <rect x="30" y="256" width="160" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="269" text-anchor="middle" font-size="8" fill="#d6a040" filter="url(#rough2)">gf=3, ga=3, pts=1</text>

  <rect x="250" y="256" width="160" height="18" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="330" y="269" text-anchor="middle" font-size="8" fill="#d6a040" filter="url(#rough2)">gf=0, ga=0, pts=1</text>

  <!-- Down arrow to result -->
  <path d="M 260,286 L 260,302" fill="none" stroke="#446688" stroke-width="1.2"
        marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="280" y="298" font-size="8" fill="#999" filter="url(#rough2)">ORDER BY</text>

  <!-- ===== Section 3: Final result table ===== -->
  <text x="260" y="316" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">
    最终积分榜（points DESC → goal_diff DESC → team_name ASC）
  </text>

  <!-- Table headers -->
  <rect x="40" y="324" width="80" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="80" y="338" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">team_name</text>

  <rect x="120" y="324" width="60" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="150" y="338" text-anchor="middle" font-size="8" fill="#333" filter="url(#rough2)">played</text>

  <rect x="180" y="324" width="55" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="207" y="338" text-anchor="middle" font-size="8" fill="#333" filter="url(#rough2)">points</text>

  <rect x="235" y="324" width="55" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="262" y="338" text-anchor="middle" font-size="8" fill="#333" filter="url(#rough2)">gf</text>

  <rect x="290" y="324" width="55" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="317" y="338" text-anchor="middle" font-size="8" fill="#333" filter="url(#rough2)">ga</text>

  <rect x="345" y="324" width="55" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="372" y="338" text-anchor="middle" font-size="8" fill="#333" filter="url(#rough2)">diff</text>

  <!-- Row 1: Dortmund -->
  <rect x="40" y="344" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="80" y="359" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">Dortmund</text>

  <rect x="120" y="344" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="150" y="359" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>

  <rect x="180" y="344" width="55" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="207" y="359" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">6</text>

  <rect x="235" y="344" width="55" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="262" y="359" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">6</text>

  <rect x="290" y="344" width="55" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="317" y="359" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>

  <rect x="345" y="344" width="55" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="372" y="359" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">4</text>

  <!-- Row 2: Arsenal -->
  <rect x="40" y="367" width="80" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="80" y="382" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">Arsenal</text>

  <rect x="120" y="367" width="60" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="150" y="382" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">2</text>

  <rect x="180" y="367" width="55" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="207" y="382" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="235" y="367" width="55" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="262" y="382" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>

  <rect x="290" y="367" width="55" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="317" y="382" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">3</text>

  <rect x="345" y="367" width="55" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="372" y="382" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">0</text>

  <!-- Row 3: Ajax -->
  <rect x="40" y="390" width="80" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="80" y="405" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">Ajax</text>

  <rect x="120" y="390" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="150" y="405" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">4</text>

  <rect x="180" y="390" width="55" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="207" y="405" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>

  <rect x="235" y="390" width="55" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="262" y="405" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">5</text>

  <rect x="290" y="390" width="55" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="317" y="405" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">9</text>

  <rect x="345" y="390" width="55" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="372" y="405" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">−4</text>

  <!-- Annotation: tie-breaker -->
  <rect x="40" y="422" width="360" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="220" y="440" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">
    Arsenal 与 Ajax 积分同为 2，但 Arsenal 净胜球 0 &gt; Ajax −4，故 Arsenal 排前
  </text>
</svg>
