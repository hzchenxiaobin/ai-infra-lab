<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#666" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">dfs(mask, sum) 流程：记忆化 + 极小化极大</text>

  <!-- entry -->
  <rect x="200" y="44" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="14" filter="url(#rough2)"/>
  <text x="280" y="64" text-anchor="middle" font-size="12" fill="#333">入口：dfs(0, 0)</text>

  <path d="M 280 74 L 280 92" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- prune 1: T <= 0 -->
  <polygon points="280,96 410,128 280,160 150,128" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="124" text-anchor="middle" font-size="11.5" fill="#333">desiredTotal ≤ 0 ?</text>
  <text x="280" y="140" text-anchor="middle" font-size="10.5" fill="#888">（先手已达标）</text>

  <path d="M 150 128 L 92 128" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="120" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="40" y="114" width="52" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="66" y="132" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">true</text>

  <path d="M 280 160 L 280 178" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="174" font-size="10.5" fill="#b85450" font-weight="bold">否</text>

  <!-- prune 2: total < T -->
  <polygon points="280,182 430,216 280,250 130,216" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="212" text-anchor="middle" font-size="11.5" fill="#333">Σ(1..M) &lt; desiredTotal ?</text>
  <text x="280" y="228" text-anchor="middle" font-size="10.5" fill="#888">（谁也凑不到）</text>

  <path d="M 130 216 L 92 216" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="120" y="208" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">是</text>
  <rect x="36" y="202" width="56" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="64" y="220" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">false</text>

  <path d="M 280 250 L 280 268" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="264" font-size="10.5" fill="#b85450" font-weight="bold">否</text>

  <!-- memo hit -->
  <polygon points="280,272 410,304 280,336 150,304" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="300" text-anchor="middle" font-size="11.5" fill="#333">memo[mask] 命中 ?</text>
  <text x="280" y="316" text-anchor="middle" font-size="10.5" fill="#888">直接返回缓存值</text>

  <path d="M 410 304 L 468 304" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="440" y="296" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="470" y="290" width="70" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="505" y="308" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return</text>

  <path d="M 280 336 L 280 354" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="348" font-size="10.5" fill="#b85450" font-weight="bold">否</text>

  <!-- loop over unused i -->
  <rect x="110" y="358" width="340" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="376" text-anchor="middle" font-size="11.5" fill="#444" font-weight="bold">遍历每个未用整数 i：</text>
  <text x="280" y="392" text-anchor="middle" font-size="10.8" fill="#555">if sum+i ≥ T → 记 memo=true 并返回 true</text>

  <path d="M 280 398 L 280 412" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="414" width="440" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="432" text-anchor="middle" font-size="11" fill="#444">else if ¬dfs(mask ∪ {i}, sum+i) → 记 memo=true 并返回 true</text>

  <text x="280" y="455" text-anchor="middle" font-size="10.5" fill="#888">全部 i 都不能赢 → 记 memo=false 并返回 false</text>
</svg>
