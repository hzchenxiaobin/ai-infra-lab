<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察一：前缀差 —— 区间化作两个单端之差</text>

  <!-- Number line axis -->
  <line x1="50" y1="110" x2="510" y2="110" stroke="#888" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="516" y="114" font-size="11" fill="#888" filter="url(#rough2)">x</text>

  <!-- Tick: 1 (left end) -->
  <line x1="70" y1="104" x2="70" y2="116" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="70" y="132" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">1</text>

  <!-- Tick: num1-1 -->
  <line x1="190" y1="104" x2="190" y2="116" stroke="#888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="190" y="132" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">num1−1</text>

  <!-- Tick: num1 -->
  <line x1="210" y1="104" x2="210" y2="116" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="210" y="98" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">num1</text>

  <!-- Tick: num2 -->
  <line x1="470" y1="104" x2="470" y2="116" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="470" y="98" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">num2</text>

  <!-- [1, num2] full span (blue, the big prefix) -->
  <rect x="70" y="148" width="400" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="163" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">[1, num2]  →  f(num2)</text>

  <!-- [1, num1-1] subtracted part (green hatch) -->
  <rect x="70" y="178" width="120" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="193" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">[1, num1−1] −f(num1−1)</text>

  <!-- [num1, num2] kept part (red, answer) -->
  <rect x="210" y="178" width="260" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="340" y="193" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">[num1, num2]  ←  答案</text>

  <!-- minus arrow connecting the two halves -->
  <text x="192" y="193" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" filter="url(#rough2)">−</text>

  <!-- Equation box -->
  <rect x="60" y="224" width="440" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="249" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)"><tspan font-weight="bold" fill="#d6a040">ans</tspan> = <tspan font-weight="bold" fill="#446688">f(num2)</tspan> − <tspan font-weight="bold" fill="#4a7a3a">f(num1−1)</tspan></text>

  <!-- digit_sum band note -->
  <rect x="60" y="276" width="440" height="46" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="72" y="296" font-size="11" fill="#333" filter="url(#rough2)"><tspan font-weight="bold">f(s)</tspan> = [1, s] 中<tspan font-weight="bold">数位和</tspan>落在 [min_sum, max_sum] 的整数个数</text>
  <text x="72" y="314" font-size="11" fill="#888" filter="url(#rough2)">  →  数位和小的状态 ≤ 400，正好做数位 DP 的状态维度</text>

  <text x="280" y="346" text-anchor="middle" font-size="10" fill="#aaa" filter="url(#rough2)">区间 → 两个「≤ 上界」单端前缀之差，是数位 DP 处理区间的标准套路</text>
</svg>
