<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：值域压缩 —— 索引三元组 → 值三元组</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">nums[i] ∈ [1,100]，所以不同的「值」只有 100 种，按值计数即可</text>

  <!-- ===== Left: index triplets (too many) ===== -->
  <text x="40" y="76" font-size="11" fill="#b85450" font-weight="bold">暴力：枚举索引三元组</text>
  <rect x="36" y="84" width="150" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="111" y="102" text-anchor="middle" font-size="10.5" fill="#333">n ≤ 10⁵ 个下标</text>
  <text x="111" y="118" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">C(n,3) ≈ 10¹⁵ ✗</text>

  <!-- mini index row -->
  <rect x="40" y="134" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="51" y="150" text-anchor="middle" font-size="9" fill="#333">i</text>
  <rect x="64" y="134" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="75" y="150" text-anchor="middle" font-size="9" fill="#333">j</text>
  <rect x="88" y="134" width="22" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="99" y="150" text-anchor="middle" font-size="9" fill="#333">k</text>
  <text x="120" y="150" font-size="10" fill="#888">… 10⁵ 个</text>

  <!-- Arrow: count frequencies -->
  <path d="M 196 150 L 232 150" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="214" y="142" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">计数</text>
  <text x="214" y="166" text-anchor="middle" font-size="9" fill="#888">cnt[v]++</text>

  <!-- ===== Middle: 100 value buckets ===== -->
  <text x="300" y="76" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">按值建桶：cnt[1..100]</text>
  <rect x="236" y="84" width="128" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="300" y="102" text-anchor="middle" font-size="10.5" fill="#333">值 v ∈ [1, 100]</text>
  <text x="300" y="118" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">仅 100 种 ✓</text>
  <text x="300" y="134" text-anchor="middle" font-size="9.5" fill="#555">cnt[v] = v 出现次数</text>

  <!-- bucket chips -->
  <rect x="240" y="148" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="255" y="163" text-anchor="middle" font-size="9" fill="#333">1</text>
  <rect x="272" y="148" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="287" y="163" text-anchor="middle" font-size="9" fill="#333">2</text>
  <rect x="304" y="148" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="319" y="163" text-anchor="middle" font-size="9" fill="#333">3</text>
  <rect x="336" y="148" width="30" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="351" y="163" text-anchor="middle" font-size="9" fill="#333">…</text>

  <!-- Arrow: enumerate value triplets -->
  <path d="M 372 150 L 408 150" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="390" y="142" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold">枚举</text>
  <text x="390" y="166" text-anchor="middle" font-size="9" fill="#888">(a,b,c)</text>

  <!-- ===== Right: enumerate value triplets ===== -->
  <text x="478" y="76" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">枚举值三元组</text>
  <rect x="412" y="84" width="132" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="478" y="102" text-anchor="middle" font-size="10.5" fill="#333">a,b,c ∈ [1,100]³</text>
  <text x="478" y="118" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">100³ = 10⁶ ✓</text>
  <text x="478" y="134" text-anchor="middle" font-size="9.5" fill="#555">逐个判整除条件</text>

  <!-- a b c chips -->
  <rect x="420" y="148" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="435" y="163" text-anchor="middle" font-size="9" fill="#333">a</text>
  <rect x="452" y="148" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="467" y="163" text-anchor="middle" font-size="9" fill="#333">b</text>
  <rect x="484" y="148" width="30" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="499" y="163" text-anchor="middle" font-size="9" fill="#333">c</text>
  <text x="520" y="163" font-size="10" fill="#888">×6</text>

  <!-- ===== Bottom: the counting formula box ===== -->
  <rect x="36" y="196" width="488" height="92" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="216" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">值三元组 (a,b,c) 命中条件后，乘以「索引排列数」</text>
  <text x="280" y="232" text-anchor="middle" font-size="10" fill="#555">条件：s = a+b+c 恰被 {a,b,c} 中的一个整除（按位置计）</text>

  <text x="60" y="256" font-size="10.5" fill="#446688" font-weight="bold">a,b,c 互异：</text>
  <text x="170" y="256" font-size="10.5" fill="#333">cnt[a]·cnt[b]·cnt[c]</text>
  <text x="300" y="256" font-size="9.5" fill="#888">(6 种顺序各自累加)</text>

  <text x="60" y="276" font-size="10.5" fill="#4a7a3a" font-weight="bold">恰两值相等 a==b≠c：</text>
  <text x="200" y="276" font-size="10.5" fill="#333">cnt[a]·(cnt[a]−1)·cnt[c]</text>
  <text x="330" y="276" font-size="9.5" fill="#888">(P(cnt[a],2) 选两个不同下标)</text>

  <!-- ===== Footer note ===== -->
  <rect x="36" y="300" width="488" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="320" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">为什么 a==b==c 永不命中？</text>
  <text x="280" y="336" text-anchor="middle" font-size="10" fill="#555">s = 3a 必被 a 整除，三个位置都整除 → 计数 = 3 ≠ 1，自动跳过</text>
  <text x="280" y="350" text-anchor="middle" font-size="10" fill="#888">有序枚举 (a,b,c) 天然覆盖全部 6/3 种下标排列，无需额外乘子</text>
</svg>
