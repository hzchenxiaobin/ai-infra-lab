<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="620" height="400" fill="#fafafa"/>

  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：怪物按战力排序 → 金币前缀和 → 英雄二分取前缀</text>

  <!-- Row 1: sorted powers -->
  <text x="40" y="66" font-size="12" fill="#999" font-weight="bold" filter="url(#rough2)">排序后战力</text>
  <rect x="160" y="50" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="188" y="68" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="224" y="50" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="252" y="68" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">1</text>
  <rect x="288" y="50" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="316" y="68" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="352" y="50" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="380" y="68" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="416" y="50" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="444" y="68" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold" filter="url(#rough2)">5</text>

  <!-- Row 2: coins reordered -->
  <text x="40" y="102" font-size="12" fill="#999" font-weight="bold" filter="url(#rough2)">金币(跟随排序)</text>
  <rect x="160" y="86" width="56" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="104" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="224" y="86" width="56" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="252" y="104" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <rect x="288" y="86" width="56" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="316" y="104" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">5</text>
  <rect x="352" y="86" width="56" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="104" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <rect x="416" y="86" width="56" height="26" fill="#fafafa" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="444" y="104" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">4</text>

  <!-- Row 3: prefix sums -->
  <text x="40" y="138" font-size="12" fill="#999" font-weight="bold" filter="url(#rough2)">金币前缀和</text>
  <rect x="160" y="122" width="56" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="188" y="140" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <rect x="224" y="122" width="56" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="252" y="140" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="288" y="122" width="56" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="316" y="140" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">10</text>
  <rect x="352" y="122" width="56" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="380" y="140" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">16</text>
  <rect x="416" y="122" width="56" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="444" y="140" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">20</text>
  <text x="188" y="164" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">pre[1]</text>
  <text x="252" y="164" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">pre[2]</text>
  <text x="316" y="164" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">pre[3]</text>
  <text x="380" y="164" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">pre[4]</text>
  <text x="444" y="164" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">pre[5]</text>

  <!-- boundary dashed lines -->
  <path d="M 284 168 L 284 316" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <path d="M 348 168 L 348 316" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <path d="M 412 168 L 412 316" stroke="#bbb" stroke-width="1.2" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>

  <!-- Hero rows -->
  <rect x="30" y="182" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="90" y="202" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">英雄0 战力 1</text>
  <path d="M 150 197 L 280 197" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="300" y="194" font-size="12" fill="#555" filter="url(#rough2)">pos = 2</text>
  <text x="300" y="210" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = pre[2] = 5</text>

  <rect x="30" y="234" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="90" y="254" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">英雄1 战力 4</text>
  <path d="M 150 249 L 408 249" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="448" y="246" font-size="12" fill="#555" filter="url(#rough2)">pos = 4</text>
  <text x="448" y="262" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = pre[4] = 16</text>

  <rect x="30" y="286" width="120" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="90" y="306" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">英雄2 战力 2</text>
  <path d="M 150 301 L 344 301" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <text x="448" y="298" font-size="12" fill="#555" filter="url(#rough2)">pos = 3</text>
  <text x="448" y="314" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = pre[3] = 10</text>

  <!-- Key insight -->
  <rect x="40" y="330" width="540" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="310" y="352" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">排序后「战力 ≤ h 的怪物」必然是一段前缀 → 答案 = 某个前缀和</text>
  <text x="310" y="372" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">对每个英雄只需二分找分界（upper_bound），O(log m) 定位，无需逐只怪物比较</text>
</svg>
