<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="150" y="20" text-anchor="middle" font-size="13.5" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：判无解 → 数坏位 → 套公式</text>

  <!-- 右上：无解判据说明框 -->
  <g filter="url(#rough2)">
    <rect x="330" y="54" width="178" height="48" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="419" y="72" text-anchor="middle" font-size="10.5" fill="#8a3a34" font-weight="bold">鸽笼判无解</text>
    <text x="419" y="87" text-anchor="middle" font-size="10" fill="#8a3a34">v 副本只进 forbidden≠v 的位</text>
    <text x="419" y="100" text-anchor="middle" font-size="10" fill="#8a3a34">cn(v)+cf(v) &gt; n ⟹ 返回 -1</text>
  </g>

  <!-- 开始 -->
  <g filter="url(#rough2)">
    <rect x="100" y="28" width="100" height="22" rx="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="150" y="43" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold">开始</text>
  </g>
  <path d="M 150 50 L 150 60" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 合并计数 -->
  <g filter="url(#rough2)">
    <rect x="52" y="62" width="196" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="150" y="80" text-anchor="middle" font-size="11" fill="#33506b">freq[v] ← 两数组合并计数</text>
  </g>
  <path d="M 150 90 L 150 100" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 freq > n -->
  <g filter="url(#rough2)">
    <polygon points="150,100 224,128 150,156 76,128" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="150" y="132" text-anchor="middle" font-size="11.5" fill="#2f5d24">freq[v] &gt; n ?</text>
  </g>
  <text x="232" y="122" font-size="10.5" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M 224 128 L 306 128" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="308" y="112" width="92" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="354" y="132" text-anchor="middle" font-size="12" fill="#8a3a34" font-weight="bold">返回 -1</text>
  </g>
  <text x="157" y="170" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 150 156 L 150 170" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 数坏位 -->
  <g filter="url(#rough2)">
    <rect x="44" y="172" width="212" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="150" y="190" text-anchor="middle" font-size="10.5" fill="#33506b">统计坏位 k 与同值坏位数 bad[v]</text>
  </g>
  <path d="M 150 200 L 150 210" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判断 k == 0 -->
  <g filter="url(#rough2)">
    <polygon points="150,210 222,238 150,266 78,238" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="150" y="242" text-anchor="middle" font-size="11.5" fill="#2f5d24">k == 0 ?</text>
  </g>
  <text x="230" y="232" font-size="10.5" fill="#b85450" filter="url(#rough2)">是</text>
  <path d="M 222 238 L 306 238" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="308" y="222" width="92" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="354" y="242" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold">返回 0</text>
  </g>
  <text x="157" y="280" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 150 266 L 150 280" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 套公式 -->
  <g filter="url(#rough2)">
    <rect x="40" y="282" width="220" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="150" y="303" text-anchor="middle" font-size="12.5" fill="#8a6d1f" font-weight="bold">返回 max(⌈k/2⌉, m)</text>
  </g>
  <path d="M 150 314 L 150 324" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="120" y="326" width="60" height="22" rx="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="150" y="341" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold">结束</text>
  </g>

  <!-- 右下：要点说明框 -->
  <g filter="url(#rough2)">
    <rect x="310" y="280" width="198" height="56" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="409" y="298" text-anchor="middle" font-size="10" fill="#2f5d24">m = max(bad[v])：最大同值坏位簇</text>
    <text x="409" y="313" text-anchor="middle" font-size="10" fill="#2f5d24">全程只数不构造，答案仅由 (k, m) 决定</text>
    <text x="409" y="328" text-anchor="middle" font-size="10" fill="#2f5d24">时间 O(n) · 空间 O(n)</text>
  </g>
</svg>
