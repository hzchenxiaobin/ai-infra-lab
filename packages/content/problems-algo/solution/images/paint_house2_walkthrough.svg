<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：costs = [[1,5,3],[2,3,1],[7,5,2]]，K = 3</text>
  <text x="280" y="42" text-anchor="middle" font-size="11" fill="#888">橙底 = c==idx 走 min2 分支；右侧标注当行 min1 / min2 / idx</text>

  <!-- Column headers -->
  <text x="110" y="70" font-size="12" fill="#888">i</text>
  <text x="220" y="70" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">色 0</text>
  <text x="320" y="70" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">色 1</text>
  <text x="420" y="70" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">色 2</text>

  <!-- cost 0 -->
  <rect x="80" y="78" width="60" height="26" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="96" text-anchor="middle" font-size="12" fill="#333">cost 0</text>
  <rect x="170" y="78" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="220" y="96" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="270" y="78" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="320" y="96" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="370" y="78" width="100" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="420" y="96" text-anchor="middle" font-size="12" fill="#333">3</text>

  <!-- dp[0] -->
  <rect x="80" y="110" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="110" y="128" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dp[0]</text>
  <rect x="170" y="110" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="128" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">1</text>
  <rect x="270" y="110" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="320" y="128" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="370" y="110" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="420" y="128" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
  <text x="486" y="120" font-size="10" fill="#446688">min1=1 @(色0)</text>
  <text x="486" y="132" font-size="10" fill="#d6a040">min2=3 @(色2)</text>
  <text x="486" y="144" font-size="10" fill="#888">idx=0</text>

  <!-- cost 1 -->
  <rect x="80" y="148" width="60" height="26" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="166" text-anchor="middle" font-size="12" fill="#333">cost 1</text>
  <rect x="170" y="148" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="220" y="166" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="270" y="148" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="320" y="166" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="370" y="148" width="100" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="420" y="166" text-anchor="middle" font-size="12" fill="#333">1</text>

  <!-- dp[1]: c=0==idx uses min2(3)->5 ; c=1 uses min1(1)->4 ; c=2 uses min1(1)->2 -->
  <rect x="80" y="180" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="110" y="198" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dp[1]</text>
  <rect x="170" y="180" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="198" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">5</text>
  <rect x="270" y="180" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="320" y="198" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="370" y="180" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="420" y="198" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">2</text>
  <text x="486" y="190" font-size="10" fill="#d6a040">2+min2(3)=5</text>
  <text x="486" y="202" font-size="10" fill="#888">3+min1(1)=4</text>
  <text x="486" y="214" font-size="10" fill="#888">1+min1(1)=2</text>
  <text x="486" y="226" font-size="10" fill="#446688">min1=2@(色2) min2=4 idx=2</text>

  <!-- cost 2 -->
  <rect x="80" y="232" width="60" height="26" fill="#fffdf3" stroke="#9e9e9e" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="250" text-anchor="middle" font-size="12" fill="#333">cost 2</text>
  <rect x="170" y="232" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="220" y="250" text-anchor="middle" font-size="12" fill="#333">7</text>
  <rect x="270" y="232" width="100" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="320" y="250" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="370" y="232" width="100" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="420" y="250" text-anchor="middle" font-size="12" fill="#333">2</text>

  <!-- dp[2]: c=0 uses min1(2)->9 ; c=1 uses min1(2)->7 ; c=2==idx uses min2(4)->6 -->
  <rect x="80" y="264" width="60" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="110" y="282" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dp[2]</text>
  <rect x="170" y="264" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="220" y="282" text-anchor="middle" font-size="12" fill="#333">9</text>
  <rect x="270" y="264" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="320" y="282" text-anchor="middle" font-size="12" fill="#333">7</text>
  <rect x="370" y="264" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2.6" rx="4" filter="url(#rough2)"/>
  <text x="420" y="282" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">6</text>
  <text x="486" y="274" font-size="10" fill="#888">7+min1(2)=9</text>
  <text x="486" y="286" font-size="10" fill="#888">5+min1(2)=7</text>
  <text x="486" y="298" font-size="10" fill="#d6a040" font-weight="bold">2+min2(4)=6 ✓</text>

  <!-- Answer -->
  <rect x="80" y="300" width="390" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="275" y="322" text-anchor="middle" font-size="13" fill="#333">答案 = min(dp[2]) = min(9, 7, 6) = </text>
  <text x="455" y="322" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">6</text>

  <!-- Path trace -->
  <text x="40" y="356" font-size="12" fill="#555" font-weight="bold">最优方案回溯（dp[2][色2]=6 最小）：</text>

  <rect x="60" y="368" width="120" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="120" y="386" text-anchor="middle" font-size="11" fill="#333">house 2 选色2</text>
  <text x="120" y="402" text-anchor="middle" font-size="11" fill="#333">cost = 2</text>

  <path d="M 185 390 L 225 390" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="205" y="384" text-anchor="middle" font-size="9" fill="#888">必非色2</text>

  <rect x="230" y="368" width="120" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="290" y="386" text-anchor="middle" font-size="11" fill="#333">house 1 选色1</text>
  <text x="290" y="402" text-anchor="middle" font-size="11" fill="#333">cost = 3</text>

  <path d="M 355 390 L 395 390" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="375" y="384" text-anchor="middle" font-size="9" fill="#888">必非色1</text>

  <rect x="400" y="368" width="120" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="460" y="386" text-anchor="middle" font-size="11" fill="#333">house 0 选色0</text>
  <text x="460" y="402" text-anchor="middle" font-size="11" fill="#333">cost = 1</text>

  <text x="280" y="430" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">总花费 = 1 + 3 + 2 = 6 ✓</text>
</svg>
