<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：示例 2（有矛盾）与 示例 1（无矛盾）</text>

  <!-- ===== Example 2 ===== -->
  <text x="20" y="52" font-size="12.5" fill="#b85450" font-weight="bold">示例 2：le/et=2, le/code=5, code/et=0.5  →  输出 true</text>

  <!-- table header -->
  <rect x="20" y="60" width="520" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="40" y="75" font-size="10.5" fill="#446688" font-weight="bold">步</text>
  <text x="90" y="75" font-size="10.5" fill="#446688" font-weight="bold">加入等式</text>
  <text x="230" y="75" font-size="10.5" fill="#446688" font-weight="bold">DFS 算出的已有比值</text>
  <text x="410" y="75" font-size="10.5" fill="#446688" font-weight="bold">动作</text>

  <!-- row 1 -->
  <rect x="20" y="82" width="520" height="24" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="98" font-size="10" fill="#333">①</text>
  <text x="90" y="98" font-size="10" fill="#333">le/et = 2</text>
  <text x="230" y="98" font-size="10" fill="#888">—（图空，无可校验路径）</text>
  <text x="410" y="98" font-size="10" fill="#4a7a3a">加边 le↔et</text>

  <!-- row 2 -->
  <rect x="20" y="106" width="520" height="24" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="122" font-size="10" fill="#333">②</text>
  <text x="90" y="122" font-size="10" fill="#333">le/code = 5</text>
  <text x="230" y="122" font-size="10" fill="#888">—（code 不在图中）</text>
  <text x="410" y="122" font-size="10" fill="#4a7a3a">加边 le↔code</text>

  <!-- row 3: contradiction -->
  <rect x="20" y="130" width="520" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="40" y="148" font-size="10" fill="#b85450" font-weight="bold">③</text>
  <text x="90" y="148" font-size="10" fill="#333">code/et = 0.5</text>
  <text x="230" y="148" font-size="10" fill="#333">code→le→et = (1/5)×2 = 0.4</text>
  <text x="410" y="148" font-size="10" fill="#b85450" font-weight="bold">|0.4−0.5|&gt;1e-5</text>
  <text x="230" y="163" font-size="9.5" fill="#888">已有比值 0.4 ≠ 声称 0.5</text>
  <text x="410" y="163" font-size="10" fill="#b85450" font-weight="bold">→ return true</text>

  <!-- ===== Example 1 ===== -->
  <text x="20" y="200" font-size="12.5" fill="#4a7a3a" font-weight="bold">示例 1：a/b=3, b/c=0.5, a/c=1.5  →  输出 false</text>

  <rect x="20" y="208" width="520" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="40" y="223" font-size="10.5" fill="#446688" font-weight="bold">步</text>
  <text x="90" y="223" font-size="10.5" fill="#446688" font-weight="bold">加入等式</text>
  <text x="230" y="223" font-size="10.5" fill="#446688" font-weight="bold">DFS 算出的已有比值</text>
  <text x="410" y="223" font-size="10.5" fill="#446688" font-weight="bold">动作</text>

  <!-- r1 -->
  <rect x="20" y="230" width="520" height="24" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="246" font-size="10" fill="#333">①</text>
  <text x="90" y="246" font-size="10" fill="#333">a/b = 3</text>
  <text x="230" y="246" font-size="10" fill="#888">—（图空）</text>
  <text x="410" y="246" font-size="10" fill="#4a7a3a">加边 a↔b</text>

  <!-- r2 -->
  <rect x="20" y="254" width="520" height="24" fill="#fafafa" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="270" font-size="10" fill="#333">②</text>
  <text x="90" y="270" font-size="10" fill="#333">b/c = 0.5</text>
  <text x="230" y="270" font-size="10" fill="#888">—（c 不在图中）</text>
  <text x="410" y="270" font-size="10" fill="#4a7a3a">加边 b↔c</text>

  <!-- r3 consistent -->
  <rect x="20" y="278" width="520" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="40" y="296" font-size="10" fill="#4a7a3a" font-weight="bold">③</text>
  <text x="90" y="296" font-size="10" fill="#333">a/c = 1.5</text>
  <text x="230" y="296" font-size="10" fill="#333">a→b→c = 3×0.5 = 1.5</text>
  <text x="410" y="296" font-size="10" fill="#4a7a3a" font-weight="bold">|1.5−1.5|&lt;1e-5</text>
  <text x="230" y="310" font-size="9.5" fill="#888">已有比值 1.5 = 声称 1.5</text>
  <text x="410" y="310" font-size="10" fill="#4a7a3a">一致 → 加边</text>

  <!-- conclusion -->
  <rect x="20" y="328" width="520" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="347" text-anchor="middle" font-size="11" fill="#333">全部等式校验通过，无矛盾 → return false</text>
</svg>
