<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">依赖图：原料 → 菜谱（菜也可作原料）</text>

  <!-- Layer labels -->
  <text x="18" y="66" font-size="10" fill="#4a7a3a" font-weight="bold">初始原料</text>
  <text x="18" y="151" font-size="10" fill="#446688" font-weight="bold">第 1 层</text>
  <text x="18" y="236" font-size="10" fill="#446688" font-weight="bold">第 2 层</text>
  <text x="18" y="321" font-size="10" fill="#446688" font-weight="bold">第 3 层</text>

  <!-- Supplies (green) -->
  <rect x="60" y="45" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="95" y="65" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">yeast</text>

  <rect x="170" y="45" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="205" y="65" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">flour</text>

  <rect x="300" y="45" width="70" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="335" y="65" text-anchor="middle" font-size="12" fill="#3a5a2a" font-weight="bold">meat</text>

  <!-- Recipes (blue) -->
  <rect x="100" y="130" width="74" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="137" y="150" text-anchor="middle" font-size="12" fill="#33445e" font-weight="bold">bread</text>

  <rect x="220" y="215" width="92" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="266" y="235" text-anchor="middle" font-size="12" fill="#33445e" font-weight="bold">sandwich</text>

  <rect x="370" y="300" width="76" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="408" y="320" text-anchor="middle" font-size="12" fill="#33445e" font-weight="bold">burger</text>

  <!-- Supply → Recipe edges (green dashed) -->
  <path d="M 100 77 L 130 130" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 205 77 L 145 130" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 320 77 L 250 215" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M 350 77 L 405 300" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Recipe → Recipe edges (orange solid, highlighted) -->
  <path d="M 145 162 L 240 215" stroke="#d6a040" stroke-width="2.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 290 247 L 375 300" stroke="#d6a040" stroke-width="2.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- bread → burger curved (bows left to avoid sandwich) -->
  <path d="M 137 162 Q 60 255 405 300" stroke="#d6a040" stroke-width="2.2" stroke-dasharray="6,3" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- Annotation for recipe-as-ingredient -->
  <rect x="395" y="170" width="138" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="464" y="184" text-anchor="middle" font-size="10.5" fill="#8a6020" font-weight="bold">橙色 = 菜谱作原料</text>
  <text x="464" y="197" text-anchor="middle" font-size="9.5" fill="#a07840">依赖链可传递</text>

  <!-- Legend -->
  <rect x="60" y="345" width="14" height="10" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="80" y="354" font-size="10" fill="#555">初始原料</text>
  <rect x="150" y="345" width="14" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="170" y="354" font-size="10" fill="#555">菜谱</text>
  <path d="M 230 350 L 250 350" stroke="#d6a040" stroke-width="2.5" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="258" y="354" font-size="10" fill="#555">菜谱→菜谱</text>
</svg>
