<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：逐格判定，遇违例即短路返回 false</text>

  <!-- Start oval -->
  <rect x="200" y="40" width="160" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="15" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="12" fill="#333">开始（ans 暂设 true）</text>
  <path d="M 280 70 L 280 92" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Loop frame -->
  <rect x="60" y="94" width="440" height="222" fill="none" stroke="#b8b8b8" stroke-width="1.5" stroke-dasharray="6,4" rx="12" filter="url(#rough2)"/>
  <text x="74" y="112" font-size="11" fill="#888" font-style="italic">对每个 (i, j) ∈ [0, n) × [0, n)</text>

  <!-- Action box: compute onDiag -->
  <rect x="190" y="120" width="180" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="280" y="140" text-anchor="middle" font-size="12" fill="#333">onDiag ← (i==j) 或 (i+j==n−1)</text>
  <path d="M 280 152 L 280 172" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Diamond: cell satisfies X rule? -->
  <polygon points="280,176 386,214 280,252 174,214" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="206" text-anchor="middle" font-size="11.5" fill="#333">grid[i][j] 符合？</text>
  <text x="280" y="222" text-anchor="middle" font-size="10.5" fill="#888">对角线需 ≠0 / 其余需 =0</text>

  <!-- Yes branch: down to next -->
  <text x="290" y="244" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <path d="M 280 252 L 280 282" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="210" y="284" width="140" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="280" y="301" text-anchor="middle" font-size="11.5" fill="#4a7a3a">符合 → 检查下一格</text>

  <!-- No branch: right to return false -->
  <text x="392" y="208" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M 386 214 L 420 214" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="420" y="198" width="120" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="480" y="218" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 false</text>

  <!-- out of loop -->
  <path d="M 280 316 L 280 340" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="290" y="332" font-size="10.5" fill="#888" font-style="italic">所有格均符合</text>

  <!-- End oval -->
  <rect x="200" y="342" width="160" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="15" filter="url(#rough2)"/>
  <text x="280" y="362" text-anchor="middle" font-size="12" fill="#333">返回 true</text>

  <!-- notes -->
  <text x="74" y="394" font-size="10.5" fill="#888">• 单趟遍历 n² 格，每格 O(1)：算 onDiag + 一次 0 比较 + 至多一次短路。</text>
  <text x="74" y="410" font-size="10.5" fill="#888">• 短路返回：发现违例立即 return，无需扫完整张矩阵。</text>
</svg>
