<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="480" height="460" fill="#fafafa"/>

  <text x="240" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：枚举 2 的幂 + 签名比对</text>

  <!-- 开始 -->
  <rect x="150" y="46" width="180" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="17" filter="url(#rough2)"/>
  <text x="240" y="68" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">输入 n</text>

  <path d="M 240 82 L 240 98" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 计算 n 的签名 -->
  <rect x="120" y="100" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="240" y="122" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">target = sorted(str(n))</text>

  <path d="M 240 136 L 240 152" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="130" y="154" width="220" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="240" y="174" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">power = 1,  i = 0</text>

  <path d="M 240 186 L 240 206" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环判断 -->
  <polygon points="240,210 380,262 240,314 100,262" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="256" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i &lt; 31 ?</text>
  <text x="240" y="274" text-anchor="middle" font-size="10" fill="#888">2⁰ … 2³⁰ 共 31 个</text>

  <!-- No → return false -->
  <path d="M 380 262 L 430 262" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="398" y="254" font-size="10" fill="#b85450" font-weight="bold">No</text>
  <rect x="400" y="246" width="72" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="17" filter="url(#rough2)"/>
  <text x="436" y="268" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">false</text>

  <!-- Yes → 计算签名 -->
  <path d="M 240 314 L 240 332" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="252" y="328" font-size="10" fill="#888">Yes</text>

  <rect x="110" y="334" width="260" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="240" y="354" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">sig = sorted(str(power))</text>

  <path d="M 240 366 L 240 382" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 签名匹配判断 -->
  <polygon points="240,384 350,412 240,440 130,412" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="240" y="410" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">sig == target ?</text>

  <!-- Yes → return true -->
  <path d="M 130 412 L 60 412" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="100" y="404" font-size="10" fill="#4a7a3a" font-weight="bold">Yes</text>
  <rect x="20" y="396" width="60" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="17" filter="url(#rough2)"/>
  <text x="50" y="418" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">true</text>

  <!-- No → power*=2, i++ → 回到循环 -->
  <path d="M 350 412 L 410 412 L 410 262 L 380 262" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="362" y="404" font-size="10" fill="#d6a040" font-weight="bold">No</text>
  <rect x="360" y="430" width="100" height="24" fill="none" stroke="none"/>
  <text x="410" y="446" text-anchor="middle" font-size="9.5" fill="#888">power &lt;&lt;= 1,  i++</text>
</svg>
