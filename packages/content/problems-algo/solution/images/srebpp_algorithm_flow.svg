<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">四次二分定位四条边界</text>
  <text x="280" y="44" text-anchor="middle" font-size="10" fill="#888">以锚点 (x,y) 为界，每轴拆成“找首个真”与“找末个真”</text>

  <!-- ===== 网格（3 行 4 列） ===== -->
  <!-- 白格 -->
  <rect x="204" y="120" width="38" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="242" y="120" width="38" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="318" y="120" width="38" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="204" y="158" width="38" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="318" y="158" width="38" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="204" y="196" width="38" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="280" y="196" width="38" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="318" y="196" width="38" height="38" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <!-- 黑格 -->
  <rect x="280" y="120" width="38" height="38" fill="#4a7a3a" stroke="#2f5526" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="242" y="158" width="38" height="38" fill="#4a7a3a" stroke="#2f5526" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="280" y="158" width="38" height="38" fill="#4a7a3a" stroke="#2f5526" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="242" y="196" width="38" height="38" fill="#4a7a3a" stroke="#2f5526" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- 包围矩形 -->
  <rect x="242" y="120" width="76" height="114" fill="none" stroke="#d6a040" stroke-width="2.2" stroke-dasharray="5,3" filter="url(#rough2)"/>

  <!-- 锚点 -->
  <circle cx="299" cy="139" r="6" fill="#b85450" stroke="#fff" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="328" y="135" font-size="10" fill="#b85450" font-weight="bold">(x,y)</text>

  <!-- 四条边界标记 -->
  <text x="242" y="114" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">L</text>
  <text x="318" y="114" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">R</text>
  <text x="196" y="124" text-anchor="end" font-size="10" fill="#d6a040" font-weight="bold">T</text>
  <text x="196" y="238" text-anchor="end" font-size="10" fill="#d6a040" font-weight="bold">B</text>

  <!-- 四方向二分箭头 -->
  <!-- 左：找 L -->
  <path d="M242 177 L150 177" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="40" y="166" width="104" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="92" y="182" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">L: [0,y] 首个真</text>
  <!-- 右：找 R -->
  <path d="M318 177 L410 177" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="416" y="166" width="108" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="470" y="182" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">R: [y,n−1] 末个真</text>
  <!-- 上：找 T -->
  <path d="M280 120 L280 70" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="216" y="56" width="128" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="280" y="71" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">T: [0,x] 首个真</text>
  <!-- 下：找 B -->
  <path d="M280 234 L280 284" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="210" y="286" width="140" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="5" filter="url(#rough2)"/>
  <text x="280" y="301" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">B: [x,m−1] 末个真</text>

  <!-- 谓词说明 -->
  <rect x="40" y="320" width="240" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="160" y="340" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">谓词：列 c 是否有黑 → 扫一列 O(m)</text>
  <rect x="290" y="320" width="240" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="410" y="340" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">谓词：行 r 是否有黑 → 扫一行 O(n)</text>

  <!-- 两个二分模板 -->
  <rect x="40" y="362" width="240" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="160" y="382" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">首个真: mid=(lo+hi)/2, hi=mid</text>
  <rect x="290" y="362" width="240" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="410" y="382" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">末个真: mid=(lo+hi+1)/2, lo=mid</text>
</svg>
