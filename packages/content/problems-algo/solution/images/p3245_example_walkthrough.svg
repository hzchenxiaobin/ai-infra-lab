<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例演算：两个官方样例的断点集与极大段</text>

  <text x="28" y="44" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">示例 1：colors = [0,1,1,0,1]</text>

  <!-- 表头 -->
  <rect x="28" y="50" width="46" height="22" rx="3" fill="#f0ead8" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="51" y="65" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">步骤</text>
  <rect x="74" y="50" width="150" height="22" rx="3" fill="#f0ead8" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="149" y="65" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">操作</text>
  <rect x="224" y="50" width="64" height="22" rx="3" fill="#f0ead8" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="256" y="65" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">brk</text>
  <rect x="288" y="50" width="66" height="22" rx="3" fill="#f0ead8" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="321" y="65" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">段长</text>
  <rect x="354" y="50" width="144" height="22" rx="3" fill="#f0ead8" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="426" y="65" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">大小 k 的组数</text>

  <!-- 例1 行 -->
  <rect x="28" y="74" width="46" height="26" rx="3" fill="#e8f0fe" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="51" y="91" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">初始</text>
  <rect x="74" y="74" width="150" height="26" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="149" y="91" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">—</text>
  <rect x="224" y="74" width="64" height="26" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="256" y="91" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">{1}</text>
  <rect x="288" y="74" width="66" height="26" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="321" y="91" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">{5}</text>
  <rect x="354" y="74" width="144" height="26" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="426" y="91" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">—</text>

  <rect x="28" y="102" width="46" height="26" rx="3" fill="#e8f0fe" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="51" y="119" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">①</text>
  <rect x="74" y="102" width="150" height="26" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="149" y="119" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">[2,1,0] 改色</text>
  <rect x="224" y="102" width="64" height="26" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="256" y="119" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">{0}</text>
  <rect x="288" y="102" width="66" height="26" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="321" y="119" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">{5}</text>
  <rect x="354" y="102" width="144" height="26" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="426" y="119" text-anchor="middle" font-size="9" fill="#8a6a10" filter="url(#rough2)">断点平移：边1→边0</text>

  <rect x="28" y="130" width="46" height="26" rx="3" fill="#e8f0fe" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="51" y="147" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">②</text>
  <rect x="74" y="130" width="150" height="26" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="149" y="147" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">[1,4] 询问</text>
  <rect x="224" y="130" width="64" height="26" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="256" y="147" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">{0}</text>
  <rect x="288" y="130" width="66" height="26" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="321" y="147" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">{5}</text>
  <rect x="354" y="130" width="144" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="426" y="147" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2f5426" filter="url(#rough2)">S=5,C=1 → 5−3×1 = 2</text>

  <text x="28" y="176" font-size="11" font-weight="bold" fill="#8a6a10" filter="url(#rough2)">示例 2：colors = [0,0,1,0,1,1]</text>

  <!-- 例2 行 -->
  <rect x="28" y="182" width="46" height="26" rx="3" fill="#fff8e1" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="51" y="199" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">初始</text>
  <rect x="74" y="182" width="150" height="26" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="149" y="199" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">—</text>
  <rect x="224" y="182" width="64" height="26" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="256" y="199" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">{0,4}</text>
  <rect x="288" y="182" width="66" height="26" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="321" y="199" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">{4,2}</text>
  <rect x="354" y="182" width="144" height="26" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="426" y="199" text-anchor="middle" font-size="9.5" fill="#777" filter="url(#rough2)">—</text>

  <rect x="28" y="210" width="46" height="26" rx="3" fill="#fff8e1" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="51" y="227" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">①</text>
  <rect x="74" y="210" width="150" height="26" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="149" y="227" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">[1,3] 询问</text>
  <rect x="224" y="210" width="64" height="26" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="256" y="227" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">{0,4}</text>
  <rect x="288" y="210" width="66" height="26" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="321" y="227" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">{4,2}</text>
  <rect x="354" y="210" width="144" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="426" y="227" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2f5426" filter="url(#rough2)">S=4,C=1 → 4−2×1 = 2</text>

  <rect x="28" y="238" width="46" height="26" rx="3" fill="#fff8e1" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="51" y="255" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">②</text>
  <rect x="74" y="238" width="150" height="26" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="149" y="255" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">[2,3,0] 同色</text>
  <rect x="224" y="238" width="64" height="26" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="256" y="255" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">{0,4}</text>
  <rect x="288" y="238" width="66" height="26" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="321" y="255" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">{4,2}</text>
  <rect x="354" y="238" width="144" height="26" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="426" y="255" text-anchor="middle" font-size="9" fill="#8a6a10" filter="url(#rough2)">no-op：直接跳过</text>

  <rect x="28" y="266" width="46" height="26" rx="3" fill="#fff8e1" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="51" y="283" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">③</text>
  <rect x="74" y="266" width="150" height="26" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="149" y="283" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">[1,5] 询问</text>
  <rect x="224" y="266" width="64" height="26" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="256" y="283" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">{0,4}</text>
  <rect x="288" y="266" width="66" height="26" rx="3" fill="#ffffff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="321" y="283" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">{4,2}</text>
  <rect x="354" y="266" width="144" height="26" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="426" y="283" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#2f5426" filter="url(#rough2)">C=0 → 0</text>

  <!-- 底注 -->
  <text x="28" y="314" font-size="9.5" fill="#888" filter="url(#rough2)">例1①：断点从边 1 平移到边 0，极大段由 (1,1] 旋转为 (0,0]，长度仍是 5；</text>
  <text x="28" y="330" font-size="9.5" fill="#888" filter="url(#rough2)">例1② 的 2 个组：窗口 [1,2,3,4] 与 [2,3,4,0]（后者绕回接缝）；例2① 的 2 个组：(1,2,3) 与 (2,3,4)。</text>
  <text x="28" y="346" font-size="9.5" fill="#b85450" filter="url(#rough2)">brk 用「边号」记录断点：边 j 连接瓷砖 j 与 j+1（mod n）；m 个断点恰切出 m 段。</text>
</svg>
