<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 490"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="490" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：二分答案 + 按位贡献 check</text>
  <text x="260" y="40" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">找最大 n 使 S(n) = n(n−1)/2 · T(n) ≤ s，单次 check 只要 O(log n)</text>

  <!-- 开始 -->
  <rect x="145" y="54" width="170" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="230" y="73" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">读入 s（0 ≤ s ≤ 10^15）</text>

  <path d="M 230 84 L 230 96" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="75" y="98" width="310" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="230" y="114" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">l = 1，r = 1330（二分答案）</text>
  <text x="230" y="132" text-anchor="middle" font-size="9.5" fill="#33506b" filter="url(#rough2)">上界由来：j∨k ≥ k ⇒ S(n) ≥ (n−1)⁵/4 &gt; 10^15 ⇒ n ≤ 1320</text>

  <path d="M 230 142 L 230 156" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形A：l < r ? -->
  <polygon points="230,158 310,196 230,234 150,196" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="201" text-anchor="middle" font-size="11.5" fill="#33506b" filter="url(#rough2)">l &lt; r ?</text>

  <path d="M 310 196 L 344 196" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="327" y="188" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">否</text>

  <rect x="348" y="178" width="146" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="421" y="193" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">返回 l ✓</text>
  <text x="421" y="207" text-anchor="middle" font-size="9.5" fill="#2f5d24" filter="url(#rough2)">最大可行 n</text>

  <path d="M 230 234 L 230 252" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="242" y="248" font-size="9" fill="#a07830" filter="url(#rough2)">是</text>

  <!-- 循环体虚线框 -->
  <rect x="10" y="256" width="472" height="196" fill="none" stroke="#999" stroke-width="1.3" stroke-dasharray="6 4" rx="12" filter="url(#rough2)"/>
  <text x="410" y="251" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">二分循环体：更新后回到顶部</text>

  <!-- 取中点 -->
  <rect x="120" y="262" width="220" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="230" y="282" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">m = (l + r + 1) / 2　偏右中点</text>

  <path d="M 230 294 L 230 306" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- check 框 -->
  <rect x="85" y="308" width="290" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="230" y="328" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">check(m)：按位贡献算 T(m)，O(log m)</text>
  <text x="230" y="348" text-anchor="middle" font-size="11" fill="#a07830" filter="url(#rough2)">S(m) = m(m−1)/2 · T(m)</text>

  <path d="M 230 360 L 230 372" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形B：S(m) ≤ s ? -->
  <polygon points="230,374 306,408 230,442 154,408" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="230" y="413" text-anchor="middle" font-size="11" fill="#33506b" filter="url(#rough2)">S(m) ≤ s ?</text>

  <path d="M 306 408 L 340 408" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="323" y="400" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">是</text>

  <rect x="344" y="390" width="132" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="410" y="405" text-anchor="middle" font-size="10.5" fill="#33506b" filter="url(#rough2)">l = m</text>
  <text x="410" y="419" text-anchor="middle" font-size="9" fill="#33506b" filter="url(#rough2)">m 可行，试更大的</text>

  <path d="M 154 408 L 120 408" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="137" y="400" text-anchor="middle" font-size="9" fill="#a07830" filter="url(#rough2)">否</text>

  <rect x="16" y="390" width="100" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="66" y="405" text-anchor="middle" font-size="10.5" fill="#8a3833" filter="url(#rough2)">r = m − 1</text>
  <text x="66" y="419" text-anchor="middle" font-size="9" fill="#8a3833" filter="url(#rough2)">m 太大，收缩</text>

  <!-- 底部注释 -->
  <text x="260" y="476" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">二分 O(log n) 轮 × 每轮 O(log n) 位循环 = O(log² n)，全程只有千百次整数运算，无溢出（上界处 S ≈ 1.7×10^15）</text>
</svg>
