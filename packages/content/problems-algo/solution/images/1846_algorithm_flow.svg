<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：排序 + 贪心封顶</text>

  <!-- Start node -->
  <ellipse cx="280" cy="56" rx="120" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="60" text-anchor="middle" font-size="12" fill="#333">开始：输入 arr</text>

  <!-- Arrow down to sort -->
  <path d="M 280 76 L 280 92" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Sort box -->
  <rect x="180" y="96" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="121" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">升序排序 arr</text>

  <!-- Arrow down -->
  <path d="M 280 136 L 280 152" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- arr[0]=1 box -->
  <rect x="180" y="156" width="200" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="181" text-anchor="middle" font-size="12" fill="#333">arr[0] = 1, prev = 1, i = 1</text>

  <!-- Arrow down to D1 -->
  <path d="M 280 196 L 280 214" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- D1: i < n ? -->
  <polygon points="280,218 370,252 280,286 190,252" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="256" text-anchor="middle" font-size="12" fill="#333">i &lt; n ?</text>

  <!-- D1 No -> return prev (right) -->
  <path d="M 370 252 L 410 252" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="388" y="244" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <rect x="410" y="230" width="130" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="475" y="250" text-anchor="middle" font-size="10" fill="#333">遍历完毕</text>
  <text x="475" y="266" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">返回 prev</text>

  <!-- D1 Yes -> cap box (down) -->
  <path d="M 280 286 L 280 306" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="302" font-size="11" fill="#82b366">是</text>

  <!-- cap box -->
  <rect x="160" y="310" width="240" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="332" text-anchor="middle" font-size="11" fill="#333">prev = min(arr[i], prev + 1)</text>
  <text x="280" y="352" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">取原值与前驱+1 的较小者</text>

  <!-- Arrow down to i++ box -->
  <path d="M 280 366 L 280 386" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i++ box -->
  <rect x="220" y="390" width="120" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="413" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">i++</text>

  <!-- i++ loop back to D1 -->
  <path d="M 340 408 L 460 408 L 460 252 L 370 252" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="470" y="330" font-size="10" fill="#888" transform="rotate(-90 470 330)">下一元素</text>

  <!-- Summary note -->
  <rect x="40" y="436" width="370" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="225" y="453" text-anchor="middle" font-size="10" fill="#666">关键：排序后非递减，只需封顶上界 arr[i] ≤ prev+1</text>
</svg>
