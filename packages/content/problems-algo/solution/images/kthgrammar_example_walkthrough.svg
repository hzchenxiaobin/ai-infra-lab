<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#446688" stroke-width="1.5"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#b85450" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n=4, k=5（下钻 + 回溯）</text>

  <!-- Column headers -->
  <text x="70" y="52" font-size="11" fill="#888">下钻（自顶向下）</text>
  <text x="430" y="52" font-size="11" fill="#888">回溯（自底向上）</text>

  <!-- ===== Level 4 (n=4, k=5) ===== -->
  <rect x="40" y="64" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="140" y="84" text-anchor="middle" font-size="12" fill="#333">(n=4, k=5)</text>
  <text x="140" y="98" text-anchor="middle" font-size="10" fill="#666">mid=4，k&gt;mid → 走后半</text>
  <!-- arrow down (red, flip) -->
  <path d="M 140 106 L 140 128" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="156" y="122" font-size="10" fill="#b85450">取反</text>

  <!-- ===== Level 3 (n=3, k=1) ===== -->
  <rect x="40" y="132" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="140" y="152" text-anchor="middle" font-size="12" fill="#333">(n=3, k=1)</text>
  <text x="140" y="166" text-anchor="middle" font-size="10" fill="#666">mid=2，k≤mid → 走前半</text>
  <path d="M 140 174 L 140 196" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="156" y="190" font-size="10" fill="#446688">同父</text>

  <!-- ===== Level 2 (n=2, k=1) ===== -->
  <rect x="40" y="200" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="140" y="220" text-anchor="middle" font-size="12" fill="#333">(n=2, k=1)</text>
  <text x="140" y="234" text-anchor="middle" font-size="10" fill="#666">mid=1，k≤mid → 走前半</text>
  <path d="M 140 242 L 140 264" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="156" y="258" font-size="10" fill="#446688">同父</text>

  <!-- ===== Level 1 (base) ===== -->
  <rect x="40" y="268" width="200" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="140" y="288" text-anchor="middle" font-size="12" fill="#333">(n=1, k=1)</text>
  <text x="140" y="302" text-anchor="middle" font-size="10" fill="#4a7a3a">基准 → 返回 0</text>

  <!-- ===== Backtrack column (right) ===== -->
  <!-- base value -->
  <rect x="380" y="268" width="140" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="450" y="288" text-anchor="middle" font-size="12" fill="#333">值 = 0</text>
  <text x="450" y="302" text-anchor="middle" font-size="10" fill="#4a7a3a">基准返回</text>
  <!-- arrow up -->
  <path d="M 450 268 L 450 246" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- level 2 backtrack -->
  <rect x="380" y="200" width="140" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="450" y="220" text-anchor="middle" font-size="12" fill="#333">值 = 0</text>
  <text x="450" y="234" text-anchor="middle" font-size="10" fill="#666">同父 → 不变</text>
  <path d="M 450 200 L 450 178" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- level 3 backtrack -->
  <rect x="380" y="132" width="140" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="450" y="152" text-anchor="middle" font-size="12" fill="#333">值 = 0</text>
  <text x="450" y="166" text-anchor="middle" font-size="10" fill="#666">同父 → 不变</text>
  <path d="M 450 132 L 450 110" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- level 4 backtrack (final) -->
  <rect x="380" y="64" width="140" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="450" y="84" text-anchor="middle" font-size="12" fill="#333">值 = 1</text>
  <text x="450" y="98" text-anchor="middle" font-size="10" fill="#b85450">取反 0 → 1（答案）</text>

  <!-- connector arrow base->level2 backtrack (horizontal) -->
  <path d="M 240 288 L 380 288" stroke="#888" stroke-width="1.2" stroke-dasharray="3,3" fill="none" filter="url(#rough2)"/>

  <!-- bottom insight -->
  <rect x="40" y="324" width="460" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="344" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">下钻 3 次到基准 0，回溯时只在「走后半」处取反一次</text>
  <text x="270" y="360" text-anchor="middle" font-size="11" fill="#666">第 4 行 01101001 的第 5 位 = 1 ✓</text>
</svg>
