<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 572"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="572" fill="#fafafa"/>
  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">单趟扫描：查首现 → 距离 ≥ 3 就切割并清空</text>

  <!-- 开始 -->
  <rect x="210" y="34" width="110" height="26" rx="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="265" y="52" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">开始</text>
  <path d="M 265 60 L 265 72" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 初始化 -->
  <rect x="165" y="76" width="200" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="265" y="95" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">ans ← 0，first ← ∅</text>
  <path d="M 265 106 L 265 118" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 循环条件 -->
  <polygon points="265,122 357,152 265,182 173,152" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="265" y="157" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">i &lt; n ?</text>

  <text x="365" y="142" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 357 152 L 428 152" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <rect x="432" y="135" width="110" height="30" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="487" y="154" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">return ans ✓</text>

  <text x="273" y="200" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 265 182 L 265 208" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 取字符 -->
  <rect x="185" y="212" width="160" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="265" y="231" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">c ← word[i]</text>
  <path d="M 265 242 L 265 254" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- c ∈ first ? -->
  <polygon points="265,258 360,288 265,318 170,288" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="265" y="293" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">c ∈ first ?</text>

  <text x="156" y="280" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 170 288 L 128 288" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <rect x="24" y="270" width="104" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="76" y="287" text-anchor="middle" font-size="11.5" fill="#446688" filter="url(#rough2)">first[c] ← i</text>
  <text x="76" y="303" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">（记录首现）</text>

  <text x="273" y="336" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 265 318 L 265 344" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 距离判定 -->
  <polygon points="265,348 382,380 265,412 148,380" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="265" y="385" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">i − first[c] ≥ 3 ?</text>

  <text x="390" y="372" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M 382 380 L 440 380 L 440 521 L 346 521" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="448" y="452" font-size="9.5" fill="#666" filter="url(#rough2)">距离不足：</text>
  <text x="448" y="465" font-size="9.5" fill="#666" filter="url(#rough2)">保留旧首现</text>

  <text x="273" y="428" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M 265 412 L 265 436" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 切割 -->
  <rect x="155" y="440" width="220" height="46" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="265" y="459" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">ans ← ans + 1；first ← ∅</text>
  <text x="265" y="477" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✂ 切出子串 [first[c], i]</text>
  <path d="M 265 486 L 265 502" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 首现分支汇入 i++ -->
  <path d="M 76 310 L 76 521 L 184 521" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i++ -->
  <rect x="190" y="506" width="150" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="265" y="525" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">i ← i + 1</text>

  <!-- 回跳 -->
  <path d="M 265 536 L 265 544 L 12 544 L 12 152 L 167 152" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="86" y="142" font-size="10" fill="#446688" filter="url(#rough2)">下一轮</text>

  <text x="280" y="562" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">距离不足时什么都不做：保留更早的 first[c]，换晚出现只会让距离更小</text>
</svg>
