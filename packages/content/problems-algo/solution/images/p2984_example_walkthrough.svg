<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：hourly 计数 → rk = 1 过滤 → 双降序输出</text>

  <text x="155" y="42" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">hourly 中间表（+ rk）</text>

  <rect x="30" y="46" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="130" y="46" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="180" y="46" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="230" y="46" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="62" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">city</text>
  <text x="155" y="62" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">时</text>
  <text x="205" y="62" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">cnt</text>
  <text x="255" y="62" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">rk</text>

  <rect x="30" y="70" width="100" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="130" y="70" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="180" y="70" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="230" y="70" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="86" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Houston</text>
  <text x="155" y="86" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">22</text>
  <text x="205" y="86" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="255" y="86" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1★</text>

  <rect x="30" y="94" width="100" height="24" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="130" y="94" width="50" height="24" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="180" y="94" width="50" height="24" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <rect x="230" y="94" width="50" height="24" fill="#ffffff" stroke="#999" stroke-width="1" filter="url(#rough2)"/>
  <text x="80" y="110" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">Houston</text>
  <text x="155" y="110" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">21</text>
  <text x="205" y="110" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">1</text>
  <text x="255" y="110" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">2</text>

  <rect x="30" y="118" width="100" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="130" y="118" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="180" y="118" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="230" y="118" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">New York</text>
  <text x="155" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">14</text>
  <text x="205" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="255" y="134" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1★</text>

  <rect x="30" y="142" width="100" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="130" y="142" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="180" y="142" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="230" y="142" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="80" y="158" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">New York</text>
  <text x="155" y="158" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">13</text>
  <text x="205" y="158" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="255" y="158" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">1★</text>

  <path d="M 285 104 L 328 104" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="306" y="96" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">rk=1</text>
  <text x="306" y="120" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">过滤</text>

  <text x="432" y="42" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">最终输出</text>

  <rect x="335" y="46" width="92" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="427" y="46" width="48" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="475" y="46" width="48" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="381" y="62" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">city</text>
  <text x="451" y="62" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">hour</text>
  <text x="499" y="62" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">cnt</text>

  <rect x="335" y="70" width="92" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="427" y="70" width="48" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="475" y="70" width="48" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="381" y="86" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Houston</text>
  <text x="451" y="86" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">22</text>
  <text x="499" y="86" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>

  <rect x="335" y="94" width="92" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="427" y="94" width="48" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="475" y="94" width="48" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="381" y="110" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">New York</text>
  <text x="451" y="110" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">14</text>
  <text x="499" y="110" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <rect x="335" y="118" width="92" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="427" y="118" width="48" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="475" y="118" width="48" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="381" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">New York</text>
  <text x="451" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">13</text>
  <text x="499" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>

  <rect x="30" y="188" width="500" height="146" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="214" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">Houston：22 时 3 通（22:04 / 22:46 / 22:57）＞ 21 时 1 通 → 峰值 22</text>
  <text x="280" y="240" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">New York：13 时与 14 时各 1 通，并列最多 → 两行都保留</text>
  <text x="280" y="266" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">RANK 并列时同名次：三个 rk=1 全部入选，rk=2 被淘汰</text>
  <text x="280" y="292" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">最后按 hour DESC, city DESC 排序：22 → 14 → 13</text>
  <text x="280" y="316" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">（hour 相同时再按城市名降序）</text>
</svg>
