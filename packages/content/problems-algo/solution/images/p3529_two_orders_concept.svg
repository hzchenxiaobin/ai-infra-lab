  <text x="400" y="221" text-anchor="middle" font-size="10.5" fill="#8a6d3a" filter="url(#rough2)">坐标映射：V 位置 p → 格子 (p mod m, p div m)</text>
  <text x="400" y="239" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">→ 行优先下标 (p mod m)·n + p div m，再查 hcov</text>

  <!-- ══════════ 结论框 ══════════ -->
  <rect x="252" y="258" width="296" height="64" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="400" y="278" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">匹配覆盖连续区间 [p, p+L−1] → 差分 O(1) 打标</text>
  <text x="400" y="296" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">前缀和还原 → hcov / vcov 两套布尔覆盖</text>
  <text x="400" y="314" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">答案 = 两套覆盖按格子取交集（4 格）</text>
