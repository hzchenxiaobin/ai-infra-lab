<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：head = [1,2,3,4]</text>

  <!-- Step 0: count -->
  <text x="36" y="56" font-size="12" fill="#888">计数：</text>
  <rect x="80" y="42" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="104" y="61" text-anchor="middle" font-size="12" fill="#4a7a3a">1</text>
  <path d="M 128 56 L 144 56" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="148" y="42" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="172" y="61" text-anchor="middle" font-size="12" fill="#4a7a3a">2</text>
  <path d="M 196 56 L 212 56" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="216" y="42" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="240" y="61" text-anchor="middle" font-size="12" fill="#4a7a3a">3</text>
  <path d="M 264 56 L 280 56" stroke="#4a7a3a" stroke-width="1.2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <rect x="284" y="42" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="308" y="61" text-anchor="middle" font-size="12" fill="#4a7a3a">4</text>
  <text x="346" y="61" font-size="12" fill="#4a7a3a" font-weight="bold">n = 4</text>

  <!-- Divider -->
  <path d="M 40 86 L 520 86" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Round i=4 -->
  <text x="36" y="112" font-size="12" fill="#446688" font-weight="bold">i=4</text>
  <rect x="76" y="98" width="48" height="28" fill="#eee" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="100" y="117" text-anchor="middle" font-size="12" fill="#aaa">1</text>
  <path d="M 124 112 L 140 112" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" fill="none" filter="url(#rough2)"/>
  <rect x="144" y="98" width="48" height="28" fill="#eee" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="168" y="117" text-anchor="middle" font-size="12" fill="#aaa">2</text>
  <path d="M 192 112 L 208 112" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" fill="none" filter="url(#rough2)"/>
  <rect x="212" y="98" width="48" height="28" fill="#eee" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="236" y="117" text-anchor="middle" font-size="12" fill="#aaa">3</text>
  <path d="M 260 112 L 276 112" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" fill="none" filter="url(#rough2)"/>
  <rect x="280" y="98" width="48" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="304" y="117" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">4</text>
  <path d="M 332 112 L 380 112" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="392" y="117" font-size="12" fill="#b85450" font-weight="bold">print 4 ✓</text>
  <text x="470" y="117" font-size="10.5" fill="#888">走了 3 步</text>

  <!-- Round i=3 -->
  <text x="36" y="158" font-size="12" fill="#446688" font-weight="bold">i=3</text>
  <rect x="76" y="144" width="48" height="28" fill="#eee" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="100" y="163" text-anchor="middle" font-size="12" fill="#aaa">1</text>
  <path d="M 124 158 L 140 158" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" fill="none" filter="url(#rough2)"/>
  <rect x="144" y="144" width="48" height="28" fill="#eee" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="168" y="163" text-anchor="middle" font-size="12" fill="#aaa">2</text>
  <path d="M 192 158 L 208 158" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" fill="none" filter="url(#rough2)"/>
  <rect x="212" y="144" width="48" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="236" y="163" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3</text>
  <path d="M 262 158 L 380 158" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="392" y="163" font-size="12" fill="#b85450" font-weight="bold">print 3 ✓</text>
  <text x="470" y="163" font-size="10.5" fill="#888">走了 2 步</text>

  <!-- Round i=2 -->
  <text x="36" y="204" font-size="12" fill="#446688" font-weight="bold">i=2</text>
  <rect x="76" y="190" width="48" height="28" fill="#eee" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="100" y="209" text-anchor="middle" font-size="12" fill="#aaa">1</text>
  <path d="M 124 204 L 140 204" stroke="#bbb" stroke-width="1" stroke-dasharray="3,2" fill="none" filter="url(#rough2)"/>
  <rect x="144" y="190" width="48" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="168" y="209" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2</text>
  <path d="M 194 204 L 380 204" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="392" y="209" font-size="12" fill="#b85450" font-weight="bold">print 2 ✓</text>
  <text x="470" y="209" font-size="10.5" fill="#888">走了 1 步</text>

  <!-- Round i=1 -->
  <text x="36" y="250" font-size="12" fill="#446688" font-weight="bold">i=1</text>
  <rect x="76" y="236" width="48" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="100" y="255" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>
  <path d="M 126 250 L 380 250" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="392" y="255" font-size="12" fill="#b85450" font-weight="bold">print 1 ✓</text>
  <text x="470" y="255" font-size="10.5" fill="#888">走了 0 步</text>

  <!-- Divider -->
  <path d="M 40 286 L 520 286" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- Output summary -->
  <text x="36" y="316" font-size="12" fill="#555" font-weight="bold">输出序列：</text>
  <rect x="120" y="300" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="142" y="319" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">4</text>
  <rect x="168" y="300" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="190" y="319" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">3</text>
  <rect x="216" y="300" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="238" y="319" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2</text>
  <rect x="264" y="300" width="44" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="286" y="319" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">1</text>

  <!-- Cost summary -->
  <rect x="60" y="346" width="440" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="368" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">总步数 = (3+2+1+0) + 计数 4 步 = 10 步</text>
  <text x="280" y="388" text-anchor="middle" font-size="11" fill="#888">n=4 时总访问 ≈ n + n(n−1)/2 = O(n²)，但全程只用 2 个指针变量 = O(1) 空间</text>
</svg>
