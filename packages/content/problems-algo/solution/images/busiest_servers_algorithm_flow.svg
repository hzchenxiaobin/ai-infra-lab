<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：有序集合 + 优先队列</text>

  <!-- Step 1: Initialize -->
  <rect x="40" y="48" width="480" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <circle cx="68" cy="76" r="16" fill="#446688" filter="url(#rough2)"/>
  <text x="68" y="80" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">1</text>
  <text x="100" y="72" font-size="12" fill="#333" font-weight="bold">初始化</text>
  <text x="100" y="90" font-size="11" fill="#555">free = {0,1,…,k−1}（有序集合）；busy = ∅（最小堆）；cnt = [0]*k</text>

  <path d="M 280 104 L 280 124" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: Loop header -->
  <rect x="40" y="126" width="480" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <circle cx="68" cy="151" r="16" fill="#d6a040" filter="url(#rough2)"/>
  <text x="68" y="155" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">2</text>
  <text x="100" y="147" font-size="12" fill="#333" font-weight="bold">遍历每个请求 i = 0 … n−1</text>
  <text x="100" y="165" font-size="11" fill="#555">start = arrival[i]，end = start + load[i]，target = i % k</text>

  <path d="M 280 176 L 280 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: Release -->
  <rect x="40" y="198" width="480" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <circle cx="68" cy="226" r="16" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="68" y="230" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">3</text>
  <text x="100" y="222" font-size="12" fill="#333" font-weight="bold">释放已完工的服务器</text>
  <text x="100" y="240" font-size="11" fill="#555">while busy 非空且队首 end ≤ start：弹出，把 server 加回 free</text>

  <path d="M 280 254 L 280 274" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: Check empty (decision) -->
  <rect x="40" y="276" width="480" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <circle cx="68" cy="304" r="16" fill="#b85450" filter="url(#rough2)"/>
  <text x="68" y="308" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">4</text>
  <text x="100" y="300" font-size="12" fill="#333" font-weight="bold">free 为空？</text>
  <text x="100" y="318" font-size="11" fill="#555">是 → 丢弃该请求，回到步骤 2 处理下一个 i</text>

  <path d="M 280 332 L 280 352" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: Pick server -->
  <rect x="40" y="354" width="480" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <circle cx="68" cy="382" r="16" fill="#d6a040" filter="url(#rough2)"/>
  <text x="68" y="386" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">5</text>
  <text x="100" y="378" font-size="12" fill="#333" font-weight="bold">选服务器 + 分配</text>
  <text x="100" y="396" font-size="11" fill="#555">server = ceiling(target)；若空 → free[0]。cnt[server]++，入 busy(end,server)，移出 free</text>

  <!-- loop back arrow from step5 right side up to step2 right side -->
  <path d="M 520 382 L 544 382 L 544 151 L 520 151" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="548" y="270" font-size="10" fill="#888" writing-mode="tb">下一个请求</text>

  <!-- Step 6: Return -->
  <path d="M 280 410 L 280 428" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="40" y="430" width="480" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <circle cx="68" cy="450" r="14" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="68" y="454" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">6</text>
  <text x="100" y="446" font-size="12" fill="#333" font-weight="bold">返回 cnt 中等于最大值的所有 server</text>
  <text x="100" y="462" font-size="10" fill="#888">mx = max(cnt)；ans = [i for i if cnt[i]==mx]</text>
</svg>
