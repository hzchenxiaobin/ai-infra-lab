<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 390" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="390" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">优势洗牌算法流程（田忌赛马双指针）</text>

  <!-- Start -->
  <rect x="150" y="40" width="240" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="58" text-anchor="middle" font-size="11" fill="#333">排序 A 升序；idx 按 B 值升序排序</text>
  <text x="270" y="76" text-anchor="middle" font-size="11" fill="#333">lo = 0, hi = n−1, k = n−1</text>
  <path d="M 270 88 L 270 98" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- While diamond: k >= 0 ? -->
  <polygon points="270,100 370,140 270,180 170,140" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="144" text-anchor="middle" font-size="11" fill="#444">k ≥ 0 ?</text>

  <!-- No branch -> return -->
  <path d="M 370 140 L 432 140" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="384" y="134" font-size="11" fill="#b85450">否</text>
  <rect x="432" y="126" width="86" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="475" y="145" text-anchor="middle" font-size="11" fill="#333">return ans</text>

  <!-- Yes down -->
  <text x="278" y="196" font-size="11" fill="#4a7a3a">是</text>
  <path d="M 270 180 L 270 192" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i = idx[k] -->
  <rect x="110" y="194" width="320" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="213" text-anchor="middle" font-size="11" fill="#333">i = idx[k]   （当前最大 B 的原下标）</text>
  <path d="M 270 224 L 270 234" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision diamond: A[hi] > B[i] ? -->
  <polygon points="270,236 380,276 270,316 160,276" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="280" text-anchor="middle" font-size="11" fill="#444">A[hi] &gt; B[i] ?</text>

  <!-- Yes (left): win -->
  <path d="M 160 276 L 96 276" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="108" y="270" font-size="11" fill="#4a7a3a">是</text>
  <rect x="14" y="258" width="82" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="55" y="273" text-anchor="middle" font-size="10" fill="#333">ans[i] = A[hi]</text>
  <text x="55" y="287" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">hi−−</text>

  <!-- No (right): sacrifice -->
  <path d="M 380 276 L 444 276" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="270" font-size="11" fill="#b85450">否</text>
  <rect x="444" y="258" width="82" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="485" y="273" text-anchor="middle" font-size="10" fill="#333">ans[i] = A[lo]</text>
  <text x="485" y="287" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">lo++</text>

  <!-- merge down -->
  <path d="M 55 294 L 55 322 L 270 322" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 485 294 L 485 322 L 270 322" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 270 316 L 270 324" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decrement k -->
  <rect x="230" y="326" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="344" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">k −−</text>

  <!-- loop back to while diamond -->
  <path d="M 230 340 L 30 340 L 30 140 L 170 140" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="22" y="240" font-size="10" fill="#4a7a3a" transform="rotate(-90 22 240)">回到循环</text>
</svg>
