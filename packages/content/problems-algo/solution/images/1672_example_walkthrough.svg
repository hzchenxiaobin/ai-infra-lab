<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="280" fill="#fafafa"/>

  <text x="270" y="30" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    示例演算：accounts = [[2,8,7],[7,1,3],[1,9,5]]
  </text>

  <!-- header row -->
  <rect x="60" y="54" width="50" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="85" y="73" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">客户</text>
  <rect x="115" y="54" width="55" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="73" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">银行0</text>
  <rect x="175" y="54" width="55" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="73" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">银行1</text>
  <rect x="235" y="54" width="55" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="262" y="73" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">银行2</text>
  <rect x="295" y="54" width="70" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="73" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">资产总量</text>
  <rect x="370" y="54" width="80" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="73" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">滚动 max</text>

  <!-- Row 0: 2,8,7 -> 17 (sets max) -->
  <rect x="60" y="92" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="85" y="112" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <rect x="115" y="92" width="55" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="112" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="175" y="92" width="55" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="112" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">8</text>
  <rect x="235" y="92" width="55" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="262" y="112" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <rect x="295" y="92" width="70" height="30" fill="#fff8e1" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="330" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">17</text>
  <rect x="370" y="92" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="112" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">17 ← 新</text>

  <!-- Row 1: 7,1,3 -> 11 -->
  <rect x="60" y="130" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="85" y="150" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="115" y="130" width="55" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="150" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">7</text>
  <rect x="175" y="130" width="55" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="150" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="235" y="130" width="55" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="262" y="150" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="295" y="130" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="150" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">11</text>
  <rect x="370" y="130" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="150" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">17（不变）</text>

  <!-- Row 2: 1,9,5 -> 15 -->
  <rect x="60" y="168" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="85" y="188" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="115" y="168" width="55" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="188" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <rect x="175" y="168" width="55" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="188" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">9</text>
  <rect x="235" y="168" width="55" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="262" y="188" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="295" y="168" width="70" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="330" y="188" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">15</text>
  <rect x="370" y="168" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="188" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">17（不变）</text>

  <!-- answer -->
  <path d="M410,210 L410,232" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="340" y="236" width="150" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="415" y="257" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">答案 = max = 17 ✓</text>

  <!-- side note -->
  <rect x="60" y="220" width="260" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="190" y="242" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">
    行和序列 = [17, 11, 15]
  </text>
  <text x="190" y="259" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">
    首行即命中最大值，后续仅做比较不更新
  </text>
</svg>
