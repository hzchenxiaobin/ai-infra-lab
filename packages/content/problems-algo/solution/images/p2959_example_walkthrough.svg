<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">示例 1 演算：n=3，maxDistance=5（边：0-1=2，1-2=10，0-2=10）</text>

  <!-- header row -->
  <rect x="60" y="40" width="90" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="105" y="57" text-anchor="middle" font-size="11" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">开放集合</text>
  <rect x="150" y="40" width="70" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="185" y="57" text-anchor="middle" font-size="11" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">mask</text>
  <rect x="220" y="40" width="220" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="330" y="57" text-anchor="middle" font-size="11" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">关键校验</text>
  <rect x="440" y="40" width="50" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="465" y="57" text-anchor="middle" font-size="11" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">判定</text>

  <!-- row 1: empty open set -->
  <rect x="60" y="70" width="90" height="28" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="105" y="88" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">∅（全关）</text>
  <rect x="150" y="70" width="70" height="28" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="185" y="88" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">000</text>
  <rect x="220" y="70" width="220" height="28" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="330" y="88" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">无点对，天然可行</text>
  <rect x="440" y="70" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="465" y="89" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓</text>

  <!-- row 2: {0} -->
  <rect x="60" y="98" width="90" height="28" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="105" y="116" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">{0}</text>
  <rect x="150" y="98" width="70" height="28" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="185" y="116" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">001</text>
  <rect x="220" y="98" width="220" height="28" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="330" y="116" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">无点对，天然可行</text>
  <rect x="440" y="98" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="465" y="117" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓</text>

  <!-- row 3: {1} -->
  <rect x="60" y="126" width="90" height="28" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="105" y="144" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">{1}</text>
  <rect x="150" y="126" width="70" height="28" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="185" y="144" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">010</text>
  <rect x="220" y="126" width="220" height="28" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="330" y="144" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">无点对，天然可行</text>
  <rect x="440" y="126" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="465" y="145" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓</text>

  <!-- row 4: {2} -->
  <rect x="60" y="154" width="90" height="28" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="105" y="172" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">{2}</text>
  <rect x="150" y="154" width="70" height="28" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="185" y="172" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">100</text>
  <rect x="220" y="154" width="220" height="28" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="330" y="172" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">无点对，天然可行</text>
  <rect x="440" y="154" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="465" y="173" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓</text>

  <!-- row 5: {0,1} -->
  <rect x="60" y="182" width="90" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="105" y="200" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">{0,1}</text>
  <rect x="150" y="182" width="70" height="28" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="185" y="200" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">011</text>
  <rect x="220" y="182" width="220" height="28" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="330" y="200" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">d(0,1) = 2 ≤ 5</text>
  <rect x="440" y="182" width="50" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="465" y="201" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">✓</text>

  <!-- row 6: {0,2} -->
  <rect x="60" y="210" width="90" height="28" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="105" y="228" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">{0,2}</text>
  <rect x="150" y="210" width="70" height="28" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="185" y="228" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">101</text>
  <rect x="220" y="210" width="220" height="28" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="330" y="228" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">d(0,2) = 10 &gt; 5</text>
  <rect x="440" y="210" width="50" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="465" y="229" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <!-- row 7: {1,2} -->
  <rect x="60" y="238" width="90" height="28" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="105" y="256" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">{1,2}</text>
  <rect x="150" y="238" width="70" height="28" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="185" y="256" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">110</text>
  <rect x="220" y="238" width="220" height="28" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="330" y="256" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">d(1,2) = 10 &gt; 5</text>
  <rect x="440" y="238" width="50" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="465" y="257" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <!-- row 8: {0,1,2} -->
  <rect x="60" y="266" width="90" height="28" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="105" y="284" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">{0,1,2}</text>
  <rect x="150" y="266" width="70" height="28" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="185" y="284" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">111</text>
  <rect x="220" y="266" width="220" height="28" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="330" y="284" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">d(0,2) = min(10, 2+10) = 10 &gt; 5</text>
  <rect x="440" y="266" width="50" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="465" y="285" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>

  <!-- bottom note -->
  <rect x="48" y="312" width="424" height="74" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="336" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">可行开放集 5 个：∅, {0}, {1}, {2}, {0,1} → ans = 5</text>
  <text x="260" y="358" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">⇔ 可行关闭集 5 个（补集一一对应）：{0,1,2}, {1,2}, {0,2}, {2}, ∅</text>
  <text x="260" y="378" text-anchor="middle" font-size="11" fill="#8f3a36" filter="url(#rough2)">⚠️ 全开时 d(0,2) = min(直达 10, 绕行 0→1→2 = 12) = 10 &gt; 5，故 ✗</text>
</svg>
