<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="330" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">示例演算：s = "011101"，ans = 5</text>
  <text x="330" y="44" text-anchor="middle" font-size="10.5" fill="#888">初始分割 i=0 得 5 分；之后每次右移只改一个计数器，ans 始终为 5</text>

  <!-- table header -->
  <rect x="40" y="60" width="580" height="28" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="65"  y="78" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">i</text>
  <text x="165" y="78" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">左 | 右</text>
  <text x="275" y="78" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">换边</text>
  <text x="345" y="78" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">leftZeros</text>
  <text x="415" y="78" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">rightOnes</text>
  <text x="490" y="78" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">score</text>
  <text x="575" y="78" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">ans</text>

  <!-- row i=0 (init, MAX) -->
  <rect x="40" y="88" width="580" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="65"  y="107" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <text x="165" y="107" text-anchor="middle" font-size="11" fill="#333"><tspan fill="#446688" font-weight="bold">0</tspan> | <tspan fill="#4a7a3a" font-weight="bold">11101</tspan></text>
  <text x="275" y="107" text-anchor="middle" font-size="11" fill="#888">—(初始)</text>
  <text x="345" y="107" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="415" y="107" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="490" y="107" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5</text>
  <text x="575" y="107" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5 ★</text>

  <!-- row i=1 -->
  <rect x="40" y="118" width="580" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="65"  y="137" text-anchor="middle" font-size="11" fill="#555">1</text>
  <text x="165" y="137" text-anchor="middle" font-size="11" fill="#333"><tspan fill="#446688" font-weight="bold">01</tspan> | <tspan fill="#4a7a3a" font-weight="bold">1101</tspan></text>
  <text x="275" y="137" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <text x="345" y="137" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="415" y="137" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="490" y="137" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="575" y="137" text-anchor="middle" font-size="11" fill="#333">5</text>

  <!-- row i=2 -->
  <rect x="40" y="148" width="580" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="65"  y="167" text-anchor="middle" font-size="11" fill="#555">2</text>
  <text x="165" y="167" text-anchor="middle" font-size="11" fill="#333"><tspan fill="#446688" font-weight="bold">011</tspan> | <tspan fill="#4a7a3a" font-weight="bold">101</tspan></text>
  <text x="275" y="167" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <text x="345" y="167" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="415" y="167" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="490" y="167" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="575" y="167" text-anchor="middle" font-size="11" fill="#333">5</text>

  <!-- row i=3 -->
  <rect x="40" y="178" width="580" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="65"  y="197" text-anchor="middle" font-size="11" fill="#555">3</text>
  <text x="165" y="197" text-anchor="middle" font-size="11" fill="#333"><tspan fill="#446688" font-weight="bold">0111</tspan> | <tspan fill="#4a7a3a" font-weight="bold">01</tspan></text>
  <text x="275" y="197" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">1</text>
  <text x="345" y="197" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="415" y="197" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">1</text>
  <text x="490" y="197" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="575" y="197" text-anchor="middle" font-size="11" fill="#333">5</text>

  <!-- row i=4 -->
  <rect x="40" y="208" width="580" height="30" rx="4" fill="#fafafa" stroke="#bbb" stroke-width="1.1" filter="url(#rough2)"/>
  <text x="65"  y="227" text-anchor="middle" font-size="11" fill="#555">4</text>
  <text x="165" y="227" text-anchor="middle" font-size="11" fill="#333"><tspan fill="#446688" font-weight="bold">01110</tspan> | <tspan fill="#4a7a3a" font-weight="bold">1</tspan></text>
  <text x="275" y="227" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">0</text>
  <text x="345" y="227" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="415" y="227" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="490" y="227" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="575" y="227" text-anchor="middle" font-size="11" fill="#333">5</text>

  <!-- legend / annotation -->
  <rect x="40" y="252" width="580" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="330" y="270" text-anchor="middle" font-size="10.5" fill="#555">「换边」= 本次从右移入左的字符：'1' → rightOnes−1（红色数字）；'0' → leftZeros+1（红色数字）</text>
  <text x="330" y="286" text-anchor="middle" font-size="10.5" fill="#555">初始 i=0 直接得到 score=5；之后每步仅改一个计数器，无任何重复清点</text>

  <!-- result box -->
  <rect x="40" y="302" width="580" height="40" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="330" y="320" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">最大得分 ans = 5（分割点 i = 0，左="0" 右="11101"）</text>
  <text x="330" y="336" text-anchor="middle" font-size="10.5" fill="#555">暴力需对每个分割点重数左右两段；增量法全程 5 次更新即得</text>

  <!-- bottom note -->
  <rect x="40" y="352" width="580" height="76" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="330" y="372" text-anchor="middle" font-size="10.5" fill="#555">对照示例 3：s = "1111"，无任何 '0'，leftZeros 恒为 0</text>
  <text x="330" y="388" text-anchor="middle" font-size="10.5" fill="#555">i=0：rightOnes=3 ⟹ score=3；i=1：2；i=2：1 ⟹ ans = 3</text>
  <text x="330" y="404" text-anchor="middle" font-size="10.5" fill="#555">全 1 串的最佳分割永远在最左（右侧保留尽可能多的 1）</text>
  <text x="330" y="420" text-anchor="middle" font-size="10" fill="#888">对称地，全 0 串的最佳分割在最右（左侧积累尽可能多的 0）</text>
</svg>
