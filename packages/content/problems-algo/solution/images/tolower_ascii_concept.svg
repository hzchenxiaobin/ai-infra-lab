<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：大小写 ASCII 码差 32（第 6 位不同）</text>

  <text x="60" y="78" font-size="12" fill="#888">大写</text>
  <rect x="100" y="56" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="128" y="78" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">A</text>
  <text x="172" y="78" font-size="12" fill="#666">=</text>
  <rect x="192" y="56" width="56" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="78" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">65</text>

  <text x="278" y="78" font-size="14" fill="#b85450" font-weight="bold">+32</text>

  <text x="330" y="78" font-size="12" fill="#888">小写</text>
  <rect x="372" y="56" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="400" y="78" text-anchor="middle" font-size="16" fill="#333" font-weight="bold">a</text>
  <text x="444" y="78" font-size="12" fill="#666">=</text>
  <rect x="464" y="56" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="492" y="78" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">97</text>

  <path d="M 220 96 L 220 120 L 400 120 L 400 96" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="116" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">差值恒为 32</text>

  <text x="60" y="160" font-size="12" fill="#555" font-weight="bold">二进制视角：</text>
  <rect x="100" y="142" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="128" y="162" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">A</text>
  <text x="172" y="162" font-size="12" fill="#666">=</text>
  <rect x="196" y="142" width="220" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="306" y="162" text-anchor="middle" font-size="12" fill="#888" font-family="monospace">01000001</text>

  <rect x="100" y="184" width="56" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="128" y="204" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <text x="172" y="204" font-size="12" fill="#666">=</text>
  <rect x="196" y="184" width="220" height="30" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="306" y="204" text-anchor="middle" font-size="12" fill="#888" font-family="monospace">01100001</text>

  <rect x="296" y="142" width="20" height="30" fill="none" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <rect x="296" y="184" width="20" height="30" fill="none" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="430" y="162" font-size="10" fill="#b85450">第6位 = 0</text>
  <text x="430" y="204" font-size="10" fill="#4a7a3a">第6位 = 1</text>

  <rect x="40" y="238" width="480" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="262" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">位运算技巧：c | 0x20 （置第 6 位为 1）</text>
  <text x="280" y="282" text-anchor="middle" font-size="11" fill="#555">01000001 | 00100000 = 01100001 &#8594; 大写变小写</text>

  <rect x="40" y="312" width="480" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="336" text-anchor="middle" font-size="11" fill="#444">⚠ 仅对大写字母生效。非字母字符的第 6 位可能有意义，</text>
  <text x="280" y="354" text-anchor="middle" font-size="11" fill="#444">故须先判定 'A' ≤ c ≤ 'Z' 再转换。</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>
</svg>
