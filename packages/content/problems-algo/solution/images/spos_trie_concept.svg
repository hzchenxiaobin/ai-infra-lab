<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="11" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="1.4"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>
  <rect width="760" height="400" fill="#fdfcf7"/>

  <text x="380" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">Trie 节点 cnt = 该前缀的「分数」</text>
  <path d="M 210 42 Q 380 50 550 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>
  <text x="380" y="60" text-anchor="middle" font-size="11" fill="#888">words = ["abc","ab","bc","b"]，建 Trie 后每个节点记 cnt = 经过它的单词数</text>

  <!-- root -->
  <g filter="url(#sk)">
    <circle cx="70" cy="200" r="20" fill="#f0f0f0" stroke="#888" stroke-width="1.4"/>
  </g>
  <text x="70" y="204" text-anchor="middle" font-size="11" fill="#555">root</text>
  <text x="70" y="232" text-anchor="middle" font-size="9" fill="#aaa">空串不计分</text>

  <!-- branch a (top): a, ab, abc -->
  <path d="M 88 192 L 178 120" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="120" y="150" font-size="11" fill="#5a5a5a">a</text>
  <g filter="url(#sk)">
    <circle cx="198" cy="110" r="20" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.6"/>
  </g>
  <text x="198" y="114" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">a</text>
  <text x="198" y="142" text-anchor="middle" font-size="11" fill="#2e8b57" font-weight="bold">cnt=2</text>

  <path d="M 218 110 L 318 110" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="263" y="102" font-size="11" fill="#5a5a5a">b</text>
  <g filter="url(#sk)">
    <circle cx="338" cy="110" r="20" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.6"/>
  </g>
  <text x="338" y="114" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">b</text>
  <text x="338" y="142" text-anchor="middle" font-size="11" fill="#2e8b57" font-weight="bold">cnt=2</text>

  <path d="M 358 110 L 458 110" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="403" y="102" font-size="11" fill="#5a5a5a">c</text>
  <g filter="url(#sk)">
    <circle cx="478" cy="110" r="20" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.6"/>
  </g>
  <text x="478" y="114" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">c</text>
  <text x="478" y="142" text-anchor="middle" font-size="11" fill="#2e8b57" font-weight="bold">cnt=1</text>

  <!-- branch b (bottom): b, bc -->
  <path d="M 88 208 L 178 280" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk2)"/>
  <text x="120" y="262" font-size="11" fill="#5a5a5a">b</text>
  <g filter="url(#sk2)">
    <circle cx="198" cy="290" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="198" y="294" text-anchor="middle" font-size="11" fill="#2b4a6e" font-weight="bold">b</text>
  <text x="198" y="322" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">cnt=2</text>

  <path d="M 218 290 L 318 290" stroke="#5a5a5a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk2)"/>
  <text x="263" y="282" font-size="11" fill="#5a5a5a">c</text>
  <g filter="url(#sk2)">
    <circle cx="338" cy="290" r="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="338" y="294" text-anchor="middle" font-size="11" fill="#2b4a6e" font-weight="bold">c</text>
  <text x="338" y="322" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">cnt=1</text>

  <!-- explanation box -->
  <g filter="url(#sk)">
    <rect x="540" y="78" width="200" height="240" rx="8" fill="#fff8e1" stroke="#c98a2b" stroke-width="1"/>
  </g>
  <text x="640" y="102" text-anchor="middle" font-size="12" font-weight="bold" fill="#8a6a1a">💡 cnt 的含义</text>
  <g font-size="11" fill="#5a4a2a">
    <text x="552" y="128">节点 cnt =</text>
    <text x="552" y="146">「根→该节点」路径</text>
    <text x="552" y="164">作为前缀出现于</text>
    <text x="552" y="182">多少个单词 =</text>
    <text x="552" y="202" fill="#c04050" font-weight="bold">该前缀的分数</text>
  </g>
  <text x="552" y="230" font-size="10" fill="#5a4a2a">如 "a" 节点 cnt=2：</text>
  <text x="552" y="246" font-size="10" fill="#5a4a2a">"abc" 与 "ab" 都以</text>
  <text x="552" y="262" font-size="10" fill="#5a4a2a">"a" 为前缀 → 分数 2</text>
  <text x="552" y="290" font-size="10" fill="#2e8b57" font-weight="bold">插入时沿路径每个</text>
  <text x="552" y="306" font-size="10" fill="#2e8b57" font-weight="bold">节点 cnt+1 即得。</text>

  <!-- bottom note: two different b nodes -->
  <g filter="url(#sk)">
    <rect x="40" y="345" width="490" height="40" rx="4" fill="#e8f0fa" stroke="#4a8edb" stroke-width="0.8"/>
  </g>
  <text x="285" y="362" text-anchor="middle" font-size="10" fill="#2b6e9e">⚠️ 上排绿 "b"(根→a→b, 前缀 "ab") 与下排蓝 "b"(根→b, 前缀 "b")</text>
  <text x="285" y="378" text-anchor="middle" font-size="10" fill="#2b6e9e">是不同节点——前缀身份由「根到节点的完整路径」决定，而非末字符。</text>
</svg>
