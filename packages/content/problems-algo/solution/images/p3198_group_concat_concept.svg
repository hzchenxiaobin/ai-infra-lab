<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="13" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：按州分组 → 组内排序 → 拼成一条逗号分隔串</text>

  <text x="146" y="50" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① GROUP BY state：9 行 → 3 组</text>

  <rect x="40" y="58" width="212" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="52" y="76" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">California</text>
  <text x="62" y="93" font-size="9" fill="#333" filter="url(#rough2)">• Los Angeles</text>
  <text x="62" y="107" font-size="9" fill="#333" filter="url(#rough2)">• San Francisco</text>
  <text x="62" y="121" font-size="9" fill="#333" filter="url(#rough2)">• San Diego</text>

  <rect x="40" y="130" width="212" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="52" y="148" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Texas</text>
  <text x="62" y="165" font-size="9" fill="#333" filter="url(#rough2)">• Houston</text>
  <text x="62" y="179" font-size="9" fill="#333" filter="url(#rough2)">• Austin</text>
  <text x="62" y="193" font-size="9" fill="#333" filter="url(#rough2)">• Dallas</text>

  <rect x="40" y="202" width="212" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="52" y="220" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">New York</text>
  <text x="62" y="237" font-size="9" fill="#333" filter="url(#rough2)">• New York City</text>
  <text x="62" y="251" font-size="9" fill="#333" filter="url(#rough2)">• Buffalo</text>
  <text x="62" y="265" font-size="9" fill="#333" filter="url(#rough2)">• Rochester</text>

  <text x="420" y="50" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 组内处理（以 California 为例）</text>

  <text x="300" y="66" font-size="8" fill="#888" filter="url(#rough2)">输入序</text>
  <rect x="300" y="70" width="76" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="338" y="85" text-anchor="middle" font-size="8" fill="#333" filter="url(#rough2)">Los Angeles</text>
  <rect x="382" y="70" width="76" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="85" text-anchor="middle" font-size="8" fill="#333" filter="url(#rough2)">San Francisco</text>
  <rect x="464" y="70" width="76" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="502" y="85" text-anchor="middle" font-size="8" fill="#333" filter="url(#rough2)">San Diego</text>

  <path d="M 420 96 L 420 114" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="432" y="108" font-size="9" fill="#4a7a3a" filter="url(#rough2)">ORDER BY city（字典序）</text>

  <text x="300" y="130" font-size="8" fill="#888" filter="url(#rough2)">排序后</text>
  <rect x="300" y="134" width="76" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="338" y="149" text-anchor="middle" font-size="8" fill="#333" filter="url(#rough2)">Los Angeles</text>
  <rect x="382" y="134" width="76" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="420" y="149" text-anchor="middle" font-size="8" fill="#8a3030" font-weight="bold" filter="url(#rough2)">San Diego</text>
  <rect x="464" y="134" width="76" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="502" y="149" text-anchor="middle" font-size="8" fill="#8a3030" font-weight="bold" filter="url(#rough2)">San Francisco</text>
  <text x="420" y="166" text-anchor="middle" font-size="8" fill="#b85450" filter="url(#rough2)">SD 与 SF 换位了！</text>

  <path d="M 420 172 L 420 190" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="432" y="185" font-size="9" fill="#b85450" filter="url(#rough2)">GROUP_CONCAT + SEPARATOR</text>

  <rect x="300" y="194" width="240" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="420" y="213" text-anchor="middle" font-size="9.5" fill="#2d5a1e" font-weight="bold" filter="url(#rough2)">"Los Angeles, San Diego, San Francisco"</text>

  <rect x="300" y="234" width="240" height="44" fill="none" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="5,4" rx="8" filter="url(#rough2)"/>
  <text x="420" y="252" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">每个分组 → 结果一行</text>
  <text x="420" y="268" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">9 行 → 3 行：state + cities 拼接串</text>

  <rect x="40" y="288" width="500" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="312" text-anchor="middle" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">GROUP_CONCAT( city ORDER BY city SEPARATOR ', ' )</text>
  <text x="290" y="336" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">ORDER BY city → 组内字典序（不可省）　　SEPARATOR ', ' → 逗号 + 空格</text>
  <text x="290" y="356" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">⚠ 默认分隔符是裸逗号，必须显式写 ', ' 覆盖</text>
  <text x="290" y="376" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">主键 (state, city) 无重复 → 无需 DISTINCT（对照 1484）</text>
</svg>
