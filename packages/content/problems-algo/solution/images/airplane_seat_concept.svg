<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：冲突链最终在座位 1 与座位 n 之间二选一</text>

  <!-- ===== Section A: n seats in a row ===== -->
  <text x="40" y="56" font-size="11" fill="#888" font-weight="bold">飞机座位（n 个）：</text>

  <!-- seat 1 (special) -->
  <rect x="60" y="66" width="44" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="82" y="88" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">1</text>
  <text x="82" y="112" text-anchor="middle" font-size="9" fill="#b85450">座位1</text>

  <!-- seats 2..n-1 (dashed) -->
  <rect x="118" y="66" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="138" y="88" text-anchor="middle" font-size="11" fill="#446688">2</text>
  <text x="174" y="84" font-size="10" fill="#aaa">···</text>
  <rect x="196" y="66" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="216" y="88" text-anchor="middle" font-size="11" fill="#446688">k</text>
  <text x="252" y="84" font-size="10" fill="#aaa">···</text>
  <rect x="274" y="66" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="294" y="88" text-anchor="middle" font-size="11" fill="#446688">n-1</text>

  <!-- seat n (special) -->
  <rect x="332" y="66" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="354" y="88" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">n</text>
  <text x="354" y="112" text-anchor="middle" font-size="9" fill="#d6a040">座位n</text>

  <!-- labels for the two critical seats -->
  <rect x="48" y="118" width="336" height="22" fill="none" stroke="none"/>
  <text x="82" y="134" text-anchor="middle" font-size="9" fill="#b85450">↑ 被占则冲突结束</text>
  <text x="354" y="134" text-anchor="middle" font-size="9" fill="#d6a040">↑ 被占则最后乘客失败</text>

  <!-- ===== Section B: conflict chain ===== -->
  <text x="40" y="162" font-size="11" fill="#555" font-weight="bold">冲突链传播过程：</text>

  <!-- passenger 1 picks seat k -->
  <rect x="50" y="172" width="110" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="105" y="187" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">乘客1</text>
  <text x="105" y="200" text-anchor="middle" font-size="9" fill="#888">随机选了座位 k</text>

  <path d="M 162 190 L 192 190" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- passengers 2..k-1 fine -->
  <rect x="196" y="172" width="110" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="251" y="187" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">乘客2~k-1</text>
  <text x="251" y="200" text-anchor="middle" font-size="9" fill="#888">各坐各的座位 ✓</text>

  <path d="M 308 190 L 338 190" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- passenger k becomes new "passenger 1" -->
  <rect x="342" y="172" width="130" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="407" y="187" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">乘客k 发现被占</text>
  <text x="407" y="200" text-anchor="middle" font-size="9" fill="#888">→ 随机选剩余座位</text>

  <!-- ===== Section C: key symmetry ===== -->
  <path d="M 407 210 L 407 232" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="60" y="238" width="440" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="256" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">关键：冲突链中每个"被迫随机选"的乘客</text>
  <text x="280" y="274" text-anchor="middle" font-size="11" fill="#4a7a3a">只能在「座位 1」和「座位 n」之间选一个来终结冲突</text>

  <!-- ===== Section D: 50/50 symmetry ===== -->
  <path d="M 280 290 L 280 308" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- two branches: seat 1 vs seat n -->
  <rect x="80" y="314" width="180" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="170" y="330" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">先选到座位 1</text>
  <text x="170" y="345" text-anchor="middle" font-size="10" fill="#888">冲突结束，后续都坐对</text>

  <rect x="300" y="314" width="180" height="38" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="390" y="330" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">先选到座位 n</text>
  <text x="390" y="345" text-anchor="middle" font-size="10" fill="#888">最后乘客坐不到自己的位</text>

  <!-- = sign -->
  <text x="280" y="338" text-anchor="middle" font-size="14" fill="#888" font-weight="bold">VS</text>

  <!-- result -->
  <rect x="120" y="362" width="320" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="380" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">对称性 → 概率 = 1/2</text>
</svg>
