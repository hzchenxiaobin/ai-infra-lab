<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：建图 → Dijkstra 松弛 → 在 marked 取 min</text>

  <!-- Step 1 -->
  <rect x="40" y="56" width="480" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="58" y="78" font-size="12" fill="#446688" font-weight="bold">① 建无向邻接表</text>
  <text x="58" y="98" font-size="11" fill="#555">遍历 edges[u,v,w]，graph[u].add(v,w) 且 graph[v].add(u,w)</text>
  <text x="58" y="112" font-size="10" fill="#888">节点编号 0..n-1；若为有向图则只加单向边</text>

  <!-- arrow 1->2 -->
  <path d="M 280 116 L 280 138" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="40" y="142" width="480" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="58" y="164" font-size="12" fill="#d6a040" font-weight="bold">② 堆优化 Dijkstra 从 s 出发</text>
  <text x="58" y="184" font-size="11" fill="#555">dist[s]=0，其余 ∞；最小堆放入 (0, s)</text>
  <text x="58" y="202" font-size="11" fill="#555">循环：弹出 (d,u)；若 d&gt;dist[u] 跳过（懒删除）</text>
  <text x="58" y="220" font-size="11" fill="#555">对 u 的每条出边 (v,w)：若 d+w&lt;dist[v] 则更新并入堆</text>

  <!-- arrow 2->3 -->
  <path d="M 280 232 L 280 254" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="40" y="258" width="480" height="66" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="58" y="280" font-size="12" fill="#b85450" font-weight="bold">③ 在 marked 集合中取最小 dist</text>
  <text x="58" y="300" font-size="11" fill="#555">ans = min(dist[m] for m in marked)</text>
  <text x="58" y="316" font-size="10" fill="#888">若所有 marked 的 dist 均为 ∞ → 返回 -1</text>

  <!-- arrow 3->4 -->
  <path d="M 280 328 L 280 350" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4 -->
  <rect x="40" y="354" width="480" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="58" y="378" font-size="12" fill="#4a7a3a" font-weight="bold">④ 返回 ans</text>
  <text x="58" y="394" font-size="11" fill="#555">即「源 s 到任一标记节点的最短距离」</text>

  <!-- footer note -->
  <text x="40" y="430" font-size="10" fill="#888">边权非负 → 贪心正确；不必等到全图松弛完，可在弹出节点恰为 marked 时提前返回（优化）</text>
  <text x="40" y="446" font-size="10" fill="#888">注意：s 本身也可能在 marked 中，此时答案直接为 0</text>
</svg>
