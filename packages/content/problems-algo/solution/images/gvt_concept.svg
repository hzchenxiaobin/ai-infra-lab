<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">树 ⟺ n−1 条边 且 连通（缺一不可）</text>

  <!-- ===== Panel A: valid tree (top-left, green) ===== -->
  <rect x="20" y="44" width="260" height="146" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="150" y="64" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">① 合法树（n=4, 3 边）</text>
  <!-- path 0-1-2-3 -->
  <line x1="85" y1="120" x2="125" y2="120" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <line x1="145" y1="120" x2="185" y2="120" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <line x1="205" y1="120" x2="245" y2="120" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="75" cy="120" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="75" y="125" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <circle cx="135" cy="120" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="135" y="125" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <circle cx="195" cy="120" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="195" y="125" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <circle cx="255" cy="120" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="255" y="125" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="150" y="172" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">3 = n−1，连通 → ✅ 是树</text>

  <!-- ===== Panel B: too many edges / cycle (top-right, red) ===== -->
  <rect x="300" y="44" width="260" height="146" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="430" y="64" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">② 边过多（n=4, 4 边）</text>
  <!-- square cycle 0-1-2-3-0 -->
  <line x1="400" y1="105" x2="470" y2="105" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <line x1="470" y1="105" x2="470" y2="150" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <line x1="470" y1="150" x2="400" y2="150" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <line x1="400" y1="150" x2="400" y2="105" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="400" cy="105" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="400" y="110" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <circle cx="470" cy="105" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="470" y="110" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <circle cx="470" cy="150" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="470" y="155" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <circle cx="400" cy="150" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="400" y="155" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <text x="430" y="172" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4 ≠ n−1 → ❌（有环）</text>

  <!-- ===== Panel C: too few edges / disconnected (bottom-left, orange) ===== -->
  <rect x="20" y="200" width="260" height="146" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="150" y="220" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">③ 边过少（n=4, 2 边）</text>
  <!-- 0-1-2 path + node 3 isolated -->
  <line x1="85" y1="276" x2="125" y2="276" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <line x1="145" y1="276" x2="185" y2="276" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="75" cy="276" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="75" y="281" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <circle cx="135" cy="276" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="135" y="281" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <circle cx="195" cy="276" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="195" y="281" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <circle cx="255" cy="276" r="15" fill="none" stroke="#446688" stroke-width="1.8" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="255" y="281" text-anchor="middle" font-size="12" fill="#999" font-weight="bold">3</text>
  <text x="150" y="328" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">2 ≠ n−1 → ❌（不连通）</text>

  <!-- ===== Panel D: edges==n-1 but disconnected (bottom-right, orange) ===== -->
  <rect x="300" y="200" width="260" height="146" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="10" filter="url(#rough2)"/>
  <text x="430" y="220" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">④ 边数对但不连通（n=4, 3 边）</text>
  <!-- triangle 0-1-2-0 (cycle) + node 3 isolated -->
  <line x1="400" y1="262" x2="455" y2="262" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <line x1="455" y1="262" x2="427" y2="305" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <line x1="427" y1="305" x2="400" y2="262" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="400" cy="262" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="400" y="267" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <circle cx="455" cy="262" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="455" y="267" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <circle cx="427" cy="305" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="427" y="310" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>
  <circle cx="510" cy="285" r="15" fill="none" stroke="#446688" stroke-width="1.8" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="510" y="290" text-anchor="middle" font-size="12" fill="#999" font-weight="bold">3</text>
  <text x="430" y="328" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">3 = n−1 但不连通 → ❌（仍有环）</text>

  <!-- ===== summary box ===== -->
  <rect x="30" y="356" width="520" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="290" y="376" text-anchor="middle" font-size="11.5" fill="#444">边数检查拦住 ②③；连通检查拦住 ④ —— 两个条件都过才是树</text>
  <text x="290" y="394" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">判定 = ( edges.size() == n−1 ) ∧ ( 并查集连通分量数 == 1 )</text>
</svg>
