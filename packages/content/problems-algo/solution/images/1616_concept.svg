<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心概念：贪心外层匹配 + 中段回文检测</text>

  <!-- Part 1: Split operation -->
  <text x="30" y="52" font-size="12" fill="#888" font-weight="bold">① 分割与拼接：aprefix + bsuffix</text>

  <!-- string a -->
  <g filter="url(#rough2)">
    <rect x="80" y="62" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="100" y="81" text-anchor="middle" font-size="13" fill="#333">u</text>
    <rect x="120" y="62" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="140" y="81" text-anchor="middle" font-size="13" fill="#333">l</text>
    <rect x="160" y="62" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="180" y="81" text-anchor="middle" font-size="13" fill="#333">a</text>
    <rect x="200" y="62" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="220" y="81" text-anchor="middle" font-size="13" fill="#333">c</text>
    <rect x="240" y="62" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="260" y="81" text-anchor="middle" font-size="13" fill="#333">f</text>
    <rect x="280" y="62" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="300" y="81" text-anchor="middle" font-size="13" fill="#333">d</text>
  </g>
  <text x="60" y="81" text-anchor="end" font-size="11" fill="#446688" font-weight="bold">a =</text>
  <text x="170" y="54" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">aprefix</text>
  <text x="260" y="54" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">asuffix</text>
  <!-- split line -->
  <line x1="200" y1="58" x2="200" y2="96" stroke="#b85450" stroke-width="1.8" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="200" y="106" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">split i=3</text>

  <!-- string b -->
  <g filter="url(#rough2)">
    <rect x="80" y="120" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="100" y="139" text-anchor="middle" font-size="13" fill="#333">j</text>
    <rect x="120" y="120" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="140" y="139" text-anchor="middle" font-size="13" fill="#333">i</text>
    <rect x="160" y="120" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="180" y="139" text-anchor="middle" font-size="13" fill="#333">z</text>
    <rect x="200" y="120" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="220" y="139" text-anchor="middle" font-size="13" fill="#333">a</text>
    <rect x="240" y="120" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="260" y="139" text-anchor="middle" font-size="13" fill="#333">l</text>
    <rect x="280" y="120" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4"/>
    <text x="300" y="139" text-anchor="middle" font-size="13" fill="#333">u</text>
  </g>
  <text x="60" y="139" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">b =</text>
  <text x="170" y="112" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">bprefix</text>
  <text x="260" y="112" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">bsuffix</text>

  <!-- combined result -->
  <text x="30" y="172" font-size="11" fill="#444">aprefix + bsuffix =</text>
  <g filter="url(#rough2)">
    <rect x="160" y="160" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="175" y="176" text-anchor="middle" font-size="11" fill="#333">u</text>
    <rect x="190" y="160" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="205" y="176" text-anchor="middle" font-size="11" fill="#333">l</text>
    <rect x="220" y="160" width="30" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="3"/>
    <text x="235" y="176" text-anchor="middle" font-size="11" fill="#333">a</text>
    <rect x="250" y="160" width="30" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3"/>
    <text x="265" y="176" text-anchor="middle" font-size="11" fill="#333">a</text>
    <rect x="280" y="160" width="30" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3"/>
    <text x="295" y="176" text-anchor="middle" font-size="11" fill="#333">l</text>
    <rect x="310" y="160" width="30" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="3"/>
    <text x="325" y="176" text-anchor="middle" font-size="11" fill="#333">u</text>
  </g>
  <text x="355" y="176" font-size="11" fill="#4a7a3a" font-weight="bold">← 回文！</text>

  <!-- Part 2: Greedy two-pointer matching -->
  <text x="30" y="208" font-size="12" fill="#888" font-weight="bold">② 贪心外层匹配：a[l] ↔ b[r]，不匹配即停</text>

  <g filter="url(#rough2)">
    <!-- a row -->
    <rect x="80" y="218" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4"/>
    <text x="100" y="237" text-anchor="middle" font-size="13" fill="#333">u</text>
    <rect x="120" y="218" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="140" y="237" text-anchor="middle" font-size="13" fill="#333">l</text>
    <rect x="160" y="218" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="180" y="237" text-anchor="middle" font-size="13" fill="#333">a</text>
    <rect x="200" y="218" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="220" y="237" text-anchor="middle" font-size="13" fill="#333">c</text>
    <rect x="240" y="218" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="260" y="237" text-anchor="middle" font-size="13" fill="#333">f</text>
    <rect x="280" y="218" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="300" y="237" text-anchor="middle" font-size="13" fill="#333">d</text>
    <!-- b row -->
    <rect x="80" y="256" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="100" y="275" text-anchor="middle" font-size="13" fill="#333">j</text>
    <rect x="120" y="256" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="140" y="275" text-anchor="middle" font-size="13" fill="#333">i</text>
    <rect x="160" y="256" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="180" y="275" text-anchor="middle" font-size="13" fill="#333">z</text>
    <rect x="200" y="256" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="220" y="275" text-anchor="middle" font-size="13" fill="#333">a</text>
    <rect x="240" y="256" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="260" y="275" text-anchor="middle" font-size="13" fill="#333">l</text>
    <rect x="280" y="256" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4"/>
    <text x="300" y="275" text-anchor="middle" font-size="13" fill="#333">u</text>
  </g>
  <text x="60" y="237" text-anchor="end" font-size="11" fill="#446688" font-weight="bold">a</text>
  <text x="60" y="275" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">b</text>

  <!-- matching arrows -->
  <path d="M100,248 Q200,300 300,256" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="100" y="210" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">↑l</text>
  <text x="300" y="210" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">↑r</text>
  <text x="200" y="312" text-anchor="middle" font-size="10" fill="#b85450">a[l]='u' == b[r]='u' ✓ → l++, r--</text>

  <!-- Part 3: Middle palindrome fallback -->
  <text x="30" y="340" font-size="12" fill="#888" font-weight="bold">③ 不匹配时：检查 a[l..r] 或 b[l..r] 自身是否回文</text>

  <g filter="url(#rough2)">
    <rect x="80" y="352" width="40" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
    <rect x="120" y="352" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="140" y="371" text-anchor="middle" font-size="13" fill="#333">x</text>
    <rect x="160" y="352" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="180" y="371" text-anchor="middle" font-size="13" fill="#333">b</text>
    <rect x="200" y="352" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="220" y="371" text-anchor="middle" font-size="13" fill="#333">b</text>
    <rect x="240" y="352" width="40" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="260" y="371" text-anchor="middle" font-size="13" fill="#333">x</text>
    <rect x="280" y="352" width="40" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
  </g>
  <text x="60" y="371" text-anchor="end" font-size="11" fill="#888" font-weight="bold">中段</text>
  <text x="100" y="396" text-anchor="middle" font-size="9" fill="#888">已匹配</text>
  <text x="210" y="396" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">a[l..r] 或 b[l..r] 回文？</text>
  <text x="320" y="396" text-anchor="middle" font-size="9" fill="#888">已匹配</text>

  <rect x="370" y="348" width="180" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="460" y="370" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">中段全取自 a → i=r+1</text>
  <text x="460" y="388" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">中段全取自 b → i=l</text>
  <text x="460" y="402" text-anchor="middle" font-size="10" fill="#666">两方案只需验证其一</text>
</svg>
