<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心：建 Trie 一次，每个起点沿 Trie 边走边收集命中</text>

  <!-- ===== Trie Section ===== -->
  <text x="30" y="56" font-size="11.5" fill="#446688" font-weight="bold">Trie（由 words 构建，以 ["ab","aba"] 为例）</text>

  <circle cx="70" cy="96" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="70" y="100" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">root</text>

  <line x1="86" y1="96" x2="118" y2="96" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="102" y="90" text-anchor="middle" font-size="9" fill="#888">a</text>

  <circle cx="134" cy="96" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="134" y="100" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>

  <line x1="149" y1="96" x2="181" y2="96" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="165" y="90" text-anchor="middle" font-size="9" fill="#888">b</text>

  <circle cx="197" cy="96" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="197" y="100" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">b</text>
  <text x="197" y="128" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">★ is_end "ab"</text>

  <line x1="212" y1="96" x2="244" y2="96" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="228" y="90" text-anchor="middle" font-size="9" fill="#888">a</text>

  <circle cx="260" cy="96" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="100" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">a</text>
  <text x="260" y="128" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">★ is_end "aba"</text>

  <rect x="310" y="80" width="200" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="410" y="97" text-anchor="middle" font-size="10.5" fill="#333">"ab" 和 "aba" 共享前缀</text>
  <text x="410" y="112" text-anchor="middle" font-size="10" fill="#666">一条路径走完两个单词</text>

  <!-- ===== Text Section ===== -->
  <text x="30" y="162" font-size="11.5" fill="#b85450" font-weight="bold">text = "ababa"</text>

  <rect x="68" y="174" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="85" y="194" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <text x="85" y="168" text-anchor="middle" font-size="8.5" fill="#888">0</text>

  <rect x="104" y="174" width="34" height="30" fill="#fff8e1" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="121" y="194" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <text x="121" y="168" text-anchor="middle" font-size="8.5" fill="#888">1</text>

  <rect x="140" y="174" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="157" y="194" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <text x="157" y="168" text-anchor="middle" font-size="8.5" fill="#888">2</text>

  <rect x="176" y="174" width="34" height="30" fill="#fff8e1" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="193" y="194" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">b</text>
  <text x="193" y="168" text-anchor="middle" font-size="8.5" fill="#888">3</text>

  <rect x="212" y="174" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="229" y="194" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">a</text>
  <text x="229" y="168" text-anchor="middle" font-size="8.5" fill="#888">4</text>

  <!-- ===== Scan results ===== -->
  <text x="30" y="232" font-size="11" fill="#555" font-weight="bold">每个起点 i 沿 Trie 走，碰到 is_end 就记录 [i, j]：</text>

  <rect x="30" y="244" width="250" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="155" y="262" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">i=0: a→b(★)→a(★) → [0,1], [0,2]</text>

  <rect x="290" y="244" width="230" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="405" y="262" text-anchor="middle" font-size="10.5" fill="#888">i=1: b → root 无 b，停</text>

  <rect x="30" y="278" width="250" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="155" y="296" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">i=2: a→b(★)→a(★) → [2,3], [2,4]</text>

  <rect x="290" y="278" width="230" height="28" fill="#f0f0f0" stroke="#bbb" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="405" y="296" text-anchor="middle" font-size="10.5" fill="#888">i=3,4: 无命中</text>

  <!-- ===== Key insight ===== -->
  <rect x="30" y="322" width="480" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="270" y="342" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">边走边记：每个 is_end 节点都是一次命中，不必走完整条路径</text>

  <rect x="30" y="362" width="480" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="270" y="382" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">i 升序遍历 + 同 i 内 j 递增 → 结果天然有序，无需额外排序</text>
</svg>
