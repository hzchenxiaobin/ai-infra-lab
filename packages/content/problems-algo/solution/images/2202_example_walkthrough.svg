<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [5,2,2,4,0,6], k = 4</text>

  <!-- Step 1: Identify candidates -->
  <text x="280" y="52" text-anchor="middle" font-size="12" fill="#335" font-weight="bold">① 判定可达候选（2 ≤ k=4 ≤ n−1=5）</text>

  <!-- Array elements -->
  <!-- idx 0: 5, green -->
  <rect x="50" y="66" width="60" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="80" y="93" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold">5</text>
  <text x="80" y="120" text-anchor="middle" font-size="9.5" fill="#4a7a3a">idx 0 ✓</text>

  <!-- idx 1: 2, green -->
  <rect x="116" y="66" width="60" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="146" y="93" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold">2</text>
  <text x="146" y="120" text-anchor="middle" font-size="9.5" fill="#4a7a3a">idx 1 ✓</text>

  <!-- idx 2: 2, green (k-2) -->
  <rect x="182" y="66" width="60" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="212" y="93" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold">2</text>
  <text x="212" y="120" text-anchor="middle" font-size="9.5" fill="#4a7a3a">idx k−2 ✓</text>

  <!-- idx 3: 4, RED (gap, k-1) -->
  <rect x="248" y="66" width="60" height="42" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="278" y="93" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">4</text>
  <text x="278" y="120" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">idx k−1 ✗</text>

  <!-- idx 4: 0, green (k) -->
  <rect x="314" y="66" width="60" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="344" y="93" text-anchor="middle" font-size="14" fill="#3a5a2a" font-weight="bold">0</text>
  <text x="344" y="120" text-anchor="middle" font-size="9.5" fill="#4a7a3a">idx k ✓</text>

  <!-- idx 5: 6, gray -->
  <rect x="380" y="66" width="60" height="42" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="93" text-anchor="middle" font-size="14" fill="#999" font-weight="bold">6</text>
  <text x="410" y="120" text-anchor="middle" font-size="9.5" fill="#999">idx k+1</text>

  <!-- Arrow down -->
  <path d="M 280 136 L 280 152" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: Operation sequence -->
  <text x="280" y="168" text-anchor="middle" font-size="12" fill="#335" font-weight="bold">② 一种 4 步操作序列（推回 5）</text>

  <!-- Op 1 -->
  <rect x="40" y="180" width="110" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="95" y="203" text-anchor="middle" font-size="10.5" fill="#335">删除 5 → [2,2,4,0,6]</text>

  <path d="M 150 198 L 166 198" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Op 2 -->
  <rect x="168" y="180" width="110" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="223" y="203" text-anchor="middle" font-size="10.5" fill="#335">删除 2 → [2,4,0,6]</text>

  <path d="M 278 198 L 294 198" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Op 3 -->
  <rect x="296" y="180" width="110" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="351" y="203" text-anchor="middle" font-size="10.5" fill="#335">删除 2 → [4,0,6]</text>

  <path d="M 406 198 L 422 198" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Op 4 -->
  <rect x="424" y="180" width="116" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="482" y="203" text-anchor="middle" font-size="10.5" fill="#3a5a2a" font-weight="bold">推回 5 → [5,4,0,6]</text>

  <!-- Arrow down -->
  <path d="M 280 220 L 280 236" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 3: Result -->
  <text x="280" y="252" text-anchor="middle" font-size="12" fill="#335" font-weight="bold">③ 取候选最大值</text>

  <rect x="80" y="266" width="400" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="291" text-anchor="middle" font-size="11.5" fill="#a87020">候选 = {5, 2, 2, 0}（绿格），max = </text>
  <text x="442" y="291" font-size="13" fill="#b85450" font-weight="bold">5</text>

  <!-- Verification note -->
  <rect x="40" y="320" width="480" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="340" text-anchor="middle" font-size="11" fill="#335">验证 idx 3 (值 4) 不可达：</text>
  <text x="280" y="356" text-anchor="middle" font-size="10.5" fill="#555">方式①需 k−3=1 为偶 ✗；方式②需 k≥3+2=5 但 k=4 ✗</text>

  <!-- Bottom note -->
  <rect x="40" y="376" width="480" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="396" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">答案 = 5 ✓</text>
</svg>
