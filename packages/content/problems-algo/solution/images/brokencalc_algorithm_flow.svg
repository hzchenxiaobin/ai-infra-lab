<svg xmlns="http://www.w3.org/2000/svg" width="860" height="640" viewBox="0 0 860 640" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.5"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="860" height="640" fill="#fdfcf7"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">坏了的计算器：反向贪心算法流程</text>
  <path d="M 250 42 Q 430 50 610 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- start -->
  <g filter="url(#sk2)">
    <ellipse cx="430" cy="86" rx="70" ry="22" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.8"/>
  </g>
  <text x="430" y="91" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">输入 X, Y；ops = 0</text>
  <path d="M 430 108 L 430 126" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>

  <!-- loop header -->
  <g filter="url(#sk)">
    <path d="M 430 128 L 560 168 L 430 208 L 300 168 Z" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="430" y="164" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">Y &gt; X ?</text>
  <text x="430" y="180" text-anchor="middle" font-size="10" fill="#7a5415">(还需缩小 Y)</text>

  <!-- No branch: exit to bottom -->
  <path d="M 300 168 L 180 168 L 180 540" stroke="#4a8e4a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="240" y="158" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">否</text>

  <!-- Yes branch down -->
  <path d="M 430 208 L 430 226" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="450" y="222" font-size="11" fill="#2e6e2e" font-weight="bold">是</text>

  <!-- inner decision: Y even? -->
  <g filter="url(#sk)">
    <path d="M 430 228 L 540 268 L 430 308 L 320 268 Z" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.4"/>
  </g>
  <text x="430" y="272" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">Y 是偶数?</text>

  <!-- Yes: /2 -->
  <path d="M 320 268 L 230 268 L 230 330" stroke="#4a8e4a" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="275" y="258" text-anchor="middle" font-size="11" fill="#2e6e2e" font-weight="bold">是</text>
  <g filter="url(#sk2)">
    <rect x="150" y="335" width="160" height="42" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="230" y="354" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">Y = Y ÷ 2</text>
  <text x="230" y="370" text-anchor="middle" font-size="10" fill="#2e6e2e">ops += 1</text>

  <!-- No: +1 -->
  <path d="M 540 268 L 630 268 L 630 330" stroke="#c98a2b" stroke-width="1.5" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="585" y="258" text-anchor="middle" font-size="11" fill="#7a5415" font-weight="bold">否</text>
  <g filter="url(#sk2)">
    <rect x="550" y="335" width="160" height="42" rx="6" fill="#fff8e1" stroke="#c98a2b" stroke-width="1.5"/>
  </g>
  <text x="630" y="354" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">Y = Y + 1</text>
  <text x="630" y="370" text-anchor="middle" font-size="10" fill="#7a5415">ops += 1</text>

  <!-- both converge back to loop header -->
  <path d="M 230 377 L 230 420 L 430 420 L 430 210 L 430 208" stroke="#3a3a3a" stroke-width="1.2" fill="none" stroke-dasharray="5 3" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 630 377 L 630 420 L 430 420" stroke="#3a3a3a" stroke-width="1.2" fill="none" stroke-dasharray="5 3" filter="url(#sk)"/>
  <text x="430" y="438" text-anchor="middle" font-size="10" fill="#888">回到循环顶部</text>

  <!-- terminal: ops += X - Y -->
  <path d="M 180 540 L 180 558" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk2)">
    <rect x="90" y="560" width="180" height="42" rx="6" fill="#e8f0fa" stroke="#4a8edb" stroke-width="1.5"/>
  </g>
  <text x="180" y="579" text-anchor="middle" font-size="12" fill="#2b6e9e" font-weight="bold">ops += (X − Y)</text>
  <text x="180" y="595" text-anchor="middle" font-size="10" fill="#2b6e9e">只剩 +1 补差到 X</text>

  <!-- return -->
  <path d="M 180 602 L 180 614 L 350 614" stroke="#3a3a3a" stroke-width="1.4" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <g filter="url(#sk2)">
    <ellipse cx="430" cy="614" rx="70" ry="18" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="430" y="619" text-anchor="middle" font-size="12" fill="#2e6e2e" font-weight="bold">返回 ops</text>

  <!-- side note -->
  <g filter="url(#sk)">
    <rect x="560" y="470" width="280" height="130" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.1" stroke-dasharray="5 3"/>
  </g>
  <text x="700" y="494" text-anchor="middle" font-size="12" fill="#b03a3a" font-weight="bold">为什么 Y 偶时 ÷2 最优？</text>
  <text x="575" y="516" font-size="10" fill="#555">若选 +1：Y→Y+1(奇)→Y+2(偶)→÷2</text>
  <text x="575" y="532" font-size="10" fill="#555">共 3 步到 (Y+2)/2 = Y/2+1</text>
  <text x="575" y="552" font-size="10" fill="#555">而 ÷2 直接 1 步到 Y/2</text>
  <text x="575" y="568" font-size="10" fill="#555">再 +1 到 Y/2+1 也只 2 步</text>
  <text x="575" y="588" font-size="10" fill="#b03a3a" font-weight="bold">÷2 永远不劣于 +1</text>
</svg>
