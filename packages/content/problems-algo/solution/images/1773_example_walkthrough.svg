<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="720" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="15" fill="#555" font-weight="bold">示例演算：ruleKey="color" → idx=1，逐行比对颜色列，仅第 1 件命中</text>
  <path d="M 100 36 Q 360 44 620 36" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- ===== Setup box ===== -->
  <g filter="url(#rough2)">
    <rect x="40" y="50" width="640" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="60" y="70" font-size="11" fill="#d6a040" font-weight="bold">前置（循环前一次性）：</text>
  <text x="60" y="86" font-size="11" fill="#333">mp["color"] = 1  →  idx = 1  →  只看颜色列 [1]，ruleValue = "silver"</text>

  <!-- ===== Table header ===== -->
  <g filter="url(#rough2)">
    <rect x="40" y="110" width="640" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3"/>
  </g>
  <text x="70" y="128" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">i</text>
  <text x="160" y="128" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">[0] type</text>
  <text x="290" y="128" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">[1] color ← idx</text>
  <text x="430" y="128" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">[2] name</text>
  <text x="580" y="128" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">== "silver"?</text>
  <text x="660" y="128" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">count</text>

  <!-- ===== row 0: blue -> fail ===== -->
  <g filter="url(#rough2)"><rect x="40" y="142" width="640" height="32" fill="#fff" stroke="#bbb" stroke-width="1" rx="3"/></g>
  <text x="70" y="162" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="160" y="162" text-anchor="middle" font-size="11" fill="#888">phone</text>
  <text x="290" y="162" text-anchor="middle" font-size="11" fill="#888">blue</text>
  <text x="430" y="162" text-anchor="middle" font-size="11" fill="#888">pixel</text>
  <text x="580" y="162" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>
  <text x="660" y="162" text-anchor="middle" font-size="12" fill="#888">0</text>

  <!-- ===== row 1: silver -> pass ===== -->
  <g filter="url(#rough2)"><rect x="40" y="176" width="640" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="3"/></g>
  <text x="70" y="196" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <text x="160" y="196" text-anchor="middle" font-size="11" fill="#888">computer</text>
  <text x="290" y="196" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">silver</text>
  <text x="430" y="196" text-anchor="middle" font-size="11" fill="#888">lenovo</text>
  <text x="580" y="196" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="660" y="196" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- ===== row 2: gold -> fail ===== -->
  <g filter="url(#rough2)"><rect x="40" y="210" width="640" height="32" fill="#fff" stroke="#bbb" stroke-width="1" rx="3"/></g>
  <text x="70" y="230" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="160" y="230" text-anchor="middle" font-size="11" fill="#888">phone</text>
  <text x="290" y="230" text-anchor="middle" font-size="11" fill="#888">gold</text>
  <text x="430" y="230" text-anchor="middle" font-size="11" fill="#888">iphone</text>
  <text x="580" y="230" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗</text>
  <text x="660" y="230" text-anchor="middle" font-size="12" fill="#888">1</text>

  <!-- column highlight band on color column -->
  <g filter="url(#rough2)">
    <rect x="230" y="110" width="120" height="132" fill="none" stroke="#d6a040" stroke-width="1.8" stroke-dasharray="5 3" rx="3"/>
  </g>

  <!-- ===== Notes ===== -->
  <g filter="url(#rough2)">
    <rect x="40" y="258" width="640" height="48" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="60" y="278" font-size="11" fill="#446688" font-weight="bold">观察：</text>
  <text x="60" y="296" font-size="11" fill="#333">idx=1 锁定颜色列后，type/name 两列在循环中根本不被访问；循环体仅对 item[1] 做一次 == "silver" 比较。</text>

  <!-- ===== Final result ===== -->
  <g filter="url(#rough2)">
    <rect x="40" y="318" width="640" height="50" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
  </g>
  <text x="60" y="340" font-size="12" fill="#4a7a3a" font-weight="bold">最终结果：count = 1  ✓（仅第 1 件 "computer" 颜色为 "silver"）</text>
  <text x="60" y="358" font-size="10" fill="#888" font-style="italic">循环前 ruleKey → idx 的翻译，让循环体退化为「单列单次比较」，无分支、无冗余判断。</text>
</svg>
