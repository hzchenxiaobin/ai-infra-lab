<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    核心观察：每天吃「腐烂日最近」的苹果（小顶堆）
  </text>

  <!-- ===== Apple batches row ===== -->
  <text x="36" y="72" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">苹果批次</text>
  <!-- day0 -->
  <rect x="70" y="48" width="80" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="64" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">Day0</text>
  <text x="110" y="78" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1 个</text>
  <text x="110" y="91" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">烂于 3</text>
  <!-- day1 -->
  <rect x="158" y="48" width="80" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="198" y="64" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">Day1</text>
  <text x="198" y="78" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2 个</text>
  <text x="198" y="91" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">烂于 3</text>
  <!-- day2 -->
  <rect x="246" y="48" width="80" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="286" y="64" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">Day2</text>
  <text x="286" y="78" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3 个</text>
  <text x="286" y="91" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">烂于 3</text>
  <!-- day3 -->
  <rect x="334" y="48" width="80" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="374" y="64" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">Day3</text>
  <text x="374" y="78" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5 个</text>
  <text x="374" y="91" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">烂于 7</text>
  <!-- day4 -->
  <rect x="422" y="48" width="80" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="462" y="64" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">Day4</text>
  <text x="462" y="78" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2 个</text>
  <text x="462" y="91" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">烂于 6</text>

  <!-- arrow down to heap -->
  <path d="M280,104 L280,120" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Heap section ===== -->
  <text x="280" y="138" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    可用苹果 → 小顶堆（堆顶 = 最快腐烂）
  </text>

  <!-- heap edges -->
  <path d="M250,178 L210,196" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M310,178 L350,196" stroke="#446688" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- heap root (rot6) highlighted -->
  <rect x="220" y="148" width="90" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="6" filter="url(#rough2)"/>
  <text x="265" y="162" text-anchor="middle" font-size="10" fill="#5a4a1a" filter="url(#rough2)">腐烂日 6</text>
  <text x="265" y="176" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2 个</text>

  <!-- heap left child (rot7) -->
  <rect x="166" y="196" width="88" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="210" y="210" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">腐烂日 7</text>
  <text x="210" y="224" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4 个</text>

  <!-- heap right child (dashed placeholder) -->
  <rect x="306" y="196" width="88" height="34" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="3 3" rx="6" filter="url(#rough2)"/>
  <text x="350" y="218" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">…</text>

  <!-- arrow from root to eat box -->
  <path d="M310,165 L372,165" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="341" y="158" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">堆顶</text>

  <!-- eat box -->
  <rect x="376" y="148" width="110" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="431" y="162" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">吃 1 个</text>
  <text x="431" y="176" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">（数量 −1）</text>

  <!-- ===== Eating timeline ===== -->
  <text x="36" y="262" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">吃苹果</text>
  <text x="280" y="258" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">
    时间线（每天一个，颜色 = 所吃批次的腐烂日）
  </text>
  <!-- 7 day cells: d0..d6, eaten rot = 3,3,3,7,6,6,7 -->
  <!-- d0 -->
  <rect x="60" y="270" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="88" y="284" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">Day0</text>
  <text x="88" y="298" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">烂3</text>
  <!-- d1 -->
  <rect x="120" y="270" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="148" y="284" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">Day1</text>
  <text x="148" y="298" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">烂3</text>
  <!-- d2 -->
  <rect x="180" y="270" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="208" y="284" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">Day2</text>
  <text x="208" y="298" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">烂3</text>
  <!-- d3: clean rotten then eat day3 batch -->
  <rect x="240" y="270" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="268" y="284" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">Day3</text>
  <text x="268" y="298" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">烂7</text>
  <!-- d4: eat day4 batch (rot6) — sooner than day3's rot7 -->
  <rect x="300" y="270" width="56" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="328" y="284" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">Day4</text>
  <text x="328" y="298" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">烂6</text>
  <!-- d5 -->
  <rect x="360" y="270" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="388" y="284" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">Day5</text>
  <text x="388" y="298" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">烂6</text>
  <!-- d6 -->
  <rect x="420" y="270" width="56" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="448" y="284" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">Day6</text>
  <text x="448" y="298" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">烂7</text>

  <!-- day3 clean annotation -->
  <path d="M268,312 L268,326" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="3 2" fill="none" filter="url(#rough2)"/>
  <text x="268" y="338" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">清烂≤3</text>

  <!-- day4 annotation: chose rot6 over rot7 -->
  <path d="M328,312 L328,326" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3 2" fill="none" filter="url(#rough2)"/>
  <text x="328" y="338" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">优先快烂</text>

  <!-- ===== Insight box ===== -->
  <rect x="40" y="352" width="480" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="374" text-anchor="middle" font-size="11" fill="#5a4a1a" filter="url(#rough2)">
    交换论证：先吃快烂的不会更差 —— 单机 EDF（Earliest Deadline First）调度
  </text>
</svg>
