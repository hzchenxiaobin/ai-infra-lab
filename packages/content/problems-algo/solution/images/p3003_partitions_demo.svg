<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 390" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="390" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1：s = "accca"，k = 2</text>

  <!-- 方案 A：不修改 -->
  <text x="58" y="72" font-size="12" fill="#446688" font-weight="bold">不修改</text>
  <rect x="130" y="50" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="146" y="71" text-anchor="middle" font-size="13" fill="#333">a</text>
  <rect x="168" y="50" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="184" y="71" text-anchor="middle" font-size="13" fill="#333">c</text>
  <rect x="206" y="50" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="222" y="71" text-anchor="middle" font-size="13" fill="#333">c</text>
  <rect x="244" y="50" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="71" text-anchor="middle" font-size="13" fill="#333">c</text>
  <rect x="282" y="50" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="298" y="71" text-anchor="middle" font-size="13" fill="#333">a</text>
  <text x="336" y="64" font-size="11" fill="#888">全程只有 {a, c} 两种</text>
  <text x="336" y="80" font-size="11" fill="#888">≤ k=2 → 整串 1 段</text>

  <!-- 方案 B：改 s[2] -->
  <text x="58" y="158" font-size="12" fill="#b85450" font-weight="bold">改 s[2]</text>
  <rect x="130" y="136" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="146" y="157" text-anchor="middle" font-size="13" fill="#333">a</text>
  <rect x="168" y="136" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="184" y="157" text-anchor="middle" font-size="13" fill="#333">c</text>
  <rect x="206" y="136" width="32" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="222" y="157" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">b</text>
  <text x="222" y="130" text-anchor="middle" font-size="10.5" fill="#b85450">c→b</text>
  <rect x="244" y="136" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="157" text-anchor="middle" font-size="13" fill="#333">c</text>
  <rect x="282" y="136" width="32" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="298" y="157" text-anchor="middle" font-size="13" fill="#333">a</text>
  <text x="336" y="148" font-size="11" fill="#888">"acbca"：中间冒出一个 b</text>
  <text x="336" y="164" font-size="11" fill="#888">把两边的同类隔开 → 能多切</text>

  <!-- 切分展示 -->
  <path d="M260,175 L260,200" stroke="#446688" stroke-width="1.5" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="100" y="208" width="76" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="138" y="231" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">ac</text>
  <text x="184" y="212" font-size="13" fill="#b85450">✂</text>
  <path d="M186,206 L186,246" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="194" y="208" width="76" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="232" y="231" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">bc</text>
  <text x="278" y="212" font-size="13" fill="#b85450">✂</text>
  <path d="M280,206 L280,246" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="288" y="208" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="310" y="231" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">a</text>

  <text x="138" y="262" text-anchor="middle" font-size="10" fill="#888">{a,c}</text>
  <text x="232" y="262" text-anchor="middle" font-size="10" fill="#888">{b,c}</text>
  <text x="310" y="262" text-anchor="middle" font-size="10" fill="#888">{a}</text>

  <!-- 步骤说明 -->
  <text x="56" y="288" font-size="11" fill="#555">① 最长前缀 "ac"：再吞 b 就是 {a,b,c} 3 种 &gt; 2 → 只能切！</text>
  <text x="56" y="306" font-size="11" fill="#555">② 前缀 "bc"：再吞 a 也是 3 种 &gt; 2 → 切！</text>
  <text x="56" y="324" font-size="11" fill="#555">③ 剩下的 "a" 单独成段 → 切！</text>

  <!-- 结论 -->
  <rect x="24" y="340" width="472" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="260" y="364" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">两种方案取 max：max(1, 3) = 3 ✓　（一处修改让「原料」更碎 → 切得更细）</text>
</svg>
