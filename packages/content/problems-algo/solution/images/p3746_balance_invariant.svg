<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：差值 d = cnt_a − cnt_b 是不变量</text>
  <text x="260" y="40" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">s = "aaabb"：cnt_a = 3，cnt_b = 2 ⇒ 最小长度 = |3 − 2| = 1</text>

  <!-- 行1：s = "aaabb" 字符格子 -->
  <text x="44" y="80" font-size="12" fill="#333" filter="url(#rough2)">s =</text>

  <rect x="76" y="58" width="34" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="93" y="80" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="110" y="58" width="34" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="127" y="80" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="144" y="58" width="34" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="161" y="80" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">a</text>
  <rect x="178" y="58" width="34" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="195" y="80" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>
  <rect x="212" y="58" width="34" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="229" y="80" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">b</text>

  <!-- 配对弧线（格子下方） -->
  <path d="M 161 96 Q 178 112 195 96" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 127 96 Q 178 130 229 96" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="178" y="110" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">①</text>
  <text x="178" y="126" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">②</text>
  <text x="93" y="118" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">剩 1 个 a</text>

  <text x="16" y="146" font-size="10.5" fill="#666" filter="url(#rough2)">配对弧线：每对 (a, b) 一起删 —— 3 个 a、2 个 b ⇒ 删 2 对，剩 1 个 a</text>

  <!-- 行2：删除演化 -->
  <rect x="18" y="158" width="148" height="54" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="92" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">「aaabb」</text>
  <text x="92" y="200" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">cnt_a=3  cnt_b=2  <tspan fill="#b85450" font-weight="bold">d=+1</tspan></text>

  <path d="M 168 185 L 204 185" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="187" y="177" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">删 "ab"</text>
  <text x="187" y="199" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">d 不变</text>

  <rect x="208" y="158" width="148" height="54" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="282" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">「aab」</text>
  <text x="282" y="200" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">cnt_a=2  cnt_b=1  <tspan fill="#b85450" font-weight="bold">d=+1</tspan></text>

  <path d="M 358 185 L 394 185" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="377" y="177" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">删 "ab"</text>
  <text x="377" y="199" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">d 不变</text>

  <rect x="398" y="158" width="104" height="54" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="450" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#333" filter="url(#rough2)">「a」</text>
  <text x="450" y="200" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">终态 <tspan fill="#b85450" font-weight="bold">长度 = |+1| = 1</tspan></text>

  <!-- 说明框 -->
  <rect x="16" y="224" width="488" height="82" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="28" y="246" font-size="10.5" fill="#333" filter="url(#rough2)">① 每次删的子串里 a、b 各 k 个 ⇒ cnt_a 与 cnt_b 同减 k，差 d = cnt_a − cnt_b 纹丝不动</text>
  <text x="28" y="268" font-size="10.5" fill="#333" filter="url(#rough2)">② 两种字母并存 ⇒ 必有相邻 "ab"/"ba"（长 2 平衡子串）⇒ 删不动时必只剩一种字母</text>
  <text x="28" y="290" font-size="10.5" fill="#333" filter="url(#rough2)">③ 终态长度 = |d| ⇒ 答案 = |cnt_a − cnt_b|，与删除顺序、子串位置统统无关</text>

  <text x="16" y="326" font-size="9.5" fill="#999" filter="url(#rough2)">⚠️ d ≠ 0 ⇒ 永远删不空（空串的 d = 0）；d = 0 ⇒ 反复删相邻对必删到空</text>
  <text x="16" y="344" font-size="9.5" fill="#999" filter="url(#rough2)">💡 提交只要一趟计数；「删相邻对」的栈消除是证明可达性的构造性视角</text>
</svg>
