<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="480" height="360" fill="#fafafa"/>

  <text x="240" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#444" filter="url(#rough2)">算法流程：一趟扫描 + 奇偶判定</text>

  <!-- Start -->
  <ellipse cx="240" cy="58" rx="42" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240" y="63" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">开始</text>

  <path d="M 240 74 L 240 92" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Stats box -->
  <rect x="70" y="92" width="340" height="58" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240" y="112" text-anchor="middle" font-size="12" fill="#444" font-weight="bold" filter="url(#rough2)">遍历矩阵，一趟统计：</text>
  <text x="240" y="130" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">neg（负数个数）、S（绝对值之和）</text>
  <text x="240" y="144" text-anchor="middle" font-size="11" fill="#444" filter="url(#rough2)">mn（最小绝对值）、hasZero（是否存在 0）</text>

  <path d="M 240 150 L 240 168" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond -->
  <polygon points="240,168 372,222 240,276 108,222" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="240" y="216" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">neg 为偶数</text>
  <text x="240" y="232" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">或 hasZero？</text>

  <!-- Yes branch (right) -->
  <path d="M 372 222 L 410 222 L 410 286" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="384" y="216" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="356" y="286" width="108" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="410" y="311" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">返回 S</text>

  <!-- No branch (left) -->
  <path d="M 108 222 L 70 222 L 70 286" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="78" y="216" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="10" y="286" width="120" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="70" y="311" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 S − 2·mn</text>

  <!-- bottom note -->
  <text x="240" y="346" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">时间 O(n²)，空间 O(1) — 仅一趟扫描 + 常数变量</text>
</svg>
