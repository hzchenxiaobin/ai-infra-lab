<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrgr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程：倒序一趟扫描 + 位掩码标记</text>

  <!-- start -->
  <rect x="170" y="40" width="220" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i = n−1，mask = 0，full = (1&lt;&lt;k)−1</text>

  <path d="M 280 76 L 280 94" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- v = nums[i] -->
  <rect x="200" y="98" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="117" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">v = nums[i]</text>

  <path d="M 280 128 L 280 146" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- diamond 1 -->
  <polygon points="280,150 405,192 280,234 155,192" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="196" text-anchor="middle" font-size="13" fill="#b07818" filter="url(#rough2)">v ≤ k ?</text>

  <path d="M 280 234 L 280 254" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="292" y="250" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- set bit -->
  <rect x="190" y="258" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="277" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">mask |= 1 &lt;&lt; (v−1)</text>

  <path d="M 280 288 L 280 306" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>

  <!-- diamond 2 -->
  <polygon points="280,310 410,354 280,398 150,354" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="358" text-anchor="middle" font-size="13" fill="#b07818" filter="url(#rough2)">mask == full ?</text>

  <path d="M 280 398 L 280 416" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="292" y="412" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- return -->
  <rect x="195" y="420" width="170" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="441" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 n − i ✓</text>

  <!-- loop box -->
  <rect x="36" y="176" width="64" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="68" y="196" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">i −−</text>

  <!-- diamond1 no -> loop -->
  <path d="M 155 192 L 104 192" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrgr)" filter="url(#rough2)"/>
  <text x="128" y="184" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">否</text>

  <!-- diamond2 no -> loop -->
  <path d="M 150 354 L 68 354 L 68 212" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrgr)" filter="url(#rough2)"/>
  <text x="122" y="346" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">否</text>

  <!-- loop back to v -->
  <path d="M 68 176 L 68 113 L 194 113" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrgr)" filter="url(#rough2)"/>
  <text x="122" y="106" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">看前一个元素</text>

  <!-- notes -->
  <rect x="420" y="130" width="128" height="72" fill="#f5f5f5" stroke="#999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#666">
    <text x="484" y="152" text-anchor="middle">值域 1..n 且 k ≤ n</text>
    <text x="484" y="170" text-anchor="middle">掩码最多 50 位</text>
    <text x="484" y="188" text-anchor="middle">64 位整数足够装</text>
  </g>

  <rect x="420" y="240" width="128" height="72" fill="#f5f5f5" stroke="#999" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#666">
    <text x="484" y="262" text-anchor="middle">题目保证能集齐</text>
    <text x="484" y="280" text-anchor="middle">必在循环内返回</text>
    <text x="484" y="298" text-anchor="middle">不会扫出左边界</text>
  </g>
</svg>
