<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="20" text-anchor="middle" font-size="13.5" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：一趟扫描，两计数器 + 一次比较</text>
  <text x="260" y="36" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">前缀嵌套——每读一个字符只更新一个计数器</text>

  <!-- 左侧主流程 -->
  <rect x="75" y="46" width="160" height="26" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="155" y="63" text-anchor="middle" font-size="10" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">c0 = c1 = ans = 0</text>

  <path d="M 155 72 L 155 86" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="155,88 209,118 155,148 101,118" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="155" y="122" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">还有字符？</text>

  <path d="M 209 118 L 224 118" stroke="#b85450" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="219" y="111" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">否</text>

  <rect x="228" y="104" width="66" height="28" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="261" y="122" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <path d="M 155 148 L 155 162" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="162" y="158" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="75" y="164" width="160" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="155" y="182" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">ch=='0' ? c0++ : c1++</text>

  <path d="M 155 192 L 155 206" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <polygon points="155,208 219,240 155,272 91,240" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="155" y="244" text-anchor="middle" font-size="9.5" fill="#7a5c1a" filter="url(#rough2)">|c0 − c1| ≤ 1 ?</text>

  <path d="M 155 272 L 155 284" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="162" y="281" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <rect x="105" y="286" width="100" height="24" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="155" y="302" text-anchor="middle" font-size="9.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ans++</text>

  <path d="M 219 240 L 258 240 L 258 330 L 158 330" stroke="#b85450" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="230" y="234" font-size="8.5" fill="#b85450" filter="url(#rough2)">否</text>

  <path d="M 155 310 L 155 330 L 40 330 L 40 118 L 97 118" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="100" y="342" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">循环：读下一个字符</text>

  <!-- 右侧：示例追踪 -->
  <rect x="300" y="48" width="196" height="252" rx="8" fill="#ffffff" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="398" y="66" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">示例追踪 s = "00101"</text>

  <text x="316" y="80" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">i</text>
  <text x="344" y="80" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">ch</text>
  <text x="380" y="80" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">c0:c1</text>
  <text x="414" y="80" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">diff</text>
  <text x="448" y="80" text-anchor="middle" font-size="8" fill="#999" filter="url(#rough2)">ans</text>
  <path d="M 308 86 L 488 86" stroke="#ddd" stroke-width="1" fill="none" filter="url(#rough2)"/>

  <rect x="306" y="90" width="184" height="18" rx="3" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="316" y="103" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">1</text>
  <text x="344" y="103" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">'0'</text>
  <text x="380" y="103" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">1:0</text>
  <text x="414" y="103" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="448" y="103" text-anchor="middle" font-size="9" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">1 ✓</text>

  <rect x="306" y="112" width="184" height="18" rx="3" fill="#fce4ec" filter="url(#rough2)"/>
  <text x="316" y="125" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">2</text>
  <text x="344" y="125" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">'0'</text>
  <text x="380" y="125" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">2:0</text>
  <text x="414" y="125" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="448" y="125" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">1 ✗</text>

  <rect x="306" y="134" width="184" height="18" rx="3" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="316" y="147" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">3</text>
  <text x="344" y="147" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">'1'</text>
  <text x="380" y="147" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">2:1</text>
  <text x="414" y="147" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="448" y="147" text-anchor="middle" font-size="9" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">2 ✓</text>

  <rect x="306" y="156" width="184" height="18" rx="3" fill="#fce4ec" filter="url(#rough2)"/>
  <text x="316" y="169" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">4</text>
  <text x="344" y="169" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">'0'</text>
  <text x="380" y="169" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">3:1</text>
  <text x="414" y="169" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="448" y="169" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">2 ✗</text>

  <rect x="306" y="178" width="184" height="18" rx="3" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="316" y="191" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">5</text>
  <text x="344" y="191" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">'1'</text>
  <text x="380" y="191" text-anchor="middle" font-size="9" fill="#333" filter="url(#rough2)">3:2</text>
  <text x="414" y="191" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="448" y="191" text-anchor="middle" font-size="9" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">3 ✓</text>

  <rect x="316" y="208" width="164" height="30" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="398" y="228" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">循环结束，返回 ans = 3</text>

  <text x="312" y="256" font-size="8" fill="#4a7a3a" filter="url(#rough2)">✓ = |c0−c1| ≤ 1：当前前缀有效</text>
  <text x="312" y="271" font-size="8" fill="#b85450" filter="url(#rough2)">✗ = 差为 2：跳过，直接读下一个字符</text>
  <text x="312" y="286" font-size="8" fill="#666" filter="url(#rough2)">每步只做一次计数更新 + 一次比较</text>

  <text x="260" y="352" text-anchor="middle" font-size="8.5" fill="#999" filter="url(#rough2)">时间 O(n) · 空间 O(1)——判定与计数维护合并在同一趟循环里</text>
</svg>
