<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：每周一个等差数列，周间首项也在递增</text>

  <!-- ===== Week 1 row ===== -->
  <text x="44" y="62" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">第 1 周</text>
  <g filter="url(#rough2)" font-size="12" font-weight="bold" text-anchor="middle">
    <rect x="86" y="50" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="106" y="70" fill="#446688">1</text>
    <rect x="128" y="50" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="148" y="70" fill="#446688">2</text>
    <rect x="170" y="50" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="190" y="70" fill="#446688">3</text>
    <rect x="212" y="50" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="232" y="70" fill="#446688">4</text>
    <rect x="254" y="50" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="274" y="70" fill="#446688">5</text>
    <rect x="296" y="50" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="316" y="70" fill="#446688">6</text>
    <rect x="338" y="50" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="358" y="70" fill="#446688">7</text>
  </g>
  <text x="392" y="66" font-size="10" fill="#888" filter="url(#rough2)">和 =</text>
  <g filter="url(#rough2)">
    <rect x="418" y="52" width="46" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="12"/>
    <text x="441" y="70" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">28</text>
  </g>

  <!-- arrow down week1->week2 -->
  <path d="M 230 86 L 230 100" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="244" y="98" font-size="9" fill="#d6a040" font-weight="bold" filter="url(#rough2)">下周一首项 +1</text>

  <!-- ===== Week 2 row ===== -->
  <text x="44" y="130" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">第 2 周</text>
  <g filter="url(#rough2)" font-size="12" font-weight="bold" text-anchor="middle">
    <rect x="86" y="118" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="106" y="138" fill="#446688">2</text>
    <rect x="128" y="118" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="148" y="138" fill="#446688">3</text>
    <rect x="170" y="118" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="190" y="138" fill="#446688">4</text>
    <rect x="212" y="118" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="232" y="138" fill="#446688">5</text>
    <rect x="254" y="118" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="274" y="138" fill="#446688">6</text>
    <rect x="296" y="118" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="316" y="138" fill="#446688">7</text>
    <rect x="338" y="118" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="358" y="138" fill="#446688">8</text>
  </g>
  <text x="392" y="134" font-size="10" fill="#888" filter="url(#rough2)">和 =</text>
  <g filter="url(#rough2)">
    <rect x="418" y="120" width="46" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="12"/>
    <text x="441" y="138" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">35</text>
  </g>

  <!-- arrow down week2->week3 -->
  <path d="M 230 154 L 230 168" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- ===== Week 3 row (partial) ===== -->
  <text x="44" y="198" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">第 3 周</text>
  <g filter="url(#rough2)" font-size="12" font-weight="bold" text-anchor="middle">
    <rect x="86" y="186" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="106" y="206" fill="#d6a040">3</text>
    <rect x="128" y="186" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="148" y="206" fill="#d6a040">4</text>
    <rect x="170" y="186" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="190" y="206" fill="#d6a040">5</text>
    <rect x="212" y="186" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="232" y="206" fill="#d6a040">6</text>
    <rect x="254" y="186" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="274" y="206" fill="#d6a040">7</text>
    <rect x="296" y="186" width="40" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4"/>
    <text x="316" y="206" fill="#d6a040">8</text>
    <rect x="338" y="186" width="40" height="30" fill="#fafafa" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3" rx="4"/>
    <text x="358" y="206" fill="#ccc">9</text>
  </g>
  <text x="392" y="202" font-size="10" fill="#888" filter="url(#rough2)">和 =</text>
  <g filter="url(#rough2)">
    <rect x="418" y="188" width="46" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="12"/>
    <text x="441" y="206" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">42</text>
  </g>

  <!-- week day labels -->
  <g filter="url(#rough2)" font-size="9" fill="#aaa" text-anchor="middle">
    <text x="106" y="230">周一</text>
    <text x="148" y="230">周二</text>
    <text x="190" y="230">周三</text>
    <text x="232" y="230">周四</text>
    <text x="274" y="230">周五</text>
    <text x="316" y="230">周六</text>
    <text x="358" y="230">周日</text>
  </g>

  <!-- ===== Bottom: two observations ===== -->
  <rect x="40" y="246" width="240" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="160" y="266" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">观察 ①：每周内部等差</text>
  <line x1="52" y1="274" x2="268" y2="274" stroke="#c0d0e8" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="290" font-size="10" fill="#555" filter="url(#rough2)">第 k 周：首项 k，公差 1</text>
  <text x="52" y="306" font-size="10" fill="#555" filter="url(#rough2)">存入 k, k+1, …, k+6</text>
  <text x="52" y="324" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">S_k = 7k + 21</text>

  <rect x="296" y="246" width="224" height="92" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="408" y="266" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">观察 ②：周间首项等差</text>
  <line x1="308" y1="274" x2="508" y2="274" stroke="#e8c0c8" stroke-width="1" filter="url(#rough2)"/>
  <text x="308" y="290" font-size="10" fill="#555" filter="url(#rough2)">每周和：28, 35, 42, …</text>
  <text x="308" y="306" font-size="10" fill="#555" filter="url(#rough2)">首项 28，公差 7</text>
  <text x="308" y="324" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">{S_k} 也是等差数列</text>

  <!-- footer key insight -->
  <rect x="40" y="352" width="480" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="52" y="372" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">双重等差结构 → 拆成 w 个完整周 + r 个剩余天，分别套等差求和公式</text>
  <text x="52" y="390" font-size="10" fill="#555" filter="url(#rough2)">完整周：W_full = w·(S_1 + S_w)/2 = 7w(w+7)/2</text>
  <text x="52" y="406" font-size="10" fill="#555" filter="url(#rough2)">剩余天：W_rem = r·(w+1) + r(r−1)/2   （第 w+1 周前 r 天，首项 w+1）</text>
  <text x="52" y="424" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">W = 7w(w+7)/2 + r(w+1) + r(r−1)/2，全程 O(1)</text>
</svg>
