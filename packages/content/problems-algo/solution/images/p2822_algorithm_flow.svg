<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">invertObject 算法流程</text>

  <!-- Start: Input obj -->
  <ellipse cx="270" cy="60" rx="70" ry="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="65" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">输入 obj</text>

  <!-- Arrow down -->
  <line x1="270" y1="84" x2="270" y2="105" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: Is Array? -->
  <polygon points="270,110 370,150 270,190 170,150" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="148" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">Array.isArray</text>
  <text x="270" y="162" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(obj) ?</text>

  <!-- Yes → return null (right) -->
  <line x1="370" y1="150" x2="445" y2="150" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="405" y="142" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="445" y="130" width="80" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="485" y="155" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">return null</text>

  <!-- No → down -->
  <line x1="270" y1="190" x2="270" y2="210" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="204" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- Loop box -->
  <rect x="150" y="215" width="240" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="237" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">遍历 obj 的每个 [key, val]</text>
  <text x="270" y="255" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">seen = new Set()</text>
  <text x="270" y="272" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">result = {}</text>

  <!-- Arrow down -->
  <line x1="270" y1="285" x2="270" y2="305" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: val in seen? -->
  <polygon points="270,310 370,345 270,380 170,345" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="343" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">seen.has(val)?</text>
  <text x="270" y="357" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">值重复？</text>

  <!-- Yes → return null (right) -->
  <line x1="370" y1="345" x2="445" y2="345" stroke="#b85450" stroke-width="1.5" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="405" y="337" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="445" y="325" width="80" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="485" y="350" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">return null</text>

  <!-- No → left then down -->
  <line x1="170" y1="345" x2="100" y2="345" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <line x1="100" y1="345" x2="100" y2="395" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="140" y="337" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>

  <!-- Action box: add to seen and result -->
  <rect x="30" y="395" width="200" height="45" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="130" y="412" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">seen.add(val)</text>
  <text x="130" y="428" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">result[val] = key</text>

  <!-- Loop back arrow -->
  <path d="M 130 395 Q 130 250, 150 250" fill="none" stroke="#446688" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="115" y="325" font-size="10" fill="#666" filter="url(#rough2)">下个</text>
  <text x="115" y="338" font-size="10" fill="#666" filter="url(#rough2)">键值对</text>

  <!-- After loop → return result -->
  <line x1="270" y1="380" x2="270" y2="420" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="270" cy="440" rx="75" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="445" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">return result</text>
</svg>
