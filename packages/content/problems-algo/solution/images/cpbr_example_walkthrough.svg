<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrW" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#4a7a3a" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：n = 3, start = 2</text>

  <!-- Table header -->
  <text x="60" y="56" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">i</text>
  <text x="140" y="56" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">i &gt;&gt; 1</text>
  <text x="240" y="56" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">G(i)=i^(i&gt;&gt;1)</text>
  <text x="360" y="56" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">p[i]=G(i)^start</text>
  <text x="475" y="56" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">p[i] 二进制</text>
  <line x1="25" y1="64" x2="515" y2="64" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- 8 rows; row height 26, start y=72 -->
  <!-- row 0: i=0, 0, 0, 2, 010 (start highlighted) -->
  <rect x="30" y="70" width="485" height="26" fill="#fff8e1" opacity="0.5" rx="3" filter="url(#rough2)"/>
  <text x="60" y="88" text-anchor="middle" font-size="12" fill="#333">0</text>
  <text x="140" y="88" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">000</text>
  <text x="240" y="88" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">000</text>
  <text x="360" y="88" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" font-family="monospace">2</text>
  <text x="475" y="88" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">010</text>

  <!-- row 1: 1, 0, 1, 3, 011 -->
  <text x="60" y="114" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="140" y="114" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">000</text>
  <text x="240" y="114" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">001</text>
  <text x="360" y="114" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">3</text>
  <text x="475" y="114" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">011</text>

  <!-- row 2: 2, 1, 3, 1, 001 -->
  <rect x="30" y="120" width="485" height="26" fill="#e8f0fe" opacity="0.3" rx="3" filter="url(#rough2)"/>
  <text x="60" y="138" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="140" y="138" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">001</text>
  <text x="240" y="138" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">011</text>
  <text x="360" y="138" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">1</text>
  <text x="475" y="138" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">001</text>

  <!-- row 3: 3, 1, 2, 0, 000 -->
  <text x="60" y="162" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="140" y="162" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">001</text>
  <text x="240" y="162" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">010</text>
  <text x="360" y="162" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">0</text>
  <text x="475" y="162" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">000</text>

  <!-- row 4: 4, 2, 6, 4, 100 -->
  <rect x="30" y="168" width="485" height="26" fill="#e8f0fe" opacity="0.3" rx="3" filter="url(#rough2)"/>
  <text x="60" y="186" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="140" y="186" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">010</text>
  <text x="240" y="186" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">110</text>
  <text x="360" y="186" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">4</text>
  <text x="475" y="186" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">100</text>

  <!-- row 5: 5, 2, 7, 5, 101 -->
  <text x="60" y="210" text-anchor="middle" font-size="12" fill="#333">5</text>
  <text x="140" y="210" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">010</text>
  <text x="240" y="210" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">111</text>
  <text x="360" y="210" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">5</text>
  <text x="475" y="210" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">101</text>

  <!-- row 6: 6, 3, 5, 7, 111 -->
  <rect x="30" y="216" width="485" height="26" fill="#e8f0fe" opacity="0.3" rx="3" filter="url(#rough2)"/>
  <text x="60" y="234" text-anchor="middle" font-size="12" fill="#333">6</text>
  <text x="140" y="234" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">011</text>
  <text x="240" y="234" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">101</text>
  <text x="360" y="234" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">7</text>
  <text x="475" y="234" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">111</text>

  <!-- row 7: 7, 3, 4, 6, 110 -->
  <text x="60" y="258" text-anchor="middle" font-size="12" fill="#333">7</text>
  <text x="140" y="258" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">011</text>
  <text x="240" y="258" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">100</text>
  <text x="360" y="258" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">6</text>
  <text x="475" y="258" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">110</text>

  <!-- Result sequence bar -->
  <text x="25" y="288" font-size="11" fill="#888" font-weight="bold">结果序列</text>
  <rect x="95" y="276" width="44" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="117" y="294" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" font-family="monospace">2</text>
  <rect x="143" y="276" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="165" y="294" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">3</text>
  <rect x="191" y="276" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="213" y="294" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">1</text>
  <rect x="239" y="276" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="261" y="294" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">0</text>
  <rect x="287" y="276" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="309" y="294" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">4</text>
  <rect x="335" y="276" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="357" y="294" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">5</text>
  <rect x="383" y="276" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="405" y="294" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">7</text>
  <rect x="431" y="276" width="44" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="453" y="294" text-anchor="middle" font-size="12" fill="#333" font-family="monospace">6</text>

  <!-- cyclic arrow from 6 back to 2 -->
  <path d="M 475 289 Q 505 289 505 320 Q 505 340 260 340 Q 110 340 110 320 Q 110 305 95 295" stroke="#b85450" stroke-width="1.4" fill="none" stroke-dasharray="5,3" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <text x="280" y="356" text-anchor="middle" font-size="9.5" fill="#b85450">首尾循环：110 ⊕ 010 = 100（仅 bit2 不同）✓</text>

  <!-- Insight box -->
  <rect x="30" y="312" width="465" height="0" fill="none"/>
</svg>
