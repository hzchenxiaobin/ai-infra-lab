<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：GCD 只减不增，跌到 1 即不可恢复 → 此处必切</text>

  <!-- running gcd labels above cells -->
  <text x="100" y="78" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">g=12</text>
  <text x="178" y="78" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">g=6</text>
  <text x="256" y="78" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">g=3</text>
  <text x="334" y="78" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">g=14</text>
  <text x="412" y="78" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">g=2</text>

  <!-- downward arrows from gcd labels to cells -->
  <path d="M100 84 L100 96" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M178 84 L178 96" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M256 84 L256 96" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M334 84 L334 96" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M412 84 L412 96" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== cell row ===== -->
  <rect x="70" y="100" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="100" y="126" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">12</text>
  <rect x="148" y="100" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="178" y="126" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">6</text>
  <rect x="226" y="100" width="60" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="256" y="126" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">3</text>
  <rect x="304" y="100" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="334" y="126" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">14</text>
  <rect x="382" y="100" width="60" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="412" y="126" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">8</text>

  <!-- forced cut between cell3(3) and cell4(14) -->
  <path d="M295 88 L295 168" stroke="#b85450" stroke-width="2.2" stroke-dasharray="6 4" fill="none" filter="url(#rough2)"/>
  <text x="295" y="82" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">✂ 必切</text>
  <text x="295" y="182" text-anchor="middle" font-size="10.5" fill="#b85450">gcd(3,14)=1</text>

  <!-- subarray brackets -->
  <path d="M68 158 L68 152 L288 152 L288 158" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="178" y="206" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">子数组1：gcd = 3 &gt; 1 ✓</text>

  <path d="M302 158 L302 152 L444 152 L444 158" stroke="#446688" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="373" y="206" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">子数组2：gcd = 2 &gt; 1 ✓</text>

  <!-- divider -->
  <line x1="30" y1="232" x2="540" y2="232" stroke="#ccc" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- monotonicity note -->
  <rect x="30" y="248" width="500" height="112" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="270" text-anchor="middle" font-size="12.5" fill="#d6a040" font-weight="bold">为什么贪心「尽量延长」是最优的？</text>
  <text x="48" y="292" font-size="11.5" fill="#333">① 单调性：扩展子数组只会让 gcd 变小或不变（gcd(A ∪ {x}) | gcd(A)）。</text>
  <text x="48" y="312" font-size="11.5" fill="#333">② 不可恢复：一旦 gcd = 1，再追加任何元素仍是 1（gcd(1, ·) = 1）。</text>
  <text x="48" y="332" font-size="11.5" fill="#333">③ 故 14 无法与前面任一段共存 → 切点 unavoidable，所有合法分割都得在此切开。</text>
  <text x="48" y="352" font-size="11.5" fill="#333">   贪心每段拖到最长（最晚切）→ 段数最少。ans = 段数 = 2。</text>
</svg>
