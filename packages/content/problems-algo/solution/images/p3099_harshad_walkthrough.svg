<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：三个代表输入各走一遍</text>

  <!-- header -->
  <rect x="48" y="42" width="90" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="93" y="62" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">输入 x</text>
  <rect x="138" y="42" width="150" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="213" y="62" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">t 的轨迹（x÷10）</text>
  <rect x="288" y="42" width="130" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="353" y="62" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">s 的轨迹（累加）</text>
  <rect x="418" y="42" width="56" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="446" y="62" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">结果</text>

  <!-- row 1: x = 18 -->
  <rect x="48" y="80" width="90" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="93" y="102" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">18</text>
  <rect x="138" y="80" width="150" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="213" y="102" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">18 → 1 → 0</text>
  <rect x="288" y="80" width="130" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="353" y="102" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">0 → 8 → 9</text>
  <rect x="418" y="80" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="446" y="102" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">9</text>

  <!-- row 2: x = 100 -->
  <rect x="48" y="124" width="90" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="93" y="146" text-anchor="middle" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">100</text>
  <rect x="138" y="124" width="150" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="213" y="146" text-anchor="middle" font-size="12" fill="#8a6d3b" filter="url(#rough2)">100 → 10 → 1 → 0</text>
  <rect x="288" y="124" width="130" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="353" y="146" text-anchor="middle" font-size="12" fill="#8a6d3b" filter="url(#rough2)">0 → 0 → 1 → 1</text>
  <rect x="418" y="124" width="56" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="446" y="146" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>

  <!-- row 3: x = 99 -->
  <rect x="48" y="168" width="90" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="93" y="190" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">99</text>
  <rect x="138" y="168" width="150" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="213" y="190" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">99 → 9 → 0</text>
  <rect x="288" y="168" width="130" height="34" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="353" y="190" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">0 → 9 → 18</text>
  <rect x="418" y="168" width="56" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="446" y="190" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1</text>

  <!-- annotations -->
  <rect x="48" y="224" width="426" height="44" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="261" y="242" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">x = 18：s = 9，18 mod 9 = 0 → 哈沙德数，返回 9</text>
  <text x="261" y="260" text-anchor="middle" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">x = 100：尾部的 0 不贡献数位和，s = 1，任何数 mod 1 = 0 → 返回 1</text>

  <rect x="48" y="280" width="426" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="261" y="298" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">x = 99：数位和达到本题上界 s = 18，但 99 mod 18 = 9 ≠ 0</text>
  <text x="261" y="316" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">→ 99 不是哈沙德数，返回 −1（s 最大 ≠ 最容易整除）</text>

  <!-- bottom fact -->
  <rect x="48" y="340" width="426" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="261" y="358" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">1~9 全是哈沙德数（s = x 自己，必整除）；10 的幂也是（s = 1）</text>
  <text x="261" y="376" text-anchor="middle" font-size="10.5" fill="#446688" filter="url(#rough2)">反之 99 这类「数位和冲顶」的数反而最容易出局</text>
</svg>
