<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 412"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#666666"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="412" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">执行流程：两段聚合 → 双内连接 → 天数差 → 排序</text>

  <rect x="185" y="34" width="190" height="32" rx="8" fill="#f5f5f5" stroke="#888888" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="54" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">covid_tests 全部检测行</text>
  <path d="M280 66 L280 82" stroke="#666666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="86" width="320" height="52" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="106" text-anchor="middle" font-size="12" fill="#2b3f5c" filter="url(#rough2)">① WHERE result='Positive' + GROUP BY</text>
  <text x="280" y="126" text-anchor="middle" font-size="12" fill="#2b3f5c" filter="url(#rough2)">MIN(test_date) ⇒ first_pos 首次阳性</text>
  <text x="455" y="106" font-size="11" fill="#b85450" filter="url(#rough2)">从未阳性者</text>
  <text x="455" y="122" font-size="11" fill="#b85450" filter="url(#rough2)">不产生行</text>
  <path d="M455 114 L443 114" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M280 138 L280 154" stroke="#666666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="100" y="158" width="340" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="178" text-anchor="middle" font-size="12" fill="#2f4f23" filter="url(#rough2)">② Negative 行 JOIN ①：同 patient_id</text>
  <text x="270" y="196" text-anchor="middle" font-size="12" fill="#2f4f23" filter="url(#rough2)">且 test_date &gt; first_pos，再 GROUP BY</text>
  <text x="270" y="214" text-anchor="middle" font-size="12" fill="#2f4f23" filter="url(#rough2)">MIN(test_date) ⇒ first_neg 阳性后首阴</text>
  <text x="465" y="180" font-size="11" fill="#b85450" filter="url(#rough2)">阳性之前的</text>
  <text x="465" y="196" font-size="11" fill="#b85450" filter="url(#rough2)">阴性被剔除</text>
  <path d="M462 188 L446 188" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M280 222 L280 238" stroke="#666666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="242" width="320" height="50" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="262" text-anchor="middle" font-size="12" fill="#6b4f14" filter="url(#rough2)">③ patients ⋈ ① ⋈ ②（两次 INNER JOIN）</text>
  <text x="280" y="282" text-anchor="middle" font-size="12" fill="#6b4f14" filter="url(#rough2)">「同时具有阴阳」的过滤自动完成</text>
  <text x="452" y="262" font-size="11" fill="#b85450" filter="url(#rough2)">David、Emma</text>
  <text x="452" y="278" font-size="11" fill="#b85450" filter="url(#rough2)">在此出局</text>
  <path d="M280 292 L280 308" stroke="#666666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="312" width="320" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="337" text-anchor="middle" font-size="12" fill="#7c3a36" filter="url(#rough2)">④ DATEDIFF(first_neg, first_pos) ⇒ recovery_time</text>
  <path d="M280 352 L280 368" stroke="#666666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="120" y="372" width="320" height="34" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="394" text-anchor="middle" font-size="12" fill="#2b3f5c" filter="url(#rough2)">⑤ ORDER BY recovery_time ASC, patient_name ASC</text>
</svg>
