<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">埃氏筛算法流程：划倍数 + 只筛到 √n</text>

  <!-- 1 init -->
  <rect x="150" y="44" width="300" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="300" y="68" text-anchor="middle" font-size="11.5" fill="#333">初始化：isPrime[0..n−1]=true，isPrime[0]=isPrime[1]=false</text>
  <path d="M 300 84 L 300 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2 i=2 -->
  <rect x="255" y="96" width="90" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="116" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i = 2</text>
  <path d="M 300 126 L 300 134" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3 diamond i*i<n? -->
  <polygon points="300,134 372,170 300,206 228,170" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="174" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i*i &lt; n ?</text>

  <!-- 否 -> end -->
  <path d="M 372 170 L 440 170" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="386" y="163" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <rect x="440" y="153" width="140" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="510" y="175" text-anchor="middle" font-size="11" fill="#333">统计 true 的个数 → 返回</text>

  <!-- 是 -> down -->
  <path d="M 300 206 L 300 218" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="308" y="214" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- 4 diamond isPrime[i]? -->
  <polygon points="300,218 372,254 300,290 228,254" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="258" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">isPrime[i] ?</text>

  <!-- 是 -> mark box -->
  <path d="M 300 290 L 300 302" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="308" y="298" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- mark box -->
  <rect x="150" y="302" width="300" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="300" y="320" text-anchor="middle" font-size="11.5" fill="#333">标记合数：for j = i*i; j &lt; n; j += i</text>
  <text x="300" y="338" text-anchor="middle" font-size="11.5" fill="#333">isPrime[j] = false</text>

  <!-- mark -> i++ -->
  <path d="M 300 346 L 300 360" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 否 from isPrime diamond -> routes right-down to i++ -->
  <path d="M 372 254 L 410 254 L 410 376 L 348 376" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="378" y="248" font-size="10.5" fill="#b85450" font-weight="bold">否（合数，跳过）</text>

  <!-- i++ box -->
  <rect x="255" y="360" width="90" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="300" y="381" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i++</text>

  <!-- loop back: i++ -> left -> up -> into diamond i*i<n left side -->
  <path d="M 255 376 L 110 376 L 110 170 L 228 170" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="118" y="270" font-size="11" fill="#4a7a3a" font-weight="bold">回到判断</text>

  <!-- footnote -->
  <text x="300" y="436" text-anchor="middle" font-size="11" fill="#888">外层只需 i 到 √n：因 i*i ≥ n 时无倍数可划；内层从 i*i 起划</text>
</svg>
