<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：FROM → WHERE（双谓词 AND）→ COUNT(DISTINCT)</text>

  <!-- ===== Step 1: FROM Purchases ===== -->
  <rect x="60" y="42" width="200" height="52" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="160" y="60" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">FROM Purchases</text>
  <text x="160" y="76" text-anchor="middle" font-size="8" fill="#888">读取全部购买记录</text>
  <text x="160" y="88" text-anchor="middle" font-size="8" fill="#888">4 行</text>

  <!-- Arrow down -->
  <path d="M 160 94 L 160 116" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: WHERE time_stamp BETWEEN ===== -->
  <rect x="30" y="120" width="260" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="160" y="138" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">WHERE time_stamp BETWEEN</text>
  <text x="160" y="152" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">startDate AND endDate</text>
  <text x="160" y="166" text-anchor="middle" font-size="7" fill="#888">DATE → 00:00:00 隐式转换（SARGable）</text>

  <!-- AND connector -->
  <text x="290" y="154" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">AND</text>

  <!-- ===== Step 3: AND amount >= minAmount ===== -->
  <rect x="310" y="120" width="240" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="430" y="140" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">amount &gt;= minAmount</text>
  <text x="430" y="154" text-anchor="middle" font-size="7" fill="#888">单次购买金额达标</text>
  <text x="430" y="166" text-anchor="middle" font-size="7" fill="#888">非累计（行级谓词）</text>

  <!-- Arrow down merge -->
  <path d="M 160 178 L 160 200" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 430 178 L 430 192 C 430 200, 280 200, 165 198" stroke="#666" stroke-width="1.2" fill="none" stroke-dasharray="3 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Intermediate: filtered rows -->
  <rect x="50" y="204" width="220" height="64" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="160" y="220" text-anchor="middle" font-size="9" fill="#666">双谓词过滤后的「合格行」</text>
  <text x="160" y="234" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">user 3, 03-18, 4523</text>
  <text x="160" y="248" text-anchor="middle" font-size="7" fill="#888">仅 1 行同时满足时间 + 金额</text>
  <text x="160" y="260" text-anchor="middle" font-size="7" fill="#b85450">其余 3 行被 AND 过滤丢弃</text>

  <!-- Arrow right to distinct -->
  <path d="M 270 236 L 312 236" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 4: COUNT(DISTINCT user_id) ===== -->
  <rect x="316" y="204" width="240" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="436" y="222" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">COUNT(DISTINCT user_id)</text>
  <text x="436" y="236" text-anchor="middle" font-size="8" fill="#666">同一用户多次合格只计一次</text>
  <text x="436" y="248" text-anchor="middle" font-size="8" fill="#888">{3} → 去重</text>
  <text x="436" y="260" text-anchor="middle" font-size="7" fill="#888">漏 DISTINCT → 多次合格重复计数</text>

  <!-- Arrow down merge to result -->
  <path d="M 436 268 L 436 288" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 160 268 L 160 288 C 160 296, 300 296, 430 290" stroke="#666" stroke-width="1.2" fill="none" stroke-dasharray="3 3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 5: AS user_cnt ===== -->
  <rect x="296" y="292" width="280" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="436" y="310" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">AS user_cnt</text>
  <text x="436" y="326" text-anchor="middle" font-size="7" fill="#888">封装于 RETURN (...) 中</text>

  <!-- Result -->
  <path d="M 436 336 L 436 354" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="396" y="358" width="80" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="436" y="373" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">user_cnt</text>
  <text x="436" y="388" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- ===== SQL clause order note ===== -->
  <rect x="30" y="292" width="250" height="96" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="155" y="308" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">执行顺序与关键点</text>
  <text x="155" y="324" text-anchor="middle" font-size="8" fill="#666">FROM → WHERE → SELECT</text>
  <text x="155" y="340" font-size="7" fill="#888">• WHERE 两个 AND 条件同时求值</text>
  <text x="155" y="354" font-size="7" fill="#888">• 日期隐式转 00:00:00（SARGable）</text>
  <text x="155" y="368" font-size="7" fill="#888">• DISTINCT 去重后再 COUNT</text>
  <text x="155" y="382" font-size="7" fill="#b85450">• 列勿套 DATE() 否则索引失效</text>
</svg>
