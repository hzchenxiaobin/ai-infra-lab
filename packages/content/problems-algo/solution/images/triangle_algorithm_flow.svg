<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="420" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：排序 → 固定最大边 k → 双指针计数</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">O(n²) = 排序 O(n log n) + 外层 k 轮 n × 内层双指针 O(n)</text>

  <g font-size="10" fill="#333">
    <!-- Step 1: sort -->
    <rect x="40" y="64" width="440" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="84" font-size="12" fill="#446688" font-weight="bold">① 排序</text>
    <text x="120" y="84" font-family="monospace" font-size="10" fill="#555">sort(nums.begin(), nums.end())</text>
    <text x="120" y="100" font-size="9" fill="#888">升序排序，O(n log n)。使三角形不等式只需判 a+b&gt;c</text>

    <path d="M 260 110 L 260 124" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 2: fix k -->
    <rect x="40" y="128" width="440" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="148" font-size="12" fill="#b85450" font-weight="bold">② 固定最大边 k</text>
    <text x="180" y="148" font-family="monospace" font-size="10" fill="#555">for (k = n-1; k &gt;= 2; --k)</text>
    <text x="54" y="166" font-size="9" fill="#888">c = nums[k] 是最大边，在 [0, k-1] 中找 a + b &gt; c 的对数</text>
    <text x="54" y="180" font-size="9" fill="#d6a040">k 从右往左递减，保证前至少两个元素</text>

    <path d="M 260 186 L 260 200" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 3: two pointers count -->
    <rect x="40" y="204" width="440" height="90" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="224" font-size="12" fill="#d6a040" font-weight="bold">③ 双指针：left = 0, right = k - 1</text>
    <text x="54" y="242" font-family="monospace" font-size="10" fill="#555">while (left &lt; right):</text>
    <text x="70" y="258" font-family="monospace" font-size="10" fill="#4a7a3a">a+b &gt; c → count += right-left, right−−   // 区间计数</text>
    <text x="70" y="274" font-family="monospace" font-size="10" fill="#446688">a+b ≤ c → left++                        // 换更大 left</text>
    <text x="70" y="290" font-size="9" fill="#888">升序保证：a+b&gt;c 时 left..right−1 全合法，一次计数 right−left 对</text>

    <path d="M 260 296 L 260 310" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 4: result -->
    <rect x="40" y="314" width="440" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="334" font-size="12" fill="#4a7a3a" font-weight="bold">④ 返回 count</text>
    <text x="54" y="352" font-size="9" fill="#888">每轮 k 独立计数，累加即为全部合法三元组数</text>

    <!-- complexity -->
    <rect x="40" y="374" width="440" height="36" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
    <text x="260" y="392" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">时间 O(n²)  ·  空间 O(log n)（排序栈）</text>
    <text x="260" y="406" text-anchor="middle" font-size="10" fill="#888">计数型双指针：找到分界线后按区间长度一次性计数</text>
  </g>
</svg>
