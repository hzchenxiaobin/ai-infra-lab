<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心概念：固定差异位，左侧匹配 × 右侧匹配</text>

  <!-- s row -->
  <text x="60" y="92" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">s =</text>
  <g filter="url(#rough2)">
    <rect x="80"  y="74" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="103" y="95" text-anchor="middle" font-size="14" fill="#333">a</text>
    <rect x="126" y="74" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="149" y="95" text-anchor="middle" font-size="14" fill="#333">b</text>
    <rect x="172" y="74" width="46" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="195" y="95" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">c</text>
    <rect x="218" y="74" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="241" y="95" text-anchor="middle" font-size="14" fill="#333">d</text>
    <rect x="264" y="74" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="287" y="95" text-anchor="middle" font-size="14" fill="#333">e</text>
  </g>

  <!-- t row -->
  <text x="60" y="138" text-anchor="end" font-size="12" fill="#4a7a3a" font-weight="bold">t =</text>
  <g filter="url(#rough2)">
    <rect x="80"  y="120" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="103" y="141" text-anchor="middle" font-size="14" fill="#333">a</text>
    <rect x="126" y="120" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="149" y="141" text-anchor="middle" font-size="14" fill="#333">b</text>
    <rect x="172" y="120" width="46" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="195" y="141" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">X</text>
    <rect x="218" y="120" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="241" y="141" text-anchor="middle" font-size="14" fill="#333">d</text>
    <rect x="264" y="120" width="46" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4"/>
    <text x="287" y="141" text-anchor="middle" font-size="14" fill="#333">e</text>
  </g>

  <!-- differ marker -->
  <text x="195" y="64" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">差异位 (p,q)</text>
  <path d="M195,68 L195,70 M195,70 L172,70 M195,70 L218,70" stroke="#b85450" stroke-width="1.4" fill="none" filter="url(#rough2)"/>

  <!-- left bracket -->
  <path d="M80,164 L80,170 L172,170 L172,164" fill="none" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="126" y="186" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">left = 2（向左匹配 a,b）</text>

  <!-- right bracket -->
  <path d="M218,164 L218,170 L310,170 L310,164" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="264" y="186" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">right = 2（向右匹配 d,e）</text>

  <!-- arrows indicating extension directions -->
  <path d="M168,158 Q120,150 90,156" fill="none" stroke="#4a7a3a" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <path d="M222,158 Q270,150 300,156" fill="none" stroke="#446688" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- formula box -->
  <rect x="120" y="210" width="340" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="290" y="236" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">以 (p,q) 为唯一差异的子串对数：</text>
  <text x="290" y="262" text-anchor="middle" font-size="15" fill="#b85450" font-weight="bold">(left + 1) × (right + 1)</text>
  <text x="290" y="286" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">= (2+1) × (2+1) = 9</text>

  <!-- explanation of +1 -->
  <text x="30" y="324" font-size="11" fill="#666" font-weight="bold">为何 +1？差异位本身必选，左右各可延伸 0~L 个字符：</text>
  <g filter="url(#rough2)">
    <rect x="40"  y="336" width="80" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="4"/>
    <text x="80"  y="356" text-anchor="middle" font-size="11" fill="#333">仅差异位</text>
    <rect x="130" y="336" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="170" y="356" text-anchor="middle" font-size="11" fill="#333">左延 a/0</text>
    <rect x="220" y="336" width="80" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4"/>
    <text x="260" y="356" text-anchor="middle" font-size="11" fill="#333">左延 ab/1</text>
    <rect x="310" y="336" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="350" y="356" text-anchor="middle" font-size="11" fill="#333">右延 d/0</text>
    <rect x="400" y="336" width="80" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4"/>
    <text x="440" y="356" text-anchor="middle" font-size="11" fill="#333">右延 de/1</text>
  </g>
  <text x="290" y="392" text-anchor="middle" font-size="11" fill="#888">左延 ∈ {0..2}（3 种）× 右延 ∈ {0..2}（3 种）= 9 对</text>

  <text x="290" y="420" text-anchor="middle" font-size="10" fill="#999">示意串 s="abcde", t="abXde"</text>
</svg>
