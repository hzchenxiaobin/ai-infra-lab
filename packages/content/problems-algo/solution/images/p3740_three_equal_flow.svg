<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">算法流程：哈希分组 + 相邻三次出现滑窗</text>

  <!-- ① 建哈希表 -->
  <rect x="160" y="34" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="50" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">① 一趟遍历建哈希表</text>
  <text x="260" y="67" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">pos[v]：值 v 的下标列表（升序）</text>

  <path d="M 260 74 L 260 86" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 1 -->
  <polygon points="260,88 380,130 260,172 140,130" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="134" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">len(pos[v]) ≥ 3 ？</text>

  <!-- 否 → 跳过 -->
  <path d="M 380 130 L 416 130" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="395" y="122" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">否</text>
  <rect x="420" y="112" width="92" height="36" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="466" y="127" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">跳过 v</text>
  <text x="466" y="142" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">凑不齐三元组</text>

  <!-- 是 ↓ -->
  <path d="M 260 172 L 260 188" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="271" y="184" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- ② 滑窗 -->
  <rect x="115" y="190" width="290" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="260" y="206" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">② 枚举相邻三次出现（滑窗）</text>
  <text x="260" y="223" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">best = min(best, pos[v][s+2] − pos[v][s])</text>

  <path d="M 260 230 L 260 244" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="241" font-size="9.5" fill="#888" filter="url(#rough2)">所有值处理完</text>

  <!-- 菱形 2 -->
  <polygon points="260,246 370,288 260,330 150,288" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="292" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">best 仍为 +∞ ？</text>

  <!-- 是 → 返回 -1 -->
  <path d="M 370 288 L 414 288" fill="none" stroke="#b85450" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="390" y="280" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>
  <rect x="418" y="270" width="92" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="464" y="285" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">返回 −1</text>
  <text x="464" y="300" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">无值出现 ≥ 3 次</text>

  <!-- 否 → 返回 2×best -->
  <path d="M 150 288 L 108 288" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="128" y="280" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">否</text>
  <rect x="18" y="270" width="88" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="62" y="292" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">返回 2×best</text>

  <!-- 循环回边：滑窗结束取下一个值 -->
  <path d="M 115 210 L 48 210 L 48 130 L 136 130" fill="none" stroke="#888" stroke-width="1.5"
        stroke-dasharray="5,4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="60" y="200" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">下一个 v</text>
</svg>
