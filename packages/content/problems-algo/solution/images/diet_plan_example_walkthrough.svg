<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：calories = [6,5,0,0], k = 2, lower = 1, upper = 5</text>

  <!-- header: index labels 0..3 -->
  <text x="40" y="59" font-size="11" fill="#888">下标 →</text>
  <rect x="130" y="42" width="60" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="160" y="59" text-anchor="middle" font-size="11" fill="#888">0</text>
  <rect x="190" y="42" width="60" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="220" y="59" text-anchor="middle" font-size="11" fill="#888">1</text>
  <rect x="250" y="42" width="60" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="280" y="59" text-anchor="middle" font-size="11" fill="#888">2</text>
  <rect x="310" y="42" width="60" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="340" y="59" text-anchor="middle" font-size="11" fill="#888">3</text>

  <!-- Step 1: window [0,1] = [6,5], T=11 > 5 → +1 -->
  <text x="40" y="97" font-size="11" fill="#888">W₁[0,1]</text>
  <rect x="130" y="80" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="160" y="97" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>
  <rect x="190" y="80" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="220" y="97" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <rect x="250" y="80" width="60" height="24" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="280" y="97" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <rect x="310" y="80" width="60" height="24" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="340" y="97" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <text x="395" y="97" font-size="11" fill="#4a7a3a" font-weight="bold">T=11, &gt;5 → +1</text>
  <text x="500" y="97" font-size="11" fill="#333" font-weight="bold">score=1</text>

  <!-- Step 2: window [1,2] = [5,0], T=5, in range → 0 -->
  <text x="40" y="139" font-size="11" fill="#888">W₂[1,2]</text>
  <rect x="130" y="122" width="60" height="24" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="160" y="139" text-anchor="middle" font-size="11" fill="#bbb">6</text>
  <rect x="190" y="122" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="139" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <rect x="250" y="122" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="139" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <rect x="310" y="122" width="60" height="24" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="340" y="139" text-anchor="middle" font-size="11" fill="#bbb">0</text>
  <text x="395" y="139" font-size="11" fill="#888">T=5, ∈[1,5] → 0</text>
  <text x="500" y="139" font-size="11" fill="#333" font-weight="bold">score=1</text>

  <!-- Step 3: window [2,3] = [0,0], T=0 < 1 → −1 -->
  <text x="40" y="181" font-size="11" fill="#888">W₃[2,3]</text>
  <rect x="130" y="164" width="60" height="24" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="160" y="181" text-anchor="middle" font-size="11" fill="#bbb">6</text>
  <rect x="190" y="164" width="60" height="24" fill="#f5f5f5" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="220" y="181" text-anchor="middle" font-size="11" fill="#bbb">5</text>
  <rect x="250" y="164" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="181" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <rect x="310" y="164" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="340" y="181" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <text x="395" y="181" font-size="11" fill="#b85450" font-weight="bold">T=0, &lt;1 → −1</text>
  <text x="500" y="181" font-size="11" fill="#333" font-weight="bold">score=0</text>

  <!-- separator -->
  <path d="M 110 200 L 490 200" stroke="#d6a040" stroke-width="1.4" stroke-dasharray="6,4" fill="none" filter="url(#rough2)"/>
  <text x="500" y="204" font-size="10" fill="#d6a040" font-weight="bold">结果</text>

  <!-- result box -->
  <rect x="120" y="210" width="360" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="300" y="232" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">最终 score = 0  ✓</text>

  <!-- verification box -->
  <rect x="60" y="256" width="440" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="278" text-anchor="middle" font-size="12" fill="#444">3 个窗口：[6,5]→11, [5,0]→5, [0,0]→0</text>
  <text x="280" y="296" text-anchor="middle" font-size="12" fill="#555">评分变化：+1, 0, −1</text>
  <text x="280" y="314" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">score = 0 + 1 + 0 + (−1) = 0  ✓</text>
</svg>
