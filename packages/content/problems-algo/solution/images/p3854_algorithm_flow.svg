<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrW" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#999"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="18" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：双模板扫描计数 → 阈值枚举最小化极差</text>
  <text x="260" y="33" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">answer[0] 取错位更少的模板；answer[1] 只在错位数不劣于最优的模板里计算</text>

  <!-- step 1 -->
  <rect x="150" y="44" width="220" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="62" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">① 枚举模板 p：第 i 位要求奇偶 ≡ (i+p) mod 2</text>

  <!-- step 2 -->
  <rect x="140" y="88" width="240" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="106" text-anchor="middle" font-size="8" fill="#333" filter="url(#rough2)">② 扫描：对位 → fixed（记 minF/maxF）；错位 → flex，cost=|flex|</text>

  <!-- decision diamond -->
  <polygon points="260,168 368,204 260,240 152,204" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="200" text-anchor="middle" font-size="8" fill="#333" filter="url(#rough2)">cost ≤</text>
  <text x="260" y="213" text-anchor="middle" font-size="8" fill="#333" filter="url(#rough2)">answer[0] ?</text>

  <!-- branch: skip (right) -->
  <rect x="396" y="188" width="116" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="454" y="200" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">cost 更大，</text>
  <text x="454" y="214" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">跳过该模板</text>

  <!-- step 3 -->
  <rect x="135" y="254" width="250" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="272" text-anchor="middle" font-size="8" fill="#333" filter="url(#rough2)">③ 更新 answer[0]；flex 升序，枚举 k=0..m：前 k 小 +1</text>

  <!-- step 4 -->
  <rect x="135" y="298" width="250" height="28" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="316" text-anchor="middle" font-size="8" fill="#333" filter="url(#rough2)">④ 四候选极值 O(1) 算极差(k)，更新 answer[1] = min</text>

  <!-- main flow arrows -->
  <path d="M 260 72 L 260 84" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <path d="M 260 116 L 260 164" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <path d="M 260 282 L 260 294" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>

  <!-- decision branches -->
  <path d="M 368 204 L 392 204" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="380" y="196" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 260 240 L 260 250" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="270" y="250" font-size="8" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <!-- skip loop back to step 1 -->
  <path d="M 454 188 L 454 58 L 374 58" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <text x="461" y="125" font-size="7.5" fill="#888" filter="url(#rough2)">下一模板</text>

  <!-- step 4 loop back to step 1 -->
  <path d="M 135 312 L 60 312 L 60 58 L 144 58" stroke="#999" stroke-width="1.5" fill="none" marker-end="url(#arrW)" filter="url(#rough2)"/>
  <text x="66" y="185" font-size="7.5" fill="#888" filter="url(#rough2)">下一模板</text>

  <!-- bottom annotation -->
  <rect x="30" y="338" width="460" height="36" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="260" y="350" text-anchor="middle" font-size="8" fill="#333" filter="url(#rough2)">极差(k) = max(maxF, b[k−1]+1, b[m−1]−1) − min(minF, b[0]+1, b[k]−1)，answer[1] = min 极差(k)</text>
  <text x="260" y="364" text-anchor="middle" font-size="8" fill="#333" filter="url(#rough2)">两模板处理完 → 返回 [answer[0], answer[1]]；排序占大头 O(n log n)，额外空间 O(n)</text>
</svg>
