<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="500" height="460" fill="#fafafa"/>

  <text x="250" y="28" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">算法流程</text>

  <!-- start -->
  <rect x="210" y="46" width="80" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="16" filter="url(#rough2)"/>
  <text x="250" y="67" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">开始</text>

  <path d="M250,78 L250,104" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="120" y="106" width="260" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="250" y="126" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">初始化：s = 0，ans = 0，堆 = 空</text>
  <text x="250" y="142" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">小根堆只装负数候选</text>

  <path d="M250,150 L250,176" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop header -->
  <polygon points="250,178 360,212 250,246 140,212" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="208" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">遍历 nums：</text>
  <text x="250" y="224" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">还有下一个 x？</text>

  <!-- 遍历结束 → 返回 -->
  <path d="M360,212 L420,212" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="206" font-size="11" fill="#446688" filter="url(#rough2)">否</text>
  <rect x="420" y="196" width="64" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="452" y="216" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">返回 ans</text>

  <!-- 是 → step1 -->
  <path d="M250,246 L250,272" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="258" y="264" font-size="11" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- step1: 累加 + 入堆 -->
  <rect x="80" y="274" width="340" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="250" y="294" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">s += x；若 x &lt; 0 则 push x 入堆</text>
  <text x="250" y="312" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">只把负数作为「后置候选」</text>

  <path d="M250,324 L250,348" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision: s<0? -->
  <polygon points="250,350 340,384 250,418 160,384" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="382" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">s &lt; 0 ?</text>
  <text x="250" y="398" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">前缀和跌破零线</text>

  <!-- 否 → 回到 loop header -->
  <path d="M160,384 L60,384 L60,212 L140,212" fill="none" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="66" y="300" font-size="11" fill="#446688" filter="url(#rough2)">否，取下一个 x</text>

  <!-- 是 → pop 循环 -->
  <path d="M250,418 L250,432" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="258" y="428" font-size="11" fill="#b85450" filter="url(#rough2)">是</text>

  <rect x="100" y="434" width="300" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="250" y="448" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">while s&lt;0：v=pop 堆顶；s−=v；ans+1</text>

  <!-- pop 完回到 decision -->
  <path d="M400,444 L460,444 L460,384 L340,384" fill="none" stroke="#b85450" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="368" y="438" font-size="10" fill="#b85450" filter="url(#rough2)">继续判 s&lt;0</text>
</svg>
