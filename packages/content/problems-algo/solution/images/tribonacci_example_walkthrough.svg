<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="340" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：n = 4 时 DP 数组填充过程</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">自底向上，每个 T[i] 由前三项相加得到，初值 T[0]=0, T[1]=T[2]=1</text>

  <!-- ===== index row ===== -->
  <g font-size="11" fill="#888">
    <text x="80" y="95" text-anchor="middle">i</text>
    <text x="140" y="95" text-anchor="middle">0</text>
    <text x="210" y="95" text-anchor="middle">1</text>
    <text x="280" y="95" text-anchor="middle">2</text>
    <text x="350" y="95" text-anchor="middle">3</text>
    <text x="420" y="95" text-anchor="middle" fill="#b85450" font-weight="bold">4</text>
  </g>

  <!-- ===== T[i] cells ===== -->
  <!-- T[0] init -->
  <rect x="115" y="108" width="50" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="140" y="136" text-anchor="middle" font-size="14" fill="#a07820" font-weight="bold">0</text>
  <!-- T[1] init -->
  <rect x="185" y="108" width="50" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="136" text-anchor="middle" font-size="14" fill="#a07820" font-weight="bold">1</text>
  <!-- T[2] init -->
  <rect x="255" y="108" width="50" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="136" text-anchor="middle" font-size="14" fill="#a07820" font-weight="bold">1</text>
  <!-- T[3] -->
  <rect x="325" y="108" width="50" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="350" y="136" text-anchor="middle" font-size="14" fill="#2a3f55" font-weight="bold">2</text>
  <!-- T[4] answer -->
  <rect x="395" y="108" width="50" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="136" text-anchor="middle" font-size="14" fill="#2d4d22" font-weight="bold">4</text>

  <!-- label T[i] -->
  <text x="80" y="136" text-anchor="middle" font-size="11" fill="#888">T[i]</text>

  <!-- ===== three arrows for T[4] = T[3] + T[2] + T[1] ===== -->
  <!-- from T[1] to T[4] (dashed, the i-3 term) -->
  <path d="M 210 155 Q 270 210 410 152" stroke="#446688" stroke-width="1.3" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="225" y="200" width="76" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="263" y="214" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">T(i-3)=1</text>

  <!-- from T[2] to T[4] (dashed, the i-2 term) -->
  <path d="M 280 155 Q 320 188 408 152" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="315" y="180" width="76" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="353" y="194" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">T(i-2)=1</text>

  <!-- from T[3] to T[4] (solid, the i-1 term) -->
  <path d="M 350 155 Q 375 170 405 152" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="370" y="162" width="68" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="404" y="176" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">T(i-1)=2</text>

  <!-- ===== step table ===== -->
  <rect x="40" y="232" width="480" height="88" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="60" y="256" font-size="11" fill="#444" font-weight="bold">逐步递推：</text>
  <g font-size="11" fill="#333">
    <text x="60" y="278">i=3: T[3] = T[2] + T[1] + T[0] = 1 + 1 + 0 = 2</text>
    <text x="60" y="298">i=4: T[4] = T[3] + T[2] + T[1] = 2 + 1 + 1 = 4  ← 答案</text>
    <text x="60" y="314" fill="#888" font-size="10">滚动数组只需保留 T[i-1]、T[i-2]、T[i-3] 三个变量</text>
  </g>
</svg>
