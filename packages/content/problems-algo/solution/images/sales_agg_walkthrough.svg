<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 540" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="540" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：3 行记录 → 2 个产品合计</text>

  <!-- 原始表 Sales -->
  <text x="40" y="50" font-size="11.5" fill="#888">原始表 Sales</text>

  <!-- 表头 -->
  <rect x="40" y="56" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="75" y="74" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">sale_id</text>
  <rect x="110" y="56" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="74" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">product_id</text>
  <rect x="200" y="56" width="70" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="235" y="74" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">year</text>
  <rect x="270" y="56" width="90" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="315" y="74" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">quantity</text>
  <rect x="360" y="56" width="80" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="400" y="74" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">price</text>
  <rect x="440" y="56" width="60" height="26" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="470" y="74" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">分组</text>

  <!-- Row 1: (1, 100, 2008, 10, 5000) -->
  <rect x="40" y="84" width="70" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="75" y="99" text-anchor="middle" font-size="10.5" fill="#333">1</text>
  <rect x="110" y="84" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="155" y="99" text-anchor="middle" font-size="10.5" fill="#333">100</text>
  <rect x="200" y="84" width="70" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="235" y="99" text-anchor="middle" font-size="10.5" fill="#333">2008</text>
  <rect x="270" y="84" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="315" y="99" text-anchor="middle" font-size="10.5" fill="#333">10</text>
  <rect x="360" y="84" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="400" y="99" text-anchor="middle" font-size="10.5" fill="#333">5000</text>
  <rect x="440" y="84" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="470" y="99" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">A</text>

  <!-- Row 2: (2, 100, 2009, 12, 5000) -->
  <rect x="40" y="108" width="70" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="75" y="123" text-anchor="middle" font-size="10.5" fill="#333">2</text>
  <rect x="110" y="108" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="155" y="123" text-anchor="middle" font-size="10.5" fill="#333">100</text>
  <rect x="200" y="108" width="70" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="235" y="123" text-anchor="middle" font-size="10.5" fill="#333">2009</text>
  <rect x="270" y="108" width="90" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="315" y="123" text-anchor="middle" font-size="10.5" fill="#333">12</text>
  <rect x="360" y="108" width="80" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="400" y="123" text-anchor="middle" font-size="10.5" fill="#333">5000</text>
  <rect x="440" y="108" width="60" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="470" y="123" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">A</text>

  <!-- Row 3: (7, 200, 2011, 15, 9000) -->
  <rect x="40" y="132" width="70" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="75" y="147" text-anchor="middle" font-size="10.5" fill="#333">7</text>
  <rect x="110" y="132" width="90" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="155" y="147" text-anchor="middle" font-size="10.5" fill="#333">200</text>
  <rect x="200" y="132" width="70" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="235" y="147" text-anchor="middle" font-size="10.5" fill="#333">2011</text>
  <rect x="270" y="132" width="90" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="315" y="147" text-anchor="middle" font-size="10.5" fill="#333">15</text>
  <rect x="360" y="132" width="80" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="400" y="147" text-anchor="middle" font-size="10.5" fill="#333">9000</text>
  <rect x="440" y="132" width="60" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="470" y="147" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">B</text>

  <!-- 箭头 -->
  <path d="M 250 160 L 250 180" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="260" y="174" font-size="10" fill="#888">GROUP BY product_id + SUM(quantity)</text>

  <!-- 分组求和表 -->
  <text x="40" y="192" font-size="11.5" fill="#888">分组求和</text>

  <rect x="70" y="200" width="110" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="125" y="217" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">product_id</text>
  <rect x="180" y="200" width="180" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="217" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">quantity 求和</text>
  <rect x="360" y="200" width="120" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="420" y="217" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">total_quantity</text>

  <!-- Group A: 100 -> 10+12=22 -->
  <rect x="70" y="226" width="110" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="125" y="243" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">100</text>
  <rect x="180" y="226" width="180" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="270" y="243" text-anchor="middle" font-size="10.5" fill="#333">10 + 12 = 22</text>
  <rect x="360" y="226" width="120" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="420" y="243" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">22</text>

  <!-- Group B: 200 -> 15 -->
  <rect x="70" y="252" width="110" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="125" y="269" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold">200</text>
  <rect x="180" y="252" width="180" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="270" y="269" text-anchor="middle" font-size="10.5" fill="#333">15 = 15</text>
  <rect x="360" y="252" width="120" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="420" y="269" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">15</text>

  <!-- 箭头到结果 -->
  <path d="M 250 278 L 250 298" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="260" y="292" font-size="10" fill="#888">SELECT 输出</text>

  <!-- 结果 -->
  <rect x="70" y="304" width="410" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="275" y="324" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">结果：100 → 22，200 → 15</text>
  <text x="275" y="340" text-anchor="middle" font-size="10.5" fill="#555">仅包含 Sales 表中出现过的 product_id</text>

  <!-- Product 表对比说明 -->
  <rect x="40" y="366" width="500" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="60" y="386" font-size="11" fill="#d6a040" font-weight="bold">⚠️ Product 表里的 400 / Lenovo 怎么不在结果？</text>
  <text x="60" y="402" font-size="10.5" fill="#888">Sales 表没有 product_id = 400 的行 → GROUP BY 不产生该组 → 不输出。</text>
  <text x="60" y="418" font-size="10.5" fill="#888">若要“零销量产品也显示 0”，需 LEFT JOIN Product 后用 COALESCE(SUM,0)。</text>
</svg>
