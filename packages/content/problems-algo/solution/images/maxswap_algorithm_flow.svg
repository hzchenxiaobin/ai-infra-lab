<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="540" height="470" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：last 表 + 左扫，一次命中即交换返回</text>
  <text x="270" y="46" text-anchor="middle" font-size="11" fill="#888">数位只有 0–9 共 10 种 → 「右侧最大值的最右位置」预存进 last 表</text>

  <!-- ① 转 num -> digits -->
  <rect x="150" y="64" width="240" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="90" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">① 转 num → 数位序列 digits（n 位）</text>
  <path d="M 270 106 L 270 118" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② last 表 -->
  <rect x="120" y="120" width="300" height="48" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="142" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">② 预处理 last[d] = 数位 d 的最后出现下标</text>
  <text x="270" y="160" text-anchor="middle" font-size="11" fill="#666">d ∈ {0, 1, …, 9}，未出现记 −1</text>
  <path d="M 270 168 L 270 180" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ for i -->
  <rect x="150" y="182" width="240" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="270" y="207" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">③ for i = 0 to n − 1</text>
  <path d="M 270 222 L 270 236" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="270,238 410,296 270,354 130,296" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="290" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">从 d = 9 递减到 digits[i]+1</text>
  <text x="270" y="308" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">∃ last[d] &gt; i ?</text>

  <!-- Yes branch -> right (green) -->
  <path d="M 410 296 L 448 296" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="428" y="288" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="380" y="320" width="150" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="455" y="342" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">交换 digits[i]</text>
  <text x="455" y="358" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">↔ digits[last[d]]</text>
  <text x="455" y="374" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">→ 返回拼接值</text>

  <!-- No branch -> down (orange) -->
  <path d="M 270 354 L 270 372" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="284" y="368" font-size="11" fill="#d6a040" font-weight="bold">否</text>

  <!-- i++ / loop back note -->
  <rect x="180" y="374" width="180" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="396" text-anchor="middle" font-size="11.5" fill="#333">i++，回到 ③ 继续左扫</text>

  <!-- loop-back arrow: from i++ box left side up to ③ box left side -->
  <path d="M 180 392 Q 70 392 70 202 L 148 202" stroke="#888" stroke-width="1.6" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="70" y="300" text-anchor="middle" font-size="10" fill="#888">下一个 i</text>

  <!-- exit: loop ends -> return original -->
  <path d="M 360 392 Q 470 392 470 430 L 416 430" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="470" y="412" text-anchor="middle" font-size="10" fill="#b85450">i 越界</text>
  <rect x="196" y="416" width="220" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="306" y="438" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">无可提升位 → 返回原 num</text>

  <!-- bottom note -->
  <text x="270" y="464" text-anchor="middle" font-size="10.5" fill="#888">内层至多 9 次比较（d 从 9 递减）→ 总 O(9n) = O(n)</text>
</svg>
