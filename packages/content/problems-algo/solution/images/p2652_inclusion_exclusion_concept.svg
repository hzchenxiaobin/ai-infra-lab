<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">容斥原理：能被 3 或 5 或 7 整除的数之和</text>

  <!-- Three overlapping circles -->
  <ellipse cx="205" cy="165" rx="92" ry="82" fill="#e8f0fe" fill-opacity="0.55" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <ellipse cx="345" cy="165" rx="92" ry="82" fill="#e6f4ea" fill-opacity="0.55" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <ellipse cx="275" cy="255" rx="92" ry="82" fill="#fff8e1" fill-opacity="0.6" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- Set labels -->
  <text x="150" y="118" text-anchor="middle" font-size="13" fill="#446688" font-weight="bold">倍数 3</text>
  <text x="150" y="134" text-anchor="middle" font-size="11" fill="#446688">S(3)</text>
  <text x="400" y="118" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">倍数 5</text>
  <text x="400" y="134" text-anchor="middle" font-size="11" fill="#4a7a3a">S(5)</text>
  <text x="275" y="330" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold">倍数 7</text>
  <text x="275" y="346" text-anchor="middle" font-size="11" fill="#d6a040">S(7)</text>

  <!-- Pairwise intersection labels -->
  <text x="275" y="140" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3∩5=15</text>
  <text x="205" y="232" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3∩7=21</text>
  <text x="345" y="232" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">5∩7=35</text>
  <text x="277" y="202" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3∩5∩7=105</text>

  <!-- Formula box -->
  <rect x="40" y="358" width="480" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="375" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">和 = S(3)+S(5)+S(7) − S(15)−S(21)−S(35) + S(105)</text>
  <text x="280" y="389" text-anchor="middle" font-size="10" fill="#888">加单集合 − 减两两交集 + 加三重重叠（容斥）</text>
</svg>
