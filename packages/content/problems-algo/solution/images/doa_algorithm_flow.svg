<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 540"
     font-family="'Comic Sans MS','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>
  <rect width="620" height="540" fill="#fafafa"/>

  <text x="310" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">数组的度：算法流程</text>
  <path d="M 200 42 Q 310 50 420 42" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- 开始 -->
  <g filter="url(#rough2)">
    <rect x="120" y="64" width="160" height="34" rx="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="200" y="86" text-anchor="middle" font-size="14" fill="#2e5a26" font-weight="bold">开始</text>
  <path d="M 200 98 L 200 118" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 一次遍历 -->
  <g filter="url(#rough2)">
    <rect x="80" y="120" width="240" height="86" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="200" y="142" text-anchor="middle" font-size="13" fill="#2b4a66" font-weight="bold">一次遍历 nums[i]</text>
  <text x="200" y="162" text-anchor="middle" font-size="12" fill="#2b4a66">首次出现 → first = i</text>
  <text x="200" y="180" text-anchor="middle" font-size="12" fill="#2b4a66">count++; last = i</text>
  <text x="200" y="198" text-anchor="middle" font-size="12" fill="#2b4a66">degree = max(degree, count)</text>
  <path d="M 200 206 L 200 226" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 遍历 map -->
  <g filter="url(#rough2)">
    <rect x="80" y="228" width="240" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="200" y="253" text-anchor="middle" font-size="13" fill="#2b4a66" font-weight="bold">遍历 map 每个 (v, cnt, first, last)</text>
  <path d="M 200 268 L 200 290" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond cnt == degree? -->
  <g filter="url(#rough2)">
    <path d="M 200 292 L 286 332 L 200 372 L 114 332 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
  </g>
  <text x="200" y="328" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">cnt ==</text>
  <text x="200" y="344" text-anchor="middle" font-size="12" fill="#7a5415" font-weight="bold">degree ?</text>

  <!-- 是 branch to right -->
  <path d="M 286 332 L 358 332" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="322" y="324" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">是</text>
  <g filter="url(#rough2)">
    <rect x="358" y="312" width="200" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6"/>
  </g>
  <text x="458" y="337" text-anchor="middle" font-size="12" fill="#7a5415">ans = min(ans, last - first + 1)</text>

  <!-- 否 down -->
  <text x="214" y="390" font-size="11" fill="#b85450" font-weight="bold">否</text>
  <path d="M 200 372 L 200 412" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- merge from 是 box into right side of return box -->
  <path d="M 458 352 L 458 432 L 282 432" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4 3"/>

  <!-- 返回 ans -->
  <g filter="url(#rough2)">
    <rect x="120" y="412" width="160" height="40" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
  </g>
  <text x="200" y="437" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">返回 ans</text>
  <path d="M 200 452 L 200 472" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 结束 -->
  <g filter="url(#rough2)">
    <rect x="120" y="472" width="160" height="34" rx="17" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
  </g>
  <text x="200" y="494" text-anchor="middle" font-size="14" fill="#2e5a26" font-weight="bold">结束</text>
</svg>
