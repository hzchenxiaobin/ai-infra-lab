<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心观察：avg≥threshold  ⟺  sum≥k×threshold</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">去掉除法转整数求和，再用定长窗口 O(1) 平移</text>

  <!-- ===== transformation formula ===== -->
  <rect x="60" y="62" width="480" height="60" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="300" y="86" text-anchor="middle" font-size="13" fill="#444" font-family="monospace">sum / k  ≥  threshold</text>
  <text x="300" y="108" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" font-family="monospace">sum  ≥  k × threshold  =  target</text>

  <!-- ===== array with fixed window ===== -->
  <text x="60" y="150" font-size="11" fill="#4a7a3a" font-weight="bold">arr = [2,2,2,2,5,5,5,8],  k=3,  threshold=4  →  target=12</text>

  <!-- window highlight (positions 3..5: [2,5,5]) -->
  <rect x="232" y="160" width="144" height="44" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>

  <!-- 8 cells -->
  <g font-size="13">
    <rect x="88" y="162" width="46" height="40" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="111" y="187" text-anchor="middle" fill="#333">2</text>
    <rect x="136" y="162" width="46" height="40" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="159" y="187" text-anchor="middle" fill="#333">2</text>
    <rect x="184" y="162" width="46" height="40" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="207" y="187" text-anchor="middle" fill="#333">2</text>
    <rect x="232" y="162" width="48" height="40" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="256" y="187" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>
    <rect x="280" y="162" width="48" height="40" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="304" y="187" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
    <rect x="328" y="162" width="48" height="40" rx="4" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
    <text x="352" y="187" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
    <rect x="376" y="162" width="46" height="40" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="399" y="187" text-anchor="middle" fill="#333">5</text>
    <rect x="424" y="162" width="46" height="40" rx="4" fill="#ffffff" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
    <text x="447" y="187" text-anchor="middle" fill="#333">8</text>
  </g>

  <!-- window brace + sum label -->
  <text x="304" y="222" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">窗口 [2,5,5]：sum=12 ≥ 12 ✓</text>

  <!-- ===== O(1) slide mechanic ===== -->
  <text x="60" y="252" font-size="11" fill="#446688" font-weight="bold">相邻窗口只差两端各一个元素 → O(1) 平移</text>

  <!-- old window -->
  <rect x="88" y="262" width="144" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="160" y="286" text-anchor="middle" font-size="11" fill="#446688">窗口 i：arr[i..i+k−1]</text>

  <!-- arrow -->
  <path d="M 240 281 L 296 281" stroke="#666" stroke-width="1.4" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- new window -->
  <rect x="304" y="262" width="144" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="376" y="286" text-anchor="middle" font-size="11" fill="#4a7a3a">窗口 i+1：arr[i+1..i+k]</text>

  <!-- formula for slide -->
  <rect x="60" y="312" width="480" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300" y="338" text-anchor="middle" font-size="12" fill="#444" font-family="monospace">sum_new = sum_old − arr[i] + arr[i+k]</text>

  <!-- bottom note -->
  <text x="300" y="374" text-anchor="middle" font-size="10" fill="#888">定长窗口无需 while 收缩：左右端同步右移一格，只判是否满足即计数</text>
  <text x="300" y="390" text-anchor="middle" font-size="10" fill="#888">共 n−k+1 个窗口，整体 O(n) / O(1)</text>
</svg>
