<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：按 artist 分组 + 计数</text>

  <!-- ===== Left: Spotify table ===== -->
  <text x="170" y="48" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">Spotify 表（5 行 = 5 首曲目）</text>

  <!-- Header row -->
  <rect x="40" y="56" width="260" height="22" fill="#f0f0f0" stroke="#888" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="62" y="71" text-anchor="middle" font-size="9" fill="#555" font-weight="bold">id</text>
  <text x="155" y="71" text-anchor="middle" font-size="9" fill="#555" font-weight="bold">track_name</text>
  <text x="265" y="71" text-anchor="middle" font-size="9" fill="#555" font-weight="bold">artist</text>

  <!-- Row 1: Ed Sheeran (blue) -->
  <rect x="40" y="78" width="260" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="62" y="93" text-anchor="middle" font-size="8" fill="#333">303651</text>
  <text x="155" y="93" text-anchor="middle" font-size="8" fill="#333">Heart Won't Forget</text>
  <text x="265" y="93" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">Ed Sheeran</text>

  <!-- Row 2: Sia (green) -->
  <rect x="40" y="100" width="260" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="62" y="115" text-anchor="middle" font-size="8" fill="#333">1046089</text>
  <text x="155" y="115" text-anchor="middle" font-size="8" fill="#333">Shape of you</text>
  <text x="265" y="115" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">Sia</text>

  <!-- Row 3: DJ Khalid (orange) -->
  <rect x="40" y="122" width="260" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="62" y="137" text-anchor="middle" font-size="8" fill="#333">33445</text>
  <text x="155" y="137" text-anchor="middle" font-size="8" fill="#333">I'm the one</text>
  <text x="265" y="137" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">DJ Khalid</text>

  <!-- Row 4: DJ Khalid (orange) -->
  <rect x="40" y="144" width="260" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="62" y="159" text-anchor="middle" font-size="8" fill="#333">811266</text>
  <text x="155" y="159" text-anchor="middle" font-size="8" fill="#333">Young Dumb &amp; Broke</text>
  <text x="265" y="159" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">DJ Khalid</text>

  <!-- Row 5: Ed Sheeran (blue) -->
  <rect x="40" y="166" width="260" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="62" y="181" text-anchor="middle" font-size="8" fill="#333">505727</text>
  <text x="155" y="181" text-anchor="middle" font-size="8" fill="#333">Happier</text>
  <text x="265" y="181" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">Ed Sheeran</text>

  <!-- ===== Arrows from artist column to group buckets ===== -->
  <!-- Ed Sheeran rows (row1 y=89, row5 y=177) → bucket at (380, 100) -->
  <path d="M 300 89 Q 340 89 360 100" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 300 177 Q 340 177 360 112" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Sia row (row2 y=111) → bucket at (380, 260) -->
  <path d="M 300 111 Q 340 200 360 260" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- DJ Khalid rows (row3 y=133, row4 y=155) → bucket at (380, 180) -->
  <path d="M 300 133 Q 340 150 360 170" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 300 155 Q 340 165 360 190" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Right: Group buckets ===== -->
  <text x="470" y="48" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">按 artist 分组</text>

  <!-- Bucket: Ed Sheeran -->
  <rect x="360" y="74" width="200" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="395" y="93" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">Ed Sheeran</text>
  <text x="500" y="93" text-anchor="middle" font-size="10" fill="#888">→</text>
  <text x="540" y="93" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">2</text>
  <text x="460" y="110" text-anchor="middle" font-size="7" fill="#888">2 首曲目 = 2 次出现</text>

  <!-- Bucket: DJ Khalid -->
  <rect x="360" y="146" width="200" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="395" y="165" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">DJ Khalid</text>
  <text x="500" y="165" text-anchor="middle" font-size="10" fill="#888">→</text>
  <text x="540" y="165" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">2</text>
  <text x="460" y="182" text-anchor="middle" font-size="7" fill="#888">2 首曲目 = 2 次出现</text>

  <!-- Bucket: Sia -->
  <rect x="360" y="236" width="200" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="395" y="255" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">Sia</text>
  <text x="500" y="255" text-anchor="middle" font-size="10" fill="#888">→</text>
  <text x="540" y="255" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="460" y="272" text-anchor="middle" font-size="7" fill="#888">1 首曲目 = 1 次出现</text>

  <!-- ===== Bottom note ===== -->
  <rect x="40" y="310" width="500" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="290" y="332" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">分组计数：GROUP BY artist + COUNT(*)</text>
  <text x="290" y="352" text-anchor="middle" font-size="9" fill="#666">① 每行 = 一首曲目 = 一次「出现」（occurrence）</text>
  <text x="290" y="370" text-anchor="middle" font-size="9" fill="#666">② GROUP BY artist 把同艺术家的行归为一组</text>
  <text x="290" y="388" text-anchor="middle" font-size="9" fill="#b85450">⚠ 一首曲目只算一次，不按 track_name 去重（行本身已唯一）</text>
</svg>
