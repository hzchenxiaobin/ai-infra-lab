<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333" filter="url(#rough2)">EventEmitter = Map 分组 + 保序数组 + 闭包退订</text>

  <!-- Map 容器 -->
  <rect x="60" y="60" width="180" height="200" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="150" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" filter="url(#rough2)">this.events: Map</text>
  <line x1="70" y1="90" x2="230" y2="90" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <!-- 事件行 1 -->
  <text x="75" y="112" font-size="11" fill="#333" filter="url(#rough2)">"onClick"</text>
  <text x="165" y="112" font-size="11" fill="#446688" filter="url(#rough2)">→</text>
  <text x="180" y="112" font-size="11" fill="#4a7a3a" filter="url(#rough2)">[ cb1, cb2 ]</text>

  <!-- 事件行 2 -->
  <text x="75" y="138" font-size="11" fill="#333" filter="url(#rough2)">"firstEvent"</text>
  <text x="165" y="138" font-size="11" fill="#446688" filter="url(#rough2)">→</text>
  <text x="180" y="138" font-size="11" fill="#4a7a3a" filter="url(#rough2)">[ cbA, cbB ]</text>

  <!-- 事件行 3 -->
  <text x="75" y="164" font-size="11" fill="#333" filter="url(#rough2)">"scroll"</text>
  <text x="165" y="164" font-size="11" fill="#446688" filter="url(#rough2)">→</text>
  <text x="180" y="164" font-size="11" fill="#4a7a3a" filter="url(#rough2)">[ cbX ]</text>

  <!-- 空事件 -->
  <text x="75" y="190" font-size="11" fill="#999" filter="url(#rough2)">"hover"</text>
  <text x="165" y="190" font-size="11" fill="#446688" filter="url(#rough2)">→</text>
  <text x="180" y="190" font-size="11" fill="#999" filter="url(#rough2)">[ ] (空)</text>

  <text x="150" y="230" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">事件名分组，O(1) 定位</text>

  <!-- subscribe 箭头 -->
  <path d="M 290 130 Q 250 130 242 130" fill="none" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="290" y="105" width="120" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="350" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">subscribe</text>
  <text x="350" y="142" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">push(callback) 尾插保序</text>
  <text x="350" y="156" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">→ 返回 { unsubscribe }</text>

  <!-- emit 箭头 -->
  <path d="M 242 168 Q 270 168 290 168" fill="none" stroke="#d6a040" stroke-width="2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <rect x="290" y="175" width="120" height="55" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="350" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#d6a040" filter="url(#rough2)">emit</text>
  <text x="350" y="212" text-anchor="middle" font-size="10" fill="#d6a040" filter="url(#rough2)">map(cb → cb(...args))</text>
  <text x="350" y="225" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">→ 返回 [结果1, 结果2]</text>

  <!-- 闭包退订 -->
  <rect x="290" y="250" width="120" height="55" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="350" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">unsubscribe</text>
  <text x="350" y="287" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">indexOf + splice</text>
  <text x="350" y="300" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">原地删，不重建</text>

  <!-- 闭包箭头：unsubscribe → 数组 -->
  <path d="M 290 280 Q 250 210 242 160" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="262" y="225" font-size="9" fill="#b85450" filter="url(#rough2)">闭包捕获 listeners</text>

  <!-- 图例 -->
  <rect x="50" y="330" width="470" height="40" fill="none" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <rect x="60" y="342" width="14" height="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="80" y="352" font-size="10" fill="#333" filter="url(#rough2)">绿 = subscribe 尾插</text>
  <rect x="220" y="342" width="14" height="12" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="240" y="352" font-size="10" fill="#333" filter="url(#rough2)">橙 = emit 遍历调用</text>
  <rect x="370" y="342" width="14" height="12" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="390" y="352" font-size="10" fill="#333" filter="url(#rough2)">红 = unsubscribe 闭包删</text>
</svg>
