<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：数字和 s 与数字积 p 之和能否整除 n</text>

  <!-- n = 99 的两位数字 -->
  <text x="260" y="56" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">n = 99，逐位取出：</text>
  <rect x="216" y="64" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="236" y="86" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">9</text>
  <rect x="262" y="64" width="40" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="282" y="86" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">9</text>

  <!-- 分流箭头 -->
  <path d="M 226 100 C 185 126, 155 138, 141 152" fill="none" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 292 100 C 335 126, 365 138, 379 152" fill="none" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="158" y="134" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">逐位累加 +</text>
  <text x="362" y="134" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">逐位相乘 ×</text>

  <!-- 数字和 -->
  <rect x="60" y="156" width="160" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="140" y="178" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">数字和 s（初值 0）</text>
  <text x="140" y="200" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9 + 9 = 18</text>
  <text x="140" y="218" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">n ≥ 1 ⇒ s ≥ 1</text>

  <!-- 数字积 -->
  <rect x="300" y="156" width="160" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="380" y="178" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">数字积 p（初值 1）</text>
  <text x="380" y="200" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">9 × 9 = 81</text>
  <text x="380" y="218" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">含数字 0 ⇒ p = 0</text>

  <!-- 汇聚箭头 -->
  <path d="M 140 226 C 140 250, 200 254, 234 260" fill="none" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 380 226 C 380 250, 320 254, 286 260" fill="none" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- s + p -->
  <rect x="160" y="264" width="200" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="286" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">s + p = 18 + 81 = 99</text>

  <!-- 判定 -->
  <path d="M 260 298 L 260 310" fill="none" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="160" y="314" width="200" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="336" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">n % (s+p) = 99 % 99 = 0 → true</text>

  <!-- 侧注 -->
  <text x="470" y="176" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">含 0 位时</text>
  <text x="470" y="192" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">p = 0，判定</text>
  <text x="470" y="208" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">退化为 n % s</text>

  <text x="16" y="350" font-size="10" fill="#999" filter="url(#rough2)">注：除数 s+p 恒 ≥ 1（n ≥ 1 ⇒ s ≥ 1），无除零风险</text>
</svg>
