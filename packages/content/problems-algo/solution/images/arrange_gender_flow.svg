<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 7 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">流程：SELECT → 计算排序键 → ORDER BY 排列 → 输出</text>

  <!-- Step 1 -->
  <rect x="30" y="50" width="150" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="105" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① 读取表</text>
  <text x="105" y="88" text-anchor="middle" font-size="9" fill="#444">SELECT user_id, gender</text>
  <text x="105" y="100" text-anchor="middle" font-size="9" fill="#444">FROM Genders</text>
  <text x="105" y="114" text-anchor="middle" font-size="8" fill="#888">全表扫描 O(n)</text>

  <path d="M 185 85 L 215 85" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="220" y="50" width="170" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="305" y="70" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">② 构造排序键</text>
  <text x="305" y="88" text-anchor="middle" font-size="9" fill="#444">FIELD(gender,</text>
  <text x="305" y="100" text-anchor="middle" font-size="9" fill="#444">'female','other','male')</text>
  <text x="305" y="114" text-anchor="middle" font-size="8" fill="#888">female→1, other→2, male→3</text>

  <path d="M 395 85 L 425 85" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3 -->
  <rect x="430" y="50" width="80" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="470" y="70" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">③ 排序</text>
  <text x="470" y="88" text-anchor="middle" font-size="9" fill="#444">ORDER BY</text>
  <text x="470" y="100" text-anchor="middle" font-size="9" fill="#444">key, user_id</text>
  <text x="470" y="114" text-anchor="middle" font-size="8" fill="#888">O(n log n)</text>

  <path d="M 470 125 L 470 150 L 260 150 L 260 175" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: output -->
  <rect x="120" y="178" width="280" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="198" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">④ 输出排列后的表</text>
  <text x="260" y="214" text-anchor="middle" font-size="9" fill="#444">female 组 → other 组 → male 组</text>
  <text x="260" y="228" text-anchor="middle" font-size="9" fill="#444">组内按 user_id 升序</text>
  <text x="260" y="238" text-anchor="middle" font-size="8" fill="#888">结果行序确定，可判题</text>

  <!-- Bottom: ORDER BY clause anatomy -->
  <text x="260" y="266" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">ORDER BY 子句拆解</text>
  <rect x="30" y="274" width="460" height="72" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="44" y="294" font-size="10" fill="#446688" font-weight="bold">ORDER BY</text>
  <text x="104" y="294" font-size="10" fill="#4a7a3a" font-weight="bold">FIELD(gender,'female','other','male')</text>
  <text x="324" y="294" font-size="10" fill="#888">,  -- 主排序键：性别自定义顺序</text>
  <text x="104" y="312" font-size="10" fill="#d6a040" font-weight="bold">user_id</text>
  <text x="156" y="312" font-size="10" fill="#888">ASC -- 次排序键：组内稳定 tie-breaker</text>
  <text x="44" y="334" font-size="9" fill="#b85450">⚠ 缺 user_id 则组内行序不确定 → 判题可能失败</text>
</svg>
