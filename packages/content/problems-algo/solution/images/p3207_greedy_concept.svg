<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：留一个最小敌人当提款机，其余全部变现</text>

  <text x="46" y="52" font-size="10.5" fill="#888" filter="url(#rough2)">示例：敌人 [3, 2, 2]，E₀ = 2 → mn = 2, S = 7</text>

  <rect x="40" y="64" width="54" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="67" y="87" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">3</text>
  <circle cx="88" cy="66" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 84 66 L 87 69 L 93 63" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="67" y="118" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">敌人0</text>

  <rect x="112" y="64" width="54" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="139" y="87" text-anchor="middle" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="139" y="118" text-anchor="middle" font-size="9.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">敌人1（mn）</text>

  <rect x="184" y="64" width="54" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="211" y="87" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <circle cx="232" cy="66" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <path d="M 228 66 L 231 69 L 237 63" stroke="#4a7a3a" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <text x="211" y="118" text-anchor="middle" font-size="9.5" fill="#666" filter="url(#rough2)">敌人2</text>

  <path d="M 67 60 C 90 30 240 22 322 66" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="182" y="36" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">标记 → 白拿 +3</text>
  <path d="M 211 60 C 240 40 280 40 320 70" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrBlue)" filter="url(#rough2)"/>
  <text x="262" y="44" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">白拿 +2</text>

  <path d="M 139 124 C 100 140 96 158 138 152" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrOrange)" filter="url(#rough2)"/>
  <text x="196" y="146" font-size="9.5" fill="#d6a040" filter="url(#rough2)">每打一次：+1 分 / −2 能量</text>
  <text x="196" y="160" font-size="9.5" fill="#d6a040" filter="url(#rough2)">（得分不标记 → 无限刷）</text>

  <rect x="316" y="56" width="178" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="405" y="76" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">能量池 pool</text>
  <text x="405" y="94" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">= E₀ + (S − mn)</text>
  <text x="405" y="112" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">= 2 + (3+2) = 7</text>

  <rect x="38" y="176" width="256" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="166" y="196" text-anchor="middle" font-size="10" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">💡 提款机：留一个 mn 不标记</text>
  <text x="166" y="214" text-anchor="middle" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">得分操作不要求标记目标 →</text>
  <text x="166" y="228" text-anchor="middle" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">同一个 mn 敌人可以反复刷，</text>
  <text x="166" y="242" text-anchor="middle" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">每 1 分只花 mn = 2 能量，</text>
  <text x="166" y="256" text-anchor="middle" font-size="9.5" fill="#8a6d3b" filter="url(#rough2)">7 点能量 → ⌊7 / 2⌋ = 3 分</text>

  <rect x="316" y="160" width="178" height="102" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="405" y="180" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">通项公式</text>
  <text x="405" y="200" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">ans = ⌊(E₀ + S − mn) / mn⌋</text>
  <text x="405" y="220" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">= ⌊(2 + 7 − 2) / 2⌋</text>
  <text x="405" y="240" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">= 3 ✓</text>
  <text x="405" y="256" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">（单价齐次 → 整除计数）</text>

  <rect x="38" y="288" width="456" height="72" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="266" y="308" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠️ 开局门槛：E₀ ≥ mn，否则答案为 0</text>
  <text x="266" y="326" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">标记操作要求已有 ≥ 1 分 → 第一步必须是得分操作，</text>
  <text x="266" y="340" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">而最便宜的一次得分也要付得起 mn（示例若 E₀=1 &lt; 2 → 0 分）</text>
</svg>
