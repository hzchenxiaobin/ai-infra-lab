<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">核心：立即触发一次 + setInterval 周期重复</text>

  <!-- 时间轴 -->
  <line x1="50" y1="120" x2="520" y2="120" stroke="#999" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="525" y="124" font-size="11" fill="#999" filter="url(#rough2)">t</text>

  <!-- 0 处：手动立即调用（绿，实心方块强调） -->
  <line x1="70" y1="108" x2="70" y2="132" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <circle cx="70" cy="120" r="7" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="70" y="98" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">0</text>
  <text x="70" y="150" text-anchor="middle" font-size="10" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">手动 fn()</text>
  <text x="70" y="163" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">立即执行</text>

  <!-- t 处 setInterval 首次（绿，普通圆） -->
  <line x1="150" y1="110" x2="150" y2="130" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="150" cy="120" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="98" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">t</text>
  <text x="150" y="150" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">setInterval</text>
  <text x="150" y="163" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">首次在 t ms</text>

  <!-- 2t, 3t, 4t, 5t -->
  <line x1="230" y1="110" x2="230" y2="130" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="230" cy="120" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="230" y="98" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">2t</text>

  <line x1="310" y1="110" x2="310" y2="130" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="310" cy="120" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="310" y="98" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">3t</text>

  <line x1="390" y1="110" x2="390" y2="130" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="390" cy="120" r="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="390" y="98" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">4t</text>

  <!-- cancelTimeMs 处 clearInterval（红） -->
  <line x1="450" y1="106" x2="450" y2="134" stroke="#b85450" stroke-width="3" filter="url(#rough2)"/>
  <circle cx="450" cy="120" r="6" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="450" y="96" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">cancelT</text>
  <text x="450" y="150" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">clearInterval</text>
  <text x="450" y="163" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">一刀切停</text>

  <!-- 5t 处本应执行但被取消（灰虚） -->
  <line x1="490" y1="110" x2="490" y2="130" stroke="#ccc" stroke-width="2" stroke-dasharray="3,3" filter="url(#rough2)"/>
  <circle cx="490" cy="120" r="5" fill="none" stroke="#ccc" stroke-width="2" stroke-dasharray="2,2" filter="url(#rough2)"/>
  <text x="490" y="98" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">5t</text>
  <text x="490" y="150" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">不再触发 ✗</text>

  <!-- 三段说明框 -->
  <rect x="40" y="195" width="150" height="70" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="115" y="215" text-anchor="middle" font-size="11" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">① 手动立即调用</text>
  <text x="115" y="233" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">fn(...args) 在 0ms</text>
  <text x="115" y="248" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">setInterval 首次在 t ms</text>
  <text x="115" y="260" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">不会自动补 0ms 这一下！</text>

  <rect x="205" y="195" width="150" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="215" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">② setInterval 重复</text>
  <text x="280" y="233" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">timer = setInterval</text>
  <text x="280" y="248" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">(fn, t, ...args)</text>
  <text x="280" y="260" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">句柄捕获进闭包</text>

  <rect x="370" y="195" width="150" height="70" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="445" y="215" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">③ clearInterval</text>
  <text x="445" y="233" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">return () =&gt;</text>
  <text x="445" y="248" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">clearInterval(timer)</text>
  <text x="445" y="260" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">取消全部后续 tick</text>

  <!-- 关键提示 -->
  <rect x="40" y="285" width="480" height="80" fill="none" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="52" y="303" font-size="11" font-weight="bold" fill="#d6a040" filter="url(#rough2)">两个最易踩的坑</text>
  <text x="52" y="320" font-size="10" fill="#333" filter="url(#rough2)">1. setInterval 的首次触发在 t ms，不在 0ms——所以 0ms 那一下必须手动 fn(...args)。</text>
  <text x="52" y="336" font-size="10" fill="#333" filter="url(#rough2)">2. clearInterval 一次性取消全部尚未触发的 tick（不是只取消下一个），且幂等安全。</text>
  <text x="52" y="356" font-size="10" fill="#333" filter="url(#rough2)">→ tick 次数 = floor(cancelTimeMs / t) + 1（那个 +1 就是 0ms 的手动调用）。</text>
</svg>
