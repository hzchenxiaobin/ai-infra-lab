<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：枚举 k，把 (i,j) 折叠成两个滚动变量</text>

  <!-- prefix zone -->
  <rect x="52" y="58" width="292" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" stroke-dasharray="6 4" rx="10" filter="url(#rough2)"/>
  <text x="198" y="52" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">前缀 [0, k)：与 k 无关，信息可压缩</text>

  <!-- array boxes 0..4 -->
  <rect x="64" y="64" width="56" height="44" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="92" y="91" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">12</text>
  <rect x="124" y="64" width="56" height="44" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="152" y="91" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">6</text>
  <rect x="184" y="64" width="56" height="44" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="212" y="91" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">1</text>
  <rect x="244" y="64" width="56" height="44" fill="#fafafa" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="272" y="91" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">2</text>
  <rect x="316" y="64" width="56" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
  <text x="344" y="91" text-anchor="middle" font-size="13" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">7</text>

  <!-- index labels -->
  <text x="92" y="128" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">0</text>
  <text x="152" y="128" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">1</text>
  <text x="212" y="128" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">2</text>
  <text x="272" y="128" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">3</text>
  <text x="344" y="128" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">k</text>

  <!-- rolling vars box -->
  <rect x="60" y="152" width="280" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="200" y="174" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">两个滚动变量 O(1) 搞定二维枚举</text>
  <text x="200" y="194" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">preMax = max(nums[0..k−1]) = 12</text>
  <text x="200" y="213" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">maxDiff = max(nums[i]−nums[j]) = 11</text>

  <!-- settle box -->
  <rect x="366" y="152" width="120" height="72" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="426" y="176" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">在 k 处结算</text>
  <text x="426" y="196" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">ans = max(ans,</text>
  <text x="426" y="213" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">maxDiff×nums[k])</text>

  <path d="M 340 152 C 340 140 380 128 404 146" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- formula with braces -->
  <rect x="46" y="248" width="428" height="44" fill="#fafafa" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="276" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">( nums[i] − nums[j] )  ×  nums[k]</text>

  <path d="M 96 300 L 96 312 L 210 312 L 210 300" stroke="#446688" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="153" y="330" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">折叠成 maxDiff 一个数</text>
  <path d="M 316 300 L 316 312 L 408 312 L 408 300" stroke="#d6a040" stroke-width="1.4" fill="none" filter="url(#rough2)"/>
  <text x="362" y="330" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">当前元素直接用</text>
</svg>
