<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：能逃到边界的陆地不算飞地</text>
  <text x="260" y="48" text-anchor="middle" font-size="11" fill="#888">逆向：从边界 DFS 沉掉"可逃"陆地，剩下的 1 就是飞地</text>

  <g filter="url(#rough2)" font-size="16" font-weight="bold">
    <!-- border highlight: dashed orange ring around the whole grid -->
    <rect x="56" y="86" width="184" height="184" fill="none" stroke="#d6a040" stroke-width="2" stroke-dasharray="6,4" rx="4"/>

    <!-- Row 0 (top border) all 0 -->
    <rect x="60" y="90" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="82" y="118" text-anchor="middle" fill="#446688">0</text>
    <rect x="104" y="90" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="126" y="118" text-anchor="middle" fill="#446688">0</text>
    <rect x="148" y="90" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="170" y="118" text-anchor="middle" fill="#446688">0</text>
    <rect x="192" y="90" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="214" y="118" text-anchor="middle" fill="#446688">0</text>

    <!-- Row 1: 1,0,1,0 -> (1,0) boundary land green; (1,2) enclave red -->
    <rect x="60" y="134" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4"/>
    <text x="82" y="162" text-anchor="middle" fill="#4a7a3a">1</text>
    <rect x="104" y="134" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="126" y="162" text-anchor="middle" fill="#446688">0</text>
    <rect x="148" y="134" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="170" y="162" text-anchor="middle" fill="#b85450">1</text>
    <rect x="192" y="134" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="214" y="162" text-anchor="middle" fill="#446688">0</text>

    <!-- Row 2: 0,1,1,0 -> (2,1)(2,2) enclave red -->
    <rect x="60" y="178" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="82" y="206" text-anchor="middle" fill="#446688">0</text>
    <rect x="104" y="178" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="126" y="206" text-anchor="middle" fill="#b85450">1</text>
    <rect x="148" y="178" width="44" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4"/>
    <text x="170" y="206" text-anchor="middle" fill="#b85450">1</text>
    <rect x="192" y="178" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="214" y="206" text-anchor="middle" fill="#446688">0</text>

    <!-- Row 3 (bottom border) all 0 -->
    <rect x="60" y="222" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="82" y="250" text-anchor="middle" fill="#446688">0</text>
    <rect x="104" y="222" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="126" y="250" text-anchor="middle" fill="#446688">0</text>
    <rect x="148" y="222" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="170" y="250" text-anchor="middle" fill="#446688">0</text>
    <rect x="192" y="222" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4"/>
    <text x="214" y="250" text-anchor="middle" fill="#446688">0</text>
  </g>

  <!-- annotations on the right -->
  <g filter="url(#rough2)" font-size="12">
    <!-- escapable (green) -->
    <rect x="280" y="120" width="210" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8"/>
    <text x="385" y="140" text-anchor="middle" fill="#4a7a3a" font-weight="bold">边界陆地（可逃逸）</text>
    <text x="385" y="156" text-anchor="middle" fill="#4a7a3a" font-size="11">贴边或连到边 → 沉掉</text>
    <path d="M 280 143 L 108 158" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrG)"/>

    <!-- enclave (red) -->
    <rect x="280" y="180" width="210" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8"/>
    <text x="385" y="200" text-anchor="middle" fill="#b85450" font-weight="bold">飞地（无法逃逸）</text>
    <text x="385" y="216" text-anchor="middle" fill="#b85450" font-size="11">不连边界 → 计入答案</text>
    <path d="M 280 203 L 170 196" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)"/>

    <!-- border ring label -->
    <text x="148" y="80" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">↕ 边界（四条边）</text>

    <!-- answer hint -->
    <rect x="280" y="240" width="210" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8"/>
    <text x="385" y="258" text-anchor="middle" fill="#d6a040" font-weight="bold">答案 = 剩余 1 的个数</text>
    <text x="385" y="272" text-anchor="middle" fill="#d6a040" font-size="11">本例 = 3</text>
  </g>

  <text x="260" y="338" text-anchor="middle" font-size="11" fill="#888">蓝格=0 海｜绿格=可逃陆地（沉掉）｜红格=飞地（计数）</text>
</svg>
