<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：5 张选票计票，B 得 2 票胜出</text>

  <!-- Candidate table (left, compact) -->
  <text x="95" y="48" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">Candidate</text>
  <rect x="20" y="54" width="150" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="38" y="69" font-size="9" fill="#333">id</text>
  <text x="95" y="69" font-size="9" fill="#333">name</text>
  <line x1="60" y1="54" x2="60" y2="76" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="20" y="76" width="150" height="16" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="38" y="88" font-size="8.5" fill="#333">1</text>
  <text x="95" y="88" font-size="8.5" fill="#888">A</text>
  <line x1="60" y1="76" x2="60" y2="92" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="20" y="92" width="150" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="38" y="104" font-size="8.5" fill="#333">2</text>
  <text x="95" y="104" font-size="8.5" fill="#b85450" font-weight="bold">B</text>
  <line x1="60" y1="92" x2="60" y2="108" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="20" y="108" width="150" height="16" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="38" y="120" font-size="8.5" fill="#333">3</text>
  <text x="95" y="120" font-size="8.5" fill="#333">C</text>
  <line x1="60" y1="108" x2="60" y2="124" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="20" y="124" width="150" height="16" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="38" y="136" font-size="8.5" fill="#333">4</text>
  <text x="95" y="136" font-size="8.5" fill="#333">D</text>
  <line x1="60" y1="124" x2="60" y2="140" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="20" y="140" width="150" height="16" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="38" y="152" font-size="8.5" fill="#333">5</text>
  <text x="95" y="152" font-size="8.5" fill="#333">E</text>
  <line x1="60" y1="140" x2="60" y2="156" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Vote table (right, compact) -->
  <text x="385" y="48" text-anchor="middle" font-size="10" fill="#555" font-weight="bold">Vote</text>
  <rect x="310" y="54" width="150" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="332" y="69" font-size="9" fill="#333">id</text>
  <text x="410" y="69" font-size="9" fill="#b85450">CandidateId</text>
  <line x1="355" y1="54" x2="355" y2="76" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="310" y="76" width="150" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="332" y="88" font-size="8.5" fill="#333">1</text>
  <text x="430" y="88" font-size="8.5" fill="#b85450" font-weight="bold">2</text>
  <line x1="355" y1="76" x2="355" y2="92" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="310" y="92" width="150" height="16" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="332" y="104" font-size="8.5" fill="#333">2</text>
  <text x="430" y="104" font-size="8.5" fill="#333">4</text>
  <line x1="355" y1="92" x2="355" y2="108" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="310" y="108" width="150" height="16" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="332" y="120" font-size="8.5" fill="#333">3</text>
  <text x="430" y="120" font-size="8.5" fill="#333">3</text>
  <line x1="355" y1="108" x2="355" y2="124" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="310" y="124" width="150" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="332" y="136" font-size="8.5" fill="#333">4</text>
  <text x="430" y="136" font-size="8.5" fill="#b85450" font-weight="bold">2</text>
  <line x1="355" y1="124" x2="355" y2="140" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="310" y="140" width="150" height="16" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="332" y="152" font-size="8.5" fill="#333">5</text>
  <text x="430" y="152" font-size="8.5" fill="#333">5</text>
  <line x1="355" y1="140" x2="355" y2="156" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- JOIN arrow -->
  <path d="M170 100 L310 100" stroke="#446688" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="240" y="94" text-anchor="middle" font-size="8.5" fill="#446688">JOIN</text>

  <!-- Down arrow to tally -->
  <path d="M280 166 L280 188" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="335" y="182" font-size="9" fill="#4a7a3a" font-weight="bold">GROUP BY + COUNT</text>

  <!-- Tally table -->
  <text x="280" y="202" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">计票结果（按候选人分桶）</text>
  <rect x="120" y="208" width="320" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="150" y="224" font-size="9" fill="#333">候选人</text>
  <text x="250" y="224" font-size="9" fill="#333">得票（vote id）</text>
  <text x="400" y="224" font-size="9" fill="#333">COUNT</text>
  <line x1="200" y1="208" x2="200" y2="232" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="370" y1="208" x2="370" y2="232" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="120" y="232" width="320" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="160" y="248" font-size="9.5" fill="#b85450" font-weight="bold">B</text>
  <text x="250" y="248" font-size="9" fill="#333">vote 1, vote 4</text>
  <text x="400" y="248" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <line x1="200" y1="232" x2="200" y2="256" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="370" y1="232" x2="370" y2="256" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="120" y="256" width="320" height="22" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="160" y="271" font-size="9" fill="#333">C</text>
  <text x="250" y="271" font-size="9" fill="#333">vote 3</text>
  <text x="402" y="271" font-size="9" fill="#333">1</text>
  <line x1="200" y1="256" x2="200" y2="278" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="370" y1="256" x2="370" y2="278" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="120" y="278" width="320" height="22" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="160" y="293" font-size="9" fill="#333">D</text>
  <text x="250" y="293" font-size="9" fill="#333">vote 2</text>
  <text x="402" y="293" font-size="9" fill="#333">1</text>
  <line x1="200" y1="278" x2="200" y2="300" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="370" y1="278" x2="370" y2="300" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="120" y="300" width="320" height="22" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="160" y="315" font-size="9" fill="#333">E</text>
  <text x="250" y="315" font-size="9" fill="#333">vote 5</text>
  <text x="402" y="315" font-size="9" fill="#333">1</text>
  <line x1="200" y1="300" x2="200" y2="322" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="370" y1="300" x2="370" y2="322" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="280" y="338" text-anchor="middle" font-size="8.5" fill="#888">A（id=1）无任何选票 → INNER JOIN 后无行 → 不参与计票</text>

  <!-- Down arrow: ORDER BY + LIMIT 1 -->
  <path d="M280 346 L280 368" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="370" y="360" font-size="9" fill="#d6a040" font-weight="bold">ORDER BY COUNT DESC</text>
  <text x="370" y="370" font-size="9" fill="#d6a040">LIMIT 1 → B(2)</text>

  <!-- Result -->
  <rect x="180" y="376" width="200" height="60" fill="#fff8e1" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="396" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">最终结果</text>
  <rect x="240" y="402" width="80" height="24" fill="#fff" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="419" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">B</text>
  <text x="280" y="442" text-anchor="middle" font-size="9" fill="#888">B 得 2 票，严格多于其余（各 1 票）→ 当选</text>
</svg>
