<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="660" height="470" fill="#fafafa"/>

  <!-- Title -->
  <text x="330" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：三位玩家的连胜岛与最长连胜</text>

  <!-- ============ Player 1 (left) ============ -->
  <text x="110" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">player_id = 1</text>
  <rect x="20" y="62" width="184" height="130" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <!-- header -->
  <text x="28" y="78" font-size="8" fill="#446688" font-weight="bold">day</text>
  <text x="84" y="78" font-size="8" fill="#446688" font-weight="bold">res</text>
  <text x="124" y="78" font-size="8" fill="#446688" font-weight="bold" text-anchor="middle">rn</text>
  <text x="154" y="78" font-size="8" fill="#446688" font-weight="bold" text-anchor="middle">rrn</text>
  <text x="186" y="78" font-size="8" fill="#446688" font-weight="bold" text-anchor="middle">grp</text>
  <line x1="20" y1="84" x2="204" y2="84" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- r1 Win -->
  <rect x="22" y="88" width="180" height="18" fill="#e6f4ea" rx="2" filter="url(#rough2)" opacity="0.75"/>
  <text x="28" y="100" font-size="8" fill="#4a7a3a">01-17</text><text x="84" y="100" font-size="8" fill="#4a7a3a">Win</text>
  <text x="124" y="100" font-size="8" fill="#4a7a3a" text-anchor="middle">1</text><text x="154" y="100" font-size="8" fill="#4a7a3a" text-anchor="middle">1</text>
  <text x="186" y="100" font-size="9" fill="#4a7a3a" font-weight="bold" text-anchor="middle">0</text>
  <!-- r2 Win -->
  <rect x="22" y="106" width="180" height="18" fill="#e6f4ea" rx="2" filter="url(#rough2)" opacity="0.75"/>
  <text x="28" y="118" font-size="8" fill="#4a7a3a">01-18</text><text x="84" y="118" font-size="8" fill="#4a7a3a">Win</text>
  <text x="124" y="118" font-size="8" fill="#4a7a3a" text-anchor="middle">2</text><text x="154" y="118" font-size="8" fill="#4a7a3a" text-anchor="middle">2</text>
  <text x="186" y="118" font-size="9" fill="#4a7a3a" font-weight="bold" text-anchor="middle">0</text>
  <!-- r3 Win -->
  <rect x="22" y="124" width="180" height="18" fill="#e6f4ea" rx="2" filter="url(#rough2)" opacity="0.75"/>
  <text x="28" y="136" font-size="8" fill="#4a7a3a">01-25</text><text x="84" y="136" font-size="8" fill="#4a7a3a">Win</text>
  <text x="124" y="136" font-size="8" fill="#4a7a3a" text-anchor="middle">3</text><text x="154" y="136" font-size="8" fill="#4a7a3a" text-anchor="middle">3</text>
  <text x="186" y="136" font-size="9" fill="#4a7a3a" font-weight="bold" text-anchor="middle">0</text>
  <!-- r4 Draw -->
  <rect x="22" y="142" width="180" height="18" fill="#fce4ec" rx="2" filter="url(#rough2)" opacity="0.55"/>
  <text x="28" y="154" font-size="8" fill="#b85450">01-31</text><text x="84" y="154" font-size="8" fill="#b85450">Draw</text>
  <text x="124" y="154" font-size="8" fill="#b85450" text-anchor="middle">4</text><text x="154" y="154" font-size="8" fill="#b85450" text-anchor="middle">1</text>
  <text x="186" y="154" font-size="9" fill="#b85450" font-weight="bold" text-anchor="middle">3</text>
  <!-- r5 Win -->
  <rect x="22" y="160" width="180" height="18" fill="#fff8e1" rx="2" filter="url(#rough2)" opacity="0.85"/>
  <text x="28" y="172" font-size="8" fill="#d6a040">02-08</text><text x="84" y="172" font-size="8" fill="#d6a040">Win</text>
  <text x="124" y="172" font-size="8" fill="#d6a040" text-anchor="middle">5</text><text x="154" y="172" font-size="8" fill="#d6a040" text-anchor="middle">4</text>
  <text x="186" y="172" font-size="9" fill="#d6a040" font-weight="bold" text-anchor="middle">1</text>

  <!-- player1 streak summary -->
  <text x="110" y="208" text-anchor="middle" font-size="9" fill="#4a7a3a">岛#0(g0)=3 · 岛#1(g1)=1</text>
  <rect x="48" y="214" width="124" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="110" y="232" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">MAX = 3</text>

  <!-- ============ Player 2 (middle) ============ -->
  <text x="320" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">player_id = 2</text>
  <rect x="230" y="62" width="184" height="76" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="238" y="78" font-size="8" fill="#446688" font-weight="bold">day</text>
  <text x="294" y="78" font-size="8" fill="#446688" font-weight="bold">res</text>
  <text x="334" y="78" font-size="8" fill="#446688" font-weight="bold" text-anchor="middle">rn</text>
  <text x="364" y="78" font-size="8" fill="#446688" font-weight="bold" text-anchor="middle">rrn</text>
  <text x="396" y="78" font-size="8" fill="#446688" font-weight="bold" text-anchor="middle">grp</text>
  <line x1="230" y1="84" x2="414" y2="84" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <!-- r1 Lose -->
  <rect x="232" y="88" width="180" height="18" fill="#fce4ec" rx="2" filter="url(#rough2)" opacity="0.5"/>
  <text x="238" y="100" font-size="8" fill="#b85450">02-06</text><text x="294" y="100" font-size="8" fill="#b85450">Lose</text>
  <text x="334" y="100" font-size="8" fill="#b85450" text-anchor="middle">1</text><text x="364" y="100" font-size="8" fill="#b85450" text-anchor="middle">1</text>
  <text x="396" y="100" font-size="9" fill="#b85450" font-weight="bold" text-anchor="middle">0</text>
  <!-- r2 Lose -->
  <rect x="232" y="106" width="180" height="18" fill="#fce4ec" rx="2" filter="url(#rough2)" opacity="0.5"/>
  <text x="238" y="118" font-size="8" fill="#b85450">02-08</text><text x="294" y="118" font-size="8" fill="#b85450">Lose</text>
  <text x="334" y="118" font-size="8" fill="#b85450" text-anchor="middle">2</text><text x="364" y="118" font-size="8" fill="#b85450" text-anchor="middle">2</text>
  <text x="396" y="118" font-size="9" fill="#b85450" font-weight="bold" text-anchor="middle">0</text>

  <text x="320" y="156" text-anchor="middle" font-size="9" fill="#b85450">无 Win 行 → Streaks 为空</text>
  <rect x="258" y="162" width="124" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="320" y="180" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">MAX = 0 (补)</text>

  <!-- ============ Player 3 (right) ============ -->
  <text x="530" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">player_id = 3</text>
  <rect x="440" y="62" width="184" height="58" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="448" y="78" font-size="8" fill="#446688" font-weight="bold">day</text>
  <text x="504" y="78" font-size="8" fill="#446688" font-weight="bold">res</text>
  <text x="544" y="78" font-size="8" fill="#446688" font-weight="bold" text-anchor="middle">rn</text>
  <text x="574" y="78" font-size="8" fill="#446688" font-weight="bold" text-anchor="middle">rrn</text>
  <text x="606" y="78" font-size="8" fill="#446688" font-weight="bold" text-anchor="middle">grp</text>
  <line x1="440" y1="84" x2="624" y2="84" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <!-- r1 Win -->
  <rect x="442" y="88" width="180" height="18" fill="#e6f4ea" rx="2" filter="url(#rough2)" opacity="0.75"/>
  <text x="448" y="100" font-size="8" fill="#4a7a3a">03-30</text><text x="504" y="100" font-size="8" fill="#4a7a3a">Win</text>
  <text x="544" y="100" font-size="8" fill="#4a7a3a" text-anchor="middle">1</text><text x="574" y="100" font-size="8" fill="#4a7a3a" text-anchor="middle">1</text>
  <text x="606" y="100" font-size="9" fill="#4a7a3a" font-weight="bold" text-anchor="middle">0</text>

  <text x="530" y="138" text-anchor="middle" font-size="9" fill="#4a7a3a">岛#0(g0)=1</text>
  <rect x="468" y="144" width="124" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="530" y="162" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">MAX = 1</text>

  <!-- arrows down to final result -->
  <path d="M 110 240 C 110 280, 250 286, 250 312" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 320 188 C 320 240, 280 270, 268 312" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 530 170 C 530 240, 300 280, 286 312" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Final result table ===== -->
  <text x="330" y="300" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">最终输出（ORDER BY player_id）</text>
  <rect x="190" y="312" width="280" height="96" fill="#fff" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="240" y="332" font-size="10" fill="#4a7a3a" font-weight="bold">player_id</text>
  <text x="380" y="332" font-size="10" fill="#4a7a3a" font-weight="bold">longest_streak</text>
  <line x1="190" y1="340" x2="470" y2="340" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="240" y="358" font-size="11" fill="#446688">1</text><text x="380" y="358" font-size="11" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="240" y="378" font-size="11" fill="#446688">2</text><text x="380" y="378" font-size="11" fill="#b85450" font-weight="bold">0</text>
  <text x="240" y="398" font-size="11" fill="#446688">3</text><text x="380" y="398" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>

  <!-- bottom note -->
  <rect x="40" y="420" width="580" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="330" y="438" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">player 2 无胜场 → LEFT JOIN 缺失 → COALESCE 填 0</text>
  <text x="330" y="452" text-anchor="middle" font-size="9" fill="#666">「按 match_day 顺序的连续胜场记录」计数，非胜场（Draw/Lose）打断连胜</text>
</svg>
