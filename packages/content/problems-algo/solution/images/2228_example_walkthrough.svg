<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="310" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：6 行 → 同用户配对 → 日期差过滤 → 输出 {2, 7}</text>

  <!-- ===== Table frame ===== -->
  <rect x="20" y="44" width="470" height="300" fill="#fff" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>

  <!-- header -->
  <rect x="20" y="44" width="470" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="60" y="60" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">配对</text>
  <text x="120" y="60" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">user</text>
  <text x="195" y="60" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">日期1</text>
  <text x="275" y="60" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">日期2</text>
  <text x="345" y="60" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">|Δ|天</text>
  <text x="395" y="60" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">≤7?</text>
  <text x="450" y="60" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">去留</text>

  <line x1="30" y1="68" x2="480" y2="68" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- user 2 group label -->
  <rect x="20" y="72" width="470" height="18" fill="#f4f8ff" stroke="none" filter="url(#rough2)"/>
  <text x="30" y="85" font-size="8" fill="#446688" font-weight="bold">用户 2（3 行 → 3 对）</text>

  <!-- pair (4,6) keep -->
  <rect x="24" y="92" width="462" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="60" y="107" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">(4,6)</text>
  <text x="120" y="107" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="195" y="107" text-anchor="middle" font-size="8" fill="#4a7a3a">03-13</text>
  <text x="275" y="107" text-anchor="middle" font-size="8" fill="#4a7a3a">03-20</text>
  <text x="345" y="107" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">7</text>
  <text x="395" y="107" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="450" y="107" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">保留</text>

  <!-- pair (4,2) discard -->
  <rect x="24" y="116" width="462" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="131" text-anchor="middle" font-size="9" fill="#555">(4,2)</text>
  <text x="120" y="131" text-anchor="middle" font-size="9" fill="#555">2</text>
  <text x="195" y="131" text-anchor="middle" font-size="8" fill="#999">03-13</text>
  <text x="275" y="131" text-anchor="middle" font-size="8" fill="#999">06-08</text>
  <text x="345" y="131" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">87</text>
  <text x="395" y="131" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✗</text>
  <text x="450" y="131" text-anchor="middle" font-size="8" fill="#b85450">丢弃</text>

  <!-- pair (6,2) discard -->
  <rect x="24" y="140" width="462" height="22" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="155" text-anchor="middle" font-size="9" fill="#555">(6,2)</text>
  <text x="120" y="155" text-anchor="middle" font-size="9" fill="#555">2</text>
  <text x="195" y="155" text-anchor="middle" font-size="8" fill="#999">03-20</text>
  <text x="275" y="155" text-anchor="middle" font-size="8" fill="#999">06-08</text>
  <text x="345" y="155" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">80</text>
  <text x="395" y="155" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">✗</text>
  <text x="450" y="155" text-anchor="middle" font-size="8" fill="#b85450">丢弃</text>

  <!-- user 5 group label -->
  <rect x="20" y="166" width="470" height="22" fill="#fafafa" stroke="none" filter="url(#rough2)"/>
  <text x="30" y="181" font-size="8" fill="#999" font-weight="bold">用户 5（1 行）</text>
  <text x="250" y="181" text-anchor="middle" font-size="8" fill="#999">仅 1 次购买 → 无对 → 不合格</text>

  <!-- user 7 group label -->
  <rect x="20" y="190" width="470" height="18" fill="#eef7ee" stroke="none" filter="url(#rough2)"/>
  <text x="30" y="203" font-size="8" fill="#4a7a3a" font-weight="bold">用户 7（2 行 → 1 对）</text>

  <!-- pair (3,5) keep -->
  <rect x="24" y="210" width="462" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="3" filter="url(#rough2)"/>
  <text x="60" y="225" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">(3,5)</text>
  <text x="120" y="225" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">7</text>
  <text x="195" y="225" text-anchor="middle" font-size="8" fill="#4a7a3a">06-19</text>
  <text x="275" y="225" text-anchor="middle" font-size="8" fill="#4a7a3a">06-19</text>
  <text x="345" y="225" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="395" y="225" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="450" y="225" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">保留</text>

  <!-- separator -->
  <line x1="30" y1="240" x2="480" y2="240" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- summary rows -->
  <text x="30" y="258" font-size="8" fill="#888" font-weight="bold">阶段③ DISTINCT user_id</text>
  <rect x="30" y="264" width="460" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="60" y="279" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">保留对</text>
  <text x="200" y="279" text-anchor="middle" font-size="9" fill="#d6a040">(4,6)→user2,  (3,5)→user7</text>
  <text x="450" y="279" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">{2, 7}</text>

  <text x="30" y="300" font-size="8" fill="#888" font-weight="bold">阶段④ ORDER BY user_id</text>
  <rect x="30" y="306" width="460" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="324" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">输出 → 2, 7</text>

  <!-- ===== Right side: key callouts ===== -->
  <rect x="500" y="44" width="100" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="550" y="62" text-anchor="middle" font-size="8" fill="#d6a040" font-weight="bold">边界判据</text>
  <text x="550" y="78" text-anchor="middle" font-size="8" fill="#666">用户2 相差</text>
  <text x="550" y="92" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">恰 7 天</text>
  <text x="550" y="106" text-anchor="middle" font-size="8" fill="#4a7a3a">合格 → ≤7</text>

  <rect x="500" y="126" width="100" height="74" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="550" y="144" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">同日两次</text>
  <text x="550" y="160" text-anchor="middle" font-size="8" fill="#666">用户7 同日</text>
  <text x="550" y="174" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">|Δ|=0</text>
  <text x="550" y="188" text-anchor="middle" font-size="8" fill="#4a7a3a">pid 不同可配对</text>

  <rect x="500" y="208" width="100" height="74" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="550" y="226" text-anchor="middle" font-size="8" fill="#446688" font-weight="bold">配对锚点</text>
  <text x="550" y="242" text-anchor="middle" font-size="8" fill="#666">用 pid 不等</text>
  <text x="550" y="256" text-anchor="middle" font-size="8" fill="#666">非 date 不等</text>
  <text x="550" y="270" text-anchor="middle" font-size="7" fill="#888">避免漏同日对</text>

  <!-- ===== Bottom note ===== -->
  <rect x="20" y="356" width="580" height="70" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="310" y="376" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">关键观察</text>
  <text x="310" y="394" text-anchor="middle" font-size="9" fill="#666">• 配对用主键 pid1 &lt; pid2（半空间，含同日对）；日期差用 ABS(DATEDIFF) ≤ 7（含等号）</text>
  <text x="310" y="410" text-anchor="middle" font-size="9" fill="#666">• 用户2 借 (4,6) 相差 7 天合格；用户7 借 (3,5) 同日合格；用户5 无对出局</text>
</svg>
