<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L6,3.5 L0,7 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L6,3.5 L0,7 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>
  <text x="270" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例对比：相交 vs 不相交</text>

  <!-- ======== Left: Example 1 [2,1,1,2] → true ======== -->
  <rect x="8" y="34" width="260" height="358" fill="none" stroke="#eee" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="138" y="50" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">d = [2, 1, 1, 2]  →  true</text>

  <!-- spiral: origin (135,145), scale 22 -->
  <!-- N: (135,145)->(135,101) -->
  <line x1="135" y1="145" x2="135" y2="104" stroke="#446688" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- W: (135,101)->(113,101) -->
  <line x1="133" y1="103" x2="116" y2="103" stroke="#446688" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- S: (113,101)->(113,123) -->
  <line x1="115" y1="105" x2="115" y2="121" stroke="#446688" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- E: (113,123)->(157,123) crosses N at (135,123) -->
  <line x1="117" y1="125" x2="154" y2="125" stroke="#b85450" stroke-width="2.5" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- vertex numbers -->
  <text x="140" y="142" font-size="8" fill="#888">0</text>
  <text x="140" y="100" font-size="8" fill="#888">1</text>
  <text x="102" y="100" font-size="8" fill="#888">2</text>
  <text x="102" y="128" font-size="8" fill="#888">3</text>
  <text x="160" y="128" font-size="8" fill="#888">4</text>

  <!-- crossing point -->
  <circle cx="135" cy="125" r="5" fill="#b85450" filter="url(#rough2)"/>
  <text x="143" y="120" font-size="9" fill="#b85450" font-weight="bold">✗ 相交</text>

  <!-- distance labels -->
  <text x="142" y="128" font-size="8" fill="#446688">d0=2</text>
  <text x="110" y="96" font-size="8" fill="#446688">d1=1</text>
  <text x="92" y="118" font-size="8" fill="#446688">d2=1</text>
  <text x="120" y="138" font-size="8" fill="#b85450">d3=2</text>

  <!-- step table -->
  <rect x="20" y="200" width="230" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="34" y="215" font-size="9" fill="#446688" font-weight="bold">i</text>
  <text x="70" y="215" font-size="9" fill="#446688" font-weight="bold">dir</text>
  <text x="110" y="215" font-size="9" fill="#446688" font-weight="bold">d[i]</text>
  <text x="150" y="215" font-size="9" fill="#446688" font-weight="bold">检查</text>
  <text x="225" y="215" font-size="9" fill="#446688" font-weight="bold">结果</text>

  <rect x="20" y="223" width="230" height="20" fill="#fff" stroke="#ddd" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="34" y="237" font-size="9" fill="#666">0</text><text x="70" y="237" font-size="9" fill="#666">N</text><text x="110" y="237" font-size="9" fill="#666">2</text><text x="150" y="237" font-size="9" fill="#888">—</text><text x="225" y="237" font-size="9" fill="#888">—</text>

  <rect x="20" y="244" width="230" height="20" fill="#fff" stroke="#ddd" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="34" y="258" font-size="9" fill="#666">1</text><text x="70" y="258" font-size="9" fill="#666">W</text><text x="110" y="258" font-size="9" fill="#666">1</text><text x="150" y="258" font-size="9" fill="#888">—</text><text x="225" y="258" font-size="9" fill="#888">—</text>

  <rect x="20" y="265" width="230" height="20" fill="#fff" stroke="#ddd" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="34" y="279" font-size="9" fill="#666">2</text><text x="70" y="279" font-size="9" fill="#666">S</text><text x="110" y="279" font-size="9" fill="#666">1</text><text x="150" y="279" font-size="9" fill="#888">—</text><text x="225" y="279" font-size="9" fill="#888">—</text>

  <rect x="20" y="286" width="230" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="34" y="301" font-size="9" fill="#b85450" font-weight="bold">3</text>
  <text x="70" y="301" font-size="9" fill="#b85450" font-weight="bold">E</text>
  <text x="110" y="301" font-size="9" fill="#b85450" font-weight="bold">2</text>
  <text x="150" y="298" font-size="8" fill="#b85450">2≥1 ✓</text>
  <text x="150" y="308" font-size="8" fill="#b85450">1≤2 ✓</text>
  <text x="225" y="301" font-size="9" fill="#b85450" font-weight="bold">✅ true</text>

  <!-- annotation -->
  <rect x="20" y="320" width="230" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="135" y="338" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">Case 1 触发</text>
  <text x="135" y="354" text-anchor="middle" font-size="9" fill="#666">line 3 (E) 在 y=1 处</text>
  <text x="135" y="368" text-anchor="middle" font-size="9" fill="#666">穿越 line 0 (N) 的 x=0 轴</text>

  <!-- ======== Right: Example 2 [1,2,3,4] → false ======== -->
  <rect x="278" y="34" width="260" height="358" fill="none" stroke="#eee" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="408" y="50" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">d = [1, 2, 3, 4]  →  false</text>

  <!-- spiral: origin (400,145), scale 15 -->
  <!-- N: (400,145)->(400,130) -->
  <line x1="400" y1="145" x2="400" y2="133" stroke="#446688" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- W: (400,130)->(370,130) -->
  <line x1="398" y1="132" x2="373" y2="132" stroke="#446688" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- S: (370,130)->(370,175) -->
  <line x1="372" y1="134" x2="372" y2="173" stroke="#446688" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- E: (370,175)->(430,175) no cross (y=175 below N line y=130..145) -->
  <line x1="374" y1="177" x2="427" y2="177" stroke="#4a7a3a" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- vertex numbers -->
  <text x="405" y="142" font-size="8" fill="#888">0</text>
  <text x="405" y="128" font-size="8" fill="#888">1</text>
  <text x="360" y="128" font-size="8" fill="#888">2</text>
  <text x="360" y="180" font-size="8" fill="#888">3</text>
  <text x="432" y="180" font-size="8" fill="#888">4</text>

  <!-- distance labels -->
  <text x="407" y="142" font-size="7.5" fill="#446688">d0=1</text>
  <text x="372" y="125" font-size="7.5" fill="#446688">d1=2</text>
  <text x="350" y="155" font-size="7.5" fill="#446688">d2=3</text>
  <text x="380" y="190" font-size="7.5" fill="#446688">d3=4</text>

  <!-- "no cross" annotation on spiral -->
  <text x="440" y="160" font-size="9" fill="#4a7a3a" font-weight="bold">✓ 无交点</text>

  <!-- step table -->
  <rect x="290" y="200" width="230" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="304" y="215" font-size="9" fill="#446688" font-weight="bold">i</text>
  <text x="340" y="215" font-size="9" fill="#446688" font-weight="bold">dir</text>
  <text x="380" y="215" font-size="9" fill="#446688" font-weight="bold">d[i]</text>
  <text x="420" y="215" font-size="9" fill="#446688" font-weight="bold">检查</text>
  <text x="495" y="215" font-size="9" fill="#446688" font-weight="bold">结果</text>

  <rect x="290" y="223" width="230" height="20" fill="#fff" stroke="#ddd" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="304" y="237" font-size="9" fill="#666">0</text><text x="340" y="237" font-size="9" fill="#666">N</text><text x="380" y="237" font-size="9" fill="#666">1</text><text x="420" y="237" font-size="9" fill="#888">—</text><text x="495" y="237" font-size="9" fill="#888">—</text>

  <rect x="290" y="244" width="230" height="20" fill="#fff" stroke="#ddd" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="304" y="258" font-size="9" fill="#666">1</text><text x="340" y="258" font-size="9" fill="#666">W</text><text x="380" y="258" font-size="9" fill="#666">2</text><text x="420" y="258" font-size="9" fill="#888">—</text><text x="495" y="258" font-size="9" fill="#888">—</text>

  <rect x="290" y="265" width="230" height="20" fill="#fff" stroke="#ddd" stroke-width="0.8" rx="2" filter="url(#rough2)"/>
  <text x="304" y="279" font-size="9" fill="#666">2</text><text x="340" y="279" font-size="9" fill="#666">S</text><text x="380" y="279" font-size="9" fill="#666">3</text><text x="420" y="279" font-size="9" fill="#888">—</text><text x="495" y="279" font-size="9" fill="#888">—</text>

  <rect x="290" y="286" width="230" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="304" y="301" font-size="9" fill="#4a7a3a" font-weight="bold">3</text>
  <text x="340" y="301" font-size="9" fill="#4a7a3a" font-weight="bold">E</text>
  <text x="380" y="301" font-size="9" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="420" y="298" font-size="8" fill="#4a7a3a">4≥2 ✓</text>
  <text x="420" y="308" font-size="8" fill="#b85450">3≤1 ✗</text>
  <text x="495" y="301" font-size="9" fill="#4a7a3a" font-weight="bold">❌ false</text>

  <!-- annotation -->
  <rect x="290" y="320" width="230" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="405" y="338" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">Case 1 不触发</text>
  <text x="405" y="354" text-anchor="middle" font-size="9" fill="#666">d[2]=3 > d[0]=1，S 线超出 N 线</text>
  <text x="405" y="368" text-anchor="middle" font-size="9" fill="#666">E 线在 y=−2，不触及 N 线 (y∈[0,1])</text>
</svg>
