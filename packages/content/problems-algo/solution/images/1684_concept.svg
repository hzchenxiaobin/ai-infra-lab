<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="360" fill="#fafafa"/>

  <text x="270" y="32" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    allowed 是白名单：word 的所有字符都在白名单内 → 一致
  </text>

  <!-- allowed whitelist box -->
  <text x="80" y="78" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">allowed（白名单）</text>
  <rect x="40" y="92" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="60" y="118" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">a</text>
  <rect x="84" y="92" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="104" y="118" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">b</text>
  <rect x="128" y="92" width="40" height="40" fill="#fafafa" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="3 3" rx="6" filter="url(#rough2)"/>
  <text x="148" y="118" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">…</text>

  <!-- bit representation -->
  <rect x="40" y="148" width="160" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="120" y="170" text-anchor="middle" font-size="12" fill="#5a4a1a" filter="url(#rough2)">mask = 0b…00011</text>

  <!-- filter arrow -->
  <path d="M210,112 L266,112" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="238" y="104" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">子集判定</text>
  <text x="238" y="124" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">w_mask ⊆ mask?</text>

  <!-- words column -->
  <text x="380" y="78" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">words → 判定结果</text>

  <!-- word rows: ad ✗, bd ✗, aaab ✓, baa ✓, badab ✗ -->
  <!-- ad -->
  <rect x="290" y="92" width="60" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="111" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">"ad"</text>
  <text x="360" y="111" font-size="11" fill="#888" filter="url(#rough2)">含 d ∉</text>
  <text x="438" y="111" font-size="15" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- bd -->
  <rect x="290" y="126" width="60" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="145" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">"bd"</text>
  <text x="360" y="145" font-size="11" fill="#888" filter="url(#rough2)">含 d ∉</text>
  <text x="438" y="145" font-size="15" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- aaab -->
  <rect x="290" y="160" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="179" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">"aaab"</text>
  <text x="360" y="179" font-size="11" fill="#4a7a3a" filter="url(#rough2)">全在 {a,b}</text>
  <text x="438" y="179" font-size="15" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <!-- baa -->
  <rect x="290" y="194" width="60" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="213" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">"baa"</text>
  <text x="360" y="213" font-size="11" fill="#4a7a3a" filter="url(#rough2)">全在 {a,b}</text>
  <text x="438" y="213" font-size="15" fill="#4a7a3a" filter="url(#rough2)">✓</text>

  <!-- badab -->
  <rect x="290" y="228" width="60" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="247" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">"badab"</text>
  <text x="360" y="247" font-size="11" fill="#888" filter="url(#rough2)">含 d ∉</text>
  <text x="438" y="247" font-size="15" fill="#b85450" filter="url(#rough2)">✗</text>

  <!-- count callout -->
  <path d="M470,180 L470,262" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4 3" filter="url(#rough2)"/>
  <path d="M335,262 L470,262" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <rect x="370" y="276" width="180" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="460" y="301" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">ans = 2 ✓</text>

  <!-- bottom insight -->
  <rect x="40" y="276" width="300" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="190" y="298" text-anchor="middle" font-size="12" fill="#5a4a1a" filter="url(#rough2)">
    allowed 预处理为 26 位 mask；
  </text>
  <text x="190" y="318" text-anchor="middle" font-size="12" fill="#5a4a1a" filter="url(#rough2)">
    每个 word 也压成 mask，一次位与判子集
  </text>
</svg>
