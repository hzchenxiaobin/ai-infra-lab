<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：步长 1,1,2,2,3,3,… 向外扩展方螺旋</text>
  <text x="260" y="46" text-anchor="middle" font-size="11" fill="#888">方向循环：东 → 南 → 西 → 北，每走两个方向步长 +1，螺旋永不回头</text>

  <!-- ===== 5x5 grid cells (rows 1-5, cols 1-5), cell=40, origin (130,90) ===== -->
  <!-- Ring 0: start (3,3) — red -->
  <rect x="250" y="210" width="40" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="235" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">起</text>

  <!-- Ring 1 (step 1): (3,4),(4,4) — orange -->
  <rect x="290" y="210" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="235" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="290" y="250" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="275" text-anchor="middle" font-size="12" fill="#333">2</text>

  <!-- Ring 2 (step 2): (4,3),(4,2),(3,2),(2,2) — green -->
  <rect x="250" y="250" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="275" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="210" y="250" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="275" text-anchor="middle" font-size="12" fill="#333">4</text>
  <rect x="210" y="210" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="235" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="210" y="170" width="40" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="195" text-anchor="middle" font-size="12" fill="#333">6</text>

  <!-- Ring 3 (step 3): (2,3),(2,4),(2,5),(3,5),(4,5),(5,5) — blue -->
  <rect x="250" y="170" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="195" text-anchor="middle" font-size="12" fill="#333">7</text>
  <rect x="290" y="170" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="195" text-anchor="middle" font-size="12" fill="#333">8</text>
  <rect x="330" y="170" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="350" y="195" text-anchor="middle" font-size="12" fill="#333">9</text>
  <rect x="330" y="210" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="350" y="235" text-anchor="middle" font-size="12" fill="#333">10</text>
  <rect x="330" y="250" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="350" y="275" text-anchor="middle" font-size="12" fill="#333">11</text>
  <rect x="330" y="290" width="40" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="350" y="315" text-anchor="middle" font-size="12" fill="#333">12</text>

  <!-- Ring 4 (step 4): (5,4),(5,3),(5,2),(5,1),(4,1),(3,1),(2,1),(1,1) — orange (darker stroke) -->
  <rect x="290" y="290" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="315" text-anchor="middle" font-size="12" fill="#333">13</text>
  <rect x="250" y="290" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="315" text-anchor="middle" font-size="12" fill="#333">14</text>
  <rect x="210" y="290" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="230" y="315" text-anchor="middle" font-size="12" fill="#333">15</text>
  <rect x="170" y="290" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="315" text-anchor="middle" font-size="12" fill="#333">16</text>
  <rect x="170" y="250" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="275" text-anchor="middle" font-size="12" fill="#333">17</text>
  <rect x="170" y="210" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="235" text-anchor="middle" font-size="12" fill="#333">18</text>
  <rect x="170" y="170" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="195" text-anchor="middle" font-size="12" fill="#333">19</text>
  <rect x="170" y="130" width="40" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="155" text-anchor="middle" font-size="12" fill="#333">20</text>

  <!-- ===== Direction arrows with step labels ===== -->
  <!-- ① East 1: above row 3 -->
  <path d="M 258 204 L 322 204" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="200" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">①东1</text>

  <!-- ② South 1: right of col 4 -->
  <path d="M 336 248 L 336 292" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="346" y="274" font-size="10" fill="#b85450" font-weight="bold">②南1</text>

  <!-- ③ West 2: below row 4 -->
  <path d="M 322 296 L 238 296" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="292" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">③西2</text>

  <!-- ④ North 2: left of col 2 -->
  <path d="M 204 292 L 204 208" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="196" y="254" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold">④北2</text>

  <!-- ⑤ East 3: above row 2 -->
  <path d="M 238 164 L 362 164" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="160" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">⑤东3</text>

  <!-- ⑥ South 3: right of col 5 -->
  <path d="M 376 208 L 376 332" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="386" y="274" font-size="10" fill="#b85450" font-weight="bold">⑥南3</text>

  <!-- ⑦ West 4: below row 5 -->
  <path d="M 362 336 L 198 336" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="280" y="352" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">⑦西4</text>

  <!-- ⑧ North 4: left of col 1 -->
  <path d="M 164 332 L 164 148" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="156" y="244" text-anchor="end" font-size="10" fill="#b85450" font-weight="bold">⑧北4</text>

  <!-- ===== Legend ===== -->
  <line x1="20" y1="366" x2="500" y2="366" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>
  <rect x="30" y="370" width="14" height="11" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="50" y="380" font-size="9" fill="#555">起点</text>
  <rect x="90" y="370" width="14" height="11" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="110" y="380" font-size="9" fill="#555">第1/4圈 (步长1/4)</text>
  <rect x="230" y="370" width="14" height="11" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="250" y="380" font-size="9" fill="#555">第2圈 (步长2)</text>
  <rect x="350" y="370" width="14" height="11" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="370" y="380" font-size="9" fill="#555">第3圈 (步长3)</text>
</svg>
