<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">score(i) = prefixSum(i) − suffixMin(i)：左边求和 · 右边取最小</text>

  <!-- 切分点标记 -->
  <text x="278" y="46" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">切分点 i = 2</text>

  <!-- 数组行：[10, -1, 3, -4, -5] -->
  <g filter="url(#rough2)">
    <rect x="80" y="52" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="138" y="52" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <rect x="196" y="52" width="52" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="2.2"/>
    <rect x="260" y="52" width="52" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <rect x="318" y="52" width="52" height="30" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="106" y="71" text-anchor="middle" font-size="12" fill="#33506b">10</text>
    <text x="164" y="71" text-anchor="middle" font-size="12" fill="#33506b">−1</text>
    <text x="222" y="71" text-anchor="middle" font-size="12" fill="#33506b">3</text>
    <text x="286" y="71" text-anchor="middle" font-size="12" fill="#2f5d24">−4</text>
    <text x="344" y="71" text-anchor="middle" font-size="12" fill="#2f5d24">−5</text>
  </g>
  <text x="106" y="96" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">0</text>
  <text x="164" y="96" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">1</text>
  <text x="222" y="96" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">2</text>
  <text x="286" y="96" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">3</text>
  <text x="344" y="96" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">4</text>

  <!-- 切分虚线 -->
  <path d="M 252 44 L 252 100" stroke="#b85450" stroke-width="2" stroke-dasharray="6 4" fill="none" filter="url(#rough2)"/>

  <!-- 括线与标注 -->
  <g filter="url(#rough2)">
    <path d="M 80 104 L 80 110 L 166 110 L 166 116 M 166 110 L 252 110 L 252 104" fill="none" stroke="#446688" stroke-width="1.4"/>
    <text x="166" y="128" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">prefixSum(2) = 10−1+3 = 12</text>
    <path d="M 260 104 L 260 110 L 315 110 L 315 116 M 315 110 L 370 110 L 370 104" fill="none" stroke="#4a7a3a" stroke-width="1.4"/>
    <text x="315" y="128" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold">suffixMin(2) = −5</text>
  </g>

  <!-- 得分框 -->
  <g filter="url(#rough2)">
    <rect x="130" y="138" width="260" height="30" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="260" y="158" text-anchor="middle" font-size="12" fill="#8a6d1f" font-weight="bold">score(2) = 12 − (−5) = 17 ✓ 最大</text>
  </g>

  <!-- 两个递推说明框 -->
  <g filter="url(#rough2)">
    <rect x="26" y="182" width="228" height="78" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="140" y="201" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold">前缀和：从左往右增量</text>
    <text x="140" y="218" text-anchor="middle" font-size="10" fill="#33506b">pre(i) = pre(i−1) + nums[i]</text>
    <text x="140" y="234" text-anchor="middle" font-size="10" fill="#33506b">扫到 i 顺手更新，每步 O(1)</text>
    <text x="140" y="250" text-anchor="middle" font-size="10" fill="#33506b">不用每次重新求和</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="266" y="182" width="228" height="78" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6"/>
    <text x="380" y="201" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold">后缀最小：从右往左递推</text>
    <text x="380" y="218" text-anchor="middle" font-size="10" fill="#2f5d24">sufMin[j] = min(nums[j], sufMin[j+1])</text>
    <text x="380" y="234" text-anchor="middle" font-size="10" fill="#2f5d24">逆序预处理一趟 O(n)</text>
    <text x="380" y="250" text-anchor="middle" font-size="10" fill="#2f5d24">之后每个 i 查表 O(1)</text>
  </g>

  <!-- 底部合并说明 -->
  <g filter="url(#rough2)">
    <rect x="26" y="272" width="468" height="72" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6"/>
    <text x="260" y="292" text-anchor="middle" font-size="11" fill="#8a3a34" font-weight="bold">合并：i 从 0 扫到 n−2，ans = max(ans, pre − sufMin[i+1])</text>
    <text x="260" y="310" text-anchor="middle" font-size="10" fill="#8a3a34">两个 O(n) 一趟 ⇒ 总时间 O(n)</text>
    <text x="260" y="328" text-anchor="middle" font-size="10" fill="#8a3a34">⚠ |pre| 可达 10¹⁴ ⇒ C++ 用 long long，ans 初值取 −∞</text>
  </g>
</svg>
