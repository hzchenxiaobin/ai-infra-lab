<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="500" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：BFS 遍历所有可达字符串</text>

  <!-- Start -->
  <ellipse cx="270" cy="58" rx="44" ry="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="62" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">开始</text>

  <path d="M 270 76 L 270 92" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init box -->
  <rect x="140" y="94" width="260" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="115" text-anchor="middle" font-size="12" fill="#333">visited = {s}, queue = [s], ans = s</text>

  <path d="M 270 128 L 270 146" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: queue empty? -->
  <polygon points="270,148 390,196 270,244 150,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="192" text-anchor="middle" font-size="12" fill="#333">队列为空?</text>
  <text x="270" y="208" text-anchor="middle" font-size="10" fill="#888">(所有可达状态已遍历)</text>

  <!-- Yes branch -> return -->
  <path d="M 390 196 L 450 196 L 450 256" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="404" y="188" font-size="11" fill="#b85450" font-weight="bold">是</text>
  <rect x="388" y="258" width="124" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="450" y="279" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">返回 ans</text>

  <!-- No branch -> dequeue -->
  <path d="M 150 196 L 100 196 L 100 252" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="136" y="188" font-size="11" fill="#4a7a3a" font-weight="bold">否</text>

  <rect x="30" y="254" width="140" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="274" text-anchor="middle" font-size="11" fill="#333">cur = queue.pop()</text>

  <path d="M 100 284 L 100 306" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Update ans -->
  <rect x="30" y="308" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="328" text-anchor="middle" font-size="11" fill="#333">ans = min(ans, cur)</text>

  <path d="M 100 338 L 100 360" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Try add operation -->
  <rect x="20" y="362" width="160" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="380" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">操作①：累加</text>
  <text x="100" y="396" text-anchor="middle" font-size="10" fill="#555">奇数位 +a (mod 10) → t1</text>

  <!-- Try rotate operation -->
  <rect x="200" y="362" width="160" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="380" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">操作②：轮转</text>
  <text x="280" y="396" text-anchor="middle" font-size="10" fill="#555">右移 b 位 → t2</text>

  <!-- Decision: visited? (shared for both) -->
  <path d="M 100 406 L 100 422" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 280 406 L 280 422" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="20" y="424" width="160" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="444" text-anchor="middle" font-size="10" fill="#555">t 未在 visited? → 入队+标记</text>

  <rect x="200" y="424" width="160" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="444" text-anchor="middle" font-size="10" fill="#555">t 未在 visited? → 入队+标记</text>

  <!-- Loop back arrows -->
  <path d="M 280 454 L 280 472 L 450 472 L 450 196" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 100 454 L 100 472 L 200 472" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5 4" filter="url(#rough2)"/>
  <text x="430" y="466" font-size="9" fill="#4a7a3a">循环</text>

  <!-- Note -->
  <rect x="360" y="310" width="170" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="372" y="328" font-size="10" fill="#d6a040" font-weight="bold">注意</text>
  <text x="372" y="342" font-size="10" fill="#555">visited 集合保证每</text>
  <text x="372" y="354" font-size="10" fill="#555">个状态只处理一次</text>
  <text x="372" y="366" font-size="10" fill="#555">→ BFS 必然终止</text>
</svg>
