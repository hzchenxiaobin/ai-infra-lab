<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="17" fill="#333" filter="url(#rough2)">
    二分答案 + BFS 连通性判定
  </text>

  <!-- 1: multisource bfs -->
  <rect x="150" y="38" width="240" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="59" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">① 多源 BFS：算 dist[r][c]（每格到最近小偷）</text>
  <line x1="270" y1="70" x2="270" y2="86" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2: init binary search -->
  <rect x="170" y="88" width="200" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="108" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">② 二分 lo = 0，hi = 2(n−1)</text>
  <line x1="270" y1="118" x2="270" y2="134" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond: lo<hi? -->
  <polygon points="270,136 350,166 270,196 190,166" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="170" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">lo &lt; hi ?</text>

  <!-- no branch: return lo -->
  <text x="360" y="160" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <line x1="350" y1="166" x2="430" y2="166" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrr)" filter="url(#rough2)"/>
  <rect x="430" y="150" width="95" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="477" y="170" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">返回 lo</text>

  <!-- yes branch down -->
  <text x="278" y="216" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <line x1="270" y1="196" x2="270" y2="214" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3: mid -->
  <rect x="150" y="216" width="240" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="270" y="236" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">mid = (lo + hi + 1) / 2   （上取整防死循环）</text>
  <line x1="270" y1="246" x2="270" y2="262" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond: check(mid) connected? -->
  <polygon points="270,264 380,300 270,336 160,300" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="296" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">check(mid)：</text>
  <text x="270" y="311" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">只走 dist≥mid 能否连通?</text>

  <!-- yes -> left: lo=mid -->
  <text x="150" y="294" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <line x1="160" y1="300" x2="150" y2="300" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="40" y="286" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="95" y="305" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">lo = mid</text>
  <!-- loop left up to lo<hi diamond -->
  <path d="M95,286 C 55,286 55,166 188,166" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="58" y="226" font-size="11" fill="#666" filter="url(#rough2)">尝试</text>
  <text x="52" y="240" font-size="11" fill="#666" filter="url(#rough2)">更大</text>

  <!-- no -> right: hi=mid-1 -->
  <text x="386" y="294" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <line x1="380" y1="300" x2="390" y2="300" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="390" y="286" width="110" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="445" y="305" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">hi = mid − 1</text>
  <!-- loop right up -->
  <path d="M445,286 C 505,286 505,166 352,166" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="492" y="226" font-size="11" fill="#666" filter="url(#rough2)">收缩</text>
  <text x="486" y="240" font-size="11" fill="#666" filter="url(#rough2)">上界</text>

  <text x="270" y="384" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">
    check 提前剪枝：若起/终点 dist &lt; mid 直接 false（如起点即小偷的示例1）
  </text>
</svg>
