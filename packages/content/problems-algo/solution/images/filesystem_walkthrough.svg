<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold">示例演算：五次调用逐步建出 /a/b/c/d 文件树</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">每一步只在树上「长出」新节点，已有结构不变</text>

  <!-- ===== Panel 1: ls("/") ===== -->
  <rect x="20" y="60" width="170" height="240" fill="none" stroke="#446688" stroke-width="1.2" stroke-dasharray="4 3" rx="8" filter="url(#rough2)"/>
  <text x="105" y="80" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">① ls("/")</text>
  <text x="105" y="96" text-anchor="middle" font-size="9.5" fill="#888">根目录尚无子节点</text>

  <circle cx="105" cy="140" r="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="105" y="145" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">/</text>
  <text x="105" y="170" text-anchor="middle" font-size="9" fill="#888">children: {}</text>

  <rect x="40" y="250" width="130" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="105" y="272" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">返回 []</text>

  <!-- arrow to panel 2 -->
  <path d="M 192 180 L 208 180" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Panel 2: mkdir("/a/b/c") ===== -->
  <rect x="210" y="60" width="170" height="240" fill="none" stroke="#4a7a3a" stroke-width="1.2" stroke-dasharray="4 3" rx="8" filter="url(#rough2)"/>
  <text x="295" y="80" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">② mkdir("/a/b/c")</text>
  <text x="295" y="96" text-anchor="middle" font-size="9.5" fill="#888">touch 沿途建出 a→b→c</text>

  <circle cx="295" cy="124" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="295" y="128" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">/</text>
  <line x1="295" y1="138" x2="295" y2="154" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>

  <circle cx="295" cy="168" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="295" y="172" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">a</text>
  <line x1="295" y1="181" x2="295" y2="195" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>

  <circle cx="295" cy="208" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="295" y="212" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">b</text>
  <line x1="295" y1="221" x2="295" y2="235" stroke="#888" stroke-width="1.3" filter="url(#rough2)"/>

  <circle cx="295" cy="248" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="295" y="252" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">c</text>

  <rect x="230" y="276" width="130" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="295" y="290" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">返回 null</text>

  <!-- arrow to panel 3 -->
  <path d="M 382 180 L 398 180" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Panel 3: addContentToFile ===== -->
  <rect x="400" y="60" width="180" height="240" fill="none" stroke="#d6a040" stroke-width="1.2" stroke-dasharray="4 3" rx="8" filter="url(#rough2)"/>
  <text x="490" y="80" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">③ addContentToFile</text>
  <text x="490" y="96" text-anchor="middle" font-size="9.5" fill="#888">("/a/b/c/d", "hello")</text>

  <circle cx="490" cy="120" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="124" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">/</text>
  <line x1="490" y1="133" x2="490" y2="145" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

  <circle cx="490" cy="158" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="162" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">a</text>
  <line x1="490" y1="170" x2="490" y2="180" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

  <circle cx="490" cy="192" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="196" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">b</text>
  <line x1="490" y1="204" x2="490" y2="214" stroke="#888" stroke-width="1.2" filter="url(#rough2)"/>

  <circle cx="490" cy="226" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="490" y="230" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold">c</text>
  <line x1="490" y1="238" x2="490" y2="250" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>

  <rect x="455" y="252" width="70" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="490" y="268" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">d (file)</text>
  <text x="490" y="281" text-anchor="middle" font-size="9" fill="#888">"hello"</text>

  <rect x="425" y="294" width="130" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="490" y="308" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">返回 null</text>

  <!-- ===== Bottom: steps 4 & 5 ===== -->
  <rect x="40" y="330" width="540" height="76" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="60" y="352" font-size="11.5" fill="#446688" font-weight="bold">④ ls("/")</text>
  <text x="60" y="370" font-size="10" fill="#555">root.children 现含 {"a"}</text>
  <text x="60" y="386" font-size="10" fill="#555">map 遍历即字典序</text>
  <rect x="150" y="372" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="190" y="389" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">→ ["a"]</text>

  <text x="320" y="352" font-size="11.5" fill="#446688" font-weight="bold">⑤ readContentFromFile("/a/b/c/d")</text>
  <text x="320" y="370" font-size="10" fill="#555">下沉到 d 节点，读 content</text>
  <text x="320" y="386" font-size="10" fill="#555">只读 traverse，不新建</text>
  <rect x="490" y="372" width="80" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="530" y="389" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">→ "hello"</text>
</svg>
