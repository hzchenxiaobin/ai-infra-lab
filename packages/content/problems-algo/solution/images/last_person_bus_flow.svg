<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="9" markerHeight="9" refX="4" refY="8" orient="auto">
      <path d="M0,0 L4,8 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">SQL 执行流程：窗口函数累计求和 + 取最后一行</text>

  <!-- Step 1: FROM Queue -->
  <rect x="150" y="44" width="220" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① FROM Queue</text>
  <text x="260" y="74" text-anchor="middle" font-size="9" fill="#888">读取原始表（turn 未必有序）</text>

  <!-- arrow 1→2 -->
  <path d="M 260 84 L 260 98" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 2: ORDER BY turn -->
  <rect x="130" y="100" width="260" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="116" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">② ORDER BY turn</text>
  <text x="260" y="130" text-anchor="middle" font-size="9" fill="#888">按上巴士顺序排序（窗口函数的排序依据）</text>

  <!-- arrow 2→3 -->
  <path d="M 260 140 L 260 154" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 3: SUM OVER -->
  <rect x="80" y="156" width="360" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="174" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">③ SUM(weight) OVER (ORDER BY turn)</text>
  <text x="260" y="188" text-anchor="middle" font-size="9" fill="#888">窗口函数：按 turn 排序累加 weight，生成 total 列</text>

  <!-- arrow 3→4 -->
  <path d="M 260 200 L 260 214" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 4: WHERE total <= 1000 -->
  <rect x="130" y="216" width="260" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="260" y="232" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">④ WHERE total &lt;= 1000</text>
  <text x="260" y="246" text-anchor="middle" font-size="9" fill="#888">过滤出累计体重不超 1000 kg 的行</text>

  <!-- arrow 4→5 -->
  <path d="M 260 256 L 260 270" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Step 5: ORDER BY total DESC LIMIT 1 -->
  <rect x="100" y="272" width="320" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="260" y="290" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⑤ ORDER BY total DESC LIMIT 1</text>
  <text x="260" y="304" text-anchor="middle" font-size="9" fill="#888">按累计降序取第一行 = 累计最大的可上车者</text>

  <!-- arrow 5→result -->
  <path d="M 260 316 L 260 330" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Result -->
  <rect x="160" y="332" width="200" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="353" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">→ person_name = 'John Cena'</text>

  <!-- Side note -->
  <rect x="380" y="156" width="120" height="56" fill="#f5f5f5" stroke="#ccc" stroke-width="1" stroke-dasharray="3,2" rx="6" filter="url(#rough2)"/>
  <text x="440" y="174" text-anchor="middle" font-size="9" fill="#888" font-weight="bold">关键：窗口函数</text>
  <text x="440" y="188" text-anchor="middle" font-size="8.5" fill="#888">SUM() OVER ()</text>
  <text x="440" y="201" text-anchor="middle" font-size="8.5" fill="#888">在排序后的行上</text>
  <text x="440" y="213" text-anchor="middle" font-size="8.5" fill="#888">逐行累加</text>

  <path d="M 380 184 L 362 184" stroke="#ccc" stroke-width="1.2" fill="none" stroke-dasharray="2,2" marker-end="url(#arrD)" filter="url(#rough2)"/>
</svg>
