<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：prefix[j+1] − prefix[i] = k，存最早下标取最长</text>

  <!-- nums row -->
  <text x="40" y="74" font-size="12" fill="#888">nums:</text>
  <rect x="145" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="78" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="195" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="78" text-anchor="middle" font-size="12" fill="#333">−1</text>
  <rect x="245" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="78" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="295" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="320" y="78" text-anchor="middle" font-size="12" fill="#333">−2</text>
  <rect x="345" y="58" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="78" text-anchor="middle" font-size="12" fill="#333">3</text>

  <!-- index labels under nums -->
  <text x="170" y="104" text-anchor="middle" font-size="9" fill="#aaa">i=0</text>
  <text x="220" y="104" text-anchor="middle" font-size="9" fill="#aaa">i=1</text>
  <text x="270" y="104" text-anchor="middle" font-size="9" fill="#aaa">i=2</text>
  <text x="320" y="104" text-anchor="middle" font-size="9" fill="#aaa">i=3</text>
  <text x="370" y="104" text-anchor="middle" font-size="9" fill="#aaa">i=4</text>

  <!-- prefix row -->
  <text x="40" y="146" font-size="12" fill="#888">prefix:</text>
  <rect x="95" y="130" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="120" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">0</text>
  <rect x="145" y="130" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="170" y="150" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="195" y="130" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="220" y="150" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="245" y="130" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="270" y="150" text-anchor="middle" font-size="12" fill="#333">5</text>
  <rect x="295" y="130" width="50" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="345" y="130" width="50" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="150" text-anchor="middle" font-size="12" fill="#333">6</text>

  <!-- prefix index labels -->
  <text x="120" y="176" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">p[0]@−1</text>
  <text x="170" y="176" text-anchor="middle" font-size="9" fill="#aaa">p[1]</text>
  <text x="220" y="176" text-anchor="middle" font-size="9" fill="#aaa">p[2]</text>
  <text x="270" y="176" text-anchor="middle" font-size="9" fill="#aaa">p[3]</text>
  <text x="320" y="176" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">p[4]@3</text>
  <text x="370" y="176" text-anchor="middle" font-size="9" fill="#aaa">p[5]</text>

  <!-- bracket spanning nums[0..3] -->
  <path d="M 150 116 Q 150 124 158 124 L 332 124 Q 340 124 340 116" stroke="#b85450" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="245" y="118" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">子数组 [0..3] 和 = 3 = k</text>

  <!-- arrows from prefix[4] and prefix[0] down to equation -->
  <path d="M 320 162 L 320 196" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4,2" filter="url(#rough2)"/>
  <path d="M 120 162 L 120 196 L 150 196" stroke="#d6a040" stroke-width="1.5" fill="none" stroke-dasharray="4,2" filter="url(#rough2)"/>

  <!-- equation box -->
  <rect x="40" y="200" width="440" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="222" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">sum(0, 3) = prefix[4] − prefix[0]</text>
  <text x="260" y="244" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">= 3 − 0 = 3 = k  ✓  长度 = 3−(−1) = 4</text>

  <!-- generalization -->
  <rect x="40" y="272" width="440" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="294" text-anchor="middle" font-size="12" fill="#333">sum(i, j) = k  ⇔  prefix[i] = prefix[j+1] − k</text>
  <text x="260" y="314" text-anchor="middle" font-size="11.5" fill="#444">求最长 → 哈希表存「前缀和 → 最早下标」</text>
  <text x="260" y="332" text-anchor="middle" font-size="11.5" fill="#4a7a3a">命中即得长度 i − first[prefix−k]，取最大</text>
</svg>
