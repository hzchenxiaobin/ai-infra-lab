<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 560" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrowD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
    <marker id="arrowR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="440" height="560" fill="#fafafa"/>

  <text x="220" y="20" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">施咒的最大总伤害：算法流程</text>

  <!-- Step 1 -->
  <rect x="60" y="36" width="320" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="220" y="58" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">① 排序去重 + 计数</text>
  <text x="220" y="77" text-anchor="middle" font-size="11" fill="#555">vals 升序唯一值，sums[i] = vals[i] × 次数</text>

  <path d="M 220 90 L 220 104" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Step 2 -->
  <rect x="60" y="106" width="320" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="220" y="126" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">② 初始化</text>
  <text x="220" y="144" text-anchor="middle" font-size="11" fill="#555">dp[0] = 0，指针 p = 0</text>

  <path d="M 220 154 L 220 168" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Step 3: loop -->
  <rect x="80" y="170" width="280" height="42" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="220" y="188" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">for i = 1 to n</text>
  <text x="220" y="205" text-anchor="middle" font-size="11" fill="#555">v = vals[i−1]，sum = sums[i−1]</text>

  <path d="M 220 214 L 220 228" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Step 4: pointer -->
  <rect x="60" y="230" width="320" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="220" y="250" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">④ 双指针前移</text>
  <text x="220" y="269" text-anchor="middle" font-size="11" fill="#555">while vals[p] &lt; v−2: p++（p 单调不回退）</text>

  <path d="M 220 282 L 220 296" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>

  <!-- Diamond -->
  <polygon points="220,299 335,347 220,395 105,347" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="220" y="342" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">取 v 还是不取 ?</text>
  <text x="220" y="361" text-anchor="middle" font-size="10.5" fill="#777">比较两种收益</text>

  <!-- Left branch -->
  <path d="M 105 347 L 58 347 L 58 404" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="66" y="340" font-size="11" fill="#b85450" font-weight="bold">不取</text>
  <rect x="10" y="408" width="96" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="58" y="428" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">跳过值 v</text>
  <text x="58" y="446" text-anchor="middle" font-size="10" fill="#555">dp[i] = dp[i−1]</text>
  <text x="58" y="461" text-anchor="middle" font-size="10" fill="#b85450">继承前缀最优</text>

  <!-- Right branch -->
  <path d="M 335 347 L 382 347 L 382 404" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrowD)" filter="url(#rough2)"/>
  <text x="344" y="340" font-size="11" fill="#4a7a3a" font-weight="bold">取</text>
  <rect x="334" y="408" width="96" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="382" y="428" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">取走全部 v</text>
  <text x="382" y="446" text-anchor="middle" font-size="10" fill="#555">dp[p] + sum</text>
  <text x="382" y="461" text-anchor="middle" font-size="10" fill="#4a7a3a">跳过 [v−2, v+2]</text>

  <!-- Merge -->
  <path d="M 58 466 L 58 495 L 96 495" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <path d="M 382 466 L 382 495 L 344 495" stroke="#888" stroke-width="1.8" fill="none" marker-end="url(#arrowR)" filter="url(#rough2)"/>

  <!-- max box -->
  <rect x="100" y="478" width="240" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="220" y="500" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">dp[i] = max(左, 右)</text>

  <!-- loop back -->
  <path d="M 340 495 L 412 495 L 412 191 L 364 191" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowR)" filter="url(#rough2)"/>
  <text x="404" y="340" text-anchor="end" font-size="10" fill="#999">i+1</text>

  <!-- final -->
  <text x="220" y="536" text-anchor="middle" font-size="11" fill="#d6a040" font-style="italic">循环结束 → return dp[n]（时间 O(n log n)，排序主导）</text>
</svg>
