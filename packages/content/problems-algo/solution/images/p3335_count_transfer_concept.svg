<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：不追内容，只数个数 —— 26 个计数器的环形传送带</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">替换逐字符独立生效 ⇒ 顺序无关，长度 = 各字符独立演化长度之和</text>

  <!-- 上半：字符串 -> 频率 -->
  <text x="100" y="68" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">① 丢掉顺序，只留频率</text>

  <rect x="30" y="84" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="43" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a</text>
  <rect x="56" y="84" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="69" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b</text>
  <rect x="82" y="84" width="26" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="95" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">c</text>
  <rect x="108" y="84" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="121" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">y</text>
  <rect x="134" y="84" width="26" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="147" y="102" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">y</text>

  <path d="M 172 97 L 214 97" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="193" y="89" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">数次数</text>

  <rect x="220" y="76" width="176" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="308" y="94" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">cnt = [a:1, b:1, c:1, y:2]</text>
  <text x="308" y="110" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">其余 21 个字母计 0</text>

  <!-- 中半：环形传送带 -->
  <text x="260" y="150" text-anchor="middle" font-size="12" fill="#33506b" font-weight="bold" filter="url(#rough2)">② 一轮转换 = 计数整体右移一格，z 同时分裂进 a 和 b</text>

  <rect x="36" y="166" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="51" y="185" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">a</text>
  <rect x="66" y="166" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="81" y="185" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">b</text>
  <rect x="96" y="166" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="111" y="185" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">c</text>
  <text x="140" y="185" text-anchor="middle" font-size="12" fill="#888" filter="url(#rough2)">· · ·</text>
  <rect x="160" y="166" width="30" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="175" y="185" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">x</text>
  <rect x="190" y="166" width="30" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="205" y="185" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">y</text>
  <rect x="220" y="166" width="30" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="235" y="185" text-anchor="middle" font-size="12" fill="#8a3833" font-weight="bold" filter="url(#rough2)">z</text>

  <path d="M 256 180 L 292 180" fill="none" stroke="#a07830" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="274" y="172" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">右移</text>

  <!-- z 的两条分裂边 -->
  <path d="M 235 194 C 235 224, 100 214, 55 198" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 235 194 C 235 228, 118 226, 84 198" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="148" y="232" text-anchor="middle" font-size="10.5" fill="#8a3833" font-weight="bold" filter="url(#rough2)">z → "ab"：一份落 a，一份落 b</text>

  <!-- 转移方程 -->
  <rect x="300" y="160" width="196" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="398" y="180" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">cnt′[i+1] += cnt[i]（i=0..24）</text>
  <text x="398" y="200" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">cnt′[0] += cnt[25]，cnt′[1] += cnt[25]</text>

  <!-- 底部备注 -->
  <rect x="20" y="262" width="480" height="122" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="34" y="284" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">💡 三个关键不变式</text>
  <text x="34" y="304" font-size="10.5" fill="#555" filter="url(#rough2)">· 独立性：每个字符的演化与其他字符无关，字符串顺序彻底没用 → 状态压缩成 26 维</text>
  <text x="34" y="322" font-size="10.5" fill="#555" filter="url(#rough2)">· 长度增量：每轮 +cnt[z]（z 一分为二），其余字符平移不改变总数</text>
  <text x="34" y="340" font-size="10.5" fill="#555" filter="url(#rough2)">· 线性性：转移只有「加法」→ 全程 mod 1e9+7 安全；也是矩阵快速幂的入口（见第 5 节）</text>
  <text x="34" y="358" font-size="10.5" fill="#555" filter="url(#rough2)">· 答案：t 轮后 ans = Σ cnt[i] (mod 1e9+7)</text>
</svg>
