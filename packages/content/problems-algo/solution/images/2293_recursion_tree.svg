<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">扩展：分治递归树——每个内部节点的运算由「该层节点编号」奇偶决定</text>

  <!-- level labels (left margin) -->
  <text x="30" y="50" font-size="10" fill="#888" font-weight="bold">层3</text>
  <text x="30" y="130" font-size="10" fill="#888" font-weight="bold">层2</text>
  <text x="30" y="220" font-size="10" fill="#888" font-weight="bold">层1</text>
  <text x="30" y="312" font-size="10" fill="#888" font-weight="bold">叶</text>

  <!-- ===== Edges (drawn first so nodes overlay) ===== -->
  <!-- root -> level2 -->
  <path d="M 280 72 L 160 104" stroke="#999" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 280 72 L 400 104" stroke="#999" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <!-- level2 -> level1 -->
  <path d="M 160 152 L 100 194" stroke="#999" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 160 152 L 220 194" stroke="#999" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 400 152 L 340 194" stroke="#999" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 400 152 L 460 194" stroke="#999" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <!-- level1 -> leaves -->
  <path d="M 100 242 L 70 290" stroke="#bbb" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 100 242 L 130 290" stroke="#bbb" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 220 242 L 190 290" stroke="#bbb" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 220 242 L 250 290" stroke="#bbb" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 340 242 L 310 290" stroke="#bbb" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 340 242 L 370 290" stroke="#bbb" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 460 242 L 430 290" stroke="#bbb" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <path d="M 460 242 L 490 290" stroke="#bbb" stroke-width="1.3" fill="none" filter="url(#rough2)"/>

  <!-- ===== Root (level3): min, value 1, idx 0 ===== -->
  <rect x="252" y="24" width="56" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="40" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">min</text>
  <text x="280" y="62" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <text x="280" y="88" text-anchor="middle" font-size="8.5" fill="#888">编号 0</text>

  <!-- ===== Level2: idx0 min(1) @160, idx1 max(4) @400 ===== -->
  <rect x="132" y="104" width="56" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="160" y="120" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">min</text>
  <text x="160" y="142" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <text x="160" y="168" text-anchor="middle" font-size="8.5" fill="#888">编号 0</text>

  <rect x="372" y="104" width="56" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="400" y="120" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">max</text>
  <text x="400" y="142" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">4</text>
  <text x="400" y="168" text-anchor="middle" font-size="8.5" fill="#888">编号 1</text>

  <!-- ===== Level1: idx 0,1,2,3 -> min,max,min,max ; values 1,5,4,2 ===== -->
  <rect x="72" y="194" width="56" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="100" y="210" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">min</text>
  <text x="100" y="232" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">1</text>
  <text x="100" y="258" text-anchor="middle" font-size="8.5" fill="#888">编号 0</text>

  <rect x="192" y="194" width="56" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="220" y="210" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">max</text>
  <text x="220" y="232" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">5</text>
  <text x="220" y="258" text-anchor="middle" font-size="8.5" fill="#888">编号 1</text>

  <rect x="312" y="194" width="56" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="340" y="210" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">min</text>
  <text x="340" y="232" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">4</text>
  <text x="340" y="258" text-anchor="middle" font-size="8.5" fill="#888">编号 2</text>

  <rect x="432" y="194" width="56" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="460" y="210" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">max</text>
  <text x="460" y="232" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">2</text>
  <text x="460" y="258" text-anchor="middle" font-size="8.5" fill="#888">编号 3</text>

  <!-- ===== Leaves: original array ===== -->
  <rect x="50" y="290" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="70" y="314" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">1</text>
  <rect x="110" y="290" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="130" y="314" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">3</text>
  <rect x="170" y="290" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="314" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">5</text>
  <rect x="230" y="290" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="314" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="290" y="290" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="314" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">4</text>
  <rect x="350" y="290" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="370" y="314" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">8</text>
  <rect x="410" y="290" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="314" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>
  <rect x="470" y="290" width="40" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="490" y="314" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">2</text>

  <text x="280" y="346" text-anchor="middle" font-size="10" fill="#888">叶 = 原数组 nums；根 = 最终答案（= 1）</text>

  <!-- bottom rule box -->
  <rect x="30" y="358" width="500" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="374" text-anchor="middle" font-size="10.5" fill="#555">规则：长度 2^m 的节点，其编号 idx = l / (r−l)；idx 偶 → min，idx 奇 → max</text>
  <text x="280" y="386" text-anchor="middle" font-size="10.5" fill="#555">叶返回自身；自底向上两两合并 → 递归 O(n) / 栈 O(log n)</text>
</svg>
