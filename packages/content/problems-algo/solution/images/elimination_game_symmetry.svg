<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">镜像对称：f(n) + b(n) = n + 1</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">f = 从左起手剩余；b = 从右起手剩余。映射 x ↦ n+1−x 把两方向互换</text>

  <!-- ===== Left panel: L→R on [1..9] ===== -->
  <rect x="28" y="62" width="240" height="180" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)" opacity="0.5"/>
  <text x="148" y="82" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">L→R 起手：f(9)</text>

  <!-- row [1..9] small -->
  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <rect x="44" y="96" width="22" height="18" fill="#e8f0fe" stroke="#446688" rx="3"/><text x="55" y="109" fill="#b85450" font-weight="bold">1</text>
    <rect x="68" y="96" width="22" height="18" fill="#e8f0fe" stroke="#446688" rx="3"/><text x="79" y="109" fill="#446688">2</text>
    <rect x="92" y="96" width="22" height="18" fill="#e8f0fe" stroke="#446688" rx="3"/><text x="103" y="109" fill="#b85450" font-weight="bold">3</text>
    <rect x="116" y="96" width="22" height="18" fill="#e8f0fe" stroke="#446688" rx="3"/><text x="127" y="109" fill="#446688">4</text>
    <rect x="140" y="96" width="22" height="18" fill="#e8f0fe" stroke="#446688" rx="3"/><text x="151" y="109" fill="#b85450" font-weight="bold">5</text>
    <rect x="164" y="96" width="22" height="18" fill="#e8f0fe" stroke="#446688" rx="3"/><text x="175" y="109" fill="#446688">6</text>
    <rect x="188" y="96" width="22" height="18" fill="#e8f0fe" stroke="#446688" rx="3"/><text x="199" y="109" fill="#b85450" font-weight="bold">7</text>
    <rect x="212" y="96" width="22" height="18" fill="#e8f0fe" stroke="#446688" rx="3"/><text x="223" y="109" fill="#446688">8</text>
    <rect x="236" y="96" width="22" height="18" fill="#e8f0fe" stroke="#446688" rx="3"/><text x="247" y="109" fill="#b85450" font-weight="bold">9</text>
    <text x="148" y="132" font-size="10" fill="#b85450">删奇数位 → {1,3,5,7,9}</text>
  </g>

  <!-- survivors = 2·[1..4] -->
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="80" y="146" width="28" height="22" fill="#fff8e1" stroke="#d6a040" rx="3"/><text x="94" y="162" fill="#d6a040" font-weight="bold">2</text>
    <rect x="112" y="146" width="28" height="22" fill="#fff8e1" stroke="#d6a040" rx="3"/><text x="126" y="162" fill="#d6a040" font-weight="bold">4</text>
    <rect x="144" y="146" width="28" height="22" fill="#fff8e1" stroke="#d6a040" rx="3"/><text x="158" y="162" fill="#d6a040" font-weight="bold">6</text>
    <rect x="176" y="146" width="28" height="22" fill="#fff8e1" stroke="#d6a040" rx="3"/><text x="190" y="162" fill="#d6a040" font-weight="bold">8</text>
    <text x="148" y="186" font-size="10" fill="#446688">= 2 · [1, 2, 3, 4]</text>
    <text x="148" y="206" font-size="11" fill="#b85450" font-weight="bold">下一轮 R←L ⇒ f(9)=2·b(4)</text>
    <text x="148" y="226" font-size="10" fill="#888">f(9) = 6</text>
  </g>

  <!-- ===== Right panel: R←L on [1..9] (mirror) ===== -->
  <rect x="292" y="62" width="240" height="180" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)" opacity="0.5"/>
  <text x="412" y="82" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">R←L 起手：b(9)</text>

  <g filter="url(#rough2)" font-size="10" text-anchor="middle">
    <rect x="308" y="96" width="22" height="18" fill="#fce4ec" stroke="#b85450" rx="3"/><text x="319" y="109" fill="#b85450" font-weight="bold">1</text>
    <rect x="332" y="96" width="22" height="18" fill="#fce4ec" stroke="#b85450" rx="3"/><text x="343" y="109" fill="#446688">2</text>
    <rect x="356" y="96" width="22" height="18" fill="#fce4ec" stroke="#b85450" rx="3"/><text x="367" y="109" fill="#b85450" font-weight="bold">3</text>
    <rect x="380" y="96" width="22" height="18" fill="#fce4ec" stroke="#b85450" rx="3"/><text x="391" y="109" fill="#446688">4</text>
    <rect x="404" y="96" width="22" height="18" fill="#fce4ec" stroke="#b85450" rx="3"/><text x="415" y="109" fill="#b85450" font-weight="bold">5</text>
    <rect x="428" y="96" width="22" height="18" fill="#fce4ec" stroke="#b85450" rx="3"/><text x="439" y="109" fill="#446688">6</text>
    <rect x="452" y="96" width="22" height="18" fill="#fce4ec" stroke="#b85450" rx="3"/><text x="463" y="109" fill="#b85450" font-weight="bold">7</text>
    <rect x="476" y="96" width="22" height="18" fill="#fce4ec" stroke="#b85450" rx="3"/><text x="487" y="109" fill="#446688">8</text>
    <rect x="500" y="96" width="22" height="18" fill="#fce4ec" stroke="#b85450" rx="3"/><text x="511" y="109" fill="#b85450" font-weight="bold">9</text>
    <text x="412" y="132" font-size="10" fill="#b85450">n 奇 → 仍删 {1,3,5,7,9}</text>
  </g>

  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <rect x="344" y="146" width="28" height="22" fill="#fff8e1" stroke="#d6a040" rx="3"/><text x="358" y="162" fill="#d6a040" font-weight="bold">2</text>
    <rect x="376" y="146" width="28" height="22" fill="#fff8e1" stroke="#d6a040" rx="3"/><text x="390" y="162" fill="#d6a040" font-weight="bold">4</text>
    <rect x="408" y="146" width="28" height="22" fill="#fff8e1" stroke="#d6a040" rx="3"/><text x="422" y="162" fill="#d6a040" font-weight="bold">6</text>
    <rect x="440" y="146" width="28" height="22" fill="#fff8e1" stroke="#d6a040" rx="3"/><text x="454" y="162" fill="#d6a040" font-weight="bold">8</text>
    <text x="412" y="186" font-size="10" fill="#446688">= 2 · [1, 2, 3, 4]</text>
    <text x="412" y="206" font-size="11" fill="#b85450" font-weight="bold">下一轮 L→R ⇒ b(9)=2·f(4)</text>
    <text x="412" y="226" font-size="10" fill="#888">b(9) = 4</text>
  </g>

  <!-- ===== mirror arrow between panels ===== -->
  <g filter="url(#rough2)">
    <path d="M 268 150 L 292 150" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)"/>
    <path d="M 292 166 L 268 166" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)"/>
    <text x="280" y="142" text-anchor="middle" font-size="9" fill="#446688">x↦10−x</text>
  </g>

  <!-- ===== verify line ===== -->
  <text x="280" y="262" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">验证：f(9) + b(9) = 6 + 4 = 10 = 9 + 1 ✓</text>

  <!-- ===== recurrence box ===== -->
  <rect x="40" y="278" width="480" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="298" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">闭式递推（合并两式）</text>
  <text x="280" y="318" text-anchor="middle" font-size="11" fill="#446688">① f(n) = 2 · b(⌊n/2⌋)　　② b(n) = n + 1 − f(n)</text>
  <text x="280" y="338" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⟹ f(n) = 2 · ( ⌊n/2⌋ + 1 − f(⌊n/2⌋) )，f(1) = 1</text>
  <text x="280" y="356" text-anchor="middle" font-size="10" fill="#888">每层 n 减半 → O(log n) 时间 / O(1) 空间（迭代展开即 head/step/count 模板）</text>
</svg>
