<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="8" refX="7" refY="3.5" orient="auto">
      <path d="M 0 0 L 8 3.5 L 0 7 Z" fill="#555"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <!-- 开始 -->
  <g filter="url(#rough2)">
    <rect x="150" y="22" width="220" height="30" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
    <text x="260" y="42" text-anchor="middle" font-size="12.5" fill="#33506b" font-weight="bold">初始化 ans = 0，zero_mask = 0</text>
  </g>
  <path d="M 260 52 L 260 74" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="68" font-size="11" fill="#666" filter="url(#rough2)">b 从 16 出发（10&#8310; &lt; 2&#185;&#8311;）</text>

  <!-- 菱形 A：b < 0 ? -->
  <g filter="url(#rough2)">
    <path d="M 260 78 L 338 106 L 260 134 L 182 106 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="260" y="111" text-anchor="middle" font-size="12.5" fill="#8a6d1a" font-weight="bold">b &lt; 0 ?</text>
  </g>
  <text x="346" y="98" font-size="12" fill="#2f5d24" filter="url(#rough2)">是</text>
  <path d="M 338 106 L 412 106" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="414" y="92" width="92" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
    <text x="460" y="110" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold">返回 ans</text>
  </g>

  <text x="268" y="154" font-size="12" fill="#8a3030" filter="url(#rough2)">否</text>
  <path d="M 260 134 L 260 160" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- cand 构造 -->
  <g filter="url(#rough2)">
    <rect x="140" y="162" width="240" height="28" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="260" y="180" text-anchor="middle" font-size="12.5" fill="#33506b">cand &#8592; zero_mask | (1 &lt;&lt; b)</text>
  </g>
  <path d="M 260 190 L 260 216" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 菱形 B：存在性检查 -->
  <g filter="url(#rough2)">
    <path d="M 260 218 L 410 268 L 260 318 L 110 268 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="260" y="262" text-anchor="middle" font-size="12.5" fill="#8a6d1a">每行都存在</text>
    <text x="260" y="280" text-anchor="middle" font-size="12.5" fill="#8a6d1a" font-weight="bold">x &amp; cand == 0 ?</text>
  </g>

  <text x="84" y="292" font-size="12" fill="#2f5d24" filter="url(#rough2)">是</text>
  <path d="M 110 268 L 120 300" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="430" y="292" font-size="12" fill="#8a3030" filter="url(#rough2)">否</text>
  <path d="M 410 268 L 400 300" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 分支框 -->
  <g filter="url(#rough2)">
    <rect x="30" y="302" width="185" height="38" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8"/>
    <text x="122" y="318" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold">zero_mask &#8592; cand</text>
    <text x="122" y="334" text-anchor="middle" font-size="11" fill="#2f5d24">位 b 永久归零</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="305" y="302" width="185" height="38" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
    <text x="397" y="318" text-anchor="middle" font-size="12" fill="#8a3030" font-weight="bold">ans &#8592; ans | (1 &lt;&lt; b)</text>
    <text x="397" y="334" text-anchor="middle" font-size="11" fill="#8a3030">卡壳行强制位 b 为 1</text>
  </g>

  <!-- 汇合到 b - 1 -->
  <path d="M 122 340 L 212 368" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 397 340 L 308 368" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <g filter="url(#rough2)">
    <rect x="200" y="368" width="120" height="28" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="260" y="386" text-anchor="middle" font-size="12.5" fill="#33506b">b &#8592; b &#8722; 1</text>
  </g>

  <!-- 回环 -->
  <path d="M 260 396 L 260 414 L 24 414 L 24 106 L 176 106" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="110" y="408" font-size="11" fill="#666" filter="url(#rough2)">下一轮（更低的一位）</text>
</svg>
