<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="460" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">算法流程：值域计数法</text>
  <text x="310" y="48" text-anchor="middle" font-size="11" fill="#888">元素值 ∈ [1,100] → 用长度 101 的计数数组</text>

  <!-- Step 1: init cnt -->
  <rect x="40" y="60" width="540" height="84" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="86" font-size="13" fill="#446688" font-weight="bold">步骤 1 · 初始化计数数组</text>
  <g font-size="12" font-family="monospace">
    <text x="60" y="110" fill="#444">k = arrays.length</text>
    <text x="60" y="130" fill="#446688">cnt[101] = {0}    // 值域 [1,100]，下标即元素值</text>
  </g>

  <!-- arrow down -->
  <path d="M 310 148 L 310 174" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 2: count -->
  <rect x="40" y="180" width="540" height="116" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="206" font-size="13" fill="#d6a040" font-weight="bold">步骤 2 · 遍历每个数组，累加计数</text>
  <g font-size="12" font-family="monospace">
    <text x="60" y="230" fill="#444">for row in arrays:</text>
    <text x="80" y="250" fill="#446688">for x in row:</text>
    <text x="100" y="270" fill="#b85450">cnt[x] += 1     // x 在该数组中出现一次</text>
  </g>
  <text x="320" y="250" font-size="11" fill="#888">严格递增 ⇒ 同一数组内无重复</text>
  <text x="320" y="268" font-size="11" fill="#888">故 cnt[x] 即「含 x 的数组个数」</text>

  <!-- arrow down -->
  <path d="M 310 300 L 310 326" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>

  <!-- Step 3: collect -->
  <rect x="40" y="332" width="540" height="84" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="358" font-size="13" fill="#4a7a3a" font-weight="bold">步骤 3 · 收集 cnt[x] == k 的 x</text>
  <g font-size="12" font-family="monospace">
    <text x="60" y="382" fill="#444">ans = [x for x in 1..100 if cnt[x] == k]</text>
    <text x="60" y="402" fill="#4a7a3a">按值升序遍历 → 结果天然升序 ✓</text>
  </g>

  <!-- arrow down -->
  <path d="M 310 420 L 310 446" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
</svg>
