<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：贪心右放优先 —— 一桶可喂两只</text>

  <text x="40" y="56" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 一个桶最多喂相邻两只仓鼠（左邻 + 右邻）</text>

  <rect x="80" y="70" width="60" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="110" y="90" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">H</text>
  <text x="110" y="106" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">仓鼠</text>

  <rect x="180" y="70" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="210" y="90" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">B</text>
  <text x="210" y="106" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">桶</text>

  <rect x="280" y="70" width="60" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="310" y="90" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">H</text>
  <text x="310" y="106" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">仓鼠</text>

  <path d="M 210 116 L 130 116" stroke="#b85450" stroke-width="1.6" stroke-dasharray="3 2" marker-end="url(#arrr)" fill="none" filter="url(#rough2)"/>
  <path d="M 210 116 L 290 116" stroke="#b85450" stroke-width="1.6" stroke-dasharray="3 2" marker-end="url(#arrr)" fill="none" filter="url(#rough2)"/>
  <text x="170" y="128" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">喂</text>
  <text x="250" y="128" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">喂</text>

  <text x="40" y="158" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">② 遇 H 先看右：右空就放右（可能顺带喂下一只）</text>

  <rect x="60" y="172" width="60" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="90" y="192" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">H</text>
  <text x="90" y="208" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i</text>

  <rect x="130" y="172" width="60" height="44" fill="#fafafa" stroke="#aaa" stroke-width="1.5" stroke-dasharray="4 3" rx="4" filter="url(#rough2)"/>
  <text x="160" y="196" text-anchor="middle" font-size="14" fill="#aaa" filter="url(#rough2)">.</text>

  <rect x="200" y="172" width="60" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="230" y="192" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">H</text>
  <text x="230" y="208" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">i+2</text>

  <path d="M 90 222 L 90 240 L 160 240" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <path d="M 160 240 L 160 220" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" fill="none" filter="url(#rough2)"/>
  <text x="125" y="236" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">右空→放右</text>

  <rect x="130" y="172" width="60" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="160" y="196" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">B</text>

  <path d="M 160 222 L 230 222" stroke="#b85450" stroke-width="1.6" stroke-dasharray="3 2" marker-end="url(#arrr)" fill="none" filter="url(#rough2)"/>
  <text x="195" y="218" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">顺带喂</text>

  <rect x="40" y="252" width="480" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="271" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">贪心规则：右空放右 &gt; 否则左空放左 &gt; 否则返回 -1</text>

  <text x="40" y="300" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">③ 无解情形：H 两侧都非空位（H 或越界）</text>

  <rect x="80" y="314" width="60" height="40" fill="#fafafa" stroke="#aaa" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="332" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">.</text>
  <rect x="150" y="314" width="60" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="180" y="332" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">H</text>
  <rect x="220" y="314" width="60" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="250" y="330" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">H</text>
  <text x="250" y="348" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">中</text>
  <rect x="290" y="314" width="60" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="320" y="332" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">H</text>
  <rect x="360" y="314" width="60" height="40" fill="#fafafa" stroke="#aaa" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="390" y="332" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">.</text>

  <text x="250" y="372" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">中间 H 两侧都是 H → 无处放桶 → 返回 -1</text>
</svg>
