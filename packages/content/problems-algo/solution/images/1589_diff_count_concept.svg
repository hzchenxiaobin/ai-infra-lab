<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">差分统计查询频次 → 排序贪心配对（重排不等式）</text>

  <!-- 第一行：requests 区间示意 -->
  <text x="30" y="62" font-size="12" fill="#888">查询区间：</text>
  <text x="110" y="62" font-size="11" fill="#4a7a3a" font-weight="bold">[1,3]</text>
  <rect x="160" y="48" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="185" y="64" text-anchor="middle" font-size="10" fill="#d6a040">覆盖</text>
  <rect x="210" y="48" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="260" y="48" width="50" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="310" y="48" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>

  <text x="110" y="86" font-size="11" fill="#b85450" font-weight="bold">[0,1]</text>
  <rect x="160" y="72" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="210" y="72" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="260" y="72" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="310" y="72" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>

  <text x="185" y="110" text-anchor="middle" font-size="9" fill="#aaa">i=0</text>
  <text x="235" y="110" text-anchor="middle" font-size="9" fill="#aaa">i=1</text>
  <text x="285" y="110" text-anchor="middle" font-size="9" fill="#aaa">i=2</text>
  <text x="335" y="110" text-anchor="middle" font-size="9" fill="#aaa">i=3</text>
  <text x="385" y="110" text-anchor="middle" font-size="9" fill="#aaa">i=4</text>
  <rect x="360" y="72" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>

  <!-- arrow down to cnt -->
  <path d="M 280 118 L 280 138" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="132" font-size="10" fill="#446688">差分+前缀和</text>

  <!-- 第二行：cnt 频次 -->
  <text x="30" y="166" font-size="12" fill="#888">频次 cnt：</text>
  <rect x="160" y="148" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="185" y="168" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="210" y="148" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="235" y="168" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2</text>
  <rect x="260" y="148" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="285" y="168" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="310" y="148" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="335" y="168" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="360" y="148" width="50" height="30" fill="#f5f5f5" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3" rx="4" filter="url(#rough2)"/>
  <text x="385" y="168" text-anchor="middle" font-size="13" fill="#bbb">0</text>

  <text x="235" y="192" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">被覆盖两次，权重最高</text>

  <!-- arrow down to sort -->
  <path d="M 280 198 L 280 218" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="292" y="212" font-size="10" fill="#446688">排序</text>

  <!-- 第三行：排序后配对 -->
  <text x="30" y="248" font-size="12" fill="#888">nums↓：</text>
  <rect x="160" y="230" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="185" y="250" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">5</text>
  <rect x="210" y="230" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="235" y="250" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="260" y="230" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="285" y="250" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="310" y="230" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="335" y="250" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="360" y="230" width="50" height="30" fill="#f5f5f5" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3" rx="4" filter="url(#rough2)"/>
  <text x="385" y="250" text-anchor="middle" font-size="13" fill="#bbb">1</text>

  <text x="30" y="286" font-size="12" fill="#888">cnt↓：</text>
  <rect x="160" y="268" width="50" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="185" y="288" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2</text>
  <rect x="210" y="268" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="235" y="288" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="260" y="268" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="285" y="288" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="310" y="268" width="50" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="335" y="288" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="360" y="268" width="50" height="30" fill="#f5f5f5" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3" rx="4" filter="url(#rough2)"/>
  <text x="385" y="288" text-anchor="middle" font-size="13" fill="#bbb">0</text>

  <!-- 乘积行 -->
  <text x="30" y="324" font-size="12" fill="#888">乘积：</text>
  <text x="185" y="324" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">10</text>
  <text x="235" y="324" text-anchor="middle" font-size="12" fill="#333">4</text>
  <text x="285" y="324" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="335" y="324" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="385" y="324" text-anchor="middle" font-size="12" fill="#bbb">0</text>

  <!-- 总结框 -->
  <rect x="40" y="340" width="480" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="280" y="362" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">排序不等式：同序相乘 ≥ 乱序相乘 ≥ 反序相乘</text>
  <text x="280" y="380" text-anchor="middle" font-size="12" fill="#b85450">大数配大权重 → 加权和最大：ans = Σ nums↓[i] × cnt↓[i]</text>
</svg>
