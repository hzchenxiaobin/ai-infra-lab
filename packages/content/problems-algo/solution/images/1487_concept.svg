<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
    <marker id="arrGray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L7,4 L0,8 Z" fill="#999"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：哈希表记忆「下一个待试 k」，计数器单调推进</text>

  <!-- Incoming name -->
  <text x="60" y="68" font-size="11" fill="#888">输入 name</text>
  <rect x="48" y="78" width="92" height="38" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="94" y="103" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">"gta"</text>

  <!-- arrow incoming -> hashmap lookup -->
  <path d="M 140 97 L 196 97" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="168" y="88" text-anchor="middle" font-size="10" fill="#446688">查 d[name]</text>

  <!-- Hash map box -->
  <rect x="200" y="52" width="220" height="132" rx="8" fill="#ffffff" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="310" y="48" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold">哈希表 d（已分配名 → 待试 k）</text>

  <!-- map row: gta -> 2 (highlighted) -->
  <rect x="214" y="66" width="192" height="30" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="252" y="86" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">"gta"</text>
  <text x="312" y="86" text-anchor="middle" font-size="12" fill="#888">→</text>
  <text x="372" y="86" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold">2</text>

  <!-- map row: gta(1) -> 1 -->
  <rect x="214" y="100" width="192" height="28" rx="4" fill="#f4f6f8" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="266" y="119" text-anchor="middle" font-size="11.5" fill="#333">"gta(1)"</text>
  <text x="312" y="119" text-anchor="middle" font-size="11.5" fill="#888">→</text>
  <text x="368" y="119" text-anchor="middle" font-size="11.5" fill="#555">1</text>

  <!-- map row: gta(2) -> 1 -->
  <rect x="214" y="132" width="192" height="28" rx="4" fill="#f4f6f8" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="266" y="151" text-anchor="middle" font-size="11.5" fill="#333">"gta(2)"</text>
  <text x="312" y="151" text-anchor="middle" font-size="11.5" fill="#888">→</text>
  <text x="368" y="151" text-anchor="middle" font-size="11.5" fill="#555">1</text>

  <text x="310" y="174" text-anchor="middle" font-size="9.5" fill="#888">取 k = d["gta"] = 2，从 k=2 起试</text>

  <!-- Trial 1: gta(2) occupied -->
  <text x="48" y="222" font-size="11" fill="#888">试探</text>
  <rect x="48" y="232" width="118" height="34" rx="5" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="107" y="254" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">"gta(2)"</text>
  <text x="107" y="282" text-anchor="middle" font-size="10.5" fill="#b85450">在 d 中 → 占用 ✗</text>

  <!-- arrow trial1 -> k++ -->
  <path d="M 166 249 L 212 249" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="189" y="240" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">k++</text>

  <!-- Trial 2: gta(3) free -->
  <rect x="216" y="232" width="118" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="275" y="254" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">"gta(3)"</text>
  <text x="275" y="282" text-anchor="middle" font-size="10.5" fill="#4a7a3a">不在 d 中 → 空闲 ✓</text>

  <!-- arrow trial2 -> assign -->
  <path d="M 334 249 L 380 249" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Result -->
  <rect x="384" y="232" width="118" height="34" rx="5" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="443" y="254" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">分配 "gta(3)"</text>

  <!-- Two-step update box -->
  <rect x="48" y="306" width="504" height="78" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="300" y="328" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">找到空闲候选后：双更新（缺一不可）</text>
  <text x="300" y="350" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">① d["gta(3)"] = 1　　（候选名现在也被占用）</text>
  <text x="300" y="370" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">② d["gta"] = k + 1 = 4　（下次从 k=4 接着试，越过已占用段）</text>

  <!-- footer -->
  <text x="300" y="412" text-anchor="middle" font-size="10.5" fill="#888">计数器单调不减 → 每个被跳过的候选至多查一次 → 均摊 O(n)</text>
</svg>
