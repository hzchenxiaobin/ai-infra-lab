<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="640" height="480" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：JOIN+IN 解法逐步执行</text>

  <!-- ===== Step 1: Employee + Department input ===== -->
  <text x="120" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">输入 Employee</text>
  <rect x="40" y="62" width="160" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="58" y="77" font-size="9" fill="#333">id</text>
  <text x="88" y="77" font-size="9" fill="#333">name</text>
  <text x="128" y="77" font-size="9" fill="#333">salary</text>
  <text x="175" y="77" font-size="9" fill="#333">depId</text>
  <line x1="70" y1="62" x2="70" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="112" y1="62" x2="112" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="150" y1="62" x2="150" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="40" y="84" width="160" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="58" y="98" font-size="9" fill="#333">1</text>
  <text x="88" y="98" font-size="9" fill="#333">Joe</text>
  <text x="128" y="98" font-size="9" fill="#333">70000</text>
  <text x="175" y="98" font-size="9" fill="#333">1</text>
  <rect x="40" y="104" width="160" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="58" y="118" font-size="9" fill="#333">2</text>
  <text x="88" y="118" font-size="9" fill="#4a7a3a" font-weight="bold">Jim</text>
  <text x="128" y="118" font-size="9" fill="#4a7a3a" font-weight="bold">90000</text>
  <text x="175" y="118" font-size="9" fill="#333">1</text>
  <rect x="40" y="124" width="160" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="58" y="138" font-size="9" fill="#333">3</text>
  <text x="88" y="138" font-size="9" fill="#d6a040" font-weight="bold">Henry</text>
  <text x="128" y="138" font-size="9" fill="#d6a040" font-weight="bold">80000</text>
  <text x="175" y="138" font-size="9" fill="#333">2</text>
  <rect x="40" y="144" width="160" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="58" y="158" font-size="9" fill="#333">4</text>
  <text x="88" y="158" font-size="9" fill="#333">Sam</text>
  <text x="128" y="158" font-size="9" fill="#333">60000</text>
  <text x="175" y="158" font-size="9" fill="#333">2</text>
  <line x1="70" y1="84" x2="70" y2="164" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="112" y1="84" x2="112" y2="164" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="150" y1="84" x2="150" y2="164" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Department input -->
  <text x="465" y="56" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">输入 Department</text>
  <rect x="400" y="62" width="130" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="425" y="77" font-size="9" fill="#333">id</text>
  <text x="470" y="77" font-size="9" fill="#333">name</text>
  <line x1="445" y1="62" x2="445" y2="84" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="400" y="84" width="130" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="425" y="98" font-size="9" fill="#333">1</text>
  <text x="470" y="98" font-size="9" fill="#4a7a3a" font-weight="bold">IT</text>
  <rect x="400" y="104" width="130" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="425" y="118" font-size="9" fill="#333">2</text>
  <text x="470" y="118" font-size="9" fill="#d6a040" font-weight="bold">Sales</text>
  <line x1="445" y1="84" x2="445" y2="124" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Arrow step1 -> step2 -->
  <path d="M120 172 L120 198" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="170" y="190" font-size="10" fill="#b85450" font-weight="bold">① GROUP BY depId, MAX(salary)</text>

  <!-- ===== Step 2: subquery result ===== -->
  <text x="120" y="216" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">子查询：每部门最大工资</text>
  <rect x="40" y="222" width="160" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="78" y="237" font-size="9" fill="#333">departmentId</text>
  <text x="148" y="237" font-size="9" fill="#333">MAX(salary)</text>
  <line x1="110" y1="222" x2="110" y2="244" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="40" y="244" width="160" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="78" y="258" font-size="9" fill="#333">1</text>
  <text x="148" y="258" font-size="9" fill="#4a7a3a" font-weight="bold">90000</text>
  <rect x="40" y="264" width="160" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="78" y="278" font-size="9" fill="#333">2</text>
  <text x="148" y="278" font-size="9" fill="#d6a040" font-weight="bold">80000</text>
  <line x1="110" y1="244" x2="110" y2="284" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Arrow step2 -> step3 (right) -->
  <path d="M200 254 Q280 254 340 254" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="270" y="248" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">② JOIN Department</text>
  <text x="270" y="266" text-anchor="middle" font-size="9" fill="#888">+ 关联部门名</text>

  <!-- ===== Step 3: JOIN result (all 4 rows with dept name) ===== -->
  <text x="465" y="216" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">JOIN 后（4 行，附部门名）</text>
  <rect x="370" y="222" width="190" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="385" y="237" font-size="9" fill="#333">e.name</text>
  <text x="445" y="237" font-size="9" fill="#333">salary</text>
  <text x="495" y="237" font-size="9" fill="#333">d.name</text>
  <text x="545" y="237" font-size="8" fill="#333">depId</text>
  <line x1="420" y1="222" x2="420" y2="244" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="475" y1="222" x2="475" y2="244" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="530" y1="222" x2="530" y2="244" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="370" y="244" width="190" height="20" fill="#fff" stroke="#888" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="385" y="258" font-size="9" fill="#888">Joe</text>
  <text x="445" y="258" font-size="9" fill="#888">70000</text>
  <text x="495" y="258" font-size="9" fill="#888">IT</text>
  <text x="545" y="258" font-size="8" fill="#888">1</text>
  <rect x="370" y="264" width="190" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="385" y="278" font-size="9" fill="#4a7a3a" font-weight="bold">Jim</text>
  <text x="445" y="278" font-size="9" fill="#4a7a3a" font-weight="bold">90000</text>
  <text x="495" y="278" font-size="9" fill="#4a7a3a" font-weight="bold">IT</text>
  <text x="545" y="278" font-size="8" fill="#333">1</text>
  <rect x="370" y="284" width="190" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="385" y="298" font-size="9" fill="#d6a040" font-weight="bold">Henry</text>
  <text x="445" y="298" font-size="9" fill="#d6a040" font-weight="bold">80000</text>
  <text x="495" y="298" font-size="9" fill="#d6a040" font-weight="bold">Sales</text>
  <text x="545" y="298" font-size="8" fill="#333">2</text>
  <rect x="370" y="304" width="190" height="20" fill="#fff" stroke="#888" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="385" y="318" font-size="9" fill="#888">Sam</text>
  <text x="445" y="318" font-size="9" fill="#888">60000</text>
  <text x="495" y="318" font-size="9" fill="#888">Sales</text>
  <text x="545" y="318" font-size="8" fill="#888">2</text>
  <line x1="420" y1="244" x2="420" y2="324" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="475" y1="244" x2="475" y2="324" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="530" y1="244" x2="530" y2="324" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Arrow step3 -> step4 (down) -->
  <path d="M465 332 L465 358" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="555" y="350" font-size="10" fill="#b85450" font-weight="bold">③ WHERE (depId,salary) IN 子查询</text>

  <!-- ===== Step 4: IN filter verdict ===== -->
  <rect x="370" y="364" width="190" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="4,3" rx="6" filter="url(#rough2)"/>
  <text x="465" y="380" text-anchor="middle" font-size="9" fill="#333">逐行判定 (depId, salary) 是否 ∈ 子查询</text>
  <text x="385" y="396" font-size="9" fill="#888">Joe (1,70k): ∉ {(1,90k),(2,80k)}</text>
  <text x="385" y="410" font-size="9" fill="#4a7a3a" font-weight="bold">Jim (1,90k): ∈ ✓</text>
  <text x="385" y="424" font-size="9" fill="#d6a040" font-weight="bold">Henry (2,80k): ∈ ✓</text>

  <!-- Arrow to final result -->
  <path d="M200 274 Q150 360 200 410" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Final result -->
  <text x="120" y="386" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">最终输出</text>
  <rect x="40" y="392" width="160" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="65" y="407" font-size="9" fill="#333">Department</text>
  <text x="115" y="407" font-size="9" fill="#333">Employee</text>
  <text x="168" y="407" font-size="9" fill="#333">Salary</text>
  <line x1="92" y1="392" x2="92" y2="414" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="145" y1="392" x2="145" y2="414" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="40" y="414" width="160" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="65" y="428" font-size="9" fill="#4a7a3a" font-weight="bold">IT</text>
  <text x="115" y="428" font-size="9" fill="#4a7a3a" font-weight="bold">Jim</text>
  <text x="168" y="428" font-size="9" fill="#4a7a3a" font-weight="bold">90000</text>
  <rect x="40" y="434" width="160" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="65" y="448" font-size="9" fill="#d6a040" font-weight="bold">Sales</text>
  <text x="115" y="448" font-size="9" fill="#d6a040" font-weight="bold">Henry</text>
  <text x="168" y="448" font-size="9" fill="#d6a040" font-weight="bold">80000</text>
  <line x1="92" y1="414" x2="92" y2="454" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="145" y1="414" x2="145" y2="454" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="320" y="472" text-anchor="middle" font-size="9" fill="#888">Joe/Sam 因 (depId,salary) 不在子查询结果中被过滤；Jim/Henry 命中各自部门 MAX 保留</text>
</svg>
