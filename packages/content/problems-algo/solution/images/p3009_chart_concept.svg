<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">水平线可取任意实数高度：y = 1.5 时与折线图相交 5 次</text>

  <!-- optimal band (1,2) -->
  <rect x="62" y="190" width="378" height="80" fill="#fce4ec" opacity="0.35" filter="url(#rough2)"/>
  <text x="68" y="203" font-size="10" fill="#b85450" filter="url(#rough2)">最优高度带 (1, 2)</text>

  <!-- axes -->
  <path d="M 60 55 L 60 310" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 60 310 L 462 310" stroke="#999" stroke-width="1.6" filter="url(#rough2)"/>

  <!-- height gridlines -->
  <path d="M 56 110 L 440 110" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <path d="M 56 190 L 440 190" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <path d="M 56 270 L 440 270" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>
  <text x="50" y="114" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">3</text>
  <text x="50" y="194" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">2</text>
  <text x="50" y="274" text-anchor="end" font-size="11" fill="#888" filter="url(#rough2)">1</text>

  <!-- x labels -->
  <text x="80" y="328" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">0</text>
  <text x="135" y="328" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">1</text>
  <text x="190" y="328" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">2</text>
  <text x="245" y="328" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">3</text>
  <text x="300" y="328" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">4</text>
  <text x="355" y="328" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">5</text>
  <text x="410" y="328" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">6</text>

  <!-- horizontal line y = 1.5 -->
  <path d="M 60 230 L 462 230" stroke="#b85450" stroke-width="2" stroke-dasharray="7 5" filter="url(#rough2)"/>
  <text x="456" y="224" text-anchor="end" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">y = 1.5</text>

  <!-- polyline chart -->
  <path d="M 80 270 L 135 190 L 190 270 L 245 190 L 300 270 L 355 110 L 410 190" fill="none" stroke="#446688" stroke-width="2.5" stroke-linejoin="round" filter="url(#rough2)"/>

  <!-- vertices -->
  <circle cx="80" cy="270" r="4.5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="135" cy="190" r="4.5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="190" cy="270" r="4.5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="245" cy="190" r="4.5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="300" cy="270" r="4.5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="355" cy="110" r="4.5" fill="#446688" filter="url(#rough2)"/>
  <circle cx="410" cy="190" r="4.5" fill="#446688" filter="url(#rough2)"/>

  <!-- 5 intersections -->
  <circle cx="107.5" cy="230" r="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="162.5" cy="230" r="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="217.5" cy="230" r="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="272.5" cy="230" r="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="313.75" cy="230" r="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="107.5" y="252" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="162.5" y="252" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="217.5" y="252" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="272.5" y="252" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="313.75" y="252" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">5</text>

  <!-- bottom note -->
  <rect x="55" y="345" width="410" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="362" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">k 不压在任何顶点上时：交点数 = 跨越高度 k 的线段条数</text>
  <text x="260" y="379" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">每条线段 ⇔ 高度区间 [min, max]，问题 = 求被覆盖次数最多的高度</text>
</svg>
