<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：逐行更新 heights，每行求柱状图最大矩形</text>

  <!-- column headers -->
  <text x="60" y="42" font-size="11" fill="#888">矩阵本行</text>
  <text x="299" y="42" text-anchor="middle" font-size="11" fill="#888">heights（柱状图）</text>
  <text x="480" y="42" text-anchor="middle" font-size="11" fill="#888">本行最大矩形</text>

  <!-- ============ Row 0 : y0=46 baseline=116 heights=[1,0,1,0,0] area=1 ============ -->
  <text x="30" y="62" font-size="11" fill="#444">第 0 行</text>
  <rect x="90" y="50" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="101" y="66" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="112" y="50" width="22" height="22" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="123" y="66" text-anchor="middle" font-size="11" fill="#999">0</text>
  <rect x="134" y="50" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145" y="66" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="156" y="50" width="22" height="22" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="167" y="66" text-anchor="middle" font-size="11" fill="#999">0</text>
  <rect x="178" y="50" width="22" height="22" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="189" y="66" text-anchor="middle" font-size="11" fill="#999">0</text>
  <path d="M 206 61 L 226 61" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="228" y1="116" x2="372" y2="116" stroke="#7f8c8d" stroke-width="2" filter="url(#rough2)"/>
  <rect x="232" y="106" width="22" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="288" y="106" width="22" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="243" y="129" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="271" y="129" text-anchor="middle" font-size="9" fill="#bbb">0</text>
  <text x="299" y="129" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="327" y="129" text-anchor="middle" font-size="9" fill="#bbb">0</text>
  <text x="355" y="129" text-anchor="middle" font-size="9" fill="#bbb">0</text>
  <rect x="410" y="55" width="140" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="480" y="77" text-anchor="middle" font-size="12" fill="#444">area = 1</text>

  <!-- ============ Row 1 : y0=138 baseline=208 heights=[2,0,2,1,1] area=3 ============ -->
  <text x="30" y="154" font-size="11" fill="#444">第 1 行</text>
  <rect x="90" y="142" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="101" y="158" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="112" y="142" width="22" height="22" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="123" y="158" text-anchor="middle" font-size="11" fill="#999">0</text>
  <rect x="134" y="142" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145" y="158" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="156" y="142" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="167" y="158" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="178" y="142" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="189" y="158" text-anchor="middle" font-size="11" fill="#333">1</text>
  <path d="M 206 153 L 226 153" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="228" y1="208" x2="372" y2="208" stroke="#7f8c8d" stroke-width="2" filter="url(#rough2)"/>
  <rect x="232" y="188" width="22" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="288" y="188" width="22" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="316" y="198" width="22" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="344" y="198" width="22" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="243" y="221" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="271" y="221" text-anchor="middle" font-size="9" fill="#bbb">0</text>
  <text x="299" y="221" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="327" y="221" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="355" y="221" text-anchor="middle" font-size="9" fill="#888">1</text>
  <rect x="410" y="147" width="140" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="480" y="169" text-anchor="middle" font-size="12" fill="#444">area = 3</text>

  <!-- ============ Row 2 : y0=230 baseline=300 heights=[3,1,3,2,2] area=6 (answer) ============ -->
