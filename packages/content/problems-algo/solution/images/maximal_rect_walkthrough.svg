  <rect x="134" y="234" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145" y="250" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="156" y="234" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="167" y="250" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="178" y="234" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="189" y="250" text-anchor="middle" font-size="11" fill="#333">1</text>
  <path d="M 206 245 L 226 245" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="228" y1="300" x2="372" y2="300" stroke="#7f8c8d" stroke-width="2" filter="url(#rough2)"/>
  <rect x="232" y="270" width="22" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="260" y="290" width="22" height="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="288" y="270" width="22" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="316" y="280" width="22" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="344" y="280" width="22" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <!-- max rect highlight: h=2 spanning cols 2,3,4 -->
  <rect x="288" y="280" width="78" height="20" fill="#e6f4ea" fill-opacity="0.55" stroke="#4a7a3a" stroke-width="2.5" stroke-dasharray="5,3" filter="url(#rough2)"/>
  <text x="243" y="313" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="271" y="313" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="299" y="313" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="327" y="313" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="355" y="313" text-anchor="middle" font-size="9" fill="#888">2</text>
  <rect x="410" y="239" width="140" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="480" y="261" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">area = 6 ★</text>

  <!-- ============ Row 3 : y0=322 baseline=392 heights=[4,0,0,3,0] area=4 ============ -->
  <text x="30" y="338" font-size="11" fill="#444">第 3 行</text>
  <rect x="90" y="326" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="101" y="342" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="112" y="326" width="22" height="22" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="123" y="342" text-anchor="middle" font-size="11" fill="#999">0</text>
  <rect x="134" y="326" width="22" height="22" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="145" y="342" text-anchor="middle" font-size="11" fill="#999">0</text>
  <rect x="156" y="326" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="167" y="342" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="178" y="326" width="22" height="22" fill="#f0f0f0" stroke="#bbbbbb" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="189" y="342" text-anchor="middle" font-size="11" fill="#999">0</text>
  <path d="M 206 337 L 226 337" stroke="#666" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="228" y1="392" x2="372" y2="392" stroke="#7f8c8d" stroke-width="2" filter="url(#rough2)"/>
  <rect x="232" y="352" width="22" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <rect x="316" y="362" width="22" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="243" y="405" text-anchor="middle" font-size="9" fill="#888">4</text>
  <text x="271" y="405" text-anchor="middle" font-size="9" fill="#bbb">0</text>
  <text x="299" y="405" text-anchor="middle" font-size="9" fill="#bbb">0</text>
  <text x="327" y="405" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="355" y="405" text-anchor="middle" font-size="9" fill="#bbb">0</text>
  <rect x="410" y="331" width="140" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="480" y="353" text-anchor="middle" font-size="12" fill="#444">area = 4</text>

  <!-- bottom summary -->
  <rect x="40" y="424" width="520" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="442" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">maxArea = max(1, 3, 6, 4) = 6</text>
</svg>
