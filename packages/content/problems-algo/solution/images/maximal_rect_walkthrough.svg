  <rect x="90" y="234" width="22" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="101" y="250" text-anchor="middle" font-size="11" fill="#333">1</text>
