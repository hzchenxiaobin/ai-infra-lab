<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">示例逐行演算：8 行 → 删 2 行 → 留 6 行</text>

  <!-- table outer frame -->
  <rect x="30" y="56" width="540" height="312" rx="6" fill="#ffffff" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>

  <!-- header row -->
  <rect x="30" y="56" width="540" height="32" fill="#e8f0fe" stroke="none"/>
  <line x1="30" y1="88" x2="570" y2="88" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="85" y="77" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">order_id</text>
  <text x="195" y="77" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">customer_id</text>
  <text x="295" y="77" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">type</text>
  <text x="395" y="77" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">客户有type0?</text>
  <text x="510" y="77" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">决策</text>

  <!-- column dividers -->
  <line x1="140" y1="56" x2="140" y2="368" stroke="#446688" stroke-width="1" opacity="0.5" filter="url(#rough2)"/>
  <line x1="250" y1="56" x2="250" y2="368" stroke="#446688" stroke-width="1" opacity="0.5" filter="url(#rough2)"/>
  <line x1="340" y1="56" x2="340" y2="368" stroke="#446688" stroke-width="1" opacity="0.5" filter="url(#rough2)"/>
  <line x1="450" y1="56" x2="450" y2="368" stroke="#446688" stroke-width="1" opacity="0.5" filter="url(#rough2)"/>

  <!-- row separators at y = 88,122,156,190,224,258,292,326,360 (8 rows * 34) -->
  <line x1="30" y1="122" x2="570" y2="122" stroke="#446688" stroke-width="0.8" opacity="0.4" filter="url(#rough2)"/>
  <line x1="30" y1="156" x2="570" y2="156" stroke="#446688" stroke-width="0.8" opacity="0.4" filter="url(#rough2)"/>
  <line x1="30" y1="190" x2="570" y2="190" stroke="#446688" stroke-width="0.8" opacity="0.4" filter="url(#rough2)"/>
  <line x1="30" y1="224" x2="570" y2="224" stroke="#446688" stroke-width="0.8" opacity="0.4" filter="url(#rough2)"/>
  <line x1="30" y1="258" x2="570" y2="258" stroke="#446688" stroke-width="0.8" opacity="0.4" filter="url(#rough2)"/>
  <line x1="30" y1="292" x2="570" y2="292" stroke="#446688" stroke-width="0.8" opacity="0.4" filter="url(#rough2)"/>
  <line x1="30" y1="326" x2="570" y2="326" stroke="#446688" stroke-width="0.8" opacity="0.4" filter="url(#rough2)"/>

  <!-- dropped row tints: rows 4 (y=190-224) and 5 (y=224-258) -->
  <rect x="450" y="190" width="120" height="34" fill="#fce4ec" opacity="0.7"/>
  <rect x="450" y="224" width="120" height="34" fill="#fce4ec" opacity="0.7"/>

  <!-- row 1: 1,1,0,是,保留 -->
  <text x="85" y="111" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="195" y="111" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="295" y="111" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="395" y="111" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">是</text>
  <text x="510" y="111" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">保留</text>

  <!-- row 2: 2,1,0,是,保留 -->
  <text x="85" y="145" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="195" y="145" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="295" y="145" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="395" y="145" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">是</text>
  <text x="510" y="145" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">保留</text>

  <!-- row 3: 11,2,0,是,保留 -->
  <text x="85" y="179" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">11</text>
  <text x="195" y="179" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="295" y="179" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="395" y="179" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">是</text>
  <text x="510" y="179" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">保留</text>

  <!-- row 4: 12,2,1,是,删除 -->
  <text x="85" y="213" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">12</text>
  <text x="195" y="213" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">2</text>
  <text x="295" y="213" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">1</text>
  <text x="395" y="213" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">是</text>
  <text x="510" y="213" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">删除</text>

  <!-- row 5: 21,3,1,是,删除 -->
  <text x="85" y="247" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">21</text>
  <text x="195" y="247" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">3</text>
  <text x="295" y="247" text-anchor="middle" font-size="12" fill="#999" filter="url(#rough2)">1</text>
  <text x="395" y="247" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">是</text>
  <text x="510" y="247" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">删除</text>

  <!-- row 6: 22,3,0,是,保留 -->
  <text x="85" y="281" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">22</text>
  <text x="195" y="281" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="295" y="281" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0</text>
  <text x="395" y="281" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">是</text>
  <text x="510" y="281" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">保留</text>

  <!-- row 7: 31,4,1,否,保留 -->
  <text x="85" y="315" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">31</text>
  <text x="195" y="315" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="295" y="315" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="395" y="315" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">否</text>
  <text x="510" y="315" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">保留</text>

  <!-- row 8: 32,4,1,否,保留 -->
  <text x="85" y="349" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">32</text>
  <text x="195" y="349" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">4</text>
  <text x="295" y="349" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="395" y="349" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">否</text>
  <text x="510" y="349" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">保留</text>

  <!-- conclusion box -->
  <rect x="80" y="388" width="440" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="300" y="410" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">客户2、3 有类型0 → 各删一条类型1（order 12、21）</text>
  <text x="300" y="430" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">客户4 仅类型1 → 31、32 照留 → 最终 6 行</text>
</svg>
