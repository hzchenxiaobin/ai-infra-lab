<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a07830"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：一轮转换 = 26×26 转移矩阵乘一次计数向量</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">「谁给谁贡献拷贝」只由 nums 决定，与字符串内容无关 —— 整张规则表能压成一个矩阵</text>

  <rect x="24" y="56" width="152" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="100" y="76" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">a，nums[0]=3</text>
  <text x="100" y="94" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">a → "bcd"</text>
  <text x="100" y="108" text-anchor="middle" font-size="9.5" fill="#66788c" filter="url(#rough2)">后续 3 个连续字母</text>

  <rect x="188" y="56" width="152" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="264" y="76" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">y，nums[24]=3</text>
  <text x="264" y="94" text-anchor="middle" font-size="12" fill="#a07830" filter="url(#rough2)">y → "zab"</text>
  <text x="264" y="108" text-anchor="middle" font-size="9.5" fill="#a07830" font-weight="bold" filter="url(#rough2)">越过 z，绕回 a！</text>

  <rect x="352" y="56" width="152" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="428" y="76" text-anchor="middle" font-size="11" fill="#8a3833" font-weight="bold" filter="url(#rough2)">z，nums[25]=2</text>
  <text x="428" y="94" text-anchor="middle" font-size="12" fill="#8a3833" filter="url(#rough2)">z → "ab"</text>
  <text x="428" y="108" text-anchor="middle" font-size="9.5" fill="#8a3833" filter="url(#rough2)">回绕让矩阵不再稀疏</text>

  <text x="260" y="140" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">规则固定 ⇒ 一轮转移是固定线性映射：cnt′ = M · cnt，跑 t 轮就是 M^t</text>

  <text x="64" y="160" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">转移矩阵 M（示例 1 的 nums：全 1、z=2）</text>
  <text x="67" y="166" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">a</text>
  <text x="242" y="166" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">z</text>
  <text x="70" y="173" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">a</text>
  <text x="70" y="351" text-anchor="middle" font-size="8" fill="#888" filter="url(#rough2)">z</text>
  <rect x="64" y="168" width="182" height="182" fill="#f4f7fb" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <rect x="64" y="175" width="7" height="7" fill="#cde8d2" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>
  <rect x="71" y="182" width="7" height="7" fill="#cde8d2" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>
  <rect x="78" y="189" width="7" height="7" fill="#cde8d2" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>
  <rect x="85" y="196" width="7" height="7" fill="#cde8d2" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>
  <rect x="92" y="203" width="7" height="7" fill="#cde8d2" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>
  <rect x="99" y="210" width="7" height="7" fill="#cde8d2" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>
  <rect x="106" y="217" width="7" height="7" fill="#cde8d2" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>
  <rect x="113" y="224" width="7" height="7" fill="#cde8d2" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>
  <rect x="120" y="231" width="7" height="7" fill="#cde8d2" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>
  <rect x="127" y="238" width="7" height="7" fill="#cde8d2" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>
  <rect x="134" y="245" width="7" height="7" fill="#cde8d2" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>
  <rect x="141" y="252" width="7" height="7" fill="#cde8d2" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>
  <rect x="148" y="259" width="7" height="7" fill="#cde8d2" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>
  <rect x="155" y="266" width="7" height="7" fill="#cde8d2" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>
  <rect x="162" y="273" width="7" height="7" fill="#cde8d2" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>
  <rect x="169" y="280" width="7" height="7" fill="#cde8d2" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>
  <rect x="176" y="287" width="7" height="7" fill="#cde8d2" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>
  <rect x="183" y="294" width="7" height="7" fill="#cde8d2" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>
  <rect x="190" y="301" width="7" height="7" fill="#cde8d2" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>
  <rect x="197" y="308" width="7" height="7" fill="#cde8d2" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>
  <rect x="204" y="315" width="7" height="7" fill="#cde8d2" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>
  <rect x="211" y="322" width="7" height="7" fill="#cde8d2" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>
  <rect x="218" y="329" width="7" height="7" fill="#cde8d2" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>
  <rect x="225" y="336" width="7" height="7" fill="#cde8d2" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>
  <rect x="232" y="343" width="7" height="7" fill="#cde8d2" stroke="#4a7a3a" stroke-width="0.5" filter="url(#rough2)"/>
  <rect x="239" y="168" width="7" height="7" fill="#f3c6ad" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>
  <rect x="239" y="175" width="7" height="7" fill="#f3c6ad" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <path d="M 256 210 L 306 210" fill="none" stroke="#a07830" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="281" y="202" text-anchor="middle" font-size="9.5" fill="#a07830" filter="url(#rough2)">看两眼</text>

  <rect x="272" y="222" width="232" height="112" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <rect x="284" y="234" width="12" height="12" fill="#cde8d2" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="302" y="244" font-size="10.5" fill="#555" filter="url(#rough2)">M[j][i]=1：源 i 的展开盖住目标 j</text>
  <rect x="284" y="254" width="12" height="12" fill="#f3c6ad" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="302" y="264" font-size="10.5" fill="#555" filter="url(#rough2)">z 列的 1 绕回顶部 a、b 两行</text>
  <text x="284" y="286" font-size="10.5" fill="#555" filter="url(#rough2)">· 行 = 目标，列 = 源；每列恰 nums[i] 个 1</text>
  <text x="284" y="304" font-size="10.5" fill="#555" filter="url(#rough2)">· 跑 t 轮：cnt_t = M^t · cnt_0（列向量）</text>
  <text x="284" y="322" font-size="10.5" fill="#555" filter="url(#rough2)">· 其余格子全 0；t ≤ 1e9 → 矩阵快速幂</text>

  <rect x="272" y="344" width="232" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="388" y="360" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">ans = Σ cnt_t[i] mod (1e9+7)</text>
  <text x="388" y="378" text-anchor="middle" font-size="10" fill="#2f5d24" filter="url(#rough2)">复杂度 O(n + 26³ log t) ≈ 5×10⁵ 次乘加</text>
</svg>
