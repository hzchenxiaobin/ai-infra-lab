<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#446688"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">Alice 必胜的两个充分条件</text>

  <!-- ===== Chalkboard with numbers ===== -->
  <text x="60" y="62" font-size="11" fill="#446688" font-weight="bold">黑板 nums</text>
  <rect x="58" y="48" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="80" y="67" text-anchor="middle" font-size="12" fill="#333">a₁</text>
  <rect x="106" y="48" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="128" y="67" text-anchor="middle" font-size="12" fill="#333">a₂</text>
  <rect x="154" y="48" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="176" y="67" text-anchor="middle" font-size="12" fill="#333">…</text>
  <rect x="202" y="48" width="44" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="224" y="67" text-anchor="middle" font-size="12" fill="#333">aₙ</text>

  <!-- global XOR bracket -->
  <path d="M 56 44 L 52 44 L 52 80 L 56 80" stroke="#888" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="262" y="67" font-size="12" fill="#d6a040" font-weight="bold">S = a₁ ⊕ a₂ ⊕ … ⊕ aₙ</text>

  <!-- ===== Decision diamond: S == 0 ? ===== -->
  <path d="M 290 100 L 360 130 L 290 160 L 220 130 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="290" y="126" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">S == 0 ?</text>
  <text x="290" y="140" text-anchor="middle" font-size="10" fill="#888">(开局即判)</text>

  <!-- Branch YES (left): immediate win -->
  <path d="M 220 130 L 110 130" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="165" y="122" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="34" y="150" width="152" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="110" y="170" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">① 轮到 Alice 时</text>
  <text x="110" y="184" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">XOR 已为 0 → 胜！</text>

  <!-- Branch NO (right): check parity of n -->
  <path d="M 360 130 L 470 130" stroke="#446688" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="415" y="122" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">否 (S≠0)</text>
  <path d="M 470 100 L 540 130 L 470 160 L 400 130 Z" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="470" y="126" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">n 奇偶?</text>
  <text x="470" y="140" text-anchor="middle" font-size="10" fill="#888">(还需走子)</text>

  <!-- Parity EVEN (right-down): Alice wins -->
  <path d="M 540 130 L 540 190" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="566" y="165" font-size="10" fill="#4a7a3a" font-weight="bold">偶数</text>
  <rect x="424" y="196" width="232" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="540" y="216" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">② n 为偶数 → Alice 必胜</text>
  <text x="540" y="234" text-anchor="middle" font-size="10" fill="#444">总能找到一子擦除后余下 XOR≠0</text>

  <!-- Parity ODD (left-down): Alice loses -->
  <path d="M 400 130 L 290 190" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="320" y="165" font-size="10" fill="#b85450" font-weight="bold">奇数</text>
  <rect x="224" y="196" width="190" height="50" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="319" y="216" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">③ n 为奇数 → Alice 必败</text>
  <text x="319" y="234" text-anchor="middle" font-size="10" fill="#444">无论如何擦都会输(见证明)</text>

  <!-- ===== Bottom one-liner ===== -->
  <rect x="40" y="266" width="500" height="62" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="288" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">一句话结论</text>
  <text x="290" y="308" text-anchor="middle" font-size="11" fill="#444">Alice 胜 ⟺ S == 0  或  n % 2 == 0</text>
  <text x="290" y="322" text-anchor="middle" font-size="10" fill="#888">即 xorGame = (全异或==0) or (len(nums) 偶)</text>

  <!-- footer -->
  <text x="290" y="356" text-anchor="middle" font-size="10" fill="#999">S≠0 且 n 偶时，必存在 aᵢ≠S 使擦除后余下 XOR≠0（否则全等于 S ⇒ n 偶 ⇒ S=0 矛盾）</text>
</svg>
