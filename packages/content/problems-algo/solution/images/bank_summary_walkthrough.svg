<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="580" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：3 笔交易 → UNION ALL → 分组求和</text>

  <!-- ===== Left: Transactions table ===== -->
  <text x="170" y="54" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">Transactions（3 笔）</text>
  <rect x="60" y="62" width="220" height="22" fill="#b85450" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="77" text-anchor="middle" font-size="9" fill="white" font-weight="bold">trans_id</text>
  <text x="155" y="77" text-anchor="middle" font-size="9" fill="white" font-weight="bold">paid_by</text>
  <text x="210" y="77" text-anchor="middle" font-size="9" fill="white" font-weight="bold">paid_to</text>
  <text x="260" y="77" text-anchor="middle" font-size="9" fill="white" font-weight="bold">amount</text>

  <rect x="60" y="84" width="220" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="100" y="98" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="155" y="98" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">1</text>
  <text x="210" y="98" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">3</text>
  <text x="260" y="98" text-anchor="middle" font-size="9" fill="#333">400</text>

  <rect x="60" y="104" width="220" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="100" y="118" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="155" y="118" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">3</text>
  <text x="210" y="118" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">2</text>
  <text x="260" y="118" text-anchor="middle" font-size="9" fill="#333">500</text>

  <rect x="60" y="124" width="220" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="100" y="138" text-anchor="middle" font-size="9" fill="#333">3</text>
  <text x="155" y="138" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">2</text>
  <text x="210" y="138" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">1</text>
  <text x="260" y="138" text-anchor="middle" font-size="9" fill="#333">200</text>

  <!-- arrow to UNION ALL result -->
  <path d="M 280 110 L 318 110" stroke="#666" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)" fill="none"/>

  <!-- ===== Right: UNION ALL delta stream ===== -->
  <text x="440" y="54" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">UNION ALL 流水 (user_id, delta)</text>
  <rect x="324" y="62" width="232" height="22" fill="#d6a040" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="77" text-anchor="middle" font-size="9" fill="white" font-weight="bold">来源</text>
  <text x="465" y="77" text-anchor="middle" font-size="9" fill="white" font-weight="bold">user_id</text>
  <text x="528" y="77" text-anchor="middle" font-size="9" fill="white" font-weight="bold">delta</text>

  <!-- paid_by rows (red) -->
  <rect x="324" y="84" width="232" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="380" y="96" text-anchor="middle" font-size="8" fill="#b85450">paid_by</text>
  <text x="465" y="96" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="528" y="96" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">−400</text>

  <rect x="324" y="102" width="232" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="380" y="114" text-anchor="middle" font-size="8" fill="#b85450">paid_by</text>
  <text x="465" y="114" text-anchor="middle" font-size="9" fill="#333">3</text>
  <text x="528" y="114" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">−500</text>

  <rect x="324" y="120" width="232" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="380" y="132" text-anchor="middle" font-size="8" fill="#b85450">paid_by</text>
  <text x="465" y="132" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="528" y="132" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">−200</text>

  <!-- paid_to rows (blue) -->
  <rect x="324" y="138" width="232" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="380" y="150" text-anchor="middle" font-size="8" fill="#446688">paid_to</text>
  <text x="465" y="150" text-anchor="middle" font-size="9" fill="#333">3</text>
  <text x="528" y="150" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">+400</text>

  <rect x="324" y="156" width="232" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="380" y="168" text-anchor="middle" font-size="8" fill="#446688">paid_to</text>
  <text x="465" y="168" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="528" y="168" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">+500</text>

  <rect x="324" y="174" width="232" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="380" y="186" text-anchor="middle" font-size="8" fill="#446688">paid_to</text>
  <text x="465" y="186" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="528" y="186" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">+200</text>

  <!-- Users initial credit rows (green) -->
  <rect x="324" y="192" width="232" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="380" y="204" text-anchor="middle" font-size="8" fill="#4a7a3a">Users</text>
  <text x="465" y="204" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="528" y="204" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">+100</text>

  <rect x="324" y="210" width="232" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="380" y="222" text-anchor="middle" font-size="8" fill="#4a7a3a">Users</text>
  <text x="465" y="222" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="528" y="222" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">+200</text>

  <rect x="324" y="228" width="232" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="380" y="240" text-anchor="middle" font-size="8" fill="#4a7a3a">Users</text>
  <text x="465" y="240" text-anchor="middle" font-size="9" fill="#333">3</text>
  <text x="528" y="240" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">+10000</text>

  <rect x="324" y="246" width="232" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="380" y="258" text-anchor="middle" font-size="8" fill="#4a7a3a">Users</text>
  <text x="465" y="258" text-anchor="middle" font-size="9" fill="#333">4</text>
  <text x="528" y="258" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">+800</text>

  <!-- arrow down to SUM result -->
  <path d="M 440 268 L 440 286" stroke="#666" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)" fill="none"/>
  <text x="470" y="280" text-anchor="start" font-size="10" fill="#666" font-weight="bold">GROUP BY + SUM</text>

  <!-- ===== Bottom: Final result table ===== -->
  <rect x="60" y="290" width="460" height="22" fill="#446688" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="305" text-anchor="middle" font-size="9" fill="white" font-weight="bold">user_id</text>
  <text x="200" y="305" text-anchor="middle" font-size="9" fill="white" font-weight="bold">user_name</text>
  <text x="330" y="305" text-anchor="middle" font-size="9" fill="white" font-weight="bold">credit(计算过程)</text>
  <text x="490" y="305" text-anchor="middle" font-size="9" fill="white" font-weight="bold">breached</text>

  <rect x="60" y="312" width="460" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="110" y="326" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="200" y="326" text-anchor="middle" font-size="9" fill="#333">Moustafa</text>
  <text x="330" y="326" text-anchor="middle" font-size="9" fill="#333">100 − 400 + 200 = −100</text>
  <text x="490" y="326" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">Yes</text>

  <rect x="60" y="334" width="460" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="110" y="348" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="200" y="348" text-anchor="middle" font-size="9" fill="#333">Jonathan</text>
  <text x="330" y="348" text-anchor="middle" font-size="9" fill="#333">200 + 500 − 200 = 500</text>
  <text x="490" y="348" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">No</text>

  <rect x="60" y="356" width="460" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="110" y="370" text-anchor="middle" font-size="9" fill="#333">3</text>
  <text x="200" y="370" text-anchor="middle" font-size="9" fill="#333">Winston</text>
  <text x="330" y="370" text-anchor="middle" font-size="9" fill="#333">10000 + 400 − 500 = 9900</text>
  <text x="490" y="370" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">No</text>

  <rect x="60" y="378" width="460" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="110" y="392" text-anchor="middle" font-size="9" fill="#333">4</text>
  <text x="200" y="392" text-anchor="middle" font-size="9" fill="#333">Luis</text>
  <text x="330" y="392" text-anchor="middle" font-size="9" fill="#333">800（无交易）</text>
  <text x="490" y="392" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">No</text>

  <!-- ===== Bottom note ===== -->
  <rect x="40" y="412" width="500" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="430" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">Moustafa 透支：初始 100 − 支出 400 + 收入 200 = −100 &lt; 0 → Yes</text>
  <text x="290" y="445" text-anchor="middle" font-size="10" fill="#666">Luis 无交易记录，仅 Users 贡献一行，余额 = 初始额度 800</text>
</svg>
