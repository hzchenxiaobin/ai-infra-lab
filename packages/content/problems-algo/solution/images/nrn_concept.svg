<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心概念：同层最紧邻的右侧节点</text>

  <!-- Tree -->
  <!-- Level 0: root = 1 -->
  <circle cx="250" cy="70" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="250" y="74" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>

  <!-- Level 1: 2, 3 -->
  <line x1="240" y1="82" x2="170" y2="118" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <line x1="260" y1="82" x2="330" y2="118" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <circle cx="170" cy="130" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="170" y="134" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <circle cx="330" cy="130" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="330" y="134" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>

  <!-- Level 2: 4 (under 2-right), 5 (under 3-left), 6 (under 3-right) -->
  <line x1="180" y1="142" x2="200" y2="178" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="320" y1="142" x2="290" y2="178" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="340" y1="142" x2="380" y2="178" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- Node 4 = u (highlighted red) -->
  <circle cx="210" cy="190" r="15" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="210" y="194" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <text x="210" y="222" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">u = 4</text>

  <!-- Node 5 = answer (highlighted green) -->
  <circle cx="290" cy="190" r="15" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="290" y="194" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">5</text>
  <text x="290" y="222" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">answer</text>

  <!-- Node 6 -->
  <circle cx="380" cy="190" r="15" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="380" y="194" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>

  <!-- Arrow from u to answer -->
  <path d="M 228 190 L 272 190" stroke="#b85450" stroke-width="2" stroke-dasharray="5,3" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="250" y="182" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">最近右侧</text>

  <!-- Level indicator -->
  <text x="50" y="74" font-size="10" fill="#999">L0</text>
  <text x="50" y="134" font-size="10" fill="#999">L1</text>
  <text x="50" y="194" font-size="10" fill="#999">L2</text>
  <line x1="60" y1="70" x2="60" y2="190" stroke="#ddd" stroke-width="1" stroke-dasharray="2,3" filter="url(#rough2)"/>

  <!-- BFS queue at L2 -->
  <rect x="40" y="250" width="500" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="272" font-size="12" fill="#333" font-weight="bold">BFS 队列（L2 层从左到右）</text>
  <rect x="80" y="280" width="48" height="22" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="104" y="296" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <rect x="130" y="280" width="48" height="22" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="154" y="296" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">5</text>
  <rect x="180" y="280" width="48" height="22" rx="4" fill="#fff" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
  <text x="204" y="296" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">6</text>
  <path d="M 128 291 L 130 291" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="250" y="296" font-size="10" fill="#555">弹出 4 = u → 下一个就是 5</text>

  <!-- Explanation box -->
  <rect x="40" y="320" width="500" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="60" y="342" font-size="12" fill="#333" font-weight="bold">核心：层序遍历 BFS，找到 u 后取同层下一个节点</text>
  <text x="60" y="360" font-size="11" fill="#555">• BFS 按层从左到右处理，同层节点在队列中相邻</text>
  <text x="60" y="376" font-size="11" fill="#555">• 遇到 u 时，队首即 u 的最近右侧节点</text>
  <text x="60" y="392" font-size="11" fill="#555">• 若 u 是本层最后一个 → 返回 null</text>
</svg>
