<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 412"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="412" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">算法流程：空隙离散化 + 前缀/后缀最大值，一次线性扫描</text>

  <!-- 右上说明框 -->
  <g filter="url(#rough2)">
    <rect x="392" y="44" width="120" height="86" fill="#ffffff" stroke="#9db4c9" stroke-width="1.4" stroke-dasharray="5 3" rx="10"/>
    <text x="452" y="62" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#33506b">best 为何排除</text>
    <text x="452" y="76" text-anchor="middle" font-size="9.5" fill="#55677d">g[i] 与 g[i+1]？</text>
    <text x="452" y="92" text-anchor="middle" font-size="9.5" fill="#55677d">搬进自己两侧</text>
    <text x="452" y="106" text-anchor="middle" font-size="9.5" fill="#55677d">= 贴边平移</text>
    <text x="452" y="122" text-anchor="middle" font-size="9" fill="#8f3a35">（不会更优）</text>
  </g>

  <!-- 主干 -->
  <g filter="url(#rough2)">
    <rect x="140" y="36" width="240" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="260" y="56" text-anchor="middle" font-size="11" font-weight="bold" fill="#33506b">① 求出全部 n+1 个空隙 g[0..n]</text>
    <text x="260" y="72" text-anchor="middle" font-size="8.5" fill="#55677d">g[i] = st[i] − et[i−1]（首尾接 0 与 eventTime）</text>
  </g>
  <path d="M 260 82 L 260 92" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="140" y="92" width="240" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="260" y="109" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#33506b">② 预处理 pre[] / suf[]，ans ← max(g)</text>
    <text x="260" y="124" text-anchor="middle" font-size="8.5" fill="#55677d">pre[i]=max(g[0..i−1])，suf[i]=max(g[i..n])</text>
  </g>
  <path d="M 260 134 L 260 144" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="160" y="144" width="200" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="260" y="162" text-anchor="middle" font-size="11" font-weight="bold" fill="#33506b">③ 枚举要搬走的会议 i = 0 … n−1</text>
  </g>
  <path d="M 260 172 L 260 182" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <g filter="url(#rough2)">
    <rect x="125" y="182" width="270" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8"/>
    <text x="260" y="199" text-anchor="middle" font-size="10" font-weight="bold" fill="#33506b">④ d = et[i]−st[i]，best = max(pre[i], suf[i+2])</text>
    <text x="260" y="215" text-anchor="middle" font-size="9" fill="#55677d">best = i 左右两侧以外的最大空隙</text>
  </g>
  <path d="M 260 224 L 260 234" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定菱形 -->
  <g filter="url(#rough2)">
    <path d="M 260 290 L 160 262 L 260 234 L 360 262 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3"/>
    <text x="260" y="266" text-anchor="middle" font-size="11" font-weight="bold" fill="#8a6d1f">best ≥ d ?</text>
  </g>

  <!-- 是 → 整体搬走 -->
  <path d="M 360 262 L 384 262" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="372" y="254" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <g filter="url(#rough2)">
    <rect x="388" y="238" width="126" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="451" y="255" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2f5d24">整体搬入别处</text>
    <text x="451" y="270" text-anchor="middle" font-size="8.5" fill="#2f5d24">ans ← max(ans,</text>
    <text x="451" y="281" text-anchor="middle" font-size="8.5" fill="#2f5d24">g[i] + d + g[i+1])</text>
  </g>

  <!-- 否 → 贴边平移 -->
  <path d="M 260 290 L 260 304" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="268" y="300" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <g filter="url(#rough2)">
    <rect x="196" y="308" width="128" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8"/>
    <text x="260" y="324" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450">只能贴边平移</text>
    <text x="260" y="341" text-anchor="middle" font-size="8.5" fill="#8f3a35">ans ← max(ans, g[i]+g[i+1])</text>
  </g>

  <!-- 两分支汇合 -->
  <path d="M 451 286 L 451 364 L 264 364" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 260 352 L 260 360" fill="none" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <circle cx="260" cy="364" r="3.5" fill="#33506b" filter="url(#rough2)"/>

  <!-- 回环：下一个 i -->
  <path d="M 260 364 L 30 364 L 30 158 L 152 158" fill="none" stroke="#446688" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="95" y="357" font-size="9" fill="#33506b" filter="url(#rough2)">下一个 i（回 ③）</text>

  <!-- 输出 -->
  <path d="M 260 364 L 260 376" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="373" font-size="8.5" fill="#55677d" filter="url(#rough2)">全部处理完</text>
  <g filter="url(#rough2)">
    <rect x="175" y="378" width="170" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8"/>
    <text x="260" y="396" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f5d24">⑤ 返回 ans</text>
  </g>
  <g filter="url(#rough2)">
    <rect x="40" y="376" width="112" height="24" fill="#ffffff" stroke="#9db4c9" stroke-width="1.4" stroke-dasharray="5 3" rx="8"/>
    <text x="96" y="392" text-anchor="middle" font-size="9" fill="#55677d">时间/空间均 O(n)</text>
  </g>
</svg>
