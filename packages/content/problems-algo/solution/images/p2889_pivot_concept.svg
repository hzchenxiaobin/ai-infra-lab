  <text x="330" y="128" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">index='month' → 行</text>
  <text x="330" y="150" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">columns='city' → 列</text>
  <text x="330" y="172" text-anchor="middle" font-size="9.5" fill="#333" filter="url(#rough2)">values='temperature' → 格</text>
  <text x="330" y="198" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">(month, city) 是二维坐标</text>
  <text x="330" y="214" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">每个坐标定位一格填值</text>

