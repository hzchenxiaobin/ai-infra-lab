<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：从 k 出发，每步选较大的一侧扩展</text>

  <!-- Start box -->
  <rect x="120" y="46" width="300" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">初始化 l = r = k,  minVal = nums[k],  ans = minVal</text>

  <path d="M 270 80 L 270 96" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: multi-case expand direction -->
  <rect x="80" y="100" width="380" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="120" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">选择扩展方向（取较大的一侧）</text>
  <line x1="100" y1="126" x2="440" y2="126" stroke="#d6a040" stroke-width="0.8" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="270" y="142" text-anchor="middle" font-size="10" fill="#333">l == 0        →  r++（向右扩展）</text>
  <text x="270" y="158" text-anchor="middle" font-size="10" fill="#333">r == n-1      →  l--（向左扩展）</text>
  <text x="270" y="174" text-anchor="middle" font-size="10" fill="#333">nums[l-1] &gt; nums[r+1]  →  l--（向左扩展）</text>
  <text x="270" y="190" text-anchor="middle" font-size="10" fill="#333">否则            →  r++（向右扩展）</text>
  <text x="270" y="204" text-anchor="middle" font-size="9" fill="#888">↑ 前两条处理边界，第三条是贪心核心：选较大的一侧</text>

  <path d="M 270 210 L 270 226" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Update box -->
  <rect x="80" y="230" width="380" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="252" text-anchor="middle" font-size="11" fill="#333">minVal = min(minVal, nums[新端点])</text>
  <text x="270" y="272" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans = max(ans, minVal × (r − l + 1))</text>

  <path d="M 270 286 L 270 302" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Loop check -->
  <polygon points="270,306 390,342 270,378 150,342" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="338" text-anchor="middle" font-size="11" fill="#333">l &gt; 0 或</text>
  <text x="270" y="354" text-anchor="middle" font-size="11" fill="#333">r &lt; n−1 ?</text>

  <!-- Yes: loop back -->
  <path d="M 150 342 L 60 342 L 60 155 L 80 155" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="50" y="250" text-anchor="middle" font-size="10" fill="#4a7a3a" transform="rotate(-90 50 250)">是 → 继续扩展</text>

  <!-- No: return -->
  <path d="M 390 342 L 430 342" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="334" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <rect x="430" y="326" width="100" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="480" y="348" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 ans</text>

  <!-- Bottom note -->
  <text x="270" y="410" text-anchor="middle" font-size="10" fill="#888">每步 O(1)，共 n−1 步 → 总时间 O(n)，空间 O(1)</text>
  <text x="270" y="426" text-anchor="middle" font-size="10" fill="#888">minVal 单调不增，ans 在"地板 × 宽度"的权衡中取最大值</text>
</svg>
