<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：已知参考日星期 → 累加间隔天数 → 对 7 取余映射</text>

  <!-- Timeline: left anchor (reference date) -->
  <rect x="30" y="50" width="150" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="105" y="72" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1971-01-01</text>
  <text x="105" y="90" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">Friday (星期五)</text>
  <text x="105" y="104" text-anchor="middle" font-size="10" fill="#888">参考日 elapsed = 0</text>

  <!-- Arrow with label -->
  <path d="M 182 78 L 396 78" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arr)" stroke-dasharray="6,3" filter="url(#rough2)"/>
  <text x="290" y="66" text-anchor="middle" font-size="11" fill="#888">elapsed days（间隔天数）</text>

  <!-- Timeline: right anchor (target date) -->
  <rect x="400" y="50" width="150" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="475" y="72" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">year-M-D</text>
  <text x="475" y="90" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">weekday[elapsed%7]</text>
  <text x="475" y="104" text-anchor="middle" font-size="10" fill="#888">目标日期</text>

  <!-- Breakdown formula -->
  <rect x="40" y="120" width="500" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="290" y="140" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">elapsed = 完整年天数 + 当年第几天 − 1</text>
  <text x="290" y="160" text-anchor="middle" font-size="10" fill="#555">= [(year−1971)×365 + leap_count] + [prefix[M−1] + D − 1 + 闰年修正]</text>

  <!-- Weekday mapping table label -->
  <text x="290" y="198" text-anchor="middle" font-size="11" fill="#888">weekday 映射表（以 Friday 为 0，因参考日是星期五）</text>

  <!-- 7 cells: 0→Fri, 1→Sat, 2→Sun, 3→Mon, 4→Tue, 5→Wed, 6→Thu -->
  <rect x="65" y="208" width="62" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="96" y="225" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="96" y="242" text-anchor="middle" font-size="10" fill="#555">Friday</text>

  <rect x="132" y="208" width="62" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="163" y="225" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">1</text>
  <text x="163" y="242" text-anchor="middle" font-size="10" fill="#555">Saturday</text>

  <rect x="199" y="208" width="62" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="230" y="225" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">2</text>
  <text x="230" y="242" text-anchor="middle" font-size="10" fill="#555">Sunday</text>

  <rect x="266" y="208" width="62" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="297" y="225" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">3</text>
  <text x="297" y="242" text-anchor="middle" font-size="10" fill="#555">Monday</text>

  <rect x="333" y="208" width="62" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="364" y="225" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">4</text>
  <text x="364" y="242" text-anchor="middle" font-size="10" fill="#555">Tuesday</text>

  <rect x="400" y="208" width="62" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="431" y="225" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">5</text>
  <text x="431" y="242" text-anchor="middle" font-size="10" fill="#555">Wednes.</text>

  <rect x="467" y="208" width="62" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="498" y="225" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">6</text>
  <text x="498" y="242" text-anchor="middle" font-size="10" fill="#555">Thursday</text>

  <!-- Core idea box -->
  <rect x="40" y="264" width="500" height="102" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="290" y="288" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold">核心直觉：星期以 7 天为周期循环</text>
  <text x="290" y="308" text-anchor="middle" font-size="11" fill="#555">已知某日的星期 → 两日间隔天数对 7 取余 → 余数即星期偏移量</text>
  <text x="290" y="328" text-anchor="middle" font-size="11" fill="#555">间隔天数 = 完整年天数（闰年计数公式）+ 当年第几天（复用 1154 前缀和）</text>
  <text x="290" y="348" text-anchor="middle" font-size="11" fill="#b85450">⚠️「−1」将年内第几天（1-indexed）转为间隔天数（0-indexed from Jan 1）</text>
</svg>
