<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="420" fill="#fafafa"/>

  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：已坐学生将座位划分为三类区间，各区间的最优座位与距离不同</text>

  <!-- index labels -->
  <text x="70" y="62" font-size="10" fill="#888">下标</text>
  <rect x="100" y="48" width="44" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="122" y="63" text-anchor="middle" font-size="10" fill="#888">0</text>
  <rect x="144" y="48" width="44" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="166" y="63" text-anchor="middle" font-size="10" fill="#888">1</text>
  <rect x="188" y="48" width="44" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="210" y="63" text-anchor="middle" font-size="10" fill="#888">2</text>
  <rect x="232" y="48" width="44" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="254" y="63" text-anchor="middle" font-size="10" fill="#888">3</text>
  <rect x="276" y="48" width="44" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="298" y="63" text-anchor="middle" font-size="10" fill="#888">4</text>
  <rect x="320" y="48" width="44" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="342" y="63" text-anchor="middle" font-size="10" fill="#888">5</text>
  <rect x="364" y="48" width="44" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="386" y="63" text-anchor="middle" font-size="10" fill="#888">6</text>
  <rect x="408" y="48" width="44" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="430" y="63" text-anchor="middle" font-size="10" fill="#888">7</text>
  <rect x="452" y="48" width="44" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="474" y="63" text-anchor="middle" font-size="10" fill="#888">8</text>
  <rect x="496" y="48" width="44" height="22" fill="#f5f5f5" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="518" y="63" text-anchor="middle" font-size="10" fill="#888">9</text>

  <!-- seat row: students at 2 and 7 -->
  <text x="70" y="108" font-size="11" fill="#888">座位</text>
  <rect x="100" y="88" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="109" text-anchor="middle" font-size="13" fill="#333">□</text>
  <rect x="144" y="88" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="166" y="109" text-anchor="middle" font-size="13" fill="#333">□</text>
  <rect x="188" y="88" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="109" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">人</text>
  <rect x="232" y="88" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="254" y="109" text-anchor="middle" font-size="13" fill="#333">□</text>
  <rect x="276" y="88" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="298" y="109" text-anchor="middle" font-size="13" fill="#333">□</text>
  <rect x="320" y="88" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="342" y="109" text-anchor="middle" font-size="13" fill="#333">□</text>
  <rect x="364" y="88" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="386" y="109" text-anchor="middle" font-size="13" fill="#333">□</text>
  <rect x="408" y="88" width="44" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="109" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">人</text>
  <rect x="452" y="88" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="474" y="109" text-anchor="middle" font-size="13" fill="#333">□</text>
  <rect x="496" y="88" width="44" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="518" y="109" text-anchor="middle" font-size="13" fill="#333">□</text>

  <!-- Left boundary interval: 0 to 2 (before first student) -->
  <path d="M 100 128 L 100 138 L 188 138 L 188 128" stroke="#4a7a3a" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="144" y="156" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">左端区间</text>
  <rect x="76" y="166" width="136" height="50" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="144" y="184" text-anchor="middle" font-size="11" fill="#333">最优座 = 0（贴墙）</text>
  <text x="144" y="200" text-anchor="middle" font-size="11" fill="#333">距离 = first</text>
  <text x="144" y="214" text-anchor="middle" font-size="10" fill="#888">此例：距离 = 2</text>

  <!-- Internal interval: 2 to 7 -->
  <path d="M 188 128 L 188 138 L 408 138 L 408 128" stroke="#d6a040" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="298" y="156" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">中间区间 (a, b)</text>
  <rect x="220" y="166" width="156" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="298" y="184" text-anchor="middle" font-size="11" fill="#333">最优座 = (a+b)÷2</text>
  <text x="298" y="200" text-anchor="middle" font-size="11" fill="#333">距离 = (b−a)÷2</text>
  <text x="298" y="214" text-anchor="middle" font-size="10" fill="#888">此例：(2+7)÷2=4, 距离=2</text>

  <!-- Right boundary interval: 7 to 9 -->
  <path d="M 408 128 L 408 138 L 540 138 L 540 128" stroke="#446688" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="474" y="156" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">右端区间</text>
  <rect x="388" y="166" width="172" height="50" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="474" y="184" text-anchor="middle" font-size="11" fill="#333">最优座 = N−1（贴墙）</text>
  <text x="474" y="200" text-anchor="middle" font-size="11" fill="#333">距离 = N−1−last</text>
  <text x="474" y="214" text-anchor="middle" font-size="10" fill="#888">此例：距离 = 9−7 = 2</text>

  <!-- Best seat markers -->
  <path d="M 122 80 L 118 70 L 126 70 z" fill="#4a7a3a" filter="url(#rough2)"/>
  <path d="M 298 80 L 294 70 L 302 70 z" fill="#d6a040" filter="url(#rough2)"/>
  <path d="M 518 80 L 514 70 L 522 70 z" fill="#446688" filter="url(#rough2)"/>

  <!-- comparison note -->
  <rect x="40" y="232" width="520" height="68" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="252" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">距离比较：左端距离 = first · 中间距离 = (b−a)÷2 · 右端距离 = N−1−last</text>
  <text x="300" y="270" text-anchor="middle" font-size="11" fill="#444">取最大距离对应的座位；距离相同时取最小编号（从左到右遍历，严格 &gt; 即可保证）</text>
  <text x="300" y="286" text-anchor="middle" font-size="11" fill="#b85450">⚠️ 贴墙距离 = 全段长度，中间距离 = 半段长度 → 同样间距下贴墙更优</text>

  <!-- data structure note -->
  <rect x="40" y="312" width="520" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="332" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">数据结构：有序集合维护已坐学生位置</text>
  <text x="300" y="350" text-anchor="middle" font-size="11" fill="#444">C++ std::set&lt;int&gt; / Python bisect + 有序列表</text>
  <text x="300" y="366" text-anchor="middle" font-size="11" fill="#444">seat()：遍历所有相邻对 (prev, curr) 算各区间距离，取最大 → O(P)</text>
  <text x="300" y="382" text-anchor="middle" font-size="11" fill="#444">leave(p)：从集合中删除 p → O(log P)（C++）/ O(P)（Python 列表）</text>
  <text x="300" y="398" text-anchor="middle" font-size="10" fill="#888">P = 当前已坐学生数，最多 10⁴ → O(P²) ≈ 10⁸ 可接受</text>
</svg>
