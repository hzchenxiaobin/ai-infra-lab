<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="660" height="380" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">
    空隙内切点位置枚举（[0,1,0,0,1]）
  </text>

  <!-- ============ Row 1: cut right after first 1 ============ -->
  <text x="30" y="62" font-size="12" fill="#888" filter="url(#rough2)">① 切在 1 之后：</text>
  <!-- group A -->
  <rect x="150" y="44" width="62" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="181" y="68" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0,1</text>
  <!-- cut mark -->
  <path d="M 214 40 L 214 84" stroke="#b85450" stroke-width="2.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="214" y="98" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✂</text>
  <!-- group B -->
  <rect x="222" y="44" width="124" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="284" y="68" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0,0,1</text>

  <!-- ============ Row 2: cut in the middle ============ -->
  <text x="30" y="142" font-size="12" fill="#888" filter="url(#rough2)">② 切在中间 0 后：</text>
  <rect x="150" y="124" width="92" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="196" y="148" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0,1,0</text>
  <path d="M 244 120 L 244 164" stroke="#b85450" stroke-width="2.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="244" y="178" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✂</text>
  <rect x="252" y="124" width="94" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="299" y="148" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0,1</text>

  <!-- ============ Row 3: cut right before second 1 ============ -->
  <text x="30" y="222" font-size="12" fill="#888" filter="url(#rough2)">③ 切在 1 之前：</text>
  <rect x="150" y="204" width="124" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="212" y="228" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">0,1,0,0</text>
  <path d="M 276 200 L 276 244" stroke="#b85450" stroke-width="2.5" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="276" y="258" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">✂</text>
  <rect x="284" y="204" width="62" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="315" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">1</text>

  <!-- Each group has exactly one 1 annotation -->
  <text x="400" y="68" font-size="11" fill="#4a7a3a" filter="url(#rough2)">→ 每段恰含一个 1 ✓</text>
  <text x="400" y="148" font-size="11" fill="#4a7a3a" filter="url(#rough2)">→ 每段恰含一个 1 ✓</text>
  <text x="400" y="228" font-size="11" fill="#4a7a3a" filter="url(#rough2)">→ 每段恰含一个 1 ✓</text>

  <!-- Summary box -->
  <rect x="40" y="284" width="580" height="74" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="330" y="308" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">
    两 1 之间有 k 个 0 → 切点可选位置 = k + 1 = (p₂ − p₁)
  </text>
  <text x="330" y="330" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">
    关键：每个 0「跟着前一个 1 的段」或「跟着后一个 1 的段」
  </text>
  <text x="330" y="350" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">
    k 个 0 各自二选一 → 但需成段连续，故切点位置即段分界，共 k+1 处
  </text>
</svg>
