<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心概念：整套存放——先装满 prime 套组，余量再装 not_prime 套组</text>

  <rect x="40" y="42" width="232" height="116" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="156" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">一套 prime_eligible（每样各 1 件）</text>
  <rect x="50" y="68" width="68" height="18" fill="#fafafa" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="84" y="81" text-anchor="middle" font-size="8" fill="#555" filter="url(#rough2)">Watch 68</text>
  <rect x="124" y="68" width="68" height="18" fill="#fafafa" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="158" y="81" text-anchor="middle" font-size="8" fill="#555" filter="url(#rough2)">Soft 325</text>
  <rect x="198" y="68" width="68" height="18" fill="#fafafa" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="232" y="81" text-anchor="middle" font-size="8" fill="#555" filter="url(#rough2)">Sci 85</text>
  <rect x="50" y="90" width="68" height="18" fill="#fafafa" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="84" y="103" text-anchor="middle" font-size="8" fill="#555" filter="url(#rough2)">Beauty 8.5</text>
  <rect x="124" y="90" width="68" height="18" fill="#fafafa" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="158" y="103" text-anchor="middle" font-size="8" fill="#555" filter="url(#rough2)">Furn 55.5</text>
  <rect x="198" y="90" width="68" height="18" fill="#fafafa" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="232" y="103" text-anchor="middle" font-size="8" fill="#555" filter="url(#rough2)">Food 13.2</text>
  <text x="156" y="140" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">Σ 面积 S_p = 555.20 sq ft</text>

  <rect x="288" y="42" width="232" height="116" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="404" y="60" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">一套 not_prime（每样各 1 件）</text>
  <rect x="300" y="68" width="72" height="18" fill="#fafafa" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="336" y="81" text-anchor="middle" font-size="8" fill="#555" filter="url(#rough2)">Art 26.4</text>
  <rect x="382" y="68" width="72" height="18" fill="#fafafa" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="418" y="81" text-anchor="middle" font-size="8" fill="#555" filter="url(#rough2)">Cloth 64.5</text>
  <rect x="300" y="90" width="72" height="18" fill="#fafafa" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="336" y="103" text-anchor="middle" font-size="8" fill="#555" filter="url(#rough2)">Shoes 15</text>
  <rect x="382" y="90" width="72" height="18" fill="#fafafa" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="418" y="103" text-anchor="middle" font-size="8" fill="#555" filter="url(#rough2)">Furn 22.6</text>
  <text x="404" y="140" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">Σ 面积 S_n = 128.50 sq ft</text>

  <text x="280" y="180" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">prime 套数 k₁ = ⌊500 000 ÷ 555.2⌋ = 900 套 → 件数 = 6 × 900 = 5400</text>
  <text x="280" y="200" text-anchor="middle" font-size="11" fill="#8a6d1a" filter="url(#rough2)">余量 = 500 000 mod 555.2 = 320 sq ft（prime 实占 900 × 555.2 = 499 680）</text>

  <rect x="40" y="214" width="480" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="234" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">prime 整套 × 900 → 499 680 sq ft（5400 件）</text>
  <path d="M 466 214 l 4 6 l -6 4 l 6 5 l -6 5 l 4 6 l -6 4" stroke="#999" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <rect x="474" y="214" width="46" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="497" y="234" text-anchor="middle" font-size="9" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">余 320</text>
  <text x="280" y="260" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">仓库总容量 500 000 sq ft（示意图，非按比例）</text>

  <rect x="40" y="270" width="480" height="64" fill="#fafafa" stroke="#d6a040" stroke-width="1.5" stroke-dasharray="5 3" rx="8" filter="url(#rough2)"/>
  <text x="280" y="288" text-anchor="middle" font-size="10" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">把余量 320 全部留给 not_prime：</text>
  <rect x="54" y="294" width="300" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="204" y="312" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">not_prime 整套 × 2 = 257 sq ft → 件数 = 4 × 2 = 8</text>
  <rect x="362" y="294" width="60" height="28" fill="#f0f0f0" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="392" y="312" text-anchor="middle" font-size="9" fill="#777" filter="url(#rough2)">闲置 63</text>

  <path d="M 497 246 L 497 266" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="90" y="350" width="380" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="373" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">输出（按 item_count 降序）：prime_eligible 5400 ｜ not_prime 8</text>
</svg>
