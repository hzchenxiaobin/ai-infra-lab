<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">三种操作流程：统一「定位首个重叠区间」</text>

  <rect x="36" y="38" width="488" height="158" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="52" y="58" font-size="12.5" fill="#446688" font-weight="bold">addRange(left, right) — 并集，合并相邻</text>

  <rect x="70" y="68" width="420" height="22" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="83" text-anchor="middle" font-size="10.5" fill="#333">① it = upper_bound(left)  // 首个 key &gt; left</text>
  <path d="M 280 92 L 280 100" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="102" width="420" height="22" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="117" text-anchor="middle" font-size="10.5" fill="#333">② prev(it).r ≥ left ? it ← prev(it) : 不动  // 左相邻/重叠才回退</text>
  <path d="M 280 126 L 280 134" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="136" width="420" height="22" fill="#ffffff" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="151" text-anchor="middle" font-size="10.5" fill="#333">③ 扫描 it.l ≤ right：newL=min, newR=max，收集 it.l 待删</text>
  <path d="M 280 160 L 280 168" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="170" width="420" height="22" fill="#fff8e1" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="280" y="185" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">④ 删旧键；ranges[newL] = newR</text>

  <rect x="36" y="208" width="488" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="52" y="228" font-size="12.5" fill="#4a7a3a" font-weight="bold">queryRange(left, right) — 包含判定</text>

  <rect x="70" y="238" width="420" height="22" fill="#ffffff" stroke="#4a7a3a" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="253" text-anchor="middle" font-size="10.5" fill="#333">① it = upper_bound(left)；若 it == begin() → return false</text>
  <path d="M 280 262 L 280 270" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="272" width="420" height="22" fill="#fff8e1" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="280" y="287" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">② it = prev(it)；return it.r ≥ right</text>

  <rect x="36" y="312" width="488" height="148" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="52" y="332" font-size="12.5" fill="#d6a040" font-weight="bold">removeRange(left, right) — 差集，只动严格重叠</text>

  <rect x="70" y="342" width="420" height="22" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="357" text-anchor="middle" font-size="10.5" fill="#333">① it = upper_bound(left)</text>
  <path d="M 280 366 L 280 374" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="376" width="420" height="22" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="391" text-anchor="middle" font-size="10.5" fill="#333">② prev(it).r &gt; left ? it ← prev(it) : 不动  // 严格重叠，相邻不算</text>
  <path d="M 280 400 L 280 408" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="410" width="420" height="22" fill="#ffffff" stroke="#d6a040" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="280" y="425" text-anchor="middle" font-size="10.5" fill="#333">③ 扫描 it.l &lt; right：l&lt;left 保留 [l,left)；r&gt;right 保留 [right,r)</text>
  <path d="M 280 434 L 280 442" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="70" y="444" width="420" height="22" fill="#fce4ec" stroke="#d6a040" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="280" y="459" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">④ 删旧键；插入切分片段</text>
</svg>
