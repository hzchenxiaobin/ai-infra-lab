<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#b85450" stroke-width="1.8"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#446688" stroke-width="1.8"/>
    </marker>
  </defs>

  <rect width="560" height="430" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    核心观察：rev(s) 中的相邻对 = s 中相邻对的镜像
  </text>

  <!-- Section A: leetcode / edocteel -->
  <text x="76" y="72" font-size="13" fill="#446688" filter="url(#rough2)">s =</text>
  <!-- s = leetcode -->
  <g font-size="15" fill="#333" text-anchor="middle">
    <rect x="106" y="52" width="34" height="34" rx="4" fill="#fff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="140" y="52" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
    <rect x="174" y="52" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
    <rect x="208" y="52" width="34" height="34" rx="4" fill="#fff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="242" y="52" width="34" height="34" rx="4" fill="#fff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="276" y="52" width="34" height="34" rx="4" fill="#fff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="310" y="52" width="34" height="34" rx="4" fill="#fff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="344" y="52" width="34" height="34" rx="4" fill="#fff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="123" y="74" filter="url(#rough2)">l</text>
    <text x="157" y="74" filter="url(#rough2)">e</text>
    <text x="191" y="74" filter="url(#rough2)">e</text>
    <text x="225" y="74" filter="url(#rough2)">t</text>
    <text x="259" y="74" filter="url(#rough2)">c</text>
    <text x="293" y="74" filter="url(#rough2)">o</text>
    <text x="327" y="74" filter="url(#rough2)">d</text>
    <text x="361" y="74" filter="url(#rough2)">e</text>
  </g>
  <text x="191" y="104" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">"ee"：回文对，自镜像</text>

  <!-- rev = edocteel -->
  <text x="58" y="140" font-size="13" fill="#446688" filter="url(#rough2)">rev(s) =</text>
  <g font-size="15" fill="#333" text-anchor="middle">
    <rect x="106" y="122" width="34" height="34" rx="4" fill="#fff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="140" y="122" width="34" height="34" rx="4" fill="#fff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="174" y="122" width="34" height="34" rx="4" fill="#fff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="208" y="122" width="34" height="34" rx="4" fill="#fff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="242" y="122" width="34" height="34" rx="4" fill="#fff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="276" y="122" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
    <rect x="310" y="122" width="34" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
    <rect x="344" y="122" width="34" height="34" rx="4" fill="#fff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
    <text x="123" y="144" filter="url(#rough2)">e</text>
    <text x="157" y="144" filter="url(#rough2)">d</text>
    <text x="191" y="144" filter="url(#rough2)">o</text>
    <text x="225" y="144" filter="url(#rough2)">c</text>
    <text x="259" y="144" filter="url(#rough2)">t</text>
    <text x="293" y="144" filter="url(#rough2)">e</text>
    <text x="327" y="144" filter="url(#rough2)">e</text>
    <text x="361" y="144" filter="url(#rough2)">l</text>
  </g>
  <!-- curved arrow from s "ee" down to rev "ee" -->
  <path d="M 200 88 C 230 108, 250 110, 288 120" fill="none" stroke="#b85450"
        stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="258" y="108" font-size="12" fill="#b85450" filter="url(#rough2)">s 中有 "ee" ⟹ rev 中必有 "ee"</text>

  <!-- Section B: abcba mirror pairs -->
  <text x="70" y="196" font-size="13" fill="#446688" filter="url(#rough2)">再看 s =</text>
  <g font-size="15" fill="#333" text-anchor="middle">
    <rect x="126" y="180" width="34" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
    <rect x="160" y="180" width="34" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
    <rect x="194" y="180" width="34" height="34" rx="4" fill="#fff" stroke="#999" stroke-width="1.5" filter="url(#rough2)"/>
    <rect x="228" y="180" width="34" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
    <rect x="262" y="180" width="34" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
    <text x="143" y="202" filter="url(#rough2)">a</text>
    <text x="177" y="202" filter="url(#rough2)">b</text>
    <text x="211" y="202" filter="url(#rough2)">c</text>
    <text x="245" y="202" filter="url(#rough2)">b</text>
    <text x="279" y="202" filter="url(#rough2)">a</text>
  </g>
  <!-- crossing mirror arrows -->
  <path d="M 152 222 C 190 252, 240 252, 262 224" fill="none" stroke="#446688"
        stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <path d="M 262 222 C 240 252, 190 252, 152 224" fill="none" stroke="#446688"
        stroke-width="1.8" marker-end="url(#arrb)" filter="url(#rough2)"/>
  <text x="207" y="266" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">"ab" 与 "ba" 互为镜像，同时出现在 s 中</text>
  <text x="420" y="200" font-size="12" fill="#666" filter="url(#rough2)">（"bc"/"cb"
  </text>
  <text x="420" y="216" font-size="12" fill="#666" filter="url(#rough2)">  也互为镜像）</text>

  <!-- conclusion box -->
  <rect x="40" y="292" width="480" height="110" rx="10" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="322" font-size="13" fill="#333" filter="url(#rough2)">
    因为 r[j]·r[j+1] = s[n−1−j]·s[n−2−j]，所以：
  </text>
  <text x="60" y="348" font-size="14" fill="#b85450" font-weight="bold" filter="url(#rough2)">
    "ab" 是 rev(s) 的子串  ⟺  "ba" 是 s 的子串
  </text>
  <text x="60" y="376" font-size="13" fill="#333" filter="url(#rough2)">
    ⟹ 不必真造反转串：s 的相邻对集合中同时出现 "ab" 与 "ba" 即为答案
  </text>
</svg>
