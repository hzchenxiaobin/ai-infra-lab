<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 490" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="580" height="490" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "abaccdc"，K = 3，求至多 3 种字符的最长子串</text>

  <text x="40" y="52" font-size="11" fill="#888">下标:</text>
  <text x="122" y="52" font-size="11" fill="#888" font-weight="bold">0</text>
  <text x="166" y="52" font-size="11" fill="#888" font-weight="bold">1</text>
  <text x="210" y="52" font-size="11" fill="#888" font-weight="bold">2</text>
  <text x="254" y="52" font-size="11" fill="#888" font-weight="bold">3</text>
  <text x="298" y="52" font-size="11" fill="#888" font-weight="bold">4</text>
  <text x="342" y="52" font-size="11" fill="#888" font-weight="bold">5</text>
  <text x="386" y="52" font-size="11" fill="#888" font-weight="bold">6</text>

  <!-- char cells: a b a c c d c -->
  <rect x="100" y="58" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="122" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="144" y="58" width="44" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="166" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">b</text>
  <rect x="188" y="58" width="44" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">a</text>
  <rect x="232" y="58" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="254" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">c</text>
  <rect x="276" y="58" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="298" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">c</text>
  <rect x="320" y="58" width="44" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="342" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">d</text>
  <rect x="364" y="58" width="44" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="386" y="80" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">c</text>

  <!-- Steps table header -->
  <text x="20" y="118" font-size="12" fill="#444" font-weight="bold">步骤</text>
  <text x="70" y="118" font-size="12" fill="#444" font-weight="bold">right</text>
  <text x="120" y="118" font-size="12" fill="#444" font-weight="bold">字符</text>
  <text x="165" y="118" font-size="12" fill="#444" font-weight="bold">动作</text>
  <text x="320" y="118" font-size="12" fill="#444" font-weight="bold">freq（种类）</text>
  <text x="465" y="118" font-size="12" fill="#444" font-weight="bold">窗口</text>
  <text x="540" y="118" font-size="12" fill="#444" font-weight="bold">max</text>

  <line x1="14" y1="124" x2="560" y2="124" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Step 1: right=0 a -->
  <text x="20" y="144" font-size="11" fill="#333">1</text>
  <text x="70" y="144" font-size="11" fill="#333">0</text>
  <text x="120" y="144" font-size="11" fill="#333" font-weight="bold">a</text>
  <text x="165" y="144" font-size="11" fill="#82b366">入窗，种类 1 ≤ 3</text>
  <text x="320" y="144" font-size="11" fill="#4a7a3a" font-weight="bold">{a:1}（1）</text>
  <text x="465" y="144" font-size="11" fill="#4a7a3a" font-weight="bold">[a]</text>
  <text x="540" y="144" font-size="11" fill="#333" font-weight="bold">1</text>

  <!-- Step 2: right=1 b -->
  <text x="20" y="164" font-size="11" fill="#333">2</text>
  <text x="70" y="164" font-size="11" fill="#333">1</text>
  <text x="120" y="164" font-size="11" fill="#333" font-weight="bold">b</text>
  <text x="165" y="164" font-size="11" fill="#82b366">入窗，种类 2 ≤ 3</text>
  <text x="320" y="164" font-size="11" fill="#4a7a3a" font-weight="bold">{a:1,b:1}（2）</text>
  <text x="465" y="164" font-size="11" fill="#4a7a3a" font-weight="bold">[a,b]</text>
  <text x="540" y="164" font-size="11" fill="#333" font-weight="bold">2</text>

  <!-- Step 3: right=2 a -->
  <text x="20" y="184" font-size="11" fill="#333">3</text>
  <text x="70" y="184" font-size="11" fill="#333">2</text>
  <text x="120" y="184" font-size="11" fill="#333" font-weight="bold">a</text>
  <text x="165" y="184" font-size="11" fill="#82b366">a 已在窗，种类 2</text>
  <text x="320" y="184" font-size="11" fill="#4a7a3a" font-weight="bold">{a:2,b:1}（2）</text>
  <text x="465" y="184" font-size="11" fill="#4a7a3a" font-weight="bold">[a,b,a]</text>
  <text x="540" y="184" font-size="11" fill="#333" font-weight="bold">3</text>

  <!-- Step 4: right=3 c -->
  <text x="20" y="204" font-size="11" fill="#333">4</text>
  <text x="70" y="204" font-size="11" fill="#333">3</text>
  <text x="120" y="204" font-size="11" fill="#333" font-weight="bold">c</text>
  <text x="165" y="204" font-size="11" fill="#82b366">入窗，种类 3 ≤ 3</text>
  <text x="320" y="204" font-size="11" fill="#4a7a3a" font-weight="bold">{a:2,b:1,c:1}（3）</text>
  <text x="465" y="204" font-size="11" fill="#4a7a3a" font-weight="bold">[a,b,a,c]</text>
  <text x="540" y="204" font-size="11" fill="#333" font-weight="bold">4</text>

  <!-- Step 5: right=4 c -->
  <text x="20" y="224" font-size="11" fill="#333">5</text>
  <text x="70" y="224" font-size="11" fill="#333">4</text>
  <text x="120" y="224" font-size="11" fill="#333" font-weight="bold">c</text>
  <text x="165" y="224" font-size="11" fill="#82b366">c 已在窗，种类 3</text>
  <text x="320" y="224" font-size="11" fill="#4a7a3a" font-weight="bold">{a:2,b:1,c:2}（3）</text>
  <text x="465" y="224" font-size="11" fill="#4a7a3a" font-weight="bold">[a,b,a,c,c]</text>
  <text x="540" y="224" font-size="11" fill="#333" font-weight="bold">5 ⭐</text>

  <!-- Step 6: right=5 d, distinct=4 > 3 -->
  <text x="20" y="246" font-size="11" fill="#333">6</text>
  <text x="70" y="246" font-size="11" fill="#333">5</text>
  <text x="120" y="246" font-size="11" fill="#333" font-weight="bold">d</text>
  <text x="165" y="246" font-size="11" fill="#b85450">入窗，种类 4 &gt; 3!</text>
  <text x="320" y="246" font-size="11" fill="#b85450" font-weight="bold">{a:2,b:1,c:2,d:1}（4）</text>
  <text x="465" y="246" font-size="11" fill="#d6a040" font-weight="bold">需收缩</text>
  <text x="540" y="246" font-size="11" fill="#333">5</text>

  <!-- Step 6': shrink left=0, remove a -->
  <text x="20" y="266" font-size="10" fill="#888">6'</text>
  <text x="70" y="266" font-size="10" fill="#888">—</text>
  <text x="120" y="266" font-size="10" fill="#888">—</text>
  <text x="165" y="266" font-size="10" fill="#b85450">left=0 移 a→1，仍 4 种</text>
  <text x="320" y="266" font-size="10" fill="#b85450">{a:1,b:1,c:2,d:1}（4）</text>
  <text x="465" y="266" font-size="10" fill="#d6a040">left→1</text>
  <text x="540" y="266" font-size="10" fill="#888">5</text>

  <!-- Step 6'': shrink left=1, remove b -->
  <text x="20" y="286" font-size="10" fill="#888">6''</text>
  <text x="70" y="286" font-size="10" fill="#888">—</text>
  <text x="120" y="286" font-size="10" fill="#888">—</text>
  <text x="165" y="286" font-size="10" fill="#82b366">left=1 移 b→0，种类 3 ✓</text>
  <text x="320" y="286" font-size="10" fill="#4a7a3a">{a:1,c:2,d:1}（3）</text>
  <text x="465" y="286" font-size="10" fill="#4a7a3a" font-weight="bold">[a,c,c,d]</text>
  <text x="540" y="286" font-size="10" fill="#888">5</text>

  <!-- Step 7: right=6 c -->
  <text x="20" y="308" font-size="11" fill="#333">7</text>
  <text x="70" y="308" font-size="11" fill="#333">6</text>
  <text x="120" y="308" font-size="11" fill="#333" font-weight="bold">c</text>
  <text x="165" y="308" font-size="11" fill="#82b366">c 已在窗，种类 3</text>
  <text x="320" y="308" font-size="11" fill="#4a7a3a" font-weight="bold">{a:1,c:3,d:1}（3）</text>
  <text x="465" y="308" font-size="11" fill="#4a7a3a" font-weight="bold">[a,c,c,d,c]</text>
  <text x="540" y="308" font-size="11" fill="#333" font-weight="bold">5</text>

  <!-- result box -->
  <rect x="60" y="330" width="460" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="290" y="352" text-anchor="middle" font-size="13" fill="#444" font-weight="bold">答案 = 5，最长子串 "abacc"（0-4）或 "accdc"（2-6）</text>
  <text x="290" y="372" text-anchor="middle" font-size="11" fill="#888">left、right 各至多移动 n 次 → 整体 O(n)</text>

  <!-- legend -->
  <rect x="60" y="406" width="14" height="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="80" y="417" font-size="11" fill="#555">入窗/收缩成功</text>
  <rect x="190" y="406" width="14" height="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="210" y="417" font-size="11" fill="#555">种类超限触发收缩</text>
  <rect x="340" y="406" width="14" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="360" y="417" font-size="11" fill="#555">中间收缩步</text>
  <text x="460" y="417" font-size="11" fill="#888">⭐ = 全局最大</text>

  <!-- color = char mapping note -->
  <text x="290" y="448" text-anchor="middle" font-size="10" fill="#888">字符配色：a 蓝 / b 绿 / c 橙 / d 红 —— 同色即同种字符</text>
</svg>
