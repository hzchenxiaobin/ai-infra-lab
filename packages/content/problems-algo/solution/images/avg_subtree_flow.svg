<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">后序 DFS 流程：dfs(node) 返回 (sum, count)，命中则 ans++</text>

  <!-- 入口 -->
  <rect x="210" y="44" width="140" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="12" fill="#333">调用 dfs(node)</text>

  <!-- 判空 菱形 -->
  <path d="M 280 80 L 350 110 L 280 140 L 210 110 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="114" text-anchor="middle" font-size="11" fill="#333">node == null?</text>
  <path d="M 280 72 L 280 80" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 是 → return (0,0) -->
  <path d="M 350 110 L 430 110" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="370" y="102" font-size="10" fill="#4a7a3a">是</text>
  <rect x="430" y="96" width="110" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="485" y="114" text-anchor="middle" font-size="11" fill="#333">return (0, 0)</text>

  <!-- 否 → 递归 -->
  <path d="M 210 110 L 150 110" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="170" y="102" font-size="10" fill="#b85450">否</text>

  <rect x="60" y="96" width="90" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="105" y="114" text-anchor="middle" font-size="11" fill="#333">递归左右</text>
  <text x="105" y="140" text-anchor="middle" font-size="9" fill="#888">(lSum,lCnt)/(rSum,rCnt)</text>

  <path d="M 105 124 L 105 150 L 280 150 L 280 165" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 聚合 sum / cnt -->
  <rect x="170" y="165" width="220" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="280" y="184" text-anchor="middle" font-size="11" fill="#333">聚合当前子树</text>
  <text x="280" y="200" text-anchor="middle" font-size="10" fill="#555">sum = val + lSum + rSum</text>

  <path d="M 280 209 L 280 225" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 判定 菱形 -->
  <path d="M 280 225 L 380 260 L 280 295 L 180 260 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="256" text-anchor="middle" font-size="10" fill="#333">sum / cnt == val?</text>
  <text x="280" y="270" text-anchor="middle" font-size="9" fill="#888">(向下取整)</text>

  <!-- 是 → ans++ -->
  <path d="M 280 295 L 280 315" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="290" y="310" font-size="10" fill="#4a7a3a">是</text>

  <rect x="200" y="315" width="160" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="335" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">ans++; return (sum, cnt)</text>

  <!-- 否 → 直接 return -->
  <path d="M 380 260 L 460 260" stroke="#666" stroke-width="1.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="252" font-size="10" fill="#b85450">否</text>
  <rect x="460" y="246" width="90" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="505" y="264" text-anchor="middle" font-size="10" fill="#333">return</text>
  <path d="M 505 274 L 505 330 L 360 330" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 底部说明 -->
  <rect x="40" y="365" width="480" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="387" text-anchor="middle" font-size="11" fill="#555">空节点 return (0,0)（不贡献和、不贡献计数）· cnt ≥ 1 不除零</text>
  <text x="280" y="405" text-anchor="middle" font-size="11" fill="#555">整数除法向下取整：C++ / 与 Python // 在非负值域行为一致</text>
</svg>
