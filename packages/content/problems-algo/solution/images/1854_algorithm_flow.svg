<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 490"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="490" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：差分数组 + 一次扫描</text>

  <!-- 1. Start -->
  <rect x="210" y="42" width="100" height="28" rx="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="260" y="61" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">开始</text>
  <path d="M 260 70 L 260 84" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. init diff -->
  <rect x="140" y="86" width="240" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="107" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">建差分数组 diff[0..101] = 0</text>
  <path d="M 260 118 L 260 132" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. build diff (loop annotated) -->
  <rect x="110" y="134" width="300" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="153" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">遍历每个 log = [birth, death] ↻</text>
  <text x="260" y="172" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">diff[birth−1950] += 1；diff[death−1950] −= 1</text>
  <path d="M 260 182 L 260 196" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4. init scan vars -->
  <rect x="130" y="198" width="260" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="219" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">cur=0, maxPop=0, ans=1950, year=1950</text>
  <path d="M 260 230 L 260 244" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 5. Diamond: year <= 2050? -->
  <polygon points="260,246 380,282 260,318 140,282" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="280" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">year ≤ 2050 ?</text>
  <text x="260" y="296" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">(101 个年份)</text>

  <!-- No branch -> return ans -->
  <path d="M 380 282 L 420 282" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="396" y="276" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="420" y="268" width="84" height="28" rx="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="462" y="287" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <!-- Yes branch down -->
  <path d="M 260 318 L 260 332" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="328" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>

  <!-- 6. cur += diff -->
  <rect x="150" y="334" width="220" height="32" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="355" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">cur += diff[year−1950]</text>
  <path d="M 260 366 L 260 378" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 7. Diamond: cur > maxPop? -->
  <polygon points="260,380 350,408 260,436 170,408" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="412" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">cur &gt; maxPop ?</text>

  <!-- Yes -> update -->
  <path d="M 350 408 L 388 408" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="366" y="402" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="388" y="392" width="116" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="446" y="406" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">maxPop = cur</text>
  <text x="446" y="420" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = year</text>

  <!-- No label -->
  <text x="252" y="430" text-anchor="end" font-size="10.5" fill="#888" filter="url(#rough2)">否</text>

  <!-- year++ -->
  <path d="M 260 436 L 260 448" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="210" y="450" width="100" height="26" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="260" y="468" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">year++</text>

  <!-- loop back: from year++ up the left side to year-diamond -->
  <path d="M 210 463 L 60 463 L 60 282 L 140 282" stroke="#888" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="48" y="372" text-anchor="middle" font-size="10" fill="#888" transform="rotate(-90 48 372)" filter="url(#rough2)">下一年</text>

  <!-- summary -->
  <text x="260" y="486" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">建 diff O(n) + 扫描 101 年 O(1) = O(n)；空间 O(1)（值域固定 101）</text>
</svg>
