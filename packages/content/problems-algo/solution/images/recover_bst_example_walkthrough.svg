<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：中序 3,2,1，两处逆序定位 first=3, second=1</text>
  <text x="280" y="44" text-anchor="middle" font-size="11" fill="#888">root=[1,3,null,null,2]，节点 1 与节点 3 错位（非相邻）</text>

  <!-- ===== Left: the tree ===== -->
  <text x="110" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">输入树</text>
  <g font-size="12" filter="url(#rough2)">
    <!-- root 1 (swapped, was 3) -->
    <circle cx="110" cy="104" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="110" y="109" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <!-- 3 (swapped, was 1) -->
    <circle cx="70" cy="160" r="15" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
    <text x="70" y="165" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
    <!-- 2 -->
    <circle cx="100" cy="216" r="13" fill="#fff" stroke="#446688" stroke-width="1.5"/>
    <text x="100" y="221" text-anchor="middle" fill="#446688" font-weight="bold">2</text>
    <!-- edges -->
    <path d="M 100 118 L 78 146" stroke="#446688" stroke-width="1.3" fill="none"/>
    <path d="M 80 174 L 94 204" stroke="#446688" stroke-width="1.3" fill="none"/>
  </g>
  <text x="110" y="252" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">两个橙色节点值被交换</text>
  <text x="110" y="268" text-anchor="middle" font-size="9" fill="#888">正确应为根=3, 左子=1</text>

  <!-- ===== Right: inorder sequence strip ===== -->
  <text x="380" y="74" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">中序访问序列</text>
  <g font-size="12" filter="url(#rough2)">
    <!-- 3 -->
    <rect x="250" y="90" width="38" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="269" y="111" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
    <text x="269" y="138" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">① prev=null</text>

    <!-- inv1: 3 -> 2 -->
    <path d="M 290 106 L 304 106" stroke="#b85450" stroke-width="2.4" fill="none" marker-end="url(#arrR)"/>
    <text x="297" y="98" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">逆序①</text>

    <!-- 2 -->
    <rect x="306" y="90" width="38" height="32" fill="#fff" stroke="#b85450" stroke-width="1.5" rx="4"/>
    <text x="325" y="111" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <text x="325" y="138" text-anchor="middle" font-size="9" fill="#b85450" font-weight="bold">② 3&gt;2 ❌</text>

    <!-- inv2: 2 -> 1 -->
    <path d="M 346 106 L 360 106" stroke="#b85450" stroke-width="2.4" fill="none" marker-end="url(#arrR)"/>
    <text x="353" y="98" text-anchor="middle" font-size="8" fill="#b85450" font-weight="bold">逆序②</text>

    <!-- 1 -->
    <rect x="362" y="90" width="38" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4"/>
    <text x="381" y="111" text-anchor="middle" fill="#d6a040" font-weight="bold">1</text>
    <text x="381" y="138" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">③ 2&gt;1 ❌</text>
  </g>

  <!-- ===== Steps table ===== -->
  <text x="280" y="170" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">逐步状态</text>
  <g font-size="10" filter="url(#rough2)">
    <!-- header -->
    <rect x="40" y="180" width="480" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="70" y="196" text-anchor="middle" fill="#446688" font-weight="bold">步骤</text>
    <text x="150" y="196" text-anchor="middle" fill="#446688" font-weight="bold">弹栈节点</text>
    <text x="240" y="196" text-anchor="middle" fill="#446688" font-weight="bold">prev</text>
    <text x="330" y="196" text-anchor="middle" fill="#446688" font-weight="bold">cur.val</text>
    <text x="410" y="196" text-anchor="middle" fill="#446688" font-weight="bold">first</text>
    <text x="480" y="196" text-anchor="middle" fill="#446688" font-weight="bold">second</text>

    <!-- row 1 -->
    <rect x="40" y="204" width="480" height="24" fill="#fff" stroke="#ccc" stroke-width="1"/>
    <text x="70" y="220" text-anchor="middle" fill="#555">1</text>
    <text x="150" y="220" text-anchor="middle" fill="#d6a040" font-weight="bold">3</text>
    <text x="240" y="220" text-anchor="middle" fill="#888">null</text>
    <text x="330" y="220" text-anchor="middle" fill="#555">3</text>
    <text x="410" y="220" text-anchor="middle" fill="#888">null</text>
    <text x="480" y="220" text-anchor="middle" fill="#888">null</text>

    <!-- row 2: first inversion -->
    <rect x="40" y="228" width="480" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <text x="70" y="244" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <text x="150" y="244" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <text x="240" y="244" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
    <text x="330" y="244" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <text x="410" y="244" text-anchor="middle" fill="#d6a040" font-weight="bold">3 ⭐</text>
    <text x="480" y="244" text-anchor="middle" fill="#d6a040" font-weight="bold">2 ⭐</text>

    <!-- row 3: second inversion -->
    <rect x="40" y="252" width="480" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
    <text x="70" y="268" text-anchor="middle" fill="#b85450" font-weight="bold">3</text>
    <text x="150" y="268" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <text x="240" y="268" text-anchor="middle" fill="#b85450" font-weight="bold">2</text>
    <text x="330" y="268" text-anchor="middle" fill="#b85450" font-weight="bold">1</text>
    <text x="410" y="268" text-anchor="middle" fill="#888">3</text>
    <text x="480" y="268" text-anchor="middle" fill="#d6a040" font-weight="bold">1 ⭐</text>
  </g>

  <!-- ===== Result box ===== -->
  <rect x="40" y="296" width="480" height="88" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="318" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">最终：first = 节点(值3)，second = 节点(值1)</text>
  <text x="280" y="336" text-anchor="middle" font-size="11" fill="#4a7a3a">交换两节点的值 → 根变 3，左子变 1，中序 1,2,3</text>
  <text x="280" y="354" text-anchor="middle" font-size="10" fill="#555">第 2 步首次逆序锁定 first=3、second=2</text>
  <text x="280" y="370" text-anchor="middle" font-size="10" fill="#555">第 3 步第二处逆序仅更新 second=1（first 不变）</text>
  <text x="280" y="384" text-anchor="middle" font-size="9" fill="#888">相邻情况（如示例 2）只有第 2 步那种单次逆序，一次赋值即完成</text>
</svg>
