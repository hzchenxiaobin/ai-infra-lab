<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">
    算法流程：逐位取模递推
  </text>

  <!-- 1. 开始 -->
  <rect x="230" y="46" width="100" height="32" rx="16" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="67" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">开始</text>
  <line x1="280" y1="78" x2="280" y2="96" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. 初始化 -->
  <rect x="170" y="98" width="220" height="38" rx="6" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="122" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">
    r = 0，ans = [ ]
  </text>
  <line x1="280" y1="136" x2="280" y2="154" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. 循环头 -->
  <rect x="170" y="156" width="220" height="38" rx="6" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="180" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">
    for i = 0 to n − 1
  </text>
  <line x1="280" y1="194" x2="280" y2="212" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4. 取模递推 -->
  <rect x="140" y="214" width="280" height="40" rx="6" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="239" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">
    r = (r × 2 + nums[i]) mod 5
  </text>
  <line x1="280" y1="254" x2="280" y2="272" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 5. 判定菱形 cx=280 cy=302 -->
  <path d="M280,278 L372,302 L280,326 L188,302 Z" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="306" text-anchor="middle" font-size="12.5" fill="#333" filter="url(#rough2)">
    r == 0 ?
  </text>

  <!-- Yes 分支 -> 左 -->
  <line x1="188" y1="302" x2="170" y2="302" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="178" y="294" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <rect x="40" y="288" width="130" height="32" rx="6" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="105" y="308" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">ans[i] = true</text>

  <!-- No 分支 -> 右 -->
  <line x1="372" y1="302" x2="390" y2="302" stroke="#b85450" stroke-width="2" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="382" y="294" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">否</text>
  <rect x="390" y="288" width="130" height="32" rx="6" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="455" y="308" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">ans[i] = false</text>

  <!-- 两分支汇合 -> 回到循环头 (右侧曲线) -->
  <path d="M105,320 C105,360 280,360 280,360 L280,360 C350,360 420,360 460,340" fill="none" stroke="#888"
        stroke-width="1.4" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <!-- 回到循环头箭头：从底部右侧绕回 -->
  <path d="M460,320 C510,320 510,175 390,175" fill="none" stroke="#4a7a3a"
        stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="520" y="250" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">下</text>
  <text x="520" y="264" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">一</text>
  <text x="520" y="278" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">轮</text>

  <!-- 遍历结束 -> 返回 (左侧曲线从循环头到 return) -->
  <path d="M170,175 C90,175 90,420 200,420" fill="none" stroke="#446688"
        stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="82" y="290" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">遍</text>
  <text x="82" y="304" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">历</text>
  <text x="82" y="318" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">结</text>
  <text x="82" y="332" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">束</text>

  <!-- 6. 返回 ans -->
  <rect x="200" y="404" width="160" height="38" rx="16" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="428" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">返回 ans</text>
</svg>
