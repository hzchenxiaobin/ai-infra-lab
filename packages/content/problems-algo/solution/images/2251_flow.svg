<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：排序 + 两次二分</text>
  <text x="280" y="42" text-anchor="middle" font-size="10.5" fill="#888">预处理 O(n log n)，每次查询 O(log n)</text>

  <!-- Step 1: extract -->
  <rect x="40" y="62" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="140" y="80" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">① 拆分 starts[] / ends[]</text>
  <text x="140" y="95" text-anchor="middle" font-size="9.5" fill="#555">flowers[i]=[s,e] → starts[i]=s, ends[i]=e</text>

  <!-- arrow 1 -> 2 -->
  <line x1="240" y1="82" x2="282" y2="82" stroke="#666" stroke-width="1.6" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 2: sort -->
  <rect x="284" y="62" width="236" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="402" y="80" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">② 排序 sort(starts), sort(ends)</text>
  <text x="402" y="95" text-anchor="middle" font-size="9.5" fill="#555">升序，便于二分计数</text>

  <!-- arrow down to loop -->
  <line x1="402" y1="102" x2="402" y2="138" stroke="#666" stroke-width="1.6" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 3: loop box -->
  <rect x="60" y="140" width="460" height="178" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="160" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">③ 对每个 people[i] = t 执行：</text>

  <!-- sub-step a -->
  <rect x="84" y="172" width="412" height="34" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="98" y="186" font-size="10.5" fill="#4a7a3a" font-weight="bold">a</text>
  <text x="290" y="194" text-anchor="middle" font-size="11" fill="#333">a = bisect_right(starts, t)   // start ≤ t 的花数</text>

  <!-- sub-step b -->
  <rect x="84" y="214" width="412" height="34" fill="#fafafa" stroke="#d6a040" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="98" y="228" font-size="10.5" fill="#d6a040" font-weight="bold">b</text>
  <text x="290" y="236" text-anchor="middle" font-size="11" fill="#333">b = bisect_left(ends, t)      // end &lt; t 的花数</text>

  <!-- sub-step ans -->
  <rect x="84" y="256" width="412" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="5" filter="url(#rough2)"/>
  <text x="98" y="270" font-size="10.5" fill="#b85450" font-weight="bold">=</text>
  <text x="290" y="278" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">answer[i] = a − b</text>

  <!-- arrow down to return -->
  <line x1="290" y1="318" x2="290" y2="346" stroke="#666" stroke-width="1.6" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- Step 4: return -->
  <rect x="160" y="348" width="260" height="38" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="290" y="372" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">④ 返回 answer</text>

  <!-- Footer note -->
  <text x="290" y="400" text-anchor="middle" font-size="9.5" fill="#888">bisect_right 数「≤t」 | bisect_left 数「&lt;t」 | 二者差即「t 时盛开」</text>
</svg>
