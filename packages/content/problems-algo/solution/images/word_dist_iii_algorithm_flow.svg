<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：same 标志分流，单遍扫描</text>

  <!-- start -->
  <rect x="230" y="44" width="120" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="64" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">初始化 p1=p2=−1, ans=∞</text>
  <line x1="290" y1="74" x2="290" y2="92" stroke="#888" stroke-width="1.6" filter="url(#rough2)" marker-end="url(#arr)"/>

  <!-- loop -->
  <rect x="230" y="94" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="114" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">遍历 i = 0 … n−1</text>
  <line x1="290" y1="124" x2="290" y2="142" stroke="#888" stroke-width="1.6" filter="url(#rough2)" marker-end="url(#arr)"/>

  <!-- decision: words[i] == word1? -->
  <polygon points="290,144 400,182 290,220 180,182" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="178" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">words[i] == word1?</text>
  <text x="290" y="194" text-anchor="middle" font-size="10" fill="#888">（same 时同义）</text>

  <!-- No branch -> else if word2 -->
  <line x1="400" y1="182" x2="470" y2="182" stroke="#888" stroke-width="1.6" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="412" y="176" font-size="10.5" fill="#888">否</text>
  <rect x="470" y="166" width="100" height="32" fill="#f0f0f0" stroke="#bbb" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="520" y="180" text-anchor="middle" font-size="10.5" fill="#555">else if == word2</text>
  <text x="520" y="193" text-anchor="middle" font-size="10.5" fill="#555">p2=i; 比距 p1</text>
  <line x1="520" y1="198" x2="520" y2="372" stroke="#888" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="520" y1="372" x2="296" y2="372" stroke="#888" stroke-width="1.6" filter="url(#rough2)" marker-end="url(#arr)"/>

  <!-- Yes branch -> decision: same? -->
  <line x1="290" y1="220" x2="290" y2="238" stroke="#888" stroke-width="1.6" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="298" y="234" font-size="10.5" fill="#888">是</text>
  <polygon points="290,240 380,272 290,304 200,272" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="290" y="269" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">same?</text>
  <text x="290" y="284" text-anchor="middle" font-size="9.5" fill="#888">(word1==word2)</text>

  <!-- same = true -->
  <line x1="200" y1="272" x2="120" y2="272" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="150" y="266" font-size="10.5" fill="#b85450" font-weight="bold">是</text>
  <rect x="36" y="256" width="84" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="78" y="270" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">①先算 i−p1</text>
  <text x="78" y="283" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">②再 p1=i</text>
  <line x1="78" y1="288" x2="78" y2="372" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="78" y1="372" x2="284" y2="372" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)" marker-end="url(#arr)"/>

  <!-- same = false -->
  <line x1="380" y1="272" x2="410" y2="272" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)" marker-end="url(#arr)"/>
  <text x="384" y="266" font-size="10.5" fill="#4a7a3a" font-weight="bold">否</text>
  <rect x="410" y="256" width="96" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="458" y="270" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">p1=i; 比距 p2</text>
  <text x="458" y="283" text-anchor="middle" font-size="9.5" fill="#888">（即 243 逻辑）</text>
  <line x1="458" y1="288" x2="458" y2="330" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <line x1="458" y1="330" x2="296" y2="330" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)" marker-end="url(#arr)"/>

  <!-- loop back -->
  <rect x="230" y="360" width="120" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="378" text-anchor="middle" font-size="11" fill="#333">i++ → 回到遍历</text>
  <path d="M 230 373 L 160 373 L 160 109 L 228 109" stroke="#888" stroke-width="1.4" fill="none" stroke-dasharray="4 4" filter="url(#rough2)" marker-end="url(#arr)"/>

  <!-- end -->
  <line x1="290" y1="386" x2="290" y2="402" stroke="#888" stroke-width="1.6" filter="url(#rough2)" marker-end="url(#arr)"/>
  <rect x="230" y="404" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="290" y="423" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 ans</text>

  <!-- note -->
  <rect x="36" y="404" width="178" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="125" y="423" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">⚠️ 同词分支：先比距后挪指针</text>
</svg>
