<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="440" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：5 个订单的 max / avg 与阈值过滤</text>

  <!-- ===== Computation table ===== -->
  <rect x="30" y="44" width="560" height="232" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>

  <!-- header -->
  <rect x="30" y="44" width="560" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="60" y="60" font-size="10" fill="#446688" font-weight="bold">order_id</text>
  <text x="150" y="60" font-size="10" fill="#446688" font-weight="bold">quantities</text>
  <text x="320" y="60" font-size="10" fill="#446688" font-weight="bold">SUM/CNT</text>
  <text x="400" y="60" font-size="10" fill="#d6a040" font-weight="bold">avg</text>
  <text x="470" y="60" font-size="10" fill="#446688" font-weight="bold">max</text>
  <text x="540" y="60" font-size="10" fill="#4a7a3a" font-weight="bold">max&gt;14.33?</text>

  <!-- row 1 -->
  <text x="60" y="84" font-size="10" fill="#666">1</text>
  <text x="150" y="84" font-size="10" fill="#666">12, 10, 15</text>
  <text x="320" y="84" font-size="10" fill="#666">37 / 3</text>
  <text x="400" y="84" font-size="10" fill="#d6a040">12.33</text>
  <rect x="466" y="74" width="30" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="481" y="84" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">15</text>
  <text x="556" y="84" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- row 2 -->
  <text x="60" y="108" font-size="10" fill="#666">2</text>
  <text x="150" y="108" font-size="10" fill="#666">8, 4, 6, 4</text>
  <text x="320" y="108" font-size="10" fill="#666">22 / 4</text>
  <text x="400" y="108" font-size="10" fill="#d6a040">5.5</text>
  <rect x="466" y="98" width="30" height="14" fill="#fff" stroke="#999" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="481" y="108" text-anchor="middle" font-size="10" fill="#999">8</text>
  <text x="556" y="108" font-size="10" fill="#999">✗</text>

  <!-- row 3 (max avg -> threshold) -->
  <rect x="32" y="116" width="556" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="0.5" rx="2" filter="url(#rough2)" opacity="0.6"/>
  <text x="60" y="130" font-size="10" fill="#b85450" font-weight="bold">3</text>
  <text x="150" y="130" font-size="10" fill="#666">5, 18, 20</text>
  <text x="320" y="130" font-size="10" fill="#666">43 / 3</text>
  <rect x="392" y="120" width="34" height="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="2" filter="url(#rough2)"/>
  <text x="409" y="130" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">14.33</text>
  <rect x="466" y="120" width="30" height="14" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="481" y="130" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">20</text>
  <text x="556" y="130" font-size="10" fill="#4a7a3a" font-weight="bold">✓</text>

  <!-- row 4 -->
  <text x="60" y="154" font-size="10" fill="#666">4</text>
  <text x="150" y="154" font-size="10" fill="#666">2, 8</text>
  <text x="320" y="154" font-size="10" fill="#666">10 / 2</text>
  <text x="400" y="154" font-size="10" fill="#d6a040">5</text>
  <rect x="466" y="144" width="30" height="14" fill="#fff" stroke="#999" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="481" y="154" text-anchor="middle" font-size="10" fill="#999">8</text>
  <text x="556" y="154" font-size="10" fill="#999">✗</text>

  <!-- row 5 -->
  <text x="60" y="178" font-size="10" fill="#666">5</text>
  <text x="150" y="178" font-size="10" fill="#666">9, 9</text>
  <text x="320" y="178" font-size="10" fill="#666">18 / 2</text>
  <text x="400" y="178" font-size="10" fill="#d6a040">9</text>
  <rect x="466" y="168" width="30" height="14" fill="#fff" stroke="#999" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="481" y="178" text-anchor="middle" font-size="10" fill="#999">9</text>
  <text x="556" y="178" font-size="10" fill="#999">✗ (=)</text>

  <line x1="30" y1="190" x2="590" y2="190" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- threshold summary -->
  <text x="60" y="212" font-size="10" fill="#b85450" font-weight="bold">阈值</text>
  <text x="150" y="212" font-size="10" fill="#b85450">MAX(avg) = max(12.33, 5.5, 14.33, 5, 9)</text>
  <text x="400" y="212" font-size="10" fill="#b85450" font-weight="bold">= 14.33</text>
  <text x="470" y="212" font-size="9" fill="#888">（订单 3 的均值）</text>

  <!-- result -->
  <rect x="32" y="224" width="556" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="0.5" rx="2" filter="url(#rough2)" opacity="0.7"/>
  <text x="60" y="240" font-size="10" fill="#4a7a3a" font-weight="bold">结果</text>
  <text x="150" y="240" font-size="10" fill="#4a7a3a" font-weight="bold">订单 1（max 15 &gt; 14.33）与 订单 3（max 20 &gt; 14.33）→ 不平衡</text>
  <text x="556" y="240" font-size="10" fill="#4a7a3a" font-weight="bold">{1, 3}</text>

  <text x="60" y="264" font-size="9" fill="#888">注：订单 5 的 max = avg = 9（各产品数量相等），既不越过阈值，也体现「严格大于」排除等号</text>

  <!-- ===== Pitfall note ===== -->
  <rect x="30" y="292" width="560" height="64" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="46" y="312" font-size="11" fill="#b85450" font-weight="bold">⚠ 最大陷阱：误读为「max &gt; 自身订单的均值」</text>
  <text x="46" y="330" font-size="10" fill="#666">若按「max &gt; 自身 avg」过滤：订单 2（8&gt;5.5）、订单 4（8&gt;5）也会入选 → {1,2,3,4}，与期望 {1,3} 不符</text>
  <text x="46" y="346" font-size="10" fill="#666">「每个订单（含自身）的均值」= 全体均值的最大值作阈值，而非逐订单自身均值</text>

  <!-- ===== Equivalence note ===== -->
  <rect x="30" y="368" width="560" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="388" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">三种等价写法</text>
  <text x="46" y="406" font-size="10" fill="#666" font-family="monospace">① max_q &gt; ALL(SELECT avg_q FROM t)</text>
  <text x="250" y="406" font-size="10" fill="#666" font-family="monospace">② max_q &gt; (SELECT MAX(avg_q) FROM t)</text>
  <text x="46" y="420" font-size="10" fill="#666" font-family="monospace">③ max_q &gt; MAX(avg_q) OVER()</text>
  <text x="250" y="420" font-size="9" fill="#888">（窗口函数广播全局最大均值到每行）</text>
</svg>
