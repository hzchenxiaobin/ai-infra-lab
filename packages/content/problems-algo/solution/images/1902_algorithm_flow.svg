<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：有序集合 + 深度哈希，逐个插入求深度</text>

  <!-- 1. Initialize -->
  <rect x="130" y="44" width="260" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="64" text-anchor="middle" font-size="12" fill="#333">① 初始化：有序集合 S, 深度表 depth</text>
  <text x="260" y="78" text-anchor="middle" font-size="10" fill="#555">插入 order[0]，depth[root] = 1, maxDepth = 1</text>

  <path d="M 260 84 L 260 100" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. Loop start -->
  <rect x="130" y="100" width="260" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="122" text-anchor="middle" font-size="12" fill="#333">② 遍历 order[1 .. n−1] 中每个 v</text>

  <path d="M 260 136 L 260 152" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 3. Find predecessor and successor -->
  <rect x="100" y="152" width="320" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="172" text-anchor="middle" font-size="12" fill="#333">③ 在 S 中查 v 的前驱 p 和后继 s</text>
  <text x="260" y="190" text-anchor="middle" font-size="10.5" fill="#555">p = S 中 &lt; v 的最大值, s = S 中 &gt; v 的最小值</text>

  <path d="M 260 200 L 260 216" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4. Compute depth (decision/formula) -->
  <polygon points="260,216 380,260 260,304 140,260" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="252" text-anchor="middle" font-size="11.5" fill="#333">depth[v] =</text>
  <text x="260" y="270" text-anchor="middle" font-size="11.5" fill="#333">1 + max(depth[p], depth[s])</text>
  <text x="260" y="286" text-anchor="middle" font-size="9.5" fill="#888">(不存在的前驱/后继深度记 0)</text>

  <path d="M 260 304 L 260 320" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 5. Update max and add to set -->
  <rect x="110" y="320" width="300" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="340" text-anchor="middle" font-size="12" fill="#333">④ 更新 maxDepth = max(maxDepth, depth[v])</text>
  <text x="260" y="358" text-anchor="middle" font-size="11" fill="#555">将 v 加入有序集合 S, 记录 depth[v]</text>

  <!-- Loop back arrow -->
  <path d="M 110 344 L 60 344 L 60 118 L 130 118" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arr)" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="44" y="230" font-size="10" fill="#4a7a3a" font-weight="bold" transform="rotate(-90 44 230)">下一个 v</text>

  <!-- Final: return -->
  <path d="M 260 368 L 260 386" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="382" font-size="10" fill="#888">遍历结束</text>

  <rect x="150" y="386" width="220" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="408" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">⑤ 返回 maxDepth</text>

  <!-- Right side complexity notes -->
  <rect x="390" y="160" width="120" height="52" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="450" y="180" text-anchor="middle" font-size="10" fill="#a87020" font-weight="bold">查前驱后继</text>
  <text x="450" y="196" text-anchor="middle" font-size="9.5" fill="#555">set.lower_bound</text>
  <text x="450" y="208" text-anchor="middle" font-size="9.5" fill="#555">O(log n)</text>

  <rect x="390" y="224" width="120" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="450" y="242" text-anchor="middle" font-size="10" fill="#a87020" font-weight="bold">总复杂度</text>
  <text x="450" y="258" text-anchor="middle" font-size="9.5" fill="#555">O(n log n)</text>

  <!-- Footer -->
  <text x="260" y="440" text-anchor="middle" font-size="10.5" fill="#888">每个节点只查前驱后继两个邻居 + O(1) 算深度 → 无需真正建树</text>
</svg>
