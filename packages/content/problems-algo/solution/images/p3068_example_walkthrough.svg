<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：增益数组 dᵢ = (xᵢ⊕k) − xᵢ 决定一切</text>
  <text x="260" y="42" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">绿格 = 正增益（采纳翻转），粉格 = 负增益（保持原值）</text>

  <!-- header -->
  <text x="66" y="64" font-size="10.5" fill="#888" font-weight="bold" filter="url(#rough2)">用例</text>
  <text x="150" y="64" font-size="10.5" fill="#888" font-weight="bold" filter="url(#rough2)">增益数组 d</text>
  <text x="382" y="64" font-size="10.5" fill="#888" font-weight="bold" filter="url(#rough2)">奇偶判定 → 答案</text>

  <!-- row 1 -->
  <text x="66" y="96" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例1</text>
  <text x="66" y="112" font-size="10" fill="#888" filter="url(#rough2)">nums=[1,2,1] k=3</text>
  <rect x="130" y="84" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="147" y="102" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+1</text>
  <rect x="170" y="84" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="187" y="102" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">−1</text>
  <rect x="210" y="84" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="227" y="102" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+1</text>
  <text x="382" y="96" font-size="11" fill="#555" filter="url(#rough2)">cnt = 2（偶）</text>
  <text x="382" y="112" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">total = 2+2+2 = 6</text>

  <line x1="24" y1="130" x2="496" y2="130" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- row 2 -->
  <text x="66" y="158" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例2</text>
  <text x="66" y="174" font-size="10" fill="#888" filter="url(#rough2)">nums=[2,3] k=7</text>
  <rect x="130" y="146" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="147" y="164" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+3</text>
  <rect x="170" y="146" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="187" y="164" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+1</text>
  <text x="382" y="158" font-size="11" fill="#555" filter="url(#rough2)">cnt = 2（偶）</text>
  <text x="382" y="174" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">total = 5+4 = 9</text>

  <line x1="24" y1="192" x2="496" y2="192" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- row 3 -->
  <text x="66" y="220" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例3</text>
  <text x="66" y="236" font-size="10" fill="#888" filter="url(#rough2)">nums=[7,7,7,7,7,7] k=3</text>
  <rect x="130" y="208" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="147" y="226" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">−3</text>
  <rect x="170" y="208" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="187" y="226" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">−3</text>
  <text x="214" y="226" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">×6</text>
  <text x="382" y="220" font-size="11" fill="#555" filter="url(#rough2)">cnt = 0（偶）</text>
  <text x="382" y="236" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">total = 7×6 = 42</text>

  <line x1="24" y1="254" x2="496" y2="254" stroke="#ddd" stroke-width="1" stroke-dasharray="4 4" filter="url(#rough2)"/>

  <!-- row 4: odd fix -->
  <rect x="24" y="262" width="472" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="66" y="288" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">追加例</text>
  <text x="66" y="304" font-size="10" fill="#8a6d3b" filter="url(#rough2)">nums=[7,7,7,7,7,8]</text>
  <text x="66" y="318" font-size="10" fill="#8a6d3b" filter="url(#rough2)">k=3</text>
  <rect x="130" y="276" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="147" y="294" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">−3</text>
  <rect x="170" y="276" width="34" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="187" y="294" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">−3</text>
  <text x="214" y="294" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">×4</text>
  <rect x="250" y="276" width="34" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="267" y="294" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">+3</text>
  <text x="382" y="288" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">cnt = 1（奇）→ 修一刀</text>
  <text x="382" y="304" font-size="11" fill="#8a6d3b" filter="url(#rough2)">total = 35+11 = 46</text>
  <text x="382" y="320" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">46 − min|d| = 46 − 3 = 43</text>
  <text x="66" y="340" font-size="10.5" fill="#8a6d3b" filter="url(#rough2)">要么放弃翻 8（得 42），要么拉一个 7 陪翻（7×4+11+4=43），取更优</text>

  <text x="260" y="372" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">交换论证：最优偶集必含全部正增益、不含任何负增益，唯一自由度只剩「为凑偶数加减一个元素」</text>
  <text x="260" y="390" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">若某个 dᵢ = 0 则 min|d| = 0，奇偶免费修复，答案不受影响</text>
</svg>
