<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">每次按下的持续时间：与「上一次任意按下」比</text>

  <!-- 顶部左：两条规则 -->
  <rect x="30" y="40" width="228" height="64" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="144" y="60" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">① d = 本次 time − 上次 time</text>
  <text x="144" y="78" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">② 时长记在「按下完成」者头上</text>
  <text x="144" y="96" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">（即时间轴上右端点那个按钮）</text>

  <!-- 顶部右：首按规则 -->
  <rect x="282" y="40" width="210" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="387" y="60" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">首次按下没有「上一次」</text>
  <text x="387" y="78" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">d = 时间戳本身</text>
  <text x="387" y="96" text-anchor="middle" font-size="10" fill="#666" filter="url(#rough2)">（计时默认从 0 开始）</text>

  <!-- 时间轴虚线 -->
  <path d="M 44 210 L 500 210" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="5 5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 持续时间段：首按（绿）/ 普通间隔（蓝）/ 冠军（红） -->
  <rect x="60" y="202" width="56" height="16" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="116" y="202" width="84" height="16" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="200" y="202" width="112" height="16" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="312" y="202" width="168" height="16" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>

  <!-- 起点 -->
  <circle cx="60" cy="210" r="5" fill="#fafafa" stroke="#999999" stroke-width="1.4" stroke-dasharray="2 2" filter="url(#rough2)"/>
  <text x="60" y="180" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">t=0</text>
  <text x="60" y="195" text-anchor="middle" font-size="10.5" fill="#999" filter="url(#rough2)">起点</text>

  <!-- 事件点 -->
  <circle cx="116" cy="210" r="7" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="116" y="178" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">t=2</text>
  <text x="116" y="193" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">按钮 1</text>

  <circle cx="200" cy="210" r="7" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="200" y="178" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">t=5</text>
  <text x="200" y="193" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">按钮 2</text>

  <circle cx="312" cy="210" r="7" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="312" y="178" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">t=9</text>
  <text x="312" y="193" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">按钮 3</text>

  <circle cx="480" cy="210" r="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="480" y="178" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">t=15</text>
  <text x="480" y="193" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">按钮 1</text>

  <!-- 各段持续时间 -->
  <text x="88" y="244" text-anchor="middle" font-size="12" fill="#2f5d24" filter="url(#rough2)">d=2</text>
  <text x="158" y="244" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">d=3</text>
  <text x="256" y="244" text-anchor="middle" font-size="12" fill="#33506b" filter="url(#rough2)">d=4</text>
  <text x="396" y="246" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">d=6 ★ 全场最长</text>

  <!-- 归属示意箭头 -->
  <path d="M 445 252 Q 462 244 476 224" fill="none" stroke="#b85450" stroke-width="1.4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="430" y="270" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">记在按钮 1 头上</text>

  <!-- 底部：两个误读 -->
  <rect x="110" y="282" width="300" height="62" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="302" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">⚠️ 两个误读</text>
  <text x="260" y="322" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">① 与自己上次被按比 → 按钮 1 第二次 = 15−2 = 13 ✗</text>
  <text x="260" y="340" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">② 多次按下累加 → 2+6 = 8 ✗（正确：单次最长 6）</text>
</svg>
