<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="290" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：两个小骨架叉乘 → LEFT JOIN 事实 → 分组补零 → 排序输出</text>

  <rect x="18" y="42" width="96" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="66" y="60" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">① T 周骨架</text>
  <text x="66" y="76" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">递归 CTE 1→4</text>
  <text x="66" y="92" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">4 行</text>

  <path d="M 114 72 L 126 72" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="126" y="42" width="96" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="174" y="60" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">② M 会员骨架</text>
  <text x="174" y="76" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">'Premium' / 'VIP'</text>
  <text x="174" y="92" text-anchor="middle" font-size="8.5" fill="#446688" filter="url(#rough2)">2 行</text>

  <path d="M 222 72 L 234 72" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="228" y="62" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">×</text>

  <rect x="234" y="42" width="100" height="60" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="284" y="60" text-anchor="middle" font-size="10" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">③ CROSS JOIN</text>
  <text x="284" y="76" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">二维骨架 (周, 会员)</text>
  <text x="284" y="92" text-anchor="middle" font-size="8.5" fill="#8a6d1a" filter="url(#rough2)">8 行，与数据无关</text>

  <path d="M 334 72 L 346 72" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="346" y="42" width="100" height="60" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="396" y="60" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">④ LEFT JOIN P</text>
  <text x="396" y="76" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">ON (周, 会员)</text>
  <text x="396" y="92" text-anchor="middle" font-size="8.5" fill="#b85450" filter="url(#rough2)">9 行（一对多）</text>

  <path d="M 446 72 L 458 72" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="458" y="42" width="104" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="510" y="60" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⑤ GROUP BY</text>
  <text x="510" y="76" text-anchor="middle" font-size="8.5" fill="#333" filter="url(#rough2)">IFNULL(SUM,0)</text>
  <text x="510" y="92" text-anchor="middle" font-size="8.5" fill="#4a7a3a" filter="url(#rough2)">ORDER BY → 8 行</text>

  <text x="290" y="122" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">▼ 数据怎么变（示例）▼</text>

  <rect x="22" y="134" width="160" height="172" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="102" y="154" text-anchor="middle" font-size="10" fill="#8a6d1a" font-weight="bold" filter="url(#rough2)">③ 骨架 8 行</text>
  <text x="38" y="174" font-size="8.5" fill="#333" filter="url(#rough2)">1 | Premium</text>
  <text x="38" y="190" font-size="8.5" fill="#333" filter="url(#rough2)">1 | VIP</text>
  <text x="38" y="206" font-size="8.5" fill="#333" filter="url(#rough2)">2 | Premium</text>
  <text x="38" y="222" font-size="8.5" fill="#333" filter="url(#rough2)">2 | VIP</text>
  <text x="38" y="238" font-size="8.5" fill="#333" filter="url(#rough2)">3 | Premium</text>
  <text x="38" y="254" font-size="8.5" fill="#333" filter="url(#rough2)">3 | VIP</text>
  <text x="38" y="270" font-size="8.5" fill="#333" filter="url(#rough2)">4 | Premium</text>
  <text x="38" y="286" font-size="8.5" fill="#333" filter="url(#rough2)">4 | VIP</text>
  <text x="38" y="301" font-size="8" fill="#999" filter="url(#rough2)">Standard 不在骨架里</text>

  <path d="M 182 220 L 206 220" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="194" y="210" text-anchor="middle" font-size="7.5" fill="#999" filter="url(#rough2)">JOIN</text>

  <rect x="210" y="134" width="170" height="172" fill="#fff" stroke="#999" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="295" y="154" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">④ join 后 9 行</text>
  <text x="224" y="174" font-size="8.5" fill="#2e5c22" filter="url(#rough2)">1 | Premium | 1126</text>
  <text x="224" y="190" font-size="8.5" fill="#a06a10" filter="url(#rough2)">1 | VIP | NULL</text>
  <text x="224" y="206" font-size="8.5" fill="#a06a10" filter="url(#rough2)">2 | Premium | NULL</text>
  <text x="224" y="222" font-size="8.5" fill="#2e5c22" filter="url(#rough2)">2 | VIP | 7473</text>
  <text x="224" y="238" font-size="8.5" fill="#a06a10" filter="url(#rough2)">3 | Premium | NULL</text>
  <text x="224" y="254" font-size="8.5" fill="#a06a10" filter="url(#rough2)">3 | VIP | NULL</text>
  <text x="224" y="270" font-size="8.5" fill="#2e5c22" filter="url(#rough2)">4 | Premium | 5117</text>
  <text x="224" y="286" font-size="8.5" fill="#2e5c22" filter="url(#rough2)">4 | VIP | 9692 ← 一对多</text>
  <text x="224" y="299" font-size="8.5" fill="#2e5c22" filter="url(#rough2)">4 | VIP | 5241 ← 一对多</text>

  <path d="M 380 220 L 404 220" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="392" y="210" text-anchor="middle" font-size="7.5" fill="#999" filter="url(#rough2)">SUM</text>

  <rect x="408" y="134" width="152" height="172" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="484" y="154" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⑤ 输出 8 行</text>
  <text x="420" y="174" font-size="8.5" fill="#333" filter="url(#rough2)">1 | Premium | 1126</text>
  <text x="420" y="190" font-size="8.5" fill="#a06a10" filter="url(#rough2)">1 | VIP | 0</text>
  <text x="420" y="206" font-size="8.5" fill="#a06a10" filter="url(#rough2)">2 | Premium | 0</text>
  <text x="420" y="222" font-size="8.5" fill="#333" filter="url(#rough2)">2 | VIP | 7473</text>
  <text x="420" y="238" font-size="8.5" fill="#a06a10" filter="url(#rough2)">3 | Premium | 0</text>
  <text x="420" y="254" font-size="8.5" fill="#a06a10" filter="url(#rough2)">3 | VIP | 0</text>
  <text x="420" y="270" font-size="8.5" fill="#333" filter="url(#rough2)">4 | Premium | 5117</text>
  <text x="420" y="286" font-size="8.5" fill="#2e5c22" font-weight="bold" filter="url(#rough2)">4 | VIP | 14933</text>
  <text x="484" y="301" text-anchor="middle" font-size="8" fill="#4a7a3a" filter="url(#rough2)">NULL → IFNULL 补 0</text>

  <rect x="30" y="318" width="520" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="290" y="337" text-anchor="middle" font-size="9.5" fill="#446688" filter="url(#rough2)">P = Purchases ⋈ Users WHERE 周五 —— membership 过滤藏在 JOIN 键里（Standard 匹不上骨架的会员值）</text>
  <text x="290" y="358" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">若把会员条件写到最终 WHERE 的右表列上 → 补零行被杀，8 行变 4 行</text>
</svg>
