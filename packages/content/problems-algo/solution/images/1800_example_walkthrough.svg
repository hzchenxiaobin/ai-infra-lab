<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [10, 20, 30, 5, 10, 50] 的滚动过程</text>

  <!-- Row labels -->
  <text x="44" y="74" font-size="11" fill="#888" filter="url(#rough2)">下标 i</text>
  <text x="44" y="118" font-size="11" fill="#888" filter="url(#rough2)">nums[i]</text>
  <text x="44" y="154" font-size="11" fill="#888" filter="url(#rough2)">升序?</text>
  <text x="44" y="194" font-size="11" fill="#888" filter="url(#rough2)">动作</text>
  <text x="44" y="234" font-size="11" fill="#888" filter="url(#rough2)">cur</text>
  <text x="44" y="274" font-size="11" fill="#888" filter="url(#rough2)">ans</text>

  <!-- 6 columns: centers at 120, 184, 248, 312, 376, 440 ; cell width 64 -->
  <!-- index row -->
  <g font-size="12" fill="#555" text-anchor="middle">
    <text x="120" y="74" filter="url(#rough2)">0</text>
    <text x="184" y="74" filter="url(#rough2)">1</text>
    <text x="248" y="74" filter="url(#rough2)">2</text>
    <text x="312" y="74" filter="url(#rough2)">3</text>
    <text x="376" y="74" filter="url(#rough2)">4</text>
    <text x="440" y="74" filter="url(#rough2)">5</text>
  </g>

  <!-- breakpoint marker above i=3 -->
  <rect x="280" y="44" width="64" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="312" y="58" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">↓ 断点</text>

  <!-- nums row: run1 green (0,1,2), run2 blue (3,4,5) -->
  <g font-size="14" fill="#333" text-anchor="middle">
    <rect x="88" y="100" width="64" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="120" y="122" font-weight="bold" filter="url(#rough2)">10</text>
    <rect x="152" y="100" width="64" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="184" y="122" font-weight="bold" filter="url(#rough2)">20</text>
    <rect x="216" y="100" width="64" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="248" y="122" font-weight="bold" filter="url(#rough2)">30</text>
    <rect x="280" y="100" width="64" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="312" y="122" font-weight="bold" filter="url(#rough2)">5</text>
    <rect x="344" y="100" width="64" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="376" y="122" font-weight="bold" filter="url(#rough2)">10</text>
    <rect x="408" y="100" width="64" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="4" filter="url(#rough2)"/>
    <text x="440" y="122" font-weight="bold" filter="url(#rough2)">50</text>
  </g>

  <!-- 升序? row -->
  <g font-size="13" text-anchor="middle">
    <text x="120" y="154" fill="#aaa" filter="url(#rough2)">—</text>
    <text x="184" y="154" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
    <text x="248" y="154" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
    <text x="312" y="154" fill="#b85450" font-weight="bold" filter="url(#rough2)">✗</text>
    <text x="376" y="154" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
    <text x="440" y="154" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">✓</text>
  </g>
  <!-- tiny comparison hints -->
  <g font-size="8.5" fill="#aaa" text-anchor="middle">
    <text x="184" y="166" filter="url(#rough2)">20&gt;10</text>
    <text x="248" y="166" filter="url(#rough2)">30&gt;20</text>
    <text x="312" y="166" fill="#b85450" filter="url(#rough2)">5&lt;30</text>
    <text x="376" y="166" filter="url(#rough2)">10&gt;5</text>
    <text x="440" y="166" filter="url(#rough2)">50&gt;10</text>
  </g>

  <!-- 动作 row -->
  <g font-size="11" text-anchor="middle">
    <text x="120" y="194" fill="#888" filter="url(#rough2)">初始</text>
    <text x="184" y="194" fill="#4a7a3a" filter="url(#rough2)">cur+=20</text>
    <text x="248" y="194" fill="#4a7a3a" filter="url(#rough2)">cur+=30</text>
    <text x="312" y="194" fill="#b85450" font-weight="bold" filter="url(#rough2)">cur=5</text>
    <text x="376" y="194" fill="#4a7a3a" filter="url(#rough2)">cur+=10</text>
    <text x="440" y="194" fill="#4a7a3a" filter="url(#rough2)">cur+=50</text>
  </g>

  <!-- cur row: 10 30 60 5 15 65 ; highlight 60 and 65 -->
  <g font-size="13" text-anchor="middle" font-weight="bold">
    <rect x="94" y="218" width="52" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="120" y="234" fill="#4a7a3a" filter="url(#rough2)">10</text>
    <rect x="158" y="218" width="52" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="184" y="234" fill="#4a7a3a" filter="url(#rough2)">30</text>
    <rect x="222" y="218" width="52" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="248" y="234" fill="#b85450" filter="url(#rough2)">60</text>
    <rect x="286" y="218" width="52" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
    <text x="312" y="234" fill="#b85450" filter="url(#rough2)">5</text>
    <rect x="350" y="218" width="52" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
    <text x="376" y="234" fill="#446688" filter="url(#rough2)">15</text>
    <rect x="414" y="218" width="52" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="440" y="234" fill="#b85450" filter="url(#rough2)">65</text>
  </g>

  <!-- ans row: 10 30 60 60 60 65 ; highlight 65 -->
  <g font-size="13" text-anchor="middle" font-weight="bold">
    <text x="120" y="274" fill="#888" filter="url(#rough2)">10</text>
    <text x="184" y="274" fill="#888" filter="url(#rough2)">30</text>
    <text x="248" y="274" fill="#888" filter="url(#rough2)">60</text>
    <text x="312" y="274" fill="#aaa" filter="url(#rough2)">60</text>
    <text x="376" y="274" fill="#aaa" filter="url(#rough2)">60</text>
    <rect x="414" y="258" width="52" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="440" y="274" fill="#b85450" filter="url(#rough2)">65</text>
  </g>

  <!-- annotations -->
  <text x="248" y="298" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">段①峰值 60</text>
  <text x="312" y="298" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">断点重启</text>
  <text x="440" y="298" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">段②峰值 65</text>

  <!-- Conclusion -->
  <path d="M 40 312 L 520 312" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="100" y="324" width="360" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="347" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans = max(60, 65) = 65 → 返回 65</text>
</svg>
