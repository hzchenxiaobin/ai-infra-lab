<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrO" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">核心：升序遍历，最小未用牌 x 必须作为一组开头</text>
  <text x="260" y="40" text-anchor="middle" font-size="10.5" fill="#888">更小的牌已被消耗完 → x 只能开新组，消耗 [x, x+1, …, x+k−1]</text>

  <!-- Sorted hand label -->
  <text x="28" y="72" font-size="10.5" fill="#666">排序后</text>

  <!-- Sorted cards: 1,2,2,3,3,4,6,7,8 (9 cards, w=34 gap=5 start=68) -->
  <rect x="68" y="54" width="34" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="85" y="77" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>

  <rect x="107" y="54" width="34" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124" y="77" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="146" y="54" width="34" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="163" y="77" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="185" y="54" width="34" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="202" y="77" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="224" y="54" width="34" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="241" y="77" text-anchor="middle" font-size="13" fill="#333">3</text>
  <rect x="263" y="54" width="34" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="280" y="77" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="302" y="54" width="34" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="319" y="77" text-anchor="middle" font-size="13" fill="#333">6</text>
  <rect x="341" y="54" width="34" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="358" y="77" text-anchor="middle" font-size="13" fill="#333">7</text>
  <rect x="380" y="54" width="34" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="397" y="77" text-anchor="middle" font-size="13" fill="#333">8</text>

  <!-- Arrow from card 1 down -->
  <path d="M 85 92 L 85 110" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <text x="145" y="106" font-size="10.5" fill="#d6a040" font-weight="bold">x=1 最小未用 → 必须开头</text>

  <!-- Consume box -->
  <rect x="80" y="116" width="360" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="133" text-anchor="middle" font-size="11" fill="#333">消耗 [x, x+1, …, x+k−1] = [1, 2, 3]，每个 freq −−</text>

  <!-- Arrow down to groups -->
  <path d="M 260 144 L 260 160" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="310" y="156" font-size="10" fill="#888">重复：取下一个最小未用</text>

  <!-- Three groups -->
  <text x="28" y="180" font-size="10.5" fill="#666">分成 3 组</text>

  <!-- Group 1 [1,2,3] blue -->
  <rect x="73" y="168" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="189" text-anchor="middle" font-size="12" fill="#333">1</text>
  <rect x="111" y="168" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="128" y="189" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="149" y="168" width="34" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="166" y="189" text-anchor="middle" font-size="12" fill="#333">3</text>

  <!-- Group 2 [2,3,4] green -->
  <rect x="205" y="168" width="34" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="222" y="189" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="243" y="168" width="34" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="189" text-anchor="middle" font-size="12" fill="#333">3</text>
  <rect x="281" y="168" width="34" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="298" y="189" text-anchor="middle" font-size="12" fill="#333">4</text>

  <!-- Group 3 [6,7,8] orange -->
  <rect x="337" y="168" width="34" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="354" y="189" text-anchor="middle" font-size="12" fill="#333">6</text>
  <rect x="375" y="168" width="34" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="392" y="189" text-anchor="middle" font-size="12" fill="#333">7</text>
  <rect x="413" y="168" width="34" height="32" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="189" text-anchor="middle" font-size="12" fill="#333">8</text>

  <!-- Bottom note: why x must start -->
  <rect x="40" y="222" width="440" height="54" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="242" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">为什么 x 必须是开头？</text>
  <text x="260" y="260" text-anchor="middle" font-size="10.5" fill="#555">升序处理时，所有 &lt; x 的牌已被消耗完（作为某组的开头或成员）</text>
  <text x="260" y="274" text-anchor="middle" font-size="10.5" fill="#555">→ x 无法作为某组的中间或末尾，只能开新组</text>

  <!-- Footer -->
  <text x="260" y="310" text-anchor="middle" font-size="10.5" fill="#888">有序映射 / 排序 + Counter：freq[x] 记录剩余张数，按 key 升序遍历</text>
  <text x="260" y="328" text-anchor="middle" font-size="10" fill="#aaa">对比 659：659 序列长度 ≥ 3（可续接），846 序列长度固定 = k（只能整组消耗）</text>
  <text x="260" y="346" text-anchor="middle" font-size="10" fill="#aaa">→ 846 无需 tails 表，比 659 更简单</text>
</svg>
