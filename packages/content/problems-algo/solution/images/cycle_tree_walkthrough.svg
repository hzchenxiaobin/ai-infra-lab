<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/>
    </filter>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>

  <rect width="820" height="440" fill="#fdfcf7"/>

  <text x="410" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#2b2b2b" filter="url(#sk)">示例演算：n = 3，三个查询的上爬轨迹</text>
  <path d="M 300 38 Q 410 46 520 38" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <text x="410" y="62" text-anchor="middle" font-size="11" fill="#666" filter="url(#sk)">方框 = (a, b)；箭头 = 较大者上爬 val &gt;&gt; 1；t 从 1 起，每爬一步 +1，a == b 时 t 即答案</text>

  <!-- ============ Row 1: [5,3] = 4 ============ -->
  <g filter="url(#sk)">
    <rect x="36" y="86" width="62" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="67" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a2a26" filter="url(#sk)">[5,3]</text>

  <g filter="url(#sk)">
    <rect x="110" y="84" width="44" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="132" y="109" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#sk)">5,3</text>
  <text x="132" y="138" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">t=1</text>
  <line x1="154" y1="104" x2="204" y2="104" stroke="#5a5a5a" stroke-width="1.7" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="179" y="96" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#sk)">5&gt;&gt;1</text>

  <g filter="url(#sk)">
    <rect x="204" y="84" width="44" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="226" y="109" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#sk)">2,3</text>
  <text x="226" y="138" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">t=2</text>
  <line x1="248" y1="104" x2="298" y2="104" stroke="#5a5a5a" stroke-width="1.7" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="273" y="96" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#sk)">3&gt;&gt;1</text>

  <g filter="url(#sk)">
    <rect x="298" y="84" width="44" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="320" y="109" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#sk)">2,1</text>
  <text x="320" y="138" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">t=3</text>
  <line x1="342" y1="104" x2="392" y2="104" stroke="#5a5a5a" stroke-width="1.7" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="367" y="96" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#sk)">2&gt;&gt;1</text>

  <g filter="url(#sk)">
    <rect x="392" y="84" width="44" height="40" rx="6" fill="#fff3d6" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="414" y="109" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">1,1</text>
  <text x="414" y="138" text-anchor="middle" font-size="10" fill="#7a5415" filter="url(#sk)">a=b</text>

  <g filter="url(#sk)">
    <rect x="450" y="86" width="60" height="36" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="480" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">= 4</text>

  <!-- ============ Row 2: [4,7] = 5 ============ -->
  <g filter="url(#sk)">
    <rect x="36" y="214" width="62" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="67" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a2a26" filter="url(#sk)">[4,7]</text>

  <g filter="url(#sk)">
    <rect x="110" y="212" width="44" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="132" y="237" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#sk)">4,7</text>
  <text x="132" y="266" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">t=1</text>
  <line x1="154" y1="232" x2="204" y2="232" stroke="#5a5a5a" stroke-width="1.7" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="179" y="224" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#sk)">7&gt;&gt;1</text>

  <g filter="url(#sk)">
    <rect x="204" y="212" width="44" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="226" y="237" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#sk)">4,3</text>
  <text x="226" y="266" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">t=2</text>
  <line x1="248" y1="232" x2="298" y2="232" stroke="#5a5a5a" stroke-width="1.7" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="273" y="224" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#sk)">4&gt;&gt;1</text>

  <g filter="url(#sk)">
    <rect x="298" y="212" width="44" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="320" y="237" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#sk)">2,3</text>
  <text x="320" y="266" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">t=3</text>
  <line x1="342" y1="232" x2="392" y2="232" stroke="#5a5a5a" stroke-width="1.7" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="367" y="224" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#sk)">3&gt;&gt;1</text>

  <g filter="url(#sk)">
    <rect x="392" y="212" width="44" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="414" y="237" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#sk)">2,1</text>
  <text x="414" y="266" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">t=4</text>
  <line x1="436" y1="232" x2="486" y2="232" stroke="#5a5a5a" stroke-width="1.7" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="461" y="224" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#sk)">2&gt;&gt;1</text>

  <g filter="url(#sk)">
    <rect x="486" y="212" width="44" height="40" rx="6" fill="#fff3d6" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="508" y="237" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">1,1</text>
  <text x="508" y="266" text-anchor="middle" font-size="10" fill="#7a5415" filter="url(#sk)">a=b</text>

  <g filter="url(#sk)">
    <rect x="544" y="214" width="60" height="36" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="574" y="236" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">= 5</text>

  <!-- ============ Row 3: [2,3] = 3 ============ -->
  <g filter="url(#sk)">
    <rect x="36" y="346" width="62" height="36" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8"/>
  </g>
  <text x="67" y="368" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a2a26" filter="url(#sk)">[2,3]</text>

  <g filter="url(#sk)">
    <rect x="110" y="344" width="44" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="132" y="369" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#sk)">2,3</text>
  <text x="132" y="398" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">t=1</text>
  <line x1="154" y1="364" x2="204" y2="364" stroke="#5a5a5a" stroke-width="1.7" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="179" y="356" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#sk)">3&gt;&gt;1</text>

  <g filter="url(#sk)">
    <rect x="204" y="344" width="44" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6"/>
  </g>
  <text x="226" y="369" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b4a66" filter="url(#sk)">2,1</text>
  <text x="226" y="398" text-anchor="middle" font-size="10" fill="#888" filter="url(#sk)">t=2</text>
  <line x1="248" y1="364" x2="298" y2="364" stroke="#5a5a5a" stroke-width="1.7" marker-end="url(#ar)" filter="url(#sk)"/>
  <text x="273" y="356" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#sk)">2&gt;&gt;1</text>

  <g filter="url(#sk)">
    <rect x="298" y="344" width="44" height="40" rx="6" fill="#fff3d6" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="320" y="369" text-anchor="middle" font-size="13" font-weight="bold" fill="#7a5415" filter="url(#sk)">1,1</text>
  <text x="320" y="398" text-anchor="middle" font-size="10" fill="#7a5415" filter="url(#sk)">a=b</text>

  <g filter="url(#sk)">
    <rect x="356" y="346" width="60" height="36" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.8"/>
  </g>
  <text x="386" y="368" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e6e2e" filter="url(#sk)">= 3</text>

  <text x="410" y="424" text-anchor="middle" font-size="11" fill="#7a5415" filter="url(#sk)">规律：答案 = t = (a 爬到 LCA 的步数) + (b 爬到 LCA 的步数) + 1</text>
</svg>
