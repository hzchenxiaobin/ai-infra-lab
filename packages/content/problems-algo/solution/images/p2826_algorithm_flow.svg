<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：值域三桶 DP（O(n)）</text>

  <!-- init -->
  <rect x="190" y="42" width="160" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="270" y="66" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">f1 = f2 = f3 = 0</text>

  <path d="M270,82 L270,104" stroke="#446688" stroke-width="1.8" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- loop diamond -->
  <polygon points="270,106 385,158 270,210 155,158" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="162" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">还有元素 x 未处理？</text>

  <!-- yes: down to three branches -->
  <path d="M270,210 L270,224" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="222" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>

  <path d="M110,224 L110,244" stroke="#446688" stroke-width="1.6" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <path d="M270,224 L270,244" stroke="#446688" stroke-width="1.6" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <path d="M430,224 L430,244" stroke="#446688" stroke-width="1.6" marker-end="url(#arrF)" filter="url(#rough2)"/>

  <!-- branch x=1 -->
  <rect x="40" y="246" width="140" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="110" y="266" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">x = 1</text>
  <text x="110" y="284" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">f1 += 1</text>
  <text x="110" y="299" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">1 最小，谁都能接</text>

  <!-- branch x=2 -->
  <rect x="190" y="246" width="140" height="58" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="260" y="266" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">x = 2</text>
  <text x="260" y="284" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">f2 = max(f1, f2) + 1</text>
  <text x="260" y="299" text-anchor="middle" font-size="9" fill="#446688" filter="url(#rough2)">前驱结尾值 ≤ 2</text>

  <!-- branch x=3 -->
  <rect x="340" y="246" width="140" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="410" y="266" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">x = 3</text>
  <text x="410" y="284" text-anchor="middle" font-size="11" fill="#d6a040" filter="url(#rough2)">f3 = max(f1,f2,f3)+1</text>
  <text x="410" y="299" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">前驱结尾值 ≤ 3</text>

  <!-- loop back -->
  <path d="M110,304 L110,318" stroke="#888" stroke-width="1.3" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <path d="M260,304 L260,318" stroke="#888" stroke-width="1.3" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <path d="M410,304 L410,318" stroke="#888" stroke-width="1.3" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <path d="M410,318 L20,318" stroke="#888" stroke-width="1.3" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <path d="M20,318 L20,158" stroke="#888" stroke-width="1.3" stroke-dasharray="4 3" fill="none" filter="url(#rough2)"/>
  <path d="M20,158 L151,158" stroke="#888" stroke-width="1.3" stroke-dasharray="4 3" fill="none" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="34" y="244" font-size="9" fill="#888" filter="url(#rough2)">下一轮</text>

  <!-- no branch -->
  <path d="M385,158 L495,158" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M495,158 L495,368" stroke="#b85450" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M495,368 L384,368" stroke="#b85450" stroke-width="1.6" marker-end="url(#arrF)" filter="url(#rough2)"/>
  <text x="442" y="150" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否，遍历完</text>

  <!-- result -->
  <rect x="170" y="346" width="210" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="275" y="373" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = n − max(f1, f2, f3)</text>

  <!-- note -->
  <rect x="30" y="398" width="460" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="260" y="414" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">f[v] = 以值 v 结尾的最长非递减子序列长度；值域 3 ⇒ max(f[1..x]) 可 O(1) 展开</text>
  <text x="260" y="427" text-anchor="middle" font-size="9" fill="#555" filter="url(#rough2)">注意 f1/f2/f3 不一定单调，转移必须真取 max</text>
</svg>
