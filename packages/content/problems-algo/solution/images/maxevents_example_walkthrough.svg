<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="680" height="360" fill="#fafafa"/>

  <text x="340" y="24" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">示例演算：events = [[1,2],[2,3],[3,4],[1,2]]</text>
  <text x="340" y="42" text-anchor="middle" font-size="11" fill="#888">排序后 [[1,2],[1,2],[2,3],[3,4]]，按天扫描，堆存 endDay</text>

  <!-- ===== table ===== -->
  <!-- columns: 天数 d (30-100), 入堆(end) (100-300), 清过期 (300-380), 堆状态 (380-510), 参加 (510-590), 累计 (590-660) -->
  <!-- header -->
  <rect x="30" y="58" width="630" height="32" rx="4" fill="#446688" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <g font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">
    <text x="65" y="78">天数 d</text>
    <text x="200" y="78">入堆 (会议→end)</text>
    <text x="340" y="78">清过期</text>
    <text x="445" y="78">堆(处理后)</text>
    <text x="550" y="78">参加</text>
    <text x="625" y="78">累计</text>
  </g>
  <!-- column separators -->
  <g stroke="#bbb" stroke-width="1" filter="url(#rough2)">
    <line x1="100" y1="58" x2="100" y2="294"/>
    <line x1="300" y1="58" x2="300" y2="294"/>
    <line x1="380" y1="58" x2="380" y2="294"/>
    <line x1="510" y1="58" x2="510" y2="294"/>
    <line x1="590" y1="58" x2="590" y2="294"/>
  </g>
  <line x1="30" y1="90" x2="660" y2="90" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>

  <!-- row 1: d=1 -->
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="65" y="118" font-weight="bold" fill="#d6a040">1</text>
    <text x="200" y="118">[1,2]→2, [1,2]→2</text>
    <text x="340" y="118" fill="#888">—</text>
    <!-- heap state boxes -->
    <rect x="404" y="106" width="28" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="418" y="121" font-size="10">2</text>
    <rect x="438" y="106" width="28" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="452" y="121" font-size="10">2</text>
    <rect x="540" y="106" width="36" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="558" y="121" font-size="10" fill="#2f5a22" font-weight="bold">弹2</text>
    <text x="625" y="118" font-weight="bold" fill="#4a7a3a">1</text>
  </g>
  <line x1="30" y1="138" x2="660" y2="138" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 2: d=2 -->
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="65" y="166" font-weight="bold" fill="#d6a040">2</text>
    <text x="200" y="166">[2,3]→3</text>
    <text x="340" y="166" fill="#888">无(end≥2)</text>
    <rect x="404" y="154" width="28" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="418" y="169" font-size="10">2</text>
    <rect x="438" y="154" width="28" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="452" y="169" font-size="10">3</text>
    <rect x="540" y="154" width="36" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="558" y="169" font-size="10" fill="#2f5a22" font-weight="bold">弹2</text>
    <text x="625" y="166" font-weight="bold" fill="#4a7a3a">2</text>
  </g>
  <line x1="30" y1="186" x2="660" y2="186" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 3: d=3 -->
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="65" y="214" font-weight="bold" fill="#d6a040">3</text>
    <text x="200" y="214">[3,4]→4</text>
    <text x="340" y="214" fill="#888">无</text>
    <rect x="404" y="202" width="28" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="418" y="217" font-size="10">3</text>
    <rect x="438" y="202" width="28" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="452" y="217" font-size="10">4</text>
    <rect x="540" y="202" width="36" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="558" y="217" font-size="10" fill="#2f5a22" font-weight="bold">弹3</text>
    <text x="625" y="214" font-weight="bold" fill="#4a7a3a">3</text>
  </g>
  <line x1="30" y1="234" x2="660" y2="234" stroke="#eee" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 4: d=4 -->
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="65" y="262" font-weight="bold" fill="#d6a040">4</text>
    <text x="200" y="262" fill="#888">—（i 已到末尾）</text>
    <text x="340" y="262" fill="#888">无</text>
    <rect x="418" y="250" width="28" height="20" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>
    <text x="432" y="265" font-size="10">4</text>
    <rect x="540" y="250" width="36" height="20" rx="3" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="558" y="265" font-size="10" fill="#2f5a22" font-weight="bold">弹4</text>
    <text x="625" y="262" font-weight="bold" fill="#4a7a3a">4</text>
  </g>

  <!-- outer border -->
  <rect x="30" y="58" width="630" height="236" rx="4" fill="none" stroke="#446688" stroke-width="1.3" filter="url(#rough2)"/>

  <!-- result note -->
  <rect x="30" y="306" width="630" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="50" y="330" font-size="12" fill="#2f5a22" font-weight="bold">结果：ans = 4，与示例 1 一致 ✓</text>
  <text x="50" y="346" font-size="10" fill="#555">每天弹堆顶（结束最早者）参加；堆中剩余 endDay 继续参与后续天的比较，过期则清掉。</text>
</svg>
