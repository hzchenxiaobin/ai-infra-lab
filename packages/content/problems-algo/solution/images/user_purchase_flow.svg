<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="620" height="520" fill="#fafafa"/>

  <text x="310" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">执行流程：CTE T 分类 → CROSS JOIN 网格 → LEFT JOIN 聚合</text>

  <!-- Step 1: CTE T -->
  <text x="40" y="58" font-size="11.5" fill="#888">① CTE T：按 (user_id, spend_date) 分组 + 分类</text>
  <rect x="40" y="66" width="540" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="60" y="88" font-size="11" fill="#446688" font-weight="bold">SELECT user_id, spend_date, SUM(amount) AS amount,</text>
  <text x="60" y="106" font-size="11" fill="#446688" font-weight="bold">       CASE WHEN COUNT(platform)=2 THEN 'both' ELSE MAX(platform) END AS plat</text>
  <text x="60" y="124" font-size="11" fill="#446688" font-weight="bold">FROM Spending GROUP BY user_id, spend_date</text>
  <text x="60" y="142" font-size="10.5" fill="#888">→ 每人每天一行，platform 归入 mobile / desktop / both</text>

  <path d="M 310 154 L 310 176" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: CROSS JOIN grid -->
  <text x="40" y="188" font-size="11.5" fill="#888">② 生成 (日期 × 3平台) 完整网格 — CROSS JOIN</text>
  <rect x="40" y="196" width="540" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="60" y="218" font-size="11" fill="#4a7a3a" font-weight="bold">FROM (SELECT DISTINCT spend_date FROM Spending) d</text>
  <text x="60" y="236" font-size="11" fill="#4a7a3a" font-weight="bold">CROSS JOIN (SELECT 'desktop' UNION SELECT 'mobile' UNION SELECT 'both') p</text>
  <text x="60" y="256" font-size="10.5" fill="#888">→ 每个日期强制生成 3 行（含 both），即使无匹配用户</text>
  <text x="60" y="274" font-size="10.5" fill="#888">  07-01 × {desktop, mobile, both} = 3 行</text>

  <path d="M 310 290 L 310 312" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: LEFT JOIN + aggregate -->
  <text x="40" y="324" font-size="11.5" fill="#888">③ LEFT JOIN T + GROUP BY 聚合（IFNULL 补零）</text>
  <rect x="40" y="332" width="540" height="100" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="60" y="354" font-size="11" fill="#d6a040" font-weight="bold">SELECT d.spend_date, p.p AS platform,</text>
  <text x="60" y="372" font-size="11" fill="#d6a040" font-weight="bold">       IFNULL(SUM(t.amount), 0) AS total_amount,</text>
  <text x="60" y="390" font-size="11" fill="#d6a040" font-weight="bold">       COUNT(t.user_id) AS total_users</text>
  <text x="60" y="408" font-size="11" fill="#d6a040" font-weight="bold">FROM ... LEFT JOIN T t ON t.spend_date=d.spend_date AND t.plat=p.p</text>
  <text x="60" y="424" font-size="10.5" fill="#888">GROUP BY d.spend_date, p.p</text>

  <path d="M 310 434 L 310 456" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="320" y="451" font-size="10" fill="#888">输出</text>

  <!-- Result -->
  <rect x="80" y="460" width="460" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="310" y="480" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">每个日期 3 行：desktop / mobile / both</text>
  <text x="310" y="498" text-anchor="middle" font-size="10.5" fill="#555">无匹配时 total_amount=0, total_users=0（COUNT 忽略 NULL）</text>
</svg>
