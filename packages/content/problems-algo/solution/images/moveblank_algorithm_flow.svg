<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="470" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：两目标取最小，每个目标数置换环</text>

  <!-- Stage 1 -->
  <rect x="80" y="44" width="400" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">① 两个目标态</text>
  <text x="280" y="78" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">A=[0,1,…,n−1]（空白在首, k=0）｜B=[1,2,…,n−1,0]（空白在尾, k=n−1）</text>
  <path d="M 280 88 L 280 100" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Stage 2 -->
  <rect x="80" y="104" width="400" height="40" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="122" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">② 变换 B 到同构（A 无需变换）</text>
  <text x="280" y="138" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">arr[i] = (nums[i] − 1 + n) mod n，使 B 的目标也变为 i == arr[i]</text>
  <path d="M 280 148 L 280 160" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Stage 3 -->
  <rect x="80" y="164" width="400" height="48" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="182" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">③ 数置换环：cnt ← 0，vis ← false</text>
  <text x="280" y="198" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">跳过 i==arr[i] 或 vis[i]；否则 cnt+=1（新环），</text>
  <text x="280" y="211" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">沿环标记 vis 并 cnt+=1 每元素（累加环长 m）</text>
  <path d="M 280 216 L 280 228" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Stage 4 -->
  <rect x="80" y="232" width="400" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="250" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">④ 空白修正：若 arr[k] ≠ k（空白错位）</text>
  <text x="280" y="266" text-anchor="middle" font-size="11" fill="#7a3a36" filter="url(#rough2)">cnt ← cnt − 2（含空白环应取 m−1 而非 m+1，差 2）</text>
  <path d="M 280 276 L 280 288" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Stage 5 : formula -->
  <rect x="80" y="292" width="400" height="44" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="310" text-anchor="middle" font-size="12" fill="#7a5a20" font-weight="bold" filter="url(#rough2)">⑤ 单目标代价公式</text>
  <text x="280" y="328" text-anchor="middle" font-size="12.5" fill="#7a5a20" font-weight="bold" filter="url(#rough2)">cnt = Σ(非平凡环 m + 1) − 2·[空白错位]</text>
  <path d="M 280 340 L 280 352" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Stage 6 -->
  <rect x="80" y="356" width="400" height="40" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="374" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">⑥ 对 A、B 各算一次</text>
  <text x="280" y="390" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">答案 = min(cnt_A, cnt_B)</text>
  <path d="M 280 400 L 280 412" stroke="#666" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- end -->
  <rect x="200" y="416" width="160" height="34" rx="17" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="437" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">返回 min(cnt_A, cnt_B)</text>

  <!-- side notes -->
  <text x="496" y="186" font-size="9.5" fill="#888" filter="url(#rough2)">O(n)</text>
  <text x="496" y="314" font-size="9.5" fill="#888" filter="url(#rough2)">O(n) 空间</text>
</svg>
