<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="470" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：head = [1,2,6,3,4,5,6]，val = 6</text>

  <!-- Frame 1: initial -->
  <text x="24" y="56" font-size="12" fill="#888" font-weight="bold">① 初始：curr = dummy</text>
  <rect x="32" y="64" width="46" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="55" y="82" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">∅</text>
  <line x1="78" y1="78" x2="104" y2="78" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="110" y="64" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="130" y="82" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <line x1="150" y1="78" x2="174" y2="78" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="180" y="64" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="200" y="82" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <line x1="220" y1="78" x2="244" y2="78" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="250" y="64" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="270" y="82" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">6</text>
  <line x1="290" y1="78" x2="314" y2="78" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="320" y="64" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="340" y="82" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <line x1="360" y1="78" x2="384" y2="78" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="390" y="64" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="410" y="82" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <line x1="430" y1="78" x2="454" y2="78" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="460" y="64" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="480" y="82" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <line x1="500" y1="78" x2="524" y2="78" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="530" y="64" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="550" y="82" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">6</text>
  <text x="55" y="58" font-size="9" fill="#d6a040" font-weight="bold">curr</text>
  <path d="M 55 60 L 55 64" stroke="#d6a040" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- Frame 2: curr at 2, skip first 6 -->
  <text x="24" y="120" font-size="12" fill="#888" font-weight="bold">② curr 走到 2，发现 next=6：跳过（curr 不动）</text>
  <rect x="32" y="128" width="46" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="55" y="146" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">∅</text>
  <line x1="78" y1="142" x2="104" y2="142" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="110" y="128" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="130" y="146" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <line x1="150" y1="142" x2="174" y2="142" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="180" y="128" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="200" y="146" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <line x1="220" y1="142" x2="244" y2="142" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="250" y="128" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="270" y="146" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">6</text>
  <line x1="290" y1="142" x2="314" y2="142" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="320" y="128" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="340" y="146" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <text x="200" y="122" font-size="9" fill="#b85450" font-weight="bold">curr</text>
  <path d="M 200 124 L 200 128" stroke="#b85450" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 220 138 Q 270 110 316 138" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="268" y="108" font-size="9" fill="#b85450">2.next 改指 3</text>

  <!-- Frame 3: after first 6 deleted -->
  <text x="24" y="184" font-size="12" fill="#888" font-weight="bold">③ 第一个 6 已删，curr 仍在 2（next 现为 3）</text>
  <rect x="32" y="192" width="46" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="55" y="210" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">∅</text>
  <line x1="78" y1="206" x2="104" y2="206" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="110" y="192" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="130" y="210" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <line x1="150" y1="206" x2="174" y2="206" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="180" y="192" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="200" y="210" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <line x1="220" y1="206" x2="244" y2="206" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="250" y="192" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="270" y="210" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <line x1="290" y1="206" x2="314" y2="206" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="320" y="192" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="340" y="210" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <line x1="360" y1="206" x2="384" y2="206" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="390" y="192" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="410" y="210" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <line x1="430" y1="206" x2="454" y2="206" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="460" y="192" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="480" y="210" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">6</text>
  <text x="200" y="186" font-size="9" fill="#b85450" font-weight="bold">curr</text>
  <path d="M 200 188 L 200 192" stroke="#b85450" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <text x="510" y="210" font-size="9" fill="#888">← 仍待删</text>

  <!-- Frame 4: curr at 5, delete second 6 -->
  <text x="24" y="248" font-size="12" fill="#888" font-weight="bold">④ curr 走到 5，发现 next=6：跳过，next 指向 ∅</text>
  <rect x="32" y="256" width="46" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="55" y="274" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">∅</text>
  <line x1="78" y1="270" x2="104" y2="270" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="110" y="256" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="130" y="274" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <line x1="150" y1="270" x2="174" y2="270" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="180" y="256" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="200" y="274" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <line x1="220" y1="270" x2="244" y2="270" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="250" y="256" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="270" y="274" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <line x1="290" y1="270" x2="314" y2="270" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="320" y="256" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="340" y="274" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <line x1="360" y1="270" x2="384" y2="270" stroke="#446688" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="390" y="256" width="40" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="410" y="274" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <rect x="460" y="256" width="40" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="480" y="274" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">6</text>
  <text x="410" y="250" font-size="9" fill="#b85450" font-weight="bold">curr</text>
  <path d="M 410 252 L 410 256" stroke="#b85450" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 430 266 Q 470 244 504 266" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="510" y="252" font-size="9" fill="#b85450">指向 ∅</text>

  <!-- Final result -->
  <text x="24" y="312" font-size="12" fill="#4a7a3a" font-weight="bold">⑤ curr.next = ∅，退出循环。返回 dummy.next</text>
  <rect x="32" y="320" width="46" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="55" y="338" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">∅</text>
  <line x1="78" y1="334" x2="104" y2="334" stroke="#d6a040" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="110" y="320" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="130" y="338" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <line x1="150" y1="334" x2="174" y2="334" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="180" y="320" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="200" y="338" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <line x1="220" y1="334" x2="244" y2="334" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="250" y="320" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="270" y="338" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <line x1="290" y1="334" x2="314" y2="334" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="320" y="320" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="340" y="338" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">4</text>
  <line x1="360" y1="334" x2="384" y2="334" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="390" y="320" width="40" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="410" y="338" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">5</text>
  <line x1="430" y1="334" x2="460" y2="334" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="470" y="338" font-size="11" fill="#888">∅</text>

  <!-- key takeaway -->
  <rect x="32" y="370" width="536" height="84" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough)"/>
  <text x="46" y="392" font-size="12" fill="#333" font-weight="bold">观察要点：</text>
  <text x="46" y="410" font-size="11" fill="#333">• 删除时 <tspan font-weight="bold">curr 不前进</tspan>：第 ③ 帧中删完第一个 6 后 curr 仍在 2，得以继续检查新的 next=3</text>
  <text x="46" y="426" font-size="11" fill="#333">• 保留时 curr 才前进：3≠6 → curr 移到 3，4≠6 → curr 移到 4，5≠6 → curr 移到 5</text>
  <text x="46" y="442" font-size="11" fill="#666">• 若删后立刻前进，连续目标值（如 7→7→7）会漏删——这是本题最易踩的坑</text>
</svg>
