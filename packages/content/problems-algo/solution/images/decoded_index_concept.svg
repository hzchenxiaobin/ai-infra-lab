<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：解码串可能长达 2^63 → 不能构造，只能「正向算长度 + 逆向定位」</text>

  <!-- ===== Top: Forward encoding process ===== -->
  <text x="40" y="52" font-size="12" fill="#888" font-weight="bold">正向展开 s = "leet2code3"：</text>

  <!-- step 1: leet -->
  <rect x="40" y="60" width="120" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="100" y="80" text-anchor="middle" font-size="12" fill="#333">leet</text>
  <text x="100" y="104" text-anchor="middle" font-size="10" fill="#888">size = 4</text>

  <!-- arrow -->
  <path d="M 162 75 L 178 75" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="170" y="68" text-anchor="middle" font-size="10" fill="#d6a040">×2</text>

  <!-- step 2: leetleet -->
  <rect x="180" y="60" width="140" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="250" y="80" text-anchor="middle" font-size="11" fill="#333">leetleet</text>
  <text x="250" y="104" text-anchor="middle" font-size="10" fill="#888">size = 8</text>

  <!-- arrow -->
  <path d="M 322 75 L 338 75" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="330" y="68" text-anchor="middle" font-size="10" fill="#446688">+code</text>

  <!-- step 3: leetleetcode -->
  <rect x="340" y="60" width="180" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="80" text-anchor="middle" font-size="10" fill="#333">leetleetcode</text>
  <text x="430" y="104" text-anchor="middle" font-size="10" fill="#888">size = 12</text>

  <!-- arrow down to repeat -->
  <path d="M 430 112 L 430 126" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="446" y="122" font-size="10" fill="#d6a040">×3</text>

  <!-- ===== Warning box: too big ===== -->
  <rect x="120" y="132" width="320" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="152" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">⚠ 解码串可达 2^63 个字符</text>
  <text x="280" y="168" text-anchor="middle" font-size="11" fill="#b85450">内存爆炸！不能真正构造字符串</text>

  <!-- ===== Bottom: Backward approach ===== -->
  <line x1="40" y1="190" x2="520" y2="190" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4" filter="url(#rough2)"/>

  <text x="40" y="210" font-size="12" fill="#888" font-weight="bold">逆向定位 k = 10（从右往左扫 s）：</text>

  <!-- The string s with indices -->
  <text x="40" y="234" font-size="11" fill="#999">s:</text>

  <!-- characters of "leet2code3" -->
  <g filter="url(#rough2)">
    <rect x="70" y="222" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="87" y="242" text-anchor="middle" font-size="12" fill="#333">l</text>

    <rect x="106" y="222" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="123" y="242" text-anchor="middle" font-size="12" fill="#333">e</text>

    <rect x="142" y="222" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="159" y="242" text-anchor="middle" font-size="12" fill="#333">e</text>

    <rect x="178" y="222" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="195" y="242" text-anchor="middle" font-size="12" fill="#333">t</text>

    <rect x="214" y="222" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <text x="231" y="242" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>

    <rect x="250" y="222" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="267" y="242" text-anchor="middle" font-size="12" fill="#333">c</text>

    <rect x="286" y="222" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="303" y="242" text-anchor="middle" font-size="12" fill="#333">o</text>

    <rect x="322" y="222" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="339" y="242" text-anchor="middle" font-size="12" fill="#333">d</text>

    <rect x="358" y="222" width="34" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="375" y="242" text-anchor="middle" font-size="12" fill="#333">e</text>

    <rect x="394" y="222" width="34" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3"/>
    <text x="411" y="242" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
  </g>

  <!-- backward arrow -->
  <path d="M 428 270 L 80 270" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="250" y="284" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">← 逆向扫描</text>

  <!-- Step boxes -->
  <rect x="40" y="296" width="150" height="78" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="115" y="316" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 正向算 size</text>
  <text x="115" y="336" text-anchor="middle" font-size="10" fill="#555">字母 → size += 1</text>
  <text x="115" y="352" text-anchor="middle" font-size="10" fill="#555">数字 d → size *= d</text>
  <text x="115" y="368" text-anchor="middle" font-size="10" fill="#4a7a3a">size ≥ k 即停</text>

  <rect x="205" y="296" width="150" height="78" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="316" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② 逆向缩 k</text>
  <text x="280" y="336" text-anchor="middle" font-size="10" fill="#555">数字 d → size /= d</text>
  <text x="280" y="352" text-anchor="middle" font-size="10" fill="#555">k = (k-1)%size+1</text>
  <text x="280" y="368" text-anchor="middle" font-size="10" fill="#446688">折叠回单份</text>

  <rect x="370" y="296" width="150" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="445" y="316" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ 命中返回</text>
  <text x="445" y="336" text-anchor="middle" font-size="10" fill="#555">字母且 k==size</text>
  <text x="445" y="352" text-anchor="middle" font-size="10" fill="#555">→ 该字母即答案</text>
  <text x="445" y="368" text-anchor="middle" font-size="10" fill="#d6a040">否则 size -= 1</text>

  <!-- arrows between steps -->
  <path d="M 190 335 L 205 335" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 355 335 L 370 335" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
</svg>
