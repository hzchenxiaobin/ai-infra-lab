<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">n=6 的 5 种不相交握手方案</text>

  <!-- Pattern 1: (0,1)(2,3)(4,5) -->
  <ellipse cx="90" cy="90" rx="45" ry="45" fill="none" stroke="#ccc" stroke-width="1.2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <!-- dots: 0 top, 1 tr, 2 br, 3 bottom, 4 bl, 5 tl -->
  <circle cx="90" cy="45" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="48" text-anchor="middle" font-size="8" fill="#d6a040">0</text>
  <circle cx="135" cy="90" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="135" y="93" text-anchor="middle" font-size="8" fill="#d6a040">1</text>
  <circle cx="129" cy="121" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="129" y="124" text-anchor="middle" font-size="8" fill="#446688">2</text>
  <circle cx="90" cy="135" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="90" y="138" text-anchor="middle" font-size="8" fill="#446688">3</text>
  <circle cx="51" cy="121" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="51" y="124" text-anchor="middle" font-size="8" fill="#4a7a3a">4</text>
  <circle cx="45" cy="90" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="45" y="93" text-anchor="middle" font-size="8" fill="#4a7a3a">5</text>
  <!-- chords -->
  <path d="M 90 45 L 135 90" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 129 121 L 90 135" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 51 121 L 45 90" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="90" y="160" text-anchor="middle" font-size="9" fill="#888">①(0,1)(2,3)(4,5)</text>

  <!-- Pattern 2: (0,1)(2,5)(3,4) -->
  <ellipse cx="280" cy="90" rx="45" ry="45" fill="none" stroke="#ccc" stroke-width="1.2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <circle cx="280" cy="45" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="48" text-anchor="middle" font-size="8" fill="#d6a040">0</text>
  <circle cx="325" cy="90" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="325" y="93" text-anchor="middle" font-size="8" fill="#d6a040">1</text>
  <circle cx="319" cy="121" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="319" y="124" text-anchor="middle" font-size="8" fill="#446688">2</text>
  <circle cx="280" cy="135" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="280" y="138" text-anchor="middle" font-size="8" fill="#446688">3</text>
  <circle cx="241" cy="121" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="241" y="124" text-anchor="middle" font-size="8" fill="#4a7a3a">4</text>
  <circle cx="235" cy="90" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="235" y="93" text-anchor="middle" font-size="8" fill="#4a7a3a">5</text>
  <path d="M 280 45 L 325 90" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 319 121 L 235 90" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 280 135 L 241 121" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="280" y="160" text-anchor="middle" font-size="9" fill="#888">②(0,1)(2,5)(3,4)</text>

  <!-- Pattern 3: (0,3)(1,2)(4,5) -->
  <ellipse cx="470" cy="90" rx="45" ry="45" fill="none" stroke="#ccc" stroke-width="1.2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <circle cx="470" cy="45" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470" y="48" text-anchor="middle" font-size="8" fill="#d6a040">0</text>
  <circle cx="515" cy="90" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="515" y="93" text-anchor="middle" font-size="8" fill="#4a7a3a">1</text>
  <circle cx="509" cy="121" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="509" y="124" text-anchor="middle" font-size="8" fill="#4a7a3a">2</text>
  <circle cx="470" cy="135" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="470" y="138" text-anchor="middle" font-size="8" fill="#d6a040">3</text>
  <circle cx="431" cy="121" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="431" y="124" text-anchor="middle" font-size="8" fill="#446688">4</text>
  <circle cx="425" cy="90" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="425" y="93" text-anchor="middle" font-size="8" fill="#446688">5</text>
  <path d="M 470 45 L 470 135" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 515 90 L 509 121" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 431 121 L 425 90" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="470" y="160" text-anchor="middle" font-size="9" fill="#888">③(0,3)(1,2)(4,5)</text>

  <!-- Pattern 4: (0,5)(1,2)(3,4) -->
  <ellipse cx="180" cy="260" rx="45" ry="45" fill="none" stroke="#ccc" stroke-width="1.2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <circle cx="180" cy="215" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="218" text-anchor="middle" font-size="8" fill="#d6a040">0</text>
  <circle cx="225" cy="260" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="225" y="263" text-anchor="middle" font-size="8" fill="#4a7a3a">1</text>
  <circle cx="219" cy="291" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="219" y="294" text-anchor="middle" font-size="8" fill="#4a7a3a">2</text>
  <circle cx="180" cy="305" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="180" y="308" text-anchor="middle" font-size="8" fill="#446688">3</text>
  <circle cx="141" cy="291" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="141" y="294" text-anchor="middle" font-size="8" fill="#446688">4</text>
  <circle cx="135" cy="260" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="135" y="263" text-anchor="middle" font-size="8" fill="#d6a040">5</text>
  <path d="M 180 215 L 135 260" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 225 260 L 219 291" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 180 305 L 141 291" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="180" y="330" text-anchor="middle" font-size="9" fill="#888">④(0,5)(1,2)(3,4)</text>

  <!-- Pattern 5: (0,5)(1,4)(2,3) -->
  <ellipse cx="380" cy="260" rx="45" ry="45" fill="none" stroke="#ccc" stroke-width="1.2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <circle cx="380" cy="215" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="218" text-anchor="middle" font-size="8" fill="#d6a040">0</text>
  <circle cx="425" cy="260" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="425" y="263" text-anchor="middle" font-size="8" fill="#4a7a3a">1</text>
  <circle cx="419" cy="291" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="419" y="294" text-anchor="middle" font-size="8" fill="#446688">2</text>
  <circle cx="380" cy="305" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="380" y="308" text-anchor="middle" font-size="8" fill="#446688">3</text>
  <circle cx="341" cy="291" r="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="341" y="294" text-anchor="middle" font-size="8" fill="#4a7a3a">4</text>
  <circle cx="335" cy="260" r="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="335" y="263" text-anchor="middle" font-size="8" fill="#d6a040">5</text>
  <path d="M 380 215 L 335 260" stroke="#d6a040" stroke-width="1.8" fill="none" filter="url(#rough2)"/>
  <path d="M 425 260 L 341 291" stroke="#4a7a3a" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <path d="M 419 291 L 380 305" stroke="#446688" stroke-width="1.5" fill="none" filter="url(#rough2)"/>
  <text x="380" y="330" text-anchor="middle" font-size="9" fill="#888">⑤(0,5)(1,4)(2,3)</text>

  <!-- DP table -->
  <path d="M 40 360 L 520 360" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <text x="280" y="384" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">DP 计算过程</text>

  <!-- Table header -->
  <rect x="80" y="395" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="110" y="411" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">dp[0]</text>
  <rect x="140" y="395" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="170" y="411" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">dp[2]</text>
  <rect x="200" y="395" width="60" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="230" y="411" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">dp[4]</text>
  <rect x="260" y="395" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="300" y="411" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">dp[6]</text>
  <rect x="340" y="395" width="60" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="370" y="411" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">dp[8]</text>

  <!-- Table values -->
  <rect x="80" y="419" width="60" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="110" y="435" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="140" y="419" width="60" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="170" y="435" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="200" y="419" width="60" height="24" fill="#fafafa" stroke="#446688" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="230" y="435" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="260" y="419" width="80" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="300" y="435" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">5</text>
  <rect x="340" y="419" width="60" height="24" fill="#fafafa" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="370" y="435" text-anchor="middle" font-size="11" fill="#333">14</text>
</svg>
