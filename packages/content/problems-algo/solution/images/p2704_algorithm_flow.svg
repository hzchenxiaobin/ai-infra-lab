<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="28" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：两个方法各自一条「比较 → 返回 / 抛错」的分支</text>

  <!-- ===== Left branch: toBe ===== -->
  <!-- toBe entry -->
  <rect x="40" y="55" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="140" y="80" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">toBe(other)</text>

  <!-- arrow down -->
  <path d="M 140 97 L 140 120" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamond: val === other? -->
  <polygon points="140,125 220,165 140,205 60,165" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="162" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">val === other</text>
  <text x="140" y="178" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">?</text>

  <!-- Yes branch (left) -->
  <path d="M 60 165 L 30 165 L 30 235" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="35" y="158" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="15" y="240" width="90" height="35" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="60" y="262" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return true</text>

  <!-- No branch (right) -->
  <path d="M 220 165 L 250 165 L 250 235" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="225" y="158" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <rect x="195" y="240" width="120" height="35" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="255" y="262" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">throw "Not Equal"</text>

  <!-- ===== Right branch: notToBe ===== -->
  <!-- notToBe entry -->
  <rect x="340" y="55" width="200" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="440" y="80" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">notToBe(other)</text>

  <!-- arrow down -->
  <path d="M 440 97 L 440 120" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamond: val !== other? -->
  <polygon points="440,125 520,165 440,205 360,165" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="440" y="162" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">val !== other</text>
  <text x="440" y="178" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">?</text>

  <!-- Yes branch (left) -->
  <path d="M 360 165 L 330 165 L 330 235" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrGreen)" filter="url(#rough2)"/>
  <text x="335" y="158" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <rect x="315" y="240" width="90" height="35" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="360" y="262" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">return true</text>

  <!-- No branch (right) -->
  <path d="M 520 165 L 545 165 L 545 235" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="525" y="158" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <rect x="465" y="240" width="90" height="35" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="510" y="255" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">throw</text>
  <text x="510" y="269" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">"Equal"</text>

  <!-- divider -->
  <line x1="280" y1="50" x2="280" y2="290" stroke="#eee" stroke-width="1" stroke-dasharray="3,3" filter="url(#rough2)"/>

  <!-- Bottom summary -->
  <rect x="40" y="310" width="480" height="90" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="60" y="332" font-size="12" fill="#444" font-weight="bold">对称结构：</text>
  <text x="60" y="350" font-size="11" fill="#666">toBe：相等 → true，不等 → throw "Not Equal"</text>
  <text x="60" y="368" font-size="11" fill="#666">notToBe：不等 → true，相等 → throw "Equal"</text>
  <text x="60" y="388" font-size="11" fill="#d6a040" font-weight="bold">抛出的错误信息恰好是断言失败的反面（toBe 期望相等，失败说"不相等"）</text>
</svg>
