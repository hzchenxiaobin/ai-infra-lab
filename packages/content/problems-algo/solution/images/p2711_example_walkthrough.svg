<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例 1 演算：grid → answer</text>

  <!-- ===== Grid matrix (left) ===== -->
  <text x="90" y="54" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">grid</text>

  <!-- 3x3 grid, cell 44px, start x=46, y=60 -->
  <!-- Row 0: 1 2 3 -->
  <rect x="46" y="60" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="68" y="88" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="90" y="60" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="88" text-anchor="middle" font-size="14" fill="#333">2</text>
  <rect x="134" y="60" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="156" y="88" text-anchor="middle" font-size="14" fill="#333">3</text>

  <!-- Row 1: 3 1 5 -->
  <rect x="46" y="104" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="68" y="132" text-anchor="middle" font-size="14" fill="#333">3</text>
  <rect x="90" y="104" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="132" text-anchor="middle" font-size="14" fill="#333">1</text>
  <rect x="134" y="104" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="156" y="132" text-anchor="middle" font-size="14" fill="#333">5</text>

  <!-- Row 2: 3 2 1 -->
  <rect x="46" y="148" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="68" y="176" text-anchor="middle" font-size="14" fill="#333">3</text>
  <rect x="90" y="148" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="112" y="176" text-anchor="middle" font-size="14" fill="#333">2</text>
  <rect x="134" y="148" width="44" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="156" y="176" text-anchor="middle" font-size="14" fill="#333">1</text>

  <!-- Arrow grid -> answer -->
  <path d="M 188 130 L 248 130" stroke="#446688" stroke-width="2.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="218" y="122" text-anchor="middle" font-size="9" fill="#888">两遍扫描</text>

  <!-- ===== Answer matrix (right) ===== -->
  <text x="330" y="54" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">answer</text>

  <!-- Row 0: 1 1 0 -->
  <rect x="286" y="60" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="308" y="88" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">1</text>
  <rect x="330" y="60" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="352" y="88" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">1</text>
  <rect x="374" y="60" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="396" y="88" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">0</text>

  <!-- Row 1: 1 0 1 -->
  <rect x="286" y="104" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="308" y="132" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">1</text>
  <rect x="330" y="104" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="352" y="132" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="374" y="104" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="396" y="132" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">1</text>

  <!-- Row 2: 0 1 1 -->
  <rect x="286" y="148" width="44" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="308" y="176" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">0</text>
  <rect x="330" y="148" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="352" y="176" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">1</text>
  <rect x="374" y="148" width="44" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="396" y="176" text-anchor="middle" font-size="14" fill="#d6a040" font-weight="bold">1</text>

  <!-- Annotations for key cells -->
  <!-- (0,0) annotation -->
  <path d="M 68 104 L 68 210" stroke="#b85450" stroke-width="1.2" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="68" y="224" text-anchor="middle" font-size="9" fill="#b85450">(0,0): TL={} BR={1,1}</text>
  <text x="68" y="237" text-anchor="middle" font-size="9" fill="#b85450">→ |0-1| = 1</text>

  <!-- (1,1) annotation -->
  <path d="M 352 148 L 352 210" stroke="#4a7a3a" stroke-width="1.2" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="352" y="224" text-anchor="middle" font-size="9" fill="#4a7a3a">(1,1): TL={1} BR={1}</text>
  <text x="352" y="237" text-anchor="middle" font-size="9" fill="#4a7a3a">→ |1-1| = 0</text>

  <!-- (2,0) annotation -->
  <path d="M 68 192 L 100 210" stroke="#446688" stroke-width="1.2" fill="none" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="140" y="224" text-anchor="middle" font-size="9" fill="#446688">(2,0): 独占对角线</text>
  <text x="140" y="237" text-anchor="middle" font-size="9" fill="#446688">TL={} BR={} → |0-0|=0</text>

  <!-- Legend -->
  <rect x="40" y="260" width="440" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="278" text-anchor="middle" font-size="11" fill="#333">绿色 = TL=BR（答案 0）；橙色 = TL≠BR（答案非 0）</text>

  <!-- Summary -->
  <rect x="40" y="300" width="440" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="318" text-anchor="middle" font-size="11" fill="#444">对角线 d=r-c 恒定，逐条处理：正向记 TL、逆向记 BR</text>
  <text x="260" y="335" text-anchor="middle" font-size="11" fill="#444">同一 set 滚动复用，每个格子恰好被访问 2 次 → O(m×n)</text>
</svg>
