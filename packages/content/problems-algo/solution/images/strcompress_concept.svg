<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">原地压缩：读指针扫连续段，写指针落「字符 + 段长」</text>

  <!-- READ section label -->
  <text x="40" y="76" font-size="12" fill="#4a7a3a" font-weight="bold">读 read</text>
  <text x="40" y="91" font-size="10" fill="#888">扫一段同字符</text>

  <!-- group frame around first 3 cells (aaa) -->
  <rect x="64" y="58" width="156" height="48" fill="none" stroke="#4a7a3a" stroke-width="2.2" rx="6" filter="url(#rough2)"/>
  <text x="142" y="52" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold">连续段 = "aaa"，count = 3</text>

  <!-- input cells: a a a b b c c c, w=44 start x=70 -->
  <rect x="70" y="64" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="92" y="88" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">a</text>
  <rect x="114" y="64" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="136" y="88" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">a</text>
  <rect x="158" y="64" width="44" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="180" y="88" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">a</text>
  <rect x="202" y="64" width="44" height="36" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="224" y="88" text-anchor="middle" font-size="16" fill="#bbb" font-weight="bold">b</text>
  <rect x="246" y="64" width="44" height="36" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="268" y="88" text-anchor="middle" font-size="16" fill="#bbb" font-weight="bold">b</text>
  <rect x="290" y="64" width="44" height="36" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="312" y="88" text-anchor="middle" font-size="16" fill="#bbb" font-weight="bold">c</text>
  <rect x="334" y="64" width="44" height="36" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="356" y="88" text-anchor="middle" font-size="16" fill="#bbb" font-weight="bold">c</text>
  <rect x="378" y="64" width="44" height="36" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="400" y="88" text-anchor="middle" font-size="16" fill="#bbb" font-weight="bold">c</text>

  <!-- read pointer arrow under first cell -->
  <text x="92" y="118" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">↑ read</text>
  <path d="M180 120 Q 180 134 270 150" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="232" y="138" font-size="10.5" fill="#4a7a3a">count=3 &gt; 1 → 写 a 再写 3</text>

  <!-- WRITE section -->
  <text x="40" y="176" font-size="12" fill="#446688" font-weight="bold">写 write</text>
  <text x="40" y="191" font-size="10" fill="#888">原地覆写</text>

  <!-- output cells: a 3 _ _ _ _ (first two filled) -->
  <rect x="70" y="164" width="44" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="92" y="188" text-anchor="middle" font-size="16" fill="#446688" font-weight="bold">a</text>
  <rect x="114" y="164" width="44" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="136" y="188" text-anchor="middle" font-size="16" fill="#d6a040" font-weight="bold">3</text>
  <rect x="158" y="164" width="44" height="36" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="180" y="188" text-anchor="middle" font-size="13" fill="#bbb">·</text>
  <rect x="202" y="164" width="44" height="36" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="224" y="188" text-anchor="middle" font-size="13" fill="#bbb">·</text>
  <rect x="246" y="164" width="44" height="36" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="268" y="188" text-anchor="middle" font-size="13" fill="#bbb">·</text>
  <rect x="290" y="164" width="44" height="36" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="312" y="188" text-anchor="middle" font-size="13" fill="#bbb">·</text>
  <rect x="334" y="164" width="44" height="36" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="356" y="188" text-anchor="middle" font-size="13" fill="#bbb">·</text>
  <rect x="378" y="164" width="44" height="36" fill="#f4f4f4" stroke="#bbb" stroke-width="1.2" rx="4" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="400" y="188" text-anchor="middle" font-size="13" fill="#bbb">·</text>

  <text x="92" y="218" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold">写字符</text>
  <text x="136" y="218" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold">写段长</text>
  <text x="180" y="218" text-anchor="middle" font-size="10.5" fill="#446688">↑ write 前进 2 格</text>

  <!-- multi-digit note -->
  <rect x="48" y="236" width="444" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="270" y="256" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">段长 ≥ 10 时按位拆数字：12 → '1'、'2'</text>
  <text x="270" y="274" text-anchor="middle" font-size="11" fill="#d6a040">如 bbb…(12 个) → 写 'b' '1' '2'，write 前进 3 格</text>

  <!-- rule box -->
  <rect x="48" y="296" width="444" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="270" y="318" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold">写入规则</text>
  <text x="270" y="338" text-anchor="middle" font-size="11.5" fill="#446688">count = 1 → 只写字符；count &gt; 1 → 字符 + 段长各位</text>
  <text x="270" y="354" text-anchor="middle" font-size="11" fill="#446688">返回值 = write（压缩后的新长度）</text>
</svg>
