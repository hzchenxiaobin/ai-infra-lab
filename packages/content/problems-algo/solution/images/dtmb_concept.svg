<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bbb"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">引爆关系是有向的：A 炸得到 B ≠ B 炸得到 A</text>

  <!-- ====== Left scene: A small, B large, B reaches A but not vice versa ====== -->
  <text x="140" y="58" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">半径不对称</text>

  <!-- A's explosion range (small) -->
  <circle cx="90" cy="130" r="38" fill="#e8f0fe" fill-opacity="0.55" stroke="#446688" stroke-width="1.5" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <!-- A bomb -->
  <circle cx="90" cy="130" r="6" fill="#446688" filter="url(#rough2)"/>
  <text x="90" y="118" text-anchor="middle" font-size="11" fill="#335" font-weight="bold">A</text>
  <text x="90" y="186" text-anchor="middle" font-size="10" fill="#888">r=3</text>

  <!-- B's explosion range (large, reaches A) -->
  <circle cx="220" cy="130" r="68" fill="#e6f4ea" fill-opacity="0.45" stroke="#4a7a3a" stroke-width="1.8" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <!-- B bomb -->
  <circle cx="220" cy="130" r="6" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="220" y="118" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">B</text>
  <text x="220" y="210" text-anchor="middle" font-size="10" fill="#888">r=5</text>

  <!-- distance label -->
  <path d="M 90 145 L 220 145" stroke="#bbb" stroke-width="1" stroke-dasharray="2,2" filter="url(#rough2)"/>
  <text x="155" y="160" text-anchor="middle" font-size="10" fill="#999">距离 = 4</text>

  <!-- directed edge B -> A (exists, red) -->
  <path d="M 214 122 Q 155 95 96 122" fill="none" stroke="#b85450" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="155" y="92" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">4 ≤ r_B=5 ✓</text>

  <!-- directed edge A -> B (does NOT exist, gray dashed with X) -->
  <path d="M 96 138 Q 155 162 214 138" fill="none" stroke="#bbb" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arrGray)" filter="url(#rough2)"/>
  <text x="155" y="178" text-anchor="middle" font-size="10" fill="#999" font-weight="bold">4 &gt; r_A=3 ✗</text>

  <!-- divider -->
  <path d="M 290 50 L 290 220" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- ====== Right scene: directed graph abstraction ====== -->
  <text x="420" y="58" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">抽象为有向图</text>

  <!-- nodes -->
  <circle cx="360" cy="100" r="14" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="360" y="104" text-anchor="middle" font-size="11" fill="#335" font-weight="bold">A</text>

  <circle cx="480" cy="100" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="480" y="104" text-anchor="middle" font-size="11" fill="#3a5a2a" font-weight="bold">B</text>

  <circle cx="420" cy="180" r="14" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="420" y="184" text-anchor="middle" font-size="11" fill="#a87020" font-weight="bold">C</text>

  <!-- B -> A -->
  <path d="M 466 100 L 374 100" fill="none" stroke="#b85450" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- B -> C -->
  <path d="M 470 113 Q 450 145 432 168" fill="none" stroke="#b85450" stroke-width="2.2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- C -> A (no, dashed gray) -->
  <path d="M 410 170 Q 380 140 366 114" fill="none" stroke="#bbb" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrGray)" filter="url(#rough2)"/>

  <text x="420" y="232" text-anchor="middle" font-size="10" fill="#888">边 i→j 当且仅当 j 在 i 的爆炸范围内</text>

  <!-- ====== Bottom: key insight ====== -->
  <rect x="40" y="260" width="480" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="284" text-anchor="middle" font-size="13" fill="#a87020" font-weight="bold">核心观察</text>

  <text x="60" y="308" font-size="12" fill="#555">• 判定边 i→j 用「引爆者 i 的半径」：(xᵢ−xⱼ)² + (yᵢ−yⱼ)² ≤ rᵢ²</text>
  <text x="60" y="328" font-size="12" fill="#555">• 关系不对称：i→j 与 j→i 不一定同时成立 → 必须建<strong>有向图</strong></text>
  <text x="60" y="348" font-size="12" fill="#555">• 用<strong>平方距离</strong>比较，避免 sqrt 的精度误差与性能开销</text>
  <text x="60" y="368" font-size="12" fill="#b85450" font-weight="bold">• 不能用并查集！并查集会双向化有向边，得出偏大答案</text>
</svg>
