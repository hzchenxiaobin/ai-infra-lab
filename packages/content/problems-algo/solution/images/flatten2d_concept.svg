<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">展开二维向量：双指针惰性遍历，hasNext() 负责跳过空行</text>

  <!-- Row labels -->
  <text x="80" y="76" text-anchor="end" font-size="11" fill="#888">row 0</text>
  <text x="80" y="116" text-anchor="end" font-size="11" fill="#888">row 1</text>
  <text x="80" y="156" text-anchor="end" font-size="11" fill="#b85450">row 2</text>
  <text x="80" y="196" text-anchor="end" font-size="11" fill="#4a7a3a" font-weight="bold">row 3</text>

  <!-- Row 0: [1, 2] -->
  <rect x="90" y="56" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="111" y="76" text-anchor="middle" font-size="13" fill="#333">1</text>
  <rect x="134" y="56" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="76" text-anchor="middle" font-size="13" fill="#333">2</text>

  <!-- Row 1: [3] -->
  <rect x="90" y="96" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="111" y="116" text-anchor="middle" font-size="13" fill="#333">3</text>

  <!-- Row 2: [] (empty) -->
  <rect x="90" y="136" width="86" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" rx="4" filter="url(#rough2)"/>
  <text x="133" y="156" text-anchor="middle" font-size="11" fill="#b85450">空向量</text>

  <!-- Row 3: [4, 5, 6] -->
  <rect x="90" y="176" width="42" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="111" y="196" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="134" y="176" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="196" text-anchor="middle" font-size="13" fill="#333">5</text>
  <rect x="178" y="176" width="42" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="199" y="196" text-anchor="middle" font-size="13" fill="#333">6</text>

  <!-- col pointer (above row 3, first cell) -->
  <text x="111" y="46" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">col=0</text>
  <path d="M 111 48 L 111 55" stroke="#4a7a3a" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Skip arrow: bypassing empty row 2 -->
  <path d="M 185 151 Q 220 161 185 171" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="3,2" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="228" y="165" font-size="10" fill="#b85450">跳过</text>

  <!-- Right side: state annotation -->
  <rect x="260" y="56" width="250" height="90" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="78" font-size="12" fill="#333" font-weight="bold">hasNext() 调用后</text>
  <text x="280" y="100" font-size="11" fill="#4a7a3a" font-weight="bold">row = 3, col = 0</text>
  <text x="280" y="120" font-size="11" fill="#555">→ vec[3][0] = 4</text>
  <text x="280" y="138" font-size="11" fill="#4a7a3a">next() 返回 4, col→1</text>

  <!-- vec label -->
  <text x="133" y="46" text-anchor="middle" font-size="10" fill="#888">vec = [[1,2],[3],[],[4,5,6]]</text>

  <!-- Explanation box -->
  <rect x="40" y="230" width="480" height="110" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="254" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">惰性遍历核心思想</text>
  <text x="60" y="278" font-size="11" fill="#555">• hasNext() 推进 row/col 到下一个有效元素</text>
  <text x="60" y="300" font-size="11" fill="#555">• 空内层向量直接 row++ 跳过（col ≥ size() == 0 天然成立）</text>
  <text x="60" y="322" font-size="11" fill="#555">• next() 只在位置有效后读取 vec[row][col] 并 col++</text>
</svg>
