<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="480" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="280" y="26" text-anchor="middle" font-size="14.5" fill="#333" font-weight="bold" filter="url(#rough2)">
    示例演算：count = [0,1,3,4,0,…]
  </text>
  <text x="280" y="44" text-anchor="middle" font-size="11.5" fill="#888" filter="url(#rough2)">
    展开样本 = [1, 2,2,2, 3,3,3,3]，total = 8
  </text>

  <!-- ===== 展开样本条 ===== -->
  <text x="40" y="74" font-size="11" fill="#888" filter="url(#rough2)">样本（已排序）：</text>

  <!-- 8 个格子: idx=1 值1, idx=2 值2×3, idx=3 值3×4 -->
  <!-- 格子 w=48, 间距 6, 起始 x=130 -->
  <g filter="url(#rough2)">
    <!-- 位0: 值1 -->
    <rect x="130" y="82" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <!-- 位1: 值2 -->
    <rect x="184" y="82" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <!-- 位2: 值2 -->
    <rect x="238" y="82" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <!-- 位3: 值2 ← mid₁ -->
    <rect x="292" y="82" width="48" height="34" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5"/>
    <!-- 位4: 值3 ← mid₂ -->
    <rect x="346" y="82" width="48" height="34" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5"/>
    <!-- 位5: 值3 -->
    <rect x="400" y="82" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <!-- 位6: 值3 -->
    <rect x="454" y="82" width="48" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <g font-size="12" fill="#333" text-anchor="middle" font-weight="bold" filter="url(#rough2)">
    <text x="154" y="104">1</text>
    <text x="208" y="104">2</text>
    <text x="262" y="104">2</text>
    <text x="316" y="104">2</text>
    <text x="370" y="104">3</text>
    <text x="424" y="104">3</text>
    <text x="478" y="104">3</text>
  </g>
  <!-- 位号 -->
  <g font-size="9.5" fill="#aaa" text-anchor="middle" filter="url(#rough2)">
    <text x="154" y="128">0</text>
    <text x="208" y="128">1</text>
    <text x="262" y="128">2</text>
    <text x="316" y="128">3</text>
    <text x="370" y="128">4</text>
    <text x="424" y="128">5</text>
    <text x="478" y="128">6</text>
  </g>

  <!-- mid 标注 -->
  <text x="316" y="146" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">mid₁=3</text>
  <text x="370" y="146" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold" filter="url(#rough2)">mid₂=4</text>

  <!-- ===== 五个统计量计算 ===== -->
  <text x="280" y="172" text-anchor="middle" font-size="12" fill="#555" font-weight="bold" filter="url(#rough2)">
    逐项计算
  </text>

  <!-- minimum -->
  <rect x="30" y="184" width="150" height="56" rx="8" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="105" y="204" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">① minimum</text>
  <text x="105" y="222" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">首个 count&gt;0 → idx=1</text>
  <text x="105" y="236" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">= 1.00000</text>

  <!-- maximum -->
  <rect x="192" y="184" width="150" height="56" rx="8" fill="#e8f0fe"
        stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="267" y="204" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">② maximum</text>
  <text x="267" y="222" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">末个 count&gt;0 → idx=3</text>
  <text x="267" y="236" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">= 3.00000</text>

  <!-- mean -->
  <rect x="354" y="184" width="176" height="56" rx="8" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="442" y="204" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">③ mean</text>
  <text x="442" y="222" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">(1·1+2·3+3·4)/8 = 19/8</text>
  <text x="442" y="236" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">= 2.37500</text>

  <!-- median -->
  <rect x="30" y="252" width="280" height="68" rx="8" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="170" y="272" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">④ median（total=8 偶数）</text>
  <text x="170" y="290" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">
    mid₁=(8−1)//2=3 → 累加到 idx=2 时 acc=4 &gt; 3 → 值 2
  </text>
  <text x="170" y="306" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">
    mid₂=8//2=4 → 累加到 idx=3 时 acc=8 &gt; 4 → 值 3
  </text>
  <text x="170" y="318" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">
    median = (2 + 3) / 2
  </text>

  <!-- mode -->
  <rect x="322" y="252" width="208" height="68" rx="8" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="426" y="272" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">⑤ mode</text>
  <text x="426" y="290" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">argmax count[i]</text>
  <text x="426" y="306" text-anchor="middle" font-size="10.5" fill="#333" filter="url(#rough2)">count[3]=4 最大</text>
  <text x="426" y="318" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">→ idx 3</text>

  <!-- ===== 结果汇总 ===== -->
  <rect x="60" y="338" width="440" height="56" rx="10" fill="#e6f4ea"
        stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="360" text-anchor="middle" font-size="12.5" fill="#333" font-weight="bold" filter="url(#rough2)">
    输出 = [1.00000, 3.00000, 2.37500, 2.50000, 3.00000]
  </text>
  <text x="280" y="380" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">
    [minimum, maximum, mean, median, mode]
  </text>

  <!-- ===== 关键提醒 ===== -->
  <rect x="60" y="408" width="440" height="48" rx="8" fill="#fce4ec"
        stroke="#b85450" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="428" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">
    ⚠️ mid₁ 与 mid₂ 用 0-indexed：mid₁=(N−1)//2, mid₂=N//2
  </text>
  <text x="280" y="446" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">
    奇数个时二者相等 → 自然取单值，无需分奇偶分支
  </text>
</svg>
