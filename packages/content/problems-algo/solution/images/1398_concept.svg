<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="660" height="440" fill="#fafafa"/>

  <text x="330" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">核心观察：集合包含判定 — {A, B} ⊆ S 且 C ∉ S</text>
  <text x="330" y="46" text-anchor="middle" font-size="11" fill="#888">把"买了A、买了B、没买C"翻译成对每位顾客购买集合 S 的三条件筛选</text>

  <!-- header -->
  <text x="130" y="80" text-anchor="end" font-size="11" fill="#888" font-weight="bold">顾客</text>
  <text x="220" y="80" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">购买集合 S</text>
  <text x="420" y="80" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">有A?</text>
  <text x="465" y="80" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">有B?</text>
  <text x="515" y="80" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">无C?</text>
  <text x="605" y="80" text-anchor="middle" font-size="11" fill="#888" font-weight="bold">结果</text>

  <!-- Daniel row, center y=112 -->
  <text x="130" y="116" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">Daniel(1)</text>
  <rect x="150" y="98" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="119" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">A</text>
  <rect x="190" y="98" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="210" y="119" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">B</text>
  <rect x="230" y="98" width="40" height="32" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="250" y="119" text-anchor="middle" font-size="14" fill="#888" font-weight="bold">D</text>
  <rect x="270" y="98" width="40" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="290" y="119" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">C</text>
  <text x="420" y="120" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="465" y="120" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="515" y="120" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">✗</text>
  <text x="605" y="118" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗ 排除</text>

  <!-- Diana row, center y=168 -->
  <text x="130" y="172" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">Diana(2)</text>
  <rect x="150" y="154" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="175" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">A</text>
  <text x="420" y="176" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="465" y="176" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">✗</text>
  <text x="515" y="176" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="605" y="174" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗ 排除</text>

  <!-- Elizabeth row, center y=224 (highlight) -->
  <rect x="34" y="206" width="592" height="38" rx="6" fill="#e6f4ea" fill-opacity="0.5" stroke="#4a7a3a" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="130" y="230" text-anchor="end" font-size="12" fill="#4a7a3a" font-weight="bold">Elizabeth(3)</text>
  <rect x="150" y="212" width="40" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="233" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold">A</text>
  <rect x="190" y="212" width="40" height="32" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="210" y="233" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">B</text>
  <rect x="230" y="212" width="40" height="32" rx="4" fill="#f0f0f0" stroke="#999" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="250" y="233" text-anchor="middle" font-size="14" fill="#888" font-weight="bold">D</text>
  <text x="420" y="234" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="465" y="234" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">✓</text>
  <text x="515" y="234" text-anchor="middle" font-size="16" fill="#4a7a3a" font-weight="bold">✓</text>
  <rect x="563" y="217" width="84" height="26" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="605" y="234" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">✓ 入选</text>

  <!-- Jhon row, center y=280 -->
  <text x="130" y="284" text-anchor="end" font-size="12" fill="#446688" font-weight="bold">Jhon(4)</text>
  <rect x="150" y="266" width="40" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="170" y="287" text-anchor="middle" font-size="14" fill="#b85450" font-weight="bold">C</text>
  <text x="420" y="288" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">✗</text>
  <text x="465" y="288" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">✗</text>
  <text x="515" y="288" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">✗</text>
  <text x="605" y="286" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">✗ 排除</text>

  <!-- note box -->
  <rect x="40" y="324" width="580" height="100" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="330" y="348" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">把"存在性判定"变成"计数正 / 零"</text>
  <text x="330" y="368" text-anchor="middle" font-size="11" fill="#666">有A ⇔ COUNT(product_name='A') &gt; 0  ；  无C ⇔ COUNT(product_name='C') = 0</text>
  <text x="330" y="386" text-anchor="middle" font-size="11" fill="#666">三条件 AND → 一条 HAVING 子句过滤，无需多次扫描 Orders</text>
  <text x="330" y="406" text-anchor="middle" font-size="10" fill="#888">⇒ GROUP BY customer + HAVING SUM(IF(pname='A',1,0))&gt;0 AND ...='C'...=0</text>
</svg>
