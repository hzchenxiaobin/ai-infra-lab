<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="330" fill="#fafafa"/>

  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：nums = [5,3,2,10,15], x = 1</text>

  <text x="24" y="52" text-anchor="middle" font-size="11" fill="#999" font-weight="bold" filter="url(#rough2)">j</text>
  <text x="70" y="52" font-size="11" fill="#999" font-weight="bold" filter="url(#rough2)">插入</text>
  <text x="180" y="52" text-anchor="middle" font-size="11" fill="#999" font-weight="bold" filter="url(#rough2)">有序集合</text>
  <text x="380" y="52" text-anchor="middle" font-size="11" fill="#999" font-weight="bold" filter="url(#rough2)">target</text>
  <text x="448" y="52" text-anchor="middle" font-size="11" fill="#999" font-weight="bold" filter="url(#rough2)">候选</text>
  <text x="500" y="52" text-anchor="middle" font-size="11" fill="#999" font-weight="bold" filter="url(#rough2)">diff</text>
  <text x="556" y="52" text-anchor="middle" font-size="11" fill="#999" font-weight="bold" filter="url(#rough2)">ans</text>

  <line x1="12" y1="60" x2="588" y2="60" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <circle cx="24" cy="84" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="24" y="88" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="70" y="88" font-size="12" fill="#555" filter="url(#rough2)">nums[0]=5</text>
  <rect x="124" y="72" width="36" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="142" y="89" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="360" y="72" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="380" y="89" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <text x="448" y="89" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">→5 右</text>
  <text x="500" y="89" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="556" y="89" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">2</text>

  <line x1="12" y1="108" x2="588" y2="108" stroke="#eee" stroke-width="0.8" filter="url(#rough2)"/>

  <circle cx="24" cy="132" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="24" y="136" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="70" y="136" font-size="12" fill="#555" filter="url(#rough2)">nums[1]=3</text>
  <rect x="124" y="120" width="36" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="142" y="137" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">3</text>
  <rect x="164" y="120" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="182" y="137" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="360" y="120" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="380" y="137" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <text x="448" y="137" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">→3 右</text>
  <text x="500" y="137" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">1</text>
  <text x="556" y="137" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">1</text>

  <line x1="12" y1="156" x2="588" y2="156" stroke="#eee" stroke-width="0.8" filter="url(#rough2)"/>

  <circle cx="24" cy="180" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="24" y="184" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="70" y="184" font-size="12" fill="#555" filter="url(#rough2)">nums[2]=2</text>
  <rect x="124" y="168" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="142" y="185" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="164" y="168" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="182" y="185" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="204" y="168" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="222" y="185" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">5</text>
  <rect x="360" y="168" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="380" y="185" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">10</text>
  <text x="448" y="185" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→5 左</text>
  <text x="500" y="185" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="556" y="185" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1</text>

  <line x1="12" y1="204" x2="588" y2="204" stroke="#eee" stroke-width="0.8" filter="url(#rough2)"/>

  <circle cx="24" cy="228" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="24" y="232" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="68" y="232" font-size="12" fill="#555" filter="url(#rough2)">nums[3]=10</text>
  <rect x="124" y="216" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="142" y="233" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">2</text>
  <rect x="164" y="216" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="182" y="233" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">3</text>
  <rect x="204" y="216" width="36" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="222" y="233" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <rect x="244" y="216" width="36" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="262" y="233" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">10</text>
  <rect x="360" y="216" width="40" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="380" y="233" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">15</text>
  <text x="446" y="233" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">→10 左</text>
  <text x="500" y="233" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">5</text>
  <text x="556" y="233" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">1</text>

  <rect x="160" y="272" width="280" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="300" y="295" text-anchor="middle" font-size="14" fill="#446688" font-weight="bold" filter="url(#rough2)">最终答案：ans = 1</text>
</svg>
