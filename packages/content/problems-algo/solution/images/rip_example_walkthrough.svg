<svg xmlns="http://www.w3.org/2000/svg" width="920" height="620" viewBox="0 0 920 620" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <marker id="arL" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b85450"/>
    </marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arO" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="920" height="620" fill="#fafafa"/>
  <text x="460" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">示例演算：s = "()())()" 的 DFS 搜索树</text>
  <path d="M 300 46 Q 460 54 620 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- 输入串标注 -->
  <text x="80" y="80" font-size="12" font-weight="bold" fill="#555">输入：</text>
  <g filter="url(#sk)">
    <rect x="140" y="64" width="36" height="28" rx="3" fill="#e8f0fe" stroke="#446688"/>
    <rect x="176" y="64" width="36" height="28" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
    <rect x="212" y="64" width="36" height="28" rx="3" fill="#e8f0fe" stroke="#446688"/>
    <rect x="248" y="64" width="36" height="28" rx="3" fill="#e8f0fe" stroke="#446688"/>
    <rect x="284" y="64" width="36" height="28" rx="3" fill="#e8f0fe" stroke="#446688"/>
    <rect x="320" y="64" width="36" height="28" rx="3" fill="#e8f0fe" stroke="#446688"/>
    <rect x="356" y="64" width="36" height="28" rx="3" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="158" y="83" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">(</text>
  <text x="194" y="83" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">)</text>
  <text x="230" y="83" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">(</text>
  <text x="266" y="83" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">)</text>
  <text x="302" y="83" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">)</text>
  <text x="338" y="83" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">(</text>
  <text x="374" y="83" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">)</text>
  <text x="158" y="58" text-anchor="middle" font-size="9" fill="#888">0</text>
  <text x="194" y="58" text-anchor="middle" font-size="9" fill="#888">1</text>
  <text x="230" y="58" text-anchor="middle" font-size="9" fill="#888">2</text>
  <text x="266" y="58" text-anchor="middle" font-size="9" fill="#888">3</text>
  <text x="302" y="58" text-anchor="middle" font-size="9" fill="#888">4</text>
  <text x="338" y="58" text-anchor="middle" font-size="9" fill="#888">5</text>
  <text x="374" y="58" text-anchor="middle" font-size="9" fill="#888">6</text>

  <g filter="url(#sk)">
    <rect x="430" y="68" width="200" height="28" rx="6" fill="#fffdf3" stroke="#d6a040"/>
  </g>
  <text x="530" y="87" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">l_rem=0, r_rem=1（删 1 个 )）</text>

  <!-- 路径A标题 -->
  <text x="200" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a7a3a">路径 A：删下标 1 的 )</text>

  <!-- 路径A 节点 -->
  <g filter="url(#sk)">
    <rect x="150" y="138" width="100" height="28" rx="4" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="200" y="157" text-anchor="middle" font-size="11" fill="#333">i=0 保留 (</text>

  <path d="M 200 168 L 200 184" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="130" y="188" width="140" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="200" y="207" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">i=1 删除 ) ← r_rem 1→0</text>

  <path d="M 200 218 L 200 234" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="150" y="238" width="100" height="28" rx="4" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="200" y="257" text-anchor="middle" font-size="11" fill="#333">i=2 保留 (</text>

  <path d="M 200 268 L 200 284" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="150" y="288" width="100" height="28" rx="4" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="200" y="307" text-anchor="middle" font-size="11" fill="#333">i=3 保留 )</text>

  <path d="M 200 318 L 200 334" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="150" y="338" width="100" height="28" rx="4" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="200" y="357" text-anchor="middle" font-size="11" fill="#333">i=4 保留 )</text>

  <path d="M 200 368 L 200 384" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="150" y="388" width="100" height="28" rx="4" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="200" y="407" text-anchor="middle" font-size="11" fill="#333">i=5 保留 (</text>

  <path d="M 200 418 L 200 434" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="150" y="438" width="100" height="28" rx="4" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="200" y="457" text-anchor="middle" font-size="11" fill="#333">i=6 保留 )</text>

  <path d="M 200 468 L 200 484" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arG)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="130" y="488" width="140" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <text x="200" y="510" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">"(())()" ✓</text>

  <!-- 路径B标题 -->
  <text x="680" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688">路径 B：删下标 4 的 )</text>

  <g filter="url(#sk)">
    <rect x="630" y="138" width="100" height="28" rx="4" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="680" y="157" text-anchor="middle" font-size="11" fill="#333">i=0 保留 (</text>

  <path d="M 680 168 L 680 184" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="630" y="188" width="100" height="28" rx="4" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="680" y="207" text-anchor="middle" font-size="11" fill="#333">i=1 保留 )</text>

  <path d="M 680 218 L 680 234" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="630" y="238" width="100" height="28" rx="4" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="680" y="257" text-anchor="middle" font-size="11" fill="#333">i=2 保留 (</text>

  <path d="M 680 268 L 680 284" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="630" y="288" width="100" height="28" rx="4" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="680" y="307" text-anchor="middle" font-size="11" fill="#333">i=3 保留 )</text>

  <path d="M 680 318 L 680 334" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arR)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="610" y="338" width="140" height="28" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2"/>
  </g>
  <text x="680" y="357" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450">i=4 删除 ) ← r_rem 1→0</text>

  <path d="M 680 368 L 680 384" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="630" y="388" width="100" height="28" rx="4" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="680" y="407" text-anchor="middle" font-size="11" fill="#333">i=5 保留 (</text>

  <path d="M 680 418 L 680 434" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="630" y="438" width="100" height="28" rx="4" fill="#e8f0fe" stroke="#446688"/>
  </g>
  <text x="680" y="457" text-anchor="middle" font-size="11" fill="#333">i=6 保留 )</text>

  <path d="M 680 468 L 680 484" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arL)" filter="url(#sk)"/>

  <g filter="url(#sk)">
    <rect x="610" y="488" width="140" height="34" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2"/>
  </g>
  <text x="680" y="510" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">"()()()" ✓</text>

  <!-- 底部说明 -->
  <g filter="url(#sk)">
    <rect x="80" y="540" width="760" height="48" rx="8" fill="#fff8e1" stroke="#d6a040"/>
  </g>
  <text x="460" y="560" text-anchor="middle" font-size="12" font-weight="bold" fill="#7a5415">删下标 3 的 ) 也得到 "()()()"——set 自动去重</text>
  <text x="460" y="578" text-anchor="middle" font-size="11" fill="#7a5415">下标 1 的 ) 虽非"多余"，但删后重新配对得 "(())()"，同样合法。</text>

  <text x="460" y="608" text-anchor="middle" font-size="11" fill="#888">最终结果：{"(())()", "()()()"}——两种不同的删除位置产生两个唯一合法串。</text>
</svg>
