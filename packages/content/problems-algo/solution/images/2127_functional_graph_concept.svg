<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="28" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">函数图（functional graph）：每个节点出度恰为 1</text>
  <text x="280" y="46" text-anchor="middle" font-size="11" fill="#888">favorite[i] 给出唯一出边 → 若干 ρ 形连通分量（环 + 挂链）</text>

  <!-- ===== 左侧：二元环 + 挂链 ===== -->
  <text x="135" y="78" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">二元环（k = 2）+ 挂链</text>

  <!-- 挂链 L_i: 5 -> 3 -> 1 -->
  <circle cx="60" cy="130" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="134" text-anchor="middle" font-size="11" fill="#333">5</text>
  <circle cx="100" cy="160" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="164" text-anchor="middle" font-size="11" fill="#333">3</text>
  <path d="M 70 136 Q 85 148 92 152" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 二元环节点 1 和 2 -->
  <circle cx="140" cy="200" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="140" y="204" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">1</text>
  <circle cx="140" cy="260" r="16" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="140" y="264" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">2</text>

  <!-- 链 3->1 -->
  <path d="M 108 172 Q 122 186 130 192" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <!-- 二元环互指 1<->2 -->
  <path d="M 130 214 Q 120 230 130 246" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 150 246 Q 160 230 150 214" stroke="#d6a040" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 挂链 L_j: 6 -> 4 -> 2 -->
  <circle cx="60" cy="330" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="60" y="334" text-anchor="middle" font-size="11" fill="#333">6</text>
  <circle cx="100" cy="300" r="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="100" y="304" text-anchor="middle" font-size="11" fill="#333">4</text>
  <path d="M 70 324 Q 85 312 92 308" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 108 292 Q 122 278 130 272" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 标注 -->
  <text x="60" y="112" text-anchor="middle" font-size="9" fill="#4a7a3a">挂链 L_i</text>
  <text x="60" y="356" text-anchor="middle" font-size="9" fill="#4a7a3a">挂链 L_j</text>
  <rect x="195" y="218" width="78" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="234" y="234" text-anchor="middle" font-size="9" fill="#4a7a3a">贡献 2+L_i+L_j</text>
  <path d="M 180 230 L 195 230" stroke="#4a7a3a" stroke-width="1" stroke-dasharray="2 1" fill="none" filter="url(#rough2)"/>

  <!-- ===== 右侧：长环 >= 3 ===== -->
  <text x="420" y="78" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">长环（k ≥ 3）+ 挂链（接不上）</text>

  <!-- 长环 7->8->9->7 (三角形) -->
  <circle cx="380" cy="170" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="380" y="174" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">7</text>
  <circle cx="460" cy="170" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="460" y="174" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">8</text>
  <circle cx="420" cy="250" r="16" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="420" y="254" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">9</text>

  <!-- 环边 7->8, 8->9, 9->7 -->
  <path d="M 396 168 L 444 168" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 460 186 Q 448 214 432 240" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 408 240 Q 392 214 384 186" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <!-- 挂链试图接入 7: 10->7 但被拒 -->
  <circle cx="340" cy="110" r="13" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" stroke-dasharray="3 2" filter="url(#rough2)"/>
  <text x="340" y="114" text-anchor="middle" font-size="10" fill="#666">10</text>
  <path d="M 350 122 Q 364 142 372 156" stroke="#446688" stroke-width="1.2" stroke-dasharray="3 2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="318" y="98" font-size="9" fill="#b85450">✗ 接不上</text>

  <!-- 邻位锁死标注 -->
  <rect x="370" y="120" width="50" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="395" y="133" text-anchor="middle" font-size="8" fill="#b85450">双邻位锁死</text>

  <rect x="500" y="218" width="60" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="530" y="234" text-anchor="middle" font-size="9" fill="#b85450">贡献 = k</text>
  <path d="M 480 220 L 500 230" stroke="#b85450" stroke-width="1" stroke-dasharray="2 1" fill="none" filter="url(#rough2)"/>

  <!-- ===== 底部说明 ===== -->
  <rect x="30" y="370" width="500" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="280" y="386" text-anchor="middle" font-size="10" fill="#444">答案 = max( 最长长环 k , Σ 各二元环 (2 + L_i + L_j) )</text>
</svg>
