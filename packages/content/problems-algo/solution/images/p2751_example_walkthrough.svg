<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 420"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="540" height="420" fill="#fafafa" filter="url(#rough2)"/>

  <text x="270" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333" filter="url(#rough2)">示例 2 逐步演算</text>
  <text x="270" y="42" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">positions=[3,5,2,6] healths=[10,10,15,12] dirs="RLRL"</text>

  <!-- Step 0: original data table header -->
  <text x="40" y="68" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">Step 0 原始数据</text>
  <text x="40" y="86" font-size="11" fill="#333" filter="url(#rough2)">1号: pos3 R 健10 | 2号: pos5 L 健10</text>
  <text x="40" y="102" font-size="11" fill="#333" filter="url(#rough2)">3号: pos2 R 健15 | 4号: pos6 L 健12</text>

  <!-- Step 1: sort -->
  <rect x="300" y="58" width="220" height="50" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="410" y="76" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688" filter="url(#rough2)">Step 1 按位置排序</text>
  <text x="410" y="94" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">idx = [2, 0, 1, 3]</text>
  <text x="410" y="106" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">位置 2→3→5→6</text>

  <!-- Step 2: stack trace, 4 rows -->
  <text x="40" y="134" font-size="12" font-weight="bold" fill="#446688" filter="url(#rough2)">Step 2 栈遍历（处理顺序 3号→1号→2号→4号）</text>

  <!-- column headers -->
  <text x="40" y="156" font-size="11" font-weight="bold" fill="#666" filter="url(#rough2)">步骤</text>
  <text x="100" y="156" font-size="11" font-weight="bold" fill="#666" filter="url(#rough2)">当前机器人</text>
  <text x="250" y="156" font-size="11" font-weight="bold" fill="#666" filter="url(#rough2)">动作</text>
  <text x="430" y="156" font-size="11" font-weight="bold" fill="#666" filter="url(#rough2)">栈（底→顶）</text>
  <line x1="30" y1="162" x2="520" y2="162" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- row 1 -->
  <text x="40" y="182" font-size="11" fill="#333" filter="url(#rough2)">1</text>
  <text x="100" y="182" font-size="11" fill="#446688" filter="url(#rough2)">3号 pos2 R 健15</text>
  <text x="250" y="182" font-size="11" fill="#4a7a3a" filter="url(#rough2)">R → push</text>
  <rect x="430" y="170" width="36" height="18" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="448" y="183" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">3(15)</text>

  <!-- row 2 -->
  <text x="40" y="208" font-size="11" fill="#333" filter="url(#rough2)">2</text>
  <text x="100" y="208" font-size="11" fill="#446688" filter="url(#rough2)">1号 pos3 R 健10</text>
  <text x="250" y="208" font-size="11" fill="#4a7a3a" filter="url(#rough2)">R → push</text>
  <rect x="430" y="196" width="36" height="18" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="448" y="209" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">1(10)</text>
  <rect x="430" y="214" width="36" height="18" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="448" y="227" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">3(15)</text>

  <!-- row 3 -->
  <text x="40" y="252" font-size="11" fill="#333" filter="url(#rough2)">3</text>
  <text x="100" y="252" font-size="11" fill="#b85450" filter="url(#rough2)">2号 pos5 L 健10</text>
  <text x="250" y="252" font-size="11" fill="#d6a040" filter="url(#rough2)">碰撞: 10==10 同毁</text>
  <rect x="430" y="240" width="36" height="18" rx="3" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <text x="448" y="253" text-anchor="middle" font-size="10" fill="#b85450" filter="url(#rough2)">1×销毁</text>
  <rect x="430" y="258" width="36" height="18" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="448" y="271" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">3(15)</text>
  <text x="250" y="268" font-size="10" fill="#888" filter="url(#rough2)">1号弹出、2号销毁</text>

  <!-- row 4 -->
  <text x="40" y="298" font-size="11" fill="#333" filter="url(#rough2)">4</text>
  <text x="100" y="298" font-size="11" fill="#b85450" filter="url(#rough2)">4号 pos6 L 健12</text>
  <text x="250" y="298" font-size="11" fill="#d6a040" filter="url(#rough2)">碰撞: 15&gt;12</text>
  <rect x="430" y="286" width="36" height="18" rx="3" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="448" y="299" text-anchor="middle" font-size="10" fill="#446688" filter="url(#rough2)">3(14)</text>
  <text x="250" y="316" font-size="10" fill="#888" filter="url(#rough2)">4号销毁、3号 15→14</text>

  <line x1="30" y1="328" x2="520" y2="328" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Step 3 result -->
  <rect x="40" y="340" width="460" height="64" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="60" y="362" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">Step 3 按原编号排序输出</text>
  <text x="60" y="382" font-size="11" fill="#333" filter="url(#rough2)">栈中幸存者 = {3号: 14} → 按编号排 → [14] ✓</text>
  <text x="60" y="398" font-size="10" fill="#888" filter="url(#rough2)">注意：3号虽位置最靠左，但编号最小，排序后仍在结果对应位置</text>
</svg>
