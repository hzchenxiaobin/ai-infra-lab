<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="540" height="410" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">二维前缀和：四角容斥求子矩阵和</text>

  <!-- 列标号 0..5 -->
  <text x="109" y="60" text-anchor="middle" font-size="10" fill="#999">c=0</text>
  <text x="147" y="60" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="185" y="60" text-anchor="middle" font-size="10" fill="#999">2</text>
  <text x="223" y="60" text-anchor="middle" font-size="10" fill="#999">3</text>
  <text x="261" y="60" text-anchor="middle" font-size="10" fill="#999">4</text>
  <text x="299" y="60" text-anchor="middle" font-size="10" fill="#999">5</text>

  <!-- 行标号 0..5 -->
  <text x="76" y="93" text-anchor="end" font-size="10" fill="#999">r=0</text>
  <text x="76" y="131" text-anchor="end" font-size="10" fill="#999">1</text>
  <text x="76" y="169" text-anchor="end" font-size="10" fill="#999">2</text>
  <text x="76" y="207" text-anchor="end" font-size="10" fill="#999">3</text>
  <text x="76" y="245" text-anchor="end" font-size="10" fill="#999">4</text>
  <text x="76" y="283" text-anchor="end" font-size="10" fill="#999">5</text>

  <!-- 网格背景 -->
  <rect x="90" y="70" width="228" height="228" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 网格线（竖） -->
  <path d="M128 70 V298 M166 70 V298 M204 70 V298 M242 70 V298 M280 70 V298" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>
  <!-- 网格线（横） -->
  <path d="M90 108 H318 M90 146 H318 M90 184 H318 M90 222 H318 M90 260 H318" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>

  <!-- 目标子矩阵 9 格（行 2..4，列 1..3）填充橙色 -->
  <rect x="128" y="146" width="114" height="114" fill="#fff8e1" opacity="0.9" filter="url(#rough2)"/>
  <rect x="128" y="146" width="114" height="114" fill="none" stroke="#d6a040" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="185" y="207" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">目标子矩阵</text>
  <text x="185" y="223" text-anchor="middle" font-size="10" fill="#d6a040">(r1..r2, c1..c2)</text>

  <!-- 四个角点（容斥） -->
  <!-- TL (r1,c1) 绿 + -->
  <circle cx="128" cy="146" r="7" fill="#4a7a3a" stroke="#fff" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="112" y="138" text-anchor="end" font-size="13" fill="#4a7a3a" font-weight="bold">+</text>
  <text x="112" y="152" text-anchor="end" font-size="9" fill="#4a7a3a">pre[r1][c1]</text>

  <!-- TR (r1,c2+1) 蓝 − -->
  <circle cx="242" cy="146" r="7" fill="#446688" stroke="#fff" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="258" y="138" font-size="13" fill="#446688" font-weight="bold">−</text>
  <text x="258" y="152" font-size="9" fill="#446688">pre[r1][c2+1]</text>

  <!-- BL (r2+1,c1) 蓝 − -->
  <circle cx="128" cy="260" r="7" fill="#446688" stroke="#fff" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="112" y="276" text-anchor="end" font-size="13" fill="#446688" font-weight="bold">−</text>
  <text x="112" y="288" text-anchor="end" font-size="9" fill="#446688">pre[r2+1][c1]</text>

  <!-- BR (r2+1,c2+1) 红 + -->
  <circle cx="242" cy="260" r="7" fill="#b85450" stroke="#fff" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="258" y="276" font-size="13" fill="#b85450" font-weight="bold">+</text>
  <text x="258" y="288" font-size="9" fill="#b85450">pre[r2+1][c2+1]</text>

  <!-- 公式框 -->
  <rect x="36" y="324" width="468" height="70" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="270" y="350" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">容斥查询公式</text>
  <text x="270" y="376" text-anchor="middle" font-size="13" fill="#444">
    <tspan fill="#b85450" font-weight="bold">pre[r2+1][c2+1]</tspan>
    <tspan fill="#333">  −  </tspan>
    <tspan fill="#446688" font-weight="bold">pre[r1][c2+1]</tspan>
    <tspan fill="#333">  −  </tspan>
    <tspan fill="#446688" font-weight="bold">pre[r2+1][c1]</tspan>
    <tspan fill="#333">  +  </tspan>
    <tspan fill="#4a7a3a" font-weight="bold">pre[r1][c1]</tspan>
  </text>
</svg>
