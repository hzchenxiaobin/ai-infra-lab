<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：word = 「xycdefghij」（n = 10）→ 12 次</text>

  <!-- header row -->
  <rect x="48" y="44" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="68" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">序</text>
  <rect x="88" y="44" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="116" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">字母</text>
  <rect x="144" y="44" width="72" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="180" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">放入按键</text>
  <rect x="216" y="44" width="104" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="268" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">键上位次</text>
  <rect x="320" y="44" width="128" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="384" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">按键次数</text>

  <!-- row 1: x -->
  <rect x="48" y="70" width="400" height="23" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="68" y="86" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <text x="116" y="86" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">x</text>
  <text x="180" y="86" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">键 2</text>
  <text x="268" y="86" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">第 1 位</text>
  <text x="384" y="86" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1 次</text>

  <!-- row 2: y (layer 2) -->
  <rect x="48" y="93" width="400" height="23" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="68" y="109" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">2</text>
  <text x="116" y="109" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">y</text>
  <text x="180" y="109" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">键 2</text>
  <text x="268" y="109" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">第 2 位 ★</text>
  <text x="384" y="109" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">2 次</text>

  <!-- row 3: c -->
  <rect x="48" y="116" width="400" height="23" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="68" y="132" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">3</text>
  <text x="116" y="132" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="180" y="132" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">键 3</text>
  <text x="268" y="132" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">第 1 位</text>
  <text x="384" y="132" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1 次</text>

  <!-- row 4: d (layer 2) -->
  <rect x="48" y="139" width="400" height="23" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="68" y="155" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">4</text>
  <text x="116" y="155" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">d</text>
  <text x="180" y="155" text-anchor="middle" font-size="11" fill="#8a6d3b" filter="url(#rough2)">键 3</text>
  <text x="268" y="155" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">第 2 位 ★</text>
  <text x="384" y="155" text-anchor="middle" font-size="11.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">2 次</text>

  <!-- row 5: e -->
  <rect x="48" y="162" width="400" height="23" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="68" y="178" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">5</text>
  <text x="116" y="178" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">e</text>
  <text x="180" y="178" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">键 4</text>
  <text x="268" y="178" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">第 1 位</text>
  <text x="384" y="178" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1 次</text>

  <!-- row 6: f -->
  <rect x="48" y="185" width="400" height="23" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="68" y="201" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">6</text>
  <text x="116" y="201" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">f</text>
  <text x="180" y="201" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">键 5</text>
  <text x="268" y="201" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">第 1 位</text>
  <text x="384" y="201" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1 次</text>

  <!-- row 7: g -->
  <rect x="48" y="208" width="400" height="23" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="68" y="224" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">7</text>
  <text x="116" y="224" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">g</text>
  <text x="180" y="224" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">键 6</text>
  <text x="268" y="224" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">第 1 位</text>
  <text x="384" y="224" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1 次</text>

  <!-- row 8: h -->
  <rect x="48" y="231" width="400" height="23" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="68" y="247" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">8</text>
  <text x="116" y="247" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">h</text>
  <text x="180" y="247" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">键 7</text>
  <text x="268" y="247" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">第 1 位</text>
  <text x="384" y="247" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1 次</text>

  <!-- row 9: i -->
  <rect x="48" y="254" width="400" height="23" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="68" y="270" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">9</text>
  <text x="116" y="270" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">i</text>
  <text x="180" y="270" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">键 8</text>
  <text x="268" y="270" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">第 1 位</text>
  <text x="384" y="270" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1 次</text>

  <!-- row 10: j -->
  <rect x="48" y="277" width="400" height="23" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <text x="68" y="293" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">10</text>
  <text x="116" y="293" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">j</text>
  <text x="180" y="293" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">键 9</text>
  <text x="268" y="293" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">第 1 位</text>
  <text x="384" y="293" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1 次</text>

  <!-- total row -->
  <rect x="48" y="300" width="400" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="248" y="318" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">合计：1+2+1+2+1+1+1+1+1+1 = 12 次</text>

  <!-- bottom notes -->
  <rect x="40" y="344" width="440" height="84" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="366" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">前 8 个字母恰好占满 8 个「第 1 位」槽（每键 1 个，各按 1 次）</text>
  <text x="260" y="387" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">剩下 y、d 任意挑两个键放「第 2 位」——哪两个落第 2 位无所谓：</text>
  <text x="260" y="406" text-anchor="middle" font-size="11.5" fill="#555" filter="url(#rough2)">它们各只出现 1 次、权重相同，代价都是 2 次</text>
  <text x="260" y="424" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">总计 8×1 + 2×2 = 12 ✓　（这正是「答案只看 n」的含义）</text>
</svg>
