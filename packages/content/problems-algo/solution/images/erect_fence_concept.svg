<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="380" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14.5" fill="#444" font-weight="bold">核心观察：凸包 = 包住所有点的最小凸多边形</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888">用最短的栅栏围住所有树 → 求点集的凸包（含边上共线点）</text>

  <!-- ===== Left: points + convex hull ===== -->
  <text x="30" y="72" font-size="11" fill="#446688" font-weight="bold">点集与凸包</text>

  <!-- Axes -->
  <line x1="55" y1="255" x2="270" y2="255" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <line x1="55" y1="255" x2="55" y2="50" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="48" y="262" font-size="9" fill="#aaa" text-anchor="end">0</text>
  <text x="270" y="265" font-size="9" fill="#aaa">x</text>
  <text x="48" y="54" font-size="9" fill="#aaa" text-anchor="end">y</text>

  <!-- Convex hull polygon: [1,1]→[2,0]→[4,2]→[2,4] -->
  <polygon points="103,207 151,255 247,159 151,63" fill="#fce4ec" fill-opacity="0.25" stroke="#b85450" stroke-width="2.2" filter="url(#rough2)"/>

  <!-- Interior point [2,2] -->
  <circle cx="151" cy="159" r="7" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="163" y="163" font-size="10" fill="#446688">[2,2] 内部</text>

  <!-- Edge point [3,3] on edge [4,2]→[2,4] -->
  <circle cx="199" cy="111" r="7" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="211" y="115" font-size="10" fill="#d6a040" font-weight="bold">[3,3] 边上</text>

  <!-- Vertices -->
  <circle cx="103" cy="207" r="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="76" y="202" font-size="10" fill="#b85450" font-weight="bold">[1,1]</text>

  <circle cx="151" cy="255" r="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="128" y="273" font-size="10" fill="#b85450" font-weight="bold">[2,0]</text>

  <circle cx="247" cy="159" r="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="255" y="155" font-size="10" fill="#b85450" font-weight="bold">[4,2]</text>

  <circle cx="151" cy="63" r="8" fill="#fce4ec" stroke="#b85450" stroke-width="2.6" filter="url(#rough2)"/>
  <text x="128" y="56" font-size="10" fill="#b85450" font-weight="bold">[2,4]</text>

  <!-- Legend -->
  <rect x="30" y="282" width="250" height="56" fill="#fff" stroke="#ddd" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <circle cx="50" cy="298" r="6" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="64" y="302" font-size="10" fill="#555">顶点（必须在围栏上）</text>
  <circle cx="50" cy="316" r="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="64" y="320" font-size="10" fill="#555">边上共线点（也在围栏上）</text>
  <circle cx="50" cy="334" r="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="64" y="338" font-size="10" fill="#555">内部点（不在围栏上）</text>

  <!-- ===== Right: cross product ===== -->
  <text x="310" y="72" font-size="11" fill="#446688" font-weight="bold">叉积判定三点方向</text>

  <rect x="310" y="82" width="220" height="52" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="320" y="100" font-size="10.5" fill="#446688" font-weight="bold">cross(O, A, B) =</text>
  <text x="320" y="116" font-size="10" fill="#555">(A.x−O.x)·(B.y−O.y)</text>
  <text x="320" y="128" font-size="10" fill="#555">− (A.y−O.y)·(B.x−O.x)</text>

  <!-- Left turn: cross > 0 -->
  <text x="310" y="158" font-size="10.5" fill="#4a7a3a" font-weight="bold">cross &gt; 0：左转（逆时针）✓ 保留</text>
  <g filter="url(#rough2)">
    <line x1="330" y1="186" x2="370" y2="172" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)"/>
    <line x1="370" y1="172" x2="405" y2="190" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr)"/>
    <circle cx="330" cy="186" r="3" fill="#4a7a3a"/>
    <circle cx="370" cy="172" r="3" fill="#4a7a3a"/>
    <circle cx="405" cy="190" r="3" fill="#4a7a3a"/>
    <text x="324" y="198" font-size="9" fill="#888">O</text>
    <text x="370" y="165" font-size="9" fill="#888">A</text>
    <text x="410" y="195" font-size="9" fill="#888">B</text>
  </g>

  <!-- Right turn: cross < 0 -->
  <text x="310" y="218" font-size="10.5" fill="#b85450" font-weight="bold">cross &lt; 0：右转（顺时针）✗ 弹出 A</text>
  <g filter="url(#rough2)">
    <line x1="330" y1="244" x2="370" y2="260" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)"/>
    <line x1="370" y1="260" x2="405" y2="248" stroke="#b85450" stroke-width="1.8" marker-end="url(#arr)"/>
    <circle cx="330" cy="244" r="3" fill="#b85450"/>
    <circle cx="370" cy="260" r="3" fill="#b85450"/>
    <circle cx="405" cy="248" r="3" fill="#b85450"/>
    <text x="324" y="240" font-size="9" fill="#888">O</text>
    <text x="370" y="272" font-size="9" fill="#888">A</text>
    <text x="410" y="245" font-size="9" fill="#888">B</text>
  </g>

  <!-- Collinear: cross = 0 -->
  <text x="310" y="282" font-size="10.5" fill="#d6a040" font-weight="bold">cross = 0：共线 ✓ 保留（本题）</text>
  <g filter="url(#rough2)">
    <line x1="330" y1="308" x2="405" y2="308" stroke="#d6a040" stroke-width="1.8"/>
    <circle cx="330" cy="308" r="3" fill="#d6a040"/>
    <circle cx="367" cy="308" r="3" fill="#d6a040"/>
    <circle cx="405" cy="308" r="3" fill="#d6a040"/>
    <text x="324" y="322" font-size="9" fill="#888">O</text>
    <text x="362" y="322" font-size="9" fill="#888">A</text>
    <text x="400" y="322" font-size="9" fill="#888">B</text>
  </g>

  <!-- Bottom note -->
  <rect x="30" y="348" width="490" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="270" y="363" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">关键：用 cross &lt; 0 弹出（保留共线点），而非 cross ≤ 0（只留顶点）</text>
</svg>
