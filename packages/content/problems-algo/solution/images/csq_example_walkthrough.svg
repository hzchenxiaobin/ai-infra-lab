<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 480" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="620" height="480" fill="#fafafa"/>

  <text x="310" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：nums = [1, 1, 1, 3, 5]，b 从右往左</text>

  <!-- Array header -->
  <text x="40" y="52" font-size="10" fill="#888">下标</text>
  <text x="100" y="52" font-size="10" fill="#888" text-anchor="middle">0</text>
  <text x="140" y="52" font-size="10" fill="#888" text-anchor="middle">1</text>
  <text x="180" y="52" font-size="10" fill="#888" text-anchor="middle">2</text>
  <text x="220" y="52" font-size="10" fill="#888" text-anchor="middle">3</text>
  <text x="260" y="52" font-size="10" fill="#888" text-anchor="middle">4</text>
  <rect x="82" y="58" width="36" height="24" fill="#eee" stroke="#aaa" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="100" y="74" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="122" y="58" width="36" height="24" fill="#eee" stroke="#aaa" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="140" y="74" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="162" y="58" width="36" height="24" fill="#eee" stroke="#aaa" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="180" y="74" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="202" y="58" width="36" height="24" fill="#eee" stroke="#aaa" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="220" y="74" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="242" y="58" width="36" height="24" fill="#eee" stroke="#aaa" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="260" y="74" text-anchor="middle" font-size="11" fill="#333">5</text>

  <!-- Column headers -->
  <text x="30" y="104" font-size="10" fill="#888" font-weight="bold">b</text>
  <text x="80" y="104" font-size="10" fill="#888" font-weight="bold">查前 cnt</text>
  <text x="240" y="104" font-size="10" fill="#888" font-weight="bold">枚举 a：nums[a]+nums[b]</text>
  <text x="430" y="104" font-size="10" fill="#888" font-weight="bold">ans</text>
  <text x="490" y="104" font-size="10" fill="#888" font-weight="bold">建后 cnt</text>

  <line x1="20" y1="110" x2="600" y2="110" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>

  <!-- Row 1: b=3 -->
  <rect x="20" y="118" width="580" height="58" fill="#fff" stroke="#ddd" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <rect x="28" y="132" width="28" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="42" y="150" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">3</text>
  <text x="80" y="150" font-size="11" fill="#888">{ }  (空)</text>
  <text x="240" y="142" font-size="10" fill="#888">a=0: 1+3=4 ✗</text>
  <text x="240" y="156" font-size="10" fill="#888">a=1: 1+3=4 ✗   a=2: 1+3=4 ✗</text>
  <rect x="420" y="138" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="438" y="154" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">0</text>
  <text x="490" y="142" font-size="10" fill="#b85450" font-weight="bold">加 c=3,d=4:</text>
  <text x="490" y="156" font-size="10" fill="#333">cnt[5-3]={2:1}</text>

  <!-- Row 2: b=2 -->
  <rect x="20" y="182" width="580" height="74" fill="#fff" stroke="#ddd" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <rect x="28" y="204" width="28" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="42" y="222" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">2</text>
  <text x="80" y="216" font-size="11" fill="#4a7a3a" font-weight="bold">{2:1}</text>
  <text x="80" y="232" font-size="9" fill="#888">(c=3,d=4)</text>
  <text x="240" y="200" font-size="10" fill="#4a7a3a" font-weight="bold">a=0: 1+1=2 ✓ (+1)</text>
  <text x="240" y="214" font-size="10" fill="#4a7a3a" font-weight="bold">a=1: 1+1=2 ✓ (+1)</text>
  <text x="240" y="232" font-size="9" fill="#888">两 a 命中同一个 cnt[2]</text>
  <rect x="420" y="210" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="438" y="226" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>
  <text x="490" y="200" font-size="10" fill="#b85450" font-weight="bold">加 c=2:</text>
  <text x="490" y="214" font-size="10" fill="#333">d=3: cnt[3-1]→{2:2}</text>
  <text x="490" y="228" font-size="10" fill="#333">d=4: cnt[5-1]={4:1}</text>

  <!-- Row 3: b=1 -->
  <rect x="20" y="262" width="580" height="74" fill="#fff" stroke="#ddd" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <rect x="28" y="284" width="28" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="42" y="302" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">1</text>
  <text x="80" y="296" font-size="11" fill="#4a7a3a" font-weight="bold">{2:2, 4:1}</text>
  <text x="80" y="312" font-size="9" fill="#888">(c∈{2,3})</text>
  <text x="240" y="292" font-size="10" fill="#b85450" font-weight="bold">a=0: 1+1=2 ✓ (+2)</text>
  <text x="240" y="306" font-size="9" fill="#888">cnt[2]=2，一次查询贡献 2</text>
  <text x="240" y="320" font-size="9" fill="#888">← 这正是「存次数」的力量</text>
  <rect x="420" y="290" width="36" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="438" y="306" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">4</text>
  <text x="490" y="292" font-size="10" fill="#b85450" font-weight="bold">加 c=1:</text>
  <text x="490" y="306" font-size="9" fill="#333">d=2: cnt[0]=1</text>
  <text x="490" y="318" font-size="9" fill="#333">d=3: cnt[2]→3</text>

  <!-- Arrow down to result -->
  <path d="M 310 340 L 310 358" stroke="#d6a040" stroke-width="1.8" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- Final answer -->
  <rect x="180" y="362" width="260" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="310" y="388" text-anchor="middle" font-size="14" fill="#4a7a3a" font-weight="bold">最终 ans = 4 ✓</text>

  <!-- Corresponding quadruplets -->
  <rect x="60" y="414" width="500" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="310" y="432" text-anchor="middle" font-size="10" fill="#444" font-weight="bold">对应的 4 个四元组（a,b,c,d）：</text>
  <text x="310" y="450" text-anchor="middle" font-size="10" fill="#555">(0,1,2,3) (0,1,3,4) (0,2,3,4) (1,2,3,4)</text>
  <text x="310" y="464" text-anchor="middle" font-size="9" fill="#888">b=2 贡献 (0,2,3,4)、(1,2,3,4)；b=1 贡献 (0,1,2,3)、(0,1,3,4)</text>
</svg>
