<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：「上一年」= 严格 year−1，断档时「上一行」≠「上一年」</text>

  <text x="40" y="58" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">产品 123424：年份连续 → 逐年都有上一年</text>

  <rect x="30" y="72" width="88" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="74" y="89" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">2019</text>
  <text x="74" y="104" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1500.60</text>

  <rect x="152" y="72" width="88" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="196" y="89" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">2020</text>
  <text x="196" y="104" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1000.20</text>

  <rect x="274" y="72" width="88" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="318" y="89" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">2021</text>
  <text x="318" y="104" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">1246.44</text>

  <rect x="396" y="72" width="88" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="440" y="89" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">2022</text>
  <text x="440" y="104" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">2145.32</text>

  <path d="M 196 116 Q 135 146 82 116" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>
  <text x="139" y="145" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">2020 = 2019+1 ✓</text>

  <path d="M 440 116 Q 379 146 326 116" stroke="#4a7a3a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrg)" fill="none" filter="url(#rough2)"/>
  <text x="383" y="145" text-anchor="middle" font-size="10" fill="#4a7a3a" filter="url(#rough2)">2022 = 2021+1 ✓</text>

  <rect x="115" y="162" width="290" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="180" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">year−1 恰好有数据 → prev、yoy 都有解 ✓</text>

  <path d="M 30 212 L 490 212" stroke="#cccccc" stroke-width="1.2" stroke-dasharray="8 6" filter="url(#rough2)"/>

  <text x="40" y="240" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">假想产品 9001：2019 → 2021 断档（2020 无交易）</text>

  <rect x="60" y="254" width="88" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="104" y="271" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">2019</text>
  <text x="104" y="286" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">800.00</text>

  <rect x="216" y="254" width="88" height="40" fill="none" stroke="#999999" stroke-width="1.4" stroke-dasharray="5 4" rx="4" filter="url(#rough2)"/>
  <text x="260" y="271" text-anchor="middle" font-size="11" fill="#999999" font-weight="bold" filter="url(#rough2)">2020</text>
  <text x="260" y="286" text-anchor="middle" font-size="11" fill="#999999" filter="url(#rough2)">缺</text>

  <rect x="372" y="254" width="88" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="416" y="271" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">2021</text>
  <text x="416" y="286" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">500.00</text>

  <path d="M 416 298 Q 260 338 110 298" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrr)" fill="none" filter="url(#rough2)"/>
  <text x="260" y="336" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">LAG 上一行 = 2019（差 2 年）✗</text>

  <rect x="80" y="346" width="360" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="364" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">2021 行：prev = NULL，yoy = NULL（800.00 不能充数）</text>

  <text x="260" y="392" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">对齐条件写死 year = prev_year + 1，断档自动落空</text>
</svg>
