<svg xmlns="http://www.w3.org/2000/svg" width="780" height="540" viewBox="0 0 780 540" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4"/>
    </filter>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3a3a3a"/>
    </marker>
  </defs>
  <rect width="780" height="540" fill="#fdfcf7"/>
  <text x="390" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">墙与门：多源 BFS 算法流程</text>
  <path d="M 230 40 Q 390 48 550 40" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- Step 1: scan grid, enqueue gates -->
  <g filter="url(#sk)">
    <rect x="270" y="64" width="240" height="56" rx="8" fill="#e6f4ea" stroke="#4a8e4a" stroke-width="1.5"/>
  </g>
  <text x="390" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e6e2e">① 扫描网格</text>
  <text x="390" y="106" text-anchor="middle" font-size="10.5" fill="#444">所有 gate(0) 入队；INF 房间待填</text>

  <path d="M 390 124 L 390 152" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar2)" filter="url(#sk)"/>

  <!-- Step 2: pop frontier -->
  <g filter="url(#sk)">
    <rect x="270" y="154" width="240" height="56" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
  </g>
  <text x="390" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e4e7e">② 取当前层 size 个格子</text>
  <text x="390" y="196" text-anchor="middle" font-size="10.5" fill="#444">for k in range(size): pop (i,j)</text>

  <path d="M 390 214 L 390 242" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar2)" filter="url(#sk)"/>

  <!-- Step 3: check 4 neighbors (decision diamond) -->
  <g filter="url(#sk)">
    <path d="M 390 250 L 470 290 L 390 330 L 310 290 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5"/>
  </g>
  <text x="390" y="288" text-anchor="middle" font-size="11" font-weight="bold" fill="#7a5415">邻居是 INF？</text>
  <text x="390" y="304" text-anchor="middle" font-size="10" fill="#7a5415">（未填的空房）</text>

  <!-- No branch -->
  <path d="M 310 290 L 180 290 L 180 360" stroke="#888" stroke-width="1.4" fill="none" marker-end="url(#ar2)" filter="url(#sk)"/>
  <text x="210" y="282" text-anchor="middle" font-size="10.5" fill="#888">否（墙/门/已填）</text>
  <g filter="url(#sk)">
    <rect x="120" y="362" width="120" height="44" rx="6" fill="#f5f5f5" stroke="#bbb" stroke-width="1.2"/>
  </g>
  <text x="180" y="388" text-anchor="middle" font-size="10.5" fill="#888">跳过该邻居</text>

  <!-- Yes branch -->
  <path d="M 470 290 L 600 290 L 600 360" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar2)" filter="url(#sk)"/>
  <text x="568" y="282" text-anchor="middle" font-size="10.5" fill="#2e6e2e" font-weight="bold">是</text>

  <g filter="url(#sk)">
    <rect x="520" y="362" width="160" height="76" rx="6" fill="#eaf6ee" stroke="#4a8e4a" stroke-width="1.4"/>
  </g>
  <text x="600" y="384" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e6e2e">填距离 + 入队</text>
  <text x="600" y="402" text-anchor="middle" font-size="10" fill="#444">grid[ni][nj] = d + 1</text>
  <text x="600" y="418" text-anchor="middle" font-size="10" fill="#444">push (ni, nj)</text>

  <!-- loop back to step 2 -->
  <path d="M 600 438 L 600 470 L 390 470 L 390 154" stroke="#4a8edb" stroke-width="1.4" fill="none" stroke-dasharray="5 3" marker-end="url(#ar2)" filter="url(#sk)"/>
  <text x="500" y="462" text-anchor="middle" font-size="10" fill="#4a8edb">层内继续 pop</text>

  <!-- exit -->
  <path d="M 390 470 L 390 500" stroke="#3a3a3a" stroke-width="1.6" fill="none" marker-end="url(#ar2)" filter="url(#sk)"/>
  <g filter="url(#sk)">
    <rect x="300" y="502" width="180" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.4"/>
  </g>
  <text x="390" y="522" text-anchor="middle" font-size="11" font-weight="bold" fill="#b03a3a">队列空 → 结束（in-place 完成）</text>
</svg>
