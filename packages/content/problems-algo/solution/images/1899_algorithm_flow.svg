<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：过滤越界 → 逐维取 max → 比对 target</text>

  <!-- 1. Initialize result = [0,0,0] -->
  <rect x="140" y="44" width="240" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="260" y="68" text-anchor="middle" font-size="12" fill="#333">① 初始化 res = [0, 0, 0]</text>

  <path d="M 260 82 L 260 100" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. Loop: for each triplet t -->
  <polygon points="260,100 410,148 260,196 110,148" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="140" text-anchor="middle" font-size="11.5" fill="#333">遍历每个三元组 t = [a, b, c]</text>
  <text x="260" y="158" text-anchor="middle" font-size="11" fill="#555">a ≤ x 且 b ≤ y 且 c ≤ z ?</text>
  <text x="260" y="174" text-anchor="middle" font-size="9.5" fill="#888">(任一维都不超过 target)</text>

  <!-- No → skip (discard) -->
  <path d="M 110 148 L 50 148" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="20" y="132" width="56" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="48" y="152" text-anchor="middle" font-size="10.5" fill="#b85450" font-weight="bold">跳过</text>
  <text x="70" y="124" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <text x="48" y="178" text-anchor="middle" font-size="9" fill="#b85450">越界丢弃</text>

  <!-- Yes → take max -->
  <path d="M 410 148 L 450 148 L 450 178" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="418" y="138" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="376" y="178" width="148" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="450" y="196" text-anchor="middle" font-size="11" fill="#333">逐维取 max 更新</text>
  <text x="450" y="212" text-anchor="middle" font-size="10" fill="#555">res[0]=max(res[0],a)</text>
  <text x="450" y="222" font-size="9.5" fill="#888">(b, c 同理)</text>

  <!-- loop back arrow from max box to diamond -->
  <path d="M 450 222 L 450 240 L 260 240 L 260 196" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <text x="350" y="234" font-size="9.5" fill="#4a7a3a">下一个三元组</text>

  <!-- loop back arrow from skip to diamond -->
  <path d="M 48 164 L 48 240 L 110 148" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arr)" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- After loop: compare -->
  <path d="M 260 196 L 260 256" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="272" y="250" font-size="10" fill="#888">遍历结束</text>

  <!-- 3. Compare res with target -->
  <polygon points="260,256 380,300 260,344 140,300" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="292" text-anchor="middle" font-size="11.5" fill="#333">res == target ?</text>
  <text x="260" y="308" text-anchor="middle" font-size="10" fill="#888">(三个维度都相等)</text>

  <!-- Yes → return true -->
  <path d="M 140 300 L 80 300" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="20" y="284" width="60" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="50" y="304" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">true</text>
  <text x="100" y="294" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- No → return false -->
  <path d="M 380 300 L 440 300" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="440" y="284" width="64" height="32" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="472" y="304" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">false</text>
  <text x="408" y="294" font-size="10" fill="#b85450" font-weight="bold">否</text>

  <!-- Right side notes -->
  <rect x="376" y="44" width="130" height="50" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="441" y="64" text-anchor="middle" font-size="10" fill="#a87020" font-weight="bold">为什么可直接取 max？</text>
  <text x="441" y="80" text-anchor="middle" font-size="9.5" fill="#555">max 满足结合律</text>
  <text x="441" y="92" text-anchor="middle" font-size="9.5" fill="#555">合并顺序不影响结果</text>

  <!-- Footer -->
  <rect x="40" y="370" width="440" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="390" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">等价转换：模拟合并 ⇄ 逐维独立取 max</text>
  <text x="260" y="408" text-anchor="middle" font-size="10" fill="#555">原问题：反复选两三元组取 max 合并，能否得到 target</text>
  <text x="260" y="424" text-anchor="middle" font-size="10" fill="#555">等价问题：所有「不越界」三元组的逐维 max 是否恰好 == target</text>
  <text x="260" y="440" text-anchor="middle" font-size="10" fill="#888">时间 O(n)，空间 O(1)　n = 三元组数量</text>
</svg>
