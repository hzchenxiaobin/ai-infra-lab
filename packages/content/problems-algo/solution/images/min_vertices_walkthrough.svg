<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="600" height="460" fill="#fafafa"/>

  <text x="300" y="30" text-anchor="middle" font-size="16" fill="#333" filter="url(#rough2)">
    示例演算：n=6, edges 逐条累加入度
  </text>

  <!-- 入度数组表头 -->
  <text x="60" y="70" font-size="12" fill="#446688" filter="url(#rough2)">顶点</text>
  <text x="60" y="92" font-size="11" fill="#888" filter="url(#rough2)">(初始全0)</text>
  <g filter="url(#rough2)">
    <rect x="110" y="56" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="134" y="75" text-anchor="middle" font-size="12" fill="#333">0</text>
    <rect x="158" y="56" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="182" y="75" text-anchor="middle" font-size="12" fill="#333">1</text>
    <rect x="206" y="56" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="230" y="75" text-anchor="middle" font-size="12" fill="#333">2</text>
    <rect x="254" y="56" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="278" y="75" text-anchor="middle" font-size="12" fill="#333">3</text>
    <rect x="302" y="56" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="326" y="75" text-anchor="middle" font-size="12" fill="#333">4</text>
    <rect x="350" y="56" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="3"/>
    <text x="374" y="75" text-anchor="middle" font-size="12" fill="#333">5</text>
  </g>

  <!-- 边处理行 -->
  <g filter="url(#rough2)">
    <!-- 0->1: indeg[1]++ -->
    <text x="60" y="118" font-size="12" fill="#333">0→1</text>
    <rect x="110" y="104" width="48" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="134" y="120" text-anchor="middle" font-size="11" fill="#888">0</text>
    <rect x="158" y="104" width="48" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <text x="182" y="120" text-anchor="middle" font-size="11" fill="#d6a040">1</text>
    <rect x="206" y="104" width="48" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="230" y="120" text-anchor="middle" font-size="11" fill="#888">0</text>
    <rect x="254" y="104" width="48" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="278" y="120" text-anchor="middle" font-size="11" fill="#888">0</text>
    <rect x="302" y="104" width="48" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="326" y="120" text-anchor="middle" font-size="11" fill="#888">0</text>
    <rect x="350" y="104" width="48" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="374" y="120" text-anchor="middle" font-size="11" fill="#888">0</text>

    <!-- 0->2: indeg[2]++ -->
    <text x="60" y="152" font-size="12" fill="#333">0→2</text>
    <rect x="110" y="138" width="48" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="134" y="154" text-anchor="middle" font-size="11" fill="#888">0</text>
    <rect x="158" y="138" width="48" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="182" y="154" text-anchor="middle" font-size="11" fill="#888">1</text>
    <rect x="206" y="138" width="48" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <text x="230" y="154" text-anchor="middle" font-size="11" fill="#d6a040">1</text>
    <rect x="254" y="138" width="48" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="278" y="154" text-anchor="middle" font-size="11" fill="#888">0</text>
    <rect x="302" y="138" width="48" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="326" y="154" text-anchor="middle" font-size="11" fill="#888">0</text>
    <rect x="350" y="138" width="48" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="374" y="154" text-anchor="middle" font-size="11" fill="#888">0</text>

    <!-- 2->5: indeg[5]++ -->
    <text x="60" y="186" font-size="12" fill="#333">2→5</text>
    <rect x="110" y="172" width="48" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="134" y="188" text-anchor="middle" font-size="11" fill="#888">0</text>
    <rect x="158" y="172" width="48" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="182" y="188" text-anchor="middle" font-size="11" fill="#888">1</text>
    <rect x="206" y="172" width="48" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="230" y="188" text-anchor="middle" font-size="11" fill="#888">1</text>
    <rect x="254" y="172" width="48" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="278" y="188" text-anchor="middle" font-size="11" fill="#888">0</text>
    <rect x="302" y="172" width="48" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="326" y="188" text-anchor="middle" font-size="11" fill="#888">0</text>
    <rect x="350" y="172" width="48" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <text x="374" y="188" text-anchor="middle" font-size="11" fill="#d6a040">1</text>

    <!-- 3->4: indeg[4]++ -->
    <text x="60" y="220" font-size="12" fill="#333">3→4</text>
    <rect x="110" y="206" width="48" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="134" y="222" text-anchor="middle" font-size="11" fill="#888">0</text>
    <rect x="158" y="206" width="48" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="182" y="222" text-anchor="middle" font-size="11" fill="#888">1</text>
    <rect x="206" y="206" width="48" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="230" y="222" text-anchor="middle" font-size="11" fill="#888">1</text>
    <rect x="254" y="206" width="48" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="278" y="222" text-anchor="middle" font-size="11" fill="#888">0</text>
    <rect x="302" y="206" width="48" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <text x="326" y="222" text-anchor="middle" font-size="11" fill="#d6a040">1</text>
    <rect x="350" y="206" width="48" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="374" y="222" text-anchor="middle" font-size="11" fill="#888">1</text>

    <!-- 4->2: indeg[2]++ -->
    <text x="60" y="254" font-size="12" fill="#333">4→2</text>
    <rect x="110" y="240" width="48" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="134" y="256" text-anchor="middle" font-size="11" fill="#888">0</text>
    <rect x="158" y="240" width="48" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="182" y="256" text-anchor="middle" font-size="11" fill="#888">1</text>
    <rect x="206" y="240" width="48" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3"/>
    <text x="230" y="256" text-anchor="middle" font-size="11" fill="#d6a040">2</text>
    <rect x="254" y="240" width="48" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="278" y="256" text-anchor="middle" font-size="11" fill="#888">0</text>
    <rect x="302" y="240" width="48" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="326" y="256" text-anchor="middle" font-size="11" fill="#888">1</text>
    <rect x="350" y="240" width="48" height="24" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="374" y="256" text-anchor="middle" font-size="11" fill="#888">1</text>
  </g>

  <!-- 收集阶段 -->
  <path d="M300,280 L300,304" stroke="#4a7a3a" stroke-width="2"
        marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="60" y="298" font-size="12" fill="#4a7a3a" filter="url(#rough2)">收集 indeg==0:</text>

  <!-- 收集结果行 -->
  <g filter="url(#rough2)">
    <rect x="110" y="310" width="48" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3"/>
    <text x="134" y="329" text-anchor="middle" font-size="12" fill="#b85450">0</text>
    <rect x="158" y="310" width="48" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="182" y="329" text-anchor="middle" font-size="11" fill="#888">1</text>
    <rect x="206" y="310" width="48" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="230" y="329" text-anchor="middle" font-size="11" fill="#888">2</text>
    <rect x="254" y="310" width="48" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3"/>
    <text x="278" y="329" text-anchor="middle" font-size="12" fill="#b85450">0</text>
    <rect x="302" y="310" width="48" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="326" y="329" text-anchor="middle" font-size="11" fill="#888">1</text>
    <rect x="350" y="310" width="48" height="28" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="3"/>
    <text x="374" y="329" text-anchor="middle" font-size="11" fill="#888">1</text>
  </g>

  <!-- 答案框 -->
  <rect x="120" y="370" width="250" height="56" rx="8" fill="#fce4ec"
        stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="245" y="392" text-anchor="middle" font-size="13" fill="#b85450" filter="url(#rough2)">
    答案 = [0, 3]
  </text>
  <text x="245" y="412" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">
    顶点 0、3 入度为 0，必选
  </text>

  <!-- 图例 -->
  <rect x="420" y="370" width="160" height="56" rx="6" fill="#fff8e1"
        stroke="#d6a040" stroke-width="1.2" filter="url(#rough2)"/>
  <rect x="432" y="378" width="14" height="10" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="452" y="387" font-size="10" fill="#333" filter="url(#rough2)">本行被 +1</text>
  <rect x="432" y="396" width="14" height="10" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="2" filter="url(#rough2)"/>
  <text x="452" y="405" font-size="10" fill="#333" filter="url(#rough2)">入度=0 入选</text>
  <rect x="432" y="412" width="14" height="10" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="2" filter="url(#rough2)"/>
  <text x="452" y="421" font-size="10" fill="#333" filter="url(#rough2)">未变动</text>
</svg>
