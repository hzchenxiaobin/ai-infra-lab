<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：word1 = "ab", word2 = "pqrs" → "apbqrs"</text>
  <text x="300" y="42" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">k 同步前进：交叠段两取，剩余段只取 word2</text>

  <!-- Header row -->
  <rect x="20" y="56" width="560" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" fill="#446688" font-weight="bold" text-anchor="middle">
    <text x="70" y="74">k</text>
    <text x="170" y="74">word1[k]</text>
    <text x="290" y="74">word2[k]</text>
    <text x="430" y="74">本轮追加</text>
    <text x="540" y="74">res</text>
  </g>

  <!-- Row k=0 -->
  <rect x="20" y="88" width="560" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="70" y="106" fill="#555" font-weight="bold">0</text>
    <text x="170" y="106" fill="#d6a040" font-weight="bold">a</text>
    <text x="290" y="106" fill="#4a7a3a" font-weight="bold">p</text>
    <text x="430" y="106" fill="#333" font-weight="bold">a, p</text>
    <text x="540" y="106" fill="#333" font-weight="bold">ap</text>
  </g>

  <!-- Row k=1 -->
  <rect x="20" y="118" width="560" height="28" fill="#fff" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="70" y="136" fill="#555" font-weight="bold">1</text>
    <text x="170" y="136" fill="#d6a040" font-weight="bold">b</text>
    <text x="290" y="136" fill="#4a7a3a" font-weight="bold">q</text>
    <text x="430" y="136" fill="#333" font-weight="bold">b, q</text>
    <text x="540" y="136" fill="#333" font-weight="bold">apbq</text>
  </g>

  <!-- Row k=2 HIGHLIGHTED: word1 exhausted -->
  <rect x="20" y="148" width="560" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="70" y="166" fill="#333" font-weight="bold">2</text>
    <text x="170" y="166" fill="#b85450" font-weight="bold">∅ 越界</text>
    <text x="290" y="166" fill="#4a7a3a" font-weight="bold">r</text>
    <text x="430" y="166" fill="#4a7a3a" font-weight="bold">r</text>
    <text x="540" y="166" fill="#333" font-weight="bold">apbqr</text>
  </g>

  <!-- Row k=3 HIGHLIGHTED -->
  <rect x="20" y="178" width="560" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <g filter="url(#rough2)" font-size="11" text-anchor="middle">
    <text x="70" y="196" fill="#333" font-weight="bold">3</text>
    <text x="170" y="196" fill="#bbb" font-weight="bold">—</text>
    <text x="290" y="196" fill="#4a7a3a" font-weight="bold">s</text>
    <text x="430" y="196" fill="#4a7a3a" font-weight="bold">s</text>
    <text x="540" y="196" fill="#333" font-weight="bold">apbqrs</text>
  </g>

  <!-- annotation for tail phase -->
  <text x="430" y="222" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">↑ k ≥ n1：word1 越界跳过，只追加 word2</text>

  <!-- arrow down -->
  <path d="M 300 232 L 300 256" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- result box -->
  <rect x="150" y="260" width="300" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" rx="10" filter="url(#rough2)"/>
  <text x="300" y="283" text-anchor="middle" font-size="12.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 "apbqrs" ✓</text>

  <!-- bottom note -->
  <rect x="60" y="306" width="480" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="324" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">交叠段（k=0,1）每轮追加 2 个字符；剩余段（k=2,3）每轮追加 1 个</text>
  <text x="300" y="340" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">两阶段同一循环，无需特判尾段</text>
</svg>
