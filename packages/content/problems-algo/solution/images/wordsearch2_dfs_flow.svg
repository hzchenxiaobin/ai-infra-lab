<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a5a"/>
    </marker>
  </defs>

  <rect width="540" height="460" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">DFS + Trie 剪枝流程</text>

  <!-- 1. start -->
  <rect x="190" y="44" width="160" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="14" filter="url(#rough2)"/>
  <text x="270" y="64" text-anchor="middle" font-size="11" fill="#333">遍历每个格子 (i, j)</text>
  <path d="M 270 74 L 270 92" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 2. decision: char in root children? -->
  <path d="M 270 92 L 360 132 L 270 172 L 180 132 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="128" text-anchor="middle" font-size="10" fill="#444">root 有该字符</text>
  <text x="270" y="142" text-anchor="middle" font-size="10" fill="#444">的子节点？</text>

  <!-- No branch -->
  <path d="M 180 132 L 100 132" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="140" y="126" text-anchor="middle" font-size="10" fill="#b85450">否</text>
  <rect x="40" y="118" width="60" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="70" y="136" text-anchor="middle" font-size="10" fill="#b85450">跳过</text>

  <!-- Yes branch -->
  <path d="M 270 172 L 270 192" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="186" font-size="10" fill="#4a7a3a">是</text>

  <!-- 3. DFS box -->
  <rect x="170" y="194" width="200" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="214" text-anchor="middle" font-size="11" fill="#333">DFS(i, j, trieNode)</text>
  <path d="M 270 224 L 270 242" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 4. decision: isEnd? -->
  <path d="M 270 242 L 348 276 L 270 310 L 192 276 Z" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="272" text-anchor="middle" font-size="10" fill="#444">trieNode.isEnd</text>
  <text x="270" y="286" text-anchor="middle" font-size="10" fill="#444">为真？</text>

  <!-- Yes: collect -->
  <path d="M 348 276 L 420 276" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="380" y="270" text-anchor="middle" font-size="10" fill="#4a7a3a">是</text>
  <rect x="420" y="262" width="100" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="470" y="281" text-anchor="middle" font-size="10" fill="#333">收集单词 + 清 isEnd</text>

  <!-- down -->
  <path d="M 270 310 L 270 328" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 5. mark visited + recurse 4 dirs -->
  <rect x="150" y="330" width="240" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="348" text-anchor="middle" font-size="10" fill="#333">暂存 ch，board[i][j] 改为 '#'（标记已访问）</text>
  <text x="270" y="364" text-anchor="middle" font-size="10" fill="#333">对四方向递归 DFS(匹配子节点)</text>
  <path d="M 270 374 L 270 390" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 6. backtrack -->
  <rect x="170" y="392" width="200" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="270" y="410" text-anchor="middle" font-size="10" fill="#333">回溯：恢复 board[i][j] = ch</text>
  <path d="M 270 420 L 270 436" stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- 7. prune leaf -->
  <rect x="150" y="438" width="240" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="270" y="451" text-anchor="middle" font-size="9" fill="#b85450">若 trieNode 已无子节点 → 从父节点删除（剪枝）</text>
</svg>
