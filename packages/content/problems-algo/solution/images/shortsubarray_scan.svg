<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 370" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#888"/>
    </marker>
    <marker id="arrL" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="520" height="370" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">思路二：O(n) 双向扫描定位无序边界</text>

  <!-- ===== Row 1: left to right ===== -->
  <path d="M 30 60 L 70 60" stroke="#446688" stroke-width="2.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="80" y="64" font-size="11.5" fill="#446688" font-weight="bold">① 从左→右，维护左侧最大 maxSeen；nums[i] &lt; maxSeen ⇒ 越界，end = i</text>

  <!-- maxSeen values above boxes -->
  <text x="44" y="86" font-size="10" fill="#777">maxSeen</text>
  <text x="110" y="86" text-anchor="middle" font-size="11" fill="#446688">2</text>
  <text x="160" y="86" text-anchor="middle" font-size="11" fill="#446688">6</text>
  <text x="210" y="86" text-anchor="middle" font-size="11" fill="#446688">6</text>
  <text x="260" y="86" text-anchor="middle" font-size="11" fill="#446688">8</text>
  <text x="310" y="86" text-anchor="middle" font-size="11" fill="#446688">10</text>
  <text x="360" y="86" text-anchor="middle" font-size="11" fill="#446688">10</text>
  <text x="410" y="86" text-anchor="middle" font-size="11" fill="#446688">15</text>

  <!-- boxes row1: highlight i=2,5 -->
  <rect x="86" y="92" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="112" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="136" y="92" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="160" y="112" text-anchor="middle" font-size="13" fill="#333">6</text>
  <rect x="186" y="92" width="48" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="210" y="112" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="236" y="92" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="112" text-anchor="middle" font-size="13" fill="#333">8</text>
  <rect x="286" y="92" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="310" y="112" text-anchor="middle" font-size="13" fill="#333">10</text>
  <rect x="336" y="92" width="48" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="360" y="112" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">9</text>
  <rect x="386" y="92" width="48" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="112" text-anchor="middle" font-size="13" fill="#333">15</text>

  <!-- end flags row1 -->
  <rect x="190" y="132" width="40" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="210" y="145" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">end=2</text>
  <rect x="340" y="132" width="40" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="360" y="145" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">end=5</text>

  <!-- ===== Row 2: right to left ===== -->
  <path d="M 490 178 L 450 178" stroke="#4a7a3a" stroke-width="2.5" fill="none" marker-end="url(#arrL)" filter="url(#rough2)"/>
  <text x="440" y="182" text-anchor="end" font-size="11.5" fill="#4a7a3a" font-weight="bold">② 从右→左，维护右侧最小 minSeen；nums[i] &gt; minSeen ⇒ 越界，start = i</text>

  <!-- start flags row2 (above boxes): i=4, i=1 -->
  <rect x="140" y="194" width="44" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="162" y="207" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">start=1</text>
  <rect x="290" y="194" width="44" height="18" fill="#fce4ec" stroke="#b85450" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="312" y="207" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">start=4</text>

  <!-- boxes row2: highlight i=4,1 -->
  <rect x="86" y="218" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="110" y="238" text-anchor="middle" font-size="13" fill="#333">2</text>
  <rect x="136" y="218" width="48" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="160" y="238" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <rect x="186" y="218" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="210" y="238" text-anchor="middle" font-size="13" fill="#333">4</text>
  <rect x="236" y="218" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="238" text-anchor="middle" font-size="13" fill="#333">8</text>
  <rect x="286" y="218" width="48" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="310" y="238" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">10</text>
  <rect x="336" y="218" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="360" y="238" text-anchor="middle" font-size="13" fill="#333">9</text>
  <rect x="386" y="218" width="48" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="410" y="238" text-anchor="middle" font-size="13" fill="#333">15</text>

  <!-- minSeen values below boxes -->
  <text x="44" y="276" font-size="10" fill="#777">minSeen</text>
  <text x="110" y="276" text-anchor="middle" font-size="11" fill="#4a7a3a">2</text>
  <text x="160" y="276" text-anchor="middle" font-size="11" fill="#4a7a3a">4</text>
  <text x="210" y="276" text-anchor="middle" font-size="11" fill="#4a7a3a">4</text>
  <text x="260" y="276" text-anchor="middle" font-size="11" fill="#4a7a3a">8</text>
  <text x="310" y="276" text-anchor="middle" font-size="11" fill="#4a7a3a">9</text>
  <text x="360" y="276" text-anchor="middle" font-size="11" fill="#4a7a3a">9</text>
  <text x="410" y="276" text-anchor="middle" font-size="11" fill="#4a7a3a">15</text>

  <!-- index labels -->
  <text x="110" y="296" text-anchor="middle" font-size="10" fill="#999">0</text>
  <text x="160" y="296" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="210" y="296" text-anchor="middle" font-size="10" fill="#999">2</text>
  <text x="260" y="296" text-anchor="middle" font-size="10" fill="#999">3</text>
  <text x="310" y="296" text-anchor="middle" font-size="10" fill="#999">4</text>
  <text x="360" y="296" text-anchor="middle" font-size="10" fill="#999">5</text>
  <text x="410" y="296" text-anchor="middle" font-size="10" fill="#999">6</text>

  <!-- bottom note -->
  <rect x="80" y="318" width="360" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="260" y="336" text-anchor="middle" font-size="12.5" fill="#444" font-weight="bold">end=5（右边界），start=1（左边界）</text>
  <text x="260" y="352" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">长度 = end − start + 1 = 5 − 1 + 1 = 5</text>
</svg>
