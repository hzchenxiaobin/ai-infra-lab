<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：l = 4, r = 16 → 答案 11</text>

  <text x="40" y="48" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">第 1 步：n = ⌊√16⌋ = 4，筛 2 ∼ 4：</text>

  <rect x="40" y="58" width="92" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="86" y="78" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">i = 2 质数 ✓</text>
  <text x="86" y="98" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">2² = 4 ≥ l → +1</text>

  <rect x="146" y="58" width="92" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="192" y="78" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">i = 3 质数 ✓</text>
  <text x="192" y="98" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">3² = 9 ≥ l → +1</text>

  <rect x="252" y="58" width="92" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="298" y="78" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">i = 4 合数 ✗</text>
  <text x="298" y="98" text-anchor="middle" font-size="9.5" fill="#b85450" filter="url(#rough2)">跳过（不计数）</text>

  <rect x="358" y="66" width="118" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="417" y="84" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">special = 2</text>
  <text x="417" y="100" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">（只有 2、3 计入）</text>

  <text x="40" y="138" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">第 2 步：区间 [4, 16] 共 13 个数，标出特殊数字：</text>

  <rect x="40" y="148" width="28" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="54" y="167" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="54" y="192" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2²</text>

  <rect x="72" y="148" width="28" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="86" y="167" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">5</text>
  <rect x="104" y="148" width="28" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="118" y="167" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">6</text>
  <rect x="136" y="148" width="28" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="150" y="167" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">7</text>
  <rect x="168" y="148" width="28" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="182" y="167" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">8</text>
  <rect x="200" y="148" width="28" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="214" y="167" text-anchor="middle" font-size="11" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">9</text>
  <text x="214" y="192" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold" filter="url(#rough2)">3²</text>

  <rect x="232" y="148" width="28" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="246" y="167" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">10</text>
  <rect x="264" y="148" width="28" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="278" y="167" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">11</text>
  <rect x="296" y="148" width="28" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="310" y="167" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">12</text>
  <rect x="328" y="148" width="28" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="342" y="167" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">13</text>
  <rect x="360" y="148" width="28" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="374" y="167" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">14</text>
  <rect x="392" y="148" width="28" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="406" y="167" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">15</text>
  <rect x="424" y="148" width="28" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="438" y="167" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">16</text>

  <text x="40" y="214" font-size="9.5" fill="#888" filter="url(#rough2)">4 = 2²、9 = 3² 是特殊数字；下一个 5² = 25 &gt; 16 已出界</text>

  <rect x="40" y="228" width="452" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="266" y="256" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">答案 = 13 − 2 = 11 ✓</text>

  <rect x="40" y="288" width="452" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="266" y="310" text-anchor="middle" font-size="10" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">示例 1：l = 5, r = 7 → 2² = 4 &lt; 5，3² = 9 &gt; 7，无特殊数字</text>
  <text x="266" y="332" text-anchor="middle" font-size="10" fill="#8a6d3b" filter="url(#rough2)">答案 = 3 − 0 = 3 ✓</text>
</svg>
