<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="380" fill="#fafafa"/>

  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：update + sumRegion 全流程</text>

  <!-- 列标号 c=0..4 -->
  <text x="87"  y="64" text-anchor="middle" font-size="10" fill="#999">c=0</text>
  <text x="121" y="64" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="155" y="64" text-anchor="middle" font-size="10" fill="#999">2</text>
  <text x="189" y="64" text-anchor="middle" font-size="10" fill="#999">3</text>
  <text x="223" y="64" text-anchor="middle" font-size="10" fill="#999">4</text>
  <!-- 行标号 r=0..4 -->
  <text x="62" y="93"  text-anchor="end" font-size="10" fill="#999">r=0</text>
  <text x="62" y="127" text-anchor="end" font-size="10" fill="#999">1</text>
  <text x="62" y="161" text-anchor="end" font-size="10" fill="#999">2</text>
  <text x="62" y="195" text-anchor="end" font-size="10" fill="#999">3</text>
  <text x="62" y="229" text-anchor="end" font-size="10" fill="#999">4</text>

  <!-- 网格背景 -->
  <rect x="70" y="72" width="170" height="170" fill="#ffffff" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>
  <!-- 目标子矩阵底色 (rows 2-4, cols 1-3) -->
  <rect x="104" y="140" width="102" height="102" fill="#e6f4ea" opacity="0.55" filter="url(#rough2)"/>
  <!-- 网格线 竖 -->
  <path d="M104 72 V242 M138 72 V242 M172 72 V242 M206 72 V242" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>
  <!-- 网格线 横 -->
  <path d="M70 106 H240 M70 140 H240 M70 174 H240 M70 208 H240" stroke="#d8d8d8" stroke-width="1" filter="url(#rough2)"/>

  <!-- 目标子矩阵边框 -->
  <rect x="104" y="140" width="102" height="102" fill="none" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="155" y="258" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">目标子矩阵 (2,1)→(4,3)</text>

  <!-- 单元格数值 -->
  <text x="87"  y="93"  text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">3</text>
  <text x="121" y="93"  text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">0</text>
  <text x="155" y="93"  text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <text x="189" y="93"  text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">4</text>
  <text x="223" y="93"  text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">2</text>
  <text x="87"  y="127" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">5</text>
  <text x="121" y="127" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">6</text>
  <text x="155" y="127" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">3</text>
  <text x="189" y="127" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">2</text>
  <text x="223" y="127" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <text x="87"  y="161" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <text x="121" y="161" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="155" y="161" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="189" y="161" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="223" y="161" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">5</text>
  <text x="87"  y="195" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">4</text>
  <text x="121" y="195" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <!-- 更新的格子 [3][2]：0→2，橙色高亮 -->
  <rect x="138" y="174" width="34" height="34" fill="#fff8e1" opacity="0.9" filter="url(#rough2)"/>
  <rect x="138" y="174" width="34" height="34" fill="none" stroke="#d6a040" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="155" y="195" text-anchor="middle" font-size="13" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2</text>
  <text x="155" y="183" text-anchor="middle" font-size="8" fill="#d6a040" filter="url(#rough2)">原0</text>
  <text x="189" y="195" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
  <text x="223" y="195" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">7</text>
  <text x="87"  y="229" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
  <text x="121" y="229" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="155" y="229" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="189" y="229" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">0</text>
  <text x="223" y="229" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">5</text>

  <!-- 指向更新格子的标注 -->
  <path d="M172 191 H210 V110 H256" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="214" y="104" font-size="10" fill="#b85450" font-weight="bold">update(3,2,2)</text>

  <!-- ============ 右侧 callout ============ -->
  <!-- 1. update 说明 -->
  <rect x="262" y="76" width="300" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="274" y="96" font-size="11" fill="#d6a040" font-weight="bold">① update(3, 2, 2)</text>
  <text x="274" y="114" font-size="10" fill="#444">matrix[3][2]:  0 → 2，  delta = 2</text>
  <text x="274" y="130" font-size="10" fill="#444">BIT 下标 (i, j) = (row+1, col+1) = (4, 3)</text>

  <!-- 2. BIT 传播 -->
  <rect x="262" y="150" width="300" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="274" y="170" font-size="11" fill="#446688" font-weight="bold">② add(4, 3, 2) 沿祖先传播</text>
  <text x="274" y="188" font-size="10" fill="#444">外层 x: 4 → 8 ( &gt;5 停 )</text>
  <text x="274" y="204" font-size="10" fill="#444">内层 y: 3 → 4 → 8 ( &gt;5 停 )</text>
  <text x="274" y="222" font-size="10" fill="#b85450" font-weight="bold">→ tree[4][3] += 2,  tree[4][4] += 2</text>

  <!-- 3. 查询结果 -->
  <rect x="262" y="248" width="300" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="274" y="268" font-size="11" fill="#4a7a3a" font-weight="bold">③ sumRegion(2, 1, 4, 3)</text>
  <text x="274" y="286" font-size="10" fill="#444">四角容斥：Q(5,4) − Q(2,4) − Q(5,1) + Q(2,1)</text>
  <text x="274" y="304" font-size="11" fill="#555">更新前 = 8</text>
  <text x="274" y="324" font-size="11" fill="#b85450" font-weight="bold">更新后 = 8 + 2 = 10  ✓</text>

  <!-- 底部备注 -->
  <rect x="262" y="346" width="300" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="412" y="363" text-anchor="middle" font-size="10" fill="#b85450">改的格子在目标子矩阵内 → 和增加 delta</text>
</svg>
