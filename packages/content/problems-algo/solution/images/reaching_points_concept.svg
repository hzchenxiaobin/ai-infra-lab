<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 470" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="580" height="470" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：正向二叉分支膨胀，逆向每步前驱唯一</text>

  <!-- ===== 上半：正向分支（指数膨胀） ===== -->
  <rect x="36" y="44" width="220" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="146" y="63" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">正向：每步 2 分支 → 指数膨胀</text>

  <!-- root (sx,sy) -->
  <rect x="116" y="84" width="68" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="150" y="103" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">(sx, sy)</text>

  <!-- two branches -->
  <path d="M 138 114 Q 110 130 84 146" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 162 114 Q 190 130 216 146" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="44" y="148" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="84" y="166" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">(x+y, y)</text>

  <rect x="176" y="148" width="80" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="6" filter="url(#rough2)"/>
  <text x="216" y="166" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">(x, x+y)</text>

  <!-- 4 leaves (tiny) -->
  <path d="M 64 174 Q 52 188 40 202" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 104 174 Q 116 188 128 202" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 196 174 Q 184 188 172 202" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M 236 174 Q 248 188 260 202" stroke="#b85450" stroke-width="1.2" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>

  <rect x="20" y="204" width="48" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="104" y="204" width="48" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="152" y="204" width="48" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <rect x="236" y="204" width="48" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="150" y="244" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">… 2^k 个状态，不可行</text>

  <!-- arrow down -->
  <path d="M 290 252 Q 290 264 290 276" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 下半：逆向倒推（唯一前驱） ===== -->
  <rect x="324" y="44" width="220" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="434" y="63" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">逆向：每步前驱唯一 → 对数收敛</text>

  <!-- end (tx,ty) -->
  <rect x="404" y="84" width="68" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="438" y="103" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">(tx, ty)</text>

  <!-- backward step 1 -->
  <path d="M 438 114 Q 438 128 438 140" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="392" y="142" width="92" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="438" y="160" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">大 − 小（取模）</text>

  <path d="M 438 170 Q 438 182 438 194" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="392" y="196" width="92" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="438" y="214" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">大 − 小（取模）</text>

  <path d="M 438 224 Q 438 236 438 248" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <rect x="404" y="250" width="68" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="6" filter="url(#rough2)"/>
  <text x="438" y="268" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">(sx, sy)</text>

  <!-- ===== 底部：判定规则 ===== -->
  <rect x="36" y="290" width="508" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="10" filter="url(#rough2)"/>
  <text x="290" y="310" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">倒推规则：tx &gt; ty → 前驱 (tx−ty, ty)；ty &gt; tx → 前驱 (tx, ty−tx)</text>
  <text x="290" y="327" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">较大坐标一定是被加大的，减较小者即可（取模批量压缩）</text>

  <!-- arrow down -->
  <path d="M 290 338 Q 290 350 290 360" stroke="#888" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== 三栏结论 ===== -->
  <rect x="40" y="364" width="160" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="120" y="384" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">取模倒推</text>
  <text x="120" y="400" text-anchor="middle" font-size="10" fill="#4a7a3a">while tx&gt;sx 且 ty&gt;sy</text>
  <text x="120" y="414" text-anchor="middle" font-size="10" fill="#4a7a3a">大 %= 小</text>

  <rect x="210" y="364" width="160" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="290" y="384" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">精确命中</text>
  <text x="290" y="400" text-anchor="middle" font-size="10" fill="#4a7a3a">tx==sx 且 ty==sy</text>
  <text x="290" y="414" text-anchor="middle" font-size="10" fill="#4a7a3a">→ true</text>

  <rect x="380" y="364" width="160" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="460" y="384" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">最后一程整除</text>
  <text x="460" y="400" text-anchor="middle" font-size="10" fill="#b85450">(ty−sy) % sx == 0</text>
  <text x="460" y="414" text-anchor="middle" font-size="10" fill="#b85450">或对称</text>

  <text x="290" y="446" text-anchor="middle" font-size="10" fill="#888" font-style="italic" filter="url(#rough2)">与欧几里得「辗转相减」同构，复杂度 O(log max)</text>
</svg>
