<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="420" fill="#fafafa"/>

  <text x="290" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">INNER JOIN vs LEFT JOIN：无匹配行的去留</text>

  <!-- INNER JOIN panel (left) -->
  <text x="145" y="56" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">INNER JOIN（错误）</text>
  <text x="145" y="72" text-anchor="middle" font-size="9.5" fill="#b85450">仅保留两表都匹配的行 → 漏人</text>

  <rect x="50" y="80" width="190" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="90" y="97" font-size="10" fill="#333">unique_id</text>
  <text x="175" y="97" font-size="10" fill="#333">name</text>
  <line x1="135" y1="80" x2="135" y2="106" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="50" y="106" width="190" height="22" fill="#fff" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="90" y="121" font-size="10" fill="#333">2</text>
  <text x="175" y="121" font-size="10" fill="#333">Meir</text>
  <line x1="135" y1="106" x2="135" y2="128" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="50" y="128" width="190" height="22" fill="#fff" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="90" y="143" font-size="10" fill="#333">3</text>
  <text x="175" y="143" font-size="10" fill="#333">Winston</text>
  <line x1="135" y1="128" x2="135" y2="150" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="50" y="150" width="190" height="22" fill="#fff" stroke="#b85450" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="90" y="165" font-size="10" fill="#333">1</text>
  <text x="175" y="165" font-size="10" fill="#333">Jonathan</text>
  <line x1="135" y1="150" x2="135" y2="172" stroke="#b85450" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="145" y="190" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">3 行</text>
  <rect x="40" y="200" width="210" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="145" y="216" text-anchor="middle" font-size="9.5" fill="#b85450">Alice(id=1)、Bob(id=7)</text>
  <text x="145" y="232" text-anchor="middle" font-size="9.5" fill="#b85450">在 EmployeeUNI 无记录 → 被丢弃</text>

  <!-- LEFT JOIN panel (right) -->
  <text x="435" y="56" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">LEFT JOIN（正确）</text>
  <text x="435" y="72" text-anchor="middle" font-size="9.5" fill="#4a7a3a">保留左表全部行，无匹配填 null</text>

  <rect x="340" y="80" width="190" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="380" y="97" font-size="10" fill="#333">unique_id</text>
  <text x="465" y="97" font-size="10" fill="#333">name</text>
  <line x1="425" y1="80" x2="425" y2="106" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="340" y="106" width="190" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="380" y="121" font-size="10" fill="#b85450" font-weight="bold">null</text>
  <text x="465" y="121" font-size="10" fill="#333">Alice</text>
  <line x1="425" y1="106" x2="425" y2="128" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="340" y="128" width="190" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="3" filter="url(#rough2)"/>
  <text x="380" y="143" font-size="10" fill="#b85450" font-weight="bold">null</text>
  <text x="465" y="143" font-size="10" fill="#333">Bob</text>
  <line x1="425" y1="128" x2="425" y2="150" stroke="#d6a040" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="340" y="150" width="190" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="380" y="165" font-size="10" fill="#333">2</text>
  <text x="465" y="165" font-size="10" fill="#333">Meir</text>
  <line x1="425" y1="150" x2="425" y2="172" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="340" y="172" width="190" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="380" y="187" font-size="10" fill="#333">3</text>
  <text x="465" y="187" font-size="10" fill="#333">Winston</text>
  <line x1="425" y1="172" x2="425" y2="194" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="340" y="194" width="190" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="380" y="209" font-size="10" fill="#333">1</text>
  <text x="465" y="209" font-size="10" fill="#333">Jonathan</text>
  <line x1="425" y1="194" x2="425" y2="216" stroke="#4a7a3a" stroke-width="0.8" filter="url(#rough2)"/>

  <text x="435" y="234" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">5 行（= Employees 全部）</text>
  <rect x="330" y="244" width="210" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="435" y="260" text-anchor="middle" font-size="9.5" fill="#4a7a3a">Alice/Bob 无匹配但被保留</text>
  <text x="435" y="276" text-anchor="middle" font-size="9.5" fill="#4a7a3a">unique_id 自动填 null</text>

  <!-- Bottom summary -->
  <path d="M145 290 L290 290" stroke="#b85450" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <path d="M435 290 L290 290" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" filter="url(#rough2)"/>
  <rect x="110" y="300" width="360" height="68" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="290" y="320" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">判定口诀</text>
  <text x="290" y="338" text-anchor="middle" font-size="10" fill="#333">问自己：「哪张表的行必须全部保留？」</text>
  <text x="290" y="354" text-anchor="middle" font-size="10" fill="#333">答案就是 LEFT JOIN 的左表 —— 本题是 Employees</text>
</svg>
