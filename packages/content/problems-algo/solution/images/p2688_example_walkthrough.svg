<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 9 4 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">示例演算：6 行购买 → 分组计数 → 过滤 → 输出 [4, 6]</text>

  <!-- ===== Phase 1: 输入 6 行 ===== -->
  <text x="105" y="50" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">阶段① 输入（6 行）</text>

  <rect x="20" y="56" width="40" height="20" fill="#446688" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="40" y="70" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">uid</text>
  <rect x="60" y="56" width="120" height="20" fill="#446688" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="70" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">item</text>
  <rect x="180" y="56" width="70" height="20" fill="#446688" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="215" y="70" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">created_at</text>

  <!-- row1: 5 -->
  <rect x="20" y="76" width="40" height="18" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="89" text-anchor="middle" font-size="9" fill="#999">5</text>
  <rect x="60" y="76" width="120" height="18" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="120" y="89" text-anchor="middle" font-size="9" fill="#999">Smart Crock Pot</text>
  <rect x="180" y="76" width="70" height="18" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="215" y="89" text-anchor="middle" font-size="9" fill="#999">09-18</text>

  <!-- row2: 6 -->
  <rect x="20" y="94" width="40" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="40" y="107" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">6</text>
  <rect x="60" y="94" width="120" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="107" text-anchor="middle" font-size="9" fill="#4a7a3a">Smart Lock</text>
  <rect x="180" y="94" width="70" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="215" y="107" text-anchor="middle" font-size="9" fill="#4a7a3a">09-14</text>

  <!-- row3: 6 -->
  <rect x="20" y="112" width="40" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="40" y="125" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">6</text>
  <rect x="60" y="112" width="120" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="125" text-anchor="middle" font-size="9" fill="#4a7a3a">Smart Thermostat</text>
  <rect x="180" y="112" width="70" height="18" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="215" y="125" text-anchor="middle" font-size="9" fill="#4a7a3a">09-10</text>

  <!-- row4: 8 -->
  <rect x="20" y="130" width="40" height="18" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="40" y="143" text-anchor="middle" font-size="9" fill="#999">8</text>
  <rect x="60" y="130" width="120" height="18" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="120" y="143" text-anchor="middle" font-size="9" fill="#999">Smart Light Strip</text>
  <rect x="180" y="130" width="70" height="18" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="215" y="143" text-anchor="middle" font-size="9" fill="#999">09-29</text>

  <!-- row5: 4 -->
  <rect x="20" y="148" width="40" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="40" y="161" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">4</text>
  <rect x="60" y="148" width="120" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="161" text-anchor="middle" font-size="9" fill="#446688">Smart Cat Feeder</text>
  <rect x="180" y="148" width="70" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="215" y="161" text-anchor="middle" font-size="9" fill="#446688">09-02</text>

  <!-- row6: 4 -->
  <rect x="20" y="166" width="40" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="40" y="179" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">4</text>
  <rect x="60" y="166" width="120" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="120" y="179" text-anchor="middle" font-size="9" fill="#446688">Smart Bed</text>
  <rect x="180" y="166" width="70" height="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="215" y="179" text-anchor="middle" font-size="9" fill="#446688">09-13</text>

  <path d="M 255 122 L 295 122" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Phase 2: 分组计数 ===== -->
  <text x="380" y="50" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">阶段② 分组 + COUNT</text>

  <rect x="300" y="56" width="46" height="20" fill="#d6a040" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="323" y="70" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">user_id</text>
  <rect x="346" y="56" width="50" height="20" fill="#d6a040" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="371" y="70" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">COUNT</text>
  <rect x="396" y="56" width="64" height="20" fill="#d6a040" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="428" y="70" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">≥2?</text>

  <!-- user 4 -->
  <rect x="300" y="76" width="46" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="323" y="91" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">4</text>
  <rect x="346" y="76" width="50" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="371" y="91" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">2</text>
  <rect x="396" y="76" width="64" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="428" y="91" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">✓ 留</text>

  <!-- user 5 -->
  <rect x="300" y="98" width="46" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="323" y="113" text-anchor="middle" font-size="10" fill="#999">5</text>
  <rect x="346" y="98" width="50" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="371" y="113" text-anchor="middle" font-size="10" fill="#999">1</text>
  <rect x="396" y="98" width="64" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="428" y="113" text-anchor="middle" font-size="9" fill="#b85450">✗ 淘汰</text>

  <!-- user 6 -->
  <rect x="300" y="120" width="46" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="323" y="135" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">6</text>
  <rect x="346" y="120" width="50" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="371" y="135" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">2</text>
  <rect x="396" y="120" width="64" height="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="428" y="135" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold">✓ 留</text>

  <!-- user 8 -->
  <rect x="300" y="142" width="46" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="323" y="157" text-anchor="middle" font-size="10" fill="#999">8</text>
  <rect x="346" y="142" width="50" height="22" fill="#f0f0f0" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <text x="371" y="157" text-anchor="middle" font-size="10" fill="#999">1</text>
  <rect x="396" y="142" width="64" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1" filter="url(#rough2)"/>
  <text x="428" y="157" text-anchor="middle" font-size="9" fill="#b85450">✗ 淘汰</text>

  <path d="M 462 107 L 500 107" stroke="#4a7a3a" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Phase 3: 输出 ===== -->
  <text x="530" y="50" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">阶段③ 输出</text>

  <rect x="505" y="56" width="50" height="20" fill="#4a7a3a" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="530" y="70" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">user_id</text>

  <rect x="505" y="76" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="530" y="93" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">4</text>

  <rect x="505" y="100" width="50" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="530" y="117" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">6</text>

  <!-- ===== Bottom: color legend + key insight ===== -->
  <rect x="20" y="210" width="250" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="145" y="224" text-anchor="middle" font-size="9" fill="#446688">蓝色 = 用户4（2 行 → 留）</text>

  <rect x="20" y="232" width="250" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="145" y="246" text-anchor="middle" font-size="9" fill="#4a7a3a">绿色 = 用户6（2 行 → 留）</text>

  <rect x="20" y="254" width="250" height="20" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="145" y="268" text-anchor="middle" font-size="9" fill="#999">灰色 = 用户5、8（各 1 行 → 淘汰）</text>

  <!-- tracing lines: how rows map to groups -->
  <text x="400" y="224" text-anchor="middle" font-size="10" fill="#666" font-weight="bold">行→组映射</text>
  <text x="400" y="244" text-anchor="middle" font-size="9" fill="#446688">用户4：行5+行6 → COUNT=2 ✓</text>
  <text x="400" y="260" text-anchor="middle" font-size="9" fill="#4a7a3a">用户6：行2+行3 → COUNT=2 ✓</text>
  <text x="400" y="276" text-anchor="middle" font-size="9" fill="#999">用户5：仅行1 → COUNT=1 ✗</text>
  <text x="400" y="292" text-anchor="middle" font-size="9" fill="#999">用户8：仅行4 → COUNT=1 ✗</text>

  <!-- Bottom note -->
  <rect x="30" y="320" width="500" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="340" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">「活跃」= 同一 user_id 的购买行数 ≥ 2</text>
  <text x="280" y="358" text-anchor="middle" font-size="10" fill="#666">GROUP BY user_id 归并同用户的多次购买，COUNT(*) 数行数</text>
  <text x="280" y="374" text-anchor="middle" font-size="10" fill="#666">HAVING COUNT(*) ≥ 2 淘汰只买 1 次的用户，ORDER BY user_id 升序输出</text>
  <text x="280" y="388" text-anchor="middle" font-size="10" fill="#666">最终：4、6 为活跃用户</text>
</svg>
