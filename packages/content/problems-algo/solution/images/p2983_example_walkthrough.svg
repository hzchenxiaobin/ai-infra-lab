<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="500" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：一正一反，看清两个条件各管什么</text>

  <!-- ================= panel 1: example 3 (true) ================= -->
  <text x="20" y="52" text-anchor="start" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">正例：s = "acbcab"，查询 [1,2,4,5] → true</text>

  <path d="M 198 72 L 198 66 L 286 66 L 286 72" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="242" y="62" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">①=[1,2]</text>

  <text x="138" y="97" text-anchor="end" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">x</text>
  <rect x="150" y="78" width="40" height="26" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="198" y="78" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="246" y="78" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="96" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">a</text>
  <text x="218" y="96" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">c</text>
  <text x="266" y="96" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">b</text>

  <text x="138" y="131" text-anchor="end" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">y</text>
  <rect x="150" y="112" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="198" y="112" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="246" y="112" width="40" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="130" text-anchor="middle" font-size="12.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">b</text>
  <text x="218" y="130" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="266" y="130" text-anchor="middle" font-size="12.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">c</text>

  <text x="170" y="152" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i=0</text>
  <text x="218" y="152" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i=1</text>
  <text x="266" y="152" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i=2</text>

  <path d="M 150 164 L 150 170 L 286 170 L 286 164" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="218" y="186" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">②=[n−1−d, n−1−c]=[0,2]</text>

  <rect x="145" y="194" width="50" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="170" y="208" text-anchor="middle" font-size="10.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">仅②</text>
  <rect x="193" y="194" width="50" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="218" y="208" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">双</text>
  <rect x="241" y="194" width="50" height="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="266" y="208" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">双</text>

  <!-- panel 1 table -->
  <text x="430" y="76" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">逐字母核算（条件 B+C）</text>
  <rect x="340" y="84" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="360" y="99" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">v</text>
  <rect x="382" y="84" width="52" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="408" y="99" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">X−Dx</text>
  <rect x="436" y="84" width="52" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="462" y="99" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">Y−Dy</text>

  <rect x="340" y="108" width="40" height="20" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="360" y="122" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">a</text>
  <rect x="382" y="108" width="52" height="20" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="408" y="122" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>
  <rect x="436" y="108" width="52" height="20" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="462" y="122" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">0</text>

  <rect x="340" y="130" width="40" height="20" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="360" y="144" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">b</text>
  <rect x="382" y="130" width="52" height="20" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="408" y="144" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <rect x="436" y="130" width="52" height="20" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="462" y="144" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>

  <rect x="340" y="152" width="40" height="20" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="360" y="166" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">c</text>
  <rect x="382" y="152" width="52" height="20" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="408" y="166" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <rect x="436" y="152" width="52" height="20" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="462" y="166" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>

  <text x="430" y="194" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">条件 A：门外 = ∅ ✓（U2 覆盖全部）</text>
  <rect x="345" y="202" width="170" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="219" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">三行全配平 → true ✓</text>

  <path d="M 30 240 L 530 240" stroke="#ddd" stroke-width="1.2" stroke-dasharray="6 4" filter="url(#rough2)"/>

  <!-- ================= panel 2: trap (false) ================= -->
  <text x="20" y="266" text-anchor="start" font-size="12" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">陷阱例：s = "abab"，查询 [0,0,2,2] → false</text>

  <path d="M 150 288 L 150 282 L 190 282 L 190 288" stroke="#446688" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="170" y="278" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">①=[0,0]</text>

  <text x="138" y="316" text-anchor="end" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">x</text>
  <rect x="150" y="298" width="40" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <rect x="198" y="298" width="40" height="26" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="170" y="316" text-anchor="middle" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>
  <text x="218" y="316" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">b</text>

  <text x="138" y="350" text-anchor="end" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">y</text>
  <rect x="150" y="332" width="40" height="26" fill="#ffffff" stroke="#999" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <rect x="198" y="332" width="40" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="170" y="350" text-anchor="middle" font-size="12.5" fill="#777" filter="url(#rough2)">b</text>
  <text x="218" y="350" text-anchor="middle" font-size="12.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">a</text>

  <text x="170" y="372" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i=0</text>
  <text x="218" y="372" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">i=1</text>

  <path d="M 198 384 L 198 390 L 238 390 L 238 384" stroke="#d6a040" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <text x="218" y="406" text-anchor="middle" font-size="10.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">②=[1,1]</text>

  <rect x="145" y="414" width="50" height="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="170" y="428" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">仅①</text>
  <rect x="193" y="414" width="50" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="9" filter="url(#rough2)"/>
  <text x="218" y="428" text-anchor="middle" font-size="10.5" fill="#7a5a10" font-weight="bold" filter="url(#rough2)">仅②</text>

  <!-- panel 2 table -->
  <text x="430" y="288" text-anchor="middle" font-size="10.5" fill="#4a7a3a" filter="url(#rough2)">条件 A：门外 = ∅ ✓（恰好全覆盖）</text>
  <text x="430" y="306" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold" filter="url(#rough2)">逐字母核算（条件 B+C）</text>
  <rect x="340" y="312" width="40" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="360" y="327" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">v</text>
  <rect x="382" y="312" width="52" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="408" y="327" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">X−Dx</text>
  <rect x="436" y="312" width="52" height="22" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="462" y="327" text-anchor="middle" font-size="10.5" fill="#446688" font-weight="bold" filter="url(#rough2)">Y−Dy</text>

  <rect x="340" y="336" width="40" height="20" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="360" y="350" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">a</text>
  <rect x="382" y="336" width="52" height="20" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="408" y="350" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>
  <rect x="436" y="336" width="52" height="20" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="462" y="350" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1</text>

  <rect x="340" y="358" width="40" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="360" y="372" text-anchor="middle" font-size="11" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">b</text>
  <rect x="382" y="358" width="52" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="408" y="372" text-anchor="middle" font-size="11" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">−1</text>
  <rect x="436" y="358" width="52" height="20" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="462" y="372" text-anchor="middle" font-size="11" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">−1</text>

  <text x="430" y="396" text-anchor="middle" font-size="10.5" fill="#b85450" filter="url(#rough2)">b 行：两池相等，但都是 −1 ！</text>

  <rect x="322" y="404" width="216" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="430" y="425" text-anchor="middle" font-size="10.5" fill="#8f3a36" font-weight="bold" filter="url(#rough2)">B 总账相等 ✓，但 C 非负性 ✗</text>
  <text x="430" y="445" text-anchor="middle" font-size="10.5" fill="#8f3a36" filter="url(#rough2)">左池掏不出 b 去配 y₀ = b → false</text>

  <text x="280" y="484" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">两段区间都是单字符，重排等于没排，"abab" 本身不是回文——只查「总账相等」必挂在此处</text>
</svg>
