<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="580" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：UNION ALL → GROUP BY → HAVING → ORDER BY</text>

  <!-- ===== Step 1: UNION ALL ===== -->
  <rect x="40" y="50" width="180" height="96" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="130" y="70" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">① UNION ALL</text>
  <line x1="50" y1="76" x2="210" y2="76" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="50" y="92" font-size="9" fill="#333">SELECT id FROM Employees</text>
  <text x="80" y="106" font-size="9" fill="#446688" font-weight="bold">UNION ALL</text>
  <text x="50" y="122" font-size="9" fill="#333">SELECT id FROM Salaries</text>
  <text x="130" y="138" text-anchor="middle" font-size="8" fill="#888">不去重，保留全部 id</text>

  <!-- Arrow down -->
  <path d="M 130 146 L 130 168" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 2: GROUP BY ===== -->
  <rect x="40" y="172" width="180" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="130" y="192" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">② GROUP BY id</text>
  <text x="130" y="210" text-anchor="middle" font-size="9" fill="#666">按 id 折叠，COUNT(*)</text>
  <text x="130" y="222" text-anchor="middle" font-size="8" fill="#888">两表都有 → 2；只一张 → 1</text>

  <!-- Arrow down -->
  <path d="M 130 228 L 130 250" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 3: HAVING ===== -->
  <rect x="40" y="254" width="180" height="56" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="130" y="274" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">③ HAVING COUNT(*) = 1</text>
  <text x="130" y="292" text-anchor="middle" font-size="9" fill="#666">只保留出现 1 次的 id</text>
  <text x="130" y="304" text-anchor="middle" font-size="8" fill="#888">= 信息丢失的雇员</text>

  <!-- Arrow down -->
  <path d="M 130 310 L 130 332" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ===== Step 4: ORDER BY ===== -->
  <rect x="40" y="336" width="180" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="130" y="356" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">④ ORDER BY id</text>
  <text x="130" y="374" text-anchor="middle" font-size="9" fill="#666">从小到大排序输出</text>
  <text x="130" y="386" text-anchor="middle" font-size="8" fill="#888">题目要求排序</text>

  <!-- ===== Right side: data flow illustration ===== -->
  <!-- UNION ALL result -->
  <text x="320" y="64" font-size="10" fill="#888" font-weight="bold">UNION ALL 后（含重复）</text>
  <rect x="310" y="70" width="100" height="120" fill="#fff" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="320" y="86" font-size="9" fill="#446688" font-weight="bold">id</text>
  <line x1="310" y1="92" x2="410" y2="92" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="320" y="106" font-size="9" fill="#b85450">2</text>
  <text x="320" y="120" font-size="9" fill="#4a7a3a">4</text>
  <text x="320" y="134" font-size="9" fill="#4a7a3a">5</text>
  <text x="320" y="148" font-size="9" fill="#4a7a3a">5</text>
  <text x="320" y="162" font-size="9" fill="#b85450">1</text>
  <text x="320" y="176" font-size="9" fill="#4a7a3a">4</text>
  <text x="320" y="186" font-size="8" fill="#888">6 行（不去重）</text>

  <!-- Arrow -->
  <path d="M 410 122 L 440 122" stroke="#446688" stroke-width="1.2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)" opacity="0.7"/>

  <!-- GROUP BY result -->
  <text x="450" y="64" font-size="10" fill="#888" font-weight="bold">GROUP BY 后</text>
  <rect x="440" y="70" width="120" height="106" fill="#fff" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="450" y="86" font-size="9" fill="#4a7a3a" font-weight="bold">id   COUNT</text>
  <line x1="440" y1="92" x2="560" y2="92" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="450" y="106" font-size="9" fill="#b85450" font-weight="bold">2      1</text>
  <text x="450" y="120" font-size="9" fill="#4a7a3a">4      2</text>
  <text x="450" y="134" font-size="9" fill="#4a7a3a">5      2</text>
  <text x="450" y="148" font-size="9" fill="#b85450" font-weight="bold">1      1</text>
  <text x="450" y="172" font-size="8" fill="#888">4 组</text>

  <!-- HAVING filter arrow -->
  <path d="M 500 176 L 500 206" stroke="#b85450" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- HAVING result -->
  <text x="450" y="222" font-size="10" fill="#888" font-weight="bold">HAVING COUNT=1</text>
  <rect x="440" y="228" width="120" height="56" fill="#fff" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="450" y="244" font-size="9" fill="#b85450" font-weight="bold">id</text>
  <line x1="440" y1="250" x2="560" y2="250" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="450" y="264" font-size="9" fill="#b85450" font-weight="bold">2</text>
  <text x="450" y="278" font-size="9" fill="#b85450" font-weight="bold">1</text>

  <!-- ORDER BY arrow -->
  <path d="M 500 284 L 500 310" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Final result -->
  <text x="450" y="326" font-size="10" fill="#888" font-weight="bold">ORDER BY 后（最终）</text>
  <rect x="440" y="332" width="120" height="56" fill="#fff" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="450" y="348" font-size="9" fill="#d6a040" font-weight="bold">employee_id</text>
  <line x1="440" y1="354" x2="560" y2="354" stroke="#ccc" stroke-width="1" filter="url(#rough2)"/>
  <text x="450" y="368" font-size="9" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="450" y="382" font-size="9" fill="#4a7a3a" font-weight="bold">2</text>

  <!-- ===== Bottom note ===== -->
  <rect x="30" y="404" width="530" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="295" y="423" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">关键：UNION ALL（非 UNION）保留重复 → COUNT 才能区分「出现 1 次 vs 2 次」</text>
</svg>
