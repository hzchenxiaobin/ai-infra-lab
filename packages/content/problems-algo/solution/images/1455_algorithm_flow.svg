<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：原地扫描，逐单词前缀比对（O(1) 额外空间）</text>

  <!-- Start -->
  <ellipse cx="280" cy="44" rx="36" ry="13" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="48" text-anchor="middle" font-size="12" fill="#333">开始</text>
  <path d="M 280 57 L 280 67" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Box: idx = 1; i = 0 -->
  <rect x="200" y="69" width="160" height="30" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="88" text-anchor="middle" font-size="11.5" fill="#333">idx = 1；i = 0</text>
  <path d="M 280 99 L 280 109" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: i &lt; n ? -->
  <polygon points="280,111 356,143 280,175 204,143" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="147" text-anchor="middle" font-size="12" fill="#333">i &lt; n ?</text>

  <!-- No branch left -> return -1 -->
  <path d="M 204 143 L 134 143" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="146" y="137" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <rect x="40" y="127" width="90" height="32" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="85" y="147" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold">返回 -1</text>
  <!-- arrow down from 返回 -1 to End -->
  <path d="M 85 159 L 85 172" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <ellipse cx="85" cy="184" rx="30" ry="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="85" y="188" text-anchor="middle" font-size="11.5" fill="#333">结束</text>

  <!-- Yes branch down -->
  <path d="M 280 175 L 280 185" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="182" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- Diamond: sentence[i..] 以 searchWord 为前缀? (j == m after compare) -->
  <polygon points="280,187 372,223 280,259 188,223" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="218" text-anchor="middle" font-size="11" fill="#333">sentence[i..]</text>
  <text x="280" y="232" text-anchor="middle" font-size="11" fill="#333">以 searchWord</text>
  <text x="280" y="246" text-anchor="middle" font-size="11" fill="#333">为前缀?</text>

  <!-- Yes branch left -> return idx -->
  <path d="M 188 223 L 134 223" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="146" y="217" font-size="10.5" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="40" y="209" width="90" height="28" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="85" y="227" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">返回 idx</text>
  <!-- arrow up from 返回 idx to End bottom -->
  <path d="M 85 209 L 85 197" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- No branch down -> skip word + idx++ -->
  <path d="M 280 259 L 280 269" stroke="#666" stroke-width="1.6" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="288" y="266" font-size="10.5" fill="#b85450" font-weight="bold">否</text>
  <rect x="170" y="271" width="220" height="34" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="287" text-anchor="middle" font-size="11" fill="#333">跳过当前单词剩余字符</text>
  <text x="280" y="300" text-anchor="middle" font-size="11" fill="#333">i 跳过空格；idx += 1</text>

  <!-- loop back from skip box to i<n? diamond (right side up) -->
  <path d="M 390 288 L 440 288 L 440 143 L 356 143" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="384" y="138" font-size="10" fill="#4a7a3a">回到 i &lt; n?</text>

  <!-- footer note -->
  <rect x="40" y="334" width="480" height="92" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="280" y="356" text-anchor="middle" font-size="11.5" fill="#555" font-weight="bold">一趟扫描 O(n)，O(1) 额外空间（不切分、不存单词表）</text>
  <text x="280" y="376" text-anchor="middle" font-size="10.5" fill="#888">每个单词仅在开头比对前 m 个字符，m = len(searchWord)</text>
  <text x="280" y="394" text-anchor="middle" font-size="10.5" fill="#888">命中即返回当前 idx（1-indexed）；遍历完无命中返回 -1</text>
  <text x="280" y="412" text-anchor="middle" font-size="10.5" fill="#888">sentence ≤ 100，searchWord ≤ 10，O(n) 毫秒级 AC</text>
</svg>
