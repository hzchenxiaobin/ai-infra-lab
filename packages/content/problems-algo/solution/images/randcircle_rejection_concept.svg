<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">拒绝采样：外接正方形内撒点，圆外丢弃</text>

  <!-- Bounding square [-R, R] x [-R, R] -->
  <rect x="180" y="120" width="200" height="200" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="2" filter="url(#rough2)"/>

  <!-- Inscribed circle -->
  <ellipse cx="280" cy="220" rx="100" ry="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>

  <!-- Center -->
  <circle cx="280" cy="220" r="2.5" fill="#333" filter="url(#rough2)"/>
  <text x="288" y="224" font-size="10" fill="#333">(xc, yc)</text>

  <!-- R label (radius arrow) -->
  <line x1="280" y1="220" x2="360" y2="170" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="332" y="188" font-size="11" fill="#446688" font-weight="bold">R</text>

  <!-- Green dots: inside circle (accept) -->
  <circle cx="255" cy="195" r="3" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="305" cy="205" r="3" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="275" cy="245" r="3" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="315" cy="255" r="3" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="245" cy="225" r="3" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="325" cy="215" r="3" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="285" cy="175" r="3" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="295" cy="265" r="3" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="265" cy="210" r="3" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="300" cy="235" r="3" fill="#4a7a3a" filter="url(#rough2)"/>

  <!-- Red dots: corners (inside square, outside circle = reject) -->
  <circle cx="195" cy="135" r="3" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="365" cy="135" r="3" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="195" cy="305" r="3" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="365" cy="305" r="3" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="205" cy="150" r="3" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="355" cy="295" r="3" fill="#b85450" filter="url(#rough2)"/>

  <!-- Square corner labels -->
  <text x="184" y="116" font-size="10" fill="#888">-R</text>
  <text x="370" y="116" font-size="10" fill="#888">+R</text>
  <text x="168" y="136" font-size="10" fill="#888">+R</text>
  <text x="168" y="312" font-size="10" fill="#888">-R</text>

  <!-- Legend -->
  <rect x="420" y="92" width="22" height="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="450" y="104" font-size="11" fill="#4a7a3a">圆内：接受</text>
  <text x="450" y="118" font-size="10" fill="#888">命中概率 π/4</text>

  <rect x="420" y="134" width="22" height="16" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="450" y="146" font-size="11" fill="#d6a040">正方形</text>
  <text x="450" y="160" font-size="10" fill="#888">面积 (2R)²</text>

  <rect x="420" y="176" width="22" height="16" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="450" y="188" font-size="11" fill="#b85450">四角：丢弃</text>
  <text x="450" y="202" font-size="10" fill="#888">1 − π/4 ≈ 0.215</text>

  <!-- Explanation box -->
  <rect x="40" y="352" width="480" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="374" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">接受率 = 圆面积 / 正方形面积 = πR² / (2R)² = π/4 ≈ 0.785</text>
  <text x="280" y="392" text-anchor="middle" font-size="11" fill="#666">x' = U₁·2R − R,  y' = U₂·2R − R  →  判 x'² + y'² ≤ R² ?</text>
  <text x="280" y="410" text-anchor="middle" font-size="11" fill="#888">命中返回 [xc+x', yc+y']；否则重采。期望 4/π ≈ 1.27 次</text>
</svg>
