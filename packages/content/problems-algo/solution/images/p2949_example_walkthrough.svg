<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：s = "baeyh"，k = 2 ⟹ m = 2，双键 (D, V mod 2)</text>

  <text x="92" y="62" font-size="12" fill="#555">s =</text>

  <rect x="120" y="44" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="138" y="62" text-anchor="middle" font-size="13" fill="#333">b</text>
  <rect x="156" y="44" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="174" y="62" text-anchor="middle" font-size="13" fill="#333">a</text>
  <rect x="192" y="44" width="36" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="210" y="62" text-anchor="middle" font-size="13" fill="#333">e</text>
  <rect x="228" y="44" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="246" y="62" text-anchor="middle" font-size="13" fill="#333">y</text>
  <rect x="264" y="44" width="36" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="282" y="62" text-anchor="middle" font-size="13" fill="#333">h</text>

  <text x="120" y="86" font-size="10" fill="#999">p=0</text>
  <text x="156" y="86" font-size="10" fill="#999">p=1</text>
  <text x="192" y="86" font-size="10" fill="#999">p=2</text>
  <text x="228" y="86" font-size="10" fill="#999">p=3</text>
  <text x="264" y="86" font-size="10" fill="#999">p=4</text>
  <text x="306" y="86" font-size="10" fill="#999">p=5</text>

  <text x="360" y="56" font-size="11" fill="#4a7a3a">V(p) = 前 p 个字符的元音数</text>
  <text x="360" y="76" font-size="11" fill="#446688">D(p) = 2V(p) − p</text>

  <rect x="70" y="106" width="435" height="168" fill="#ffffff" stroke="#aaa" stroke-width="1.4" filter="url(#rough2)"/>
  <rect x="70" y="106" width="435" height="24" fill="#f0f0f0" stroke="none" filter="url(#rough2)"/>
  <rect x="70" y="130" width="435" height="24" fill="#e8f0fe" stroke="none" filter="url(#rough2)"/>
  <rect x="70" y="226" width="435" height="24" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>
  <rect x="70" y="250" width="435" height="24" fill="#e6f4ea" stroke="none" filter="url(#rough2)"/>

  <line x1="70" y1="130" x2="505" y2="130" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="70" y1="154" x2="505" y2="154" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="70" y1="178" x2="505" y2="178" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="70" y1="202" x2="505" y2="202" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="70" y1="226" x2="505" y2="226" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="70" y1="250" x2="505" y2="250" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="70" y1="274" x2="505" y2="274" stroke="#aaa" stroke-width="1.2" filter="url(#rough2)"/>

  <line x1="120" y1="106" x2="120" y2="274" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="165" y1="106" x2="165" y2="274" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="205" y1="106" x2="205" y2="274" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="250" y1="106" x2="250" y2="274" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="292" y1="106" x2="292" y2="274" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="392" y1="106" x2="392" y2="274" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>
  <line x1="452" y1="106" x2="452" y2="274" stroke="#ddd" stroke-width="1" filter="url(#rough2)"/>

  <text x="95" y="123" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">p</text>
  <text x="142" y="123" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">字符</text>
  <text x="185" y="123" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">V</text>
  <text x="227" y="123" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">D</text>
  <text x="271" y="123" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">V%2</text>
  <text x="342" y="123" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">键 (D, V%2)</text>
  <text x="422" y="123" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">配对</text>
  <text x="478" y="123" text-anchor="middle" font-size="11" fill="#555" font-weight="bold">ans</text>

  <text x="95" y="147" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="142" y="147" text-anchor="middle" font-size="11" fill="#999">∅</text>
  <text x="185" y="147" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="227" y="147" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="271" y="147" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="342" y="147" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">(0, 0)</text>
  <text x="422" y="147" text-anchor="middle" font-size="11" fill="#446688">初始放入</text>
  <text x="478" y="147" text-anchor="middle" font-size="11" fill="#333">0</text>

  <text x="95" y="171" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="142" y="171" text-anchor="middle" font-size="11" fill="#333">b</text>
  <text x="185" y="171" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="227" y="171" text-anchor="middle" font-size="11" fill="#333">−1</text>
  <text x="271" y="171" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="342" y="171" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">(−1, 0)</text>
  <text x="422" y="171" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="478" y="171" text-anchor="middle" font-size="11" fill="#333">0</text>

  <text x="95" y="195" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="142" y="195" text-anchor="middle" font-size="11" fill="#333">a</text>
  <text x="185" y="195" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="227" y="195" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="271" y="195" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="342" y="195" text-anchor="middle" font-size="11" fill="#333">(0, 1)</text>
  <text x="422" y="195" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="478" y="195" text-anchor="middle" font-size="11" fill="#333">0</text>

  <text x="95" y="219" text-anchor="middle" font-size="11" fill="#333">3</text>
  <text x="142" y="219" text-anchor="middle" font-size="11" fill="#333">e</text>
  <text x="185" y="219" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="227" y="219" text-anchor="middle" font-size="11" fill="#333">1</text>
  <text x="271" y="219" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="342" y="219" text-anchor="middle" font-size="11" fill="#333">(1, 0)</text>
  <text x="422" y="219" text-anchor="middle" font-size="11" fill="#999">—</text>
  <text x="478" y="219" text-anchor="middle" font-size="11" fill="#333">0</text>

  <text x="95" y="243" text-anchor="middle" font-size="11" fill="#333">4</text>
  <text x="142" y="243" text-anchor="middle" font-size="11" fill="#333">y</text>
  <text x="185" y="243" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="227" y="243" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="271" y="243" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="342" y="243" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">(0, 0)</text>
  <text x="422" y="243" text-anchor="middle" font-size="11" fill="#4a7a3a">+1 配 p=0</text>
  <text x="478" y="243" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">1</text>

  <text x="95" y="267" text-anchor="middle" font-size="11" fill="#333">5</text>
  <text x="142" y="267" text-anchor="middle" font-size="11" fill="#333">h</text>
  <text x="185" y="267" text-anchor="middle" font-size="11" fill="#333">2</text>
  <text x="227" y="267" text-anchor="middle" font-size="11" fill="#333">−1</text>
  <text x="271" y="267" text-anchor="middle" font-size="11" fill="#333">0</text>
  <text x="342" y="267" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">(−1, 0)</text>
  <text x="422" y="267" text-anchor="middle" font-size="11" fill="#4a7a3a">+1 配 p=1</text>
  <text x="478" y="267" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">2</text>

  <text x="70" y="296" font-size="11" fill="#999">"ba"（p=0↔2）被第二维卡掉：D 同为 0，但 V%2 一个 0 一个 1 —— k=2 要求 v 为偶数</text>

  <rect x="70" y="312" width="435" height="42" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="287" y="337" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">ans = 2：(0,4) → "baey"、(1,5) → "aeyh" ✓（与官方一致）</text>

  <text x="70" y="382" font-size="11" fill="#999">示例 2 "abba"（k=1→m=1，第二维恒 0）：键 (0,0) 出现 3 次 → C(3,2) = 3 ✓</text>
  <text x="70" y="402" font-size="11" fill="#999">示例 3 "bcdf" 全辅音：D(p) = −p 互不相同 → 无任何配对 → 0 ✓</text>
</svg>
