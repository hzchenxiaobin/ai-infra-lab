<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">第 N 高的薪水 = 去重后按降序排列的第 N 个值（176 的泛化）</text>

  <!-- Employee table (left) -->
  <text x="90" y="58" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">Employee 表</text>
  <rect x="30" y="64" width="120" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="48" y="82" font-size="10" fill="#333">id</text>
  <text x="100" y="82" font-size="10" fill="#333">salary</text>
  <line x1="70" y1="64" x2="70" y2="92" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="92" width="120" height="22" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="48" y="107" font-size="10" fill="#333">1</text>
  <text x="100" y="107" font-size="10" fill="#333">100</text>
  <line x1="70" y1="92" x2="70" y2="114" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="114" width="120" height="22" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="48" y="129" font-size="10" fill="#333">2</text>
  <text x="100" y="129" font-size="10" fill="#333">200</text>
  <line x1="70" y1="114" x2="70" y2="136" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <rect x="30" y="136" width="120" height="22" fill="#fff" stroke="#446688" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="48" y="151" font-size="10" fill="#333">3</text>
  <text x="100" y="151" font-size="10" fill="#333">300</text>
  <line x1="70" y1="136" x2="70" y2="158" stroke="#446688" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- Transformation arrow -->
  <path d="M155 124 L335 124" stroke="#446688" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="245" y="116" text-anchor="middle" font-size="10" fill="#446688">DISTINCT + ORDER BY DESC</text>
  <text x="245" y="138" text-anchor="middle" font-size="9" fill="#888">去重 + 降序</text>

  <!-- Distinct sorted list (right) -->
  <text x="430" y="58" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">不同薪水（降序）</text>
  <rect x="370" y="64" width="120" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="430" y="82" text-anchor="middle" font-size="10" fill="#333">salary</text>

  <rect x="370" y="92" width="120" height="22" fill="#fff" stroke="#4a7a3a" stroke-width="1" rx="3" filter="url(#rough2)"/>
  <text x="430" y="107" text-anchor="middle" font-size="10" fill="#333">300</text>
  <text x="388" y="107" font-size="9" fill="#888">第1高</text>

  <rect x="370" y="114" width="120" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="3" filter="url(#rough2)"/>
  <text x="430" y="129" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">200</text>
  <text x="388" y="129" font-size="9" fill="#d6a040">第2高 ★</text>

  <rect x="370" y="136" width="120" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
  <text x="430" y="151" text-anchor="middle" font-size="10" fill="#333">100</text>
  <text x="388" y="151" font-size="9" fill="#888">第3高</text>

  <rect x="370" y="158" width="120" height="22" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
  <text x="430" y="173" text-anchor="middle" font-size="10" fill="#b85450">… 第N高</text>

  <!-- Answer callout -->
  <path d="M430 184 L430 202" stroke="#d6a040" stroke-width="1.5" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="190" y="206" width="300" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="340" y="224" text-anchor="middle" font-size="11" fill="#333">N=2 即 176 题；N 是参数 → 需 CREATE FUNCTION</text>
  <text x="340" y="242" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">取降序后第 N 个值，无则返回 NULL</text>

  <!-- Pitfall hint bottom -->
  <rect x="40" y="262" width="480" height="86" fill="#fce4ec" stroke="#b85450" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="282" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">⚠️ 两个新挑战（相较 176）</text>
  <text x="60" y="302" font-size="10" fill="#333">① OFFSET 必须是常量：N 是参数，须先 SET N = N−1 预计算偏移量</text>
  <text x="60" y="318" font-size="10" fill="#333">② 须封装为函数：CREATE FUNCTION getNthHighestSalary(N INT) RETURNS INT</text>
  <text x="60" y="334" font-size="10" fill="#333">③ 沿用 176 的「空集→NULL 行」包装：外层 SELECT ( 子查询 )</text>
</svg>
