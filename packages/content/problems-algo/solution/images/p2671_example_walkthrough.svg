<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">示例演算：增删时 freq 桶的搬移</text>

  <!-- table frame -->
  <g filter="url(#rough2)">
    <rect x="30" y="50" width="500" height="332" fill="#fff" stroke="#446688" stroke-width="1.8" rx="8"/>
    <!-- column dividers -->
    <line x1="170" y1="50" x2="170" y2="382" stroke="#446688" stroke-width="1"/>
    <line x1="340" y1="50" x2="340" y2="382" stroke="#446688" stroke-width="1"/>
    <line x1="470" y1="50" x2="470" y2="382" stroke="#446688" stroke-width="1"/>
    <!-- header row divider -->
    <line x1="30" y1="84" x2="530" y2="84" stroke="#446688" stroke-width="1.4"/>
    <!-- row dividers -->
    <line x1="30" y1="138" x2="530" y2="138" stroke="#bbb" stroke-width="1"/>
    <line x1="30" y1="192" x2="530" y2="192" stroke="#bbb" stroke-width="1"/>
    <line x1="30" y1="246" x2="530" y2="246" stroke="#bbb" stroke-width="1"/>
    <line x1="30" y1="300" x2="530" y2="300" stroke="#bbb" stroke-width="1"/>
  </g>

  <!-- header -->
  <g filter="url(#rough2)">
    <text x="100" y="73" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">操作</text>
    <text x="255" y="73" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688">cnt（数字→频率）</text>
    <text x="405" y="73" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a">freq（频率→个数）</text>
    <text x="500" y="73" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">结果</text>
  </g>

  <!-- row1: add(3) -->
  <g filter="url(#rough2)">
    <text x="100" y="113" text-anchor="middle" font-size="13" fill="#333">add(3)</text>
    <text x="255" y="113" text-anchor="middle" font-size="13" fill="#333">{3: 1}</text>
    <text x="405" y="113" text-anchor="middle" font-size="13" fill="#4a7a3a">{1: 1}</text>
    <text x="500" y="113" text-anchor="middle" font-size="13" fill="#888">—</text>
  </g>
  <!-- row2: add(3) -->
  <g filter="url(#rough2)">
    <text x="100" y="167" text-anchor="middle" font-size="13" fill="#333">add(3)</text>
    <text x="255" y="167" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">{3: 2}</text>
    <text x="405" y="167" text-anchor="middle" font-size="13" fill="#4a7a3a">{1: 0, 2: 1}</text>
    <text x="500" y="167" text-anchor="middle" font-size="13" fill="#888">—</text>
  </g>
  <!-- row3: hasFrequency(2) -->
  <g filter="url(#rough2)">
    <text x="100" y="221" text-anchor="middle" font-size="13" fill="#333">hasFrequency(2)</text>
    <text x="255" y="221" text-anchor="middle" font-size="13" fill="#bbb">{3: 2}</text>
    <text x="405" y="221" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">freq[2]=1</text>
    <text x="500" y="221" text-anchor="middle" font-size="13" font-weight="bold" fill="#2a5a1a">true</text>
  </g>
  <!-- row4: deleteOne(3) -->
  <g filter="url(#rough2)">
    <text x="100" y="275" text-anchor="middle" font-size="13" fill="#333">deleteOne(3)</text>
    <text x="255" y="275" text-anchor="middle" font-size="13" fill="#333">{3: 1}</text>
    <text x="405" y="275" text-anchor="middle" font-size="13" fill="#4a7a3a">{1: 1, 2: 0}</text>
    <text x="500" y="275" text-anchor="middle" font-size="13" fill="#888">—</text>
  </g>
  <!-- row5: hasFrequency(2) -->
  <g filter="url(#rough2)">
    <text x="100" y="329" text-anchor="middle" font-size="13" fill="#333">hasFrequency(2)</text>
    <text x="255" y="329" text-anchor="middle" font-size="13" fill="#bbb">{3: 1}</text>
    <text x="405" y="329" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">freq[2]=0</text>
    <text x="500" y="329" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450">false</text>
  </g>

  <!-- bottom note -->
  <g filter="url(#rough2)">
    <text x="280" y="365" text-anchor="middle" font-size="12" fill="#7a5a10">每次增删：freq[旧] −1、freq[新] +1，hasFrequency 只读 freq，全程 O(1)</text>
  </g>
</svg>
