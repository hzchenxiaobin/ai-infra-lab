<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="500" height="400" fill="#fafafa"/>

  <text x="250" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">环状替换：下标环 (i + k) % n</text>
  <text x="250" y="42" text-anchor="middle" font-size="11" fill="#888">nums = [1,2,3,4,5,6,7]，k = 3，从下标 0 出发</text>

  <!-- Cycle edges (star polygon {7/3}) -->
  <path d="M 253.6 100.6 L 294.1 278.5" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 287.7 281.6 L 174.0 138.9" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 178.4 133.4 L 342.8 212.6" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 341.2 219.5 L 158.8 219.5" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 157.2 212.6 L 321.6 133.4" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 326.0 138.9 L 212.3 281.6" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>
  <path d="M 205.9 278.5 L 246.4 100.6" stroke="#d6a040" stroke-width="2.2" fill="none" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <!-- Nodes (index labels) -->
  <circle cx="250" cy="85" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="250" y="90" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <circle cx="336" cy="126.4" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="336" y="131.4" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <circle cx="357.2" cy="219.5" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="357.2" y="224.5" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>
  <circle cx="297.7" cy="294.1" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="297.7" y="299.1" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <circle cx="202.3" cy="294.1" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="202.3" y="299.1" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <circle cx="142.8" cy="219.5" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="142.8" y="224.5" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <circle cx="164" cy="126.4" r="17" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="164" y="131.4" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>

  <!-- start marker -->
  <text x="250" y="68" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">起点</text>

  <!-- Trace + note -->
  <rect x="40" y="338" width="420" height="48" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="250" y="360" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">环：0 → 3 → 6 → 2 → 5 → 1 → 4 → 0</text>
  <text x="250" y="378" text-anchor="middle" font-size="11" fill="#888">gcd(7, 3) = 1，单个环恰好遍历全部 7 个元素 → 结果 [5,6,7,1,2,3,4]</text>
</svg>
