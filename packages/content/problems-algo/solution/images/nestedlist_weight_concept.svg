<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="32" text-anchor="middle" font-size="18" fill="#333" filter="url(#rough2)">
    嵌套结构 → 深度 → 权重
  </text>

  <!-- Outermost list bracket depth=1 -->
  <path d="M 40 70 Q 30 70 30 90 L 30 280 Q 30 300 40 300"
        fill="none" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <path d="M 530 70 Q 540 70 540 90 L 540 280 Q 540 300 530 300"
        fill="none" stroke="#446688" stroke-width="2.2" filter="url(#rough2)"/>
  <text x="20" y="190" font-size="14" fill="#446688" filter="url(#rough2)">d=1</text>

  <!-- Inner list 1: [1,1] at depth 2 -->
  <path d="M 70 110 Q 62 110 62 125 L 62 175 Q 62 190 70 190"
        fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 170 110 Q 178 110 178 125 L 178 175 Q 178 190 170 190"
        fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="80" y="125" width="36" height="30" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="98" y="145" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="124" y="125" width="36" height="30" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="142" y="145" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="60" y="100" font-size="13" fill="#b85450" filter="url(#rough2)">d=2</text>

  <!-- Middle integer 2 at depth 1 -->
  <rect x="245" y="125" width="50" height="30" fill="#fff8e1" stroke="#d6a040"
        stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="270" y="145" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <text x="240" y="118" font-size="13" fill="#d6a040" filter="url(#rough2)">d=1</text>

  <!-- Inner list 2: [1,1] at depth 2 -->
  <path d="M 335 110 Q 327 110 327 125 L 327 175 Q 327 190 335 190"
        fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <path d="M 435 110 Q 443 110 443 125 L 443 175 Q 443 190 435 190"
        fill="none" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <rect x="345" y="125" width="36" height="30" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="363" y="145" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <rect x="389" y="125" width="36" height="30" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="407" y="145" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="325" y="100" font-size="13" fill="#b85450" filter="url(#rough2)">d=2</text>

  <!-- Calculation line -->
  <line x1="30" y1="225" x2="540" y2="225" stroke="#888" stroke-width="1"
        stroke-dasharray="4,4" filter="url(#rough2)"/>

  <text x="280" y="255" text-anchor="middle" font-size="15" fill="#4a7a3a" filter="url(#rough2)">
    加权和 = 1×2 + 1×2 + 2×1 + 1×2 + 1×2
  </text>
  <text x="280" y="285" text-anchor="middle" font-size="18" fill="#b85450" filter="url(#rough2)">
    = 2 + 2 + 2 + 2 + 2 = 10
  </text>

  <!-- Legend -->
  <rect x="70" y="320" width="20" height="14" fill="#e8f0fe" stroke="#446688"
        stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="98" y="332" font-size="12" fill="#555" filter="url(#rough2)">整数节点</text>
  <rect x="180" y="320" width="20" height="14" fill="#fff8e1" stroke="#d6a040"
        stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="208" y="332" font-size="12" fill="#555" filter="url(#rough2)">d=1 元素</text>
  <path d="M 290 320 Q 286 320 286 327 L 286 333" fill="none" stroke="#b85450"
        stroke-width="1.5" filter="url(#rough2)"/>
  <text x="310" y="332" font-size="12" fill="#555" filter="url(#rough2)">列表括号（d+1 层）</text>
</svg>
