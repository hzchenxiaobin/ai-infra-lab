<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="580" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="290" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：按值分组 → 升序下标 → 前缀和拆左右</text>

  <!-- Top: array row nums = [1,3,1,1,2] -->
  <text x="40" y="58" font-size="11" fill="#888">nums</text>
  <rect x="80" y="44" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="104" y="63" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="104" y="86" text-anchor="middle" font-size="9" fill="#888">0</text>

  <rect x="132" y="44" width="48" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="156" y="63" text-anchor="middle" font-size="12" fill="#333">3</text>
  <text x="156" y="86" text-anchor="middle" font-size="9" fill="#888">1</text>

  <rect x="184" y="44" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="208" y="63" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="208" y="86" text-anchor="middle" font-size="9" fill="#888">2</text>

  <rect x="236" y="44" width="48" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="260" y="63" text-anchor="middle" font-size="12" fill="#333">1</text>
  <text x="260" y="86" text-anchor="middle" font-size="9" fill="#888">3</text>

  <rect x="288" y="44" width="48" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="312" y="63" text-anchor="middle" font-size="12" fill="#333">2</text>
  <text x="312" y="86" text-anchor="middle" font-size="9" fill="#888">4</text>

  <!-- Arrow down: group by value -->
  <text x="370" y="62" font-size="11" fill="#888">→ 按值分组</text>
  <line x1="380" y1="72" x2="380" y2="108" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Middle: groups -->
  <text x="60" y="118" font-size="11" fill="#888">值=1 的下标组</text>
  <rect x="60" y="128" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="84" y="146" text-anchor="middle" font-size="12" fill="#333">0</text>
  <rect x="112" y="128" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="136" y="146" text-anchor="middle" font-size="12" fill="#333">2</text>
  <rect x="164" y="128" width="48" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="188" y="146" text-anchor="middle" font-size="12" fill="#333">3</text>

  <text x="220" y="142" font-size="10" fill="#888">p₀  p₁  p₂   （已升序，m=3）</text>

  <!-- Focus on p₁=2: split left / right -->
  <text x="60" y="178" font-size="11" fill="#555" font-weight="bold">对 p₁=2 求距离和：</text>

  <!-- Number line -->
  <line x1="60" y1="210" x2="300" y2="210" stroke="#888" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <circle cx="100" cy="210" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="100" y="214" text-anchor="middle" font-size="10" fill="#333">0</text>
  <circle cx="200" cy="210" r="10" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="200" y="214" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <circle cx="280" cy="210" r="8" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="280" y="214" text-anchor="middle" font-size="10" fill="#333">3</text>

  <text x="200" y="196" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">p₁（当前）</text>

  <!-- Left bracket -->
  <path d="M 100 224 Q 100 236 150 236 Q 200 236 200 224" fill="none" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="140" y="252" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">左侧 j&lt;1</text>
  <text x="140" y="266" text-anchor="middle" font-size="9" fill="#4a7a3a">p₁−p₀ = 2−0 = 2</text>

  <!-- Right bracket -->
  <path d="M 200 224 Q 200 236 240 236 Q 280 236 280 224" fill="none" stroke="#b85450" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="248" y="252" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">右侧 j&gt;1</text>
  <text x="248" y="266" text-anchor="middle" font-size="9" fill="#b85450">p₂−p₁ = 3−2 = 1</text>

  <!-- Formula box (right side) -->
  <rect x="350" y="120" width="215" height="155" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="457" y="142" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">前缀和拆分公式</text>
  <text x="362" y="162" font-size="10" fill="#555">左侧 = i·pᵢ − prefix[i]</text>
  <text x="362" y="178" font-size="10" fill="#555">右侧 = (total − prefix[i] − pᵢ)</text>
  <text x="378" y="192" font-size="10" fill="#555">− (m−1−i)·pᵢ</text>
  <line x1="362" y1="200" x2="552" y2="200" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="362" y="216" font-size="10" fill="#333" font-weight="bold">合并：</text>
  <text x="362" y="234" font-size="11" fill="#b85450" font-weight="bold">f(i) = pᵢ·(2i−m)</text>
  <text x="410" y="250" font-size="11" fill="#b85450" font-weight="bold">+ total − 2·prefix[i]</text>
  <text x="362" y="268" font-size="9" fill="#888">prefix[i] = p₀+…+pᵢ₋₁</text>

  <!-- Bottom verification -->
  <rect x="40" y="300" width="525" height="80" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="322" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">代入 p₁=2：m=3, total=5, prefix[1]=0</text>
  <text x="300" y="342" text-anchor="middle" font-size="10" fill="#555">f(1) = 2×(2−3) + 5 − 2×0 = −2 + 5 = 3</text>
  <text x="300" y="362" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">→ arr[2] = 3 ✓</text>
</svg>
