<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#333" filter="url(#rough2)">算法流程：累乘异或，末值为 0 即存在</text>

  <!-- Start -->
  <ellipse cx="260" cy="70" rx="62" ry="22" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">开始　xr = 0</text>

  <line x1="260" y1="92" x2="260" y2="118" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Process: for each x -->
  <rect x="160" y="120" width="200" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="147" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">对每个 x ∈ derived：</text>

  <line x1="260" y1="164" x2="260" y2="188" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Process: xr ^= x -->
  <rect x="160" y="190" width="200" height="44" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="217" text-anchor="middle" font-size="13" fill="#333" filter="url(#rough2)">xr ← xr ⊕ x</text>

  <!-- loop back arrow: from bottom of this box back to top of "for each" -->
  <path d="M360,212 Q404,212 404,142 L366,142" fill="none" stroke="#446688" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="410" y="180" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">循环</text>

  <line x1="260" y1="234" x2="260" y2="258" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: xr == 0 ? -->
  <polygon points="260,260 350,300 260,340 170,300" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="296" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">xr == 0 ?</text>

  <!-- branches -->
  <text x="120" y="293" text-anchor="middle" font-size="12" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <text x="398" y="293" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85450" filter="url(#rough2)">否</text>

  <!-- left: return true -->
  <line x1="170" y1="300" x2="120" y2="300" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="20" y="355" width="0" height="0" fill="none"/>
  <rect x="20" y="282" width="98" height="38" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="69" y="306" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">return true</text>

  <!-- right: return false -->
  <line x1="350" y1="300" x2="400" y2="300" stroke="#446688" stroke-width="2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="402" y="282" width="98" height="38" rx="6" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="451" y="306" text-anchor="middle" font-size="13" font-weight="bold" fill="#b85450" filter="url(#rough2)">return false</text>
</svg>
