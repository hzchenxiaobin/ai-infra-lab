<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 540"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="480" height="540" fill="#fafafa"/>

  <!-- Title -->
  <text x="240" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">排序 + 双指针算法流程</text>

  <!-- Step 1: Sort -->
  <rect x="160" y="44" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="240" y="66" text-anchor="middle" font-size="12" fill="#333">排序 nums（升序）</text>
  <line x1="240" y1="78" x2="240" y2="94" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: Init -->
  <rect x="140" y="96" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="240" y="118" text-anchor="middle" font-size="12" fill="#333">left=0, right=n−1, ans=0</text>
  <line x1="240" y1="130" x2="240" y2="146" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: left < right? -->
  <polygon points="240,148 330,190 240,232 150,190" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240" y="188" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">left &lt; right ?</text>
  <text x="240" y="204" text-anchor="middle" font-size="10" fill="#888">（还有元素可配）</text>

  <!-- No branch → return -->
  <line x1="330" y1="190" x2="400" y2="190" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="358" y="184" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="400" y="174" width="70" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="435" y="196" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">返回 ans</text>

  <!-- Yes branch → compute sum -->
  <line x1="240" y1="232" x2="240" y2="248" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="252" y="244" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="140" y="250" width="200" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="240" y="272" text-anchor="middle" font-size="12" fill="#333">sum = nums[left] + nums[right]</text>
  <line x1="240" y1="284" x2="240" y2="296" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond: sum vs k -->
  <polygon points="240,298 340,348 240,398 140,348" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="240" y="346" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">sum 与 k</text>
  <text x="240" y="362" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">的关系？</text>

  <!-- sum == k -->
  <line x1="240" y1="398" x2="240" y2="414" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="252" y="410" font-size="10" fill="#4a7a3a" font-weight="bold">= k</text>
  <rect x="150" y="416" width="180" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="240" y="438" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">ans++, left++, right−−</text>

  <!-- sum < k -->
  <line x1="140" y1="348" x2="80" y2="348" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="110" y="342" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">&lt; k</text>
  <rect x="10" y="332" width="70" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="45" y="354" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">left++</text>
  <text x="45" y="382" text-anchor="middle" font-size="9" fill="#888">和太小</text>

  <!-- sum > k -->
  <line x1="340" y1="348" x2="400" y2="348" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="370" y="342" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">&gt; k</text>
  <rect x="400" y="332" width="70" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="435" y="354" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">right−−</text>
  <text x="435" y="382" text-anchor="middle" font-size="9" fill="#888">和太大</text>

  <!-- Loop back arrows -->
  <path d="M 45 366 L 45 430 L 150 430" stroke="#666" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 435 366 L 435 430 L 330 430" stroke="#666" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 240 450 L 240 470 L 380 470 L 380 190 L 332 190" stroke="#666" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>

  <text x="240" y="492" text-anchor="middle" font-size="10" fill="#888" font-style="italic">三个分支都回到「left &lt; right ?」循环</text>

  <!-- Note -->
  <rect x="20" y="504" width="440" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="240" y="522" text-anchor="middle" font-size="11" fill="#555">排序后：和太小→左指针右移增大；和太大→右指针左移减小</text>
</svg>
