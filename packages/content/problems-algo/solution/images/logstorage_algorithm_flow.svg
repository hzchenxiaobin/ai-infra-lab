<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto">
      <path d="M0,0 L4,7 L8,0 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="480" height="410" fill="#fafafa"/>

  <text x="240" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">retrieve 算法流程</text>

  <!-- 1. retrieve call -->
  <rect x="120" y="34" width="240" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="240" y="54" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">retrieve(start, end, granularity)</text>

  <!-- 2. len lookup -->
  <rect x="120" y="80" width="240" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="240" y="97" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">len = gra_len[granularity]</text>
  <text x="240" y="110" text-anchor="middle" font-size="9.5" fill="#888">Year→4  Month→7  Day→10  Hour→13  Minute→16  Second→19</text>

  <!-- 3. truncate start/end -->
  <rect x="120" y="130" width="240" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="240" y="150" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">s = start[:len]    e = end[:len]</text>

  <!-- 4. loop header -->
  <rect x="150" y="180" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="240" y="200" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">for (id, ts) in logs:</text>

  <!-- return res (right of loop header) -->
  <rect x="365" y="180" width="100" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="415" y="200" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">return res</text>

  <!-- 5. truncate ts -->
  <rect x="150" y="230" width="180" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="240" y="250" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">t = ts[:len]</text>

  <!-- 6. diamond: s <= t <= e ? -->
  <polygon points="240,278 318,305 240,332 162,305" fill="#f0f0f0" stroke="#888" stroke-width="2" filter="url(#rough2)"/>
  <text x="240" y="302" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">s ≤ t ≤ e ?</text>
  <text x="240" y="318" text-anchor="middle" font-size="9.5" fill="#777">字典序比较</text>

  <!-- 7. res.add(id) -->
  <rect x="345" y="292" width="95" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="6" filter="url(#rough2)"/>
  <text x="392" y="309" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">res.add(id)</text>

  <!-- arrows: vertical main flow -->
  <path d="M 240 64 L 240 80" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 240 114 L 240 130" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 240 160 L 240 180" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 240 210 L 240 230" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <path d="M 240 260 L 240 278" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>

  <!-- loop header -> return res (loop done) -->
  <path d="M 330 195 L 365 195" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="347" y="189" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">遍历完</text>

  <!-- diamond yes -> res.add -->
  <path d="M 318 305 L 345 305" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="330" y="298" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">Yes</text>

  <!-- diamond no -> down -->
  <path d="M 240 332 L 240 355" stroke="#888" stroke-width="2" fill="none" filter="url(#rough2)"/>
  <text x="252" y="346" font-size="10" fill="#b85450" font-weight="bold">No</text>

  <!-- res.add -> down -->
  <path d="M 392 318 L 392 355" stroke="#888" stroke-width="2" fill="none" filter="url(#rough2)"/>

  <!-- merged loop-back: right end -> left -> up -> into loop header -->
  <path d="M 392 355 L 80 355 L 80 195 L 150 195" stroke="#888" stroke-width="2" fill="none" marker-end="url(#arrD)" filter="url(#rough2)"/>
  <text x="88" y="278" font-size="9.5" fill="#888" font-weight="bold">下一个</text>

  <!-- takeaway -->
  <rect x="60" y="372" width="360" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="240" y="391" text-anchor="middle" font-size="11" fill="#444">put: O(1) 追加   ·   retrieve: O(n) 截断 + 字符串比较</text>
</svg>
