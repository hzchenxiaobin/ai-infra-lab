<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>

  <rect width="560" height="460" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：前缀和 + 一次遍历求 min-max</text>

  <!-- Step 1: init -->
  <rect x="80" y="48" width="400" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="68" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">初始化</text>
  <text x="280" y="86" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">suffix = Σrow0 ,  prefix = 0 ,  ans = +∞</text>

  <!-- arrow -->
  <path d="M 280 96 L 280 112" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 2: loop header -->
  <rect x="80" y="116" width="400" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="142" text-anchor="middle" font-size="11.5" fill="#d6a040" font-weight="bold" filter="url(#rough2)">for c = 0 … n-1 ：（枚举机器人1 转下列）</text>

  <!-- arrow down -->
  <path d="M 280 158 L 280 174" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 3: suffix -= row0[c] -->
  <rect x="80" y="178" width="400" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="204" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">suffix -= row0[c]   → 右上块和 = Σrow0[c+1 .. n-1]</text>

  <!-- arrow -->
  <path d="M 280 220 L 280 236" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 4: ans = min(ans, max(prefix, suffix)) -->
  <rect x="80" y="240" width="400" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="280" y="260" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans = min( ans, max(prefix, suffix) )</text>
  <text x="280" y="278" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">下机器人取两块较大者，机器人1 取所有 c 中最小</text>

  <!-- arrow -->
  <path d="M 280 288 L 280 304" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Step 5: prefix += row1[c] -->
  <rect x="80" y="308" width="400" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="334" text-anchor="middle" font-size="11.5" fill="#333" filter="url(#rough2)">prefix += row1[c]   → 左下块和 = Σrow1[0 .. c]（供下一轮）</text>

  <!-- loop back arrow -->
  <path d="M 480 328 L 520 328 L 520 136 L 480 136" stroke="#666" stroke-width="1.6" fill="none"
        stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="528" y="232" font-size="9.5" fill="#888" filter="url(#rough2)" transform="rotate(90 528 232)">下一列</text>

  <!-- arrow to return -->
  <path d="M 280 350 L 280 368" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Return -->
  <rect x="120" y="372" width="320" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="398" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">return ans</text>

  <!-- Note -->
  <rect x="40" y="424" width="480" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="443" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">关键顺序：先减 row0[c] 再用 max，最后加 row1[c]（保证两块都不含列 c）</text>
</svg>
