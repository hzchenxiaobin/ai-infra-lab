<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#555"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：O(1) 公式一步到位</text>

  <!-- start -->
  <rect x="200" y="40" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">输入 n, k</text>

  <path d="M 280 74 L 280 92" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- compute t / rest -->
  <rect x="120" y="94" width="320" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="122" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">t = min(n, ⌊k/2⌋)，rest = n − t</text>

  <path d="M 280 140 L 280 158" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- decision diamond -->
  <polygon points="280,160 390,202 280,244 170,202" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="4" filter="url(#rough2)"/>
  <text x="280" y="207" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">rest = 0 ？</text>
  <text x="280" y="260" text-anchor="middle" font-size="10" fill="#999" filter="url(#rough2)">（即 n ≤ ⌊k/2⌋，安全区装得下全部 n 个数）</text>

  <!-- yes branch (left) -->
  <path d="M 170 202 L 120 202 L 120 264" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="138" y="194" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="30" y="268" width="180" height="60" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="120" y="292" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = n(n+1)/2</text>
  <text x="120" y="312" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">= 1 + 2 + … + n</text>

  <!-- no branch (right) -->
  <path d="M 390 202 L 440 202 L 440 264" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="418" y="194" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="330" y="268" width="220" height="60" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="440" y="290" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold" filter="url(#rough2)">ans = t(t+1)/2</text>
  <text x="440" y="310" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">+ rest·k + rest(rest−1)/2</text>

  <!-- merge to return -->
  <path d="M 120 328 L 120 353 L 194 353" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 440 328 L 440 353 L 366 353" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <rect x="200" y="336" width="160" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="358" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <text x="280" y="390" text-anchor="middle" font-size="11" fill="#999" filter="url(#rough2)">两个分支都是等差数列求和：A 区 1+…+t，C 区 k+(k+1)+…</text>
</svg>
