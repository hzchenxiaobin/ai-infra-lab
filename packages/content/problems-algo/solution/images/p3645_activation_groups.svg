<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">按 limit 分组：每组只保留前 min(j, m) 大的值</text>
  <text x="260" y="44" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">示例 value = [4,1,5,2,9,7]，limit = [3,3,2,3,2,2]</text>

  <rect x="25" y="56" width="470" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="40" y="76" font-size="12" fill="#446688" filter="url(#rough2)">limit = 2 的组（m = 3 个值，最多贡献 2 个）</text>

  <rect x="40" y="88" width="46" height="30" fill="#ffffff" stroke="#446688" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="63" y="108" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">9</text>
  <rect x="94" y="88" width="46" height="30" fill="#ffffff" stroke="#446688" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="117" y="108" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">7</text>
  <rect x="148" y="88" width="46" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="171" y="108" text-anchor="middle" font-size="14" fill="#b85450" filter="url(#rough2)">5</text>
  <line x1="152" y1="93" x2="190" y2="113" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="210" y="107" font-size="12" fill="#333" filter="url(#rough2)">留前 min(2, 3) = 2 个 → 9 + 7</text>

  <rect x="25" y="160" width="470" height="92" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="40" y="180" font-size="12" fill="#4a7a3a" filter="url(#rough2)">limit = 3 的组（m = 3 个值，最多贡献 3 个）</text>

  <rect x="40" y="192" width="46" height="30" fill="#ffffff" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="63" y="212" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">4</text>
  <rect x="94" y="192" width="46" height="30" fill="#ffffff" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="117" y="212" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">2</text>
  <rect x="148" y="192" width="46" height="30" fill="#ffffff" stroke="#4a7a3a" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="171" y="212" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">1</text>
  <text x="210" y="211" font-size="12" fill="#333" filter="url(#rough2)">留前 min(3, 3) = 3 个 → 4 + 2 + 1</text>

  <rect x="25" y="264" width="470" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="289" text-anchor="middle" font-size="14" fill="#7a5c10" filter="url(#rough2)">答案 = (9 + 7) + (4 + 2 + 1) = 23</text>

  <text x="260" y="330" text-anchor="middle" font-size="11" fill="#666" filter="url(#rough2)">本质：活跃数一旦到达 j，limit ≤ j 的元素全部永久出局 → 该组至多贡献 j 个，组间互不干扰</text>
</svg>
