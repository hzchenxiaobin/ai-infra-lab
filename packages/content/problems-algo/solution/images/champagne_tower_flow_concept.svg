<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">香槟塔：溢出均分给左右两个下层杯子</text>

  <!-- ===== Row 0: overflowing glass (i, j) ===== -->
  <text x="280" y="50" text-anchor="middle" font-size="11" fill="#b85450">(i, j)</text>
  <ellipse cx="280" cy="78" rx="24" ry="24" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" filter="url(#rough2)"/>
  <text x="280" y="83" text-anchor="middle" font-size="12" fill="#b85450" font-weight="bold">v &gt; 1</text>
  <text x="318" y="74" font-size="10" fill="#b85450">盛 1</text>
  <text x="318" y="88" font-size="10" fill="#b85450">溢 v−1</text>

  <!-- overflow arrows row0 -> row1 -->
  <path d="M 266 98 Q 250 116 232 134" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M 294 98 Q 310 116 328 134" stroke="#b85450" stroke-width="1.6" fill="none" stroke-dasharray="4,2" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="232" y="120" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">(v−1)/2</text>
  <text x="328" y="120" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">(v−1)/2</text>

  <!-- ===== Row 1: two children ===== -->
  <ellipse cx="232" cy="156" rx="22" ry="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="232" y="160" text-anchor="middle" font-size="10" fill="#d6a040">(i+1, j)</text>
  <ellipse cx="328" cy="156" rx="22" ry="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="328" y="160" text-anchor="middle" font-size="10" fill="#d6a040">(i+1, j+1)</text>

  <!-- ===== Row 2: faint future glasses ===== -->
  <ellipse cx="184" cy="232" rx="19" ry="19" fill="#f4f4f4" stroke="#bbb" stroke-width="1.3" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <ellipse cx="280" cy="232" rx="19" ry="19" fill="#f4f4f4" stroke="#bbb" stroke-width="1.3" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <ellipse cx="376" cy="232" rx="19" ry="19" fill="#f4f4f4" stroke="#bbb" stroke-width="1.3" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- ===== Row 3: fainter ===== -->
  <ellipse cx="136" cy="306" rx="16" ry="16" fill="#f4f4f4" stroke="#ccc" stroke-width="1.1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <ellipse cx="232" cy="306" rx="16" ry="16" fill="#f4f4f4" stroke="#ccc" stroke-width="1.1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <ellipse cx="328" cy="306" rx="16" ry="16" fill="#f4f4f4" stroke="#ccc" stroke-width="1.1" stroke-dasharray="3,2" filter="url(#rough2)"/>
  <ellipse cx="424" cy="306" rx="16" ry="16" fill="#f4f4f4" stroke="#ccc" stroke-width="1.1" stroke-dasharray="3,2" filter="url(#rough2)"/>

  <!-- ===== Formula box ===== -->
  <rect x="60" y="340" width="440" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="10" filter="url(#rough2)"/>
  <text x="280" y="361" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold">每杯容量 1：盛 min(1, v)，溢出 max(0, v−1) 均分两半</text>
  <text x="280" y="378" text-anchor="middle" font-size="11" fill="#555">dp[i+1][j] += (v−1)/2 ； dp[i+1][j+1] += (v−1)/2</text>
</svg>
