<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：算 6 条距离 → 排序 → 校验 4 边 + 2 对角线</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">O(1)：4 个点只有 6 条两两距离，与输入规模无关</text>

  <g font-size="10" fill="#333">
    <!-- Step 1: compute 6 squared distances -->
    <rect x="40" y="64" width="440" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="84" font-size="12" fill="#446688" font-weight="bold">① 算 6 条平方距离</text>
    <text x="200" y="84" font-family="monospace" font-size="10" fill="#555">for i &lt; j in 4 点:</text>
    <text x="54" y="102" font-family="monospace" font-size="10" fill="#555">  d2 = (xi-xj)² + (yi-yj)²</text>
    <text x="54" y="116" font-size="9" fill="#888">用平方距离避免 sqrt 浮点误差；共 6 条</text>

    <path d="M 260 122 L 260 136" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 2: sort -->
    <rect x="40" y="140" width="440" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="160" font-size="12" fill="#4a7a3a" font-weight="bold">② 排序</text>
    <text x="130" y="160" font-family="monospace" font-size="10" fill="#555">sort(d2)  →  [d0,d1,d2,d3,d4,d5]</text>
    <text x="54" y="176" font-size="9" fill="#888">排序后正方形理想形态：[s,s,s,s,d,d]</text>

    <path d="M 260 186 L 260 200" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 3: checks -->
    <rect x="40" y="204" width="440" height="120" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="224" font-size="12" fill="#d6a040" font-weight="bold">③ 三道校验（全过才返回 true）</text>
    <text x="54" y="244" font-family="monospace" font-size="10" fill="#b85450">a) d0 &gt; 0          // 非退化：无两点重合</text>
    <text x="54" y="260" font-size="9" fill="#888">距离为 0 ⇒ 两点重合，必不是正方形</text>
    <text x="54" y="280" font-family="monospace" font-size="10" fill="#446688">b) d0==d1==d2==d3 &amp;&amp; d4==d5   // 4 边等 + 2 对角线等</text>
    <text x="54" y="296" font-size="9" fill="#888">6 条距离恰好分成「4 + 2」两组</text>
    <text x="54" y="316" font-family="monospace" font-size="10" fill="#4a7a3a">c) d4 == 2 * d0     // 勾股定理：对角线² = 2·边²</text>

    <path d="M 260 326 L 260 340" stroke="#666" stroke-width="1.2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

    <!-- Step 4: return -->
    <rect x="40" y="344" width="440" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
    <text x="54" y="364" font-size="12" fill="#b85450" font-weight="bold">④ 返回</text>
    <text x="120" y="364" font-family="monospace" font-size="10" fill="#555">return (a &amp;&amp; b &amp;&amp; c)</text>
    <text x="54" y="378" font-size="9" fill="#888">三道校验同时成立 ⇔ 4 边等 + 直角 ⇒ 正方形</text>

    <!-- Complexity bar -->
    <rect x="40" y="392" width="440" height="36" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
    <text x="260" y="410" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">时间 O(1) · 空间 O(1) · 仅 6 条距离，常数级</text>
    <text x="260" y="424" text-anchor="middle" font-size="9" fill="#888">无需判断点的相邻关系，绕开了「点的输入顺序」问题</text>
  </g>
</svg>
