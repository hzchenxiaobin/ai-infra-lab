<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688" filter="url(#rough2)"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold" filter="url(#rough2)">核心观察：答案 = 最大数位 × 次大数位</text>

  <!-- 第一行：n = 2583 -->
  <text x="52" y="93" font-size="13.5" font-weight="bold" fill="#446688" filter="url(#rough2)">n = 2583</text>

  <rect x="130" y="64" width="58" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="159" y="95" text-anchor="middle" font-size="16" font-weight="bold" fill="#446688" filter="url(#rough2)">2</text>

  <rect x="194" y="64" width="58" height="48" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="223" y="95" text-anchor="middle" font-size="16" font-weight="bold" fill="#2a5a2a" filter="url(#rough2)">5</text>

  <rect x="258" y="64" width="58" height="48" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="287" y="95" text-anchor="middle" font-size="16" font-weight="bold" fill="#b85450" filter="url(#rough2)">8</text>

  <rect x="322" y="64" width="58" height="48" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="351" y="95" text-anchor="middle" font-size="16" font-weight="bold" fill="#446688" filter="url(#rough2)">3</text>

  <text x="223" y="128" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#4a7a3a" filter="url(#rough2)">次大 b = 5</text>
  <text x="287" y="128" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b85450" filter="url(#rough2)">最大 a = 8</text>

  <path d="M 384 88 L 396 88" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="400" y="70" width="108" height="36" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="454" y="93" text-anchor="middle" font-size="14" font-weight="bold" fill="#446688" filter="url(#rough2)">8 × 5 = 40</text>

  <text x="260" y="152" text-anchor="middle" font-size="10.5" fill="#888" filter="url(#rough2)">其余数位无论怎么配对，乘积都压不过这一对</text>

  <!-- 第二行：n = 22 -->
  <text x="52" y="213" font-size="13.5" font-weight="bold" fill="#446688" filter="url(#rough2)">n = 22</text>

  <rect x="130" y="184" width="58" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="159" y="215" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">2</text>

  <rect x="194" y="184" width="58" height="48" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.5" filter="url(#rough2)"/>
  <text x="223" y="215" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">2</text>

  <text x="159" y="248" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">a = 2</text>
  <text x="223" y="248" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">b = 2（同值！）</text>

  <path d="M 256 208 L 394 208" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="398" y="190" width="108" height="36" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="452" y="213" text-anchor="middle" font-size="14" font-weight="bold" fill="#8a6d3a" filter="url(#rough2)">2 × 2 = 4</text>

  <text x="260" y="272" text-anchor="middle" font-size="10.5" fill="#8a6d3a" filter="url(#rough2)">同一数位出现两次 ⇒ 按两个位置各取一次，次大可与最大同值</text>

  <!-- 证明框 -->
  <rect x="48" y="286" width="424" height="64" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="260" y="306" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#446688" filter="url(#rough2)">为什么其余数对赢不了？</text>
  <text x="260" y="324" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">任取数对 (x, y)，不妨 x ≥ y：恒有 x ≤ a；且 y ≤ b（b 按位置计的次大）</text>
  <text x="260" y="341" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">数位全非负 ⇒ x · y ≤ a · b，且上界恰被 (a, b) 这对取到</text>
</svg>
