<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold">状态转移：g(i) = g(i-1) + g(i-2)</text>
  <text x="260" y="44" text-anchor="middle" font-size="11" fill="#888">看第 i 个地块：不放 → 看 i-1；放 → i-1 必不放 → 看 i-2</text>

  <!-- ===== Case A: plot i empty ===== -->
  <text x="40" y="82" font-size="11" fill="#446688" font-weight="bold">情形 A：第 i 个地块不放房</text>
  <g font-size="9" fill="#333">
    <rect x="90" y="92" width="40" height="32" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="110" y="112" text-anchor="middle" font-size="8" fill="#888">…</text>
    <rect x="132" y="92" width="40" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="3" filter="url(#rough2)"/>
    <text x="152" y="112" text-anchor="middle" font-size="8" fill="#446688">i-1</text>
    <rect x="174" y="92" width="40" height="32" fill="#fff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
    <text x="194" y="112" text-anchor="middle" font-size="8" fill="#888">i 空</text>
  </g>
  <path d="M 214 108 L 250 108" stroke="#446688" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="250" y="94" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="290" y="112" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">g(i-1) 种</text>
  <text x="350" y="112" font-size="9" fill="#888">i 空了，i-1 怎么放都行</text>

  <!-- ===== Case B: plot i has house ===== -->
  <text x="40" y="160" font-size="11" fill="#4a7a3a" font-weight="bold">情形 B：第 i 个地块放房</text>
  <g font-size="9" fill="#333">
    <rect x="90" y="170" width="40" height="32" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="3" filter="url(#rough2)"/>
    <text x="110" y="190" text-anchor="middle" font-size="8" fill="#888">…</text>
    <rect x="132" y="170" width="40" height="32" fill="#fff" stroke="#bbb" stroke-width="1.2" stroke-dasharray="3,2" rx="3" filter="url(#rough2)"/>
    <text x="152" y="190" text-anchor="middle" font-size="8" fill="#888">i-1 空</text>
    <rect x="174" y="170" width="40" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="3" filter="url(#rough2)"/>
    <text x="194" y="190" text-anchor="middle" font-size="8" fill="#4a7a3a" font-weight="bold">i 🏠</text>
  </g>
  <path d="M 214 186 L 250 186" stroke="#4a7a3a" stroke-width="1.3" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="250" y="172" width="80" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="5" filter="url(#rough2)"/>
  <text x="290" y="190" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">g(i-2) 种</text>
  <text x="350" y="190" font-size="9" fill="#888">i 放了→i-1 必空→看 i-2</text>

  <!-- ===== merge ===== -->
  <path d="M 290 122 Q 320 150 290 172" stroke="#888" stroke-width="1.1" fill="none" stroke-dasharray="3,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <circle cx="320" cy="148" r="14" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="320" y="154" text-anchor="middle" font-size="16" fill="#b85450" font-weight="bold">+</text>

  <!-- ===== Formula ===== -->
  <rect x="60" y="232" width="400" height="44" fill="#f6f6f6" stroke="#ccc" stroke-width="1" rx="6" filter="url(#rough2)"/>
  <text x="260" y="254" text-anchor="middle" font-family="monospace" font-size="14" fill="#333" font-weight="bold">g(i) = g(i-1) + g(i-2)</text>
  <text x="260" y="270" text-anchor="middle" font-size="9" fill="#888">情形 A 与 B 互斥且覆盖全部情况 → 加法原理</text>

  <!-- ===== base + fib ===== -->
  <rect x="60" y="292" width="400" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="314" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">初值：g(0) = 1（一侧 0 个地块，1 种「不放」）</text>
  <text x="260" y="332" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">g(1) = 2（一侧 1 个地块：不放 / 放）</text>
  <text x="260" y="352" text-anchor="middle" font-size="10" fill="#888">即 g(n) = Fib(n+2)，g(2)=3, g(3)=5, g(4)=8 …</text>
</svg>
