<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">排列的函数图：i → nums[i] = 若干不相交的环</text>

  <!-- ===== Array row ===== -->
  <text x="36" y="60" font-size="10" fill="#888">下标</text>
  <text x="36" y="84" font-size="11" fill="#888" font-weight="bold">nums</text>

  <text x="92" y="56" text-anchor="middle" font-size="9" fill="#bbb">0</text>
  <text x="136" y="56" text-anchor="middle" font-size="9" fill="#bbb">1</text>
  <text x="180" y="56" text-anchor="middle" font-size="9" fill="#bbb">2</text>
  <text x="224" y="56" text-anchor="middle" font-size="9" fill="#bbb">3</text>
  <text x="268" y="56" text-anchor="middle" font-size="9" fill="#bbb">4</text>
  <text x="312" y="56" text-anchor="middle" font-size="9" fill="#bbb">5</text>
  <text x="356" y="56" text-anchor="middle" font-size="9" fill="#bbb">6</text>

  <rect x="72" y="62" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="92" y="82" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">5</text>
  <rect x="116" y="62" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="136" y="82" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">4</text>
  <rect x="160" y="62" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="180" y="82" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">0</text>
  <rect x="204" y="62" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="224" y="82" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">3</text>
  <rect x="248" y="62" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="268" y="82" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">1</text>
  <rect x="292" y="62" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="312" y="82" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">6</text>
  <rect x="336" y="62" width="40" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="356" y="82" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">2</text>

  <!-- arrow down + label -->
  <path d="M 214 96 L 214 110" stroke="#888" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="300" y="106" text-anchor="middle" font-size="10.5" fill="#888">把每个 i → nums[i] 画成有向边</text>

  <!-- ===== Cycle 1: {0,5,6,2} length 4 (highlighted green) ===== -->
  <g font-size="12">
    <!-- nodes on a ring, center (130,185), r=38, node r=15 -->
    <circle cx="130" cy="147" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="130" y="151" text-anchor="middle" fill="#4a7a3a" font-weight="bold">0</text>
    <circle cx="168" cy="185" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="168" y="189" text-anchor="middle" fill="#4a7a3a" font-weight="bold">5</text>
    <circle cx="130" cy="223" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="130" y="227" text-anchor="middle" fill="#4a7a3a" font-weight="bold">6</text>
    <circle cx="92" cy="185" r="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.2" filter="url(#rough2)"/>
    <text x="92" y="189" text-anchor="middle" fill="#4a7a3a" font-weight="bold">2</text>

    <!-- clockwise arrows bowing outward -->
    <path d="M 141 158 Q 168 158 162 172" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
    <path d="M 162 198 Q 168 222 143 220" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
    <path d="M 119 220 Q 92 222 98 198" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
    <path d="M 98 172 Q 92 158 119 158" stroke="#4a7a3a" stroke-width="1.6" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

    <text x="130" y="258" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">环长 4 ✓ 最长</text>
  </g>

  <!-- ===== Cycle 2: {1,4} length 2 ===== -->
  <g font-size="12">
    <circle cx="320" cy="167" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="320" y="171" text-anchor="middle" fill="#446688" font-weight="bold">1</text>
    <circle cx="320" cy="205" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="320" y="209" text-anchor="middle" fill="#446688" font-weight="bold">4</text>

    <!-- 1 -> 4 (right side curve) and 4 -> 1 (left side curve) -->
    <path d="M 333 174 Q 352 186 333 198" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
    <path d="M 307 198 Q 288 186 307 174" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

    <text x="320" y="238" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">环长 2</text>
    <text x="320" y="252" text-anchor="middle" font-size="9" fill="#888">1 → 4 → 1</text>
  </g>

  <!-- ===== Cycle 3: {3} length 1 (self-loop) ===== -->
  <g font-size="12">
    <circle cx="470" cy="185" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
    <text x="470" y="189" text-anchor="middle" fill="#446688" font-weight="bold">3</text>

    <!-- self-loop on the right -->
    <path d="M 484 178 Q 506 168 502 192 Q 499 208 482 196" stroke="#446688" stroke-width="1.5" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

    <text x="470" y="238" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">环长 1</text>
    <text x="470" y="252" text-anchor="middle" font-size="9" fill="#888">3 → 3（自环）</text>
  </g>

  <!-- ===== Core idea box ===== -->
  <rect x="40" y="278" width="480" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="300" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">排列 ⇒ 每个节点出度 = 入度 = 1 ⇒ 函数图 = 不相交环的并集</text>
  <text x="280" y="318" text-anchor="middle" font-size="11" fill="#666">从环上任一点出发都会遍历完整个环并回到起点</text>
  <text x="280" y="336" text-anchor="middle" font-size="11" fill="#666">⇒ 同一环上所有起点的 s[k] 长度相同 = 环长</text>
  <text x="280" y="354" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">只需对每个环遍历一次，标记已访问 ⇒ O(n)</text>
</svg>
