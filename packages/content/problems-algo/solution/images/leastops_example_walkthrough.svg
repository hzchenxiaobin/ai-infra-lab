<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#888" filter="url(#rough2)"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#4a7a3a" filter="url(#rough2)"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：x = 3, target = 19</text>

  <!-- ===== Base-3 conversion ===== -->
  <rect x="80" y="32" width="400" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="52" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">19 = 1·3⁰ + 0·3¹ + 2·3² → 位数 d = [1, 0, 2]，m = 3</text>

  <!-- ===== DP Table ===== -->
  <text x="280" y="80" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">DP 表（从高位 i=m 往低位 i=0 填）</text>

  <!-- Header -->
  <rect x="80" y="88" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="104" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">i</text>
  <rect x="130" y="88" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="155" y="104" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">w(i)</text>
  <rect x="180" y="88" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="205" y="104" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">d[i]</text>
  <rect x="230" y="88" width="90" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="275" y="104" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">dp[i][0]</text>
  <rect x="320" y="88" width="90" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="365" y="104" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">dp[i][1]</text>
  <rect x="410" y="88" width="70" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="445" y="104" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">最优选择</text>

  <!-- Row i=3 (base case) -->
  <rect x="80" y="114" width="50" height="24" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="130" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <rect x="130" y="114" width="50" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="155" y="130" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="180" y="114" width="50" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="205" y="130" text-anchor="middle" font-size="11" fill="#bbb">—</text>
  <rect x="230" y="114" width="90" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="275" y="130" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <rect x="320" y="114" width="90" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="365" y="130" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="410" y="114" width="70" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="445" y="130" text-anchor="middle" font-size="9" fill="#888">边界</text>

  <!-- Row i=2 -->
  <rect x="80" y="140" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="156" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <rect x="130" y="140" width="50" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="155" y="156" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="180" y="140" width="50" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="205" y="156" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="230" y="140" width="90" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="275" y="156" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="320" y="140" width="90" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="365" y="156" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">3</text>
  <rect x="410" y="140" width="70" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="445" y="156" text-anchor="middle" font-size="9" fill="#4a7a3a">A / B</text>

  <!-- Row i=1 -->
  <rect x="80" y="166" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="182" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="130" y="166" width="50" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="155" y="182" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="180" y="166" width="50" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="205" y="182" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="230" y="166" width="90" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="275" y="182" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">4</text>
  <rect x="320" y="166" width="90" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="365" y="182" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">5</text>
  <rect x="410" y="166" width="70" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="445" y="182" text-anchor="middle" font-size="9" fill="#4a7a3a">A</text>

  <!-- Row i=0 (answer) -->
  <rect x="80" y="192" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="105" y="208" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">0</text>
  <rect x="130" y="192" width="50" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="155" y="208" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="180" y="192" width="50" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="205" y="208" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="230" y="192" width="90" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="4" filter="url(#rough2)"/>
  <text x="275" y="208" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">6</text>
  <rect x="320" y="192" width="90" height="24" fill="#f0f0f0" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="365" y="208" text-anchor="middle" font-size="11" fill="#bbb">—</text>
  <rect x="410" y="192" width="70" height="24" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="445" y="208" text-anchor="middle" font-size="9" fill="#4a7a3a">A</text>

  <!-- Backward fill arrow -->
  <path d="M 445 218 L 445 114" stroke="#4a7a3a" stroke-width="1.5" fill="none" marker-end="url(#arrG)" filter="url(#rough2)" stroke-dasharray="3,2"/>

  <!-- ===== Key computations ===== -->
  <text x="280" y="236" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold">关键计算（w(0)=2, w(1)=1, w(2)=2, w(3)=3）</text>

  <!-- Computation 1: dp[2][0] and dp[2][1] -->
  <rect x="30" y="244" width="160" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="40" y="260" font-size="9" fill="#4a7a3a" font-weight="bold">i=2, d=2:</text>
  <text x="40" y="274" font-size="9" fill="#333">A: 2·2+0 = 4 ✓</text>
  <text x="40" y="286" font-size="9" fill="#333">B: 1·2+3 = 5</text>
  <text x="40" y="300" font-size="9" fill="#4a7a3a" font-weight="bold">→ dp[2][0]=4</text>

  <!-- Computation 2: dp[2][1] -->
  <rect x="200" y="244" width="160" height="64" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="210" y="260" font-size="9" fill="#d6a040" font-weight="bold">i=2, carry: e=3</text>
  <text x="210" y="274" font-size="9" fill="#333">A: 3·2+0 = 6</text>
  <text x="210" y="286" font-size="9" fill="#333">B: 0·2+3 = 3 ✓</text>
  <text x="210" y="300" font-size="9" fill="#d6a040" font-weight="bold">→ dp[2][1]=3</text>

  <!-- Computation 3: dp[0][0] -->
  <rect x="370" y="244" width="160" height="64" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="380" y="260" font-size="9" fill="#4a7a3a" font-weight="bold">i=0, d=1:</text>
  <text x="380" y="274" font-size="9" fill="#333">A: 1·2+4 = 6 ✓</text>
  <text x="380" y="286" font-size="9" fill="#333">B: 2·2+5 = 9</text>
  <text x="380" y="300" font-size="9" fill="#4a7a3a" font-weight="bold">→ dp[0][0]=6</text>

  <!-- ===== Answer ===== -->
  <rect x="80" y="322" width="400" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.5" rx="10" filter="url(#rough2)"/>
  <text x="280" y="344" text-anchor="middle" font-size="13" fill="#4a7a3a" font-weight="bold">答案 = dp[0][0] − 1 = 6 − 1 = 5 ✓</text>

  <!-- Expression -->
  <rect x="80" y="362" width="400" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="381" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">表达式：3*3 + 3*3 + 3/3 = 9+9+1 = 19</text>
</svg>
