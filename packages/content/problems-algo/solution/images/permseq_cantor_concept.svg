<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#888"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">康托尔展开：全排列按首位分组，每组 (n−1)! 个</text>
  <text x="300" y="44" text-anchor="middle" font-size="11" fill="#888">以 n=3 为例，3! = 6 个排列按字典序分成 3 组，每组 2! = 2 个</text>

  <!-- ============ Left: permutation list grouped ============ -->
  <text x="40" y="78" font-size="11" fill="#666" font-weight="bold">字典序全排列（n=3）</text>

  <!-- Block 0: first=1 (blue) -->
  <rect x="40" y="86" width="180" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="50" y="102" font-size="10" fill="#446688" font-weight="bold">index=0</text>
  <text x="50" y="120" font-size="10" fill="#666">首位=1 · 序号 1-2</text>
  <text x="130" y="106" font-size="13" fill="#333" font-weight="bold">1 2 3</text>
  <text x="130" y="124" font-size="13" fill="#333" font-weight="bold">1 3 2</text>

  <!-- Block 1: first=2 (GREEN - highlighted, k=3 falls here) -->
  <rect x="40" y="136" width="180" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="6" filter="url(#rough2)"/>
  <text x="50" y="152" font-size="10" fill="#4a7a3a" font-weight="bold">index=1</text>
  <text x="50" y="170" font-size="10" fill="#4a7a3a">首位=2 · 序号 3-4</text>
  <text x="130" y="156" font-size="13" fill="#333" font-weight="bold">2 1 3</text>
  <text x="130" y="174" font-size="13" fill="#333" font-weight="bold">2 3 1</text>
  <!-- k=3 marker -->
  <text x="195" y="156" font-size="10" fill="#b85450" font-weight="bold">← k=3</text>

  <!-- Block 2: first=3 (orange) -->
  <rect x="40" y="186" width="180" height="44" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="50" y="202" font-size="10" fill="#d6a040" font-weight="bold">index=2</text>
  <text x="50" y="220" font-size="10" fill="#666">首位=3 · 序号 5-6</text>
  <text x="130" y="206" font-size="13" fill="#333" font-weight="bold">3 1 2</text>
  <text x="130" y="224" font-size="13" fill="#333" font-weight="bold">3 2 1</text>

  <!-- ============ Right: formula ============ -->
  <rect x="260" y="86" width="300" height="144" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="410" y="110" text-anchor="middle" font-size="12" fill="#444" font-weight="bold">定位首位（k=3, n=3）</text>

  <text x="276" y="134" font-size="11" fill="#555">每组大小 = (n−1)! = 2! = 2</text>
  <text x="276" y="156" font-size="11" fill="#555">index = (k−1) // (n−1)!</text>
  <text x="296" y="174" font-size="12" fill="#b85450" font-weight="bold">= (3−1) // 2 = 2 // 2 = 1</text>

  <text x="276" y="196" font-size="11" fill="#555">→ 选 candidates[1] = 2</text>
  <text x="276" y="214" font-size="11" fill="#555">→ k ← k − index·(n−1)! = 3 − 2 = 1</text>
  <text x="276" y="226" font-size="10" fill="#888">子问题：在 [1,3] 中求第 1 个</text>

  <!-- arrow from highlighted block to formula -->
  <path d="M 222 158 L 258 158" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- ============ Bottom: core idea ============ -->
  <rect x="40" y="250" width="520" height="130" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="300" y="276" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">核心直觉：不必生成前 k−1 个排列，逐位"除法取整"即可</text>
  <text x="300" y="300" text-anchor="middle" font-size="11" fill="#666">每一位的选取把剩余排列均分成 (n−1−i)! 大小的段</text>
  <text x="300" y="320" text-anchor="middle" font-size="11" fill="#666">index = (k−1) // fact  →  从剩余候选中取第 index 个</text>
  <text x="300" y="340" text-anchor="middle" font-size="11" fill="#666">k ← k − index · fact  →  在子段内继续求第 k 个</text>
  <text x="300" y="362" text-anchor="middle" font-size="10" fill="#888">即把 (k−1) 作阶乘进制分解，每一位系数决定该位选谁</text>

  <!-- serial number axis on far left -->
  <text x="22" y="110" font-size="9" fill="#aaa">1</text>
  <text x="22" y="160" font-size="9" fill="#aaa">3</text>
  <text x="22" y="210" font-size="9" fill="#aaa">5</text>
  <text x="28" y="134" font-size="9" fill="#aaa">2</text>
  <text x="28" y="184" font-size="9" fill="#aaa">4</text>
  <text x="28" y="234" font-size="9" fill="#aaa">6</text>
</svg>
