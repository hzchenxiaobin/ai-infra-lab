<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="260" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold">算法流程：枚举 k → 反转 → 比较命中</text>

  <!-- Start: k = 0 -->
  <ellipse cx="260" cy="50" rx="50" ry="16" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="54" text-anchor="middle" font-size="11" fill="#333">k = 0</text>

  <!-- Arrow down -->
  <path d="M 260 66 L 260 80" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond 1: k ≤ num ? -->
  <polygon points="260,82 340,118 260,154 180,118" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="114" text-anchor="middle" font-size="11" fill="#333">k ≤ num ?</text>

  <!-- No -> return false -->
  <path d="M 340 118 L 404 118" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="362" y="112" font-size="10" fill="#888">否</text>
  <rect x="404" y="100" width="96" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="452" y="123" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">return false</text>

  <!-- Yes -> down -->
  <path d="M 260 154 L 260 168" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="270" y="166" font-size="10" fill="#888">是</text>

  <!-- Process: reverse digits -->
  <rect x="120" y="170" width="280" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="189" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">反转数位 reverse(k)</text>
  <text x="260" y="207" text-anchor="middle" font-size="10" fill="#555">rev = 0; while t: rev = rev×10 + t%10; t //= 10</text>

  <!-- Arrow down -->
  <path d="M 260 214 L 260 226" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Diamond 2: k + rev(k) == num ? -->
  <polygon points="260,228 340,264 260,300 180,264" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="259" text-anchor="middle" font-size="11" fill="#333">k + rev(k)</text>
  <text x="260" y="273" text-anchor="middle" font-size="11" fill="#333">== num ?</text>

  <!-- Yes -> return true -->
  <path d="M 340 264 L 404 264" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="362" y="258" font-size="10" fill="#4a7a3a">是</text>
  <rect x="404" y="246" width="96" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="452" y="269" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">return true</text>

  <!-- No -> loop back (k++) -->
  <path d="M 180 264 L 96 264 L 96 118 L 180 118" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4,3"/>
  <text x="70" y="194" font-size="10" fill="#888">否</text>
  <text x="70" y="210" font-size="10" fill="#888">k++</text>

  <!-- Note -->
  <rect x="100" y="316" width="320" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="260" y="336" text-anchor="middle" font-size="10.5" fill="#555">命中即返回 true；枚举完 [0, num] 仍无命中返回 false</text>
</svg>
