<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="400" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">合法代码片段的结构：闭合标签包裹一切</text>

  <!-- ===== Top level structure: <TAG_NAME>TAG_CONTENT</TAG_NAME> ===== -->
  <rect x="30" y="56" width="80" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="70" y="78" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">&lt;DIV&gt;</text>

  <rect x="120" y="56" width="320" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="280" y="78" text-anchor="middle" font-size="11.5" fill="#7a5415">TAG_CONTENT（可含子标签 / cdata / 普通字符）</text>

  <rect x="450" y="56" width="86" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="493" y="78" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">&lt;/DIV&gt;</text>

  <!-- brace lines -->
  <path d="M 70 92 L 70 104" stroke="#666" stroke-width="1.2" fill="none" filter="url(#rough2)"/>
  <path d="M 493 92 L 493 104" stroke="#666" stroke-width="1.2" fill="none" filter="url(#rough2)"/>

  <!-- ===== TAG_NAME rules ===== -->
  <rect x="30" y="108" width="240" height="72" fill="#e8f0fe" stroke="#446688" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="42" y="128" font-size="11.5" fill="#446688" font-weight="bold">TAG_NAME 规则</text>
  <text x="42" y="146" font-size="10.5" fill="#555">· 仅大写字母 A-Z</text>
  <text x="42" y="161" font-size="10.5" fill="#555">· 长度 1～9</text>
  <text x="42" y="175" font-size="10" fill="#999">例：DIV ✓   div ✗   ABCDEFGHI ✓</text>

  <!-- ===== CDATA rules ===== -->
  <rect x="290" y="108" width="246" height="72" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="8" filter="url(#rough2)"/>
  <text x="302" y="128" font-size="11.5" fill="#4a7a3a" font-weight="bold">CDATA 格式</text>
  <text x="302" y="146" font-size="10.5" fill="#555">· &lt;![CDATA[ ... ]]&gt;</text>
  <text x="302" y="161" font-size="10.5" fill="#555">· 内容 = 到首个 ]]&gt; 为止</text>
  <text x="302" y="175" font-size="10" fill="#999">CDATA 内字符不被解析</text>

  <!-- ===== Nesting example ===== -->
  <path d="M 30 196 L 530 196" stroke="#ddd" stroke-width="1.5" stroke-dasharray="6,4" filter="url(#rough2)"/>

  <text x="280" y="216" text-anchor="middle" font-size="12" fill="#555" font-weight="bold">嵌套示例：栈结构保证匹配</text>

  <!-- Nesting boxes -->
  <rect x="40" y="232" width="480" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="55" y="251" font-size="10.5" fill="#446688">&lt;A&gt;</text>

  <rect x="72" y="266" width="448" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="85" y="285" font-size="10.5" fill="#7a5415">&lt;B&gt;</text>

  <rect x="104" y="300" width="416" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="118" y="319" font-size="10.5" fill="#4a7a3a">内容 + &lt;![CDATA[ ... ]]&gt;</text>

  <rect x="72" y="334" width="448" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="4" filter="url(#rough2)"/>
  <text x="480" y="351" font-size="10.5" fill="#7a5415">&lt;/B&gt;</text>

  <rect x="40" y="362" width="480" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="4" filter="url(#rough2)"/>
  <text x="490" y="379" font-size="10.5" fill="#446688">&lt;/A&gt;</text>

  <text x="280" y="396" text-anchor="middle" font-size="10" fill="#999">栈：push A → push B → pop B → pop A（空栈 = 全部闭合）</text>
</svg>
