<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 530"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="530" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：倍增 → 初始 diff₀ → 滑窗更新 → 取 min</text>

  <!-- Start -->
  <ellipse cx="300" cy="56" rx="42" ry="18" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="61" text-anchor="middle" font-size="12" fill="#333" font-weight="bold" filter="url(#rough2)">开始</text>

  <path d="M 300 74 L 300 90" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- t = s + s -->
  <rect x="200" y="94" width="200" height="34" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="300" y="116" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">t = s + s（倍增，长度 2n）</text>

  <path d="M 300 128 L 300 144" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Compute initial diff0 -->
  <rect x="150" y="148" width="300" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="300" y="168" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">计算初始 diff₀</text>
  <text x="300" y="184" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">遍历 t[0..n−1]，统计 ≠ P₀ 的位数（偶位→0，奇位→1）</text>

  <path d="M 300 194 L 300 210" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ans = min(diff0, n - diff0) -->
  <rect x="175" y="214" width="250" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="300" y="236" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = min(diff₀, n − diff₀)</text>

  <path d="M 300 248 L 300 264" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- i = 1 -->
  <rect x="255" y="268" width="90" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="287" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">i = 1</text>

  <path d="M 300 296 L 300 312" stroke="#666" stroke-width="1.8" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: i < n? -->
  <polygon points="300,316 420,354 300,392 180,354" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="352" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold" filter="url(#rough2)">i &lt; n ?</text>
  <text x="300" y="368" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">还有窗口可滑</text>

  <!-- No branch → right → Return -->
  <text x="432" y="350" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 420 354 L 490 354" stroke="#b85450" stroke-width="1.8" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <ellipse cx="510" cy="354" rx="58" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="510" y="359" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回 ans</text>

  <!-- Yes branch → down -->
  <text x="312" y="404" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 300 392 L 300 410" stroke="#4a7a3a" stroke-width="1.8" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>

  <!-- Slide window + update -->
  <rect x="120" y="414" width="360" height="56" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="300" y="434" text-anchor="middle" font-size="10.5" fill="#333" font-weight="bold" filter="url(#rough2)">滑窗更新：t[i−1]≠P₀[i−1] 则 diff₀−−，t[i+n−1]≠P₀[i+n−1] 则 diff₀++</text>
  <text x="300" y="452" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">ans = min(ans, diff₀, n − diff₀)； i++</text>

  <!-- Loop back arrow: from bottom of slide box, left, up to decision left side -->
  <path d="M 120 442 L 80 442 L 80 354 L 180 354" stroke="#4a7a3a" stroke-width="1.8" fill="none"
        stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="68" y="400" text-anchor="middle" font-size="9" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)" transform="rotate(-90 68 400)">循环 n−1 次</text>
</svg>
