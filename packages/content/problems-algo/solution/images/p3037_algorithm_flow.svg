<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 430"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#446688"/>
    </marker>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#b85450"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#999"/>
    </marker>
  </defs>

  <rect width="520" height="430" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13.5" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：离线求 fail + 在线主循环（交互边界只有一个 next()）</text>

  <!-- stream side -->
  <rect x="24" y="40" width="84" height="380" fill="#ffffff" stroke="#446688" stroke-width="1.4" rx="10" stroke-dasharray="7 4" filter="url(#rough2)"/>
  <text x="66" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">流侧</text>
  <rect x="32" y="72" width="68" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="66" y="90" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">Infinite</text>
  <text x="66" y="104" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">Stream</text>
  <text x="66" y="134" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">只向前</text>
  <text x="66" y="148" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">不回头</text>
  <text x="66" y="410" text-anchor="middle" font-size="9" fill="#999" filter="url(#rough2)">（交互边界）</text>

  <!-- phase 1 -->
  <rect x="130" y="40" width="366" height="32" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="313" y="60" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">阶段一 · 离线（与流无关）：对 pattern 自匹配求 fail[]，O(m)</text>
  <path d="M 313 72 L 313 82" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- phase 2 -->
  <rect x="130" y="84" width="366" height="336" fill="#ffffff" stroke="#999" stroke-width="1.2" rx="10" stroke-dasharray="7 4" filter="url(#rough2)"/>
  <text x="313" y="102" text-anchor="middle" font-size="10.5" fill="#888" font-weight="bold" filter="url(#rough2)">阶段二 · 在线主循环（i = 0, 1, 2, …）</text>

  <!-- next() call -->
  <rect x="160" y="110" width="190" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="2.2" rx="8" filter="url(#rough2)"/>
  <text x="255" y="130" text-anchor="middle" font-size="11.5" fill="#446688" font-weight="bold" filter="url(#rough2)">c ← stream.next()，i ← i + 1</text>
  <path d="M 108 125 L 156 125" stroke="#446688" stroke-width="1.8" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <path d="M 255 140 L 255 150" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 1 -->
  <polygon points="255,152 350,178 255,204 160,178" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="255" y="182" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">j &gt; 0 且 c ≠ pattern[j]？</text>
  <text x="356" y="172" font-size="10.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 350 178 L 366 178" stroke="#b85450" stroke-width="1.6" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <rect x="370" y="164" width="112" height="28" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="426" y="183" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">j ← fail[j−1]</text>
  <path d="M 426 164 C 426 140, 330 136, 284 152" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="446" y="140" font-size="9" fill="#b85450" filter="url(#rough2)">不调 next()</text>
  <text x="446" y="151" font-size="9" fill="#b85450" filter="url(#rough2)">同一个 c 反复比</text>
  <text x="262" y="218" font-size="10.5" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 255 204 L 255 218" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 2 -->
  <polygon points="255,220 350,246 255,272 160,246" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="255" y="250" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">c == pattern[j]？</text>
  <text x="356" y="240" font-size="10.5" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 350 246 L 366 246" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <rect x="370" y="232" width="112" height="28" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="426" y="251" text-anchor="middle" font-size="11.5" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">j ← j + 1</text>
  <path d="M 426 260 C 426 300, 380 316, 348 316" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="262" y="286" font-size="10.5" fill="#999" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 255 272 L 255 290" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- diamond 3 -->
  <polygon points="255,292 340,318 255,344 170,318" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="255" y="322" text-anchor="middle" font-size="10.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">j == m ？</text>
  <text x="262" y="358" font-size="10.5" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">是</text>
  <path d="M 255 344 L 255 358" stroke="#446688" stroke-width="1.6" fill="none" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <!-- return -->
  <rect x="185" y="360" width="140" height="32" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2.4" rx="8" filter="url(#rough2)"/>
  <text x="255" y="381" text-anchor="middle" font-size="12.5" fill="#3d6b30" font-weight="bold" filter="url(#rough2)">返回 i − m + 1</text>

  <!-- loop back -->
  <text x="176" y="342" font-size="10.5" fill="#999" font-weight="bold" filter="url(#rough2)">否</text>
  <path d="M 170 318 C 138 318, 138 125, 156 125" stroke="#999" stroke-width="1.4" fill="none" stroke-dasharray="6 4" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="146" y="216" font-size="9" fill="#999" filter="url(#rough2)">继续读流</text>

  <!-- amortized note -->
  <rect x="340" y="362" width="146" height="40" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="413" y="378" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">摊还 O(1)/比特</text>
  <text x="413" y="393" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">总回退 ≤ 总前进 ≤ n</text>
</svg>
