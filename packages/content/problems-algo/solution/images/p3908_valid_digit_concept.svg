<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <text x="280" y="22" text-anchor="middle" font-size="14" fill="#444" font-weight="bold" filter="url(#rough2)">核心观察：两条件独立合取——「包含 x」∧「不以 x 开头」（一票否决）</text>

  <!-- 面板一：101 / 0 → true -->
  <g filter="url(#rough2)">
    <rect x="20" y="38" width="164" height="172" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="102" y="58" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold">n = 101，x = 0</text>

    <rect x="43" y="70" width="34" height="32" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="60" y="91" text-anchor="middle" font-size="13" fill="#333">1</text>
    <rect x="85" y="70" width="34" height="32" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2"/>
    <text x="102" y="91" text-anchor="middle" font-size="13" fill="#8a6d1a" font-weight="bold">0</text>
    <rect x="127" y="70" width="34" height="32" rx="4" fill="#fff" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="144" y="91" text-anchor="middle" font-size="13" fill="#333">1</text>

    <text x="102" y="128" text-anchor="middle" font-size="10" fill="#2f5d24">① 含 0 ✓（下标 1 命中）</text>
    <text x="102" y="146" text-anchor="middle" font-size="10" fill="#2f5d24">② 首位 1 ≠ 0 ✓</text>
    <text x="102" y="164" text-anchor="middle" font-size="9" fill="#4a6b5a">两条件同时成立</text>
    <text x="102" y="192" text-anchor="middle" font-size="13" fill="#2f5d24" font-weight="bold">→ true</text>
  </g>

  <!-- 面板二：232 / 2 → false（首位否决） -->
  <g filter="url(#rough2)">
    <rect x="198" y="38" width="164" height="172" rx="8" fill="#fce4ec" stroke="#b85450" stroke-width="1.5"/>
    <text x="280" y="58" text-anchor="middle" font-size="11" fill="#8a3030" font-weight="bold">n = 232，x = 2</text>

    <rect x="221" y="70" width="34" height="32" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2.4"/>
    <text x="238" y="91" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">2</text>
    <rect x="263" y="70" width="34" height="32" rx="4" fill="#fff" stroke="#b85450" stroke-width="1.2"/>
    <text x="280" y="91" text-anchor="middle" font-size="13" fill="#333">3</text>
    <rect x="305" y="70" width="34" height="32" rx="4" fill="#fff" stroke="#d6a040" stroke-width="1.6" stroke-dasharray="4,3"/>
    <text x="322" y="91" text-anchor="middle" font-size="13" fill="#8a6d1a">2</text>

    <text x="280" y="128" text-anchor="middle" font-size="10" fill="#8a3030">① 含 2 ✓（下标 0、2）</text>
    <text x="280" y="146" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">② 首位 = 2 ✗ 一票否决</text>
    <text x="280" y="164" text-anchor="middle" font-size="9" fill="#8a3030">末位那个 2 救不了场</text>
    <text x="280" y="192" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">→ false</text>
  </g>

  <!-- 面板三：5 / 1 → false（不含） -->
  <g filter="url(#rough2)">
    <rect x="376" y="38" width="164" height="172" rx="8" fill="#e8f0fe" stroke="#446688" stroke-width="1.5"/>
    <text x="458" y="58" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold">n = 5，x = 1</text>

    <rect x="441" y="70" width="34" height="32" rx="4" fill="#fff" stroke="#446688" stroke-width="1.5"/>
    <text x="458" y="91" text-anchor="middle" font-size="13" fill="#333">5</text>

    <text x="458" y="128" text-anchor="middle" font-size="10" fill="#8a3030">① 含 1 ✗（根本不含）</text>
    <text x="458" y="146" text-anchor="middle" font-size="10" fill="#33506b">② 首位 5 ≠ 1 ✓</text>
    <text x="458" y="164" text-anchor="middle" font-size="9" fill="#33506b">条件①先倒，②救不了</text>
    <text x="458" y="192" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold">→ false</text>
  </g>

  <!-- 判定规则 -->
  <g filter="url(#rough2)">
    <rect x="20" y="222" width="520" height="62" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5"/>
    <text x="280" y="242" text-anchor="middle" font-size="11.5" fill="#2f5d24" font-weight="bold">判定规则：答案 = [ c ∈ s ] ∧ [ s₀ ≠ c ] —— 两条件独立合取，顺序可交换</text>
    <text x="280" y="262" text-anchor="middle" font-size="10" fill="#2f5d24">条件②一票否决：首位是 x 时，后面再出现 x 也没用</text>
    <text x="280" y="277" text-anchor="middle" font-size="10" fill="#2f5d24">条件①是存在量词：x 出现一次即达标，无需计数</text>
  </g>

  <!-- 误区警示 -->
  <g filter="url(#rough2)">
    <rect x="20" y="296" width="520" height="100" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8"/>
    <text x="280" y="318" text-anchor="middle" font-size="11.5" fill="#8a6d1a" font-weight="bold">⚠️ 经典误区：合并翻译成「c in s[1:]」（x 只出现在后缀）</text>
    <text x="280" y="340" text-anchor="middle" font-size="10" fill="#8a6d1a">反例 n = 232, x = 2：后缀「32」里有 2，该写法返回 true——</text>
    <text x="280" y="357" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">但正确答案是 false：首位是 2，直接否决</text>
    <text x="280" y="377" text-anchor="middle" font-size="10.5" fill="#8a6d1a" font-weight="bold">正确姿势：c in s AND s[0] ≠ c —— 两个谓词分开写，再合取</text>
  </g>
</svg>
