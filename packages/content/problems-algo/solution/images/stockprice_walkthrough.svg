<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="600" height="440" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="15" fill="#333" font-weight="bold">示例演算：update(1,3) 更正后堆顶过时被弹</text>
  <text x="300" y="42" text-anchor="middle" font-size="10.5" fill="#888">关注第 6 步 maximum()：堆顶 (10,1) 被 ts2price[1]=3 识破，弹出露出有效顶 (5,2)</text>

  <!-- Column headers -->
  <text x="40" y="68" font-size="10.5" fill="#666" font-weight="bold">步骤</text>
  <text x="100" y="68" font-size="10.5" fill="#666" font-weight="bold">操作</text>
  <text x="215" y="68" font-size="10.5" fill="#666" font-weight="bold">ts2price</text>
  <text x="345" y="68" font-size="10.5" fill="#666" font-weight="bold">maxTs</text>
  <text x="430" y="68" font-size="10.5" fill="#666" font-weight="bold">maxHeap（顶→底）</text>

  <!-- Step rows -->
  <!-- Row 1: update(1,10) -->
  <rect x="20" y="78" width="560" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)" opacity="0.4"/>
  <text x="40" y="103" font-size="11" fill="#333">1</text>
  <text x="100" y="103" font-size="11" fill="#333">update(1,10)</text>
  <text x="215" y="103" font-size="11" fill="#333">{1:10}</text>
  <text x="345" y="103" font-size="11" fill="#333">1</text>
  <text x="430" y="103" font-size="11" fill="#333">[(10,1)]</text>

  <!-- Row 2: update(2,5) -->
  <rect x="20" y="120" width="560" height="40" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1" rx="4" filter="url(#rough2)" opacity="0.4"/>
  <text x="40" y="145" font-size="11" fill="#333">2</text>
  <text x="100" y="145" font-size="11" fill="#333">update(2,5)</text>
  <text x="215" y="145" font-size="11" fill="#333">{1:10, 2:5}</text>
  <text x="345" y="145" font-size="11" fill="#333">2</text>
  <text x="430" y="145" font-size="11" fill="#333">[(10,1), (5,2)]</text>

  <!-- Row 3: current() -->
  <rect x="20" y="162" width="560" height="40" fill="#e8f0fe" stroke="#446688" stroke-width="1" rx="4" filter="url(#rough2)" opacity="0.4"/>
  <text x="40" y="187" font-size="11" fill="#333">3</text>
  <text x="100" y="187" font-size="11" fill="#333">current()</text>
  <text x="430" y="187" font-size="11" fill="#2a4a6a" font-weight="bold">→ ts2price[2] = 5 ✅</text>

  <!-- Row 4: maximum() -->
  <rect x="20" y="204" width="560" height="40" fill="#fff8e1" stroke="#d6a040" stroke-width="1" rx="4" filter="url(#rough2)" opacity="0.4"/>
  <text x="40" y="229" font-size="11" fill="#333">4</text>
  <text x="100" y="229" font-size="11" fill="#333">maximum()</text>
  <text x="430" y="229" font-size="11" fill="#333">顶(10,1): ts2price[1]=10 ✅ → 返回 10</text>

  <!-- Row 5: update(1,3) — KEY -->
  <rect x="20" y="246" width="560" height="44" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)" opacity="0.5"/>
  <text x="40" y="273" font-size="11" fill="#b85450" font-weight="bold">5</text>
  <text x="100" y="270" font-size="11" fill="#333" font-weight="bold">update(1,3)</text>
  <text x="100" y="284" font-size="9" fill="#b85450">更正！旧价 10 被覆盖</text>
  <text x="215" y="273" font-size="11" fill="#b85450" font-weight="bold">{1:3, 2:5}</text>
  <text x="345" y="273" font-size="11" fill="#333">2</text>
  <text x="430" y="269" font-size="11" fill="#333">push(3,1) → </text>
  <text x="430" y="284" font-size="10.5" fill="#b85450">[(10,1), (5,2), (3,1)]</text>

  <!-- Row 6: maximum() — KEY -->
  <rect x="20" y="294" width="560" height="58" fill="#fce4ec" stroke="#b85450" stroke-width="2.2" rx="4" filter="url(#rough2)" opacity="0.5"/>
  <text x="40" y="321" font-size="11" fill="#b85450" font-weight="bold">6</text>
  <text x="100" y="321" font-size="11" fill="#333" font-weight="bold">maximum()</text>
  <text x="215" y="313" font-size="10" fill="#888">校验堆顶：</text>
  <text x="215" y="327" font-size="10" fill="#b85450">ts2price[1]=3 ≠ 10</text>
  <text x="215" y="341" font-size="10" fill="#4a7a3a">ts2price[2]=5 = 5 ✅</text>
  <text x="430" y="313" font-size="10.5" fill="#b85450">顶(10,1) 过时 → POP</text>
  <text x="430" y="327" font-size="10.5" fill="#333">新顶(5,2) 有效</text>
  <text x="430" y="343" font-size="11" fill="#3a5a2a" font-weight="bold">→ 返回 5 ✅</text>

  <!-- Annotation: why pop works -->
  <rect x="20" y="362" width="560" height="64" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="300" y="382" text-anchor="middle" font-size="11.5" fill="#333" font-weight="bold">延迟删除的「aha」时刻</text>
  <text x="300" y="398" text-anchor="middle" font-size="10.5" fill="#555">第 5 步更正时间戳 1 的价格时，旧条目 (10,1) 仍在堆顶 —— 不主动删</text>
  <text x="300" y="412" text-anchor="middle" font-size="10.5" fill="#555">第 6 步查询时，真相源 ts2price[1]=3 揭穿假顶 → 弹掉，露出真顶 (5,2) → 返回 5</text>
  <text x="300" y="425" text-anchor="middle" font-size="9.5" fill="#888">旧条目从不主动删，只在「挡路」时被弹 —— 这就是「延迟」二字的精髓</text>
</svg>
