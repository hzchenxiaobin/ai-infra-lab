<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2697" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：配对取 min，把较大者改成较小者</text>

  <!-- Original row label -->
  <text x="120" y="86" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">原串</text>

  <!-- Original cells: e g c f e -->
  <rect x="170" y="60" width="44" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="192" y="89" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">e</text>
  <rect x="214" y="60" width="44" height="46" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="5" filter="url(#rough2)"/>
  <text x="236" y="89" text-anchor="middle" font-size="18" fill="#b85450" font-weight="bold">g</text>
  <rect x="258" y="60" width="44" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="280" y="89" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold">c</text>
  <rect x="302" y="60" width="44" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="324" y="89" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">f</text>
  <rect x="346" y="60" width="44" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="368" y="89" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">e</text>

  <!-- index ticks -->
  <text x="192" y="118" text-anchor="middle" font-size="9" fill="#aaa">0</text>
  <text x="236" y="118" text-anchor="middle" font-size="9" fill="#aaa">1</text>
  <text x="280" y="118" text-anchor="middle" font-size="9" fill="#aaa">2</text>
  <text x="324" y="118" text-anchor="middle" font-size="9" fill="#aaa">3</text>
  <text x="368" y="118" text-anchor="middle" font-size="9" fill="#aaa">4</text>

  <!-- Pair arcs (shallow pair 1-3 first, deep pair 0-4 second) -->
  <path d="M236,124 Q280,142 324,124" fill="none" stroke="#b85450" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="156" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">配对(1,3): g &gt; f → 取 f</text>

  <path d="M192,124 Q280,178 368,124" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <text x="280" y="196" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">配对(0,4): e = e → 不动</text>

  <!-- center note -->
  <text x="280" y="116" text-anchor="middle" font-size="9" fill="#4a7a3a">↑ 回文中心，单字符天然对称</text>

  <!-- Down arrow to result -->
  <path d="M280,210 L280,232" stroke="#d6a040" stroke-width="2" marker-end="url(#arr2697)" filter="url(#rough2)"/>
  <text x="296" y="226" font-size="10" fill="#d6a040">取 min</text>

  <!-- Result row label -->
  <text x="120" y="272" text-anchor="middle" font-size="12" fill="#888" font-weight="bold">结果</text>

  <!-- Result cells: e f c f e, cell1 highlighted -->
  <rect x="170" y="246" width="44" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="192" y="275" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">e</text>
  <rect x="214" y="246" width="44" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="2.2" rx="5" filter="url(#rough2)"/>
  <text x="236" y="275" text-anchor="middle" font-size="18" fill="#d6a040" font-weight="bold">f</text>
  <rect x="258" y="246" width="44" height="46" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="280" y="275" text-anchor="middle" font-size="18" fill="#4a7a3a" font-weight="bold">c</text>
  <rect x="302" y="246" width="44" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="324" y="275" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">f</text>
  <rect x="346" y="246" width="44" height="46" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="5" filter="url(#rough2)"/>
  <text x="368" y="275" text-anchor="middle" font-size="18" fill="#333" font-weight="bold">e</text>

  <!-- change annotation -->
  <text x="236" y="240" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">g→f (1 次操作)</text>

  <!-- Rule box -->
  <rect x="60" y="306" width="440" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="324" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold">规则：对每对 (s[i], s[n-1-i])，令 c = min(a,b)</text>
  <text x="280" y="340" text-anchor="middle" font-size="11" fill="#446688">不等则把较大者改成 c（1 次操作）；相等则不动（0 次）</text>
</svg>
