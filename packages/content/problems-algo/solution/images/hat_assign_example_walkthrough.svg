<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#888"/>
    </marker>
  </defs>

  <rect width="540" height="400" fill="#fafafa"/>

  <text x="270" y="26" text-anchor="middle" font-size="15" fill="#444" font-weight="bold" filter="url(#rough2)">示例演算：hats = [[3,5,1],[3,5]]</text>
  <text x="270" y="44" text-anchor="middle" font-size="11" fill="#888" filter="url(#rough2)">n=2，mask 高位=人1、低位=人0；3 顶帽子逐个入场</text>

  <!-- ===== Table header ===== -->
  <g>
    <rect x="40" y="60" width="130" height="30" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="105" y="80" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">处理帽子</text>

    <rect x="170" y="60" width="80" height="30" fill="#f6f6f6" stroke="#bbb" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="210" y="80" text-anchor="middle" font-size="11" fill="#555" font-weight="bold" filter="url(#rough2)">喜欢的人</text>

    <rect x="250" y="60" width="68" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="284" y="74" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">mask=00</text>
    <text x="284" y="86" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">(空)</text>

    <rect x="318" y="60" width="68" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="352" y="74" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">mask=01</text>
    <text x="352" y="86" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">(人0)</text>

    <rect x="386" y="60" width="68" height="30" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
    <text x="420" y="74" text-anchor="middle" font-size="10" fill="#446688" font-weight="bold" filter="url(#rough2)">mask=10</text>
    <text x="420" y="86" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">(人1)</text>

    <rect x="454" y="60" width="68" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="488" y="74" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">mask=11</text>
    <text x="488" y="86" text-anchor="middle" font-size="8" fill="#aaa" filter="url(#rough2)">(两人)</text>
  </g>

  <!-- ===== Row: initial ===== -->
  <g>
    <rect x="40" y="96" width="130" height="30" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="105" y="116" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">初始 dp[0]=1</text>
    <rect x="170" y="96" width="80" height="30" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="210" y="116" text-anchor="middle" font-size="10" fill="#888" filter="url(#rough2)">—</text>
    <rect x="250" y="96" width="68" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="284" y="116" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
    <rect x="318" y="96" width="68" height="30" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="352" y="116" text-anchor="middle" font-size="12" fill="#ccc" filter="url(#rough2)">0</text>
    <rect x="386" y="96" width="68" height="30" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="420" y="116" text-anchor="middle" font-size="12" fill="#ccc" filter="url(#rough2)">0</text>
    <rect x="454" y="96" width="68" height="30" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="488" y="116" text-anchor="middle" font-size="12" fill="#ccc" filter="url(#rough2)">0</text>
  </g>

  <!-- ===== Row: hat 1 ===== -->
  <g>
    <rect x="40" y="132" width="130" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="105" y="152" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">帽 1</text>
    <rect x="170" y="132" width="80" height="30" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="210" y="152" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">{P0}</text>
    <rect x="250" y="132" width="68" height="30" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="284" y="152" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
    <rect x="318" y="132" width="68" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="352" y="152" text-anchor="middle" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">1</text>
    <rect x="386" y="132" width="68" height="30" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="420" y="152" text-anchor="middle" font-size="12" fill="#ccc" filter="url(#rough2)">0</text>
    <rect x="454" y="132" width="68" height="30" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="488" y="152" text-anchor="middle" font-size="12" fill="#ccc" filter="url(#rough2)">0</text>
  </g>
  <!-- arrow hat1: 00 -> 01 -->
  <path d="M 284 168 Q 320 176 352 168" stroke="#4a7a3a" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="318" y="184" text-anchor="middle" font-size="9" fill="#4a7a3a" filter="url(#rough2)">人0 拿帽1</text>

  <!-- ===== Row: hat 3 ===== -->
  <g>
    <rect x="40" y="196" width="130" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="105" y="216" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">帽 3</text>
    <rect x="170" y="196" width="80" height="30" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="210" y="216" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">{P0,P1}</text>
    <rect x="250" y="196" width="68" height="30" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="284" y="216" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
    <rect x="318" y="196" width="68" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="352" y="216" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">2</text>
    <rect x="386" y="196" width="68" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="420" y="216" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
    <rect x="454" y="196" width="68" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="488" y="216" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold" filter="url(#rough2)">1</text>
  </g>
  <!-- arrows hat3 -->
  <path d="M 352 232 Q 420 244 488 232" stroke="#d6a040" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="420" y="250" text-anchor="middle" font-size="9" fill="#d6a040" filter="url(#rough2)">人1 拿帽3（人0已有帽）</text>

  <!-- ===== Row: hat 5 ===== -->
  <g>
    <rect x="40" y="262" width="130" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
    <text x="105" y="282" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">帽 5</text>
    <rect x="170" y="262" width="80" height="30" fill="#f6f6f6" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="210" y="282" text-anchor="middle" font-size="10" fill="#555" filter="url(#rough2)">{P0,P1}</text>
    <rect x="250" y="262" width="68" height="30" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="284" y="282" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">1</text>
    <rect x="318" y="262" width="68" height="30" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="352" y="282" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">3</text>
    <rect x="386" y="262" width="68" height="30" fill="#fff" stroke="#ccc" stroke-width="1" rx="4" filter="url(#rough2)"/>
    <text x="420" y="282" text-anchor="middle" font-size="12" fill="#555" filter="url(#rough2)">2</text>
    <rect x="454" y="262" width="68" height="30" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
    <text x="488" y="282" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">4</text>
  </g>
  <!-- arrows hat5: 10->11 and 01->11 -->
  <path d="M 420 298 Q 454 308 488 298" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="454" y="316" text-anchor="middle" font-size="9" fill="#b85450" filter="url(#rough2)">人0 拿帽5</text>
  <path d="M 352 298 Q 420 314 488 300" stroke="#b85450" stroke-width="1.4" fill="none" marker-end="url(#arr)" filter="url(#rough2)" stroke-dasharray="4 3"/>

  <!-- ===== Bottom: answer + mapping ===== -->
  <g>
    <rect x="40" y="330" width="482" height="56" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
    <text x="270" y="350" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">答案 dp[11] = 4，对应 4 种安排：</text>
    <text x="270" y="368" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">(帽3,帽5) · (帽5,帽3) · (帽1,帽3) · (帽1,帽5)</text>
    <text x="270" y="382" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">（人0的帽, 人1的帽）</text>
  </g>
</svg>
