<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="430" fill="#fafafa"/>

  <text x="320" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：[1,4,5,4,4,null,5] 后序逐节点求箭头</text>

  <!-- 小树  root=1 (100,72) left4 (62,134) right5 (150,134)  4->4,4 (40,196)(84,196)  5->5 (172,196) -->
  <text x="100" y="52" text-anchor="middle" font-size="11" fill="#888">后序顺序</text>
  <circle cx="100" cy="72" r="12" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="100" y="76" text-anchor="middle" font-size="10" fill="#333">1</text>
  <text x="114" y="68" font-size="8" fill="#b85450">⑥</text>

  <line x1="92" y1="82" x2="68" y2="122" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="108" y1="82" x2="142" y2="122" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <circle cx="62" cy="134" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="62" y="138" text-anchor="middle" font-size="9" fill="#333">4</text>
  <text x="76" y="130" font-size="8" fill="#4a7a3a">③</text>

  <circle cx="150" cy="134" r="11" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="150" y="138" text-anchor="middle" font-size="9" fill="#333">5</text>
  <text x="164" y="130" font-size="8" fill="#4a7a3a">⑤</text>

  <line x1="55" y1="144" x2="42" y2="184" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="69" y1="144" x2="80" y2="184" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <line x1="157" y1="144" x2="170" y2="184" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>

  <circle cx="40" cy="196" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="40" y="199" text-anchor="middle" font-size="8" fill="#333">4</text>
  <text x="52" y="202" font-size="8" fill="#4a7a3a">①</text>

  <circle cx="84" cy="196" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="84" y="199" text-anchor="middle" font-size="8" fill="#333">4</text>
  <text x="96" y="202" font-size="8" fill="#4a7a3a">②</text>

  <circle cx="172" cy="196" r="9" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="172" y="199" text-anchor="middle" font-size="8" fill="#333">5</text>
  <text x="184" y="202" font-size="8" fill="#4a7a3a">④</text>

  <!-- 表格表头  x:200-620 width420  cols:节点60 L·R70 leftArr75 rightArr75 ans70 return70 -->
  <rect x="200" y="48" width="420" height="26" fill="#446688" filter="url(#rough2)"/>
  <text x="230" y="65" text-anchor="middle" font-size="9.5" fill="#fff" font-weight="bold">节点</text>
  <text x="295" y="65" text-anchor="middle" font-size="9.5" fill="#fff" font-weight="bold">L · R</text>
  <text x="367" y="65" text-anchor="middle" font-size="9.5" fill="#fff" font-weight="bold">leftArrow</text>
  <text x="442" y="65" text-anchor="middle" font-size="9.5" fill="#fff" font-weight="bold">rightArrow</text>
  <text x="515" y="65" text-anchor="middle" font-size="9.5" fill="#fff" font-weight="bold">ans</text>
  <text x="585" y="65" text-anchor="middle" font-size="9.5" fill="#fff" font-weight="bold">return</text>
  <line x1="260" y1="48" x2="260" y2="74" stroke="#fafafa" stroke-width="1"/>
  <line x1="330" y1="48" x2="330" y2="74" stroke="#fafafa" stroke-width="1"/>
  <line x1="405" y1="48" x2="405" y2="74" stroke="#fafafa" stroke-width="1"/>
  <line x1="480" y1="48" x2="480" y2="74" stroke="#fafafa" stroke-width="1"/>
  <line x1="550" y1="48" x2="550" y2="74" stroke="#fafafa" stroke-width="1"/>

  <!-- 行 ① 叶4 -->
  <rect x="200" y="74" width="420" height="28" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="230" y="92" text-anchor="middle" font-size="9.5" fill="#333">① 叶 4</text>
  <text x="295" y="92" text-anchor="middle" font-size="9" fill="#888">0 · 0</text>
  <text x="367" y="92" text-anchor="middle" font-size="9.5" fill="#333">0</text>
  <text x="442" y="92" text-anchor="middle" font-size="9.5" fill="#333">0</text>
  <text x="515" y="92" text-anchor="middle" font-size="9.5" fill="#333">0</text>
  <text x="585" y="92" text-anchor="middle" font-size="9.5" fill="#333">0</text>

  <!-- 行 ② 叶4 -->
  <rect x="200" y="102" width="420" height="28" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="230" y="120" text-anchor="middle" font-size="9.5" fill="#333">② 叶 4</text>
  <text x="295" y="120" text-anchor="middle" font-size="9" fill="#888">0 · 0</text>
  <text x="367" y="120" text-anchor="middle" font-size="9.5" fill="#333">0</text>
  <text x="442" y="120" text-anchor="middle" font-size="9.5" fill="#333">0</text>
  <text x="515" y="120" text-anchor="middle" font-size="9.5" fill="#333">0</text>
  <text x="585" y="120" text-anchor="middle" font-size="9.5" fill="#333">0</text>

  <!-- 行 ③ 节点4  ← 高亮：拼接左右 -->
  <rect x="200" y="130" width="420" height="28" fill="#fce4ec" filter="url(#rough2)"/>
  <text x="230" y="148" text-anchor="middle" font-size="9.5" fill="#333">③ 节点 4</text>
  <text x="295" y="148" text-anchor="middle" font-size="9" fill="#888">0 · 0</text>
  <text x="367" y="148" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">1</text>
  <text x="442" y="148" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">1</text>
  <text x="515" y="148" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold">2</text>
  <text x="585" y="148" text-anchor="middle" font-size="9.5" fill="#333">1</text>

  <!-- 行 ④ 叶5 -->
  <rect x="200" y="158" width="420" height="28" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="230" y="176" text-anchor="middle" font-size="9.5" fill="#333">④ 叶 5</text>
  <text x="295" y="176" text-anchor="middle" font-size="9" fill="#888">0 · 0</text>
  <text x="367" y="176" text-anchor="middle" font-size="9.5" fill="#333">0</text>
  <text x="442" y="176" text-anchor="middle" font-size="9.5" fill="#333">0</text>
  <text x="515" y="176" text-anchor="middle" font-size="9.5" fill="#333">2</text>
  <text x="585" y="176" text-anchor="middle" font-size="9.5" fill="#333">0</text>

  <!-- 行 ⑤ 节点5 -->
  <rect x="200" y="186" width="420" height="28" fill="#e6f4ea" filter="url(#rough2)"/>
  <text x="230" y="204" text-anchor="middle" font-size="9.5" fill="#333">⑤ 节点 5</text>
  <text x="295" y="204" text-anchor="middle" font-size="9" fill="#888">0 · 0</text>
  <text x="367" y="204" text-anchor="middle" font-size="9.5" fill="#333">0</text>
  <text x="442" y="204" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold">1</text>
  <text x="515" y="204" text-anchor="middle" font-size="9.5" fill="#333">2</text>
  <text x="585" y="204" text-anchor="middle" font-size="9.5" fill="#333">1</text>

  <!-- 行 ⑥ 根1 -->
  <rect x="200" y="214" width="420" height="28" fill="#fce4ec" filter="url(#rough2)"/>
  <text x="230" y="232" text-anchor="middle" font-size="9.5" fill="#333">⑥ 根 1</text>
  <text x="295" y="232" text-anchor="middle" font-size="9" fill="#888">1 · 1</text>
  <text x="367" y="232" text-anchor="middle" font-size="9.5" fill="#b85450">0</text>
  <text x="442" y="232" text-anchor="middle" font-size="9.5" fill="#b85450">0</text>
  <text x="515" y="232" text-anchor="middle" font-size="9.5" fill="#333">2</text>
  <text x="585" y="232" text-anchor="middle" font-size="9.5" fill="#333">0</text>

  <!-- 表格边框 + 分隔线 -->
  <rect x="200" y="48" width="420" height="194" fill="none" stroke="#446688" stroke-width="1.2" filter="url(#rough2)"/>
  <line x1="260" y1="74" x2="260" y2="242" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="330" y1="74" x2="330" y2="242" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="405" y1="74" x2="405" y2="242" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="480" y1="74" x2="480" y2="242" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>
  <line x1="550" y1="74" x2="550" y2="242" stroke="#bbb" stroke-width="0.8" filter="url(#rough2)"/>

  <!-- 结论框 -->
  <rect x="60" y="262" width="520" height="58" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="320" y="284" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">最终 ans = 2 ✓（路径 4—4—4，两条边）</text>
  <text x="320" y="304" text-anchor="middle" font-size="10" fill="#555">③ 处左右都是 4==4：leftArrow=1、rightArrow=1，拼接得 ans=2</text>

  <!-- 关键观察 -->
  <rect x="60" y="332" width="520" height="86" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="8" filter="url(#rough2)"/>
  <text x="320" y="354" text-anchor="middle" font-size="10.5" fill="#555" font-weight="bold">关键观察</text>
  <text x="75" y="374" font-size="10" fill="#555">• ③ 节点 4：两孩子值都等于 4 → 两条箭头各 +1 = 1，在节点处「拐弯」拼接为 2</text>
  <text x="75" y="392" font-size="10" fill="#555">• ⑥ 根 1：左孩子 4≠1、右孩子 5≠1 → 两条箭头都截断为 0，ans 不变</text>
  <text x="75" y="410" font-size="10" fill="#555">• 向上只传一支：③ return max(1,1)=1 给根；根因值不等再截断为 0</text>
</svg>
