<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>
  <text x="260" y="20" text-anchor="middle" font-size="14" fill="#333" font-weight="bold" filter="url(#rough2)">示例 2 演算：n = 3, k = 2</text>
  <text x="260" y="37" text-anchor="middle" font-size="9" fill="#888" filter="url(#rough2)">stay = [[3,4,2],[2,1,2]]，travel = [[0,2,1],[2,0,4],[3,2,0]]</text>

  <!-- 表头 -->
  <text x="100" y="62" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">城市 0</text>
  <text x="175" y="62" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">城市 1</text>
  <text x="250" y="62" text-anchor="middle" font-size="10.5" fill="#33506b" font-weight="bold" filter="url(#rough2)">城市 2</text>
  <line x1="30" y1="70" x2="310" y2="70" stroke="#bbb" stroke-width="1.2" filter="url(#rough2)"/>

  <!-- 初始行 -->
  <text x="94" y="88" text-anchor="end" font-size="9.5" fill="#888" filter="url(#rough2)">初始</text>
  <rect x="105" y="74" width="62" height="30" fill="#f2f2f2" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="136" y="93" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">0</text>
  <rect x="178" y="74" width="62" height="30" fill="#f2f2f2" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="209" y="93" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">0</text>
  <rect x="251" y="74" width="62" height="30" fill="#f2f2f2" stroke="#999" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="282" y="93" text-anchor="middle" font-size="10.5" fill="#666" filter="url(#rough2)">0</text>
  <text x="330" y="93" font-size="9.5" fill="#888" filter="url(#rough2)">起点任选 ⇒ 全 0 起步</text>

  <!-- 第 0 天 -->
  <text x="94" y="130" text-anchor="end" font-size="9.5" fill="#888" filter="url(#rough2)">第 0 天</text>
  <rect x="105" y="114" width="62" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="136" y="131" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">3</text>
  <text x="136" y="145" text-anchor="middle" font-size="7.5" fill="#888" filter="url(#rough2)">留: 0+3</text>
  <rect x="178" y="114" width="62" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="209" y="131" text-anchor="middle" font-size="11" fill="#a07830" font-weight="bold" filter="url(#rough2)">4 ★</text>
  <text x="209" y="145" text-anchor="middle" font-size="7.5" fill="#a07830" filter="url(#rough2)">留: 0+4</text>
  <rect x="251" y="114" width="62" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="282" y="131" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">4</text>
  <text x="282" y="145" text-anchor="middle" font-size="7.5" fill="#888" filter="url(#rough2)">飞 1→2: 0+4</text>
  <text x="330" y="130" font-size="9.5" fill="#888" filter="url(#rough2)">首日即得两桶 4 分：</text>
  <text x="330" y="144" font-size="9.5" fill="#888" filter="url(#rough2)">城市 1「留」与城市 2「飞来」</text>

  <!-- 第 1 天 -->
  <text x="94" y="182" text-anchor="end" font-size="9.5" fill="#888" filter="url(#rough2)">第 1 天</text>
  <rect x="105" y="166" width="62" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="136" y="183" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">7</text>
  <text x="136" y="197" text-anchor="middle" font-size="7.5" fill="#888" filter="url(#rough2)">飞 2→0: 4+3</text>
  <rect x="178" y="166" width="62" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="209" y="183" text-anchor="middle" font-size="11" fill="#33506b" font-weight="bold" filter="url(#rough2)">6</text>
  <text x="209" y="197" text-anchor="middle" font-size="7.5" fill="#888" filter="url(#rough2)">飞 2→1: 4+2</text>
  <rect x="251" y="166" width="62" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.4" rx="4" filter="url(#rough2)"/>
  <text x="282" y="183" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">8 ★</text>
  <text x="282" y="197" text-anchor="middle" font-size="7.5" fill="#b85450" filter="url(#rough2)">飞 1→2: 4+4</text>

  <!-- 最优转移虚线箭头 -->
  <path d="M 222 152 Q 258 162 272 166" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrO)" filter="url(#rough2)"/>

  <text x="330" y="182" font-size="9.5" fill="#888" filter="url(#rough2)">每个格子都在「留」与</text>
  <text x="330" y="196" font-size="9.5" fill="#888" filter="url(#rough2)">n−1 种「赶来」里取最大</text>

  <!-- 答案 -->
  <text x="30" y="228" font-size="11" fill="#8a3833" font-weight="bold" filter="url(#rough2)">答案 = max(7, 6, 8) = 8</text>

  <!-- 路径还原 -->
  <rect x="20" y="242" width="480" height="100" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="264" text-anchor="middle" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">最优行程还原（倒推 ★ 格来源）</text>
  <text x="40" y="286" font-size="10" fill="#2f5d24" filter="url(#rough2)">dp[1][2] = 8 ← dp[0][1] + travel[1][2] = 4 + 4　（第 1 天从城市 1 飞往城市 2）</text>
  <text x="40" y="305" font-size="10" fill="#2f5d24" filter="url(#rough2)">dp[0][1] = 4 ← 起点 1 + stay[0][1] = 0 + 4　（第 0 天在城市 1 留宿）</text>
  <text x="40" y="330" font-size="10.5" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">⇒ 行程：城市 1（留 +4）→ 城市 2（飞 +4），共 8 分 ✓ 与官方一致</text>
</svg>
