<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="600" height="400" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">账户数组（1-indexed 编号 ↔ 0-indexed 下标）+ 两道校验闸门</text>

  <!-- Account numbers (1-indexed) -->
  <text x="80" y="72" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">账户号 1</text>
  <text x="160" y="72" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">2</text>
  <text x="240" y="72" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">3</text>
  <text x="320" y="72" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <text x="400" y="72" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">5</text>

  <!-- Account cells -->
  <rect x="50" y="82" width="60" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="130" y="82" width="60" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="210" y="82" width="60" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="290" y="82" width="60" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <rect x="370" y="82" width="60" height="42" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>

  <!-- Balance values -->
  <text x="80" y="110" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">10</text>
  <text x="160" y="110" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">100</text>
  <text x="240" y="110" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">20</text>
  <text x="320" y="110" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">50</text>
  <text x="400" y="110" text-anchor="middle" font-size="14" fill="#333" font-weight="bold">30</text>

  <!-- Array indices (0-indexed) -->
  <text x="80" y="144" text-anchor="middle" font-size="11" fill="#4a7a3a">下标 0</text>
  <text x="160" y="144" text-anchor="middle" font-size="11" fill="#4a7a3a">1</text>
  <text x="240" y="144" text-anchor="middle" font-size="11" fill="#4a7a3a">2</text>
  <text x="320" y="144" text-anchor="middle" font-size="11" fill="#4a7a3a">3</text>
  <text x="400" y="144" text-anchor="middle" font-size="11" fill="#4a7a3a">4</text>

  <!-- Mapping note -->
  <rect x="460" y="86" width="120" height="46" fill="#fff8e1" stroke="#d6a040" stroke-width="1.3" rx="6" filter="url(#rough2)"/>
  <text x="520" y="106" text-anchor="middle" font-size="11" fill="#555">n = 5 个账户</text>
  <text x="520" y="124" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">acc → bal[acc−1]</text>

  <!-- Gate 1 -->
  <rect x="40" y="186" width="240" height="86" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="160" y="210" text-anchor="middle" font-size="12" fill="#2f5a22" font-weight="bold">闸门①：编号合法性</text>
  <text x="55" y="232" font-size="11" fill="#555">所有操作先查：</text>
  <text x="55" y="250" font-size="11" fill="#b85450" font-weight="bold">1 ≤ account ≤ n ?</text>
  <text x="55" y="266" font-size="11" fill="#555">越界 → return false</text>

  <!-- Gate 2 -->
  <rect x="320" y="186" width="240" height="86" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="440" y="210" text-anchor="middle" font-size="12" fill="#a87a26" font-weight="bold">闸门②：余额充足性</text>
  <text x="335" y="232" font-size="11" fill="#555">withdraw / transfer 额外查：</text>
  <text x="335" y="250" font-size="11" fill="#b85450" font-weight="bold">bal[acc−1] ≥ money ?</text>
  <text x="335" y="266" font-size="11" fill="#555">不足 → return false</text>

  <!-- Arrows from gates down to update -->
  <line x1="160" y1="272" x2="160" y2="304" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <line x1="440" y1="272" x2="440" y2="304" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Update box -->
  <rect x="100" y="306" width="400" height="68" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="300" y="330" text-anchor="middle" font-size="12" fill="#8a3a36" font-weight="bold">两道闸门都通过 → 原地加减更新余额</text>
  <text x="300" y="352" text-anchor="middle" font-size="11" fill="#555">deposit：bal[acc−1] += money</text>
  <text x="300" y="368" text-anchor="middle" font-size="11" fill="#555">withdraw：bal[acc−1] −= money ｜ transfer：bal[a1−1] −= m，bal[a2−1] += m</text>
</svg>
