<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#777"/>
    </marker>
  </defs>

  <rect width="520" height="440" fill="#fafafa"/>

  <text x="260" y="26" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">示例 3 演算：同一个点集，两种候选的不同命运</text>
  <text x="260" y="46" text-anchor="middle" font-size="11" fill="#777" filter="url(#rough2)">points = [[1,1],[1,3],[3,1],[3,3],[1,2],[3,2]]，答案 = 2</text>

  <!-- ============ left panel: big square (invalid) ============ -->
  <text x="143" y="76" text-anchor="middle" font-size="12" fill="#b85450" filter="url(#rough2)">候选① 大正方形 [1,3]×[1,3]</text>

  <!-- axes -->
  <path d="M50,320 L236,320" fill="none" stroke="#777" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M62,334 L62,152" fill="none" stroke="#777" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="102" y="336" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">1</text>
  <text x="142" y="336" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">2</text>
  <text x="182" y="336" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">3</text>
  <text x="50" y="284" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">1</text>
  <text x="50" y="244" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">2</text>
  <text x="50" y="204" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">3</text>

  <!-- candidate rectangle [1,3]x[1,3] -->
  <rect x="102" y="200" width="80" height="80" fill="#e8f0fe" fill-opacity="0.5"
        stroke="#446688" stroke-width="2" rx="2" filter="url(#rough2)"/>

  <!-- 4 corners (green) -->
  <circle cx="102" cy="280" r="5.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="102" cy="200" r="5.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="182" cy="280" r="5.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="182" cy="200" r="5.5" fill="#4a7a3a" filter="url(#rough2)"/>

  <!-- edge points (red, on border) -->
  <circle cx="102" cy="240" r="5.5" fill="#b85450" filter="url(#rough2)"/>
  <circle cx="182" cy="240" r="5.5" fill="#b85450" filter="url(#rough2)"/>
  <text x="114" y="258" font-size="10" fill="#b85450" filter="url(#rough2)">(1,2)</text>
  <text x="142" y="258" font-size="10" fill="#b85450" filter="url(#rough2)">(3,2)</text>
  <text x="110" y="232" font-size="12" fill="#b85450" filter="url(#rough2)">✗</text>
  <text x="172" y="232" font-size="12" fill="#b85450" filter="url(#rough2)">✗</text>

  <text x="143" y="356" text-anchor="middle" font-size="11" fill="#b85450" filter="url(#rough2)">第五点落在左右边上（不是内部）→ 作废 ✗</text>

  <!-- ============ right panel: short rectangle (valid) ============ -->
  <text x="383" y="76" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">候选② 矮矩形 [1,3]×[2,3]</text>

  <!-- axes -->
  <path d="M290,320 L476,320" fill="none" stroke="#777" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <path d="M302,334 L302,152" fill="none" stroke="#777" stroke-width="1.3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="342" y="336" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">1</text>
  <text x="382" y="336" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">2</text>
  <text x="422" y="336" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">3</text>
  <text x="290" y="284" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">1</text>
  <text x="290" y="244" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">2</text>
  <text x="290" y="204" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">3</text>

  <!-- candidate rectangle [1,3]x[2,3] -->
  <rect x="342" y="200" width="80" height="40" fill="#e6f4ea" fill-opacity="0.6"
        stroke="#4a7a3a" stroke-width="2.2" rx="2" filter="url(#rough2)"/>
  <text x="382" y="225" text-anchor="middle" font-size="11" fill="#2a4a1e" filter="url(#rough2)">面积 = 2×1 = 2</text>

  <!-- 4 corners (green) -->
  <circle cx="342" cy="240" r="5.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="342" cy="200" r="5.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="422" cy="240" r="5.5" fill="#4a7a3a" filter="url(#rough2)"/>
  <circle cx="422" cy="200" r="5.5" fill="#4a7a3a" filter="url(#rough2)"/>

  <!-- outside points (gray) -->
  <circle cx="342" cy="280" r="5.5" fill="#999" filter="url(#rough2)"/>
  <circle cx="422" cy="280" r="5.5" fill="#999" filter="url(#rough2)"/>
  <text x="352" y="298" font-size="10" fill="#999" filter="url(#rough2)">(1,1)</text>
  <text x="432" y="298" font-size="10" fill="#999" filter="url(#rough2)">(3,1)</text>

  <text x="383" y="356" text-anchor="middle" font-size="11" fill="#4a7a3a" filter="url(#rough2)">闭矩形内恰四个角 → 合法 ✓ 面积 2</text>

  <!-- bottom note -->
  <rect x="60" y="376" width="400" height="52" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="398" text-anchor="middle" font-size="12" fill="#8a6a1a" filter="url(#rough2)">候选③ [1,3]×[1,2]（下方矮矩形）同样合法，面积也是 2</text>
  <text x="260" y="418" text-anchor="middle" font-size="12" fill="#8a6a1a" filter="url(#rough2)">判定用闭矩形：边界上的第五点（候选①）与内部第五点同罪</text>
</svg>
