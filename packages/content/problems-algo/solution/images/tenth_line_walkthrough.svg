<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="'Comic Sans MS','Marker Felt','Segoe UI','Kaiti SC',楷体,cursive">
  <defs>
    <filter id="sk" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
    <filter id="sk2" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3" result="n2"/>
      <feDisplacementMap in="SourceGraphic" in2="n2" scale="2"/>
    </filter>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a3a3a"/>
    </marker>
    <marker id="arO" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
  </defs>
  <rect width="880" height="420" fill="#fafafa"/>

  <!-- Title -->
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2b2b">演算：12 行文件经 awk NR==10 逐行过滤</text>
  <path d="M 230 46 Q 440 54 650 46" stroke="#2b2b2b" stroke-width="1.5" fill="none" filter="url(#sk)"/>

  <!-- ============ left: file.txt with NR column ============ -->
  <text x="160" y="84" text-anchor="middle" font-size="12" fill="#888">file.txt + awk 内部 NR 计数</text>
  <g filter="url(#sk)">
    <rect x="56" y="92" width="208" height="288" rx="8" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.4" stroke-dasharray="4 3"/>
  </g>
  <!-- header row -->
  <text x="80" y="112" font-size="10" fill="#888" font-family="'Courier New',monospace">NR</text>
  <text x="130" y="112" font-size="10" fill="#888" font-family="'Courier New',monospace">行内容</text>
  <line x1="64" y1="118" x2="256" y2="118" stroke="#ddd" stroke-width="1" filter="url(#sk)"/>

  <!-- rows: NR 1..12 -->
  <g font-size="11" font-family="'Courier New',monospace">
    <text x="80" y="136" fill="#999">1</text><text x="130" y="136" fill="#555">Line 1</text>
    <text x="80" y="154" fill="#999">2</text><text x="130" y="154" fill="#555">Line 2</text>
    <text x="80" y="172" fill="#999">3</text><text x="130" y="172" fill="#555">Line 3</text>
    <text x="80" y="190" fill="#999">4</text><text x="130" y="190" fill="#555">Line 4</text>
    <text x="80" y="208" fill="#999">5</text><text x="130" y="208" fill="#555">Line 5</text>
    <text x="80" y="226" fill="#999">6</text><text x="130" y="226" fill="#555">Line 6</text>
    <text x="80" y="244" fill="#999">7</text><text x="130" y="244" fill="#555">Line 7</text>
    <text x="80" y="262" fill="#999">8</text><text x="130" y="262" fill="#555">Line 8</text>
    <text x="80" y="280" fill="#999">9</text><text x="130" y="280" fill="#555">Line 9</text>
  </g>
  <!-- NR=10 highlighted -->
  <g filter="url(#sk)">
    <rect x="68" y="288" width="184" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="80" y="304" font-size="11" font-weight="bold" fill="#d6a040" font-family="'Courier New',monospace">10</text>
  <text x="130" y="304" font-size="11" font-weight="bold" fill="#d6a040" font-family="'Courier New',monospace">Line 10</text>
  <g font-size="11" font-family="'Courier New',monospace">
    <text x="80" y="324" fill="#bbb">11</text><text x="130" y="324" fill="#bbb">Line 11</text>
    <text x="80" y="342" fill="#bbb">12</text><text x="130" y="342" fill="#bbb">Line 12</text>
  </g>
  <text x="160" y="368" text-anchor="middle" font-size="10" fill="#aaa">NR 随读取自增</text>

  <!-- ============ middle: predicate check ============ -->
  <text x="460" y="84" text-anchor="middle" font-size="12" fill="#888">谓词判定 NR==10</text>
  <g filter="url(#sk)">
    <rect x="380" y="160" width="160" height="120" rx="10" fill="#e8f0fe" stroke="#446688" stroke-width="1.8"/>
  </g>
  <text x="460" y="186" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6e9e">逐行套用条件</text>
  <text x="460" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#446688" font-family="'Courier New',monospace">NR == 10 ?</text>
  <!-- NR 1-9: false -->
  <g filter="url(#sk)">
    <rect x="398" y="222" width="58" height="22" rx="4" fill="#ffffff" stroke="#bbb" stroke-width="1"/>
  </g>
  <text x="427" y="237" text-anchor="middle" font-size="10" fill="#999" font-family="'Courier New',monospace">1..9</text>
  <text x="468" y="237" font-size="12" fill="#b85450" font-weight="bold">✗ 跳过</text>
  <!-- NR 10: true -->
  <g filter="url(#sk)">
    <rect x="398" y="248" width="58" height="22" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="427" y="263" text-anchor="middle" font-size="10" font-weight="bold" fill="#d6a040" font-family="'Courier New',monospace">10</text>
  <text x="468" y="263" font-size="12" fill="#2e6e2e" font-weight="bold">✓ 输出</text>
  <text x="460" y="296" text-anchor="middle" font-size="10" fill="#446688">11,12 同样 ✗ 跳过</text>

  <!-- ============ right: output ============ -->
  <text x="740" y="84" text-anchor="middle" font-size="12" fill="#888">stdout 输出</text>
  <g filter="url(#sk)">
    <rect x="640" y="92" width="200" height="180" rx="8" fill="#eaf6ee" stroke="#4a7e4a" stroke-width="1.6"/>
  </g>
  <text x="740" y="118" text-anchor="middle" font-size="11" fill="#888">仅命中行原样打印</text>
  <g filter="url(#sk)">
    <rect x="664" y="200" width="152" height="30" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2"/>
  </g>
  <text x="740" y="220" text-anchor="middle" font-size="14" font-weight="bold" fill="#d6a040" font-family="'Courier New',monospace">Line 10</text>
  <text x="740" y="252" text-anchor="middle" font-size="10" fill="#4a7e4a">其余 11 行均不输出</text>

  <!-- arrows: file -> predicate -> output -->
  <path d="M 266 296 Q 320 296 376 220" stroke="#3a3a3a" stroke-width="2" fill="none" marker-end="url(#ar)" filter="url(#sk)"/>
  <path d="M 540 259 Q 590 259 636 215" stroke="#d6a040" stroke-width="2.4" fill="none" marker-end="url(#arO)" filter="url(#sk)"/>

  <!-- ============ bottom: NR progression table ============ -->
  <g filter="url(#sk)">
    <rect x="56" y="300" width="300" height="80" rx="8" fill="#ffffff" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="4 3"/>
  </g>
  <text x="206" y="320" text-anchor="middle" font-size="11" font-weight="bold" fill="#446688">NR 推进轨迹</text>
  <g font-size="10" font-family="'Courier New',monospace" fill="#555">
    <text x="72" y="340">读到 Line 1 → NR=1，谓词 ✗</text>
    <text x="72" y="356">读到 Line 9 → NR=9，谓词 ✗</text>
    <text x="72" y="372" fill="#d6a040" font-weight="bold">读到 Line 10 → NR=10，谓词 ✓ → print</text>
  </g>

  <!-- note bottom right -->
  <g filter="url(#sk)">
    <rect x="380" y="300" width="460" height="80" rx="8" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4"/>
  </g>
  <text x="396" y="322" font-size="11.5" fill="#7a5415">awk 的 NR 是「已读取行数」——每读入一行自增 1，在主块执行时 NR = 当前行号。</text>
  <text x="396" y="340" font-size="11.5" fill="#7a5415">谓词 NR==10 把「行号判定」压缩成一个布尔表达式：读完整文件只产生一次 true。</text>
  <text x="396" y="358" font-size="11.5" fill="#7a5415">若文件仅 5 行，NR 终止于 5，谓词从未成立 → 输出空。天然处理边界，无需特判。</text>
  <text x="396" y="376" font-size="11.5" font-weight="bold" fill="#d6a040">→ 「寻址」而非「计数后取」，是边界安全的根源。</text>
</svg>
