<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="15" fill="#333" filter="url(#rough2)">核心观察：字符 = 定长档期，k 逐档扣减</text>
  <text x="260" y="42" text-anchor="middle" font-size="12" fill="#666" filter="url(#rough2)">s = "hello world"，k = 15（␣ 代表空格）</text>

  <!-- 行1：s 的字符与词内下标 -->
  <text x="44" y="79" font-size="12" fill="#333" filter="url(#rough2)">s =</text>
  <text x="44" y="92" font-size="8.5" fill="#999" filter="url(#rough2)">词内 i</text>

  <rect x="72" y="58" width="34" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="89" y="77" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">h</text>
  <text x="89" y="90" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">0</text>
  <rect x="106" y="58" width="34" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="123" y="77" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">e</text>
  <text x="123" y="90" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">1</text>
  <rect x="140" y="58" width="34" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="157" y="77" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">l</text>
  <text x="157" y="90" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">2</text>
  <rect x="174" y="58" width="34" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="191" y="77" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">l</text>
  <text x="191" y="90" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">3</text>
  <rect x="208" y="58" width="34" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="225" y="77" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">o</text>
  <text x="225" y="90" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">4</text>
  <rect x="242" y="58" width="34" height="36" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="4" filter="url(#rough2)"/>
  <text x="259" y="77" text-anchor="middle" font-size="13" fill="#d6a040" filter="url(#rough2)">␣</text>
  <text x="259" y="90" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">—</text>
  <rect x="276" y="58" width="34" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="293" y="77" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">w</text>
  <text x="293" y="90" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">0</text>
  <rect x="310" y="58" width="34" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="327" y="77" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">o</text>
  <text x="327" y="90" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">1</text>
  <rect x="344" y="58" width="34" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="361" y="77" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">r</text>
  <text x="361" y="90" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">2</text>
  <rect x="378" y="58" width="34" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="395" y="77" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">l</text>
  <text x="395" y="90" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">3</text>
  <rect x="412" y="58" width="34" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="4" filter="url(#rough2)"/>
  <text x="429" y="77" text-anchor="middle" font-size="14" fill="#333" filter="url(#rough2)">d</text>
  <text x="429" y="90" text-anchor="middle" font-size="9.5" fill="#888" filter="url(#rough2)">4</text>

  <!-- 展开规则说明 + k 指针 -->
  <text x="16" y="110" font-size="10" fill="#666" filter="url(#rough2)">展开：词内下标 i ⇒ 连写 i+1 份</text>
  <text x="344" y="110" font-size="10" fill="#666" filter="url(#rough2)">空格 ⇒ 1 份且 i 重置</text>
  <path d="M 259.5 96 L 259.5 115" fill="none" stroke="#b85450" stroke-width="2" marker-end="url(#arrRed)" filter="url(#rough2)"/>
  <text x="268" y="111" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">k = 15</text>

  <!-- 行2：t 的档期条（宽度 ∝ 占位数） -->
  <text x="40" y="140" font-size="12" fill="#333" filter="url(#rough2)">t =</text>

  <rect x="58" y="118" width="13" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="64.5" y="140" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">h</text>
  <rect x="71" y="118" width="26" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="84" y="140" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">ee</text>
  <rect x="97" y="118" width="39" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="116.5" y="140" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">lll</text>
  <rect x="136" y="118" width="52" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="162" y="140" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">llll</text>
  <rect x="188" y="118" width="65" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="220.5" y="140" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">ooooo</text>
  <rect x="253" y="118" width="13" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="2.5" rx="3" filter="url(#rough2)"/>
  <text x="259.5" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#b85450" filter="url(#rough2)">␣</text>
  <rect x="266" y="118" width="13" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="272.5" y="140" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">w</text>
  <rect x="279" y="118" width="26" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="292" y="140" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">oo</text>
  <rect x="305" y="118" width="39" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="324.5" y="140" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">rrr</text>
  <rect x="344" y="118" width="52" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="370" y="140" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">llll</text>
  <rect x="396" y="118" width="65" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.2" rx="3" filter="url(#rough2)"/>
  <text x="428.5" y="140" text-anchor="middle" font-size="10" fill="#333" filter="url(#rough2)">ddddd</text>

  <!-- 档期对应的下标范围 -->
  <text x="64.5" y="168" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">0</text>
  <text x="84" y="168" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">1-2</text>
  <text x="116.5" y="168" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">3-5</text>
  <text x="162" y="168" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">6-9</text>
  <text x="220.5" y="168" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">10-14</text>
  <text x="259.5" y="168" text-anchor="middle" font-size="10" font-weight="bold" fill="#b85450" filter="url(#rough2)">15</text>
  <text x="272.5" y="168" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">16</text>
  <text x="292" y="168" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">17-18</text>
  <text x="324.5" y="168" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">19-21</text>
  <text x="370" y="168" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">22-25</text>
  <text x="428.5" y="168" text-anchor="middle" font-size="9" fill="#666" filter="url(#rough2)">26-30</text>

  <!-- 扣减轨迹 -->
  <rect x="16" y="182" width="488" height="30" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="260" y="201" text-anchor="middle" font-size="11" fill="#333" filter="url(#rough2)">扣减轨迹：k：15→14→12→9→5→0，走到 ␣ 档（cnt = 1）时 k = 0 &lt; 1 ⇒ 命中，返回 " "</text>

  <!-- 说明框 -->
  <rect x="16" y="224" width="488" height="78" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="28" y="246" font-size="10.5" fill="#333" filter="url(#rough2)">① 档内字符全同 ⇒ 命中即得答案，无需档内偏移（O(|t|) 压成 O(|s|) 的根源）</text>
  <text x="28" y="268" font-size="10.5" fill="#333" filter="url(#rough2)">② 空格双职责：只占 1 位 + 重置词内下标（新单词重新从 1 份起算）</text>
  <text x="28" y="290" font-size="10.5" fill="#333" filter="url(#rough2)">③ 单词长 L 占 L(L+1)/2 位 ⇒ |t| 平方量级，k 需 64 位整数</text>

  <text x="16" y="336" font-size="9.5" fill="#999" filter="url(#rough2)">⚠️ 暴力构造 t：L = 10^5 时约 5×10^9 位，内存时间双爆——本题考点就是「不造 t」</text>
  <text x="16" y="350" font-size="9.5" fill="#999" filter="url(#rough2)">💡 一趟只看 |s|：每字符一次 O(1) 判定；本例 |s| = 11 却对应 |t| = 31</text>
</svg>
