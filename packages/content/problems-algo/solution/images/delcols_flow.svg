<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 520" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="540" height="520" fill="#fafafa"/>

  <!-- Title -->
  <text x="270" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">算法流程：逐列扫描，列内相邻比较</text>

  <!-- Start -->
  <ellipse cx="270" cy="58" rx="120" ry="20" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="62" text-anchor="middle" font-size="12" fill="#333">开始: ans = 0, m = len(strs[0])</text>

  <path d="M 270 78 L 270 98" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Init j -->
  <rect x="210" y="100" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="122" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">j = 0</text>

  <path d="M 270 134 L 270 154" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 1: j < m? -->
  <polygon points="270,158 386,196 270,234 154,196" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="192" text-anchor="middle" font-size="12" fill="#333">j &lt; m ?</text>
  <text x="270" y="208" text-anchor="middle" font-size="10" fill="#666">(还有列未处理)</text>

  <!-- No -> end -->
  <path d="M 386 196 L 430 196" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="408" y="188" text-anchor="middle" font-size="11" fill="#b85450">否</text>
  <ellipse cx="472" cy="196" rx="48" ry="20" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="472" y="200" text-anchor="middle" font-size="12" fill="#333">返回 ans</text>

  <!-- Yes -> down -->
  <path d="M 270 234 L 270 254" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="250" font-size="11" fill="#82b366">是</text>

  <!-- Init i -->
  <rect x="210" y="256" width="120" height="34" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="270" y="278" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">i = 0</text>

  <path d="M 270 290 L 270 310" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision 2: i+1 < n? -->
  <polygon points="270,314 392,352 270,390 148,352" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="270" y="348" text-anchor="middle" font-size="12" fill="#333">i + 1 &lt; n ?</text>
  <text x="270" y="364" text-anchor="middle" font-size="10" fill="#666">(还有相邻行)</text>

  <!-- No (column sorted) -> j++ -->
  <path d="M 148 352 L 110 352 L 110 122 L 210 122" stroke="#4a7a3a" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="112" y="238" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" transform="rotate(-90 112 238)">列非降，j++</text>

  <!-- Yes -> down -->
  <path d="M 270 390 L 270 410" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="282" y="406" font-size="11" fill="#82b366">是</text>

  <!-- Decision 3: strs[i][j] > strs[i+1][j]? -->
  <polygon points="270,414 410,452 270,490 130,452" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="270" y="448" text-anchor="middle" font-size="11" fill="#333">strs[i][j] &gt; strs[i+1][j] ?</text>
  <text x="270" y="464" text-anchor="middle" font-size="10" fill="#666">(列内违反非降)</text>

  <!-- Yes (violate) -> ans++, break -> j++ -->
  <path d="M 410 452 L 460 452 L 460 122 L 330 122" stroke="#b85450" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="462" y="290" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" transform="rotate(-90 462 290)">ans++, break, j++</text>

  <!-- No -> i++ -->
  <path d="M 130 452 L 80 452 L 80 273 L 210 273" stroke="#666" stroke-width="1.5" fill="none" stroke-dasharray="5,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="82" y="362" text-anchor="middle" font-size="10" fill="#888" font-weight="bold" transform="rotate(-90 82 362)">未违反，i++</text>

  <!-- summary note -->
  <text x="270" y="510" text-anchor="middle" font-size="11" fill="#888">每列最坏 n−1 次比较，共 m 列 → O(n·m)；原地 → O(1) 空间</text>
</svg>
