<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="640" height="320" fill="#fafafa"/>

  <!-- Title -->
  <text x="320" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：宽表 UNPIVOT → 长表（一行 = 一枚奖牌）</text>

  <!-- ===== Left: wide Contests table ===== -->
  <text x="120" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Contests（宽表，一行三奖）</text>
  <!-- header row -->
  <rect x="30" y="60" width="45" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="75" y="60" width="45" height="24" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="120" y="60" width="45" height="24" fill="#eceff1" stroke="#607d8b" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="165" y="60" width="45" height="24" fill="#f5e6d3" stroke="#b8763a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="52" y="76" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">contest</text>
  <text x="97" y="76" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">gold</text>
  <text x="142" y="76" text-anchor="middle" font-size="9" fill="#607d8b" font-weight="bold">silver</text>
  <text x="187" y="76" text-anchor="middle" font-size="9" fill="#b8763a" font-weight="bold">bronze</text>

  <!-- row 190 -->
  <rect x="30" y="84" width="45" height="22" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="75" y="84" width="45" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <rect x="120" y="84" width="45" height="22" fill="#eceff1" stroke="#607d8b" stroke-width="1" filter="url(#rough2)"/>
  <rect x="165" y="84" width="45" height="22" fill="#f5e6d3" stroke="#b8763a" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="99" text-anchor="middle" font-size="10" fill="#333">190</text>
  <text x="97" y="99" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">1</text>
  <text x="142" y="99" text-anchor="middle" font-size="10" fill="#607d8b" font-weight="bold">5</text>
  <text x="187" y="99" text-anchor="middle" font-size="10" fill="#b8763a" font-weight="bold">2</text>

  <!-- row 191 -->
  <rect x="30" y="106" width="45" height="22" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="75" y="106" width="45" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <rect x="120" y="106" width="45" height="22" fill="#eceff1" stroke="#607d8b" stroke-width="1" filter="url(#rough2)"/>
  <rect x="165" y="106" width="45" height="22" fill="#f5e6d3" stroke="#b8763a" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="121" text-anchor="middle" font-size="10" fill="#333">191</text>
  <text x="97" y="121" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">2</text>
  <text x="142" y="121" text-anchor="middle" font-size="10" fill="#607d8b" font-weight="bold">3</text>
  <text x="187" y="121" text-anchor="middle" font-size="10" fill="#b8763a" font-weight="bold">5</text>

  <!-- row 192 -->
  <rect x="30" y="128" width="45" height="22" fill="#fff" stroke="#446688" stroke-width="1" filter="url(#rough2)"/>
  <rect x="75" y="128" width="45" height="22" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <rect x="120" y="128" width="45" height="22" fill="#eceff1" stroke="#607d8b" stroke-width="1" filter="url(#rough2)"/>
  <rect x="165" y="128" width="45" height="22" fill="#f5e6d3" stroke="#b8763a" stroke-width="1" filter="url(#rough2)"/>
  <text x="52" y="143" text-anchor="middle" font-size="10" fill="#333">192</text>
  <text x="97" y="143" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">5</text>
  <text x="142" y="143" text-anchor="middle" font-size="10" fill="#607d8b" font-weight="bold">2</text>
  <text x="187" y="143" text-anchor="middle" font-size="10" fill="#b8763a" font-weight="bold">3</text>

  <!-- ===== Middle arrow + UNION ALL ===== -->
  <path d="M 215 116 L 360 116" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="248" y="96" width="84" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="290" y="110" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">UNION ALL</text>

  <!-- ===== Right: long Medals table ===== -->
  <text x="480" y="52" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">Medals（长表，一行一奖）</text>
  <!-- header -->
  <rect x="380" y="60" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="430" y="60" width="50" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <rect x="480" y="60" width="100" height="24" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="405" y="76" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">contest</text>
  <text x="455" y="76" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">user_id</text>
  <text x="530" y="76" text-anchor="middle" font-size="9" fill="#446688" font-weight="bold">medal</text>

  <!-- 9 rows: contest,user,medal ; row height 20, start y=84 -->
  <!-- row 0: 190,1,gold -->
  <rect x="380" y="84" width="50" height="20" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="430" y="84" width="50" height="20" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="480" y="84" width="100" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="405" y="98" text-anchor="middle" font-size="9" fill="#333">190</text>
  <text x="455" y="98" text-anchor="middle" font-size="9" fill="#333">1</text>
  <text x="530" y="98" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">gold</text>

  <!-- row 1: 190,5,silver -->
  <rect x="380" y="104" width="50" height="20" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="430" y="104" width="50" height="20" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="480" y="104" width="100" height="20" fill="#eceff1" stroke="#607d8b" stroke-width="1" filter="url(#rough2)"/>
  <text x="405" y="118" text-anchor="middle" font-size="9" fill="#333">190</text>
  <text x="455" y="118" text-anchor="middle" font-size="9" fill="#333">5</text>
  <text x="530" y="118" text-anchor="middle" font-size="9" fill="#607d8b" font-weight="bold">silver</text>

  <!-- row 2: 190,2,bronze -->
  <rect x="380" y="124" width="50" height="20" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="430" y="124" width="50" height="20" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="480" y="124" width="100" height="20" fill="#f5e6d3" stroke="#b8763a" stroke-width="1" filter="url(#rough2)"/>
  <text x="405" y="138" text-anchor="middle" font-size="9" fill="#333">190</text>
  <text x="455" y="138" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="530" y="138" text-anchor="middle" font-size="9" fill="#b8763a" font-weight="bold">bronze</text>

  <!-- row 3: 191,2,gold -->
  <rect x="380" y="144" width="50" height="20" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="430" y="144" width="50" height="20" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="480" y="144" width="100" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="405" y="158" text-anchor="middle" font-size="9" fill="#333">191</text>
  <text x="455" y="158" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="530" y="158" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">gold</text>

  <!-- row 4: 191,3,silver -->
  <rect x="380" y="164" width="50" height="20" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="430" y="164" width="50" height="20" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="480" y="164" width="100" height="20" fill="#eceff1" stroke="#607d8b" stroke-width="1" filter="url(#rough2)"/>
  <text x="405" y="178" text-anchor="middle" font-size="9" fill="#333">191</text>
  <text x="455" y="178" text-anchor="middle" font-size="9" fill="#333">3</text>
  <text x="530" y="178" text-anchor="middle" font-size="9" fill="#607d8b" font-weight="bold">silver</text>

  <!-- row 5: 191,5,bronze -->
  <rect x="380" y="184" width="50" height="20" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="430" y="184" width="50" height="20" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="480" y="184" width="100" height="20" fill="#f5e6d3" stroke="#b8763a" stroke-width="1" filter="url(#rough2)"/>
  <text x="405" y="198" text-anchor="middle" font-size="9" fill="#333">191</text>
  <text x="455" y="198" text-anchor="middle" font-size="9" fill="#333">5</text>
  <text x="530" y="198" text-anchor="middle" font-size="9" fill="#b8763a" font-weight="bold">bronze</text>

  <!-- row 6: 192,5,gold -->
  <rect x="380" y="204" width="50" height="20" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="430" y="204" width="50" height="20" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="480" y="204" width="100" height="20" fill="#fff8e1" stroke="#d6a040" stroke-width="1" filter="url(#rough2)"/>
  <text x="405" y="218" text-anchor="middle" font-size="9" fill="#333">192</text>
  <text x="455" y="218" text-anchor="middle" font-size="9" fill="#333">5</text>
  <text x="530" y="218" text-anchor="middle" font-size="9" fill="#d6a040" font-weight="bold">gold</text>

  <!-- row 7: 192,2,silver -->
  <rect x="380" y="224" width="50" height="20" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="430" y="224" width="50" height="20" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="480" y="224" width="100" height="20" fill="#eceff1" stroke="#607d8b" stroke-width="1" filter="url(#rough2)"/>
  <text x="405" y="238" text-anchor="middle" font-size="9" fill="#333">192</text>
  <text x="455" y="238" text-anchor="middle" font-size="9" fill="#333">2</text>
  <text x="530" y="238" text-anchor="middle" font-size="9" fill="#607d8b" font-weight="bold">silver</text>

  <!-- row 8: 192,3,bronze -->
  <rect x="380" y="244" width="50" height="20" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="430" y="244" width="50" height="20" fill="#fff" stroke="#bbb" stroke-width="1" filter="url(#rough2)"/>
  <rect x="480" y="244" width="100" height="20" fill="#f5e6d3" stroke="#b8763a" stroke-width="1" filter="url(#rough2)"/>
  <text x="405" y="258" text-anchor="middle" font-size="9" fill="#333">192</text>
  <text x="455" y="258" text-anchor="middle" font-size="9" fill="#333">3</text>
  <text x="530" y="258" text-anchor="middle" font-size="9" fill="#b8763a" font-weight="bold">bronze</text>

  <!-- ===== Bottom note ===== -->
  <rect x="60" y="282" width="520" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="320" y="301" text-anchor="middle" font-size="10" fill="#d6a040" font-weight="bold">长表把「谁在哪场拿了什么奖」摊平，便于按 user_id 分组、按 contest_id 排序查连续</text>
</svg>
