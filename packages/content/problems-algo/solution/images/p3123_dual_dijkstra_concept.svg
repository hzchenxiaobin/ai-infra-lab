<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="520" height="380" fill="#fafafa"/>

  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">核心观察：三段拼接和恰为 D ⇔ 这条边在某条最短路上</text>

  <!-- main band: 0 ... a == e == b ... n-1 -->
  <circle cx="55" cy="95" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="55" y="100" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">0</text>

  <circle cx="175" cy="95" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="175" y="100" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">a</text>

  <circle cx="345" cy="95" r="16" fill="#e8f0fe" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>
  <text x="345" y="100" text-anchor="middle" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">b</text>

  <circle cx="462" cy="95" r="17" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="462" y="100" text-anchor="middle" font-size="10.5" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">n−1</text>

  <!-- segment 0 -> a -->
  <path d="M 71 95 Q 122 82 159 92" stroke="#4a7a3a" stroke-width="3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="115" y="74" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">d0[a]</text>
  <text x="115" y="126" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">0→a 最短路</text>

  <!-- edge a - b -->
  <path d="M 191 95 L 329 95" stroke="#d6a040" stroke-width="3.5" fill="none" filter="url(#rough2)"/>
  <text x="260" y="86" text-anchor="middle" font-size="13" fill="#8a6a1f" font-weight="bold" filter="url(#rough2)">w</text>
  <text x="260" y="126" text-anchor="middle" font-size="9.5" fill="#8a6a1f" filter="url(#rough2)">待判定的边 e = (a, b, w)</text>

  <!-- segment b -> n-1 -->
  <path d="M 361 93 Q 405 82 445 94" stroke="#4a7a3a" stroke-width="3" fill="none" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="403" y="74" text-anchor="middle" font-size="12" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">d1[b]</text>
  <text x="403" y="126" text-anchor="middle" font-size="9.5" fill="#4a7a3a" filter="url(#rough2)">b→n−1 最短路</text>

  <!-- brace -->
  <path d="M 40 138 L 40 146 L 478 146 L 478 138 M 258 146 L 258 156" stroke="#446688" stroke-width="1.3" fill="none" filter="url(#rough2)"/>
  <text x="260" y="172" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">拼接通道总长 = d0[a] + w + d1[b] ≥ D 恒成立（它是 0 到 n−1 的一条通道）</text>

  <!-- verdict boxes -->
  <rect x="30" y="188" width="460" height="36" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="210" text-anchor="middle" font-size="11" fill="#2f5d24" font-weight="bold" filter="url(#rough2)">== D ⇒ 拼接本身就是一条最短路（正权 ⇒ 无环），e 在其中 → true</text>

  <rect x="30" y="232" width="460" height="36" fill="#fce4ec" stroke="#b85450" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="254" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">两个方向都 &gt; D ⇒ e 与任何最短路无缘 → false</text>

  <rect x="30" y="276" width="460" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="260" y="298" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">无向边两个方向都要试：a→b 用 d0[a]+w+d1[b]，b→a 用 d0[b]+w+d1[a]</text>

  <rect x="30" y="320" width="460" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="260" y="337" text-anchor="middle" font-size="10.5" fill="#8a6a1f" filter="url(#rough2)">不连通：D = d0[n−1] = ∞ ⇒ 没有任何最短路，answer 全为 false</text>

  <rect x="30" y="352" width="460" height="24" fill="#fafafa" stroke="#999" stroke-width="1" rx="8" filter="url(#rough2)"/>
  <text x="260" y="368" text-anchor="middle" font-size="10" fill="#777" filter="url(#rough2)">其中 d0、d1 各是一遍堆优化 Dijkstra：d0 = Dijkstra(0)，d1 = Dijkstra(n−1)</text>
</svg>
