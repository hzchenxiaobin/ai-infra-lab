<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="560" height="360" fill="#fafafa"/>

  <text x="280" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">示例演算：4 ÷ 333 = 0.(012)</text>

  <!-- header row -->
  <rect x="30" y="50" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="58" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">步骤</text>
  <rect x="92" y="50" width="64" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">余数 r</text>
  <rect x="162" y="50" width="56" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">商位</text>
  <rect x="224" y="50" width="76" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="262" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">新余数</text>
  <rect x="306" y="50" width="100" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="356" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">frac（累计）</text>
  <rect x="412" y="50" width="130" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="477" y="68" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">pos 状态</text>

  <!-- row init -->
  <rect x="30" y="80" width="56" height="26" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="58" y="98" text-anchor="middle" font-size="11" fill="#333">初始</text>
  <rect x="92" y="80" width="64" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124" y="98" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="162" y="80" width="56" height="26" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="190" y="98" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <rect x="224" y="80" width="76" height="26" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="262" y="98" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <rect x="306" y="80" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="356" y="98" text-anchor="middle" font-size="11" fill="#333">""</text>
  <rect x="412" y="80" width="130" height="26" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="477" y="98" text-anchor="middle" font-size="11" fill="#aaa">{} 空</text>

  <!-- row 1 -->
  <rect x="30" y="110" width="56" height="26" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="58" y="128" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="92" y="110" width="64" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124" y="128" text-anchor="middle" font-size="11" fill="#333">4</text>
  <rect x="162" y="110" width="56" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="128" text-anchor="middle" font-size="11" fill="#333">0</text>
  <rect x="224" y="110" width="76" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="262" y="128" text-anchor="middle" font-size="11" fill="#333">40</text>
  <rect x="306" y="110" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="356" y="128" text-anchor="middle" font-size="11" fill="#333">"0"</text>
  <rect x="412" y="110" width="130" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="477" y="128" text-anchor="middle" font-size="11" fill="#333">记 4 → 0</text>

  <!-- row 2 -->
  <rect x="30" y="140" width="56" height="26" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="58" y="158" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="92" y="140" width="64" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124" y="158" text-anchor="middle" font-size="11" fill="#333">40</text>
  <rect x="162" y="140" width="56" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="158" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="224" y="140" width="76" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="262" y="158" text-anchor="middle" font-size="11" fill="#333">67</text>
  <rect x="306" y="140" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="356" y="158" text-anchor="middle" font-size="11" fill="#333">"01"</text>
  <rect x="412" y="140" width="130" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="477" y="158" text-anchor="middle" font-size="11" fill="#333">记 40 → 1</text>

  <!-- row 3 -->
  <rect x="30" y="170" width="56" height="26" fill="#fff" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="58" y="188" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="92" y="170" width="64" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="124" y="188" text-anchor="middle" font-size="11" fill="#333">67</text>
  <rect x="162" y="170" width="56" height="26" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="190" y="188" text-anchor="middle" font-size="11" fill="#333">2</text>
  <rect x="224" y="170" width="76" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="262" y="188" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <rect x="306" y="170" width="100" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="356" y="188" text-anchor="middle" font-size="11" fill="#333">"012"</text>
  <rect x="412" y="170" width="130" height="26" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="477" y="188" text-anchor="middle" font-size="11" fill="#333">记 67 → 2</text>

  <!-- row 4: hit -->
  <rect x="30" y="200" width="56" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="58" y="218" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <rect x="92" y="200" width="64" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="124" y="218" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">4</text>
  <rect x="162" y="200" width="56" height="26" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="190" y="218" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <rect x="224" y="200" width="76" height="26" fill="#fff" stroke="#bbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="262" y="218" text-anchor="middle" font-size="11" fill="#aaa">—</text>
  <rect x="306" y="200" width="100" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="356" y="218" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">"(012)"</text>
  <rect x="412" y="200" width="130" height="26" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="477" y="218" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">命中 4 → 0 ⚠</text>

  <!-- annotation -->
  <text x="262" y="248" text-anchor="middle" font-size="10" fill="#b85450">余数 4 重现 → idx 0 起为循环节</text>

  <!-- result -->
  <rect x="60" y="264" width="440" height="44" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="286" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">整数 "0" + "." + "(012)"</text>
  <text x="280" y="302" text-anchor="middle" font-size="12" fill="#4a7a3a">= "0.(012)"  ✓</text>

  <!-- summary -->
  <rect x="60" y="318" width="440" height="30" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" rx="8" filter="url(#rough2)"/>
  <text x="280" y="338" text-anchor="middle" font-size="11" fill="#555">分母 333 仅含质因数 3（非 2、5）→ 必为纯循环小数</text>
</svg>
