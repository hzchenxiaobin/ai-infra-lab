<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr2806a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a040"/>
    </marker>
    <marker id="arr2806b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b85450"/>
    </marker>
    <marker id="arr2806c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a7a3a"/>
    </marker>
  </defs>

  <rect width="560" height="380" fill="#fafafa"/>

  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold">核心观察：向最近的 10 的倍数取整，平手取较大</text>

  <!-- number line -->
  <line x1="40" y1="200" x2="520" y2="200" stroke="#446688" stroke-width="2" filter="url(#rough2)"/>

  <!-- tick marks: 0..100, step 10 -->
  <!-- 0 -->
  <line x1="40" y1="192" x2="40" y2="208" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="40" y="226" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">0</text>
  <!-- 10 -->
  <line x1="92" y1="192" x2="92" y2="208" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="92" y="226" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">10</text>
  <!-- 20 -->
  <line x1="144" y1="192" x2="144" y2="208" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="144" y="226" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">20</text>
  <!-- 30 -->
  <line x1="196" y1="192" x2="196" y2="208" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="196" y="226" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">30</text>
  <!-- 40 -->
  <line x1="248" y1="192" x2="248" y2="208" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="248" y="226" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">40</text>
  <!-- 50 -->
  <line x1="300" y1="192" x2="300" y2="208" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="300" y="226" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">50</text>
  <!-- 60 -->
  <line x1="352" y1="192" x2="352" y2="208" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="352" y="226" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">60</text>
  <!-- 70 -->
  <line x1="404" y1="192" x2="404" y2="208" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="404" y="226" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">70</text>
  <!-- 80 -->
  <line x1="456" y1="192" x2="456" y2="208" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="456" y="226" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">80</text>
  <!-- 90 -->
  <line x1="508" y1="192" x2="508" y2="208" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="508" y="226" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">90</text>

  <!-- example 1: 9 -> 10 (round up to nearest) -->
  <circle cx="66" cy="200" r="4" fill="#d6a040" filter="url(#rough2)"/>
  <text x="66" y="184" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold">9</text>
  <path d="M70,196 L86,202" stroke="#d6a040" stroke-width="1.8" marker-end="url(#arr2806a)" filter="url(#rough2)"/>
  <text x="66" y="160" text-anchor="middle" font-size="10" fill="#d6a040">最近→10</text>

  <!-- example 2: 4 -> 0 (round down to nearest) -->
  <circle cx="53" cy="200" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="53" y="184" text-anchor="middle" font-size="11" fill="#4a7a3a" font-weight="bold">4</text>
  <path d="M49,196 L44,202" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arr2806c)" filter="url(#rough2)"/>
  <text x="53" y="160" text-anchor="middle" font-size="10" fill="#4a7a3a">最近→0</text>

  <!-- example 3: 15 -> tie, choose 20 -->
  <circle cx="118" cy="200" r="4.5" fill="#b85450" filter="url(#rough2)"/>
  <text x="118" y="184" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">15</text>
  <path d="M123,196 L138,202" stroke="#b85450" stroke-width="2" marker-end="url(#arr2806b)" filter="url(#rough2)"/>
  <text x="118" y="158" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">平手→取较大20</text>

  <!-- tie markers on line: 5, 15, 25 -->
  <line x1="66" y1="196" x2="66" y2="204" stroke="#b85450" stroke-width="1.2" stroke-dasharray="2 2" filter="url(#rough2)"/>
  <line x1="118" y1="196" x2="118" y2="204" stroke="#b85450" stroke-width="1.2" stroke-dasharray="2 2" filter="url(#rough2)"/>
  <line x1="170" y1="196" x2="170" y2="204" stroke="#b85450" stroke-width="1.2" stroke-dasharray="2 2" filter="url(#rough2)"/>
  <text x="170" y="184" text-anchor="middle" font-size="9" fill="#b85450">25</text>

  <!-- legend box -->
  <rect x="350" y="40" width="200" height="92" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" rx="8" filter="url(#rough2)"/>
  <text x="450" y="58" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold">取整规则</text>
  <circle cx="365" cy="74" r="4" fill="#d6a040" filter="url(#rough2)"/>
  <text x="375" y="78" font-size="10" fill="#555">非平手：取最近倍数</text>
  <circle cx="365" cy="92" r="4" fill="#4a7a3a" filter="url(#rough2)"/>
  <text x="375" y="96" font-size="10" fill="#555">如 4→0, 14→10</text>
  <circle cx="365" cy="110" r="4" fill="#b85450" filter="url(#rough2)"/>
  <text x="375" y="114" font-size="10" fill="#555">平手(×5)：取较大倍数</text>

  <!-- bottom note -->
  <rect x="60" y="262" width="440" height="56" fill="#fff8e1" stroke="#d6a040" stroke-width="1.6" rx="8" filter="url(#rough2)"/>
  <text x="280" y="282" text-anchor="middle" font-size="12" fill="#d6a040" font-weight="bold">roundedAmount = 离 purchaseAmount 最近的 10 的倍数</text>
  <text x="280" y="302" text-anchor="middle" font-size="11" fill="#d6a040">余额 = 100 − roundedAmount</text>

  <!-- small note about 0 -->
  <text x="40" y="350" text-anchor="middle" font-size="9" fill="#aaa">0 也是 10 的倍数</text>
</svg>
