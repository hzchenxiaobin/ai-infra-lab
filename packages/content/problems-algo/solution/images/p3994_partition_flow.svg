<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#446688"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b85450"/>
    </marker>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#444" font-weight="bold" filter="url(#rough2)">算法流程：一趟扫描，O(n) 时间 / O(1) 空间</text>

  <rect x="215" y="34" width="90" height="24" rx="12" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="50" text-anchor="middle" font-size="11" fill="#3a5c2e" font-weight="bold" filter="url(#rough2)">开始</text>

  <path d="M 260 58 L 260 70" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="185" y="74" width="150" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="91" text-anchor="middle" font-size="10.5" fill="#33507a" filter="url(#rough2)">取下一个元素 x</text>

  <path d="M 260 100 L 260 110" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="130" y="114" width="260" height="34" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="128" text-anchor="middle" font-size="10" fill="#33507a" font-weight="bold" filter="url(#rough2)">定组号 v</text>
  <text x="260" y="142" text-anchor="middle" font-size="9" fill="#557" filter="url(#rough2)">x &lt; a → 0；a ≤ x ≤ b → 1；x &gt; b → 2</text>

  <path d="M 260 148 L 260 158" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="260,160 304,182 260,204 216,182" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="187" text-anchor="middle" font-size="11" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">v = ?</text>

  <path d="M 216 182 L 95 182 L 95 224" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="150" y="175" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">v = 0</text>

  <path d="M 260 204 L 260 224" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="272" y="218" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">v = 1</text>

  <path d="M 304 182 L 425 182 L 425 224" fill="none" stroke="#446688" stroke-width="1.6" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="372" y="175" text-anchor="middle" font-size="9.5" fill="#446688" font-weight="bold" filter="url(#rough2)">v = 2</text>

  <rect x="20" y="228" width="150" height="28" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="95" y="246" text-anchor="middle" font-size="9.5" fill="#33507a" filter="url(#rough2)">ans += cnt[1] + cnt[2]</text>

  <rect x="185" y="228" width="150" height="28" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="246" text-anchor="middle" font-size="9.5" fill="#3a5c2e" filter="url(#rough2)">ans += cnt[2]</text>

  <rect x="350" y="228" width="150" height="28" rx="4" fill="#fff8e1" stroke="#d6a040" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="425" y="246" text-anchor="middle" font-size="9.5" fill="#8a6d1f" filter="url(#rough2)">贡献 0，跳过累加</text>

  <path d="M 95 256 L 95 266" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 425 256 L 425 266" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 95 266 L 425 266" fill="none" stroke="#446688" stroke-width="1.6" filter="url(#rough2)"/>
  <path d="M 260 256 L 260 271" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <rect x="200" y="274" width="120" height="24" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="290" text-anchor="middle" font-size="10.5" fill="#33507a" filter="url(#rough2)">cnt[v] += 1</text>

  <path d="M 260 298 L 260 306" fill="none" stroke="#446688" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>

  <polygon points="260,308 300,324 260,340 220,324" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="328" text-anchor="middle" font-size="10.5" fill="#8a6d1f" font-weight="bold" filter="url(#rough2)">扫完?</text>

  <path d="M 300 324 L 334 324" fill="none" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrB)" filter="url(#rough2)"/>
  <text x="310" y="316" text-anchor="middle" font-size="9.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">已完</text>

  <rect x="338" y="310" width="164" height="28" rx="8" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="420" y="328" text-anchor="middle" font-size="10.5" fill="#3a5c2e" font-weight="bold" filter="url(#rough2)">返回 ans mod 1e9+7</text>

  <path d="M 220 324 L 14 324 L 14 87 L 181 87" fill="none" stroke="#b85450" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="100" y="316" text-anchor="middle" font-size="9.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">未完</text>
</svg>
