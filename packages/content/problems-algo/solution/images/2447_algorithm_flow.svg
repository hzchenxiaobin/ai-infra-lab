<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 540"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#666"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#4a7a3a"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#b85450"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L6,4 L0,8 Z" fill="#446688"/>
    </marker>
  </defs>

  <rect width="540" height="540" fill="#fafafa"/>

  <text x="270" y="24" text-anchor="middle" font-size="13.5" fill="#444" font-weight="bold">算法流程：双重循环 + 前缀 gcd + k∤g 早退 + g==k 计数</text>

  <!-- ① Input -->
  <rect x="190" y="42" width="160" height="36" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="65" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">① 输入 nums[], k；ans = 0</text>
  <line x1="270" y1="78" x2="270" y2="98" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ② outer for i -->
  <rect x="150" y="102" width="240" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="126" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">② for i = 0 … n−1：g = 0</text>
  <line x1="270" y1="140" x2="270" y2="160" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ③ inner for j -->
  <rect x="150" y="164" width="240" height="38" fill="#e8f0fe" stroke="#446688" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="188" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">③ for j = i … n−1</text>
  <line x1="270" y1="202" x2="270" y2="222" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ④ g = gcd(g, nums[j]) -->
  <rect x="120" y="226" width="300" height="38" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="270" y="250" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">④ g = gcd(g, nums[j])</text>
  <line x1="270" y1="264" x2="270" y2="284" stroke="#666" stroke-width="1.8" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- ◇ Diamond 1: g % k == 0 ? -->
  <polygon points="270,288 372,332 270,376 168,332" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="328" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">g % k == 0 ?</text>
  <text x="270" y="344" text-anchor="middle" font-size="9.5" fill="#888">（k 是否整除 g）</text>

  <!-- No branch (right) -> break -->
  <line x1="372" y1="332" x2="430" y2="332" stroke="#b85450" stroke-width="1.8" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="400" y="326" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold">否</text>
  <rect x="418" y="316" width="100" height="34" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="468" y="338" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold">break 内层</text>

  <!-- Yes branch (down) -->
  <line x1="270" y1="376" x2="270" y2="396" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="284" y="390" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>

  <!-- ◇ Diamond 2: g == k ? -->
  <polygon points="270,400 372,440 270,480 168,440" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" filter="url(#rough2)"/>
  <text x="270" y="436" text-anchor="middle" font-size="12" fill="#333" font-weight="bold">g == k ?</text>
  <text x="270" y="452" text-anchor="middle" font-size="9.5" fill="#888">（命中目标）</text>

  <!-- Yes (left): ans++ -->
  <line x1="168" y1="440" x2="110" y2="440" stroke="#4a7a3a" stroke-width="1.8" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="138" y="434" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold">是</text>
  <rect x="20" y="424" width="92" height="34" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="2" rx="8" filter="url(#rough2)"/>
  <text x="66" y="446" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold">ans += 1</text>

  <!-- No (right of diamond2): continue (j++) -->
  <line x1="372" y1="440" x2="430" y2="440" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="400" y="434" text-anchor="middle" font-size="10" fill="#888" font-weight="bold">否</text>

  <!-- j++ box -->
  <rect x="418" y="424" width="100" height="34" fill="#f4f7fb" stroke="#888" stroke-width="1.5" rx="6" filter="url(#rough2)"/>
  <text x="468" y="446" text-anchor="middle" font-size="11.5" fill="#666" font-weight="bold">j++（回 ③）</text>

  <!-- ans++ -> loop back up to ③ (left side up) -->
  <path d="M 66 424 L 66 184 L 148 184" fill="none" stroke="#4a7a3a" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrG)" filter="url(#rough2)"/>
  <text x="40" y="300" text-anchor="middle" font-size="9.5" fill="#4a7a3a">回 ③</text>

  <!-- break -> loop back up to ② (right side up) -->
  <path d="M 468 316 L 468 122 L 392 122" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrR)" filter="url(#rough2)"/>
  <text x="496" y="220" text-anchor="middle" font-size="9.5" fill="#b85450">回 ②</text>

  <!-- j++ already points to ③ (self-loop label above) -->

  <!-- footer -->
  <rect x="30" y="502" width="480" height="28" fill="#e8f0fe" stroke="#446688" stroke-width="1.2" rx="6" filter="url(#rough2)"/>
  <text x="270" y="520" text-anchor="middle" font-size="9.5" fill="#333" font-weight="bold">早退条件 g % k != 0 是关键：把最坏 O(n²) 在 k 稀疏时压到接近 O(n)</text>
</svg>
