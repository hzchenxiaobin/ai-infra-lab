<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="360" fill="#fafafa"/>

  <text x="260" y="22" text-anchor="middle" font-size="13" fill="#555" font-weight="bold">每个 i 对应子数组 nums[start..i]，start = max(0, i − nums[i])</text>

  <text x="95" y="56" text-anchor="end" font-size="11" fill="#888">nums:</text>
  <rect x="110" y="38" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="135" y="56" text-anchor="middle" font-size="11" fill="#333">3</text>
  <rect x="160" y="38" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="185" y="56" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="210" y="38" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="235" y="56" text-anchor="middle" font-size="11" fill="#333">1</text>
  <rect x="260" y="38" width="50" height="26" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" rx="4" filter="url(#rough2)"/>
  <text x="285" y="56" text-anchor="middle" font-size="11" fill="#333">2</text>

  <text x="95" y="84" text-anchor="end" font-size="9" fill="#999">i:</text>
  <text x="135" y="84" text-anchor="middle" font-size="9" fill="#999">0</text>
  <text x="185" y="84" text-anchor="middle" font-size="9" fill="#999">1</text>
  <text x="235" y="84" text-anchor="middle" font-size="9" fill="#999">2</text>
  <text x="285" y="84" text-anchor="middle" font-size="9" fill="#999">3</text>

  <text x="58" y="110" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">i = 0</text>
  <rect x="110" y="92" width="50" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="135" y="110" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="160" y="92" width="50" height="28" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="185" y="110" text-anchor="middle" font-size="11" fill="#999">1</text>
  <rect x="210" y="92" width="50" height="28" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="235" y="110" text-anchor="middle" font-size="11" fill="#999">1</text>
  <rect x="260" y="92" width="50" height="28" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="285" y="110" text-anchor="middle" font-size="11" fill="#999">2</text>
  <text x="320" y="110" font-size="9" fill="#b85450">max(0, 0−3) = 0，和 = 3</text>

  <text x="58" y="148" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">i = 1</text>
  <rect x="110" y="130" width="50" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="135" y="148" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">3</text>
  <rect x="160" y="130" width="50" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="185" y="148" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="210" y="130" width="50" height="28" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="235" y="148" text-anchor="middle" font-size="11" fill="#999">1</text>
  <rect x="260" y="130" width="50" height="28" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="285" y="148" text-anchor="middle" font-size="11" fill="#999">2</text>
  <text x="320" y="148" font-size="9" fill="#888">max(0, 1−1) = 0，和 = 4</text>

  <text x="58" y="186" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">i = 2</text>
  <rect x="110" y="168" width="50" height="28" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="135" y="186" text-anchor="middle" font-size="11" fill="#999">3</text>
  <rect x="160" y="168" width="50" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="185" y="186" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="210" y="168" width="50" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="235" y="186" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="260" y="168" width="50" height="28" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="285" y="186" text-anchor="middle" font-size="11" fill="#999">2</text>
  <text x="320" y="186" font-size="9" fill="#888">max(0, 2−1) = 1，和 = 2</text>

  <text x="58" y="224" text-anchor="middle" font-size="11" fill="#444" font-weight="bold">i = 3</text>
  <rect x="110" y="206" width="50" height="28" fill="#f5f5f5" stroke="#bbbbbb" stroke-width="1" rx="4" filter="url(#rough2)"/>
  <text x="135" y="224" text-anchor="middle" font-size="11" fill="#999">3</text>
  <rect x="160" y="206" width="50" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="185" y="224" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="210" y="206" width="50" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="235" y="224" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">1</text>
  <rect x="260" y="206" width="50" height="28" fill="#fff8e1" stroke="#d6a040" stroke-width="2" rx="4" filter="url(#rough2)"/>
  <text x="285" y="224" text-anchor="middle" font-size="11" fill="#333" font-weight="bold">2</text>
  <text x="320" y="224" font-size="9" fill="#888">max(0, 3−2) = 1，和 = 4</text>

  <rect x="40" y="250" width="440" height="58" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" rx="10" filter="url(#rough2)"/>
  <text x="260" y="274" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">ans = 3 + 4 + 2 + 4 = 13 ⭐</text>
  <text x="260" y="296" text-anchor="middle" font-size="11" fill="#555">每个子数组和 = prefix[i+1] − prefix[start]，一趟前缀和全部 O(1)</text>
</svg>
