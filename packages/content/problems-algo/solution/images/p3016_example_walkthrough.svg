<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>
  <text x="260" y="24" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">示例演算：word = aabbccddeeffgghhiiiiii → 答案 24</text>

  <!-- step 1: freq count -->
  <text x="48" y="52" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">① 数频率</text>
  <rect x="108" y="38" width="52" height="26" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="134" y="56" text-anchor="middle" font-size="11.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">i ×6</text>
  <rect x="168" y="38" width="38" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="187" y="56" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">a×2</text>
  <rect x="212" y="38" width="38" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="231" y="56" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">b×2</text>
  <rect x="256" y="38" width="38" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="275" y="56" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">c×2</text>
  <rect x="300" y="38" width="38" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="319" y="56" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">d×2</text>
  <rect x="344" y="38" width="38" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="363" y="56" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">e×2</text>
  <rect x="388" y="38" width="38" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="407" y="56" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">f×2</text>
  <rect x="432" y="38" width="38" height="26" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="451" y="56" text-anchor="middle" font-size="11" fill="#446688" filter="url(#rough2)">g×2</text>
  <text x="486" y="56" font-size="11" fill="#888" filter="url(#rough2)">…h×2</text>
  <text x="48" y="80" font-size="10.5" fill="#888" filter="url(#rough2)">共 9 种字母出现（其余 17 种频率为 0，不用管）</text>

  <!-- step 2: sort desc -->
  <text x="48" y="108" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">② 降序排序</text>
  <rect x="130" y="92" width="40" height="30" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="2" filter="url(#rough2)"/>
  <text x="150" y="112" text-anchor="middle" font-size="13" fill="#b85450" font-weight="bold" filter="url(#rough2)">6</text>
  <rect x="176" y="92" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="196" y="112" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="222" y="92" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="242" y="112" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="268" y="92" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="288" y="112" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="314" y="92" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="334" y="112" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="360" y="92" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="380" y="112" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="406" y="92" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="426" y="112" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">2</text>
  <rect x="452" y="92" width="40" height="30" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.4" filter="url(#rough2)"/>
  <text x="472" y="112" text-anchor="middle" font-size="13" fill="#446688" filter="url(#rough2)">2</text>
  <text x="48" y="140" font-size="10.5" fill="#888" filter="url(#rough2)">频率最高的 i 站排头；同频的 a~h 内部顺序无所谓（同层代价相同）</text>

  <!-- step 3: layering table -->
  <text x="48" y="168" font-size="12.5" fill="#446688" font-weight="bold" filter="url(#rough2)">③ 每 8 个一层，层号 × 频率求和</text>

  <rect x="48" y="178" width="424" height="40" rx="6" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="72" y="203" font-size="12" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">层1 · 按1次</text>
  <text x="248" y="203" text-anchor="middle" font-size="12" fill="#4a7a3a" filter="url(#rough2)">i, a, b, c, d, e, f, g</text>
  <text x="456" y="203" text-anchor="end" font-size="12" fill="#4a7a3a" filter="url(#rough2)">6×1 + 2×7 = 20</text>

  <rect x="48" y="226" width="424" height="40" rx="6" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="72" y="251" font-size="12" fill="#446688" font-weight="bold" filter="url(#rough2)">层2 · 按2次</text>
  <text x="248" y="251" text-anchor="middle" font-size="12" fill="#446688" filter="url(#rough2)">h（第 9 个，落到某键第 2 位）</text>
  <text x="456" y="251" text-anchor="end" font-size="12" fill="#446688" filter="url(#rough2)">2×2 = 4</text>

  <rect x="48" y="274" width="424" height="40" rx="6" fill="#fff8e1" stroke="#d6a040" stroke-width="2" filter="url(#rough2)"/>
  <text x="72" y="299" font-size="12.5" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">合计</text>
  <text x="248" y="299" text-anchor="middle" font-size="12.5" fill="#8a6d3b" filter="url(#rough2)">前 8 个高频字母占满 8 个键的第 1 位</text>
  <text x="456" y="299" text-anchor="end" font-size="13" fill="#8a6d3b" font-weight="bold" filter="url(#rough2)">20 + 4 = 24 ✓</text>

  <!-- bottom note -->
  <rect x="48" y="330" width="424" height="56" fill="#ffffff" stroke="#999" stroke-width="1.4" rx="8" stroke-dasharray="6 4" filter="url(#rough2)"/>
  <text x="260" y="352" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">与官方示例方案一致：i 挂键 9 第 1 位（按 1 次）、h 挂键 9 第 2 位（按 2 次），</text>
  <text x="260" y="372" text-anchor="middle" font-size="11" fill="#555" filter="url(#rough2)">1×6 + 1×7×2 + 2×2 = 6 + 14 + 4 = 24，不存在更便宜的映射。</text>
</svg>
