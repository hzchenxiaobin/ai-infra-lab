<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400"
     font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="520" height="400" fill="#fafafa"/>

  <text x="20" y="28" font-size="13" fill="#333" filter="url(#rough2)">排序 + 一趟贪心 O(n log n)</text>

  <!-- start -->
  <rect x="210" y="16" width="100" height="28" rx="14" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="35" text-anchor="middle" font-size="13" fill="#2d4d22" filter="url(#rough2)">开始</text>
  <path d="M260,44 L260,58" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- init -->
  <rect x="170" y="60" width="180" height="32" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="81" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">排序 nums；cur = −∞；ans = 0</text>
  <path d="M260,92 L260,106" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- process -->
  <rect x="158" y="108" width="204" height="44" rx="4" fill="#e8f0fe" stroke="#446688" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="260" y="126" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">取下一个元素 x</text>
  <text x="260" y="144" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">v = max(x−k, cur+1)</text>
  <path d="M260,152 L260,166" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- diamond: v <= x+k ? -->
  <polygon points="260,168 348,204 260,240 172,204" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="209" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">v ≤ x+k ?</text>

  <!-- yes: ans++, cur=v -->
  <text x="354" y="196" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M348,204 L386,204" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="388" y="186" width="112" height="36" rx="4" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="444" y="209" text-anchor="middle" font-size="12" fill="#2d4d22" filter="url(#rough2)">ans++；cur = v</text>
  <path d="M444,222 L444,258 L260,258" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- no: skip -->
  <text x="132" y="196" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M172,204 L146,204" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="30" y="186" width="114" height="36" rx="4" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="87" y="209" text-anchor="middle" font-size="12" fill="#8c3a34" filter="url(#rough2)">跳过（cur 不变）</text>
  <path d="M87,222 L87,258 L260,258" stroke="#666" stroke-width="1.5" fill="none" filter="url(#rough2)"/>

  <!-- merge down to loop check -->
  <path d="M260,240 L260,318" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- loop diamond -->
  <polygon points="260,318 330,350 260,382 190,350" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="260" y="355" text-anchor="middle" font-size="12" fill="#333" filter="url(#rough2)">还有元素 ?</text>

  <!-- yes: loop back -->
  <text x="150" y="342" font-size="12" fill="#4a7a3a" filter="url(#rough2)">是</text>
  <path d="M190,350 L12,350 L12,130 L156,130" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- no: return -->
  <text x="338" y="342" font-size="12" fill="#b85450" filter="url(#rough2)">否</text>
  <path d="M330,350 L364,350" stroke="#666" stroke-width="1.5" marker-end="url(#arr)" filter="url(#rough2)"/>
  <rect x="366" y="333" width="118" height="34" rx="16" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.5" filter="url(#rough2)"/>
  <text x="425" y="355" text-anchor="middle" font-size="13" fill="#2d4d22" filter="url(#rough2)">返回 ans</text>
</svg>
