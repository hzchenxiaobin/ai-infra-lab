<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" font-family="'Comic Sans MS', 'Segoe UI', 'Kaiti SC', 楷体, cursive">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="1.5"/>
    </filter>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0 L 9 4.5 L 0 9 z" fill="#666"/>
    </marker>
  </defs>

  <rect width="560" height="410" fill="#fafafa"/>

  <!-- Title -->
  <text x="280" y="26" text-anchor="middle" font-size="14" fill="#555" font-weight="bold" filter="url(#rough2)">算法流程：排序 + 两上界取最小</text>

  <!-- Start: sort -->
  <rect x="190" y="44" width="180" height="44" fill="#e8f0fe" stroke="#446688" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="280" y="62" text-anchor="middle" font-size="11" fill="#446688" font-weight="bold" filter="url(#rough2)">排序</text>
  <text x="280" y="78" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">a ≤ b ≤ c</text>

  <path d="M 280 90 L 280 108" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- Decision: a+b <= c ? -->
  <polygon points="280,112 384,158 280,204 176,158" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" filter="url(#rough2)"/>
  <text x="280" y="152" text-anchor="middle" font-size="11.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">a + b ≤ c ?</text>
  <text x="280" y="170" text-anchor="middle" font-size="9.5" fill="#555" filter="url(#rough2)">最大堆是否独大</text>

  <!-- Yes branch: left -->
  <path d="M 176 158 L 116 158" stroke="#b85450" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="146" y="150" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">是</text>
  <rect x="20" y="136" width="96" height="48" fill="#fce4ec" stroke="#b85450" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="68" y="156" text-anchor="middle" font-size="10" fill="#b85450" font-weight="bold" filter="url(#rough2)">返回</text>
  <text x="68" y="172" text-anchor="middle" font-size="11" fill="#b85450" font-weight="bold" filter="url(#rough2)">a + b</text>

  <!-- No branch: right -->
  <path d="M 384 158 L 444 158" stroke="#4a7a3a" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>
  <text x="414" y="150" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">否</text>
  <rect x="444" y="136" width="100" height="48" fill="#e6f4ea" stroke="#4a7a3a" stroke-width="1.8" rx="6" filter="url(#rough2)"/>
  <text x="494" y="156" text-anchor="middle" font-size="10" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">返回</text>
  <text x="494" y="172" text-anchor="middle" font-size="10.5" fill="#4a7a3a" font-weight="bold" filter="url(#rough2)">⌊(a+b+c)/2⌋</text>

  <!-- divider -->
  <path d="M 40 224 L 520 224" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3" filter="url(#rough2)"/>

  <!-- upper bound 1 -->
  <rect x="40" y="240" width="230" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="155" y="262" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">上界 1：每次消 2 个</text>
  <text x="155" y="280" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">总石子 = a + b + c</text>
  <text x="155" y="298" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">每次操作 -2 →</text>
  <text x="155" y="312" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">score ≤ ⌊(a+b+c)/2⌋</text>

  <!-- upper bound 2 -->
  <rect x="290" y="240" width="230" height="76" fill="#fff8e1" stroke="#d6a040" stroke-width="1.8" rx="8" filter="url(#rough2)"/>
  <text x="405" y="262" text-anchor="middle" font-size="11" fill="#d6a040" font-weight="bold" filter="url(#rough2)">上界 2：c 至多配 a+b 次</text>
  <text x="405" y="280" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">a、b 合计 a+b 个</text>
  <text x="405" y="298" text-anchor="middle" font-size="10.5" fill="#555" filter="url(#rough2)">最多配掉 a+b 个 c →</text>
  <text x="405" y="312" text-anchor="middle" font-size="11" fill="#333" font-weight="bold" filter="url(#rough2)">score ≤ a + b</text>

  <!-- combine arrows -->
  <path d="M 155 320 L 155 338 L 280 338" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 405 320 L 405 338 L 280 338" stroke="#666" stroke-width="1.6" fill="none" filter="url(#rough2)"/>
  <path d="M 280 338 L 280 352" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arr)" filter="url(#rough2)"/>

  <!-- combine result -->
  <rect x="120" y="356" width="320" height="40" fill="#fce4ec" stroke="#b85450" stroke-width="2" rx="10" filter="url(#rough2)"/>
  <text x="280" y="381" text-anchor="middle" font-size="12.5" fill="#b85450" font-weight="bold" filter="url(#rough2)">得分 = min(a+b, ⌊(a+b+c)/2⌋)</text>
</svg>
